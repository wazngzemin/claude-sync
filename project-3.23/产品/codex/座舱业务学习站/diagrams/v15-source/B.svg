 x="520" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">决定缺失信息时如何继续</tspan></text><text x="520" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">消费方</tspan></text><text x="520" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">本业务的缺失处理</tspan></text></g></a></g></svg>