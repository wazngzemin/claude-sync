  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">动态示例支线：从维护记录到下一次真实执行</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><text class="anno" x="340" y="103" text-anchor="middle" dominant-baseline="central">已明确的示例维护与运行使用机制；口述自动生成不并入此图</text><polyline class="arr" fill="none" points="350,237 350,303" marker-end="url(#arrow-SE-dynamic-example-detail)"><title>DX1 → DX2：示例已维护，等待新的实际请求</title></polyline><polyline class="arr" fill="none" points="350,395 350,461" marker-end="url(#arrow-SE-dynamic-example-detail)"><title>DX2 → DX3：当前用户 Query</title></polyline><polyline class="arr" fill="none" points="350,566 350,632" marker-end="url(#arrow-SE-dynamic-example-detail)"><title>DX3 → DX4：检索得到的相关示例</title></polyline><polyline class="arr" fill="none" points="350,724 350,790" marker-end="url(#arrow-SE-dynamic-example-detail)"><title>DX4 → DX5：scenario_sample 与本轮 Context</title></polyline><polyline class="arr" fill="none" points="350,892 350,958" marker-end="url(#arrow-SE-dynamic-example-detail)"><title>DX5 → DX6：选择的工具及参数</title></polyline><polyline class="arr" fill="none" points="350,1050 350,1116" marker-end="url(#arrow-SE-dynamic-example-detail)"><title>DX6 → DX7：执行方返回的真实结果</title></polyline><polyline class="arr" fill="none" points="176,1170 90,1170 90,844 170,844" marker-end="url(#arrow-SE-dynamic-example-detail)"><title>DX7 → DX5：依据结果继续当前推理</title></polyline><text class="ts" x="365" y="273" text-anchor="start" dominant-baseline="central">E1 · 示例已维护，等待新的实际请求</text><text class="ts" x="365" y="431" text-anchor="start" dominant-baseline="central">E2 · 当前用户 Query</text><text class="ts" x="365" y="602" text-anchor="start" dominant-baseline="central">E3 · 检索得到的相关示例</text><text class="ts" x="365" y="751" text-anchor="start" dominant-baseline="central">E4 · scenario_sample 与本轮</text><text class="ts" x="365" y="770" text-anchor="start" dominant-baseline="central">Context</text><text class="ts" x="365" y="928" text-anchor="start" dominant-baseline="central">E5 · 选择的工具及参数</text><text class="ts" x="365" y="1086" text-anchor="start" dominant-baseline="central">E6 · 执行方返回的真实结果</text><text class="ts" x="168" y="1162" text-anchor="end" dominant-baseline="central">E7</text><text class="ts" x="168" y="856" text-anchor="end" dominant-baseline="central">E7</text><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="SE-dynamic-example-detail" data-step="DX1" aria-label="维护相应环境的示例"><title>保存用户表达与决策分析，保持真实工具和能力边界。</title><rect x="180" y="142" width="340" height="91" rx="6"/><text class="th" x="198" y="166" text-anchor="start" dominant-baseline="central">维护相应环境的示例</text><text class="ts" x="198" y="194" text-anchor="start" dominant-baseline="central">保存用户表达与决策分析，保持真实工具和能力边</text><text class="ts" x="198" y="213" text-anchor="start" dominant-baseline="central">界。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-dynamic-example-detail" data-step="DX2" aria-label="下一次收到用户请求"><title>当前 Query 进入检索，同时保留本轮身份与车况。</title><rect x="180" y="313" width="340" height="78" rx="6"/><text class="th" x="198" y="337" text-anchor="start" dominant-baseline="central">下一次收到用户请求</text><text class="ts" x="198" y="365" text-anchor="start" dominant-baseline="central">当前 Query 进入检索，同时保留本轮身份与车况。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-dynamic-example-detail" data-step="DX3" aria-label="检索相关示例"><title>返回与当前表达相关的处理参考；未命中不代表用户没说过。</title><rect x="180" y="471" width="340" height="91" rx="6"/><text class="th" x="198" y="495" text-anchor="start" dominant-baseline="central">检索相关示例</text><text class="ts" x="198" y="523" text-anchor="start" dominant-baseline="central">返回与当前表达相关的处理参考；未命中不代表用户</text><text class="ts" x="198" y="542" text-anchor="start" dominant-baseline="central">没说过。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-dynamic-example-detail" data-step="DX4" aria-label="注入 scenario_sample"><title>核对实际请求里出现了哪条示例正文。</title><rect x="180" y="642" width="340" height="78" rx="6"/><text class="th" x="198" y="666" text-anchor="start" dominant-baseline="central">注入 scenario_sample</text><text class="ts" x="198" y="694" text-anchor="start" dominant-baseline="central">核对实际请求里出现了哪条示例正文。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-dynamic-example-detail" data-step="DX5" aria-label="Director 结合本轮事实决策"><title>参考做法，不照抄示例里的地点、对象和返回结果。</title><rect x="180" y="800" width="340" height="88" rx="6"/><text class="th" x="198" y="824" text-anchor="start" dominant-baseline="central">Director 结合本轮事实决策</text><text class="ts" x="198" y="852" text-anchor="start" dominant-baseline="central">参考做法，不照抄示例里的地点、对象和返回结果。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-dynamic-example-detail" data-step="DX6" aria-label="按 action_list 调用真实工具"><title>执行对象、参数和前后依赖由本轮决策确定。</title><rect x="180" y="968" width="340" height="78" rx="6"/><text class="th" x="198" y="992" text-anchor="start" dominant-baseline="central">按 action_list 调用真实工具</text><text class="ts" x="198" y="1020" text-anchor="start" dominant-baseline="central">执行对象、参数和前后依赖由本轮决策确定。</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="SE-dynamic-example-detail" data-step="DX7" aria-label="接回 tool_feedback"><title>根据成功、失败或缺少信息决定回复、补查或下一步。</title><rect x="180" y="1126" width="340" height="91" rx="6"/><text class="th" x="198" y="1150" text-anchor="start" dominant-baseline="central">接回 tool_feedback</text><text class="ts" x="198" y="1178" text-anchor="start" dominant-baseline="central">根据成功、失败或缺少信息决定回复、补查或下一</text><text class="ts" x="198" y="1197" text-anchor="start" dominant-baseline="central">步。</text></g><text class="anno" x="540" y="1150" text-anchor="start" dominant-baseline="central">E7 · 依据结果继</text><text class="anno" x="540" y="1169" text-anchor="start" dominant-baseline="central">续当前推理</text><text class="th" x="40" y="1301" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1331" text-anchor="start" dominant-baseline="central">E1 维护相应环境的示例 → 下一次收到用户请求：示例已维护，等待新的实际请求</text><text class="ts" x="40" y="1364" text-anchor="start" dominant-baseline="central">E2 下一次收到用户请求 → 检索相关示例：当前用户 Query</text><text class="ts" x="40" y="1397" text-anchor="start" dominant-baseline="central">E3 检索相关示例 → 注入 scenario_sample：检索得到的相关示例</text><text class="ts" x="40" y="1430" text-anchor="start" dominant-baseline="central">E4 注入 scenario_sample → Director 结合本轮事实决策：scenario_sample 与本轮 Context</text><text class="ts" x="40" y="1463" text-anchor="start" dominant-baseline="central">E5 Director 结合本轮事实决策 → 按 action_list 调用真实工具：选择的工具及参数</text><text class="ts" x="40" y="1496" text-anchor="start" dominant-baseline="central">E6 按 action_list 调用真实工具 → 接回 tool_feedback：执行方返回的真实结果</text><text class="ts" x="40" y="1529" text-anchor="start" dominant-baseline="central">E7 接回 tool_feedback → Director 结合本轮事实决策：依据结果继续当前推理</text></svg>