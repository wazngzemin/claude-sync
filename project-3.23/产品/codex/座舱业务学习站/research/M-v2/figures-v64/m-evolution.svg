<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-label="从“各管各的”到统一输入管理：几次转折"><title>从“各管各的”到统一输入管理：几次转折</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8" /></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="690" fill="#ffffff" data-background="true" /><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start" id="m-evolution-text-1">从“各管各的”到统一输入管理：几次转折</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start" id="m-evolution-text-2">上面是事件（间距不按比例），中间是阶段，下面是统一之前的各处分工</text><line x1="40" y1="300" x2="1200" y2="300" stroke="#9fb2c2" stroke-width="2" /><circle cx="70" cy="300" r="7" fill="#4f7ea9" /><text x="70" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle" id="m-evolution-text-3">1/13</text><rect x="10" y="100" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="24" y="127" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-evolution-text-4">多人合并</text><text x="24" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-5">发版合入</text><line x1="70" y1="171" x2="70" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4" /><circle cx="202" cy="300" r="7" fill="#4f7ea9" /><text x="202" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle" id="m-evolution-text-6">7/11</text><rect x="142" y="180" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="156" y="207" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-evolution-text-7">需求初稿</text><text x="156" y="232" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-8">7/14 评审</text><line x1="202" y1="251" x2="202" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4" /><circle cx="334" cy="300" r="7" fill="#4f7ea9" /><text x="334" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle" id="m-evolution-text-9">7/20</text><rect x="274" y="100" width="120" height="92" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true" /><text x="288" y="127" font-size="14" fill="#6e2222" font-weight="650" text-anchor="start" id="m-evolution-text-10">排期会</text><text x="288" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-11">人力不够</text><text x="288" y="173" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-12">标高风险</text><line x1="334" y1="192" x2="334" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4" /><circle cx="466" cy="300" r="7" fill="#4f7ea9" /><text x="466" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle" id="m-evolution-text-13">8 月</text><rect x="406" y="180" width="120" height="92" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true" /><text x="420" y="207" font-size="14" fill="#6e2222" font-weight="650" text-anchor="start" id="m-evolution-text-14">先不推进</text><text x="420" y="232" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-15">原定 8/18</text><text x="420" y="253" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-16">后来暂停</text><line x1="466" y1="272" x2="466" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4" /><circle cx="598" cy="300" r="7" fill="#4f7ea9" /><text x="598" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle" id="m-evolution-text-17">9/18</text><rect x="538" y="100" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="552" y="127" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-evolution-text-18">需求重启</text><text x="552" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-19">9/22 有人力</text><line x1="598" y1="171" x2="598" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4" /><circle cx="730" cy="300" r="7" fill="#4f7ea9" /><text x="730" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle" id="m-evolution-text-20">10/13</text><rect x="670" y="180" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="684" y="207" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-evolution-text-21">需求评审</text><text x="684" y="232" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-22">方案完善</text><line x1="730" y1="251" x2="730" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4" /><circle cx="862" cy="300" r="7" fill="#4f7ea9" /><text x="862" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle" id="m-evolution-text-23">10/23</text><rect x="802" y="100" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="816" y="127" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-evolution-text-24">技术评审</text><text x="816" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-25">方案定稿</text><line x1="862" y1="171" x2="862" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4" /><circle cx="1060" cy="300" r="7" fill="#4f7ea9" /><text x="1060" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle" id="m-evolution-text-26">11 月</text><rect x="934" y="180" width="252" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="948" y="207" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-evolution-text-27">实车验证</text><line x1="1060" y1="251" x2="1060" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4" /><path d="M20.0 460.0H170.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="34" y="387" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start" id="m-evolution-text-28">分散处理</text><text x="34" y="412" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-29">多音区缓存</text><text x="34" y="433" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-30">打断恢复各做</text><path d="M180.0 460.0H550.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="194" y="387" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start" id="m-evolution-text-31">写了需求、排不上</text><text x="194" y="412" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-32">工程人力给了任务管理</text><text x="194" y="433" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-33">路测出现补播、串播</text><path d="M568.0 460.0H1220.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="582" y="387" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-evolution-text-34">重启并落成方案</text><text x="582" y="412" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-35">三种状态、两档优先级、工具重放边界</text><text x="582" y="433" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-36">全局唯一的执行身份、车上播放回执</text><path d="M20.0 632.0H1220.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="34" y="517" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start" id="m-evolution-text-37">统一之前，各处各管各</text><text x="34" y="542" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-38">打断链路：第二句来时，第一句还没出首个字就合并重推；已出字就打断第一个指令、丢弃；</text><text x="34" y="563" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-39">主动服务：排队，等用户这一轮处理完。</text><text x="34" y="584" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-40">多人同时语音：按“文本 / 控制任务”决定打断、提示音还是排队。</text><text x="34" y="605" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-evolution-text-42">路测推动统一：新问题之后补播上一轮内容、串入别的推荐，这类问题推动了统一输入管理。</text><circle cx="39" cy="663.0" r="7" fill="#eaf6ef" stroke="#4a9670" /><text x="53" y="668.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-evolution-text-43">绿：上线、评审与验证</text><circle cx="222" cy="663.0" r="7" fill="#fdeeee" stroke="#c45c5c" /><text x="236" y="668.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-evolution-text-44">红：排期受阻</text><circle cx="392" cy="663.0" r="7" fill="#eaf2fb" stroke="#4f7ea9" /><text x="406" y="668.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-evolution-text-45">蓝点：时间轴上的事件</text></g></svg>
