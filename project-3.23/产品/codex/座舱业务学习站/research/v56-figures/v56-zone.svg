<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="v56-zone" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="v56-zone-title v56-zone-desc">
<title id="v56-zone-title">说话位置与操作对象</title><desc id="v56-zone-desc">主驾说“副驾”时，句子指定操作对象；说“我的”时，再由音区补齐。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="v56-zone-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44">说话位置与操作对象</text><text class="v56-subtitle" x="32" y="72">主驾说“副驾”时，句子指定操作对象；说“我的”时，再由音区补齐。</text>
<text class="v56-label" x="32" y="120" text-anchor="start">座舱俯视示意</text>
<path class="v56-rule" d="M 72 145 L 1128 145 L 1128 620 L 72 620 L 72 145" fill="none"/>
<path class="v56-arrow" d="M 350 240 L 370 240 L 370 362 L 390 362" fill="none" marker-end="url(#v56-zone-arr)"/>
<path class="v56-arrow" d="M 810 362 L 925 362 L 925 290" fill="none" marker-end="url(#v56-zone-arr)"/>
<g data-node="true">
<rect class="v56-local" x="120" y="190" width="230" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="134" y="217" text-anchor="start">主驾</text>
<text class="v56-node-sub" x="134" y="242" text-anchor="start">说话位置（音区）</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="790" y="190" width="270" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="804" y="217" text-anchor="start">副驾</text>
<text class="v56-node-sub" x="804" y="242" text-anchor="start">操作对象</text>
<text class="v56-node-sub" x="804" y="263" text-anchor="start">由句子里的“副驾”决定</text>
</g>
<g data-node="true">
<rect class="v56-neutral" x="120" y="480" width="230" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="134" y="507" text-anchor="start">后排</text>
</g>
<g data-node="true">
<rect class="v56-neutral" x="790" y="480" width="270" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="804" y="507" text-anchor="start">后排</text>
</g>
<g data-node="true">
<rect class="v56-decision" x="390" y="315" width="420" height="94" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="404" y="342" text-anchor="start">主驾说</text>
<text class="v56-node-sub" x="404" y="367" text-anchor="start">“帮我把副驾座椅加热打开”</text>
</g>
<text class="v56-label" x="120" y="671" text-anchor="start">换成“我的”，再看音区</text>
<path class="v56-arrow" d="M 520 745 L 760 745" fill="none" marker-end="url(#v56-zone-arr)"/>
<text class="v56-label" x="580" y="729" text-anchor="start">音区补齐</text>
<g data-node="true">
<rect class="v56-decision" x="120" y="700" width="400" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="134" y="727" text-anchor="start">主驾说</text>
<text class="v56-node-sub" x="134" y="752" text-anchor="start">“把我的座椅加热打开”</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="760" y="700" width="300" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="774" y="727" text-anchor="start">操作对象是主驾</text>
<text class="v56-node-sub" x="774" y="752" text-anchor="start">由说话音区补齐</text>
</g>
<rect class="v56-local" x="32" y="838" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="852" text-anchor="start">蓝：说话位置</text>
<rect class="v56-cloud" x="222" y="838" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="250" y="852" text-anchor="start">绿：操作对象</text>
<rect class="v56-decision" x="412" y="838" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="440" y="852" text-anchor="start">黄：用户的说法</text>
<rect class="v56-neutral" x="602" y="838" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="630" y="852" text-anchor="start">灰：其余座位</text>
</svg>
