<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1780" viewBox="0 0 1900 1780">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z" fill="#8AA3C1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="56" y="70" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="39" font-weight="700" fill="#173458" text-anchor="start"><tspan x="56" dy="0">系统预设任务配置平台：页面落位与完整配置链路</tspan></text>
<text x="56" y="115" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="56" dy="0">基于现有“场景详情页”扩展；灰色是平台已有，蓝色/橙色是本期需要新增或补齐。</tspan></text>
<rect x="56" y="155" width="60" height="38" rx="19" fill="#F4F6F8" stroke="#8AA3C1" stroke-width="1.5"/>
<text x="86" y="181" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#173458" text-anchor="middle"><tspan x="86" dy="0">现状</tspan></text>
<text x="148" y="181" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="148" dy="0">当前页面已经能配置什么</tspan></text>
<rect x="56" y="220" width="540" height="192" rx="14" fill="#F4F6F8" stroke="#8AA3C1" stroke-width="2"/>
<rect x="56" y="220" width="540" height="54" rx="14" fill="#F4F6F8" stroke="none" stroke-width="0"/>
<text x="76" y="255" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="76" dy="0">A  基础信息与发布范围</tspan></text>
<rect x="516" y="229" width="60" height="38" rx="19" fill="#FFFFFF" stroke="#8AA3C1" stroke-width="1.5"/>
<text x="546" y="255" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="546" dy="0">现有</tspan></text>
<text x="76" y="308" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="76" dy="0">场景名称、优先级</tspan><tspan x="76" dy="29">渠道、指定车辆、车型、软件版本</tspan><tspan x="76" dy="29">作用：决定这条规则发布给谁</tspan></text>
<rect x="630" y="220" width="540" height="192" rx="14" fill="#F4F6F8" stroke="#8AA3C1" stroke-width="2"/>
<rect x="630" y="220" width="540" height="54" rx="14" fill="#F4F6F8" stroke="none" stroke-width="0"/>
<text x="650" y="255" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="650" dy="0">B  触发条件</tspan></text>
<rect x="1090" y="229" width="60" height="38" rx="19" fill="#FFFFFF" stroke="#8AA3C1" stroke-width="1.5"/>
<text x="1120" y="255" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="1120" dy="0">现有</tspan></text>
<text x="650" y="308" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="650" dy="0">条件组、且/或关系</tspan><tspan x="650" dy="29">能力类型 → 信号 → 字段 → 运算符 → 值</tspan><tspan x="650" dy="29">作用：决定什么变化后开始检查</tspan></text>
<rect x="1204" y="220" width="640" height="192" rx="14" fill="#F4F6F8" stroke="#8AA3C1" stroke-width="2"/>
<rect x="1204" y="220" width="640" height="54" rx="14" fill="#F4F6F8" stroke="none" stroke-width="0"/>
<text x="1224" y="255" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1224" dy="0">C  动作与基础频控</tspan></text>
<rect x="1764" y="229" width="60" height="38" rx="19" fill="#FFFFFF" stroke="#8AA3C1" stroke-width="1.5"/>
<text x="1794" y="255" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="1794" dy="0">现有</tspan></text>
<text x="1224" y="308" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1224" dy="0">自定义回调、回调地址、下游输入</tspan><tspan x="1224" dy="29">总次数、上电周期次数、每日次数、最小间隔</tspan><tspan x="1224" dy="29">缺口：只能“回调”，不能描述完整交互闭环</tspan></text>
<polyline points="950,430 950,476" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="56" y="466" width="96" height="38" rx="19" fill="#FFF4E4" stroke="#D88932" stroke-width="1.5"/>
<text x="104" y="492" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#173458" text-anchor="middle"><tspan x="104" dy="0">本期改造</tspan></text>
<text x="184" y="493" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="700" fill="#173458" text-anchor="start"><tspan x="184" dy="0">在同一“场景详情页”新增四个配置区</tspan></text>
<rect x="56" y="530" width="820" height="248" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<rect x="56" y="530" width="820" height="54" rx="14" fill="#EDF4FF" stroke="none" stroke-width="0"/>
<text x="76" y="565" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="76" dy="0">1  任务关联与运行位置</tspan></text>
<rect x="670" y="539" width="186" height="38" rx="19" fill="#FFFFFF" stroke="#1E63B6" stroke-width="1.5"/>
<text x="763" y="565" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="763" dy="0">产品/任务业务填写</tspan></text>
<text x="76" y="618" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="76" dy="0">关联哪项系统预设任务；读取哪一个“真实启用状态”</tspan><tspan x="76" dy="29">选择端侧运行或云端运行；填写任务业务负责人/承接业务</tspan><tspan x="76" dy="29">联动：任务关闭后，不再生成新事件；未消费的询问失效</tspan><tspan x="76" dy="29">产出给：端侧 Trigger 或 Cloud Trigger</tspan></text>
<rect x="924" y="530" width="920" height="248" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<rect x="924" y="530" width="920" height="54" rx="14" fill="#EDF4FF" stroke="none" stroke-width="0"/>
<text x="944" y="565" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="944" dy="0">2  命中后的处理编排</tspan></text>
<rect x="1602" y="539" width="222" height="38" rx="19" fill="#FFFFFF" stroke="#1E63B6" stroke-width="1.5"/>
<text x="1713" y="565" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="1713" dy="0">触发器产品 + 业务方</tspan></text>
<text x="944" y="618" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="944" dy="0">处理方式：直接执行 / 仅告知 / 先询问 / 发起主动推荐</tspan><tspan x="944" dy="29">填写业务事件名称、承接业务、目标动作与动作顺序</tspan><tspan x="944" dy="29">若选择“先询问”，必须进入下方“卡片注册与交互”配置</tspan><tspan x="944" dy="29">产出给：触发器命中后调用的原业务；不是直接给 Planner</tspan></text>
<rect x="56" y="818" width="820" height="366" rx="14" fill="#FFF4E4" stroke="#D88932" stroke-width="2"/>
<rect x="56" y="818" width="820" height="54" rx="14" fill="#FFF4E4" stroke="none" stroke-width="0"/>
<text x="76" y="853" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="76" dy="0">3  卡片注册与交互</tspan></text>
<rect x="706" y="827" width="150" height="38" rx="19" fill="#FFFFFF" stroke="#D88932" stroke-width="1.5"/>
<text x="781" y="853" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="781" dy="0">新增核心配置区</tspan></text>
<text x="76" y="906" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="76" dy="0">谁注册：必须选择“卡片注册业务方”并填写业务场景标识</tspan><tspan x="76" dy="29">展示什么：模板、标题、正文、按钮文案及按钮业务含义</tspan><tspan x="76" dy="29">怎么播：TTS开关、内容、播报时机、禁语音时的降级</tspan><tspan x="76" dy="29">怎么回答：点击回调到原业务；语音选择本地或云端路线</tspan><tspan x="76" dy="29">本地路线：可见即可说，把语音命中转换为同一按钮点击</tspan><tspan x="76" dy="29">云端路线：卡片展示后注册上下文/动态选择能力给 Planner</tspan><tspan x="76" dy="29">生命周期：等待时长、卡片有效期、关闭/过期/撤销处理</tspan><tspan x="76" dy="29">关键边界：Planner不创建、不拉起、不持有卡片</tspan></text>
<rect x="924" y="818" width="920" height="366" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<rect x="924" y="818" width="920" height="54" rx="14" fill="#EDF4FF" stroke="none" stroke-width="0"/>
<text x="944" y="853" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="944" dy="0">4  执行、结果与退出策略</tspan></text>
<rect x="1692" y="827" width="132" height="38" rx="19" fill="#FFFFFF" stroke="#1E63B6" stroke-width="1.5"/>
<text x="1758" y="853" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="1758" dy="0">任务业务填写</tspan></text>
<text x="944" y="906" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="944" dy="0">确认后动作：先复核哪些最新条件，再调用哪个动作</tspan><tspan x="944" dy="29">成功标准：读取哪个真实车辆状态，达到什么值才算成功</tspan><tspan x="944" dy="29">结果分支：成功 / 失败 / 暂无法确认时分别展示和处理什么</tspan><tspan x="944" dy="29">重复控制：去重口径、拒绝后的冷却、再次提醒时机</tspan><tspan x="944" dy="29">失效条件：任务关闭、车况变化、卡片过期、结果过期</tspan><tspan x="944" dy="29">退出动作：结束本次、撤卡、停止播报；不默认反向车控</tspan><tspan x="944" dy="29">产出给：原业务、执行层和卡片结果更新能力</tspan></text>
<rect x="56" y="1222" width="1788" height="192" rx="14" fill="#F3EEFF" stroke="#8B70C9" stroke-width="2"/>
<text x="78" y="1262" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="700" fill="#173458" text-anchor="start"><tspan x="78" dy="0">独立建设：原子能力管理页（不是把所有字段硬写进每个场景）</tspan></text>
<text x="78" y="1304" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="400" fill="#173458" text-anchor="start"><tspan x="78" dy="0">能力提供方登记：能力名称、用途、字段/枚举/单位、数据来源、端侧/云端、车型/版本、提供方、当前接入状态。</tspan><tspan x="78" dy="31">场景详情页只“引用”已接入能力。选定渠道、车型、版本和端云位置后，平台自动筛掉不适配能力。</tspan><tspan x="78" dy="31">页面没有可选项时，提示“缺少哪项能力、由谁接入”；不得把“下拉框里没有”误判成底层一定没有能力。</tspan></text>
<text x="56" y="1480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="28" font-weight="700" fill="#173458" text-anchor="start"><tspan x="56" dy="0">保存以后，配置怎样进入运行链路</tspan></text>
<rect x="56" y="1520" width="250" height="112" rx="12" fill="#EDF4FF" stroke="#8AA3C1" stroke-width="1.8"/>
<text x="74" y="1557" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="74" dy="0">① 配置人员</tspan></text>
<text x="74" y="1594" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="74" dy="0">填写完整任务</tspan></text>
<polyline points="306,1577 356,1577" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="356" y="1520" width="250" height="112" rx="12" fill="#EDF4FF" stroke="#8AA3C1" stroke-width="1.8"/>
<text x="374" y="1557" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="374" dy="0">② 平台校验</tspan></text>
<text x="374" y="1594" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="374" dy="0">能力/分支/责任人</tspan></text>
<polyline points="606,1577 656,1577" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="656" y="1520" width="250" height="112" rx="12" fill="#EDF4FF" stroke="#8AA3C1" stroke-width="1.8"/>
<text x="674" y="1557" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="674" dy="0">③ 发布</tspan></text>
<text x="674" y="1594" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="674" dy="0">按范围生成配置</tspan></text>
<polyline points="906,1577 956,1577" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="956" y="1520" width="250" height="112" rx="12" fill="#EAF5EF" stroke="#8AA3C1" stroke-width="1.8"/>
<text x="974" y="1557" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="974" dy="0">④ Trigger</tspan></text>
<text x="974" y="1594" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="974" dy="0">读取状态并判断</tspan></text>
<polyline points="1206,1577 1256,1577" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="1256" y="1520" width="250" height="112" rx="12" fill="#FFF4E4" stroke="#D88932" stroke-width="1.8"/>
<text x="1274" y="1557" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1274" dy="0">⑤ 原业务</tspan></text>
<text x="1274" y="1594" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="1274" dy="0">接事件并注册卡片</tspan></text>
<polyline points="1506,1577 1556,1577" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="1556" y="1520" width="250" height="112" rx="12" fill="#EAF5EF" stroke="#8AA3C1" stroke-width="1.8"/>
<text x="1574" y="1557" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1574" dy="0">⑥ 交互/执行</tspan></text>
<text x="1574" y="1594" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="1574" dy="0">收答复并完成闭环</tspan></text>
<rect x="56" y="1666" width="1788" height="70" rx="12" fill="#FFF0F0" stroke="#DB5C5C" stroke-width="1.8"/>
<text x="950" y="1710" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="650" fill="#8C3434" text-anchor="middle"><tspan x="950" dy="0">发布门禁：未选业务承接方、需询问但未注册卡片、无取消/超时分支、无真实结果判定时，一律不允许发布。</tspan></text>
</svg>