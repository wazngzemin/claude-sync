<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1401" viewBox="0 0 1660 1401">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1401" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">引导建议进入当前轮的时序边界</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">建议必须及时影响当前回复；过期机会不转移到下一话题</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">当前用户请求到达</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">原对话流程与引导判断按接入方案协同</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">具体交接方式需与 DT 联调</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">语义相关性与组合条件共同成立</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">触发器形成关联本轮的引导建议</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">只下发仍然有效的建议</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 当前轮是否仍可接收建议？</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">目标是赶在当前回复前影响处理</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不假设已有任意时刻回滚或重启能力</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">已越过接收窗口</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">结束本次机会</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不跨话题补播</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">可以接收</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 同时保留原请求与引导目的</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">结合当前语境生成适当回复或工具动作</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不能将用户原诉求替换成引导文本</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="997" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">是否进入对应建议的处理推理？</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">回传可关联的处理开始状态</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">由触发器消费该反馈</text><line x1="1020" y1="1065.0" x2="1186" y2="1065.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1052.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="997" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1037" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">未处理／无法确认</text><text x="1218" y="1075" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不计处理成功</text><text x="1218" y="1106" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">保留实际原因</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1173.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">已处理</text><rect x="100" y="1200" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器计次，DT 沿原链路执行</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">处理次数和端侧播放结果分开记录</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">账号切换后旧建议失效，反馈归原记录</text>
</svg>