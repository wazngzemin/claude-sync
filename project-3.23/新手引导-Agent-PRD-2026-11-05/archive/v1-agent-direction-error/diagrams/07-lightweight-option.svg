<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1807" viewBox="0 0 1660 1807">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1807" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">晚间轻量方案的独立链路</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">语义匹配与组合条件分开；不固定再加一个二次校验模型</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">后台配置场景与候选描述</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">同步场景条件、语义描述和示例</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">功能档案如何接入仍需明确</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户 query 到达语义入口</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">输入范围和上下文接入需确认</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不把每句话变成一个新注册任务</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">单模型匹配到相关候选场景吗？</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">模型只判断相关性</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不负责猜测历史首次或使用次数</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">无关／未知</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">退出本次引导</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">正常对话继续</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">匹配</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器组合条件是否共同满足？</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">检查身份、首次／次数、端状态等</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">各项需要真实可取得的信息</text><line x1="1020" y1="862.0" x2="1186" y2="862.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="849.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="794" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="834" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">不满足／信息缺失</text><text x="1218" y="872" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不向 DT 下发</text><text x="1218" y="903" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不扣成功次数</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="970.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">满足</text><rect x="100" y="997" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">建议能否赶上 DT 当前处理窗口？</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">触发器发出已配置 advice</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">保留原用户 query</text><line x1="1020" y1="1065.0" x2="1186" y2="1065.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1052.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="997" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1037" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">迟到／无法交接</text><text x="1218" y="1075" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">结束旧机会</text><text x="1218" y="1106" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不跨话题补播</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1173.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">可以</text><rect x="100" y="1200" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 结合原请求执行与回复</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">按指引完成引导或必要工具操作</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">执行仍走现有主链路</text><line x1="560.0" y1="1338" x2="560.0" y2="1399" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1403" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1443" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">下游回传可关联的处理阶段</text><text x="128" y="1481" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">晚间讨论至少关注 DT 是否开始推理</text><text x="128" y="1512" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">触达信号与功能成功另记</text><line x1="560.0" y1="1541" x2="560.0" y2="1602" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1606" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1646" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器按确认口径计次</text><text x="128" y="1684" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">达到次数后结束该配置实例</text><text x="128" y="1715" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不能与 Agent 另有一套冲突次数</text>
</svg>