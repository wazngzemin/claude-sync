<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="t2-objects" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="t2-objects-title t2-objects-desc">
<title id="t2-objects-title">一件任务，怎样留下目标、执行和状态</title><desc id="t2-objects-desc">主例：“15:30 提醒主驾去接小宝”；任务保存整件事，一次运行只记录某一次执行。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="t2-objects-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一件任务，怎样留下目标、执行和状态</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">主例：“15:30 提醒主驾去接小宝”；任务保存整件事，一次运行只记录某一次执行。</text>
<g data-node="true" id="t2-objects-task"><rect class="v56-cloud" x="420" y="366" width="360" height="148" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="434" y="394" text-anchor="start">任务：整件事</text>
<text class="v56-node-sub" x="434" y="422" text-anchor="start">状态、结束原因</text>
<text class="v56-node-sub" x="434" y="446" text-anchor="start">运行次数、版本</text>
<text class="v56-node-sub" x="434" y="470" text-anchor="start">属于这个账号 × 这辆车</text>
</g>
<g data-node="true" id="t2-objects-spec"><rect class="v56-cloud" x="420" y="130" width="360" height="184" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="434" y="158" text-anchor="start">任务规格</text>
<text class="v56-node-sub" x="434" y="186" text-anchor="start">用户目标、到时要执行的话</text>
<text class="v56-node-sub" x="434" y="210" text-anchor="start">等待规则、由谁执行、结束策略</text>
<text class="v56-node-sub" x="434" y="234" text-anchor="start">主例：15:30 提醒主驾去接小宝</text>
</g>
<g data-node="true" id="t2-objects-run"><rect class="v56-cloud" x="32" y="344" width="320" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="372" text-anchor="start">一次运行</text>
<text class="v56-node-sub" x="46" y="400" text-anchor="start">某一次真正执行</text>
<text class="v56-node-sub" x="46" y="424" text-anchor="start">等待时可以还没有运行</text>
</g>
<g data-node="true" id="t2-objects-events"><rect class="v56-cloud" x="32" y="566" width="320" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="594" text-anchor="start">任务事件</text>
<text class="v56-node-sub" x="46" y="622" text-anchor="start">每次状态变化的事实</text>
<text class="v56-node-sub" x="46" y="646" text-anchor="start">用于审计和推进</text>
</g>
<g data-node="true" id="t2-objects-association"><rect class="v56-cloud" x="848" y="344" width="320" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="862" y="372" text-anchor="start">外部关联</text>
<text class="v56-node-sub" x="862" y="400" text-anchor="start">用已有请求编号、推荐编号</text>
<text class="v56-node-sub" x="862" y="424" text-anchor="start">对回任务和运行</text>
</g>
<g data-node="true" id="t2-objects-view"><rect class="v56-local" x="848" y="566" width="320" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="862" y="594" text-anchor="start">任务视图：查询</text>
<text class="v56-node-sub" x="862" y="622" text-anchor="start">只读当前样子</text>
<text class="v56-node-sub" x="862" y="646" text-anchor="start">供 Planner 和车端查询</text>
</g>
<g data-node="true" id="t2-objects-message"><rect class="v56-local" x="420" y="622" width="360" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="434" y="650" text-anchor="start">任务消息：通知</text>
<text class="v56-node-sub" x="434" y="678" text-anchor="start">状态变化时主动推给车端</text>
<text class="v56-node-sub" x="434" y="702" text-anchor="start">用于车端更新</text>
</g>
<path class="v56-arrow" d="M 600 366 L 600 314" marker-end="url(#t2-objects-arr)"/>
<path class="v56-arrow" d="M 420 410 L 352 410" marker-end="url(#t2-objects-arr)"/>
<path class="v56-arrow" d="M 780 410 L 848 410" marker-end="url(#t2-objects-arr)"/>
<path class="v56-arrow" d="M 420 478 L 384 478 L 384 616 L 352 616" marker-end="url(#t2-objects-arr)"/>
<path class="v56-arrow" d="M 780 478 L 816 478 L 816 616 L 848 616" marker-end="url(#t2-objects-arr)"/>
<path class="v56-arrow" d="M 600 514 L 600 622" marker-end="url(#t2-objects-arr)"/>
<text class="v56-node-title" x="32" y="782" text-anchor="start">三个状态层，各自描述不同对象，不能一一对应</text>
<text class="v56-label" x="32" y="824" text-anchor="start">自研任务 · 3 态</text>
<text class="v56-node-sub" x="32" y="856" text-anchor="start">等待 / 进行中 / 已关闭</text>
<text class="v56-label" x="420" y="824" text-anchor="start">一次运行 · 5 态</text>
<text class="v56-node-sub" x="420" y="856" text-anchor="start">进行中 / 成功 / 失败</text>
<text class="v56-node-sub" x="420" y="880" text-anchor="start">跳过 / 取消</text>
<text class="v56-label" x="848" y="824" text-anchor="start">上汽目标 · 4 态</text>
<text class="v56-node-sub" x="848" y="856" text-anchor="start">创建中 / 待执行</text>
<text class="v56-node-sub" x="848" y="880" text-anchor="start">执行中 / 已结束</text>
<text class="v56-subtitle" x="32" y="938" text-anchor="start">主例：任务先等待；15:30 到点并通过检查后，才生成这一次提醒的运行。</text>
<path class="v56-rule" d="M 32 998 L 1168 998"/>
<text class="v56-node-title" x="32" y="1034" text-anchor="start">查询是主动来取，通知是状态变化后推过去。</text>
<rect data-decoration="true" class="v56-cloud" x="32.0" y="1062" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1076" text-anchor="start">绿：保存目标、执行与关联</text>
<rect data-decoration="true" class="v56-local" x="600.0" y="1062" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="1076" text-anchor="start">蓝：车端查询与通知</text>
</svg>
