<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="1106" viewBox="0 0 1850 1106" role="img" aria-label="事件日志"><title>事件日志</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M404,226 L404,400 L734,400 L734,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="402" y="322" width="115" height="44" rx="3" fill="#fff"/><text x="407" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="407" dy="0">消费方发起查询</tspan></text><path d="M773,644 L773,692 L1155,692 L1155,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1058" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="1063" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="1063" dy="0">记忆生产取数</tspan></text><path d="M851,644 L851,682 L1615,682 L1615,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1443" y="740" width="175" height="44" rx="3" fill="#fff"/><text x="1448" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="1448" dy="0">Context 白名单</tspan></text><path d="M617,644 L617,682 L235,682 L235,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="108" y="740" width="130" height="44" rx="3" fill="#fff"/><text x="113" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="113" dy="0">UP 事件白名单</tspan></text><path d="M274,226 L274,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="162" y="322" width="115" height="44" rx="3" fill="#fff"/><text x="167" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="167" dy="0">命中已注册订阅</tspan></text><path d="M695,644 L695,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="403" y="740" width="295" height="44" rx="3" fill="#fff"/><text x="408" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="408" dy="0">Advisor 经 Context 查询</tspan></text><a href="#module/EL/step/EL-1"><g data-step="EL-1"><rect x="144" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="144" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="164" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="164" dy="0">EL-1</tspan></text><text x="164" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="164" dy="0">保存发生时间、对象和原始内容</tspan></text><text x="164" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="164" dy="0">事件服务</tspan></text><text x="164" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="164" dy="0">原始事件日志</tspan></text></g></a><a href="#module/EL/step/EL-2"><g data-step="EL-2"><rect x="539" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="539" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="559" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="559" dy="0">EL-2</tspan></text><text x="559" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="559" dy="0">按车辆、时间和事件类型取事实</tspan></text><text x="559" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="559" dy="0">查询接口</tspan></text><text x="559" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="559" dy="0">符合范围的日志列表</tspan></text></g></a><a href="#module/EL/step/EL-3"><g data-step="EL-3"><rect x="960" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="960" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="980" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="980" dy="0">EL-3</tspan></text><text x="980" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="980" dy="0">将日志作为记忆生产素材</tspan></text><text x="980" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="980" dy="0">记忆模块</tspan></text><text x="980" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="980" dy="0">记忆生产输入</tspan></text></g></a><a href="#module/EL/step/EL-4"><g data-step="EL-4"><rect x="1420" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1420" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="1440" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1440" dy="0">EL-4</tspan></text><text x="1440" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="1440" dy="0">筛选关注事件补入当前背景</tspan></text><text x="1440" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="1440" dy="0">Context</tspan></text><text x="1440" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="1440" dy="0">本轮可见的事件背景</tspan></text></g></a><a href="#module/EL/step/EL-5"><g data-step="EL-5"><rect x="40" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">EL-5</tspan></text><text x="60" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">将关注事件穿插进对话历史</tspan></text><text x="60" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">UP 组织</tspan></text><text x="60" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">带时间的 event 输入</tspan></text></g></a><a href="#module/EL/step/EL-6"><g data-step="EL-6"><rect x="79" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="79" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="99" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="99" dy="0">EL-6</tspan></text><text x="99" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="99" dy="0">只通知注册过的消费者</tspan></text><text x="99" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="99" dy="0">订阅通知</tspan></text><text x="99" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="99" dy="0">订阅事件回调</tspan></text></g></a><a href="#module/EL/step/EL-7"><g data-step="EL-7"><rect x="500" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">EL-7</tspan></text><text x="520" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">通过 Context 读取相关事件</tspan></text><text x="520" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">静态 Advisor</tspan></text><text x="520" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">Advisor 的事实输入</tspan></text></g></a></g></svg>