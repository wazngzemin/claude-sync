l="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">R10</tspan></text><text x="60" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">结束本次无效输入</tspan></text><text x="60" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">拒识与交互入口</tspan></text><text x="60" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">拒识结果与交互状态</tspan></text></g></a></g></svg>