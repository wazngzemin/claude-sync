<text x="276" y="875" font-size="25px" fill="#203947" font-weight="450">输入：明确触发条件和动作</text>
<text x="276" y="940" font-size="25px" fill="#354F62" font-weight="450">配置先确定车型、车企、环境和场景目标。相同条件在不同车型</text>
<text x="276" y="976" font-size="25px" fill="#354F62" font-weight="450">可能有不同信号、能力与安全边界。</text>
<rect x="1090" y="735" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="C2" />
<text x="1116" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">13.2 信号与动作注册</text>
<text x="1116" y="839" font-size="25px" fill="#203947" font-weight="450">signal / action 字典</text>
<text x="1116" y="875" font-size="25px" fill="#203947" font-weight="450">校验类型、单位和能力范围</text>
<text x="1116" y="940" font-size="25px" fill="#354F62" font-weight="450">给信号定义类型、枚举、单位、时间与来源；给动作定义可执行</text>
<text x="1116" y="976" font-size="25px" fill="#354F62" font-weight="450">范围。字段名称相同不代表语义、单位必然相同。</text>
<rect x="1090" y="1263" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="C3" />
<text x="1116" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">13.3 条件表达与执行策略</text>
<text x="1116" y="1367" font-size="25px" fill="#203947" font-weight="450">条件组合、持续时间、次数</text>
<text x="1116" y="1403" font-size="25px" fill="#203947" font-weight="450">冷却、优先级、适用范围</text>
<text x="1116" y="1468" font-size="25px" fill="#354F62" font-weight="450">将组合条件、持续时间、次数与执行策略分别表达。冷却、优先</text>
<text x="1116" y="1504" font-size="25px" fill="#354F62" font-weight="450">级和适用范围是运行策略，不是模型临时猜出的默认值。</text>
<rect x="250" y="1263" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="C4" />
<text x="276" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">13.4 发布校验</text>
<text x="276" y="1367" font-size="25px" fill="#203947" font-weight="450">格式 / 可感知 / 可执行</text>
<text x="276" y="1403" font-size="25px" fill="#203947" font-weight="450">不可满足 → 返回配置失败</text>
<text x="276" y="1468" font-size="25px" fill="#354F62" font-weight="450">发布前校验语法、条件可观测性与动作可执行性。无法感知或无</text>
<text x="276" y="1504" font-size="25px" fill="#354F62" font-weight="450">执行能力时应拒绝发布，不制造永远等待的假任务。</text>
<rect x="250" y="1791" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="C5" />
<text x="276" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">13.5 云端注册 / 更新</text>
<text x="276" y="1895" font-size="25px" fill="#203947" font-weight="450">注册场景与回调目标</text>
<text x="276" y="1931" font-size="25px" fill="#203947" font-weight="450">记录配置状态及版本</text>
<text x="276" y="1996" font-size="25px" fill="#354F62" font-weight="450">云侧注册可执行规则、版本和回调方。新增、更新、删除各有状</text>
<text x="276" y="2032" font-size="25px" fill="#354F62" font-weight="450">态，注册成功不能替代端侧生效确认。</text>
<rect x="1090" y="1791" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="C6" />
<text x="1116" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">13.6 端侧配置同步</text>
<text x="1116" y="1895" font-size="25px" fill="#203947" font-weight="450">规则下发、读取当前版本</text>
<text x="1116" y="1931" font-size="25px" fill="#203947" font-weight="450">热更新范围按版本核验</text>
<text x="1116" y="1996" font-size="25px" fill="#354F62" font-weight="450">按范围下发端侧配置并确认当前生效版本。重启、离线、热更新</text>
<text x="1116" y="2032" font-size="25px" fill="#354F62" font-weight="450">期间必须知道正在运行的是哪一版。</text>
<rect x="2290" y="735" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="G1" />
<text x="2316" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">15.1 接收规则订阅</text>
<text x="2316" y="839" font-size="25px" fill="#203947" font-weight="450">Task/旧动态 Advisor 注册</text>
<text x="2316" y="875" font-size="25px" fill="#203947" font-weight="450">定时 / 周期 / 条件 / 视觉</text>
<text x="2316" y="940" font-size="25px" fill="#354F62" font-weight="450">接收来自配置或所选任务系统的条件订阅。记住目标归属、期限</text>
<text x="2316" y="976" font-size="25px" fill="#354F62" font-weight="450">和回调地址，以便取消与恢复时找回原任务。</text>
<rect x="3130" y="735" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="G2" />
<text x="3156" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">15.2 取得观察事实</text>
<text x="3156" y="839" font-size="25px" fill="#203947" font-weight="450">云信号库 / 端状态快照</text>
<text x="3156" y="875" font-size="25px" fill="#203947" font-weight="450">视觉只读对应 task 的结果</text>
<text x="3156" y="940" font-size="25px" fill="#354F62" font-weight="450">变化事件用于唤醒；快照用于求值。结构信号、默认感知和带任</text>
<text x="3156" y="976" font-size="25px" fill="#354F62" font-weight="450">务 ID 的动态视觉有各自来源，不能混成一个布尔值。</text>
<rect x="3130" y="1263" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="G3" />
<text x="3156" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">15.3 条件求值</text>
<text x="3156" y="1367" font-size="25px" fill="#203947" font-weight="450">结构条件 → 比较 / 组合</text>
<text x="3156" y="1403" font-size="25px" fill="#203947" font-weight="450">视觉描述 → 语义 Y/N</text>
<text x="3156" y="1468" font-size="25px" fill="#354F62" font-weight="450">结构条件按类型比较与组合；动态视觉描述按约定做云端语义判</text>
<text x="3156" y="1504" font-size="25px" fill="#354F62" font-weight="450">断。观察到了内容，不等于业务条件已经成立。</text>
<rect x="2290" y="1263" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="G4" />
<text x="2316" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">15.4 命中与抑制</text>
<text x="2316" y="1367" font-size="25px" fill="#203947" font-weight="450">范围 / 过期 / 冷却 / 去重</text>
<text x="2316" y="1403" font-size="25px" fill="#203947" font-weight="450">未命中：保留订阅继续观察</text>
<text x="2316" y="1468" font-size="25px" fill="#354F62" font-weight="450">成立后仍检查范围、过期、冷却、去重和冲突。未成立则继续等</text>
<text x="2316" y="1504" font-size="25px" fill="#354F62" font-weight="450">待，不把暂未达成判成能力未覆盖。</text>
<rect x="2290" y="1791" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="G5" />
<text x="2316" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">15.5 形成触发事件</text>
<text x="2316" y="1895" font-size="25px" fill="#203947" font-weight="450">原任务 + 条件已满足</text>
<text x="2316" y="1931" font-size="25px" fill="#203947" font-weight="450">绑定 task_id / callback_id</text>
<text x="2316" y="1996" font-size="25px" fill="#354F62" font-weight="450">生成带原任务关联的命中事件。应区分源信号时间、规则命中时</text>
<text x="2316" y="2032" font-size="25px" fill="#354F62" font-weight="450">间与回调时间，便于定位延迟和乱序。</text>
<rect x="3130" y="1791" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="G6" />
<text x="3156" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">15.6 回调任务方</text>
<text x="3156" y="1895" font-size="25px" fill="#203947" font-weight="450">触发 ≠ 动作已执行</text>
<text x="3156" y="1931" font-size="25px" fill="#203947" font-weight="450">按目标来源回旧链或新 Task</text>
<text x="3156" y="1967" font-size="25px" fill="#203947" font-weight="450">不是把一个命中发给两套执行</text>
<text x="3156" y="2032" font-size="25px" fill="#354F62" font-weight="450">只回调创建订阅的任务方：旧动态 Advisor 或新 Task。回调</text>
<text x="3156" y="2068" font-size="25px" fill="#354F62" font-weight="450">表示可以再次判断，不等于动作已经执行成功。</text>
<rect x="4330" y="735" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K1" stroke-dasharray="10 7"/>
<text x="4356" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">17.1 Task Agent 入口</text>
<text x="4356" y="839" font-size="25px" fill="#203947" font-weight="450">Planner 透传任务文本</text>
<text x="4356" y="875" font-size="25px" fill="#203947" font-weight="450">入口不负责生成任务定义</text>
<text x="4356" y="940" font-size="25px" fill="#354F62" font-weight="450">新 Task 设计中，这一层转发任务类型和文本，不代替服务内</text>
<text x="4356" y="976" font-size="25px" fill="#354F62" font-weight="450">的语义理解，也不要求 Planner 直接生成完整 TaskSpec。</text>
<rect x="5170" y="735" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K2" stroke-dasharray="10 7"/>
<text x="5196" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">17.2 Ingress 接入</text>
<text x="5196" y="839" font-size="25px" fill="#203947" font-weight="450">恢复请求关联、幂等校验</text>
<text x="5196" y="875" font-size="25px" fill="#203947" font-weight="450">语义请求 / 事件 / 查询分流</text>
<text x="5196" y="940" font-size="25px" fill="#354F62" font-weight="450">恢复请求与旧任务/运行的关联，处理幂等，再区分用户操作、</text>
<text x="5196" y="976" font-size="25px" fill="#354F62" font-weight="450">触发事件和只读查询。多条同类任务时不能随意选一个修改。</text>
<rect x="5170" y="1263" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K3" stroke-dasharray="10 7"/>
<text x="5196" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">17.3 Spec Builder</text>
<text x="5196" y="1367" font-size="25px" fill="#203947" font-weight="450">模型识别创建/修改/取消</text>
<text x="5196" y="1403" font-size="25px" fill="#203947" font-weight="450">生成目标、条件、执行文本</text>
<text x="5196" y="1468" font-size="25px" fill="#354F62" font-weight="450">识别新增、修改或取消，补齐目标、条件与执行内容。不支持的</text>
<text x="5196" y="1504" font-size="25px" fill="#354F62" font-weight="450">条件或含糊对象需澄清，不能保存一段无法执行的自然语言就称</text>
<text x="5196" y="1540" font-size="25px" fill="#354F62" font-weight="450">创建成功。</text>
<rect x="4330" y="1263" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K4" stroke-dasharray="10 7"/>
<text x="4356" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">17.4 Manager 管理</text>
<text x="4356" y="1367" font-size="25px" fill="#203947" font-weight="450">条件合理性、数量与冲突</text>
<text x="4356" y="1403" font-size="25px" fill="#203947" font-weight="450">创建/更新/取消生命周期</text>
<text x="4356" y="1468" font-size="25px" fill="#354F62" font-weight="450">检查数量、合理性与生命周期策略，执行创建、更新或取消。Ta</text>
<text x="4356" y="1504" font-size="25px" fill="#354F62" font-weight="450">sk 的等待/运行/关闭和单次 Run 的结果状态分别管理。</text>
<rect x="4330" y="1791" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K5" stroke-dasharray="10 7"/>
<text x="4356" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">17.5 Repository 存储</text>
<text x="4356" y="1895" font-size="25px" fill="#203947" font-weight="450">Task / Run / Event / Binding</text>
<text x="4356" y="1931" font-size="25px" fill="#203947" font-weight="450">事务保存状态与外部关联</text>
<text x="4356" y="1996" font-size="25px" fill="#354F62" font-weight="450">持久化 Task、Run、Event、Binding 等关联。推荐消息的关</text>
<text x="4356" y="2032" font-size="25px" fill="#354F62" font-weight="450">联应先保存再发送，避免用户点击后找不到原任务。</text>
<rect x="5170" y="1791" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K6" stroke-dasharray="10 7"/>
<text x="5196" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">17.6 Trigger Adapter</text>
<text x="5196" y="1895" font-size="25px" fill="#203947" font-weight="450">规则转换、注册/取消订阅</text>
<text x="5196" y="1931" font-size="25px" fill="#203947" font-weight="450">waiting：等待触发事件</text>
<text x="5196" y="1996" font-size="25px" fill="#354F62" font-weight="450">把可执行条件转换并注册到触发器；取消时清理订阅。只有持久</text>
<text x="5196" y="2032" font-size="25px" fill="#354F62" font-weight="450">化与观察能力确实建立，才有可靠的等待状态。</text>
<rect x="5170" y="2319" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K7" stroke-dasharray="10 7"/>
<text x="5196" y="2362" font-size="30px" fill="#0D4FA8" font-weight="750">17.7 激活与执行前判断</text>
<text x="5196" y="2423" font-size="25px" fill="#203947" font-weight="450">回调去重 → 创建本次 Run</text>
<text x="5196" y="2459" font-size="25px" fill="#203947" font-weight="450">读取当前车况，决定做/跳过</text>
<text x="5196" y="2524" font-size="25px" fill="#354F62" font-weight="450">回调先恢复原任务并去重，检查未取消、未过期及当前车态。创</text>
<text x="5196" y="2560" font-size="25px" fill="#354F62" font-weight="450">建本次 Run 后决定执行还是跳过，不凭旧观察直接动作。</text>
<rect x="4330" y="2319" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K8" stroke-dasharray="10 7"/>
<text x="4356" y="2362" font-size="30px" fill="#0D4FA8" font-weight="750">17.8 Runtime 分发</text>
<text x="4356" y="2423" font-size="25px" fill="#203947" font-weight="450">通用 → Planner / Agent</text>
<text x="4356" y="2459" font-size="25px" fill="#203947" font-weight="450">生态 → GUI/Provider 内部步骤</text>
<text x="4356" y="2524" font-size="25px" fill="#354F62" font-weight="450">按业务选择执行路径：通用任务可回 Planner/Agent，GUI 或</text>
<text x="4356" y="2560" font-size="25px" fill="#354F62" font-weight="450">生态 Provider 可在内部管理步骤。不是每次运行都必须再经</text>
<text x="4356" y="2596" font-size="25px" fill="#354F62" font-weight="450">过 Planner。</text>
<rect x="4330" y="2847" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K9" stroke-dasharray="10 7"/>
<text x="4356" y="2890" font-size="30px" fill="#0D4FA8" font-weight="750">17.9 Result Hook 回写</text>
<text x="4356" y="2951" font-size="25px" fill="#203947" font-weight="450">结构化执行结果可靠回写</text>
<text x="4356" y="2987" font-size="25px" fill="#203947" font-weight="450">重试/补偿；不只靠 afterFlow</text>
<text x="4356" y="3052" font-size="25px" fill="#354F62" font-weight="450">把执行结果可靠地写回对应 Run/Task，并考虑失败重试与补偿</text>
<text x="4356" y="3088" font-size="25px" fill="#354F62" font-weight="450">。不能只依赖可能丢失的 afterFlow 回调来更新完成状态。</text>
<rect x="5170" y="2847" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K10" stroke-dasharray="10 7"/>
<text x="5196" y="2890" font-size="30px" fill="#0D4FA8" font-weight="750">17.10 结束还是再等？</text>
<text x="5196" y="2951" font-size="25px" fill="#203947" font-weight="450">一次完成/取消 → closed</text>
<text x="5196" y="2987" font-size="25px" fill="#203947" font-weight="450">周期未结束 → waiting</text>
<text x="5196" y="3052" font-size="25px" fill="#354F62" font-weight="450">一次性任务完成或取消后关闭；周期任务在仍有效时再次等待。</text>
<text x="5196" y="3088" font-size="25px" fill="#354F62" font-weight="450">运行中等待用户/客户端/外部结果，不等于新建另一条任务。</text>
<rect x="5170" y="3375" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K11" stroke-dasharray="10 7"/>
<text x="5196" y="3418" font-size="30px" fill="#0D4FA8" font-weight="750">18.1 Task Query</text>
<text x="5196" y="3479" font-size="25px" fill="#203947" font-weight="450">生成只读 TaskView</text>
<text x="5196" y="3515" font-size="25px" fill="#203947" font-weight="450">任务状态供 Planner/HMI 查询</text>
<text x="5196" y="3580" font-size="25px" fill="#354F62" font-weight="450">根据持久化状态生成只读 TaskView，供 Planner 或任务中心</text>
<text x="5196" y="3616" font-size="25px" fill="#354F62" font-weight="450">查询。查询视图不负责启动、取消或编排动作。</text>
<rect x="4330" y="3375" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="K12" stroke-dasharray="10 7"/>
<text x="4356" y="3418" font-size="30px" fill="#0D4FA8" font-weight="750">18.2 Message Dispatcher</text>
<text x="4356" y="3479" font-size="25px" fill="#203947" font-weight="450">状态变化 → 消息通道</text>
<text x="4356" y="3515" font-size="25px" fill="#203947" font-weight="450">Frontier / SSE → 车端任务中心</text>
<text x="4356" y="3580" font-size="25px" fill="#354F62" font-weight="450">把已发生的状态变化经 Frontier/SSE 等通道送端。Dispatch</text>
<text x="4356" y="3616" font-size="25px" fill="#354F62" font-weight="450">er 管送达，不替 Manager 决定任务生命周期。</text>
<rect x="8410" y="735" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="A1" />
<text x="8436" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">16.1 场景变化输入</text>
<text x="8436" y="839" font-size="25px" fill="#203947" font-weight="450">人 / 车 / 环境 / 记忆</text>
<text x="8436" y="875" font-size="25px" fill="#203947" font-weight="450">默认视觉与历史交互</text>
<text x="8436" y="940" font-size="25px" fill="#354F62" font-weight="450">用当前人、车、环境与允许的记忆判断是否出现有帮助的场景。</text>
<text x="8436" y="976" font-size="25px" fill="#354F62" font-weight="450">事实过期或感知错时，后续再自然的建议也可能不成立。</text>
<rect x="9250" y="735" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="A2" />
<text x="9276" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">16.2 四类场景推理</text>
<text x="9276" y="839" font-size="25px" fill="#203947" font-weight="450">舒适 / 出行 / 情感 / 内容</text>
<text x="9276" y="875" font-size="25px" fill="#203947" font-weight="450">识别此时能帮助用户什么</text>
<text x="9276" y="940" font-size="25px" fill="#354F62" font-weight="450">围绕舒适、出行、情感与内容形成候选服务。它解决现在可以帮</text>
<text x="9276" y="976" font-size="25px" fill="#354F62" font-weight="450">什么，不代替旧动态 Advisor 跟进一个已登记目标。</text>
<rect x="9250" y="1263" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="A3" />
<text x="9276" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">16.3 是否值得打扰？</text>
<text x="9276" y="1367" font-size="25px" fill="#203947" font-weight="450">总开关、时机、频控、去重</text>
<text x="9276" y="1403" font-size="25px" fill="#203947" font-weight="450">用户当前 Query 优先</text>
<text x="9276" y="1468" font-size="25px" fill="#354F62" font-weight="450">先判断总开关、驾驶负担、当前对话、重复与频率。被抑制原因</text>
<text x="9276" y="1504" font-size="25px" fill="#354F62" font-weight="450">要保留，才能区分建议不准与建议未送达。</text>
<rect x="8410" y="1263" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="A4" />
<text x="8436" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">16.4 建议与交互等级</text>
<text x="8436" y="1367" font-size="25px" fill="#203947" font-weight="450">给 Planner 建议，或 AI Bar</text>
<text x="8436" y="1403" font-size="25px" fill="#203947" font-weight="450">提议不等于执行成功</text>
<text x="8436" y="1468" font-size="25px" fill="#354F62" font-weight="450">按策略交 Planner 建议或以 AI Bar 等方式呈现。静默展示</text>
<text x="8436" y="1504" font-size="25px" fill="#354F62" font-weight="450">、主动播报与自动执行是不同等级，不应共用一份隐含授权。</text>
<rect x="8410" y="1791" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="A5" />
<text x="8436" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">16.5 用户接受/拒绝</text>
<text x="8436" y="1895" font-size="25px" fill="#203947" font-weight="450">接受 → 对应业务调用</text>
<text x="8436" y="1931" font-size="25px" fill="#203947" font-weight="450">拒绝 → 记录，不反复打扰</text>
<text x="8436" y="1996" font-size="25px" fill="#354F62" font-weight="450">用户接受后进入对应业务决策/执行；拒绝则记录负反馈与后续</text>
<text x="8436" y="2032" font-size="25px" fill="#354F62" font-weight="450">打扰策略。点击接受不等于工具已成功执行。</text>
<rect x="9250" y="1791" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="A6" />
<text x="9276" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">16.6 结果与效果反馈</text>
<text x="9276" y="1895" font-size="25px" fill="#203947" font-weight="450">实际行为、采纳与打扰</text>
<text x="9276" y="1931" font-size="25px" fill="#203947" font-weight="450">结果同步上下文，便于后续判断</text>
<text x="9276" y="1996" font-size="25px" fill="#354F62" font-weight="450">将生成、送达、采纳、真实执行和负向打扰分别回流。只看点击</text>
<text x="9276" y="2032" font-size="25px" fill="#354F62" font-weight="450">率会漏掉接受了却没有兑现的体验问题。</text>
<rect x="2290" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="R1" />
<text x="2316" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">9.1 云端收到本轮 Query</text>
<text x="2316" y="5089" font-size="25px" fill="#203947" font-weight="450">文本 + 说话人 + 位置</text>
<text x="2316" y="5125" font-size="25px" fill="#203947" font-weight="450">与端侧候选存在并行计算</text>
<text x="2316" y="5190" font-size="25px" fill="#354F62" font-weight="450">云侧接收有效 Query 及其归属信息；端侧也可能正在计算候选</text>
<text x="2316" y="5226" font-size="25px" fill="#354F62" font-weight="450">。两边计算不等于两边都有执行权。</text>
<rect x="3130" y="4985" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="R2" />
<text x="3156" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">9.2 是否对助手说？</text>
<text x="3156" y="5089" font-size="25px" fill="#203947" font-weight="450">拒识：人与人对话/无效输入</text>
<text x="3156" y="5125" font-size="25px" fill="#203947" font-weight="450">拒识超时按 PRD 进入 Director</text>
<text x="3156" y="5190" font-size="25px" fill="#354F62" font-weight="450">判断用户是不是在对助手说话。拒识与意图分类是两个判断；拒</text>
<text x="3156" y="5226" font-size="25px" fill="#354F62" font-weight="450">识超时策略按对应车型 PRD 核验。</text>
<rect x="3130" y="5513" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="R3" />
<text x="3156" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">9.3 车控 + 指定意图？</text>
<text x="3156" y="5617" font-size="25px" fill="#203947" font-weight="450">未拒识且满足约定意图</text>
<text x="3156" y="5653" font-size="25px" fill="#203947" font-weight="450">命中 → 云端 FC；否则 Planner</text>
<text x="3156" y="5718" font-size="25px" fill="#354F62" font-weight="450">在未拒识后，按当前版本支持的意图分流。明确且可直接处理的</text>
<text x="3156" y="5754" font-size="25px" fill="#354F62" font-weight="450">指令可走云 FC；需要情景、记忆或多步依赖的进入规划。</text>
<rect x="2290" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="R4" />
<text x="2316" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">9.4 云端 FC 理解</text>
<text x="2316" y="5617" font-size="25px" fill="#203947" font-weight="450">明确指令 → 原子动作候选</text>
<text x="2316" y="5653" font-size="25px" fill="#203947" font-weight="450">送端云仲裁，不能重复执行</text>
<text x="2316" y="5718" font-size="25px" fill="#354F62" font-weight="450">云 FC 将指令变成动作候选，仍需端云仲裁、能力检查和执行反</text>
<text x="2316" y="5754" font-size="25px" fill="#354F62" font-weight="450">馈，不能模型一出参就宣称控车成功。</text>
<rect x="2290" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="R5" />
<text x="2316" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">9.5 拒识内容入日志</text>
<text x="2316" y="6145" font-size="25px" fill="#203947" font-weight="450">作为事件 / 对话背景</text>
<text x="2316" y="6181" font-size="25px" fill="#203947" font-weight="450">不是直接给助手的执行指令</text>
<text x="2316" y="6246" font-size="25px" fill="#354F62" font-weight="450">允许留存的拒识内容可成为背景事件，但不是直接命令。是否生</text>
<text x="2316" y="6282" font-size="25px" fill="#354F62" font-weight="450">产、存多久、是否进入模型，应由事件定义与隐私范围约束。</text>
<rect x="3130" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="R6" />
<text x="3156" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">9.6 复杂请求转 Planner</text>
<text x="3156" y="6145" font-size="25px" fill="#203947" font-weight="450">条件 / 持续 / 记忆 / 情景</text>
<text x="3156" y="6181" font-size="25px" fill="#203947" font-weight="450">需要推理、查信息或跨工具</text>
<text x="3156" y="6246" font-size="25px" fill="#354F62" font-weight="450">把复杂需求交给统一输入入口，保留原始诉求与已有状态。Plan</text>
<text x="3156" y="6282" font-size="25px" fill="#354F62" font-weight="450">ner/Director 是同一决策职责，不是两个模型先后接力。</text>
<rect x="3130" y="6569" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="R7" />
<text x="3156" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">9.7 云端无结果？</text>
<text x="3156" y="6673" font-size="25px" fill="#203947" font-weight="450">超时且端候选可用 → 端兜底</text>
<text x="3156" y="6709" font-size="25px" fill="#203947" font-weight="450">都无结果 → 明确失败/再问</text>
<text x="3156" y="6774" font-size="25px" fill="#354F62" font-weight="450">云端超时不应无限等待。仅当端候选仍有效且获准执行才兜底；</text>
<text x="3156" y="6810" font-size="25px" fill="#354F62" font-weight="450">都无结果时给失败或重说出口，并抑制迟到的重复执行。</text>
<rect x="2290" y="6569" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="R8" />
<text x="2316" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">9.8 路由结果可追踪</text>
<text x="2316" y="6673" font-size="25px" fill="#203947" font-weight="450">命中路径、候选、等待时长</text>
<text x="2316" y="6709" font-size="25px" fill="#203947" font-weight="450">以实车 Trace 核对车型策略</text>
<text x="2316" y="6774" font-size="25px" fill="#354F62" font-weight="450">保留选路原因、端云候选、最终执行方和等待时长。它是可观测</text>
<text x="2316" y="6810" font-size="25px" fill="#354F62" font-weight="450">记录，不是每一轮都要再做一次模型判断。</text>
<rect x="6370" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="X1" />
<text x="6396" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">19.1 接入本轮事件</text>
<text x="6396" y="5089" font-size="25px" fill="#203947" font-weight="450">user_query / advisor</text>
<text x="6396" y="5125" font-size="25px" fill="#203947" font-weight="450">tool_feedback / event</text>
<text x="6396" y="5190" font-size="25px" fill="#354F62" font-weight="450">只接收经过输入节奏管理准入的本轮输入，并保留来源类型。工</text>
<text x="6396" y="5226" font-size="25px" fill="#354F62" font-weight="450">具结果是观察事实，不是另一个用户重新发出的命令。</text>
<rect x="7210" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="X2" />
<text x="7236" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">21.1 车况、感知与事件</text>
<text x="7236" y="5089" font-size="25px" fill="#203947" font-weight="450">端侧全量/增量状态、时间</text>
<text x="7236" y="5125" font-size="25px" fill="#203947" font-weight="450">手动操作、导航、媒体状态</text>
<text x="7236" y="5190" font-size="25px" fill="#354F62" font-weight="450">按本轮需要取得车辆状态、视觉描述和事件事实。分别记录来源</text>
<text x="7236" y="5226" font-size="25px" fill="#354F62" font-weight="450">时间，当前状态快照不能替代“刚才发生过什么”的历史事件。</text>
<rect x="7210" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="X3" />
<text x="7236" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">21.2 记忆与当前目标</text>
<text x="7236" y="5617" font-size="25px" fill="#203947" font-weight="450">用户身份/偏好/历史事实</text>
<text x="7236" y="5653" font-size="25px" fill="#203947" font-weight="450">旧 Goal List / 新 TaskView</text>
<text x="7236" y="5718" font-size="25px" fill="#354F62" font-weight="450">按正确身份取得适用记忆与未完成目标。旧 Goal 和新 TaskVi</text>
<text x="7236" y="5754" font-size="25px" fill="#354F62" font-weight="450">ew 由所选架构提供，不应同时创建或任意互换。</text>
<rect x="6370" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="X4" />
<text x="6396" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">21.3 对话历史</text>
<text x="6396" y="5617" font-size="25px" fill="#203947" font-weight="450">近轮保留动作和工具结果</text>
<text x="6396" y="5653" font-size="25px" fill="#203947" font-weight="450">远区压缩方案须保留未完事项</text>
<text x="6396" y="5718" font-size="25px" fill="#354F62" font-weight="450">保留当前对话目标及必要的动作/结果关联。压缩远轮历史时不</text>
<text x="6396" y="5754" font-size="25px" fill="#354F62" font-weight="450">能丢掉未完成事项，也不能把旧成功反馈当本轮执行。</text>
<rect x="6370" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="X5" />
<text x="6396" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">19.2 有效工具与示例</text>
<text x="6396" y="6145" font-size="25px" fill="#203947" font-weight="450">按车型/环境/版本装配能力</text>
<text x="6396" y="6181" font-size="25px" fill="#203947" font-weight="450">动态示例、场景 knowhow</text>
<text x="6396" y="6246" font-size="25px" fill="#354F62" font-weight="450">取本车型与环境真正可用的工具定义、场景知识及本轮检索示例</text>
<text x="6396" y="6282" font-size="25px" fill="#354F62" font-weight="450">。参考例子不是真实状态，更不能复制其中的人名、地点或执行</text>
<text x="6396" y="6318" font-size="25px" fill="#354F62" font-weight="450">结果。</text>
<rect x="7210" y="6041" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="X6" />
<text x="7236" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">21.4 筛选与新鲜度</text>
<text x="7236" y="6145" font-size="25px" fill="#203947" font-weight="450">身份正确？状态过期/冲突？</text>
<text x="7236" y="6181" font-size="25px" fill="#203947" font-weight="450">缺失不补造；按需查工具</text>
<text x="7236" y="6246" font-size="25px" fill="#354F62" font-weight="450">筛选相关性、身份、时效与冲突，必要时标记未知或再查询。并</text>
<text x="7236" y="6282" font-size="25px" fill="#354F62" font-weight="450">非把能拿到的数据全塞给模型就更好。</text>
<rect x="7210" y="6569" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="X7" />
<text x="7236" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">19.3 组装模型输入</text>
<text x="7236" y="6673" font-size="25px" fill="#203947" font-weight="450">系统规则 SP + 当前输入 UP</text>
<text x="7236" y="6709" font-size="25px" fill="#203947" font-weight="450">带上本轮事实、历史与可用工具</text>
<text x="7236" y="6774" font-size="25px" fill="#354F62" font-weight="450">组装系统规则与工具定义 SP、当前请求及历史 UP。留存本轮</text>
<text x="7236" y="6810" font-size="25px" fill="#354F62" font-weight="450">实际输入，才能重放模型为何做出这一决定。</text>
<rect x="6370" y="6569" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="X8" />
<text x="6396" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">21.5 形成下一轮上下文</text>
<text x="6396" y="6673" font-size="25px" fill="#203947" font-weight="450">收工具反馈和手动操作事件</text>
<text x="6396" y="6709" font-size="25px" fill="#203947" font-weight="450">保留部分完成与待选结果</text>
<text x="6396" y="6774" font-size="25px" fill="#354F62" font-weight="450">把新结果与交互事件写回相应上下文，保留已完成与未完成部分</text>
<text x="6396" y="6810" font-size="25px" fill="#354F62" font-weight="450">。下一轮仍由同一 Planner 继续判断，不从零重做。</text>
<rect x="8410" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="P1" />
<text x="8436" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">20.1 理解完整诉求</text>
<text x="8436" y="5089" font-size="25px" fill="#203947" font-weight="450">解析对象、动作、约束和时间</text>
<text x="8436" y="5125" font-size="25px" fill="#203947" font-weight="450">例：降温 + 去昨天的游泳馆</text>
<text x="8436" y="5190" font-size="25px" fill="#354F62" font-weight="450">先理解用户到底希望什么发生、针对谁、有哪些约束和时间要求</text>
<text x="8436" y="5226" font-size="25px" fill="#354F62" font-weight="450">。多目标句子需要分别维护完成条件。</text>
<rect x="9250" y="4985" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="P2" />
<text x="9276" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">20.2 当前还缺什么？</text>
<text x="9276" y="5089" font-size="25px" fill="#203947" font-weight="450">目的地/身份/车况是否已知</text>
<text x="9276" y="5125" font-size="25px" fill="#203947" font-weight="450">查得到 → 工具；需用户定 → 问</text>
<text x="9276" y="5190" font-size="25px" fill="#354F62" font-weight="450">区分已知事实、可查询信息与必须由用户决定的选择。缺目的地</text>
<text x="9276" y="5226" font-size="25px" fill="#354F62" font-weight="450">不能猜；不确定是否有权限也不能擅自执行。</text>
<rect x="9250" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="P3" />
<text x="9276" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">20.3 拆目标与依赖</text>
<text x="9276" y="5617" font-size="25px" fill="#203947" font-weight="450">降温与查记忆可独立推进</text>
<text x="9276" y="5653" font-size="25px" fill="#203947" font-weight="450">拿到具体地点后才能规划路线</text>
<text x="9276" y="5718" font-size="25px" fill="#354F62" font-weight="450">建立动作先后依赖。降温和查历史地点可独立推进；必须先拿到</text>
<text x="9276" y="5754" font-size="25px" fill="#354F62" font-weight="450">具体地点，才能据此规划路线。</text>
<rect x="8410" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="P4" />
<text x="8436" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">20.4 选择工具并改写</text>
<text x="8436" y="5617" font-size="25px" fill="#203947" font-weight="450">工具名、参数、位置与数值</text>
<text x="8436" y="5653" font-size="25px" fill="#203947" font-weight="450">改写须保留原意，且下游能接</text>
<text x="8436" y="5718" font-size="25px" fill="#354F62" font-weight="450">从本轮可见工具中选正确入口，把当前诉求改写成下游能理解的</text>
<text x="8436" y="5754" font-size="25px" fill="#354F62" font-weight="450">参数。不得丢失否定、座位、数值和用户限制。</text>
<rect x="8410" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="P5" />
<text x="8436" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">20.5 生成本轮输出</text>
<text x="8436" y="6145" font-size="25px" fill="#203947" font-weight="450">talk_or_not / talk_content</text>
<text x="8436" y="6181" font-size="25px" fill="#203947" font-weight="450">emoji_id + action_list</text>
<text x="8436" y="6246" font-size="25px" fill="#354F62" font-weight="450">输出是否说话、说什么及动作列表。可以只回答、不动作；也可</text>
<text x="8436" y="6282" font-size="25px" fill="#354F62" font-weight="450">以先查询再回答；JSON 合法并不代表计划合理。</text>
<rect x="9250" y="6041" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="P6" />
<text x="9276" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">20.6 需要等待以后？</text>
<text x="9276" y="6145" font-size="25px" fill="#203947" font-weight="450">条件/周期/长期 → 任务入口</text>
<text x="9276" y="6181" font-size="25px" fill="#203947" font-weight="450">即时工具仍按本轮 action 下发</text>
<text x="9276" y="6246" font-size="25px" fill="#354F62" font-weight="450">遇到未来时间、条件或持续目标，转所选任务机制建立等待。不</text>
<text x="9276" y="6282" font-size="25px" fill="#354F62" font-weight="450">能把“十分钟后关加热”误执行成现在关闭。</text>
<rect x="9250" y="6569" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="P7" />
<text x="9276" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">20.7 观察返回结果</text>
<text x="9276" y="6673" font-size="25px" fill="#203947" font-weight="450">成功、失败、候选或处理中</text>
<text x="9276" y="6709" font-size="25px" fill="#203947" font-weight="450">反馈不是用户的新指令</text>
<text x="9276" y="6774" font-size="25px" fill="#354F62" font-weight="450">读每项工具的本轮结果，区分已受理、处理中、候选、部分成功</text>
<text x="9276" y="6810" font-size="25px" fill="#354F62" font-weight="450">、失败和真实完成；不能只搜索一个“成功”关键词。</text>
<rect x="8410" y="6569" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="P8" />
<text x="8436" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">20.8 目标是否完成？</text>
<text x="8436" y="6673" font-size="25px" fill="#203947" font-weight="450">逐个核对子目标，不抢报完成</text>
<text x="8436" y="6709" font-size="25px" fill="#203947" font-weight="450">未完：继续 / 换方案 / 问 / 等</text>
<text x="8436" y="6774" font-size="25px" fill="#354F62" font-weight="450">逐个对子目标复核证据。还有缺口就继续查、执行、澄清、等待</text>
<text x="8436" y="6810" font-size="25px" fill="#354F62" font-weight="450">或停止；只有满足完整诉求才结束目标。</text>
<rect x="8410" y="7097" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="P9" />
<text x="8436" y="7140" font-size="30px" fill="#0D4FA8" font-weight="750">20.9 输出用户可懂结果</text>
<text x="8436" y="7201" font-size="25px" fill="#203947" font-weight="450">成功部分 + 尚未完成部分</text>
<text x="8436" y="7237" font-size="25px" fill="#203947" font-weight="450">必要时解释失败与下一步</text>
<text x="8436" y="7302" font-size="25px" fill="#354F62" font-weight="450">准确表达已完成部分、未完成部分与下一步。没有执行证据时只</text>
<text x="8436" y="7338" font-size="25px" fill="#354F62" font-weight="450">能说受理或等待，不能用“好了”掩盖失败。</text>
<rect x="9250" y="7097" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="P10" />
<text x="9276" y="7140" font-size="30px" fill="#0D4FA8" font-weight="750">20.10 澄清或让用户选</text>
<text x="9276" y="7201" font-size="25px" fill="#203947" font-weight="450">多个地点/缺身份/不确定约束</text>
<text x="9276" y="7237" font-size="25px" fill="#203947" font-weight="450">等回复后接回原目标</text>
<text x="9276" y="7302" font-size="25px" fill="#354F62" font-weight="450">缺用户选择、对象歧义或重要约束时提出具体问题。用户回答后</text>
<text x="9276" y="7338" font-size="25px" fill="#354F62" font-weight="450">接回原目标，而不是把“第三个”当全新的地点。</text>
<rect x="9250" y="7625" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="P11" />
<text x="9276" y="7668" font-size="30px" fill="#0D4FA8" font-weight="750">20.11 查询/补信息</text>
<text x="9276" y="7729" font-size="25px" fill="#203947" font-weight="450">只调用缺少的信息类工具</text>
<text x="9276" y="7765" font-size="25px" fill="#203947" font-weight="450">记忆未找到不能自编目的地</text>
<text x="9276" y="7830" font-size="25px" fill="#354F62" font-weight="450">选择能够补齐当前缺口的查询工具。记忆查不到就问用户；查到</text>
<text x="9276" y="7866" font-size="25px" fill="#354F62" font-weight="450">多个候选则消歧，不反复盲查或编造。</text>
<rect x="8410" y="7625" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="P12" />
<text x="8436" y="7668" font-size="30px" fill="#0D4FA8" font-weight="750">20.12 停止/取消/终止</text>
<text x="8436" y="7729" font-size="25px" fill="#203947" font-weight="450">取消动作、终止当前目标</text>
<text x="8436" y="7765" font-size="25px" fill="#203947" font-weight="450">播报被打断不自动等于任务取消</text>
<text x="8436" y="7830" font-size="25px" fill="#354F62" font-weight="450">先确定取消的是声音、一次调用、导航目标还是持久任务，再交</text>
<text x="8436" y="7866" font-size="25px" fill="#354F62" font-weight="450">对应业务处理。已生效动作不因停止生成文本而自动撤销。</text>
<rect x="10450" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="F1" />
<text x="10476" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">22.1 接收 action_list</text>
<text x="10476" y="5089" font-size="25px" fill="#203947" font-weight="450">工具名 + 参数 + 调用归属</text>
<text x="10476" y="5125" font-size="25px" fill="#203947" font-weight="450">具体关联字段以运行协议核验</text>
<text x="10476" y="5190" font-size="25px" fill="#354F62" font-weight="450">把每个动作交给对应领域。模型生成 action_list 仅表示计划</text>
<text x="10476" y="5226" font-size="25px" fill="#354F62" font-weight="450">下发意图，还没有调用成功，也没有真实副作用。</text>
<rect x="11290" y="4985" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="F2" />
<text x="11316" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">22.2 能力/参数校验</text>
<text x="11316" y="5089" font-size="25px" fill="#203947" font-weight="450">工具注册、车型支持、必填范围</text>
<text x="11316" y="5125" font-size="25px" fill="#203947" font-weight="450">统一校验层实现需核对</text>
<text x="11316" y="5190" font-size="25px" fill="#354F62" font-weight="450">核对工具存在、车型支持、入参完整且范围合法。这是必须验收</text>
<text x="11316" y="5226" font-size="25px" fill="#354F62" font-weight="450">的契约；不假设所有业务已经有同一套统一门禁。</text>
<rect x="11290" y="5513" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="F3" />
<text x="11316" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">22.3 权限与业务前置条件</text>
<text x="11316" y="5617" font-size="25px" fill="#203947" font-weight="450">身份/座位/车态/用户确认</text>
<text x="11316" y="5653" font-size="25px" fill="#203947" font-weight="450">高副作用工具逐项约定</text>
<text x="11316" y="5718" font-size="25px" fill="#354F62" font-weight="450">执行前检查身份、位置、车态和所需确认。推荐、用户点击与允</text>
<text x="11316" y="5754" font-size="25px" fill="#354F62" font-weight="450">许自动执行是不同授权边界。</text>
<rect x="10450" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="F4" />
<text x="10476" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">22.4 本轮可执行动作</text>
<text x="10476" y="5617" font-size="25px" fill="#203947" font-weight="450">独立动作可并行；依赖须等待</text>
<text x="10476" y="5653" font-size="25px" fill="#203947" font-weight="450">POI / route / navi 串行互斥</text>
<text x="10476" y="5718" font-size="25px" fill="#354F62" font-weight="450">只让依赖已满足的动作运行。独立任务可并行；POI、路线与导</text>
<text x="10476" y="5754" font-size="25px" fill="#354F62" font-weight="450">航工具受其串行互斥约束，不机械并发。</text>
<rect x="10450" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="F5" />
<text x="10476" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">22.5 Adapter / 领域 Agent</text>
<text x="10476" y="6145" font-size="25px" fill="#203947" font-weight="450">自然语言指令 → 领域理解</text>
<text x="10476" y="6181" font-size="25px" fill="#203947" font-weight="450">工具内可再调 SFT/服务/SDK</text>
<text x="10476" y="6246" font-size="25px" fill="#354F62" font-weight="450">领域 Agent/Adapter 将任务参数继续解释成业务能力。内部</text>
<text x="10476" y="6282" font-size="25px" fill="#354F62" font-weight="450">可能再次使用模型，也可能查服务或调用 SDK，具体实现逐工具</text>
<text x="10476" y="6318" font-size="25px" fill="#354F62" font-weight="450">核验。</text>
<rect x="11290" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="F6" />
<text x="11316" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">22.6 车端或云服务执行</text>
<text x="11316" y="6145" font-size="25px" fill="#203947" font-weight="450">车控 / 导航 / 媒体 / 生态</text>
<text x="11316" y="6181" font-size="25px" fill="#203947" font-weight="450">下方 27 项逐个展开机制</text>
<text x="11316" y="6246" font-size="25px" fill="#354F62" font-weight="450">按能力走车端设备、云端服务或生态业务。下方工具区将每个入</text>
<text x="11316" y="6282" font-size="25px" fill="#354F62" font-weight="450">口展开为输入、内部处理和结果契约。</text>
<rect x="11290" y="6569" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="F7" />
<text x="11316" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">22.7 原始结果返回</text>
<text x="11316" y="6673" font-size="25px" fill="#203947" font-weight="450">受理/候选/成功/失败/处理中</text>
<text x="11316" y="6709" font-size="25px" fill="#203947" font-weight="450">接口成功不自动代表物理生效</text>
<text x="11316" y="6774" font-size="25px" fill="#354F62" font-weight="450">收集业务真实返回，区分 ACK、候选、异步进度、执行结果与状</text>
<text x="11316" y="6810" font-size="25px" fill="#354F62" font-weight="450">态回读。网络请求成功不等于用户目标实现。</text>
<rect x="10450" y="6569" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="F8" />
<text x="10476" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">22.8 形成 tool_feedback</text>
<text x="10476" y="6673" font-size="25px" fill="#203947" font-weight="450">当前 SP：tool_name + 结果文本</text>
<text x="10476" y="6709" font-size="25px" fill="#203947" font-weight="450">缺 action_id 等关联字段需补</text>
<text x="10476" y="6774" font-size="25px" fill="#354F62" font-weight="450">把结果整理为本轮工具反馈并关联原调用。当前 SP 的文本结果</text>
<text x="10476" y="6810" font-size="25px" fill="#354F62" font-weight="450">不能证明运行协议已有完整的状态码、幂等键或 action_id。</text>
<rect x="10450" y="7097" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="F9" />
<text x="10476" y="7140" font-size="30px" fill="#0D4FA8" font-weight="750">22.9 下一轮输入队列</text>
<text x="10476" y="7201" font-size="25px" fill="#203947" font-weight="450">保留所属用户/任务/调用关系</text>
<text x="10476" y="7237" font-size="25px" fill="#203947" font-weight="450">迟到、重复、取消后回报需处理</text>
<text x="10476" y="7302" font-size="25px" fill="#354F62" font-weight="450">携用户、轮次、任务和调用归属回统一输入管理。迟到、重复及</text>
<text x="10476" y="7338" font-size="25px" fill="#354F62" font-weight="450">已取消目标的结果，不能随意启动新一轮行动。</text>
<rect x="11290" y="7097" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="F10" />
<text x="11316" y="7140" font-size="30px" fill="#0D4FA8" font-weight="750">22.10 可重试还是停止？</text>
<text x="11316" y="7201" font-size="25px" fill="#203947" font-weight="450">查询可重试不代表订座可重试</text>
<text x="11316" y="7237" font-size="25px" fill="#203947" font-weight="450">确认副作用后重试或换方案</text>
<text x="11316" y="7302" font-size="25px" fill="#354F62" font-weight="450">先确认前次调用是否已经产生副作用，再决定查询状态、重试、</text>
<text x="11316" y="7338" font-size="25px" fill="#354F62" font-weight="450">补偿或停止。订座、呼叫等不能像只读查询一样盲重试。</text>
<rect x="11290" y="7625" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="F11" />
<text x="11316" y="7668" font-size="30px" fill="#0D4FA8" font-weight="750">22.11 标准状态协议缺口</text>
<text x="11316" y="7729" font-size="25px" fill="#203947" font-weight="450">缺状态码、可重试和任务关联</text>
<text x="11316" y="7765" font-size="25px" fill="#203947" font-weight="450">同名工具并行可能错绑</text>
<text x="11316" y="7830" font-size="25px" fill="#354F62" font-weight="450">验收关联、状态和错误语义是否足够定位结果。若只有工具名而</text>
<text x="11316" y="7866" font-size="25px" fill="#354F62" font-weight="450">同名工具并行，必须确认如何防错绑，不能默认已解决。</text>
<rect x="10450" y="7625" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="F12" />
<text x="10476" y="7668" font-size="30px" fill="#0D4FA8" font-weight="750">22.12 注册与示例不一致</text>
<text x="10476" y="7729" font-size="25px" fill="#203947" font-weight="450">示例出现未注册工具</text>
<text x="10476" y="7765" font-size="25px" fill="#203947" font-weight="450">goal_list_update 参数冲突</text>
<text x="10476" y="7830" font-size="25px" fill="#354F62" font-weight="450">逐轮核对注册工具、SP Schema 和示例是否一致。动态示例引</text>
<text x="10476" y="7866" font-size="25px" fill="#354F62" font-weight="450">用未注册工具或参数冲突，会稳定诱发错误调用。</text>
<rect x="250" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="V1" />
<text x="276" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">1 用户说话</text>
<text x="276" y="5089" font-size="25px" fill="#203947" font-weight="450">“我有点热，带我去昨天的游泳馆”</text>
<text x="276" y="5125" font-size="25px" fill="#203947" font-weight="450">输入：声音，不是完整文字</text>
<text x="276" y="5190" font-size="25px" fill="#354F62" font-weight="450">这时系统收到的是一段声音。“热”和“昨天的游泳馆”包含两</text>
<text x="276" y="5226" font-size="25px" fill="#354F62" font-weight="450">个目标，后面的每一层都不能只保留其中一个。</text>
<rect x="1090" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="V2" />
<text x="1116" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">2.1 麦克风/唤醒门控</text>
<text x="1116" y="5089" font-size="25px" fill="#203947" font-weight="450">权限、语音开关、唤醒/免唤醒</text>
<text x="1116" y="5125" font-size="25px" fill="#203947" font-weight="450">未开启：不能继续当成有效请求</text>
<text x="1116" y="5190" font-size="25px" fill="#354F62" font-weight="450">先检查语音功能、麦克风权限和当前唤醒方式。没进入有效交互</text>
<text x="1116" y="5226" font-size="25px" fill="#354F62" font-weight="450">时，不能把背景声音直接当作可执行指令。</text>
<rect x="1090" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="V3" />
<text x="1116" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">2.2 音频处理</text>
<text x="1116" y="5617" font-size="25px" fill="#203947" font-weight="450">回声消除、降噪、音区定位</text>
<text x="1116" y="5653" font-size="25px" fill="#203947" font-weight="450">区分播报声与用户说话</text>
<text x="1116" y="5718" font-size="25px" fill="#354F62" font-weight="450">音频前处理尽量去掉车噪和系统自己的播报声，并定位发声座位</text>
<text x="1116" y="5754" font-size="25px" fill="#354F62" font-weight="450">。音区错误会把正确动作施加到错误乘员。</text>
<rect x="250" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="V4" />
<text x="276" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">2.3 ASR 语音识别</text>
<text x="276" y="5617" font-size="25px" fill="#203947" font-weight="450">音频 → 增量文本/最终文本</text>
<text x="276" y="5653" font-size="25px" fill="#203947" font-weight="450">保留数字、否定、地点和人名</text>
<text x="276" y="5718" font-size="25px" fill="#354F62" font-weight="450">识别可能先产生增量文本，再形成最终文本。重点保护“不”、</text>
<text x="276" y="5754" font-size="25px" fill="#354F62" font-weight="450">温度数值、座位、地名；后端不能用流畅话术掩盖识别错误。</text>
<rect x="250" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="V5" />
<text x="276" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">2.4 说话人与位置</text>
<text x="276" y="6145" font-size="25px" fill="#203947" font-weight="450">音区 + face/身份/座位信息</text>
<text x="276" y="6181" font-size="25px" fill="#203947" font-weight="450">分清“我”是哪位乘员</text>
<text x="276" y="6246" font-size="25px" fill="#354F62" font-weight="450">把音区与可用身份信息关联。“来自主驾”不等于“已确认注册</text>
<text x="276" y="6282" font-size="25px" fill="#354F62" font-weight="450">账号”，未知身份不能随意读取某人的历史记忆。</text>
<rect x="1090" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="V6" />
<text x="1116" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">2.5 判停与多输入处理</text>
<text x="1116" y="6145" font-size="25px" fill="#203947" font-weight="450">VAD、续说、多人请求合并</text>
<text x="1116" y="6181" font-size="25px" fill="#203947" font-weight="450">先后次序与丢字会影响整条链</text>
<text x="1116" y="6246" font-size="25px" fill="#354F62" font-weight="450">判断一句话是否说完，避免把正常停顿当结束。续说、多人发声</text>
<text x="1116" y="6282" font-size="25px" fill="#354F62" font-weight="450">与云端推理中的新输入，后续交给交互节奏管理分别处理。</text>
<rect x="1090" y="6569" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="V7" />
<text x="1116" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">2.6 封装本轮输入</text>
<text x="1116" y="6673" font-size="25px" fill="#203947" font-weight="450">query / speaker_name / position</text>
<text x="1116" y="6709" font-size="25px" fill="#203947" font-weight="450">timestamp + 本轮会话关联</text>
<text x="1116" y="6774" font-size="25px" fill="#354F62" font-weight="450">将本轮文本、说话人、位置和时间交给后续入口。页面语音已消</text>
<text x="1116" y="6810" font-size="25px" fill="#354F62" font-weight="450">费的输入，要防止又作为普通请求重复执行。</text>
<rect x="250" y="6569" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="V8" />
<text x="276" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">2.7 用户再次发声/打断</text>
<text x="276" y="6673" font-size="25px" fill="#203947" font-weight="450">可能澄清、改目标、撤销动作</text>
<text x="276" y="6709" font-size="25px" fill="#203947" font-weight="450">判断是否取消任务是另一件事</text>
<text x="276" y="6774" font-size="25px" fill="#354F62" font-weight="450">用户再次发声可能只是补充，也可能改目标或要求取消。停止播</text>
<text x="276" y="6810" font-size="25px" fill="#354F62" font-weight="450">报、终止一次调用和删除长期任务必须分开判断。</text>
<rect x="250" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="D1" />
<text x="276" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">5.1 端侧 FC 模型</text>
<text x="276" y="9539" font-size="25px" fill="#203947" font-weight="450">文本 → 本地可执行动作候选</text>
<text x="276" y="9575" font-size="25px" fill="#203947" font-weight="450">补目标功能、位置与参数</text>
<text x="276" y="9640" font-size="25px" fill="#354F62" font-weight="450">端侧 FC 先理解简单本地指令并补齐对象、位置、数值。得到的</text>
<text x="276" y="9676" font-size="25px" fill="#354F62" font-weight="450">是候选，不是已发生的车辆状态。</text>
<rect x="1090" y="9435" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="D2" />
<text x="1116" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">6 命中快路白名单？</text>
<text x="1116" y="9539" font-size="25px" fill="#203947" font-weight="450">高频简单车控 + 合法动作</text>
<text x="1116" y="9575" font-size="25px" fill="#203947" font-weight="450">命中时优先端侧快速执行</text>
<text x="1116" y="9640" font-size="25px" fill="#354F62" font-weight="450">命中当前车型快路白名单且动作合法，才允许快速处理。未命中</text>
<text x="1116" y="9676" font-size="25px" fill="#354F62" font-weight="450">白名单不等于端模型没有结果，也不等于立刻放弃云端。</text>
<rect x="1090" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="D3" />
<text x="1116" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">6.1 未命中：等待云结果</text>
<text x="1116" y="10067" font-size="25px" fill="#203947" font-weight="450">有端候选也不立即抢执行</text>
<text x="1116" y="10103" font-size="25px" fill="#203947" font-weight="450">云端拒识/FC/Planner 分流</text>
<text x="1116" y="10168" font-size="25px" fill="#354F62" font-weight="450">保存端候选并等待云侧分流结果。等待期间仍要处理取消、状态</text>
<text x="1116" y="10204" font-size="25px" fill="#354F62" font-weight="450">变化与超时，不能让旧候选无限有效。</text>
<rect x="250" y="9963" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="D4" />
<text x="276" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">6.2 端云最终仲裁</text>
<text x="276" y="10067" font-size="25px" fill="#203947" font-weight="450">只执行选定结果；抑制迟到重复</text>
<text x="276" y="10103" font-size="25px" fill="#203947" font-weight="450">精确优先级/超时按车型核验</text>
<text x="276" y="10168" font-size="25px" fill="#354F62" font-weight="450">同一轮请求只选择一条结果获得执行权。端先完成、云后返回，</text>
<text x="276" y="10204" font-size="25px" fill="#354F62" font-weight="450">以及云先执行、端超时回调，都要防双执行。</text>
<rect x="250" y="10491" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="D5" />
<text x="276" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">7.1 端候选能力检查</text>
<text x="276" y="10595" font-size="25px" fill="#203947" font-weight="450">功能支持、参数范围、车态</text>
<text x="276" y="10631" font-size="25px" fill="#203947" font-weight="450">失败给明确原因</text>
<text x="276" y="10696" font-size="25px" fill="#354F62" font-weight="450">下发前核验本车型功能、参数范围和当前车态。车速、座位或设</text>
<text x="276" y="10732" font-size="25px" fill="#354F62" font-weight="450">备限制不满足时，应返回具体不执行原因。</text>
<rect x="1090" y="10491" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="D6" />
<text x="1116" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">7.2 原子动作送车端执行</text>
<text x="1116" y="10595" font-size="25px" fill="#203947" font-weight="450">不需要每次经过云端 Planner</text>
<text x="1116" y="10631" font-size="25px" fill="#203947" font-weight="450">也应同步真实结果和状态</text>
<text x="1116" y="10696" font-size="25px" fill="#354F62" font-weight="450">将已获准的原子动作送入车端适配接口。该本地路径可以绕过云</text>
<text x="1116" y="10732" font-size="25px" fill="#354F62" font-weight="450"> Planner，但不能绕过实际结果确认。</text>
<rect x="1090" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="D7" />
<text x="1116" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">6.3 云无结果时端兜底</text>
<text x="1116" y="11123" font-size="25px" fill="#203947" font-weight="450">端侧有有效候选 → 尝试执行</text>
<text x="1116" y="11159" font-size="25px" fill="#203947" font-weight="450">无候选 → 兜底反馈</text>
<text x="1116" y="11224" font-size="25px" fill="#354F62" font-weight="450">在云侧无可用结果时评估端候选兜底。查询/普通控制与高副作</text>
<text x="1116" y="11260" font-size="25px" fill="#354F62" font-weight="450">用行为不能共用未经确认的重试策略。</text>
<rect x="250" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="D8" />
<text x="276" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">8 本地结果形成闭环</text>
<text x="276" y="11123" font-size="25px" fill="#203947" font-weight="450">动作生效 + 必要卡片/话术</text>
<text x="276" y="11159" font-size="25px" fill="#203947" font-weight="450">不得只凭“模型理解了”报成功</text>
<text x="276" y="11224" font-size="25px" fill="#354F62" font-weight="450">接收本地执行结果，再生成必要话术、卡片与状态同步。听见“</text>
<text x="276" y="11260" font-size="25px" fill="#354F62" font-weight="450">已打开”不是证明车窗真正变化的证据。</text>
<rect x="2290" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="S1" />
<text x="2316" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">3 车/人/应用信号</text>
<text x="2316" y="9539" font-size="25px" fill="#203947" font-weight="450">车辆、导航、媒体、手动操作</text>
<text x="2316" y="9575" font-size="25px" fill="#203947" font-weight="450">事件与时间戳</text>
<text x="2316" y="9640" font-size="25px" fill="#354F62" font-weight="450">采集车辆、应用与乘员相关信号，区分快照、变化与人工操作。</text>
<text x="2316" y="9676" font-size="25px" fill="#354F62" font-weight="450">真实事件来自产品定义的数据源，不由模型凭空产生。</text>
<rect x="3130" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="S2" />
<text x="3156" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">4 端侧信号库</text>
<text x="3156" y="9539" font-size="25px" fill="#203947" font-weight="450">统一当前快照、增量更新</text>
<text x="3156" y="9575" font-size="25px" fill="#203947" font-weight="450">向 Context / 本地 Trigger 供给</text>
<text x="3156" y="9640" font-size="25px" fill="#354F62" font-weight="450">维护端侧当前值、更新时间与缺失状态。给本地条件供数，也按</text>
<text x="3156" y="9676" font-size="25px" fill="#354F62" font-weight="450">协议上报云端；这不是历史事件仓库。</text>
<rect x="3130" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="S3" />
<text x="3156" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">25A 按需 VQA 采图</text>
<text x="3156" y="10067" font-size="25px" fill="#203947" font-weight="450">用户视觉问题 → 选方向/对象</text>
<text x="3156" y="10103" font-size="25px" fill="#203947" font-weight="450">摄像头 → VLM 看图</text>
<text x="3156" y="10168" font-size="25px" fill="#354F62" font-weight="450">按用户问题选择有效摄像头与方向，采集本次画面。用户所指对</text>
<text x="3156" y="10204" font-size="25px" fill="#354F62" font-weight="450">象不在视野中时，应明确限制，不能编造图像内容。</text>
<rect x="2290" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="S4" />
<text x="2316" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">25A VQA 返回</text>
<text x="2316" y="10067" font-size="25px" fill="#203947" font-weight="450">识别结果 → visual_qa 反馈</text>
<text x="2316" y="10103" font-size="25px" fill="#203947" font-weight="450">再回 Planner 回答用户</text>
<text x="2316" y="10168" font-size="25px" fill="#354F62" font-weight="450">将图像观察作为本轮 visual_qa 的结果回给规划链。看见建筑</text>
<text x="2316" y="10204" font-size="25px" fill="#354F62" font-weight="450">不能直接得出实时票价，还需外部查询。</text>
<rect x="2290" y="10491" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="S5" />
<text x="2316" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">25B 默认 AlwaysOn</text>
<text x="2316" y="10595" font-size="25px" fill="#203947" font-weight="450">默认视觉观察 + OMS 标签</text>
<text x="2316" y="10631" font-size="25px" fill="#203947" font-weight="450">VLM → 端数据中心 → Context</text>
<text x="2316" y="10696" font-size="25px" fill="#354F62" font-weight="450">默认 AlwaysOn 将已覆盖场景的观察/标签供状态和 Context</text>
<text x="2316" y="10732" font-size="25px" fill="#354F62" font-weight="450">。未观察到成立，不代表系统缺少该感知能力。</text>
<rect x="3130" y="10491" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="S6" />
<text x="3156" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">25C 动态观察任务</text>
<text x="3156" y="10595" font-size="25px" fill="#203947" font-weight="450">Task 下发带 task_id 的观察</text>
<text x="3156" y="10631" font-size="25px" fill="#203947" font-weight="450">全量替换；最多 3 项</text>
<text x="3156" y="10696" font-size="25px" fill="#354F62" font-weight="450">任务侧维护完整观察列表并带 task_id 下发；该协议最多三项</text>
<text x="3156" y="10732" font-size="25px" fill="#354F62" font-weight="450">。仅传观察问题，后续业务动作不塞给视觉模型。</text>
<rect x="3130" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="S7" />
<text x="3156" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">25C 单任务观察返回</text>
<text x="3156" y="11123" font-size="25px" fill="#203947" font-weight="450">各 task 分开上报 → 云语义判断</text>
<text x="3156" y="11159" font-size="25px" fill="#203947" font-weight="450">不进入通用 Context</text>
<text x="3156" y="11224" font-size="25px" fill="#354F62" font-weight="450">动态观察结果按 task_id 独立返回并交云端判断，不进入通用</text>
<text x="3156" y="11260" font-size="25px" fill="#354F62" font-weight="450"> Context；旧任务结果迟到时要核对任务是否仍有效。</text>
<rect x="2290" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="S8" />
<text x="2316" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">25C AlwaysOn 关闭</text>
<text x="2316" y="11123" font-size="25px" fill="#203947" font-weight="450">拒绝新观察；下发 [] 清空</text>
<text x="2316" y="11159" font-size="25px" fill="#203947" font-weight="450">反馈任务不可用并停止观察</text>
<text x="2316" y="11224" font-size="25px" fill="#354F62" font-weight="450">AlwaysOn 关闭时拒收新观察并清理旧列表。任务方需得知能力</text>
<text x="2316" y="11260" font-size="25px" fill="#354F62" font-weight="450">不可用，不能继续对用户承诺持续观察。</text>
<rect x="14530" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="E1" />
<text x="14556" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">24.1 本地配置仓库</text>
<text x="14556" y="9539" font-size="25px" fill="#203947" font-weight="450">云同步规则、版本与适用范围</text>
<text x="14556" y="9575" font-size="25px" fill="#203947" font-weight="450">离线使用已生效配置</text>
<text x="14556" y="9640" font-size="25px" fill="#354F62" font-weight="450">保存已校验并生效的端侧规则版本，支持范围内离线运行。服务</text>
<text x="14556" y="9676" font-size="25px" fill="#354F62" font-weight="450">器已发布不等于本车已拿到。</text>
<rect x="15370" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="E2" />
<text x="15396" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">24.2 订阅索引</text>
<text x="15396" y="9539" font-size="25px" fill="#203947" font-weight="450">事件变化 → 找相关规则</text>
<text x="15396" y="9575" font-size="25px" fill="#203947" font-weight="450">信号来源统一接入信号库</text>
<text x="15396" y="9640" font-size="25px" fill="#354F62" font-weight="450">通过信号变化找到相关规则，减少无关计算。定时采快照与变化</text>
<text x="15396" y="9676" font-size="25px" fill="#354F62" font-weight="450">上报唤醒的职责必须分开。</text>
<rect x="15370" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="E3" />
<text x="15396" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">24.3 当前状态聚合</text>
<text x="15396" y="10067" font-size="25px" fill="#203947" font-weight="450">读取本地最新信号快照</text>
<text x="15396" y="10103" font-size="25px" fill="#203947" font-weight="450">避免拼出不同时刻的假条件</text>
<text x="15396" y="10168" font-size="25px" fill="#354F62" font-weight="450">读取条件涉及的当前状态和时间；多字段必须处理缺失、过期和</text>
<text x="15396" y="10204" font-size="25px" fill="#354F62" font-weight="450">时序差，避免拼出一个从未真实存在的场景。</text>
<rect x="14530" y="9963" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="E4" />
<text x="14556" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">24.4 规则表达式求值</text>
<text x="14556" y="10067" font-size="25px" fill="#203947" font-weight="450">结构化规则 → true / false</text>
<text x="14556" y="10103" font-size="25px" fill="#203947" font-weight="450">具体运行时/资源限制需核验</text>
<text x="14556" y="10168" font-size="25px" fill="#354F62" font-weight="450">计算结构表达式，区分成立、不成立和不可判断。执行周期、资</text>
<text x="14556" y="10204" font-size="25px" fill="#354F62" font-weight="450">源限制与持续时间能力按当前运行版本核验。</text>
<rect x="14530" y="10491" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="E5" />
<text x="14556" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">24.5 冲突/频控判断</text>
<text x="14556" y="10595" font-size="25px" fill="#203947" font-weight="450">多规则命中、优先级、冷却</text>
<text x="14556" y="10631" font-size="25px" fill="#203947" font-weight="450">与云端执行的仲裁策略待统一</text>
<text x="14556" y="10696" font-size="25px" fill="#354F62" font-weight="450">规则成立后处理冲突、频控与取消状态。不同版本的优先级数值</text>
<text x="14556" y="10732" font-size="25px" fill="#354F62" font-weight="450">不可合成一套万能规则。</text>
<rect x="15370" y="10491" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="E6" />
<text x="15396" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">24.6 本地任务管理</text>
<text x="15396" y="10595" font-size="25px" fill="#203947" font-weight="450">决定何时调用本地动作</text>
<text x="15396" y="10631" font-size="25px" fill="#203947" font-weight="450">具体能力按版本/落地情况核验</text>
<text x="15396" y="10696" font-size="25px" fill="#354F62" font-weight="450">生成或恢复本地业务执行，决定直接执行还是等待确认。任务管</text>
<text x="15396" y="10732" font-size="25px" fill="#354F62" font-weight="450">理不是简单地每次 true 就再调用一遍。</text>
<rect x="15370" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="E7" />
<text x="15396" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">24.7 本地 Function/UI/TTS</text>
<text x="15396" y="11123" font-size="25px" fill="#203947" font-weight="450">原子执行 / 本地卡片 / 播报</text>
<text x="15396" y="11159" font-size="25px" fill="#203947" font-weight="450">离线规则可走本地闭环</text>
<text x="15396" y="11224" font-size="25px" fill="#354F62" font-weight="450">按业务策略分别下发 Function、UI 或 TTS；需确认的卡片先</text>
<text x="15396" y="11260" font-size="25px" fill="#354F62" font-weight="450">等原业务回调，不能展示卡片同时偷偷完成动作。</text>
<rect x="14530" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="E8" />
<text x="14556" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">24.8 结果与日志</text>
<text x="14556" y="11123" font-size="25px" fill="#203947" font-weight="450">端侧状态反馈、规则执行记录</text>
<text x="14556" y="11159" font-size="25px" fill="#203947" font-weight="450">结果上云链路覆盖需核验</text>
<text x="14556" y="11224" font-size="25px" fill="#354F62" font-weight="450">记录命中、执行、失败和真实状态，再按协议同步上云。只有命</text>
<text x="14556" y="11260" font-size="25px" fill="#354F62" font-weight="450">中日志而没有执行结果，不能计为任务成功。</text>
<rect x="12490" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O1" />
<text x="12516" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">28.1 执行适配入口</text>
<text x="12516" y="5089" font-size="25px" fill="#203947" font-weight="450">FC 或工具下发的业务指令</text>
<text x="12516" y="5125" font-size="25px" fill="#203947" font-weight="450">车型 SDK / 应用 / 系统接口</text>
<text x="12516" y="5190" font-size="25px" fill="#354F62" font-weight="450">将获准的业务动作转交对应车型、应用或云服务执行。云 Plan</text>
<text x="12516" y="5226" font-size="25px" fill="#354F62" font-weight="450">ner、端 FC 和本地触发器可以从不同入口到这里。</text>
<rect x="13330" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O2" />
<text x="13356" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">28.2 真实业务动作</text>
<text x="13356" y="5089" font-size="25px" fill="#203947" font-weight="450">空调 / 车窗 / 导航 / 媒体</text>
<text x="13356" y="5125" font-size="25px" fill="#203947" font-weight="450">设备/服务实际发生变化</text>
<text x="13356" y="5190" font-size="25px" fill="#354F62" font-weight="450">实际改变空调、导航、媒体或外部业务状态。这里才产生用户关</text>
<text x="13356" y="5226" font-size="25px" fill="#354F62" font-weight="450">心的行为效果，与页面动画不是同一事件。</text>
<rect x="13330" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O3" />
<text x="13356" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">28.3 回执与状态核对</text>
<text x="13356" y="5617" font-size="25px" fill="#203947" font-weight="450">受理 ACK、执行结果、实际状态</text>
<text x="13356" y="5653" font-size="25px" fill="#203947" font-weight="450">按来源回云工具或本地闭环</text>
<text x="13356" y="5689" font-size="25px" fill="#203947" font-weight="450">回读覆盖与失败判定需核验</text>
<text x="13356" y="5754" font-size="25px" fill="#354F62" font-weight="450">核对受理回执、业务结果与适用的状态回读。按来源回云工具或</text>
<text x="13356" y="5790" font-size="25px" fill="#354F62" font-weight="450">本地链；回读覆盖不足的能力要单独标明证据边界。</text>
<rect x="14530" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O4" />
<text x="14556" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">26.1 话术与播报</text>
<text x="14556" y="5089" font-size="25px" fill="#203947" font-weight="450">Planner talk_content → TTS</text>
<text x="14556" y="5125" font-size="25px" fill="#203947" font-weight="450">部分下游自己播报，须去重</text>
<text x="14556" y="5190" font-size="25px" fill="#354F62" font-weight="450">根据确定状态生成并播放适当话术；区分首字、首播和播放完成</text>
<text x="14556" y="5226" font-size="25px" fill="#354F62" font-weight="450">。领域工具也可能播报，需要避免两处重复说。</text>
<rect x="15370" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O5" />
<text x="15396" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">26.2 卡片/屏幕反馈</text>
<text x="15396" y="5089" font-size="25px" fill="#203947" font-weight="450">候选、进度、实际显示与失败</text>
<text x="15396" y="5125" font-size="25px" fill="#203947" font-weight="450">模板卡片；生成界面按方案 / 车型</text>
<text x="15396" y="5190" font-size="25px" fill="#354F62" font-weight="450">用模板或生成界面展示候选、进度与结果。页面被请求、排队、</text>
<text x="15396" y="5226" font-size="25px" fill="#354F62" font-weight="450">实际显示、被覆盖和关闭是不同状态。</text>
<rect x="15370" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O6" />
<text x="15396" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">27 数字人/形象反馈</text>
<text x="15396" y="5617" font-size="25px" fill="#203947" font-weight="450">表情、动作、音区/屏幕协同</text>
<text x="15396" y="5653" font-size="25px" fill="#203947" font-weight="450">数字人不是所有车控必经节点</text>
<text x="15396" y="5718" font-size="25px" fill="#354F62" font-weight="450">按表达指令协调数字人、机器人或灯效。它们是交互通道，不是</text>
<text x="15396" y="5754" font-size="25px" fill="#354F62" font-weight="450">所有车控必须先经过的执行器。</text>
<rect x="14530" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O7" />
<text x="14556" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">23.1 任务中心视图</text>
<text x="14556" y="5617" font-size="25px" fill="#203947" font-weight="450">待办 / 进行中 / 任务记录</text>
<text x="14556" y="5653" font-size="25px" fill="#203947" font-weight="450">业务方状态驱动 UI，UI 不编排</text>
<text x="14556" y="5718" font-size="25px" fill="#354F62" font-weight="450">从真实 TaskView 或业务状态构建任务中心。前端展示等待/运</text>
<text x="14556" y="5754" font-size="25px" fill="#354F62" font-weight="450">行/记录，不能凭卡片点击自行宣布任务关闭。</text>
<rect x="14530" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O8" />
<text x="14556" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">23.2 任务中心操作</text>
<text x="14556" y="6145" font-size="25px" fill="#203947" font-weight="450">操作事件回业务方或 Task</text>
<text x="14556" y="6181" font-size="25px" fill="#203947" font-weight="450">取消/删除能力按版本；不混状态</text>
<text x="14556" y="6246" font-size="25px" fill="#354F62" font-weight="450">把接受、取消、查询等交回正确任务或业务。删除记录、取消当</text>
<text x="14556" y="6282" font-size="25px" fill="#354F62" font-weight="450">前执行和取消长期任务不是同一个操作。</text>
<rect x="15370" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O9" />
<text x="15396" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">29 用户获得真实结果</text>
<text x="15396" y="6145" font-size="25px" fill="#203947" font-weight="450">听到、看到、实际状态一致</text>
<text x="15396" y="6181" font-size="25px" fill="#203947" font-weight="450">未完成部分清楚告知</text>
<text x="15396" y="6246" font-size="25px" fill="#354F62" font-weight="450">用户听见、看见以及业务实际发生的事情应一致。部分成功要说</text>
<text x="15396" y="6282" font-size="25px" fill="#354F62" font-weight="450">明剩余目标，等待时要说明在等什么。</text>
<rect x="15370" y="6569" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="O10" />
<text x="15396" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">29.1 完成判定</text>
<text x="15396" y="6673" font-size="25px" fill="#203947" font-weight="450">“受理成功”≠“操作已生效”</text>
<text x="15396" y="6709" font-size="25px" fill="#203947" font-weight="450">“一个动作成功”≠“整个目标完成”</text>
<text x="15396" y="6774" font-size="25px" fill="#354F62" font-weight="450">分别确认每个动作与完整目标是否完成。“调用成功”不能替代</text>
<text x="15396" y="6810" font-size="25px" fill="#354F62" font-weight="450">“导航已启动”，“已启动导航”也不能替代“到达目的地”。</text>
<rect x="14530" y="6569" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O11" />
<text x="14556" y="6612" font-size="30px" fill="#0D4FA8" font-weight="750">29.2 用户追问或改主意</text>
<text x="14556" y="6673" font-size="25px" fill="#203947" font-weight="450">重新入语音/交互入口</text>
<text x="14556" y="6709" font-size="25px" fill="#203947" font-weight="450">带已完成动作与未完目标</text>
<text x="14556" y="6774" font-size="25px" fill="#354F62" font-weight="450">追问、改意图和补充选择进入本轮输入链，并带上已有结果。重</text>
<text x="14556" y="6810" font-size="25px" fill="#354F62" font-weight="450">复明确控车请求是新请求，不拿历史成功代替本轮执行。</text>
<rect x="14530" y="7097" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="O12" />
<text x="14556" y="7140" font-size="30px" fill="#0D4FA8" font-weight="750">29.3 失败也要有出口</text>
<text x="14556" y="7201" font-size="25px" fill="#203947" font-weight="450">无法执行/信息不足/等待中</text>
<text x="14556" y="7237" font-size="25px" fill="#203947" font-weight="450">告诉原因与可行下一步</text>
<text x="14556" y="7302" font-size="25px" fill="#354F62" font-weight="450">无法理解、能力不支持、状态不满足或执行失败时，都有可见出</text>
<text x="14556" y="7338" font-size="25px" fill="#354F62" font-weight="450">口。解释真实原因或可行选择，不无限循环和假报成功。</text>
<rect x="250" y="13435" width="2230" height="220" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="IN0" />
<text x="276" y="13478" font-size="30px" fill="#0D4FA8" font-weight="750">工具选择入口</text>
<text x="276" y="13539" font-size="25px" fill="#203947" font-weight="450">只有 action_list 选中本项时，才进入该行</text>
<rect x="250" y="13785" width="696.6666666666666" height="530" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="T1" />
<text x="276" y="13828" font-size="30px" fill="#0D4FA8" font-weight="750">1. 车辆基础控制</text>
<text x="276" y="13889" font-size="25px" fill="#203947" font-weight="450">vehicle_basic_control</text>
<text x="276" y="13925" font-size="25px" fill="#203947" font-weight="450">明确功能、位置、目标值</text>

<text x="15259.333333333334" y="15326" font-size="25px" fill="#354F62" font-weight="450">将查到的事实/候选交回原调用；无结果、过期或不确定要</text>
<text x="15259.333333333334" y="15362" font-size="25px" fill="#354F62" font-weight="450">明确返回。</text>
<rect x="13700" y="15735" width="2230" height="401" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="M5" />
<text x="13726" y="15778" font-size="30px" fill="#0D4FA8" font-weight="750">本轮视觉、默认感知、动态观察：三条不同路径</text>
<text x="13726" y="15839" font-size="25px" fill="#203947" font-weight="450">按需 VQA：用户问“那是什么” → visual_qa → 采图 → 看图 → 工具反馈。</text>
<text x="13726" y="15875" font-size="25px" fill="#203947" font-weight="450">默认 AlwaysOn：持续产生默认场景观察，经端数据中心进入 Context。</text>
<text x="13726" y="15911" font-size="25px" fill="#203947" font-weight="450">动态 watch：云 Task 下发 task_id + 纯观察问题 → 单任务结果单独上报。</text>
<text x="13726" y="15947" font-size="25px" fill="#203947" font-weight="450">动态观察结果不进通用 Context；云端语义 Y/N 后才形成条件回调。</text>
<text x="13726" y="15983" font-size="25px" fill="#203947" font-weight="450">最多 3 个动态观察任务；采用全量列表替换。</text>
<text x="13726" y="16019" font-size="25px" fill="#203947" font-weight="450">AlwaysOn 关闭时拒收新动态任务并清空旧任务，不能悄悄一直观察。</text>
<text x="13726" y="16055" font-size="25px" fill="#203947" font-weight="450">旧 goal_list_update 与新 task_manage 属于不同版本口径，不合并成 28 个已上线工具。</text>
<rect x="13700" y="16236" width="2230" height="220" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="OUT5" />
<text x="13726" y="16279" font-size="30px" fill="#0D4FA8" font-weight="750">返回统一反馈入口</text>
<text x="13726" y="16340" font-size="25px" fill="#203947" font-weight="450">成功 / 失败 / 候选待选 / 处理中；保留调用关系</text>
<rect x="250" y="18820" width="3775" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="Z1" />
<text x="276" y="18863" font-size="30px" fill="#0D4FA8" font-weight="750">① 输入/路由</text>
<text x="276" y="18924" font-size="25px" fill="#203947" font-weight="450">“我”=主驾；“昨天”=历史事实</text>
<text x="276" y="18960" font-size="25px" fill="#203947" font-weight="450">需记忆与推理 → 云端 Planner</text>
<text x="276" y="19025" font-size="25px" fill="#354F62" font-weight="450">把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的明确请求。</text>
<rect x="4105" y="18820" width="3775" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="Z2" />
<text x="4131" y="18863" font-size="30px" fill="#0D4FA8" font-weight="750">② 并行补齐</text>
<text x="4131" y="18924" font-size="25px" fill="#203947" font-weight="450">车控/查车况 + 查询历史地点</text>
<text x="4131" y="18960" font-size="25px" fill="#203947" font-weight="450">先有依据才能调温和选目的地</text>
<text x="4131" y="19025" font-size="25px" fill="#354F62" font-weight="450">查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。</text>
<rect x="4105" y="19348" width="3775" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="Z3" />
<text x="4131" y="19391" font-size="30px" fill="#0D4FA8" font-weight="750">③ 等依赖/问用户</text>
<text x="4131" y="19452" font-size="25px" fill="#203947" font-weight="450">记忆返回两个游泳馆 → 请选</text>
<text x="4131" y="19488" font-size="25px" fill="#203947" font-weight="450">没有结果 → 问名称，不编地址</text>
<text x="4131" y="19553" font-size="25px" fill="#354F62" font-weight="450">查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。</text>
<rect x="250" y="19348" width="3775" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="Z4" />
<text x="276" y="19391" font-size="30px" fill="#0D4FA8" font-weight="750">④ 串行执行</text>
<text x="276" y="19452" font-size="25px" fill="#203947" font-weight="450">具体 POI → route_planning</text>
<text x="276" y="19488" font-size="25px" fill="#203947" font-weight="450">选路线后按工具契约自动导航</text>
<text x="276" y="19553" font-size="25px" fill="#354F62" font-weight="450">把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返回的结果。</text>
<rect x="250" y="19876" width="3775" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="Z5" />
<text x="276" y="19919" font-size="30px" fill="#0D4FA8" font-weight="750">⑤ 分目标确认</text>
<text x="276" y="19980" font-size="25px" fill="#203947" font-weight="450">降温是否生效？导航是否开始？</text>
<text x="276" y="20016" font-size="25px" fill="#203947" font-weight="450">只完成一项时，不能说都完成</text>
<text x="276" y="20081" font-size="25px" fill="#354F62" font-weight="450">根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。</text>
<rect x="8360" y="18820" width="3905" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="L1" />
<text x="8386" y="18863" font-size="30px" fill="#0D4FA8" font-weight="750">主责模块：定位与验收</text>
<text x="8386" y="18924" font-size="25px" fill="#203947" font-weight="450">Planner / Trigger：能解释决策</text>
<text x="8386" y="18960" font-size="25px" fill="#203947" font-weight="450">看真实 Trace 分清根因</text>
<text x="8386" y="18996" font-size="25px" fill="#203947" font-weight="450">提出改法、指标、回归集并验收</text>
<rect x="12345" y="18820" width="3905" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="L2" />
<text x="12371" y="18863" font-size="30px" fill="#0D4FA8" font-weight="750">相邻模块：契约与边界</text>
<text x="12371" y="18924" font-size="25px" fill="#203947" font-weight="450">ASR / VLM / Tool / HMI：</text>
<text x="12371" y="18960" font-size="25px" fill="#203947" font-weight="450">说清输入输出、错误表现与责任</text>
<text x="12371" y="18996" font-size="25px" fill="#203947" font-weight="450">不要求自己写全部模型或 SDK</text>
<rect x="12345" y="19348" width="3905" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="L3" />
<text x="12371" y="19391" font-size="30px" fill="#0D4FA8" font-weight="750">AI 能力：能让真实目标做成</text>
