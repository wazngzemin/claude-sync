<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="t2-overview" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t2-overview-title t2-overview-desc">
<title id="t2-overview-title">一句以后才办的话，怎样等到、送回、办完</title><desc id="t2-overview-desc">赛力斯主驾 15:00 说“三十分钟后提醒我去接小宝”；任务系统接下等待，15:30 再交回 Planner。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="t2-overview-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一句以后才办的话，怎样等到、送回、办完</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">赛力斯主驾 15:00 说“三十分钟后提醒我去接小宝”；任务系统接下等待，15:30 再交回 Planner。</text>
<g data-node="true" id="t2-overview-speech"><rect class="v56-local" x="40" y="180" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="208" text-anchor="start">主驾说出目标</text>
<text class="v56-node-sub" x="54" y="236" text-anchor="start">“三十分钟后提醒我</text>
<text class="v56-node-sub" x="54" y="260" text-anchor="start">去接小宝”</text>
</g>
<g data-node="true" id="t2-overview-entry"><rect class="v56-cloud" x="435" y="180" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="208" text-anchor="start">任务入口工具</text>
<text class="v56-node-sub" x="449" y="236" text-anchor="start">Planner 只交原话</text>
<text class="v56-node-sub" x="449" y="260" text-anchor="start">可附运行提示</text>
</g>
<path class="v56-arrow" d="M 370 250 L 435 250" marker-end="url(#t2-overview-arr)"/>
<g data-node="true" id="t2-overview-save"><rect class="v56-cloud" x="830" y="180" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="208" text-anchor="start">任务服务</text>
<text class="v56-node-sub" x="844" y="236" text-anchor="start">识别新增、完成检查</text>
<text class="v56-node-sub" x="844" y="260" text-anchor="start">先保存任务</text>
</g>
<path class="v56-arrow" d="M 765 250 L 830 250" marker-end="url(#t2-overview-arr)"/>
<g data-node="true" id="t2-overview-register"><rect class="v56-cloud" x="830" y="390" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="418" text-anchor="start">登记等待条件</text>
<text class="v56-node-sub" x="844" y="446" text-anchor="start">交给触发器（G 章）</text>
<text class="v56-node-sub" x="844" y="470" text-anchor="start">等到 15:30</text>
</g>
<path class="v56-arrow" d="M 995 320 L 995 390" marker-end="url(#t2-overview-arr)"/>
<g data-node="true" id="t2-overview-callback"><rect class="v56-cloud" x="435" y="390" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="418" text-anchor="start">15:30 触发回调</text>
<text class="v56-node-sub" x="449" y="446" text-anchor="start">触发器通知任务服务</text>
<text class="v56-node-sub" x="449" y="470" text-anchor="start">带任务与回调编号</text>
</g>
<path class="v56-arrow" d="M 830 460 L 765 460" marker-end="url(#t2-overview-arr)"/>
<g data-node="true" id="t2-overview-run"><rect class="v56-decision" x="40" y="390" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="418" text-anchor="start">执行前检查</text>
<text class="v56-node-sub" x="54" y="446" text-anchor="start">通过后生成一次运行</text>
<text class="v56-node-sub" x="54" y="470" text-anchor="start">保留这次执行的身份</text>
</g>
<path class="v56-arrow" d="M 435 460 L 370 460" marker-end="url(#t2-overview-arr)"/>
<g data-node="true" id="t2-overview-return"><rect class="v56-local" x="40" y="600" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="628" text-anchor="start">建议回到 Planner</text>
<text class="v56-node-sub" x="54" y="656" text-anchor="start">车端上行后进入</text>
<text class="v56-node-sub" x="54" y="680" text-anchor="start">输入管理排队（M 章）</text>
</g>
<path class="v56-arrow" d="M 205 530 L 205 600" marker-end="url(#t2-overview-arr)"/>
<g data-node="true" id="t2-overview-planner"><rect class="v56-decision" x="435" y="600" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="628" text-anchor="start">Planner 决定</text>
<text class="v56-node-sub" x="449" y="656" text-anchor="start">结合当时情况</text>
<text class="v56-node-sub" x="449" y="680" text-anchor="start">决定说什么、做什么</text>
</g>
<path class="v56-arrow" d="M 370 670 L 435 670" marker-end="url(#t2-overview-arr)"/>
<g data-node="true" id="t2-overview-write"><rect class="v56-cloud" x="830" y="600" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="628" text-anchor="start">结果回写</text>
<text class="v56-node-sub" x="844" y="656" text-anchor="start">按运行身份写回</text>
<text class="v56-node-sub" x="844" y="680" text-anchor="start">单次成功后关闭任务</text>
</g>
<path class="v56-arrow" d="M 765 670 L 830 670" marker-end="url(#t2-overview-arr)"/>
<path class="v56-rule" d="M 995 180 L 995 130 L 1160 130" marker-end="url(#t2-overview-arr)"/>
<text class="v56-label" x="620" y="112" text-anchor="start">车端状态同步：任务消息 / 上电补查</text>
<text class="v56-label" x="32" y="780" text-anchor="start">主线：保存 → 等到 → 回流 → 执行 → 记结果</text>
<path class="v56-rule" d="M 32 802 L 1168 802"/>
<text class="v56-node-title" x="32" y="838" text-anchor="start">任务系统负责记住和送回来，Planner 负责到点那一刻怎么办。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="866" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="880" text-anchor="start">蓝：车上输入与建议回流</text>
<rect data-decoration="true" class="v56-cloud" x="410.6666666666667" y="866" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="880" text-anchor="start">绿：任务保存、等待与回写</text>
<rect data-decoration="true" class="v56-decision" x="789.3333333333334" y="866" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="880" text-anchor="start">黄：执行前检查与当下决策</text>
</svg>
