<svg xmlns="http://www.w3.org/2000/svg" width="930" height="2778" viewBox="0 0 930 2778" role="img" aria-label="能力准入与 Agent 协议"><title>能力准入与 Agent 协议</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M630,226 L630,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="533" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="538" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="538" dy="0">定义关联实现</tspan></text><path d="M630,644 L630,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="533" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="538" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="538" dy="0">完成接入配置</tspan></text><path d="M630,1062 L630,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="488" y="1158" width="145" height="44" rx="3" fill="#fff"/><text x="493" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="493" dy="0">已发布实现参与运行</tspan></text><path d="M630,1480 L630,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="488" y="1576" width="145" height="44" rx="3" fill="#fff"/><text x="493" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="493" dy="0">选中工具并生成参数</tspan></text><path d="M695,1898 L695,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="693" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="698" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="698" dy="0">能够处理</tspan></text><path d="M695,2316 L695,2552" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="478" y="2412" width="220" height="44" rx="3" fill="#fff"/><text x="483" y="2436" font-size="15" fill="#435c70" font-weight="400"><tspan x="483" dy="0">is_finish=true</tspan></text><path d="M565,1898 L565,1936 L235,1936 L235,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">不能处理</tspan></text><a href="#module/F/step/F-1"><g data-step="F-1"><rect x="435" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">F-1</tspan></text><text x="455" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">定义工具做什么</tspan></text><text x="455" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">能力维护方</tspan></text><text x="455" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">Agent 定义</tspan></text></g></a><a href="#module/F/step/F-2"><g data-step="F-2"><rect x="435" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">F-2</tspan></text><text x="455" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">绑定渠道并配置实现</tspan></text><text x="455" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">接入方</tspan></text><text x="455" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">渠道实现及调用合同</tspan></text></g></a><a href="#module/F/step/F-3"><g data-step="F-3"><rect x="435" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">F-3</tspan></text><text x="455" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">调通后发布并启用</tspan></text><text x="455" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">接入方 / 测试</tspan></text><text x="455" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">对应渠道启用且已发布的实现</tspan></text></g></a><a href="#module/F/step/F-4"><g data-step="F-4"><rect x="435" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">F-4</tspan></text><text x="455" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">只按本轮可用能力作决定</tspan></text><text x="455" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">工具配置加载 / Director</tspan></text><text x="455" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">本轮工具调用</tspan></text></g></a><a href="#module/F/step/F-5"><g data-step="F-5"><rect x="435" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">F-5</tspan></text><text x="455" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">携带请求和上下文调用 Agent</tspan></text><text x="455" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">座舱服务</tspan></text><text x="455" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">Agent 收到请求</tspan></text></g></a><a href="#module/F/step/F-6"><g data-step="F-6"><rect x="500" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">F-6</tspan></text><text x="520" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">分别返回展示内容与模型结果</tspan></text><text x="520" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">Agent</tspan></text><text x="520" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">展示帧、卡片或模型结果</tspan></text></g></a><a href="#module/F/step/F-7"><g data-step="F-7"><rect x="500" y="2552" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="2552" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="2581" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">F-7</tspan></text><text x="520" y="2613" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">以结束帧结束本次调用</tspan></text><text x="520" y="2655" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">Agent / 座舱服务</tspan></text><text x="520" y="2694" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">完整工具结果</tspan></text></g></a><a href="#module/F/step/F-8"><g data-step="F-8"><rect x="40" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">F-8</tspan></text><text x="60" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">无法处理时返回降级命令</tspan></text><text x="60" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">Agent / 座舱服务</tspan></text><text x="60" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">明确的无法处理信号</tspan></text></g></a></g></svg>