<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2010" viewBox="0 0 1660 2010">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="2010" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">从输入到结果的运行主链路</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">按账号核对资格，保留原请求，只有条件满足才发出建议</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">接收相关输入</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">用户对话、工具反馈或业务事件</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">带上来源、账号、当前请求和场景版本</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">账号与当前对象能否准确关联？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">区分登录账号、当前乘客与车辆</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不把无记录当成从未使用</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">无法归属</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">退出本次主动引导</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">原请求照常处理</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">可以</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">该功能是否仍有引导资格？</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">核对使用、拒绝、次数、启停与有效范围</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">按账号读取功能档案</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">无需引导／无法判断</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不生成建议</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">保留明确原因</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">有资格</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">选择场景所需判断</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">语义场景判断相关性，必要时取近期语境</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">事件或工具入口不强制重复语义判断</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="997" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">本场景组合条件是否全部成立？</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">检查身份、同步、功能可用性等真实条件</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">同一功能的并发入口在此去重</text><line x1="1020" y1="1065.0" x2="1186" y2="1065.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1052.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="997" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1037" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">条件未满足／未知</text><text x="1218" y="1075" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">结束本次机会</text><text x="1218" y="1106" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不扣成功次数</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1173.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">成立</text><rect x="100" y="1200" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">向 DT 发出可关联的引导建议</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">携带引导目的、依据与动作限制</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">与原用户请求一并处理</text><line x1="560.0" y1="1338" x2="560.0" y2="1399" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1403" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1443" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">是否赶上 DT 可接受的处理窗口？</text><text x="128" y="1481" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">实际交接机制需与 DT 确认</text><text x="128" y="1512" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不假定能够随时重启推理</text><line x1="1020" y1="1471.0" x2="1186" y2="1471.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1458.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="1403" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1443" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">未采用／已经过时</text><text x="1218" y="1481" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">结束旧建议</text><text x="1218" y="1512" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不跨话题补播</text><line x1="560.0" y1="1541" x2="560.0" y2="1602" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1579.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">采用</text><rect x="100" y="1606" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1646" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 执行并产生真实结果</text><text x="128" y="1684" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">回复、action_list、tool_feedback、端侧交互</text><text x="128" y="1715" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">功能操作按真实成功与失败处理</text><line x1="560.0" y1="1744" x2="560.0" y2="1805" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1809" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1849" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 更新阶段记录与账号档案</text><text x="128" y="1887" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">只在评审选定的阶段计次</text><text x="128" y="1918" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">达到结束条件后停止该引导实例</text>
</svg>