dy="0">floor、position 等泊车信息</tspan></text></g></a><a href="#module/DR/step/DR04"><g data-step="DR04"><rect x="653" y="2970" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="653" y="2970" width="5" height="182" rx="2" fill="#326785"/><text x="673" y="2999" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="673" dy="0">DR04</tspan></text><text x="673" y="3031" font-size="20" fill="#203b50" font-weight="600"><tspan x="673" dy="0">缓存泊车条件并搜索目的地</tspan></text><text x="673" y="3073" font-size="16" fill="#375b71" font-weight="400"><tspan x="673" dy="0">AI Navi</tspan></text><text x="673" y="3112" font-size="16" fill="#566975" font-weight="400"><tspan x="673" dy="0">POI 候选与保留的泊车约束</tspan></text></g></a><a href="#module/DR/step/DR05"><g data-step="DR05"><rect x="588" y="3388" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="588" y="3388" width="5" height="182" rx="2" fill="#326785"/><text x="608" y="3417" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="608" dy="0">DR05</tspan></text><text x="608" y="3449" font-size="20" fill="#203b50" font-weight="600"><tspan x="608" dy="0">完成地点与路线选择</tspan></text><text x="608" y="3491" font-size="16" fill="#375b71" font-weight="400"><tspan x="608" dy="0">用户 + Director + AI Navi</tspan></text><text x="608" y="3530" font-size="16" fill="#566975" font-weight="400"><tspan x="608" dy="0">已选目的地、路线、泊车条件</tspan></text></g></a><a href="#module/DR/step/DR06"><g data-step="DR06"><rect x="232" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="232" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="252" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="252" dy="0">DR06</tspan></text><text x="252" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="252" dy="0">组装任务并匹配目标车位</tspan></text><text x="252" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="252" dy="0">系统导航泊车 App</tspan></text><text x="252" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="252" dy="0">匹配成功，或无图/有图无目标车位</tspan></text></g></a><a href="#module/DR/step/DR07"><g data-step="DR07"><rect x="653" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="653" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="673" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="673" dy="0">DR07</tspan></text><text x="673" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="673" dy="0">接收可执行任务并返回实际状态</tspan></text><text x="673" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="673" dy="0">智驾域 ADC</tspan></text><text x="673" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="673" dy="0">智驾执行与结果反馈</tspan></text></g></a><a href="#module/DR/step/DR08"><g data-step="DR08"><rect x="653" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="653" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="673" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="673" dy="0">DR08</tspan></text><text x="673" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="673" dy="0">无图时确认替代目标</tspan></text><text x="673" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="673" dy="0">Director + 用户</tspan></text><text x="673" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="673" dy="0">用户对替代任务的明确选择</tspan></text></g></a><a href="#module/DR/step/DR09"><g data-step="DR09"><rect x="193" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="193" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="213" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="213" dy="0">DR09</tspan></text><text x="213" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="213" dy="0">有图却无目标车位时重新选位</tspan></text><text x="213" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="213" dy="0">泊车地图界面 + 用户</tspan></text><text x="213" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="213" dy="0">用户新选车位及更新后的背景</tspan></text></g></a><a href="#module/DR/step/DR10"><g data-step="DR10"><rect x="653" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="653" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="673" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="673" dy="0">DR10</tspan></text><text x="673" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="673" dy="0">把进展交回对话</tspan></text><text x="673" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="673" dy="0">工具反馈 → Director</tspan></text><text x="673" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="673" dy="0">与当前任务一致的结果说明</tspan></text></g></a></g></svg>