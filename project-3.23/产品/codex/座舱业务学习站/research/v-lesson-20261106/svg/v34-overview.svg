<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-label="一句话从开口到 DT 开始思考：12 个步骤"><title>一句话从开口到 DT 开始思考：12 个步骤</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="1600" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">一句话从开口到 DT 开始思考：12 个步骤</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左列是车上发生的事，右列是云端发生的事；按编号从上往下读</text><rect x="30" y="92" width="560" height="1480" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上（麦克风、车机、车上小模型）</text><rect x="610" y="92" width="560" height="1480" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="624" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端（座舱云服务、语音识别、DT）</text><rect x="50" y="130" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="152" r="12" fill="#4f7ea9"/><text x="70" y="157" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="90" y="157" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">麦克风收音，记下是谁在说</text><text x="64" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">声音边说边往云端送</text><text x="64" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上同时开始计停顿</text><rect x="630" y="250" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="272" r="12" fill="#4a9670"/><text x="650" y="277" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="670" y="277" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">先告诉识别服务：这辆车常说哪些名字</text><text x="644" y="302" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">联系人、地名、歌名等“热词”</text><text x="644" y="323" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">让专有名词更容易写对</text><rect x="630" y="370" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="392" r="12" fill="#4a9670"/><text x="650" y="397" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="670" y="397" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">第一遍识别：边听边出字</text><text x="644" y="422" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“带我去”→“带我去昨天那家游泳馆”</text><text x="644" y="443" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这些字还会变，不能拿去执行</text><rect x="50" y="490" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="512" r="12" fill="#4f7ea9"/><text x="70" y="517" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="90" y="517" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">豆包正在说话时：要不要马上闭嘴</text><text x="64" y="542" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">端侧 1.7B 用还没说完的字快速判断</text><text x="64" y="563" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">赛力斯车上跑，上汽放云端服务器跑</text><rect x="50" y="610" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="632" r="12" fill="#4f7ea9"/><text x="70" y="637" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="90" y="637" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">停顿 300 毫秒：先送去提前准备</text><text x="64" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">把当前这句话先送去云端</text><text x="64" y="683" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户接着说，可以送好几次</text><rect x="630" y="730" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="752" r="12" fill="#4a9670"/><text x="650" y="757" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="670" y="757" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">提前判断“是不是找豆包”、想干什么</text><text x="644" y="782" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只准备，不执行、不播报</text><text x="644" y="803" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">准备结果先存着</text><rect x="50" y="850" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="872" r="12" fill="#4f7ea9"/><text x="70" y="877" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="90" y="877" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">停顿 600 毫秒：确认说完</text><text x="64" y="902" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这段话收尾</text><text x="64" y="923" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">从最后一个字开始算，不是 300+600</text><rect x="630" y="970" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="992" r="12" fill="#4a9670"/><text x="650" y="997" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">8</text><text x="670" y="997" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">第二遍识别：给出定稿文字</text><text x="644" y="1022" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">整段录音再认真识别一次</text><text x="644" y="1043" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">纠正第一遍的错字</text><rect x="50" y="1090" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="1112" r="12" fill="#4f7ea9"/><text x="70" y="1117" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">9</text><text x="90" y="1117" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上自己也在算：能不能直接办</text><text x="64" y="1142" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用车上自己识别的文字，不等云端定稿</text><text x="64" y="1163" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">固定说法可直接执行；小模型结果先放着</text><rect x="630" y="1210" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="1232" r="12" fill="#4a9670"/><text x="650" y="1237" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">10</text><text x="670" y="1237" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">正式提交：能复用的直接用</text><text x="644" y="1262" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">定稿和上次准备的字一模一样才复用</text><text x="644" y="1283" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">再最终判断一次“是不是找豆包”</text><rect x="630" y="1330" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="1352" r="12" fill="#4a9670"/><text x="650" y="1357" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">11</text><text x="670" y="1357" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">带上背景，交给 DT</text><text x="644" y="1382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">刚才聊过什么、以前发生过什么、车况</text><text x="644" y="1403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 决定说什么、做什么</text><rect x="50" y="1450" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="1472" r="12" fill="#4f7ea9"/><text x="70" y="1477" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">12</text><text x="90" y="1477" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">播报、执行，再告诉云端</text><text x="64" y="1502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上播报、执行动作</text><text x="64" y="1523" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上自己办的事也要告诉云端</text><path d="M310,218 L310,234 L890,234 L890,250" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="582.65" y="224" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600.0" y="240" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">声音</text><path d="M890,338 L890,370" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M890,458 L890,474 L310,474 L310,490" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="557.95" y="464" width="84.1" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600.0" y="480" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">边听边出的字</text><path d="M310,578 L310,610" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,698 L310,714 L890,714 L890,730" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="576.475" y="704" width="47.05" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600.0" y="720" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">半句话</text><path d="M890,818 L890,834 L310,834 L310,850" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,938 L310,954 L890,954 L890,970" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="582.65" y="944" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600.0" y="960" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">收尾</text><path d="M890,1058 L890,1074 L310,1074 L310,1090" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,1178 L310,1194 L890,1194 L890,1210" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="570.3" y="1184" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600.0" y="1200" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">正式提交</text><path d="M890,1298 L890,1330" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M890,1418 L890,1434 L310,1434 L310,1450" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="564.125" y="1424" width="71.75" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600.0" y="1440" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">话术+动作</text></g></svg>