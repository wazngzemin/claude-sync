<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="d2-parallel-serial" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="d2-parallel-serial-title d2-parallel-serial-desc">
<title id="d2-parallel-serial-title">同一轮一起发，有依赖的分轮办</title><desc id="d2-parallel-serial-desc">“我好热，顺便找个附近能停车的咖啡店”：先发独立动作，再根据结果推进。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="d2-parallel-serial-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">同一轮一起发，有依赖的分轮办</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">“我好热，顺便找个附近能停车的咖啡店”：先发独立动作，再根据结果推进。</text>
<text class="v56-node-title" x="32" y="124" text-anchor="start">同一轮一起发：第一轮</text>
<text class="v56-node-title" x="840" y="124" text-anchor="start">下一轮再发：先等结果</text>
<text class="v56-label" x="32" y="154" text-anchor="start">Planner 同时下发四个动作</text>
<path class="v56-rule" d="M 114 184 L 114 174 L 678 174 L 678 184 M 302 174 L 302 184 M 490 174 L 490 184"/>
<g data-node="true" id="d2-parallel-serial-1"><rect class="v56-local" x="32" y="194" width="164" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="221" text-anchor="start">查车况</text>
<text class="v56-node-sub" x="46" y="246" text-anchor="start">查当前状态</text>
</g>
<g data-node="true" id="d2-parallel-serial-2"><rect class="v56-local" x="220" y="194" width="164" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="234" y="221" text-anchor="start">开空调</text>
<text class="v56-node-sub" x="234" y="246" text-anchor="start">执行开启动作</text>
</g>
<g data-node="true" id="d2-parallel-serial-3"><rect class="v56-local" x="408" y="194" width="164" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="422" y="221" text-anchor="start">调风量</text>
<text class="v56-node-sub" x="422" y="246" text-anchor="start">执行风量调整</text>
</g>
<g data-node="true" id="d2-parallel-serial-4"><rect class="v56-local" x="596" y="194" width="164" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="610" y="221" text-anchor="start">搜咖啡店</text>
<text class="v56-node-sub" x="610" y="246" text-anchor="start">搜附近的候选</text>
</g>
<g data-node="true" id="d2-parallel-serial-parking"><rect class="v56-decision" x="840" y="194" width="328" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="854" y="221" text-anchor="start">看停车</text>
<text class="v56-node-sub" x="854" y="246" text-anchor="start">第二轮：读搜索结果，筛能停车的店</text>
</g>
<g data-node="true" id="d2-parallel-serial-choose"><rect class="v56-decision" x="840" y="342" width="328" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="854" y="369" text-anchor="start">让用户选</text>
<text class="v56-node-sub" x="854" y="394" text-anchor="start">第二轮回复：推荐有停车场的两家</text>
</g>
<g data-node="true" id="d2-parallel-serial-navigation"><rect class="v56-decision" x="840" y="490" width="328" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="854" y="517" text-anchor="start">导航</text>
<text class="v56-node-sub" x="854" y="542" text-anchor="start">用户选定后，第三轮才发导航</text>
</g>
<path class="v56-arrow v56-pending" d="M 760 243 L 800 243 L 800 237 L 840 237" marker-end="url(#d2-parallel-serial-arr)"/>
<path class="v56-arrow v56-pending" d="M 1004 280 L 1004 342" marker-end="url(#d2-parallel-serial-arr)"/>
<text class="v56-label" x="1020" y="315" text-anchor="start">等筛选结果</text>
<path class="v56-arrow v56-pending" d="M 1004 428 L 1004 490" marker-end="url(#d2-parallel-serial-arr)"/>
<text class="v56-label" x="1020" y="463" text-anchor="start">等用户选择</text>
<text class="v56-node-title" x="32" y="350" text-anchor="start">同一轮的动作同时下发，不能互相依赖。</text>
<text class="v56-node-sub" x="32" y="383" text-anchor="start">看停车要等搜索结果；导航还要等用户选定。</text>
<text class="v56-label" x="32" y="544" text-anchor="start">车型规则：上汽导航类工具不在同一轮并行。</text>
<text class="v56-node-sub" x="32" y="569" text-anchor="start">搜地点、算路线、导航控制，按先后依赖分轮安排。</text>
<rect data-decoration="true" class="v56-local" x="32" y="604" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="618" text-anchor="start">蓝：本轮一起下发</text>
<rect data-decoration="true" class="v56-decision" x="300" y="604" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="328" y="618" text-anchor="start">黄：依赖满足后推进</text>
<path class="v56-arrow v56-pending" d="M 600 618 L 620 618"/>
<text class="v56-subtitle" x="628" y="618" text-anchor="start">虚线箭头：等待结果或选择</text>
</svg>
