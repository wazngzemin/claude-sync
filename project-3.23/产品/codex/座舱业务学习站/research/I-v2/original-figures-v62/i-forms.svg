<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="没说完的话怎样交回 DT：两种形态"><title>没说完的话怎样交回 DT：两种形态</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="800" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">没说完的话怎样交回 DT：两种形态</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">从上面“豆包被停播”往下走，中间菱形按“这句插话最后有没有被拒识”分成左右两路</text><rect x="340" y="96" width="520" height="84" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="354" y="123" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">豆包被停播，旧话切成两半</text><text x="354" y="148" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已说的：“……第一家是 A 餐厅，人均 80，”</text><text x="354" y="169" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没说完的：“第二家是 B 餐厅……”（教学示例）</text><polygon points="600,205.0 780.0,250 600,295.0 420.0,250" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="600" y="245" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">这句插话最后</text><text x="600" y="265" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">有没有被拒识？</text><path d="M600,180 L600,205" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="330" width="520" height="150" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="357" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">没被拒识：是对豆包说的</text><text x="54" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没说完的话和新话放在同一条输入里</text><text x="54" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">旧话末尾标注：</text><text x="54" y="424" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（这里被用户打断了，后面没说完：……）</text><text x="54" y="445" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">研发叫 last_talk_content</text><rect x="640" y="330" width="520" height="150" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="654" y="357" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">被拒识：不是对豆包说的</text><text x="654" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这句插话本身不交给 DT</text><text x="654" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">另包一条“事件”：谁和其他人说话打断了你，</text><text x="654" y="424" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">你已经说了什么、没说完的是什么</text><text x="654" y="445" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">由这条事件触发 DT 新的一轮</text><path d="M420,250 L300,250 L300,330" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="320.3" y="227" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="350" y="243" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">没被拒识</text><path d="M780,250 L900,250 L900,330" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="826.475" y="227" width="47.05" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="850" y="243" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">被拒识</text><rect x="40" y="520" width="520" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="547" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 要同时处理两件事</text><text x="54" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">回应新话（必须）</text><text x="54" y="593" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">顺带决定旧话补不补</text><rect x="640" y="520" width="520" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="654" y="547" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 只处理一件事</text><text x="654" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没有新话要回应</text><text x="654" y="593" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只决定旧话补不补；不值得补就不出声</text><path d="M300,480 L300,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M900,480 L900,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="670" width="1120" height="100" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="54" y="697" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">两路都由 DT 按同一套规则判断（见下一张图）</text><text x="54" y="722" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不能恢复的三种情况不走这张图：车上只有一个人时的插话、被更高优先级的播报顶掉、对话已退出</text><text x="54" y="743" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">单人打断和离线车控打断不恢复，永久中止的播报不能复活</text></g></svg>