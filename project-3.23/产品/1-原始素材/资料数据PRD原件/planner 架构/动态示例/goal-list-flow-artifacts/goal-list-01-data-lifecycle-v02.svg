<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2300" viewBox="0 0 1660 2300">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker>
  </defs>

  <rect x="30" y="28" width="1600" height="132" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="4"/>
  <circle cx="100" cy="94" r="42" fill="#F4F2EE" stroke="#F4F2EE" stroke-width="2"/>
  <text x="77" y="105" fill="#0D4FA8" font-size="35" font-weight="700">01</text>
  <text x="174" y="86" fill="#F4F2EE" font-size="40" font-weight="700">goal_list 是怎么“活起来”的</text>
  <text x="177" y="128" fill="#F4F2EE" font-size="22">不是模型记忆，而是一份被读入、被判断、被异步刷新、再读入的活动任务快照</text>

  <rect x="30" y="190" width="1600" height="105" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="58" y="235" fill="#0D4FA8" font-size="23" font-weight="700">先记住一件事：</text>
  <text x="300" y="235" fill="#0D4FA8" font-size="23">真正改变任务的，是“创建 / 删除 / 完成”的真实结果；goal_list 只是模型看到的当前投影。</text>
  <text x="58" y="270" fill="#8E9179" font-size="18">历史对话说“我记好了”不等于任务仍有效；任务中心卡片消失也不等于模型已更新。</text>

  <!-- Three objects -->
  <text x="35" y="356" fill="#0D4FA8" font-size="28" font-weight="700">先分开：一件任务有三种“存在形式”</text>
  <rect x="30" y="390" width="480" height="270" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <rect x="30" y="390" width="480" height="56" rx="4" fill="#185DB7" stroke="#185DB7" stroke-width="3"/>
  <text x="55" y="427" fill="#F4F2EE" font-size="23" font-weight="700">A　真实活动任务</text>
  <text x="58" y="489" fill="#0D4FA8" font-size="20">真正的用户承诺：</text>
  <text x="58" y="522" fill="#0D4FA8" font-size="18">是否生效、是否占名额、何时触发、</text>
  <text x="58" y="553" fill="#0D4FA8" font-size="18">是否已完成 / 已取消。</text>
  <line x1="58" y1="580" x2="484" y2="580" stroke="#185DB7" stroke-width="2"/>
  <text x="58" y="620" fill="#0D4FA8" font-size="19" font-weight="700">它是状态和配额的唯一依据。</text>

  <rect x="590" y="390" width="480" height="270" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <rect x="590" y="390" width="480" height="56" rx="4" fill="#8E9179" stroke="#8E9179" stroke-width="3"/>
  <text x="615" y="427" fill="#F4F2EE" font-size="23" font-weight="700">B　任务中心卡片</text>
  <text x="618" y="489" fill="#0D4FA8" font-size="20">用户看到并操作的任务：</text>
  <text x="618" y="522" fill="#0D4FA8" font-size="18">内容、时间、状态；删除、暂停、恢复。</text>
  <text x="618" y="553" fill="#0D4FA8" font-size="18">它必须展示真实任务的结果。</text>
  <line x1="618" y1="580" x2="1044" y2="580" stroke="#185DB7" stroke-width="2"/>
  <text x="618" y="620" fill="#0D4FA8" font-size="19" font-weight="700">不能只删卡片、不删任务。</text>

  <rect x="1150" y="390" width="480" height="270" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <rect x="1150" y="390" width="480" height="56" rx="4" fill="#185DB7" stroke="#185DB7" stroke-width="3"/>
  <text x="1175" y="427" fill="#F4F2EE" font-size="23" font-weight="700">C　模型的 goal_list</text>
  <text x="1178" y="489" fill="#0D4FA8" font-size="20">模型本轮读到的活动任务快照：</text>
  <text x="1178" y="522" fill="#0D4FA8" font-size="18">用来去重、定位删除 ID、理解上下文。</text>
  <text x="1178" y="553" fill="#0D4FA8" font-size="18">它应从真实任务状态重新生成。</text>
  <line x1="1178" y1="580" x2="1604" y2="580" stroke="#185DB7" stroke-width="2"/>
  <text x="1178" y="620" fill="#0D4FA8" font-size="19" font-weight="700">不能滞留已取消任务。</text>

  <line x1="510" y1="525" x2="590" y2="525" stroke="#0D4FA8" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="1070" y1="525" x2="1150" y2="525" stroke="#0D4FA8" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- loop title -->
  <rect x="30" y="710" width="1600" height="62" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="55" y="751" fill="#F4F2EE" font-size="27" font-weight="700">一轮完整的读写闭环：goal_list 只在“真实任务状态”变化后才应变化</text>

  <!-- 1 source -->
  <circle cx="125" cy="880" r="39" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="112" y="894" fill="#F4F2EE" font-size="28" font-weight="700">1</text>
  <rect x="190" y="810" width="510" height="140" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="218" y="852" fill="#0D4FA8" font-size="23" font-weight="700">读取真实“活动任务集”</text>
  <text x="218" y="884" fill="#0D4FA8" font-size="17">只取仍生效的任务；已完成、已取消、</text>
  <text x="218" y="912" fill="#0D4FA8" font-size="17">创建失败的任务均不应出现。</text>
  <text x="218" y="939" fill="#8E9179" font-size="16">例如：g-29 条件任务 + g-30～g-35 六条定时提醒。</text>

  <!-- 2 inject -->
  <circle cx="125" cy="1068" r="39" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="112" y="1082" fill="#F4F2EE" font-size="28" font-weight="700">2</text>
  <rect x="190" y="998" width="510" height="140" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="218" y="1040" fill="#0D4FA8" font-size="23" font-weight="700">组装成模型可读的 goal_list</text>
  <text x="218" y="1074" fill="#0D4FA8" font-size="18">旧提示词至少注入：goal_id、goal_content。</text>
  <text x="218" y="1106" fill="#8E9179" font-size="18">产品上还应有：类型、状态、触发、服务对象、版本。</text>

  <!-- 3 prompt -->
  <circle cx="125" cy="1256" r="39" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="112" y="1270" fill="#F4F2EE" font-size="28" font-weight="700">3</text>
  <rect x="190" y="1186" width="510" height="165" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="218" y="1228" fill="#0D4FA8" font-size="23" font-weight="700">模型读取“最新快照 + 本轮输入”</text>
  <text x="218" y="1262" fill="#0D4FA8" font-size="17">本轮输入：用户 Query、Advisor、Event，</text>
  <text x="218" y="1290" fill="#0D4FA8" font-size="17">或 tool_feedback。</text>
  <text x="218" y="1321" fill="#8E9179" font-size="17">这一步只读列表；模型不能通过语言直接改列表。</text>

  <!-- 4 decide -->
  <circle cx="125" cy="1444" r="39" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="112" y="1458" fill="#F4F2EE" font-size="28" font-weight="700">4</text>
  <rect x="190" y="1374" width="510" height="140" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="218" y="1416" fill="#0D4FA8" font-size="23" font-weight="700">模型做产品判断</text>
  <text x="218" y="1450" fill="#0D4FA8" font-size="18">新增？按 ID 删除？已有不重复？条件已满足直接服务？</text>
  <text x="218" y="1482" fill="#8E9179" font-size="18">创建前还要识别同类上限与不可执行边界。</text>

  <!-- decision branches -->
  <rect x="830" y="810" width="350" height="160" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="857" y="855" fill="#F4F2EE" font-size="23" font-weight="700">新增 / 修改请求</text>
  <text x="857" y="890" fill="#F4F2EE" font-size="18">旧：add_goal</text>
  <text x="857" y="920" fill="#F4F2EE" font-size="18">目标：Goal Manage 创建 / 更新</text>
  <text x="857" y="950" fill="#F4F2EE" font-size="18">先进入“请求中”，不等于成功</text>

  <rect x="1230" y="810" width="370" height="160" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1257" y="855" fill="#0D4FA8" font-size="23" font-weight="700">真实任务结果</text>
  <text x="1257" y="890" fill="#0D4FA8" font-size="18">成功：任务生效、注册触发源</text>
  <text x="1257" y="920" fill="#0D4FA8" font-size="18">失败：任务状态不变、列表不新增</text>
  <text x="1257" y="950" fill="#8E9179" font-size="18">只有这里能裁决“是否已设置”</text>

  <rect x="830" y="1080" width="350" height="160" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="857" y="1125" fill="#0D4FA8" font-size="23" font-weight="700">删除请求</text>
  <text x="857" y="1160" fill="#0D4FA8" font-size="18">语音：由 goal_list 定位 goal_id</text>
  <text x="857" y="1190" fill="#0D4FA8" font-size="18">屏幕：直接带任务 ID</text>
  <text x="857" y="1220" fill="#8E9179" font-size="18">两个入口都只是“提出关闭”</text>

  <rect x="1230" y="1080" width="370" height="160" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1257" y="1125" fill="#F4F2EE" font-size="23" font-weight="700">真实关闭结果</text>
  <text x="1257" y="1160" fill="#F4F2EE" font-size="18">关闭任务、注销定时器 / 触发器</text>
  <text x="1257" y="1190" fill="#F4F2EE" font-size="18">释放名额、记录“用户取消”</text>
  <text x="1257" y="1220" fill="#F4F2EE" font-size="18">不能只把任务中心卡片隐藏</text>

  <rect x="830" y="1350" width="770" height="164" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="857" y="1395" fill="#0D4FA8" font-size="23" font-weight="700">状态变化事件 → 重新投影 → 下一轮注入新的 goal_list</text>
  <text x="857" y="1431" fill="#0D4FA8" font-size="18">创建成功：新任务出现；删除 / 完成：旧任务消失；失败：列表保持原状态。</text>
  <text x="857" y="1470" fill="#8E9179" font-size="18">这是 goal_list 唯一应该变化的方式。模型口头说“我记住了”不构成状态变化。</text>

  <polyline points="700,880 765,880 765,890 830,890" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1180" y1="890" x2="1230" y2="890" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="700,1444 765,1444 765,1160 830,1160" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1180" y1="1160" x2="1230" y2="1160" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="1415,970 1415,1350" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="1415,1240 1415,1350" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="830,1432 765,1432 765,1625 450,1625 450,1514" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- State machine -->
  <rect x="30" y="1605" width="1600" height="62" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="55" y="1646" fill="#F4F2EE" font-size="27" font-weight="700">用状态机理解 goal_list：什么情况下进入，什么情况下离开</text>

  <rect x="60" y="1710" width="230" height="160" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="84" y="1760" fill="#0D4FA8" font-size="22" font-weight="700">无此任务</text>
  <text x="84" y="1801" fill="#8E9179" font-size="18">goal_list 没有该项</text>
  <text x="84" y="1834" fill="#8E9179" font-size="18">未占用名额</text>

  <rect x="360" y="1710" width="230" height="160" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="384" y="1760" fill="#0D4FA8" font-size="22" font-weight="700">创建请求中</text>
  <text x="384" y="1801" fill="#8E9179" font-size="18">等待异步结果</text>
  <text x="384" y="1834" fill="#8E9179" font-size="18">不能对用户承诺成功</text>

  <rect x="660" y="1710" width="230" height="160" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="684" y="1760" fill="#F4F2EE" font-size="22" font-weight="700">活动 / 等待</text>
  <text x="684" y="1801" fill="#F4F2EE" font-size="18">应出现于 goal_list</text>
  <text x="684" y="1834" fill="#F4F2EE" font-size="18">占用同类任务名额</text>

  <rect x="960" y="1710" width="230" height="160" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="984" y="1760" fill="#0D4FA8" font-size="22" font-weight="700">触发 / 服务中</text>
  <text x="984" y="1801" fill="#8E9179" font-size="18">事件或定时唤醒模型</text>
  <text x="984" y="1834" fill="#8E9179" font-size="18">产生提醒 / 动作 / advice</text>

  <rect x="1260" y="1710" width="310" height="160" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1284" y="1760" fill="#0D4FA8" font-size="22" font-weight="700">关闭：完成 / 取消 / 失败</text>
  <text x="1284" y="1801" fill="#8E9179" font-size="18">停止触发源，释放名额</text>
  <text x="1284" y="1834" fill="#8E9179" font-size="18">下一轮 goal_list 必须消失</text>

  <line x1="290" y1="1790" x2="360" y2="1790" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="590" y1="1790" x2="660" y2="1790" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="890" y1="1790" x2="960" y2="1790" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1190" y1="1790" x2="1260" y2="1790" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="1075,1870 1075,1925 775,1925 775,1870" fill="none" stroke="#8E9179" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="806" y="1960" fill="#8E9179" font-size="18">循环任务：服务后回到活动 / 等待</text>

  <!-- Product contracts -->
  <rect x="30" y="2020" width="1600" height="220" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="58" y="2064" fill="#0D4FA8" font-size="24" font-weight="700">goal_list 的三个产品合同</text>
  <text x="58" y="2110" fill="#0D4FA8" font-size="20">① 同源：任务中心、真实任务、goal_list 必须显示同一组活动任务。</text>
  <text x="58" y="2146" fill="#0D4FA8" font-size="20">② 结果驱动：新增 / 删除 / 完成只以真实操作结果改变状态，不能用模型话术代替。</text>
  <text x="58" y="2182" fill="#0D4FA8" font-size="20">③ 可回收：单次完成或用户取消后，任务、触发源、名额、goal_list 要同时回收。</text>
</svg>
