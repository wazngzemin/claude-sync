<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="k2-presence" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="k2-presence-title k2-presence-desc">
<title id="k2-presence-title">车里有别人时，哪些记忆能用</title><desc id="k2-presence-desc">先按车辆与豆包账号隔离，再看是谁、谁在场；第三方说法还要过本人认可这一关。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="k2-presence-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">车里有别人时，哪些记忆能用</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先按车辆与豆包账号隔离，再看是谁、谁在场；第三方说法还要过本人认可这一关。</text>
<g data-node="true" id="k2-presence-occupants"><rect class="v56-local" x="390" y="132" width="370" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="404" y="160" text-anchor="start">当前车上的人</text>
<text class="v56-node-sub" x="404" y="188" text-anchor="start">车主（主驾）＋ 老周（副驾）</text>
</g>
<g data-node="true" id="k2-presence-low-risk"><rect class="v56-cloud" x="32" y="300" width="320" height="170" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="328" text-anchor="start">低风险偏好：所属人在车上就能用</text>
<text class="v56-node-sub" x="46" y="356" text-anchor="start">车控、导航、媒体等功能偏好</text>
<text class="v56-node-sub" x="46" y="380" text-anchor="start">具体按标签逐项划分</text>
<text class="v56-node-sub" x="46" y="404" text-anchor="start">例：车主在场，可用车主的风量偏好</text>
</g>
<g data-node="true" id="k2-presence-private"><rect class="v56-reject" x="32" y="510" width="320" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="538" text-anchor="start">私人类记忆：本人单独用车才召回</text>
<text class="v56-node-sub" x="46" y="566" text-anchor="start">个人信息、社会关系、情感类</text>
<text class="v56-node-sub" x="46" y="590" text-anchor="start">车主与老周同车 → 不主动说</text>
<text class="v56-node-sub" x="46" y="614" text-anchor="start">车主的私人类记忆</text>
</g>
<g data-node="true" id="k2-presence-episode"><rect class="v56-cloud" x="390" y="300" width="370" height="390" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="404" y="328" text-anchor="start">情景记忆：按当时在车上的人归属</text>
<text class="v56-node-sub" x="404" y="356" text-anchor="start">两种召回规则，分别判断</text>
<text class="v56-node-sub" x="404" y="380" text-anchor="start">规则一：当时的人全在当前车上</text>
<text class="v56-node-sub" x="404" y="404" text-anchor="start">且包含说话人。老周说话时：</text>
<text class="v56-node-sub" x="404" y="428" text-anchor="start">当时是车主、老周 → 可用</text>
<text class="v56-node-sub" x="404" y="452" text-anchor="start">规则二：当前的人全在当时的人中</text>
<text class="v56-node-sub" x="404" y="476" text-anchor="start">当时是车主、老周、乘客甲、乘客乙</text>
<text class="v56-node-sub" x="404" y="500" text-anchor="start">当前是车主、老周 → 可用</text>
</g>
<g data-node="true" id="k2-presence-third-party"><rect class="v56-reject" x="818" y="132" width="350" height="136" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="832" y="160" text-anchor="start">第三方说法：不能直接变成本人偏好</text>
<text class="v56-node-sub" x="832" y="188" text-anchor="start">车主说：“老周喜欢冰美式”</text>
<text class="v56-node-sub" x="832" y="212" text-anchor="start">这是车主说老周，不是老周自己说</text>
</g>
<g data-node="true" id="k2-presence-experience"><rect class="v56-cloud" x="818" y="326" width="350" height="96" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="832" y="354" text-anchor="start">先记成一段经历</text>
<text class="v56-node-sub" x="832" y="382" text-anchor="start">“车主说过老周喜欢冰美式”</text>
</g>
<g data-node="true" id="k2-presence-approval"><rect class="v56-decision" x="818" y="480" width="350" height="210" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="832" y="508" text-anchor="start">何时写进老周的偏好</text>
<text class="v56-node-sub" x="832" y="536" text-anchor="start">老周在场并明确说“对”</text>
<text class="v56-node-sub" x="832" y="560" text-anchor="start">才写入老周的偏好</text>
<text class="v56-node-sub" x="832" y="584" text-anchor="start">沉默不算认可；拿不准就不记</text>
</g>
<path class="v56-arrow" fill="none" d="M 390 182 L 372 182 L 372 360 L 352 360" marker-end="url(#k2-presence-arr)"/>
<path class="v56-arrow" fill="none" d="M 372 360 L 372 566 L 352 566" marker-end="url(#k2-presence-arr)"/>
<path class="v56-arrow" fill="none" d="M 575 232 L 575 300" marker-end="url(#k2-presence-arr)"/>
<text class="v56-label" x="591" y="273" text-anchor="start">按在场人筛选</text>
<path class="v56-arrow" fill="none" d="M 993 268 L 993 326" marker-end="url(#k2-presence-arr)"/>
<text class="v56-label" x="1011" y="304" text-anchor="start">记录谁说过</text>
<path class="v56-arrow" fill="none" d="M 993 422 L 993 480" marker-end="url(#k2-presence-arr)"/>
<text class="v56-label" x="1011" y="458" text-anchor="start">本人明确认可</text>
<text class="v56-subtitle" x="32" y="740" text-anchor="start">新的已注册乘员上车，或未注册人数变多 → 清掉摘要中的敏感信息；有人下车不触发。</text>
<path class="v56-rule" d="M 32 774 L 1168 774"/>
<text class="v56-node-title" x="32" y="810" text-anchor="start">别人的评价先记成经历，不能替本人确认偏好。</text>
<rect data-decoration="true" class="v56-local" x="32" y="848" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="862" text-anchor="start">蓝：当前在场的人</text>
<rect data-decoration="true" class="v56-cloud" x="310" y="848" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="338" y="862" text-anchor="start">绿：可用范围或经历</text>
<rect data-decoration="true" class="v56-reject" x="610" y="848" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="638" y="862" text-anchor="start">红：隐私和归属边界</text>
<rect data-decoration="true" class="v56-decision" x="928" y="848" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="956" y="862" text-anchor="start">黄：本人认可</text>
</svg>
