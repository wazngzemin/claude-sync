<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="c-input" width="1240" height="960" viewBox="0 0 1240 960" role="img" aria-labelledby="c-input-title c-input-desc"><title id="c-input-title">Planner 一次推理看到什么：两块输入，各自从哪来</title><desc id="c-input-desc">左边是系统提示词，右边是对话部分；车况等背景的位置随车型、版本不同。</desc><style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style><defs><marker id="c-input-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs><text class="v56-title" x="32" y="44" text-anchor="start">Planner 一次推理看到什么：两块输入，各自从哪来</text><text class="v56-subtitle" x="32" y="72" text-anchor="start">左边是系统提示词，右边是对话部分；车况等背景的位置随车型、版本不同。</text><text class="v56-label" x="32" y="116" text-anchor="start">系统提示词：固定说明 + 动态背景</text><text class="v56-label" x="654" y="116" text-anchor="start">对话部分：过去几轮 + 这一轮</text><g data-node="true"><rect class="v56-neutral" x="40" y="140" width="560" height="96" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="54" y="167" text-anchor="start">固定说明</text><text class="v56-node-sub" x="54" y="192" text-anchor="start">人设、工具说明、注意事项、静态示例、车辆知识</text><text class="v56-node-sub" x="54" y="213" text-anchor="start">每次都一样，不随这句话变</text></g><g data-node="true"><rect class="v56-cloud" x="40" y="272" width="560" height="96" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="54" y="299" text-anchor="start">用户记忆</text><text class="v56-node-sub" x="54" y="324" text-anchor="start">最前面是对话摘要；再是画像和召回的记忆</text><text class="v56-node-sub" x="54" y="345" text-anchor="start">来自记忆服务，只取在场人能看的</text></g><g data-node="true"><rect class="v56-cloud" x="40" y="404" width="560" height="96" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="54" y="431" text-anchor="start">车内情景</text><text class="v56-node-sub" x="54" y="456" text-anchor="start">乘客列表以人脸结果为准，多出来的人删掉</text><text class="v56-node-sub" x="54" y="477" text-anchor="start">赛力斯带描述；上汽只写坐着谁</text></g><g data-node="true"><rect class="v56-cloud" x="40" y="536" width="560" height="96" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="54" y="563" text-anchor="start">动态示例</text><text class="v56-node-sub" x="54" y="588" text-anchor="start">按这句话检索最像的 3 条处理案例；按车型过滤</text><text class="v56-node-sub" x="54" y="609" text-anchor="start">专门修低频、零散的问题</text></g><g data-node="true"><rect class="v56-cloud" x="40" y="668" width="560" height="96" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="54" y="695" text-anchor="start">能力说明</text><text class="v56-node-sub" x="54" y="720" text-anchor="start">当前车型能做什么</text><text class="v56-node-sub" x="54" y="741" text-anchor="start">按车型注入座椅等能力说明</text></g><g data-node="true"><rect class="v56-local" x="660" y="140" width="540" height="130" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="674" y="167" text-anchor="start">过去几轮（历史输入）</text><text class="v56-node-sub" x="674" y="192" text-anchor="start">30 分钟内最近 5 轮有效人机对话、调过的工具和结果</text><text class="v56-node-sub" x="674" y="213" text-anchor="start">穿插最近 10 分钟内最多 3 条白名单事件</text></g><g data-node="true"><rect class="v56-cloud" x="660" y="300" width="540" height="150" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="674" y="327" text-anchor="start">这一轮的背景</text><text class="v56-node-sub" x="674" y="352" text-anchor="start">目标队列：豆包还在跟进的事</text><text class="v56-node-sub" x="674" y="373" text-anchor="start">车况：标明“最新，优先于历史”</text><text class="v56-node-sub" x="674" y="394" text-anchor="start">场景知识：场景路由模型按场景挑的做事步骤</text><text class="v56-node-sub" x="674" y="415" text-anchor="start">车况和场景知识的位置随车型、版本不同</text></g><g data-node="true"><rect class="v56-local" x="660" y="480" width="540" height="130" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="674" y="507" text-anchor="start">这一轮的输入</text><text class="v56-node-sub" x="674" y="532" text-anchor="start">说的话 / 主动服务建议 / 事件 / 工具结果</text><text class="v56-node-sub" x="674" y="553" text-anchor="start">谁说的、坐哪、时间、离上一句多久</text></g><g data-node="true"><rect class="v56-decision" x="660" y="690" width="540" height="150" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="674" y="717" text-anchor="start">这一轮变成“过去”以后</text><text class="v56-node-sub" x="674" y="742" text-anchor="start">这一轮的背景不再保留，只留话和工具结果</text><text class="v56-node-sub" x="674" y="763" text-anchor="start">车书、联网结果只在最后一轮保留原文</text><text class="v56-node-sub" x="674" y="784" text-anchor="start">被拒识、触发风控的轮次不进入下一次</text></g><path class="v56-arrow" d="M 930 610 L 930 690" marker-end="url(#c-input-arr)"/><rect data-role="legend" class="v56-neutral" x="32" y="890" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="60" y="904" text-anchor="start">灰：固定说明</text><rect data-role="legend" class="v56-cloud" x="181" y="890" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="209" y="904" text-anchor="start">绿：动态背景</text><rect data-role="legend" class="v56-local" x="330" y="890" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="358" y="904" text-anchor="start">蓝：对话输入</text><rect data-role="legend" class="v56-decision" x="479" y="890" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="507" y="904" text-anchor="start">黄：转为历史的规则</text></svg>