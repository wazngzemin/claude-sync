<text x="12371" y="19488" font-size="25px" fill="#203947" font-weight="450">工具能执行 + 反馈能纠错</text>
<text x="12371" y="19524" font-size="25px" fill="#203947" font-weight="450">用质量、时延、成本证明改进</text>
<rect x="6370" y="735" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="H1" stroke-dasharray="10 7"/>
<text x="6396" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">17.0 目标管理工具被调用</text>
<text x="6396" y="839" font-size="25px" fill="#203947" font-weight="450">输入：延迟/条件/持续诉求</text>
<text x="6396" y="875" font-size="25px" fill="#203947" font-weight="450">来自 Planner 的 goal_list_update</text>
<text x="6396" y="940" font-size="25px" fill="#354F62" font-weight="450">旧工具接收未来时间、条件或持续目标。它创建的是等待目标，</text>
<text x="6396" y="976" font-size="25px" fill="#354F62" font-weight="450">不应顺手将目标里的动作立即执行。</text>
<rect x="7210" y="735" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="H2" stroke-dasharray="10 7"/>
<text x="7236" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">18.0 Goal List 建立/更新</text>
<text x="7236" y="839" font-size="25px" fill="#203947" font-weight="450">合理性/数量/归属与目标内容</text>
<text x="7236" y="875" font-size="25px" fill="#203947" font-weight="450">注册完成只代表进入等待</text>
<text x="7236" y="940" font-size="25px" fill="#354F62" font-weight="450">建立目标归属与内容，并校验合理性及数量。保存成功只表示目</text>
<text x="7236" y="976" font-size="25px" fill="#354F62" font-weight="450">标已登记，不等于观察已命中或业务已完成。</text>
<rect x="7210" y="1263" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="H3" stroke-dasharray="10 7"/>
<text x="7236" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">17.1 动态 Advisor 跟进</text>
<text x="7236" y="1367" font-size="25px" fill="#203947" font-weight="450">围绕一个目标持续评估</text>
<text x="7236" y="1403" font-size="25px" fill="#203947" font-weight="450">监控目标进展，不直接改车态</text>
<text x="7236" y="1468" font-size="25px" fill="#354F62" font-weight="450">围绕已登记目标持续评估进展，与静态场景建议职责不同。读取</text>
<text x="7236" y="1504" font-size="25px" fill="#354F62" font-weight="450">目标和最新事实后，决定是否需要继续观察或提出建议。</text>
<rect x="6370" y="1263" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="H4" stroke-dasharray="10 7"/>
<text x="6396" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">17.2 订阅触发条件</text>
<text x="6396" y="1367" font-size="25px" fill="#203947" font-weight="450">定时/周期/状态/视觉条件</text>
<text x="6396" y="1403" font-size="25px" fill="#203947" font-weight="450">注册到云端 Trigger 后等待</text>
<text x="6396" y="1468" font-size="25px" fill="#354F62" font-weight="450">将定时、周期、结构状态或视觉条件交云端触发器订阅。必须明</text>
<text x="6396" y="1504" font-size="25px" fill="#354F62" font-weight="450">确可观察性与回调关联，取消目标时同步清理。</text>

<text x="6396" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">17.3 命中后重新判断</text>
<text x="6396" y="1895" font-size="25px" fill="#203947" font-weight="450">条件回调 + 当前 Context</text>
<text x="6396" y="1931" font-size="25px" fill="#203947" font-weight="450">是否仍需执行/目标是否已完成</text>
<text x="6396" y="1996" font-size="25px" fill="#354F62" font-weight="450">命中回调后重新检查目标是否仍有效、条件是否还适用及动作是</text>
<text x="6396" y="2032" font-size="25px" fill="#354F62" font-weight="450">否已完成。旧回调不能让取消目标复活。</text>
<rect x="7210" y="1791" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="H6" stroke-dasharray="10 7"/>

<text x="7236" y="1931" font-size="25px" fill="#203947" font-weight="450">决定动作、等待或更新目标状态</text>
<text x="7236" y="1996" font-size="25px" fill="#354F62" font-weight="450">形成带目标上下文的建议，回同一个 Planner 决定行动、等待</text>
<text x="7236" y="2032" font-size="25px" fill="#354F62" font-weight="450">或更新目标。动态 Advisor 本身不直接改变车态。</text>

<text x="12516" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">① 卡片展示请求</text>

<text x="13356" y="10067" font-size="25px" fill="#203947" font-weight="450">车企/业务方解析可操作元素</text>

<text x="13356" y="10168" font-size="25px" fill="#354F62" font-weight="450">页面所属业务解析可操作控件，提供文本、位置与对象信息；不</text>
<text x="13356" y="10204" font-size="25px" fill="#354F62" font-weight="450">是让摄像头 VQA 识别屏幕来代替 UI 契约。</text>

<text x="12516" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">④ 指令与元素 ID</text>

<text x="12516" y="10631" font-size="25px" fill="#203947" font-weight="450">动态词表增强，非再做一次 ASR</text>
<text x="12516" y="10696" font-size="25px" fill="#354F62" font-weight="450">使用当前轮 ASR 与相应唤醒策略做页面识别，不需要用户再说</text>

<text x="13356" y="10595" font-size="25px" fill="#203947" font-weight="450">字节语音：精确/模糊/局部</text>

<text x="13356" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">⑦ 注册方消歧</text>

<rect x="12490" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="U8" />
<text x="12516" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">⑧ 手点 / 模拟点击</text>
<text x="12516" y="11123" font-size="25px" fill="#203947" font-weight="450">实际调用页面操作</text>
<text x="12516" y="11159" font-size="25px" fill="#203947" font-weight="450">此处成功只是 UI 操作成功</text>
<text x="12516" y="11224" font-size="25px" fill="#354F62" font-weight="450">用户手点或语音匹配后模拟点击，进入页面原生行为。此处成功</text>
<text x="12516" y="11260" font-size="25px" fill="#354F62" font-weight="450">只说明触发了 UI 操作。</text>
<rect x="12490" y="11547" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="U9" />
<text x="12516" y="11590" font-size="30px" fill="#0D4FA8" font-weight="750">⑨ 正常按钮回调</text>
<text x="12516" y="11651" font-size="25px" fill="#203947" font-weight="450">与手点走同一类业务事件</text>
<text x="12516" y="11687" font-size="25px" fill="#203947" font-weight="450">带回对应业务/运行关联</text>
<text x="12516" y="11752" font-size="25px" fill="#354F62" font-weight="450">与正常手点使用同类业务回调，恢复原任务/卡片归属。已取消</text>
<text x="12516" y="11788" font-size="25px" fill="#354F62" font-weight="450">任务的旧按钮不能借回调重新复活。</text>
<rect x="13330" y="11547" width="760" height="390" rx="5" fill="#F7F7F2" stroke="#759CC8" stroke-width="2.2" data-node-id="U10" />
<text x="13356" y="11590" font-size="30px" fill="#0D4FA8" font-weight="750">⑩ 原业务执行前复核</text>
<text x="13356" y="11651" font-size="25px" fill="#203947" font-weight="450">当前任务、车况、有效期仍成立？</text>
<text x="13356" y="11687" font-size="25px" fill="#203947" font-weight="450">通过后才进入真实执行层</text>
<text x="13356" y="11752" font-size="25px" fill="#354F62" font-weight="450">原业务再次检查当前任务、车况和有效期，再执行动作或返回失</text>
<text x="13356" y="11788" font-size="25px" fill="#354F62" font-weight="450">败。页面点击成功与业务动作成功分开计数。</text>
<rect x="4330" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="IM1" />
<text x="4356" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">区分输入来源</text>
<text x="4356" y="5089" font-size="25px" fill="#203947" font-weight="450">用户 Query、Advisor 建议、工具结果、业务事件。</text>
<text x="4356" y="5125" font-size="25px" fill="#203947" font-weight="450">保留说话人、目标和调用关联，不把反馈当新命令。</text>
<text x="4356" y="5161" font-size="25px" fill="#203947" font-weight="450">进入节奏策略；背景事实不自动唤起推理。</text>
<rect x="5170" y="4985" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="IM2" />
<text x="5196" y="5028" font-size="30px" fill="#0D4FA8" font-weight="750">识别当前交互状态</text>
<text x="5196" y="5089" font-size="25px" fill="#203947" font-weight="450">当前是否听音、推理、工具执行或播放。</text>
<text x="5196" y="5125" font-size="25px" fill="#203947" font-weight="450">区分续说、多音区并发、插话和主动建议。</text>
<text x="5196" y="5161" font-size="25px" fill="#203947" font-weight="450">决定合并、排队、插队或中断；最新专项细则待核。</text>
<rect x="5170" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="IM3" />
<text x="5196" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">合并与排队</text>
<text x="5196" y="5617" font-size="25px" fill="#203947" font-weight="450">本轮新增输入及已有目标状态。</text>
<text x="5196" y="5653" font-size="25px" fill="#203947" font-weight="450">保持原始顺序、否定与身份，避免把两人诉求混成一人。</text>
<text x="5196" y="5689" font-size="25px" fill="#203947" font-weight="450">交付准入后的输入；不应靠丢请求降低延迟。</text>
<rect x="4330" y="5513" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="IM4" />
<text x="4356" y="5556" font-size="30px" fill="#0D4FA8" font-weight="750">中断与取消分层</text>
<text x="4356" y="5617" font-size="25px" fill="#203947" font-weight="450">用户新发声、停止播报或明确取消意图。</text>
<text x="4356" y="5653" font-size="25px" fill="#203947" font-weight="450">停止声音不撤销已执行动作；取消任务需到所属业务。</text>
<text x="4356" y="5689" font-size="25px" fill="#203947" font-weight="450">原目标保留、修改或关闭；迟到结果需核对有效性。</text>
<rect x="4330" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="IM5" />
<text x="4356" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">触发这一轮推理</text>
<text x="4356" y="6145" font-size="25px" fill="#203947" font-weight="450">可用 Query / advice / feedback 与当前对话状态。</text>
<text x="4356" y="6181" font-size="25px" fill="#203947" font-weight="450">选取应处理输入，交 Context 组装；避免同一事件重复消费。</text>
<text x="4356" y="6217" font-size="25px" fill="#203947" font-weight="450">进入同一个 Planner；后台观察可只更新事实不推理。</text>
<rect x="5170" y="6041" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="IM6" />
<text x="5196" y="6084" font-size="30px" fill="#0D4FA8" font-weight="750">事件通知与恢复边界</text>
<text x="5196" y="6145" font-size="25px" fill="#203947" font-weight="450">事件通知、对话打断后恢复建议。</text>
<text x="5196" y="6181" font-size="25px" fill="#203947" font-weight="450">旧临时旁路与 Input Manager 冲突在评审中留下待对齐项。</text>
<text x="5196" y="6217" font-size="25px" fill="#203947" font-weight="450">只保留待核接入；不画成已全部统一上线。</text>
<rect x="4330" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="CS1" />
<text x="4356" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">端状态上报入口</text>
<text x="4356" y="9539" font-size="25px" fill="#203947" font-weight="450">端侧全量/增量状态、事件时间与车型范围。</text>
<text x="4356" y="9575" font-size="25px" fill="#203947" font-weight="450">按协议接收并校验字段、类型、单位及归属。</text>
<text x="4356" y="9611" font-size="25px" fill="#203947" font-weight="450">有效事实进入云状态；缺失值不自动当作 0。</text>
<rect x="5170" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="CS2" />
<text x="5196" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">云端当前状态缓存</text>
<text x="5196" y="9539" font-size="25px" fill="#203947" font-weight="450">最新值与对应时间、来源及版本。</text>
<text x="5196" y="9575" font-size="25px" fill="#203947" font-weight="450">处理覆盖、乱序、缺失与过期；规则应知道数据年龄。</text>
<text x="5196" y="9611" font-size="25px" fill="#203947" font-weight="450">供条件求值和 Context 查询，不代替事件历史。</text>
<rect x="5170" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="CS3" />
<text x="5196" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">变化唤醒与查询</text>
<text x="5196" y="10067" font-size="25px" fill="#203947" font-weight="450">状态变化通知，或消费者请求快照。</text>
<text x="5196" y="10103" font-size="25px" fill="#203947" font-weight="450">变化叫醒相关规则；查询返回相应时刻的事实。</text>
<text x="5196" y="10139" font-size="25px" fill="#203947" font-weight="450">给云 Trigger / Context / Advisor，不是直接执行动作。</text>
<rect x="4330" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="CS4" />
<text x="4356" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">事件事实生产出口</text>
<text x="4356" y="10067" font-size="25px" fill="#203947" font-weight="450">按业务定义关注的状态变化。</text>
<text x="4356" y="10103" font-size="25px" fill="#203947" font-weight="450">区分真实旧值、新值、发生时间与规则命中时间。</text>
<text x="4356" y="10139" font-size="25px" fill="#203947" font-weight="450">交事件定义与日志链，不凭一段模型话术造事件。</text>
<rect x="6370" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="EV1" />
<text x="6396" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">定义事件与生产来源</text>
<text x="6396" y="9539" font-size="25px" fill="#203947" font-weight="450">端状态变化、客户端操作、云端业务事件。</text>
<text x="6396" y="9575" font-size="25px" fill="#203947" font-weight="450">一个事件定义 ID 对应明确生产来源；相似但不同来源可分 ID</text>
<text x="6396" y="9611" font-size="25px" fill="#203947" font-weight="450">。</text>
<text x="6396" y="9647" font-size="25px" fill="#203947" font-weight="450">形成可追溯事件定义，不把所有交互都无差别存储。</text>
<rect x="7210" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="EV2" />
<text x="7236" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">生产结构化事件</text>
<text x="7236" y="9539" font-size="25px" fill="#203947" font-weight="450">事件定义、主体/对象、新旧值、时间、上下文。</text>
<text x="7236" y="9575" font-size="25px" fill="#203947" font-weight="450">按各来源规则生产；连续中间状态如何聚合仍需具体契约。</text>
<text x="7236" y="9611" font-size="25px" fill="#203947" font-weight="450">该评审取消默认 30 秒抑制；状态聚合仍待单独对齐。</text>
<rect x="7210" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="EV3" />
<text x="7236" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">拼接可读事件描述</text>
<text x="7236" y="10067" font-size="25px" fill="#203947" font-weight="450">结构化字段与业务模板。</text>
<text x="7236" y="10103" font-size="25px" fill="#203947" font-weight="450">该期 Trigger 可先拼 event_info；缺模板兜底须按产品定义</text>
<text x="7236" y="10139" font-size="25px" fill="#203947" font-weight="450">。</text>
<text x="7236" y="10175" font-size="25px" fill="#203947" font-weight="450">文字描述须能与原始事实核对，不让模型编造行为。</text>
<rect x="6370" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="EV4" />
<text x="6396" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">事件入库与检索</text>
<text x="6396" y="10067" font-size="25px" fill="#203947" font-weight="450">带来源与时间的事件记录。</text>
<text x="6396" y="10103" font-size="25px" fill="#203947" font-weight="450">存储并支持消费者按用户/时间/类型读取。</text>
<text x="6396" y="10139" font-size="25px" fill="#203947" font-weight="450">事件可被查到不等于立刻触发一次对话。</text>
<rect x="6370" y="10491" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="EV5" />
<text x="6396" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">Context 消费支路</text>
<text x="6396" y="10595" font-size="25px" fill="#203947" font-weight="450">当前请求与相关事件窗口。</text>
<text x="6396" y="10631" font-size="25px" fill="#203947" font-weight="450">按重要性与时间选择进 SP/UP；条数和最终接入范围按版本核</text>
<text x="6396" y="10667" font-size="25px" fill="#203947" font-weight="450">验。</text>
<text x="6396" y="10703" font-size="25px" fill="#203947" font-weight="450">补充本轮事实，并留存实际被模型使用的版本。</text>
<rect x="7210" y="10491" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="EV6" />
<text x="7236" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">记忆生产支路</text>
<text x="7236" y="10595" font-size="25px" fill="#203947" font-weight="450">允许用于记忆的交互与行为事实。</text>
<text x="7236" y="10631" font-size="25px" fill="#203947" font-weight="450">归属正确身份，再总结、整理和纠错。</text>
<text x="7236" y="10667" font-size="25px" fill="#203947" font-weight="450">生成记忆候选；不是每条事件都直接变长期偏好。</text>
<rect x="7210" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="EV7" />
<text x="7236" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">业务订阅支路</text>
<text x="7236" y="11123" font-size="25px" fill="#203947" font-weight="450">订阅条件匹配的新事件。</text>
<text x="7236" y="11159" font-size="25px" fill="#203947" font-weight="450">通知特定业务；是否直接恢复交互需经过其接入策略。</text>
<text x="7236" y="11195" font-size="25px" fill="#203947" font-weight="450">进入对应业务或待对齐通知入口，不串行穿过记忆。</text>
<rect x="6370" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="EV8" />
<text x="6396" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">追溯与纠错</text>
<text x="6396" y="11123" font-size="25px" fill="#203947" font-weight="450">用户更正、异常状态与原始事实链。</text>
<text x="6396" y="11159" font-size="25px" fill="#203947" font-weight="450">核对生产源、字段、文字和消费者；不拿 AI 纪要当运行真值。</text>
<text x="6396" y="11195" font-size="25px" fill="#203947" font-weight="450">修正定义/后续使用，明确版本与数据责任。</text>
<rect x="8410" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="ME1" />
<text x="8436" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">身份与账号关联</text>
<text x="8436" y="9539" font-size="25px" fill="#203947" font-weight="450">音区、可用人脸/注册信息、账号状态。</text>
<text x="8436" y="9575" font-size="25px" fill="#203947" font-weight="450">座位不是稳定身份；身份不明时限制个体化读取。</text>
<text x="8436" y="9611" font-size="25px" fill="#203947" font-weight="450">形成有依据的主体归属，不能使用上一位乘员数据。</text>
<rect x="9250" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="ME2" />
<text x="9276" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">事实归属与记忆候选</text>
<text x="9276" y="9539" font-size="25px" fill="#203947" font-weight="450">允许留存的事件、交互与用户明确偏好。</text>
<text x="9276" y="9575" font-size="25px" fill="#203947" font-weight="450">确认是谁、何时发生、事实来源；区分经历与长期偏好。</text>
<text x="9276" y="9611" font-size="25px" fill="#203947" font-weight="450">进入记忆整理，或因权限/质量不足不生成。</text>
<rect x="9250" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="ME3" />
<text x="9276" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">记忆整理与更正</text>
<text x="9276" y="10067" font-size="25px" fill="#203947" font-weight="450">候选事实和已有记忆。</text>
<text x="9276" y="10103" font-size="25px" fill="#203947" font-weight="450">总结、去重、时效处理及用户纠错；真实实现按版本核验。</text>
<text x="9276" y="10139" font-size="25px" fill="#203947" font-weight="450">更新适用记忆，避免互相矛盾的偏好同时生效。</text>
<rect x="8410" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="ME4" />
<text x="8436" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">按任务检索并应用</text>
<text x="8436" y="10067" font-size="25px" fill="#203947" font-weight="450">本轮用户身份、目标与必要检索条件。</text>
<text x="8436" y="10103" font-size="25px" fill="#203947" font-weight="450">选相关且有效内容；查无结果要明确，不自编历史地点。</text>
<text x="8436" y="10139" font-size="25px" fill="#203947" font-weight="450">供 Context 或 memory 工具返回；保留原始事实追溯。</text>
<rect x="10450" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="DY1" />
<text x="10476" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">本轮携带有效卡片</text>
<text x="10476" y="9539" font-size="25px" fill="#203947" font-weight="450">用户发起 Query 时的 real_time_card。</text>
<text x="10476" y="9575" font-size="25px" fill="#203947" font-weight="450">传 title、content、button[]、reason；卡片出现本身不发</text>
<text x="10476" y="9611" font-size="25px" fill="#203947" font-weight="450"> Query。</text>
<text x="10476" y="9647" font-size="25px" fill="#203947" font-weight="450">供工具加载条件判断；卡片消失后的清理契约待核。</text>
<rect x="11290" y="9435" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="DY2" />
<text x="11316" y="9478" font-size="30px" fill="#0D4FA8" font-weight="750">判断 dynamic_condition</text>
<text x="11316" y="9539" font-size="25px" fill="#203947" font-weight="450">Agent 元信息与本轮 param 字段。</text>
<text x="11316" y="9575" font-size="25px" fill="#203947" font-weight="450">一层 AND/OR；exist / not_exist / in / not_in；异常按</text>
<text x="11316" y="9611" font-size="25px" fill="#203947" font-weight="450"> false。</text>
<text x="11316" y="9647" font-size="25px" fill="#203947" font-weight="450">符合才加载；这一期不是任意多层表达式或全状态判断。</text>
<rect x="11290" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="DY3" />
<text x="11316" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">注入本轮工具与页面</text>
<text x="11316" y="10067" font-size="25px" fill="#203947" font-weight="450">条件命中后的工具定义及卡片内容。</text>
<text x="11316" y="10103" font-size="25px" fill="#203947" font-weight="450">将 current_page_specific 插入 SP 对应位置。</text>
<text x="11316" y="10139" font-size="25px" fill="#203947" font-weight="450">工具可见但不强制选用；无关 Query 仍可走其他工具。</text>
<rect x="10450" y="9963" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="DY4" />
<text x="10476" y="10006" font-size="30px" fill="#0D4FA8" font-weight="750">Planner 选择语义操作</text>
<text x="10476" y="10067" font-size="25px" fill="#203947" font-weight="450">用户表达与当前卡片按钮。</text>
<text x="10476" y="10103" font-size="25px" fill="#203947" font-weight="450">仅在确实需要操作当前页时调用，不直接当车控 FC。</text>
<text x="10476" y="10139" font-size="25px" fill="#203947" font-weight="450">把页内诉求送卡片工具；不支持则澄清或走其他路径。</text>
<rect x="10450" y="10491" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="DY5" />
<text x="10476" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">工具内模型选择按钮</text>
<text x="10476" y="10595" font-size="25px" fill="#203947" font-weight="450">自然语言诉求与已有按钮候选。</text>
<text x="10476" y="10631" font-size="25px" fill="#203947" font-weight="450">匹配用户要接受、取消或选择的具体按钮，不能造一个新按钮。</text>
<text x="10476" y="10667" font-size="25px" fill="#203947" font-weight="450">返回 select_button；歧义、旧页面等完整契约待核。</text>
<rect x="11290" y="10491" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="DY6" />
<text x="11316" y="10534" font-size="30px" fill="#0D4FA8" font-weight="750">Frontier 下行到客户端</text>
<text x="11316" y="10595" font-size="25px" fill="#203947" font-weight="450">选中按钮的结果 JSON。</text>
<text x="11316" y="10631" font-size="25px" fill="#203947" font-weight="450">方案约定 chunk_type=1、content_type=9；agent_id 尚待</text>
<text x="11316" y="10667" font-size="25px" fill="#203947" font-weight="450">落定。</text>
<text x="11316" y="10703" font-size="25px" fill="#203947" font-weight="450">客户端恢复页面/业务关联，不能仅凭下行 ACK 报完成。</text>
<rect x="11290" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="DY7" />
<text x="11316" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">原按钮回调与复核</text>
<text x="11316" y="11123" font-size="25px" fill="#203947" font-weight="450">当前有效页面、按钮与原业务。</text>
<text x="11316" y="11159" font-size="25px" fill="#203947" font-weight="450">与真实点击走同一类回调；检查任务取消和页面失效。</text>
<text x="11316" y="11195" font-size="25px" fill="#203947" font-weight="450">回业务执行，或明确失败；不另造一条绕门禁车控链。</text>
<rect x="10450" y="11019" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="DY8" />
<text x="10476" y="11062" font-size="30px" fill="#0D4FA8" font-weight="750">结果与输入去重</text>
<text x="10476" y="11123" font-size="25px" fill="#203947" font-weight="450">按钮回调、业务状态与本轮归属。</text>
<text x="10476" y="11159" font-size="25px" fill="#203947" font-weight="450">检查本地可见即可说与云端语义是否重复消费。</text>
<text x="10476" y="11195" font-size="25px" fill="#203947" font-weight="450">真实结果回上下文；两条路线是互补而非互相替代。</text>
<rect x="10450" y="735" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="KN1" />
<text x="10476" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">能力与车型知识</text>
<text x="10476" y="839" font-size="25px" fill="#203947" font-weight="450">车辆功能边界、工具定义与接入版本。</text>
<text x="10476" y="875" font-size="25px" fill="#203947" font-weight="450">车型/环境隔离，核对支持能力、参数、工具名和 Schema。</text>
<text x="10476" y="911" font-size="25px" fill="#203947" font-weight="450">本轮候选工具与使用约束；静态定义不等于运行可用全集。</text>
<rect x="11290" y="735" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="KN2" />
<text x="11316" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">场景 knowhow</text>
<text x="11316" y="839" font-size="25px" fill="#203947" font-weight="450">业务经验、场景处理方法和规则。</text>
<text x="11316" y="875" font-size="25px" fill="#203947" font-weight="450">告诉模型怎么处理一类场景，不冒充此刻真实事实。</text>
<text x="11316" y="911" font-size="25px" fill="#203947" font-weight="450">供本轮 Context；知识错与状态错分开定位。</text>
<rect x="11290" y="1263" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="KN3" />
<text x="11316" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">本轮动态示例检索</text>
<text x="11316" y="1367" font-size="25px" fill="#203947" font-weight="450">当前 Query；省略表达必要时先 rewrite。</text>
<text x="11316" y="1403" font-size="25px" fill="#203947" font-weight="450">按适用范围召回相近示例并临时注入，保持车企/环境隔离。</text>
<text x="11316" y="1439" font-size="25px" fill="#203947" font-weight="450">帮助选择与参数表达；示例中的结果不等于已经执行。</text>
<rect x="10450" y="1263" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="KN4" />
<text x="10476" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">配置与回归发布</text>
<text x="10476" y="1367" font-size="25px" fill="#203947" font-weight="450">工具定义、示例、模型或策略的变更。</text>
<text x="10476" y="1403" font-size="25px" fill="#203947" font-weight="450">用保留测试集比对正确率、时延、成本和回归退化。</text>
<text x="10476" y="1439" font-size="25px" fill="#203947" font-weight="450">经对应发布流程生效，不让线上反馈自动改生产配置。</text>
<rect x="14530" y="735" width="760" height="390" rx="5" fill="#F3F7FD" stroke="#759CC8" stroke-width="2.2" data-node-id="MI1" />
<text x="14556" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">手势与屏幕 / 物理操作</text>
<text x="14556" y="839" font-size="25px" fill="#203947" font-weight="450">用户主动交互，及设备上的操作事件。</text>
<text x="14556" y="875" font-size="25px" fill="#203947" font-weight="450">区分明确请求与已经发生的操作事实，保留动作来源。</text>
<text x="14556" y="911" font-size="25px" fill="#203947" font-weight="450">请求进交互入口；事实进事件生产，不重复做同一动作。</text>
<rect x="15370" y="735" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="MI2" stroke-dasharray="10 7"/>
<text x="15396" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">手机与跨设备入口（规划）</text>
<text x="15396" y="839" font-size="25px" fill="#203947" font-weight="450">手车互联或第三方业务输入。</text>
<text x="15396" y="875" font-size="25px" fill="#203947" font-weight="450">长期架构保留该入口；账号授权与当前接入车型需核验。</text>
<text x="15396" y="911" font-size="25px" fill="#203947" font-weight="450">有效请求按统一契约进入，不能默认所有外部 Agent 可控车。</text>
<rect x="12490" y="735" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="RF1" stroke-dasharray="10 7"/>
<text x="12516" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">运行反馈与影子分析</text>
<text x="12516" y="839" font-size="25px" fill="#203947" font-weight="450">完整 Trace、用户反馈和真实执行事实。</text>
<text x="12516" y="875" font-size="25px" fill="#203947" font-weight="450">识别路由、上下文、推理、工具或时序错误；影子分析不默认改</text>
<text x="12516" y="911" font-size="25px" fill="#203947" font-weight="450">执行。</text>
<text x="12516" y="947" font-size="25px" fill="#203947" font-weight="450">提供 badcase 与修正建议，不冒充实际生产动作。</text>
<rect x="13330" y="735" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="RF2" stroke-dasharray="10 7"/>
<text x="13356" y="778" font-size="30px" fill="#0D4FA8" font-weight="750">Reflector / 纠错（规划）</text>
<text x="13356" y="839" font-size="25px" fill="#203947" font-weight="450">规划过程、结果偏差与可追溯证据。</text>
<text x="13356" y="875" font-size="25px" fill="#203947" font-weight="450">分析错误并提出策略、知识或表达改法。</text>
<text x="13356" y="911" font-size="25px" fill="#203947" font-weight="450">通过评测与发布流程进入后续版本，不自动在线改写全部规则。</text>
<rect x="13330" y="1263" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="RF3" stroke-dasharray="10 7"/>
<text x="13356" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">情境模拟与回归（规划）</text>
<text x="13356" y="1367" font-size="25px" fill="#203947" font-weight="450">场景条件、输入序列和预期状态。</text>
<text x="13356" y="1403" font-size="25px" fill="#203947" font-weight="450">模拟正常、失败、并发、取消与资源限制。</text>
<text x="13356" y="1439" font-size="25px" fill="#203947" font-weight="450">形成可复现测试和回归依据，不能代替实车验证。</text>
<rect x="12490" y="1263" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="RF4" stroke-dasharray="10 7"/>
<text x="12516" y="1306" font-size="30px" fill="#0D4FA8" font-weight="750">内心探索与主动追问（规划）</text>
<text x="12516" y="1367" font-size="25px" fill="#203947" font-weight="450">长期目标、用户情境与允许的主动交互范围。</text>
<text x="12516" y="1403" font-size="25px" fill="#203947" font-weight="450">自我认知与探索不等于获得执行权限。</text>
<text x="12516" y="1439" font-size="25px" fill="#203947" font-weight="450">经主动服务与交互门禁进入，受隐私及打扰策略约束。</text>
<rect x="12490" y="1791" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="RF5" stroke-dasharray="10 7"/>
<text x="12516" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">第三方 Agent / IoT（规划）</text>
<text x="12516" y="1895" font-size="25px" fill="#203947" font-weight="450">外部能力、设备状态与授权。</text>
<text x="12516" y="1931" font-size="25px" fill="#203947" font-weight="450">按能力注册、授权与调用契约扩展，不把外部文本当系统指令。</text>
<text x="12516" y="1967" font-size="25px" fill="#203947" font-weight="450">接领域执行与真实反馈；未接入能力不计作已上线工具。</text>
<rect x="13330" y="1791" width="760" height="390" rx="5" fill="#F4F2EE" stroke="#8E9179" stroke-width="2.2" data-node-id="RF6" stroke-dasharray="10 7"/>
<text x="13356" y="1834" font-size="30px" fill="#0D4FA8" font-weight="750">质量—时延—成本闭环</text>
<text x="13356" y="1895" font-size="25px" fill="#203947" font-weight="450">端到端目标兑现、假成功、错误率和分段耗时。</text>
<text x="13356" y="1931" font-size="25px" fill="#203947" font-weight="450">按车型、版本与场景分层；不把各段 P90 直接求和。</text>
<text x="13356" y="1967" font-size="25px" fill="#203947" font-weight="450">决定优化优先级；目标值与实测值分别记录。</text>

类型、单位和能力范围"],["这一步怎么做","配置侧需定义适用范围、信号、条件和动作，再下发端侧。端侧必须确认规则能被感知和执行；云端发布成功不能代替车端已获取、校验并生效。"],["放进同一个例子","系统预设“某车况满足后建议处理”时，先明确车型、信号单位、枚举与动作范围。"],["异常与交接","非法配置、能力缺失、版本未生效，应反馈具体失败，而非永远显示“等待中”。"],["产品要问清","规则版本在哪能读到？由谁负责场景方案、谁配置、谁提供实车验收？"],["这一步怎么做","车辆信号、应用状态、用户操作、默认感知等在端侧形成状态与事件，再按协议上报云端并被 Context 使用。缓存表示已保存的已知事实，不是保证仍然最新的事实。"],["放进同一个例子","用户手动关了空调，应产生相应状态或事件；否则模型可能继续使用刚才“空调打开成功”的历史。"],["异常与交接","全量、增量、轮询和变化上报的使用范围需逐个信号确认。丢包、时钟差、乱序必须反映在新鲜度判断里。"],["产品要问清","每个关键字段来自哪里、多久更新、缺失怎么表达？云端如何知道值已经过期？"]],"learn":["config"],"refs":"B,S06","detail":"给信号定义类型、枚举、单位、时间与来源；给动作定义可执行范围。字段名称相同不代表语义、单位必然相同。","oldId":"C2","layout":{"title":["13.2 信号与动作注册"],"body":["signal / action 字典","校验类型、单位和能力范围"],"detail":["给信号定义类型、枚举、单位、时间与来源；给动作定义可执行","范围。字段名称相同不代表语义、单位必然相同。"],"height":319}},{"id":"C3","group":"config","x":1090,"y":1263,"w":760,"h":390,"title":"13.3 条件表达与执行策略","body":["条件组合、持续时间、次数","冷却、优先级、适用范围"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","将组合条件、持续时间、次数与执行策略分别表达。冷却、优先级和适用范围是运行策略，不是模型临时猜出的默认值。"],["原有职责细节","条件组合、持续时间、次数；冷却、优先级、适用范围"],["这一步怎么做","配置侧需定义适用范围、信号、条件和动作，再下发端侧。端侧必须确认规则能被感知和执行；云端发布成功不能代替车端已获取、校验并生效。"],["放进同一个例子","系统预设“某车况满足后建议处理”时，先明确车型、信号单位、枚举与动作范围。"],["异常与交接","非法配置、能力缺失、版本未生效，应反馈具体失败，而非永远显示“等待中”。"],["产品要问清","规则版本在哪能读到？由谁负责场景方案、谁配置、谁提供实车验收？"],["这一步怎么做","满足条件后还要核对冷却、去重、范围、取消和冲突策略，再进入执行域。端云可能同时对同一场景有判断，谁持有执行权需要真实契约，不应假定天然不会重复。"],["放进同一个例子","一个持续为真的条件不应每次快照都再做同一动作；用户刚取消的任务也不应被迟到事件唤醒。"],["异常与交接","端侧资源不足、队列拥塞、规则更新、重启或断网恢复可能导致漏触发或旧事件补触发，必须作为独立测试维度。"],["产品要问清","错误来自规则、端侧资源、模型语义还是软硬件时序？哪条证据能排除另外三类？"]],"learn":["config"],"refs":"B,S06","detail":"将组合条件、持续时间、次数与执行策略分别表达。冷却、优先级和适用范围是运行策略，不是模型临时猜出的默认值。","oldId":"C3","layout":{"title":["13.3 条件表达与执行策略"],"body":["条件组合、持续时间、次数","冷却、优先级、适用范围"],"detail":["将组合条件、持续时间、次数与执行策略分别表达。冷却、优先","级和适用范围是运行策略，不是模型临时猜出的默认值。"],"height":319}},{"id":"C4","group":"config","x":250,"y":1263,"w":760,"h":390,"title":"13.4 发布校验","body":["格式 / 可感知 / 可执行","不可满足 → 返回配置失败"],"role":"decision","tone":"blue","future":false,"kind":"decisi 标、条件与动作变成可管理定义。"],["异常与交接","任务操作识别、目标定位和参数补齐可能失败。不能把“请求已转发”当成“任务已可靠创建”。"],["产品要问清","谁判断用户是在新增、改旧任务还是取消？多条同类任务时如何找对目标？"]],"learn":["task"],"refs":"旧版 v11 来源 S3；本轮未重新核验 Task 正文","detail":"恢复请求与旧任务/运行的关联，处理幂等，再区分用户操作、触发事件和只读查询。多条同类任务时不能随意选一个修改。","oldId":"K2","layout":{"title":["17.2 Ingress 接入"],"body":["恢复请求关联、幂等校验","语义请求 / 事件 / 查询分流"],"detail":["恢复请求与旧任务/运行的关联，处理幂等，再区分用户操作、","触发事件和只读查询。多条同类任务时不能随意选一个修改。"],"height":319}},{"id":"K3","group":"task","x":5170,"y":1263,"w":760,"h":390,"title":"17.3 Spec Builder","body":["模型识别创建/修改/取消","生成目标、条件、执行文本"],"role":"step","tone":"purple","future":true,"kind":"step","paras":[["这个小模块做什么","识别新增、修改或取消，补齐目标、条件与执行内容。不支持的条件或含糊对象需澄清，不能保存一段无法执行的自然语言就称创建成功。"],["原有职责细节","模型识别创建/修改/取消；生成目标、条件、执行文本"],["这一步怎么做","新设计中 Planner 把任务类型和文本交 Task Agent，后者是代理入口；Ingress 做关联恢复、幂等与语义/事件/查询分流。Spec Builder 再识别创建、修改或取消，生成命令和任务定义。"],["放进同一个例子","创建“到达后提醒”时，Planner 不必直接生成完整 TaskSpec；Task 服务负责把目标、条件与动作变成可管理定义。"],["异常与交接","任务操作识别、目标定位和参数补齐可能失败。不能把“请求已转发”当成“任务已可靠创建”。"],["产品要问清","谁判断用户是在新增、改旧任务还是取消？多条同类任务时如何找对目标？"]],"learn":["task"],"refs":"旧版 v11 来源 S3；本轮未重新核验 Task 正文","detail":"识别新增、修改或取消，补齐目标、条件与执行内容。不支持的条件或含糊对象需澄清，不能保存一段无法执行的自然语言就称创建成功。","oldId":"K3","layout":{"title":["17.3 Spec Builder"],"body":["模型识别创建/修改/取消","生成目标、条件、执行文本"],"detail":["识别新增、修改或取消，补齐目标、条件与执行内容。不支持的","条件或含糊对象需澄清，不能保存一段无法执行的自然语言就称","创建成功。"],"height":355}},{"id":"K4","group":"task","x":4330,"y":1263,"w":760,"h":390,"title":"17.4 Manager 管理","body":["条件合理性、数量与冲突","创建/更新/取消生命周期"],"role":"step","tone":"purple","future":true,"kind":"step","paras":[["这个小模块做什么","检查数量、合理性与生命周期策略，执行创建、更新或取消。Task 的等待/运行/关闭和单次 Run 的结果状态分别管理。"],["原有职责细节","条件合理性、数量与冲突；创建/更新/取消生命周期"],["这一步怎么做","Manager 管理数量、生命周期和策略；Repository 保存 Task、Run、Event、Binding 等关联；Trigger Adapter 把可执行条件转换并注册到触发系统。等待成立以后才可对用户承诺已建立任务。"],["放进同一个例子","“到达游泳馆”要有可观测的条件和明确执行内容。只存了一段自然语言，却没注册可用条件，任务并不能真正等到未来。"],["异常与交接","新设计区分任务 waiting/running/closed 与单次 Run 的成功、失败、跳过、取消；等待用户或外部结果仍可能是一次运行中的阶段。"],["产品要问清","创建成功的证据是口头回复、Spec 生成，还是已持久化且条件订阅可用？"]],"learn":["task 接","框架要保留被抑制的原因，才能区分建议不准与没送达。用户拒绝后的降频也应明确。"],["产品要问清","可见建议的分母是生成数还是实际送达数？负向打扰如何标注与回归？"]],"learn":["advisor"],"refs":"A,B","detail":"按策略交 Planner 建议或以 AI Bar 等方式呈现。静默展示、主动播报与自动执行是不同等级，不应共用一份隐含授权。","oldId":"A4","layout":{"title":["16.4 建议与交互等级"],"body":["给 Planner 建议，或 AI Bar","提议不等于执行成功"],"detail":["按策略交 Planner 建议或以 AI Bar 等方式呈现。静默展示","、主动播报与自动执行是不同等级，不应共用一份隐含授权。"],"height":319}},{"id":"A5","group":"advisor","x":8410,"y":1791,"w":760,"h":390,"title":"16.5 用户接受/拒绝","body":["接受 → 对应业务调用","拒绝 → 记录，不反复打扰"],"role":"decision","tone":"amber","future":false,"kind":"decision","paras":[["这个小模块做什么","用户接受后进入对应业务决策/执行；拒绝则记录负反馈与后续打扰策略。点击接受不等于工具已成功执行。"],["原有职责细节","接受 → 对应业务调用；拒绝 → 记录，不反复打扰"],["这一步怎么做","有效 Advisor input 进入 03，与 Context 一起交 04 判断。用户采纳后通过相应工具执行，结果仍回 07；旧 Goal 监控建议也不能绕过真实执行与结果闭环。"],["放进同一个例子","用户接受降温建议后，要能确认实际控制成功；只点了“接受”但空调没变，不能计为完整行为成功。"],["异常与交接","建议生成、送达、点击、执行开始、最终完成是不同漏斗。拒绝与关闭也要反馈，避免重复打扰。"],["产品要问清","是否能从一条建议追到对应工具调用与真实结果？不能只有点击率而无兑现率。"]],"learn":["advisor"],"refs":"A,B","detail":"用户接受后进入对应业务决策/执行；拒绝则记录负反馈与后续打扰策略。点击接受不等于工具已成功执行。","oldId":"A5","layout":{"title":["16.5 用户接受/拒绝"],"body":["接受 → 对应业务调用","拒绝 → 记录，不反复打扰"],"detail":["用户接受后进入对应业务决策/执行；拒绝则记录负反馈与后续","打扰策略。点击接受不等于工具已成功执行。"],"height":319}},{"id":"A6","group":"advisor","x":9250,"y":1791,"w":760,"h":390,"title":"16.6 结果与效果反馈","body":["实际行为、采纳与打扰","结果同步上下文，便于后续判断"],"role":"step","tone":"amber","future":false,"kind":"step","paras":[["这个小模块做什么","将生成、送达、采纳、真实执行和负向打扰分别回流。只看点击率会漏掉接受了却没有兑现的体验问题。"],["原有职责细节","实际行为、采纳与打扰；结果同步上下文，便于后续判断"],["这一步怎么做","有效 Advisor input 进入 03，与 Context 一起交 04 判断。用户采纳后通过相应工具执行，结果仍回 07；旧 Goal 监控建议也不能绕过真实执行与结果闭环。"],["放进同一个例子","用户接受降温建议后，要能确认实际控制成功；只点了“接受”但空调没变，不能计为完整行为成功。"],["异常与交接","建议生成、送达、点击、执行开始、最终完成是不同漏斗。拒绝与关闭也要反馈，避免重复打扰。"],["产品要问清","是否能从一条建议追到对应工具调用与真实结果？不能只有点击率而无兑现率。"]],"learn":["advisor"],"refs":"A,B","detail":"将生成、送达、采纳、真实执行和负向打扰分别回流。只看点击率会漏掉接受了却没有兑现的体验问题。","oldId":"A6","layout":{"title":["16.6 结果与效果反馈"],"body":["实际行为、采纳与打扰","结果同步上下文，便于后续判断"],"detail":["将生成、送达、采纳、真实执行和负向打扰分别回流。只看点击","
