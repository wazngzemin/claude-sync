<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="l2-split" width="1200" height="661" viewBox="0 0 1200 661" role="img" aria-labelledby="l2-split-title l2-split-desc">
<title id="l2-split-title">谁看、谁判断、谁做，端云有三种分工</title><desc id="l2-split-desc">对照常驻观察进上下文、天气路况保护和低续航提醒，先看判断发生在哪一端。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="l2-split-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">谁看、谁判断、谁做，端云有三种分工</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">对照常驻观察进上下文、天气路况保护和低续航提醒，先看判断发生在哪一端。</text>
<g data-node="true" id="l2-split-observe-cloud">
<rect class="v56-neutral" x="32" y="127" width="368" height="388" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="160" text-anchor="start">车上看、云上判断</text>
<text class="v56-subtitle" x="46" y="186" text-anchor="start">例子 · 常驻观察进上下文</text>
<path class="v56-rule" d="M 46 211 L 386 211"/>
<circle data-decoration="true" class="v56-local" cx="52" cy="240" r="6" stroke-width="1.6"/>
<text class="v56-label" x="68" y="245" text-anchor="start">谁看 · 车上</text>
<text class="v56-node-sub" x="68" y="275" text-anchor="start">舱外视觉持续观察，结果上云</text>
<path class="v56-rule" d="M 46 307 L 386 307"/>
<circle data-decoration="true" class="v56-cloud" cx="52" cy="336" r="6" stroke-width="1.6"/>
<text class="v56-label" x="68" y="341" text-anchor="start">谁判断 · 云端</text>
<text class="v56-node-sub" x="68" y="371" text-anchor="start">Advisor 或 Planner 结合上下文判断</text>
<path class="v56-rule" d="M 46 403 L 386 403"/>
<circle data-decoration="true" class="v56-cloud" cx="52" cy="432" r="6" stroke-width="1.6"/>
<text class="v56-label" x="68" y="437" text-anchor="start">谁做 · 云端交车端</text>
<text class="v56-node-sub" x="68" y="467" text-anchor="start">Planner 决定怎么回应，车端呈现</text>
</g>
<g data-node="true" id="l2-split-local">
<rect class="v56-neutral" x="416" y="127" width="368" height="388" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="430" y="160" text-anchor="start">车上看、车上判断、车上做</text>
<text class="v56-subtitle" x="430" y="186" text-anchor="start">例子 · 浓雾中询问是否开后雾灯</text>
<path class="v56-rule" d="M 430 211 L 770 211"/>
<circle data-decoration="true" class="v56-local" cx="436" cy="240" r="6" stroke-width="1.6"/>
<text class="v56-label" x="452" y="245" text-anchor="start">谁看 · 车上</text>
<text class="v56-node-sub" x="452" y="275" text-anchor="start">舱外视觉识别浓雾</text>
<path class="v56-rule" d="M 430 307 L 770 307"/>
<circle data-decoration="true" class="v56-local" cx="436" cy="336" r="6" stroke-width="1.6"/>
<text class="v56-label" x="452" y="341" text-anchor="start">谁判断 · 车上</text>
<text class="v56-node-sub" x="452" y="371" text-anchor="start">端侧触发器查车速、雾灯、任务开关</text>
<path class="v56-rule" d="M 430 403 L 770 403"/>
<circle data-decoration="true" class="v56-local" cx="436" cy="432" r="6" stroke-width="1.6"/>
<text class="v56-label" x="452" y="437" text-anchor="start">谁做 · 车上</text>
<text class="v56-node-sub" x="452" y="467" text-anchor="start">天气业务问主驾，复核后交车控</text>
</g>
<g data-node="true" id="l2-split-cloud">
<rect class="v56-neutral" x="800" y="127" width="368" height="388" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="814" y="160" text-anchor="start">云上看、云上判断</text>
<text class="v56-subtitle" x="814" y="186" text-anchor="start">例子 · 续航低于 100 公里时提醒</text>
<path class="v56-rule" d="M 814 211 L 1154 211"/>
<circle data-decoration="true" class="v56-cloud" cx="820" cy="240" r="6" stroke-width="1.6"/>
<text class="v56-label" x="836" y="245" text-anchor="start">谁看 · 云端</text>
<text class="v56-node-sub" x="836" y="275" text-anchor="start">云端触发器读取已上报的续航</text>
<path class="v56-rule" d="M 814 307 L 1154 307"/>
<circle data-decoration="true" class="v56-cloud" cx="820" cy="336" r="6" stroke-width="1.6"/>
<text class="v56-label" x="836" y="341" text-anchor="start">谁判断 · 云端</text>
<text class="v56-node-sub" x="836" y="371" text-anchor="start">云端触发器核对低续航条件</text>
<path class="v56-rule" d="M 814 403 L 1154 403"/>
<circle data-decoration="true" class="v56-cloud" cx="820" cy="432" r="6" stroke-width="1.6"/>
<text class="v56-label" x="836" y="437" text-anchor="start">谁做 · 云端交车端</text>
<text class="v56-node-sub" x="836" y="467" text-anchor="start">Planner 决定怎么提醒，车端播报</text>
</g>
<path class="v56-rule" d="M 32 550 L 1168 550"/>
<text class="v56-node-title" x="32" y="584" text-anchor="start">固定动作可以在车上完成。需要上下文和记忆的判断交给云端。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="610" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="624" text-anchor="start">蓝：车上负责</text>
<rect data-decoration="true" class="v56-cloud" x="410.6666666666667" y="610" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="624" text-anchor="start">绿：云端负责</text>
<rect data-decoration="true" class="v56-neutral" x="789.3333333333334" y="610" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="624" text-anchor="start">灰框：一条分工路径</text>
</svg>
