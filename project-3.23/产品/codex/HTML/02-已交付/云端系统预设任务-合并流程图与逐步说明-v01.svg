<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="1270" viewBox="0 0 1950 1270" role="img" aria-label="云端任务合并业务流程图"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c8ba0"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="1950" height="1270" fill="white"/><text x="975" y="39" text-anchor="middle" fill="#203859" font-size="30" font-weight="600"><tspan x="975" dy="0">云端系统预设任务｜从配置到真实车辆结果</tspan></text><text x="975" y="73" text-anchor="middle" fill="#66768a" font-size="18" font-weight="400"><tspan x="975" dy="0">以充电口盖为例 · Trigger交事件 · 原业务注册卡、收选择、申请执行 · 端侧复核并回读</tspan></text><rect x="20" y="95" width="350" height="570" rx="12" fill="#fffef0" stroke="#cece87" stroke-width="1.5"/><text x="195" y="133" text-anchor="middle" fill="#4b4e36" font-size="22" font-weight="600"><tspan x="195" dy="0">一、配置发布</tspan></text><rect x="410" y="95" width="350" height="870" rx="12" fill="#fffef0" stroke="#cece87" stroke-width="1.5"/><text x="585" y="133" text-anchor="middle" fill="#4b4e36" font-size="22" font-weight="600"><tspan x="585" dy="0">二、开启与触发</tspan></text><rect x="800" y="95" width="350" height="870" rx="12" fill="#fffef0" stroke="#cece87" stroke-width="1.5"/><text x="975" y="133" text-anchor="middle" fill="#4b4e36" font-size="22" font-weight="600"><tspan x="975" dy="0">三、设备判断</tspan></text><rect x="1190" y="95" width="350" height="1070" rx="12" fill="#fffef0" stroke="#cece87" stroke-width="1.5"/><text x="1365" y="133" text-anchor="middle" fill="#4b4e36" font-size="22" font-weight="600"><tspan x="1365" dy="0">四、卡片交互</tspan></text><rect x="1580" y="95" width="350" height="970" rx="12" fill="#fffef0" stroke="#cece87" stroke-width="1.5"/><text x="1755" y="133" text-anchor="middle" fill="#4b4e36" font-size="22" font-weight="600"><tspan x="1755" dy="0">五、执行与结果</tspan></text><polyline points="195,310 195,376" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="204" y="345" fill="#7c8ba0" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:5px">保存、校验</text><polyline points="585,260 585,306" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="585,425 585,471" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="585,590 585,636" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="585,770 585,836" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="594" y="805" fill="#7c8ba0" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:5px">否</text><polyline points="348,435 390,435 390,215 427,215" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="383" y="325" text-anchor="middle" transform="rotate(-90 383 325)" fill="#4f75a6" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:4px">任务可用</text><polyline points="975,260 975,306" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="975,410 975,461" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="975,580 975,636" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="975,770 975,836" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="984" y="805" fill="#7c8ba0" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:5px">否</text><polyline points="738,705 780,705 780,215 817,215" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="773" y="460" text-anchor="middle" transform="rotate(-90 773 460)" fill="#4f75a6" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:4px">是：业务事件</text><polyline points="1365,285 1365,331" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="1365,430 1365,471" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="1365,605 1365,635 1283.5,635 1283.5,671" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="1373" y="627" fill="#7c8ba0" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:5px">是</text><polyline points="1365,635 1446.5,635 1446.5,671" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="1283.5,810 1283.5,835 1365,835 1365,866" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="1446.5,810 1446.5,835 1365,835" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="1365,1000 1365,1056" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="1374" y="1030" fill="#7c8ba0" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:5px">否</text><polyline points="1212,540 1198,540 1198,1102.5 1208,1102.5" fill="none" stroke="#b57979" stroke-width="2"  marker-end="url(#arr)"/><text x="1197" y="650" fill="#b57979" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:5px">否</text><polyline points="1128,705 1170,705 1170,227.5 1207,227.5" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="1163" y="466.25" text-anchor="middle" transform="rotate(-90 1163 466.25)" fill="#4f75a6" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:4px">是：进入询问</text><polyline points="1755,290 1755,341" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="1755,475 1755,551" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="1764" y="515" fill="#7c8ba0" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:5px">是</text><polyline points="1755,650 1755,716" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="1755,815 1755,926" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><polyline points="1908,410 1922,410 1922,985 1912,985" fill="none" stroke="#b57979" stroke-width="2"  marker-end="url(#arr)"/><text x="1917" y="690" text-anchor="middle" transform="rotate(-90 1917 690)" fill="#b57979" font-size="16" style="paint-order:stroke;stroke:white;stroke-width:4px">否：返回原因／无需重复</text><polyline points="1518,935 1560,935 1560,230 1597,230" fill="none" stroke="#7c8ba0" stroke-width="2"  marker-end="url(#arr)"/><text x="1553" y="582.5" text-anchor="middle" transform="rotate(-90 1553 582.5)" fill="#4f75a6" font-size="16" style="paint-order:stroke;stroke:#fff;stroke-width:4px">是：有效确认</text><rect x="42" y="200" width="306" height="110" rx="9" fill="#fff3dc" stroke="#cc9c38" stroke-width="1.8"/><text x="195" y="234.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="195" dy="0">01 产品定义完整任务</tspan><tspan x="195" dy="27">规则、交互、动作</tspan><tspan x="195" dy="27">车型与成功标准</tspan></text><rect x="42" y="380" width="306" height="110" rx="9" fill="#fff3dc" stroke="#cc9c38" stroke-width="1.8"/><text x="195" y="414.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="195" dy="0">02 配置平台校验发布</tspan><tspan x="195" dy="27">Trigger读规则</tspan><tspan x="195" dy="27">原业务读后续配置</tspan></text><rect x="432" y="170" width="306" height="90" rx="9" fill="#eaf2ff" stroke="#6087c7" stroke-width="1.8"/><text x="585" y="208" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="585" dy="0">03 任务中心</tspan><tspan x="585" dy="27">转交用户开启操作</tspan></text><rect x="432" y="310" width="306" height="115" rx="9" fill="#eaf2ff" stroke="#6087c7" stroke-width="1.8"/><text x="585" y="347" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="585" dy="0">04 任务状态承接方</tspan><tspan x="585" dy="27">保存、回显并提供许可</tspan><tspan x="585" dy="27">Task Service承接待确认</tspan></text><rect x="432" y="475" width="306" height="115" rx="9" fill="#eaf2ff" stroke="#6087c7" stroke-width="1.8"/><text x="585" y="512" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="585" dy="0">05 Cloud Trigger</tspan><tspan x="585" dy="27">读取开关、配置和上行车况</tspan><tspan x="585" dy="27">判断条件、时效和去重</tspan></text><path d="M585 640L738 705L585 770L432 705Z" fill="#fff5da" stroke="#cf9c47" stroke-width="1.8"/><text x="585" y="690" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="585" dy="0">前置条件有效</tspan><tspan x="585" dy="27">且本次停车未处理？</tspan></text><rect x="432" y="840" width="306" height="85" rx="9" fill="#f4f5f7" stroke="#a3acb8" stroke-width="1.8"/><text x="585" y="875.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="585" dy="0">不触发</tspan><tspan x="585" dy="27">等待后续有效事件</tspan></text><rect x="822" y="170" width="306" height="90" rx="9" fill="#f1eaff" stroke="#9c7ac4" stroke-width="1.8"/><text x="975" y="208" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="975" dy="0">06 系统预设任务业务</tspan><tspan x="975" dy="27">接事件；发起设备判断</tspan></text><rect x="822" y="310" width="306" height="100" rx="9" fill="#f1eaff" stroke="#9c7ac4" stroke-width="1.8"/><text x="975" y="353" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="975" dy="0">07 主动推荐 → DT</tspan><tspan x="975" dy="27">按需结合端侧视觉／VQA</tspan></text><rect x="822" y="465" width="306" height="115" rx="9" fill="#eaf2ff" stroke="#6087c7" stroke-width="1.8"/><text x="975" y="502" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="975" dy="0">08 端侧沿现链路取得结果</tspan><tspan x="975" dy="27">交回原业务</tspan><tspan x="975" dy="27">回传通道待确认</tspan></text><path d="M975 640L1128 705L975 770L822 705Z" fill="#fff5da" stroke="#cf9c47" stroke-width="1.8"/><text x="975" y="690" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="975" dy="0">09 原业务校验</tspan><tspan x="975" dy="27">找到、有效且属本次停车？</tspan></text><rect x="822" y="840" width="306" height="85" rx="9" fill="#f4f5f7" stroke="#a3acb8" stroke-width="1.8"/><text x="975" y="875.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="975" dy="0">结束本次，不出开盖询问</tspan><tspan x="975" dy="27">无设备／未知／失败／过时</tspan></text><rect x="1212" y="170" width="306" height="115" rx="9" fill="#f1eaff" stroke="#9c7ac4" stroke-width="1.8"/><text x="1365" y="207" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1365" dy="0">10 原业务注册卡并申请展示</tspan><tspan x="1365" dy="27">文案、按钮、TTS</tspan><tspan x="1365" dy="27">回调、路线与有效期</tspan></text><rect x="1212" y="335" width="306" height="95" rx="9" fill="#f1eaff" stroke="#9c7ac4" stroke-width="1.8"/><text x="1365" y="375.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1365" dy="0">11 即时交互卡／VUI</tspan><tspan x="1365" dy="27">排队、实际展示、按策略播报</tspan></text><path d="M1365 475L1518 540L1365 605L1212 540Z" fill="#fff5da" stroke="#cf9c47" stroke-width="1.8"/><text x="1365" y="525" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1365" dy="0">本次询问已展示</tspan><tspan x="1365" dy="27">且仍有效？</tspan></text><rect x="1212" y="675" width="143" height="135" rx="9" fill="#f1eaff" stroke="#9c7ac4" stroke-width="1.8"/><text x="1283.5" y="708.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1283.5" dy="0">12a 点击</tspan><tspan x="1283.5" dy="27">直回业务</tspan><tspan x="1283.5" dy="27">或模拟Query</tspan><tspan x="1283.5" dy="27">仅选一路</tspan></text><rect x="1375" y="675" width="143" height="135" rx="9" fill="#f1eaff" stroke="#9c7ac4" stroke-width="1.8"/><text x="1446.5" y="708.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1446.5" dy="0">12b 泛化语音</tspan><tspan x="1446.5" dy="27">当前上下文交</tspan><tspan x="1446.5" dy="27">DT／Planner</tspan><tspan x="1446.5" dy="27">理解后回业务</tspan></text><path d="M1365 870L1518 935L1365 1000L1212 935Z" fill="#fff5da" stroke="#cf9c47" stroke-width="1.8"/><text x="1365" y="920" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1365" dy="0">13 原业务核对选择</tspan><tspan x="1365" dy="27">明确确认、有效且未消费？</tspan></text><rect x="1212" y="1060" width="306" height="85" rx="9" fill="#f4f5f7" stroke="#a3acb8" stroke-width="1.8"/><text x="1365" y="1095.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1365" dy="0">不执行；按对应分支处理</tspan><tspan x="1365" dy="27">拒绝／关闭／超时则结束本次</tspan></text><rect x="1602" y="170" width="306" height="120" rx="9" fill="#e8f5ee" stroke="#63a286" stroke-width="1.8"/><text x="1755" y="209.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1755" dy="0">14 原业务申请执行</tspan><tspan x="1755" dy="27">端侧复核最新许可与车况</tspan><tspan x="1755" dy="27">停车、确认及重复处理</tspan></text><path d="M1755 345L1908 410L1755 475L1602 410Z" fill="#fff5da" stroke="#cf9c47" stroke-width="1.8"/><text x="1755" y="395" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1755" dy="0">允许且仍需执行？</tspan></text><rect x="1602" y="555" width="306" height="95" rx="9" fill="#e8f5ee" stroke="#63a286" stroke-width="1.8"/><text x="1755" y="595.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1755" dy="0">15 端侧调用赛力斯车控</tspan><tspan x="1755" dy="27">申请一次打开充电口盖</tspan></text><rect x="1602" y="720" width="306" height="95" rx="9" fill="#e8f5ee" stroke="#63a286" stroke-width="1.8"/><text x="1755" y="760.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1755" dy="0">16 读取口盖真实状态</tspan><tspan x="1755" dy="27">达成／失败／暂不能确认</tspan></text><rect x="1602" y="930" width="306" height="110" rx="9" fill="#e8f5ee" stroke="#63a286" stroke-width="1.8"/><text x="1755" y="964.5" text-anchor="middle" fill="#24344a" font-size="18" font-weight="400"><tspan x="1755" dy="0">17 原业务更新卡片与记录</tspan><tspan x="1755" dy="27">结束本次</tspan><tspan x="1755" dy="27">任务有效时才继续等待</tspan></text><text x="975" y="1205" text-anchor="middle" fill="#536174" font-size="18" font-weight="400"><tspan x="975" dy="0">各列从上向下，再沿蓝色箭头进入下一列；编号对应正文。灰色分支不操作车辆。</tspan></text><text x="975" y="1237" text-anchor="middle" fill="#536174" font-size="19" font-weight="600"><tspan x="975" dy="0">配置可用 ≠ 用户开启 ≠ 条件命中 ≠ 用户确认 ≠ 车辆完成</tspan></text></svg>