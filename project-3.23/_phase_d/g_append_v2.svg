<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -20 1810 2000" font-family="Noto Sans SC, sans-serif">
  <!-- 补充区分区框：放在原图最低节点(y≈1452)以下 100px -->
  <rect x="40" y="1560" width="1760" height="400" rx="8" fill="#FAFBFC" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="1590" font-size="18" font-weight="bold" fill="#37474F">本次补充：10 月方案口径（G13 到 G19），分别接回 G01、G03、G04、G05、G06、G10、G11</text>
  <text x="60" y="1612" font-size="13" fill="#78909C">以下节点为 2.6 目标口径（10 月方案），不替代原图 G01 到 G12 的主判断流程；状态写在卡片要点里</text>

  <!-- 第一行卡片 y=1630，高 150 -->
  <!-- G13 信号来源（蓝底） -->
  <rect x="60" y="1630" width="410" height="150" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="78" y="1655" font-size="16" font-weight="bold" fill="#1565C0">G13　七类信号从哪来</text>
  <text x="78" y="1678" font-size="13" fill="#37474F">端侧 5 类：端状态 / 端视觉 / 端埋点 / 电子围栏 / 日期时间</text>
  <text x="78" y="1698" font-size="13" fill="#37474F">云端 2 类：后端业务事件 / 事件服务</text>
  <text x="78" y="1718" font-size="13" fill="#37474F">每路信号先过 G02 车况校验，再进 G03 叫醒这次检查</text>
  <text x="78" y="1745" font-size="13" fill="#E65100">【2.6 目标 / 10 月方案】</text>

  <!-- G14 注册方（蓝底） -->
  <rect x="490" y="1630" width="410" height="150" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="508" y="1655" font-size="16" font-weight="bold" fill="#1565C0">G14　谁能注册一条场景</text>
  <text x="508" y="1678" font-size="13" fill="#37474F">五路：Advisor / Planner / 产品预设 / 运营配置 / 用户自定义</text>
  <text x="508" y="1698" font-size="13" fill="#37474F">每条场景必须带原业务标识，G01 保存时校验</text>
  <text x="508" y="1718" font-size="13" fill="#37474F">Planner 注册默认最高优先级（见 G16）</text>
  <text x="508" y="1745" font-size="13" fill="#E65100">【2.6 目标 / 10 月方案】</text>

  <!-- G15 数值抖动过滤（金底判断） -->
  <rect x="920" y="1630" width="410" height="150" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.5"/>
  <text x="938" y="1655" font-size="16" font-weight="bold" fill="#E65100">G15　数值抖动怎么过滤</text>
  <text x="938" y="1678" font-size="13" fill="#37474F">第一次触发后，时间窗口内的波动不再重复触发</text>
  <text x="938" y="1698" font-size="13" fill="#37474F">窗口长度 / 抖动阈值按场景单独配（G01 保存）</text>
  <text x="938" y="1718" font-size="13" fill="#37474F">避免车速在 60 公里每小时上下浮动时反复弹卡</text>
  <text x="938" y="1745" font-size="13" fill="#C62828">【已落地 / 窗口与阈值按场景确认中】</text>

  <!-- G16 场景优先级（金底判断） -->
  <rect x="1350" y="1630" width="410" height="150" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.5"/>
  <text x="1368" y="1655" font-size="16" font-weight="bold" fill="#E65100">G16　同一次扫描命中多个怎么办</text>
  <text x="1368" y="1678" font-size="13" fill="#37474F">1 到 10 档优先级，只执行最高档，其余留记录</text>
  <text x="1368" y="1698" font-size="13" fill="#37474F">Planner 注册默认最高档</text>
  <text x="1368" y="1718" font-size="13" fill="#37474F">G06 策略拦截 / 命中分别留记录，便于复盘</text>
  <text x="1368" y="1745" font-size="13" fill="#C62828">【已落地 / 档位表待运营确认】</text>

  <!-- 第二行卡片 y=1810，高 140 -->
  <!-- G17 定时五形态（蓝底） -->
  <rect x="60" y="1810" width="410" height="140" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="78" y="1835" font-size="16" font-weight="bold" fill="#1565C0">G17　定时任务的五种时间形态</text>
  <text x="78" y="1858" font-size="13" fill="#37474F">① 相对延时一次性　② 绝对时间一次性</text>
  <text x="78" y="1878" font-size="13" fill="#37474F">③ 周期　④ 相对延时周期　⑤ 绝对时间周期</text>
  <text x="78" y="1898" font-size="13" fill="#37474F">G10 调度到时只回业务方，不直接控车</text>
  <text x="78" y="1925" font-size="13" fill="#E65100">【2.6 目标 / 10 月方案】</text>

  <!-- G18 改任务=删旧增新（蓝底） -->
  <rect x="490" y="1810" width="410" height="140" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="508" y="1835" font-size="16" font-weight="bold" fill="#1565C0">G18　用户改任务不是原地更新</text>
  <text x="508" y="1858" font-size="13" fill="#37474F">改时间 / 改内容 / 改条件类型：旧任务整条注销</text>
  <text x="508" y="1878" font-size="13" fill="#37474F">再按新配置注册一条，任务编号会变</text>
  <text x="508" y="1898" font-size="13" fill="#37474F">不支持半更新，避免旧条件残留</text>
  <text x="508" y="1925" font-size="13" fill="#E65100">【2.6 目标 / 10 月方案】</text>

  <!-- G19 视觉三态（金底判断） -->
  <rect x="920" y="1810" width="410" height="140" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.5"/>
  <text x="938" y="1835" font-size="16" font-weight="bold" fill="#E65100">G19　视觉语义判断只回三态</text>
  <text x="938" y="1858" font-size="13" fill="#37474F">达成 / 未达成 / 无法判断，无置信度字段</text>
  <text x="938" y="1878" font-size="13" fill="#37474F">"无法判断" ≠ "没儿童" ≠ "条件不满足"</text>
  <text x="938" y="1898" font-size="13" fill="#37474F">G11 不负责播报结束，只回业务方</text>
  <text x="938" y="1925" font-size="13" fill="#C62828">【2.6 目标 / 无置信度字段为讨论中】</text>
</svg>
