<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="Planner怎么把一句诉求办完：思考、行动、观察、再思考" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-planner" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">Planner怎么把一句诉求办完：思考、行动、观察、再思考</text><text x="30" y="58" font-size="13" fill="#5f7169">教学案例 · 不是每次都固定查同一批工具</text><g transform="translate(0,78)"><path class="flow-edge" data-from="think" data-to="lookup" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-planner)"/><path class="flow-edge" data-from="lookup" data-to="observe" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-planner)"/><path class="flow-edge" data-from="observe" data-to="judge" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-planner)"/><path class="flow-edge" data-from="judge" data-to="clarify" d="M700,260.0 L610,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-planner)"/><path class="flow-edge" data-from="clarify" data-to="think" d="M370,260 L320,260 L320,172 L160,172 L160,130" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-planner)"/><path class="flow-edge" data-from="judge" data-to="navigate" d="M820.0,306 L820.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-planner)"/><path class="flow-edge" data-from="navigate" data-to="result" d="M700,436.0 L610,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-planner)"/><path class="flow-edge" data-from="result" data-to="done" d="M370,436.0 L280,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-planner)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">需要查记忆</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">执行查询</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">带结果回来</text><text x="655.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">多个或没有</text><text x="240.0" y="163.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">用户补充</text><text x="829.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">地点已明确</text><text x="655.0" y="427.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">实际执行</text><text x="325.0" y="427.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">按结果收口</text><g class="flow-point" data-point="think" role="button" tabindex="0" aria-label="思考：目的地还不明确"><rect x="40" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#86ada7">处理</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">思考：目的地还不明确</text><text x="54" y="110" font-size="12" fill="#587266">先决定缺什么信息</text></g><g class="flow-point" data-point="lookup" role="button" tabindex="0" aria-label="行动：查询相关记忆"><rect x="370" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#86ada7">处理</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">行动：查询相关记忆</text><text x="384" y="110" font-size="12" fill="#587266">action_list下发查询</text></g><g class="flow-point" data-point="observe" role="button" tabindex="0" aria-label="观察：工具返回真实结果"><rect x="700" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#86ada7">处理</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">观察：工具返回真实结果</text><text x="714" y="110" font-size="12" fill="#587266">tool_feedback回传候选</text></g><g class="flow-point" data-point="judge" role="button" tabindex="0" aria-label="再思考：足够继续吗"><rect x="700" y="214" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#bb8932">判断</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">再思考：足够继续吗</text><text x="714" y="286" font-size="12" fill="#587266">唯一？多个？没有？</text></g><g class="flow-point" data-point="clarify" role="button" tabindex="0" aria-label="不明确：向用户澄清"><rect x="370" y="214" width="240" height="92" rx="13" fill="#eaf1ff" stroke="#627fae" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#627fae">用户</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">不明确：向用户澄清</text><text x="384" y="286" font-size="12" fill="#587266">得到补充后继续判断</text></g><g class="flow-point" data-point="navigate" role="button" tabindex="0" aria-label="明确后：交给导航工具"><rect x="700" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="411" font-size="11" fill="#86ada7">处理</text><text x="714" y="437" font-weight="700" font-size="16" fill="#203f35">明确后：交给导航工具</text><text x="714" y="462" font-size="12" fill="#587266">地址来自已确认信息</text></g><g class="flow-point" data-point="result" role="button" tabindex="0" aria-label="观察导航执行结果"><rect x="370" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="411" font-size="11" fill="#86ada7">处理</text><text x="384" y="437" font-weight="700" font-size="16" fill="#203f35">观察导航执行结果</text><text x="384" y="462" font-size="12" fill="#587266">成功、失败都要回传</text></g><g class="flow-point" data-point="done" role="button" tabindex="0" aria-label="确认完成或继续处理"><rect x="40" y="390" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="54" y="411" font-size="11" fill="#36835f">结果</text><text x="54" y="437" font-weight="700" font-size="16" fill="#203f35">确认完成或继续处理</text><text x="54" y="462" font-size="12" fill="#587266">不能只凭“好的”算完成</text></g></g></svg>