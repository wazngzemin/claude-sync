<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="热词：从哪来、在哪一步起作用、管不到什么"><title>热词：从哪来、在哪一步起作用、管不到什么</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="720" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">热词：从哪来、在哪一步起作用、管不到什么</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左边 7 类来源 → 中间云端热词库 → 右边在识别时生效</text><rect x="30" y="105" width="380" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="132" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">人名</text><text x="44" y="157" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">通讯录、车内人脸对应的名字｜≤1000</text><line x1="410" y1="137" x2="440" y2="137" stroke="#476c8d" stroke-width="1.8"/><rect x="30" y="183" width="380" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="210" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">导航地点</text><text x="44" y="235" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">当前目的地、途经点｜≤500｜冷热处理</text><line x1="410" y1="215" x2="440" y2="215" stroke="#476c8d" stroke-width="1.8"/><rect x="30" y="261" width="380" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="288" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">媒体</text><text x="44" y="313" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">正在播放的歌名、节目名｜≤1000｜冷热处理</text><line x1="410" y1="293" x2="440" y2="293" stroke="#476c8d" stroke-width="1.8"/><rect x="30" y="339" width="380" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="366" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">可见即可说</text><text x="44" y="391" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">当前页面注册的按钮词｜≤500</text><line x1="410" y1="371" x2="440" y2="371" stroke="#476c8d" stroke-width="1.8"/><rect x="30" y="417" width="380" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="444" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车控专有词</text><text x="44" y="469" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按车企车型配置的名词｜≤1000</text><line x1="410" y1="449" x2="440" y2="449" stroke="#476c8d" stroke-width="1.8"/><rect x="30" y="495" width="380" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="522" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">对话历史</text><text x="44" y="547" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">最近 5 轮人和豆包的对话</text><line x1="410" y1="527" x2="440" y2="527" stroke="#476c8d" stroke-width="1.8"/><rect x="30" y="573" width="380" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="600" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车机位置</text><text x="44" y="625" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车现在所在的地址</text><line x1="410" y1="605" x2="440" y2="605" stroke="#476c8d" stroke-width="1.8"/><line x1="440" y1="137" x2="440" y2="605" stroke="#476c8d" stroke-width="1.8"/><path d="M440,330 L470,330" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="470" y="270" width="250" height="120" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="484" y="297" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">云端热词库</text><text x="484" y="322" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">云端统一维护</text><text x="484" y="343" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按类型、热度取用</text><path d="M720,300 L760,300 L760,205 L790,205" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="790" y="150" width="380" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="804" y="177" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">每次开始识别前带上</text><text x="804" y="202" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">每次开始识别前带上热词和最近对话</text><text x="804" y="223" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说话过程中还会补充</text><path d="M980,260 L980,300" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="790" y="300" width="380" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="804" y="327" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">识别时优先写成热词</text><text x="804" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">声音相近时更倾向写成热词</text><text x="804" y="373" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不保证 100% 生效</text><path d="M980,410 L980,450" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="790" y="450" width="380" height="86" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="804" y="477" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">定稿文字</text><text x="804" y="502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：联系人名、泳馆名被写对</text><rect x="470" y="590" width="700" height="110" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="484" y="617" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">热词管不到的三件事</text><text x="484" y="642" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">① 不等于用户选中了这个对象：去哪一家仍由 DT 和工具决定</text><text x="484" y="663" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">② 不等于点中了按钮：可见即可说还要走控件匹配和业务执行</text><text x="484" y="684" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">③ 配置台里有这个词，不证明这一次识别真的带上了它</text></g></svg>