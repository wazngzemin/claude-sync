<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1532" viewBox="0 0 1760 1532" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arrow-627E9F" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#627E9F"/></marker></defs><rect width="1760" height="1532" fill="#F8FAFD"/><text x="44" y="48" font-size="30" font-weight="650" fill="#163352" xml:space="preserve">D · Director｜同一个大脑理解诉求、规划并读结果</text><text x="44" y="84" font-size="20" font-weight="400" fill="#62758A" xml:space="preserve">不是只选工具；让当前事实、能力、安全、话术与后续动作一致</text><polyline points="460,249 590,249" fill="none" stroke="white" stroke-width="7"/><polyline points="460,249 590,249" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,249 1120,249" fill="none" stroke="white" stroke-width="7"/><polyline points="990,249 1120,249" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,358 1320,488" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,358 1320,488" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,358 1320,373.82608695652175 790,373.82608695652175 790,488" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,358 1320,373.82608695652175 790,373.82608695652175 790,488" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1120,249 1100.842105263158,249 1100.842105263158,472.17391304347825 260,472.17391304347825 260,488" fill="none" stroke="white" stroke-width="7"/><polyline points="1120,249 1100.842105263158,249 1100.842105263158,472.17391304347825 260,472.17391304347825 260,488" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1120,597 1100.842105263158,597 1100.842105263158,1198.1739130434783 790,1198.1739130434783 790,1214" fill="none" stroke="white" stroke-width="7"/><polyline points="1120,597 1100.842105263158,597 1100.842105263158,1198.1739130434783 790,1198.1739130434783 790,1214" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,597 1009.1578947368421,597 1009.1578947368421,1338 1120,1338" fill="none" stroke="white" stroke-width="7"/><polyline points="990,597 1009.1578947368421,597 1009.1578947368421,1338 1120,1338" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="260,706 260,836" fill="none" stroke="white" stroke-width="7"/><polyline points="260,706 260,836" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="460,960 590,960" fill="none" stroke="white" stroke-width="7"/><polyline points="460,960 590,960" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,960 1120,960" fill="none" stroke="white" stroke-width="7"/><polyline points="990,960 1120,960" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,1084 1320,1214" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,1084 1320,1214" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,1462 1320,1470.9025641025642 790,1470.9025641025642 790,1462" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,1462 1320,1470.9025641025642 790,1470.9025641025642 790,1462" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="260,1214 260,1099.8260869565217 1099.4736842105262,1099.8260869565217 1099.4736842105262,249 1120,249" fill="none" stroke="white" stroke-width="7"/><polyline points="260,1214 260,1099.8260869565217 1099.4736842105262,1099.8260869565217 1099.4736842105262,249 1120,249" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="260,1462 260,1481.076923076923 1320,1481.076923076923 1320,1462" fill="none" stroke="white" stroke-width="7"/><polyline points="260,1462 260,1481.076923076923 1320,1481.076923076923 1320,1462" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="460,249 479.1578947368421,249 479.1578947368421,1338 460,1338" fill="none" stroke="white" stroke-width="7"/><polyline points="460,249 479.1578947368421,249 479.1578947368421,1338 460,1338" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><rect x="60" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D1</text><text x="80" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">接本轮输入与多路背景</text><text x="80" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">四输入由 M 统一安排进入</text><text x="80" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Context 提供当前已知事实</text><text x="80" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">按上汽/赛力斯提示词使用</text><text x="80" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Planner 与 Director 不串联</text><rect x="590" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D2</text><text x="610" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">辨认用户目标和本轮对象</text><text x="610" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">明确指令：准确执行不加戏</text><text x="610" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">模糊诉求：结合场景补足目标</text><text x="610" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">建议输入：判断是否采纳</text><text x="610" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">反馈输入：判断进展而非新命令</text><rect x="1120" y="140" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="1140" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D3</text><text x="1140" y="202" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">信息够吗、功能可用吗、安全吗</text><text x="1140" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">缺事实：查询；缺选择：澄清</text><text x="1140" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">车型能力、参数范围、音区核对</text><text x="1140" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">驾驶状态与隐私权限核对</text><text x="1140" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">语控不支持≠车辆没有功能</text><rect x="1120" y="488" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D4</text><text x="1140" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">缺可查询事实：只发查询这一步</text><text x="1140" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">状态/记忆/视觉/联网各找其源</text><text x="1140" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">先拿真实地址，再规划导航</text><text x="1140" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">已有背景够用不重复查</text><text x="1140" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">等待结果经 M 回来再推理</text><rect x="590" y="488" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D5</text><text x="610" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">不能直接做：解释、澄清或拒绝</text><text x="610" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">目标歧义先问最少必要问题</text><text x="610" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不可感知条件不能虚构触发</text><text x="610" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">越界/危险请求不给动作</text><text x="610" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">可替代方案说明限制与原因</text><rect x="60" y="488" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="80" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D6</text><text x="80" y="550" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">现在执行，还是交任务系统跟进</text><text x="80" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">即时：本轮给工具执行</text><text x="80" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">定时/条件/持续：创建跟进任务</text><text x="80" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">新 Task 与旧 Goal 按渠道选择</text><text x="80" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">注册成功不等于未来动作完成</text><rect x="60" y="836" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D7</text><text x="80" y="898" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">把人话改成明确对象和动作</text><text x="80" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">人名→当前座位；序号→真实候选</text><text x="80" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">补全设备、方向、动作与参数</text><text x="80" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">保留用户限制，不擅改目标</text><text x="80" y="1015" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">调用参数以项目工具定义为准</text><rect x="590" y="836" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D8</text><text x="610" y="898" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">用现场事实排除不合适动作</text><text x="610" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">雨天车闷：不要自动开窗</text><text x="610" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">已最低温：不再重复降温</text><text x="610" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">老人宝宝：避免后排大风</text><text x="610" y="1015" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">偏好影响方案，但不压过安全</text><rect x="1120" y="836" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="1140" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D9</text><text x="1140" y="898" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">同轮放独立动作，</text><text x="1140" y="928" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">依赖动作留下一轮</text><text x="1140" y="967" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">单轮 action_list 默认并发</text><text x="1140" y="993" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">有数据依赖：分轮执行</text><text x="1140" y="1019" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">导航互斥工具不可同轮争抢</text><text x="1140" y="1045" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">同轮顺序写在数组里不算串行</text><rect x="1120" y="1214" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="1242" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D10</text><text x="1140" y="1276" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">决定是否说话，</text><text x="1140" y="1306" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">避免空话与预承诺</text><text x="1140" y="1345" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">简单查询/车控可不说首轮空话</text><text x="1140" y="1371" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">执行前只说准备，不说已完成</text><text x="1140" y="1397" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">等齐结果后统一说关键结论</text><text x="1140" y="1423" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">续说看信息价值与用户新意图</text><rect x="590" y="1214" width="400" height="248" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="610" y="1242" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D11</text><text x="610" y="1276" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">输出一份说做一致的决策</text><text x="610" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">talk_or_not：这轮是否开口</text><text x="610" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">talk_content：话术与语气标签</text><text x="610" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">emoji_id：表情；action_list：动</text><text x="610" y="1393" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">作</text><text x="610" y="1419" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">动作去 E，语音/表情走呈现链</text><rect x="60" y="1214" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="80" y="1242" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">D12</text><text x="80" y="1276" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">读真实反馈，决定</text><text x="80" y="1306" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">完成、再查或继续</text><text x="80" y="1345" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">由 E→M 回来，不自建第二回路</text><text x="80" y="1371" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">部分成功就只确认成功部分</text><text x="80" y="1397" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">受理/等待仍未完成用户目标</text><text x="80" y="1423" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">补查/替代/下一步仍经 D11 输出</text><rect x="472.3157894736842" y="240.35384615384615" width="105.36842105263162" height="84" rx="3" fill="#FFFFFF"/><text x="478.3157894736842" y="264.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">用户/建</text><text x="478.3157894736842" y="288.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">议/事件</text><text x="478.3157894736842" y="312.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">输入</text><rect x="1002.3157894736842" y="240.35384615384615" width="105.36842105263167" height="84" rx="3" fill="#FFFFFF"/><text x="1008.3157894736842" y="264.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">核对事实</text><text x="1008.3157894736842" y="288.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">/能力/安</text><text x="1008.3157894736842" y="312.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">全</text><rect x="1314.6666666666667" y="410.5652173913044" width="166.66666666666652" height="36" rx="3" fill="#FFFFFF"/><text x="1320.6666666666667" y="434.5652173913044" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">缺可查信息</text><rect x="948.3333333333333" y="380.60869565217394" width="213.33333333333348" height="36" rx="3" fill="#FFFFFF"/><text x="954.3333333333333" y="404.60869565217394" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">缺选择或不可执行</text><rect x="587.2631578947369" y="440.52173913043475" width="189.40350877192975" height="36" rx="3" fill="#FFFFFF"/><text x="593.2631578947369" y="464.52173913043475" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">具备执行依据</text><rect x="1097.0526315789473" y="1095.1913043478257" width="168.72514619883054" 