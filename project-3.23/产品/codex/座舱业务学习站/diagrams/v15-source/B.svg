<svg xmlns="http://www.w3.org/2000/svg" width="995" height="2778" viewBox="0 0 995 2778" role="img" aria-label="信号与当前状态"><title>信号与当前状态</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M235,1062 L235,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">车辆状态来源</tspan></text><path d="M695,226 L695,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="598" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="603" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="603" dy="0">任务已开启</tspan></text><path d="M695,644 L695,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="598" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="603" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="603" dy="0">完整视觉包</tspan></text><path d="M598,1062 L598,1100 L578,1100 L578,1236 L365,1236 L365,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="466" y="1158" width="115" height="44" rx="3" fill="#fff"/><text x="471" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="471" dy="0">接收并维护状态</tspan></text><path d="M235,1480 L235,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">有效状态</tspan></text><path d="M235,1898 L235,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="ur