<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <!-- Background -->
  <rect x="0" y="0" width="1400" height="900" fill="#f8fafd"/>
  
  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2329">N19｜自进化：从专家知识到车自己学会你的习惯</text>
  <text x="700" y="80" text-anchor="middle" font-size="16" fill="#646a73">三层知识结构 × 两条知识来源 × 自学习闭环</text>
  
  <!-- Left column: Brand knowledge -->
  <rect x="80" y="120" width="280" height="680" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="220" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">品牌通用知识</text>
  <text x="220" y="180" text-anchor="middle" font-size="14" fill="#2e7d32">赛力斯写的 know-how</text>
  <text x="220" y="200" text-anchor="middle" font-size="14" fill="#2e7d32">【当时现状】质量低</text>
  
  <!-- Right column: User self-learning -->
  <rect x="1040" y="120" width="280" height="680" rx="12" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="1180" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">用户自学习</text>
  <text x="1180" y="180" text-anchor="middle" font-size="14" fill="#1565c0">你说的偏好系统自己记</text>
  <text x="1180" y="200" text-anchor="middle" font-size="14" fill="#1565c0">【讨论中】12月专项是计划</text>
  
  <!-- Middle layers: Body / Surface / Point -->
  <!-- Body knowledge (top, dashed) -->
  <rect x="420" y="140" width="560" height="160" rx="12" fill="#fff3e0" stroke="#ff9800" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="700" y="175" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">体状知识（N19-3）【讨论中，待核】</text>
  <text x="700" y="205" text-anchor="middle" font-size="14" fill="#e65100">最高层级，会上承认"还没想清楚"</text>
  <text x="700" y="225" text-anchor="middle" font-size="14" fill="#e65100">强依赖动态 Advisor 设计</text>
  <text x="700" y="260" text-anchor="middle" font-size="13" fill="#9e9e9e">来源：9/9 讨论纪要，逐字稿未取得</text>
  
  <!-- Surface knowledge (middle) -->
  <rect x="420" y="340" width="560" height="200" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="700" y="375" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">面状知识（N19-2）【讨论中，待核】</text>
  <text x="700" y="405" text-anchor="middle" font-size="14" fill="#2e7d32">有结构、分步骤、每个环节有评判标准</text>
  <text x="700" y="425" text-anchor="middle" font-size="14" fill="#2e7d32">例：一个自驾场景分几步、每步做到什么程度算好</text>
  <text x="700" y="455" text-anchor="middle" font-size="14" fill="#2e7d32">比点状更稳定，但写出来需要非常资深的人</text>
  <text x="700" y="490" text-anchor="middle" font-size="13" fill="#9e9e9e">来源：9/9 讨论纪要，逐字稿未取得</text>
  
  <!-- Point knowledge (bottom) -->
  <rect x="420" y="580" width="560" height="200" rx="12" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="700" y="615" text-anchor="middle" font-size="20" font-weight="bold" fill="#f57f17">点状知识（N19-1）【讨论中，待核】</text>
  <text x="700" y="645" text-anchor="middle" font-size="14" fill="#f57f17">碎的、单点的经验</text>
  <text x="700" y="665" text-anchor="middle" font-size="14" fill="#f57f17">例："找停车场不要给我找立体停车场"</text>
  <text x="700" y="695" text-anchor="middle" font-size="14" fill="#f57f17">优点：快；缺点：不稳定、不能举一反三</text>
  <text x="700" y="730" text-anchor="middle" font-size="13" fill="#9e9e9e">来源：9/9 讨论纪要，逐字稿未取得</text>
  
  <!-- Arrows: layers stacking -->
  <line x1="700" y1="300" x2="700" y2="340" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="540" x2="700" y2="580" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Closed loop: Observe -> Deposit -> Use next time -->
  <rect x="180" y="820" width="1040" height="60" rx="30" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="700" y="857" text-anchor="middle" font-size="18" font-weight="bold" fill="#7b1fa2">自学习闭环（N19-6）【讨论中】：观察到什么 → 沉淀成什么 → 下次怎么用上</text>
  
  <!-- Arrow from loop to point knowledge -->
  <line x1="700" y1="820" x2="700" y2="780" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- N19-7 Priority -->
  <rect x="180" y="240" width="200" height="80" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="1"/>
  <text x="280" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#616161">优先级（N19-7）</text>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#9e9e9e">【待核】资料没明说</text>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#9e9e9e">讨论中：用户要求&gt;个性化&gt;品牌</text>
  
  <!-- N19-8 Cost -->
  <rect x="1020" y="240" width="200" height="80" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="1"/>
  <text x="1120" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#616161">Leading vs 走量（N19-8）</text>
  <text x="1120" y="290" text-anchor="middle" font-size="12" fill="#9e9e9e">【待核】走量用更省成本方案</text>
  <text x="1120" y="308" text-anchor="middle" font-size="12" fill="#9e9e9e">部分能力延后</text>
  
  <!-- N19-9 Plan -->
  <rect x="580" y="60" width="240" height="40" rx="20" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="700" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">12月底专项（N19-9）【计划，非已上线】</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9e9e9e"/>
    </marker>
  </defs>
</svg>
