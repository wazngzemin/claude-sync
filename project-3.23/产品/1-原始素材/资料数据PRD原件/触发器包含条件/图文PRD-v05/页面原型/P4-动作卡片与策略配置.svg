<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#839bb6"/></marker></defs><rect x="0" y="0" width="1700" height="1120" rx="0" fill="#f5f8fc" stroke="#f5f8fc" stroke-width="1.5"/><rect x="0" y="0" width="1700" height="75" rx="0" fill="#193957" stroke="#193957" stroke-width="1.5"/><text x="28" y="48" font-size="26" fill="#fff" font-weight="600">豆包汽车 · 触发器场景配置</text><text x="1210" y="46" font-size="20" fill="#d5e5f5" font-weight="400">方案原型 · 非真实后台截图</text><rect x="0" y="75" width="225" height="1045" rx="0" fill="#fff" stroke="#dce5ef" stroke-width="1.5"/><text x="26" y="125" font-size="22" fill="#20364d" font-weight="500">场景管理</text><rect x="14" y="153" width="196" height="52" rx="6" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="1.5"/><text x="30" y="185" font-size="21" fill="#2469d6" font-weight="500">场景列表</text><text x="30" y="250" font-size="21" fill="#20364d" font-weight="400">触发记录</text><text x="30" y="315" font-size="21" fill="#20364d" font-weight="400">公共能力</text><text x="265" y="121" font-size="30" fill="#173a61" font-weight="600">P4 命中后处理：主动推荐带交互卡</text><text x="265" y="159" font-size="19" fill="#667b91" font-weight="400">① 选动作 → ② 写建议 Query → ③ 配带卡和按钮 → ④ 配策略 → ⑤ 真实联调</text><rect x="260" y="190" width="920" height="810" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><rect x="1205" y="190" width="455" height="810" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="285" y="231" font-size="20" fill="#20364d" font-weight="500">① 下游动作</text><rect x="285" y="246" width="850" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="300" y="276" font-size="20" fill="#20364d" font-weight="400">主动推荐带交互卡（recommend_with_card）</text><text x="285" y="343" font-size="22" fill="#173a61" font-weight="600">② 建议信息 · advisors_input</text><rect x="285" y="364" width="850" height="216" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="303" y="400" font-size="21" fill="#20364d" font-weight="400">出行 advisor：你的目标之一是帮助用户便捷充电。</text><text x="303" y="434" font-size="21" fill="#20364d" font-weight="400">当前车辆已停入 P 挡，SOC 满足任务阈值且充电口盖关闭。</text><text x="303" y="468" font-size="21" fill="#20364d" font-weight="400">请先检查周边是否存在可用充电设备；明确发现后，</text><text x="303" y="502" font-size="21" fill="#20364d" font-weight="400">询问用户是否打开充电口盖，用户确认后再执行。</text><text x="303" y="536" font-size="21" fill="#20364d" font-weight="400">策略：语音确认。</text><text x="285" y="613" font-size="22" fill="#173a61" font-weight="600">③ 交互卡参数 · real_time_card</text><text x="285" y="659" font-size="20" fill="#20364d" font-weight="400">是否带交互卡</text><rect x="500" y="630" width="185" height="44" rx="6" fill="#2469d6" stroke="#2469d6" stroke-width="1.5"/><text x="518" y="659" font-size="20" fill="#fff" font-weight="500">开启 enabled=true</text><text x="285" y="724" font-size="20" fill="#20364d" font-weight="400">按钮</text><rect x="500" y="695" width="115" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="518" y="724" font-size="20" fill="#2469d6" font-weight="500">确认</text><rect x="630" y="695" width="115" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="648" y="724" font-size="20" fill="#2469d6" font-weight="500">取消</text><text x="785" y="724" font-size="18" fill="#667b91" font-weight="400">可自定义范围与数量待接入方确认</text><rect x="285" y="762" width="850" height="78" rx="6" fill="#eff5ff" stroke="#a8c8f4" stroke-width="1.5"/><text x="301" y="794" font-size="18" fill="#315b8d" font-weight="400">正文 content 由 DT 推理生成；后台不新增自由编辑正文框。</text><text x="301" y="822" font-size="18" fill="#315b8d" font-weight="400">TTS 沿下游已有链路生成；关闭带卡不代表允许静默车控。</text><text x="285" y="876" font-size="22" fill="#173a61" font-weight="600">④ 执行策略</text><rect x="285" y="897" width="200" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="303" y="926" font-size="20" fill="#2469d6" font-weight="500">查看现有次数限制</text><rect x="503" y="897" width="205" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="521" y="926" font-size="20" fill="#2469d6" font-weight="500">查看现有最小间隔</text><text x="735" y="927" font-size="18" fill="#667b91" font-weight="400">按现有协议配置，不预设新默认值</text><text x="1224" y="230" font-size="23" fill="#173a61" font-weight="600">提交参数预览</text><text x="1224" y="274" font-size="20" fill="#405873" font-weight="400">advisors_input：左侧固定建议</text><text x="1224" y="314" font-size="20" fill="#405873" font-weight="400">real_time_card.enabled：true</text><text x="1224" y="354" font-size="20" fill="#405873" font-weight="400">real_time_card.buttons：</text><text x="1224" y="394" font-size="20" fill="#405873" font-weight="400">[确认，取消]</text><text x="1224" y="434" font-size="20" fill="#405873" font-weight="400">content：DT 下游生成</text><rect x="1224" y="515" width="412" height="134" rx="6" fill="#eff5ff" stroke="#a8c8f4" stroke-width="1.5"/><text x="1240" y="547" font-size="18" fill="#315b8d" font-weight="400">这是请求参数预览，</text><text x="1240" y="575" font-size="18" fill="#315b8d" font-weight="400">不是最终端侧卡片效果。</text><text x="1240" y="603" font-size="18" fill="#315b8d" font-weight="400">设备是否存在尚需 DT / VQA 判断，</text><text x="1240" y="631" font-size="18" fill="#315b8d" font-weight="400">不能先写“已发现充电设备”。</text><rect x="1224" y="677" width="412" height="134" rx="6" fill="#eff5ff" stroke="#a8c8f4" stroke-width="1.5"/><text x="1240" y="709" font-size="18" fill="#315b8d" font-weight="400">⑤ simulator_supported=false</text><text x="1240" y="737" font-size="18" fill="#315b8d" font-weight="400">本动作使用真实测试环境联调。</text><text x="1240" y="765" font-size="18" fill="#315b8d" font-weight="400">核对：下游接收、出卡、用户回应、</text><text x="1240" y="793" font-size="18" fill="#315b8d" font-weight="400">执行结果分别取得证据。</text><rect x="1224" y="874" width="190" height="44" rx="6" fill="#2469d6" stroke="#2469d6" stroke-width="1.5"/><text x="1242" y="903" font-size="20" fill="#fff" font-weight="500">保存动作配置</text><rect x="1224" y="933" width="190" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="1242" y="962" font-size="20" fill="#2469d6" font-weight="500">返回判断配置</text><rect x="260" y="1020" width="1400" height="50" rx="6" fill="#fff3f1" stroke="#e6a29a" stroke-width="1.5"/><text x="276" y="1052" font-size="18" fill="#aa3e32" font-weight="400">空建议 / 参数无法解析 / 带卡按钮不合协议 → 定位字段并阻止发布。计数起点、失败占次数与在途撤销等未定策略单列评审。</text></svg>
