<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="s2-followup" width="1200" height="558" viewBox="0 0 1200 558" role="img" aria-labelledby="s2-followup-title s2-followup-desc">
<title id="s2-followup-title">开启极速制冷后，谁继续盯到 24 度</title><desc id="s2-followup-desc">舒适 Advisor 留下短期子目标，等舱温降下来，再问主驾要不要切回自动空调。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="s2-followup-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">开启极速制冷后，谁继续盯到 24 度</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">舒适 Advisor 留下短期子目标，等舱温降下来，再问主驾要不要切回自动空调。</text>
<path class="v56-arrow" d="M 366 176 L 437 176" marker-end="url(#s2-followup-arr)"/>
<path class="v56-arrow" d="M 763 176 L 834 176" marker-end="url(#s2-followup-arr)"/>
<path class="v56-arrow" d="M 997 234 L 997 300" marker-end="url(#s2-followup-arr)"/>
<path class="v56-arrow" d="M 834 363 L 763 363" marker-end="url(#s2-followup-arr)"/>
<path class="v56-arrow" d="M 437 363 L 366 363" marker-end="url(#s2-followup-arr)"/>
<path class="v56-arrow" d="M 997 426 L 997 477 L 1183 477 L 1183 363 L 1160 363" marker-end="url(#s2-followup-arr)"/>
<g data-node="true" id="s2-followup-onboard">
<rect class="v56-local" x="40" y="118" width="326" height="116" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="146" text-anchor="start">01 · 主驾上车</text>
<text class="v56-node-sub" x="54" y="172" text-anchor="start">车内 38 度，空调还没开</text>
</g>
<g data-node="true" id="s2-followup-cool">
<rect class="v56-local" x="437" y="118" width="326" height="116" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="451" y="146" text-anchor="start">02 · 告知执行，开极速制冷</text>
<text class="v56-node-sub" x="451" y="172" text-anchor="start">Planner 调车控开启</text>
<text class="v56-node-sub" x="451" y="194" text-anchor="start">并告诉主驾已启动</text>
</g>
<g data-node="true" id="s2-followup-goal">
<rect class="v56-cloud" x="834" y="118" width="326" height="116" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="848" y="146" text-anchor="start">03 · 舒适 Advisor 留下子目标</text>
<text class="v56-node-sub" x="848" y="172" text-anchor="start">降到舒适温度后转自动空调</text>
<text class="v56-node-sub" x="848" y="194" text-anchor="start">已有同样的运行目标，就不重复建议</text>
</g>
<g data-node="true" id="s2-followup-review">
<rect class="v56-decision" x="834" y="300" width="326" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="848" y="328" text-anchor="start">04 · 复查舱温</text>
<text class="v56-node-sub" x="848" y="354" text-anchor="start">每 10 分钟复查一次</text>
<text class="v56-node-sub" x="848" y="376" text-anchor="start">新事件与子目标一起再判断</text>
<text class="v56-node-sub" x="848" y="398" text-anchor="start">有新事件就重新计时</text>
</g>
<g data-node="true" id="s2-followup-ask">
<rect class="v56-decision" x="437" y="300" width="326" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="451" y="328" text-anchor="start">05 · 到 24 度，语音确认</text>
<text class="v56-node-sub" x="451" y="354" text-anchor="start">“温度合适了，要不要切回自动？”</text>
<text class="v56-node-sub" x="451" y="376" text-anchor="start">主驾同意后切回自动空调</text>
</g>
<g data-node="true" id="s2-followup-end">
<rect class="v56-neutral" x="40" y="300" width="326" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="328" text-anchor="start">06 · 子目标结束</text>
<text class="v56-node-sub" x="54" y="354" text-anchor="start">达成、用户删除或车辆下电</text>
<text class="v56-node-sub" x="54" y="376" text-anchor="start">任一条件成立就结束</text>
</g>
<text class="v56-label" x="1009" y="268" text-anchor="start">开始跟进</text>
<text class="v56-label" x="798" y="352" text-anchor="middle">到温</text>
<text class="v56-label" x="401" y="352" text-anchor="middle">达成</text>
<text class="v56-label" x="1082" y="465" text-anchor="middle">未到温，继续复查</text>
<text class="v56-label" x="40" y="470" text-anchor="start">用户删除或车辆下电时，可以直接结束跟进。</text>
<path class="v56-rule" d="M 32 504 L 1168 504"/>
<rect data-decoration="true" class="v56-local" x="32" y="524" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="538" text-anchor="start">蓝 · 车端状态和首次执行</text>
<rect data-decoration="true" class="v56-cloud" x="316" y="524" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344" y="538" text-anchor="start">绿 · 留下跟进状态</text>
<rect data-decoration="true" class="v56-decision" x="600" y="524" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628" y="538" text-anchor="start">黄 · 复查和确认</text>
<rect data-decoration="true" class="v56-neutral" x="884" y="524" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912" y="538" text-anchor="start">灰 · 结束跟进</text>
</svg>
