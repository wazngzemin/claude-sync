<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" role="img" aria-label="“我们有多少个工具”：五个数字，五种口径"><title>“我们有多少个工具”：五个数字，五种口径</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="710" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">“我们有多少个工具”：五个数字，五种口径</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">从上到下，越往下范围越大；数字不能互相比，先问是哪一份、哪一天、哪个项目</text><rect x="40" y="100" width="200" height="80" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="54" y="127" font-size="22" fill="#4b5560" font-weight="650" text-anchor="start">23 个</text><rect x="260" y="100" width="940" height="80" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="274" y="127" font-size="17" fill="#4b5560" font-weight="650" text-anchor="start">项目知识库里的旧说法</text><text x="274" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">更早一版说明书；工具名是旧名（如 search_poi_qa），现已换成标准化名</text><rect x="40" y="200" width="200" height="80" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="227" font-size="22" fill="#1d4b35" font-weight="650" text-anchor="start">27 个</text><rect x="260" y="200" width="940" height="80" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="274" y="227" font-size="17" fill="#1d4b35" font-weight="650" text-anchor="start">上汽说明书里写给 DT 看的（7 月 31 日快照，D 章用）</text><text x="274" y="252" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一个项目、一个时间点，DT 真正能选的；编号写到 28，中间缺 7 号；美团订座在第 28 号</text><rect x="40" y="300" width="200" height="80" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="54" y="327" font-size="22" fill="#5c4c12" font-weight="650" text-anchor="start">33 行</text><rect x="260" y="300" width="940" height="80" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="274" y="327" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start">Director PRD 标准化表：允许接什么</text><text x="274" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">14 行必选、16 行可选、3 个上汽定制；“允许接”不等于“已经接”</text><rect x="40" y="400" width="200" height="80" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="54" y="427" font-size="22" fill="#5c4c12" font-weight="650" text-anchor="start">40 行</text><rect x="260" y="400" width="940" height="80" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="274" y="427" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start">下游工具输入输出整理表（10 月 30 日查看）</text><text x="274" y="452" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">产品维护的定义和回包写法；其中 8 行已标弃用；最新版本记录是 8 月 27 日</text><rect x="40" y="500" width="200" height="80" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="54" y="527" font-size="22" fill="#6a4314" font-weight="650" text-anchor="start">50 个编号</text><rect x="260" y="500" width="940" height="80" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="274" y="527" font-size="17" fill="#6a4314" font-weight="650" text-anchor="start">数据库快照（11 月 4 日，E 章用）</text><text x="274" y="552" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">225 条配置、50 个编号；212 条启用、涉及 49 个；含问句改写这类内部工具、车上离线工具、停用的配置</text><rect x="40" y="610" width="1160" height="80" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="54" y="637" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">为什么对不上</text><text x="54" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">时间不同（7/31 对 11/4）；对象不同（一个项目的说明书对全部渠道的数据库）；口径不同（允许接 / 配了 / DT 看得见）。</text></g></svg>