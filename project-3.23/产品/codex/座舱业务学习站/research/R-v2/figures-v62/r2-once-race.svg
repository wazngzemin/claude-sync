<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="r2-once-race" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="r2-once-race-title r2-once-race-desc">
<title id="r2-once-race-title">同一轮只办一次，新话按语音起播分界</title><desc id="r2-once-race-desc">车上先执行后，迟到云端结果不再执行；回复未完整且语音未起播时合并重推，起播后新话算打断。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="r2-once-race-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">同一轮只办一次，新话按语音起播分界</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">车上先执行后，迟到云端结果不再执行；回复未完整且语音未起播时合并重推，起播后新话算打断。</text>
<text class="v56-label" x="32" y="120" text-anchor="start">同一轮：车上和云端共用 request_id = R-001</text>
<text class="v56-node-title" x="32" y="219" text-anchor="start">车上</text>
<text class="v56-node-title" x="32" y="389" text-anchor="start">云端</text>
<path class="v56-rule" d="M 180 154 L 180 460" fill="none"/>
<g data-node="true">
<rect class="v56-local" x="340" y="164" width="350" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="354" y="191" text-anchor="start" data-fit="true">先执行：打开空调</text>
<text class="v56-node-sub" x="354" y="216" text-anchor="start" data-fit="true">车上兜底结果先被采用</text>
<text class="v56-node-sub" x="354" y="237" text-anchor="start" data-fit="true">本轮执行结果已经生效</text>
</g>
<path class="v56-arrow" d="M 210 220 L 340 220" fill="none" marker-end="url(#r2-once-race-arr)"/>
<path class="v56-arrow" d="M 690 220 L 1168 220" fill="none" marker-end="url(#r2-once-race-arr)"/>
<text class="v56-label" x="885" y="203" text-anchor="middle">同一轮后到结果不能重办</text>
<g data-node="true">
<rect class="v56-reject" x="790" y="334" width="378" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="804" y="361" text-anchor="start" data-fit="true">云端结果晚到：打开空调</text>
<text class="v56-node-sub" x="804" y="386" text-anchor="start" data-fit="true">不执行，记为未采用</text>
<text class="v56-node-sub" x="804" y="407" text-anchor="start" data-fit="true">不上屏，不进入对话历史</text>
</g>
<path class="v56-arrow" d="M 210 390 L 790 390" fill="none" marker-end="url(#r2-once-race-arr)"/>
<text class="v56-label" x="450" y="372" text-anchor="middle">云端仍在处理，随后返回</text>
<text class="v56-node-title" x="32" y="501" text-anchor="start">同样是新话，语音起播前后处理不同</text>
<text class="v56-subtitle" x="32" y="530" text-anchor="start">早期以首 token 为界，后来放宽；合并还需回复未完整输出</text>
<g data-node="true">
<rect class="v56-neutral" x="32" y="580" width="340" height="166" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="607" text-anchor="start" data-fit="true">起播前来一句新话</text>
<text class="v56-node-sub" x="46" y="632" text-anchor="start" data-fit="true">副驾：“我也要开空调”</text>
<text class="v56-node-sub" x="46" y="653" text-anchor="start" data-fit="true">回复未完整：合并成同一轮</text>
<text class="v56-node-sub" x="46" y="674" text-anchor="start" data-fit="true">交给 Planner 一起处理</text>
</g>
<path class="v56-arrow" d="M 372 663 L 430 663" fill="none" marker-end="url(#r2-once-race-arr)"/>
<g data-node="true">
<rect class="v56-decision" x="430" y="580" width="340" height="166" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="607" text-anchor="start" data-fit="true">语音起播</text>
<text class="v56-node-sub" x="444" y="632" text-anchor="start" data-fit="true">现行分界</text>
<text class="v56-node-sub" x="444" y="653" text-anchor="start" data-fit="true">后来的新话按打断处理</text>
</g>
<path class="v56-arrow" d="M 770 663 L 828 663" fill="none" marker-end="url(#r2-once-race-arr)"/>
<g data-node="true">
<rect class="v56-decision" x="828" y="580" width="340" height="166" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="607" text-anchor="start" data-fit="true">起播后来一句新话</text>
<text class="v56-node-sub" x="842" y="632" text-anchor="start" data-fit="true">主驾：“改成 24 度”</text>
<text class="v56-node-sub" x="842" y="653" text-anchor="start" data-fit="true">打断并丢弃旧推理</text>
<text class="v56-node-sub" x="842" y="674" text-anchor="start" data-fit="true">已经下发的动作不撤回</text>
</g>
<text class="v56-subtitle" x="32" y="810" text-anchor="start">三道防线：request_id 关联同一轮；先执行的一边生效；新请求打断旧推理。</text>
<rect class="v56-local" x="32" y="931" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="945" text-anchor="start">蓝：车上执行生效</text>
<rect class="v56-reject" x="292" y="931" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="320" y="945" text-anchor="start">红：迟到结果不执行</text>
<rect class="v56-neutral" x="572" y="931" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="600" y="945" text-anchor="start">灰：合并新话</text>
<rect class="v56-decision" x="812" y="931" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="840" y="945" text-anchor="start">黄：分界与打断</text>
</svg>
