<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="DT 拿到的“过去”：历史输入、摘要记忆、短期与长期记忆"><title>DT 拿到的“过去”：历史输入、摘要记忆、短期与长期记忆</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="820" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">DT 拿到的“过去”：历史输入、摘要记忆、短期与长期记忆</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">越往下越压缩、越久远；右边是这些内容进入 DT 的两种方式</text><rect x="30" y="110" width="300" height="360" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="44" y="137" font-size="16" fill="#6a4314" font-weight="650" text-anchor="start">事件流（按时间排队）</text><text x="44" y="162" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人机对话：用户说、豆包答</text><text x="44" y="183" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人人对话：车上人之间说的话</text><text x="44" y="204" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车辆与行为事件：开窗、上车…</text><text x="44" y="225" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">视觉描述：舱内外看到的情况</text><rect x="400" y="110" width="380" height="112" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="414" y="137" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">历史输入（也叫历史对话）</text><text x="414" y="162" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">最近 5 轮人机对话</text><text x="414" y="183" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">+ 最新 5 轮里的非人机内容（11/4 讨论）</text><text x="414" y="204" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">原样交给 DT，细节最全</text><rect x="400" y="242" width="380" height="112" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="414" y="269" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">摘要记忆（也叫对话摘要）</text><text x="414" y="294" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">从第 3 轮起，每来一轮压缩一次</text><text x="414" y="315" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">上限：PRD 旧版 22 轮、新版 28 轮，线上待确认</text><text x="414" y="336" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">11/4 讨论：人机、人人、事件都压</text><rect x="400" y="374" width="380" height="92" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="414" y="401" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">短期记忆</text><text x="414" y="426" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">每 20 分钟或 20 条总结一次</text><text x="414" y="447" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按谁、何时、何地、做了什么合并</text><rect x="400" y="486" width="380" height="112" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="414" y="513" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">长期记忆</text><text x="414" y="538" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">情景记忆：按天合并短期记忆</text><text x="414" y="559" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">语义记忆：抽取偏好，如爱吃牛肉火锅</text><text x="414" y="580" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">再往上推理出画像</text><path d="M330,166 L400,166" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M330,298 L400,298" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M330,420 L400,420" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M590,466 L590,486" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="400" y="630" width="380" height="120" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="414" y="657" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">瞬时记忆（已定义，未使用）</text><text x="414" y="682" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">最新约 20 条事件原样保留</text><text x="414" y="703" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">记忆 PRD 标注“当前没用”</text><text x="414" y="724" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">最新这一层现由历史输入承担</text><path d="M590,630 L590,618 L360,618 L360,166 L400,166" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="850" y="150" width="320" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="864" y="177" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">提前带上</text><text x="864" y="202" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">请求一进来就带上：</text><text x="864" y="223" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">历史输入、摘要记忆、画像、</text><text x="864" y="244" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">与这句话相关的记忆</text><rect x="850" y="330" width="320" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="864" y="357" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">DT 自己去查</text><text x="864" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">带上的不够时，DT 调记忆工具查</text><text x="864" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：“昨天那家游泳馆”是哪家</text><rect x="850" y="520" width="320" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="864" y="547" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 推理</text><text x="864" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用这些背景决定下一步</text><path d="M780,166 L850,190" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M780,420 L835,420 L835,265 L850,265" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M780,298 L850,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M780,540 L815,540 L815,400 L850,400" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M780,520 L830,520 L830,250 L850,250" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1010,280 L1010,330" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="986.475" y="284.0" width="47.05" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="1010.0" y="300.0" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">不够用</text><path d="M1010,460 L1010,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1160,280 L1185,280 L1185,565 L1170,565" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/></g></svg>