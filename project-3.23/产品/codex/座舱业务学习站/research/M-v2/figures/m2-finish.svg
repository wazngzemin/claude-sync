<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="m2-finish" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="m2-finish-title m2-finish-desc">
<title id="m2-finish-title">有语音的一轮，车上报播完才正常结束</title><desc id="m2-finish-desc">没收到回执时，软期限只记状态；硬期限才以超时结束，新的用户的话随时可以进来。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="m2-finish-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<rect data-background="true" x="0" y="0" width="1200" height="850" style="fill:var(--v56-bg,#fff)"/>
<text class="v56-title" x="32" y="44" text-anchor="start">有语音的一轮，车上报播完才正常结束</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">没收到回执时，软期限只记状态；硬期限才以超时结束，新的用户的话随时可以进来。</text>
<g data-node="true" data-name="start"><rect class="v56-neutral" x="32" y="240" width="180" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="267" text-anchor="start">开始播</text>
<text class="v56-node-sub" x="46" y="292" text-anchor="start">第一个有声音的样本</text>
<text class="v56-node-sub" x="46" y="315" text-anchor="start">真正进入播放器</text>
</g>
<text class="v56-label" x="300" y="132" text-anchor="start">收到回执</text>
<g data-node="true" data-name="reported"><rect class="v56-cloud" x="300" y="155" width="220" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="314" y="182" text-anchor="start">车上报播完</text>
<text class="v56-node-sub" x="314" y="207" text-anchor="start">结束标记已到且队列空</text>
</g>
<g data-node="true" data-name="normal-end"><rect class="v56-cloud" x="640" y="155" width="200" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="654" y="182" text-anchor="start">正常结束</text>
<text class="v56-node-sub" x="654" y="207" text-anchor="start">记录为播完</text>
</g>
<g data-node="true" data-name="next"><rect class="v56-cloud" x="950" y="250" width="218" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="964" y="277" text-anchor="start">叫下一位</text>
<text class="v56-node-sub" x="964" y="302" text-anchor="start">取出下一批输入</text>
</g>
<path class="v56-arrow" d="M 212 270 L 250 270 L 250 200 L 300 200" fill="none" marker-end="url(#m2-finish-arr)" />
<path class="v56-arrow" d="M 520 200 L 640 200" fill="none" marker-end="url(#m2-finish-arr)" />
<path class="v56-arrow" d="M 840 200 L 900 200 L 900 285 L 950 285" fill="none" marker-end="url(#m2-finish-arr)" />
<text class="v56-label" x="300" y="382" text-anchor="start">没收到回执</text>
<g data-node="true" data-name="soft"><rect class="v56-decision" x="300" y="405" width="180" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="314" y="432" text-anchor="start">软期限</text>
<text class="v56-node-sub" x="314" y="457" text-anchor="start">按剩余音频时长算</text>
</g>
<g data-node="true" data-name="unconfirmed"><rect class="v56-decision" x="550" y="405" width="235" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="564" y="432" text-anchor="start">记“完成未确认”</text>
<text class="v56-node-sub" x="564" y="457" text-anchor="start">不推进，继续等回执</text>
</g>
<g data-node="true" data-name="hard"><rect class="v56-decision" x="550" y="565" width="235" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="564" y="592" text-anchor="start">硬期限</text>
<text class="v56-node-sub" x="564" y="617" text-anchor="start">仍没收到播完回执</text>
</g>
<g data-node="true" data-name="timeout"><rect class="v56-reject" x="900" y="565" width="268" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="914" y="592" text-anchor="start">以“播放状态超时”结束</text>
<text class="v56-node-sub" x="914" y="617" text-anchor="start">不写成正常播完</text>
</g>
<path class="v56-arrow" d="M 212 310 L 250 310 L 250 450 L 300 450" fill="none" marker-end="url(#m2-finish-arr)" />
<path class="v56-arrow" d="M 480 450 L 550 450" fill="none" marker-end="url(#m2-finish-arr)" />
<path class="v56-arrow" d="M 667 495 L 667 565" fill="none" marker-end="url(#m2-finish-arr)" />
<path class="v56-arrow" d="M 785 610 L 900 610" fill="none" marker-end="url(#m2-finish-arr)" />
<path class="v56-arrow" d="M 1034 565 L 1034 350" fill="none" marker-end="url(#m2-finish-arr)" />
<g data-node="true" data-name="new-user"><rect class="v56-local" x="32" y="565" width="400" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="592" text-anchor="start">新的用户的话随时可以进来</text>
<text class="v56-node-sub" x="46" y="617" text-anchor="start">不受软期限、硬期限限制</text>
</g>
<text class="v56-label" x="32" y="545" text-anchor="start">旁路</text>
<text class="v56-node-sub" x="32" y="710" text-anchor="start">结束这一轮与取出下一批，一次提交。</text>
<text class="v56-node-sub" x="32" y="741" text-anchor="start">这些都不能当播完：断网、收到最后一个包、按时长估计。</text>
<rect data-legend="true" class="v56-cloud" x="32" y="796" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="810" text-anchor="start">绿：正常结束与推进</text>
<rect data-legend="true" class="v56-decision" x="330" y="796" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="358" y="810" text-anchor="start">黄：等待兜底</text>
<rect data-legend="true" class="v56-reject" x="590" y="796" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="618" y="810" text-anchor="start">红：超时结束</text>
<rect data-legend="true" class="v56-local" x="860" y="796" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="888" y="810" text-anchor="start">蓝：用户插话</text>
</svg>
