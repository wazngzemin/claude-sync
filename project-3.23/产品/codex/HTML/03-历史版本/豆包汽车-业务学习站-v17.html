"url":"https://bytedance.larkoffice.com/sheets/R1jxsFYkGhH50etAJcEcFqtznRC?sheet=0uYsgU&range=MzU5OjM1OQ=="},{"id":"SF-104","title":"【AI汽车】Release note&迭代总结（S1~S6）","url":"https://bytedance.larkoffice.com/wiki/MpWwwWys3ifOwVkdmnmcrhh8n0d"},{"id":"SF-109","title":"汽车服务端周报","url":"https://bytedance.larkoffice.com/wiki/FouOwkkXZihfATk4edEcclsln6g"},{"id":"SF-113","title":"2.0需求文档 副本","url":"https://bytedance.larkoffice.com/wiki/Iwb0wruEti3aCbkJe92crzbMnCd#doxcnIMc3oH3GHvl2n0nIprij1b"},{"id":"SF-166","title":"HMI 浮窗迁移提测说明","url":"https://bytedance.larkoffice.com/docx/XQhpdNPnzoNOkqx6XtjcbMxPnIg#EYy5dF48koccd2xImoGcdG2inlh"},{"id":"SF-311","title":"GUI Agent融入主链路","url":"https://bytedance.larkoffice.com/wiki/DNYyw8COlik9YKko80AcpSLSnKh?sheet=SboyKL&range=Mjoy"},{"id":"SV-142","title":"【Ai汽车】【Smoke & Checklist】-测试集&测试报告","url":"https://bytedance.larkoffice.com/wiki/X3G1wjwzoifulUk0rbxcCEBfnff"},{"id":"SV-159","title":"GUI 主链路 Prompt 更新 Bug 修复记录","url":"https://bytedance.larkoffice.com/wiki/U9QNwWVOgiNz3gkl0GncvMFhnmf#doxcnxbSVFjrUpvDNWFgAI05Ylb"},{"id":"SV-179","title":"效果评测@芮婷","url":"https://bytedance.larkoffice.com/wiki/HBUBwxAjJiNvmhkp3MWcayjVnFg#XeBYdFIoeotQtWxUT1ecKchinee"},{"id":"SV-181","title":"基础评测集（basic_vehicle）","url":"https://bytedance.larkoffice.com/wiki/XgOFwgiEAidBHKkaJnjcO2NLnJh#JBlVdIceBoN9usxNuRKcwQhznP5"},{"id":"SV-191","title":"【记忆功能】测试集&测试报告","url":"https://bytedance.larkoffice.com/wiki/FtzDwbXpVi0BPlkmwP1cNYK6nGe?sheet=6ldZ9A&range=MTE6MTE="},{"id":"SV-220","title":"Planner_Badcase分析报告_王泽民","url":"https://bytedance.larkoffice.com/sheets/ZvIGsnRoNhbhq6tVvRqcM0mFnDh?sheet=0UhWwg&range=NzM6NzM="},{"id":"SV-223","title":"【AI汽车】【模拟器工具V2.0】测试集&测试报告","url":"https://bytedance.larkoffice.com/wiki/EfJtw6HWAiccG7kU7GQcyI5HnQh"},{"id":"SR-59","title":"触发器需求｜9 页签资料索引","url":"https://bytedance.larkoffice.com/wiki/M0xbwEnA2iMPFWku0oTcOz7WnBc"},{"id":"SR-VISUAL-OPTIONS","title":"主动服务视觉消费｜两项备选方案","url":"https://bytedance.larkoffice.com/wiki/ThqnwM9aNi7qpIkaoYIcNemJnvb"},{"id":"SR-244","title":"啰嗦评测 0626｜车载话术样本（局部）","url":"https://bytedance.larkoffice.com/wiki/WaKPw4HXEiCkmykUzTwc7Rttnec?sheet=SPrkCZ"},{"id":"SR-299","title":"评测问题讨论｜最终目标、过程检查点与 Context","url":"https://bytedance.larkoffice.com/wiki/HrrywG2ItiWJTHkRPdGcql1pnTf?sheet=380f14"}],"tools":[{"row":2,"name":"vehicle_basic_control","label":"车辆设备控制","category":"车辆与系统","status":"车辆控制合同；动态词典机制限定上汽 DNA，实际动作范围由车型提供。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","CONTROL-DYNAMIC"],"states":["待调用","已下发","执行成功/部分成功/失败"],"id":"TOOL01","x":190,"y":35300,"w":2760,"h":943,"intro":"把车辆设备要求转换成当前车型支持的控制调用。","paragraphs":["用户要求“打开副驾座椅加热”时，输入要包含具体设备、位置与动作。车控工具负责车辆设备控制；智驾、专属氛围灯在工具表中另有入口。把乘客名字换成座位属于调用前的理解，不能据此臆造工具内部的人脸查询流程。","上汽 DNA 的动态参数方案允许车端上报应用名称、自定义模式、座椅记忆位置和用车习惯等词典，并对应到函数参数。它解决的是用户自定义名称如何进入提槽；这是一条上汽 DNA 专项机制，不是所有车型共有的固定步骤。","工具表记录的车控回包包含改写后的请求、函数、状态和原因。到达语音调节极限时可能仅部分满足用户要求，应按实际回包解释完成范围；无论模型说得多肯定，都不能代替执行结果。","工具表对超时明确要求按失败返回且勿重复调用。回包继续进入 Planner 还是直接交付，由主链调用配置决定；不能把“所有工具都回到 Planner 再推理”写成工具统一合同。"]},{"row":3,"name":"vehicle_system_settings","label":"系统设置","category":"车辆与系统","status":"系统设置入口；具体可控项及结果回执随车型接入。","sourceId":"TOOLS-IO","id":"TOOL02","x":3710,"y":35300,"w":2760,"h":943,"intro":"处理车机系统设置，包括音量、屏幕、热点、应用及相应账号操作。","paragraphs":["用户要调低屏幕亮度时，输入需要明确设置项和目标值；打开某个应用时，需要能对应到真实安装的应用。Director 先把用户的表达变成可执行要求，再交系统设置能力处理。","下游依据本车型的系统能力映射功能。音乐的上下首、进度和收藏属于媒体控制，K 歌点播与模式则由这一入口承接，不能因为都发生在同一屏幕上就混成一种操作。","执行后需要取得实际状态、当前值或失败原因，才能告诉用户是否生效。账号或电源相关操作还可能有额外权限与确认要求，工具被选中不代表这些要求已经满足。","参数越界、应用未安装、权限不足和车机状态限制会导致不同结果。目标项目必须提供对应的执行回执；缺少真实结果时，只能说明进展尚不明确，不能凭指令已发出就宣布设置完成。"],"sourceIds":["TOOLS-IO"]},{"row":4,"name":"vehicle_communication","label":"车载通讯","category":"车辆与系统","status":"可选通讯能力；取决于车端连接、通讯录授权及项目接入。","sourceId":"TOOLS-IO","aliases":[{"name":"vehicle_communication_control","evidence":"动态示例指南","status":"历史名称，运行时映射待核"}],"id":"TOOL03","x":7230,"y":35300,"w":2760,"h":943,"intro":"执行本车支持的电话或视频通话操作，联系人和通讯授权需要真实可用。","paragraphs":["用户说“给妈妈打电话”，Director 需要保留联系人称呼，交给本车通讯录与通讯能力解析。缺少联系人或遇到同名对象时，应补问或让用户选择，不能编造私人号码。","下游依赖蓝牙连接、通讯录授权和相应视频能力来拨打、接听或挂断。当前入口的职责是通话控制，不能顺带用它发送短信，也不能只根据工具名字推断所有通讯能力都已接入。","拨号命令发出、正在呼叫、对方接通、通话结束，是不同阶段。反馈必须能表达当前停在哪一步，用户才不会在电话还未接通时听到误导性的完成承诺。","未连接设备、授权失效、联系人查不到和拨号失败，应返回各自原因。若项目还没有完整的状态回执，就需要补齐这一接点；仅看调用受理无法判断通话是否建立。"],"sourceIds":["TOOLS-IO"]},{"row":5,"name":"auto_drive","label":"智能辅助驾驶","category":"车辆与系统","status":"可选辅助驾驶能力；仅限目标车型明确开放且通过执行条件的动作。","sourceId":"TOOLS-IO","id":"TOOL04","x":10750,"y":35300,"w":2760,"h":943,"intro":"承接项目开放的辅助驾驶与泊车要求，车辆执行许可由专用能力判断。","paragraphs":["用户提出泊入、泊出、调整巡航速度或跟车时距时，Director 先确认请求属于当前支持的驾驶动作。规划去哪里应交导航，不能通过这个工具直接补做目的地搜索。","下游可能承接贴边、循迹、记忆泊车、变道或辅助驾驶风格等操作，其中风格有舒适、标准、运动等定义。每种操作都要检查车型支持、当前车辆状态和控制权限，不能因模型理解了要求就放行。","真正执行前，专用系统还要处理速度、挡位、环境和驾驶员控制权等约束。反馈应区分已接管、执行中、已终止或被拒绝，让 Director 忠实解释当前状态。","不同车辆开放的动作与回执可能不同，缺少相应合同就不能承诺执行。导航已经开始、路线解释完毕或工具调用已受理，都没有证明车辆完成了某个驾驶动作。"],"sourceIds":["TOOLS-IO"]},{"row":6,"name":"route_planning","label":"路线规划（AiNavi）","category":"导航与行程","status":"AiNavi 路线能力；与其他导航入口按项目路由并遵守互斥。","sourceId":"TOOLS-IO","aliases":[{"name":"route_planning_qa","evidence":"动态示例指南/互斥栏旧ID","status":"历史名称，别名映射待核"}],"states":["地点/条件待明确","算路/候选返回","选择/发起导航","成功/失败"],"id":"TOOL05","x":190,"y":36393,"w":2760,"h":908,"intro":"用明确地点完成定位、算路和项目支持的路线操作，处理真实候选而不猜目的地。","paragraphs":["用户说“去昨天那家游泳馆”，应先补齐具体地点，再调用路线规划。输入还可以包括真实途经点及增删改要求；模糊类别需求则先搜索地点，不能凭空填写地址。","下游完成地图匹配和算路，返回地点或路线候选。列表可能带路线 ID、时间、距离、费用及红绿灯数，Director 根据真实结果介绍或请用户选择，序号必须对应本次候选。","拿到路线后，还要读它当前只是保存、已经算出，还是已经开始导航。若仍需要选择或启动，就按本项目合同继续下一步；已经启动则保留事实，避免再次发同一动作。","会改变同一导航状态的工具需要分轮处理，不能并行争抢路线。道路级复杂偏好按高德专项边界选择入口；失败是否重试取决于当前实现，不能沿用其他版本的重试次数。"],"sourceIds":["TOOLS-IO"]},{"row":7,"name":"poi_search","label":"POI类别搜索（AiNavi）","category":"导航与行程","status":"AiNavi 类别搜索；沿途查询要求已有可用导航路线。","sourceId":"TOOLS-IO","aliases":[{"name":"search_poi_qa","evidence":"旧指南及互斥说明","status":"旧范围不完全一致，运行映射待核"}],"id":"TOOL06","x":3710,"y":36393,"w":2760,"h":908,"intro":"按类别、范围和条件找一批地点，例如附近或现有路线沿途的目标。","paragraphs":["用户提出某类地点需求时，输入要保留类别、范围及筛选条件。附近、多个点的中间位置与沿途是不同范围；如果尚未导航，就没有可依赖的当前路线，不能假装已经做了顺路搜索。","下游按条件检索并返回排序的 POI，也就是地图中的地点候选。这个入口负责找一批地点，精确地名导航和单店详细问答需要按各自职责处理。","Director 用真实名称和序号介绍候选。用户选定后，再把对应地点交路线规划，搜索到列表本身没有启动导航，也不能任意挑一条替用户作决定。","沿途无结果时不重复调用相同搜索；附近无合适结果时，Director 可以判断是否需要联网补查。无结果要如实说明，不能为了让流程继续而编出一个满足条件的地点。"],"sourceIds":["TOOLS-IO"]},{"row":8,"name":"trip_plan_record","label":"行程规划记录","category":"导航与行程","status":"行程记录实现；使用前确认项目是否仍采用这一入口。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","DYNAMIC-EXAMPLE"],"aliases":[{"name":"trip_planning","evidence":"标准化PRD独立行","status":"不直接断言同一工具，需确认替代关系"}],"id":"TOOL07","x":7230,"y":36393,"w":2760,"h":908,"intro":"保存或修改已经整理清楚的多日行程，不直接启动其中的导航。","paragraphs":["用户提出多日行程需求后，Director 先搜索并整理安排，明确出发日期、总体目标和每天的地点顺序。缺少出发时间时需要追问，不能把一个口头草案直接写成已确定行程。","预览完成后，记录工具才接收创建或确认要求。修改已有行程时，需要指明具体对象以及添加、删除或换序内容，避免覆盖另一份计划。","返回应说明保存、添加、删除或更新是否成功。Director 说完行程与系统已经存好行程，是两项结果；后续真的要去某一站，还需单独调用导航相关能力。","它与涉及同一行程和路线的工具需要按依赖顺序处理。当前项目若采用其他行程入口，应先确认实际映射和保存机制，不能仅凭名称相近就把新旧实现当成一个。"]},{"row":9,"name":"map_location_pick","label":"地图选点","category":"导航与行程","status":"地图精确选点能力；可用实现及异常回执按项目确认。","sourceId":"TOOLS-IO","id":"TOOL08","x":10750,"y":36393,"w":2760,"h":908,"intro":"把一个精确地名或当前位置解析成明确的地图地点对象。","paragraphs":["用户给出具体地名时，地图选点可以查它的名称、地址和坐标。输入需要足够明确，多条件找商家或询问路况不属于这一步的职责。","下游在地图中定位对象。多个地方同名时，要保留真实候选并请用户确认，不能因为第一条排在前面就自动认作目的地。","选点结果给后续业务提供地点信息。例如确认游泳馆的坐标后，Director 才能继续规划路线；查到坐标没有意味着导航已经启动。","查不到、权限受限或服务超时，应保留对应结果，缺失的异常合同需要项目补齐。无法确定目标时暂停后续依赖动作，不能用模糊描述填充一个看似精确的地址。"],"sourceIds":["TOOLS-IO"]},{"row":10,"name":"search_local_life","label":"豆包本地生活搜索","category":"导航与行程","status":"本地生活专项搜索；类别、供应商覆盖与启用范围随项目。","sourceId":"TOOLS-IO","id":"TOOL09","x":190,"y":37451,"w":2760,"h":908,"intro":"通过豆包本地生活能力寻找美食、景点、娱乐或住宿候选。","paragraphs":["用户提出吃饭、游玩或住宿需求时，Director 把类别和筛选要求交给本地生活搜索。这个入口没有覆盖所有地图类型，停车场、商场等不能不加区分地塞入。","下游依据供应商覆盖范围返回结构化地点，供 Director 比较、介绍和后续规划。它与 AiNavi 的类别搜索范围不同，不能因为一个没结果就无条件切到另一入口。","得到候选后仍要确定用户选哪一个，再进行后续动作。没有合适结果时，可由 Director 判断是否联网补查；搜索本身不会替用户开始导航。","工具失败不自动重复同一调用，无结果也不补造商家。产品需要明确当前渠道支持的类型和真实返回范围，避免用某家供应商不覆盖来断言附近不存在相应地点。"],"sourceIds":["TOOLS-IO"]},{"row":11,"name":"navi_basic_control","label":"地图与导航基础控制","category":"导航与行程","status":"地图及导航控制入口；支持项与互斥关系由当前项目实现确定。","sourceId":"TOOLS-IO","id":"TOOL10","x":3710,"y":37451,"w":2760,"h":908,"intro":"控制已有导航过程或地图界面，具体启停与设置职责以当前导航实现为准。","paragraphs":["用户想暂停或继续导航、改变地图视角、调整播报或收藏时，要先知道当前地图和导航处于什么状态。新的目的地搜索与算路有对应入口，不在这里凭空创建地点。","下游把明确要求映射到本车型开放的导航或界面功能。路线级复杂道路偏好另走专项能力，避免把改变行驶方案与改变地图显示混在一起。","反馈应区分真正完成、未处于导航和不支持等原因。打开了地图界面只证明界面变化，不能据此说已经开始导航；已有目标状态也不需要假装又完成一次变化。","与其他互斥导航工具分轮处理，无回包时不重复发同一操作。当前条件不成立就解释状态或补足必要信息，不能用反复发送相同命令代替处理失败原因。"],"sourceIds":["TOOLS-IO"]},{"row":12,"name":"vehicle_status_search","label":"实时车辆状态查询","category":"事实与知识","status":"已知状态补查；本文仅描述工具表范围和 Context 查询关系。","sourceId":"TOOLS-IO","aliases":[{"name":"search_vehicle_status_info","evidence":"历史指南","status":"旧名映射需核当前注册配置"}],"id":"TOOL11","x":7230,"y":37451,"w":2760,"h":908,"intro":"按需要补查当前车辆状态，返回状态信息而不改变车辆。","paragraphs":["调用问题应指明设备、位置和要查的状态，例如“副驾空调当前设定温度”。如果当前 Context 已提供所需事实，Planner 可以直接使用；查询工具不是每次车控前固定必经的一步。","工具表列出的范围包括车况、温度、空调、车窗以及导航和媒体状态，返回自然语言状态与已知范围。它没有定义一套全车型统一的“先读哪个缓存、再查哪个 ECU”的内部链，不能自行补写。","查询结果为空时，不能把它解释成设备关闭、数值为零或硬件不存在。对信息是否过期，要结合对应端状态的有效期规则判断，不能由工具页凭空指定统一时效。","Planner 取得返回事实后再回答或继续调用控制工具。状态查询解决“现在是什么”，控制调用解决“要变成什么”，二者的返回结果分开解释。"],"sourceIds":["TOOLS-IO","CONTEXT-ONEPAGE"]},{"row":13,"name":"weather_search","label":"天气查询","category":"事实与知识","status":"可选天气服务；地点、时间覆盖和返回范围依供应商接入。","sourceId":"TOOLS-IO","aliases":[{"name":"search_weather","evidence":"历史指南","status":"旧名映射待核"}],"id":"TOOL12","x":10750,"y":37451,"w":2760,"h":908,"intro":"查询指定地点和时间的天气资料，供本轮回答或决策使用。","paragraphs":["用户问天气时，需要明确城市或地点以及今天、明天或某个小时等时间范围。Director 先检查已有背景是否足够，避免带着错误城市重复查询。","下游可以提供天气、气温、风、空气质量和生活指数等信息。结果所指的地点与时段应一并交回，不能把远处或全天预报直接解释成本车此刻正在经历的天气。","Director 根据真实结果回答，或者结合用户目标决定是否继续其他工具。未来降雨预报与车端传感器观察到的雨水是不同事实，不能用一个替代另一个的执行条件。","没有结果时说明无法确认，不编造天气。城市有歧义、时间超出覆盖或供应商异常时，应保留具体限制，后续是否重查由实际原因和项目合同决定。"],"sourceIds":["TOOLS-IO"]},{"row":14,"name":"vehicle_manual_qa","label":"通用车辆说明书问答","category":"事实与知识","status":"通用车书知识；项目可能采用独立工具或 Context 前置替代路径。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","MANUAL-TECH","DT-PRD"],"id":"TOOL13","x":190,"y":38509,"w":2760,"h":908,"intro":"解释相应车型的通用功能和使用方法；知识回答与车辆执行分别完成。","paragraphs":["用户问一个按钮有什么用，或语音无法完成某动作而需要手动操作方法时，可以使用车辆说明书知识。问题涉及本车维修历史、专属配置或权益，则应转到单车资料能力。","知识可以通过独立工具检索，也可以由 Context 提前准备。前置方案会做多轮改写、车型过滤、候选检索和低置信过滤，再把答案作为背景交给 Director；这一方案用常用约 2000 条问答与前三个候选组织检索，不能推广成所有项目相同配置。","采用前置知识路径的项目会停用旧独立车书入口；其他项目按已启用的路径调用。回答必须匹配车辆配置和软件适用范围，正确说明如何操作，也没有直接替用户完成操作。","低置信或找不到知识时保留不确定性，不能编造按钮、参数或功能。查询手动方法也不必成为每次车控的固定前置步骤，只有业务确实需要时才进入这一路。"]},{"row":15,"name":"voice_acting","label":"声音演绎（历史工具）","category":"历史与弃用","status":"独立 Planner 工具已停用；相关声音能力改由当前输出路径承接。","sourceId":"TOOLS-IO","deprecated":true,"deprecationEvidence":"5/14评论，不是表格空白推断","id":"TOOL14","x":3710,"y":38509,"w":2760,"h":908,"intro":"已停用的独立声音演绎入口，用来理解旧请求中的唱歌、音色及语言处理。","paragraphs":["这个入口曾接受唱歌、悄悄话、指定语言、方言或音色要求。它直接下发语音并结束后续 Planner 处理，未采用现在常见的工具结果回到 Director 再组织回答的方式。","这一独立工具已经退出 Planner 工具集合。声音演绎改由回复内容中的标签选择唱歌或语音合成路径，因此不能在当前主流程中再把它安排成一个必经调用。","接口停用不等于唱歌或音色能力消失。用户提出相关要求时，应检查当前语音输出和车型实际支持的路径，而非重新启用这个旧接口。","旧调用没有 Planner 反馈，不能用它推导其他工具也不需要回流。当前是否听到了正确声音，仍需通过实际合成、播放及中断状态检查。"],"sourceIds":["TOOLS-IO"]},{"row":16,"name":"video_search","label":"长短视频搜索","category":"内容与媒体","status":"可选内容能力；短视频与长视频的来源、播放方式及屏幕支持不同。","sourceId":"TOOLS-IO","aliases":[{"name":"search_and_control_short_video","evidence":"历史指南","status":"旧名范围与实现待核"}],"states":["搜索/开屏待确认","候选返回或播放执行","已播放/待手动选择/失败"],"id":"TOOL15","x":7230,"y":38509,"w":2760,"h":908,"intro":"搜索项目接入的短视频或长视频，候选展示与开始播放按内容类型分别处理。","paragraphs":["用户提出片名、演员、剧集或类别时，Director 把明确搜索条件交入。这里的短视频来源为抖音，长视频来源为腾讯，不能把结果范围扩大成任意平台内容。","后排屏幕没开时，先询问是否开屏。用户同意后，先完成开屏再进行依赖它的操作；用户拒绝开屏仍可搜索，开屏不能被强加成所有搜索的必需条件。","短视频返回候选列表，需要用户手动点播；长视频通过对应函数执行，返回成功或失败。拿到搜索列表与视频已经开始播放，在这两种路径里都要明确区分。","长视频超时不自动重复调用。版权、供应商或屏幕能力限制应进入真实反馈，Director 据此说明结果，不能只因为搜到了片名就宣布已经播放。"],"sourceIds":["TOOLS-IO"]},{"row":17,"name":"music_search","label":"音乐搜索·豆包版（历史实现）","category":"历史与弃用","status":"豆包历史实现已弃用，由函数调用版替代。","sourceId":"TOOLS-IO","deprecated":true,"deprecationEvidence":"7/2评论","implementationVariant":"doubao_legacy","sameDefinitionAsRow":18,"id":"TOOL16","x":10750,"y":38509,"w":2760,"h":908,"intro":"已被函数调用版替代的豆包音乐搜索实现，与新实现共用 music_search 业务名称。","paragraphs":["这个实现曾根据歌手、歌名或风格查找音乐，返回专辑、歌单或单曲等结构化内容。它不处理播客、听书等长音频需求。","无版权时曾存在使用短视频音频的替代路径。该做法属于这套历史实现，不能直接带入当前音乐服务，也不能推断今日仍有同样的版权处理方式。","现在需要调用音乐搜索时，应选择项目当前启用的函数调用实现。两个条目使用同一个英文业务标识，代表实现变化，不能因此算成两种独立的模型能力。","解释旧结果时保留其候选结构；检查新请求时读取新实现的真实播放结果。若混用返回形态，可能把搜索命中当成已播放，或重复发起播放。"],"sourceIds":["TOOLS-IO"]},{"row":18,"name":"music_search","label":"音乐搜索·函数调用版","category":"内容与媒体","status":"音乐函数调用实现；实际供应商、授权和车型接入决定可用范围。","sourceId":"TOOLS-IO","implementationVariant":"function_call","sameDefinitionAsRow":17,"aliases":[{"name":"search_and_control_music","evidence":"历史指南","status":"旧名映射待核"}],"id":"TOOL17","x":190,"y":39567,"w":2760,"h":908,"intro":"用明确的音乐信息调用当前媒体实现，并依据真实反馈判断是否开始播放。","paragraphs":["用户给出歌名、歌手、专辑或可搜索的风格时，Director 可以直接整理搜索条件。若说“那首冠军歌”，需要先确认实际歌名，不能把复杂知识推断留给只擅长搜索的接口。","执行层调用当前项目的音乐函数能力，完成支持的搜索或播放过程。实际登录、版权和供应商覆盖继续约束能否播放，工具知道歌名并没有绕过这些条件。","成功反馈可以包含正在播放的歌曲、歌手和专辑。Director 用这份真实结果确认媒体对象，不能只凭搜索命中或接收了请求就说音乐已经响起。","未登录时引导用户走合法登录流程；超时不自动重复调用。不能把历史豆包版的专辑、歌单候选格式套到这里，也不能为失败补造一个已播放结果。"],"sourceIds":["TOOLS-IO"]},{"row":19,"name":"media_basic_control","label":"媒体播放与内容控制","category":"内容与媒体","status":"当前媒体控制；操作集合受媒体应用和车型实现约束。","sourceId":"TOOLS-IO","id":"TOOL18","x":3710,"y":39567,"w":2760,"h":908,"intro":"控制当前已有媒体会话，例如暂停、切换、进度、倍速和收藏。","paragraphs":["用户说“暂停”时，Director 先确认当前有哪些媒体正在播放，再把明确操作交给媒体控制。它控制已有内容，新的歌曲或节目要用对应搜索能力准备。","下游把操作映射成当前应用支持的函数。上下个、进度、收藏、画质、点赞等支持范围可能不同，K 歌点播和模式则属于系统设置，不能让两个工具同时争抢一个应用。","反馈保留具体函数、状态和原因，包括已是目标状态、未登录或执行失败。若音乐本来就暂停，应说明当前状态，不能宣称刚刚又造成一次变化。","没有可控制媒体、应用不支持或无回包时，要按实际原因处理，无回包不自动重复下发。Director 接到反馈后据实回应，必要时再询问目标，不能把暂停音乐扩大成关闭所有声音。"],"sourceIds":["TOOLS-IO"]},{"row":20,"name":"user_memory_search","label":"用户记忆检索","category":"身份与记忆","status":"按当前工具定义进行显式记忆检索；姓名/FaceID 约束来自工具表，隐私实现状态不能统一外推。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","DYNAMIC-EXAMPLE","ME-MEM-ONE","ME-MEM-PRD"],"aliases":[{"name":"search_user_memory","evidence":"历史指南","status":"旧名映射待核"}],"id":"TOOL19","x":7230,"y":39567,"w":2760,"h":908,"intro":"围绕具体乘客和具体问题，补查经历或个人事实。","paragraphs":["工具表 user_memory_search 要求查询指向具体姓名，并注明 FaceID 未知时不能查询；动态示例指南中的 search_user_memory 也用具体人物和经历描述查询。两份材料的名称不同，实际调用名应以当前注入工具定义为准。","记忆服务支持语义检索和标签相关获取，并明确可能过召。原稿“记忆服务先核账号、乘客与在场范围”的精确内部顺序没有被这些正文完整证明，因此这里不再把它画成已实施步骤。账号、授权及人员范围属于业务使用约束。","返回内容可能找到相关记忆，也可能明确没有找到。Planner 要判断结果是否能回答当前问题，例如昨天去过哪家游泳馆；若还不能唯一确定地点，就不能把一个相似候选直接当成导航目的地。","关闭记忆会冻结已有内容的召回；新事实还可能尚未完成提取。因此“没查到”不等于用户从未说过。长期记忆的隐私策略在 OnePage 中仍有施工中和规划中项，不能把全部策略写成所有项目都已实现。"]},{"row":21,"name":"user_memory_operate","label":"基础记忆操作","category":"身份与记忆","status":"基础事实增改；旧表、指南和新增删除需求须按项目版本分别采用。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","DYNAMIC-EXAMPLE","ME-MEM-PRD"],"aliases":[{"name":"operate_user_memory","evidence":"历史指南","status":"旧名映射待核"}],"states":["准入确认","操作已受理","异步生成/删除处理中","成功可用/失败"],"id":"TOOL20","x":10750,"y":39567,"w":2760,"h":908,"intro":"记录或更新用户明确陈述的基础事实，先区分事实与未来交互规则。","paragraphs":["动态示例指南将 operate_user_memory 定义为客观事实类信息记录，例如家在哪里、年龄、工作、家庭关系或宠物。合适的例子是“记住我养了一只猫叫团子”；旧稿直接拿“不吃香菜”作为本入口例子，混入了偏好范围，应删除。","不确定的信息先确认；用户明确纠正旧信息时按新事实更新。旧工具表 user_memory_operate 要求已注册 FaceID，并给出位置或说话人未注册的失败分支。两个工具名称及各自部署需依当前项目定义匹配，不能只凭语义相似当成同一个运行时 ID。","记忆关闭时，PRD 要求说明当前没有记录个人信息的权限，并询问授权。工具回应与记忆提取、存储、后续召回是不同事实；本次核读未证明此工具所有增改都采用一套统一异步作业状态，因此删除旧稿对固定异步生成机制的断言。","旧表明确不支持删除；10 月记忆 PRD 新增语音删除需求，批量按人、日期或全部删除要求二次确认，语义删除还要更新画像。新增需求不能自动覆盖旧工具合同，也不能据此宣布所有车型已支持删除。"]},{"row":22,"name":"face_id_register","label":"人脸身份注册与管理","category":"身份与记忆","status":"人物注册与管理；生物特征留端，云端使用身份关联标识。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","ACCOUNT-ONEPAGE"],"id":"TOOL21","x":190,"y":40625,"w":2760,"h":908,"intro":"把当前座位上的真实乘客与昵称或关系关联，用于后续身份识别。","paragraphs":["用户要求注册一个人时，需要昵称和当前座位，不能只说“记住这个人”。下游先根据座位找到实际人脸，再判断能否建立人物记录。","空座、未识别人脸、多人重名、同一张脸已有其他名字，都需要不同处理。缺字段时先补问，不能猜姓名和座位，也不能把人脸注册等同于声纹鉴权。","工具还可以承接当前实现支持的改名、改关系或查询。删除人物在这套入口中需要用户去手动设置完成，不能与删除一条个人偏好混成一个操作。","注册结果成功后，还要检查乘客信息是否同步以及后续记忆是否归到正确的人。人物识别关系没有自动授予车主权限，车控和私人数据访问仍有各自授权。"]},{"row":23,"name":"web_search","label":"联网信息素材搜索","category":"事实与知识","status":"联网素材搜索入口；结果先供主流程判断。","sourceId":"TOOLS-IO","id":"TOOL22","x":3710,"y":40625,"w":2760,"h":908,"intro":"为 Director 补充联网信息素材，再由它决定回答或继续调用业务工具。","paragraphs":["用户问时效信息，或要求播放一个需要先查知识才能确定的歌曲时，Director 先把待核问题写清楚。搜索需要具体目标，不能拿含糊描述直接当成已确认事实。","下游返回相关信息或空结果，提供本轮判断所需信息。Director 继续核对地点、时间、来源与内容是否真的支持用户的问题，不会因为工具成功返回就无条件采信。","例如先查清真实歌名，再把歌名交音乐工具；先获得地点线索，再继续地图定位。搜索答案没有直接替用户完成播放、导航或其他动作。","无结果就说明无法确认，实时事实也不能靠旧知识补造。需要对用户回答时，由 Director 统一组织话术，避免把未经核对的搜索片段原样当成最终结论。"],"sourceIds":["TOOLS-IO"]},{"row":24,"name":"web_qa","label":"联网问答（已弃用）","category":"历史与弃用","status":"已弃用；仅保留历史联网回答实现的识别说明。","sourceId":"TOOLS-IO","deprecated":true,"deprecationEvidence":"表第24行明确弃用","id":"TOOL23","x":7230,"y":40625,"w":2760,"h":908,"intro":"已弃用的直接联网问答入口，不再作为当前默认回答路径。","paragraphs":["这个接口曾直接接收用户问题并返回联网回答，因而承担了比素材搜索更多的最终回答职责。它与 web_search 的结果先交给 Director 继续判断的用法不同。","当前处理联网需求，应使用项目正在启用的搜索与统一回答链。不能为了减少一次推理就自动切回这个停用接口。","遇到历史调用时，可以据此理解当时为何直接出现回答，但不能把旧返回格式套到当前工具反馈，更不能推断今日仍有同样的路由。","最终要检查的仍是信息是否支持问题、话术是否准确，以及用户是否真正听到或看到结果。旧工具曾返回答案，不会替当前请求完成这些步骤。"],"sourceIds":["TOOLS-IO"]},{"row":25,"name":"operate_conditional_task","label":"定时日程提醒（已弃用）","category":"历史与弃用","status":"已弃用；当前任务改用对应渠道的 Goal 或 Task Service 路径。","sourceId":"TOOLS-IO","deprecated":true,"deprecationEvidence":"表第25行明确弃用","id":"TOOL24","x":10750,"y":40625,"w":2760,"h":908,"intro":"已弃用的定时日程提醒入口，新的任务按当前渠道任务系统管理。","paragraphs":["这个旧入口曾处理时间任务的新增、删除、修改和查询。它有自己的任务对象与生命周期，不能作为当前 Goal 或 Task Service 之前的固定一层。","用户现在说“十分钟后提醒我”，应先确定当前渠道实际提供哪个任务工具，再提交完整目标、时间和对象。旧接口曾支持修改，也不能证明只支持增删的 Goal 实现同样可以修改。","查看历史结果时，要把旧任务 ID 与对应系统关联。旧调用返回成功，没有证明新的任务系统已经保存或向触发器登记了规则。","当前任务仍要分别核创建、规则生效、条件命中、下游执行和用户结果。取消也要定位实际任务并取得回执，不能通过停用旧入口的存在来推导新任务已结束。"],"sourceIds":["TOOLS-IO"]},{"row":26,"name":"search_and_control_ai_broadcast","label":"临时AI播客（已弃用）","category":"历史与弃用","status":"已弃用；当前播客搜索与生成走各自入口。","sourceId":"TOOLS-IO","deprecated":true,"deprecationEvidence":"表第26行明确弃用","id":"TOOL25","x":190,"y":41683,"w":2760,"h":908,"intro":"已弃用的临时 AI 播客入口，当前搜索已有节目与生成新节目分别处理。","paragraphs":["这一旧入口曾承接深入研究或播客相关请求。现在应先判断用户是想找到已有节目，还是围绕主题生成新的内容，两种需求有各自的工具和完成状态。","查已有播客需要真实搜索结果与播放反馈，生成播客需要生成任务、成品资源和播放过程。不能把旧入口与这两项能力叠成三个默认可用的等价选择。","历史返回可以解释旧请求的处理方式，但不能作为当前任务已生成或已播放的证明。遇到旧结果时，应回到当时的实际业务状态理解。","新请求失败时，不自动使用这个停用接口兜底。应根据当前能力解释失败原因或调整请求，避免把已经不再支持的路径继续暴露给用户。"],"sourceIds":["TOOLS-IO"]},{"row":27,"name":"gui_agent_operation","label":"GUI Agent操作（已弃用）","category":"历史与弃用","status":"已弃用；与当前动态卡片操作是不同能力范围。","sourceId":"TOOLS-IO","deprecated":true,"deprecationEvidence":"表第27行明确弃用","states":["clarify","handoff","finish（不必然履约完成）"],"id":"TOOL26","x":3710,"y":41683,"w":2760,"h":908,"intro":"已弃用的长程 GUI 操作入口，保留其澄清、人工接管和任务结束的业务含义。","paragraphs":["旧 GUI Agent 曾处理点餐、订座、停车缴费等多步界面任务，通常需要精确地点和完整条件。它会经历多个页面与状态，无法用一次按钮点击概括。","返回 clarify 时，需要用户补充信息；handoff 表示交给用户登录等人工接管；finish 只表示这个 Agent 的任务结束。结束时业务仍可能停在待手机付款，不能因此说已经支付或预订成功。","这套工具现已弃用，动态卡片页面操作也没有自动继承它的全部能力。当前用户要求操作某页面时，应确认项目真正开放的页面、按钮和业务入口。","旧流程异常不自动重复操作，尤其涉及订单或支付时，要保留已发生的事实。判断履约需要业务真实状态，不能以页面跳转或 Agent 结束代替。"],"sourceIds":["TOOLS-IO"]},{"row":28,"name":"audio_record","label":"录音纪要","category":"内容生成与记录","status":"可选录音纪要；离线音频总结，异步生成与展示按项目接入。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","AUDIO-SERVER","AUDIO-CLIENT"],"aliases":[{"name":"recording_minutes","evidence":"历史指南","status":"旧名/新名映射待核"}],"states":["未录音","录音中","上传中","生成中","结果可见/失败"],"id":"TOOL27","x":7230,"y":41683,"w":2760,"h":908,"intro":"控制录音并在结束后生成纪要，录制、上传、总结和可查看分别有状态。","paragraphs":["用户要开始、停止或查看纪要时，先确定当前录音对象与状态。已经在录音时再次开始，或没有录音却要求结束，都需要清楚返回，不能新建一个含糊任务掩盖冲突。","开始与停止由车端执行。结束后上传离线音频，再创建总结任务，生成成功或失败后回传并展示卡片。这一路是离线文件总结，停止录音没有立即产出完整纪要。","控制反馈分别包括开始成功、开始失败、已有录音，以及结束成功、结束失败、未录音和查看成功、失败。后续生成还有自己的状态，要关联原录音，不能只看控制工具返回就宣布可读。","端侧文件方案最多保留 10 个本地文件，并在上传成功后才删除。下电可能打断尚未完成的上传，分片和手机通知等能力需要实际接入支持；因此应检查音频已上传、总结已完成、用户能打开内容三个结果。"]},{"row":29,"name":"image_generate","label":"图片生成与续改","category":"内容生成与记录","status":"可选图片生成；编辑、多图及上传能力按实际期次开放。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","IMAGE-SERVER","IMAGE-CLIENT"],"states":["请求受理","生成中","部分成功/全部成功/失败","图片已展示"],"id":"TOOL28","x":10750,"y":41683,"w":2760,"h":908,"intro":"根据文字生成图片，或在已支持的范围内定位旧图片继续修改。","paragraphs":["用户描述想画什么时，Director 将生成要求交给图片能力；继续修改时，还需要指明真实图片资源和第几张，不能只用一个脱离历史的“改一下”。","Creation Agent 在内部选择文字生图或编辑等处理，输入输出资源与原请求关联。生成可以在本轮被打断后继续完成，再经异步通道送到车端，不能因对话切换就丢掉已完成资源。","“这就生成”只说明受理，后面还可能成功、部分成功或失败。车端加载、放大、翻页及失败占位属于用户实际看到的过程，拿到资源地址与图片上屏也要分别验证。","一期并未覆盖所有端上传图和图生图场景，端侧方案同一用户同时只运行一个任务。发生部分失败时展示成功图与失败位置，网络异常如实说明；没有确定超时合同就不编统一等待秒数。"]},{"row":30,"name":"visual_qa","label":"视觉问答","category":"感知与知识","status":"按次视觉问答；旧工具表与新增项目定义不同，当前范围由实际工具注入和项目链路确定。","sourceId":"TOOLS-IO","aliases":[{"name":"search_visual_info","evidence":"历史指南","status":"旧范围含屏幕，与当前表不同，不能无条件等价"}],"sourceIds":["TOOLS-IO","DYNAMIC-EXAMPLE","ASY-A49","ASY-A44","ASY-A06"],"id":"TOOL29","x":190,"y":42741,"w":2760,"h":908,"intro":"回答当前这次视觉问题；舱内、舱外和屏幕场景按项目链路分别处理。","paragraphs":["用户问“后排现在有几个人”是按次视觉问答，不必建立持续观察任务。VQA 先理解场景、方向和对象，再沿该场景取图和识别。用户说“宝宝哭了告诉我”则属于持续任务，需另接 TaskService 和 Trigger。","Seres 技术方案明确舱内由云端下发提示词与当前 Query，端侧取图并用端侧 VLM 识别，仅返回文字描述，原始舱内图片不上云。原文复用 TaskService 的舱内问图方案已划除，不能把这两条链混接。","舱外、地点、观影搭子和通用场景沿用主线：客户端取图上传并回传 URI，云端交内容定制联网智能体处理；车辆识别走 ToB 车辆识别接口。结果回给 Planner 总结。这是专文支持的业务分支，不是所有问题都用同一个端侧模型。","旧工具表 visual_qa 写了不支持屏幕和联网，但动态示例指南 search_visual_info 明确包含屏幕问答，Seres 专文也包含观影搭子和联网处理。因此旧稿的统一否定应撤回。氛围灯视觉取色仍按指南直接交专用氛围灯工具。"]},{"row":31,"name":"ambient_light_control","label":"氛围灯语义与视觉配色","category":"车辆与系统","status":"上汽定制氛围灯能力；视觉和效果范围依硬件及项目接入。","sourceId":"TOOLS-IO","id":"TOOL30","x":3710,"y":42741,"w":2760,"h":908,"intro":"按明确颜色或语义场景设计氛围灯，支持时在工具内部完成视觉取色。","paragraphs":["用户可以要求开关、模式或颜色，也可以提出按晚霞、衣着或屏幕颜色配色。Director 保留用户想表达的效果，再交给专用能力，普通车灯和阅读灯仍走车辆控制。","需要取色时，这个工具内部完成视觉获取、理解和配色，再调用对应氛围灯功能。外层不必先单独调用视觉问答，再把颜色转述一次。","返回可能先说明设计中，随后才有设置成功或失败。没有流光硬件与完全没有氛围灯是不同限制，要据实际车辆能力解释，不能笼统说全都支持或全都不可用。","视觉未取到或颜色没有实际设好时，不能提前确认完成。具体取图、映射和执行回执需要对应实现支持，用户最终看到的颜色变化才是这一要求的实际结果。"],"sourceIds":["TOOLS-IO"]},{"row":32,"name":"broadcast_search","label":"播客/听书长音频搜索","category":"内容与媒体","status":"可选喜马拉雅长音频能力；受授权、候选范围与真实播放状态约束。","sourceId":"TOOLS-IO","aliases":[{"name":"search_and_control_broadcast","evidence":"历史指南","status":"旧名映射待核"}],"id":"TOOL31","x":7230,"y":42741,"w":2760,"h":908,"intro":"搜索和选择喜马拉雅的播客、听书等长音频，后续选择依赖真实候选。","paragraphs":["用户想听某类播客或有声书时，Director 把主题和筛选要求交入。这一路搜索已有长音频，既不搜索其他未接入平台，也不生成一个新的 AI 播客。","下游可以搜索、换一批或按真实选择播放。用户接着说“第二条”时，必须关联前一轮候选，不能在没有列表时猜测节目对象。","结果要区分找到并播放、没有找到、服务错误和未同意隐私协议。节目名称不匹配或序号越界时，应明确失败，再由 Director 判断是否需要澄清或重新检索。","用户未同意协议时需要完成合法授权，不能替他默认同意。无结果也不编造节目，搜索候选与实际播放分别验证，避免只看到列表就确认已经开播。"],"sourceIds":["TOOLS-IO"]},{"row":33,"name":"ai_broadcast_generate","label":"AI播客生成","category":"内容生成与记录","status":"可选 AI 播客生成；异步成品及播放结果需专项接入验收。","sourceId":"TOOLS-IO","id":"TOOL32","x":10750,"y":42741,"w":2760,"h":908,"intro":"围绕用户指定主题或长文生成新播客，生成和播放需要分别完成。","paragraphs":["用户想把某个主题或长文做成播客时，输入应包含具体内容和生成范围。已有节目搜索属于另一条路径，不能拿一组搜索结果代替新内容制作。","下游接受请求后开始生成，最早返回的“正在生成并播放”可能仍处于处理阶段。此时只应说明已经开始处理，不能承诺成品已经可以听。","完整业务还需要生成任务完成、资源可用和播放启动等结果。Director 应依据实际进展组织回答，车端继续检查声音是否真正播放。","生成失败、取消后是否继续、完成如何通知及等待多久，都需要目标项目明确合同。没有这些结果时保留处理中或未知，不自行补上通用超时秒数和自动重试规则。"],"sourceIds":["TOOLS-IO"]},{"row":34,"name":"car_care_qa","label":"单车维养与专属资料问答","category":"事实与知识","status":"上汽定制单车资料能力；数据范围与授权由车企接入决定。","sourceId":"TOOLS-IO","id":"TOOL33","x":190,"y":43799,"w":2760,"h":908,"intro":"查询这辆车的专属资料，例如配置、维保、权益及相关历史。","paragraphs":["用户问本车过去修过什么、有哪些权益或具体生产配置时，需要单车数据。当前空调温度应查实时状态，通用按钮用法应查说明书，先分清问题所需的事实来源。","下游依赖车企提供的车辆专属记录，按正确车辆、账号和授权范围读取。不能拿同车系通用知识或另一辆车的历史填补本车缺失资料。","返回内容需要能说明可见范围和资料时点，Director 再根据实际记录回答。数据未提供、权限不足和供应商故障，应让使用方知道不同原因。","涉及安全故障时，缺乏本车可靠信息不能编出确定诊断。若项目尚未提供完整输出与来源合同，就应先补齐这一段，不能仅凭工具名称承诺能查到全部维养情况。"],"sourceIds":["TOOLS-IO"]},{"row":35,"name":"car_log","label":"用车报告","category":"内容生成与记录","status":"上汽定制报告能力；生成终态与展示由客户实现承接。","sourceId":"TOOLS-IO","id":"TOOL34","x":3710,"y":43799,"w":2760,"h":908,"intro":"按明确时间或事件生成用车报告，结果要能实际打开和查看。","paragraphs":["用户要看上个月通勤、某次旅行或最近一年的用车情况时，输入先确定时间范围、车辆和账号。不能把全车历史都归成当前说话人的个人经历。","下游根据实际可用数据组织报告。生成流程和数据完整度由项目实现决定，缺失的记录应保留范围说明，不能用流畅叙述补成完整行程。","返回“正在生成”只表示受理，后面仍需要终态与成品。报告生成并在对应入口可查看，才构成用户可用结果，空白卡片或一句确认不足以完成验收。","失败、长时间未完成、通知和重试需要明确处理合同。缺少终态时，Director 如实说明当前进度，不把受理结果升级为已经生成全部报告。"],"sourceIds":["TOOLS-IO"]},{"row":36,"name":"parking_fee_pay","label":"停车查费与付款入口","category":"生态与交易","status":"可选停车查费与支付入口；用户扫码付款，覆盖停车场及车牌授权有范围。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","PARKING-TECH"],"aliases":[{"name":"search_and_pay_parking_fee","evidence":"停车技术方案","status":"技术方案名，实际注册映射待核"}],"states":["车牌待确认","注册/续期","查到订单/无订单","待用户扫码付款","已支付待真实状态证据"],"id":"TOOL35","x":7230,"y":43799,"w":2760,"h":908,"intro":"按车牌查询停车订单和费用，提供用户扫码付款的入口。","paragraphs":["执行前先确认要查哪块车牌，这个入口只接收车牌号，不能把一整段含糊缴费意图直接传入。车牌与当前授权范围也需要对应。","下游先检查注册状态。没有记录先绑定，已过期或七天内到期先续期；注册或续期失败就不继续查费。有效后才查询订单、停车时长和金额。","查到结果后，客户端把付款链接呈现成微信或支付宝二维码，用户自行扫码支付。Director 可以解释停车场、时长和费用，不能拿到二维码就宣称已扣款。","无缴费记录、车牌注册失败、第三方异常和订单已付，需要各自说明。最终付款仍要核订单真实状态，工具提供支付入口没有替用户完成付款。"]},{"row":37,"name":"meituan_restaurant_service","label":"美团餐厅服务","category":"生态与交易","status":"可选餐厅服务实现；需当前平台接入，登录、支付及商家确认分别完成。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","DT-PRD"],"aliases":[{"name":"restaurant_reserve","evidence":"标准化PRD","status":"新标准名与本表餐厅服务范围对应待核"}],"states":["资料待补","待登录","待支付定金","已提交待商家","已确认/失败/取消"],"id":"TOOL36","x":10750,"y":43799,"w":2760,"h":908,"intro":"按明确餐厅处理订座、排队及对应查询管理，登录和定金由用户完成。","paragraphs":["用户选“第二家”时，Director 先映射成真实餐厅全名。预订还需要日期时间、人数、包间或大厅及联系人；排队需要人数与桌型，不能把预订字段全部强加给排队。","必要信息不齐先补问，明确后再进入预订、排队、查询、修改或取消。未登录时交用户通过手机美团扫码，需要定金时由用户在手机支付，系统不能猜联系人或默认代付。","订单提交后可能仍等待商家确认，这时只能说明已提交。只有实际商家状态确认，才可告诉用户订好了；取消同样需要明确结果。","失败、商家拒绝和待确认应分别回到 Director，卡片按真实进展展示。当前标准订座入口与这一实现的名称映射需要运行配置明确，不能因名字相近自动互换。"]},{"row":38,"name":"personal_skill_record","label":"个性化技能规则记录","category":"身份与记忆","status":"已取得参数定义；更新语义及实际存储、生效合同尚未确认。","sourceId":"TOOLS-IO","sourceIds":["DYNAMIC-EXAMPLE","TOOLS-IO"],"states":["用户规则理解","操作受理","保存/更新/删除结果待接口确认","后续生效待验收"],"id":"TOOL37","x":190,"y":44857,"w":2760,"h":908,"intro":"提交个人交互规则的新增、更新或删除请求。","paragraphs":["个性化技能描述的是以后遇到什么情况应怎样回应，例如“推荐歌曲时带上创作背景”。这与只记录家住哪里等基础事实不同，也不等于此刻已经执行车辆动作。","指南给出 op、skill_name、skill_content、skill_id：新增由系统分配 ID，更新与删除必须提供真实 ID；内容包括触发场景与执行规则，能更新已有规则时优先更新。","指南内部存在更新合同冲突：参数示例要求更新后的完整内容，tips 却写只提交改变部分。因此不能在工具页替研发选定完整覆盖或局部合并，更不能补写一个尚未证明存在的查询步骤。","这份指南没有提供完整存储回执、召回位置、冲突优先级与删除传播机制。页面到“可提交的规则合同”为止，不再虚构保存后自动生效和未来执行的内部链。"]},{"row":39,"name":"goal_list_update","label":"持续目标管理（Goal渠道）","category":"任务与跟进","status":"Goal 表合同与动态示例的视觉范围冲突；按项目实际定义使用，不统一宣布支持或不支持。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","DYNAMIC-EXAMPLE","ASY-A03"],"states":["目标待澄清/合理性检查","创建中","已创建待条件","触发后执行/失败","删除成功/失败"],"relatedDefinitions":["task_agent"],"id":"TOOL38","x":3710,"y":44857,"w":2760,"h":908,"intro":"在采用 Goal 入口的项目中管理未来或持续目标。","paragraphs":["工具表中的 goal_list_update 支持新增与删除。新增提供目标描述，删除使用真实 goal_id；它不是当前轮普通聊天或一次性车控都必须经过的工具。","工具表范围是分钟级、最小循环一分钟、365 天内，并且不接依赖视觉的目标。动态示例指南却把“照看宝宝”“副驾睡着提醒我”列为 Goal 示例，两者明显不是可直接合并的一份能力承诺。","在采用工具表这份合同的项目中，“开五分钟空调”先由车控按需打开，Goal 只负责未来关闭。创建中不能承诺成功，删除也要以实际结果判断。","TaskService 的任务增改、视觉观察和生命周期另有专文。不能拿新任务体系的能力补写旧 Goal，也不能把旧 Goal 的限制限制到所有 Task 项目。"]},{"row":40,"name":"amap_complex_planning","label":"高德复杂路线规划","category":"导航与行程","status":"高德专项路线能力；已确认范围止于测试，正式使用以目标项目的开放状态为准。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","DT-PRD","DT-MEETING"],"relatedSourceUrl":"https://pq3b44yw2t9.feishu.cn/wiki/HnlvwjM9FihWUEkv6HFc2SJwn6d","id":"TOOL39","x":7230,"y":44857,"w":2760,"h":908,"intro":"处理具体道路或非固定路线偏好，补充普通路线规划的能力范围。","paragraphs":["用户要求走或避开某条道路、高速路段，或希望沿河、风景好、路宽时，需要把偏好明确交给复杂路线规划。普通精确目的地、途经点或固定枚举偏好仍按相应工具分工处理。","下游依据高德能力寻找满足道路约束的方案。它不承担地点类别搜索，也不能在偏好无法满足时悄悄改成相反路线。","返回可能包含真实地点或路线列表，以及自然语言说明。Director 保留候选身份和结果限制，再判断是否需要用户选择，不能在尚未确认时随意锁定目标路线。","这项能力不能与 route_planning 或 amap_navigation_interaction 同轮并行调用，避免共同修改导航状态。已确认的范围止于测试，正式使用以目标项目的开放状态为准；未开放时不向用户承诺道路级操作。"]},{"row":41,"name":"amap_navigation_interaction","label":"高德导航交互","category":"导航与行程","status":"高德专项导航交互；需已有路线条件，已确认范围止于测试，正式使用以目标项目的开放状态为准。","sourceId":"TOOLS-IO","sourceIds":["TOOLS-IO","DT-PRD","DT-MEETING"],"id":"TOOL40","x":10750,"y":44857,"w":2760,"h":908,"intro":"处理已有路线或导航过程中的道路交互与相关解释，先检查当前导航状态。","paragraphs":["用户在导航中提出出高速、主辅路切换、转向或环岛出口等要求时，首先需要真实可用的路线或导航背景。未处于导航时，相应动作不能凭空执行。","下游也可回答已有路线原因和道路信息。普通算路、复杂道路偏好和地图显示设置各有入口，当前位置、目的地及剩余时间若端状态已知，也不必重复向高德询问。","反馈要区分道路信息解释与动作结果。说明为什么选这条路线，没有代表车辆已经转向；返回一段自然语言，也要读清实际改变了哪个导航状态。","与互斥导航工具分轮使用，错误、超时和是否重试由项目合同决定。已确认的范围止于测试，正式使用以目标项目的开放状态为准，不能把某个测试效果推广到所有车型。"]},{"name":"task_agent","label":"新任务管理工具","category":"PRD标准化补充，不计40行","status":"Seres Task Service 现有业务链；其它项目以及二期能力须单独确认。","sourceId":"DT-PRD","id":"SUP01","x":190,"y":46115,"w":2760,"h":943,"intro":"将需要未来触发或跨会话管理的目标交给任务系统。","paragraphs":["用户说“十分钟后关闭主驾座椅加热”时，Planner 路由完整请求到任务入口。TaskService OnePager 明确任务按渠道、车辆和登录用户定位；任务服务结合已有任务判断创建、更新或取消。","创建时明确触发方式、执行内容和结束条件，保存 Task 并向 Trigger 注册规则。创建成功表示进入等待，不是座椅加热已经关闭。","时间或条件命中后，TaskService 检查回调和执行前提，激活本轮 Run，经 Recommend / Frontier 通知车端回流，再由 Planner 结合当前上下文完成提醒或工具动作。","执行反馈写回 Run 后，任务服务决定继续等待或关闭并清理规则。Script 编排和事件驱动修订计划在 OnePager 中明确属于二期未实施，不能加入这条现有链。普通取消对直接 GUI 任务也有未覆盖边界。"],"sourceIds":["DT-PRD","ASY-A03","ASY-A02"]},{"name":"trip_planning","label":"新标准化行程规划","category":"PRD标准化补充，不计40行","status":"当前资料只定义能力入口，尚未提供可核对的内部处理合同。","sourceId":"DT-PRD","id":"SUP02","x":3710,"y":46115,"w":2760,"h":943,"intro":"此项在资料中有能力入口定义。","paragraphs":[],"sourceIds":["DT-PRD"]},{"name":"customised_playlist","label":"节目编排","category":"PRD标准化补充，不计40行","status":"当前资料只定义能力入口，尚未提供可核对的内部处理合同。","sourceId":"DT-PRD","id":"SUP03","x":7230,"y":46115,"w":2760,"h":943,"intro":"此项在资料中有能力入口定义。","paragraphs":[],"sourceIds":["DT-PRD"]},{"name":"restaurant_reserve","label":"餐厅订座标准名称","category":"标准化名/别名待核，不计40行","status":"当前资料只定义能力入口，尚未提供可核对的内部处理合同。","sourceId":"DT-PRD","id":"SUP04","x":10750,"y":46115,"w":2760,"h":943,"intro":"此项在资料中有能力入口定义。","paragraphs":[],"sourceIds":["DT-PRD"]},{"name":"current_page_specific","label":"实时卡片页面操作","category":"动态设计补充，不计40行","status":"实时卡片动态工具设计；仅在有效卡片与已接入实现条件下使用。","sourceId":"DYNAMIC-TOOLS","id":"SUP05","x":190,"y":47208,"w":2760,"h":908,"intro":"在当前有效卡片存在时，让 Director 选择其真实按钮并交端侧操作。","paragraphs":["用户说“就选第二个”时，请求先带来实时卡片标识、标题、内容、按钮名及相关原因。这些内容来自端侧当前页面，不能用旧历史猜测卡片仍然存在。","每轮先检查 real_time_card 等条件，满足后动态加载工具，Director 才能选择真实按钮。初期条件依据请求参数判断，不能把未来 Context 或 Trigger 扩展当成已经可用的任意条件能力。","选择结果通过 select_button 交回端侧，端侧再执行对应操作。返回了按钮选择没有证明业务做成，后面仍要核页面有效性与执行结果。","卡片消失、内容已变、按钮不合法或权限不足时，不能继续执行猜测对象。具体 Agent 标识与运行接入尚需目标项目落实，动态设计存在不代表所有车型已开放。"],"sourceIds":["DYNAMIC-TOOLS"]},{"name":"inner_thought_update","label":"内心世界状态更新","category":"工程需求补充，不计40行","status":"独立工程定义；注册、生效、持久化及隐私边界需项目落实。","sourceId":"INNER-THOUGHT","id":"SUP06","x":3710,"y":47208,"w":2760,"h":908,"intro":"更新助手自身用于后续判断的内心状态变量，与用户记忆及模型训练分别管理。","paragraphs":["这项能力接收 type 和 content，类型涵盖价值观、人格特质、社会关系、近期目标、环境背景和当前情绪。输入需要明确要改变哪一种状态，不能把任意用户信息都写进助手人格。","对应实现更新 inner_thought 变量，供后续 Director 推理和跨会话连续性使用。变量更新没有重新训练底层模型，也没有替代用户基础记忆的存储与权限规则。","有效结果应能说明状态是否更新，以及后续推理是否实际使用。仅生成更新文本或调用受理，没有证明持久化和跨会话生效。","何时允许更新、冲突怎么处理、如何回退和涉及用户隐私时怎样隔离，仍需要完整实现合同。目前不能把这项工程定义当作已注册且全面开放的业务工具。"],"sourceIds":["INNER-THOUGHT"]}],"groups":[{"title":"用户请求与执行闭环","ids":["V","R","M","C","D","E","O"]},{"title":"专项执行","ids":["DR"]},{"title":"信息从哪里来","ids":["B","A","K","EV","EL"]},{"title":"持续任务与主动服务","ids":["T","G","L","S"]},{"title":"用户交互与展示","ids":["I","W","H","U"]},{"title":"配置与能力建设","ids":["F","P","SE"]}],"mainIds":["V","R","M","C","D","E","O"],"diagrams":{"V":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"930\" height=\"2778\" viewBox=\"0 0 930 2778\" role=\"img\" aria-label=\"语音输入与判停\">\u003ctitle>语音输入与判停\u003c/title>\u003cdefs>\u003cmarker id=\"arrow\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\u003cpath d=\"M0 1L8 5L0 9\" fill=\"none\" stroke=\"#52728b\" stroke-width=\"1.7\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" fill=\"#fff\"/>\u003cg font-family=\"PingFang SC,Microsoft YaHei,sans-serif\">\u003cpath d=\"M500,226 L500,462\" fill=\"none\" stroke=\"#52728b\" stroke-width=\"1.6\" marker-end=\"url(#arrow)\"/>\u003crect x=\"388\" y=\"322\" width=\"115\" height=\"44\" rx=\"3\" fill=\"#fff\"/>\u0 75\" font-weight=\"400\">\u003ctspan x=\"255\" dy=\"0\">把动作清单转成具体调用 / 按 Agent ID 找到配置 / 准\u003c/tspan>\u003ctspan x=\"255\" dy=\"24\">备该工具需要的上下文\u003c/tspan>\u003c/text>\u003c/g>\u003c/a>\u003ca href=\"#module/O\">\u003cg data-step=\"O\">\u003crect x=\"435\" y=\"2254\" width=\"390\" height=\"206\" rx=\"8\" fill=\"#f5f9fc\" stroke=\"#a9bdcd\"/>\u003crect x=\"435\" y=\"2254\" width=\"5\" height=\"206\" rx=\"2\" fill=\"#326785\"/>\u003ctext x=\"455\" y=\"2283\" font-size=\"13\" fill=\"#6b7d8b\" font-weight=\"400\">\u003ctspan x=\"455\" dy=\"0\">O\u003c/tspan>\u003c/text>\u003ctext x=\"455\" y=\"2315\" font-size=\"20\" fill=\"#203b50\" font-weight=\"600\">\u003ctspan x=\"455\" dy=\"0\">播报、展示与真实结果\u003c/tspan>\u003c/text>\u003ctext x=\"455\" y=\"2357\" font-size=\"16\" fill=\"#375b71\" font-weight=\"400\">\u003ctspan x=\"455\" dy=\"0\">用户请求与执行闭环\u003c/tspan>\u003c/text>\u003ctext x=\"455\" y=\"2396\" font-size=\"16\" fill=\"#566975\" font-weight=\"400\">\u003ctspan x=\"455\" dy=\"0\">接收本轮要表达的内容 / 选择在线、离线或缓存音频 / \u003c/tspan>\u003ctspan x=\"455\" dy=\"24\">把文字变成音频并真正播出\u003c/tspan>\u003c/text>\u003c/g>\u003c/a>\u003c/g>\u003c/svg>"},"overviewEdges":[{"from":"V","to":"R","label":"正式文字、请求身份、音区"},{"from":"R","to":"M","label":"云端放行的有效请求"},{"from":"M","to":"D","label":"当前轮输入批次"},{"from":"C","to":"D","label":"常用背景与相关上下文"},{"from":"D","to":"E","label":"工具名、参数与本轮动作"},{"from":"E","to":"M","label":"异步回流等需重新准入的工具反馈"},{"from":"E","to":"D","label":"普通 ReAct 工具结果"},{"from":"D","to":"O","label":"话术、语气与表情"},{"from":"E","to":"O","label":"卡片、端侧内容和执行结果"},{"from":"O","to":"M","label":"打断信息或后续用户输入"},{"from":"D","to":"DR","label":"需要协调导航与泊车的请求"},{"from":"DR","to":"E","label":"导航和智驾工具调用"},{"from":"DR","to":"D","label":"执行状态或待澄清信息"},{"from":"E","to":"C","label":"检索上下文来源"},{"from":"C","to":"E","label":"按需检索结果"},{"from":"B","to":"C","label":"当前状态按需进入上下文"},{"from":"A","to":"T","label":"动态任务观察结果回传"},{"from":"T","to":"A","label":"下发动态视觉任务列表"},{"from":"T","to":"G","label":"注册条件与接收触发回调"},{"from":"G","to":"T","label":"任务场景的条件命中回调"},{"from":"A","to":"E","label":"按次问图结果回工具"},{"from":"K","to":"C","label":"画像、摘要与检索记忆"},{"from":"EV","to":"EL","label":"生产并记录业务事件"},{"from":"EL","to":"C","label":"按需查询事件历史"},{"from":"EL","to":"K","label":"供记忆生成读取"},{"from":"T","to":"S","label":"任务反馈进入主动推荐"},{"from":"S","to":"M","label":"建议或主动推荐回流"},{"from":"L","to":"A","label":"端侧任务生命周期与感知调用"},{"from":"P","to":"G","label":"发布规则配置"},{"from":"G","to":"H","label":"静默通知出口"},{"from":"U","to":"T","label":"查看、删除或暂停任务"},{"from":"T","to":"U","label":"任务状态供展示"},{"from":"W","to":"R","label":"未命中页面词时回普通链路"},{"from":"I","to":"M","label":"打断与后续输入"},{"from":"O","to":"I","label":"播报期间接收插话"},{"from":"F","to":"E","label":"工具注册与执行协议"},{"from":"F","to":"D","label":"可调用能力描述"},{"from":"SE","to":"C","label":"动态示例检索结果"}],"toolScope":"不能用固定的 23、40 或 46 宣称当前车型全部在线工具数。Planner OnePage 明确通过 GetPlannerAgentList 取得在线工具集合，并把名称、描述、参数、notice 与 tips 注入模型；Agent Server 再按 agent_id 查询注册配置及执行器类型。本站原始目录混合了不同项目、补充定义和退役项，应称“资料中的工具目录”。实际某轮可调用数量要看该渠道/车型当轮注入的 tool_list。","sourceReadBoundary":"本版按核读的正式方案重建。部分主文档画板未在本轮完成浏览器回读，不代表全部飞书文档已读或所有车型已上线。"};</script><script>(() => {
 const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
 const asArray=s=>Array.isArray(s)?s:s?[s]:[];
 const paras=s=>asArray(s).map(t=>`<p>${fmt(t)}</p>`).join('');
 const pageMap=new Map(DATA.pages.map(p=>[p.id,p]));
 const sourceMap=new Map(DATA.sources.map(s=>[s.id,s]));
 const toolMap=new Map(DATA.tools.map(t=>[t.id,t]));
 const groups=DATA.groups;
 const moduleLink=id=>`<a href="#module/${id}">${esc(pageMap.get(id)?.title||id)}</a>`;
 function sources(ids){return `<details class="sources"><summary>查看本页原文</summary><ul>${[...new Set(ids)].map(id=>sourceMap.get(id)).filter(Boolean).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ul></details>`;}
 function figure(key,title){return `<figure data-figure="${key}"><figcaption><strong>${esc(title)}</strong><div><button data-zoom="out">−</button><button data-zoom="in">＋</button><button data-zoom="fit">适合宽度</button><button data-zoom="actual">原始尺寸</button><button data-enlarge="${key}">放大看图</button><button data-save="${key}">SVG</button></div></figcaption><div class="canvas">${DATA.diagrams[key]||''}</div></figure>`;}
 function nav(id){$('#nav').innerHTML=`<a class="nav-home" href="#home">从语音到真实结果</a><a class="nav-home" href="#map">完整业务关系图</a>${groups.map(g=>`<h2>${esc(g.title)}</h2>${g.ids.map(i=>`<a href="#module/${i}" ${i===id?'aria-current="page"':''}><small>${i}</small>${esc(pageMap.get(i)?.title||i)}</a>`).join('')}`).join('')}<a class="nav-home" href="#tools">工具目录与内部机制</a>`;}
 function modulePage(id,stepId){const p=pageMap.get(id);if(!p)return home();nav(id);
 $('#content').innerHTML=`<header><p class="eyebrow">${id} · ${esc(p.category||'业务模块')}</p><h1>${esc(p.title)}</h1>${paras(p.intro)}<details class="scope"><summary>适用项目与版本</summary><p>${esc(p.scope)}</p></details></header><nav class="in-page"><a href="#module/${id}/section/flow">流程图</a><a href="#module/${id}/section/explain">沿图讲解</a>${p.branches.length?`<a href="#module/${id}/section/branches">条件与异常</a>`:''}</nav><section id="flow">${figure(id,p.title+' · 业务交接')}</section><section id="explain"><h2>沿着箭头，把这件事讲清楚</h2>${p.steps.map((s,i)=>`<article class="step" id="step-${s.id}"><div class="step-heading"><span>${esc(s.id)}</span><h3>${esc(s.title)}</h3></div><p class="actor">${esc(s.actor)}</p>${paras(s.detail)}<p class="output"><b>交出的结果：</b>${fmt(s.output)}</p>${p.edges.filter(e=>e.from===s.id).length?`<div class="handoffs">${p.edges.filter(e=>e.from===s.id).map(e=>`<p>${fmt(e.label)} <span aria-hidden="true">→</span> <a href="#module/${id}/step/${e.to}">${esc(e.to)} ${esc(p.steps.find(n=>n.id===e.to)?.title)}</a></p>`).join('')}</div>`:`<p class="next">${fmt(s.next||'本分支结束。')}</p>`}</article>`).join('')}</section>${p.branches.length?`<section id="branches"><h2>这些情况会改变后续处理</h2>${p.branches.map(b=>`<article class="branch"><h3>${esc(b.condition)}</h3>${paras(b.result)}${b.from?`<a href="#module/${id}/step/${b.from}">回到 ${esc(b.from)}</a>`:''}</article>`).join('')}</section>`:''}<section class="connections"><h2>接回整条链路</h2>${DATA.overviewEdges.filter(e=>e.from===id||e.to===id).map(e=>`<p>${moduleLink(e.from)} <span>— ${fmt(e.label)} →</span> ${moduleLink(e.to)}</p>`).join('')||'<p>此页说明支撑机制；它不构成每次用户请求都必经的一步。</p>'}</section>${sources([...p.sourceIds,...p.steps.flatMap(s=>s.sourceIds||[])])}`;
 if(stepId)requestAnimationFrame(()=>document.getElementById('step-'+stepId)?.scrollIntoView({block:'start'}));
 }
 function home(){nav();$('#content').innerHTML=`<header><p class="eyebrow">豆包汽车 · 业务链路</p><h1>一句话怎样变成真实结果</h1><p>从声音进入系统开始，先看语音与端云入口，再看输入管理怎样把事实交给 Planner；最后沿工具反馈追到下一轮决定和用户实际得到的结果。左侧按职责分组，感知、持续任务和配置管理分别在它们参与的位置接入主链。</p></header>${figure('main','请求、决策、工具与结果的闭环')}<section><h2>顺着这一次请求往下走</h2>${DATA.mainIds.map(id=>{const p=pageMap.get(id);return `<article class="home-step"><h3>${moduleLink(id)}</h3>${paras(p.intro)}<a href="#module/${id}">进入 ${esc(p.title)} 的完整流程 →</a></article>`;}).join('')}</section><section><h2>主链以外，谁在提供信息和接续任务</h2>${groups.slice(1).map(g=>`<article class="directory"><h3>${esc(g.title)}</h3>${g.ids.map(id=>`<p>${moduleLink(id)}<span> · ${esc(pageMap.get(id).steps[0]?.title||'')}</span></p>`).join('')}</article>`).join('')}</section>`;}
 function map(){nav();$('#content').innerHTML=`<header><h1>完整业务关系图</h1><p>箭头上写明信息或动作的交接。点模块进入该模块的详细节点和条件分支。规划、配置与运行链路分组阅读；某个模块出现在图中，不表示每次请求都要经过它。</p></header>${figure('overview','模块怎样接在一起')}<section><h2>各模块完整流程</h2>${groups.map(g=>`<article class="directory"><h3>${esc(g.title)}</h3>${g.ids.map(id=>`<p>${moduleLink(id)}</p>`).join('')}</article>`).join('')}</section>`;}
 function tools(id){nav();const t=toolMap.get(id);if(t){$('#content').innerHTML=`<header><p class="eyebrow">工具内部机制</p><h1>${esc(t.label||t.name)}</h1><code>${esc(t.name)}</code>${paras(t.intro)}<p class="scope">${esc(t.status)}</p></header><section>${paras(t.paragraphs)}</section><section><h2>调用前后怎样衔接</h2><p>${moduleLink('D')} 根据当前目标选择调用；${moduleLink('E')} 处理下发与反馈。工具返回后，下一步要根据返回内容决定。</p></section>${sources(t.sourceIds||[])}<a href="#tools">返回工具目录</a>`;return;}
 $('#content').innerHTML=`<header><h1>工具目录与内部机制</h1><p>${esc(DATA.toolScope)}</p></header>${[...new Set(DATA.tools.map(t=>t.category||'专项能力'))].map(c=>`<section><h2>${esc(c)}</h2>${DATA.tools.filter(t=>(t.category||'专项能力')===c).map(t=>`<article class="tool"><h3><a href="#tool/${t.id}">${esc(t.label||t.name)}</a></h3><code>${esc(t.name)}</code><p>${esc(t.status)}</p></article>`).join('')}</section>`).join('')}`;}
 function search(q){nav();const term=q.toLowerCase();const results=[];for(const p of DATA.pages){for(const s of p.steps){if(JSON.stringify(s).toLowerCase().includes(term))results.push({title:p.title+' · '+s.title,text:s.detail,href:'#module/'+p.id+'/step/'+s.id});}}for(const t of DATA.tools){if(JSON.stringify(t).toLowerCase().includes(term))results.push({title:t.label||t.name,text:t.intro,href:'#tool/'+t.id});}$('#content').innerHTML=`<header><h1>查找业务步骤</h1><p>“${esc(q)}” · ${results.length} 项</p></header>${results.map(r=>`<article class="search-result"><h2><a href="${r.href}">${esc(r.title)}</a></h2>${paras(r.text)}</article>`).join('')}`;}
 function render(){const h=decodeURIComponent(location.hash.slice(1)||'home').split('/');if(h[0]==='module'){modulePage(h[1],h[2]==='step'?h[3]:null);if(h[2]==='section')requestAnimationFrame(()=>document.getElementById(h[3])?.scrollIntoView());}else if(h[0]==='map')map();else if(['tool','tools'].includes(h[0]))tools(h[1]);else if(h[0]==='search')search(h.slice(1).join('/'));else if(h[0]==='node'){const p=DATA.pages.find(p=>p.steps.some(s=>s.id===h[1]));if(p)modulePage(p.id,h[1]);else home();}else home();
 document.title=(pageMap.get(h[1])?.title||'业务链路')+' · 豆包汽车';$('#sidebar').classList.remove('open');if(!h[2])window.scrollTo(0,0);document.querySelectorAll('.canvas svg').forEach(svg=>{const w=+svg.getAttribute('viewBox').split(' ')[2];svg.style.width=Math.min(w,Math.max(svg.parentElement.clientWidth,w*0.85))+'px';});}
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.zoom){const f=b.closest('figure')||$('#dialog'),svg=f.querySelector('svg');if(!svg)return;const w=parseFloat(svg.style.width)||+svg.getAttribute('width');svg.style.width=(b.dataset.zoom==='fit'?f.querySelector('.canvas').clientWidth:b.dataset.zoom==='actual'?+svg.getAttribute('viewBox').split(' ')[2]:Math.max(350,w*(b.dataset.zoom==='in'?1.2:1/1.2)))+'px';}if(b.dataset.save){const url=URL.createObjectURL(new Blob([DATA.diagrams[b.dataset.save]],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='豆包汽车-'+b.dataset.save+'-'+DATA.version+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}if(b.dataset.enlarge){$('#dialog .canvas').innerHTML=DATA.diagrams[b.dataset.enlarge];$('#dialog').showModal();$('#dialog svg').style.width=Math.max(900,$('#dialog .canvas').clientWidth)+'px';}if(b.id==='close')$('#dialog').close();if(b.id==='menu')$('#sidebar').classList.toggle('open');});
 $('#search').addEventListener('submit',e=>{e.preventDefault();const q=$('#query').value.trim();if(q)location.hash='search/'+encodeURIComponent(q);});
 window.addEventListener('hashchange',render);render();
})();
</script></body></html>
