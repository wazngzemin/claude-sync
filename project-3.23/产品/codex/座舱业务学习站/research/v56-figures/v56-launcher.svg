<svg xmlns="http://www.w3.org/2000/svg" id="v56-launcher" class="flow-figure v56-diagram" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="v56-launcher-title v56-launcher-desc">
<title id="v56-launcher-title">点击怎样交办：VUI 三类卡片走不同路线</title>
<desc id="v56-launcher-desc">先辨认卡片类型，再看约定交给谁；这些 VUI 规则不能直接套到所有 Launcher 入口。</desc>
<style>
.v56-diagram{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff);color:var(--body,#33495b)}
.v56-diagram text{font-size:14px;font-weight:400;fill:var(--body,#33495b)}
.v56-diagram .figure-header .title{font-size:24px;font-weight:650;fill:var(--ink,#16344a)}
.v56-diagram .figure-header .subtitle,.v56-diagram .figure-caption text,.v56-diagram .note{fill:var(--muted,#5d7183)}
.v56-diagram .node-title{font-size:16px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .section-label{font-size:15px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .box{stroke-width:1.6}
.v56-diagram .neutral .box,.v56-diagram .neutral .swatch{fill:var(--v56-bg,#fff);stroke:var(--quiet,#9fb2c2)}
.v56-diagram .info .box,.v56-diagram .info .swatch{fill:var(--blue-soft,#eaf2fb);stroke:var(--blue,#4f7ea9)}
.v56-diagram .action .box,.v56-diagram .action .swatch{fill:var(--teal-soft,#eaf6ef);stroke:var(--teal,#4a9670)}
.v56-diagram .warning .box,.v56-diagram .warning .swatch{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-diagram .error .box,.v56-diagram .error .swatch{fill:var(--red-soft,#fdeeee);stroke:var(--red,#c45c5c)}
.v56-diagram .info .node-title{fill:var(--blue,#1f4565)}
.v56-diagram .action .node-title{fill:var(--teal,#1d4b35)}
.v56-diagram .warning .node-title{fill:var(--amber,#865b1a)}
.v56-diagram .error .node-title{fill:var(--red,#6e2222)}
.v56-diagram .pending .box{stroke-dasharray:6 5}
.v56-diagram .arr{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.v56-diagram .arr-error{stroke:var(--red,#c45c5c)}
.v56-diagram .arrow-head{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8}
.v56-diagram .arrow-head-error{stroke:var(--red,#c45c5c)}
.v56-diagram .rule{stroke:var(--line,#dce4eb);stroke-width:1;fill:none}
@media(prefers-color-scheme:dark){svg.v56-diagram{--v56-bg:#17212d;--ink:#e4edf6;--body:#d0dde9;--muted:#b4c4d3;--quiet:#8a9ead;--line:#3b5062;--blue:#a4caff;--blue-soft:#213c59;--teal:#99dbc5;--teal-soft:#203f3b;--amber:#f1cf91;--amber-soft:#443822;--red:#f2b0b7;--red-soft:#4b2e36}}
</style>
<defs><marker id="v56-launcher-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head" d="M1 1L9 5L1 9"/></marker><marker id="v56-launcher-arr-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head arrow-head-error" d="M1 1L9 5L1 9"/></marker></defs>
<g class="figure-header"><text class="title" x="32" y="44">点击怎样交办：VUI 三类卡片走不同路线</text><text class="subtitle" x="32" y="72">先辨认卡片类型，再看约定交给谁；这些 VUI 规则不能直接套到所有 Launcher 入口。</text></g>
<path class="arr" d="M480,200 L480,244 L192,244 L192,284" fill="none" marker-end="url(#v56-launcher-arr)"/>
<path class="arr" d="M600,200 L600,284" fill="none" marker-end="url(#v56-launcher-arr)"/>
<path class="arr" d="M720,200 L720,244 L1008,244 L1008,284" fill="none" marker-end="url(#v56-launcher-arr)"/>
<path class="arr" d="M192,370 L192,429" fill="none" marker-end="url(#v56-launcher-arr)"/>
<path class="arr" d="M600,370 L600,429" fill="none" marker-end="url(#v56-launcher-arr)"/>
<path class="arr" d="M1008,370 L1008,429" fill="none" marker-end="url(#v56-launcher-arr)"/>
<g class="neutral" data-node="click"><rect class="box" x="410" y="120" width="380" height="80" rx="8"/><text class="node-title" x="424" y="147" text-anchor="start">一次卡片点击</text><text class="node-subtitle" x="424" y="172" text-anchor="start">按入口协议交办</text></g>
<g class="info" data-node="planner"><rect class="box" x="32" y="290" width="320" height="80" rx="8"/><text class="node-title" x="46" y="317" text-anchor="start">Planner 卡片</text><text class="node-subtitle" x="46" y="342" text-anchor="start">VUI 约定的卡片类型</text></g>
<g class="info" data-node="suggestion"><rect class="box" x="440" y="290" width="320" height="80" rx="8"/><text class="node-title" x="454" y="317" text-anchor="start">静态建议卡</text><text class="node-subtitle" x="454" y="342" text-anchor="start">VUI 约定的卡片类型</text></g>
<g class="info" data-node="notification"><rect class="box" x="848" y="290" width="320" height="80" rx="8"/><text class="node-title" x="862" y="317" text-anchor="start">系统通知卡</text><text class="node-subtitle" x="862" y="342" text-anchor="start">VUI 约定的卡片类型</text></g>
<g class="action" data-node="direct"><rect class="box" x="32" y="435" width="320" height="80" rx="8"/><text class="node-title" x="46" y="462" text-anchor="start">手动点击直接执行</text><text class="node-subtitle" x="46" y="487" text-anchor="start">不必统一绕经 Planner</text></g>
<g class="action" data-node="query"><rect class="box" x="440" y="435" width="320" height="80" rx="8"/><text class="node-title" x="454" y="462" text-anchor="start">模拟用户请求</text><text class="node-subtitle" x="454" y="487" text-anchor="start">送到云端继续处理</text></g>
<g class="action" data-node="event"><rect class="box" x="848" y="435" width="320" height="80" rx="8"/><text class="node-title" x="862" y="462" text-anchor="start">执行结果上报</text><text class="node-subtitle" x="862" y="487" text-anchor="start">通过事件上报云端</text></g>
<g class="warning pending" data-node="scope"><rect class="box" x="32" y="575" width="1136" height="80" rx="8"/><text class="node-title" x="46" y="602" text-anchor="start">Launcher</text><text class="node-subtitle" x="46" y="627" text-anchor="start">是否已接好，逐入口核对</text></g>
<g class="figure-caption"><path class="rule" d="M32,696 L1168,696"/>
<g class="neutral"><circle class="swatch" cx="39" cy="717" r="7"/></g>
<text class="node-subtitle" x="62" y="722" text-anchor="start">点击选择</text>
<g class="info"><circle class="swatch" cx="214" cy="717" r="7"/></g>
<text class="node-subtitle" x="237" y="722" text-anchor="start">卡片类型</text>
<g class="action"><circle class="swatch" cx="389" cy="717" r="7"/></g>
<text class="node-subtitle" x="412" y="722" text-anchor="start">约定处理路线</text>
<g class="warning"><circle class="swatch" cx="564" cy="717" r="7"/></g>
<text class="node-subtitle" x="587" y="722" text-anchor="start">适用范围</text>
<path class="arr" d="M732,717 L756,717" stroke-dasharray="6 5"/>
<text class="node-subtitle" x="762" y="722" text-anchor="start">待核对</text>
</g>
</svg>
