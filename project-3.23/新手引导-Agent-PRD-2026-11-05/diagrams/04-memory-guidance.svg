<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1604" viewBox="0 0 1660 1604">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1604" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">记忆能力引导</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">介绍功能不要求先读取历史记忆；实际操作由 DT 执行</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户表达个人信息或偏好</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">区分当前用户信息与转述内容</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">例如：我平时比较喜欢吃川菜</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">语义模型是否匹配记忆相关场景？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">依据配置描述与示例判断相关性</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不要求检索旧记忆</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">无关／无法判断</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">原对话继续</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不增加引导</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">相关</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器检查真实状态及次数</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">适用条件满足、次数尚未耗尽</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">检索为空不等于首次使用</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">不满足／未知</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不下发建议</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不计处理成功</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">满足</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">建议到达 DT：是否仍需能力介绍？</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">DT 识别明确功能请求并避免重复介绍</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">例如：记住我喜欢吃川菜，应正常执行</text><line x1="1020" y1="862.0" x2="1186" y2="862.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="849.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">无需介绍</text><rect x="1190" y="794" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="834" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">DT 只执行原请求</text><text x="1218" y="872" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不采用本条引导建议</text><text x="1218" y="903" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不回传引导处理成功</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="970.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">需要介绍</text><rect x="100" y="997" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 处理引导建议并回传</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">触发器按对应反馈计次</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">DT 结合当前话题介绍能力并承接选择</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1200" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户愿意使用时由 DT 调用工具</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">遵循记忆功能既有身份和授权要求</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">工具返回成功才说明已经记住</text><line x1="560.0" y1="1338" x2="560.0" y2="1399" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1403" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1443" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">分别记录处理、触达和功能结果</text><text x="128" y="1481" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">当轮拒绝则停止操作，失败则如实回应</text><text x="128" y="1512" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不由触发器读取或写入记忆正文</text>
</svg>