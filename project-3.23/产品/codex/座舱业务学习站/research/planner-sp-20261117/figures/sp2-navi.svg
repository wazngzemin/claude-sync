<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="sp2-navi" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="sp2-navi-title sp2-navi-desc">
<title id="sp2-navi-title">一句导航相关的话，交给谁</title><desc id="sp2-navi-desc">这一版先按诉求选工具；涉及智驾时整段交给智驾，导航域内同一轮只发一个工具。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="sp2-navi-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一句导航相关的话，交给谁</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">这一版先按诉求选工具；涉及智驾时整段交给智驾，导航域内同一轮只发一个工具。</text>
<text class="v56-label" x="40" y="122" text-anchor="start">用户怎么说</text>
<text class="v56-label" x="610" y="122" text-anchor="start">交给哪个工具 · 为什么</text>
<text class="v56-node-title" x="40" y="204" text-anchor="start">“导航去公司” / “少收费”</text>
<path class="v56-arrow" d="M 516 200 L 610 200" marker-end="url(#sp2-navi-arr)"/>
<g data-node="true" id="sp2-navi-tool-0"><rect class="v56-cloud" x="610" y="146" width="558" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="624" y="174" text-anchor="start">路线规划</text>
<text class="v56-node-sub" x="624" y="202" text-anchor="start">目的地、途经点、固定路线偏好</text>
<text class="v56-node-sub" x="624" y="226" text-anchor="start">选路线后自动导航</text>
</g>
<text class="v56-node-title" x="40" y="328" text-anchor="start">“别走中环”</text>
<path class="v56-arrow" d="M 516 324 L 610 324" marker-end="url(#sp2-navi-arr)"/>
<g data-node="true" id="sp2-navi-tool-1"><rect class="v56-cloud" x="610" y="270" width="558" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="624" y="298" text-anchor="start">高德复杂规划</text>
<text class="v56-node-sub" x="624" y="326" text-anchor="start">指定走或避开某条具体道路</text>
<text class="v56-node-sub" x="624" y="350" text-anchor="start">也处理“沿河”“风景好”等路线风格</text>
</g>
<text class="v56-node-title" x="40" y="452" text-anchor="start">“地图放大”</text>
<path class="v56-arrow" d="M 516 448 L 610 448" marker-end="url(#sp2-navi-arr)"/>
<g data-node="true" id="sp2-navi-tool-2"><rect class="v56-cloud" x="610" y="394" width="558" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="624" y="422" text-anchor="start">导航基础控制</text>
<text class="v56-node-sub" x="624" y="450" text-anchor="start">地图显示、视角、播报</text>
<text class="v56-node-sub" x="624" y="474" text-anchor="start">收藏、家与公司地址、导航设置</text>
</g>
<text class="v56-node-title" x="40" y="576" text-anchor="start">“前面堵多少”</text>
<path class="v56-arrow" d="M 516 572 L 610 572" marker-end="url(#sp2-navi-arr)"/>
<g data-node="true" id="sp2-navi-tool-3"><rect class="v56-cloud" x="610" y="518" width="558" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="624" y="546" text-anchor="start">高德导航交互</text>
<text class="v56-node-sub" x="624" y="574" text-anchor="start">导航中的路况与路线原因问询</text>
<text class="v56-node-sub" x="624" y="598" text-anchor="start">也承接导航中的路线动作</text>
</g>
<text class="v56-node-title" x="40" y="700" text-anchor="start">“沿途找花店”</text>
<path class="v56-arrow" d="M 516 696 L 610 696" marker-end="url(#sp2-navi-arr)"/>
<g data-node="true" id="sp2-navi-tool-4"><rect class="v56-cloud" x="610" y="642" width="558" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="624" y="670" text-anchor="start">地点搜索</text>
<text class="v56-node-sub" x="624" y="698" text-anchor="start">沿途搜必须已经在导航</text>
<text class="v56-node-sub" x="624" y="722" text-anchor="start">多个结果先让用户选，再导航</text>
</g>
<text class="v56-node-title" x="40" y="824" text-anchor="start">“智驾去公司，经幼儿园接人”</text>
<path class="v56-arrow" d="M 516 820 L 610 820" marker-end="url(#sp2-navi-arr)"/>
<g data-node="true" id="sp2-navi-tool-5"><rect class="v56-cloud" x="610" y="766" width="558" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="624" y="794" text-anchor="start">智驾</text>
<text class="v56-node-sub" x="624" y="822" text-anchor="start">涉及智驾：目的地、途经动作整段交入</text>
<text class="v56-node-sub" x="624" y="846" text-anchor="start">不拆给纯导航工具</text>
</g>
<g data-node="true" id="sp2-navi-unify"><rect class="v56-decision v56-pending" x="40" y="920" width="1128" height="108" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="948" text-anchor="start">三处归属需统一</text>
<text class="v56-node-sub" x="54" y="976" text-anchor="start">开始 / 结束导航；路口转向；模糊目的地</text>
<text class="v56-node-sub" x="54" y="1000" text-anchor="start">先统一规则与示例，再固定工具选择</text>
</g>
<text class="v56-risk" x="40" y="1068" text-anchor="start">这几个工具同一轮只能发一个，必须串行。</text>
<path class="v56-rule" d="M 32 1086 L 1168 1086"/>
<text class="v56-node-title" x="32" y="1122" text-anchor="start">先分清诉求，再看是否满足工具的前提条件。</text>
<rect data-decoration="true" class="v56-cloud" x="32.0" y="1150" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1164" text-anchor="start">绿：已写明的工具分工</text>
<rect data-decoration="true" class="v56-decision" x="410.6666666666667" y="1150" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="1164" text-anchor="start">黄 + 虚线：归属需统一</text>
<rect data-decoration="true" class="v56-reject" x="789.3333333333334" y="1150" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="1164" text-anchor="start">红字：同轮串行约束</text>
</svg>
