  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">流程一：一条事实怎样变成可用记忆</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,220 350,286" marker-end="url(#arrow-K-produce)"><title>kp1 → kp2：进入记忆链路前</title></polyline><polyline class="arr" fill="none" points="350,412 350,478" marker-end="url(#arrow-K-produce)"><title>kp2 → kp3：允许记录</title></polyline><polyline class="arr" fill="none" points="176,340 50,340 50,1862 170,1862" marker-end="url(#arrow-K-produce)"><title>kp2 → kp10：不允许</title></polyline><polyline class="arr" fill="none" points="350,602 350,668" marker-end="url(#arrow-K-produce)"><title>kp3 → kp4：普通素材</title></polyline><polyline class="arr" fill="none" points="176,364 70,364 70,934 170,934" marker-end="url(#arrow-K-produce)"><title>kp2 → kp5：用户明确要求保存且允许</title></polyline><polyline class="arr" fill="none" points="176,722 80,722 80,1124 170,1124" marker-end="url(#arrow-K-produce)"><title>kp4 → kp6：触发批处理</title></polyline><polyline class="arr" fill="none" points="350,982 350,1048" marker-end="url(#arrow-K-produce)"><title>kp5 → kp6：即时提交，不等于同步完成</title></polyline><polyline class="arr" fill="none" points="350,1172 350,1238" marker-end="url(#arrow-K-produce)"><title>kp6 → kp7：任务运行</title></polyline><polyline class="arr" fill="none" points="350,1362 350,1428" marker-end="url(#arrow-K-produce)"><title>kp7 → kp8：生成成功</title></polyline><polyline class="arr" fill="none" points="350,1552 350,1618" marker-end="url(#arrow-K-produce)"><title>kp8 → kp9：相应产物可查询</title></polyline><polyline class="arr" fill="none" points="176,1292 130,1292 130,1886 170,1886" marker-end="url(#arrow-K-produce)"><title>kp7 → kp10：失败/无有效内容</title></polyline><text class="ts" x="365" y="256" text-anchor="start" dominant-baseline="central">E1 · 进入记忆链路前</text><text class="ts" x="365" y="448" text-anchor="start" dominant-baseline="central">E2 · 允许记录</text><text class="ts" x="168" y="332" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="168" y="1874" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="365" y="638" text-anchor="start" dominant-baseline="central">E4 · 普通素材</text><text class="ts" x="168" y="356" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="168" y="946" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="168" y="714" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="168" y="1136" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="365" y="1018" text-anchor="start" dominant-baseline="central">E7 · 即时提交，不等于同步完成</text><text class="ts" x="365" y="1208" text-anchor="start" dominant-baseline="central">E8 · 任务运行</text><text class="ts" x="365" y="1398" text-anchor="start" dominant-baseline="central">E9 · 生成成功</text><text class="ts" x="365" y="1588" text-anchor="start" dominant-baseline="central">E10 · 相应产物可查询</text><text class="ts" x="168" y="1284" text-anchor="end" dominant-baseline="central">E11</text><text class="ts" x="168" y="1898" text-anchor="end" dominant-baseline="central">E11</text><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp1" aria-label="收到允许记录的素材"><title>人车对话或业务事件；携带车辆、账号、时间和在场人</title><rect x="180" y="106" width="340" height="110" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">收到允许记录的素材</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">人车对话或业务事件</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central">携带车辆、账号、时间和在场人</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp2" aria-label="确认权限与归属"><title>检查可信身份、记忆授权与开关；未知身份不借用别人私人数据</title><rect x="180" y="296" width="340" height="112" rx="6"/><text class="th" x="198" y="320" text-anchor="start" dominant-baseline="central">确认权限与归属</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">检查可信身份、记忆授权与开关</text><text class="ts" x="198" y="367" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central">未知身份不借用别人私人数据</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp3" aria-label="记录原始事实"><title>保留谁说/做了什么与发生时间；不把指令受理改写为执行成功</title><rect x="180" y="488" width="340" height="110" rx="6"/><text class="th" x="198" y="512" text-anchor="start" dominant-baseline="central">记录原始事实</text><text class="ts" x="198" y="540" text-anchor="start" dominant-baseline="central">保留谁说/做了什么与发生时间</text><text class="ts" x="198" y="559" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="578" text-anchor="start" dominant-baseline="central">不把指令受理改写为执行成功</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp4" aria-label="周期性提取任务"><title>短期情景按事件数或时间聚合；长期情景/语义另有日级任务</title><rect x="180" y="678" width="340" height="110" rx="6"/><text class="th" x="198" y="702" text-anchor="start" dominant-baseline="central">周期性提取任务</text><text class="ts" x="198" y="730" text-anchor="start" dominant-baseline="central">短期情景按事件数或时间聚合</text><text class="ts" x="198" y="749" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="768" text-anchor="start" dominant-baseline="central">长期情景/语义另有日级任务</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp5" aria-label="明确要求记住"><title>Director 判断为记忆操作；调用本项目实际配置的工具</title><rect x="180" y="868" width="340" height="110" rx="6"/><text class="th" x="198" y="892" text-anchor="start" dominant-baseline="central">明确要求记住</text><text class="ts" x="198" y="920" text-anchor="start" dominant-baseline="central">Director 判断为记忆操作</text><text class="ts" x="198" y="939" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="958" text-anchor="start" dominant-baseline="central">调用本项目实际配置的工具</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp6" aria-label="异步任务被受理"><title>pend 只表示尚未生成；受理不能证明内容正确</title><rect x="180" y="1058" width="340" height="110" rx="6"/><text class="th" x="198" y="1082" text-anchor="start" dominant-baseline="central">异步任务被受理</text><text class="ts" x="198" y="1110" text-anchor="start" dominant-baseline="central">pend 只表示尚未生成</text><text class="ts" x="198" y="1129" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1148" text-anchor="start" dominant-baseline="central">受理不能证明内容正确</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp7" aria-label="生成与更新记忆"><title>按类型提取、合并、保留限定条件；不把临时行为当永久偏好</title><rect x="180" y="1248" width="340" height="110" rx="6"/><text class="th" x="198" y="1272" text-anchor="start" dominant-baseline="central">生成与更新记忆</text><text class="ts" x="198" y="1300" text-anchor="start" dominant-baseline="central">按类型提取、合并、保留限定条件</text><text class="ts" x="198" y="1319" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1338" text-anchor="start" dominant-baseline="central">不把临时行为当永久偏好</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp8" aria-label="生成标签/得分/画像"><title>不同类型走适用的衍生处理；已实现与规划项分开</title><rect x="180" y="1438" width="340" height="110" rx="6"/><text class="th" x="198" y="1462" text-anchor="start" dominant-baseline="central">生成标签/得分/画像</text><text class="ts" x="198" y="1490" text-anchor="start" dominant-baseline="central">不同类型走适用的衍生处理</text><text class="ts" x="198" y="1509" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1528" text-anchor="start" dominant-baseline="central">已实现与规划项分开</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp9" aria-label="查询验证可用"><title>核对生成结果与正确人员范围；下一轮召回成功仍需 Director 合理采用</title><rect x="180" y="1628" width="340" height="110" rx="6"/><text class="th" x="198" y="1652" text-anchor="start" dominant-baseline="central">查询验证可用</text><text class="ts" x="198" y="1680" text-anchor="start" dominant-baseline="central">核对生成结果与正确人员范围</text><text class="ts" x="198" y="1699" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1718" text-anchor="start" dominant-baseline="central">下一轮召回成功仍需 Director 合理采用</text></g><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-produce" data-step="kp10" aria-label="未授权或生成失败"><title>不宣称已永久记住；明确授权/重试/稍后可用的实际状态</title><rect x="180" y="1818" width="340" height="112" rx="6"/><text class="th" x="198" y="1842" text-anchor="start" dominant-baseline="central">未授权或生成失败</text><text class="ts" x="198" y="1870" text-anchor="start" dominant-baseline="central">不宣称已永久记住</text><text class="ts" x="198" y="1889" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1908" text-anchor="start" dominant-baseline="central">明确授权/重试/稍后可用的实际状态</text></g><text class="th" x="40" y="2014" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="2044" text-anchor="start" dominant-baseline="central">E1 收到允许记录的素材 → 确认权限与归属：进入记忆链路前</text><text class="ts" x="40" y="2077" text-anchor="start" dominant-baseline="central">E2 确认权限与归属 → 记录原始事实：允许记录</text><text class="ts" x="40" y="2110" text-anchor="start" dominant-baseline="central">E3 确认权限与归属 → 未授权或生成失败：不允许</text><text class="ts" x="40" y="2143" text-anchor="start" dominant-baseline="central">E4 记录原始事实 → 周期性提取任务：普通素材</text><text class="ts" x="40" y="2176" text-anchor="start" dominant-baseline="central">E5 确认权限与归属 → 明确要求记住：用户明确要求保存且允许</text><text class="ts" x="40" y="2209" text-anchor="start" dominant-baseline="central">E6 周期性提取任务 → 异步任务被受理：触发批处理</text><text class="ts" x="40" y="2242" text-anchor="start" dominant-baseline="central">E7 明确要求记住 → 异步任务被受理：即时提交，不等于同步完成</text><text class="ts" x="40" y="2275" text-anchor="start" dominant-baseline="central">E8 异步任务被受理 → 生成与更新记忆：任务运行</text><text class="ts" x="40" y="2308" text-anchor="start" dominant-baseline="central">E9 生成与更新记忆 → 生成标签/得分/画像：生成成功</text><text class="ts" x="40" y="2341" text-anchor="start" dominant-baseline="central">E10 生成标签/得分/画像 → 查询验证可用：相应产物可查询</text><text class="ts" x="40" y="2374" text-anchor="start" dominant-baseline="central">E11 生成与更新记忆 → 未授权或生成失败：失败/无有效内容</text></svg>