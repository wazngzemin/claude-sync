<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="c-overview" width="1240" height="1360" viewBox="0 0 1240 1360" role="img" aria-labelledby="c-overview-title c-overview-desc"><title id="c-overview-title">Planner 每想一次之前：上下文服务要做的 8 步</title><desc id="c-overview-desc">左边持续上报，中间取相关背景，右边推理与行动；本轮结束后由 Planner 服务写回。</desc><style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style><defs><marker id="c-overview-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs><text class="v56-title" x="32" y="44" text-anchor="start">Planner 每想一次之前：上下文服务要做的 8 步</text><text class="v56-subtitle" x="32" y="72" text-anchor="start">左边持续上报，中间取相关背景，右边推理与行动；本轮结束后由 Planner 服务写回。</text><text class="v56-label" x="32" y="116" text-anchor="start">车上：持续上报</text><text class="v56-label" x="345" y="116" text-anchor="start">上下文服务：推理前取背景</text><text class="v56-label" x="925" y="116" text-anchor="start">Planner：推理与行动</text><g data-node="true"><rect class="v56-local" x="32" y="270" width="245" height="552" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="46" y="297" text-anchor="start">车上持续上报的内容</text><text class="v56-node-sub" x="46" y="322" text-anchor="start">刚发生的事</text><text class="v56-node-sub" x="46" y="343" text-anchor="start">手动调空调、上下车等</text><text class="v56-node-sub" x="46" y="364" text-anchor="start"></text><text class="v56-node-sub" x="46" y="385" text-anchor="start">车况</text><text class="v56-node-sub" x="46" y="406" text-anchor="start">空调、车窗、导航、音乐</text><text class="v56-node-sub" x="46" y="427" text-anchor="start">等设备的最新值</text><text class="v56-node-sub" x="46" y="448" text-anchor="start"></text><text class="v56-node-sub" x="46" y="469" text-anchor="start">车内情景</text><text class="v56-node-sub" x="46" y="490" text-anchor="start">车上视觉模型的描述</text><text class="v56-node-sub" x="46" y="511" text-anchor="start">赛力斯带描述；</text><text class="v56-node-sub" x="46" y="532" text-anchor="start">上汽只写坐着谁</text><text class="v56-node-sub" x="46" y="553" text-anchor="start"></text><text class="v56-node-sub" x="46" y="574" text-anchor="start">谁坐在哪</text><text class="v56-node-sub" x="46" y="595" text-anchor="start">人脸识别的乘客列表</text></g><g data-node="true"><rect class="v56-cloud" x="345" y="150" width="525" height="100" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="359" y="177" text-anchor="start">1 接住这一轮输入</text><text class="v56-node-sub" x="359" y="202" text-anchor="start">M 章输入管理交来：说的话、谁说的、</text><text class="v56-node-sub" x="359" y="223" text-anchor="start">坐哪、几点说的、离上一句多久</text></g><g data-node="true"><rect class="v56-cloud" x="345" y="290" width="525" height="100" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="359" y="317" text-anchor="start">2 取历史输入</text><text class="v56-node-sub" x="359" y="342" text-anchor="start">30 分钟内最近 5 轮有效人机对话和工具结果</text><text class="v56-node-sub" x="359" y="363" text-anchor="start">被拒识的话、触发风控的轮次剔除</text></g><g data-node="true"><rect class="v56-cloud" x="345" y="430" width="525" height="100" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="359" y="457" text-anchor="start">3 带上对话摘要</text><text class="v56-node-sub" x="359" y="482" text-anchor="start">从第 3 轮起把本次用车更早的对话滚动压缩</text></g><g data-node="true"><rect class="v56-cloud" x="345" y="570" width="525" height="100" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="359" y="597" text-anchor="start">4 取“现在”的事实</text><text class="v56-node-sub" x="359" y="622" text-anchor="start">常用车况固定带，其余由云端筛选模型挑</text><text class="v56-node-sub" x="359" y="643" text-anchor="start">天气、日期、位置；乘客列表以人脸结果为准</text></g><g data-node="true"><rect class="v56-cloud" x="345" y="710" width="525" height="100" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="359" y="737" text-anchor="start">5 取“长期”的事实</text><text class="v56-node-sub" x="359" y="762" text-anchor="start">车上坐着的人的画像固定带</text><text class="v56-node-sub" x="359" y="783" text-anchor="start">按这句话推出标签，召回相关记忆</text></g><g data-node="true"><rect class="v56-cloud" x="345" y="850" width="525" height="100" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="359" y="877" text-anchor="start">6 取“知识”</text><text class="v56-node-sub" x="359" y="902" text-anchor="start">车书问答、动态示例、场景知识</text><text class="v56-node-sub" x="359" y="923" text-anchor="start">按这一轮的问题取相关内容</text></g><path data-role="research-annotation" class="v56-cloud v56-pending" d="M 354 496 H 860 V 522 H 354 Z" fill="none"/><text class="v56-node-sub" x="360" y="514" text-anchor="start">正在开发：有新乘客上车时清掉敏感内容</text><path class="v56-arrow" d="M 607 250 L 607 290" marker-end="url(#c-overview-arr)"/><path class="v56-arrow" d="M 607 390 L 607 430" marker-end="url(#c-overview-arr)"/><path class="v56-arrow" d="M 607 530 L 607 570" marker-end="url(#c-overview-arr)"/><path class="v56-arrow" d="M 607 670 L 607 710" marker-end="url(#c-overview-arr)"/><path class="v56-arrow" d="M 607 810 L 607 850" marker-end="url(#c-overview-arr)"/><text class="v56-label" x="345" y="990" text-anchor="start">步骤 2–6 同时进行，各源自己筛</text><path class="v56-arrow" d="M 277 330 L 310 330 L 310 340 L 345 340" marker-end="url(#c-overview-arr)"/><path class="v56-arrow" d="M 277 590 L 345 620" marker-end="url(#c-overview-arr)"/><path class="v56-arrow" d="M 277 770 L 345 760" marker-end="url(#c-overview-arr)"/><g data-node="true"><rect class="v56-neutral" x="925" y="640" width="280" height="460" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="939" y="667" text-anchor="start">7 Planner 输入组装与推理</text><text class="v56-node-sub" x="939" y="692" text-anchor="start">固定说明 + 这些背景</text><text class="v56-node-sub" x="939" y="713" text-anchor="start">一次发给 Planner 推理</text><text class="v56-node-sub" x="939" y="734" text-anchor="start"></text><text class="v56-node-sub" x="939" y="755" text-anchor="start">材料够吗？</text><text class="v56-node-sub" x="939" y="776" text-anchor="start">够：直接回答或动手</text><text class="v56-node-sub" x="939" y="797" text-anchor="start">播报、调用工具</text><text class="v56-node-sub" x="939" y="818" text-anchor="start"></text><text class="v56-node-sub" x="939" y="839" text-anchor="start">不够：Planner 调查询工具</text><text class="v56-node-sub" x="939" y="860" text-anchor="start">查记忆、车况、画面</text><text class="v56-node-sub" x="939" y="881" text-anchor="start">结果作为工具反馈</text><text class="v56-node-sub" x="939" y="902" text-anchor="start">进入下一次推理</text><text class="v56-node-sub" x="939" y="923" text-anchor="start"></text><text class="v56-node-sub" x="939" y="944" text-anchor="start">工具执行结果回来后</text><text class="v56-node-sub" x="939" y="965" text-anchor="start">也可能继续推理</text></g><path class="v56-arrow" d="M 870 900 L 895 900 L 895 695 L 925 695" marker-end="url(#c-overview-arr)"/><text class="v56-subtitle" x="885" y="930" text-anchor="start">交出</text><text class="v56-subtitle" x="885" y="950" text-anchor="start">背景</text><g data-node="true"><rect class="v56-neutral" x="345" y="1150" width="525" height="100" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="359" y="1177" text-anchor="start">8 写回这一轮（Planner 服务收尾时写）</text><text class="v56-node-sub" x="359" y="1202" text-anchor="start">上下文服务只取不存；下一句再来取</text><text class="v56-node-sub" x="359" y="1223" text-anchor="start">拒识记成人人对话；风控轮下次不带</text></g><path class="v56-arrow" d="M 1065 1100 L 1065 1200 L 870 1200" marker-end="url(#c-overview-arr)"/><text class="v56-subtitle" x="1090" y="1155" text-anchor="start">本轮结束</text><path class="v56-arrow" d="M 345 1220 L 315 1220 L 315 340 L 345 340" marker-end="url(#c-overview-arr)"/><text class="v56-subtitle" x="32" y="1240" text-anchor="start">写回后成为下一句的历史</text><rect data-role="legend" class="v56-local" x="32" y="1300" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="60" y="1314" text-anchor="start">蓝：车上上报</text><rect data-role="legend" class="v56-cloud" x="181" y="1300" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="209" y="1314" text-anchor="start">绿：取背景</text><rect data-role="legend" class="v56-neutral" x="316" y="1300" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="344" y="1314" text-anchor="start">灰：Planner 处理</text><rect data-role="legend" class="v56-cloud v56-pending" x="549" y="1300" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="577" y="1314" text-anchor="start">虚线框：正在开发</text></svg>