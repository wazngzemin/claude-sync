<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="同一段声音，同时做“听成字”和“判断说完没”" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-hearing" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">同一段声音，同时做“听成字”和“判断说完没”</text><text x="30" y="58" font-size="13" fill="#5f7169">主 OnePager · 300/600 ms从停顿计；不是回答总耗时</text><g transform="translate(0,78)"><path class="flow-edge" data-from="audio" data-to="asr" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-hearing)"/><path class="flow-edge" data-from="asr" data-to="partial" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-hearing)"/><path class="flow-edge" data-from="audio" data-to="vad" d="M160.0,130 L160.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-hearing)"/><path class="flow-edge" data-from="vad" data-to="soft" d="M280,260.0 L370,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-hearing)"/><path class="flow-edge" data-from="soft" data-to="pre" d="M610,260.0 L700,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-hearing)"/><path class="flow-edge" data-from="partial" data-to="pre" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-hearing)"/><path class="flow-edge" data-from="vad" data-to="hard" d="M160.0,306 L160.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-hearing)"/><path class="flow-edge" data-from="hard" data-to="final" d="M280,436.0 L370,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-hearing)"/><path class="flow-edge" data-from="final" data-to="formal" d="M610,436.0 L700,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-hearing)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">音频</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">边听边出字</text><text x="169.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">同一段声音</text><text x="325.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">较短停顿</text><text x="655.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">触发准备</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">当前识别文字</text><text x="169.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">达到本版判停</text><text x="325.0" y="427.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">分段后再识别</text><text x="655.0" y="427.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">最终文字</text><g class="flow-point" data-point="audio" role="button" tabindex="0" aria-label="用户仍在说话"><rect x="40" y="38" width="240" height="92" rx="13" fill="#eaf1ff" stroke="#627fae" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#627fae">用户</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">用户仍在说话</text><text x="54" y="110" font-size="12" fill="#587266">去……昨天那家游泳馆</text></g><g class="flow-point" data-point="asr" role="button" tabindex="0" aria-label="一遍识别持续出字"><rect x="370" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#86ada7">处理</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">一遍识别持续出字</text><text x="384" y="110" font-size="12" fill="#587266">ASR：声音变成文字</text></g><g class="flow-point" data-point="partial" role="button" tabindex="0" aria-label="过程文字会继续变化"><rect x="700" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#86ada7">处理</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">过程文字会继续变化</text><text x="714" y="110" font-size="12" fill="#587266">还不能当作最终定稿</text></g><g class="flow-point" data-point="vad" role="button" tabindex="0" aria-label="VAD观察人声与停顿"><rect x="40" y="214" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#bb8932">判断</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">VAD观察人声与停顿</text><text x="54" y="286" font-size="12" fill="#587266">不是理解目的地的模块</text></g><g class="flow-point" data-point="soft" role="button" tabindex="0" aria-label="短停顿300 ms：先准备"><rect x="370" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#86ada7">处理</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">短停顿300 ms：先准备</text><text x="384" y="286" font-size="12" fill="#587266">Soft；不结束识别</text></g><g class="flow-point" data-point="pre" role="button" tabindex="0" aria-label="拿当前文字做预请求"><rect x="700" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#86ada7">处理</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">拿当前文字做预请求</text><text x="714" y="286" font-size="12" fill="#587266">只做允许提前的计算</text></g><g class="flow-point" data-point="hard" role="button" tabindex="0" aria-label="停顿600 ms：本段收尾"><rect x="40" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="411" font-size="11" fill="#86ada7">处理</text><text x="54" y="437" font-weight="700" font-size="16" fill="#203f35">停顿600 ms：本段收尾</text><text x="54" y="462" font-size="12" fill="#587266">Hard；等待二遍结果</text></g><g class="flow-point" data-point="final" role="button" tabindex="0" aria-label="二遍给出最终文字"><rect x="370" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="411" font-size="11" fill="#86ada7">处理</text><text x="384" y="437" font-weight="700" font-size="16" fill="#203f35">二遍给出最终文字</text><text x="384" y="462" font-size="12" fill="#587266">用户不用重说一遍</text></g><g class="flow-point" data-point="formal" role="button" tabindex="0" aria-label="按最终文字正式处理"><rect x="700" y="390" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="714" y="411" font-size="11" fill="#36835f">结果</text><text x="714" y="437" font-weight="700" font-size="16" fill="#203f35">按最终文字正式处理</text><text x="714" y="462" font-size="12" fill="#587266">与上一份准备核对后继续</text></g></g></svg>