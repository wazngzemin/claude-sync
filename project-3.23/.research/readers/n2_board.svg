<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" font-family="Noto Sans SC, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcf8"/>
      <stop offset="100%" stop-color="#f4f6fb"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg2)"/>

  <text x="40" y="45" font-size="26" font-weight="700" fill="#1a1a1a">N2｜Always On 与 Watcher：全时观察和情境描述</text>
  <text x="40" y="72" font-size="14" fill="#5f6368">端侧多模模型持续监听；分出情境描述→短期记忆、事件→云端触发器、[SILENT]/[SPEAK]→Advisor、连续对话→R13 免唤醒</text>

  <!-- 端侧框 -->
  <rect x="30" y="100" width="700" height="700" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="125" font-size="16" font-weight="700" fill="#1e3a8a">端侧（Always On，不下云）</text>

  <!-- N2-01 输入 -->
  <rect x="60" y="150" width="200" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="175" font-size="13" font-weight="700" fill="#1a1a1a">N2-01 端侧输入</text>
  <text x="75" y="195" font-size="11" fill="#3c4043">要点：4 音区音频+摄像头+车端信号</text>
  <text x="75" y="212" font-size="11" fill="#3c4043">① 不依赖用户发起</text>
  <text x="75" y="229" font-size="11" fill="#3c4043">② 端侧硬件持续产生</text>

  <!-- N2-02 Watcher -->
  <rect x="300" y="150" width="220" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="315" y="175" font-size="13" font-weight="700" fill="#1a1a1a">N2-02 Watcher 端侧多模</text>
  <text x="315" y="195" font-size="11" fill="#3c4043">要点：永远不睡觉的观察者</text>
  <text x="315" y="212" font-size="11" fill="#3c4043">① 发现值得叫醒一次的事件</text>
  <text x="315" y="229" font-size="11" fill="#3c4043">② 条件成不成立交 G 图</text>
  <text x="315" y="246" font-size="11" fill="#b3261e">③ 不是 G 图本身</text>

  <!-- N2-03 四态 -->
  <rect x="550" y="150" width="160" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="565" y="175" font-size="13" font-weight="700" fill="#7f1d1d">N2-03 四态</text>
  <text x="565" y="195" font-size="11" fill="#3c4043">Reject / Interrupt</text>
  <text x="565" y="212" font-size="11" fill="#3c4043">Response / Listen</text>
  <text x="565" y="229" font-size="11" fill="#3c4043">① 全时多模聆听</text>
  <text x="565" y="246" font-size="11" fill="#3c4043">② 状态切换触发后续</text>

  <!-- N2-12 音区开关 -->
  <rect x="60" y="290" width="220" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="315" font-size="13" font-weight="700" fill="#1a1a1a">N2-12 音区开关</text>
  <text x="75" y="335" font-size="11" fill="#3c4043">要点：座椅传感器+Face ID 判有人</text>
  <text x="75" y="352" font-size="11" fill="#3c4043">① 无人不开该音区</text>
  <text x="75" y="369" font-size="11" fill="#3c4043">② 副驾下车后不再听副驾音</text>

  <!-- N2-13 强召回 -->
  <rect x="310" y="290" width="200" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="325" y="315" font-size="13" font-weight="700" fill="#78350f">N2-13 强召回</text>
  <text x="325" y="335" font-size="11" fill="#3c4043">要点：唤醒词"豆包"及泛化</text>
  <text x="325" y="352" font-size="11" fill="#3c4043">① 强制判人机对话</text>
  <text x="325" y="369" font-size="11" fill="#3c4043">② "哎豆包""小包同学"都算</text>

  <!-- N2-14 强拒识 -->
  <rect x="530" y="290" width="180" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="545" y="315" font-size="13" font-weight="700" fill="#7f1d1d">N2-14 强拒识</text>
  <text x="545" y="335" font-size="11" fill="#3c4043">要点：识别手持手机打电话</text>
  <text x="545" y="352" font-size="11" fill="#3c4043">① 该音区不响应、不上云</text>
  <text x="545" y="369" font-size="11" fill="#b3261e">② 排障查不到 ASR 日志正常</text>

  <!-- N2-15 话题继承 -->
  <rect x="60" y="420" width="220" height="90" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="75" y="445" font-size="13" font-weight="700" fill="#064e3b">N2-15 拒识话题继承</text>
  <text x="75" y="465" font-size="11" fill="#3c4043">要点：每 5 轮总结话题（8 类）</text>
  <text x="75" y="482" font-size="11" fill="#3c4043">① 召回时带上文</text>
  <text x="75" y="499" font-size="11" fill="#3c4043">② 8 类：日常/兴趣/科技/工作/时事/情感/健康/旅行</text>

  <!-- N2-16 连续对话 30s -->
  <rect x="310" y="420" width="200" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="325" y="445" font-size="13" font-weight="700" fill="#1a1a1a">N2-16 连续对话 30s</text>
  <text x="325" y="465" font-size="11" fill="#3c4043">要点：上屏 ASR 最终文本</text>
  <text x="325" y="482" font-size="11" fill="#3c4043">① 30s 无效指令退全时态</text>
  <text x="325" y="499" font-size="11" fill="#3c4043">② 导航问完可补"途经加油站"</text>

  <!-- N2-17 高风险二次确认 -->
  <rect x="530" y="420" width="180" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="545" y="445" font-size="13" font-weight="700" fill="#7f1d1d">N2-17 高风险二次确认</text>
  <text x="545" y="465" font-size="11" fill="#3c4043">要点：关 ESP/解儿童锁/支付</text>
  <text x="545" y="482" font-size="11" fill="#3c4043">① 仅主驾或二次确认</text>

  <!-- N2-04 情境描述 -->
  <rect x="60" y="550" width="220" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="575" font-size="13" font-weight="700" fill="#1a1a1a">N2-04 情境描述（流式）</text>
  <text x="75" y="595" font-size="11" fill="#3c4043">要点：小区车库/两人靠近/抱纸箱</text>
  <text x="75" y="612" font-size="11" fill="#3c4043">① 连续场景描述</text>

  <!-- N2-05 事件发现 -->
  <rect x="310" y="550" width="200" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="325" y="575" font-size="13" font-weight="700" fill="#78350f">N2-05 事件发现</text>
  <text x="325" y="595" font-size="11" fill="#3c4043">要点：云端 Agent 用自然语言注册</text>
  <text x="325" y="612" font-size="11" fill="#3c4043">① 后排哭了/开始暴雨</text>

  <!-- N2-06 弱网兜底 -->
  <rect x="530" y="550" width="180" height="90" rx="8" fill="#f5f5f4" stroke="#78716c" stroke-dasharray="4,3" stroke-width="2"/>
  <text x="545" y="575" font-size="13" font-weight="700" fill="#57534e">N2-06 弱网兜底</text>
  <text x="545" y="595" font-size="11" fill="#57534e">要点：query 改写为传统语音可执行</text>
  <text x="545" y="612" font-size="11" fill="#57534e">① 长期/低优</text>

  <!-- N2-19 视觉持续任务 -->
  <rect x="60" y="680" width="280" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="75" y="705" font-size="13" font-weight="700" fill="#78350f">N2-19 视觉持续任务</text>
  <text x="75" y="725" font-size="11" fill="#3c4043">要点：Special Token 逐图预测 [SILENT]/[SPEAK]</text>
  <text x="75" y="742" font-size="11" fill="#3c4043">① 主驾入睡→[SPEAK] 降媒体音量</text>
  <text x="75" y="759" font-size="11" fill="#3c4043">② 路过广告牌→[SILENT] 静默</text>

  <!-- N2-20 司机 Agent 视觉（长期） -->
  <rect x="370" y="680" width="280" height="100" rx="8" fill="#f5f5f4" stroke="#78716c" stroke-dasharray="4,3" stroke-width="2"/>
  <text x="385" y="705" font-size="13" font-weight="700" fill="#57534e">N2-20 司机 Agent 视觉任务</text>
  <text x="385" y="725" font-size="11" fill="#57534e">要点：舱驾融合</text>
  <text x="385" y="742" font-size="11" fill="#57534e">① 临停/泊车/智驾风格</text>
  <text x="385" y="759" font-size="11" fill="#57534e">② 长期愿景【2.6 后】</text>

  <!-- 云端框 -->
  <rect x="760" y="100" width="710" height="700" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="780" y="125" font-size="16" font-weight="700" fill="#064e3b">云端加工与分发</text>

  <!-- N2-07 短期记忆 -->
  <rect x="790" y="160" width="240" height="100" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="805" y="185" font-size="13" font-weight="700" fill="#064e3b">N2-07 短期记忆</text>
  <text x="805" y="205" font-size="11" fill="#3c4043">要点：带 timestamp</text>
  <text x="805" y="222" font-size="11" fill="#3c4043">① ≈ v15 A06 供 C4</text>
  <text x="805" y="239" font-size="11" fill="#3c4043">② B06 供 C1</text>

  <!-- N2-18 任务四分类 -->
  <rect x="1060" y="160" width="200" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1075" y="185" font-size="13" font-weight="700" fill="#78350f">N2-18 任务四分类</text>
  <text x="1075" y="205" font-size="11" fill="#3c4043">要点：单步/条件/多步/持续</text>
  <text x="1075" y="222" font-size="11" fill="#3c4043">① 持续观察任务归此类</text>

  <!-- N2-08 G01 触发器登记 -->
  <rect x="790" y="300" width="240" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="805" y="325" font-size="13" font-weight="700" fill="#78350f">N2-08 G01 云端触发器登记</text>
  <text x="805" y="345" font-size="11" fill="#3c4043">要点：一期全部工程触发</text>
  <text x="805" y="362" font-size="11" fill="#3c4043">① 事件注册入口</text>

  <!-- N2-09 G03→G05→G06→G08 -->
  <rect x="1060" y="300" width="280" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1075" y="325" font-size="13" font-weight="700" fill="#78350f">N2-09 G 链路</text>
  <text x="1075" y="345" font-size="11" fill="#3c4043">G03 信号叫醒 → G05 条件比较</text>
  <text x="1075" y="362" font-size="11" fill="#3c4043">→ G06 频控 → G08 分发</text>
  <text x="1075" y="382" font-size="11" fill="#3c4043">① Watcher 只负责"叫醒一次"</text>
  <text x="1075" y="399" font-size="11" fill="#3c4043">② 条件成不成立是 G 的事</text>

  <!-- N2-10 静态 Advisor -->
  <rect x="790" y="440" width="280" height="100" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="805" y="465" font-size="13" font-weight="700" fill="#064e3b">N2-10 S01 静态 Advisor</text>
  <text x="805" y="485" font-size="11" fill="#3c4043">舒适/出行/情感/内容</text>
  <text x="805" y="502" font-size="11" fill="#3c4043">① 后排哭了→情感 Advisor 递纸巾</text>

  <!-- N2-11 进主链 -->
  <rect x="1100" y="440" width="240" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="1115" y="465" font-size="13" font-weight="700" fill="#1a1a1a">N2-11 进主链</text>
  <text x="1115" y="485" font-size="11" fill="#3c4043">R13 免唤醒判断</text>
  <text x="1115" y="502" font-size="11" fill="#3c4043">① V12 正式 query 进主链</text>

  <!-- 连线 -->
  <line x1="260" y1="195" x2="300" y2="195" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="520" y1="195" x2="550" y2="195" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="630" y1="260" x2="170" y2="290" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="170" y1="390" x2="170" y2="420" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="170" y1="510" x2="170" y2="550" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="410" y1="510" x2="410" y2="550" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="170" y1="640" x2="910" y2="200" stroke="#059669" stroke-width="2.5"/>
  <text x="500" y="680" font-size="11" fill="#064e3b">情境描述→短期记忆</text>
  <line x1="410" y1="640" x2="1160" y2="200" stroke="#d97706" stroke-width="2.5"/>
  <text x="650" y="660" font-size="11" fill="#78350f">事件→任务分类</text>
  <line x1="1160" y1="260" x2="1160" y2="300" stroke="#d97706" stroke-width="2.5"/>
  <line x1="1160" y1="410" x2="930" y2="440" stroke="#d97706" stroke-width="2.5"/>
  <line x1="400" y1="680" x2="930" y2="350" stroke="#d97706" stroke-width="2.5"/>
  <line x1="410" y1="510" x2="1220" y2="440" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="900" y="580" font-size="11" fill="#1e3a8a">连续对话→R13</text>

  <!-- 图例 -->
  <rect x="30" y="820" width="1440" height="160" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="50" y="850" font-size="15" font-weight="700" fill="#1a1a1a">图例</text>
  <rect x="50" y="865" width="24" height="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="878" font-size="12" fill="#3c4043">蓝框=端侧主路（2.6 目标）</text>
  <rect x="280" y="865" width="24" height="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="312" y="878" font-size="12" fill="#3c4043">金框=任务/触发器（G 链路）</text>
  <rect x="540" y="865" width="24" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="572" y="878" font-size="12" fill="#3c4043">红框=拒识/高风险判断</text>
  <rect x="780" y="865" width="24" height="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="812" y="878" font-size="12" fill="#3c4043">绿框=云端分发/记忆回流</text>
  <rect x="1020" y="865" width="24" height="16" fill="#f5f5f4" stroke="#78716c" stroke-dasharray="3,2" stroke-width="2"/>
  <text x="1052" y="878" font-size="12" fill="#3c4043">灰虚线=长期愿景（2.6 后）</text>

  <text x="50" y="915" font-size="13" font-weight="700" fill="#1a1a1a">最容易看错：</text>
  <text x="130" y="915" font-size="12" fill="#3c4043">① N2-02 不是 G 图——Watcher 只"叫醒一次"，条件成不成立是 G03/G05/G06 的事；</text>
  <text x="130" y="935" font-size="12" fill="#3c4043">② N2-14 强拒识≠N2-03 Reject——是"该音区整体闭嘴"，连文字都不上云；</text>
  <text x="130" y="955" font-size="12" fill="#3c4043">③ N2-15 话题总结喂给召回上文，不是长期记忆；N2-20 司机 Agent 是长期愿景，2.6 不做。</text>
</svg>
