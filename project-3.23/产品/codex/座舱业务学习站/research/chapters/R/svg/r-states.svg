<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="对话状态怎么流转：静默、全时、激活、延时聆听"><title>对话状态怎么流转：静默、全时、激活、延时聆听</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="720" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">对话状态怎么流转：静默、全时、激活、延时聆听</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">赛力斯 VUI 主交互需求；上汽没有“全时态”，平时处于静默态</text><rect x="30" y="130" width="260" height="130" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="157" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">起点：静默态 / 全时态</text><text x="44" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">静默：只等唤醒词</text><text x="44" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（上汽平时就是这样）</text><text x="44" y="224" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">全时：四个音区一直收音</text><text x="44" y="245" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（赛力斯，全时免唤醒开）</text><rect x="330" y="380" width="150" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="344" y="407" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">聆听</text><text x="344" y="432" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">唤醒后收音</text><text x="344" y="453" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">字边说边上屏</text><rect x="500" y="380" width="150" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="514" y="407" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">介入判断</text><text x="514" y="432" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说完后判断</text><text x="514" y="453" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">接还是拒</text><rect x="670" y="380" width="150" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="684" y="407" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">思考·调工具</text><text x="684" y="432" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 推理</text><text x="684" y="453" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具执行中</text><rect x="840" y="380" width="150" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="854" y="407" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">播报</text><text x="854" y="432" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">TTS 播报</text><text x="854" y="453" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">可以被打断</text><rect x="1010" y="380" width="150" height="96" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="1024" y="407" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">延时聆听</text><text x="1024" y="432" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">默认 30 秒</text><text x="1024" y="453" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">有效输入刷新</text><path d="M480,428 L500,428" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M650,428 L670,428" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M820,428 L840,428" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M990,428 L1010,428" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><text x="330" y="366" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">激活态（唤醒之后）</text><path d="M290,160 L915,160 L915,380" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="800.3" y="139" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="830" y="155" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">主动服务</text><path d="M290,200 L745,200 L745,380" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="423.85" y="179" width="232.29999999999998" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="540" y="195" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">豆包+指令 / 全时态直接说有效指令</text><path d="M290,240 L405,240 L405,380" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="295.6" y="219" width="108.8" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="350" y="235" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">唤醒词 / 按键</text><path d="M1085,476 L1085,520 L745,520 L745,476" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="842.075" y="499" width="145.85" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="915" y="515" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">30 秒内新的有效指令</text><path d="M1140,476 L1140,560 L160,560 L160,260" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="552.375" y="539" width="195.25" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="650" y="555" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">30 秒没有有效输入，回到起点</text><rect x="30" y="596" width="260" height="100" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="44" y="623" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">禁用态</text><text x="44" y="648" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">隐私未同意、AI 开关关、</text><text x="44" y="669" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">泊车等禁用场景</text><text x="44" y="690" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">喊了也不唤醒，toast 提示</text><rect x="330" y="596" width="840" height="100" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="344" y="623" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">屏幕上显不显示识别出的字</text><text x="344" y="648" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">全时态：不边说边上屏，判定有效后才显示整句</text><text x="344" y="669" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">激活态（含延时聆听）：边说边上屏；被拒识就快速清屏</text></g></svg>