<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-label="播报、展示与真实结果：从 DT 的决定到“这一轮结束”的 8 步"><title>播报、展示与真实结果：从 DT 的决定到“这一轮结束”的 8 步</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="1130" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">播报、展示与真实结果：从 DT 的决定到“这一轮结束”的 8 步</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左列车上（端侧），右列云端；上面一路是“说”，动作交给 E 章执行，结果回到第 6 步</text><rect x="30" y="92" width="560" height="1020" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上（取声音、播放器、喇叭、屏幕）</text><rect x="610" y="92" width="560" height="1020" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="624" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端（DT、座舱云服务、语音合成）</text><rect x="630" y="130" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="152" r="12" fill="#4a9670"/><text x="650" y="157" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="670" y="157" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 交出四样东西</text><text x="644" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">要不要说、说什么（带语气）、表情、动作</text><text x="644" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">首轮话术不预设结果</text><rect x="630" y="260" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="282" r="12" fill="#4a9670"/><text x="650" y="287" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="670" y="287" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">按语气切段，合成声音</text><text x="644" y="312" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一段语气结束就合成，“唱”交给 S2S</text><text x="644" y="333" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">提前合成并缓存，可边取边播</text><rect x="50" y="390" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="412" r="12" fill="#4f7ea9"/><text x="70" y="417" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="90" y="417" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">文字先到屏幕，按编号取声音</text><text x="64" y="442" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">文字走豆包对话通道</text><text x="64" y="463" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">声音走单独的长连接</text><rect x="50" y="520" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="542" r="12" fill="#4f7ea9"/><text x="70" y="547" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="90" y="547" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上出声</text><text x="64" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">在线 / 离线、P0–P5 优先级、音频焦点</text><text x="64" y="593" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（需求，上线待确认）</text><rect x="630" y="520" width="520" height="88" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><circle cx="650" cy="542" r="12" fill="#c45c5c"/><text x="650" y="547" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="670" y="547" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">被打断时：DT 决定补不补</text><text x="644" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上停播，上报说到哪</text><text x="644" y="593" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已说 / 没说完 交回 DT</text><rect x="630" y="650" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="672" r="12" fill="#4a9670"/><text x="650" y="677" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="670" y="677" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">执行结果回来，说一句如实的话</text><text x="644" y="702" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">全部回执回来、首轮播完再说</text><text x="644" y="723" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">失败要分开说</text><rect x="50" y="780" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="802" r="12" fill="#4f7ea9"/><text x="70" y="807" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="90" y="807" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">屏幕：卡片和表情</text><text x="64" y="832" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具结果回来才出卡</text><text x="64" y="853" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">赛力斯：播完 10 秒退出</text><rect x="50" y="910" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="932" r="12" fill="#4f7ea9"/><text x="70" y="937" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">8</text><text x="90" y="937" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">报回“真的播完了”</text><text x="64" y="962" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">现状：临时标记 + 进度</text><text x="64" y="983" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">新方案：四种播放事件（开发中）</text><rect x="630" y="910" width="520" height="88" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="644" y="937" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">这一轮结束，放下一条输入</text><text x="644" y="962" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">交给输入管理（M 章）</text><text x="644" y="983" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上进入延时聆听</text><rect x="630" y="390" width="520" height="88" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="644" y="417" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">动作交给工具执行（E 章）</text><text x="644" y="442" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">空调、座椅按摩等同时开始</text><path d="M890,218 L890,260" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="907.65" y="229" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="925" y="245" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">话术</text><path d="M630,304 L310,304 L310,390" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="399.425" y="283" width="121.14999999999999" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="460" y="299" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">文字 + 声音编号</text><path d="M310,478 L310,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M570,564 L630,564" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="572.2" y="542" width="55.599999999999994" height="20" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600" y="557" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle">有人插嘴</text><path d="M1160,174 L1180,174 L1180,434 L1150,434" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1163.6" y="316" width="32.8" height="20" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="1180" y="331" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle">动作</text><path d="M1150,464 L1166,464 L1166,708 L1150,708" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1149.6" y="586" width="32.8" height="20" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="1166" y="601" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle">回执</text><path d="M630,694 L310,694 L310,780" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="421.775" y="673" width="96.45" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="470" y="689" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">结果话术、卡片</text><path d="M310,868 L310,910" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M570,954 L630,954" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="583.6" y="932" width="32.8" height="20" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600" y="947" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle">播完</text><rect x="50" y="1040" width="1100" height="50" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="64" y="1067" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">“说了”≠ 动作已下发 ≠ 执行成功 ≠ 用户听到：四件事各留各的证据</text></g></svg>