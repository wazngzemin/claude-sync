<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="“等等，先别去了”到来时，先查旧动作发出去没有" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-cancellation" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">“等等，先别去了”到来时，先查旧动作发出去没有</text><text x="30" y="58" font-size="13" fill="#5f7169">输入管理拟改造原则 · 不是已上线能力承诺</text><g transform="translate(0,78)"><path class="flow-edge" data-from="new" data-to="issued" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-cancellation)"/><path class="flow-edge" data-from="issued" data-to="before" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-cancellation)"/><path class="flow-edge" data-from="issued" data-to="after" d="M490.0,130 L490.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-cancellation)"/><path class="flow-edge" data-from="after" data-to="feedback" d="M610,260.0 L700,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-cancellation)"/><path class="flow-edge" data-from="feedback" data-to="judge" d="M820.0,306 L820.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-cancellation)"/><path class="flow-edge" data-from="new" data-to="sound" d="M160.0,130 L160.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-cancellation)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">检查真实阶段</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">尚未放行</text><text x="499.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">已经放行</text><text x="655.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">不能抹掉已发动作</text><text x="829.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">结合新要求</text><text x="169.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">分别记录状态</text><g class="flow-point" data-point="new" role="button" tabindex="0" aria-label="用户补充或反悔"><rect x="40" y="38" width="240" height="92" rx="13" fill="#eaf1ff" stroke="#627fae" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#627fae">用户</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">用户补充或反悔</text><text x="54" y="110" font-size="12" fill="#587266">旧一轮可能还没出声音</text></g><g class="flow-point" data-point="issued" role="button" tabindex="0" aria-label="旧工具命令已经放行吗"><rect x="370" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#bb8932">判断</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">旧工具命令已经放行吗</text><text x="384" y="110" font-size="12" fill="#587266">不能只看有没有首字</text></g><g class="flow-point" data-point="before" role="button" tabindex="0" aria-label="还没放行：可合并重算"><rect x="700" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#86ada7">处理</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">还没放行：可合并重算</text><text x="714" y="110" font-size="12" fill="#587266">按新要求重新决定动作</text></g><g class="flow-point" data-point="after" role="button" tabindex="0" aria-label="已放行：旧请求不重放"><rect x="370" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#86ada7">处理</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">已放行：旧请求不重放</text><text x="384" y="286" font-size="12" fill="#587266">作为已发生的背景保存</text></g><g class="flow-point" data-point="feedback" role="button" tabindex="0" aria-label="已接单工具仍回真实结果"><rect x="700" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#86ada7">处理</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">已接单工具仍回真实结果</text><text x="714" y="286" font-size="12" fill="#587266">成功、失败或部分完成</text></g><g class="flow-point" data-point="judge" role="button" tabindex="0" aria-label="按新要求和结果再判断"><rect x="700" y="390" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="411" font-size="11" fill="#bb8932">判断</text><text x="714" y="437" font-weight="700" font-size="16" fill="#203f35">按新要求和结果再判断</text><text x="714" y="462" font-size="12" fill="#587266">不默认自动撤销旧动作</text></g><g class="flow-point" data-point="sound" role="button" tabindex="0" aria-label="声音与执行分别处理"><rect x="40" y="214" width="240" height="92" rx="13" fill="#fcece6" stroke="#bb7560" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#bb7560">分支</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">声音与执行分别处理</text><text x="54" y="286" font-size="12" fill="#587266">停播不等于车窗已停或复原</text></g></g></svg>