<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 2339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
