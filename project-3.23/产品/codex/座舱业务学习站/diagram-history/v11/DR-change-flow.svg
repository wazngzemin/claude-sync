    </marker>
  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">把“泊入车位”改为“路边临停”：必须先取消旧任务</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,220 350,286" marker-end="url(#arrow-DR-change-flow)"><title>DR-change-1 → DR-change-2：任务进行中</title></polyline><polyline class="arr" fill="none" points="350,410 350,476" marker-end="url(#arrow-DR-change-flow)"><title>DR-change-2 → DR-change-3：变更而非新增</title></polyline><polyline class="arr" fill="none" points="350,600 350,666" marker-end="url(#arrow-DR-change-flow)"><title>DR-change-3 → DR-change-4：新目标 + 旧任务</title></polyline><polyline class="arr" fill="none" points="350,790 350,856" marker-end="url(#arrow-DR-change-flow)"><title>DR-change-4 → DR-change-5：取消指令</title></polyline><polyline class="arr" fill="none" points="350,980 350,1046" marker-end="url(#arrow-DR-change-flow)"><title>DR-change-5 → DR-change-6：取消反馈</title></polyline><polyline class="arr" fill="none" points="350,1170 350,1236" marker-end="url(#arrow-DR-change-flow)"><title>DR-change-6 → DR-change-7：已取消</title></polyline><polyline class="arr" fill="none" points="176,1100 90,1100 90,1692 170,1692" marker-end="url(#arrow-DR-change-flow)"><title>DR-change-6 → DR-change-9：失败/超时/无结果</title></polyline><polyline class="arr" fill="none" points="350,1360 350,1426" marker-end="url(#arrow-DR-change-flow)"><title>DR-change-7 → DR-change-8：新临停设置与真实执行</title></polyline><text class="ts" x="365" y="256" text-anchor="start" dominant-baseline="central">E1 · 任务进行中</text><text class="ts" x="365" y="446" text-anchor="start" dominant-baseline="central">E2 · 变更而非新增</text><text class="ts" x="365" y="636" text-anchor="start" dominant-baseline="central">E3 · 新目标 + 旧任务</text><text class="ts" x="365" y="826" text-anchor="start" dominant-baseline="central">E4 · 取消指令</text><text class="ts" x="365" y="1016" text-anchor="start" dominant-baseline="central">E5 · 取消反馈</text><text class="ts" x="365" y="1206" text-anchor="start" dominant-baseline="central">E6 · 已取消</text><text class="ts" x="168" y="1092" text-anchor="end" dominant-baseline="central">E7</text><text class="ts" x="168" y="1704" text-anchor="end" dominant-baseline="central">E7</text><text class="ts" x="365" y="1396" text-anchor="start" dominant-baseline="central">E8 · 新临停设置与真实执行</text><g class="c-gray" role="link" tabindex="0" data-page="DR" data-flow="DR-change-flow" data-step="DR-change-1" aria-label="已有目的地泊车任务"><title>去 D 栋，负二层充电车位；Context 保留当前任务</title><rect x="180" y="106" width="340" height="110" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">已有目的地泊车任务</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">去 D 栋，负二层充电车位</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central">Context 保留当前任务</text></g><text class="anno" x="540" y="130" text-anchor="start" dominant-baseline="central">关联旧任务</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-change-flow" data-step="DR-change-2" aria-label="用户改变停车目标"><title>“到了靠边停就行”；不是新增第二个停车任务</title><rect x="180" y="296" width="340" height="110" rx="6"/><text class="th" x="198" y="320" text-anchor="start" dominant-baseline="central">用户改变停车目标</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">“到了靠边停就行”</text><text class="ts" x="198" y="367" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central">不是新增第二个停车任务</text></g><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-change-flow" data-step="DR-change-3" aria-label="DT 交司机 Agent"><title>改写目的地靠边停；携带旧泊车任务关系</title><rect x="180" y="486" width="340" height="110" rx="6"/><text class="th" x="198" y="510" text-anchor="start" dominant-baseline="central">DT 交司机 Agent</text><text class="ts" x="198" y="538" text-anchor="start" dominant-baseline="central">改写目的地靠边停</text><text class="ts" x="198" y="557" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="576" text-anchor="start" dominant-baseline="central">携带旧泊车任务关系</text></g><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-change-flow" data-step="DR-change-4" aria-label="取消旧泊车要求"><title>专项层调用智驾控制工具；明确取消负二层充电泊入</title><rect x="180" y="676" width="340" height="110" rx="6"/><text class="th" x="198" y="700" text-anchor="start" dominant-baseline="central">取消旧泊车要求</text><text class="ts" x="198" y="728" text-anchor="start" dominant-baseline="central">专项层调用智驾控制工具</text><text class="ts" x="198" y="747" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="766" text-anchor="start" dominant-baseline="central">明确取消负二层充电泊入</text></g><text class="anno" x="540" y="700" text-anchor="start" dominant-baseline="central">请求取消</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-change-flow" data-step="DR-change-5" aria-label="App 向 ADC 取消"><title>系统导航泊车 App 执行取消；回传取消结果</title><rect x="180" y="866" width="340" height="110" rx="6"/><text class="th" x="198" y="890" text-anchor="start" dominant-baseline="central">App 向 ADC 取消</text><text class="ts" x="198" y="918" text-anchor="start" dominant-baseline="central">系统导航泊车 App 执行取消</text><text class="ts" x="198" y="937" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="956" text-anchor="start" dominant-baseline="central">回传取消结果</text></g><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-change-flow" data-step="DR-change-6" aria-label="取消是否成功"><title>必须收到取消成功；不能按请求已发就继续</title><rect x="180" y="1056" width="340" height="110" rx="6"/><text class="th" x="198" y="1080" text-anchor="start" dominant-baseline="central">取消是否成功</text><text class="ts" x="198" y="1108" text-anchor="start" dominant-baseline="central">必须收到取消成功</text><text class="ts" x="198" y="1127" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1146" text-anchor="start" dominant-baseline="central">不能按请求已发就继续</text></g><text class="anno" x="540" y="1080" text-anchor="start" dominant-baseline="central">核验取消结果</text><text class="anno" x="540" y="1111" text-anchor="start" dominant-baseline="central">E7 · 失败/超时</text><text class="anno" x="540" y="1130" text-anchor="start" dominant-baseline="central">/无结果</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-change-flow" data-step="DR-change-7" aria-label="Navi 设置 POI 临停"><title>目的地改为靠边停；系统 App 下发给 ADC</title><rect x="180" y="1246" width="340" height="110" rx="6"/><text class="th" x="198" y="1270" text-anchor="start" dominant-baseline="central">Navi 设置 POI 临停</text><text class="ts" x="198" y="1298" text-anchor="start" dominant-baseline="central">目的地改为靠边停</text><text class="ts" x="198" y="1317" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1336" text-anchor="start" dominant-baseline="central">系统 App 下发给 ADC</text></g><text class="anno" x="540" y="1270" text-anchor="start" dominant-baseline="central">新目标执行</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-change-flow" data-step="DR-change-8" aria-label="跟踪新任务结果"><title>按临停执行状态回流；不再宣称原泊车目标完成</title><rect x="180" y="1436" width="340" height="110" rx="6"/><text class="th" x="198" y="1460" text-anchor="start" dominant-baseline="central">跟踪新任务结果</text><text class="ts" x="198" y="1488" text-anchor="start" dominant-baseline="central">按临停执行状态回流</text><text class="ts" x="198" y="1507" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1526" text-anchor="start" dominant-baseline="central">不再宣称原泊车目标完成</text></g><g class="c-gray" role="link" tabindex="0" data-page="DR" data-flow="DR-change-flow" data-step="DR-change-9" aria-label="取消未证实，待处理"><title>停止自动推进新任务；失败/超时合同需补齐</title><rect x="180" y="1626" width="340" height="110" rx="6"/><text class="th" x="198" y="1650" text-anchor="start" dominant-baseline="central">取消未证实，待处理</text><text class="ts" x="198" y="1678" text-anchor="start" dominant-baseline="central">停止自动推进新任务</text><text class="ts" x="198" y="1697" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1716" text-anchor="start" dominant-baseline="central">失败/超时合同需补齐</text></g><text class="th" x="40" y="1820" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1850" text-anchor="start" dominant-baseline="central">E1 已有目的地泊车任务 → 用户改变停车目标：任务进行中</text><text class="ts" x="40" y="1883" text-anchor="start" dominant-baseline="central">E2 用户改变停车目标 → DT 交司机 Agent：变更而非新增</text><text class="ts" x="40" y="1916" text-anchor="start" dominant-baseline="central">E3 DT 交司机 Agent → 取消旧泊车要求：新目标 + 旧任务</text><text class="ts" x="40" y="1949" text-anchor="start" dominant-baseline="central">E4 取消旧泊车要求 → App 向 ADC 取消：取消指令</text><text class="ts" x="40" y="1982" text-anchor="start" dominant-baseline="central">E5 App 向 ADC 取消 → 取消是否成功：取消反馈</text><text class="ts" x="40" y="2015" text-anchor="start" dominant-baseline="central">E6 取消是否成功 → Navi 设置 POI 临停：已取消</text><text class="ts" x="40" y="2048" text-anchor="start" dominant-baseline="central">E7 取消是否成功 → 取消未证实，待处理：失败/超时/无结果</text><text class="ts" x="40" y="2081" text-anchor="start" dominant-baseline="central">E8 Navi 设置 POI 临停 → 跟踪新任务结果：新临停设置与真实执行</text></svg>