0" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="366" y="4230" width="115" height="44" rx="3" fill="#fff"/><text x="371" y="4254" font-size="15" fill="#435c70" font-weight="400"><tspan x="371" dy="0">运行/关闭通知</tspan></text><path d="M278,1344 L278,1382 L147,1382 L147,4308 L381,4308 L381,4370" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="2767" width="115" height="44" rx="3" fill="#fff"/><text x="40" y="2791" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">修改/取消通知</tspan></text><path d="M673,4106 L969,4106 L969,1887 L673,1887" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="976" y="4084" width="100" height="44" rx="3" fill="#fff"/><text x="981" y="4108" font-size="15" fill="#435c70" font-weight="400"><tspan x="981" dy="0">周期目标继续</tspan></text><path d="M473,1316 L1014,1316 L1014,1887 L673,1887" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1021" y="1294" width="100" height="44" rx="3" fill="#fff"/><text x="1026" y="1318" font-size="15" fill="#435c70" font-weight="400"><tspan x="1026" dy="0">更新后的规则</tspan></text><a href="#module/T/step/T01"><g data-step="T01"><rect x="283" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="283" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="303" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="303" dy="0">T01</tspan></text><text x="303" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="303" dy="0">转交需要等待的用户目标</tspan></text><text x="303" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="303" dy="0">Planner → 任务入口</tspan></text><text x="303" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="303" dy="0">用户目标及身份范围</tspan></text></g></a><a href="#module/T/step/T02"><g data-step="T02"><rect x="283" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="283" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="303" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="303" dy="0">T02</tspan></text><text x="303" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="303" dy="0">理解创建、修改或取消</tspan></text><text x="303" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="303" dy="0">TaskService</tspan></text><text x="303" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="303" dy="0">任务定义或已有任务操作</tspan></text></g></a><a href="#module/T/step/T03"><g data-step="T03"><rect x="348" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="348" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="368" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="368" dy="0">T03</tspan></text><text x="368" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="368" dy="0">校验并保存任务</tspan></text><text x="368" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="368" dy="0">TaskService</tspan></text><text x="368" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="368" dy="0">等待中的 Task</tspan></text></g></a><a href="#module/T/step/T04"><g data-step="T04"><rect x="348" y="1444" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="348" y="1444" width="5" height="182" rx="2" fill="#326785"/><text x="368" y="1473" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="368" dy="0">T04</tspan></text><text x="368" y="1505" font-size="20" fill="#203b50" font-weight="600"><tspan x="368" dy="0">注册时间或条件规则</tspan></text><text x="368" y="1547" font-size="16" fill="#375b71" font-weight="400"><tspan x="368" dy="0">TaskService → Trigger</tspan></text><text x="368" y="1586" font-size="16" fill="#566975" font-weight="400"><tspan x="368" dy="0">有效规则与创建结果</tspan></text></g></a><a href="#module/T/step/T05"><g data-step="T05"><rect x="283" y="1862" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="283" y="1862" width="5" height="182" rx="2" fill="#326785"/><text x="303" y="1891" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="303" dy="0">T05</tspan></text><text x="303" y="1923" font-size="20" fill="#203b50" font-weight="600"><tspan x="303" dy="0">到点或条件命中</tspan></text><text x="303" y="1965" font-size="16" fill="#375b71" font-weight="400"><tspan x="303" dy="0">Trigger → TaskService</tspan></text><text x="303" y="2004" font-size="16" fill="#566975" font-weight="400"><tspan x="303" dy="0">关联任务的触发回调</tspan></text></g></a><a href="#module/T/step/T06"><g data-step="T06"><rect x="283" y="2280" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="283" y="2280" width="5" height="182" rx="2" fill="#326785"/><text x="303" y="2309" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="303" dy="0">T06</tspan></text><text x="303" y="2341" font-size="20" fill="#203b50" font-weight="600"><tspan x="303" dy="0">检查本轮能否执行</tspan></text><text x="303" y="2383" font-size="16" fill="#375b71" font-weight="400"><tspan x="303" dy="0">TaskService</tspan></text><text x="303" y="2422" font-size="16" fill="#566975" font-weight="400"><tspan x="303" dy="0">运行中的 Run 或跳过结果</tspan></text></g></a><a href="#module/T/step/T07"><g data-step="T07"><rect x="218" y="2698" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="218" y="2698" width="5" height="182" rx="2" fill="#326785"/><text x="238" y="2727" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="238" dy="0">T07</tspan></text><text x="238" y="2759" font-size="20" fill="#203b50" font-weight="600"><tspan x="238" dy="0">让任务重新进入主对话</tspan></text><text x="238" y="2801" font-size="16" fill="#375b71" font-weight="400"><tspan x="238" dy="0">Recommend / Frontier → 车端 → 主链路</tspan></text><text x="238" y="2840" font-size="16" fill="#566975" font-weight="400"><tspan x="238" dy="0">带任务关联的新一轮输入</tspan></text></g></a><a href="#module/T/step/T08"><g data-step="T08"><rect x="218" y="3116" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="218" y="3116" width="5" height="182" rx="2" fill="#326785"/><text x="238" y="3145" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="238" dy="0">T08</tspan></text><text x="238" y="3177" font-size="20" fill="#203b50" font-weight="600"><tspan x="238" dy="0">结合当前上下文执行本轮</tspan></text><text x="238" y="3219" font-size="16" fill="#375b71" font-weight="400"><tspan x="238" dy="0">Planner → Agent / Tool</tspan></text><text x="238" y="3258" font-size="16" fill="#566975" font-weight="400"><tspan x="238" dy="0">执行决定及工具请求</tspan></text></g></a><a href="#module/T/step/T09"><g data-step="T09"><rect x="218" y="3534" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="218" y="3534" width="5" height="182" rx="2" fill="#326785"/><text x="238" y="3563" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="238" dy="0">T09</tspan></text><text x="238" y="3595" font-size="20" fill="#203b50" font-weight="600"><tspan x="238" dy="0">把本轮实际结果写回</tspan></text><text x="238" y="3637" font-size="16" fill="#375b71" font-weight="400"><tspan x="238" dy="0">主链路 → TaskService</tspan></text><text x="238" y="3676" font-size="16" fill="#566975" font-weight="400"><tspan x="238" dy="0">本轮成功、失败等结果</tspan></text></g></a><a href="#module/T/step/T10"><g data-step="T10"><rect x="283" y="3952" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="283" y="3952" width="5" height="182" rx="2" fill="#326785"/><text x="303" y="3981" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="303" dy="0">T10</tspan></text><text x="303" y="4013" font-size="20" fill="#203b50" font-weight="600"><tspan x="303" dy="0">决定继续等待还是结束</tspan></text><text x="303" y="4055" font-size="16" fill="#375b71" font-weight="400"><tspan x="303" dy="0">TaskService</tspan></text><text x="303" y="4094" font-size="16" fill="#566975" font-weight="400"><tspan x="303" dy="0">等待或关闭状态</tspan></text></g></a><a href="#module/T/step/T11"><g data-step="T11"><rect x="83" y="1162" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="83" y="1162" width="5" height="182" rx="2" fill="#326785"/><text x="103" y="1191" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="103" dy="0">T11</tspan></text><text x="103" y="1223" font-size="20" fill="#203b50" font-weight="600"><tspan x="103" dy="0">更新或取消已有目标</tspan></text><text x="103" y="1265" font-size="16" fill="#375b71" font-weight="400"><tspan x="103" dy="0">TaskService → Trigger</tspan></text><text x="103" y="1304" font-size="16" fill="#566975" font-weight="400"><tspan x="103" dy="0">更新结果或关闭结果</tspan></text></g></a><a href="#module/T/step/T12"><g data-step="T12"><rect x="283" y="4370" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="283" y="4370" width="5" height="182" rx="2" fill="#326785"/><text x="303" y="4399" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="303" dy="0">T12</tspan></text><text x="303" y="4431" font-size="20" fill="#203b50" font-weight="600"><tspan x="303" dy="0">通知并查询当前任务状态</tspan></text><text x="303" y="4473" font-size="16" fill="#375b71" font-weight="400"><tspan x="303" dy="0">TaskService → 车端</tspan></text><text x="303" y="4512" font-size="16" fill="#566975" font-weight="400"><tspan x="303" dy="0">用户可见的任务状态</tspan></text></g></a></g></svg>