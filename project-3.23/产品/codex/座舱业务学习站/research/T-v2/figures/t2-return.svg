<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="t2-return" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="t2-return-title t2-return-desc">
<title id="t2-return-title">到点以后，建议怎样回到 Planner</title><desc id="t2-return-desc">触发器判断原条件；任务服务检查这次回调能不能执行，并保留任务、运行与推荐的关联。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="t2-return-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">到点以后，建议怎样回到 Planner</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">触发器判断原条件；任务服务检查这次回调能不能执行，并保留任务、运行与推荐的关联。</text>
<g data-node="true" id="t2-return-hit"><rect class="v56-cloud" x="40" y="150" width="330" height="160" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="178" text-anchor="start">触发器命中</text>
<text class="v56-node-sub" x="54" y="206" text-anchor="start">等待条件满足（G 章）</text>
<text class="v56-node-sub" x="54" y="230" text-anchor="start">例如到了 15:30</text>
</g>
<g data-node="true" id="t2-return-callback"><rect class="v56-cloud" x="435" y="150" width="330" height="160" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="178" text-anchor="start">回调任务服务</text>
<text class="v56-node-sub" x="449" y="206" text-anchor="start">带任务编号、回调编号</text>
<text class="v56-node-sub" x="449" y="230" text-anchor="start">任务服务不重判原条件</text>
</g>
<path class="v56-arrow" d="M 370 230 L 435 230" marker-end="url(#t2-return-arr)"/>
<g data-node="true" id="t2-return-valid"><rect class="v56-decision" x="830" y="150" width="330" height="160" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="178" text-anchor="start">有效性检查</text>
<text class="v56-node-sub" x="844" y="206" text-anchor="start">任务还在吗；取消或过期了吗</text>
<text class="v56-node-sub" x="844" y="230" text-anchor="start">回调是不是重复</text>
</g>
<path class="v56-arrow" d="M 765 230 L 830 230" marker-end="url(#t2-return-arr)"/>
<g data-node="true" id="t2-return-check"><rect class="v56-decision" x="40" y="440" width="330" height="160" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="468" text-anchor="start">执行前检查</text>
<text class="v56-node-sub" x="54" y="496" text-anchor="start">例如：座位上有人吗</text>
<text class="v56-node-sub" x="54" y="520" text-anchor="start">无人则跳过这一轮按摩</text>
</g>
<g data-node="true" id="t2-return-run"><rect class="v56-cloud" x="435" y="440" width="330" height="160" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="468" text-anchor="start">生成一次运行</text>
<text class="v56-node-sub" x="449" y="496" text-anchor="start">先生成推荐编号</text>
<text class="v56-node-sub" x="449" y="520" text-anchor="start">并保存推荐关联</text>
</g>
<path class="v56-arrow" d="M 370 520 L 435 520" marker-end="url(#t2-return-arr)"/>
<g data-node="true" id="t2-return-frontier"><rect class="v56-local" x="830" y="440" width="330" height="160" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="468" text-anchor="start">Frontier 推到车上</text>
<text class="v56-node-sub" x="844" y="496" text-anchor="start">云到车的长连接通道</text>
<text class="v56-node-sub" x="844" y="520" text-anchor="start">把建议与推荐编号交给车端</text>
</g>
<path class="v56-arrow" d="M 765 520 L 830 520" marker-end="url(#t2-return-arr)"/>
<g data-node="true" id="t2-return-upload"><rect class="v56-local" x="40" y="730" width="330" height="160" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="758" text-anchor="start">车上带推荐编号上行</text>
<text class="v56-node-sub" x="54" y="786" text-anchor="start">用推荐编号还原任务和运行</text>
<text class="v56-node-sub" x="54" y="810" text-anchor="start">回到 Planner 主链</text>
</g>
<g data-node="true" id="t2-return-queue"><rect class="v56-cloud" x="435" y="730" width="330" height="160" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="758" text-anchor="start">输入管理排队（M 章）</text>
<text class="v56-node-sub" x="449" y="786" text-anchor="start">作为一条 Advisor 输入</text>
<text class="v56-node-sub" x="449" y="810" text-anchor="start">同一次运行重复回流只算一次</text>
</g>
<path class="v56-arrow" d="M 370 810 L 435 810" marker-end="url(#t2-return-arr)"/>
<g data-node="true" id="t2-return-planner"><rect class="v56-decision" x="830" y="730" width="330" height="160" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="758" text-anchor="start">Planner 处理这条建议</text>
<text class="v56-node-sub" x="844" y="786" text-anchor="start">结合当下情况</text>
<text class="v56-node-sub" x="844" y="810" text-anchor="start">决定说什么、做什么</text>
</g>
<path class="v56-arrow" d="M 765 810 L 830 810" marker-end="url(#t2-return-arr)"/>
<path class="v56-arrow" d="M 1160 230 L 1180 230 L 1180 380 L 20 380 L 20 520 L 40 520" marker-end="url(#t2-return-arr)"/>
<path class="v56-arrow" d="M 1160 520 L 1180 520 L 1180 670 L 20 670 L 20 810 L 40 810" marker-end="url(#t2-return-arr)"/>
<text class="v56-risk" x="830" y="344" text-anchor="start">检查不过 → 拦截；不复活已关闭任务</text>
<text class="v56-risk" x="40" y="634" text-anchor="start">执行前不满足 → 跳过这一轮</text>
<text class="v56-subtitle" x="40" y="948" text-anchor="start">循环任务每次有效触发生成新运行；提醒打断还是排队，要产品预先定。</text>
<path class="v56-rule" d="M 32 982 L 1168 982"/>
<text class="v56-node-title" x="32" y="1018" text-anchor="start">建议进了 Planner，还要继续核对车上实际说了什么、做了什么。</text>
<rect data-decoration="true" class="v56-cloud" x="32.0" y="1046" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1060" text-anchor="start">绿：回调、关联与排队</text>
<rect data-decoration="true" class="v56-local" x="316.0" y="1046" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="1060" text-anchor="start">蓝：云车传递</text>
<rect data-decoration="true" class="v56-decision" x="600.0" y="1046" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="1060" text-anchor="start">黄：校验与当下决策</text>
<rect data-decoration="true" class="v56-reject" x="884.0" y="1046" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="1060" text-anchor="start">红字：拦截或跳过</text>
</svg>
