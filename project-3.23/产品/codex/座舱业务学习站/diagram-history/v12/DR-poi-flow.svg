  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">POI 临停：路线点成功后，才能加“到这里要停”的属性</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,220 350,286" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-1 → DR-poi-2：本轮 + 前序任务</title></polyline><polyline class="arr" fill="none" points="350,410 350,476" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-2 → DR-poi-3：改写后专项诉求</title></polyline><polyline class="arr" fill="none" points="350,600 350,666" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-3 → DR-poi-4：先导航</title></polyline><polyline class="arr" fill="none" points="350,790 350,856" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-4 → DR-poi-5：读取添加结果</title></polyline><polyline class="arr" fill="none" points="350,980 350,1046" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-5 → DR-poi-6：成功后才设临停</title></polyline><polyline class="arr" fill="none" points="176,910 80,910 80,1884 170,1884" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-5 → DR-poi-10：失败/无成功证据</title></polyline><polyline class="arr" fill="none" points="350,1170 350,1236" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-6 → DR-poi-7：属性设置成功</title></polyline><polyline class="arr" fill="none" points="176,1100 100,1100 100,1908 170,1908" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-6 → DR-poi-10：属性失败不能说已设好</title></polyline><polyline class="arr" fill="none" points="350,1360 350,1426" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-7 → DR-poi-8：同步路线和停靠意图</title></polyline><polyline class="arr" fill="none" points="350,1550 350,1616" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-8 → DR-poi-9：真实执行状态</title></polyline><polyline class="arr" fill="none" points="176,1860 130,1860 130,1692 170,1692" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-10 → DR-poi-9：失败原因</title></polyline><text class="ts" x="365" y="256" text-anchor="start" dominant-baseline="central">E1 · 本轮 + 前序任务</text><text class="ts" x="365" y="446" text-anchor="start" dominant-baseline="central">E2 · 改写后专项诉求</text><text class="ts" x="365" y="636" text-anchor="start" dominant-baseline="central">E3 · 先导航</text><text class="ts" x="365" y="826" text-anchor="start" dominant-baseline="central">E4 · 读取添加结果</text><text class="ts" x="365" y="1016" text-anchor="start" dominant-baseline="central">E5 · 成功后才设临停</text><text class="ts" x="168" y="902" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="168" y="1896" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="365" y="1206" text-anchor="start" dominant-baseline="central">E7 · 属性设置成功</text><text class="ts" x="168" y="1092" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="168" y="1920" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="365" y="1396" text-anchor="start" dominant-baseline="central">E9 · 同步路线和停靠意图</text><text class="ts" x="365" y="1586" text-anchor="start" dominant-baseline="central">E10 · 真实执行状态</text><text class="ts" x="168" y="1852" text-anchor="end" dominant-baseline="central">E11</text><text class="ts" x="168" y="1704" text-anchor="end" dominant-baseline="central">E11</text><g class="c-gray" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-1" aria-label="用户说明路线和停靠"><title>先去 A、再去 B；A 要靠边停</title><rect x="180" y="106" width="340" height="110" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">用户说明路线和停靠</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">先去 A、再去 B</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central">A 要靠边停</text></g><text class="anno" x="540" y="130" text-anchor="start" dominant-baseline="central">识别完整任务</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-2" aria-label="DT 保留完整目标"><title>不能只留下新地点；交司机 Agent</title><rect x="180" y="296" width="340" height="110" rx="6"/><text class="th" x="198" y="320" text-anchor="start" dominant-baseline="central">DT 保留完整目标</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">不能只留下新地点</text><text class="ts" x="198" y="367" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central">交司机 Agent</text></g><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-3" aria-label="专项层拆成两任务"><title>导航点/顺序；指定点的临停要求</title><rect x="180" y="486" width="340" height="110" rx="6"/><text class="th" x="198" y="510" text-anchor="start" dominant-baseline="central">专项层拆成两任务</text><text class="ts" x="198" y="538" text-anchor="start" dominant-baseline="central">导航点/顺序</text><text class="ts" x="198" y="557" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="576" text-anchor="start" dominant-baseline="central">指定点的临停要求</text></g><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-4" aria-label="Navi 算路并加点"><title>调用系统导航；先取得点添加成功反馈</title><rect x="180" y="676" width="340" height="110" rx="6"/><text class="th" x="198" y="700" text-anchor="start" dominant-baseline="central">Navi 算路并加点</text><text class="ts" x="198" y="728" text-anchor="start" dominant-baseline="central">调用系统导航</text><text class="ts" x="198" y="747" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="766" text-anchor="start" dominant-baseline="central">先取得点添加成功反馈</text></g><text class="anno" x="540" y="700" text-anchor="start" dominant-baseline="central">先完成导航点</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-5" aria-label="该点是否成功存在"><title>核 POI 身份与顺序；没有成功，不进临停设置</title