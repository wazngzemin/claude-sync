<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#839bb6"/></marker></defs><rect x="0" y="0" width="1700" height="1150" rx="0" fill="#f5f8fc" stroke="#f5f8fc" stroke-width="1.5"/><rect x="0" y="0" width="1700" height="75" rx="0" fill="#193957" stroke="#193957" stroke-width="1.5"/><text x="28" y="48" font-size="26" fill="#fff" font-weight="600">豆包汽车 · 触发器场景配置</text><text x="1210" y="46" font-size="20" fill="#d5e5f5" font-weight="400">方案原型 · 非真实后台截图</text><rect x="0" y="75" width="225" height="1075" rx="0" fill="#fff" stroke="#dce5ef" stroke-width="1.5"/><text x="26" y="125" font-size="22" fill="#20364d" font-weight="500">场景管理</text><rect x="14" y="153" width="196" height="52" rx="6" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="1.5"/><text x="30" y="185" font-size="21" fill="#2469d6" font-weight="500">场景列表</text><text x="30" y="250" font-size="21" fill="#20364d" font-weight="400">触发记录</text><text x="30" y="315" font-size="21" fill="#20364d" font-weight="400">公共能力</text><text x="265" y="121" font-size="30" fill="#173a61" font-weight="600">P3 Workflow：儿童条件与宠物推理组合判断</text><text x="265" y="159" font-size="19" fill="#667b91" font-weight="400">① 添加真实判断节点 → ② 连线 → ③ 选中节点配置 → ④ 校验保存</text><rect x="260" y="190" width="885" height="790" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><rect x="1170" y="190" width="490" height="790" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><rect x="278" y="209" width="160" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="296" y="238" font-size="20" fill="#2469d6" font-weight="500">＋ 条件节点</text><rect x="456" y="209" width="186" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="474" y="238" font-size="20" fill="#2469d6" font-weight="500">＋ 模型推理节点</text><text x="682" y="238" font-size="20" fill="#667b91" font-weight="400">儿童 / 宠物保护</text><line x1="675" y1="382" x2="675" y2="435" stroke="#a6b7c9" stroke-width="2"/><polyline points="675,435 465,435 465,492" fill="none" stroke="#a6b7c9" stroke-width="2" marker-end="url(#arrow)"/><polyline points="675,435 893,435 893,492" fill="none" stroke="#a6b7c9" stroke-width="2" marker-end="url(#arrow)"/><polyline points="465,632 465,694 675,694 675,747" fill="none" stroke="#a6b7c9" stroke-width="2" marker-end="url(#arrow)"/><polyline points="893,632 893,694 675,694 675,747" fill="none" stroke="#a6b7c9" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="284" width="470" height="98" rx="6" fill="#eff5ff" stroke="#8fb3e3" stroke-width="1.5"/><text x="460" y="317" font-size="23" fill="#173a61" font-weight="600">N1 公共前置条件</text><text x="460" y="348" font-size="18" fill="#405873" font-weight="400">本任务有效；档位变为 D</text><text x="460" y="374" font-size="18" fill="#405873" font-weight="400">动态条件的启动范围需按场景策略确认</text><rect x="285" y="492" width="350" height="140" rx="6" fill="#fff" stroke="#a9bed6" stroke-width="1.5"/><text x="305" y="527" font-size="23" fill="#173a61" font-weight="600">N2 后排儿童条件</text><text x="305" y="563" font-size="20" fill="#405873" font-weight="400">舱内低频视觉 · 位置＋年龄</text><text x="305" y="591" font-size="20" fill="#405873" font-weight="400">同一对象位于后排</text><text x="305" y="619" font-size="20" fill="#405873" font-weight="400">且年龄属于婴儿 / 儿童</text><rect x="718" y="492" width="350" height="140" rx="6" fill="#fff" stroke="#a9bed6" stroke-width="1.5"/><text x="738" y="527" font-size="23" fill="#173a61" font-weight="600">N3 后排宠物推理</text><text x="738" y="563" font-size="20" fill="#405873" font-weight="400">输入：已有 Objects 描述</text><text x="738" y="591" font-size="20" fill="#405873" font-weight="400">目标：后排是否存在宠物</text><text x="738" y="619" font-size="20" fill="#405873" font-weight="400">不调用 DT / VQA 获取新画面</text><rect x="440" y="747" width="470" height="137" rx="6" fill="#eaf2ff" stroke="#2469d6" stroke-width="1.5"/><text x="460" y="782" font-size="23" fill="#173a61" font-weight="600">N4 儿童锁仍未开启</text><text x="460" y="818" font-size="20" fill="#405873" font-weight="400">前驱汇合：任一满足 OR</text><text x="460" y="846" font-size="20" fill="#405873" font-weight="400">自身条件：目标位置儿童锁 = 关闭</text><text x="460" y="874" font-size="20" fill="#405873" font-weight="400">本图唯一终点；结果取本节点</text><text x="1188" y="227" font-size="23" fill="#173a61" font-weight="600">③ 节点属性 · N4</text><text x="1188" y="277" font-size="20" fill="#20364d" font-weight="500">节点名称</text><rect x="1188" y="292" width="448" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="1203" y="322" font-size="20" fill="#20364d" font-weight="400">儿童锁仍未开启</text><text x="1188" y="374" font-size="20" fill="#20364d" font-weight="500">判断类型</text><rect x="1188" y="389" width="448" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="1203" y="419" font-size="20" fill="#20364d" font-weight="400">条件判断</text><text x="1188" y="479" font-size="20" fill="#20364d" font-weight="500">直接前驱的关系</text><rect x="1188" y="498" width="192" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="1206" y="527" font-size="20" fill="#2469d6" font-weight="500">全部满足 AND</text><rect x="1393" y="498" width="241" height="44" rx="6" fill="#2469d6" stroke="#2469d6" stroke-width="1.5"/><text x="1411" y="527" font-size="20" fill="#fff" font-weight="500">任一满足 OR</text><text x="1188" y="573" font-size="18" fill="#667b91" font-weight="400">仅直接前驱 ≥ 2 时允许 OR。</text><text x="1188" y="623" font-size="20" fill="#20364d" font-weight="500">本节点自身条件</text><rect x="1188" y="638" width="448" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="1203" y="668" font-size="20" fill="#20364d" font-weight="400">目标位置儿童锁状态 = 关闭</text><rect x="1188" y="727" width="448" height="106" rx="6" fill="#eff5ff" stroke="#a8c8f4" stroke-width="1.5"/><text x="1204" y="759" font-size="18" fill="#315b8d" font-weight="400">OR 只决定何时可以检查 N4。</text><text x="1204" y="787" font-size="18" fill="#315b8d" font-weight="400">N4 仍要判断儿童锁是否关闭。</text><text x="1204" y="815" font-size="18" fill="#315b8d" font-weight="400">不能把“任一分支满足”直接当车控许可。</text><rect x="278" y="913" width="850" height="78" rx="6" fill="#eff5ff" stroke="#a8c8f4" stroke-width="1.5"/><text x="294" y="945" font-size="18" fill="#315b8d" font-weight="400">① 节点只支持条件 / 模型判断，不提供空汇合、卡片或车控节点。</text><text x="294" y="973" font-size="18" fill="#315b8d" font-weight="400">所有节点必须可达、无环且只留一个终点；既有 Workflow 暂不可直接编辑。</text><rect x="260" y="1004" width="1030" height="78" rx="6" fill="#fff3f1" stroke="#e6a29a" stroke-width="1.5"/><text x="276" y="1036" font-size="18" fill="#aa3e32" font-weight="400">④ 校验错误示例（未保存状态）：N3 未选择推理输入信号。</text><text x="276" y="1064" font-size="18" fill="#aa3e32" font-weight="400">错误列表一次展示全部问题；点击“N3”定位属性；失败不生成可用 Workflow ID。</text><rect x="1320" y="1024" width="156" height="44" rx="6" fill="#2469d6" stroke="#2469d6" stroke-width="1.5"/><text x="1338" y="1053" font-size="20" fill="#fff" font-weight="500">校验并保存</text><rect x="1490" y="1024" width="170" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="1508" y="1053" font-size="20" fill="#2469d6" font-weight="500">取消 / 返回</text></svg>
