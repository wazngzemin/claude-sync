<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="被打断以后：停、记、交回 DT，由 DT 决定补不补"><title>被打断以后：停、记、交回 DT，由 DT 决定补不补</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="760" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">被打断以后：停、记、交回 DT，由 DT 决定补不补</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">停播原因按“能否恢复”分组（语音基础体验 OnePager）；恢复分两条路（DT PRD）</text><rect x="30" y="300" width="220" height="110" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="327" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">豆包正在播报</text><text x="44" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上一直在收音</text><rect x="300" y="120" width="360" height="200" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="314" y="147" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">停了，可以恢复</text><text x="314" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">流式拒识判断在跟豆包说</text><text x="314" y="193" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">多人时以“豆包”开头</text><text x="314" y="214" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">云端确认这句没被拒识</text><rect x="300" y="380" width="360" height="230" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="314" y="407" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">停了，直接结束（不恢复）</text><text x="314" y="432" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">更高优先级的新播报</text><text x="314" y="453" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车机挂起；第三方停止播放</text><text x="314" y="474" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">播放离线车控的执行结果</text><text x="314" y="495" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">退出对话（回到静默）</text><text x="314" y="516" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">单人时说超过两个字</text><path d="M250,340 L275,340 L275,220 L300,220" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M250,370 L275,370 L275,495 L300,495" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="720" y="110" width="440" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="734" y="137" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">插话判为“不是对豆包说”</text><text x="734" y="162" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已说 + 没说完 包成一条事件</text><text x="734" y="183" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">单独交给 DT</text><rect x="720" y="250" width="440" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="734" y="277" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">插话是对豆包说的</text><text x="734" y="302" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没说完的旧话术</text><text x="734" y="323" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">和新话一起交给 DT</text><path d="M660,190 L720,165" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M660,250 L720,305" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="720" y="420" width="440" height="190" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="734" y="447" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">DT 决定补不补</text><text x="734" y="472" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没实质信息 / 用户不想听：不补</text><text x="734" y="493" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只剩执行结果确认：不补</text><text x="734" y="514" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">有实质信息：补关键的</text><text x="734" y="535" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">与新话题相关：合成一个回答</text><text x="734" y="556" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">长内容：只提炼核心</text><path d="M1170,165 L1185,165 L1185,515 L1160,515" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M940,360 L940,420" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="650" width="1130" height="80" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="44" y="677" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">切“说到哪了”靠打轴：没有打轴时估算</text><text x="44" y="702" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">9 月 Planner OnePage：每字约 100 毫秒；赛力斯通话链路：“1s 5字”兜底（10/27）</text></g></svg>