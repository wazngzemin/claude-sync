<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="遇到“没反应”，沿同一条请求找到第一次偏离" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-triage" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">遇到“没反应”，沿同一条请求找到第一次偏离</text><text x="30" y="58" font-size="13" fill="#5f7169">培训排查方法 · 不凭现象直接判模型问题</text><g transform="translate(0,78)"><path class="flow-edge" data-from="audio" data-to="words" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-triage)"/><path class="flow-edge" data-from="words" data-to="route" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-triage)"/><path class="flow-edge" data-from="route" data-to="context" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-triage)"/><path class="flow-edge" data-from="context" data-to="action" d="M700,260.0 L610,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-triage)"/><path class="flow-edge" data-from="action" data-to="result" d="M370,260.0 L280,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-triage)"/><path class="flow-edge" data-from="result" data-to="voice" d="M160.0,306 L160.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-triage)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">完整再往下查</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">文字正确</text><text x="829.0" y="176.0" 