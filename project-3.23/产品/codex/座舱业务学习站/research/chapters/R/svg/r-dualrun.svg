<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-label="激活后两路同时跑：车上一份、云端一份，各自交出什么"><title>激活后两路同时跑：车上一份、云端一份，各自交出什么</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="770" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">激活后两路同时跑：车上一份、云端一份，各自交出什么</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">赛力斯：唤醒后和延时聆听 30 秒内都这样跑</text><rect x="400" y="92" width="400" height="66" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="414" y="119" font-size="16" fill="#22384a" font-weight="650" text-anchor="start">判停结束：两路同时开始</text><text x="414" y="144" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同一段声音，车上和云端各算一份</text><path d="M520,158 L520,174 L300,174 L300,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M680,158 L680,174 L900,174 L900,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="194" width="560" height="416" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="218" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上</text><rect x="610" y="194" width="560" height="416" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="624" y="218" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端（V 章已讲）</text><rect x="50" y="230" width="520" height="90" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="257" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上识别出字</text><text x="64" y="282" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">赛力斯：豆包离线识别；上汽：思必驰离线识别</text><rect x="50" y="340" width="520" height="90" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="367" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">先查固定说法（研发叫干预缓存）</text><text x="64" y="392" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">命中：直接给出执行指令，不再问模型</text><rect x="50" y="450" width="520" height="140" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="477" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">没命中：问车上 1.7B 模型</text><text x="64" y="502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">能办：翻成执行指令</text><text x="64" y="523" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不该接：不是对豆包说的</text><text x="64" y="544" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">办不了：是有效需求，但车上做不了</text><rect x="630" y="230" width="520" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="644" y="257" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">云端识别</text><text x="644" y="282" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">两遍识别，给出定稿文字</text><rect x="630" y="340" width="520" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="644" y="367" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">云端拒识</text><text x="644" y="392" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">判断是不是在跟豆包说</text><rect x="630" y="450" width="520" height="140" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="644" y="477" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 推理</text><text x="644" y="502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">决定说什么、调什么工具</text><text x="644" y="523" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">网络差时可能迟迟不回</text><path d="M300,320 L300,340" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M300,430 L300,450" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M900,320 L900,340" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M900,430 L900,450" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,590 L310,620 L500,620 L500,645" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M890,590 L890,620 L700,620 L700,645" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="250" y="645" width="700" height="100" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="264" y="672" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">采信：决定用谁的结果（第四段）</text><text x="264" y="697" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">屏幕上最终定格的字、豆包的状态，</text><text x="264" y="718" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">都跟被采用的那一份走</text></g></svg>