<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2350">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1680" height="2350" fill="#ECECEC"/>

  <!-- header -->
  <text x="60" y="92" font-size="52" font-weight="bold" fill="#0D4FA8">触发器全链路</text>
  <text x="60" y="138" font-size="20" fill="#0D4FA8">感知上行 → query 四路分流 → 5 秒扫描判定 → 事件叫醒 Advisor → 执行与回流</text>

  <!-- legend -->
  <rect x="60" y="168" width="22" height="22" fill="#185DB7"/>
  <text x="92" y="186" font-size="18" fill="#0D4FA8">泽民负责</text>
  <rect x="200" y="168" width="22" height="22" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="232" y="186" font-size="18" fill="#0D4FA8">协作方（标负责人）</text>
  <rect x="450" y="168" width="22" height="22" fill="#8E9179"/>
  <text x="482" y="186" font-size="18" fill="#0D4FA8">数据源 / 输入</text>
  <circle cx="672" cy="179" r="13" fill="#8E9179"/>
  <text x="672" y="185" font-size="16" font-weight="bold" fill="#F4F2EE" text-anchor="middle">卡</text>
  <text x="696" y="186" font-size="18" fill="#0D4FA8">卡点（待解阻塞）</text>

  <!-- ===== Section 1: 感知上行流 ===== -->
  <rect x="60" y="240" width="690" height="52" fill="#185DB7"/>
  <text x="84" y="275" font-size="24" font-weight="bold" fill="#F4F2EE">① 感知上行流 —— 车和摄像头把状态持续送上云</text>
  <text x="60" y="322" font-size="18" fill="#0D4FA8">传感器 / VLM 视觉（视觉大模型）/ 外部数据三方汇入「云端 Context」—— 触发器只读这本记事本，不碰传感器（解耦）</text>

  <!-- r1 -->
  <rect x="60" y="360" width="240" height="84" fill="#8E9179"/>
  <text x="180" y="398" font-size="20" font-weight="bold" fill="#F4F2EE" text-anchor="middle">车状态信号</text>
  <text x="180" y="428" font-size="16" fill="#F4F2EE" text-anchor="middle">传感器 · CAN 总线｜车厂</text>
  <line x1="300" y1="402" x2="380" y2="402" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="380" y="360" width="240" height="84" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="500" y="398" font-size="20" font-weight="bold" fill="#0D4FA8" text-anchor="middle">端状态客户端</text>
  <text x="500" y="428" font-size="16" fill="#185DB7" text-anchor="middle">李鑫｜纯透传 · 不存储</text>

  <!-- r2 -->
  <rect x="60" y="470" width="240" height="84" fill="#8E9179"/>
  <text x="180" y="508" font-size="20" font-weight="bold" fill="#F4F2EE" text-anchor="middle">VLM 视觉</text>
  <text x="180" y="538" font-size="16" fill="#F4F2EE" text-anchor="middle">AIBox 端模｜丁彬 · 兰若</text>
  <line x1="300" y1="512" x2="380" y2="512" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="380" y="470" width="240" height="84" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="500" y="508" font-size="20" font-weight="bold" fill="#0D4FA8" text-anchor="middle">端侧信号库</text>
  <text x="500" y="538" font-size="16" fill="#185DB7" text-anchor="middle">仁杰｜统一键值格式</text>

  <!-- r3 -->
  <rect x="60" y="580" width="240" height="84" fill="#8E9179"/>
  <text x="180" y="618" font-size="20" font-weight="bold" fill="#F4F2EE" text-anchor="middle">外部数据</text>
  <text x="180" y="648" font-size="16" fill="#F4F2EE" text-anchor="middle">天气 · 兴趣点 · 时间 · 记忆</text>
  <rect x="380" y="580" width="240" height="84" fill="#185DB7"/>
  <text x="500" y="614" font-size="20" font-weight="bold" fill="#F4F2EE" text-anchor="middle">端侧触发器｜SLS 开关</text>
  <text x="500" y="644" font-size="16" fill="#F4F2EE" text-anchor="middle">泽民｜点火：启动周期推理</text>
  <line x1="500" y1="580" x2="500" y2="558" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- convergence -->
  <polyline points="620,402 900,402 900,470" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="620" y1="512" x2="780" y2="512" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="180,664 180,706 900,706 900,554" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="780" y="470" width="240" height="84" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="900" y="508" font-size="20" font-weight="bold" fill="#0D4FA8" text-anchor="middle">云端信号库（全集）</text>
  <text x="900" y="538" font-size="16" fill="#185DB7" text-anchor="middle">仁杰｜端信号 + 外部数据</text>
  <line x1="1020" y1="512" x2="1100" y2="512" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1100" y="470" width="220" height="84" fill="#F4F2EE" stroke="#8E9179" stroke-width="3"/>
  <text x="1210" y="508" font-size="18" font-weight="bold" fill="#0D4FA8" text-anchor="middle">AI service 数据中心</text>
  <text x="1210" y="538" font-size="16" fill="#185DB7" text-anchor="middle">赵衍｜还没立项</text>
  <circle cx="1100" cy="470" r="18" fill="#8E9179"/>
  <text x="1100" y="476" font-size="18" font-weight="bold" fill="#F4F2EE" text-anchor="middle">卡</text>
  <text x="1210" y="584" font-size="16" fill="#0D4FA8" text-anchor="middle">卡 C2：端不存、透传不存 → 谁存「前一帧」？</text>

  <line x1="1320" y1="512" x2="1400" y2="512" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1400" y="470" width="220" height="84" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="4"/>
  <text x="1510" y="508" font-size="20" font-weight="bold" fill="#0D4FA8" text-anchor="middle">云端 Context</text>
  <text x="1510" y="538" font-size="16" fill="#185DB7" text-anchor="middle">仁杰｜全局事实源</text>
  <text x="1510" y="584" font-size="16" fill="#0D4FA8" text-anchor="middle">只存当前值 · 不主动通知</text>

  <!-- ===== Section 2: query 下行流 ===== -->
  <rect x="60" y="740" width="590" height="52" fill="#185DB7"/>
  <text x="84" y="775" font-size="24" font-weight="bold" fill="#F4F2EE">② query 下行流 —— 用户说话，先分四路</text>
  <text x="60" y="825" font-size="18" fill="#0D4FA8">四路里只有「条件话」进触发器：产品预设走「注册」，用户临时说的走「拼 SP」</text>

  <rect x="60" y="912" width="160" height="64" fill="#8E9179"/>
  <text x="140" y="952" font-size="20" font-weight="bold" fill="#F4F2EE" text-anchor="middle">用户语音</text>
  <line x1="220" y1="944" x2="260" y2="944" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="260" y="912" width="160" height="64" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="340" y="940" font-size="18" font-weight="bold" fill="#0D4FA8" text-anchor="middle">ASR 转文字</text>
  <text x="340" y="966" font-size="16" fill="#185DB7" text-anchor="middle">端 · 丁彬</text>
  <line x1="420" y1="944" x2="460" y2="944" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="460" y="912" width="180" height="64" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="550" y="940" font-size="18" font-weight="bold" fill="#0D4FA8" text-anchor="middle">⑨ 拒识分流</text>
  <text x="550" y="966" font-size="16" fill="#185DB7" text-anchor="middle">意图 · 斯华</text>

  <!-- four branches -->
  <polyline points="640,944 700,944 700,862 760,862" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="640" y1="944" x2="760" y2="944" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="640,944 700,944 700,1026 760,1026" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="640,944 700,944 700,1108 760,1108" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="760" y="830" width="260" height="64" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="784" y="858" font-size="18" font-weight="bold" fill="#0D4FA8">① 车控（fc 协议）</text>
  <text x="784" y="884" font-size="16" fill="#185DB7">「开车窗」→ 离线fc直执</text>

  <rect x="760" y="912" width="260" height="64" fill="#F4F2EE" stroke="#185DB7" stroke-width="4"/>
  <text x="784" y="940" font-size="18" font-weight="bold" fill="#185DB7">② 条件话</text>
  <text x="784" y="966" font-size="16" fill="#185DB7">「超25度开空调」→ ⑩ 意图解析</text>

  <rect x="760" y="994" width="260" height="64" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="784" y="1022" font-size="18" font-weight="bold" fill="#0D4FA8">③ 非车控 query</text>
  <text x="784" y="1048" font-size="16" fill="#185DB7">「天气咋样」→ ⑲ Director 推理</text>

  <rect x="760" y="1076" width="260" height="64" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="784" y="1104" font-size="18" font-weight="bold" fill="#0D4FA8">④ 拒识</text>
  <text x="784" y="1130" font-size="16" fill="#185DB7">噪音 · 误唤醒 → 记日志</text>

  <!-- condition branches A/B -->
  <polyline points="1020,944 1060,944 1060,872 1100,872" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="1020,944 1060,944 1060,968 1100,968" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1100" y="840" width="260" height="64" fill="#185DB7"/>
  <text x="1124" y="868" font-size="18" font-weight="bold" fill="#F4F2EE">分支A｜系统预设·静态</text>
  <text x="1124" y="894" font-size="16" fill="#F4F2EE">→ ⑬ 配置平台注册（泽民）</text>

  <rect x="1100" y="936" width="260" height="64" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1124" y="964" font-size="18" font-weight="bold" fill="#0D4FA8">分支 B｜用户动态</text>
  <text x="1124" y="990" font-size="16" fill="#185DB7">→⑲Director→⑰Advisor·庆磊</text>

  <!-- handoff to section 3 -->
  <polyline points="1360,872 1390,872 1390,920 1420,920" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="1360,968 1390,968 1390,976 1420,976" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1420" y="868" width="200" height="104" fill="#185DB7"/>
  <text x="1520" y="906" font-size="20" font-weight="bold" fill="#F4F2EE" text-anchor="middle">⑮ 云端触发器</text>
  <text x="1520" y="936" font-size="16" fill="#F4F2EE" text-anchor="middle">场景库注册 / 拼 SP</text>
  <text x="1520" y="962" font-size="16" fill="#F4F2EE" text-anchor="middle">→ 第③段 触发判定</text>

  <!-- ===== Section 3: 触发判定 ===== -->
  <rect x="60" y="1220" width="440" height="52" fill="#185DB7"/>
  <text x="84" y="1255" font-size="24" font-weight="bold" fill="#F4F2EE">③ 触发判定 —— 你的核心战场</text>
  <text x="60" y="1305" font-size="18" fill="#0D4FA8">云端触发器每 5 秒主动扫 Context（它不主动通知），拿注册条件比对当前信号；命中就组装事件、叫醒 Advisor</text>

  <!-- 15 panel -->
  <rect x="60" y="1350" width="980" height="240" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <rect x="60" y="1350" width="400" height="48" fill="#185DB7"/>
  <text x="84" y="1382" font-size="22" font-weight="bold" fill="#F4F2EE">⑮ 云端触发器｜泽民 · P0</text>
  <text x="90" y="1432" font-size="16" fill="#0D4FA8">输入：Context 快照 + 注册条件库　→　输出：标准事件（push 推送给 Advisor）</text>

  <!-- pipeline tiles -->
  <rect x="85" y="1450" width="140" height="70" fill="#185DB7"/>
  <text x="155" y="1480" font-size="18" font-weight="bold" fill="#F4F2EE" text-anchor="middle">15-3 扫描</text>
  <text x="155" y="1504" font-size="16" fill="#F4F2EE" text-anchor="middle">每 5s 读快照</text>
  <line x1="225" y1="1485" x2="243" y2="1485" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="243" y="1450" width="140" height="70" fill="#185DB7"/>
  <text x="313" y="1480" font-size="18" font-weight="bold" fill="#F4F2EE" text-anchor="middle">15-4 判定</text>
  <text x="313" y="1504" font-size="16" fill="#F4F2EE" text-anchor="middle">条件 vs 信号</text>
  <line x1="383" y1="1485" x2="401" y2="1485" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="401" y="1450" width="140" height="70" fill="#185DB7"/>
  <text x="471" y="1480" font-size="18" font-weight="bold" fill="#F4F2EE" text-anchor="middle">15-6 防抖</text>
  <text x="471" y="1504" font-size="16" fill="#F4F2EE" text-anchor="middle">连续K帧才认</text>
  <line x1="541" y1="1485" x2="559" y2="1485" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="559" y="1450" width="140" height="70" fill="#185DB7"/>
  <text x="629" y="1480" font-size="18" font-weight="bold" fill="#F4F2EE" text-anchor="middle">15-7 频控</text>
  <text x="629" y="1504" font-size="16" fill="#F4F2EE" text-anchor="middle">冷却 100次/天</text>
  <line x1="699" y1="1485" x2="717" y2="1485" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="717" y="1450" width="140" height="70" fill="#185DB7"/>
  <text x="787" y="1480" font-size="18" font-weight="bold" fill="#F4F2EE" text-anchor="middle">15-8 仲裁</text>
  <text x="787" y="1504" font-size="16" fill="#F4F2EE" text-anchor="middle">P0~P4 优先级</text>
  <line x1="857" y1="1485" x2="875" y2="1485" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="875" y="1450" width="140" height="70" fill="#185DB7"/>
  <text x="945" y="1480" font-size="18" font-weight="bold" fill="#F4F2EE" text-anchor="middle">15-13</text>
  <text x="945" y="1504" font-size="16" fill="#F4F2EE" text-anchor="middle">组装事件</text>

  <text x="90" y="1558" font-size="16" fill="#0D4FA8">防抖：信号临界反复跳，连续 K 帧一致才认｜频控：100 次/天 · 间隔 60s｜仲裁：安全 P0 &gt; 娱乐 P4</text>

  <!-- four exits -->
  <text x="1100" y="1368" font-size="18" font-weight="bold" fill="#0D4FA8">命中 → 组装事件 → 四出口</text>
  <polyline points="1040,1465 1068,1465 1068,1416 1100,1416" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="1040,1465 1068,1465 1068,1478 1100,1478" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="1040,1465 1068,1465 1068,1540 1100,1540" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="1040,1465 1068,1465 1068,1602 1100,1602" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1100" y="1390" width="260" height="52" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1230" y="1423" font-size="18" font-weight="bold" fill="#0D4FA8" text-anchor="middle">⑯ 静态 Advisor（黄线）</text>
  <rect x="1100" y="1452" width="260" height="52" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1230" y="1485" font-size="18" font-weight="bold" fill="#0D4FA8" text-anchor="middle">⑰ 动态 Advisor（红线）</text>
  <rect x="1100" y="1514" width="260" height="52" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1230" y="1547" font-size="18" font-weight="bold" fill="#0D4FA8" text-anchor="middle">通知 Director</text>
  <rect x="1100" y="1576" width="260" height="52" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1230" y="1609" font-size="18" font-weight="bold" fill="#0D4FA8" text-anchor="middle">简单动作直接执行</text>

  <!-- 24 panel -->
  <rect x="60" y="1630" width="980" height="160" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <rect x="60" y="1630" width="620" height="44" fill="#185DB7"/>
  <text x="84" y="1660" font-size="20" font-weight="bold" fill="#F4F2EE">端侧触发器（端 · 818 P1）—— 云端在车上的手</text>
  <text x="90" y="1710" font-size="16" fill="#0D4FA8">六块能力：本地定时器｜本地持久化（SQLite 数据库）｜任务中心端云同步｜端侧地理围栏</text>
  <text x="90" y="1740" font-size="16" fill="#0D4FA8">端状态条件触发｜VLM 的 SP 转发（把云端拼好的提示词交给 AIBox）</text>
  <text x="90" y="1770" font-size="16" fill="#0D4FA8">定位：AIBox 的调用方，不是「VLM 工具」（卡 C6）</text>

  <!-- SP engine -->
  <rect x="1100" y="1630" width="520" height="160" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1124" y="1666" font-size="20" font-weight="bold" fill="#0D4FA8">拼 SP 引擎（15-16/17/18）｜动态视觉分支</text>
  <text x="1124" y="1700" font-size="16" fill="#0D4FA8">人话需求 → 判枚举 → 判舱内外 → 合并 SP 下发 VLM</text>
  <text x="1124" y="1730" font-size="16" fill="#0D4FA8">为什么归触发器：多个 Advisor 抢一个 VLM 窗口（5 秒一个），</text>
  <text x="1124" y="1760" font-size="16" fill="#0D4FA8">必须有人合并、定槽位、拆结果分发（卡 C4 归属 · C5 成本）</text>

  <!-- blockers strip -->
  <rect x="60" y="1830" width="140" height="60" fill="#8E9179"/>
  <text x="130" y="1868" font-size="20" font-weight="bold" fill="#F4F2EE" text-anchor="middle">卡点清单</text>
  <rect x="200" y="1830" width="1420" height="60" fill="#F4F2EE" stroke="#8E9179" stroke-width="3"/>
  <text x="230" y="1867" font-size="18" fill="#0D4FA8">C1 回传通道　·　C4 拼SP 归属（刘杨反对）　·　C5 万辆车判断成本　·　C8 事件×状态 AND 语义　·　C12 拒绝屏蔽</text>

  <!-- ===== Section 4: 执行输出 ===== -->
  <rect x="60" y="1950" width="480" height="52" fill="#185DB7"/>
  <text x="84" y="1985" font-size="24" font-weight="bold" fill="#F4F2EE">④ 执行输出 —— 变成用户听到的话</text>
  <text x="60" y="2035" font-size="18" fill="#0D4FA8">Advisor 出建议 → Director 拍板（话术 + 动作）→ 语音 / 车控 / 卡片；用户拒绝要回流触发器做屏蔽</text>

  <rect x="60" y="2080" width="200" height="84" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
