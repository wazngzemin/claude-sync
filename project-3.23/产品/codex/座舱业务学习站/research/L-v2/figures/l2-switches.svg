<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="l2-switches" width="1200" height="691" viewBox="0 0 1200 691" role="img" aria-labelledby="l2-switches-title l2-switches-desc">
<title id="l2-switches-title">关掉一个开关，会停在看、判断、问、做的哪一步</title><desc id="l2-switches-desc">沿天气路况保护逐项看。持续观察和持续聆听分别开关，AI 总开关按设置规范逐车型验收。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="l2-switches-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">关掉一个开关，会停在看、判断、问、做的哪一步</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">沿天气路况保护逐项看。持续观察和持续聆听分别开关，AI 总开关按设置规范逐车型验收。</text>
<text class="v56-label" x="48" y="122" text-anchor="start">关闭的开关</text>
<text class="v56-label" x="272" y="122" text-anchor="start">看 · 视觉观察</text>
<text class="v56-label" x="500" y="122" text-anchor="start">判断 · 规则命中</text>
<text class="v56-label" x="728" y="122" text-anchor="start">问 · 卡片与语音</text>
<text class="v56-label" x="956" y="122" text-anchor="start">做 · 车控执行</text>
<g data-node="true" id="l2-switches-task">
<rect class="v56-neutral" x="32" y="149" width="1136" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="48" y="176" text-anchor="start">单个任务开关</text>
<text class="v56-subtitle" x="48" y="200" text-anchor="start">天气开关跟车保存</text>
<text class="v56-subtitle" x="48" y="220" text-anchor="start">车控应用重启后回读</text>
<path class="v56-rule" d="M 256 159 L 256 227"/>
<circle data-decoration="true" class="v56-local" cx="273" cy="178" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="286" y="183" text-anchor="start">舱外视觉照常</text>
<text class="v56-subtitle" x="286" y="211" text-anchor="start">跟随 AI Box</text>
<path class="v56-rule" d="M 484 159 L 484 227"/>
<circle data-decoration="true" class="v56-decision" cx="501" cy="178" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="514" y="183" text-anchor="start">拦下天气新触发</text>
<text class="v56-subtitle" x="514" y="211" text-anchor="start">天气规则检查开关</text>
<path class="v56-rule" d="M 712 159 L 712 227"/>
<circle data-decoration="true" class="v56-neutral" cx="729" cy="178" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="742" y="183" text-anchor="start">停止发新天气卡片</text>
<text class="v56-subtitle" x="742" y="211" text-anchor="start">此前的卡片单独核对</text>
<path class="v56-rule" d="M 940 159 L 940 227"/>
<circle data-decoration="true" class="v56-local" cx="957" cy="178" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="970" y="183" text-anchor="start">已做的车控保留</text>
<text class="v56-subtitle" x="970" y="211" text-anchor="start">如后雾灯仍保持原状态</text>
</g>
<g data-node="true" id="l2-switches-observation">
<rect class="v56-neutral" x="32" y="251" width="1136" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="48" y="278" text-anchor="start">持续观察开关</text>
<text class="v56-subtitle" x="48" y="302" text-anchor="start">控制舱内视觉观察</text>
<path class="v56-rule" d="M 256 261 L 256 329"/>
<circle data-decoration="true" class="v56-decision" cx="273" cy="280" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="286" y="285" text-anchor="start">舱内动态、静态停止</text>
<text class="v56-subtitle" x="286" y="313" text-anchor="start">舱外跟随 AI Box</text>
<path class="v56-rule" d="M 484 261 L 484 329"/>
<circle data-decoration="true" class="v56-local" cx="501" cy="280" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="514" y="285" text-anchor="start">天气仍查看舱外标签</text>
<text class="v56-subtitle" x="514" y="313" text-anchor="start">需舱外视觉正常</text>
<path class="v56-rule" d="M 712 261 L 712 329"/>
<circle data-decoration="true" class="v56-local" cx="729" cy="280" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="742" y="285" text-anchor="start">天气卡片照常</text>
<text class="v56-subtitle" x="742" y="313" text-anchor="start">舱外条件满足时</text>
<path class="v56-rule" d="M 940 261 L 940 329"/>
<circle data-decoration="true" class="v56-local" cx="957" cy="280" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="970" y="285" text-anchor="start">天气车控照常</text>
<text class="v56-subtitle" x="970" y="313" text-anchor="start">仍需同意与复核</text>
</g>
<g data-node="true" id="l2-switches-speech">
<rect class="v56-neutral" x="32" y="353" width="1136" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="48" y="380" text-anchor="start">语音开关</text>
<text class="v56-subtitle" x="48" y="404" text-anchor="start">控制持续聆听</text>
<path class="v56-rule" d="M 256 363 L 256 431"/>
<circle data-decoration="true" class="v56-local" cx="273" cy="382" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="286" y="387" text-anchor="start">持续观察照常</text>
<text class="v56-subtitle" x="286" y="415" text-anchor="start">由视觉开关控制</text>
<path class="v56-rule" d="M 484 363 L 484 431"/>
<circle data-decoration="true" class="v56-local" cx="501" cy="382" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="514" y="387" text-anchor="start">天气仍判断舱外标签</text>
<text class="v56-subtitle" x="514" y="415" text-anchor="start">核对本地任务开关</text>
<path class="v56-rule" d="M 712 363 L 712 431"/>
<circle data-decoration="true" class="v56-decision" cx="729" cy="382" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="742" y="387" text-anchor="start">停止持续聆听</text>
<text class="v56-subtitle" x="742" y="415" text-anchor="start">播报、语音确认分别验</text>
<path class="v56-rule" d="M 940 363 L 940 431"/>
<circle data-decoration="true" class="v56-neutral" cx="957" cy="382" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="970" y="387" text-anchor="start">核对按钮确认</text>
<text class="v56-subtitle" x="970" y="415" text-anchor="start">再查车控与读回</text>
</g>
<g data-node="true" id="l2-switches-ai">
<rect class="v56-neutral v56-pending" x="32" y="455" width="1136" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="48" y="482" text-anchor="start">AI 总开关</text>
<text class="v56-subtitle" x="48" y="506" text-anchor="start">按设置规范</text>
<text class="v56-subtitle" x="48" y="526" text-anchor="start">逐车型验收</text>
<path class="v56-rule" d="M 256 465 L 256 533"/>
<circle data-decoration="true" class="v56-neutral" cx="273" cy="484" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="286" y="489" text-anchor="start">分别验舱内和舱外</text>
<text class="v56-subtitle" x="286" y="517" text-anchor="start">核对视觉是否可用</text>
<path class="v56-rule" d="M 484 465 L 484 533"/>
<circle data-decoration="true" class="v56-local" cx="501" cy="484" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="514" y="489" text-anchor="start">系统预设任务可触发</text>
<text class="v56-subtitle" x="514" y="517" text-anchor="start">Advisor 任务清除</text>
<path class="v56-rule" d="M 712 465 L 712 533"/>
<circle data-decoration="true" class="v56-decision" cx="729" cy="484" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="742" y="489" text-anchor="start">停止语音播报</text>
<text class="v56-subtitle" x="742" y="517" text-anchor="start">卡片展示单独验</text>
<path class="v56-rule" d="M 940 465 L 940 533"/>
<circle data-decoration="true" class="v56-neutral" cx="957" cy="484" r="5" stroke-width="1.6"/>
<text class="v56-node-sub" x="970" y="489" text-anchor="start">按车型验证</text>
<text class="v56-subtitle" x="970" y="517" text-anchor="start">查确认、复核和车控</text>
</g>
<path class="v56-rule" d="M 32 577 L 1168 577"/>
<text class="v56-node-title" x="32" y="611" text-anchor="start">关闭卡片只结束这次询问，天气任务继续等待下一次触发。</text>
<rect data-decoration="true" class="v56-decision" x="32.0" y="637" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="651" text-anchor="start">黄：直接受影响</text>
<rect data-decoration="true" class="v56-local" x="316.0" y="637" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="651" text-anchor="start">蓝：该环节仍保留</text>
<rect data-decoration="true" class="v56-neutral" x="600.0" y="637" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="651" text-anchor="start">灰：后续影响或分别核对</text>
<rect data-decoration="true" class="v56-neutral v56-pending" x="884.0" y="637" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="651" text-anchor="start">灰虚线：逐车型验收</text>
</svg>
