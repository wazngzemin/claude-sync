<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="提前准备能省等待，为什么不能直接拿来执行" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-precache" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">提前准备能省等待，为什么不能直接拿来执行</text><text x="30" y="58" font-size="13" fill="#5f7169">主 OnePager · 同次编号 + 前一轮文字完全一致</text><g transform="translate(0,78)"><path class="flow-edge" data-from="pre" data-to="match" d="M280,84.0 L300,84.0 L300,194 L350,194 L350,260.0 L370,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-precache)"/><path class="flow-edge" data-from="final" data-to="match" d="M280,260.0 L370,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-precache)"/><path class="flow-edge" data-from="match" data-to="reuse" d="M610,260.0 L630,260.0 L630,150 L680,150 L680,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-precache)"/><path class="flow-edge" data-from="match" data-to="redo" d="M610,260.0 L630,260.0 L630,370 L680,370 L680,436.0 L700,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-precache)"/><path class="flow-edge" data-from="reuse" data-to="formal" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-precache)"/><path class="flow-edge" data-from="redo" data-to="formal" d="M820.0,390 L820.0,306" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-precache)"/><text x="309.0" y="143.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">上一份准备</text><text x="325.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">最终文字</text><text x="639.0" y="209.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">符合复用条件</text><text x="639.0" y="319.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">没有可用匹配</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">校验通过</text><text x="829.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">取得有效结果</text><g class="flow-point" data-point="pre" role="button" tabindex="0" aria-label="Soft时先做准备"><rect x="40" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#86ada7">处理</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">Soft时先做准备</text><text x="54" y="110" font-size="12" fill="#587266">保存当时文字与前置结果</text></g><g class="flow-point" data-point="final" role="button" tabindex="0" aria-label="Hard后二遍final到达"><rect x="40" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#86ada7">处理</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">Hard后二遍final到达</text><text x="54" y="286" font-size="12" fill="#587266">最终表达终于确定</text></g><g class="flow-point" data-point="match" role="button" tabindex="0" aria-label="有可用的匹配准备吗"><rect x="370" y="214" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#bb8932">判断</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">有可用的匹配准备吗</text><text x="384" y="286" font-size="12" fill="#587266">同次请求、前一轮、同文本</text></g><g class="flow-point" data-point="reuse" role="button" tabindex="0" aria-label="复用允许缓存的结果"><rect x="700" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#86ada7">处理</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">复用允许缓存的结果</text><text x="714" y="110" font-size="12" fill="#587266">少做一次重复计算</text></g><g class="flow-point" data-point="redo" role="button" tabindex="0" aria-label="按最终文字重新判断"><rect x="700" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="411" font-size="11" fill="#86ada7">处理</text><text x="714" y="437" font-weight="700" font-size="16" fill="#203f35">按最终文字重新判断</text><text x="714" y="462" font-size="12" fill="#587266">无准备或不匹配不能硬套</text></g><g class="flow-point" data-point="formal" role="button" tabindex="0" aria-label="进入正式业务处理"><rect x="700" y="214" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#36835f">结果</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">进入正式业务处理</text><text x="714" y="286" font-size="12" fill="#587266">到这里才继续安排动作</text></g></g></svg>