<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="s2-overview" width="1200" height="685" viewBox="0 0 1200 685" role="img" aria-labelledby="s2-overview-title s2-overview-desc">
<title id="s2-overview-title">中午上车，车里 38 度，一条建议怎样走到办完</title><desc id="s2-overview-desc">以赛力斯夏天上车为例，沿一次极速制冷看谁发现、谁判断、谁执行、谁跟进。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="s2-overview-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">中午上车，车里 38 度，一条建议怎样走到办完</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">以赛力斯夏天上车为例，沿一次极速制冷看谁发现、谁判断、谁执行、谁跟进。</text>
<path class="v56-arrow" d="M 366 173 L 437 173" marker-end="url(#s2-overview-arr)"/>
<path class="v56-arrow" d="M 763 173 L 834 173" marker-end="url(#s2-overview-arr)"/>
<path class="v56-arrow" d="M 1016 230 L 1016 328" marker-end="url(#s2-overview-arr)"/>
<path class="v56-arrow" d="M 904 230 L 904 277 L 763 277" marker-end="url(#s2-overview-arr)"/>
<path class="v56-arrow" d="M 834 384 L 763 384" marker-end="url(#s2-overview-arr)"/>
<path class="v56-arrow" d="M 437 384 L 366 384" marker-end="url(#s2-overview-arr)"/>
<path class="v56-arrow" d="M 203 440 L 203 500" marker-end="url(#s2-overview-arr)"/>
<path class="v56-arrow" d="M 366 556 L 437 556" marker-end="url(#s2-overview-arr)"/>
<g data-node="true" id="s2-overview-onboard">
<rect class="v56-local" x="40" y="118" width="326" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="146" text-anchor="start">01 · 主驾上车</text>
<text class="v56-node-sub" x="54" y="172" text-anchor="start">主驾座位从空变为有人</text>
<text class="v56-node-sub" x="54" y="194" text-anchor="start">车内 38 度，空调还没开</text>
</g>
<g data-node="true" id="s2-overview-trigger">
<rect class="v56-cloud" x="437" y="118" width="326" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="451" y="146" text-anchor="start">02 · 触发器发现机会</text>
<text class="v56-node-sub" x="451" y="172" text-anchor="start">把“主驾上车”作为关注事件</text>
<text class="v56-node-sub" x="451" y="194" text-anchor="start">交给舒适 Advisor</text>
</g>
<g data-node="true" id="s2-overview-advisor">
<rect class="v56-decision" x="834" y="118" width="326" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="848" y="146" text-anchor="start">03 · 舒适 Advisor 给建议</text>
<text class="v56-node-sub" x="848" y="172" text-anchor="start">读车况和记忆，知道主驾怕热</text>
<text class="v56-node-sub" x="848" y="194" text-anchor="start">建议开极速制冷，选告知执行</text>
</g>
<g data-node="true" id="s2-overview-quiet">
<rect class="v56-neutral" x="483" y="248" width="280" height="60" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="497" y="271" text-anchor="start">这次不服务</text>
<text class="v56-node-sub" x="497" y="292" text-anchor="start">空调已经开着，或刚建议过</text>
</g>
<g data-node="true" id="s2-overview-timing">
<rect class="v56-decision" x="834" y="328" width="326" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="848" y="356" text-anchor="start">04 · 下发前时机校验</text>
<text class="v56-node-sub" x="848" y="382" text-anchor="start">还是同一辆车、同一账号</text>
<text class="v56-node-sub" x="848" y="404" text-anchor="start">没在对话或播报，建议没有被替换</text>
</g>
<g data-node="true" id="s2-overview-execute">
<rect class="v56-local" x="437" y="328" width="326" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="451" y="356" text-anchor="start">05 · Planner 调用车控并告知</text>
<text class="v56-node-sub" x="451" y="382" text-anchor="start">车控开启极速制冷，读回实际状态</text>
<text class="v56-node-sub" x="451" y="404" text-anchor="start">Planner 把结果告诉主驾</text>
</g>
<g data-node="true" id="s2-overview-display">
<rect class="v56-local" x="40" y="328" width="326" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="356" text-anchor="start">06 · AI Bar 写真实结果</text>
<text class="v56-node-sub" x="54" y="382" text-anchor="start">先显示建议</text>
<text class="v56-node-sub" x="54" y="404" text-anchor="start">执行后改为“极速制冷中”</text>
</g>
<g data-node="true" id="s2-overview-follow">
<rect class="v56-cloud" x="40" y="500" width="326" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="528" text-anchor="start">07 · 舒适 Advisor 跟进子目标</text>
<text class="v56-node-sub" x="54" y="554" text-anchor="start">每 10 分钟复查舱温</text>
<text class="v56-node-sub" x="54" y="576" text-anchor="start">有新事件就一起再判断</text>
</g>
<g data-node="true" id="s2-overview-ask">
<rect class="v56-decision" x="437" y="500" width="326" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="451" y="528" text-anchor="start">08 · 到 24 度，询问主驾</text>
<text class="v56-node-sub" x="451" y="554" text-anchor="start">“要不要切回自动空调？”</text>
<text class="v56-node-sub" x="451" y="576" text-anchor="start">主驾同意后再切换</text>
</g>
<text class="v56-label" x="401" y="162" text-anchor="middle">座位变化</text>
<text class="v56-label" x="798" y="162" text-anchor="middle">关注事件</text>
<text class="v56-label" x="1028" y="280" text-anchor="start">建议</text>
<text class="v56-label" x="838" y="266" text-anchor="middle">不值得</text>
<text class="v56-label" x="798" y="373" text-anchor="middle">放行</text>
<text class="v56-label" x="401" y="373" text-anchor="middle">结果</text>
<text class="v56-label" x="215" y="474" text-anchor="start">Advisor 跟进</text>
<text class="v56-label" x="401" y="545" text-anchor="middle">到温</text>
<path class="v56-rule" d="M 32 632 L 1168 632"/>
<rect data-decoration="true" class="v56-local" x="32" y="652" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="666" text-anchor="start">蓝 · 车端感知、执行和展示</text>
<rect data-decoration="true" class="v56-cloud" x="316" y="652" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344" y="666" text-anchor="start">绿 · 交接与跟进</text>
<rect data-decoration="true" class="v56-decision" x="600" y="652" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628" y="666" text-anchor="start">黄 · 判断和确认</text>
<rect data-decoration="true" class="v56-neutral" x="884" y="652" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912" y="666" text-anchor="start">灰 · 评估结束，保持安静</text>
</svg>
