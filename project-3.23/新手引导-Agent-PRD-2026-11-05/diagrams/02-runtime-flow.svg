<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1807" viewBox="0 0 1660 1807">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1807" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">对话类场景运行主链路</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">每个节点只承担对应判断；不增加独立的新手引导业务编排层</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户表达进入已配置场景匹配</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">输入当前表达及相关场景描述、示例</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">原请求仍按既有对话链路承接</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">单模型是否匹配到相关场景？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">只判断语义相关性</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不判断首次、次数或授权</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">无匹配／异常</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">结束本次引导机会</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">原对话继续</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">相关</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器检查组合条件是否成立</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">核对真实账号、身份、使用及次数条件</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">按场景处理去重与冲突</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">不成立／未知</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不下发引导建议</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不扣成功次数</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">成立</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器向 DT 提供预设建议</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">关联当前请求与场景</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">保留用户原需求，说明引导目的和限制</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="997" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">建议能否进入当前轮接收窗口？</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">DT 结合建议与原请求进入对应推理</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">实际交接时点由联调确定</text><line x1="1020" y1="1065.0" x2="1186" y2="1065.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1052.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="997" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1037" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">迟到／未处理</text><text x="1218" y="1075" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">结束旧机会</text><text x="1218" y="1106" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不跨话题补播</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1173.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">进入对应推理</text><rect x="100" y="1200" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 判断是否需要采用引导建议</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">明确功能请求无需介绍时，只执行原请求</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不把正常功能推理记作引导处理</text><line x1="1020" y1="1268.0" x2="1186" y2="1268.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1255.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">无需介绍</text><rect x="1190" y="1200" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1240" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">不采用引导建议</text><text x="1218" y="1278" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">正常承接原请求</text><text x="1218" y="1309" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不扣引导次数</text><line x1="560.0" y1="1338" x2="560.0" y2="1399" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1376.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">采用并开始对应处理</text><rect x="100" y="1403" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1443" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 回传本条建议的处理开始状态</text><text x="128" y="1481" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">触发器校验关联，成功计次一次</text><text x="128" y="1512" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">达到上限后停止该账号场景的主动引导</text><line x1="560.0" y1="1541" x2="560.0" y2="1602" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1606" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1646" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 继续既有工具与回复链路</text><text x="128" y="1684" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">工具返回真实结果，DT 再判断和回应</text><text x="128" y="1715" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">端侧播放与功能成功分别记录，不重复计次</text>
</svg>