<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="主例时间线：首轮话术、动作执行、次轮话术和卡片怎样排开"><title>主例时间线：首轮话术、动作执行、次轮话术和卡片怎样排开</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="600" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">主例时间线：首轮话术、动作执行、次轮话术和卡片怎样排开</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">赛力斯 E68，“我好热”（按现行文档推演，时间不按比例）</text><text x="40" y="170" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">用户</text><line x1="140" y1="210" x2="1170" y2="210" stroke="#e3eaf0" stroke-width="1"/><text x="40" y="270" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">车上播放</text><line x1="140" y1="310" x2="1170" y2="310" stroke="#e3eaf0" stroke-width="1"/><text x="40" y="370" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">云端 DT</text><line x1="140" y1="410" x2="1170" y2="410" stroke="#e3eaf0" stroke-width="1"/><text x="40" y="470" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">车上执行</text><line x1="140" y1="510" x2="1170" y2="510" stroke="#e3eaf0" stroke-width="1"/><rect x="150" y="135" width="160" height="70" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="164" y="162" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">“我好热”</text><rect x="330" y="335" width="170" height="70" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="344" y="362" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">首轮推理</text><rect x="520" y="235" width="300" height="70" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="534" y="262" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">播首轮：“我来帮你把空调打开……”</text><rect x="520" y="435" width="200" height="70" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="534" y="462" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">开空调、调温、开按摩</text><rect x="730" y="435" width="100" height="70" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="744" y="462" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">回执回来</text><line x1="840" y1="220" x2="840" y2="520" stroke="#c45c5c" stroke-width="1.6" stroke-dasharray="4 4"/><text x="846" y="226" font-size="13" fill="#6e2222" font-weight="400" text-anchor="start">首轮播完才开始下一轮</text><rect x="860" y="335" width="150" height="70" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="874" y="362" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">读回执</text><rect x="1020" y="235" width="150" height="70" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="1034" y="262" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">“都搞定啦”</text><text x="1034" y="287" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">＋卡片</text><rect x="1020" y="135" width="150" height="70" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="1034" y="162" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">延时聆听</text><text x="1034" y="187" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">30 秒</text><path d="M310,170 L415,170 L415,335" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M500,370 L520,270" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M500,380 L520,470" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M830,470 L935,470 L935,405" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1010,370 L1095,370 L1095,305" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1095,235 L1095,205" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><text x="40" y="560" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start">规则出处：同轮工具全部回来再统一说（DT PRD）；发过声音先等车上播完再走下一轮（Planner OnePage）；卡片等工具结果回来才出（10/19 宣讲）</text></g></svg>