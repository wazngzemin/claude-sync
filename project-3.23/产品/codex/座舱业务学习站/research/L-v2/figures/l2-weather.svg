<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="l2-weather" width="1200" height="1287" viewBox="0 0 1200 1287" role="img" aria-labelledby="l2-weather-title l2-weather-desc">
<title id="l2-weather-title">天气路况保护，怎样开后雾灯、再问是否关灯</title><desc id="l2-weather-desc">赛力斯浓雾场景。拉卡、播报到本地确认都在车端完成，Planner 在链路之外。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="l2-weather-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">天气路况保护，怎样开后雾灯、再问是否关灯</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">赛力斯浓雾场景。拉卡、播报到本地确认都在车端完成，Planner 在链路之外。</text>
<g data-node="true" id="l2-weather-detect">
<rect class="v56-local" x="72" y="126" width="496" height="109" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="86" y="154" text-anchor="start">01 · 舱外视觉识别浓雾</text>
<text class="v56-node-sub" x="86" y="182" text-anchor="start">端侧触发器连续收到 2 次浓雾标签</text>
<text class="v56-node-sub" x="86" y="206" text-anchor="start">2 次和车速门槛均为可标定设计值</text>
</g>
<g data-node="true" id="l2-weather-judge">
<rect class="v56-decision" x="72" y="274" width="496" height="127" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="86" y="302" text-anchor="start">02 · 端侧触发器判断能否推荐</text>
<text class="v56-node-sub" x="86" y="330" text-anchor="start">天气任务开启，车速高于 30 公里每小时</text>
<text class="v56-node-sub" x="86" y="354" text-anchor="start">后雾灯未开，当前为拖车模式则跳过</text>
</g>
<g data-node="true" id="l2-weather-ask">
<rect class="v56-cloud" x="72" y="451" width="496" height="111" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="86" y="479" text-anchor="start">03 · 天气业务注册并调用即时卡片</text>
<text class="v56-node-sub" x="86" y="507" text-anchor="start">卡片展示、播报“要不要打开后雾灯？”</text>
<text class="v56-node-sub" x="86" y="531" text-anchor="start">卡片带有效期和按钮回调</text>
</g>
<g data-node="true" id="l2-weather-confirm">
<rect class="v56-local" x="72" y="607" width="496" height="111" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="86" y="635" text-anchor="start">04 · 主驾确认当前卡片</text>
<text class="v56-node-sub" x="86" y="663" text-anchor="start">点按钮或用本地语音确认当前动作</text>
<text class="v56-node-sub" x="86" y="687" text-anchor="start">两种操作走同一个按钮回调</text>
</g>
<g data-node="true" id="l2-weather-recheck">
<rect class="v56-decision" x="72" y="762" width="496" height="111" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="86" y="790" text-anchor="start">05 · 天气业务复核</text>
<text class="v56-node-sub" x="86" y="818" text-anchor="start">核对是当前卡、明确同意、还没处理过</text>
<text class="v56-node-sub" x="86" y="842" text-anchor="start">重读车速、雾灯等车况</text>
</g>
<g data-node="true" id="l2-weather-execute">
<rect class="v56-cloud" x="72" y="920" width="496" height="111" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="86" y="948" text-anchor="start">06 · 车控执行并读回</text>
<text class="v56-node-sub" x="86" y="976" text-anchor="start">读回区分实际状态、失败、未知</text>
<text class="v56-node-sub" x="86" y="1000" text-anchor="start">天气业务把真实结果交给卡片</text>
</g>
<path class="v56-arrow" d="M 320 235 L 320 274" marker-end="url(#l2-weather-arr)"/>
<path class="v56-arrow" d="M 320 401 L 320 451" marker-end="url(#l2-weather-arr)"/>
<path class="v56-arrow" d="M 320 562 L 320 607" marker-end="url(#l2-weather-arr)"/>
<path class="v56-arrow" d="M 320 718 L 320 762" marker-end="url(#l2-weather-arr)"/>
<path class="v56-arrow" d="M 320 873 L 320 920" marker-end="url(#l2-weather-arr)"/>
<text class="v56-label" x="339" y="430" text-anchor="start">命中 → 本地业务事件</text>
<text class="v56-label" x="339" y="742" text-anchor="start">同意回给天气业务</text>
<text class="v56-label" x="339" y="898" text-anchor="start">条件仍成立</text>
<rect data-decoration="true" class="v56-neutral v56-pending" x="744" y="274" width="416" height="49" rx="8" stroke-width="1.6"/>
<text class="v56-label" x="758" y="303.5" text-anchor="start">讨论中 · 车速低于 60 公里每小时、P 挡不推荐</text>
<g data-node="true" id="l2-weather-stop">
<rect class="v56-reject" x="744" y="589" width="416" height="198" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="758" y="617" text-anchor="start">结束这次询问，本轮不控车</text>
<text class="v56-node-sub" x="758" y="645" text-anchor="start">拒绝：主驾主动取消</text>
<text class="v56-node-sub" x="758" y="669" text-anchor="start">超时：卡片超过有效期</text>
<text class="v56-node-sub" x="758" y="693" text-anchor="start">条件失效：复核时车况已变</text>
<text class="v56-node-sub" x="758" y="717" text-anchor="start">结束后，天气任务回到等待</text>
</g>
<path class="v56-arrow" d="M 568 643 L 744 643" marker-end="url(#l2-weather-arr)"/>
<text class="v56-risk" x="590" y="632" text-anchor="start">拒绝</text>
<path class="v56-arrow" d="M 568 688 L 744 688" marker-end="url(#l2-weather-arr)"/>
<text class="v56-risk" x="590" y="677" text-anchor="start">超时</text>
<path class="v56-arrow" d="M 568 817 L 705 817 L 705 744 L 744 744" marker-end="url(#l2-weather-arr)"/>
<text class="v56-risk" x="586" y="805" text-anchor="start">条件失效</text>
<g data-node="true" id="l2-weather-clear-weather">
<rect class="v56-decision" x="744" y="905" width="416" height="122" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="758" y="933" text-anchor="start">07 · 退出计数</text>
<text class="v56-node-sub" x="758" y="961" text-anchor="start">只跟踪经推荐且主驾确认后打开的灯</text>
<text class="v56-node-sub" x="758" y="985" text-anchor="start">连续 30 次有效观察无雾</text>
<text class="v56-node-sub" x="758" y="1009" text-anchor="start">隧道、停车场和无效观察跳过</text>
</g>
<path class="v56-arrow" d="M 568 959 L 744 959" marker-end="url(#l2-weather-arr)"/>
<text class="v56-label" x="589" y="946" text-anchor="start">读回灯已亮</text>
<g data-node="true" id="l2-weather-ask-off">
<rect class="v56-cloud" x="744" y="1068" width="416" height="87" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="758" y="1096" text-anchor="start">08 · 退出询问</text>
<text class="v56-node-sub" x="758" y="1124" text-anchor="start">天气业务再问“要不要关闭后雾灯？”</text>
</g>
<path class="v56-arrow" d="M 952 1027 L 952 1068" marker-end="url(#l2-weather-arr)"/>
<path class="v56-arrow" d="M 744 1110 L 32 1110 L 32 662 L 72 662" marker-end="url(#l2-weather-arr)"/>
<text class="v56-label" x="330" y="1094" text-anchor="middle">关灯同样从主驾确认开始</text>
<path class="v56-rule" d="M 32 1180 L 1168 1180"/>
<text class="v56-node-title" x="32" y="1214" text-anchor="start">天气业务收到明确同意并复核车况后，才交车控执行。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="1240" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1254" text-anchor="start">蓝：视觉输入与主驾选择</text>
<rect data-decoration="true" class="v56-decision" x="259.2" y="1240" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="287.2" y="1254" text-anchor="start">黄：规则判断与复核</text>
<rect data-decoration="true" class="v56-cloud" x="486.4" y="1240" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="514.4" y="1254" text-anchor="start">绿：业务交接与车控</text>
<rect data-decoration="true" class="v56-reject" x="713.6" y="1240" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="741.6" y="1254" text-anchor="start">红：本轮停止</text>
<rect data-decoration="true" class="v56-neutral v56-pending" x="940.8" y="1240" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="968.8" y="1254" text-anchor="start">灰虚线：讨论中</text>
</svg>
