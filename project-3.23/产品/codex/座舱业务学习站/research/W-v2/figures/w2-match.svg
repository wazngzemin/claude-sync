<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="w2-match" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="w2-match-title w2-match-desc">
<title id="w2-match-title">最终文字怎样对上按钮</title><desc id="w2-match-desc">页面匹配只认当前页面词库；匹配结果决定拦截、消歧，还是继续走端云链路。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="w2-match-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<path class="v56-arrow" d="M 262 250 L 305 250" fill="none" marker-end="url(#w2-match-arr)"/>
<path class="v56-arrow" d="M 535 250 L 578 250" fill="none" marker-end="url(#w2-match-arr)"/>
<path class="v56-arrow" d="M 828 250 L 850 250 L 850 165 L 880 165" fill="none" marker-end="url(#w2-match-arr)"/>
<path class="v56-arrow" d="M 850 250 L 850 330 L 880 330" fill="none" marker-end="url(#w2-match-arr)"/>
<path class="v56-arrow" d="M 850 330 L 850 495 L 880 495" fill="none" marker-end="url(#w2-match-arr)"/>
<path class="v56-arrow" d="M 512 445 L 550 445 L 550 275 L 578 275" fill="none" marker-end="url(#w2-match-arr)"/>
<path class="v56-arrow" d="M 703 600 L 703 300" fill="none" marker-end="url(#w2-match-arr)" style="stroke:var(--red,#9c4148)"/>
<g data-node="true" data-key="final">
<rect class="v56-neutral" x="32" y="200" width="230" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="227" text-anchor="start">ASR 最终文字</text>
<text class="v56-node-sub" x="46" y="252" text-anchor="start">只看 isFinal = true</text>
<text class="v56-node-sub" x="46" y="273" text-anchor="start">不使用过程文字</text>
</g>
<g data-node="true" data-key="normalize">
<rect class="v56-local" x="305" y="200" width="230" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="319" y="227" text-anchor="start">归一化</text>
<text class="v56-node-sub" x="319" y="252" text-anchor="start">把“停一下”统一成“暂停”</text>
</g>
<g data-node="true" data-key="match">
<rect class="v56-decision" x="578" y="200" width="250" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="592" y="227" text-anchor="start">精确或前后缀匹配</text>
<text class="v56-node-sub" x="592" y="252" text-anchor="start">只认白名单，不做语义泛化</text>
</g>
<g data-node="true" data-key="single">
<rect class="v56-local" x="880" y="110" width="288" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="894" y="137" text-anchor="start">命中 → 拦截</text>
<text class="v56-node-sub" x="894" y="162" text-anchor="start">返回 INTERCEPTED</text>
<text class="v56-node-sub" x="894" y="183" text-anchor="start">交出指令与元素 ID</text>
</g>
<g data-node="true" data-key="multi">
<rect class="v56-decision" x="880" y="275" width="288" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="894" y="302" text-anchor="start">多命中 → 注册方消歧</text>
<text class="v56-node-sub" x="894" y="327" text-anchor="start">由页面注册方区分目标</text>
<text class="v56-node-sub" x="894" y="348" text-anchor="start">不支持多命中时按车型处理</text>
</g>
<g data-node="true" data-key="miss">
<rect class="v56-cloud" x="880" y="440" width="288" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="894" y="467" text-anchor="start">未命中 → 端云正常链路</text>
<text class="v56-node-sub" x="894" y="492" text-anchor="start">按端云仲裁规则继续处理</text>
</g>
<g data-node="true" data-key="lexicon">
<rect class="v56-local" x="32" y="390" width="480" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="417" text-anchor="start">当前页面词库</text>
<text class="v56-node-sub" x="46" y="442" text-anchor="start">页面词注册提供“词 → 元素 ID”</text>
<text class="v56-node-sub" x="46" y="463" text-anchor="start">每页最多 500 个词</text>
</g>
<g data-node="true" data-key="case">
<rect class="v56-reject" x="578" y="600" width="590" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="592" y="627" text-anchor="start">已修复：“暂停视频”漏匹配</text>
<text class="v56-node-sub" x="592" y="652" text-anchor="start">ASR 已写对，卡在匹配这一步</text>
<text class="v56-node-sub" x="592" y="673" text-anchor="start">未命中后上云，曾误入音乐链路</text>
</g>
<rect data-legend="true" class="v56-local" x="32" y="735" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-decision" x="310" y="735" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-cloud" x="600" y="735" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-reject" x="880" y="735" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-title" x="32" y="44" text-anchor="start">最终文字怎样对上按钮</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">页面匹配只认当前页面词库；匹配结果决定拦截、消歧，还是继续走端云链路。</text>
<text class="v56-subtitle" x="60" y="749" text-anchor="start">蓝：车上词库与处理</text>
<text class="v56-subtitle" x="338" y="749" text-anchor="start">黄：规则判断与消歧</text>
<text class="v56-subtitle" x="628" y="749" text-anchor="start">绿：交端云链路</text>
<text class="v56-subtitle" x="908" y="749" text-anchor="start">红：已修复的漏匹配</text>
</svg>
