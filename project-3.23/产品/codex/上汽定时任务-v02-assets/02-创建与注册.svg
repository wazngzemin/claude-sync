<rect x="680.0" y="1615.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="900" y="1661" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">建议：保存任务关联</tspan><tspan x="900" dy="34.8">任务 ↔ 定时登记 / 条件场景</tspan></text>
<rect x="1260.0" y="1785.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="1831" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">任务中心：待触发卡片</tspan><tspan x="1480" dy="34.8">做什么 / 何时或何条件 / 对象</tspan></text>
<rect x="100.0" y="1785.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="1831" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">Planner 反馈创建成功</tspan><tspan x="320" dy="34.8">明确解释最终时间或条件</tspan></text>
<rect x="680.0" y="2055.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="2101" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">进入等待</tspan><tspan x="900" dy="34.8">弋途到点 / 豆包条件命中</tspan></text>
<rect x="100.0" y="2225.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="2271" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">模糊日期：按上汽 PRD 转条件</tspan><tspan x="320" dy="34.8">仅日期 → 目标日期首次上车</tspan></text>
