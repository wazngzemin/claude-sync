<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-label="为什么“还没出字”也不一定能合并重推：工具是分界线"><title>为什么“还没出字”也不一定能合并重推：工具是分界线</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8" /></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="690" fill="#ffffff" data-background="true" /><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start" id="m-replay-text-1">为什么“还没出字”也不一定能合并重推：工具是分界线</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start" id="m-replay-text-2">同一个场景两条路：上面工具还没发，下面工具已经发出去了</text><text x="30" y="104" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start" id="m-replay-text-3">示意场景：主驾说“把车窗打开”，Planner 还在推理；副驾紧接着说“开一半就行”</text><rect x="30" y="220" width="280" height="90" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true" /><text x="44" y="247" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start" id="m-replay-text-4">Planner 推理中</text><text x="44" y="272" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-5">用户还没看到任何字</text><path d="M310,265 L360,265 L360,178 L400,178" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><path d="M310,265 L360,265 L360,385 L400,385" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="400" y="130" width="380" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="414" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-replay-text-6">路线 A：工具还没发出</text><text x="414" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-7">旧话仍可重推</text><text x="414" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-8">再推一次不会多开一次窗</text><rect x="820" y="130" width="390" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="834" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-replay-text-9">打断，两句合并重推</text><text x="834" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-10">Planner 一次看到两句话：</text><text x="834" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-11">开窗，开一半</text><path d="M780,178 L820,178" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="400" y="330" width="380" height="110" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true" /><text x="414" y="357" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start" id="m-replay-text-12">路线 B：Planner 已先发出“开窗”</text><text x="414" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-13">可能还没出字，但车窗已经在动</text><text x="414" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-14">这时旧话被标成“不能重推”</text><rect x="820" y="330" width="390" height="110" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true" /><text x="834" y="357" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start" id="m-replay-text-15">打断，只处理新话</text><text x="834" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-16">“已开窗”作为背景交给 Planner</text><text x="834" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-17">Planner 决定要不要调成一半</text><path d="M780,385 L820,385" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="30" y="480" width="1180" height="140" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true" /><text x="44" y="507" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start" id="m-replay-text-18">工具放行为什么成为分界线</text><text x="44" y="532" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-19">早期以首字为界；现在以工具放行为界：放行后即使还没出字，也不再合并。</text><text x="44" y="553" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-20">原因：再推一次，Planner 可能再发同样的工具，造成重复车控、重复下单。</text><text x="44" y="574" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-replay-text-21">代价：只看到新话加背景；已执行的动作不撤销。</text><circle cx="39" cy="661.0" r="7" fill="#fffbe8" stroke="#cdb35a" /><text x="53" y="666.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-replay-text-22">黄：边界与原因</text><circle cx="209" cy="661.0" r="7" fill="#eaf6ef" stroke="#4a9670" /><text x="223" y="666.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-replay-text-23">绿：旧话可以合并重推</text><circle cx="392" cy="661.0" r="7" fill="#fdeeee" stroke="#c45c5c" /><text x="406" y="666.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-replay-text-24">红：只办新话</text></g></svg>
