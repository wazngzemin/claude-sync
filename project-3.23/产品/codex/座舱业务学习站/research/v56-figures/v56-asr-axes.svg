<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="v56-asr-axes" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="v56-asr-axes-title v56-asr-axes-desc">
<title id="v56-asr-axes-title">识别的两组坐标</title><desc id="v56-asr-axes-desc">横着看在哪里识别，竖着看识别到了哪一步；两组概念可以组合。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="v56-asr-axes-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44">识别的两组坐标</text><text class="v56-subtitle" x="32" y="72">横着看在哪里识别，竖着看识别到了哪一步；两组概念可以组合。</text>
<text class="v56-label" x="340" y="135" text-anchor="start">在哪里识别</text>
<path class="v56-rule" d="M 340 151 L 1140 151" fill="none"/>
<text class="v56-node-title" x="354" y="191" text-anchor="start">车上离线</text>
<text class="v56-node-title" x="784" y="191" text-anchor="start">云端在线</text>
<text class="v56-label" x="32" y="240" text-anchor="start">识别到哪一步</text>
<text class="v56-node-title" x="100" y="320" text-anchor="start">过程文字</text>
<text class="v56-node-title" x="100" y="530" text-anchor="start">最终文字</text>
<path class="v56-rule" d="M 300 220 L 300 618" fill="none"/>
<g data-node="true">
<rect class="v56-local" x="340" y="260" width="380" height="145" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="354" y="287" text-anchor="start">本地过程文字</text>
<text class="v56-node-sub" x="354" y="312" text-anchor="start">本地流式文字</text>
<text class="v56-node-sub" x="354" y="333" text-anchor="start">供本地模型判断</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="770" y="260" width="380" height="145" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="784" y="287" text-anchor="start">在线过程文字</text>
<text class="v56-node-sub" x="784" y="312" text-anchor="start">云端边听边返回的文字</text>
</g>
<g data-node="true">
<rect class="v56-local" x="340" y="470" width="380" height="145" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="354" y="497" text-anchor="start">本地定稿文字</text>
<text class="v56-node-sub" x="354" y="522" text-anchor="start">车上也有定稿文字</text>
<text class="v56-node-sub" x="354" y="543" text-anchor="start">断网也能听写</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="770" y="470" width="380" height="145" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="784" y="497" text-anchor="start">在线定稿文字</text>
<text class="v56-node-sub" x="784" y="522" text-anchor="start">AIDV 返回的定稿文字</text>
</g>
<rect class="v56-local" x="32" y="686" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="700" text-anchor="start">蓝：车上识别</text>
<rect class="v56-cloud" x="222" y="686" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="250" y="700" text-anchor="start">绿：云端识别</text>
</svg>
