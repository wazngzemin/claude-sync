<html lang="zh-CN">

<title>触发器配置平台 · 交互评审原型 v05</title>
<style>
:root{--blue:#3267dc;--ink:#202c43;--muted:#69758a;--line:#dfe5ee;--bg:#f4f6fa;--purple:#7856c8;--green:#188167;--orange:#b8781c}*{box-sizing:border-box}body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid #9cbafc;outline-offset:2px}button{border:1px solid var(--line);background:white;border-radius:6px;padding:7px 12px;color:var(--ink)}button:hover{border-color:#93b1ed;background:#f6f9ff}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#2456c4;color:white}.link{border:0;padding:3px 5px;color:var(--blue);background:transparent}.danger{color:#c34c4c}.top{height:64px;padding:0 24px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}.brand{font-weight:750;font-size:19px}.brand i{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:10px;background:var(--blue);color:white;border-radius:8px;font-style:normal}.version{color:var(--muted);font-size:12px}.demo{margin-left:auto;color:#8f672c;background:#fff5df;border:1px solid #edd6a6;padding:6px 12px;border-radius:20px;font-size:12px}.shell{display:grid;grid-template-columns:174px minmax(0,1fr);min-height:calc(100vh - 64px)}nav{padding:25px 14px;background:white;border-right:1px solid var(--line)}.navlabel{padding:0 10px;margin-bottom:15px;color:#929baa;font-size:12px}nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:11px 12px;border:0;background:transparent}nav button.active{background:#ebf1ff;color:var(--blue);font-weight:650}.navfoot{padding:18px 10px;border-top:1px solid var(--line);margin-top:28px;font-size:12px;color:var(--muted)}main{padding:20px 24px 24px;min-width:0}.crumb{color:var(--muted);font-size:12px;margin-bottom:8px}.heading{display:flex;align-items:center;gap:10px;margin-bottom:15px}.heading h1{font-size:23px;line-height:1.3;margin:0}.heading .right{margin-left:auto;display:flex;gap:8px}.reviewtabs{display:flex;gap:7px;margin-bottom:18px;padding:8px;background:#eaf0f9;border-radius:8px;overflow:auto}.reviewtabs button{white-space:nowrap;background:transparent;border:0;font-size:12px;padding:7px 10px}.reviewtabs button.active{background:white;color:var(--blue);box-shadow:0 1px 4px #d0daea;font-weight:650}.layout{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:18px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:9px;padding:18px;margin-bottom:14px}.paneltitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;font-size:15px;font-weight:650}.hot{color:var(--blue);margin-right:5px;font-weight:750}.aside{background:white;border:1px solid var(--line);border-radius:9px;padding:18px}.aside h2{font-size:15px;margin:0 0 14px}.aside .item{padding:12px 0;border-bottom:1px solid #edf0f5}.aside .item:last-child{border:0}.aside .item b{display:block;margin-bottom:4px;font-size:13px}.aside p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}.aside .boundary{background:#f0f4ff;border-radius:6px;margin-top:12px;padding:10px;font-size:12px}.note{color:var(--muted);font-size:12px;margin:8px 0}.hint{background:#eef4ff;color:#45648e;border-left:3px solid #8babdf;padding:9px 12px;font-size:12px;margin:0 0 12px}.warn{background:#fff7e8;color:#896226;border-left:3px solid #e5b75a;padding:9px 12px;font-size:12px;margin:0 0 12px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.filters label,.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d7deea;border-radius:5px;background:white;padding:7px 9px;color:var(--ink)}textarea{resize:vertical;min-height:75px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.span2{grid-column:span 2}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.spacer{flex:1}.badge{display:inline-block;padding:2px 7px;border-radius:4px;background:#edf2f9;color:#5a6b83;font-size:11px;white-space:nowrap}.badge.on{background:#e8f6f0;color:var(--green)}.badge.purple{background:#f0eaff;color:var(--purple)}.badge.orange{background:#fff1d9;color:var(--orange)}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e8edf4;vertical-align:middle}th{color:#637085;background:#f7f9fc;font-weight:600;white-space:nowrap}td .link{font-size:12px}.name{font-weight:650}.tiny{font-size:11px;color:var(--muted)}.scroll{overflow:auto}.empty{padding:40px;text-align:center;color:var(--muted)}.sectiontabs{display:flex;gap:8px;margin:0 0 12px}.sectiontabs button.active{color:var(--blue);background:#edf3ff;border-color:#b7ccf5}.rule{display:flex;gap:8px;align-items:center;margin:8px 0;padding:9px;background:#f7f9fc;border-radius:6px}.rule select{max-width:200px}.rule input{max-width:110px}.check{display:flex;align-items:center;gap:6px;font-size:12px}.check input{width:auto}.graph{position:relative;background-color:#fbfcff;background-image:radial-gradient(#dbe2ed 1px,transparent 1px);background-size:15px 15px;border:1px solid var(--line);border-radius:8px;height:332px;overflow:auto}.graphinner{position:relative;width:700px;height:330px;margin:auto}.graph svg{position:absolute;inset:0;width:700px;height:330px;pointer-events:none}.node{position:absolute;width:158px;min-height:76px;text-align:left;padding:10px;border:1.5px solid #93b3ef;border-radius:7px;box-shadow:0 2px 5px #dce4f050;background:#eef4ff;font-size:12px}.node.inference{background:#f4efff;border-color:#b29ce0}.node.sink{background:#eaf7f2;border-color:#80bca5}.node.selected{outline:3px solid #b9cefb;outline-offset:3px}.node b{display:block;font-size:12px;margin:3px 0}.node span{font-size:10px;color:#60718c}.nodestate{float:right;background:white;border:1px solid #cbd8e9;padding:0 3px;border-radius:3px;font-size:9px;color:var(--green)}.graphbottom{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px}.graphbottom select{width:150px;padding:5px}.graphbottom button{font-size:12px;padding:5px 8px}.props{background:#f7f9fd;border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:10px}.props .formgrid{grid-template-columns:1.1fr 1fr 1fr}.props label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}.props input,.props select{font-size:12px;padding:5px}.props .proptext{font-size:12px;color:#52637c;margin-top:8px}.locked{font-size:11px;color:var(--orange)}details{margin-top:10px;font-size:12px}summary{cursor:pointer;color:var(--blue)}pre{white-space:pre-wrap;word-break:break-all;background:#f2f5fa;padding:12px;border-radius:6px;font:11px/1.65 ui-monospace,monospace}.footerbar{display:flex;gap:8px;align-items:center;padding:12px 16px;background:white;border:1px solid var(--line);border-radius:8px}.error{color:#bf4141;background:#fff0f0;border:1px solid #f0c6c6;padding:9px 12px;border-radius:6px;font-size:12px;margin-top:10px}.resultcards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.resultcard{background:#f7f9fc;border:1px solid var(--line);border-radius:6px;padding:11px;font-size:12px}.resultcard b{display:block;margin:5px 0}.statuspass{color:var(--green)}.statusreject{color:#bf4141}.statusunknown{color:var(--orange)}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#20304c;color:white;padding:11px 20px;border-radius:7px;box-shadow:0 5px 20px #1c2b3c30;z-index:100;max-width:80vw}.overlay{position:fixed;inset:0;background:#15253c55;display:grid;place-items:center;z-index:50;padding:24px}.modal{background:white;border-radius:12px;padding:24px;width:530px;max-width:100%;box-shadow:0 18px 80px #0f213b30}.modal h2{font-size:19px;margin:0 0 16px}.modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.radiochoice{border:1px solid var(--line);border-radius:8px;padding:15px;margin:10px 0;cursor:pointer}.radiochoice:hover{border-color:var(--blue);background:#f7faff}.radiochoice b{display:block;margin-bottom:3px}.stats{display:flex;gap:20px;color:var(--muted);font-size:12px;margin-bottom:12px}.stats b{font-size:19px;color:var(--ink);margin-right:4px}.steps{display:flex;gap:7px;margin-top:12px;font-size:11px}.steps span{padding:7px;background:#f0f4fa;border-radius:5px;flex:1}.steps strong{display:block;font-size:12px}.pill{border:1px solid var(--line);border-radius:20px;font-size:12px;padding:5px 11px}.pill.active{color:var(--blue);background:#edf3ff;border-color:#abc3ef}@media(min-width:1500px){main{max-width:1500px;margin:0 auto;width:100%}.layout{grid-template-columns:minmax(0,1fr) 275px}}@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.aside{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.aside h2{grid-column:span 3;margin-bottom:0}.aside .item{border:0;padding:0}.aside .boundary{grid-column:span 3;margin-top:0}.filters{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.shell{grid-template-columns:1fr}nav{display:none}main{padding:15px}.demo{font-size:10px;padding:5px}.brand{font-size:15px}.top{padding:0 14px}.version{display:none}.filters,.formgrid{grid-template-columns:1fr 1fr}.aside{display:block}.aside .item{padding:10px 0}.heading h1{font-size:20px}.heading .right{flex-wrap:wrap}.graphinner{margin:0}.props .formgrid{grid-template-columns:1fr}.resultcards{grid-template-columns:1fr}.reviewtabs{gap:0}}
</style>
<style>.node.missing{background:#fff7e5;border-color:#d5bb7b;border-style:dashed;color:#8c784f}.node.missing span{color:#948770}.graphinner:has(.missing) .node{width:153px}.graphinner:has(.missing) .node b{font-size:11px}.graphinner:has(.missing) .node span{font-size:9px}</style>

<body>
<header class="top"><div class="brand"><i>↗</i>触发器配置平台</div><span class="version">交互评审原型 v01 · 参考技术方案 3.8</span><span class="demo">仅产品演示 · 不连接真实后台 / 车辆</span></header>
<div class="shell"><nav><div class="navlabel">场景管理</div><button data-nav="list">▦　场景列表</button><button data-nav="config">⚙　场景配置</button><button data-nav="records">≡　触发记录</button><div class="navfoot">简单 / Workflow 两种模式<br>Workflow 只编排判断<br>Action 单独配置</div></nav><main id="main"></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
'use strict';
const pages=['场景列表','场景配置','儿童 / 宠物识别','充电口盖判定','后视镜加热','Workflow 运行详情'];
const scenarios=[{id:'5324',name:'儿童锁保护',mode:'Workflow',kind:'preset',source:'mix',case:'child',scope:'M9 · 演示车辆',state:'已生效'},{id:'5325',name:'充电口盖建议',mode:'Workflow',kind:'preset',source:'vehicle_resource',case:'charge',scope:'M9 · 演示车辆',state:'已生效'},{id:'5326',name:'后视镜加热建议',mode:'Workflow',kind:'preset',source:'vehicle_resource',case:'mirror',scope:'M9 · 演示车辆',state:'未生效'},{id:'5327',name:'天气路况保护（简单模式示例）',mode:'简单',kind:'normal',source:'mix',case:'simple',scope:'M9 · 演示车辆',state:'未生效'}];
let current=1,caseKey='child',existing=true,selected='public',outcome='PASS',conditionCounter=3,workflowDirty=false;
let configTab='base',configMode='简单',filters={},formDraft={name:'系统预设场景（配置示例）',id:'新建后生成',query:'出行 advisor：本次场景满足儿童锁建议条件，建议用户开启儿童锁。策略：先询问，确认后执行。'};
let edges=[],graphNodes=[],simpleRules=[{field:'路面湿滑识别',op:'等于',value:'湿滑'},{field:'当前驾驶模式',op:'不等于',value:'湿滑模式'}];
const el=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){el('toast').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>el('toast').innerHTML='',3800)}
function go(p){location.hash='p'+p;if(current===p)render()}
function title(){return current===2?'场景配置':current>=3&&current<=5?'Workflow · '+pages[current-1]:pages[current-1]}
function pageNav(){return '<div class="reviewtabs" aria-label="评审页面">'+pages.map((n,i)=>'<button class="'+(current===i+1?'active':'')+'" onclick="go('+(i+1)+')">P'+(i+1)+' '+n+'</button>').join('')+'</div>'}
function aside(items,boundary){return '<aside class="aside"><h2>本页怎么讲 · P'+current+'</h2>'+items.map((x,i)=>'<div class="item"><b><span class="hot">'+['①','②','③'][i]+'</span>'+x[0]+'</b><p>'+x[1]+'</p></div>').join('')+'<div class="boundary">'+boundary+'</div></aside>'}
function render(){current=Math.max(1,Math.min(6,parseInt(location.hash.replace('#p',''))||1));document.querySelectorAll('[data-nav]').forEach(b=>{let n=current===1?'list':current===6?'records':'config';b.classList.toggle('active',b.dataset.nav===n)});el('main').innerHTML='<div class="crumb">场景管理 / '+(current===1?'场景列表':current===6?'触发记录':'场景配置')+'</div><div class="heading"><h1>'+title()+'</h1><span class="badge">评审页 P'+current+'</span><div class="right">'+(current===1?'<button class="primary" onclick="newDialog()">＋ 新建场景</button>':current===6?'<button onclick="go(1)">返回列表</button>':current>=3&&current<=5?'<button onclick="copyWorkflow()">复制为新 Workflow</button>':'<button onclick="go(1)">返回列表</button>')+'</div></div>'+pageNav()+(current===1?listPage():current===2?simplePage():current===6?recordPage():workflowPage());if(current>=3&&current<=5)drawGraph();if(current===6)drawGraph(true)}
function listPage(){let rows=scenarios.filter(s=>(!filters.name||s.name.includes(filters.name))&&(!filters.id||s.id.includes(filters.id))&&(!filters.state||s.state===filters.state)&&(!filters.kind||s.kind===filters.kind)&&(!filters.source||s.source===filters.source));return '<div class="layout"><div><section class="panel"><div class="paneltitle"><span><span class="hot">①</span>查找场景</span><span class="tiny">渠道、环境与来源分类分别筛选</span></div><div class="filters">'+filterSelect('渠道','channel',['master','其他渠道（演示）'])+filterSelect('环境 / tag','tag',['正式环境','测试环境'])+'<div><label>名称</label><input placeholder="如：儿童锁" value="'+esc(filters.name||'')+'" oninput="filters.name=this.value"></div><div><label>场景 ID</label><input placeholder="如：5324" value="'+esc(filters.id||'')+'" oninput="filters.id=this.value"></div>'+filterSelect('状态','state',['全部','已生效','未生效'])+filterSelect('分类','kind',['全部','preset','normal'])+filterSelect('来源类型','source',['全部','vehicle_resource','vlm_inference','timer','mix'])+'<div class="row" style="padding-top:23px"><button class="primary" onclick="render()">查询</button><button onclick="filters={};render()">重置</button></div></div></section><section class="panel"><div class="paneltitle"><span><span class="hot">②</span>场景列表</span><span class="tiny">'+rows.length+' 条演示数据</span></div><div class="scroll"><table><thead><tr><th>ID / 名称</th><th>模式 / 分类</th><th>渠道 / 环境</th><th>生效范围</th><th>状态</th><th>更新人 / 时间</th><th>操作</th></tr></thead><tbody>'+rows.map(s=>'<tr><td><span class="tiny">'+s.id+'</span><br><span class="name">'+s.name+'</span></td><td><span class="badge '+(s.mode==='Workflow'?'purple':'')+'">'+s.mode+'</span><br><span class="tiny">'+s.kind+' · '+s.source+'</span></td><td>master<br><span class="tiny">正式环境</span></td><td><button class="link" onclick="scopeDialog(\''+s.id+'\')">查看范围</button></td><td><span class="badge '+(s.state==='已生效'?'on':'')+'">'+s.state+'</span></td><td>演示操作人<br><span class="tiny">2026-10-08</span></td><td><button class="link" onclick="openScene(\''+s.case+'\')">'+(s.mode==='Workflow'?'查看':'编辑')+'</button><button class="link" onclick="go(6)">记录</button></td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">无匹配场景，请调整筛选条件。</div>')+'</div><p class="note"><span class="hot">③</span>简单模式可编辑；既有 Workflow 判断定义只读，修改时复制生成新的定义。</p></section></div>'+aside([['先找本次要改的场景','ID 是场景标识；分类 preset 表示系统预设场景，不等于来源类型。'],['确认在哪里生效','点击“查看范围”，检查车型、客户端版本和车辆范围，避免误改其他车辆。'],['选择正确修改入口','新建时选择简单 / Workflow；已有 Workflow 使用“复制为新 Workflow”修改。']],'本页不展示用户任务中心开关；平台场景状态与单车用户开关不是同一个状态。')+'</div>'}
function filterSelect(label,key,options){return '<div><label>'+label+'</label><select onchange="filters.'+key+'=this.value===\'全部\'?\'\':this.value">'+options.map(o=>'<option '+(filters[key]===o?'selected':'')+'>'+o+'</option>').join('')+'</select></div>'}
function newDialog(){modal('<h2>新建场景 · 选择模式</h2><p class="note">判断方式不同，后续 Action 和运行策略仍单独配置。</p><div class="radiochoice" onclick="closeModal();existing=false;configMode=\'简单\';formDraft.id=\'新建后生成\';go(2)"><b>简单模式</b><span class="note">沿用现有规则配置，适合一组条件即可表达的场景。</span></div><div class="radiochoice" onclick="closeModal();existing=false;configMode=\'Workflow\';workflowDirty=false;go(2)"><b>Workflow 模式</b><span class="note">先配基础信息、唤醒与 Action，再进入条件 / 推理画布。</span></div><div class="modalfooter"><button onclick="closeModal()">取消</button></div>')}
function modal(html){el('modal').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'}function closeModal(){el('modal').innerHTML=''}
function scopeDialog(id){let s=scenarios.find(x=>x.id===id);modal('<h2>生效范围 · '+s.name+'</h2><div class="formgrid"><div class="field"><label>车型</label><input value="M9（演示值）" readonly></div><div class="field"><label>客户端版本</label><input value="指定测试版本（演示值）" readonly></div><div class="field span2"><label>车辆范围</label><textarea readonly>DEMO_VEHICLE_001\n仅用于展示范围字段，不代表真实车辆配置</textarea></div></div><div class="hint" style="margin-top:15px">正式范围必须由产品与研发确认后再配置；原型不提交范围变更。</div><div class="modalfooter"><button onclick="closeModal()">关闭</button></div>')}
function openScene(k){if(k==='simple'){existing=true;go(2)}else{caseKey=k;existing=true;workflowDirty=false;go(k==='child'?3:k==='charge'?4:5)}}
function simplePage(){return '<div class="layout"><div><section class="panel" data-testid="p2-base"><div class="paneltitle"><span><span class="hot">①</span>基础信息</span><span class="tiny">场景身份与适用范围</span></div><div class="formgrid"><div class="field"><label>场景名称 *</label><input id="sceneName" value="'+esc(formDraft.name)+'" oninput="formDraft.name=this.value"></div><div class="field"><label>判断模式</label><select id="configMode" onchange="configMode=this.value;render()"><option '+(configMode==='简单'?'selected':'')+'>简单</option><option '+(configMode==='Workflow'?'selected':'')+'>Workflow</option></select></div></div><details><summary>更多基础信息：渠道、环境、分类、生效范围</summary><div class="formgrid" style="margin-top:10px"><div class="field"><label>渠道 / 环境</label><select><option>master / 测试环境</option><option>master / 正式环境</option></select></div><div class="field"><label>场景分类（与来源类型分别维护）</label><select><option>preset · 系统预设</option><option>normal · 普通场景</option></select></div><div class="field"><label>来源类型</label><select><option>mix · 混合</option><option>vehicle_resource · 车辆信号</option><option>vlm_inference · 视觉推理</option><option>timer · 定时</option></select></div><div class="field"><label>生效范围</label><button onclick="scopeDialog(\'5324\')">车型 / 版本 / 车辆范围</button></div></div></details></section><section class="panel" data-testid="p2-wakeup"><div class="paneltitle"><span><span class="hot">②</span>启动本次检查的唤醒规则</span><span class="badge">在 DAG 外独立配置</span></div><div class="field"><select aria-label="唤醒规则"><option>档位变化等已配置的动态信号（示例）</option><option>无动态信号：按现有条件唤醒规则处理</option></select></div><p class="note">唤醒只启动检查；任务实际有效状态与场景条件仍需判断，不能将唤醒直接当成命中。</p>'+(configMode==='简单'?'<details><summary>编辑简单模式判断条件（'+simpleRules.length+' 个）</summary>'+rulesContent()+'</details>':'<div class="row"><span class="tiny spacer">Workflow 仅有条件 / 推理节点；Action 不放进判断图。</span><button onclick="existing=false;caseKey=\'child\';setupGraph(\'child\');go(3)">进入 Workflow 画布</button></div>')+'</section><section class="panel" data-testid="p2-action">'+actionContent('simple')+'</section><div class="footerbar"><span class="note spacer">仅保存本地演示，不等于真实发布生效。</span><button onclick="validateSimple(false)">校验</button><button class="primary" onclick="validateSimple(true)">保存演示配置</button></div><div id="validation"></div></div>'+aside([['基础信息决定场景身份','新建先选择简单 / Workflow，并配置渠道、环境、分类和适用范围。'],['唤醒和条件各司其职','唤醒规则独立配置，不放入 DAG。简单模式直接填条件；Workflow 再进入画布编排判断。'],['Action 决定命中后交给谁','只填写固定建议 Query；带按钮 Action 自动带确认 / 取消。DT 生成卡片内容，策略独立配置。']],'这是完整配置结构概览。画布与 Action 分开，Trigger 不直接创建卡片或调用车控。')+'</div>'}
function baseContent(){return '<div class="paneltitle"><span><span class="hot">①</span>基础信息</span><span class="badge">简单模式</span></div><div class="formgrid"><div class="field"><label>场景名称 *</label><input id="sceneName" value="'+esc(formDraft.name)+'" oninput="formDraft.name=this.value"></div><div class="field"><label>场景 ID</label><input value="'+esc(formDraft.id)+'" readonly></div><div class="field"><label>渠道</label><select><option>master</option><option>其他渠道（演示）</option></select></div><div class="field"><label>环境 / tag</label><select><option>测试环境</option><option>正式环境</option></select></div><div class="field"><label>场景分类</label><select><option>normal · 普通场景</option><option>preset · 系统预设场景</option></select></div><div class="field"><label>来源类型</label><select><option>mix · 混合来源</option><option>vehicle_resource · 车辆信号</option><option>vlm_inference · 视觉推理</option><option>timer · 定时来源</option></select></div><div class="field span2"><label>生效范围</label><div class="row"><input style="flex:1" readonly value="M9 / 指定测试版本 / DEMO_VEHICLE_001"><button onclick="scopeDialog(\'5327\')">查看范围</button></div></div></div><p class="note">范围中的车型、版本和车辆为演示值；不能作为真实上线范围。</p>'}
function rulesContent(){return '<div class="paneltitle"><span><span class="hot">②</span>唤醒与判断</span><button onclick="simpleRules.push({field:\'车辆信号（待选择）\',op:\'等于\',value:\'\'});render()">＋ 判断条件</button></div><div class="field"><label>启动本次检查的唤醒来源</label><select><option>已配置的动态信号发生变化（示例）</option><option>无动态信号：按现有条件唤醒规则处理</option></select></div><p class="hint" style="margin-top:12px">唤醒只是启动检查；还要读取场景条件和本车任务有效状态。此处不新增 DAG 的 Timer 节点。</p>'+simpleRules.map((r,i)=>'<div class="rule"><span class="badge">条件 '+(i+1)+'</span><select onchange="simpleRules['+i+'].field=this.value"><option>'+esc(r.field)+'</option><option>车速</option><option>当前驾驶模式</option></select><select style="width:90px" onchange="simpleRules['+i+'].op=this.value"><option>'+esc(r.op)+'</option><option>等于</option><option>不等于</option><option>大于</option></select><input value="'+esc(r.value)+'" placeholder="条件值" oninput="simpleRules['+i+'].value=this.value"><button class="link danger" onclick="simpleRules.splice('+i+',1);render()">删除</button></div>').join('')+'<div class="row"><label class="check"><input type="radio" name="simplejoin" checked>全部满足 AND</label><label class="check"><input type="radio" name="simplejoin">任一满足 OR</label></div><details><summary>查看开关边界</summary><p>本车单项任务开关与 AI 设置总开关不同层级。场景命中前需要读取实际有效状态；状态读取失败不能当成已开启。</p></details>'}
const queries={child:'出行 advisor：本次场景发现后排儿童或宠物，且儿童锁未开启。建议用户开启儿童锁。策略：先询问，确认后执行。',charge:'出行 advisor：本次停车场景符合充电口盖建议的前置条件。请先通过视觉工具检查当前是否存在充电设备；明确发现设备后，询问用户是否打开充电口盖。策略：先识别、再询问，确认后执行。',mirror:'出行 advisor：本次场景满足后视镜加热建议条件。建议用户开启后视镜加热。策略：先询问，确认后执行。'};
function actionContent(k){let q=k==='simple'?formDraft.query:(queries[k]);return '<div class="paneltitle"><span><span class="hot">③</span>Action 与运行策略</span><span class="badge purple">判断成功后触发</span></div><div class="field"><label>处理方式</label><select><option>主动推荐（自动带确认 / 取消） · recommend_with_card</option></select></div><div class="field" style="margin-top:12px"><label>固定建议 Query · advisors_input *</label><textarea id="query" oninput="'+(k==='simple'?'formDraft.query=this.value':'queries[\''+k+'\']=this.value')+'">'+esc(q)+'</textarea></div><div class="row" style="margin-top:10px"><span class="tiny">自动按钮预览：</span><button disabled>确认</button><button disabled>取消</button><span class="tiny">文案 / TTS 由下游 DT 生成，不在此填入。</span></div><details><summary>查看运行策略与协议（展开）</summary><div class="formgrid" style="margin-top:10px"><div class="field"><label>次数限制（演示，非上线定值）</label><input type="number" value="1" min="1"></div><div class="field"><label>间隔秒数（演示，非上线定值）</label><input type="number" value="300" min="0"></div></div><pre>'+esc('advisors_input: "'+q+'"\nreal_time_card: "{\"enabled\":true,\"buttons\":[\"确认\",\"取消\"]}"\n备注：real_time_card 为序列化字符串示意；正式按钮字段遵循接口协议。\nsimulator_supported: false')+'</pre><p class="note">这里只演示交互，不是后台模拟器。次数 / 间隔限制不等于禁止产生新的 Run。</p></details>'}
function validateSimple(save){if(el('sceneName'))formDraft.name=el('sceneName').value;if(el('query'))formDraft.query=el('query').value;let errs=[];if(!formDraft.name.trim())errs.push('请补齐场景名称。');if(configMode==='简单'&&!simpleRules.length)errs.push('至少配置一个判断条件。');if(configMode==='简单'&&simpleRules.some(x=>!x.value.trim()))errs.push('有判断条件未填写条件值，请展开简单模式判断条件补齐。');if(!formDraft.query.trim())errs.push('固定建议 Query 不能为空。');if(errs.length){el('validation').innerHTML='<div class="error">'+errs.join('<br>')+'</div>';return}el('validation').innerHTML='';if(save&&configMode==='Workflow'){toast('基础配置已保存在本地草稿；继续配置和校验 Workflow。');existing=false;setupGraph('child');caseKey='child';go(3)}else if(save){let s=scenarios.find(x=>x.case==='simple');s.name=formDraft.name;toast('已保存到本地演示列表；未发布到真实后台。');go(1)}else toast('基础配置演示校验通过；'+(configMode==='Workflow'?'Workflow 判断图仍需另行校验。':'判断条件与建议 Query 已填写。'))}
const definitions={child:{label:'儿童锁保护',source:'档位切换到 D（DAG 外唤醒）',nodes:[{id:'child',name:'后排存在儿童',desc:'同一乘客对象：位置 + 年龄',x:85,y:40,type:'condition'},{id:'pet',name:'后排存在宠物',desc:'ObjectsDesc 文本推理',x:85,y:218,type:'inference'},{id:'sink',name:'儿童锁未开启',desc:'唯一 Sink · 自身仍需判断',x:465,y:124,type:'sink',join:'OR'}],edges:[['child','sink'],['pet','sink']]},charge:{label:'充电口盖建议',source:'档位变化（DAG 外唤醒）',nodes:[{id:'park',name:'档位为 P',desc:'停车前置条件',x:18,y:124,type:'condition'},{id:'cover',name:'充电口盖关闭',desc:'当前口盖真实状态',x:260,y:124,type:'condition'},{id:'sink',name:'SOC ≤ 20%',desc:'唯一 Sink · 示例阈值待确认',x:500,y:124,type:'sink',join:'AND'}],edges:[['park','cover'],['cover','sink']]},mirror:{label:'后视镜加热建议',source:'档位 / 车速变化（DAG 外唤醒）',nodes:[{id:'park',name:'档位为 P',desc:'原技术稿示例，策略待确认',x:5,y:125,type:'condition'},{id:'speed',name:'车速 < 70',desc:'示例阈值待业务确认',x:180,y:125,type:'condition'},{id:'rain',name:'下雨',desc:'天气推理分支',x:355,y:125,type:'inference'},{id:'humidity',name:'湿度 > 60%',desc:'信号待接入 · 暂不可选',x:355,y:12,type:'condition',missing:true},{id:'wash',name:'洗车场景',desc:'信号待接入 · 暂不可选',x:180,y:238,type:'condition',missing:true},{id:'temp',name:'温差 > 5',desc:'信号待接入 · 暂不可选',x:355,y:238,type:'condition',missing:true},{id:'sink',name:'后视镜加热未开启',desc:'唯一 Sink · OR 合并',x:530,y:125,type:'sink',join:'OR'}],edges:[['park','speed'],['speed','rain'],['rain','sink'],['humidity','sink'],['wash','sink'],['temp','sink']]}};
function setupGraph(k){let d=definitions[k];graphNodes=d.nodes.map(n=>({...n}));edges=d.edges.map(e=>[...e]);selected=graphNodes[0].id}
function workflowPage(){let k=current===3?'child':current===4?'charge':'mirror';if(caseKey!==k||!graphNodes.length){caseKey=k;setupGraph(k)}let d=definitions[k];return '<div class="layout"><div><div class="hint"><span class="hot">①</span>'+d.label+' · preset · master / 测试环境 · '+(existing?'既有判断定义只读；修改请先复制。':'新建草稿可编辑；所有保存仅为原型演示。')+'</div><section class="panel"><div class="paneltitle"><span><span class="hot">②</span>Workflow 判断画布</span><span class="badge '+(existing?'orange':'on')+'">'+(existing?'只读':'新建可编辑')+'</span></div><div class="row" style="margin-bottom:10px"><span class="tiny">唤醒规则（独立配置）</span><span class="badge">'+d.source+'</span><span class="spacer"></span><button onclick="addNode(\'condition\')" '+(existing?'disabled':'')+'>＋ 条件</button><button onclick="addNode(\'inference\')" '+(existing?'disabled':'')+'>＋ 推理</button></div><div class="graph" id="graph"></div><div class="graphbottom"><select id="edgefrom" '+(existing?'disabled':'')+'>'+graphNodes.map(n=>'<option value="'+n.id+'">'+n.name+'</option>').join('')+'</select><span>→</span><select id="edgeto" '+(existing?'disabled':'')+'>'+graphNodes.map((n,i)=>'<option value="'+n.id+'" '+(i===graphNodes.length-1?'selected':'')+'>'+n.name+'</option>').join('')+'</select><button onclick="addEdge()" '+(existing?'disabled':'')+'>添加连线</button><button onclick="edgeDialog()" '+(existing?'disabled':'')+'>管理连线</button><span class="spacer"></span><button class="link danger" onclick="cycleDemo()" '+(existing?'disabled':'')+'>演示错误连线</button></div><div id="properties"></div></section><section class="panel" style="padding:13px 18px"><details style="margin:0"><summary><span class="hot">③</span>命中后的 Action：主动推荐 → DT · 点击展开配置</summary><div style="margin-top:12px">'+actionContent(k)+'</div></details>'+(k==='charge'?'<p class="note">出卡前：DT 调用 VQA 检查充电设备；未知 / 未发现设备不产生开盖执行建议。Trigger 不调用工具。</p>':k==='mirror'?'<p class="note">湿度、洗车、温差信号尚待确认：<button disabled style="font-size:11px;padding:2px 6px">暂不可选</button> 不用提示词补造信号。</p>':'<p class="note">儿童条件需匹配同一乘客对象；宠物通过 ObjectsDesc 推理。两条分支不是取消另一条的竞速。</p>')+'</section><div class="footerbar"><span class="note spacer">定义：只有条件 / 推理；Source 默认 AND；唯一 Sink 决定最终判定。</span><button onclick="validateGraph(false)">校验</button><button class="primary" onclick="validateGraph(true)" '+(existing?'disabled':'')+'>保存演示配置</button></div><div id="validation"></div></div>'+aside([['唤醒不等于通过','动态信号启动一次 Run。Run 进入画布后，仍要逐节点判断；唤醒规则不作为 DAG 节点。'],['节点只做条件或推理','点击节点查看属性。多个前驱默认 AND，可配置 OR；满足前驱后还要判断当前节点自身内容。'],['最终通过再进入 Action','其他分支不自动取消；等所有节点终态后取唯一 Sink 结果，再按运行策略发起 Action。']],k==='charge'?'设备识别属于 DT / VQA 下游环节，不画成 Trigger 的工具调用节点。':'本任务进入主动推荐 / DT；“不额外调用 VQA”不等于“不走 DT”。')+'</div>'}
function drawGraph(readonly=false){let states=readonly?recordStates():{};let g=el('graph');if(!g)return;g.innerHTML='<div class="graphinner"><svg viewBox="0 0 700 330"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ca5c8"/></marker></defs>'+edges.map(e=>{let a=graphNodes.find(n=>n.id===e[0]),b=graphNodes.find(n=>n.id===e[1]);if(!a||!b)return'';return '<path d="M '+(a.x+158)+' '+(a.y+39)+' C '+(a.x+200)+' '+(a.y+39)+', '+(b.x-40)+' '+(b.y+39)+', '+b.x+' '+(b.y+39)+'" fill="none" stroke="#8ca5c8" stroke-width="1.8" marker-end="url(#arrow)"/>'}).join('')+'</svg>'+graphNodes.map(n=>'<button class="node '+n.type+' '+(selected===n.id?'selected':'')+'" style="left:'+n.x+'px;top:'+n.y+'px" onclick="selectNode(\''+n.id+'\','+readonly+')"><span>'+n.id+' · '+(n.type==='inference'?'推理节点':'条件节点')+'</span>'+(readonly?'<em class="nodestate">'+states[n.id]+'</em>':'')+'<b>'+n.name+'</b><span>'+n.desc+'</span>'+(n.id==='sink'?'<br><span class="badge '+(n.join==='OR'?'purple':'')+'">前驱合并 '+n.join+'</span>':'')+'</button>').join('')+'</div>';if(!readonly)properties();else recordProps()}
function selectNode(id,readonly){selected=id;drawGraph(readonly);markMissingNodes()}
function markMissingNodes(){let buttons=el('graph')?.querySelectorAll('.node');if(buttons)buttons.forEach((b,i)=>{if(graphNodes[i]?.missing)b.classList.add('missing')})}
function properties(){let n=graphNodes.find(x=>x.id===selected);if(!n)return;let mult=edges.filter(e=>e[1]===n.id).length>=2;el('properties').innerHTML='<div class="props"><div class="formgrid"><div><label>所选节点名称</label><input value="'+esc(n.name)+'" '+(existing?'readonly':'')+' onchange="graphNodes.find(n=>n.id===selected).name=this.value;workflowDirty=true;drawGraph()"></div><div><label>节点类型</label><input readonly value="'+(n.type==='inference'?'推理：配置输入与判断提示':'条件：读取已接入信号')+'"></div><div><label>多个前驱合并关系</label><select onchange="graphNodes.find(n=>n.id===selected).join=this.value;drawGraph()" '+(existing||!mult?'disabled':'')+'><option '+(n.join!=='OR'?'selected':'')+'>AND</option><option '+(n.join==='OR'?'selected':'')+'>OR</option></select></div></div><div class="proptext">'+(n.id==='child'?'读取 vlm_inside001：位置、年龄必须来自同一个 passenger 对象。':n.id==='pet'?'输入 ObjectsDesc，由推理节点判断是否存在后排宠物；不是伪造 pet 布尔信号。':n.id==='sink'?'前驱关系决定何时允许运行；本节点仍执行自身条件。最终 Run 等全部节点终态，再采用 Sink 判定。':esc(n.desc))+'</div>'+(existing?'<div class="locked">当前为既有 Workflow。点击“复制为新 Workflow”后才能修改判断定义。</div>':'<button class="link danger" onclick="deleteNode()">删除所选节点</button>')+'</div>'}
function copyWorkflow(){existing=false;workflowDirty=false;toast('已复制为新 Workflow 草稿（本地演示）；原有定义不变。');render()}
function addNode(type){if(existing)return;let id='new'+conditionCounter++;graphNodes.push({id,name:type==='inference'?'新推理节点':'新条件节点',desc:'待补齐判断定义',type,x:450,y:250,join:'AND'});selected=id;workflowDirty=true;render()}
function deleteNode(){if(existing)return;let id=selected;graphNodes=graphNodes.filter(n=>n.id!==id);edges=edges.filter(e=>e[0]!==id&&e[1]!==id);selected=graphNodes[0]?.id;workflowDirty=true;render()}
function addEdge(){if(existing)return;let a=el('edgefrom').value,b=el('edgeto').value;if(edges.some(e=>e[0]===a&&e[1]===b)){toast('该连线已存在。');return}edges.push([a,b]);workflowDirty=true;drawGraph();toast('连线已添加；请校验是否存在循环。')}

function flashDemoStructure(){return {说明:'仅产品演示数据结构，不是正式 API 协议；无真实接口调用',场景名:flashDraft.name,条件:{描述来源:flashSourceLabel(),判断目标:flashDraft.target,输入接入:'后台预设视觉描述入口尚未接通，待确认'},动作:{一期:'固定文字',正文:flashDraft.body,展示方向:'普通通知卡；Frontier 为会议选择方向，原型未连接',标题:'不显示',按钮:'不显示',TTS:'不播报'},依赖:{PHUD:'条件通路、图案映射与接口待确认，不配置图案 ID',统一仲裁:'复用客户端统一策略；覆盖 / 排队能力的交付版本待确认'},运行限制:'监测频率、重复命中、文案长度、展示时长均待确认；不设伪定值'};}
function flashRefreshPreview(){if(el('flashBodyPreview'))el('flashBodyPreview').textContent=flashDraft.body.trim()?flashDraft.body:'请填写固定文案';if(el('flashSerialization'))el('flashSerialization').textContent=JSON.stringify(flashDemoStructure(),null,2);}
function flashPreview(body,show,label){return '<div class="flashpreview"><div class="screenlabel">'+esc(label)+'</div>'+(show?'<div class="flashcard" '+(current===7?'id="flashBodyPreview"':'id="flashDisplayedCard"')+'>'+esc(body.trim()?body:'请填写固定文案')+'</div>':'<div class="flashplaceholder" id="flashNoDisplay">本次未展示通知卡</div>')+'</div><div class="flashbodylabel">正文无标题 · 无按钮 · 无 TTS；外框为演示屏幕，不是通知卡标题。</div>';}
function flashDeps(){return '<div class="flashdeps"><div><b>视觉输入入口</b><p>后台预设规则直接接收舱内 / 舱外描述，目前尚未接通；接入点待确认。</p><span class="badge orange">待确认 / 待接入</span></div><div><b>PHUD 感知图案</b><p>整体需求相关；触发通路、映射与接口待确认。此原型不下发 PHUD。</p><span class="badge orange">接口待确认</span></div><div><b>客户端统一仲裁</b><p>复用统一策略；当前覆盖与规划排队能力对应交付版本待核实。</p><span class="badge orange">版本待确认</span></div></div>';}
function flashConfigPage(){return '<div class="layout"><div><div class="hint">新增系统预设分支：条件模型用于判断描述，一期固定文案用于输出。所有填写及预览均为产品演示。</div><section class="panel"><div class="paneltitle"><span><span class="hot">①</span>场景与视觉判断条件</span><span class="badge">preset · 本地草稿</span></div><div class="formgrid"><div class="field"><label for="flashName">场景名称 *</label><input id="flashName" value="'+esc(flashDraft.name)+'" oninput="flashUpdate(\'name\',this.value)"></div><div class="field"><label for="flashSource">描述来源 *</label><select id="flashSource" onchange="flashUpdate(\'source\',this.value)"><option value="inside" '+(flashDraft.source==='inside'?'selected':'')+'>舱内视觉描述</option><option value="outside" '+(flashDraft.source==='outside'?'selected':'')+'>舱外视觉描述</option></select></div><div class="field span2"><label for="flashTarget">需要判断的目标 *</label><textarea id="flashTarget" oninput="flashUpdate(\'target\',this.value)" placeholder="例如：判断描述是否明确显示乘客正在睡眠。">'+esc(flashDraft.target)+'</textarea><p class="note">描述是视觉语言模型看图后输出的一段文字。一期复用现有模型判断；试跑页由你手动指定模拟判定。</p></div></div><p class="warn">输入入口尚未接通。此处不表示已有真实舱内 / 舱外数据；车辆区分、数据时效、缺失处理及状态组合规则仍待确认。</p></section><section class="panel"><div class="paneltitle"><span><span class="hot">②</span>命中后的 Action · 闪念固定文字</span><span class="badge purple">普通通知卡方向</span></div><div class="formgrid"><div class="field"><label for="flashActionMode">输出方式</label><select id="flashActionMode"><option value="fixed">一期 · 使用配置的固定文案</option><option value="dynamic" disabled>二期 · 动态生成文案（未开放）</option></select><p class="note">二期需要另行配置生成逻辑，暂无确定排期。</p></div><div class="field"><label>消息与呈现方向</label><input readonly value="Frontier → 普通通知卡（原型未连接）"></div><div class="field span2"><label for="flashBody">固定文案 *</label><textarea id="flashBody" oninput="flashUpdate(\'body\',this.value)">'+esc(flashDraft.body)+'</textarea><p class="note">条件满足后取出这段文字；不要求用户确认，不发起车控。正文长度、卡片高度和展示时长待试下发验证。</p></div></div>'+flashPreview(flashDraft.body,true,'中控屏配置预览 · 不等于真实出卡')+'</section><section class="panel"><div class="paneltitle"><span><span class="hot">③</span>上线依赖与演示结构</span><span class="badge orange">未收口项</span></div>'+flashDeps()+'<details><summary>查看产品演示数据结构（非正式 API 协议）</summary><pre id="flashSerialization">'+esc(JSON.stringify(flashDemoStructure(),null,2))+'</pre></details></section><div class="footerbar"><span id="flashSaveState" class="note spacer">'+esc(flashStorageMessage)+'</span><button id="flashLoad" onclick="flashLoad()">重新读取草稿</button><button id="flashValidate" onclick="if(flashValidate())toast(\'本地表单校验通过，未发布。\')">校验</button><button id="flashSave" class="primary" onclick="flashSave()">保存闪念草稿</button><button id="flashTry" onclick="flashTry()">进入模拟试跑</button></div><div class="row" style="margin-top:8px"><button id="flashClear" class="link danger" onclick="flashClear()">清除本原型闪念草稿</button><span class="tiny">仅保存一份独立闪念演示草稿；不修改原有场景。</span></div><div id="flashValidation"></div></div>'+aside([['先说车辆看到了什么','选择描述来自舱内还是舱外，再写需要判断的目标。这里不配置 PHUD 图案 ID。'],['条件与输出各管一件事','模型判断是否满足目标；固定文案是命中后展示的文字。动态文案属于二期。'],['保存只代表本地草稿','列表可以重新打开；还需验证输入接入、下发协议、实际卡片展示和 PHUD 整体效果。']],'当前只演示配置结构。修改任何配置字段会清空旧试跑结果；预览不代表后台生效或车机已展示。')+'</div>';}
function flashCaptionChange(value){flashCaption=value;flashInvalidate();if(el('flashRunOutput'))el('flashRunOutput').innerHTML=flashRunContent();if(el('flashManualChoices'))el('flashManualChoices').innerHTML=flashManualChoices();if(el('flashSend'))el('flashSend').disabled=true;if(el('flashRunState'))el('flashRunState').textContent='描述已修改，旧判定和下发结果已清空。';}
function flashExample(which){flashCaption=which==='outside'?'车窗外有连绵的山和开阔的湖面，视野明亮。（手工演示描述）':which==='unknown'?'画面昏暗，人物面部被遮挡，无法确认是否正在休息。（手工演示描述）':'后排乘客闭着眼睛，头靠在座椅靠背上，保持安静。（手工演示描述）';flashInvalidate();render();}
function flashManualChoices(){return ['PASS','REJECT','UNKNOWN'].map(v=>'<button id="flashVerdict'+v+'" class="pill '+(flashManual===v?'active':'')+'" onclick="flashSelectVerdict(\''+v+'\')">'+v+' · '+({PASS:'满足',REJECT:'不满足',UNKNOWN:'无法判断'}[v])+'</button>').join('');}
function flashSelectVerdict(v){if(!['PASS','REJECT','UNKNOWN'].includes(v))return;flashManual=v;flashRun=null;render();}
function flashRunJudge(){const errs=flashErrors();if(!flashCaption.trim())errs.push('请填写本次手工演示描述。');if(!flashManual)errs.push('请手动选择模拟判定。');if(errs.length){el('flashRunValidation').innerHTML='<div class="error" role="alert">'+errs.map(esc).join('<br>')+'</div>';return;}flashRun={fingerprint:flashFingerprint(),verdict:flashManual,delivery:null};render();}
function flashChangeDelivery(value){if(!['failure','received','shown'].includes(value))return;flashDeliveryChoice=value;if(flashRun)flashRun.delivery=null;render();}
function flashSend(){if(!flashRun||flashRun.verdict!=='PASS'||flashRun.fingerprint!==flashFingerprint()){toast('请先完成有效的 PASS 模拟判定。');return;}flashRun.delivery=flashDeliveryChoice;render();}
function flashStep(n,title,detail,cls=''){return '<div class="flashstep '+cls+'"><span class="num">'+n+'</span><div><b>'+esc(title)+'</b><p>'+esc(detail)+'</p></div></div>';}
function flashRunContent(){const r=flashRun&&flashRun.fingerprint===flashFingerprint()?flashRun:null,d=r?.delivery;let chain=flashStep(1,'提供演示描述',flashCaption.trim()?'手工输入 '+flashSourceLabel()+'；没有读取真实车内 / 车外画面。':'尚未输入演示描述。');chain+=flashStep(2,r?'手工模拟判定：'+r.verdict:'模拟判定：尚未运行',!r?'先选择 PASS / REJECT / UNKNOWN，再点击“应用手动模拟判定”。':r.verdict==='PASS'?'用户指定满足目标；允许继续演示固定文字下发。':r.verdict==='REJECT'?'用户指定不满足目标；本次不下发，等待后续描述。':'用户指定信息不足；本次不下发，缺失不能当作满足。',r?(r.verdict==='PASS'?'completed':'blocked'):'');chain+=flashStep(3,d==='failure'?'普通通知卡下发：发送失败':d?'普通通知卡下发：模拟已发送':'普通通知卡下发：未发起',d==='failure'?'模拟发送失败，客户端接收未确认；本次不显示成功卡。':d?'取用当前固定文案；没有访问真实 Frontier。':r?.verdict==='PASS'?'点击“模拟下发普通通知卡”后才产生下发结果。':'仅 PASS 可以模拟下发。',d==='failure'?'blocked':d?'completed':'');chain+=flashStep(4,d==='shown'||d==='received'?'客户端接收：模拟已接收':'客户端接收：未确认',d==='received'?'已接收仍在等待展示；可能受统一仲裁影响，不能认为已出卡。':d==='shown'?'本次手动选择同时包含接收与展示成功，仅为演示。':'没有客户端接收证据。',d==='shown'||d==='received'?'completed':'');chain+=flashStep(5,d==='shown'?'中控屏：模拟展示成功':'中控屏：未展示 / 待确认',d==='shown'?'正文无标题、按钮、TTS。实际卡片高度、时长及效果仍需车辆联调验证。':d==='received'?'客户端已接收，但当前演示没有展示成功；下方不展示成功卡。':'未下发或发送失败时，不显示成功卡。',d==='shown'?'completed':'');return '<div class="flashsteps" id="flashChain">'+chain+'</div><p class="warn" style="margin-top:12px">接收 ≠ 展示。以下屏幕只在手动选择“展示成功”并点击模拟下发后出现通知正文。</p>'+flashPreview(flashDraft.body,d==='shown','中控屏试跑结果 · 全部为手动模拟')+'<p class="note">PHUD 不参与本次模拟：接口、映射与关联时序待确认；本链路不包含车控或通用工具调用。</p>';}
function flashRunPage(){const pass=flashRun?.verdict==='PASS'&&flashRun.fingerprint===flashFingerprint();return '<div class="layout"><div><div class="hint">交互讲解：本页由你手动指定判定与下发结果，未调用模型或真实车辆。例句不自带“正确结果”。</div><section class="panel"><div class="paneltitle"><span><span class="hot">①</span>本次场景与演示输入</span><button id="flashBackConfig" onclick="go(7)">返回闪念配置</button></div><div class="row"><span class="badge">'+esc(flashDraft.name)+'</span><span class="badge">'+flashSourceLabel()+'</span></div><p class="note"><b>当前判断目标：</b>'+esc(flashDraft.target)+'</p><div class="field"><label for="flashCaption">手工演示描述 *</label><textarea id="flashCaption" oninput="flashCaptionChange(this.value)">'+esc(flashCaption)+'</textarea></div><div class="row" style="margin-top:9px"><span class="tiny">填入示例：</span><button id="flashExampleInside" onclick="flashExample(\'inside\')">乘客休息描述</button><button id="flashExampleOutside" onclick="flashExample(\'outside\')">舱外风景描述</button><button id="flashExampleUnknown" onclick="flashExample(\'unknown\')">信息不足描述</button></div><p class="note">示例只替换本次描述；不会改变配置来源或目标，也不会自动判定。修改配置或描述会使旧结果失效。</p></section><section class="panel"><div class="paneltitle"><span><span class="hot">②</span>手动选择模拟判定</span><span class="badge orange">没有真实推理</span></div><div id="flashManualChoices" class="row flashchoices">'+flashManualChoices()+'</div><div class="row" style="margin-top:12px"><button id="flashApplyVerdict" class="primary" onclick="flashRunJudge()">应用手动模拟判定</button><span id="flashRunState" class="tiny">'+(flashRun?'已应用 '+esc(flashRun.verdict)+' 手工演示判定。':'尚未产生有效模拟判定。')+'</span></div><div id="flashRunValidation"></div></section><section class="panel"><div class="paneltitle"><span><span class="hot">③</span>仅 PASS 可以模拟下发</span><span class="badge">固定文字 → 普通通知卡</span></div><div class="formgrid"><div class="field"><label for="flashDelivery">手动选择下发 / 展示结果</label><select id="flashDelivery" onchange="flashChangeDelivery(this.value)"><option value="failure" '+(flashDeliveryChoice==='failure'?'selected':'')+'>发送失败</option><option value="received" '+(flashDeliveryChoice==='received'?'selected':'')+'>已接收待展示</option><option value="shown" '+(flashDeliveryChoice==='shown'?'selected':'')+'>展示成功（模拟）</option></select></div><div class="field" style="align-self:end"><button id="flashSend" class="primary" onclick="flashSend()" '+(pass?'':'disabled')+'>模拟下发普通通知卡</button></div></div><div id="flashRunOutput">'+flashRunContent()+'</div></section></div>'+aside([['描述与判定分开','你手工填入演示描述，再主动选择判定。本页不根据关键词冒充模型判断。'],['只有 PASS 进入输出','REJECT 表示明确不满足，UNKNOWN 表示信息不足；两者都不发送固定文字。'],['沿链路逐层确认','发送失败、已接收待展示和展示成功分开呈现；只有展示成功出现结果卡。']],'所有例句、判定和结果均为手动演示。后台输入、真实模型、Frontier、PHUD 和客户端仲裁均未连接。')+'</div>';}
function listPage(){
 const names=scenarios.map(s=>s.name);scenarios.forEach(s=>s.name=esc(s.name));let html;try{html=flashV04.list();}finally{scenarios.forEach((s,i)=>s.name=names[i]);}
 const f={id:flashDemoId,name:flashDraft.name,mode:'闪念',kind:'preset',source:'aidv_backend',scene_type:'vlm_inference',state:'未生效',channel:'master',tag:'测试环境'};const visible=(!filters.name||f.name.includes(filters.name))&&(!filters.id||f.id.includes(filters.id))&&(!filters.state||f.state===filters.state)&&(!filters.kind||f.kind===filters.kind)&&(!filters.source||f.source===filters.source)&&(!filters.channel||f.channel===filters.channel)&&(!filters.tag||f.tag===filters.tag)&&(!filters.scene_type||f.scene_type===filters.scene_type);
 if(visible){let row='<tr id="flashSceneRow"><td><span class="tiny">'+flashDemoId+'</span><br><span class="name">'+esc(f.name)+'</span></td><td><span class="badge purple">闪念固定文字</span><br><span class="tiny">preset · vlm_inference · aidv_backend</span></td><td>master<br><span class="tiny">测试环境</span></td><td><span class="tiny">原型本地 · 无真实车辆</span></td><td><span class="badge orange">未生效</span><br><span class="tiny">'+(flashDraft.saved?'已保存草稿':'演示示例 / 未保存')+'</span></td><td>演示操作人<br><span class="tiny">本浏览器草稿</span></td><td><button id="flashOpenFromList" class="link" onclick="flashOpen()">配置闪念</button><button id="flashTryFromList" class="link" onclick="go(8)">模拟试跑</button></td></tr>';html=html.replace('</tbody>',row+'</tbody>').replace(/(\d+) 条演示数据/,(_,n)=>(Number(n)+1)+' 条演示数据').replace('<div class="empty">无匹配场景，请调整筛选条件。</div>','');}
 return html.replace('简单模式可编辑；','闪念示例可进入独立配置；简单模式可编辑；');
}
function openById(id){if(id===flashDemoId){flashOpen();return;}flashV04.openById(id);}
function scopeDialog(id){if(id===flashDemoId){toast('闪念仅本浏览器演示，未指定真实生效范围。');return;}flashV04.scope(id);}
function newDialog(){flashV04.newDialog();const footer=el('modal').querySelector('.modalfooter');if(footer)footer.insertAdjacentHTML('beforebegin','<div id="flashNewChoice" class="radiochoice" role="button" tabindex="0" onclick="flashNew()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();flashNew()}"><b>豆包闪念 · 一期固定文字</b><span class="note">新增独立草稿：选择视觉描述、填写判断目标、配置静默通知正文。</span></div>');}
function actionContent(k){let html=flashV04.action(k);return html.replace('<select><option>主动推荐（自动带确认 / 取消） · recommend_with_card</option></select>','<select id="actionType-'+esc(k)+'" aria-label="Action 类型" onchange="if(this.value===\'flash\')flashStartFromAction()"><option value="recommend">主动推荐（自动带确认 / 取消） · recommend_with_card</option><option value="flash">豆包闪念 · 固定文字普通通知卡（独立配置）</option></select><p class="note">选择闪念将打开独立草稿；原场景的判断和 Action 不会被替换。</p>');}
function render(){let p=Math.max(1,Math.min(8,parseInt(location.hash.replace('#p',''))||1));if(p<=6){flashV04.render();return;}current=p;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav==='config'));el('main').innerHTML='<div class="crumb">场景管理 / 豆包闪念 / '+pages[current-1]+'</div><div class="heading"><h1>'+pages[current-1]+'</h1><span class="badge">评审页 P'+current+'</span><div class="right"><button onclick="go(1)">返回列表</button></div></div>'+pageNav()+(current===7?flashConfigPage():flashRunPage());}
document.title='触发器配置平台 · 交互评审原型 v05';document.querySelector('.version').textContent='交互评审原型 v05 · 新增豆包闪念';
render();
</script>
