1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">B10</tspan></text><text x="60" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">决定缺失信息时如何继续</tspan></text><text x="60" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">消费方</tspan></text><text x="60" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">本业务的缺失处理</tspan></text></g></a></g></svg>