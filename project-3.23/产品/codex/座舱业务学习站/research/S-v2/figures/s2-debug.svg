<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="s2-debug" width="1200" height="924" viewBox="0 0 1200 924" role="img" aria-labelledby="s2-debug-title s2-debug-desc">
<title id="s2-debug-title">建议没出、出错了、车没动，从哪里查</title><desc id="s2-debug-desc">沿一条建议从机会入口查到界面回显。建议已经下发时，用推荐编号串起这次服务。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="s2-debug-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">建议没出、出错了、车没动，从哪里查</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">沿一条建议从机会入口查到界面回显。建议已经下发时，用推荐编号串起这次服务。</text>
<text class="v56-label" x="54" y="106" text-anchor="start">按顺序查建议停在哪一层</text>
<text class="v56-label" x="748" y="106" text-anchor="start">到这一层找谁</text>
<path class="v56-rule" d="M 720 120 L 720 845"/>
<g data-node="true" id="s2-debug-opportunity">
<rect class="v56-cloud" x="40" y="124" width="624" height="78" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="147" text-anchor="start">01 · 机会到没到</text>
<text class="v56-node-sub" x="54" y="168" text-anchor="start">主驾上车信号到了吗？触发器交出关注事件了吗？</text>
</g>
<text class="v56-node-sub" x="748" y="152" text-anchor="start">触发器 G 章 · 端状态 B 章 · 视觉 A 章</text>
<text class="v56-node-sub" x="748" y="174" text-anchor="start">人脸身份与记忆 K 章</text>
<path class="v56-rule" d="M 748 216 L 1160 216"/>
<path class="v56-arrow" d="M 352 202 L 352 230" marker-end="url(#s2-debug-arr)"/>
<g data-node="true" id="s2-debug-advisor">
<rect class="v56-decision" x="40" y="230" width="624" height="78" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="253" text-anchor="start">02 · Advisor 出没出、对不对</text>
<text class="v56-node-sub" x="54" y="274" text-anchor="start">核对建议里的事实、对象、行动和策略</text>
<text class="v56-node-sub" x="54" y="294" text-anchor="start">评估后选择保持安静时，会正常返回“没有建议”</text>
</g>
<text class="v56-node-sub" x="748" y="273" text-anchor="start">Advisor 与服务商弋途</text>
<path class="v56-rule" d="M 748 322 L 1160 322"/>
<path class="v56-arrow" d="M 352 308 L 352 336" marker-end="url(#s2-debug-arr)"/>
<g data-node="true" id="s2-debug-timing">
<rect class="v56-decision" x="40" y="336" width="624" height="78" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="359" text-anchor="start">03 · 过了下发前时机校验吗</text>
<text class="v56-node-sub" x="54" y="380" text-anchor="start">查车辆、账号、正在进行的对话或播报，以及建议是否被替换</text>
</g>
<text class="v56-node-sub" x="748" y="379" text-anchor="start">Advisor 下发链路与车端接收链路</text>
<path class="v56-rule" d="M 748 428 L 1160 428"/>
<path class="v56-arrow" d="M 352 414 L 352 442" marker-end="url(#s2-debug-arr)"/>
<g data-node="true" id="s2-debug-planner">
<rect class="v56-local" x="40" y="442" width="624" height="78" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="465" text-anchor="start">04 · Planner 收到了吗，怎么处理</text>
<text class="v56-node-sub" x="54" y="486" text-anchor="start">查 Planner 是否收到 advisor 输入，采纳了哪部分</text>
</g>
<text class="v56-node-sub" x="748" y="485" text-anchor="start">Planner</text>
<path class="v56-rule" d="M 748 534 L 1160 534"/>
<path class="v56-arrow" d="M 352 520 L 352 548" marker-end="url(#s2-debug-arr)"/>
<g data-node="true" id="s2-debug-control">
<rect class="v56-local" x="40" y="548" width="624" height="78" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="571" text-anchor="start">05 · 车控回执和实际状态一致吗</text>
<text class="v56-node-sub" x="54" y="592" text-anchor="start">查回执和读回状态，核对空调到底有没有开</text>
</g>
<text class="v56-node-sub" x="748" y="591" text-anchor="start">车控 E 章</text>
<path class="v56-rule" d="M 748 640 L 1160 640"/>
<path class="v56-arrow" d="M 352 626 L 352 654" marker-end="url(#s2-debug-arr)"/>
<g data-node="true" id="s2-debug-speech">
<rect class="v56-local" x="40" y="654" width="624" height="78" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="677" text-anchor="start">06 · 主驾真的听到播报了吗</text>
<text class="v56-node-sub" x="54" y="698" text-anchor="start">按策略核对是否起播、是否被打断</text>
</g>
<text class="v56-node-sub" x="748" y="697" text-anchor="start">Planner 与语音播报链路</text>
<path class="v56-rule" d="M 748 746 L 1160 746"/>
<path class="v56-arrow" d="M 352 732 L 352 760" marker-end="url(#s2-debug-arr)"/>
<g data-node="true" id="s2-debug-surface">
<rect class="v56-local" x="40" y="760" width="624" height="78" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="783" text-anchor="start">07 · 界面回显对了吗</text>
<text class="v56-node-sub" x="54" y="804" text-anchor="start">按策略查即时卡片和 AI Bar，核对执行结果是否写对</text>
</g>
<text class="v56-node-sub" x="748" y="803" text-anchor="start">界面 U 章</text>
<path class="v56-rule" d="M 32 867 L 1168 867"/>
<rect data-decoration="true" class="v56-cloud" x="32" y="887" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="901" text-anchor="start">绿 · 机会入口</text>
<rect data-decoration="true" class="v56-decision" x="411" y="887" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="439" y="901" text-anchor="start">黄 · 建议判断与下发时机</text>
<rect data-decoration="true" class="v56-local" x="789" y="887" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817" y="901" text-anchor="start">蓝 · Planner 承接、执行和呈现</text>
</svg>
