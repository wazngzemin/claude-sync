<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <text x="40" y="30" font-size="20" font-weight="bold" fill="#222">N6｜Context 加工流水线：九路进料 → 筛选 → 打分 → 压缩 → 打包交 D 图</text>

  <!-- Legend -->
  <rect x="1060" y="44" width="310" height="120" fill="#FFFFFF" stroke="#999999" stroke-width="1" rx="6"/>
  <text x="1072" y="62" font-size="12" font-weight="bold" fill="#333">图例</text>
  <rect x="1072" y="70" width="14" height="10" fill="#E3EEFB" stroke="#4A90D9"/><text x="1092" y="79" font-size="11" fill="#333">蓝=普通加工</text>
  <rect x="1190" y="70" width="14" height="10" fill="#FBF0D0" stroke="#D9A93A"/><text x="1210" y="79" font-size="11" fill="#333">金=判断关卡</text>
  <rect x="1072" y="88" width="14" height="10" fill="#E2F2E4" stroke="#4CAF50"/><text x="1092" y="97" font-size="11" fill="#333">绿=交出结果</text>
  <rect x="1190" y="88" width="14" height="10" fill="#F0F0F0" stroke="#999999"/><text x="1210" y="97" font-size="11" fill="#333">灰=辅助/边界</text>
  <line x1="1072" y1="112" x2="1086" y2="112" stroke="#4A90D9" stroke-width="2.5"/><text x="1092" y="116" font-size="11" fill="#333">蓝粗=主链</text>
  <line x1="1190" y1="112" x2="1204" y2="112" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3"/><text x="1210" y="116" font-size="11" fill="#333">灰虚线=职责引用</text>
  <text x="1072" y="138" font-size="10" fill="#666">角标：【已落地】绿 /【2.6目标】金 /【讨论中】橙</text>

  <!-- Module 1: 九路进料 -->
  <rect x="30" y="56" width="1000" height="96" fill="#FAFAFA" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
  <text x="44" y="76" font-size="13" font-weight="bold" fill="#444">① 九路进料（本轮 Context 原料，C 图汇集）</text>
  <g font-size="10.5" fill="#222">
    <rect x="44" y="86" width="104" height="26" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="50" y="103">query·恒进全量</text>
    <rect x="156" y="86" width="104" height="26" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="162" y="103">情境描述·Always On</text>
    <rect x="268" y="86" width="104" height="26" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="274" y="103">事件日志·自然语言</text>
    <rect x="380" y="86" width="104" height="26" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="386" y="103">端状态·235条信号</text>
    <rect x="492" y="86" width="104" height="26" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="498" y="103">记忆·瞬/短/长</text>
    <rect x="604" y="86" width="104" height="26" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="610" y="103">参考知识·车书RAG</text>
    <rect x="716" y="86" width="104" height="26" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="722" y="103">可用工具·按车型</text>
    <rect x="828" y="86" width="96" height="26" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="834" y="103">自我认知·恒进</text>
    <rect x="932" y="86" width="88" height="26" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="938" y="103">执行中任务</text>
    <text x="44" y="136" font-size="10" fill="#666">四路生产：Always On 感知 / 执行模块调用 / 表达模块说话 / ASR 语音</text>
  </g>

  <!-- Module 2: 事件判定 -->
  <rect x="30" y="172" width="1000" height="60" fill="#FAFAFA" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
  <text x="44" y="192" font-size="12" font-weight="bold" fill="#444">② 是事件？（金关卡，事件日志是否成立）</text>
  <text x="44" y="212" font-size="10.5" fill="#333">正例：猛打方向超180°、突降暴雨、主驾开始抖腿、建议被采纳并行动　|　反例：微气流、常规打方向、眨眼、建议未被采纳</text>

  <!-- Main chain -->
  <rect x="60" y="270" width="240" height="110" fill="#FBF0D0" stroke="#D9A93A" stroke-width="2" rx="8"/>
  <text x="72" y="292" font-size="13" font-weight="bold" fill="#222">N6-01 筛选过滤</text>
  <rect x="230" y="278" width="60" height="16" fill="#4CAF50" rx="3"/><text x="238" y="290" font-size="10" fill="#fff">已落地</text>
  <text x="72" y="314" font-size="11" fill="#333">按本轮 query 相关性筛掉</text>
  <text x="72" y="330" font-size="11" fill="#333">与这一轮无关的原料</text>
  <text x="72" y="352" font-size="10" fill="#666">讲解：用户问游泳馆，上周听歌</text>
  <text x="72" y="366" font-size="10" fill="#666">记录这一轮用不上</text>

  <line x1="300" y1="325" x2="356" y2="325" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="356,321 366,325 356,329" fill="#4A90D9"/>

  <rect x="370" y="270" width="240" height="110" fill="#FBF0D0" stroke="#D9A93A" stroke-width="2" rx="8"/>
  <text x="382" y="292" font-size="13" font-weight="bold" fill="#222">N6-02 打分分类</text>
  <rect x="540" y="278" width="60" height="16" fill="#4CAF50" rx="3"/><text x="548" y="290" font-size="10" fill="#fff">已落地</text>
  <text x="382" y="314" font-size="11" fill="#333">留下的原料按标签与</text>
  <text x="382" y="330" font-size="11" fill="#333">匹配分数排序（记忆走 K 图）</text>
  <text x="382" y="352" font-size="10" fill="#666">讲解：饮食偏好比上周歌单</text>
  <text x="382" y="366" font-size="10" fill="#666">更贴合"找点吃的"</text>

  <line x1="610" y1="325" x2="666" y2="325" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="666,321 676,325 666,329" fill="#4A90D9"/>

  <rect x="680" y="270" width="250" height="110" fill="#FBF0D0" stroke="#D9A93A" stroke-width="2" rx="8"/>
  <text x="692" y="292" font-size="13" font-weight="bold" fill="#222">N6-03 压缩·分层</text>
  <rect x="856" y="278" width="60" height="16" fill="#4CAF50" rx="3"/><text x="864" y="290" font-size="10" fill="#fff">已落地</text>
  <text x="692" y="314" font-size="11" fill="#333">瞬时→短期→长期逐级压</text>
  <text x="692" y="330" font-size="11" fill="#333">情景描述每 10 轮压成</text>
  <text x="692" y="346" font-size="11" fill="#333">前置总结 + 最新总结</text>
  <text x="692" y="366" font-size="10" fill="#666">讲解：长对话省 token，上下文不丢主线</text>

  <line x1="930" y1="325" x2="986" y2="325" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="986,321 996,325 986,329" fill="#4A90D9"/>

  <rect x="1000" y="270" width="250" height="110" fill="#E2F2E4" stroke="#4CAF50" stroke-width="2" rx="8"/>
  <text x="1012" y="292" font-size="13" font-weight="bold" fill="#222">N6-05 Context 打包</text>
  <rect x="1176" y="278" width="60" height="16" fill="#4CAF50" rx="3"/><text x="1184" y="290" font-size="10" fill="#fff">已落地</text>
  <text x="1012" y="314" font-size="11" fill="#333">整理成本轮输入包，</text>
  <text x="1012" y="330" font-size="11" fill="#333">交给 D 图：Planner / Advisor</text>
  <text x="1012" y="352" font-size="10" fill="#666">讲解：模型这轮看到什么，</text>
  <text x="1012" y="366" font-size="10" fill="#666">就是这一包</text>

  <!-- N6-04 exception -->
  <rect x="370" y="410" width="560" height="120" fill="#F9E0E0" stroke="#D9534F" stroke-width="2" rx="8"/>
  <text x="382" y="432" font-size="13" font-weight="bold" fill="#222">N6-04 异常分支（金关卡：缺项 / 过期 / 冲突）</text>
  <text x="382" y="456" font-size="11" fill="#333">缺项 → 当日长期记忆未更新 → 置空继续，不硬编一个</text>
  <text x="382" y="476" font-size="11" fill="#333">过期 → 瞬时满 20 条或 20 分钟 → 转短期再调压</text>
  <text x="382" y="496" font-size="11" fill="#333">冲突 → 云端迟到 vs 本地已执行 → 采信本地【讨论中】</text>
  <text x="382" y="516" font-size="10" fill="#666">讲解：游泳馆地址没查到就反问，绝不借邻座记忆猜一个</text>

  <line x1="490" y1="380" x2="490" y2="410" stroke="#D9534F" stroke-width="2"/>
  <polygon points="486,410 490,420 494,410" fill="#D9534F"/>

  <!-- Event log fields card -->
  <rect x="60" y="570" width="640" height="150" fill="#F0F0F0" stroke="#999999" stroke-width="1.5" rx="8"/>
  <text x="74" y="592" font-size="13" font-weight="bold" fill="#222">③ 事件日志表字段（N9 生产，N6 消费）</text>
  <text x="74" y="614" font-size="11" fill="#333">毫秒时间戳 / 事件ID / Face ID 可多人（ID001:明骏）/ 交互形式手动·语音</text>
  <text x="74" y="634" font-size="11" fill="#333">事件文案：固定格式【主体】+【做了什么·说了什么】+【客体】（不经大模型）</text>
  <text x="74" y="654" font-size="11" fill="#333">触发任务ID 可一对多（T11105-T11111）/ 所属任务ID / 端状态 / 情景描述</text>
  <text x="74" y="674" font-size="11" fill="#333">1-4 级分类 / 信号ID / 信号名称；复杂事件（上车=开门+坐下）替换简单事件</text>
  <text x="74" y="700" font-size="10" fill="#666">事件↔任务双向：事件触发任务产生，任务执行也产生事件；关联把多事件串成因果链</text>

  <!-- Scope card -->
  <rect x="730" y="570" width="520" height="150" fill="#FBF0D0" stroke="#D9A93A" stroke-width="1.5" rx="8"/>
  <text x="744" y="592" font-size="13" font-weight="bold" fill="#222">④ 本期（09S2）边界【2.6目标，通用】</text>
  <text x="744" y="616" font-size="11" fill="#333">本期在做：事件上报机制 + 事件日志表 + 短期记忆总结更新</text>
  <text x="744" y="636" font-size="11" fill="#333">本期不做：所有涉及任务的部分（任务串联、任务队列）</text>
  <text x="744" y="660" font-size="10.5" fill="#666">讲解：事件是外在表征、任务是内在规划；两条链路本期只通前半截，</text>
  <text x="744" y="676" font-size="10.5" fill="#666">所以验收时不要用"任务级串联完整"去要求它</text>

  <!-- 跨模块连线 from N6-05 to D -->
  <path d="M 1125 380 L 1125 540 L 1080 540" fill="none" stroke="#4CAF50" stroke-width="2"/>
  <text x="980" y="534" font-size="10" fill="#4CAF50">from N6-05 → D 图（Planner 推理输入）</text>

  <text x="60" y="760" font-size="11" fill="#444">入口：C 图九路原料全部进 N6　|　出口：打包后的 Context 包交 D 图；异常三件套独立回退或置空继续</text>
  <text x="60" y="782" font-size="11" fill="#444">易错点：压缩不是删记忆——瞬时/短期/长期在 N9 后台照常生产，N6 只是把这轮要给模型的那份挑出来、压好</text>
</svg>
