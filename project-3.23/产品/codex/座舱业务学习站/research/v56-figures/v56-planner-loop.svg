<svg xmlns="http://www.w3.org/2000/svg" id="v56-planner-loop" class="flow-figure v56-diagram" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="v56-planner-loop-title v56-planner-loop-desc">
<title id="v56-planner-loop-title">Planner 怎样接着办：安排、执行、反馈，再判断</title>
<desc id="v56-planner-loop-desc">左侧看循环；右侧沿主例走两圈，先取得泳馆地点，再取得真实餐厅列表。</desc>
<style>
.v56-diagram{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff);color:var(--body,#33495b)}
.v56-diagram text{font-size:14px;font-weight:400;fill:var(--body,#33495b)}
.v56-diagram .figure-header .title{font-size:24px;font-weight:650;fill:var(--ink,#16344a)}
.v56-diagram .figure-header .subtitle,.v56-diagram .figure-caption text,.v56-diagram .note{fill:var(--muted,#5d7183)}
.v56-diagram .node-title{font-size:16px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .section-label{font-size:15px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .box{stroke-width:1.6}
.v56-diagram .neutral .box{fill:var(--v56-bg,#fff);stroke:var(--quiet,#9fb2c2)}
.v56-diagram .info .box,.v56-diagram .info .swatch{fill:var(--blue-soft,#eaf2fb);stroke:var(--blue,#4f7ea9)}
.v56-diagram .action .box,.v56-diagram .action .swatch{fill:var(--teal-soft,#eaf6ef);stroke:var(--teal,#4a9670)}
.v56-diagram .warning .box,.v56-diagram .warning .swatch{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-diagram .error .box,.v56-diagram .error .swatch{fill:var(--red-soft,#fdeeee);stroke:var(--red,#c45c5c)}
.v56-diagram .info .node-title{fill:var(--blue,#1f4565)}
.v56-diagram .action .node-title{fill:var(--teal,#1d4b35)}
.v56-diagram .warning .node-title{fill:var(--amber,#865b1a)}
.v56-diagram .error .node-title{fill:var(--red,#6e2222)}
.v56-diagram .pending .box{stroke-dasharray:6 5}
.v56-diagram .arr{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.v56-diagram .arr-error{stroke:var(--red,#c45c5c)}
.v56-diagram .arrow-head{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8}
.v56-diagram .arrow-head-error{stroke:var(--red,#c45c5c)}
.v56-diagram .rule{stroke:var(--line,#dce4eb);stroke-width:1;fill:none}
@media(prefers-color-scheme:dark){svg.v56-diagram{--v56-bg:#17212d;--ink:#e4edf6;--body:#d0dde9;--muted:#b4c4d3;--quiet:#8a9ead;--line:#3b5062;--blue:#a4caff;--blue-soft:#213c59;--teal:#99dbc5;--teal-soft:#203f3b;--amber:#f1cf91;--amber-soft:#443822;--red:#f2b0b7;--red-soft:#4b2e36}}
</style>
<defs><marker id="v56-planner-loop-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head" d="M1 1L9 5L1 9"/></marker><marker id="v56-planner-loop-arr-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head arrow-head-error" d="M1 1L9 5L1 9"/></marker></defs>
<g class="figure-header"><text class="title" x="32" y="44">Planner 怎样接着办：安排、执行、反馈，再判断</text><text class="subtitle" x="32" y="72">左侧看循环；右侧沿主例走两圈，先取得泳馆地点，再取得真实餐厅列表。</text></g>
<path class="arr" d="M232,175 L294,175" fill="none" marker-end="url(#v56-planner-loop-arr)"/>
<path class="arr" d="M520,175 L584,175" fill="none" marker-end="url(#v56-planner-loop-arr)"/>
<path class="arr" d="M685,212 L685,334" fill="none" marker-end="url(#v56-planner-loop-arr)"/>
<path class="arr" d="M590,375 L526,375" fill="none" marker-end="url(#v56-planner-loop-arr)"/>
<path class="arr" d="M410,340 L410,217" fill="none" marker-end="url(#v56-planner-loop-arr)"/>
<path class="arr" d="M1009,296 L1009,334" fill="none" marker-end="url(#v56-planner-loop-arr)"/>
<g class="info" data-node="context"><rect class="box" x="32" y="140" width="200" height="72" rx="8"/><text class="node-title" x="46" y="167" text-anchor="start">Context</text><text class="node-subtitle" x="46" y="192" text-anchor="start">本轮实际收到的背景</text></g>
<g class="action" data-node="planner"><rect class="box" x="300" y="140" width="220" height="72" rx="8"/><text class="node-title" x="314" y="167" text-anchor="start">Planner</text><text class="node-subtitle" x="314" y="192" text-anchor="start">判断下一步，安排动作</text></g>
<g class="action" data-node="actions"><rect class="box" x="590" y="140" width="190" height="72" rx="8"/><text class="node-title" x="604" y="167" text-anchor="start">动作清单</text><text class="node-subtitle" x="604" y="192" text-anchor="start">action_list</text></g>
<g class="action" data-node="tools"><rect class="box" x="590" y="340" width="190" height="72" rx="8"/><text class="node-title" x="604" y="367" text-anchor="start">下游工具</text><text class="node-subtitle" x="604" y="392" text-anchor="start">查询记忆／搜索餐厅</text></g>
<g class="info" data-node="feedback"><rect class="box" x="300" y="340" width="220" height="72" rx="8"/><text class="node-title" x="314" y="367" text-anchor="start">工具反馈</text><text class="node-subtitle" x="314" y="392" text-anchor="start">tool_feedback</text></g>
<g class="info" data-node="round1"><rect class="box" x="850" y="140" width="318" height="120" rx="8"/><text class="node-title" x="864" y="167" text-anchor="start">第一圈：查记忆</text><text class="node-subtitle" x="864" y="192" text-anchor="start">昨天去过的游泳馆</text><text class="node-subtitle" x="864" y="215" text-anchor="start">返回泳馆地点</text></g>
<g class="info" data-node="round2"><rect class="box" x="850" y="340" width="318" height="140" rx="8"/><text class="node-title" x="864" y="367" text-anchor="start">第二圈：搜餐厅</text><text class="node-subtitle" x="864" y="392" text-anchor="start">以泳馆为搜索中心</text><text class="node-subtitle" x="864" y="415" text-anchor="start">返回真实餐厅列表</text><text class="node-subtitle" x="864" y="438" text-anchor="start">展示并保留顺序</text></g>
<text class="section-label" x="32" y="111" text-anchor="start">交接循环</text>
<text class="section-label" x="850" y="111" text-anchor="start">主例：已有背景缺泳馆地点</text>
<text class="note" x="700" y="280" text-anchor="start">执行安排</text>
<text class="note" x="427" y="280" text-anchor="start">再判断</text>
<text class="note" x="864" y="283" text-anchor="start">search_user_memory</text>
<text class="note" x="32" y="518" text-anchor="start">动作清单交出安排；工具反馈交回实际结果。Planner 依据反馈继续判断。</text>
<text class="note" x="850" y="518" text-anchor="start">沿工具确实返回结果的分支示意。</text>
<g class="figure-caption"><path class="rule" d="M32,586 L1168,586"/>
<g class="info"><circle class="swatch" cx="39" cy="607" r="7"/></g>
<text class="node-subtitle" x="62" y="612" text-anchor="start">背景与实际结果</text>
<g class="action"><circle class="swatch" cx="214" cy="607" r="7"/></g>
<text class="node-subtitle" x="237" y="612" text-anchor="start">安排与执行</text>
</g>
</svg>
