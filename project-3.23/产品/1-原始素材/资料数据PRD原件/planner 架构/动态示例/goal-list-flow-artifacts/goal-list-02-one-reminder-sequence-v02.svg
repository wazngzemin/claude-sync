<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2940" viewBox="0 0 1660 2940">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker>
  </defs>

  <rect x="30" y="28" width="1600" height="132" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="4"/>
  <circle cx="100" cy="94" r="42" fill="#F4F2EE" stroke="#F4F2EE" stroke-width="2"/>
  <text x="77" y="105" fill="#0D4FA8" font-size="35" font-weight="700">02</text>
  <text x="174" y="86" fill="#F4F2EE" font-size="40" font-weight="700">一条“19:20 发日报提醒”的完整运行时序</text>
  <text x="177" y="128" fill="#F4F2EE" font-size="22">从用户说出口，到任务真正结束；每一步都标出 goal_list 应看到什么</text>

  <rect x="30" y="190" width="1600" height="154" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="57" y="231" fill="#0D4FA8" font-size="22" font-weight="700">本图的前置状态（DNA-4222 删除动作已被正确同步后的“正确世界”）</text>
  <text x="57" y="271" fill="#0D4FA8" font-size="20">真实活动任务：g-29 条件任务 + 5 条定时提醒；因此“定时任务”的已用名额是 5 / 6。</text>
  <text x="57" y="306" fill="#8E9179" font-size="19">注意：总数是 6，但产品判断应看“定时类名额”，而不是简单数全部任务。</text>

  <!-- Swimlane headers -->
  <rect x="30" y="385" width="292" height="58" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="56" y="423" fill="#F4F2EE" font-size="22" font-weight="700">用户 / 任务中心</text>
  <rect x="348" y="385" width="292" height="58" rx="4" fill="#8E9179" stroke="#0D4FA8" stroke-width="3"/>
  <text x="375" y="423" fill="#F4F2EE" font-size="22" font-weight="700">goal_list / 上下文</text>
  <rect x="666" y="385" width="292" height="58" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="693" y="423" fill="#F4F2EE" font-size="22" font-weight="700">豆包本轮推理</text>
  <rect x="984" y="385" width="292" height="58" rx="4" fill="#8E9179" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1011" y="423" fill="#F4F2EE" font-size="22" font-weight="700">任务真实状态</text>
  <rect x="1302" y="385" width="328" height="58" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1329" y="423" fill="#F4F2EE" font-size="22" font-weight="700">时间 / 触发 / 服务</text>

  <line x1="176" y1="443" x2="176" y2="2470" stroke="#8E9179" stroke-width="2"/>
  <line x1="494" y1="443" x2="494" y2="2470" stroke="#8E9179" stroke-width="2"/>
  <line x1="812" y1="443" x2="812" y2="2470" stroke="#8E9179" stroke-width="2"/>
  <line x1="1130" y1="443" x2="1130" y2="2470" stroke="#8E9179" stroke-width="2"/>
  <line x1="1466" y1="443" x2="1466" y2="2470" stroke="#8E9179" stroke-width="2"/>

  <!-- Step 0 -->
  <circle cx="17" cy="500" r="14" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/>
  <text x="12" y="505" fill="#F4F2EE" font-size="13" font-weight="700">0</text>
  <rect x="350" y="475" width="287" height="94" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="368" y="511" fill="#0D4FA8" font-size="18" font-weight="700">注入最新快照（版本 n+1）</text>
  <text x="368" y="544" fill="#0D4FA8" font-size="17">g-29 + 5 条定时任务</text>
  <rect x="986" y="475" width="287" height="94" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1004" y="511" fill="#0D4FA8" font-size="20" font-weight="700">活动定时数 = 5</text>
  <text x="1004" y="544" fill="#0D4FA8" font-size="17">定时任务上限 = 6，仍有 1 个名额</text>
  <line x1="637" y1="522" x2="986" y2="522" stroke="#0D4FA8" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <circle cx="17" cy="650" r="14" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/>
  <text x="12" y="655" fill="#F4F2EE" font-size="13" font-weight="700">1</text>
  <rect x="34" y="620" width="282" height="124" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="53" y="660" fill="#0D4FA8" font-size="18" font-weight="700">用户说：</text>
  <text x="53" y="695" fill="#0D4FA8" font-size="17">“19:20</text>
  <text x="53" y="726" fill="#0D4FA8" font-size="17">提醒我发日报”</text>
  <line x1="316" y1="682" x2="666" y2="682" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="400" y="667" fill="#8E9179" font-size="16">Query + 最新 goal_list</text>

  <!-- Step 2 -->
  <circle cx="17" cy="824" r="14" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/>
  <text x="12" y="829" fill="#F4F2EE" font-size="13" font-weight="700">2</text>
  <rect x="668" y="785" width="286" height="155" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="687" y="826" fill="#F4F2EE" font-size="21" font-weight="700">模型先分类再决策</text>
  <text x="687" y="859" fill="#F4F2EE" font-size="18">类型：定时任务</text>
  <text x="687" y="889" fill="#F4F2EE" font-size="18">单次：cycle=false</text>
  <text x="687" y="919" fill="#F4F2EE" font-size="18">非 VLM：max_execution=1</text>
  <polyline points="637,522 637,862 668,862" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="365" y="822" fill="#8E9179" font-size="17">列表让模型能知道：同类已有 5 条，不是 6 条</text>

  <!-- Step 3 -->
  <circle cx="17" cy="1016" r="14" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/>
  <text x="12" y="1021" fill="#F4F2EE" font-size="13" font-weight="700">3</text>
  <rect x="668" y="972" width="286" height="164" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="687" y="1013" fill="#0D4FA8" font-size="21" font-weight="700">模型发起创建请求</text>
  <text x="687" y="1046" fill="#0D4FA8" font-size="18">旧链路：add_goal</text>
  <text x="687" y="1076" fill="#0D4FA8" font-size="18">内容：19:20 提醒发日报</text>
  <text x="687" y="1106" fill="#8E9179" font-size="18">此时只是“提交”，不是成功</text>
  <line x1="954" y1="1054" x2="984" y2="1054" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <circle cx="17" cy="1210" r="14" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/>
  <text x="12" y="1215" fill="#F4F2EE" font-size="13" font-weight="700">4</text>
  <rect x="986" y="1166" width="287" height="164" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1004" y="1207" fill="#0D4FA8" font-size="21" font-weight="700">请求处理中</text>
  <text x="1004" y="1240" fill="#0D4FA8" font-size="18">检查最新定时名额</text>
  <text x="1004" y="1270" fill="#0D4FA8" font-size="18">创建还未落为活动任务</text>
  <text x="1004" y="1300" fill="#8E9179" font-size="18">返回：请求已提交，等待回调</text>
  <line x1="986" y1="1248" x2="954" y2="1248" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="668" y="1177" width="286" height="142" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="687" y="1218" fill="#0D4FA8" font-size="20" font-weight="700">模型此时能怎么说</text>
  <text x="687" y="1252" fill="#0D4FA8" font-size="18">可以：正在帮你设置</text>
  <text x="687" y="1284" fill="#8E9179" font-size="18">不能：已经记好 / 一定提醒</text>

  <!-- Step 5 -->
  <circle cx="17" cy="1415" r="14" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/>
  <text x="12" y="1420" fill="#F4F2EE" font-size="13" font-weight="700">5</text>
  <rect x="986" y="1360" width="287" height="204" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1004" y="1402" fill="#F4F2EE" font-size="18" font-weight="700">创建成功：真实状态改变</text>
  <text x="1004" y="1436" fill="#F4F2EE" font-size="18">新任务 ID：g-36</text>
  <text x="1004" y="1466" fill="#F4F2EE" font-size="18">定时任务数：5 → 6</text>
  <text x="1004" y="1496" fill="#F4F2EE" font-size="18">注册 19:20 定时器</text>
  <text x="1004" y="1530" fill="#F4F2EE" font-size="18">状态：活动 / 等待触发</text>
  <line x1="986" y1="1464" x2="640" y2="1464" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="350" y="1360" width="287" height="204" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="368" y="1402" fill="#0D4FA8" font-size="21" font-weight="700">刷新快照（版本 n+2）</text>
  <text x="368" y="1436" fill="#0D4FA8" font-size="18">goal_list 新增 g-36</text>
  <text x="368" y="1466" fill="#0D4FA8" font-size="18">活动定时数 = 6 / 6</text>
  <text x="368" y="1496" fill="#0D4FA8" font-size="18">下一轮模型会看到该任务</text>
  <text x="368" y="1530" fill="#8E9179" font-size="18">此时才可确认：已设置</text>
  <line x1="350" y1="1464" x2="316" y2="1464" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="34" y="1380" width="282" height="164" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="53" y="1421" fill="#0D4FA8" font-size="17" font-weight="700">用户看到的结果</text>
  <text x="53" y="1454" fill="#0D4FA8" font-size="16">语音：19:20 已设置</text>
  <text x="53" y="1484" fill="#0D4FA8" font-size="18">任务中心：出现新卡片</text>
  <text x="53" y="1514" fill="#8E9179" font-size="18">总任务数回到 7 条</text>

  <!-- Step 6 -->
  <circle cx="17" cy="1675" r="14" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/>
  <text x="12" y="1680" fill="#F4F2EE" font-size="13" font-weight="700">6</text>
  <rect x="1304" y="1615" width="320" height="178" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1323" y="1657" fill="#0D4FA8" font-size="21" font-weight="700">19:20 到点</text>
  <text x="1323" y="1690" fill="#0D4FA8" font-size="18">定时器触发 g-36</text>
  <text x="1323" y="1720" fill="#0D4FA8" font-size="18">请求模型生成 advice</text>
  <text x="1323" y="1750" fill="#8E9179" font-size="18">不是直接播放固定话术</text>
  <polyline points="1304,1703 1210,1703 1210,1825 954,1825" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 7 -->
  <circle cx="17" cy="1900" r="14" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/>
  <text x="12" y="1905" fill="#F4F2EE" font-size="13" font-weight="700">7</text>
  <rect x="350" y="1832" width="287" height="170" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="368" y="1873" fill="#0D4FA8" font-size="21" font-weight="700">再次注入当前列表</text>
  <text x="368" y="1906" fill="#0D4FA8" font-size="18">g-36 仍然活动</text>
  <text x="368" y="1936" fill="#0D4FA8" font-size="18">本次事件：19:20 到点</text>
  <text x="368" y="1966" fill="#8E9179" font-size="18">避免把已取消任务重新触发</text>
  <line x1="637" y1="1917" x2="668" y2="1917" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="668" y="1832" width="286" height="170" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="687" y="1873" fill="#F4F2EE" font-size="21" font-weight="700">模型恢复服务</text>
  <text x="687" y="1906" fill="#F4F2EE" font-size="18">理解：这是 g-36 的到点事件</text>
  <text x="687" y="1936" fill="#F4F2EE" font-size="18">结合当前场景判断是否打扰</text>
  <text x="687" y="1966" fill="#F4F2EE" font-size="18">产出提醒 / 行动 / 不播</text>
  <line x1="954" y1="1917" x2="1304" y2="1917" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1304" y="1844" width="320" height="146" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1323" y="1885" fill="#0D4FA8" font-size="21" font-weight="700">用户实际得到服务</text>
  <text x="1323" y="1918" fill="#0D4FA8" font-size="18">“该给主管发日报了。”</text>
  <text x="1323" y="1950" fill="#8E9179" font-size="18">这一步才叫“提醒兑现”</text>

  <!-- Step 8 -->
  <circle cx="17" cy="2115" r="14" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/>
  <text x="12" y="2120" fill="#F4F2EE" font-size="13" font-weight="700">8</text>
  <rect x="986" y="2055" width="287" height="184" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1004" y="2097" fill="#0D4FA8" font-size="21" font-weight="700">单次任务自动回收</text>
  <text x="1004" y="2130" fill="#0D4FA8" font-size="18">max_execution 达到 1</text>
  <text x="1004" y="2160" fill="#0D4FA8" font-size="18">注销 g-36 的定时器</text>
  <text x="1004" y="2190" fill="#0D4FA8" font-size="18">任务关闭、定时名额 6 → 5</text>
  <text x="1004" y="2220" fill="#8E9179" font-size="18">真实状态变化再次发生</text>
  <line x1="986" y1="2147" x2="637" y2="2147" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="350" y="2055" width="287" height="184" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="368" y="2097" fill="#0D4FA8" font-size="21" font-weight="700">下一轮列表回收 g-36</text>
  <text x="368" y="2130" fill="#0D4FA8" font-size="18">goal_list 不再有发日报任务</text>
  <text x="368" y="2160" fill="#0D4FA8" font-size="18">任务中心卡片同时结束</text>
  <text x="368" y="2190" fill="#0D4FA8" font-size="18">后续不会再次 19:20 触发</text>
  <text x="368" y="2220" fill="#8E9179" font-size="18">单次用户承诺完整收尾</text>

  <!-- failure branch -->
  <rect x="30" y="2525" width="1600" height="62" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="55" y="2566" fill="#F4F2EE" font-size="27" font-weight="700">失败分支：如果最新真实状态确实已经有 6 条定时任务</text>
  <rect x="35" y="2615" width="470" height="210" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="58" y="2657" fill="#0D4FA8" font-size="21" font-weight="700">模型看到的正确输入</text>
  <text x="58" y="2690" fill="#0D4FA8" font-size="18">最新 goal_list：定时任务 = 6 / 6</text>
  <text x="58" y="2720" fill="#0D4FA8" font-size="18">模型可先提示限额，也可提交后由真实结果裁决。</text>
  <text x="58" y="2754" fill="#8E9179" font-size="18">前提：它读到的是最新状态，不是旧缓存。</text>
  <rect x="595" y="2615" width="470" height="210" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="618" y="2657" fill="#F4F2EE" font-size="21" font-weight="700">真实创建结果</text>
  <text x="618" y="2690" fill="#F4F2EE" font-size="18">返回“定时任务达到上限”</text>
  <text x="618" y="2720" fill="#F4F2EE" font-size="18">不创建 g-36，不注册定时器</text>
  <text x="618" y="2754" fill="#F4F2EE" font-size="18">goal_list 与任务中心都保持原状</text>
  <rect x="1155" y="2615" width="475" height="210" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1178" y="2657" fill="#0D4FA8" font-size="21" font-weight="700">用户体验的正确说法</text>
  <text x="1178" y="2690" fill="#0D4FA8" font-size="18">“定时提醒已到上限；删掉一条后我可以再设。”</text>
  <text x="1178" y="2720" fill="#0D4FA8" font-size="18">不能说：“我先记在心里，到点尽量提醒。”</text>
  <text x="1178" y="2754" fill="#8E9179" font-size="18">因为不存在真实任务，也没有任何触发源。</text>
  <line x1="505" y1="2720" x2="595" y2="2720" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1065" y1="2720" x2="1155" y2="2720" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
