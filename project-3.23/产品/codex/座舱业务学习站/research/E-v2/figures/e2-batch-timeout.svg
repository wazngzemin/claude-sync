<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="e2-batch-timeout" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="e2-batch-timeout-title e2-batch-timeout-desc">
<title id="e2-batch-timeout-title">一个工具超时，成功的结果照常交回</title><desc id="e2-batch-timeout-desc">一批四个动作分别收结果；超时只补这一项，不自动重试。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="e2-batch-timeout-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一个工具超时，成功的结果照常交回</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">一批四个动作分别收结果；超时只补这一项，不自动重试。</text>
<text class="v56-label" x="32" y="122" text-anchor="start">主例第一轮：四个动作同时调用</text>
<g data-node="true"><rect class="v56-cloud" x="32" y="150" width="330" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="177" text-anchor="start">查车况：成功</text>
<text class="v56-node-sub" x="46" y="202" text-anchor="start">返回空调、车窗等当前状态</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="32" y="280" width="330" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="307" text-anchor="start">开空调：成功</text>
<text class="v56-node-sub" x="46" y="332" text-anchor="start">保留这一项的成功结果</text>
</g>
<g data-node="true"><rect class="v56-decision" x="32" y="410" width="330" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="437" text-anchor="start">调风量：超时</text>
<text class="v56-node-sub" x="46" y="462" text-anchor="start">补这一项的失败结果：</text>
<text class="v56-node-sub" x="46" y="483" text-anchor="start">执行失败，请勿重复调用，</text>
<text class="v56-node-sub" x="46" y="504" text-anchor="start">需要告知用户</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="32" y="570" width="330" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="597" text-anchor="start">搜咖啡店：成功</text>
<text class="v56-node-sub" x="46" y="622" text-anchor="start">当前位置附近找到 3 家</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="440" y="340" width="200" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="454" y="367" text-anchor="start">云端编排收齐一批</text>
<text class="v56-node-sub" x="454" y="392" text-anchor="start">三项成功保留</text>
<text class="v56-node-sub" x="454" y="413" text-anchor="start">一项超时用失败占位</text>
</g>
<g data-node="true"><rect class="v56-neutral" x="710" y="340" width="200" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="724" y="367" text-anchor="start">输入管理</text>
<text class="v56-node-sub" x="724" y="392" text-anchor="start">完整一批，单独一轮</text>
<text class="v56-node-sub" x="724" y="413" text-anchor="start">交给 Planner</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="710" y="560" width="458" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="724" y="587" text-anchor="start">Planner 统一说一次</text>
<text class="v56-node-sub" x="724" y="612" text-anchor="start">空调开了，风量没调成，</text>
<text class="v56-node-sub" x="724" y="633" text-anchor="start">你可以手动调一下。</text>
</g>
<g data-node="true"><rect class="v56-reject" x="965" y="150" width="203" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="979" y="177" text-anchor="start">错误：整批算失败</text>
<text class="v56-node-sub" x="979" y="202" text-anchor="start">抹掉了已成功的结果</text>
</g>
<g data-node="true"><rect class="v56-reject" x="965" y="305" width="203" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="979" y="332" text-anchor="start">错误：自动再发一次</text>
<text class="v56-node-sub" x="979" y="357" text-anchor="start">可能造成重复执行</text>
</g>
<path class="v56-arrow" d="M 362 200 L 400 200 L 400 405 L 440 405" marker-end="url(#e2-batch-timeout-arr)"/>
<path class="v56-arrow" d="M 362 330 L 400 330 L 400 405 L 440 405" marker-end="url(#e2-batch-timeout-arr)"/>
<path class="v56-arrow" d="M 362 475 L 400 475 L 400 405 L 440 405" marker-end="url(#e2-batch-timeout-arr)"/>
<path class="v56-arrow" d="M 362 620 L 400 620 L 400 405 L 440 405" marker-end="url(#e2-batch-timeout-arr)"/>
<path class="v56-arrow" d="M 640 405 L 710 405" marker-end="url(#e2-batch-timeout-arr)"/>
<path class="v56-arrow" d="M 810 470 L 810 560" marker-end="url(#e2-batch-timeout-arr)"/>
<text class="v56-subtitle" x="32" y="718" text-anchor="start">每个工具自己定超时；已下发 10 秒没回执，是转车端排查的分工线。</text>
<rect class="v56-cloud" x="32" y="752" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="766" text-anchor="start">绿：已返回结果与汇总</text>
<rect class="v56-decision" x="332" y="752" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="360" y="766" text-anchor="start">黄：超时失败占位</text>
<rect class="v56-neutral" x="632" y="752" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="660" y="766" text-anchor="start">灰：单独一轮交接</text>
<rect class="v56-reject" x="932" y="752" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="960" y="766" text-anchor="start">红：错误做法</text>
</svg>
