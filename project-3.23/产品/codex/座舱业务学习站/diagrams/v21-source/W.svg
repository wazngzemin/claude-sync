="5" height="182" rx="2" fill="#326785"/><text x="60" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">W-3</tspan></text><text x="60" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">用页面热词帮助识别</tspan></text><text x="60" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">语音识别模块</tspan></text><text x="60" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">用户识别文本</tspan></text></g></a><a href="#module/W/step/W-4"><g data-step="W-4"><rect x="105" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">W-4</tspan></text><text x="125" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">将说法对应到注册 ID</tspan></text><text x="125" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">指令匹配模块</tspan></text><text x="125" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">一个或多个匹配 ID</tspan></text></g></a><a href="#module/W/step/W-5"><g data-step="W-5"><rect x="105" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">W-5</tspan></text><text x="125" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">处理重名并执行页面操作</tspan></text><text x="125" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">注册方</tspan></text><text x="125" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">页面实际执行结果</tspan></text></g></a><a href="#module/W/step/W-6"><g data-step="W-6"><rect x="40" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">W-6</tspan></text><text x="60" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">展示并播报执行结果</tspan></text><text x="60" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">页面所属业务 / 豆包</tspan></text><text x="60" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">成功或失败的用户反馈</tspan></text></g></a><a href="#module/W/step/W-7"><g data-step="W-7"><rect x="500" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">W-7</tspan></text><text x="520" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">保留模拟点击来源</tspan></text><text x="520" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">对话历史</tspan></text><text x="520" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">带来源的操作历史</tspan></text></g></a></g></svg>