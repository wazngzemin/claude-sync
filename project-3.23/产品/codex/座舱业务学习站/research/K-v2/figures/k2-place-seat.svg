<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="k2-place-seat" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="k2-place-seat-title k2-place-seat-desc">
<title id="k2-place-seat-title">记忆落到车上：地址取完整地点，座椅取位置编号</title><desc id="k2-place-seat-desc">地址统一存进豆包记忆是新方向；座椅具体位置留在车上，豆包记人、用途与位置编号的对应。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="k2-place-seat-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">记忆落到车上：地址取完整地点，座椅取位置编号</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">地址统一存进豆包记忆是新方向；座椅具体位置留在车上，豆包记人、用途与位置编号的对应。</text>
<text class="v56-label" x="32" y="126" text-anchor="start">地址：保存完整地点，以后直接导航</text>
<g data-node="true" id="k2-place-seat-request"><rect class="v56-local" x="32" y="154" width="180" height="174" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="182" text-anchor="start">提出保存地址</text>
<text class="v56-node-sub" x="46" y="210" text-anchor="start">“记一下我家”</text>
<text class="v56-node-sub" x="46" y="234" text-anchor="start">先认出说话人</text>
</g>
<g data-node="true" id="k2-place-seat-resolve"><rect class="v56-decision" x="252" y="154" width="260" height="174" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="266" y="182" text-anchor="start">确认完整地点</text>
<text class="v56-node-sub" x="266" y="210" text-anchor="start">信息不够 → 先搜索</text>
<text class="v56-node-sub" x="266" y="234" text-anchor="start">再让用户选择</text>
<text class="v56-node-sub" x="266" y="258" text-anchor="start">同名地点跨城市仍要核对</text>
</g>
<g data-node="true" id="k2-place-seat-place"><rect class="v56-cloud" x="552" y="154" width="260" height="174" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="566" y="182" text-anchor="start">存成结构化地点</text>
<text class="v56-node-sub" x="566" y="210" text-anchor="start">完整地点名称、城市必填</text>
<text class="v56-node-sub" x="566" y="234" text-anchor="start">另可带地点编号、经纬度、地址</text>
<text class="v56-node-sub" x="566" y="258" text-anchor="start">由豆包记忆统一存</text>
</g>
<g data-node="true" id="k2-place-seat-navigate"><rect class="v56-local" x="852" y="154" width="316" height="174" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="866" y="182" text-anchor="start">以后“导航回家”</text>
<text class="v56-node-sub" x="866" y="210" text-anchor="start">先认人，再取他的完整地点名</text>
<text class="v56-node-sub" x="866" y="234" text-anchor="start">直接发起导航，不再选点</text>
<text class="v56-node-sub" x="866" y="258" text-anchor="start">地图账号的家 ≠ 说话人的家</text>
</g>
<path class="v56-arrow" fill="none" d="M 212 241 L 252 241" marker-end="url(#k2-place-seat-arr)"/>
<path class="v56-arrow" fill="none" d="M 512 241 L 552 241" marker-end="url(#k2-place-seat-arr)"/>
<path class="v56-arrow" fill="none" d="M 812 241 L 852 241" marker-end="url(#k2-place-seat-arr)"/>
<text class="v56-subtitle" x="32" y="366" text-anchor="start">离线：已同步的家和公司可用；不支持设新家；多人说“回家”先问“去谁家”。</text>
<path class="v56-rule" d="M 32 398 L 1168 398"/>
<text class="v56-label" x="32" y="440" text-anchor="start">座椅：位置留在车机，记忆只存对应关系</text>
<g data-node="true" id="k2-place-seat-seat-local"><rect class="v56-local" x="32" y="470" width="320" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="498" text-anchor="start">车机保存具体位置，给位置编号</text>
<text class="v56-node-sub" x="46" y="526" text-anchor="start">具体位置留在车机本地，不上云</text>
<text class="v56-node-sub" x="46" y="550" text-anchor="start">手动按保存，只证明存了位置</text>
<text class="v56-node-sub" x="46" y="574" text-anchor="start">不能自动猜成“午休”等用途</text>
</g>
<g data-node="true" id="k2-place-seat-seat-memory"><rect class="v56-cloud" x="414" y="470" width="338" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="428" y="498" text-anchor="start">豆包记“这个人的用途 ↔ 位置编号”</text>
<text class="v56-node-sub" x="428" y="526" text-anchor="start">用户说清用途，才写入记忆</text>
<text class="v56-node-sub" x="428" y="550" text-anchor="start">例如：老周的午休 ↔ 位置 2</text>
<text class="v56-node-sub" x="428" y="574" text-anchor="start">记忆里不存座椅具体位置</text>
</g>
<g data-node="true" id="k2-place-seat-seat-restore"><rect class="v56-local" x="814" y="470" width="354" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="828" y="498" text-anchor="start">“调到午休位置”</text>
<text class="v56-node-sub" x="828" y="526" text-anchor="start">先找位置编号，再调车企接口恢复</text>
<text class="v56-node-sub" x="828" y="550" text-anchor="start">还没有对应关系 → 先问</text>
<text class="v56-node-sub" x="828" y="574" text-anchor="start">“午休是第几个位置”</text>
</g>
<path class="v56-arrow" fill="none" d="M 352 560 L 414 560" marker-end="url(#k2-place-seat-arr)"/>
<path class="v56-arrow" fill="none" d="M 752 560 L 814 560" marker-end="url(#k2-place-seat-arr)"/>
<text class="v56-subtitle" x="32" y="688" text-anchor="start">自由描述的用途，离线不支持。</text>
<g data-node="true" id="k2-place-seat-map-future"><rect class="v56-neutral v56-pending" x="32" y="732" width="536" height="116" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="760" text-anchor="start">地图入口：正在与车企对齐</text>
<text class="v56-node-sub" x="46" y="788" text-anchor="start">倾向取消单独设家、公司的入口</text>
<text class="v56-node-sub" x="46" y="812" text-anchor="start">保留显示和快捷导航</text>
</g>
<g data-node="true" id="k2-place-seat-seat-future"><rect class="v56-neutral v56-pending" x="632" y="732" width="536" height="116" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="646" y="760" text-anchor="start">方向盘、后视镜：正在与座椅打包</text>
<text class="v56-node-sub" x="646" y="788" text-anchor="start">一起记住和恢复的方向正在对齐</text>
</g>
<path class="v56-rule" d="M 32 882 L 1168 882"/>
<rect data-decoration="true" class="v56-local" x="32" y="918" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="932" text-anchor="start">蓝：车上输入与执行</text>
<rect data-decoration="true" class="v56-cloud" x="296" y="918" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="324" y="932" text-anchor="start">绿：豆包记忆</text>
<rect data-decoration="true" class="v56-decision" x="536" y="918" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="564" y="932" text-anchor="start">黄：补齐并确认地点</text>
<rect data-decoration="true" class="v56-neutral v56-pending" x="858" y="918" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="886" y="932" text-anchor="start">虚线：正在对齐</text>
</svg>
