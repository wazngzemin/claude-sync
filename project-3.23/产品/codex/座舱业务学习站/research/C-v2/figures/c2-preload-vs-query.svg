<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="c2-preload-vs-query" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="c2-preload-vs-query-title c2-preload-vs-query-desc">
<title id="c2-preload-vs-query-title">常用背景先带上，缺什么再补查</title><desc id="c2-preload-vs-query-desc">“我有点冷”：先看已带上的空调状态；还缺座椅加热状态时，再查一次。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="c2-preload-vs-query-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">常用背景先带上，缺什么再补查</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">“我有点冷”：先看已带上的空调状态；还缺座椅加热状态时，再查一次。</text>
<text class="v56-label" x="32" y="120" text-anchor="start">预注入：Planner 第一次推理前</text>
<text class="v56-label" x="830" y="120" text-anchor="start">动态检索：Planner 发现缺信息后</text>
<path class="v56-arrow" d="M 362 246 L 440 246" fill="none" marker-end="url(#c2-preload-vs-query-arr)"/>
<path class="v56-arrow" d="M 720 246 L 830 246" fill="none" marker-end="url(#c2-preload-vs-query-arr)"/>
<text class="v56-label" x="755" y="228" text-anchor="start">不够</text>
<path class="v56-arrow" d="M 580 302 L 580 350 L 197 350 L 197 405" fill="none" marker-end="url(#c2-preload-vs-query-arr)"/>
<text class="v56-label" x="290" y="338" text-anchor="start">够用</text>
<path class="v56-arrow" d="M 999 302 L 999 405" fill="none" marker-end="url(#c2-preload-vs-query-arr)"/>
<text class="v56-label" x="1013" y="355" text-anchor="start">返回查询结果</text>
<path class="v56-arrow" d="M 830 460 L 720 460" fill="none" marker-end="url(#c2-preload-vs-query-arr)"/>
<text class="v56-label" x="744" y="442" text-anchor="start">交回</text>
<g data-node="true" id="c2-preload-vs-query-n1"><rect class="v56-cloud" x="32" y="190" width="330" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="217" text-anchor="start">上下文服务带上常用背景</text>
<text class="v56-node-sub" x="46" y="242" text-anchor="start">空调开着，设定 22 度</text>
<text class="v56-node-sub" x="46" y="265" text-anchor="start">先交给 Planner 推理</text>
</g>
<g data-node="true" id="c2-preload-vs-query-n2"><rect class="v56-decision" x="440" y="190" width="280" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="454" y="217" text-anchor="start">Planner：材料够吗？</text>
<text class="v56-node-sub" x="454" y="242" text-anchor="start">还需要知道</text>
<text class="v56-node-sub" x="454" y="265" text-anchor="start">座椅加热有没有开？</text>
</g>
<g data-node="true" id="c2-preload-vs-query-n3"><rect class="v56-neutral" x="830" y="190" width="338" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="217" text-anchor="start">Planner 调查询工具</text>
<text class="v56-node-sub" x="844" y="242" text-anchor="start">补查座椅加热状态</text>
</g>
<g data-node="true" id="c2-preload-vs-query-n4"><rect class="v56-neutral" x="32" y="405" width="330" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="432" text-anchor="start">直接决定怎么调</text>
<text class="v56-node-sub" x="46" y="457" text-anchor="start">已有背景足够时</text>
<text class="v56-node-sub" x="46" y="480" text-anchor="start">不必为了查询再多想一轮</text>
</g>
<g data-node="true" id="c2-preload-vs-query-n5"><rect class="v56-neutral" x="440" y="405" width="280" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="454" y="432" text-anchor="start">Planner 下一次推理</text>
<text class="v56-node-sub" x="454" y="457" text-anchor="start">结合已有背景和工具反馈</text>
<text class="v56-node-sub" x="454" y="480" text-anchor="start">再判断怎么调</text>
</g>
<g data-node="true" id="c2-preload-vs-query-n6"><rect class="v56-cloud" x="830" y="405" width="338" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="432" text-anchor="start">查询结果作为工具反馈</text>
<text class="v56-node-sub" x="844" y="457" text-anchor="start">补进下一次推理</text>
<text class="v56-node-sub" x="844" y="480" text-anchor="start">不是用户的新指令</text>
</g>
<text class="v56-node-sub" x="32" y="579" text-anchor="start">预注入的代价：带多了，模型分心、处理变慢。</text>
<text class="v56-node-sub" x="32" y="608" text-anchor="start">动态检索的代价：带少了，需要多一轮推理。</text>
<text class="v56-label" x="32" y="647" text-anchor="start">目标：让大约八成常规请求不用再查。</text>
<rect class="v56-cloud" x="32" y="694" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="708" text-anchor="start">绿：交给 Planner 的背景</text>
<rect class="v56-decision" x="316" y="694" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344" y="708" text-anchor="start">黄：是否补查的判断</text>
<rect class="v56-neutral" x="502" y="694" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="530" y="708" text-anchor="start">灰：推理或查询动作</text>
</svg>
