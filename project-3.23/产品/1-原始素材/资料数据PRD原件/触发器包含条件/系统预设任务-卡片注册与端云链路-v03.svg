<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1810" viewBox="0 0 1900 1810">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z" fill="#8AA3C1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="56" y="70" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="39" font-weight="700" fill="#173458" text-anchor="start"><tspan x="56" dy="0">即时交互卡责任与端云运行链路</tspan></text>
<text x="56" y="115" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="56" dy="0">共同原则：Trigger 只判断并发出业务事件；原业务负责注册、拉起、消费和更新卡片。</tspan></text>
<rect x="56" y="150" width="1788" height="78" rx="12" fill="#FFF0F0" stroke="#DB5C5C" stroke-width="2"/>
<text x="950" y="198" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" font-weight="700" fill="#8C3434" text-anchor="middle"><tspan x="950" dy="0">已确认：Planner 不直接拉起卡片。只有业务先把卡片真正展示后，云端泛化语音才按需交给 Planner 理解。</tspan></text>
<text x="56" y="292" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="700" fill="#173458" text-anchor="start"><tspan x="56" dy="0">共同起点</tspan></text>
<rect x="56" y="326" width="380" height="142" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<text x="76" y="366" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="76" dy="0">任务中心 / 任务业务</tspan></text>
<text x="76" y="408" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="76" dy="0">保存真实启用状态</tspan><tspan x="76" dy="29">关闭后停止后续新触发</tspan></text>
<polyline points="436,397 486,397" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="486" y="326" width="380" height="142" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<text x="506" y="366" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="506" dy="0">Trigger</tspan></text>
<text x="506" y="408" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="506" dy="0">读取任务状态 + 场景数据</tspan><tspan x="506" dy="29">条件满足后只发业务事件</tspan></text>
<polyline points="866,397 916,397" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="916" y="326" width="430" height="142" rx="14" fill="#FFF4E4" stroke="#D88932" stroke-width="2"/>
<text x="936" y="366" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="936" dy="0">原业务</tspan></text>
<text x="936" y="408" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="936" dy="0">收到事件并判断处理方式</tspan><tspan x="936" dy="29">需要询问时创建卡片实例</tspan></text>
<polyline points="1346,397 1396,397" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="1396" y="326" width="448" height="142" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<text x="1416" y="366" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1416" dy="0">即时交互卡 / VUI</tspan></text>
<text x="1416" y="408" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1416" dy="0">校验、排队、真正展示</tspan><tspan x="1416" dy="29">返回展示成功或失败</tspan></text>
<text x="679" y="382" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#52657B" text-anchor="middle"><tspan x="679" dy="0">任务状态/数据</tspan></text>
<text x="1119" y="382" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#52657B" text-anchor="middle"><tspan x="1119" dy="0">业务事件</tspan></text>
<text x="1371" y="382" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#D88932" text-anchor="middle"><tspan x="1371" dy="0">注册并拉卡</tspan></text>
<rect x="56" y="535" width="1788" height="520" rx="16" fill="#FBFCFE" stroke="#8AA3C1" stroke-width="2"/>
<rect x="80" y="558" width="96" height="38" rx="19" fill="#EAF5EF" stroke="#579473" stroke-width="1.5"/>
<text x="128" y="584" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#173458" text-anchor="middle"><tspan x="128" dy="0">端侧任务</tspan></text>
<text x="208" y="585" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="208" dy="0">例：天气/路况保护；不经过 Planner</tspan></text>
<rect x="80" y="626" width="380" height="174" rx="14" fill="#FFF4E4" stroke="#D88932" stroke-width="2"/>
<rect x="80" y="626" width="380" height="54" rx="14" fill="#FFF4E4" stroke="none" stroke-width="0"/>
<text x="100" y="661" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="100" dy="0">E1  端侧业务注册卡片</tspan></text>
<text x="100" y="714" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="100" dy="0">文案、确认/取消按钮、TTS</tspan><tspan x="100" dy="29">业务回调、有效期</tspan><tspan x="100" dy="29">注册“可见即可说”按钮表达</tspan></text>
<rect x="512" y="626" width="380" height="174" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<rect x="512" y="626" width="380" height="54" rx="14" fill="#EDF4FF" stroke="none" stroke-width="0"/>
<text x="532" y="661" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="532" dy="0">E2  卡片真正展示</tspan></text>
<text x="532" y="714" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="532" dy="0">VUI返回展示结果</tspan><tspan x="532" dy="29">展示后才开始等待用户回答</tspan><tspan x="532" dy="29">语音禁用时仍可手动点击</tspan></text>
<rect x="944" y="626" width="390" height="174" rx="14" fill="#EAF5EF" stroke="#579473" stroke-width="2"/>
<rect x="944" y="626" width="390" height="54" rx="14" fill="#EAF5EF" stroke="none" stroke-width="0"/>
<text x="964" y="661" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="964" dy="0">E3  点击 / 本地语音</tspan></text>
<text x="964" y="714" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="964" dy="0">点击：走原按钮回调</tspan><tspan x="964" dy="29">语音：可见即可说命中按钮</tspan><tspan x="964" dy="29">两种方式产出同一业务选择</tspan></text>
<rect x="1386" y="626" width="434" height="174" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<rect x="1386" y="626" width="434" height="54" rx="14" fill="#EDF4FF" stroke="none" stroke-width="0"/>
<text x="1406" y="661" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1406" dy="0">E4  原业务执行闭环</tspan></text>
<text x="1406" y="714" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1406" dy="0">确认有效 → 重新检查车况</tspan><tspan x="1406" dy="29">调用赛力斯车控</tspan><tspan x="1406" dy="29">读真实状态并更新/关闭卡片</tspan></text>
<polyline points="460,713 512,713" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<polyline points="892,713 944,713" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<polyline points="1334,713 1386,713" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="80" y="835" width="1740" height="170" rx="12" fill="#F4F6F8" stroke="none" stroke-width="0"/>
<text x="102" y="875" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="700" fill="#173458" text-anchor="start"><tspan x="102" dy="0">端侧注册时，业务方必须给卡片什么</tspan></text>
<text x="102" y="915" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="102" dy="0">① 这是哪项任务、哪一次触发；② 卡片标题/正文；③ 按钮与标准含义；④ TTS；⑤ 点击回到哪个业务；</tspan><tspan x="102" dy="31">⑥ 可见即可说支持哪些按钮表达；⑦ 多久失效；⑧ 成功/失败后怎样更新。关闭、拒绝、超时均不执行。</tspan></text>
<rect x="56" y="1100" width="1788" height="626" rx="16" fill="#FCFAFF" stroke="#8B70C9" stroke-width="2"/>
<rect x="80" y="1123" width="96" height="38" rx="19" fill="#F3EEFF" stroke="#8B70C9" stroke-width="1.5"/>
<text x="128" y="1149" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="600" fill="#173458" text-anchor="middle"><tspan x="128" dy="0">云端任务</tspan></text>
<text x="208" y="1150" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="208" dy="0">例：主动推荐/DT判断后的询问；业务仍然先注册卡片</tspan></text>
<rect x="80" y="1192" width="360" height="178" rx="14" fill="#F3EEFF" stroke="#8B70C9" stroke-width="2"/>
<rect x="80" y="1192" width="360" height="54" rx="14" fill="#F3EEFF" stroke="none" stroke-width="0"/>
<text x="100" y="1227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="100" dy="0">C1  云端得到明确建议</tspan></text>
<text x="100" y="1280" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="100" dy="0">Cloud Trigger / Advisor / DT</tspan><tspan x="100" dy="29">产出业务建议和上下文</tspan><tspan x="100" dy="29">交给原业务，不直接拉卡</tspan></text>
<rect x="488" y="1192" width="390" height="178" rx="14" fill="#FFF4E4" stroke="#D88932" stroke-width="2"/>
<rect x="488" y="1192" width="390" height="54" rx="14" fill="#FFF4E4" stroke="none" stroke-width="0"/>
<text x="508" y="1227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="508" dy="0">C2  原业务注册并拉卡</tspan></text>
<text x="508" y="1280" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="508" dy="0">注册卡片、按钮、TTS、回调</tspan><tspan x="508" dy="29">选择点击路线与语音路线</tspan><tspan x="508" dy="29">把当前建议绑定到这张卡</tspan></text>
<rect x="926" y="1192" width="370" height="178" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<rect x="926" y="1192" width="370" height="54" rx="14" fill="#EDF4FF" stroke="none" stroke-width="0"/>
<text x="946" y="1227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="946" dy="0">C3  VUI真正展示</tspan></text>
<text x="946" y="1280" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="946" dy="0">卡片展示后返回结果</tspan><tspan x="946" dy="29">此时才允许注册云端语音上下文</tspan><tspan x="946" dy="29">过期/撤卡同步清理</tspan></text>
<rect x="1344" y="1192" width="476" height="178" rx="14" fill="#F3EEFF" stroke="#8B70C9" stroke-width="2"/>
<rect x="1344" y="1192" width="476" height="54" rx="14" fill="#F3EEFF" stroke="none" stroke-width="0"/>
<text x="1364" y="1227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1364" dy="0">C4  用户回答回到原业务</tspan></text>
<text x="1364" y="1280" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1364" dy="0">点击：按所选点击路线返回</tspan><tspan x="1364" dy="29">语音：Planner理解后返回标准选择</tspan><tspan x="1364" dy="29">原业务决定执行、拒绝或继续问</tspan></text>
<polyline points="440,1281 488,1281" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<polyline points="878,1281 926,1281" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<polyline points="1296,1281 1344,1281" fill="none" stroke="#8AA3C1" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="80" y="1410" width="830" height="260" rx="12" fill="#EAF5EF" stroke="#579473" stroke-width="1.8"/>
<text x="104" y="1450" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="104" dy="0">云端语音路线：Planner做什么</tspan></text>
<text x="104" y="1492" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="104" dy="0">1. 前提：卡片已展示，业务注册了卡片上下文/动态选择能力。</tspan><tspan x="104" dy="31">2. 用户说“好的”“先不用”等泛化表达时，Planner结合当前卡片理解。</tspan><tspan x="104" dy="31">3. Planner返回“确认/拒绝/其他诉求”等结果或调用已注册选择能力。</tspan><tspan x="104" dy="31">4. 卡片消失后注销上下文，不能让旧回答消费旧卡片。</tspan><tspan x="104" dy="31">Planner不负责：创建卡片、决定卡片文案、调用车控、判断最终成功。</tspan></text>
<rect x="946" y="1410" width="874" height="260" rx="12" fill="#F4F6F8" stroke="#8AA3C1" stroke-width="1.8"/>
<text x="970" y="1450" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="970" dy="0">云端点击路线：配置时必须二选一</tspan></text>
<text x="970" y="1492" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="970" dy="0">A. 直接业务回调：按钮直接把标准选择返回原业务（目标方式）。</tspan><tspan x="970" dy="31">B. 兼容模拟 Query：若现有静态 Advisor 暂无点击直达接口，按钮把约定</tspan><tspan x="970" dy="31">   Query 送到云端，再由 Planner 转成业务选择（仅兼容场景，不默认）。</tspan><tspan x="970" dy="31">平台必须明确展示当前选了哪条路线，不能由研发运行时猜测。</tspan><tspan x="970" dy="31">无论哪条路线，最后都由原业务重新检查、执行、回读并更新卡片。</tspan></text>
<rect x="56" y="1748" width="1788" height="42" rx="10" fill="#FFF0F0" stroke="#DB5C5C" stroke-width="1.6"/>
<text x="950" y="1776" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="650" fill="#8C3434" text-anchor="middle"><tspan x="950" dy="0">责任判断口诀：谁拥有这项任务，谁就注册卡片并消费结果；Trigger负责“何时发生”，Planner只在选定云端语义路线时负责“用户是什么意思”。</tspan></text>
</svg>