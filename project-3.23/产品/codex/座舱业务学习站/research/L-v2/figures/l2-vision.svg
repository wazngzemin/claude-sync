<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="l2-vision" width="1200" height="861" viewBox="0 0 1200 861" role="img" aria-labelledby="l2-vision-title l2-vision-desc">
<title id="l2-vision-title">同一个摄像头，常驻观察和单次观察怎样轮流用</title><desc id="l2-vision-desc">视觉 SDK 安排采样与抢占。以高优先单次观察插入舱外常驻观察为例，舱内两条观察照常。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="l2-vision-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">同一个摄像头，常驻观察和单次观察怎样轮流用</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">视觉 SDK 安排采样与抢占。以高优先单次观察插入舱外常驻观察为例，舱内两条观察照常。</text>
<text class="v56-label" x="400" y="110" text-anchor="start">时间示意</text>
<path class="v56-arrow" d="M 400 145 L 1020 145"/>
<path class="v56-arrow" d="M 1040 145 L 1168 145" marker-end="url(#l2-vision-arr)"/>
<path class="v56-arrow" d="M 400 141 L 400 150"/>
<text class="v56-subtitle" x="400" y="172" text-anchor="middle">0 秒</text>
<path class="v56-arrow" d="M 600 141 L 600 150"/>
<text class="v56-subtitle" x="600" y="172" text-anchor="middle">5 秒</text>
<path class="v56-arrow" d="M 800 141 L 800 150"/>
<text class="v56-subtitle" x="800" y="172" text-anchor="middle">10 秒</text>
<path class="v56-arrow" d="M 1000 141 L 1000 150"/>
<text class="v56-subtitle" x="1000" y="172" text-anchor="middle">15 秒</text>
<path class="v56-arrow" d="M 1138 141 L 1138 150"/>
<text class="v56-subtitle" x="1138" y="172" text-anchor="middle">5 分钟</text>
<path class="v56-arrow" d="M 1020 150 L 1027 140"/>
<path class="v56-arrow" d="M 1029 150 L 1036 140"/>
<g data-node="true" id="l2-vision-outside">
<rect class="v56-local" x="32" y="193" width="330" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="221" text-anchor="start">舱外常驻观察 · 约 3 秒一轮</text>
<text class="v56-node-sub" x="46" y="249" text-anchor="start">随 AI Box 启动</text>
<text class="v56-node-sub" x="46" y="273" text-anchor="start">下电停止</text>
</g>
<g data-node="true" id="l2-vision-in-motion">
<rect class="v56-local" x="32" y="321" width="330" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="349" text-anchor="start">舱内动态 · 约 5 秒一轮</text>
<text class="v56-node-sub" x="46" y="377" text-anchor="start">AI Box 就绪、持续观察开启后运行</text>
<text class="v56-node-sub" x="46" y="401" text-anchor="start">关闭持续观察或下电时停止</text>
</g>
<g data-node="true" id="l2-vision-in-static">
<rect class="v56-local" x="32" y="449" width="330" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="477" text-anchor="start">舱内静态 · 约 5 分钟一轮</text>
<text class="v56-node-sub" x="46" y="505" text-anchor="start">与舱内动态共用启停条件</text>
</g>
<path class="v56-arrow" d="M 400 245 L 600 245"/>
<path class="v56-arrow" d="M 740 245 L 1016 245"/>
<circle data-decoration="true" class="v56-local" cx="400" cy="245" r="6" stroke-width="1.6"/>
<circle data-decoration="true" class="v56-local" cx="520" cy="245" r="6" stroke-width="1.6"/>
<circle data-decoration="true" class="v56-local" cx="760" cy="245" r="6" stroke-width="1.6"/>
<circle data-decoration="true" class="v56-local" cx="880" cy="245" r="6" stroke-width="1.6"/>
<circle data-decoration="true" class="v56-local" cx="1000" cy="245" r="6" stroke-width="1.6"/>
<text class="v56-label" x="670" y="250" text-anchor="middle">常驻暂停</text>
<text class="v56-label" x="750" y="221" text-anchor="start">视觉 SDK 恢复</text>
<path class="v56-arrow" d="M 400 373 L 1016 373"/>
<circle data-decoration="true" class="v56-local" cx="400" cy="373" r="6" stroke-width="1.6"/>
<circle data-decoration="true" class="v56-local" cx="600" cy="373" r="6" stroke-width="1.6"/>
<circle data-decoration="true" class="v56-local" cx="800" cy="373" r="6" stroke-width="1.6"/>
<circle data-decoration="true" class="v56-local" cx="1000" cy="373" r="6" stroke-width="1.6"/>
<path class="v56-arrow" d="M 400 501 L 1016 501"/>
<path class="v56-arrow" d="M 1040 501 L 1138 501"/>
<path class="v56-arrow" d="M 1020 506 L 1027 496"/>
<path class="v56-arrow" d="M 1029 506 L 1036 496"/>
<circle data-decoration="true" class="v56-local" cx="400" cy="501" r="6" stroke-width="1.6"/>
<circle data-decoration="true" class="v56-local" cx="1138" cy="501" r="6" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="605" text-anchor="start">单次观察 · 例子</text>
<text class="v56-node-sub" x="46" y="633" text-anchor="start">挂 P 挡后看一眼前方有没有充电桩</text>
<text class="v56-node-sub" x="46" y="657" text-anchor="start">超时或失败重试 1 次，再失败则停止并告警</text>
<text class="v56-label" x="584" y="622" text-anchor="end">请求取画面</text>
<path class="v56-arrow" d="M 480 635 L 600 635" marker-end="url(#l2-vision-arr)"/>
<g data-node="true" id="l2-vision-one-shot">
<rect class="v56-decision" x="600" y="585" width="140" height="92" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="614" y="613" text-anchor="start">高优先占用</text>
<text class="v56-node-sub" x="614" y="641" text-anchor="start">同一舱外摄像头</text>
</g>
<path class="v56-arrow" d="M 740 635 L 836 635" marker-end="url(#l2-vision-arr)"/>
<text class="v56-label" x="848" y="640" text-anchor="start">完成或超时后释放</text>
<text class="v56-subtitle" x="400" y="707" text-anchor="start">同优先级先来先做。采样节律与触发时延分别核对。</text>
<path class="v56-rule" d="M 32 751 L 1168 751"/>
<text class="v56-node-title" x="32" y="785" text-anchor="start">同一摄像头同一时间只给一个任务，常驻观察由视觉 SDK 恢复。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="811" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="825" text-anchor="start">蓝：常驻观察与每轮采样</text>
<rect data-decoration="true" class="v56-decision" x="600.0" y="811" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="825" text-anchor="start">黄：高优先单次观察占用</text>
</svg>
