<text x="5231" y="5395" font-size="20px" font-weight="500" fill="#19354C" text-anchor="start">① 先确定是谁：音区、座位、人脸注册身份不能随意混用。</text>

<text x="5231" y="5499" font-size="20px" font-weight="500" fill="#19354C" text-anchor="start">⑤ 是否能写：隐式推断与用户明确要求保存要区分。</text>
<text x="5231" y="5525" font-size="20px" font-weight="500" fill="#19354C" text-anchor="start">⑥ 如何验收：写入成功 → 下一次可检索 → 不串用户 → 更正能生效。</text>
<text x="5231" y="5551" font-size="20px" font-weight="500" fill="#19354C" text-anchor="start">这些边界影响体验与数据隔离，但不要求产品经理实现向量数据库。</text>

<text x="6392" y="6961" font-size="20px" font-weight="550" fill="#486579" text-anchor="start">达到这些能力可开始评估机会；离职还取决于职责、成长、成果和下一份工作的匹配度。</text>

<text x="1792" y="375" font-size="19px" font-weight="500" fill="#19354C" text-anchor="start">注册完成只代表进入等待</text>

<text x="3465" y="349" font-size="19px" font-weight="500" fill="#19354C" text-anchor="start">围绕一个目标持续评估</text>

<text x="6811" y="375" font-size="19px" font-weight="500" fill="#19354C" text-anchor="start">是否仍需执行/目标是否已完成</text>

<text x="92" y="571" font-size="20px" font-weight="550" fill="#486579" text-anchor="start">用户的“十分钟后关加热”必须先进入等待；到时条件满足后再判断并执行，创建目标成功不能说加热已经关闭。</text>

"结果图或失败/处理中状态","参数契约需核对运行版本","未返回图片不算已交付"],"write":false}],"question":"关键问：哪几个工具搜索后自动播放？哪几个先受理、过一段时间才有结果？","metric":"验收：找对内容、播放成功、重复播放、异步结果可追踪、首播/生成耗时。"},{"title":"身份与用户记忆","tools":[{"n":12,"name":"user_memory_search","cn":"查用户记忆","input":["已注册用户+记忆问题"],"mechanism":["按身份检索事实/偏好/经历","返回相关记录与可用线索","未找到就回报缺失"],"result":["不把其他乘员记忆套给主驾","查无结果时不补造经历","供 Planner 再判断/澄清"],"write":false},{"n":13,"name":"face_id_register","cn":"人脸注册","input":["姓名与座位信息"],"mechanism":["缺姓名/座位需先补齐","发起对应位置的注册流程","同意与生物信息门禁待核"],"result":["注册状态回报而非口头默认","不把临时称呼当注册完成","失败需明确后续怎么做"],"write":true},{"n":14,"name":"user_memory_operate","cn":"增改用户记忆","input":["用户身份+需保存/修正事实"],"mechanism":["明确且归属正确的事实/偏好","不确定先澄清","用户更正要处理旧错误记录"],"result":["注册前后行为依契约核验","记录成功与检索命中分开验收","写入/修改字段口径须统一"],"write":true}],"extraTitle":"记忆不是“放进上下文就都知道了”","extra":["① 先确定是谁：音区、座位、人脸注册身份不能随意混用。","② 本轮需要什么：只读相关事实，不默认把所有历史带入。","③ 是否有证据：昨天去过的地点与用户喜欢的地点不同。","④ 信息是否有效：用户已更正的旧偏好不得盖过新事实。","⑤ 是否能写：隐式推断与用户明确要求保存要区分。","⑥ 如何验收：写入成功 → 下一次可检索 → 不串用户 → 更正能生效。","这些边界影响体验与数据隔离，但不要求产品经理实现向量数据库。"],"question":"关键问：“昨天那家店”查的是谁的记忆？用户纠正后为什么还会命中旧事实？","metric":"验收：身份/事实准确、必要记忆召回、串用户、写入后可检索、错误记忆纠正。"},{"title":"知识、搜索与车务","tools":[{"n":15,"name":"web_search","cn":"网页搜索","input":["需要外部资料的具体问题"],"mechanism":["搜实时/外部知识线索","带时间范围与必要上下文","将结果供 Planner 综合回答"],"result":["摘要不自动等于已核实事实","需保留来源与时间","空结果/冲突结果要可解释"],"write":false},{"n":21,"name":"car_log","cn":"行车日志","input":["行程/历史驾驶记录问题"],"mechanism":["检索或生成相关历史报告","区分时段与统计口径","不替代当下车辆状态查询"],"result":["历史记录与实时车况分开","缺记录不等于从未发生","报告数据范围需明确"],"write":false},{"n":22,"name":"vehicle_manual_qa","cn":"车辆说明书问答","input":["功能使用/车辆知识问题"],"mechanism":["检索车型说明与操作知识","返回使用方法/能力限制","不是读取当前传感器数值"],"result":["区分“如何开”与“现在开没开”","车型版本错误会答错能力","不支持须说明范围"],"write":false},{"n":23,"name":"car_care_qa","cn":"用车养护问答","input":["与本车有关的养护问题"],"mechanism":["按车辆/VIN相关信息回答","偏长期养护、用车知识","不替代实时异常状态诊断"],"result":["车辆归属与资料范围需正确","建议与已完成服务分开","不能用知识回答假装修好了"],"write":false}],"extraTitle":"三个看似都在“问车”的工具，事实来源不同","extra":["vehicle_status_search：现在车怎么样 → 实时信号。","vehicle_manual_qa：这个功能怎么用 → 车型说明知识。","car_log：此前发生过什么 → 行车历史记录。","car_care_qa：本车养护问题 → 车辆相关长期资料。","产品经理要能解释为什么路由到它；不是背四个英文名字。"],"question":"关键问：当前状态、历史数据、说明知识分别从哪里来？模型有没有混用？","metric":"验收：来源选择正确、车型/时段正确、事实支撑、缺资料拒答和错误建议。"},{"title":"目标、录音与视觉","tools":[{"n":16,"name":"goal_list_update","cn":"旧版目标管理","input":["延迟/条件/持续目标"],"mechanism":["创建/更新 Goal List 目标","动态 Advisor 观察目标进展","条件满足后给 Planner 建议"],"result":["注册成功只代表进入等待","不可感知条件不能乱创建","新 Task 迁移不混为已上线"],"write":true},{"n":24,"name":"audio_record","cn":"录音纪要","input":["开始/结束/查看录音"],"mechanism":["调用录音与记录功能","运行中与已生成记录分开","麦克风权限/保存策略待核"],"result":["录音启动不等于纪要已完成","查看返回已有记录结果","隐私与留存契约需明确"],"write":true},{"n":26,"name":"visual_qa","cn":"按需视觉问答","input":["方向/对象/视觉问题"],"mechanism":["按请求采集对应画面","视觉模型识别画面内容","需外部知识时再交网页搜索"],"result":["不能直接读取车机屏幕内容","不能靠摄像头知道商品现价","画面范围/新鲜度影响回答"],"write":false}],"extraTitle":"本轮视觉、默认感知、动态观察：三条不同路径","extra":["按需 VQA：用户问“那是什么” → visual_qa → 采图 → 看图 → 工具反馈。","默认 AlwaysOn：持续产生默认场景观察，经端数据中心进入 Context。","动态 watch：云 Task 下发 task_id + 纯观察问题 → 单任务结果单独上报。","动态观察结果不进通用 Context；云端语义 Y/N 后才形成条件回调。","最多 3 个动态观察任务；采用全量列表替换。","AlwaysOn 关闭时拒收新动态任务并清空旧任务，不能悄悄一直观察。","旧 goal_list_update 与新 task_manage 属于不同版本口径，不合并成 28 个已上线工具。"],"question":"关键问：用户要“现在看看”还是“替我盯着”？谁观察，谁判条件，谁执行？","metric":"验收：画面正确/新鲜、任务关联、创建到等待、触发不重复、取消后不再执行。"}],"sources":[{"id":"S1","title":"Director（对话推理引擎）PRD","url":"https://bytedance.larkoffice.com/wiki/XRuKwJ0VPisdUhkxH0ecY1rRn9g","status":"已读原文：端云分流与 Planner 闭环的 PRD 基线，不等于所有车型线上现状"},{"id":"S2","title":"TOB 简单复杂仲裁 · 针对 AI 汽车升级","url":"https://bytedance.larkoffice.com/wiki/HY5QwcsEVioVaHkHlFFcwuoon3b","status":"历史方案：短期演示与长期方向需分开；用于解释路由职责"},{"id":"S3","title":"Task Service 架构设计","url":"https://bytedance.larkoffice.com/wiki/B2WYwXFOIigKzbk7aSYcJWmZn2E","status":"已读原文：2026-09-03 更新设计；图中紫虚线为新方案，不标为全面上线"},{"id":"S4","title":"TaskService 动态感知任务至 VLM 与结果","url":"https://bytedance.larkoffice.com/wiki/DBZxwnI62iavXJksT4ccNu78nOd","status":"已读原文：dynamic_watch_tasks 全量替换、3 项限制、独立结果通道"},{"id":"S5","title":"本地 Planner SP 工具定义快照","url":"/Users/bytedance/Desktop/3.23/产品/1-原始素材/资料数据PRD原件/planner 架构/动态示例/sp.md","status":"本次解析核对：27 个唯一工具；文件修改时间 2026-07-31，不代表全部生产注册表"},{"id":"S6","title":"用户原图的本地复刻底稿","url":"/Users/bytedance/Desktop/3.23/产品/_配套资源(图表脚本)/diagrams-v2/触发器全模块大图-原图复刻.png","status":"用于保持 1–30 编号、端云分区与全链结构；不能单凭图证明部署现状"},{"id":"S7","title":"可见即可说框架需求文档","url":"https://bytedance.larkoffice.com/wiki/AxYjwUI8wiFCXWkdNsDcRae0nCf","status":"本次已读原文：页面解析、指令和元素 ID、ASR、匹配、注册方消歧、模拟点击、历史事件标记；具体卡片接入不由框架 PRD 证明"}]}</script><script>
const D=JSON.parse(document.querySelector('#data').textContent),stage=document.querySelector('#stage'),svg=stage.querySelector(':scope > svg'),ins=document.querySelector('#inspector');
const NS='http://www.w3.org/2000/svg',nodes=new Map(D.nodes.map(n=>[n.id,n])),groups=new Map(D.groups.map(g=>[g.id,g]));let view={x:0,y:0,w:D.width,h:D.height},selected=null,queryHits=[],hitIndex=0;const storageKey='doubao-flow-v11-notes';let notes={};try{notes=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=document.querySelector('#map');map.innerHTML='<svg viewBox="0 0 '+D.width+' '+D.height+'">'+D.groups.map(g=>'<rect x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+'" fill="#e8f0fa" stroke="#9eb8d2" stroke-width="12"/>').join('')+'<rect id="mapView" fill="#185db71a" stroke="#185db7" stroke-width="28"/></svg>';
function setView(v){const a=stage.clientWidth/stage.clientHeight;if(v.w/v.h>a)v.h=v.w/a;else v.w=v.h*a;view=v;svg.setAttribute('viewBox',[v.x,v.y,v.w,v.h].join(' '));document.querySelector('#zoomLabel').textContent=Math.round(stage.clientWidth/v.w*100)+'%';const r=document.querySelector('#mapView');['x','y'].forEach(k=>r.setAttribute(k,v[k]));r.setAttribute('width',v.w);r.setAttribute('height',v.h)}
function fit(r,pad=60){const v={x:r.x-pad,y:r.y-pad,w:r.w+2*pad,h:r.h+2*pad},a=stage.clientWidth/stage.clientHeight,old={...v};if(v.w/v.h>a){v.h=v.w/a;v.y-=(v.h-old.h)/2}else{v.w=v.h*a;v.x-=(v.w-old.w)/2}setView(v)}
function zoom(f,cx=.5,cy=.5){const w=view.w*f,h=view.h*f;if(stage.clientWidth/w<.055||stage.clientWidth/w>2.5)return;setView({x:view.x+(view.w-w)*cx,y:view.y+(view.h-h)*cy,w,h})}
function focusNode(id){const n=nodes.get(id);if(!n)return;selectNode(id);fit({x:n.x-130,y:n.y-105,w:n.w+260,h:n.h+280},15)}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(notes))}catch{}}
function bindNotes(){ins.querySelectorAll('[data-note]').forEach(el=>{el.addEventListener('input',()=>{notes[el.dataset.note]=el.type==='checkbox'?el.checked:el.value;save()})})}
function qHTML(key,qs){return qs.map((q,i)=>{const k=key+'-'+i;return '<div class="q"><label><input type="checkbox" data-note="'+k+'-ok" '+(notes[k+'-ok']?'checked':'')+'><span>'+esc(q)+'</span></label><textarea class="answer" data-note="'+k+'" placeholder="我的回答、真实日志/案例与证据链接…">'+esc(notes[k]||'')+'</textarea></div>'}).join('')}
function metricHTML(ms){return ms.map(m=>'<div class="metric"><strong>'+esc(m.name)+'</strong><dl><dt>分子</dt><dd>'+esc(m.numerator)+'</dd><dt>分母</dt><dd>'+esc(m.denominator)+'</dd><dt>怎么测</dt><dd>'+esc(m.measure)+'</dd><dt>分层</dt><dd>'+esc(m.slice)+'</dd></dl></div>').join('')}
function srcHTML(){return '<h3>事实口径与来源</h3><div class="callout warn">这张图不是全车型生产拓扑的证明。实线描述已读资料中的业务契约；紫虚线标演进方案。待核项保留待核，不用行业常识填成公司现状。</div>'+D.sources.map(s=>'<div class="source"><a href="'+esc(s.url)+'" target="_blank">'+esc(s.id+' · '+s.title)+'</a><p>'+esc(s.status)+'</p></div>').join('')}
function home(){ins.innerHTML='<div class="kicker">先读一轮，再读回路</div><h2>从一条 Query 追到真实结果</h2><div class="callout">示例：“我有点热，带我去昨天的游泳馆。”先看听到什么、走哪条路；再看 Planner 缺什么、调什么；最后看空调与导航到底有没有做成。</div><h3>阅读顺序</h3><div class="navlist">'+[['V1','1 语音入口'],['D1','2 端侧分流'],['R1','3 云端分流'],['X1','4 上下文输入'],['P1','5 Planner 判断'],['F1','6 工具调度'],['O1','7 真实执行'],['F7','8 工具结果'],['P7','9 再次判断'],['O9','10 用户结果']].map(([id,t])=>'<button data-jump="'+id+'">'+t+'</button>').join('')+'<h3>图上的四个读法</h3><p>粗蓝线：请求与调用。绿线：结果、状态与再判断。橙色节点：判断、等待或确认。紫虚线：新 Task 方案。</p><p>上方旧 Goal 链和新 Task 链按版本区分，不代表一个请求同时创建两份任务。</p><h3>学习深度不是“全部会实现”</h3><p>主责 Planner/Trigger 要做到能定位、定义指标、设计回归并验收改进。相邻 ASR/VLM/SDK/HMI 要懂契约和故障归属；不必把每个底层实现都学完才考虑机会。</p><div class="source-toolbar"><button id="showLearning">完整自测</button><button id="showSources">来源与待核项</button><button id="exportNotes">导出我的总结</button></div><p class="tiny">点图上任意小模块，可查看前一步、下一步、具体问题、指标的分子分母与测量方法。笔记仅保存在当前浏览器；及时导出备份。</p>';bindPanel()}
function bindPanel(){ins.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>focusNode(b.dataset.jump));ins.querySelector('#showLearning')?.addEventListener('click',showLearning);ins.querySelector('#showSources')?.addEventListener('click',()=>{ins.innerHTML=srcHTML()+'<button id="backHome">返回阅读引导</button>';ins.querySelector('#backHome').onclick=home});ins.querySelector('#exportNotes')?.addEventListener('click',exportNotes);bindNotes()}
function selectNode(id){selected=id;svg.querySelectorAll('.selected,.connected,.faded').forEach(el=>el.classList.remove('selected','connected','faded'));svg.querySelector('[data-node-id="'+id+'"]')?.classList.add('selected');const n=nodes.get(id),g=groups.get(n.group),base=D.learning[n.group]||(/^family/.test(n.group)?D.learning.orchestration:n.group==='legacy'?D.learning.task:null);const incoming=D.edges.filter(e=>e.to===id),outgoing=D.edges.filter(e=>e.from===id);for(const e of [...incoming,...outgoing])svg.querySelectorAll('polyline[data-from="'+e.from+'"][data-to="'+e.to+'"]').forEach(el=>el.classList.add('connected'));
const tool=D.toolFamilies.flatMap(f=>f.tools).find(t=>'T'+t.n===id||'T'+t.n+'m'===id||'T'+t.n+'r'===id);
let body='<div class="kicker">'+esc(g.title)+'</div><h2>'+esc(n.title)+'</h2><span class="badge">'+(n.future?'方案 / 待核落地':g.future?'新设计链路':'业务契约')+'</span>'+n.body.map(s=>'<p>'+esc(s)+'</p>').join('');
if(incoming.length)body+='<h3>从哪里来</h3><div class="links">'+incoming.map(e=>'<button data-jump="'+e.from+'">← '+esc(nodes.get(e.from).title)+(e.label?' · '+esc(e.label):'')+'</button>').join('')+'</div>';
if(outgoing.length)body+='<h3>下一步 / 回到哪里</h3><div class="links">'+outgoing.map(e=>'<button data-jump="'+e.to+'">'+esc(nodes.get(e.to).title)+(e.label?' · '+esc(e.label):'')+' →</button>').join('')+'</div>';
if(tool)body+='<h3>本工具的完整契约</h3><div class="toolcode">'+esc(tool.name)+'</div><p><b>输入：</b>'+esc(tool.input.join('；'))+'</p><p><b>处理：</b>'+esc(tool.mechanism.join(' → '))+'</p><p><b>结果/限制：</b>'+esc(tool.result.join('；'))+'</p><div class="callout warn">27 项来自本地 SP 快照。运行时工具数应从具体车型、环境和版本导出；未取得实现证据的 SDK、鉴权、取消和重试细节不能当已确认现状。</div>';
if(base)body+='<h3>我需要掌握到什么程度？</h3><div class="callout">'+esc(base.depth)+'</div><p><b>为什么：</b>'+esc(base.why)+'</p><h3>用这些问题检验自己</h3>'+qHTML(n.group,base.questions)+'<h3>对应的验收指标</h3><p class="tiny">这是指标设计建议，不是团队已达成数据或统一生产阈值。先用真实基线与风险讨论验收线。</p>'+metricHTML(base.metrics);
body+='<h3>这个节点的个人笔记</h3><textarea class="answer" data-note="node-'+id+'" placeholder="我还没确认的机制、想追问的人、证据…">'+esc(notes['node-'+id]||'')+'</textarea><div class="source-toolbar"><button id="exportNotes">导出我的总结</button><button id="showSources">查来源</button></div>';ins.innerHTML=body;ins.scrollTop=0;bindPanel()}
function showLearning(){ins.innerHTML='<div class="kicker">不把工作年限当能力证明</div><h2>我能独立负责到哪一步？</h2><div class="callout">AI 能力最重要，但这里的能力是“让真实目标可靠完成”：模型理解与规划 + 合适的上下文 + 可执行工具 + 反馈纠错。拥有模型或背熟工具清单，不等于已经证明这项能力。</div><h3>建议自测，不是离职硬门槛</h3>'+qHTML('readiness',['独立复盘 10 条完整 Trace：简单车控、复杂多目标、串行依赖、条件、持续、视觉、主动建议、取消、失败恢复、离线。','独立解释 5 个跨模块 badcase：指出最早出错的事实、排除其他原因，并拿得出日志。','完成 1 次有基线、有保留集、有回归与上线后跟踪的 Planner/Trigger 改进。','说清 27 项工具的能力边界，能深入主责场景里实际调用的工具机制，而不是平均背诵全部实现。','能在评审会上提出具体的“什么情况下、哪条证据、由谁确认、怎么验收”的问题。'])+'<h3>什么时候可以开始看机会？</h3><p>不必等全部底层模块学完。能讲清自己负责的链路、展示一次有测量结果的改进、解释协作边界时，就可以开始评估机会；是否离开还要比较当前成长空间、下一份职责和真实成果积累。</p><h3>按模块深入</h3><div class="navlist">'+Object.keys(D.learning).map(k=>{const n=D.nodes.find(n=>n.group===k);return n?'<button data-jump="'+n.id+'">'+esc(groups.get(k)?.title||k)+'</button>':''}).join('')+'</div><h3>主责模块优先的指标</h3>'+metricHTML(D.learning.planner.metrics)+'<button id="exportNotes">导出我的总结</button>';ins.scrollTop=0;bindPanel()}
function exportNotes(){const lines=['# 豆包汽车业务链路 · 我的总结','',new Date().toLocaleString(),''];for(const [k,l] of Object.entries(D.learning)){lines.push('## '+(groups.get(k)?.title||k),'',l.depth,'');l.questions.forEach((q,i)=>{lines.push('- ['+(notes[k+'-'+i+'-ok']?'x':' ')+'] '+q);if(notes[k+'-'+i])lines.push('  '+notes[k+'-'+i]);});lines.push('')}for(const [k,v] of Object.entries(notes))if(k.startsWith('node-')&&v)lines.push('### '+(nodes.get(k.slice(5))?.title||k),'',String(v),'');lines.push('## 原始笔记数据','',JSON.stringify(notes,null,2));const a=document.createElement('a'),blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download='豆包汽车-链路学习总结-'+new Date().toISOString().slice(0,10)+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function chooseView(k){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===k));if(k==='all'){fit({x:0,y:0,w:D.width,h:D.height},0);home()}if(k==='start'){focusNode('V1')}if(k==='core'){fit(groups.get('planner'));selectNode('P1')}if(k==='tasks'){fit(groups.get('task'));selectNode('K1')}if(k==='tools'){fit(groups.get('family-0'));selectNode('T1')}if(k==='learn'){fit(groups.get('learning'));showLearning()}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>chooseView(b.dataset.view));document.querySelector('#zoomIn').onclick=()=>zoom(.8);document.querySelector('#zoomOut').onclick=()=>zoom(1.25);document.querySelector('#zoomReset').onclick=()=>chooseView('all');document.querySelector('#toggleSide').onclick=()=>{document.body.classList.toggle('wide');document.querySelector('#toggleSide').textContent=document.body.classList.contains('wide')?'展开面板':'收起面板';setView({...view})};
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(Math.exp(e.deltaY*.0015),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,v:{...view},id:e.target.dataset.nodeId,moved:false};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;setView({...drag.v,x:drag.v.x-dx*drag.v.w/stage.clientWidth,y:drag.v.y-dy*drag.v.h/stage.clientHeight})});svg.addEventListener('pointerup',()=>{if(drag&&!drag.moved&&drag.id)selectNode(drag.id);drag=null;svg.classList.remove('dragging')});svg.addEventListener('dblclick',e=>{if(e.target.dataset.nodeId)focusNode(e.target.dataset.nodeId)});
map.addEventListener('click',e=>{const r=map.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*D.width,y=(e.clientY-r.top)/r.height*D.height;setView({...view,x:x-view.w/2,y:y-view.h/2})});
function search(next=false){const q=document.querySelector('#search').value.trim().toLowerCase();if(!q)return;if(!next||!queryHits.length){queryHits=D.nodes.filter(n=>(n.title+' '+n.body.join(' ')).toLowerCase().includes(q));hitIndex=0}if(!queryHits.length){ins.innerHTML='<h2>没有匹配节点</h2><p>试试工具名、中文名称或“回调”“白名单”等词。</p>';return}focusNode(queryHits[hitIndex%queryHits.length].id);hitIndex++;document.querySelector('#searchNext').textContent=hitIndex%queryHits.length+'/'+queryHits.length}
document.querySelector('#search').addEventListener('input',()=>{queryHits=[];document.querySelector('#searchNext').textContent='定位'});document.querySelector('#search').addEventListener('keydown',e=>{if(e.key==='Enter')search(true)});document.querySelector('#searchNext').onclick=()=>search(true);window.addEventListener('resize',()=>setView({...view}));
home();requestAnimationFrame(()=>{const hash=decodeURIComponent(location.hash.slice(1));if(nodes.has(hash))focusNode(hash);else{fit({x:0,y:0,w:D.width,h:D.height},0);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='all'))}});
window.flowState={data:D,getView:()=>view,focusNode,chooseView};
</script></body></html>
