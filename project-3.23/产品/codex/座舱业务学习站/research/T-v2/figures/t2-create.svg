<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="t2-create" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="t2-create-title t2-create-desc">
<title id="t2-create-title">创建任务，要先保存、再登记、最后确认</title><desc id="t2-create-desc">“三十分钟后提醒我去接小宝”：只有保存回执，还不能说“安排好了”。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="t2-create-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">创建任务，要先保存、再登记、最后确认</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">“三十分钟后提醒我去接小宝”：只有保存回执，还不能说“安排好了”。</text>
<g data-node="true" id="t2-create-entry"><rect class="v56-cloud" x="80" y="118" width="660" height="80" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="146" text-anchor="start">任务入口工具</text>
<text class="v56-node-sub" x="94" y="174" text-anchor="start">交入用户原话与可选运行提示</text>
</g>
<g data-node="true" id="t2-create-identify"><rect class="v56-cloud" x="80" y="234" width="660" height="122" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="262" text-anchor="start">任务规格生成：先读当前任务列表</text>
<text class="v56-node-sub" x="94" y="290" text-anchor="start">识别新增 / 修改 / 取消 / 查询</text>
<text class="v56-node-sub" x="94" y="314" text-anchor="start">修改、取消先定位原任务；定位不到就澄清</text>
<text class="v56-node-sub" x="94" y="338" text-anchor="start">新增、修改才生成任务规格</text>
</g>
<g data-node="true" id="t2-create-checks"><rect class="v56-decision" x="80" y="392" width="660" height="222" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="420" text-anchor="start">新增 / 修改：五项检查 + 数量与时长限制</text>
<text class="v56-node-sub" x="94" y="448" text-anchor="start">条件能感知；条件可能发生</text>
<text class="v56-node-sub" x="94" y="472" text-anchor="start">动作合价值观；动作能执行；条件与动作不矛盾</text>
<text class="v56-node-sub" x="94" y="496" text-anchor="start">定时 + 循环定时：最多 20 个</text>
<text class="v56-node-sub" x="94" y="520" text-anchor="start">条件 + 循环条件：最多 20 个</text>
<text class="v56-node-sub" x="94" y="544" text-anchor="start">定时：1 分钟～2 周；视觉观察另限同时 3 个</text>
<text class="v56-node-sub" x="94" y="568" text-anchor="start">视觉需全时视觉感知开启；目的地提醒需有导航</text>
</g>
<g data-node="true" id="t2-create-save"><rect class="v56-cloud" x="80" y="650" width="660" height="80" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="678" text-anchor="start">先保存任务</text>
<text class="v56-node-sub" x="94" y="706" text-anchor="start">先有任务，规则命中时才找得到它</text>
</g>
<g data-node="true" id="t2-create-register"><rect class="v56-cloud" x="80" y="766" width="660" height="80" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="794" text-anchor="start">再登记等待条件</text>
<text class="v56-node-sub" x="94" y="822" text-anchor="start">把“三点半”登记给触发器</text>
</g>
<g data-node="true" id="t2-create-reply"><rect class="v56-local" x="80" y="882" width="660" height="116" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="910" text-anchor="start">最后回话：进行中只中性受理</text>
<text class="v56-node-sub" x="94" y="938" text-anchor="start">先启动需要立即开始的任务，再发状态消息</text>
<text class="v56-node-sub" x="94" y="962" text-anchor="start">上汽异步创建：等创建回调再确认</text>
</g>
<g data-node="true" id="t2-create-reject"><rect class="v56-reject" x="840" y="392" width="328" height="116" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="854" y="420" text-anchor="start">检查不过：澄清或拒绝</text>
<text class="v56-node-sub" x="854" y="448" text-anchor="start">说明具体原因</text>
<text class="v56-node-sub" x="854" y="472" text-anchor="start">不承诺做不到的事</text>
</g>
<g data-node="true" id="t2-create-failure"><rect class="v56-reject v56-pending" x="840" y="750" width="328" height="164" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="854" y="778" text-anchor="start">登记失败：不能说“安排好了”</text>
<text class="v56-node-sub" x="854" y="806" text-anchor="start">保存成功 ≠ 登记成功</text>
<text class="v56-node-sub" x="854" y="830" text-anchor="start">补救方式要在评审里定</text>
<text class="v56-node-sub" x="854" y="854" text-anchor="start">虚线：补救方式仍需对齐</text>
</g>
<path class="v56-arrow" d="M 410 198 L 410 234" marker-end="url(#t2-create-arr)"/>
<path class="v56-arrow" d="M 410 356 L 410 392" marker-end="url(#t2-create-arr)"/>
<path class="v56-arrow" d="M 410 614 L 410 650" marker-end="url(#t2-create-arr)"/>
<path class="v56-arrow" d="M 410 730 L 410 766" marker-end="url(#t2-create-arr)"/>
<path class="v56-arrow" d="M 410 846 L 410 882" marker-end="url(#t2-create-arr)"/>
<path class="v56-arrow" d="M 740 450 L 840 450" marker-end="url(#t2-create-arr)"/>
<text class="v56-risk" x="764" y="432" text-anchor="start">不通过</text>
<path class="v56-arrow" d="M 740 806 L 840 806" marker-end="url(#t2-create-arr)"/>
<text class="v56-risk" x="764" y="788" text-anchor="start">失败</text>
<path class="v56-rule" d="M 32 1030 L 1168 1030"/>
<text class="v56-node-title" x="32" y="1066" text-anchor="start">保存、登记和回话是三个动作，逐个核对实际结果。</text>
<rect data-decoration="true" class="v56-cloud" x="32.0" y="1094" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1108" text-anchor="start">绿：创建与登记</text>
<rect data-decoration="true" class="v56-decision" x="316.0" y="1094" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="1108" text-anchor="start">黄：创建约束</text>
<rect data-decoration="true" class="v56-local" x="600.0" y="1094" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="1108" text-anchor="start">蓝：用户回话</text>
<rect data-decoration="true" class="v56-reject" x="884.0" y="1094" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="1108" text-anchor="start">红：失败；虚线：仍在对齐</text>
</svg>
