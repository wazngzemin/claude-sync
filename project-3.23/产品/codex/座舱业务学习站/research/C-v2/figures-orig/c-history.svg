<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="c-history" width="1260" height="1040" viewBox="0 0 1260 1040" role="img" aria-labelledby="c-history-title c-history-desc"><title id="c-history-title">历史输入怎么挑：同一段经历，两种取法</title><desc id="c-history-desc">上面按时间看经历，中间比较现在与讨论方向；拒识和风控的轮次始终过滤。</desc><style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style><defs><marker id="c-history-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs><text class="v56-title" x="32" y="44" text-anchor="start">历史输入怎么挑：同一段经历，两种取法</text><text class="v56-subtitle" x="32" y="72" text-anchor="start">上面按时间看经历，中间比较现在与讨论方向；拒识和风控的轮次始终过滤。</text><g data-node="true"><rect class="v56-neutral" x="32" y="120" width="1196" height="120" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="46" y="147" text-anchor="start">过去 30 分钟（越往右越近）</text><text class="v56-node-sub" x="46" y="172" text-anchor="start">① 人机　② 人机　③ 人人对话　④ 手动调空调　⑤ 人机</text><text class="v56-node-sub" x="46" y="193" text-anchor="start">⑥ 人人对话　⑦ 人机　⑧ 触发风控　⑨ 人机　⑩ 乘客上车　→ 这句</text></g><g data-node="true"><rect class="v56-cloud" x="32" y="280" width="1196" height="120" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="46" y="307" text-anchor="start">现在</text><text class="v56-node-sub" x="46" y="332" text-anchor="start">最近 5 轮有效人机对话 + 近 10 分钟最多 3 条白名单事件（假设④⑩都符合）</text><text class="v56-node-sub" x="46" y="353" text-anchor="start">带上：①②⑤⑦⑨ 的人机对话，④⑩ 的白名单事件；不带：③⑥⑧</text></g><g data-node="true"><rect class="v56-cloud v56-pending" x="32" y="440" width="1196" height="120" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="46" y="467" text-anchor="start">讨论中的方向</text><text class="v56-node-sub" x="46" y="492" text-anchor="start">有效人机对话继续保留；尝试把非人机内容并入最近 5 轮窗口</text><text class="v56-node-sub" x="46" y="513" text-anchor="start">图示：保留①②⑤⑦⑨；⑩入窗，④在窗外；③⑥被拒识、⑧触发风控，仍不带</text></g><g data-node="true"><rect class="v56-reject" x="32" y="610" width="580" height="120" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="46" y="637" text-anchor="start">为什么 ⑧ 两种方式都不带</text><text class="v56-node-sub" x="46" y="662" text-anchor="start">触发风控的轮次标记后下一轮过滤；</text><text class="v56-node-sub" x="46" y="683" text-anchor="start">否则敏感输入会被模型反复看到（出过“复活”）</text></g><g data-node="true"><rect class="v56-decision" x="648" y="610" width="580" height="120" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="662" y="637" text-anchor="start">为什么 ③⑥ 现在不带</text><text class="v56-node-sub" x="662" y="662" text-anchor="start">③⑥都是被拒识的人人对话，不进入人机历史</text><text class="v56-node-sub" x="662" y="683" text-anchor="start">讨论方向调整事件如何入窗；被拒识的话仍不带</text></g><g data-node="true"><rect class="v56-cloud" x="32" y="780" width="1196" height="110" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="46" y="807" text-anchor="start">对话摘要：从第 3 轮起滚动压缩，最长 500 token</text><text class="v56-node-sub" x="46" y="832" text-anchor="start">覆盖本次用车更早的对话</text><text class="v56-node-sub" x="46" y="853" text-anchor="start">放在记忆的最前面，补上“5 轮之外、长期记忆还没生成”的空档</text></g><rect data-role="legend" class="v56-neutral" x="32" y="940" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="60" y="954" text-anchor="start">灰：过去的经历</text><rect data-role="legend" class="v56-cloud" x="195" y="940" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="223" y="954" text-anchor="start">绿：进入本轮</text><rect data-role="legend" class="v56-reject" x="344" y="940" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="372" y="954" text-anchor="start">红：风控过滤</text><rect data-role="legend" class="v56-decision" x="493" y="940" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="521" y="954" text-anchor="start">黄：拒识过滤</text><text class="v56-subtitle" x="32" y="992" text-anchor="start">虚线框：讨论中的方向；具体入窗方式尚在演进。</text></svg>