<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="g2-wake" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="g2-wake-title g2-wake-desc">
<title id="g2-wake-title">信号先叫醒相关规则，再判断全部条件</title><desc id="g2-wake-desc">这次上报只带续航；其他条件要用当前值补齐，叫醒并不代表命中。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="g2-wake-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">信号先叫醒相关规则，再判断全部条件</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">这次上报只带续航；其他条件要用当前值补齐，叫醒并不代表命中。</text>
<g data-node="true" id="g2-wake-report"><rect class="v56-local" x="40" y="170" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="198" text-anchor="start">01 · 车端上报</text>
<text class="v56-node-sub" x="54" y="226" text-anchor="start">渠道 + 车辆 + 续航</text>
<text class="v56-node-sub" x="54" y="250" text-anchor="start">例如：101 公里 → 99 公里</text>
</g>
<g data-node="true" id="g2-wake-filter"><rect class="v56-cloud" x="435" y="170" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="198" text-anchor="start">02 · 按渠道和信号粗筛</text>
<text class="v56-node-sub" x="449" y="226" text-anchor="start">挑出订阅续航的相关场景</text>
<text class="v56-node-sub" x="449" y="250" text-anchor="start">不把所有场景都算一遍</text>
</g>
<path class="v56-arrow" d="M 370 240 L 435 240" marker-end="url(#g2-wake-arr)"/>
<g data-node="true" id="g2-wake-wake"><rect class="v56-cloud" x="830" y="170" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="198" text-anchor="start">03 · 叫醒主例规则</text>
<text class="v56-node-sub" x="844" y="226" text-anchor="start">进入本次检查</text>
<text class="v56-node-sub" x="844" y="250" text-anchor="start">此时尚未判定条件成立</text>
</g>
<path class="v56-arrow" d="M 765 240 L 830 240" marker-end="url(#g2-wake-arr)"/>
<g data-node="true" id="g2-wake-fetch"><rect class="v56-cloud" x="830" y="400" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="428" text-anchor="start">04 · 补齐其他当前值</text>
<text class="v56-node-sub" x="844" y="456" text-anchor="start">条件里的信号不同时到</text>
<text class="v56-node-sub" x="844" y="480" text-anchor="start">账号开关只查值、不叫醒</text>
</g>
<path class="v56-arrow" d="M 995 310 L 995 400" marker-end="url(#g2-wake-arr)"/>
<g data-node="true" id="g2-wake-judge"><rect class="v56-decision" x="435" y="400" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="428" text-anchor="start">05 · 判断全部条件</text>
<text class="v56-node-sub" x="449" y="456" text-anchor="start">核对续航和其他条件</text>
<text class="v56-node-sub" x="449" y="480" text-anchor="start">不能只看这次上报的那一项</text>
</g>
<path class="v56-arrow" d="M 830 470 L 765 470" marker-end="url(#g2-wake-arr)"/>
<g data-node="true" id="g2-wake-result"><rect class="v56-decision" x="40" y="400" width="330" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="428" text-anchor="start">06 · 分开记录结果</text>
<text class="v56-node-sub" x="54" y="456" text-anchor="start">成立 / 不成立 / 未知</text>
<text class="v56-node-sub" x="54" y="480" text-anchor="start">只有成立才继续检查频控</text>
</g>
<path class="v56-arrow" d="M 435 470 L 370 470" marker-end="url(#g2-wake-arr)"/>
<text class="v56-node-title" x="40" y="610" text-anchor="start">较新叫醒设计</text>
<text class="v56-node-sub" x="40" y="646" text-anchor="start">有变化条件：只被变化信号叫醒；没有变化条件：被全部条件信号叫醒。</text>
<text class="v56-node-sub" x="40" y="676" text-anchor="start">有视觉节点：另外订阅视觉字段；叫醒以后仍判断全部条件。</text>
<text class="v56-label" x="40" y="717" text-anchor="start">上报带旧值：单信号场景可少查一次车况；几个条件不会保证同时上报。</text>
<path class="v56-rule" d="M 32 766 L 1168 766"/>
<text class="v56-node-title" x="32" y="800" text-anchor="start">叫醒选错会漏触：挂 D 挡、识别儿童的两种先后顺序都要测。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="826" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="840" text-anchor="start">蓝：车端输入</text>
<rect data-decoration="true" class="v56-cloud" x="410.6666666666667" y="826" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="840" text-anchor="start">绿：筛选、叫醒与补值</text>
<rect data-decoration="true" class="v56-decision" x="789.3333333333334" y="826" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="840" text-anchor="start">黄：判断结果</text>
</svg>
