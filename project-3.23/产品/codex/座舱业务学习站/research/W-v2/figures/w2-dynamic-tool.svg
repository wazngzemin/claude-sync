<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="w2-dynamic-tool" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="w2-dynamic-tool-title w2-dynamic-tool-desc">
<title id="w2-dynamic-tool-title">没对上按钮，云端怎样理解当前卡片</title><desc id="w2-dynamic-tool-desc">按场景临时加载动态工具，让 Planner 理解用户指的是哪个按钮，再交给车机执行。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="w2-dynamic-tool-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<path class="v56-arrow" d="M 372 225 L 430 225" fill="none" marker-end="url(#w2-dynamic-tool-arr)"/>
<path class="v56-arrow" d="M 770 225 L 828 225" fill="none" marker-end="url(#w2-dynamic-tool-arr)"/>
<path class="v56-arrow" d="M 998 300 L 998 420" fill="none" marker-end="url(#w2-dynamic-tool-arr)"/>
<path class="v56-arrow" d="M 828 485 L 770 485" fill="none" marker-end="url(#w2-dynamic-tool-arr)"/>
<path class="v56-arrow" d="M 430 485 L 372 485" fill="none" marker-end="url(#w2-dynamic-tool-arr)"/>
<path class="v56-arrow" d="M 32 485 L 16 485 L 16 110 L 998 110 L 998 150" fill="none" marker-end="url(#w2-dynamic-tool-arr)"/>
<g data-node="true" data-key="report">
<rect class="v56-local" x="32" y="150" width="340" height="150" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="177" text-anchor="start">车机上报卡片信息</text>
<text class="v56-node-sub" x="46" y="202" text-anchor="start">标题、正文、按钮、原因</text>
<text class="v56-node-sub" x="46" y="223" text-anchor="start">card_id 一并上报</text>
</g>
<g data-node="true" data-key="load">
<rect class="v56-decision" x="430" y="150" width="340" height="150" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="177" text-anchor="start">AgentServer 按条件加载工具</text>
<text class="v56-node-sub" x="444" y="202" text-anchor="start">条件引擎先判断当前场景</text>
<text class="v56-node-sub" x="444" y="223" text-anchor="start">它按规则计算，不调用模型</text>
<text class="v56-node-sub" x="444" y="244" text-anchor="start">满足条件才加入 Planner 工具列表</text>
</g>
<g data-node="true" data-key="planner">
<rect class="v56-cloud" x="828" y="150" width="340" height="150" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="177" text-anchor="start">Planner 选择按钮</text>
<text class="v56-node-sub" x="842" y="202" text-anchor="start">通过 current_page_specific</text>
<text class="v56-node-sub" x="842" y="223" text-anchor="start">理解“就这个”“确认吧”</text>
<text class="v56-node-sub" x="842" y="244" text-anchor="start">输出 select_button = “确认”</text>
</g>
<g data-node="true" data-key="dispatch">
<rect class="v56-cloud" x="828" y="420" width="340" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="447" text-anchor="start">下发车机</text>
<text class="v56-node-sub" x="842" y="472" text-anchor="start">携带按钮选择 select_button</text>
<text class="v56-node-sub" x="842" y="493" text-anchor="start">把目标交给车机执行方</text>
</g>
<g data-node="true" data-key="execute">
<rect class="v56-local" x="430" y="420" width="340" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="447" text-anchor="start">车机执行</text>
<text class="v56-node-sub" x="444" y="472" text-anchor="start">按按钮选择调用执行方</text>
<text class="v56-node-sub" x="444" y="493" text-anchor="start">返回执行结果与实际状态变化</text>
</g>
<g data-node="true" data-key="receipt">
<rect class="v56-neutral" x="32" y="420" width="340" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="447" text-anchor="start">执行回执</text>
<text class="v56-node-sub" x="46" y="472" text-anchor="start">结果作为 tool_feedback</text>
<text class="v56-node-sub" x="46" y="493" text-anchor="start">交回 Planner 再决定</text>
</g>
<g data-node="true" data-key="isolation">
<rect class="v56-neutral v56-pending" x="32" y="625" width="1136" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="652" text-anchor="start">普通对话时，这个工具不在 Planner 的工具列表里</text>
<text class="v56-node-sub" x="46" y="677" text-anchor="start">服务端已经上线，各车型陆续接入；虚线表示普通对话的工具隔离边界。</text>
</g>
<rect data-legend="true" class="v56-local" x="32" y="755" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-decision" x="285" y="755" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-cloud" x="490" y="755" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-neutral" x="765" y="755" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-title" x="32" y="44" text-anchor="start">没对上按钮，云端怎样理解当前卡片</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">按场景临时加载动态工具，让 Planner 理解用户指的是哪个按钮，再交给车机执行。</text>
<text class="v56-label" x="1014" y="365" text-anchor="start">按钮选择下发</text>
<text class="v56-label" x="32" y="101" text-anchor="start">执行结果交回 Planner</text>
<text class="v56-subtitle" x="60" y="769" text-anchor="start">蓝：车机上报与执行</text>
<text class="v56-subtitle" x="313" y="769" text-anchor="start">黄：条件规则</text>
<text class="v56-subtitle" x="518" y="769" text-anchor="start">绿：云端理解与下发</text>
<text class="v56-subtitle" x="793" y="769" text-anchor="start">灰：回执与隔离说明</text>
</svg>
