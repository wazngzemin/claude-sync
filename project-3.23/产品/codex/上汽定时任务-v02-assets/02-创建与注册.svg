<text x="70" y="2455" font-size="23" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">登记顺序、局部失败回滚、任务关联字段为建议 / 待确认；未登记成功时不能反馈“已创建”。</tspan><tspan x="70" dy="33.35">日期窗口与“首次上车”的组合监听归属待确认；端云落点、重复任务判定和补登记策略待确认。</tspan></text>
