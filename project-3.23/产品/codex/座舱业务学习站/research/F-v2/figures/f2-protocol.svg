<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="f2-protocol" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="f2-protocol-title f2-protocol-desc">
<title id="f2-protocol-title">一次调用，怎样说清“这是谁的哪一次”</title><desc id="f2-protocol-desc">以美团订座为例：四组信息一起随请求发送；不同链路的编号要能对应。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="f2-protocol-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一次调用，怎样说清“这是谁的哪一次”</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">以美团订座为例：四组信息一起随请求发送；不同链路的编号要能对应。</text>
<text class="v56-label" x="32" y="118" text-anchor="start">座舱云 → 三方 Agent：接入协议 1.4 版</text>
<g data-node="true" id="f2-protocol-n1"><rect class="v56-cloud" x="32" y="144" width="732" height="152" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="172" text-anchor="start">01 · 归属信息</text>
<text class="v56-node-sub" x="46" y="199" text-anchor="start">话题编号：贯穿多轮的话题；单轮编号：这一问一答</text>
<text class="v56-node-sub" x="46" y="221" text-anchor="start">会话编号：会话列表中的一组对话；工具编号：调用谁</text>
<text class="v56-node-sub" x="46" y="243" text-anchor="start">追踪编号：请求和请求头都带；协议版本：必带</text>
</g>
<g data-node="true" id="f2-protocol-n2"><rect class="v56-neutral" x="32" y="336" width="732" height="218" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="364" text-anchor="start">02 · 本次输入</text>
<text class="v56-node-sub" x="46" y="391" text-anchor="start">必带：触发方式、请求类型、内容、轮次编号</text>
<text class="v56-node-sub" x="46" y="413" text-anchor="start">触发方式示例：用户说话</text>
<text class="v56-node-sub" x="46" y="435" text-anchor="start">请求类型：1 查询；2 预查询（默认关闭）；3 取消当前对话</text>
<text class="v56-node-sub" x="46" y="457" text-anchor="start">内容：帮我在附近那家本帮菜馆订今晚七点四个人的位子</text>
<text class="v56-node-sub" x="46" y="479" text-anchor="start">轮次编号 = 语音识别过程的轮次，不能当成 Planner 轮次</text>
</g>
<g data-node="true" id="f2-protocol-n3"><rect class="v56-decision" x="32" y="594" width="732" height="218" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="622" text-anchor="start">03 · 公共信息</text>
<text class="v56-node-sub" x="46" y="649" text-anchor="start">必带：渠道 + 渠道应用编号、车辆编号、车型、车辆名称</text>
<text class="v56-node-sub" x="46" y="671" text-anchor="start">上汽成对使用：saic-dna / 99220</text>
<text class="v56-node-sub" x="46" y="693" text-anchor="start">选填：经纬度、车企账号、豆包账号、城市、区县</text>
<text class="v56-node-sub" x="46" y="715" text-anchor="start">订座场景仍要用位置；需登录时仍要核对项目、车辆与账号</text>
<text class="v56-node-sub" x="46" y="737" text-anchor="start">通用协议选填，不代表业务可以省掉必要条件</text>
</g>
<g data-node="true" id="f2-protocol-n4"><rect class="v56-neutral" x="32" y="852" width="732" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="880" text-anchor="start">04 · 上下文</text>
<text class="v56-node-sub" x="46" y="907" text-anchor="start">上下文必带；其中的历史、记忆、车况、用户状态可选</text>
<text class="v56-node-sub" x="46" y="929" text-anchor="start">历史可含 Planner 回答与工具记录</text>
</g>
<path class="v56-arrow" d="M 398 296 L 398 336" marker-end="url(#f2-protocol-arr)"/>
<path class="v56-arrow" d="M 398 554 L 398 594" marker-end="url(#f2-protocol-arr)"/>
<path class="v56-arrow" d="M 398 812 L 398 852" marker-end="url(#f2-protocol-arr)"/>
<g data-node="true" id="f2-protocol-n5"><rect class="v56-local" x="900" y="144" width="268" height="218" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="914" y="172" text-anchor="start">车云之间的另一层编号</text>
<text class="v56-node-sub" x="914" y="199" text-anchor="start">请求编号</text>
<text class="v56-node-sub" x="914" y="221" text-anchor="start">轮次编号、音区</text>
<text class="v56-node-sub" x="914" y="243" text-anchor="start">各管各的链路</text>
<text class="v56-node-sub" x="914" y="265" text-anchor="start">不是左侧那一组编号</text>
</g>
<path class="v56-arrow" d="M 764 220 L 900 220" marker-end="url(#f2-protocol-arr)" marker-start="url(#f2-protocol-arr)"/>
<text class="v56-label" x="832" y="254" text-anchor="middle">要有对应关系</text>
<text class="v56-label" x="900" y="408" text-anchor="start">同一次订座请求</text>
<text class="v56-node-sub" x="900" y="436" text-anchor="start">沿记录对回同车、同问</text>
<path class="v56-rule" d="M 32 1024 L 1168 1024"/>
<text class="v56-risk" x="32" y="1060" text-anchor="start">少了位置，“附近那家”就算不出来。</text>
<rect data-decoration="true" class="v56-cloud" x="32" y="1110" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="1124" text-anchor="start">绿：调用归属</text>
<rect data-decoration="true" class="v56-neutral" x="302" y="1110" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="330" y="1124" text-anchor="start">灰：输入与上下文</text>
<rect data-decoration="true" class="v56-decision" x="592" y="1110" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="620" y="1124" text-anchor="start">黄：车辆与业务条件</text>
<rect data-decoration="true" class="v56-local" x="912" y="1110" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="940" y="1124" text-anchor="start">蓝：车云编号</text>
</svg>
