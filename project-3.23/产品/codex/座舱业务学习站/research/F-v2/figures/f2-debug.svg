<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="f2-debug" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="f2-debug-title f2-debug-desc">
<title id="f2-debug-title">订座没订上，从哪一层开始查</title><desc id="f2-debug-desc">先对齐同一次调用的记录，再逐层定位；每一层都要看实际输入和结果。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="f2-debug-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">订座没订上，从哪一层开始查</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先对齐同一次调用的记录，再逐层定位；每一层都要看实际输入和结果。</text>
<text class="v56-label" x="100" y="122" text-anchor="start">从登记一路查到真实结果</text>
<text class="v56-label" x="790" y="122" text-anchor="start">找谁：按职责协作</text>
<g data-node="true" id="f2-debug-n1"><rect class="v56-neutral" x="100" y="150" width="620" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="114" y="178" text-anchor="start">01 · 登记了吗</text>
<text class="v56-node-sub" x="114" y="205" text-anchor="start">本项目、本环境有已发布、启用、参与推理的实现</text>
</g>
<text class="v56-node-title" x="790" y="179" text-anchor="start">找谁：研发与平台</text>
<text class="v56-subtitle" x="790" y="208" text-anchor="start">核对定义、项目实现和生效状态</text>
<path class="v56-arrow" d="M 410 238 L 410 276" marker-end="url(#f2-debug-arr)"/>
<g data-node="true" id="f2-debug-n2"><rect class="v56-neutral" x="100" y="276" width="620" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="114" y="304" text-anchor="start">02 · 这一轮看得见吗</text>
<text class="v56-node-sub" x="114" y="331" text-anchor="start">本轮工具列表里有它吗；动态条件是否满足</text>
</g>
<text class="v56-node-title" x="790" y="305" text-anchor="start">找谁：平台与条件配置方</text>
<text class="v56-subtitle" x="790" y="334" text-anchor="start">核对本轮输入和实际加载的工具</text>
<path class="v56-arrow" d="M 410 364 L 410 402" marker-end="url(#f2-debug-arr)"/>
<g data-node="true" id="f2-debug-n3"><rect class="v56-decision" x="100" y="402" width="620" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="114" y="430" text-anchor="start">03 · Planner 选对、参数对吗</text>
<text class="v56-node-sub" x="114" y="457" text-anchor="start">选餐厅服务；店名、时间、人数保留用户要求</text>
</g>
<text class="v56-node-title" x="790" y="431" text-anchor="start">找谁：产品与 Planner 团队</text>
<text class="v56-subtitle" x="790" y="460" text-anchor="start">先补定义与参数示例，再判断模型问题</text>
<path class="v56-arrow" d="M 410 490 L 410 528" marker-end="url(#f2-debug-arr)"/>
<g data-node="true" id="f2-debug-n4"><rect class="v56-cloud" x="100" y="528" width="620" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="114" y="556" text-anchor="start">04 · 请求字段齐吗</text>
<text class="v56-node-sub" x="114" y="583" text-anchor="start">位置、车辆与项目归属、对话编号能否对应</text>
</g>
<text class="v56-node-title" x="790" y="557" text-anchor="start">找谁：研发与接入方</text>
<text class="v56-subtitle" x="790" y="586" text-anchor="start">对照本次输入，定位字段丢在哪一层</text>
<path class="v56-arrow" d="M 410 616 L 410 654" marker-end="url(#f2-debug-arr)"/>
<g data-node="true" id="f2-debug-n5"><rect class="v56-cloud" x="100" y="654" width="620" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="114" y="682" text-anchor="start">05 · 连得上吗</text>
<text class="v56-node-sub" x="114" y="709" text-anchor="start">网络、连接、鉴权有没有报错</text>
</g>
<text class="v56-node-title" x="790" y="683" text-anchor="start">找谁：接入方与链路研发</text>
<text class="v56-subtitle" x="790" y="712" text-anchor="start">美团连接报错，先定位连接层</text>
<path class="v56-arrow" d="M 410 742 L 410 780" marker-end="url(#f2-debug-arr)"/>
<g data-node="true" id="f2-debug-n6"><rect class="v56-cloud" x="100" y="780" width="620" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="114" y="808" text-anchor="start">06 · 业务办成了吗</text>
<text class="v56-node-sub" x="114" y="835" text-anchor="start">已提交、等商家确认、确认成功要分开看</text>
</g>
<text class="v56-node-title" x="790" y="809" text-anchor="start">找谁：服务商；项目协同</text>
<text class="v56-subtitle" x="790" y="838" text-anchor="start">核对订单状态与具体失败原因</text>
<path class="v56-arrow" d="M 410 868 L 410 906" marker-end="url(#f2-debug-arr)"/>
<g data-node="true" id="f2-debug-n7"><rect class="v56-local" x="100" y="906" width="620" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="114" y="934" text-anchor="start">07 · 回执写清了吗</text>
<text class="v56-node-sub" x="114" y="961" text-anchor="start">屏幕、语音、模型反馈是否如实表达订单状态</text>
</g>
<text class="v56-node-title" x="790" y="935" text-anchor="start">找谁：接入方与车端；产品核验</text>
<text class="v56-subtitle" x="790" y="964" text-anchor="start">对照车上显示和用户实际要的结果</text>
<path class="v56-rule" d="M 32 1036 L 1168 1036"/>
<text class="v56-node-title" x="100" y="1074" text-anchor="start">先查链路和配置，再怀疑模型。</text>
<rect data-decoration="true" class="v56-neutral" x="100" y="1122" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="128" y="1136" text-anchor="start">灰：登记与可见性</text>
<rect data-decoration="true" class="v56-decision" x="370" y="1122" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="398" y="1136" text-anchor="start">黄：选择与参数</text>
<rect data-decoration="true" class="v56-cloud" x="640" y="1122" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="668" y="1136" text-anchor="start">绿：下游调用与业务</text>
<rect data-decoration="true" class="v56-local" x="940" y="1122" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="968" y="1136" text-anchor="start">蓝：回执落地</text>
</svg>
