<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="g2-condition" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="g2-condition-title g2-condition-desc">
<title id="g2-condition-title">冷却只管间隔，一轮只提醒一次还要重新布防</title><desc id="g2-condition-desc">同一条电量曲线：① 当前值反复满足；② 只在跌破时提醒；③ 恢复到不满足以后才恢复提醒资格。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="g2-condition-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">冷却只管间隔，一轮只提醒一次还要重新布防</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">同一条电量曲线：① 当前值反复满足；② 只在跌破时提醒；③ 恢复到不满足以后才恢复提醒资格。</text>
<text class="v56-label" x="40" y="131" text-anchor="start">电量变化示意（纵轴不按比例）</text>
<text class="v56-label" x="320" y="131" text-anchor="start">同一次上报时刻，分别观察三种规则</text>
<path class="v56-rule" d="M 320 150 L 320 410 L 1140 410"/>
<path class="v56-arrow v56-pending" d="M 320 325 L 1140 325"/>
<text class="v56-label" x="196" y="330" text-anchor="start">阈值：30%</text>
<path class="v56-arrow" d="M 350 300 L 470 350 L 590 350 L 710 350 L 830 165 L 950 270 L 1070 350"/>
<circle class="v56-local" cx="350" cy="300" r="8" stroke-width="1.6"/>
<text class="v56-node-title" x="350" y="280" text-anchor="middle">31%</text>
<circle class="v56-local" cx="470" cy="350" r="8" stroke-width="1.6"/>
<text class="v56-node-title" x="470" y="330" text-anchor="middle">29%</text>
<circle class="v56-local" cx="590" cy="350" r="8" stroke-width="1.6"/>
<text class="v56-node-title" x="590" y="330" text-anchor="middle">29%</text>
<circle class="v56-local" cx="710" cy="350" r="8" stroke-width="1.6"/>
<text class="v56-node-title" x="710" y="330" text-anchor="middle">29%</text>
<circle class="v56-local" cx="830" cy="165" r="8" stroke-width="1.6"/>
<text class="v56-node-title" x="830" y="145" text-anchor="middle">55%</text>
<circle class="v56-local" cx="950" cy="270" r="8" stroke-width="1.6"/>
<text class="v56-node-title" x="950" y="250" text-anchor="middle">35%</text>
<circle class="v56-local" cx="1070" cy="350" r="8" stroke-width="1.6"/>
<text class="v56-node-title" x="1070" y="330" text-anchor="middle">29%</text>
<text class="v56-subtitle" x="350" y="441" text-anchor="middle">起点</text>
<text class="v56-subtitle" x="470" y="441" text-anchor="middle">30 秒</text>
<text class="v56-subtitle" x="590" y="441" text-anchor="middle">60 秒</text>
<text class="v56-subtitle" x="710" y="441" text-anchor="middle">90 秒</text>
<text class="v56-subtitle" x="830" y="441" text-anchor="middle">充电后</text>
<text class="v56-subtitle" x="950" y="441" text-anchor="middle">再次下降</text>
<text class="v56-subtitle" x="1070" y="441" text-anchor="middle">再次跌破</text>
<text class="v56-risk" x="350" y="478" text-anchor="start">低电量持续成立</text>
<text class="v56-label" x="830" y="478" text-anchor="middle">恢复到不满足</text>
<g data-node="true" id="g2-condition-current"><rect class="v56-reject" x="40" y="510" width="260" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="538" text-anchor="start">① 当前值 + 30 秒冷却</text>
<text class="v56-node-sub" x="54" y="566" text-anchor="start">每次上报仍低于 30%</text>
<text class="v56-node-sub" x="54" y="590" text-anchor="start">且间隔已过，就可能再发</text>
</g>
<g data-node="true" id="g2-condition-edge"><rect class="v56-cloud v56-pending" x="40" y="670" width="260" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="698" text-anchor="start">② 跌破阈值时只发一次</text>
<text class="v56-node-sub" x="54" y="726" text-anchor="start">从不满足变为满足</text>
<text class="v56-node-sub" x="54" y="750" text-anchor="start">已对齐方向，尚未验收</text>
</g>
<g data-node="true" id="g2-condition-rearm"><rect class="v56-decision v56-pending" x="40" y="830" width="260" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="858" text-anchor="start">③ 恢复后重新布防</text>
<text class="v56-node-sub" x="54" y="886" text-anchor="start">电量回到 ≥30% 后</text>
<text class="v56-node-sub" x="54" y="910" text-anchor="start">下一次跌破才可再提醒</text>
</g>
<path class="v56-rule" d="M 320 565 L 1140 565"/>
<path class="v56-rule" d="M 320 725 L 1140 725"/>
<path class="v56-rule" d="M 320 885 L 1140 885"/>
<circle class="v56-reject" cx="470" cy="565" r="8" stroke-width="1.6"/>
<circle class="v56-reject" cx="590" cy="565" r="8" stroke-width="1.6"/>
<circle class="v56-reject" cx="710" cy="565" r="8" stroke-width="1.6"/>
<circle class="v56-reject" cx="1070" cy="565" r="8" stroke-width="1.6"/>
<text class="v56-risk" x="470" y="605" text-anchor="start">一直低于 30% 时反复打扰</text>
<circle class="v56-cloud v56-pending" cx="470" cy="725" r="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="470" y="762" text-anchor="middle">提醒</text>
<circle class="v56-cloud v56-pending" cx="1070" cy="725" r="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="1070" y="762" text-anchor="middle">提醒</text>
<text class="v56-label" x="590" y="706" text-anchor="start">持续满足，不再发</text>
<circle class="v56-decision v56-pending" cx="830" cy="885" r="8" stroke-width="1.6"/>
<circle class="v56-cloud v56-pending" cx="1070" cy="885" r="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="830" y="922" text-anchor="middle">恢复资格</text>
<text class="v56-subtitle" x="1070" y="922" text-anchor="middle">再提醒</text>
<path class="v56-arrow v56-pending" d="M 846 885 L 1054 885" marker-end="url(#g2-condition-arr)"/>
<path class="v56-rule" d="M 32 958 L 1168 958"/>
<text class="v56-node-title" x="32" y="992" text-anchor="start">“变更为”比较新值与设定值；跌破阈值的一次提醒属于边沿触发方向。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="1018" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1032" text-anchor="start">蓝：实际电量</text>
<rect data-decoration="true" class="v56-reject" x="316.0" y="1018" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="1032" text-anchor="start">红：重复打扰</text>
<rect data-decoration="true" class="v56-cloud v56-pending" x="600.0" y="1018" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="1032" text-anchor="start">绿虚线：边沿方向，未验收</text>
<rect data-decoration="true" class="v56-decision v56-pending" x="884.0" y="1018" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="1032" text-anchor="start">黄虚线：重新布防</text>
</svg>
