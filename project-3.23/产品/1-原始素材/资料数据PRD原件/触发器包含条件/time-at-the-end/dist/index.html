<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0c">
<meta name="description" content="拨动宇宙的最后一秒。一件可探索的 Three.js 宇宙装置。">
<title>时间的尽头 · THE LAST SECOND</title>
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="sigil" viewBox="0 0 48 48"><circle cx="24" cy="24" r="14"/><ellipse cx="24" cy="24" rx="9" ry="21" transform="rotate(39 24 24)"/><path d="M24 1v9m0 28v9M1 24h9m28 0h9"/><circle cx="24" cy="24" r="2" fill="currentColor" stroke="none"/></symbol>
<symbol id="audio" viewBox="0 0 24 24"><path d="M3 9v6m4-9v12m5-15v18m5-15v12m4-9v6"/></symbol>
<symbol id="frame" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
<symbol id="reset" viewBox="0 0 24 24"><path d="M5 10a7 7 0 1 1 2 7M5 5v5h5"/></symbol>
<symbol id="mouse" viewBox="0 0 24 24"><rect x="6.5" y="3" width="11" height="18" rx="5.5"/><path d="M12 7v4"/></symbol>
<symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z" fill="currentColor" stroke="none"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M9 6v12m6-12v12" stroke-width="2"/></symbol>
</svg>

<main id="experience" aria-label="时间的尽头：交互装置">
  <canvas id="cosmos" tabindex="0" aria-label="宇宙装置。拖动旋转，滚轮缩放，轻点核心激发回声。键盘可用方向键旋转、加减键缩放、回车激发回声。"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="surface">
    <header class="mast">
      <div class="brand"><svg><use href="#sigil"/></svg><span>终末观测站<small>THE LAST OBSERVATORY</small></span></div>
      <div class="live" id="live"><i></i><span>正在接收信号</span></div>
      <div class="tools">
        <button id="sound" class="tool" aria-pressed="false" aria-label="开启声音" title="开启声音 (M)"><svg><use href="#audio"/></svg><span>声音</span></button>
        <button id="focus" class="tool" aria-pressed="false" aria-label="进入沉浸模式" title="沉浸模式 (F)"><svg><use href="#frame"/></svg><span>沉浸</span></button>
      </div>
    </header>

    <section class="intro" aria-labelledby="title">
      <p class="kicker"><b></b> 一个关于终末的交互实验</p>
      <h1 id="title">时间的<br>尽头<span>。</span></h1>
      <p class="subtitle" lang="en">THE LAST SECOND</p>
      <div class="hairline"></div>
      <p class="prose">当宇宙只剩最后一秒，<br>你会如何度过它？</p>
    </section>

    <aside class="index" aria-hidden="true"><span>天体编号</span><b>Ω–001</b><i></i></aside>
    <div class="core-mark" id="core-mark" aria-hidden="true"></div>
    <div class="annotation" id="annotation" aria-hidden="true">
      <div class="pointer-line"></div>
      <div class="annotation-text"><span>观测对象 / 01</span><b>引力遗骸</b><small>GRAVITATIONAL RELIC</small></div>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <div id="fallback" class="fallback" hidden><strong>无法连接观测装置</strong><p>此设备未能启动 3D 图形。请启用浏览器的图形加速后重试。</p><button id="retry">重新连接</button></div>

    <footer class="console">
      <div class="console-head">
        <div class="chapter" aria-live="polite"><span id="chapter-no">I / IV</span><strong id="chapter-name">余烬</strong><span class="chapter-caption" id="chapter-caption">最后一颗恒星正在熄灭。</span></div>
        <div class="readout"><span class="tminus">T−</span><output id="time" for="timeline">00.760<span>s</span></output></div>
      </div>
      <div class="rail">
        <button id="playback" class="play" aria-label="播放最后一秒" title="播放 / 暂停 (空格)" aria-pressed="false"><svg><use href="#play"/></svg></button>
        <div class="ruler">
          <div class="track" aria-hidden="true"><div id="fill"></div></div>
          <input id="timeline" type="range" min="0" max="1000" value="240" aria-label="最后一秒的时间轴">
          <div class="epochs" aria-label="时间章节">
            <button data-time="100" aria-current="step"><b>01</b> 余烬</button>
            <button data-time="420"><b>02</b> 潮汐</button>
            <button data-time="720"><b>03</b> 崩解</button>
            <button data-time="1000"><b>04</b> 静默</button>
          </div>
        </div>
        <button id="reset-view" class="play" aria-label="复位视角" title="复位视角 (R)"><svg><use href="#reset"/></svg></button>
      </div>
      <div class="bottom"><div class="inputs"><span><svg><use href="#mouse"/></svg><span class="mouse-help">拖动环绕 · 滚轮缩放</span></span><span><svg><use href="#target"/></svg>轻点核心，留下回声</span></div><span class="edition">Ω &nbsp;/&nbsp; THE END OF TIME</span></div>
    </footer>
  </div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
