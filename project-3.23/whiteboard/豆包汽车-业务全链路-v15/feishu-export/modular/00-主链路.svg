<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1880" viewBox="0 0 1600 1880"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4673AA"/></marker></defs><rect width="1600" height="1880" fill="#F8FAFD"/><text x="90" y="80" font-size="44" font-weight="700" fill="#203A57">一条语音请求，怎样走到真实结果</text><rect x="100" y="150" width="980" height="175" rx="16" fill="#F0F5FC" stroke="#BDD0E6" stroke-width="2"/><text x="128" y="198" font-size="34" font-weight="700" fill="#203A57">01 · V 声音成为正式请求</text><text x="128" y="246" font-size="27" font-weight="400" fill="#203A57">先有权限、音区与干净音频；识别和判停并行。</text><text x="128" y="289" font-size="27" font-weight="400" fill="#203A57">过程文字只做准备；最终文字进入后续入口判断。</text><polyline points="590,325 590,380" fill="none" stroke="#4673AA" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="380" width="980" height="175" rx="16" fill="#F0F5FC" stroke="#BDD0E6" stroke-width="2"/><text x="128" y="428" font-size="34" font-weight="700" fill="#203A57">02 · R 有效性与端云采信</text><text x="128" y="476" font-size="27" font-weight="400" fill="#203A57">判断是否对助手说话，以及采用本地还是云端结果。</text><text x="128" y="519" font-size="27" font-weight="400" fill="#203A57">同一输入只允许一次真实执行；本地结果也要同步。</text><polyline points="590,555 590,610" fill="none" stroke="#4673AA" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="610" width="980" height="175" rx="16" fill="#F0F5FC" stroke="#BDD0E6" stroke-width="2"/><text x="128" y="658" font-size="34" font-weight="700" fill="#203A57">03 · M 输入管理</text><text x="128" y="706" font-size="27" font-weight="400" fill="#203A57">接收用户请求、建议与工具反馈，管理排队和打断。</text><text x="128" y="749" font-size="27" font-weight="400" fill="#203A57">决定本轮处理哪些输入，不代替模型理解用户目标。</text><polyline points="590,785 590,840" fill="none" stroke="#4673AA" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="840" width="980" height="175" rx="16" fill="#F0F5FC" stroke="#BDD0E6" stroke-width="2"/><text x="128" y="888" font-size="34" font-weight="700" fill="#203A57">04 · C 上下文准备</text><text x="128" y="936" font-size="27" font-weight="400" fill="#203A57">并行准备车况、身份记忆、视觉和目标等背景。</text><text x="128" y="979" font-size="27" font-weight="400" fill="#203A57">背景缺失时，Director 仍可显式调用工具查证。</text><polyline points="590,1015 590,1070" fill="none" stroke="#4673AA" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1070" width="980" height="175" rx="16" fill="#F0F5FC" stroke="#BDD0E6" stroke-width="2"/><text x="128" y="1118" font-size="34" font-weight="700" fill="#203A57">05 · D Director 理解与规划</text><text x="128" y="1166" font-size="27" font-weight="400" fill="#203A57">Planner 与 Director 是同一职能。结合事实判断。</text><text x="128" y="1209" font-size="27" font-weight="400" fill="#203A57">输出是否说话、说什么、调哪些动作或先澄清。</text><polyline points="590,1245 590,1300" fill="none" stroke="#4673AA" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1300" width="980" height="175" rx="16" fill="#EEF8F4" stroke="#BDD0E6" stroke-width="2"/><text x="128" y="1348" font-size="34" font-weight="700" fill="#203A57">06 · E 工具执行与反馈</text><text x="128" y="1396" font-size="27" font-weight="400" fill="#203A57">先验能力、参数与权限，再由下游落实具体动作。</text><text x="128" y="1439" font-size="27" font-weight="400" fill="#203A57">逐项返回真实结果，受理成功不等于业务完成。</text><polyline points="590,1475 590,1530" fill="none" stroke="#4673AA" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1530" width="980" height="175" rx="16" fill="#F0F5FC" stroke="#BDD0E6" stroke-width="2"/><text x="128" y="1578" font-size="34" font-weight="700" fill="#203A57">07 · O 用户输出与真实结果</text><text x="128" y="1626" font-size="27" font-weight="400" fill="#203A57">分别核验卡片、语音实际播放与车辆/服务结果。</text><text x="128" y="1669" font-size="27" font-weight="400" fill="#203A57">部分成功要如实说明，不能只凭模型话术报成功。</text><text x="620" y="1280" font-size="22" font-weight="400" fill="#203A57">有动作需要执行，才调用工具</text><text x="620" y="1510" font-size="22" font-weight="400" fill="#203A57">真实结果；直返按工具合同</text><polyline points="1080,1157 1110,1157 1110,1675 1080,1675" fill="none" stroke="#8265A8" stroke-width="3" marker-end="url(#arrow)"/><text x="1135" y="1745" font-size="24" font-weight="700" fill="#705191">D 也可直接回答或先澄清</text><polyline points="1080,1387 1145,1387 1145,697 1080,697" fill="none" stroke="#B17826" stroke-width="3" marker-end="url(#arrow)"/><text x="1170" y="495" font-size="27" font-weight="700" fill="#8F611D">普通工具反馈</text><text x="1170" y="537" font-size="28" font-weight="700" fill="#8F611D">E → M → D</text><text x="1170" y="578" font-size="25" font-weight="400" fill="#8F611D">读结果后再决定</text><polyline points="100,467 45,467 45,1640 100,1640" fill="none" stroke="#2C8B78" stroke-width="3" marker-end="url(#arrow)"/><rect x="1190" y="160" width="360" height="265" rx="16" fill="#EFF8F4" stroke="#B7DCCE" stroke-width="2"/><text x="1214" y="205" font-size="27" font-weight="700" fill="#203A57">本地直接完成支路</text><text x="1214" y="252" font-size="24" font-weight="400" fill="#203A57">按当前车型与版本采信</text><text x="1214" y="294" font-size="24" font-weight="400" fill="#203A57">完成后仍需回填历史</text><text x="1214" y="336" font-size="24" font-weight="400" fill="#203A57">不让端云各执行一次</text><text x="1214" y="378" font-size="24" font-weight="400" fill="#203A57">对应模块：R、L、O</text><rect x="1190" y="740" width="360" height="265" rx="16" fill="#F4F0FA" stroke="#D5C7E8" stroke-width="2"/><text x="1214" y="786" font-size="27" font-weight="700" fill="#203A57">任务与主动服务支路</text><text x="1214" y="834" font-size="24" font-weight="400" fill="#203A57">安排任务或先注册条件</text><text x="1214" y="876" font-size="24" font-weight="400" fill="#203A57">命中后再进入规划执行</text><text x="1214" y="918" font-size="24" font-weight="400" fill="#203A57">创建、触发、完成分开</text><text x="1214" y="960" font-size="24" font-weight="400" fill="#203A57">对应：T、G、S、U</text><rect x="1190" y="1080" width="360" height="245" rx="16" fill="#FFF7E9" stroke="#E6D2A5" stroke-width="2"/><text x="1214" y="1127" font-size="27" font-weight="700" fill="#203A57">背景持续供给</text><text x="1214" y="1173" font-size="24" font-weight="400" fill="#203A57">身份记忆、信号和视觉</text><text x="1214" y="1215" font-size="24" font-weight="400" fill="#203A57">不是每轮全部重跑一遍</text><text x="1214" y="1257" font-size="24" font-weight="400" fill="#203A57">对应：K、B、A、C</text><rect x="1190" y="1410" width="360" height="255" rx="16" fill="#FCEFF0" stroke="#E7BDC5" stroke-width="2"/><text x="1214" y="1456" font-size="26" font-weight="700" fill="#203A57">插话与恢复贯穿全程</text><text x="1214" y="1504" font-size="23" font-weight="400" fill="#203A57">分清停声、停推理和取消</text><text x="1214" y="1546" font-size="23" font-weight="400" fill="#203A57">已下发的动作仍要接回执</text><text x="1214" y="1588" font-size="24" font-weight="400" fill="#203A57">对应：I、M、E、O</text></svg>