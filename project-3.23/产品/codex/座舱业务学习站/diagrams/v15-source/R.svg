<svg xmlns="http://www.w3.org/2000/svg" width="930" height="2088" viewBox="0 0 930 2088" role="img" aria-label="入口与端云采信"><title>入口与端云采信</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M533,226 L533,264 L661,264 L661,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="549" y="322" width="115" height="44" rx="3" fill="#fff"/><text x="554" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="554" dy="0">有网：端侧处理</tspan></text><path d="M435,226 L435,682 L396,682 L396,744" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="293" y="322" width="145" height="44" rx="3" fill="#fff"/><text x="298" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="298" dy="0">有网：云端并行处理</tspan></text><path d="M338,226 L338,264 L170,264 L170,1862" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="73" y="1095" width="100" height="44" rx="3" fill="#fff"/><text x="78" y="1119" font-size="15" fill="#435c70" font-weight="400"><tspan x="78" dy="0">无网</tspan></text><path d="M661,644 L661,1026" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="659" y="813" width="100" height="44" rx="3" fill="#fff"/><text x="664" y="837" font-size="15" fill="#435c70" font-weight="400"><tspan x="664" dy="0">端侧候选结果</tspan></text><path d="M661,1208 L661,1444" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="659" y="1304" width="205" height="44" rx="3" fill="#fff"/><text x="664" y="1328" font-size="15" fill="#435c70" font-weight="400"><tspan x="664" dy="0">未命中白名单 / feel</tspan></text><path d="M396,926 L396,964 L303,964 L303,1382 L531,1382 L531,1444" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="301" y="1095" width="100" height="44" rx="3" fill="#fff"/><text x="306" y="1119" font-size="15" fill="#435c70" font-weight="400"><tspan x="306" dy="0">云端可用结果</tspan></text><path d="M531,1626 L531,1664 L424,1664 L424,1800 L300,1800 L300,1862" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="312" y="1722" width="115" height="44" rx="3" fill="#fff"/><text x="317" y="1746" font-size="15" fill="#435c70" font-weight="400"><tspan x="317" dy="0">云端异常或超时</tspan></text><path d="M661,1626 L661,1664 L695,1664 L695,1862" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="478" y="1722" width="220" height="44" rx="3" fill="#fff"/><text x="483" y="1746" font-size="15" fill="#435c70" font-weight="400"><tspan x="483" dy="0">云端判定需要 Planner</tspan></text><a href="#module/R/step/R01"><g data-step="R01"><rect x="240" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="240" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="260" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="260" dy="0">R01</tspan></text><text x="260" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="260" dy="0">读取正式文字与网络状态</tspan></text><text x="260" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="260" dy="0">请求入口</tspan></text><text x="260" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="260" dy="0">正式文字及可用通道</tspan></text></g></a><a href="#module/R/step/R02"><g data-step="R02"><rect x="466" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="466" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="486" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="486" dy="0">R02</tspan></text><text x="486" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="486" dy="0">解析本地可处理的指令</tspan></text><text x="486" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="486" dy="0">端侧 FC 模型</tspan></text><text x="486" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="486" dy="0">端侧候选意图与参数</tspan></text></g></a><a href="#module/R/step/R03"><g data-step="R03"><rect x="201" y="744" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="201" y="744" width="5" height="182" rx="2" fill="#326785"/><text x="221" y="773" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="221" dy="0">R03</tspan></text><text x="221" y="805" font-size="20" fill="#203b50" font-weight="600"><tspan x="221" dy="0">判断是否应响应及是否走快路径</tspan></text><text x="221" y="847" font-size="16" fill="#375b71" font-weight="400"><tspan x="221" dy="0">云端前置链路</tspan></text><text x="221" y="886" font-size="16" fill="#566975" font-weight="400"><tspan x="221" dy="0">云端拒识/快路径/Planner 路由结果</tspan></text></g></a><a href="#module/R/step/R04"><g data-step="R04"><rect x="466" y="1026" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="466" y="1026" width="5" height="182" rx="2" fill="#326785"/><text x="486" y="1055" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="486" dy="0">R04</tspan></text><text x="486" y="1087" font-size="20" fill="#203b50" font-weight="600"><tspan x="486" dy="0">白名单命中时优先采用本地结果</tspan></text><text x="486" y="1129" font-size="16" fill="#375b71" font-weight="400"><tspan x="486" dy="0">端侧仲裁</tspan></text><text x="486" y="1168" font-size="16" fill="#566975" font-weight="400"><tspan x="486" dy="0">本地执行权，或继续等待云端</tspan></text></g></a><a href="#module/R/step/R05"><g data-step="R05"><rect x="401" y="1444" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="401" y="1444" width="5" height="182" rx="2" fill="#326785"/><text x="421" y="1473" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="421" dy="0">R05</tspan></text><text x="421" y="1505" font-size="20" fill="#203b50" font-weight="600"><tspan x="421" dy="0">非白名单优先等待云端</tspan></text><text x="421" y="1547" font-size="16" fill="#375b71" font-weight="400"><tspan x="421" dy="0">端云协调</tspan></text><text x="421" y="1586" font-size="16" fill="#566975" font-weight="400"><tspan x="421" dy="0">采纳云端，或触发本地兜底</tspan></text></g></a><a href="#module/R/step/R06"><g data-step="R06"><rect x="40" y="1862" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="1862" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="1891" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">R06</tspan></text><text x="60" y="1923" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">采用可用离线结果或说明能力限制</tspan></text><text x="60" y="1965" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">端侧兜底</tspan></text><text x="60" y="2004" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">离线执行结果或无法完成说明</tspan></text></g></a><a href="#module/R/step/R07"><g data-step="R07"><rect x="500" y="1862" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="1862" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="1891" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">R07</tspan></text><text x="520" y="1923" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">只放行本轮需要的推理</tspan></text><text x="520" y="1965" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">Flow 与 Planner</tspan></text><text x="520" y="2004" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">本轮有效输入进入 Planner 管道</tspan></text></g></a></g></svg>