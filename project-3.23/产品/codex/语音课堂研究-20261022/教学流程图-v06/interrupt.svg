<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="用户插话后，先决定停，再决定旧话如何收尾" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-interrupt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">用户插话后，先决定停，再决定旧话如何收尾</text><text x="30" y="58" font-size="13" fill="#5f7169">主 OnePager恢复分支 · AIVA车型差异见讲稿</text><g transform="translate(0,78)"><path class="flow-edge" data-from="playing" data-to="stop" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-interrupt)"/><path class="flow-edge" data-from="stop" data-to="progress" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-interrupt)"/><path class="flow-edge" data-from="progress" data-to="allowed" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-interrupt)"/><path class="flow-edge" data-from="allowed" data-to="no" d="M700,260.0 L280,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-interrupt)"/><path class="flow-edge" data-from="allowed" data-to="valid" d="M820.0,306 L820.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-interrupt)"/><path class="flow-edge" data-from="valid" data-to="event" d="M700,436.0 L610,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-interrupt)"/><path class="flow-edge" data-from="valid" data-to="new" d="M820,482 L820,504 L160,504 L160,482" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-interrupt)"/><path class="flow-edge" data-from="no" data-to="new" d="M160.0,306 L160.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-interrupt)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">符合停播条件</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">保存现场</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">先查原因表</text><text x="490.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">已播完或不允许恢复</text><text x="829.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">允许且有未播</text><text x="655.0" y="427.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">最终拒识</text><text x="490.0" y="495.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">有效请求</text><text x="169.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">新话有效仍办理</text><g class="flow-point" data-point="playing" role="button" tabindex="0" aria-label="豆包正在播放回复"><rect x="40" y="38" width="240" height="92" rx="13" fill="#eaf1ff" stroke="#627fae" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#627fae">用户</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">豆包正在播放回复</text><text x="54" y="110" font-size="12" fill="#587266">用户开始插话</text></g><g class="flow-point" data-point="stop" role="button" tabindex="0" aria-label="满足对应条件先停播"><rect x="370" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#86ada7">处理</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">满足对应条件先停播</text><text x="384" y="110" font-size="12" fill="#587266">流式判断；记录打断原因</text></g><g class="flow-point" data-point="progress" role="button" tabindex="0" aria-label="保留已播和未播信息"><rect x="700" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#86ada7">处理</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">保留已播和未播信息</text><text x="714" y="110" font-size="12" fill="#587266">打轴提供进度依据</text></g><g class="flow-point" data-point="allowed" role="button" tabindex="0" aria-label="还有未播且允许恢复吗"><rect x="700" y="214" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#bb8932">判断</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">还有未播且允许恢复吗</text><text x="714" y="286" font-size="12" fill="#587266">先看实际进度与停止原因</text></g><g class="flow-point" data-point="no" role="button" tabindex="0" aria-label="不恢复旧播报"><rect x="40" y="214" width="240" height="92" rx="13" fill="#fcece6" stroke="#bb7560" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#bb7560">分支</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">不恢复旧播报</text><text x="54" y="286" font-size="12" fill="#587266">有效新请求仍然正常处理</text></g><g class="flow-point" data-point="valid" role="button" tabindex="0" aria-label="再看新话最终判断"><rect x="700" y="390" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="411" font-size="11" fill="#bb8932">判断</text><text x="714" y="437" font-weight="700" font-size="16" fill="#203f35">再看新话最终判断</text><text x="714" y="462" font-size="12" fill="#587266">前提是该原因允许恢复</text></g><g class="flow-point" data-point="event" role="button" tabindex="0" aria-label="最终拒识：事件衔接"><rect x="370" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="411" font-size="11" fill="#86ada7">处理</text><text x="384" y="437" font-weight="700" font-size="16" fill="#203f35">最终拒识：事件衔接</text><text x="384" y="462" font-size="12" fill="#587266">带着未播信息接回旧内容</text></g><g class="flow-point" data-point="new" role="button" tabindex="0" aria-label="有效新需求：重新组织"><rect x="40" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="411" font-size="11" fill="#86ada7">处理</text><text x="54" y="437" font-weight="700" font-size="16" fill="#203f35">有效新需求：重新组织</text><text x="54" y="462" font-size="12" fill="#587266">按有效新诉求继续判断</text></g></g></svg>