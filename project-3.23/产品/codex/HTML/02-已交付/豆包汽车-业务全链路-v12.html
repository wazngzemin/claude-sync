waysOn 开了”代替具体能力覆盖表。","产品要问清：这是能力未覆盖，还是覆盖但当前未达成？证据来自哪份能力表和哪次观察？"],"textBottom":7612},{"id":"VL3","title":"3. 动态 watch：按 task_id 单独观察","paras":[["这一步怎么做","动态感知协议由 Task Service 下发 task_id 与纯观察问题，采用全量列表替换，最多 3 项同时观察。动态结果走独立任务通道，不进入通用 Context；AlwaysOn 关闭时拒收新项并清空旧项。"],["放进同一个例子","“帮我盯着某个对象”是观察任务，不应把“看到后给我打电话”整段执行指令塞给视觉模型。动作由任务/业务层负责。"],["异常与交接","全量替换漏带旧项会使旧观察被移除；取消后结果迟到必须按 task_id 处理。3 项是并发观察限制，不是全部业务规则上限。"],["产品要问清","列表是谁维护的？关闭、取消、替换、超容量分别返回什么状态？"]],"group":"vision-trigger","x":8964,"y":7890,"w":1092,"h":660,"learn":["signals","cloud-trigger"],"future":false,"kind":"step","body":["这一步怎么做：动态感知协议由 Task Service 下发 task_id 与纯观察问题，采用全量列表替换，最多 3 项同时观察。动态结果走独立任务通道，不进入通用 Context；AlwaysOn 关闭时拒收新项并清空旧项。","放进同一个例子：“帮我盯着某个对象”是观察任务，不应把“看到后给我打电话”整段执行指令塞给视觉模型。动作由任务/业务层负责。","异常与交接：全量替换漏带旧项会使旧观察被移除；取消后结果迟到必须按 task_id 处理。3 项是并发观察限制，不是全部业务规则上限。","产品要问清：列表是谁维护的？关闭、取消、替换、超容量分别返回什么状态？"],"textBottom":8400},{"id":"VL4","title":"4. 云端求值、抑制、回调原任务","paras":[["这一步怎么做","结构条件读相应事实求值；动态视觉结果还需要按协议进行云端语义 Y/N 判断，再形成条件事件。命中后要处理冷却、去重、范围和有效期，最后回调任务或 Advisor，不能直接宣称动作成功。"],["放进同一个例子","看到目标对象只是观察结果；业务认定条件满足后，才能唤醒未取消的任务，再进入实际执行。"],["异常与交接","规则误判、视觉误判、端侧资源不足和时序问题必须分开。6–7 秒等文档时延目标不是已经达成的实测，更不能统一写成固定 3/5 秒。"],["产品要问清","误触发、漏触发、重复触发和命中到动作时延，各自的真值与测量点在哪里？"]],"group":"vision-trigger","x":8964,"y":8720,"w":1092,"h":660,"learn":["signals","cloud-trigger"],"future":false,"kind":"step","body":["这一步怎么做：结构条件读相应事实求值；动态视觉结果还需要按协议进行云端语义 Y/N 判断，再形成条件事件。命中后要处理冷却、去重、范围和有效期，最后回调任务或 Advisor，不能直接宣称动作成功。","放进同一个例子：看到目标对象只是观察结果；业务认定条件满足后，才能唤醒未取消的任务，再进入实际执行。","异常与交接：规则误判、视觉误判、端侧资源不足和时序问题必须分开。6–7 秒等文档时延目标不是已经达成的实测，更不能统一写成固定 3/5 秒。","产品要问清：误触发、漏触发、重复触发和命中到动作时延，各自的真值与测量点在哪里？"],"textBottom":9272},{"id":"H-advisor","title":"主动服务：没有 Query 也能进入","group":"advisor","x":10600,"y":5770,"w":1220,"h":270,"kind":"module","body":["Advisor 提建议，Planner 判断；不是模型自行获得执行授权"],"paras":[["模块职责","Advisor 提建议，Planner 判断；不是模型自行获得执行授权"]],"learn":["advisor","task"],"future":false},{"id":"AD1","title":"1. 由新场景事实产生候选建议","paras":[["这一步怎么做","静态 Advisor 围绕舒适、出行、情感、内容等方向，读取人、车、环境和记忆等信息形成建议。它与监控未来目标的旧动态 Advisor 不是同一职责。"],["放进同一个例子","检测到上车后车内较热，可以产生降温建议；这与用户主动说“我热”是两种入口，但都需要可靠事实和后续执行。"],["异常与交接","感知错、事实旧、没有适用车型能力时，建议可能不成立。建议质量不能只看话术是否自然。"],["产品要问清","是哪条新事实触发本次建议？为什么现在提出，而不是十分钟前或下车后？"]],"group":"advisor","x":10664,"y":6230,"w":1092,"h":660,"learn":["advisor","task"],"future":false,"kind":"step","body":["这一步怎么做：静态 Advisor 围绕舒适、出行、情感、内容等方向，读取人、车、环境和记忆等信息形成建议。它与监控未来目标的旧动态 Advisor 不是同一职责。","放进同一个例子：检测到上车后车内较热，可以产生降温建议；这与用户主动说“我热”是两种入口，但都需要可靠事实和后续执行。","异常与交接：感知错、事实旧、没有适用车型能力时，建议可能不成立。建议质量不能只看话术是否自然。","产品要问清：是哪条新事实触发本次建议？为什么现在提出，而不是十分钟前或下车后？"],"textBottom":6740},{"id":"AD2","title":"2. 先判断是否值得打扰","paras":[["这一步怎么做","主动服务需要考虑总开关、场景时机、频率、重复、驾驶任务和用户当前对话；展示、播报和自动执行的边界不同，不能一次建议默认获得三种行为权限。"],["放进同一个例子","用户正在选路线时，降温建议是否延后、静默或不展示，要按交互策略处理；不能两个模块同时抢话。"],["异常与交接","框架要保留被抑制的原因，才能区分建议不准与没送达。用户拒绝后的降频也应明确。"],["产品要问清","可见建议的分母是生成数还是实际送达数？负向打扰如何标注与回归？"]],"group":"advisor","x":10664,"y":7060,"w":1092,"h":660,"learn":["advisor","task"],"future":false,"kind":"step","body":["这一步怎么做：主动服务需要考虑总开关、场景时机、频率、重复、驾驶任务和用户当前对话；展示、播报和自动执行的边界不同，不能一次建议默认获得三种行为权限。","放进同一个例子：用户正在选路线时，降温建议是否延后、静默或不展示，要按交互策略处理；不能两个模块同时抢话。","异常与交接：框架要保留被抑制的原因，才能区分建议不准与没送达。用户拒绝后的降频也应明确。","产品要问清：可见建议的分母是生成数还是实际送达数？负向打扰如何标注与回归？"],"textBottom":7528},{"id":"AD3","title":"3. 进入同一决策链，再记录真实结果","paras":[["这一步怎么做","有效 Advisor input 进入 03，与 Context 一起交 04 判断。用户采纳后通过相应工具执行，结果仍回 07；旧 Goal 监控建议也不能绕过真实执行与结果闭环。"],["放进同一个例子","用户接受降温建议后，要能确认实际控制成功；只点了“接受”但空调没变，不能计为完整行为成功。"],["异常与交接","建议生成、送达、点击、执行开始、最终完成是不同漏斗。拒绝与关闭也要反馈，避免重复打扰。"],["产品要问清","是否能从一条建议追到对应工具调用与真实结果？不能只有点击率而无兑现率。"]],"group":"advisor","x":10664,"y":7890,"w":1092,"h":660,"learn":["advisor","task"],"future":false,"kind":"step","body":["这一步怎么做：有效 Advisor input 进入 03，与 Context 一起交 04 判断。用户采纳后通过相应工具执行，结果仍回 07；旧 Goal 监控建议也不能绕过真实执行与结果闭环。","放进同一个例子：用户接受降温建议后，要能确认实际控制成功；只点了“接受”但空调没变，不能计为完整行为成功。","异常与交接：建议生成、送达、点击、执行开始、最终完成是不同漏斗。拒绝与关闭也要反馈，避免重复打扰。","产品要问清：是否能从一条建议追到对应工具调用与真实结果？不能只有点击率而无兑现率。"],"textBottom":8442},{"id":"H-visible-ui","title":"可见即可说与任务中心回流","group":"visible-ui","x":12300,"y":5770,"w":1220,"h":270,"kind":"module","body":["页面可见 → 词表匹配 → 原按钮回调 → 业务确认"],"paras":[["模块职责","页面可见 → 词表匹配 → 原按钮回调 → 业务确认"]],"learn":["visible-ui","task","output"],"future":false},{"id":"UI1","title":"1. 只注册最顶层可操作页面","paras":[["这一步怎么做","OEM 或业务方解析当前最顶层页面的可交互元素，建立文字指令与元素 ID 映射，页面变化时更新。隐藏页面、已过期卡片不能继续作为可点击对象。"],["放进同一个例子","路线卡片展示三条路线时，“第三条”必须关联当前卡片的第三项，而不是旧卡片里同位置的元素。"],["异常与交接","框架有单页词表容量与动态更新约定，具体版本需核对；它不直接证明所有业务页面均已接入。"],["产品要问清","谁注册、谁更新、谁清理旧词表？页面切换后多久旧 ID 失效？"]],"group":"visible-ui","x":12364,"y":6230,"w":1092,"h":660,"learn":["visible-ui","task","output"],"future":false,"kind":"step","body":["这一步怎么做：OEM 或业务方解析当前最顶层页面的可交互元素，建立文字指令与元素 ID 映射，页面变化时更新。隐藏页面、已过期卡片不能继续作为可点击对象。","放进同一个例子：路线卡片展示三条路线时，“第三条”必须关联当前卡片的第三项，而不是旧卡片里同位置的元素。","异常与交接：框架有单页词表容量与动态更新约定，具体版本需核对；它不直接证明所有业务页面均已接入。","产品要问清：谁注册、谁更新、谁清理旧词表？页面切换后多久旧 ID 失效？"],"textBottom":6698},{"id":"UI2","title":"2. ASR 与匹配决定候选，不替业务决定","paras":[["这一步怎么做","框架区分免唤醒离线识别与唤醒后的在线/离线策略，并有精确、模糊和局部匹配。识别到多个候选元素时，由注册方消歧；不能让 ASR 擅自选择业务目标。"],["放进同一个例子","同页多个“确认”按钮，需要位置或业务上下文消歧；只识别出“确认”这两个字，不能证明已经选对了路线确认。"],["异常与交接","词表、匹配规则与优先级按真实版本检查。框架文档里的能力阈值不是每种车型都已实测达标。"],["产品要问清","误识别、匹配错、元素过期、消歧错，能否分别找到日志与责任边界？"]],"group":"visible-ui","x":12364,"y":7060,"w":1092,"h":660,"learn":["visible-ui","task","output"],"future":false,"kind":"step","body":["这一步怎么做：框架区分免唤醒离线识别与唤醒后的在线/离线策略，并有精确、模糊和局部匹配。识别到多个候选元素时，由注册方消歧；不能让 ASR 擅自选择业务目标。","放进同一个例子：同页多个“确认”按钮，需要位置或业务上下文消歧；只识别出“确认”这两个字，不能证明已经选对了路线确认。","异常与交接：词表、匹配规则与优先级按真实版本检查。框架文档里的能力阈值不是每种车型都已实测达标。","产品要问清：误识别、匹配错、元素过期、消歧错，能否分别找到日志与责任边界？"],"textBottom":7570},{"id":"UI3","title":"3. 模拟点击回到原业务，不直接控车","paras":[["这一步怎么做","匹配到元素后，OEM 或业务方触发模拟 UI 点击，走原按钮回调。手点与语音点击应能回到同一业务处理；历史需要标为模拟点击事件，避免又作为普通 Query 重做一次。"],["放进同一个例子","选中第三条路线，先回路线业务；若业务据此自动导航，再记录真实导航状态。不能画成“说第三条→直接调用车控”。"],["异常与交接","UI 点击成功不等于原业务收到，更不等于车辆生效。执行前条件改变时是否复核，是业务契约必须确认的边界。"],["产品要问清","能否证明元素命中、回调收到、选择生效、业务执行四步都完成？"]],"group":"visible-ui","x":12364,"y":7890,"w":1092,"h":660,"learn":["visible-ui","task","output"],"future":false,"kind":"step","body":["这一步怎么做：匹配到元素后，OEM 或业务方触发模拟 UI 点击，走原按钮回调。手点与语音点击应能回到同一业务处理；历史需要标为模拟点击事件，避免又作为普通 Query 重做一次。","放进同一个例子：选中第三条路线，先回路线业务；若业务据此自动导航，再记录真实导航状态。不能画成“说第三条→直接调用车控”。","异常与交接：UI 点击成功不等于原业务收到，更不等于车辆生效。执行前条件改变时是否复核，是业务契约必须确认的边界。","产品要问清：能否证明元素命中、回调收到、选择生效、业务执行四步都完成？"],"textBottom":8400},{"id":"UI4","title":"4. 任务中心展示状态，不创造状态","paras":[["这一步怎么做","任务中心应消费任务/运行状态与消息，而不是自己凭卡片展示就宣布完成。新 Task 设计通过持久化 Binding 与 recommend_id 恢复关联；客户端交互回正确 Task/Run 后再继续。"],["放进同一个例子","用户确认提醒卡片后，要恢复原任务；如果此时任务已取消或条件已失效，不能仅因为按钮还可点就重新执行。"],["异常与交接","发送消息、卡片展示、用户确认、动作生效和任务关闭必须分别核对。当前车型具体支持修改还是仅删除，需按实际接入范围确认。"],["产品要问清","界面“已完成”与后端 Run、工具结果是否一致？取消后旧卡片还能否触发动作？"]],"group":"visible-ui","x":12364,"y":8720,"w":1092,"h":660,"learn":["visible-ui","task","output"],"future":false,"kind":"step","body":["这一步怎么做：任务中心应消费任务/运行状态与消息，而不是自己凭卡片展示就宣布完成。新 Task 设计通过持久化 Binding 与 recommend_id 恢复关联；客户端交互回正确 Task/Run 后再继续。","放进同一个例子：用户确认提醒卡片后，要恢复原任务；如果此时任务已取消或条件已失效，不能仅因为按钮还可点就重新执行。","异常与交接：发送消息、卡片展示、用户确认、动作生效和任务关闭必须分别核对。当前车型具体支持修改还是仅删除，需按实际接入范围确认。","产品要问清：界面“已完成”与后端 Run、工具结果是否一致？取消后旧卡片还能否触发动作？"],"textBottom":9272},{"id":"H-family-0","title":"车控、系统与驾驶","paras":[["能力类别","关键问：一条自然语言车控，在哪里变成原子动作？谁校验车型/座位/车态？"]],"group":"family-0","x":400,"y":10410,"w":2020,"h":300,"learn":["orchestration"],"future":false,"kind":"module","body":["能力类别：关键问：一条自然语言车控，在哪里变成原子动作？谁校验车型/座位/车态？"],"textBottom":10560},{"id":"T1","title":"01  车辆基础控制","paras":[["真实工具名","vehicle_basic_control"],["接到什么","明确功能、位置、目标值。"],["内部机制","理解自然语言车控诉求 → 补全音区所指的座位/车窗 → 映射原子动作，交车型适配。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","回执 + 真实状态需分别核验；不能用它开关车门本体；门锁与车门不是同一能力。"],["用一个例子追","“给副驾降温”。先确定对象和功能，再核对原子动作与车况回读；解析正确却副驾没有变化，继续查车型适配和执行。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-0","x":450,"y":10850,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：vehicle_basic_control","接到什么：明确功能、位置、目标值。","内部机制：理解自然语言车控诉求 → 补全音区所指的座位/车窗 → 映射原子动作，交车型适配。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：回执 + 真实状态需分别核验；不能用它开关车门本体；门锁与车门不是同一能力。","用一个例子追：“给副驾降温”。先确定对象和功能，再核对原子动作与车况回读；解析正确却副驾没有变化，继续查车型适配和执行。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":11362},{"id":"T2","title":"02  系统设置","paras":[["真实工具名","vehicle_system_settings"],["接到什么","设置项、目标状态/数值。"],["内部机制","蓝牙/Wi-Fi/应用/音量等 → K 歌控制归本工具 → 领域理解后调系统能力。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","设置结果或失败原因；权限与应用可用性有边界；不能把不支持功能报成功。"],["用一个例子追","“把媒体音量调低一点”。要知道当前控制的是哪一路音量；指令理解、系统能力调用与音量实际变化分开验收。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-0","x":450,"y":12020,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：vehicle_system_settings","接到什么：设置项、目标状态/数值。","内部机制：蓝牙/Wi-Fi/应用/音量等 → K 歌控制归本工具 → 领域理解后调系统能力。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：设置结果或失败原因；权限与应用可用性有边界；不能把不支持功能报成功。","用一个例子追：“把媒体音量调低一点”。要知道当前控制的是哪一路音量；指令理解、系统能力调用与音量实际变化分开验收。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":12532},{"id":"T3","title":"03  车载通讯","paras":[["真实工具名","vehicle_communication"],["接到什么","主驾的呼叫/通讯指令。"],["内部机制","主驾权限与联系人匹配 → 联系人称呼保持用户原话 → 确认对象后进入通讯流程。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","SP 限定主驾使用；不支持短信能力；拨号成功不等于已接通。"],["用一个例子追","“给妈妈打电话”。保持联系人原话并匹配正确对象，主驾限制先核对；拨号开始、振铃与通话接通不能都写成“打通了”。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-0","x":450,"y":13190,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：vehicle_communication","接到什么：主驾的呼叫/通讯指令。","内部机制：主驾权限与联系人匹配 → 联系人称呼保持用户原话 → 确认对象后进入通讯流程。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：SP 限定主驾使用；不支持短信能力；拨号成功不等于已接通。","用一个例子追：“给妈妈打电话”。保持联系人原话并匹配正确对象，主驾限制先核对；拨号开始、振铃与通话接通不能都写成“打通了”。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":13702},{"id":"T4","title":"04  实时车况查询","paras":[["真实工具名","vehicle_status_search"],["接到什么","要查的车况/部位。"],["内部机制","读取当前车辆信号 → 返回对象、值和状态 → 新鲜度/缺失字段需核对。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","返回实时事实供下一轮；不是车辆说明书问答；未知不等于关闭或数值为零。"],["用一个例子追","“空调现在开着吗”。查询当前信号，不是回忆上一轮开过；返回值要有有效对象和时间，读不到不能默认关着。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-0","x":450,"y":14360,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：vehicle_status_search","接到什么：要查的车况/部位。","内部机制：读取当前车辆信号 → 返回对象、值和状态 → 新鲜度/缺失字段需核对。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：返回实时事实供下一轮；不是车辆说明书问答；未知不等于关闭或数值为零。","用一个例子追：“空调现在开着吗”。查询当前信号，不是回忆上一轮开过；返回值要有有效对象和时间，读不到不能默认关着。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":14872},{"id":"T19","title":"19  驾驶与泊车","paras":[["真实工具名","auto_drive"],["接到什么","具体驾驶/泊车意图。"],["内部机制","先核验车型实际能力 → 驾驶/泊车控制交专用接口 → 启用与接管门禁须查契约。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","SP 不能证明所有功能开放；安全门禁/确认协议待核；模型决定不等于车辆接受。"],["用一个例子追","“帮我泊车”。必须按车型已开放功能、驾驶状态和必要确认处理；SP 工具名不证明所有自动驾驶/泊车动作都获准。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-0","x":450,"y":15530,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：auto_drive","接到什么：具体驾驶/泊车意图。","内部机制：先核验车型实际能力 → 驾驶/泊车控制交专用接口 → 启用与接管门禁须查契约。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：SP 不能证明所有功能开放；安全门禁/确认协议待核；模型决定不等于车辆接受。","用一个例子追：“帮我泊车”。必须按车型已开放功能、驾驶状态和必要确认处理；SP 工具名不证明所有自动驾驶/泊车动作都获准。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":16042},{"id":"T20","title":"20  氛围灯控制","paras":[["真实工具名","ambient_light_control"],["接到什么","颜色/模式/风格诉求。"],["内部机制","所有颜色诉求路由本工具 → 可理解具体色或风格表达 → 不强制先走视觉问答。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","灯光是否变化需看实际结果；位置/模式依车型能力；不支持时返回可行范围。"],["用一个例子追","“把灯调成晚霞的感觉”。风格或颜色诉求直接交灯光能力理解，不必人为先调用视觉；实际支持区域与模式以车端能力为准。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-0","x":450,"y":16700,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：ambient_light_control","接到什么：颜色/模式/风格诉求。","内部机制：所有颜色诉求路由本工具 → 可理解具体色或风格表达 → 不强制先走视觉问答。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：灯光是否变化需看实际结果；位置/模式依车型能力；不支持时返回可行范围。","用一个例子追：“把灯调成晚霞的感觉”。风格或颜色诉求直接交灯光能力理解，不必人为先调用视觉；实际支持区域与模式以车端能力为准。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":17212},{"id":"H-family-1","title":"天气、出行与预订","paras":[["能力类别","关键问：地点与路线分别是谁选定？为什么 Planner 不能再补一次“开始导航”？"]],"group":"family-1","x":2670,"y":10410,"w":2020,"h":300,"learn":["orchestration"],"future":false,"kind":"module","body":["能力类别：关键问：地点与路线分别是谁选定？为什么 Planner 不能再补一次“开始导航”？"],"textBottom":10560},{"id":"T5","title":"05  天气查询","paras":[["真实工具名","weather_search"],["接到什么","地点、时间、天气诉求。"],["内部机制","查询当前位置/目的地天气 → 沿途天气关联正在进行路线 → 按用户时间粒度返回预报。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","地点/日期要能对应用户；不能混淆实时值与预报；查询失败不得编造天气。"],["用一个例子追","“明天到目的地会下雨吗”。先对应目的地与明天的时间范围；当前位置当前天气不能替代目的地预报。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-1","x":2720,"y":10850,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：weather_search","接到什么：地点、时间、天气诉求。","内部机制：查询当前位置/目的地天气 → 沿途天气关联正在进行路线 → 按用户时间粒度返回预报。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：地点/日期要能对应用户；不能混淆实时值与预报；查询失败不得编造天气。","用一个例子追：“明天到目的地会下雨吗”。先对应目的地与明天的时间范围；当前位置当前天气不能替代目的地预报。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":11362},{"id":"T6","title":"06  地点搜索","paras":[["真实工具名","poi_search"],["接到什么","地点线索、范围与偏好。"],["内部机制","模糊地点先检索候选 → 多候选 → 用户选具体地点 → 沿途搜索需已有导航上下文。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","返回候选/选中地点信息；与 route / navi 串行互斥；选中信息必须进入下一步。"],["用一个例子追","“沿路找个充电站”。需要当前路线与搜索偏好；返回候选后确定具体地点，再交路线规划，不能与路线工具同时抢导航上下文。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-1","x":2720,"y":12020,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：poi_search","接到什么：地点线索、范围与偏好。","内部机制：模糊地点先检索候选 → 多候选 → 用户选具体地点 → 沿途搜索需已有导航上下文。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：返回候选/选中地点信息；与 route / navi 串行互斥；选中信息必须进入下一步。","用一个例子追：“沿路找个充电站”。需要当前路线与搜索偏好；返回候选后确定具体地点，再交路线规划，不能与路线工具同时抢导航上下文。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":12532},{"id":"T7","title":"07  路线规划","paras":[["真实工具名","route_planning"],["接到什么","确定地点/途经点/路线偏好。"],["内部机制","给具体地点规划候选路线 → 选择路线后工具会自动导航 → 失败最多重试 2 次（SP约定）。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","不要再多调一次开始导航；依赖 POI/用户选择的结果；不能把路线展示当已出发。"],["用一个例子追","“去昨天那个游泳馆”。先把历史指代补成确定地点，再规划候选路线；选路后的导航由该工具既定流程完成，避免额外重复开始。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-1","x":2720,"y":13190,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：route_planning","接到什么：确定地点/途经点/路线偏好。","内部机制：给具体地点规划候选路线 → 选择路线后工具会自动导航 → 失败最多重试 2 次（SP约定）。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：不要再多调一次开始导航；依赖 POI/用户选择的结果；不能把路线展示当已出发。","用一个例子追：“去昨天那个游泳馆”。先把历史指代补成确定地点，再规划候选路线；选路后的导航由该工具既定流程完成，避免额外重复开始。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":13702},{"id":"T8","title":"08  导航控制","paras":[["真实工具名","navi_basic_control"],["接到什么","当前导航的调整指令。"],["内部机制","操作导航界面/播报/收藏等 → 控制已有导航，不替代规划 → 与 POI / route 串行互斥。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","导航状态/操作结果回流；没有正在导航时按能力处理；手点、取消同样更新上下文。"],["用一个例子追","“把导航播报关小一点”。操作正在进行的导航能力，不把已确定路线重新规划一遍；操作结果应同步后续状态。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"group":"family-1","x":2720,"y":14360,"w":1920,"h":1020,"learn":["orchestration"],"future":false,"kind":"tool","body":["真实工具名：navi_basic_control","接到什么：当前导航的调整指令。","内部机制：操作导航界面/播报/收藏等 → 控制已有导航，不替代规划 → 与 POI / route 串行互斥。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。","结果与边界：导航状态/操作结果回流；没有正在导航时按能力处理；手点、取消同样更新上下文。","用一个例子追：“把导航播报关小一点”。操作正在进行的导航能力，不把已确定路线重新规划一遍；操作结果应同步后续状态。","至少要拿到的证据：原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],"textBottom":14872},{"id":"T27","title":"27  餐厅预订","paras":[["真实工具名","restaurant_reserve"],["接到什么","餐厅、时间、人数等诉求。"],["内部机制","支持创建/查询/改订/取消 → 可进入工具继续补齐信息 → 提交确认与订单幂等须核验。这些是当前定义能支持的业务步骤；具体模型、服务 可感知时延","numerator":"不是比率","denominator":"完整请求","measure":"首播、首卡片、首动作、最终完成分别测量","slice":"按车型、网络、用户场景分层"}]},"visible-ui":{"depth":"能把“页面能看见、语音能匹配、按钮被点中、原业务收到、动作真生效”五件事分别验收。","why":"可见即可说的 UI 成功不是任务成功；把这条支路略成“语音直接回 Trigger”会漏掉页面注册、消歧和业务回调。","questions":["当前最顶层是哪个页面？隐藏页面和已过期卡片还能匹配吗？","谁生成并更新指令—元素 ID 映射？页面变化后旧 ID 如何失效？","同名“确认”按钮由谁消歧，而不是由 ASR 选业务？","免唤醒、唤醒后的在线与离线 ASR 优先级分别是什么？","模拟点击成功后，原业务收到的是否与手点同一种按钮事件？","收到“确认”后当前车况已经变化，谁负责重新判断还能不能执行？","这次语音会以模拟点击事件进入历史，还是被当成普通用户 Query？","页面注册词上限在原文中为不超过 500（随能力更新）；当前运行版本是多少？"],"metrics":[{"name":"卡片实际展示率","numerator":"成功出现在有效前台页面的请求数","denominator":"应展示的合法卡片请求数","measure":"排队、被覆盖、拒绝、过期分别记录","slice":"按车型、网络、用户场景分层"},{"name":"匹配与消歧正确率","numerator":"匹配到用户所指且唯一可操作元素的语句数","denominator":"可见即可说受测有效语句数","measure":"同名控件、页面切换、隐藏卡片、词表更新分别测","slice":"按车型、网络、用户场景分层"},{"name":"点击到业务回调成功率","numerator":"正确回到对应业务/运行的有效点击数","denominator":"需要业务回调的真实/模拟点击数","measure":"UI 动效成功不能代替业务收到","slice":"按车型、网络、用户场景分层"},{"name":"确认后复核有效率","numerator":"失效条件被拦截且有效条件可继续的确认数","denominator":"需要执行前复核的受测确认数","measure":"用户确认前后车况/任务状态变化要注入测试","slice":"按车型、网络、用户场景分层"}]}},"sources":[{"id":"S1","title":"Director（对话推理引擎）PRD","url":"https://bytedance.larkoffice.com/wiki/XRuKwJ0VPisdUhkxH0ecY1rRn9g","status":"已读原文：端云分流与 Planner 闭环的 PRD 基线，不等于所有车型线上现状"},{"id":"S2","title":"TOB 简单复杂仲裁 · 针对 AI 汽车升级","url":"https://bytedance.larkoffice.com/wiki/HY5QwcsEVioVaHkHlFFcwuoon3b","status":"历史方案：短期演示与长期方向需分开；用于解释路由职责"},{"id":"S3","title":"Task Service 架构设计","url":"https://bytedance.larkoffice.com/wiki/B2WYwXFOIigKzbk7aSYcJWmZn2E","status":"已读原文：2026-09-03 更新设计；图中紫虚线为新方案，不标为全面上线"},{"id":"S4","title":"TaskService 动态感知任务至 VLM 与结果","url":"https://bytedance.larkoffice.com/wiki/DBZxwnI62iavXJksT4ccNu78nOd","status":"已读原文：dynamic_watch_tasks 全量替换、3 项限制、独立结果通道"},{"id":"S5","title":"本地 Planner SP 工具定义快照","url":"/Users/bytedance/Desktop/3.23/产品/1-原始素材/资料数据PRD原件/planner 架构/动态示例/sp.md","status":"本次解析核对：27 个唯一工具；文件修改时间 2026-07-31，不代表全部生产注册表"},{"id":"S6","title":"用户原图的本地复刻底稿","url":"/Users/bytedance/Desktop/3.23/产品/_配套资源(图表脚本)/diagrams-v2/触发器全模块大图-原图复刻.png","status":"用于保持 1–30 编号、端云分区与全链结构；不能单凭图证明部署现状"},{"id":"S7","title":"可见即可说框架需求文档","url":"https://bytedance.larkoffice.com/wiki/AxYjwUI8wiFCXWkdNsDcRae0nCf","status":"本次已读原文：页面解析、指令和元素 ID、ASR、匹配、注册方消歧、模拟点击、历史事件标记；具体卡片接入不由框架 PRD 证明"}],"cases":[{"id":"full","title":"完整例子：降温＋昨天游泳馆","nodes":["V1","V2","V3","V4","R1","R2","R3","R4","C1","C2","C3","C4","P1","P2","P3","P4","D1","D2","D3","D4","E1","E2","E3","E4","F1","F2","F3","F4","O1","O2","O3","O4"]},{"id":"loop","title":"只看查记忆后的第二轮","nodes":["P2","P3","D3","T12","F1","F2","F3","C4","P3","T7","E2","O3","F4","O1"]},{"id":"fast","title":"只看端侧快路与兜底","nodes":["V4","R1","R4","E1","E3","E4","O1"]},{"id":"task","title":"只看未来任务怎样真正执行","nodes":["P4","TK1","TK2","TK3","VL3","VL4","TK4","E3","E4","F4","UI4"]},{"id":"ui","title":"只看“第三个”怎样回原业务","nodes":["O2","UI1","UI2","UI3","O3","E2","F1","F4"]}],"main":["voice","route","context","planner","dispatch","execute","feedback","output"],"mainSteps":["V1","V2","V3","V4","R1","R2","R3","R4","C1","C2","C3","C4","P1","P2","P3","P4","D1","D2","D3","D4","E1","E2","E3","E4","F1","F2","F3","F4","O1","O2","O3","O4"],"layout":{"mainNodeHeight":660,"mainGap":170,"columnGap":480,"coreBottom":5030,"supplementTop":5770,"supplementBottom":9640,"toolTop":10180,"learningTop":18260,"mainHeaderY":920}}</script><script>
const D=JSON.parse(document.querySelector('#data').textContent),stage=document.querySelector('#stage'),svg=stage.querySelector(':scope > svg'),ins=document.querySelector('#insContent');
const N=new Map(D.nodes.map(n=>[n.id,n])),G=new Map(D.groups.map(g=>[g.id,g]));const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view={x:0,y:0,w:13920,h:22502},selected='V1',mode='explain',caseId='full',stepIndex=0,notes={},hits=[],hitIndex=0;const storeKey='doubao-business-v12-notes';try{notes=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(notes))}catch{toast('浏览器未能保存，请及时导出总结。')}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2800)}
function size(){return {w:Math.max(stage.clientWidth,400),h:Math.max(stage.clientHeight,400)}}
function setView(v){view={...v};svg.setAttribute('viewBox',[view.x,view.y,view.w,view.h].join(' '));$('#zoomValue').textContent=Math.round(size().w/view.w*100)+'%';const r=$('#mapView');if(r){r.setAttribute('x',view.x);r.setAttribute('y',view.y);r.setAttribute('width',view.w);r.setAttribute('height',view.h)}}
function fit(r,pad=35){const s=size(),a=s.w/s.h,cx=r.x+r.w/2,cy=r.y+r.h/2;let w=r.w+pad*2,h=r.h+pad*2;if(w/h>a)h=w/a;else w=h*a;setView({x:cx-w/2,y:cy-h/2,w,h})}
function zoom(f,x=.5,y=.5){let w=view.w*f,h=view.h*f;if(size().w/w<.018||size().w/w>2.5)return;setView({x:view.x+(view.w-w)*x,y:view.y+(view.h-h)*y,w,h})}
function pathsFor(id){const n=N.get(id),gid=n?.group;const relevant=D.edges.filter(e=>e.from===id||e.to===id);if(n?.kind!=='module')relevant.push(...D.edges.filter(e=>(e.from==='H-'+gid||e.to==='H-'+gid)&&e.kind!=='inside'));return [...new Map(relevant.map(e=>[e.id,e])).values()]}
function highlight(id){svg.querySelectorAll('.picked').forEach(e=>e.classList.remove('picked'));svg.querySelector('[data-node-id="'+id+'"]')?.classList.add('picked');const rel=new Set(pathsFor(id).map(e=>e.id));svg.querySelectorAll('[data-edge-id]').forEach(e=>{e.classList.toggle('connected',rel.has(e.dataset.edgeId));e.classList.toggle('muted',!rel.has(e.dataset.edgeId))})}
function caseNodes(){return D.cases.find(c=>c.id===caseId).nodes}
function bar(){const ids=caseNodes(),n=N.get(selected),idx=ids.indexOf(selected);if(idx>=0)stepIndex=idx;$('#counter').textContent=idx>=0?'第 '+(stepIndex+1)+' / '+ids.length+' 框 · 阅读顺序，不是线上执行日志':'当前定位 · 可返回主线继续';$('#currentTitle').textContent=n?.title||'';$('#previous').disabled=stepIndex<=0;$('#next').disabled=stepIndex>=ids.length-1;$('.stage-nav').querySelectorAll('[data-module]').forEach(b=>b.classList.toggle('active',b.dataset.module===n?.group));}
function focusNode(id,move=true){if(!N.has(id))return;selected=id;highlight(id);bar();renderPanel();if(move){const n=N.get(id);if(n.kind==='learning')fit({x:n.x,y:n.y,w:n.w,h:1300});else fit(n,48)}history.replaceState(null,'','#'+encodeURIComponent(id))}
function linkEdges(es){return '<div class="connections">'+es.map(e=>'<button data-edge="'+e.id+'"><small>'+esc(e.id+' · '+(e.kind==='expand'?'展开关系':'连接方向'))+'</small>'+esc(N.get(e.from)?.title)+' → '+esc(N.get(e.to)?.title)+'<small>'+esc(e.description||e.label||'沿箭头进入下一步')+'</small></button>').join('')+'</div>'}
function qHTML(k,qs){return qs.map((q,i)=>{const key=k+'-'+i;return '<div class="question"><label><input type="checkbox" data-note="'+key+'-done" '+(notes[key+'-done']?'checked':'')+'><span>'+esc(q)+'</span></label><textarea data-note="'+key+'" placeholder="写下我的解释、真实 Trace、责任边界或待确认项…">'+esc(notes[key]||'')+'</textarea></div>'}).join('')}
function metricHTML(ms){return ms.map(m=>'<section class="metric"><strong>'+esc(m.name)+'</strong><dl>'+[['分子',m.numerator],['分母',m.denominator],['怎么测',m.measure],['怎样分层',m.slice]].map(([k,v])=>'<dt>'+k+'</dt><dd>'+esc(v)+'</dd>').join('')+'</dl></section>').join('')}
function renderPanel(){const n=N.get(selected),g=G.get(n.group);$('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===mode));let h='<span class="badge">'+esc(g?.title||'业务链路')+'</span><h2>'+esc(n.title)+'</h2>';
 if(mode==='explain'){h+='<p class="muted-text">'+(n.future?'新 Task 演进设计，不代表所有车型已上线。':'业务解释基于资料；部署、门禁实现与运行指标仍需目标版本验证。')+'</p>';h+=(n.paras.length?n.paras:[['模块说明',n.body.join('。')]]).map(([l,t])=>'<p><span class="label">'+esc(l)+'</span>'+esc(t)+'</p>').join('');h+='<h3>这条线从哪里来、到哪里去</h3>'+linkEdges(pathsFor(selected));h+='<h3>这个框的个人笔记</h3><textarea class="note" data-note="node-'+n.id+'" placeholder="我懂了什么，还缺哪份接口、哪个失败日志？">'+esc(notes['node-'+n.id]||'')+'</textarea><div class="summary-actions"><button id="exportNotes">导出总结</button><button id="sources">来源与边界</button></div>'}
 if(mode==='connections'){h+='<p>点击一条连接，会单独高亮它；再点击起点或终点跳过去。粗线连接模块，模块内从上到下阅读。</p>'+linkEdges(pathsFor(selected));h+='<h3>主链和分支</h3>'+linkEdges(D.edges.filter(e=>['main','flow','return'].includes(e.kind)&&!/^\w+-\d+$/.test(e.id)))}
 if(mode==='learn'){let ks=n.learn?.length?n.learn:g?.learn||[];h+='<p class="muted-text">建议自测与指标口径，不是团队已达到的成绩。复盘应区分路由、上下文、工具定义、推理、执行和反馈问题。</p>';for(const k of [...new Set(ks)]){const l=D.learning[k];if(!l)continue;h+='<h3>掌握程度</h3><div class="callout">'+esc(l.depth)+'</div><p>'+esc(l.why)+'</p><h3>用问题检验自己</h3>'+qHTML(k,l.questions)+'<h3>怎样量化验收</h3>'+metricHTML(l.metrics)}h+='<div class="summary-actions"><button id="allLearning">完整自测目录</button><button id="exportNotes">导出总结</button></div>'}
 ins.innerHTML=h;bindPanel();ins.parentElement.scrollTop=0;}
function bindPanel(){ins.querySelectorAll('[data-edge]').forEach(b=>b.onclick=()=>selectEdge(b.dataset.edge));ins.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>focusNode(b.dataset.jump));ins.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{notes[e.dataset.note]=e.type==='checkbox'?e.checked:e.value;save()});$('#exportNotes')?.addEventListener('click',exportNotes);$('#sources')?.addEventListener('click',showSources);$('#allLearning')?.addEventListener('click',showLearning);}
function openPanel(){document.body.classList.remove('no-panel');$('#togglePanel').textContent='收起说明'}
function selectEdge(id){const e=D.edges.find(e=>e.id===id);if(!e)return;svg.querySelectorAll('[data-edge-id]').forEach(el=>{el.classList.toggle('connected',el.dataset.edgeId===id);el.classList.toggle('muted',el.dataset.edgeId!==id)});const xs=e.points.map(p=>p[0]),ys=e.points.map(p=>p[1]);fit({x:Math.min(...xs)-60,y:Math.min(...ys)-100,w:Math.max(...xs)-Math.min(...xs)+120,h:Math.max(...ys)-Math.min(...ys)+200},50);openPanel();ins.innerHTML='<span class="badge">连接 '+esc(id)+'</span><h2>这根线怎么走</h2><p><span class="label">从</span>'+esc(N.get(e.from).title)+'</p><p><span class="label">到</span>'+esc(N.get(e.to).title)+'</p><div class="callout">'+esc(e.description||e.label||'模块内部的下一处理步骤。')+'</div><div class="connections"><button data-jump="'+e.from+'">回起点：'+esc(N.get(e.from).title)+'</button><button data-jump="'+e.to+'">去终点：'+esc(N.get(e.to).title)+'</button></div><p class="muted-text">虚线仅表示机制展开或工具目录，不等于新加了一次运行步骤。</p>';bindPanel()}
function showSources(){openPanel();ins.innerHTML='<h2>资料、推导与待核边界</h2><div class="callout">这是业务解释图，不是全车型生产部署图。贯穿 Query 是讲解案例，不是本次实车测试日志。</div><p>本轮重新搜索飞书并读取 Director PRD、Task 技术设计；核对本地 SP 的 27 个唯一工具。VLM 与可见即可说沿用此前已核对原文的业务契约。会议结论未作为新证据加入。</p>'+D.sources.map(s=>'<div class="source"><a href="'+esc(s.url)+'" target="_blank" rel="noreferrer">'+esc(s.title)+'</a><p>'+esc(s.status)+'</p></div>').join('')+'<h3>不能据此声称已确认的事项</h3><p>全部车型的实际工具数、每个工具内部模型/SDK 实现、统一权限门禁、完整幂等/取消协议、Task 全量上线范围及实测性能，均需要运行证据。</p><button id="back">返回当前框</button>';$('#back').onclick=renderPanel}
function showTools(){openPanel();ins.innerHTML='<h2>27 项工具：先选，再逐项读机制</h2><p>这是 SP 定义快照。一个工具可能覆盖很多原子能力；工具数不是模型能力成绩。</p>'+D.toolFamilies.map(f=>'<h3>'+esc(f.title)+'</h3><div class="tool-list">'+f.tools.map(t=>'<button data-jump="T'+t.n+'">'+t.n+'. '+esc(t.cn)+'<small>'+esc(t.name)+'</small></button>').join('')+'</div>').join('');bindPanel();fit(G.get('family-0'),80)}
function showLearning(){openPanel();ins.innerHTML='<h2>需要全部深入，才考虑走吗？</h2><p>不需要平均钻研所有底层实现。你应优先证明：能追完真实目标，定位主责模块的错误，设计一次改进并用指标验收。相邻模块要懂契约、状态和故障归属。</p><div class="callout">AI 能力是核心，但产品上的 AI 能力包括：理解与规划、正确上下文、可执行工具、反馈纠错。不能只用“有自己的模型”或“工具很多”替代端到端成绩。</div><h3>可操作的自测，不是离职硬门槛</h3>'+qHTML('readiness',['独立复盘 10 条完整 Trace，覆盖快路、复杂多目标、记忆依赖、条件任务、持续观察、视觉、主动建议、取消、失败恢复和离线。','拿 5 个跨模块 badcase，指出最早出错点，提供证据并排除其他根因。','完成 1 次有基线、保留测试集、对照实验、回归与上线后跟踪的 Planner 或触发器改进。','对自己场景里的重点工具，能解释输入、内部步骤、前置条件、实际副作用、反馈关联和超时恢复。','在评审中能够提出具体场景、风险证据、责任方与验收口径，而不是只问技术术语。'])+'<h3>按模块展开完整问题与指标</h3><div class="tool-list">'+Object.entries(D.learning).map(([k,l])=>'<button data-learning="'+k+'">'+esc(k)+'<small>'+esc(l.depth)+'</small></button>').join('')+'</div><button id="exportNotes">导出总结</button>';bindPanel();ins.querySelectorAll('[data-learning]').forEach(b=>b.onclick=()=>{const k=b.dataset.learning,l=D.learning[k];ins.innerHTML='<h2>'+esc(k)+' · 自测与指标</h2><div class="callout">'+esc(l.depth)+'</div><p>'+esc(l.why)+'</p>'+qHTML(k,l.questions)+metricHTML(l.metrics)+'<button id="allLearning">返回目录</button><button id="exportNotes">导出总结</button>';bindPanel()})}
function exportNotes(){const out=['# 豆包汽车业务链路 · 我的总结','',new Date().toLocaleString(),''];for(const [k,l] of Object.entries(D.learning)){out.push('## '+k,'',l.depth,'');l.questions.forEach((q,i)=>{out.push('- ['+(notes[k+'-'+i+'-done']?'x':' ')+'] '+q);if(notes[k+'-'+i])out.push('  '+notes[k+'-'+i])});out.push('')}for(const [k,v] of Object.entries(notes))if(k.startsWith('node-')&&v)out.push('## '+(N.get(k.slice(5))?.title||k),'',String(v),'');out.push('## 笔记原始数据','',JSON.stringify(notes,null,2));const blob=new Blob([out.join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='业务链路学习总结-v12.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),600)}
$('#previous').onclick=()=>{stepIndex=Math.max(0,stepIndex-1);focusNode(caseNodes()[stepIndex])};$('#next').onclick=()=>{stepIndex=Math.min(caseNodes().length-1,stepIndex+1);focusNode(caseNodes()[stepIndex])};
$('#caseSelect').onchange=e=>{caseId=e.target.value;stepIndex=0;focusNode(caseNodes()[0])};
$('.stage-nav').innerHTML=D.main.map((k,i)=>{const g=G.get(k);return(i?'<span class="nav-arrow">→</span>':'')+'<button data-module="'+k+'">'+String(i+1).padStart(2,'0')+' '+esc(g.title)+'</button>'}).join('');$('.stage-nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=D.nodes.find(n=>n.group===b.dataset.module&&n.kind==='step');focusNode(n.id)});
$('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{mode=b.dataset.tab;renderPanel()});
$('#start').onclick=()=>{caseId='full';$('#caseSelect').value='full';stepIndex=0;focusNode('V1')};$('#overview').onclick=()=>{svg.querySelectorAll('.muted,.connected').forEach(e=>e.classList.remove('muted','connected'));fit({x:200,y:350,w:13520,h:1080},20);toast('总览只看模块关系；点击一个模块，进入正常字号阅读。')};$('#all').onclick=()=>{svg.querySelectorAll('.muted,.connected').forEach(e=>e.classList.remove('muted','connected'));fit({x:0,y:0,w:D.width,h:D.height},0)};$('#tools').onclick=showTools;$('#learn').onclick=showLearning;$('#sourceBtn').onclick=showSources;
$('#togglePanel').onclick=()=>{document.body.classList.toggle('no-panel');$('#togglePanel').textContent=document.body.classList.contains('no-panel')?'展开说明':'收起说明';requestAnimationFrame(()=>focusNode(selected))};$('#closePanel').onclick=()=>{$('#togglePanel').click()};
$('#minus').onclick=()=>zoom(1.22);$('#plus').onclick=()=>zoom(.82);$('#fitCurrent').onclick=()=>focusNode(selected);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(Math.exp(e.deltaY*.0012),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,v:{...view},node:e.target.dataset.nodeId,edge:e.target.dataset.edgeId,moved:false};svg.setPointerCapture?.(e.pointerId);svg.classList.add('dragging')});svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;setView({...drag.v,x:drag.v.x-dx*drag.v.w/size().w,y:drag.v.y-dy*drag.v.h/size().h})});svg.addEventListener('pointerup',()=>{if(drag&&!drag.moved){if(drag.edge)selectEdge(drag.edge);else if(drag.node)focusNode(drag.node,false)}drag=null;svg.classList.remove('dragging')});svg.addEventListener('dblclick',e=>{if(e.target.dataset.nodeId)focusNode(e.target.dataset.nodeId)});
$('#map').innerHTML='<svg viewBox="0 0 '+D.width+' '+D.height+'">'+D.groups.map(g=>'<rect x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+'" fill="#e6edf6" stroke="#a2b5c8" stroke-width="14"/>').join('')+'<rect id="mapView" fill="none" stroke="#185db7" stroke-width="45"/></svg>';
$('#map').onclick=e=>{const r=$('#map').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*D.width,y=(e.clientY-r.top)/r.height*D.height;setView({...view,x:x-view.w/2,y:y-view.h/2})};
function search(){const q=$('#search').value.trim().toLowerCase();if(!q)return;if(!hits.length){hits=D.nodes.filter(n=>(n.title+' '+n.body.join(' ')).toLowerCase().includes(q));hitIndex=0}if(!hits.length){toast('没有匹配。试试中文功能名、工具名或“回调”“车况”。');return}focusNode(hits[hitIndex%hits.length].id);hitIndex++;$('#find').textContent=((hitIndex-1)%hits.length+1)+' / '+hits.length}
$('#search').oninput=()=>{hits=[];$('#find').textContent='查找'};$('#search').onkeydown=e=>{if(e.key==='Enter')search()};$('#find').onclick=search;window.addEventListener('resize',()=>{const n=N.get(selected);if(n)fit(n,48)});
if(window.innerWidth<=900){document.body.classList.add('no-panel');$('#togglePanel').textContent='展开说明'}

window.flowState={data:D,focusNode,selectEdge,showTools,showLearning,showSources,getView:()=>view,getSelected:()=>selected,notes};
