<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="v56-model-map" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="v56-model-map-title v56-model-map-desc">
<title id="v56-model-map-title">模型何时何地接手</title><desc id="v56-model-map-desc">按阶段和位置找职责；两个 1.7B 和两种 30B，各自解决不同问题。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="v56-model-map-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44">模型何时何地接手</text><text class="v56-subtitle" x="32" y="72">按阶段和位置找职责；两个 1.7B 和两种 30B，各自解决不同问题。</text>
<text class="v56-label" x="32" y="123" text-anchor="start">时间阶段</text>
<text class="v56-node-title" x="245" y="168" text-anchor="middle">用户还在说</text>
<text class="v56-node-title" x="455" y="168" text-anchor="middle">用户说完</text>
<text class="v56-node-title" x="665" y="168" text-anchor="middle">办理</text>
<text class="v56-node-title" x="875" y="168" text-anchor="middle">需要视觉时</text>
<text class="v56-node-title" x="1085" y="168" text-anchor="middle">断网时</text>
<path class="v56-arrow" d="M 340 161 L 360 161" fill="none" marker-end="url(#v56-model-map-arr)"/>
<path class="v56-arrow" d="M 550 161 L 570 161" fill="none" marker-end="url(#v56-model-map-arr)"/>


<path class="v56-rule" d="M 120 205 L 1180 205" fill="none"/>
<path class="v56-rule" d="M 120 460 L 1180 460" fill="none"/>
<path class="v56-rule" d="M 120 715 L 1180 715" fill="none"/>
<text class="v56-node-title" x="32" y="320" text-anchor="start">车上</text>
<text class="v56-node-title" x="32" y="610" text-anchor="start">云端</text>
<g data-node="true">
<rect class="v56-local" x="150" y="250" width="190" height="162" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="164" y="277" text-anchor="start">流式拒识</text>
<text class="v56-node-sub" x="164" y="302" text-anchor="start">Qwen3 1.7B</text>
<text class="v56-node-sub" x="164" y="323" text-anchor="start">赛力斯本地方案</text>
<text class="v56-node-sub" x="164" y="344" text-anchor="start">用户还在说时判断</text>
</g>
<g data-node="true">
<rect class="v56-local" x="570" y="250" width="190" height="162" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="584" y="277" text-anchor="start">端侧 FC</text>
<text class="v56-node-sub" x="584" y="302" text-anchor="start">Qwen3 1.7B</text>
<text class="v56-node-sub" x="584" y="323" text-anchor="start">函数与参数候选</text>
</g>
<g data-node="true">
<rect class="v56-local v56-pending" x="780" y="250" width="190" height="162" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="794" y="277" text-anchor="start">30B VLM</text>
<text class="v56-node-sub" x="794" y="302" text-anchor="start">AI Box 30B MoE</text>
<text class="v56-node-sub" x="794" y="323" text-anchor="start">端侧规划</text>
<text class="v56-node-sub" x="794" y="344" text-anchor="start">画面＋文字 → 视觉观察</text>
</g>
<g data-node="true">
<rect class="v56-local v56-pending" x="990" y="250" width="190" height="162" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="1004" y="277" text-anchor="start">端侧简化 DT</text>
<text class="v56-node-sub" x="1004" y="302" text-anchor="start">端侧 30B</text>
<text class="v56-node-sub" x="1004" y="323" text-anchor="start">评估中，未上线</text>
<text class="v56-node-sub" x="1004" y="344" text-anchor="start">简化交互与基础动作</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="150" y="535" width="190" height="162" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="164" y="562" text-anchor="start">流式拒识</text>
<text class="v56-node-sub" x="164" y="587" text-anchor="start">Qwen3 1.7B</text>
<text class="v56-node-sub" x="164" y="608" text-anchor="start">上汽 H20 服务器</text>
<text class="v56-node-sub" x="164" y="629" text-anchor="start">用户还在说时判断</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="360" y="535" width="190" height="162" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="374" y="562" text-anchor="start">最终拒识</text>
<text class="v56-node-sub" x="374" y="587" text-anchor="start">Doubao-Seed-</text>
<text class="v56-node-sub" x="374" y="608" text-anchor="start">2.0-lite 精调</text>
<text class="v56-node-sub" x="374" y="629" text-anchor="start">判断是否继续接话</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="570" y="535" width="190" height="162" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="584" y="562" text-anchor="start">云端 DT</text>
<text class="v56-node-sub" x="584" y="587" text-anchor="start">结合背景与工具反馈</text>
<text class="v56-node-sub" x="584" y="608" text-anchor="start">组织回答及后续动作</text>
</g>
<text class="v56-subtitle" x="32" y="759" text-anchor="start">“需要视觉时 / 断网时”表示办理条件，不表示每次请求都依次经过。</text>
<text class="v56-subtitle" x="32" y="792" text-anchor="start">流式拒识的两处部署分别对应赛力斯和上汽；不表示同一请求同时调用两份。</text>
<text class="v56-subtitle" x="32" y="825" text-anchor="start">两个 1.7B 是两项职责：一个决定要不要停播，一个把话翻成车控指令。</text>
<rect class="v56-local" x="32" y="876" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="890" text-anchor="start">蓝：车上职责</text>
<rect class="v56-cloud" x="222" y="876" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="250" y="890" text-anchor="start">绿：云端职责</text>
<rect class="v56-neutral v56-pending" x="472" y="876" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="500" y="890" text-anchor="start">虚线：规划或评估，不能当作已上线能力</text>
</svg>
