<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="e2-who-speaks" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="e2-who-speaks-title e2-who-speaks-desc">
<title id="e2-who-speaks-title">谁来说结果</title><desc id="e2-who-speaks-desc">拒识优先；句法规则之后判断云端车控干预，再决定由谁播报。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="e2-who-speaks-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">谁来说结果</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">拒识优先；句法规则之后判断云端车控干预，再决定由谁播报。</text>
<g data-node="true"><rect class="v56-decision" x="32" y="145" width="270" height="95" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="172" text-anchor="start">云端车控干预命中？</text>
</g>
<g data-node="true"><rect class="v56-local" x="405" y="145" width="355" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="419" y="172" text-anchor="start">车上播报</text>
<text class="v56-node-sub" x="419" y="197" text-anchor="start">直接下发车控函数，标记简单车控</text>
<text class="v56-node-sub" x="419" y="218" text-anchor="start">同时取消已预先启动的 Planner</text>
</g>
<g data-node="true"><rect class="v56-decision" x="32" y="330" width="270" height="95" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="357" text-anchor="start">是车控吗？</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="405" y="330" width="355" height="115" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="419" y="357" text-anchor="start">结果回 Planner 统一说</text>
<text class="v56-node-sub" x="419" y="382" text-anchor="start">例外：车书查询由车书自己播</text>
</g>
<g data-node="true"><rect class="v56-decision" x="32" y="545" width="300" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="572" text-anchor="start">全部成功，且属于</text>
<text class="v56-node-sub" x="46" y="597" text-anchor="start">简单车控或多意图车控？</text>
<text class="v56-node-sub" x="46" y="618" text-anchor="start">多意图：一句话有两个以上</text>
<text class="v56-node-sub" x="46" y="639" text-anchor="start">独立的车控意图</text>
</g>
<g data-node="true"><rect class="v56-local" x="440" y="545" width="340" height="115" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="454" y="572" text-anchor="start">车上固定模板 + 车上 TTS</text>
<text class="v56-node-sub" x="454" y="597" text-anchor="start">TTS：把文字转成语音</text>
<text class="v56-node-sub" x="454" y="618" text-anchor="start">例子：开空调成功</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="32" y="775" width="460" height="115" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="802" text-anchor="start">云端说清结果，并同步上屏</text>
<text class="v56-node-sub" x="46" y="827" text-anchor="start">复杂车控，或任何一项失败</text>
<text class="v56-node-sub" x="46" y="848" text-anchor="start">说清哪项成、哪项没成、为什么</text>
</g>
<g data-node="true"><rect class="v56-neutral" x="840" y="545" width="328" height="190" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="854" y="572" text-anchor="start">不支持的指令</text>
<text class="v56-node-sub" x="854" y="597" text-anchor="start">分清：车上没有这个功能</text>
<text class="v56-node-sub" x="854" y="618" text-anchor="start">或：有，但不支持语音控制</text>
<text class="v56-node-sub" x="854" y="639" text-anchor="start">手动方法查车书（用户手册）</text>
<text class="v56-node-sub" x="854" y="660" text-anchor="start">查不到时，不断言车上没有</text>
</g>
<path class="v56-arrow" d="M 302 192 L 405 192" marker-end="url(#e2-who-speaks-arr)"/>
<text class="v56-label" x="345" y="177" text-anchor="start">是</text>
<path class="v56-arrow" d="M 167 240 L 167 330" marker-end="url(#e2-who-speaks-arr)"/>
<text class="v56-label" x="182" y="289" text-anchor="start">否</text>
<path class="v56-arrow" d="M 302 377 L 405 377" marker-end="url(#e2-who-speaks-arr)"/>
<text class="v56-label" x="345" y="362" text-anchor="start">否</text>
<path class="v56-arrow" d="M 167 425 L 167 545" marker-end="url(#e2-who-speaks-arr)"/>
<text class="v56-label" x="182" y="489" text-anchor="start">是</text>
<path class="v56-arrow" d="M 332 602 L 440 602" marker-end="url(#e2-who-speaks-arr)"/>
<text class="v56-label" x="375" y="587" text-anchor="start">是</text>
<path class="v56-arrow" d="M 182 675 L 182 775" marker-end="url(#e2-who-speaks-arr)"/>
<text class="v56-label" x="197" y="729" text-anchor="start">否</text>
<rect class="v56-decision" x="32" y="936" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="950" text-anchor="start">黄：播报分流判断</text>
<rect class="v56-local" x="322" y="936" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="350" y="950" text-anchor="start">蓝：车上播报</text>
<rect class="v56-cloud" x="582" y="936" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="610" y="950" text-anchor="start">绿：云端组织结果</text>
<rect class="v56-neutral" x="872" y="936" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="900" y="950" text-anchor="start">灰：不支持时的边界</text>
</svg>
