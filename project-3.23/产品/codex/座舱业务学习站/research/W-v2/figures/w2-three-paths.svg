<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="w2-three-paths" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="w2-three-paths-title w2-three-paths-desc">
<title id="w2-three-paths-title">屏幕上的话，有三条处理路径</title><desc id="w2-three-paths-desc">页面词能直接匹配就由车上拦截；需要理解时，再看当前卡片或对话历史。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="w2-three-paths-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<path class="v56-arrow" d="M 600 208 L 600 252 L 202 252 L 202 300" fill="none" marker-end="url(#w2-three-paths-arr)"/>
<path class="v56-arrow" d="M 600 252 L 600 300" fill="none" marker-end="url(#w2-three-paths-arr)"/>
<path class="v56-arrow" d="M 600 252 L 998 252 L 998 300" fill="none" marker-end="url(#w2-three-paths-arr)"/>
<g data-node="true" data-key="input">
<rect class="v56-neutral" x="400" y="120" width="400" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="414" y="147" text-anchor="start">用户说出屏幕上相关的话</text>
<text class="v56-node-sub" x="414" y="172" text-anchor="start">根据页面词、当前卡片、历史选择路径</text>
</g>
<g data-node="true" data-key="local">
<rect class="v56-local" x="32" y="300" width="340" height="190" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="327" text-anchor="start">页面匹配</text>
<text class="v56-node-sub" x="46" y="352" text-anchor="start">车上规则命中 → 直接点</text>
<text class="v56-node-sub" x="46" y="373" text-anchor="start">例子：“开始导航”</text>
<text class="v56-node-sub" x="46" y="394" text-anchor="start">这一路不经过 Planner</text>
</g>
<g data-node="true" data-key="dynamic">
<rect class="v56-cloud" x="430" y="300" width="340" height="190" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="327" text-anchor="start">动态工具</text>
<text class="v56-node-sub" x="444" y="352" text-anchor="start">云端 Planner 理解当前卡片</text>
<text class="v56-node-sub" x="444" y="373" text-anchor="start">输出 select_button，再下发车机</text>
<text class="v56-node-sub" x="444" y="394" text-anchor="start">例子：对当前卡片说“就这个”</text>
</g>
<g data-node="true" data-key="history">
<rect class="v56-cloud" x="828" y="300" width="340" height="190" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="327" text-anchor="start">Planner 读历史</text>
<text class="v56-node-sub" x="842" y="352" text-anchor="start">用上一轮的候选列表找目标</text>
<text class="v56-node-sub" x="842" y="373" text-anchor="start">例子：接着列表说“第二个”</text>
<text class="v56-node-sub" x="842" y="394" text-anchor="start">通过对话历史理解指代</text>
</g>
<rect data-legend="true" class="v56-local" x="32" y="565" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-cloud" x="330" y="565" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-neutral" x="600" y="565" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-title" x="32" y="44" text-anchor="start">屏幕上的话，有三条处理路径</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">页面词能直接匹配就由车上拦截；需要理解时，再看当前卡片或对话历史。</text>
<text class="v56-subtitle" x="32" y="535" text-anchor="start">三条路按场景选择；页面匹配命中后，就在车上拦截执行。</text>
<text class="v56-subtitle" x="60" y="579" text-anchor="start">蓝：车上规则与执行</text>
<text class="v56-subtitle" x="358" y="579" text-anchor="start">绿：云端理解</text>
<text class="v56-subtitle" x="628" y="579" text-anchor="start">灰：用户输入</text>
</svg>
