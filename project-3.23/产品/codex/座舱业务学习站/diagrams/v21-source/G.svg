<svg xmlns="http://www.w3.org/2000/svg" width="735" height="2506" viewBox="0 0 735 2506" role="img" aria-label="云端触发器"><title>云端触发器</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M500,226 L500,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="498" y="322" width="130" height="44" rx="3" fill="#fff"/><text x="503" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="503" dy="0">信号场景订阅输入</tspan></text><path d="M370,226 L370,264 L274,264 L274,682 L235,682 L235,744" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="147" y="322" width="130" height="44" rx="3" fill="#fff"/><text x="152" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="152" dy="0">时间场景注册调度</tspan></text><path d="M500,644 L500,1026" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="498" y="813" width="100" height="44" rx="3" fill="#fff"/><text x="503" y="837" font-size="15" fill="#435c70" font-weight="400"><tspan x="503" dy="0">相关信号更新</tspan></text><path d="M500,1208 L500,1444" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="498" y="1304" width="100" height="44" rx="3" fill="#fff"/><text x="503" y="1328" font-size="15" fill="#435c70" font-weight="400"><tspan x="503" dy="0">条件命中</tspan></text><path d="M235,926 L235,964 L234,964 L234,1382 L370,1382 L370,1444" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="137" y="1095" width="100" height="44" rx="3" fill="#fff"/><text x="142" y="1119" font-size="15" fill="#435c70" font-weight="400"><tspan x="142" dy="0">时间到达</tspan></text><path d="M435,1626 L435,1862" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="338" y="1722" width="100" height="44" rx="3" fill="#fff"/><text x="343" y="1746" font-size="15" fill="#435c70" font-weight="400"><tspan x="343" dy="0">策略允许</tspan></text><path d="M435,2044 L435,2280" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="338" y="2140" width="100" height="44" rx="3" fill="#fff"/><text x="343" y="2164" font-size="15" fill="#435c70" font-weight="400"><tspan x="343" dy="0">出口已接收</tspan></text><a href="#module/G/step/G-1"><g data-step="G-1"><rect x="240" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="240" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="260" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="260" dy="0">G-1</tspan></text><text x="260" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="260" dy="0">提交场景规则</tspan></text><text x="260" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="260" dy="0">场景注册方</tspan></text><text x="260" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="260" dy="0">已注册场景</tspan></text></g></a><a href="#module/G/step/G-2"><g data-step="G-2"><rect x="305" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="305" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="325" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="325" dy="0">G-2</tspan></text><text x="325" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="325" dy="0">车辆或感知信号更新</tspan></text><text x="325" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="325" dy="0">端状态上报</tspan></text><text x="325" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="325" dy="0">新旧状态或当前快照</tspan></text></g></a><a href="#module/G/step/G-3"><g data-step="G-3"><rect x="40" y="744" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="744" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="773" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">G-3</tspan></text><text x="60" y="805" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">单次时刻或周期到达</tspan></text><text x="60" y="847" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">时间调度</tspan></text><text x="60" y="886" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">到期的时间场景</tspan></text></g></a><a href="#module/G/step/G-4"><g data-step="G-4"><rect x="305" y="1026" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="305" y="1026" width="5" height="182" rx="2" fill="#326785"/><text x="325" y="1055" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="325" dy="0">G-4</tspan></text><text x="325" y="1087" font-size="20" fill="#203b50" font-weight="600"><tspan x="325" dy="0">判断当前值或“变更为”</tspan></text><text x="325" y="1129" font-size="16" fill="#375b71" font-weight="400"><tspan x="325" dy="0">条件判断</tspan></text><text x="325" y="1168" font-size="16" fill="#566975" font-weight="400"><tspan x="325" dy="0">本次场景命中或未命中</tspan></text></g></a><a href="#module/G/step/G-5"><g data-step="G-5"><rect x="240" y="1444" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="240" y="1444" width="5" height="182" rx="2" fill="#326785"/><text x="260" y="1473" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="260" dy="0">G-5</tspan></text><text x="260" y="1505" font-size="20" fill="#203b50" font-weight="600"><tspan x="260" dy="0">限制适用范围与重复执行</tspan></text><text x="260" y="1547" font-size="16" fill="#375b71" font-weight="400"><tspan x="260" dy="0">触发器</tspan></text><text x="260" y="1586" font-size="16" fill="#566975" font-weight="400"><tspan x="260" dy="0">本次是否允许发起动作</tspan></text></g></a><a href="#module/G/step/G-6"><g data-step="G-6"><rect x="240" y="1862" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="240" y="1862" width="5" height="182" rx="2" fill="#326785"/><text x="260" y="1891" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="260" dy="0">G-6</tspan></text><text x="260" y="1923" font-size="20" fill="#203b50" font-weight="600"><tspan x="260" dy="0">向 Advisor、推荐服务或业务回调交接</tspan></text><text x="260" y="1965" font-size="16" fill="#375b71" font-weight="400"><tspan x="260" dy="0">动作出口</tspan></text><text x="260" y="2004" font-size="16" fill="#566975" font-weight="400"><tspan x="260" dy="0">下游接收结果</tspan></text></g></a><a href="#module/G/step/G-7"><g data-step="G-7"><rect x="240" y="2280" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="240" y="2280" width="5" height="182" rx="2" fill="#326785"/><text x="260" y="2309" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="260" dy="0">G-7</tspan></text><text x="260" y="2341" font-size="20" fill="#203b50" font-weight="600"><tspan x="260" dy="0">继续完成展示或业务动作</tspan></text><text x="260" y="2383" font-size="16" fill="#375b71" font-weight="400"><tspan x="260" dy="0">下游业务</tspan></text><text x="260" y="2422" font-size="16" fill="#566975" font-weight="400"><tspan x="260" dy="0">下游业务结果</tspan></text></g></a></g></svg>