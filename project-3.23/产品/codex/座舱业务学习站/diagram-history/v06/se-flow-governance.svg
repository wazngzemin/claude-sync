baseline="central">关联完整证据</text><text class="ts" x="198" y="329" text-anchor="start" dominant-baseline="central">Query、Context、动作、反馈、车辆结果；版本、车</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">型、时间与请求身份对齐</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-governance" data-step="SE-G3" aria-label="定位根因归属"><title>规则/信息/模型/执行/时序分别判断；证据不足先补采，不能直接怪模型</title><rect x="180" y="448" width="340" height="91" rx="6"/><text class="th" x="198" y="472" text-anchor="start" dominant-baseline="central">定位根因归属</text><text class="ts" x="198" y="500" text-anchor="start" dominant-baseline="central">规则/信息/模型/执行/时序分别判断；证据不足先补</text><text class="ts" x="198" y="519" text-anchor="start" dominant-baseline="central">采，不能直接怪模型</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-governance" data-step="SE-G4" aria-label="选择改动层级"><title>个人偏好、Prompt、示例、工具或模型；不要用一条示例遮住能力或安全缺陷</title><rect x="180" y="619" width="340" height="91" rx="6"/><text class="th" x="198" y="643" text-anchor="start" dominant-baseline="central">选择改动层级</text><text class="ts" x="198" y="671" text-anchor="start" dominant-baseline="central">个人偏好、Prompt、示例、工具或模型；不要用一条</text><text class="ts" x="198" y="690" text-anchor="start" dominant-baseline="central">示例遮住能力或安全缺陷</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-governance" data-step="SE-G5" aria-label="形成可追溯候选"><title>关联 bug ID、示例/模型版本和范围；修改有负责人，个人数据不进入通用例子</title><rect x="180" y="790" width="340" height="91" rx="6"/><text class="th" x="198" y="814" text-anchor="start" dominant-baseline="central">形成可追溯候选</text><text class="ts" x="198" y="842" text-anchor="start" dominant-baseline="central">关联 bug ID、示例/模型版本和范围；修改有负责人</text><text class="ts" x="198" y="861" text-anchor="start" dominant-baseline="central">，个人数据不进入通用例子</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="se-flow-governance" data-step="SE-G6" aria-label="离线对照与回归"><title>重点修复集 + 全量/邻近能力集；人工校准模型评分；看错误/遗漏/冗余</title><rect x="180" y="961" width="340" height="91" rx="6"/><text class="th" x="198" y="985" text-anchor="start" dominant-baseline="central">离线对照与回归</text><text class="ts" x="198" y="1013" text-anchor="start" dominant-baseline="central">重点修复集 + 全量/邻近能力集；人工校准模型评分</text><text class="ts" x="198" y="1032" text-anchor="start" dominant-baseline="central">；看错误/遗漏/冗余</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-governance" data-step="SE-G7" aria-label="决定是否放行"><title>达到已确认门槛，明确未覆盖项；未达标退回候选，不以平均分掩盖安全退化</title><rect x="180" y="1132" width="340" height="91" rx="6"/><text class="th" x="198" y="1156" text-anchor="start" dominant-baseline="central">决定是否放行</text><text class="ts" x="198" y="1184" text-anchor="start" dominant-baseline="central">达到已确认门槛，明确未覆盖项；未达标退回候选，</text><text class="ts" x="198" y="1203" text-anchor="start" dominant-baseline="central">不以平均分掩盖安全退化</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-governance" data-step="SE-G8" aria-label="受控范围验证"><title>版本、车型、环境和观察窗口固定；真实车辆动作、回流和播报一起验证</title><rect x="180" y="1303" width="340" height="91" rx="6"/><text class="th" x="198" y="1327" text-anchor="start" dominant-baseline="central">受控范围验证</text><text class="ts" x="198" y="1355" text-anchor="start" dominant-baseline="central">版本、车型、环境和观察窗口固定；真实车辆动作、</text><text class="ts" x="198" y="1374" text-anchor="start" dominant-baseline="central">回流和播报一起验证</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-governance" data-step="SE-G9" aria-label="保留或停止回退"><title>获益稳定才扩大范围；异常停止；回退版本不自动撤销已执行动作</title><rect x="180" y="1474" width="340" height="91" rx="6"/><text class="th" x="198" y="1498" text-anchor="start" dominant-baseline="central">保留或停止回退</text><text class="ts" x="198" y="1526" text-anchor="start" dominant-baseline="central">获益稳定才扩大范围；异常停止；回退版本不自动撤</text><text class="ts" x="198" y="1545" text-anchor="start" dominant-baseline="central">销已执行动作</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-governance" data-step="SE-G10" aria-label="持续看复发与副作用"><title>原类问题是否复发、是否伤害邻近场景；把真实新证据送回下一轮分析</title><rect x="180" y="1645" width="340" height="91" rx="6"/><text class="th" x="198" y="1669" text-anchor="start" dominant-baseline="central">持续看复发与副作用</text><text class="ts" x="198" y="1697" text-anchor="start" dominant-baseline="central">原类问题是否复发、是否伤害邻近场景；把真实新证</text><text class="ts" x="198" y="1716" text-anchor="start" dominant-baseline="central">据送回下一轮分析</text></g><text class="th" x="40" y="1820" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1850" text-anchor="start" dominant-baseline="central">E1 收到问题或纠偏 → 关联完整证据：关联原请求</text><text class="ts" x="40" y="1883" text-anchor="start" dominant-baseline="central">E2 关联完整证据 → 定位根因归属：证据足够</text><text class="ts" x="40" y="1916" text-anchor="start" dominant-baseline="central">E3 定位根因归属 → 选择改动层级：责任明确</text><text class="ts" x="40" y="1949" text-anchor="start" dominant-baseline="central">E4 选择改动层级 → 形成可追溯候选：确定改变什么</text><text class="ts" x="40" y="1982" text-anchor="start" dominant-baseline="central">E5 形成可追溯候选 → 离线对照与回归：冻结候选版本</text><text class="ts" x="40" y="2015" text-anchor="start" dominant-baseline="central">E6 离线对照与回归 → 决定是否放行：提交对照报告</text><text class="ts" x="40" y="2048" text-anchor="start" dominant-baseline="central">E7 决定是否放行 → 形成可追溯候选：未过门槛：修改后重测</text><text class="ts" x="40" y="2081" text-anchor="start" dominant-baseline="central">E8 决定是否放行 → 受控范围验证：通过：按范围试运行〔规划/待核〕</text><text class="ts" x="40" y="2114" text-anchor="start" dominant-baseline="central">E9 受控范围验证 → 保留或停止回退：观察真实结果〔规划/待核〕</text><text class="ts" x="40" y="2147" text-anchor="start" dominant-baseline="central">E10 保留或停止回退 → 持续看复发与副作用：保留版本并观察〔规划/待核〕</text><text class="ts" x="40" y="2180" text-anchor="start" dominant-baseline="central">E11 持续看复发与副作用 → 关联完整证据：新问题进入下一轮〔规划/待核〕</text></svg>