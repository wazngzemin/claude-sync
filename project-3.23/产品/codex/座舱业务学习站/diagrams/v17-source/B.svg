="0">B01</tspan></text><text x="390" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="390" dy="0">产生当前车辆状态</tspan></text><text x="390" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="390" dy="0">车端信号源</tspan></text><text x="390" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="390" dy="0">已接入的车辆状态</tspan></text></g></a><a href="#module/B/step/B02"><g data-step="B02"><rect x="830" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="830" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="850" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="850" dy="0">B02</tspan></text><text x="850" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="850" dy="0">决定哪些视觉任务运行</tspan></text><text x="850" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="850" dy="0">AI-Box / AlwaysOn 设置</tspan></text><text x="850" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="850" dy="0">启用的视觉任务</tspan></text></g></a><a href="#module/B/step/B03"><g data-step="B03"><rect x="830" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="830" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="850" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="850" dy="0">B03</tspan></text><text x="850" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="850" dy="0">产生并接收视觉原始输出</tspan></text><text x="850" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="850" dy="0">VLM → AI Service</tspan></text><text x="850" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="850" dy="0">完整视觉输出包</tspan></text></g></a><a href="#module/B/step/B04"><g data-step="B04"><rect x="830" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="830" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="850" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="850" dy="0">B04</tspan></text><text x="850" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="850" dy="0">透传视觉输出</tspan></text><text x="850" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="850" dy="0">AI Service → 云端端状态</tspan></text><text x="850" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="850" dy="0">云端收到的视觉状态</tspan></text></g></a><a href="#module/B/step/B05"><g data-step="B05"><rect x="435" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">B05</tspan></text><text x="455" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">维护当前可用信息</tspan></text><text x="455" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">云端端状态</tspan></text><text x="455" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">仍有效的当前状态</tspan></text></g></a><a href="#module/B/step/B06"><g data-step="B06"><rect x="500" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">B06</tspan></text><text x="520" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">预注入本轮常用信息</tspan></text><text x="520" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">各上下文源 → Context</tspan></text><text x="520" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">本轮预注入上下文</tspan></text></g></a><a href="#module/B/step/B07"><g data-step="B07"><rect x="500" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="2163" font-size="13" fill="