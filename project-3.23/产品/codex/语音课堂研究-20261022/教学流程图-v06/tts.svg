<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="从回复文字到用户听见，中间还要过这些站" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-tts" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">从回复文字到用户听见，中间还要过这些站</text><text x="30" y="58" font-size="13" fill="#5f7169">TTS负责合成；车端播放器负责真正播放</text><g transform="translate(0,78)"><path class="flow-edge" data-from="text" data-to="audio" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-tts)"/><path class="flow-edge" data-from="audio" data-to="queue" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-tts)"/><path class="flow-edge" data-from="queue" data-to="fetch" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-tts)"/><path class="flow-edge" data-from="fetch" data-to="play" d="M700,260.0 L610,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-tts)"/><path class="flow-edge" data-from="play" data-to="axis" d="M370,260.0 L280,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-tts)"/><path class="flow-edge" data-from="axis" data-to="end" d="M160.0,306 L160.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-tts)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">适合说出的内容</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">音频及来源</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">采信后拉流</text><text x="655.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">可播放的音频</text><text x="325.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">实际播放进度</text><text x="169.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">持续记录状态</text><g class="flow-point" data-point="text" role="button" tabindex="0" aria-label="确定回复内容与表达方式"><rect x="40" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#86ada7">处理</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">确定回复内容与表达方式</text><text x="54" y="110" font-size="12" fill="#587266">普通回复、情感表达或唱歌</text></g><g class="flow-point" data-point="audio" role="button" tabindex="0" aria-label="相应能力生成音频"><rect x="370" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#86ada7">处理</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">相应能力生成音频</text><text x="384" y="110" font-size="12" fill="#587266">普通文本可走TTS</text></g><g class="flow-point" data-point="queue" role="button" tabindex="0" aria-label="按本轮采信来源取音频"><rect x="700" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#bb8932">判断</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">按本轮采信来源取音频</text><text x="714" y="110" font-size="12" fill="#587266">不是哪个来源先到就播谁</text></g><g class="flow-point" data-point="fetch" role="button" tabindex="0" aria-label="车端按标识拉取音频"><rect x="700" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#86ada7">处理</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">车端按标识拉取音频</text><text x="714" y="286" font-size="12" fill="#587266">收到分片仍不等于播放</text></g><g class="flow-point" data-point="play" role="button" tabindex="0" aria-label="播放器真实播放"><rect x="370" y="214" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#36835f">结果</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">播放器真实播放</text><text x="384" y="286" font-size="12" fill="#587266">用户此刻才听到</text></g><g class="flow-point" data-point="axis" role="button" tabindex="0" aria-label="记录实际播到哪里"><rect x="40" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#86ada7">处理</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">记录实际播到哪里</text><text x="54" y="286" font-size="12" fill="#587266">打轴：文字与播放进度对应</text></g><g class="flow-point" data-point="end" role="button" tabindex="0" aria-label="分清发完与播完"><rect x="40" y="390" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="54" y="411" font-size="11" fill="#bb8932">判断</text><text x="54" y="437" font-weight="700" font-size="16" fill="#203f35">分清发完与播完</text><text x="54" y="462" font-size="12" fill="#587266">网络结束不能冒充听完</text></g></g></svg>