<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="d2-fix-levers" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="d2-fix-levers-title d2-fix-levers-desc">
<title id="d2-fix-levers-title">改提示词、改示例、做 SFT，各修什么</title><desc id="d2-fix-levers-desc">先判断错误属于规则、具体问法还是大量同类问题；三种改法都要回到准出评测。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="d2-fix-levers-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">改提示词、改示例、做 SFT，各修什么</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先判断错误属于规则、具体问法还是大量同类问题；三种改法都要回到准出评测。</text>
<g data-node="true" id="d2-fix-levers-prompt"><rect class="v56-local" x="32" y="138" width="352" height="420" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="165" text-anchor="start">改提示词</text>
<text class="v56-node-sub" x="46" y="190" text-anchor="start">规则、工具描述</text>
</g>
<g data-node="true" id="d2-fix-levers-examples"><rect class="v56-decision" x="424" y="138" width="352" height="420" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="438" y="165" text-anchor="start">改示例</text>
<text class="v56-node-sub" x="438" y="190" text-anchor="start">静态示例、动态示例</text>
</g>
<g data-node="true" id="d2-fix-levers-sft"><rect class="v56-cloud" x="816" y="138" width="352" height="420" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="830" y="165" text-anchor="start">做 SFT（监督微调）</text>
<text class="v56-node-sub" x="830" y="190" text-anchor="start">用标好答案的样本训练模型</text>
</g>
<text class="v56-label" x="46" y="242" text-anchor="start">适合修什么</text>
<text class="v56-node-sub" x="46" y="268" text-anchor="start">规则说不清、工具说明有歧义</text>
<text class="v56-node-sub" x="46" y="289" text-anchor="start">例如：没等结果就说成功</text>
<text class="v56-label" x="46" y="338" text-anchor="start">多快见效</text>
<text class="v56-node-sub" x="46" y="364" text-anchor="start">三种改法中最快</text>
<text class="v56-node-sub" x="46" y="385" text-anchor="start">改完规则和描述后评测</text>
<text class="v56-label" x="46" y="434" text-anchor="start">副作用</text>
<text class="v56-node-sub" x="46" y="460" text-anchor="start">说明越写越长，会增加输入</text>
<text class="v56-node-sub" x="46" y="481" text-anchor="start">规则冲突也可能带偏其他场景</text>
<text class="v56-label" x="438" y="242" text-anchor="start">适合修什么</text>
<text class="v56-node-sub" x="438" y="268" text-anchor="start">具体问法容易选错工具</text>
<text class="v56-node-sub" x="438" y="289" text-anchor="start">适合低频、零散的错法</text>
<text class="v56-label" x="438" y="338" text-anchor="start">多快见效</text>
<text class="v56-node-sub" x="438" y="364" text-anchor="start">动态示例库可热更新</text>
<text class="v56-node-sub" x="438" y="385" text-anchor="start">静态示例随提示词更新</text>
<text class="v56-label" x="438" y="434" text-anchor="start">副作用</text>
<text class="v56-node-sub" x="438" y="460" text-anchor="start">示例必须匹配工具和车型</text>
<text class="v56-node-sub" x="438" y="481" text-anchor="start">带错示例，会把正确回答带偏</text>
<text class="v56-label" x="830" y="242" text-anchor="start">适合修什么</text>
<text class="v56-node-sub" x="830" y="268" text-anchor="start">大量同类错误</text>
<text class="v56-node-sub" x="830" y="289" text-anchor="start">也适合压缩提示词、提速</text>
<text class="v56-label" x="830" y="338" text-anchor="start">多快见效</text>
<text class="v56-node-sub" x="830" y="364" text-anchor="start">周期最长</text>
<text class="v56-node-sub" x="830" y="385" text-anchor="start">要准备样本、训练，再评测</text>
<text class="v56-label" x="830" y="434" text-anchor="start">副作用</text>
<text class="v56-node-sub" x="830" y="460" text-anchor="start">样本偏差可能被一起学进去</text>
<text class="v56-node-sub" x="830" y="481" text-anchor="start">训练后仍可能影响其他场景</text>
<g data-node="true" id="d2-fix-levers-evaluation"><rect class="v56-neutral" x="32" y="620" width="1136" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="647" text-anchor="start">改完都要回到准出评测</text>
<text class="v56-node-sub" x="46" y="672" text-anchor="start">看 14 项基础指标和关键场景；效果、速度分别评测，再决定是否上线。</text>
</g>
<path class="v56-arrow" d="M 208 558 L 208 620" marker-end="url(#d2-fix-levers-arr)"/>
<path class="v56-arrow" d="M 600 558 L 600 620" marker-end="url(#d2-fix-levers-arr)"/>
<path class="v56-arrow" d="M 992 558 L 992 620" marker-end="url(#d2-fix-levers-arr)"/>
<rect data-decoration="true" class="v56-local" x="32" y="738" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="752" text-anchor="start">蓝：规则与工具说明</text>
<rect data-decoration="true" class="v56-decision" x="310" y="738" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="338" y="752" text-anchor="start">黄：具体问法示范</text>
<rect data-decoration="true" class="v56-cloud" x="600" y="738" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628" y="752" text-anchor="start">绿：样本训练</text>
<rect data-decoration="true" class="v56-neutral" x="870" y="738" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="898" y="752" text-anchor="start">灰：共同评测</text>
</svg>
