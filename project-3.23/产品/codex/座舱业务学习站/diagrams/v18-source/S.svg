<svg xmlns="http://www.w3.org/2000/svg" width="1362" height="2778" viewBox="0 0 1362 2778" role="img" aria-label="Advisor 主动服务"><title>Advisor 主动服务</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M647,226 L647,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="550" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="555" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="555" dy="0">接收建议</tspan></text><path d="M647,644 L647,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="550" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="555" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="555" dy="0">通知与回流</tspan></text><path d="M647,1062 L647,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="550" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="555" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="555" dy="0">恢复建议输入</tspan></text><path d="M712,1480 L712,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="710" y="1576" width="190" height="44" rx="3" fill="#fff"/><text x="715" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="715" dy="0">首轮有有效话术且允许出卡</tspan></text><path d="M712,1898 L712,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="615" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="620" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="620" dy="0">下发即时卡</tspan></text><path d="M712,2316 L712,2552" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="615" y="2412" width="100" height="44" rx="3" fill="#fff"/><text x="620" y="2436" font-size="15" fill="#435c70" font-weight="400"><tspan x="620" dy="0">用户点击按钮</tspan></text><path d="M582,1480 L582,1518 L252,1518 L252,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="1576" width="220" height="44" rx="3" fill="#fff"/><text x="40" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">action_list 非空</tspan></text><path d="M712,2734 L712,2766 L982,2766 L982,1274 L647,1274 L647,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="989" y="2770" width="175" height="44" rx="3" fill="#fff"/><text x="994" y="2794" font-size="15" fill="#435c70" font-weight="400"><tspan x="994" dy="0">新 Query 再判断</tspan></text><a href="#module/S/step/S-1"><g data-step="S-1"><rect x="452" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="452" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="472" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="472" dy="0">S-1</tspan></text><text x="472" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="472" dy="0">向推荐入口交出建议</tspan></text><text x="472" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="472" dy="0">Advisor</tspan></text><text x="472" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="472" dy="0">建议、出卡配置、按钮列表</tspan></text></g></a><a href="#module/S/step/S-2"><g data-step="S-2"><rect x="452" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="452" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="472" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="472" dy="0">S-2</tspan></text><text x="472" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="472" dy="0">保存建议上下文并通知客户端</tspan></text><text x="472" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="472" dy="0">推荐服务</tspan></text><text x="472" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="472" dy="0">推荐标识</tspan></text></g></a><a href="#module/S/step/S-3"><g data-step="S-3"><rect x="452" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="452" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="472" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="472" dy="0">S-3</tspan></text><text x="472" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="472" dy="0">携推荐标识恢复本次建议</tspan></text><text x="472" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="472" dy="0">客户端 / 服务端入口</tspan></text><text x="472" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="472" dy="0">恢复好的建议输入与卡片配置</tspan></text></g></a><a href="#module/S/step/S-4"><g data-step="S-4"><rect x="452" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="452" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="472" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="472" dy="0">S-4</tspan></text><text x="472" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="472" dy="0">决定说什么和是否调用工具</tspan></text><text x="472" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="472" dy="0">Director</tspan></text><text x="472" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="472" dy="0">talk_content 与 action_list</tspan></text></g></a><a href="#module/S/step/S-5"><g data-step="S-5"><rect x="517" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="517" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="537" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="537" dy="0">S-5</tspan></text><text x="537" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="537" dy="0">只用首轮非空话术构建即时卡</tspan></text><text x="537" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="537" dy="0">卡片服务</tspan></text><text x="537" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="537" dy="0">带推荐 ID 的即时卡</tspan></text></g></a><a href="#module/S/step/S-6"><g data-step="S-6"><rect x="517" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="517" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="537" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="537" dy="0">S-6</tspan></text><text x="537" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="537" dy="0">显示卡片但不自动重复回流</tspan></text><text x="537" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="537" dy="0">客户端</tspan></text><text x="537" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="537" dy="0">用户看到建议与可选按钮</tspan></text></g></a><a href="#module/S/step/S-7"><g data-step="S-7"><rect x="517" y="2552" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="517" y="2552" width="5" height="182" rx="2" fill="#326785"/><text x="537" y="2581" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="537" dy="0">S-7</tspan></text><text x="537" y="2613" font-size="20" fill="#203b50" font-weight="600"><tspan x="537" dy="0">点击按钮形成新输入</tspan></text><text x="537" y="2655" font-size="16" fill="#375b71" font-weight="400"><tspan x="537" dy="0">用户 / 输入链路</tspan></text><text x="537" y="2694" font-size="16" fill="#566975" font-weight="400"><tspan x="537" dy="0">带用户选择的新 Query</tspan></text></g></a><a href="#module/S/step/S-8"><g data-step="S-8"><rect x="57" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="57" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="77" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="77" dy="0">S-8</tspan></text><text x="77" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="77" dy="0">按 action_list 执行并回传</tspan></text><text x="77" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="77" dy="0">工具执行链路</tspan></text><text x="77" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="77" dy="0">tool_feedback / 实际业务结果</tspan></text></g></a></g></svg>