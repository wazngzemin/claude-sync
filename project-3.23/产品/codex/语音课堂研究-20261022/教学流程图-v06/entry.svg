<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 419" width="980" height="419" role="img" aria-label="在听见之前，先确认此刻能不能接话" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="419" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-entry" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">在听见之前，先确认此刻能不能接话</text><text x="30" y="58" font-size="13" fill="#5f7169">车内入口 · 具体禁用条件与音区配置按车型</text><g transform="translate(0,78)"><path class="flow-edge" data-from="gate" data-to="mic" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-entry)"/><path class="flow-edge" data-from="gate" data-to="stop" d="M160.0,130 L160.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-entry)"/><path class="flow-edge" data-from="mic" data-to="zone" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-entry)"/><path class="flow-edge" data-from="zone" data-to="mode" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-entry)"/><path class="flow-edge" data-from="mode" data-to="listen" d="M700,260.0 L610,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-entry)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">允许</text><text x="169.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">不允许</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">处理后人声</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">音区有效</text><text x="655.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">满足入口规则</text><g class="flow-point" data-point="gate" role="button" tabindex="0" aria-label="现在允许交互吗"><rect x="40" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#bb8932">判断</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">现在允许交互吗</text><text x="54" y="110" font-size="12" fill="#587266">权限、通话、系统状态</text></g><g class="flow-point" data-point="mic" role="button" tabindex="0" aria-label="采集并处理声音"><rect x="370" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#86ada7">处理</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">采集并处理声音</text><text x="384" y="110" font-size="12" fill="#587266">降噪、回声消除</text></g><g class="flow-point" data-point="zone" role="button" tabindex="0" aria-label="确认说话音区"><rect x="700" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#bb8932">判断</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">确认说话音区</text><text x="714" y="110" font-size="12" fill="#587266">来自哪个座位、是否开启</text></g><g class="flow-point" data-point="stop" role="button" tabindex="0" aria-label="按原因提示或退出"><rect x="40" y="214" width="240" height="92" rx="13" fill="#fcece6" stroke="#bb7560" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#bb7560">分支</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">按原因提示或退出</text><text x="54" y="286" font-size="12" fill="#587266">不把所有限制都叫唤醒失败</text></g><g class="flow-point" data-point="mode" role="button" tabindex="0" aria-label="按唤醒模式接入"><rect x="700" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#86ada7">处理</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">按唤醒模式接入</text><text x="714" y="286" font-size="12" fill="#587266">普通唤醒／免唤醒</text></g><g class="flow-point" data-point="listen" role="button" tabindex="0" aria-label="进入这一次听音处理"><rect x="370" y="214" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#36835f">结果</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">进入这一次听音处理</text><text x="384" y="286" font-size="12" fill="#587266">后面开始识别与句末判断</text></g></g></svg>