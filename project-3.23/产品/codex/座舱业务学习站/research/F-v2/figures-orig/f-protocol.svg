<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" role="img" aria-label="三方 Agent 怎么回话：一次请求，一帧一帧回来"><title>三方 Agent 怎么回话：一次请求，一帧一帧回来</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="1000" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">三方 Agent 怎么回话：一次请求，一帧一帧回来</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左边座舱云，右边三方 Agent；协议 1.4 版，用美团订座套着讲</text><rect x="30" y="92" width="520" height="760" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">座舱云（调工具的服务）</text><rect x="690" y="92" width="520" height="760" rx="10" fill="#fdf2e6" fill-opacity=".35" stroke="#c8873a" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="704" y="116" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">三方 Agent</text><rect x="50" y="140" width="480" height="150" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="64" y="167" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">① 发出请求</text><text x="64" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这一轮的话：“帮我在附近那家本帮菜馆订座”</text><text x="64" y="213" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">话题和这一问的编号、协议版本</text><text x="64" y="234" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">历史对话、长短期记忆、车况、谁坐哪</text><text x="64" y="255" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">渠道、车型；位置和账号选填，订座要用位置</text><path d="M530,215 L710,215" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="590.3" y="190" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="620" y="206" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">一次请求</text><rect x="710" y="140" width="480" height="110" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="724" y="167" font-size="16" fill="#6a4314" font-weight="650" text-anchor="start">对方先回过程帧</text><text x="724" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只上屏：“正在为您查询...”</text><text x="724" y="213" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">过程帧是否播报，逐帧约定</text><rect x="710" y="290" width="480" height="190" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="724" y="317" font-size="16" fill="#6a4314" font-weight="650" text-anchor="start">最后一帧：结束标记必须有</text><text x="724" y="342" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">上屏的内容（文字或卡片）</text><text x="724" y="363" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">播报的内容：逐帧约定，正常由 Planner 汇总后说</text><text x="724" y="384" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">给 Planner 的内容：已提交，等商家确认</text><text x="724" y="405" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">出错时写错误码</text><path d="M950,250 L950,290" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M710,385 L530,385" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="596.475" y="360" width="47.05" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="620" y="376" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">收尾帧</text><rect x="50" y="330" width="480" height="150" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="64" y="357" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">② 收到收尾帧才算这次调用结束</text><text x="64" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">发给车上、写进历史都等这一帧</text><text x="64" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">上屏的直接去屏幕（O 章）</text><text x="64" y="424" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">给 Planner 的那段，变成工具反馈</text><rect x="50" y="520" width="480" height="110" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="64" y="547" font-size="16" fill="#22384a" font-weight="650" text-anchor="start">③ 交给 E 章和 M 章</text><text x="64" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具反馈经输入管理回到 Planner</text><text x="64" y="593" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">Planner 读完再决定说什么、要不要下一轮</text><path d="M290,480 L290,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="710" y="520" width="480" height="130" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="724" y="547" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">可选：办不了就主动退回</text><text x="724" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">回一个“降级”命令，交还座舱</text><text x="724" y="593" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">由座舱决定换谁来答</text><path d="M710,585 L530,585" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="50" y="680" width="480" height="150" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="64" y="707" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">用户打断了怎么办</text><text x="64" y="732" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">调用方发取消信号，再断开连接</text><text x="64" y="753" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">调工具的服务通知对方结束</text><text x="64" y="774" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已经生成的内容照样记进历史</text><path d="M530,755 L710,755" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="602.65" y="730" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="620" y="746" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">取消</text><rect x="710" y="680" width="480" height="150" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="724" y="707" font-size="16" fill="#6a4314" font-weight="650" text-anchor="start">还有两种回法</text><text x="724" y="732" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">卡片数据：交给车上按卡片编号渲染</text><text x="724" y="753" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">透传：原样转给车上对应的程序</text><text x="724" y="774" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（屏幕卡片选按钮就是这种回法）</text><rect x="30" y="880" width="1180" height="100" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="44" y="907" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">协议管不到的</text><text x="44" y="932" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">协议只保证“这次调用怎么开始、怎么结束”。最后一帧说“订座成功”，是对方写的；真没真成，要看对方的订单状态。</text><text x="44" y="953" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">失败原因要和服务商逐条约定，写进输入输出约定</text></g></svg>