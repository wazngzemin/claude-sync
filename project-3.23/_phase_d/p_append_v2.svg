<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 -20 1800 1800" font-family="Noto Sans SC, sans-serif">
  <!-- 补充区分区框（下移到 y=1400，避免盖住 P10/P11/P12） -->
  <rect x="40" y="1400" width="1760" height="240" rx="8" fill="#FAFBFC" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="1428" font-size="18" font-weight="bold" fill="#37474F">本次补充：配置平台产品口径（P13 到 P16），分别接回 P01、P11、P07、P08</text>
  <text x="60" y="1450" font-size="13" fill="#78909C">以下节点为 2.6 目标口径，不替代原图 P01 到 P12 的主配置流程；状态写在卡片要点里</text>

  <!-- 四个卡片一行 y=1470 -->
  <!-- P13 简单模式 vs 复杂模式（蓝底，接 P01） -->
  <rect x="60" y="1470" width="410" height="140" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="78" y="1495" font-size="16" font-weight="bold" fill="#1565C0">P13　简单模式与复杂模式</text>
  <text x="78" y="1518" font-size="13" fill="#37474F">简单条件：直接配动作，不用编排</text>
  <text x="78" y="1538" font-size="13" fill="#37474F">复杂场景：编排判断图，多步多分支</text>
  <text x="78" y="1558" font-size="13" fill="#37474F">模板只预填，仍须逐项核对</text>
  <text x="78" y="1578" font-size="13" fill="#37474F">普通场景或系统预设任务分开管</text>
  <text x="78" y="1608" font-size="13" fill="#E65100">【已落地】</text>

  <!-- P14 模板场景四类（蓝底，接 P11） -->
  <rect x="490" y="1470" width="410" height="140" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="508" y="1495" font-size="16" font-weight="bold" fill="#1565C0">P14　模板场景四类确认路径</text>
  <text x="508" y="1518" font-size="13" fill="#37474F">充电：前置判断→视觉问答→询问→开盖</text>
  <text x="508" y="1538" font-size="13" fill="#37474F">儿童/宠物：锁状态→用户确认</text>
  <text x="508" y="1558" font-size="13" fill="#37474F">后视镜/洗车退出：仍有待接项</text>
  <text x="508" y="1578" font-size="13" fill="#37474F">湿度/温差：10/9 版已删除</text>
  <text x="508" y="1608" font-size="13" fill="#E65100">【已落地 / 部分待接】</text>

  <!-- P15 发布三步校验（金底，接 P07） -->
  <rect x="920" y="1470" width="410" height="140" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.5"/>
  <text x="938" y="1495" font-size="16" font-weight="bold" fill="#E65100">P15　发布三步校验</text>
  <text x="938" y="1518" font-size="13" fill="#37474F">第一步：保存时校验能力、参数、对象</text>
  <text x="938" y="1538" font-size="13" fill="#37474F">第二步：注册时核对服务端是否注册成功</text>
  <text x="938" y="1558" font-size="13" fill="#37474F">第三步：目标范围校验，不支持的渠道拦截</text>
  <text x="938" y="1578" font-size="13" fill="#37474F">缺失信号不能带病发布</text>
  <text x="938" y="1608" font-size="13" fill="#C62828">【已落地】</text>

  <!-- P16 端侧统一配置（金底，接 P08） -->
  <rect x="1350" y="1470" width="410" height="140" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.5"/>
  <text x="1368" y="1495" font-size="16" font-weight="bold" fill="#E65100">P16　端侧统一配置下发</text>
  <text x="1368" y="1518" font-size="13" fill="#37474F">云端按发布版本加载场景</text>
  <text x="1368" y="1538" font-size="13" fill="#37474F">任务中心同步预设场景与用户开关</text>
  <text x="1368" y="1558" font-size="13" fill="#37474F">端侧统一配置下发属于后续建设</text>
  <text x="1368" y="1578" font-size="13" fill="#37474F">当前按车型逐款确认后开通</text>
  <text x="1368" y="1608" font-size="13" fill="#C62828">【2.6 目标 / 端云统一配置待建设】</text>
</svg>
