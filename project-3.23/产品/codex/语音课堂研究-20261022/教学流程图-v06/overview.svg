<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="一句“去昨天那家游泳馆”，完整经过哪些站" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-overview" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">一句“去昨天那家游泳馆”，完整经过哪些站</text><text x="30" y="58" font-size="13" fill="#5f7169">教学总览 · 本例走需要补信息的复杂请求</text><g transform="translate(0,78)"><path class="flow-edge" data-from="say" data-to="hear" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-overview)"/><path class="flow-edge" data-from="hear" data-to="understand" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-overview)"/><path class="flow-edge" data-from="understand" data-to="plan" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-overview)"/><path class="flow-edge" data-from="plan" data-to="do" d="M700,260.0 L610,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-overview)"/><path class="flow-edge" data-from="do" data-to="back" d="M370,260.0 L280,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-overview)"/><path class="flow-edge" data-from="back" data-to="plan" d="M160,214 L160,172 L820,172 L820,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-overview)"/><path class="flow-edge" data-from="back" data-to="reply" d="M160.0,306 L160.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-overview)"/><path class="flow-edge" data-from="reply" data-to="next" d="M280,436.0 L370,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-overview)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">声音</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">最终文字</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">需要补信息</text><text x="655.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">明确工具和参数</text><text x="325.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">实际执行结果</text><text x="490.0" y="163.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">还需要判断</text><text x="169.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">有结果可沟通</text><text x="325.0" y="427.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">继续对话</text><g class="flow-point" data-point="say" role="button" tabindex="0" aria-label="用户表达诉求"><rect x="40" y="38" width="240" height="92" rx="13" fill="#eaf1ff" stroke="#627fae" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#627fae">用户</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">用户表达诉求</text><text x="54" y="110" font-size="12" fill="#587266">去昨天那家游泳馆</text></g><g class="flow-point" data-point="hear" role="button" tabindex="0" aria-label="把声音听成文字"><rect x="370" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#86ada7">处理</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">把声音听成文字</text><text x="384" y="110" font-size="12" fill="#587266">ASR识别；VAD判断句末</text></g><g class="flow-point" data-point="understand" role="button" tabindex="0" aria-label="判断是否接话、怎么处理"><rect x="700" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#bb8932">判断</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">判断是否接话、怎么处理</text><text x="714" y="110" font-size="12" fill="#587266">有效请求进入对应能力</text></g><g class="flow-point" data-point="plan" role="button" tabindex="0" aria-label="先补地点，再决定动作"><rect x="700" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#86ada7">处理</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">先补地点，再决定动作</text><text x="714" y="286" font-size="12" fill="#587266">上下文 + Planner规划</text></g><g class="flow-point" data-point="do" role="button" tabindex="0" aria-label="交给工具真正办事"><rect x="370" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#86ada7">处理</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">交给工具真正办事</text><text x="384" y="286" font-size="12" fill="#587266">查记忆；地点明确后导航</text></g><g class="flow-point" data-point="back" role="button" tabindex="0" aria-label="带着真实结果继续判断"><rect x="40" y="214" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#bb8932">判断</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">带着真实结果继续判断</text><text x="54" y="286" font-size="12" fill="#587266">多个候选就问；失败就说明</text></g><g class="flow-point" data-point="reply" role="button" tabindex="0" aria-label="呈现结果并播放回复"><rect x="40" y="390" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="54" y="411" font-size="11" fill="#36835f">结果</text><text x="54" y="437" font-weight="700" font-size="16" fill="#203f35">呈现结果并播放回复</text><text x="54" y="462" font-size="12" fill="#587266">界面 + TTS + 车端播放</text></g><g class="flow-point" data-point="next" role="button" tabindex="0" aria-label="用户继续补充或插话"><rect x="370" y="390" width="240" height="92" rx="13" fill="#eaf1ff" stroke="#627fae" stroke-width="1.5"/><text x="384" y="411" font-size="11" fill="#627fae">用户</text><text x="384" y="437" font-weight="700" font-size="16" fill="#203f35">用户继续补充或插话</text><text x="384" y="462" font-size="12" fill="#587266">从新输入开始下一轮</text></g></g></svg>