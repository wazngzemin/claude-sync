<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="i2-resume-paths" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="i2-resume-paths-title i2-resume-paths-desc">
<title id="i2-resume-paths-title">插话以后，旧话怎么接回来</title><desc id="i2-resume-paths-desc">先暂停旧播报，再看新话接不接；断点续播与重新生成是两条不同的恢复路径。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="i2-resume-paths-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">插话以后，旧话怎么接回来</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先暂停旧播报，再看新话接不接；断点续播与重新生成是两条不同的恢复路径。</text>
<g data-node="true" data-key="pause">
<rect class="v56-neutral" x="386" y="120" width="428" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="400" y="147" text-anchor="start">播报中被插话 → 先暂停</text>
<text class="v56-node-sub" x="400" y="172" text-anchor="start">保留旧播报断点，等待新话的最终判断</text>
</g>
<path class="v56-arrow" d="M 600 208 L 600 242 L 212 242 L 212 254" fill="none"/>
<path class="v56-arrow v56-pending" d="M 600 242 L 600 254" fill="none"/>
<path class="v56-arrow" d="M 600 242 L 988 242 L 988 254" fill="none"/>
<path class="v56-arrow" d="M 212 292 L 212 304" fill="none" marker-end="url(#i2-resume-paths-arr)"/>
<path class="v56-arrow v56-pending" d="M 600 292 L 600 304" fill="none" marker-end="url(#i2-resume-paths-arr)"/>
<path class="v56-arrow" d="M 988 292 L 988 304" fill="none" marker-end="url(#i2-resume-paths-arr)"/>
<text class="v56-label" x="212" y="282" text-anchor="middle">新话被最终拒识</text>
<text class="v56-label" x="600" y="282" text-anchor="middle">新话被最终拒识 · 旧路径</text>
<text class="v56-label" x="988" y="282" text-anchor="middle">新话被接住</text>
<g data-node="true" data-key="continue">
<rect class="v56-local" x="32" y="304" width="360" height="176" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="331" text-anchor="start">从断点续播 · 现行</text>
<text class="v56-node-sub" x="46" y="356" text-anchor="start">车机继续播放原来的音频</text>
<text class="v56-node-sub" x="46" y="377" text-anchor="start">接着原句往下说</text>
<text class="v56-node-sub" x="46" y="398" text-anchor="start">无需 Planner 重新生成</text>
</g>
<g data-node="true" data-key="regenerate">
<rect class="v56-neutral v56-pending" x="420" y="304" width="360" height="176" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="434" y="331" text-anchor="start">恢复事件、重新生成 · 旧做法</text>
<text class="v56-node-sub" x="434" y="356" text-anchor="start">恢复事件交给 Planner 重新推理</text>
<text class="v56-node-sub" x="434" y="377" text-anchor="start">比断点续播慢</text>
<text class="v56-node-sub" x="434" y="398" text-anchor="start">重新生成的话可能与原来不同</text>
</g>
<g data-node="true" data-key="blend">
<rect class="v56-cloud" x="808" y="304" width="360" height="176" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="822" y="331" text-anchor="start">融合新话和未说的内容</text>
<text class="v56-node-sub" x="822" y="356" text-anchor="start">Planner 生成一段不重复的新回复</text>
<text class="v56-node-sub" x="822" y="377" text-anchor="start">按恢复价值判断决定是否补回</text>
<text class="v56-node-sub" x="822" y="398" text-anchor="start">可只补关键一句，或不恢复旧话</text>
</g>
<g data-node="true" data-key="never">
<rect class="v56-reject" x="32" y="560" width="1136" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="587" text-anchor="start">不恢复：单人打断、离线车控打断、永久中止</text>
<text class="v56-node-sub" x="46" y="612" text-anchor="start">上述情况不进入恢复；永久中止的播报不能复活</text>
</g>
<rect class="v56-local" x="32" y="714" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="728" text-anchor="start">蓝：原音频续播</text>
<rect class="v56-cloud" x="312" y="714" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="340" y="728" text-anchor="start">绿：融合后生成新回复</text>
<rect class="v56-reject" x="642" y="714" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="670" y="728" text-anchor="start">红：不恢复</text>
<rect class="v56-neutral v56-pending" x="32" y="762" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="776" text-anchor="start">灰色虚线：旧做法，非预研</text>
</svg>
