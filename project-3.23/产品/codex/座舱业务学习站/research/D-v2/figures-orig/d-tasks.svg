<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" role="img" aria-label="同样是交给 Planner 的一句话，四类任务怎么走" data-node-count="9">
  <title>同样是交给 Planner 的一句话，四类任务怎么走</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
    <path fill="#ffffff" d="M0,0 H1240 V860 H0 Z" data-decoration="true" />
    <text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">同样是交给 Planner 的一句话，四类任务怎么走</text>
    <text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">从左边的菱形开始；右半边是 Planner 交给任务系统、以后再叫回 Planner 的路</text>
    <polygon points="170,170.0 300.0,230 170,290.0 40.0,230" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true" />
    <text x="170" y="225" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">现在就能</text>
    <text x="170" y="245" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">办完吗？</text>
    <rect x="40" y="360" width="270" height="112" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <text x="54" y="387" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">即时任务</text>
    <text x="54" y="412" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一个动作：打开空调</text>
    <text x="54" y="433" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一句拆多个：我好热 →</text>
    <text x="54" y="454" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">开空调、调温度、调风量</text>
    <path d="M170,290 L170,360" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M183.825,315 H206.175 V336 H183.825 Z" data-decoration="true" />
    <text x="195" y="331" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">能</text>
    <polygon points="175,522.0 310.0,580 175,638.0 40.0,580" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true" />
    <text x="175" y="575" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">要等上一步</text>
    <text x="175" y="595" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">的结果吗？</text>
    <path d="M175,472 L175,522" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="40" y="690" width="290" height="112" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <text x="54" y="717" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">即时任务的多步办法</text>
    <text x="54" y="742" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">查记忆 → 搜餐厅 → 用户选</text>
    <text x="54" y="763" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">每一步结果回来再发下一步</text>
    <path d="M175,638 L175,690" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M188.825,653 H211.175 V674 H188.825 Z" data-decoration="true" />
    <text x="200" y="669" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">要</text>
    <path d="M310,580 L350,580 L350,430 L310,430" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M299.425,490 H420.575 V511 H299.425 Z" data-decoration="true" />
    <text x="360" y="506" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">不要：同一轮一起发</text>
    <path d="M300,230 L450,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M357.65,205 H392.35 V226 H357.65 Z" data-decoration="true" />
    <text x="375" y="221" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">不能</text>
    <rect x="450" y="160" width="340" height="140" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6" data-node="true" />
    <text x="464" y="187" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">定时 / 条件 / 持续任务</text>
    <text x="464" y="212" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">十分钟后关座椅加热</text>
    <text x="464" y="233" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车内超过 28 度让我凉快一下</text>
    <text x="464" y="254" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">路上帮我介绍沿途风景</text>
    <polygon points="620,340.0 760.0,400 620,460.0 480.0,400" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true" />
    <text x="620" y="395" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">条件和动作</text>
    <text x="620" y="415" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">合理吗？</text>
    <path d="M620,300 L620,340" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="840" y="345" width="360" height="110" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true" />
    <text x="854" y="372" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">不合理：不登记</text>
    <text x="854" y="397" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">聊天说明原因</text>
    <text x="854" y="418" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">如“世界毁灭时打开空调”</text>
    <path d="M760,400 L840,400" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M788.825,375 H811.175 V396 H788.825 Z" data-decoration="true" />
    <text x="800" y="391" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">否</text>
    <rect x="450" y="520" width="340" height="112" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <text x="464" y="547" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">Planner 调任务工具登记</text>
    <text x="464" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">动作可以是模糊的，</text>
    <text x="464" y="593" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">到点时再结合车况决定怎么做</text>
    <path d="M620,460 L620,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M633.825,480 H656.175 V501 H633.825 Z" data-decoration="true" />
    <text x="645" y="496" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">是</text>
    <rect x="840" y="520" width="360" height="112" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" />
    <text x="854" y="547" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">任务系统（T 章）</text>
    <text x="854" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">解析条件、登记触发</text>
    <text x="854" y="593" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">Planner 自己不会到点醒来</text>
    <path d="M790,576 L840,576" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path d="M1020,520 L1020,470 L1215,470 L1215,120 L170,120 L170,170" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M499.75,95 H880.25 V116 H499.75 Z" data-decoration="true" />
    <text x="690" y="111" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">条件触发：任务原文 + 条件已触发，作为系统建议送回 Planner</text>
    <text x="464" y="707" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">登记前 Planner 必查的五件事</text>
    <text x="464" y="732" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">1 条件能不能被感知（副驾吃没吃饭感知不到）</text>
    <text x="464" y="753" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">3 动作是否符合价值观</text>
    <text x="464" y="774" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">5 条件和动作是否矛盾（车内超 40℃ 时空调调到最高）</text>
    <text x="850" y="732" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">2 条件有没有可能发生（外面 200℃）</text>
    <text x="850" y="753" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">4 动作能不能执行（空调调到 50℃）</text>
    <text x="32" y="842" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start">绿：现在办理或登记　　橙：以后办理　　黄：条件判断　　红：拒绝不合理任务　　白：任务系统　　虚线箭头：触发回流</text>
  </g>
</svg>
