<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1300" viewBox="0 0 1240 1300" role="img" aria-label="DT 每想一次之前：Context 要做的 8 步"><title>DT 每想一次之前：Context 要做的 8 步</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="1300" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">DT 每想一次之前：Context 要做的 8 步</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">中间一列是云端 Context，按编号读；左边是车上一直在上报的材料，右边是 DT</text><rect x="20" y="92" width="270" height="1180" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="34" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上（一直在上报）</text><rect x="310" y="92" width="560" height="1180" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="324" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端 Context（推理前组装）</text><rect x="890" y="92" width="330" height="1180" rx="10" fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="904" y="116" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">云端 DT（豆包的大脑）</text><rect x="36" y="270" width="238" height="76" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="50" y="297" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">刚发生的事</text><text x="50" y="322" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">手动调空调、上下车等</text><rect x="36" y="450" width="238" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="50" y="477" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车辆状态</text><text x="50" y="502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">空调、车窗、导航、</text><text x="50" y="523" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">音乐等的最新值</text><rect x="36" y="570" width="238" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="50" y="597" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车里看到的情况</text><text x="50" y="622" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上视觉模型的描述</text><text x="50" y="643" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（赛力斯有，上汽只有人名）</text><rect x="36" y="690" width="238" height="76" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="50" y="717" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">谁坐在哪</text><text x="50" y="742" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人脸识别的乘客列表</text><rect x="330" y="130" width="520" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="350" cy="152" r="12" fill="#4a9670"/><text x="350" y="157" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="370" y="157" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">接住这一轮输入</text><text x="344" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">上一章输入管理交来：说的话、谁说的、</text><text x="344" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">坐哪、几点说的、离上一句多久</text><path d="M590,230 L590,270" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="270" width="520" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="350" cy="292" r="12" fill="#4a9670"/><text x="350" y="297" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="370" y="297" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">取历史输入</text><text x="344" y="322" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">30 分钟内最多 5 轮对话和工具结果</text><text x="344" y="343" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">被拒识的话、触发风控的轮次剔除</text><path d="M590,370 L590,410" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="410" width="520" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="350" cy="432" r="12" fill="#4a9670"/><text x="350" y="437" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="370" y="437" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">带上对话摘要</text><text x="344" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">从第 3 轮起把这次用车的对话滚动压缩</text><text x="344" y="483" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">有新的人上车，清掉敏感内容（开发中）</text><path d="M590,510 L590,550" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="550" width="520" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="350" cy="572" r="12" fill="#4a9670"/><text x="350" y="577" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="370" y="577" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">取“现在”的事实</text><text x="344" y="602" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">常用车辆状态固定带，其余按这句话筛</text><text x="344" y="623" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">天气日历位置；车里情况以人脸结果为准</text><path d="M590,650 L590,690" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="690" width="520" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="350" cy="712" r="12" fill="#4a9670"/><text x="350" y="717" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="370" y="717" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">取“长期”的事实</text><text x="344" y="742" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上坐着的人的画像固定带</text><text x="344" y="763" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按这句话推出标签，召回相关记忆</text><path d="M590,790 L590,830" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="830" width="520" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="350" cy="852" r="12" fill="#4a9670"/><text x="350" y="857" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="370" y="857" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">取“知识”</text><text x="344" y="882" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车书问答、参考示例、场景知识</text><text x="344" y="903" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">各取最像的几条，不够像就不带</text><text x="860" y="118" font-size="13" fill="#1d4b35" font-weight="600" text-anchor="end">步骤 2–6 同时进行，各源自己筛</text><path d="M274,308 L330,320" fill="none" stroke="#4f7ea9" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M274,498 L330,585" fill="none" stroke="#4f7ea9" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M274,618 L330,610" fill="none" stroke="#4f7ea9" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M274,718 L330,630" fill="none" stroke="#4f7ea9" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M274,740 L330,740" fill="none" stroke="#4f7ea9" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="150" y="830" font-size="13" fill="#1f4565" font-weight="500" text-anchor="middle">虚线：车上材料进入哪一步</text><text x="150" y="850" font-size="13" fill="#1f4565" font-weight="500" text-anchor="middle">（事件混进历史，人脸也决定画像）</text><rect x="905" y="640" width="300" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><circle cx="925" cy="662" r="12" fill="#98a3ad"/><text x="925" y="667" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="945" y="667" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">拼进 DT 的输入</text><text x="919" y="692" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">固定说明 + 这些材料</text><text x="919" y="713" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一次发给 DT 推理</text><path d="M850,880 L872,880 L872,695 L905,695" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="854.65" y="785" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="872" y="801" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">交出</text><polygon points="1020,810.0 1130.0,860 1020,910.0 910.0,860" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="1020" y="865" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">材料够吗？</text><path d="M1020,750 L1020,810" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1090" y="960" width="120" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1104" y="987" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">自己去查</text><text x="1104" y="1012" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">记忆、车况、</text><text x="1104" y="1033" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">画面</text><path d="M1130,860 L1150,860 L1150,960" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1162.65" y="885" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="1180" y="901" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">不够</text><path d="M1210,1015 L1216,1015 L1216,670 L1205,670" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="1200" y="1095" font-size="12" fill="#4b5560" font-weight="500" text-anchor="end">结果作为工具反馈</text><text x="1200" y="1112" font-size="12" fill="#4b5560" font-weight="500" text-anchor="end">进下一轮推理</text><rect x="905" y="1150" width="300" height="100" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="919" y="1177" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">回答或动手</text><text x="919" y="1202" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">播报、调用工具</text><text x="919" y="1223" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（工具结果回来也会再推理）</text><path d="M1020,910 L1020,935 L960,935 L960,1150" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="928.825" y="1035" width="22.35" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="940" y="1051" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">够</text><rect x="330" y="1150" width="520" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="350" cy="1172" r="12" fill="#4a9670"/><text x="350" y="1177" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">8</text><text x="370" y="1177" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">写回这一轮</text><text x="344" y="1202" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说了什么、调了什么工具、结果如何</text><text x="344" y="1223" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">拒识记成人人对话；风控轮下次不带</text><path d="M905,1200 L850,1200" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="860.15" y="1179.0" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="877.5" y="1195.0" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">结束</text><path d="M330,1220 L305,1220 L305,300 L330,300" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="300" y="1255" font-size="13" fill="#1d4b35" font-weight="600" text-anchor="end">成为下一句的历史</text></g></svg>