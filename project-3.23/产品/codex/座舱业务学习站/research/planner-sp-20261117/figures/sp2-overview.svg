<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="sp2-overview" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="sp2-overview-title sp2-overview-desc">
<title id="sp2-overview-title">Planner 这一轮怎样读系统提示词</title><desc id="sp2-overview-desc">本轮输入带来新问题或变化；固定部分和每轮注入一起约束四项输出。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="sp2-overview-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">Planner 这一轮怎样读系统提示词</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">本轮输入带来新问题或变化；固定部分和每轮注入一起约束四项输出。</text>
<text class="v56-label" x="32" y="122" text-anchor="start">本轮发生了什么</text>
<text class="v56-label" x="340" y="108" text-anchor="start">系统提示词</text>
<text class="v56-label" x="888" y="244" text-anchor="start">这一轮交出什么</text>
<g data-node="true" id="sp2-overview-input"><rect class="v56-local" x="32" y="242" width="250" height="206" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="270" text-anchor="start">本轮输入 · 4 类</text>
<text class="v56-node-sub" x="46" y="298" text-anchor="start">用户说话</text>
<text class="v56-node-sub" x="46" y="322" text-anchor="start">Advisor 建议</text>
<text class="v56-node-sub" x="46" y="346" text-anchor="start">工具回执</text>
<text class="v56-node-sub" x="46" y="370" text-anchor="start">事件：已经发生的变化</text>
</g>
<g data-node="true" id="sp2-overview-fixed"><rect class="v56-cloud" x="340" y="126" width="490" height="242" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="354" y="154" text-anchor="start">固定部分 · 定规矩、教做法</text>
<text class="v56-node-sub" x="354" y="182" text-anchor="start">身份与输入说明；输出格式；6 条注意事项</text>
<text class="v56-node-sub" x="354" y="206" text-anchor="start">28 个固定工具；24 个参考示例块</text>
<text class="v56-node-sub" x="354" y="230" text-anchor="start">49 条表情；能力边界与用车安全</text>
<text class="v56-node-sub" x="354" y="254" text-anchor="start">其他知识；唤醒词；聊天风格</text>
<text class="v56-node-sub" x="354" y="278" text-anchor="start">安全加固插槽嵌在其他知识段</text>
</g>
<g data-node="true" id="sp2-overview-dynamic"><rect class="v56-cloud" x="340" y="472" width="490" height="216" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="354" y="500" text-anchor="start">尾部 · 每轮注入的 11 个插槽</text>
<text class="v56-node-sub" x="354" y="528" text-anchor="start">成员身份、相关记忆、用户画像</text>
<text class="v56-node-sub" x="354" y="552" text-anchor="start">车端状态、近期事件历史、日期节日天气</text>
<text class="v56-node-sub" x="354" y="576" text-anchor="start">专业知识、场景示例、基础车辆问答</text>
<text class="v56-node-sub" x="354" y="600" text-anchor="start">当前页可操作项、临时工具</text>
<text class="v56-node-sub" x="354" y="624" text-anchor="start">事件历史 ≠ 本轮事件</text>
</g>
<text class="v56-node-title" x="438" y="408" text-anchor="start">Planner 按本轮条件判断</text>
<g data-node="true" id="sp2-overview-output"><rect class="v56-decision" x="888" y="272" width="280" height="176" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="902" y="300" text-anchor="start">四项输出</text>
<text class="v56-node-sub" x="902" y="328" text-anchor="start">说不说；说什么</text>
<text class="v56-node-sub" x="902" y="352" text-anchor="start">表情：可以为空</text>
<text class="v56-node-sub" x="902" y="376" text-anchor="start">动作列表：可以为空</text>
</g>
<g data-node="true" id="sp2-overview-execute"><rect class="v56-local" x="888" y="520" width="280" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="902" y="548" text-anchor="start">工具执行</text>
<text class="v56-node-sub" x="902" y="576" text-anchor="start">有动作才执行</text>
<text class="v56-node-sub" x="902" y="600" text-anchor="start">返回实际结果</text>
</g>
<path class="v56-arrow" d="M 282 430 L 888 430" marker-end="url(#sp2-overview-arr)"/>
<path class="v56-arrow" d="M 585 368 L 585 386" marker-end="url(#sp2-overview-arr)"/>
<path class="v56-arrow" d="M 585 472 L 585 434" marker-end="url(#sp2-overview-arr)"/>
<path class="v56-arrow" d="M 1028 448 L 1028 520" marker-end="url(#sp2-overview-arr)"/>
<text class="v56-label" x="1044" y="488" text-anchor="start">动作</text>
<path class="v56-arrow" d="M 1028 626 L 1028 740 L 157 740 L 157 448" marker-end="url(#sp2-overview-arr)"/>
<text class="v56-label" x="372" y="726" text-anchor="start">工具回执作为下一轮输入回来</text>
<path class="v56-rule" d="M 32 792 L 1168 792"/>
<text class="v56-node-title" x="32" y="828" text-anchor="start">固定部分定规矩，注入部分给现场，示例教做法。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="856" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="870" text-anchor="start">蓝：输入、执行与回执</text>
<rect data-decoration="true" class="v56-cloud" x="410.6666666666667" y="856" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="870" text-anchor="start">绿：提示词内容</text>
<rect data-decoration="true" class="v56-decision" x="789.3333333333334" y="856" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="870" text-anchor="start">黄：本轮输出</text>
</svg>
