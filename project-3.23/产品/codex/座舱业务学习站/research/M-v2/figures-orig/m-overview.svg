<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1210" viewBox="0 0 1240 1210" role="img" aria-label="输入管理：一条输入从到达到交给 Planner，再到“这一轮真正结束”"><title>输入管理：一条输入从到达到交给 Planner，再到“这一轮真正结束”</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8" /></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="1210" fill="#ffffff" data-background="true" /><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start" id="m-overview-text-1">输入管理：一条输入从到达到交给 Planner，再到“这一轮真正结束”</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start" id="m-overview-text-2">左列是车上，中间是云端输入管理（在座舱云服务里），右列是 C 章补背景和 Planner；按圆圈编号 1–6、6b 读</text><path fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" d="M20.0 92.0H320.0V1142.0H20.0Z" data-container="true" /><text x="34" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start" id="m-overview-text-3">车上（车机客户端）</text><path fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" d="M340.0 92.0H900.0V1142.0H340.0Z" data-container="true" /><text x="354" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-overview-text-4">云端：输入管理</text><path fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" d="M920.0 92.0H1220.0V1142.0H920.0Z" data-container="true" /><text x="934" y="116" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start" id="m-overview-text-5">云端：Context 与 Planner</text><rect x="36" y="130" width="268" height="282" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true" /><text x="50" y="157" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start" id="m-overview-text-6">用户说话（每个座位一条）</text><text x="50" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-7">已过拒识和端云仲裁</text><path d="M304,160 L360,160" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><text x="50" y="231" font-size="14" fill="#22384a" font-weight="650" text-anchor="start" id="m-overview-text-8">主动建议 / 任务到点</text><text x="50" y="256" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-9">主动服务、任务系统</text><path d="M304,234 L360,234" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><text x="50" y="305" font-size="14" fill="#22384a" font-weight="650" text-anchor="start" id="m-overview-text-10">工具结果</text><text x="50" y="330" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-11">同一轮工具全部返回后</text><path d="M304,308 L360,308" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><text x="50" y="379" font-size="14" fill="#22384a" font-weight="650" text-anchor="start" id="m-overview-text-12">事件</text><text x="50" y="404" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-13">如：播报被闲聊打断</text><path d="M304,382 L360,382" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="360" y="128" width="520" height="296" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><circle cx="380" cy="150" r="12" fill="#4a9670" /><text x="380" y="155" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" id="m-overview-text-14">1</text><text x="400" y="155" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-overview-text-15" /><text x="400" y="155" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-overview-text-16">报上名来：统一成“标准输入”</text><text x="378" y="190" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-17">记下：从哪来、哪一次（同一次说话不重复收）</text><text x="378" y="220" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-18">贴上优先级：用户说话最高（P0），其他普通（P1）</text><text x="378" y="250" font-size="13" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-19">贴上能否合并：用户的话、建议、事件可合并；工具结果单独处理</text><text x="378" y="280" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-20">只整理格式，不调模型、不猜用户意思</text><text x="378" y="330" font-size="14" fill="#1d4b35" font-weight="600" text-anchor="start" id="m-overview-text-21">例：主驾“找附近的充电站”、续航提醒、副驾“要快充”</text><text x="378" y="356" font-size="14" fill="#1d4b35" font-weight="600" text-anchor="start" id="m-overview-text-22">各成一条输入，各自带来源和时间</text><text x="378" y="400" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-overview-text-23">交给下一步：一条带身份的输入</text><path d="M620,424 L620,450" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="360" y="450" width="520" height="120" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><circle cx="380" cy="472" r="12" fill="#4a9670" /><text x="380" y="477" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" id="m-overview-text-24">2</text><text x="400" y="477" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-overview-text-25">看现在忙不忙（对话状态）</text><text x="374" y="502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-26">空闲 / 处理中（还没出字）/ 输出中（出字或在播）</text><text x="374" y="523" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-27">另记一笔：这一轮的工具发出去了没有</text><path d="M620,570 L620,596" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="360" y="596" width="520" height="150" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><circle cx="380" cy="618" r="12" fill="#4a9670" /><text x="380" y="623" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" id="m-overview-text-28">3</text><text x="400" y="623" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-overview-text-29">决定谁先进 Planner（准入）</text><text x="374" y="648" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-30">立即处理 ／ 打断后合并重推</text><text x="374" y="669" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-31">打断、只处理新话（旧的当背景）</text><text x="374" y="690" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-32">排队等这一轮说完</text><text x="374" y="711" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-33">详见“准入一张表”</text><path d="M620,746 L620,772" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="360" y="772" width="520" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><circle cx="380" cy="794" r="12" fill="#4a9670" /><text x="380" y="799" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" id="m-overview-text-34">4</text><text x="400" y="799" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-overview-text-35">组装这一轮要交的输入</text><text x="374" y="824" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-36">多条输入放进同一个数组，各带来源</text><text x="374" y="845" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-37">被打断时附上“说到哪了”</text><path d="M880,800 L940,800" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="940" y="772" width="264" height="152" rx="8" fill="#f6f7f8" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="954" y="803" font-size="14" fill="#22384a" font-weight="650" text-anchor="start" id="m-overview-text-38">本轮输入 → 补背景（C 章）</text><text x="954" y="862" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start" id="m-overview-text-39">Planner 推理（D 章）</text><text x="954" y="891" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-40">决定说什么、调什么工具</text><path d="M1010,924 L1010,960 L880,960" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><path fill="#ffffff" fill-opacity=".92" d="M903.7 938.0H1016.3000000000001V958.0H903.7Z" data-container="true" data-label="true" /><text x="960" y="953" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle" id="m-overview-text-41">文字 / 工具调用</text><rect x="360" y="900" width="520" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><circle cx="380" cy="922" r="12" fill="#4a9670" /><text x="380" y="927" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" id="m-overview-text-42">5</text><text x="400" y="927" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-overview-text-43">放行前核身份</text><text x="374" y="952" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-44">失效那次推理的话和工具一律拦下</text><text x="374" y="973" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-45">工具一放行，旧输入就不能再整体重推</text><path d="M360,948 L304,948" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="36" y="900" width="268" height="226" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true" /><circle cx="56" cy="922" r="12" fill="#4f7ea9" /><text x="56" y="927" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" id="m-overview-text-46">6</text><text x="76" y="927" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start" id="m-overview-text-47">车上播报、执行</text><text x="50" y="952" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-48">报：开始播、进度、</text><text x="50" y="973" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-49">播完、被永久停止</text><path d="M304,1016 L340,1016 L340,1060 L360,1060" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><text x="332" y="1008" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle" id="m-overview-text-50">播放回执</text><rect x="360" y="1030" width="520" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><circle cx="380" cy="1052" r="12" fill="#4a9670" /><text x="380" y="1057" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" id="m-overview-text-51">6b</text><text x="400" y="1057" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-overview-text-52">播完才算结束 → 叫下一位</text><text x="374" y="1082" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-53">车上报播完，或以“播放状态超时”结束，再取下一批</text><text x="374" y="1103" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-54">没有排队的，回到空闲</text><path d="M880,1078 L900,1078 L900,700 L880,700" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" /><text x="50" y="1067" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start" id="m-overview-text-55">旁路：车上自己办完了</text><text x="50" y="1092" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-56">带原编号告诉云端，</text><text x="50" y="1113" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-overview-text-57">云端结束这条、不再回复</text><path d="M304,1100 L360,1100" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><circle cx="39" cy="1181.0" r="7" fill="#eaf2fb" stroke="#4f7ea9" /><text x="53" y="1186.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-overview-text-58">蓝：车上输入与执行</text><circle cx="209" cy="1181.0" r="7" fill="#eaf6ef" stroke="#4a9670" /><text x="223" y="1186.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-overview-text-59">绿：云端输入管理</text><circle cx="379" cy="1181.0" r="7" fill="#f6f7f8" stroke="#98a3ad" /><text x="393" y="1186.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-overview-text-60">灰：补背景与推理</text></g></svg>
