<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="d2-talk-act" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="d2-talk-act-title d2-talk-act-desc">
<title id="d2-talk-act-title">先说过渡，结果回来再确认</title><desc id="d2-talk-act-desc">说话和执行可以同时推进；同一轮多个工具的结果等齐后，再统一交代。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="d2-talk-act-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">先说过渡，结果回来再确认</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">说话和执行可以同时推进；同一轮多个工具的结果等齐后，再统一交代。</text>
<text class="v56-label" x="32" y="132" text-anchor="start">时间向右推进 →</text>
<text class="v56-label" x="168" y="157" text-anchor="start">第一轮</text>
<text class="v56-label" x="526" y="157" text-anchor="start">执行期间</text>
<text class="v56-label" x="884" y="157" text-anchor="start">第二轮</text>
<text class="v56-node-title" x="58" y="236" text-anchor="start">说</text>
<text class="v56-node-title" x="58" y="446" text-anchor="start">做</text>
<g data-node="true" id="d2-talk-act-transition"><rect class="v56-local" x="168" y="184" width="280" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="182" y="211" text-anchor="start">过渡话术</text>
<text class="v56-node-sub" x="182" y="236" text-anchor="start">“先帮你把空调打开，</text>
<text class="v56-node-sub" x="182" y="257" text-anchor="start">再找找附近的咖啡店。”</text>
</g>
<g data-node="true" id="d2-talk-act-wait"><rect class="v56-decision" x="526" y="184" width="280" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="540" y="211" text-anchor="start">等结果</text>
<text class="v56-node-sub" x="540" y="236" text-anchor="start">不提前声称“已经开好了”</text>
</g>
<g data-node="true" id="d2-talk-act-report"><rect class="v56-cloud" x="884" y="184" width="280" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="898" y="211" text-anchor="start">统一交代</text>
<text class="v56-node-sub" x="898" y="236" text-anchor="start">空调已开、风量已调；</text>
<text class="v56-node-sub" x="898" y="257" text-anchor="start">推荐能停车的两家，等用户选</text>
</g>
<g data-node="true" id="d2-talk-act-dispatch"><rect class="v56-local" x="168" y="394" width="280" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="182" y="421" text-anchor="start">动作下发</text>
<text class="v56-node-sub" x="182" y="446" text-anchor="start">四个互不依赖的动作一起发</text>
</g>
<g data-node="true" id="d2-talk-act-execute"><rect class="v56-local" x="526" y="394" width="280" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="540" y="421" text-anchor="start">工具执行</text>
<text class="v56-node-sub" x="540" y="446" text-anchor="start">开空调、调风量、查询等</text>
</g>
<g data-node="true" id="d2-talk-act-return"><rect class="v56-cloud" x="884" y="394" width="280" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="898" y="421" text-anchor="start">结果回来</text>
<text class="v56-node-sub" x="898" y="446" text-anchor="start">同一轮多个工具，等结果都回来</text>
</g>
<path class="v56-arrow" d="M 448 244 L 526 244" marker-end="url(#d2-talk-act-arr)"/>
<path class="v56-arrow" d="M 806 244 L 884 244" marker-end="url(#d2-talk-act-arr)"/>
<path class="v56-arrow" d="M 448 443 L 526 443" marker-end="url(#d2-talk-act-arr)"/>
<path class="v56-arrow" d="M 806 443 L 884 443" marker-end="url(#d2-talk-act-arr)"/>
<path class="v56-arrow" d="M 1024 394 L 1024 304" marker-end="url(#d2-talk-act-arr)"/>
<text class="v56-label" x="1040" y="356" text-anchor="start">读齐再说</text>
<g data-node="true" id="d2-talk-act-wrong"><rect class="v56-reject" x="526" y="594" width="638" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="540" y="621" text-anchor="start">错误做法：提前说成功</text>
<text class="v56-node-sub" x="540" y="646" text-anchor="start">动作还没回结果，就说“已经开好了”。</text>
</g>
<text class="v56-label" x="168" y="543" text-anchor="start">结果回来后，对照用户目标，再决定怎么答。</text>
<text class="v56-subtitle" x="32" y="710" text-anchor="start">下一轮的话，要等车上上一轮播完才能发。</text>
<rect data-decoration="true" class="v56-local" x="32" y="738" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="752" text-anchor="start">蓝：开始说或开始做</text>
<rect data-decoration="true" class="v56-decision" x="310" y="738" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="338" y="752" text-anchor="start">黄：等待</text>
<rect data-decoration="true" class="v56-cloud" x="490" y="738" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="518" y="752" text-anchor="start">绿：读结果后交代</text>
<rect data-decoration="true" class="v56-reject" x="800" y="738" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="828" y="752" text-anchor="start">红：提前声称成功</text>
</svg>
