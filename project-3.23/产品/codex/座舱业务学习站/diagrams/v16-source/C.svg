<svg xmlns="http://www.w3.org/2000/svg" width="887" height="2778" viewBox="0 0 887 2778" role="img" aria-label="Context 上下文"><title>Context 上下文</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M237,226 L237,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="140" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="145" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="145" dy="0">来源更新</tspan></text><path d="M237,644 L237,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="125" y="740" width="115" height="44" rx="3" fill="#fff"/><text x="130" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="130" dy="0">常用数据预注入</tspan></text><path d="M237,1062 L237,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="140" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="145" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="145" dy="0">背景已就绪</tspan></text><path d="M237,1480 L237,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="140" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="145" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="145" dy="0">仍有信息缺口</tspan></text><path d="M237,1898 L237,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="140" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="145" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="145" dy="0">对应工具检索</tspan></text><path d="M237,2316 L237,2552" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="2412" width="205" height="44" rx="3" fill="#fff"/><text x="40" y="2436" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">tool_feedback</tspan></text><path d="M432,2706 L507,2706 L507,1741 L432,1741" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="514" y="2684" width="115" height="44" rx="3" fill="#fff"/><text x="519" y="2708" font-size="15" fill="#435c70" font-weight="400"><tspan x="519" dy="0">还需另一项信息</tspan></text><a href="#module/C/step/C01"><g data-step="C01"><rect x="42" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="42" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="62" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="62" dy="0">C01</tspan></text><text x="62" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="62" dy="0">持续产生上下文来源</tspan></text><text x="62" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="62" dy="0">车端与业务服务</tspan></text><text x="62" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="62" dy="0">端状态、感知、事件、历史与记忆</tspan></text></g></a><a href="#module/C/step/C02"><g data-step="C02"><rect x="42" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="42" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="62" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="62" dy="0">C02</tspan></text><text x="62" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="62" dy="0">维护各自负责的信息</tspan></text><text x="62" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="62" dy="0">Context 及各数据源</tspan></text><text x="62" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="62" dy="0">可被查询的上下文内容</tspan></text></g></a><a href="#module/C/step/C03"><g data-step="C03"><rect x="42" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="42" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="62" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="62" dy="0">C03</tspan></text><text x="62" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="62" dy="0">把常用背景先交给 Planner</tspan></text><text x="62" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="62" dy="0">Context</tspan></text><text x="62" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="62" dy="0">本轮提示词所需的常用背景变量</tspan></text></g></a><a href="#module/C/step/C04"><g data-step="C04"><rect x="42" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="42" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="62" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="62" dy="0">C04</tspan></text><text x="62" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="62" dy="0">检查现有信息够不够</tspan></text><text x="62" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="62" dy="0">Planner</tspan></text><text x="62" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="62" dy="0">直接处理决定，或具体检索需求</tspan></text></g></a><a href="#module/C/step/C05"><g data-step="C05"><rect x="42" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="42" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="62" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="62" dy="0">C05</tspan></text><text x="62" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="62" dy="0">按缺失内容调用对应查询</tspan></text><text x="62" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="62" dy="0">Planner → 检索工具</tspan></text><text x="62" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="62" dy="0">带具体查询目的的工具调用</tspan></text></g></a><a href="#module/C/step/C06"><g data-step="C06"><rect x="42" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="42" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="62" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="62" dy="0">C06</tspan></text><text x="62" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="62" dy="0">返回查询结果或明确空结果</tspan></text><text x="62" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="62" dy="0">数据源与工具</tspan></text><text x="62" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="62" dy="0">本次查询的结果</tspan></text></g></a><a href="#module/C/step/C07"><g data-step="C07"><rect x="42" y="2552" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="42" y="2552" width="5" height="182" rx="2" fill="#326785"/><text x="62" y="2581" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="62" dy="0">C07</tspan></text><text x="62" y="2613" font-size="20" fill="#203b50" font-weight="600"><tspan x="62" dy="0">用新事实继续判断</tspan></text><text x="62" y="2655" font-size="16" fill="#375b71" font-weight="400"><tspan x="62" dy="0">Planner</tspan></text><text x="62" y="2694" font-size="16" fill="#566975" font-weight="400"><tspan x="62" dy="0">有依据的下一步动作或问题</tspan></text></g></a></g></svg>