<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="同一句话，判断了四次：过程文字时间线"><title>同一句话，判断了四次：过程文字时间线</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="640" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">同一句话，判断了四次：过程文字时间线</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">例子：车上两个人，豆包正在介绍餐厅，主驾说“帮我把副驾座椅加热打开”（示意，每次返回几个字并不固定）</text><rect x="30" y="96" width="1140" height="92" rx="10" fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="120" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">豆包的播报</text><rect x="160" y="122" width="380" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="174" y="149" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">“找到三家餐厅，第一家是……”</text><rect x="560" y="122" width="160" height="50" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="574" y="149" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">停播</text><text x="740" y="152" font-size="14" fill="#4b5560" font-weight="400" text-anchor="start">主驾继续说完，豆包安静听</text><rect x="30" y="204" width="1140" height="150" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="228" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">识别服务陆续送回的字（同一句话的四个时间点）</text><rect x="60" y="244" width="250" height="88" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="74" y="271" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">第 1 次（过程文字）</text><text x="74" y="296" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“帮我”</text><rect x="340" y="244" width="250" height="88" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="354" y="271" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">第 2 次（过程文字）</text><text x="354" y="296" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“帮我把副驾”</text><rect x="620" y="244" width="250" height="88" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="634" y="271" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">第 3 次（过程文字）</text><text x="634" y="296" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“帮我把副驾座椅加热”</text><rect x="900" y="244" width="250" height="88" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="914" y="271" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">说完后（定稿文字）</text><text x="914" y="296" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“帮我把副驾座椅加热打开”</text><path d="M310,288 L340,288" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M590,288 L620,288" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M870,288 L900,288" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="370" width="1140" height="180" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="394" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">每来一次字，判断一次</text><rect x="60" y="410" width="250" height="112" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="74" y="437" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">信息不够</text><text x="74" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只有两个字，还看不出</text><text x="74" y="483" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">在跟谁说 → 再等等</text><path d="M260,332 L260,410" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="340" y="410" width="250" height="112" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="354" y="437" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">判为“对豆包说”</text><text x="354" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">有请求的说法，像在下指令</text><text x="354" y="483" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">→ 通知车上停播</text><path d="M540,332 L540,410" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="620" y="410" width="250" height="112" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="634" y="437" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">播报已停，继续收音</text><text x="634" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">主驾接着把话说完</text><text x="634" y="483" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">识别继续出字</text><path d="M820,332 L820,410" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="900" y="410" width="250" height="112" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="914" y="437" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">整句再把一次关</text><text x="914" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">云端拒识模型用定稿文字</text><text x="914" y="483" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">确认 → 交给后面的步骤</text><path d="M1100,332 L1100,410" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M590,466 L605,466 L605,172" fill="none" stroke="#c45c5c" stroke-width="1.8" marker-end="url(#arr)"/><rect x="575.3" y="357" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="605" y="373" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">停播通知</text><rect x="30" y="566" width="1140" height="56" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="593" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start">读图要点</text><text x="44" y="618" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">前三次用的是还会变的字，只决定“豆包要不要先闭嘴”；这句话最后办不办，由第四次用定稿文字决定。</text></g></svg>