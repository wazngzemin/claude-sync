 fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="40" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">触发回调</tspan></text><path d="M1213,226 L1213,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1116" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="1121" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="1121" dy="0">满足执行前提</tspan></text><path d="M1311,226 L1311,264 L1478,264 L1478,1654 L1343,1654 L1343,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1476" y="949" width="100" height="44" rx="3" fill="#fff"/><text x="1481" y="973" font-size="15" fill="#435c70" font-weight="400"><tspan x="1481" dy="0">跳过本轮</tspan></text><path d="M1213,644 L1213,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1086" y="740" width="130" height="44" rx="3" fill="#fff"/><text x="1091" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="1091" dy="0">任务关联与上下文</tspan></text><path d="M1213,1062 L1213,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1101" y="1158" width="115" height="44" rx="3" fill="#fff"/><text x="1106" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="1106" dy="0">工具/内容结果</tspan></text><path d="M1213,1480 L1213,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1116" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="1121" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="1121" dy="0">结果回写</tspan></text><path d="M1213,1898 L1213,1936 L1000,1936 L1000,2082 L540,2082 L540,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="903" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="908" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="908" dy="0">周期目标继续</tspan></text><path d="M883,1898 L883,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="786" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="791" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="791" dy="0">创建通知</tspan></text><path d="M1343,1898 L1343,2092 L981,2092 L981,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1231" y="1994" width="115" height="44" rx="3" fill="#fff"/><text x="1236" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="1236" dy="0">运行/关闭通知</tspan></text><path d="M423,1898 L423,1936 L425,1936 L425,2092 L786,2092 L786,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="313" y="1994" width="115" height="44" rx="3" fill="#fff"/><text x="318" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="318" dy="0">修改/取消通知</tspan></text><path d="M293,1898 L293,2072 L384,2072 L384,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="196" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="201" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="201" dy="0">更新后的规则</tspan></text><a href="#module/T/step/T01"><g data-step="T01"><rect x="493" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="493" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="513" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="513" dy="0">T01</tspan></text><text x="513" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="513" dy="0">转交需要等待的用户目标</tspan></text><text x="513" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="513" dy="0">Planner → 任务入口</tspan></text><text x="513" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="513" dy="0">用户目标及身份范围</tspan></text></g></a><a href="#module/T/step/T02"><g data-step="T02"><rect x="493" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="493" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="513" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="513" dy="0">T02</tspan></text><text x="513" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="513" dy="0">理解创建、修改或取消</tspan></text><text x="513" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="513" dy="0">TaskService</tspan></text><text x="513" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="513" dy="0">任务定义或已有任务操作</tspan></text></g></a><a href="#module/T/step/T03"><g data-step="T03"><rect x="558" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="558" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="578" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="578" dy="0">T03</tspan></text><text x="578" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="578" dy="0">校验并保存任务</tspan></text><text x="578" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="578" dy="0">TaskService</tspan></text><text x="578" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="578" dy="0">等待中的 Task</tspan></text></g></a><a href="#module/T/step/T04"><g data-step="T04"><rect x="623" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="623" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="643" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="643" dy="0">T04</tspan></text><text x="643" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="643" dy="0">注册时间或条件规则</tspan></text><text x="643" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="643" dy="0">TaskService → Trigger</tspan></text><text x="643" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="643" dy="0">有效规则与创建结果</tspan></text></g></a><a href="#module/T/step/T05"><g data-step="T05"><rect x="228" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="228" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="248" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="248" dy="0">T05</tspan></text><text x="248" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="248" dy="0">到点或条件命中</tspan></text><text x="248" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="248" dy="0">Trigger → TaskService</tspan></text><text x="248" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="248" dy="0">关联任务的触发回调</tspan></text></g></a><a href="#module/T/step/T06"><g data-step="T06"><rect x="1018" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1018" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="1038" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1038" dy="0">T06</tspan></text><text x="1038" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="1038" dy="0">检查本轮能否执行</tspan></text><text x="1038" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="1038" dy="0">TaskService</tspan></text><text x="1038" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="1038" dy="0">运行中的 Run 或跳过结果</tspan></text></g></a><a href="#module/T/step/T07"><g data-step="T07"><rect x="1018" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1018" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="1038" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1038" dy="0">T07</tspan></text><text x="1038" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="1038" dy="0">让任务重新进入主对话</tspan></text><text x="1038" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="1038" dy="0">Recommend / Frontier → 车端 → 主链路</tspan></text><text x="1038" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="1038" dy="0">带任务关联的新一轮输入</tspan></text></g></a><a href="#module/T/step/T08"><g data-step="T08"><rect x="1018" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1018" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="1038" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1038" dy="0">T08</tspan></text><text x="1038" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="1038" dy="0">结合当前上下文执行本轮</tspan></text><text x="1038" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="1038" dy="0">Planner → Agent / Tool</tspan></text><text x="1038" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="1038" dy="0">执行决定及工具请求</tspan></text></g></a><a href="#module/T/step/T09"><g data-step="T09"><rect x="1018" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1018" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="1038" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1038" dy="0">T09</tspan></text><text x="1038" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="1038" dy="0">把本轮实际结果写回</tspan></text><text x="1038" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="1038" dy="0">主链路 → TaskService</tspan></text><text x="1038" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="1038" dy="0">本轮成功、失败等结果</tspan></text></g></a><a href="#module/T/step/T10"><g data-step="T10"><rect x="1083" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1083" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="1103" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1103" dy="0">T10</tspan></text><text x="1103" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="1103" dy="0">决定继续等待还是结束</tspan></text><text x="1103" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="1103" dy="0">TaskService</tspan></text><text x="1103" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="1103" dy="0">等待或关闭状态</tspan></text></g></a><a href="#module/T/step/T11"><g data-step="T11"><rect x="163" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="163" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="183" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="183" dy="0">T11</tspan></text><text x="183" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="183" dy="0">更新或取消已有目标</tspan></text><text x="183" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="183" dy="0">TaskService → Trigger</tspan></text><text x="183" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="183" dy="0">更新结果或关闭结果</tspan></text></g></a><a href="#module/T/step/T12"><g data-step="T12"><rect x="688" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="688" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="708" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="708" dy="0">T12</tspan></text><text x="708" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="708" dy="0">通知并查询当前任务状态</tspan></text><text x="708" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="708" dy="0">TaskService → 车端</tspan></text><text x="708" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="708" dy="0">用户可见的任务状态</tspan></text></g></a></g></svg>