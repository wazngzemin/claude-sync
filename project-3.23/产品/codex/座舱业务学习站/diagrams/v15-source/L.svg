<svg xmlns="http://www.w3.org/2000/svg" width="1243" height="2360" viewBox="0 0 1243 2360" role="img" aria-label="端侧触发与本地闭环"><title>端侧触发与本地闭环</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M943,226 L943,264 L388,264 L388,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="291" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="296" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="296" dy="0">允许运行</tspan></text><path d="M453,644 L453,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="356" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="361" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="361" dy="0">下发指令</tspan></text><path d="M453,1062 L453,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="356" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="361" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="361" dy="0">指令接收成功</tspan></text><path d="M518,1480 L518,1654 L848,1654 L848,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="421" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="426" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="426" dy="0">控制通道</tspan></text><path d="M388,1480 L388,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="291" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="296" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="296" dy="0">数据通道</tspan></text><path d="M783,1898 L783,1936 L613,1936 L613,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="516" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="521" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="521" dy="0">实际运行结果</tspan></text><path d="M483,2134 L483,2072 L162,2072 L162,682 L323,682 L323,644" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="1367" width="130" height="44" rx="3" fill="#fff"/><text x="40" y="1391" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">周期任务到下一轮</tspan></text><path d="M1073,226 L1073,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="976" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="981" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="981" dy="0">关闭或下电</tspan></text><path d="M913,1898 L913,2072 L943,2072 L943,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="801" y="1994" width="115" height="44" rx="3" fill="#fff"/><text x="806" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="806" dy="0">收到已停止回调</tspan></text><a href="#module/L/step/L-1"><g data-step="L-1"><rect x="813" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="813" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="833" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="833" dy="0">L-1</tspan></text><text x="833" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="833" dy="0">改变本地感知运行条件</tspan></text><text x="833" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="833" dy="0">电源 / 用户开关</tspan></text><text x="833" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="833" dy="0">运行条件变化</tspan></text></g></a><a href="#module/L/step/L-2"><g data-step="L-2"><rect x="193" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="193" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="213" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="213" dy="0">L-2</tspan></text><text x="213" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="213" dy="0">根据注册条件组织任务</tspan></text><text x="213" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="213" dy="0">端侧触发器</tspan></text><text x="213" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="213" dy="0">VLM 启停或推理指令</tspan></text></g></a><a href="#module/L/step/L-3"><g data-step="L-3"><rect x="258" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="258" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="278" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="278" dy="0">L-3</tspan></text><text x="278" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="278" dy="0">立即返回指令是否送达</tspan></text><text x="278" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="278" dy="0">VLM SDK</tspan></text><text x="278" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="278" dy="0">同步接收状态</tspan></text></g></a><a href="#module/L/step/L-4"><g data-step="L-4"><rect x="258" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="258" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="278" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="278" dy="0">L-4</tspan></text><text x="278" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="278" dy="0">取得画面并运行模型</tspan></text><text x="278" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="278" dy="0">VLM SDK</tspan></text><text x="278" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="278" dy="0">原始视觉结果与运行状态</tspan></text></g></a><a href="#module/L/step/L-5"><g data-step="L-5"><rect x="653" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="653" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="673" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="673" dy="0">L-5</tspan></text><text x="673" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="673" dy="0">回传任务实际工作状态</tspan></text><text x="673" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="673" dy="0">控制通道 → 端侧触发器</tspan></text><text x="673" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="673" dy="0">更新任务状态表</tspan></text></g></a><a href="#module/L/step/L-6"><g data-step="L-6"><rect x="193" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="193" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="213" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="213" dy="0">L-6</tspan></text><text x="213" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="213" dy="0">发布完整视觉输出</tspan></text><text x="213" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="213" dy="0">数据通道 → 数据中心</tspan></text><text x="213" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="213" dy="0">带任务与时间的视觉数据</tspan></text></g></a><a href="#module/L/step/L-7"><g data-step="L-7"><rect x="353" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="353" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="373" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="373" dy="0">L-7</tspan></text><text x="373" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="373" dy="0">按任务类型续接或结束</tspan></text><text x="373" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="373" dy="0">端侧触发器</tspan></text><text x="373" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="373" dy="0">任务继续、停止或异常状态</tspan></text></g></a><a href="#module/L/step/L-8"><g data-step="L-8"><rect x="813" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="813" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="833" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="833" dy="0">L-8</tspan></text><text x="833" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="833" dy="0">停止条件出现后确认停机</tspan></text><text x="833" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="833" dy="0">端侧触发器 / SDK</tspan></text><text x="833" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="833" dy="0">已停止状态</tspan></text></g></a></g></svg>