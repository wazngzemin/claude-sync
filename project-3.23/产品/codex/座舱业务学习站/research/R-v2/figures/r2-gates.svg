<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="r2-gates" width="1200" height="1310" viewBox="0 0 1200 1310" role="img" aria-labelledby="r2-gates-title r2-gates-desc">
<title id="r2-gates-title">一句话要过七道门</title><desc id="r2-gates-desc">前一道通过，只能进入下一道判断；停播、接话都不等于可以执行。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="r2-gates-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一句话要过七道门</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">前一道通过，只能进入下一道判断；停播、接话都不等于可以执行。</text>
<text class="v56-label" x="32" y="118" text-anchor="start">每道门：谁判断 → 输出什么 → 下一步</text>
<text class="v56-label" x="812" y="118" text-anchor="start">插话例子：“帮我把副驾座椅加热打开”</text>
<g data-node="true">
<rect class="v56-decision" x="32" y="148" width="738" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="175" text-anchor="start" data-fit="true">1 · 提前上云（attend）</text>
<text class="v56-node-sub" x="46" y="200" text-anchor="start" data-fit="true">谁：车上的 1.7B 模型，读过程文字</text>
<text class="v56-node-sub" x="46" y="221" text-anchor="start" data-fit="true">输出：attend，开始上传音频、启动在线 ASR</text>
<text class="v56-node-sub" x="46" y="242" text-anchor="start" data-fit="true">通过后：进入停播判断</text>
</g>
<text class="v56-node-title" x="812" y="185" text-anchor="start">已激活，沿用上云链路</text>
<text class="v56-node-sub" x="812" y="212" text-anchor="start">这句话继续传给云端</text>
<path class="v56-arrow" d="M 401 266 L 401 296" fill="none" marker-end="url(#r2-gates-arr)"/>
<g data-node="true">
<rect class="v56-decision" x="32" y="296" width="738" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="323" text-anchor="start" data-fit="true">2 · 停播</text>
<text class="v56-node-sub" x="46" y="348" text-anchor="start" data-fit="true">谁：流式拒识，边听边判断</text>
<text class="v56-node-sub" x="46" y="369" text-anchor="start" data-fit="true">输出：召回则停播；IGNORE 则继续等字</text>
<text class="v56-node-sub" x="46" y="390" text-anchor="start" data-fit="true">通过后：用户说完，再判断整句接不接</text>
</g>
<text class="v56-node-title" x="812" y="333" text-anchor="start">召回，先停下旧播报</text>
<text class="v56-node-sub" x="812" y="360" text-anchor="start">尚不能打开座椅加热</text>
<path class="v56-arrow" d="M 401 414 L 401 444" fill="none" marker-end="url(#r2-gates-arr)"/>
<g data-node="true">
<rect class="v56-decision" x="32" y="444" width="738" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="471" text-anchor="start" data-fit="true">3 · 接不接</text>
<text class="v56-node-sub" x="46" y="496" text-anchor="start" data-fit="true">谁：云端最终拒识，读定稿文字和历史</text>
<text class="v56-node-sub" x="46" y="517" text-anchor="start" data-fit="true">输出：接或不接；不接则清空这句话的上屏文字</text>
<text class="v56-node-sub" x="46" y="538" text-anchor="start" data-fit="true">通过后：检查车上能不能办</text>
</g>
<text class="v56-node-title" x="812" y="481" text-anchor="start">整句判断：接</text>
<text class="v56-node-sub" x="812" y="508" text-anchor="start">继续判断由谁来办</text>
<path class="v56-arrow" d="M 401 562 L 401 592" fill="none" marker-end="url(#r2-gates-arr)"/>
<g data-node="true">
<rect class="v56-local" x="32" y="592" width="738" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="619" text-anchor="start" data-fit="true">4 · 车上能不能办</text>
<text class="v56-node-sub" x="46" y="644" text-anchor="start" data-fit="true">谁：固定说法规则 / 车上的 1.7B 模型</text>
<text class="v56-node-sub" x="46" y="665" text-anchor="start" data-fit="true">输出：固定说法命中 / 函数和参数 / reject / unsupported</text>
<text class="v56-node-sub" x="46" y="686" text-anchor="start" data-fit="true">通过后：把本地结果交给端云仲裁</text>
</g>
<text class="v56-node-title" x="812" y="629" text-anchor="start">假设固定说法未命中</text>
<text class="v56-node-sub" x="812" y="656" text-anchor="start">端侧车控 FC 给出函数和参数</text>
<path class="v56-arrow" d="M 401 710 L 401 740" fill="none" marker-end="url(#r2-gates-arr)"/>
<g data-node="true">
<rect class="v56-decision" x="32" y="740" width="738" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="767" text-anchor="start" data-fit="true">5 · 采用哪一边</text>
<text class="v56-node-sub" x="46" y="792" text-anchor="start" data-fit="true">谁：端云仲裁，结合两边结果与网络状态</text>
<text class="v56-node-sub" x="46" y="813" text-anchor="start" data-fit="true">输出：本轮采用车上或云端；固定说法可抢跑</text>
<text class="v56-node-sub" x="46" y="834" text-anchor="start" data-fit="true">通过后：采用结果驱动上屏和执行</text>
</g>
<text class="v56-node-title" x="812" y="777" text-anchor="start">网络正常，采用云端</text>
<text class="v56-node-sub" x="812" y="804" text-anchor="start">车上的模型候选只作兜底</text>
<path class="v56-arrow" d="M 401 858 L 401 888" fill="none" marker-end="url(#r2-gates-arr)"/>
<g data-node="true">
<rect class="v56-neutral" x="32" y="888" width="738" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="915" text-anchor="start" data-fit="true">6 · 显示什么</text>
<text class="v56-node-sub" x="46" y="940" text-anchor="start" data-fit="true">谁：上屏，按最终采用侧刷新文字</text>
<text class="v56-node-sub" x="46" y="961" text-anchor="start" data-fit="true">输出：与实际采用侧一致的识别文字</text>
<text class="v56-node-sub" x="46" y="982" text-anchor="start" data-fit="true">通过后：保持显示与执行结果一致</text>
</g>
<text class="v56-node-title" x="812" y="925" text-anchor="start">显示云端识别的定稿</text>
<text class="v56-node-sub" x="812" y="952" text-anchor="start">对象：副驾座椅加热</text>
<path class="v56-arrow" d="M 401 1006 L 401 1036" fill="none" marker-end="url(#r2-gates-arr)"/>
<g data-node="true">
<rect class="v56-neutral" x="32" y="1036" width="738" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="1063" text-anchor="start" data-fit="true">7 · 真的执行</text>
<text class="v56-node-sub" x="46" y="1088" text-anchor="start" data-fit="true">谁：车上执行器，落实已采用的车控动作</text>
<text class="v56-node-sub" x="46" y="1109" text-anchor="start" data-fit="true">输出：实际执行结果</text>
<text class="v56-node-sub" x="46" y="1130" text-anchor="start" data-fit="true">完成后：将实际发生的结果回写</text>
</g>
<text class="v56-node-title" x="812" y="1073" text-anchor="start">打开副驾座椅加热</text>
<text class="v56-node-sub" x="812" y="1100" text-anchor="start">记录实际执行结果</text>
<text class="v56-subtitle" x="32" y="1228" text-anchor="start">箭头表示业务判断的先后；车上和云端可以同时准备结果，固定说法命中可直接执行。</text>
<rect class="v56-decision" x="32" y="1256" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="1270" text-anchor="start">黄：判断与采信</text>
<rect class="v56-local" x="292" y="1256" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="320" y="1270" text-anchor="start">蓝：车上处理</text>
<rect class="v56-neutral" x="532" y="1256" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="560" y="1270" text-anchor="start">灰：显示与实际动作</text>
</svg>
