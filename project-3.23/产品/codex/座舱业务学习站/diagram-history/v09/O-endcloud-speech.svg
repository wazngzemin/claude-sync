  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">回答文字与声音怎样汇合</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,258 350,324" marker-end="url(#arrow-O-endcloud-speech)"><title>OC1 → OC2：文字返回分支</title></polyline><polyline class="arr" fill="none" points="350,467 350,533" marker-end="url(#arrow-O-endcloud-speech)"><title>OC2 → OC3：文字与关联信息到端</title></polyline><polyline class="arr" fill="none" points="176,150 50,150 50,837 170,837" marker-end="url(#arrow-O-endcloud-speech)"><title>OC1 → OC4：并行提交 TTS；不等待文字显示完成</title></polyline><polyline class="arr" fill="none" points="350,885 350,951" marker-end="url(#arrow-O-endcloud-speech)"><title>OC4 → OC5：返回合成音频分片</title></polyline><polyline class="arr" fill="none" points="176,587 70,587 70,1274 170,1274" marker-end="url(#arrow-O-endcloud-speech)"><title>OC3 → OC6：拿到关联标识后发起取流；不是等整段音频完成</title></polyline><polyline class="arr" fill="none" points="350,1094 350,1160" marker-end="url(#arrow-O-endcloud-speech)"><title>OC5 → OC6：取流请求消费对应的流式缓存</title></polyline><polyline class="arr" fill="none" points="350,1322 350,1388" marker-end="url(#arrow-O-endcloud-speech)"><title>OC6 → OC7：返回音频分片及结束信息</title></polyline><polyline class="arr" fill="none" points="350,1531 350,1597" marker-end="url(#arrow-O-endcloud-speech)"><title>OC7 → OC8：符合当时播放/打断策略后边收边播</title></polyline><text class="ts" x="365" y="294" text-anchor="start" dominant-baseline="central">E1 · 文字返回分支</text><text class="ts" x="365" y="503" text-anchor="start" dominant-baseline="central">E2 · 文字与关联信息到端</text><text class="ts" x="168" y="142" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="168" y="849" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="365" y="921" text-anchor="start" dominant-baseline="central">E4 · 返回合成音频分片</text><text class="ts" x="168" y="579" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="168" y="1286" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="365" y="1130" text-anchor="start" dominant-baseline="central">E6 · 取流请求消费对应的流式缓存</text><text class="ts" x="365" y="1358" text-anchor="start" dominant-baseline="central">E7 · 返回音频分片及结束信息</text><text class="ts" x="365" y="1567" text-anchor="start" dominant-baseline="central">E8 · 符合当时播放/打断策略后边收边播</text><g class="c-gray" role="link" tabindex="0" data-page="O" data-flow="O-endcloud-speech" data-step="OC1" aria-label="AIDV 准备待播报文字与关联标识"><title>回答文本需要配对应的 tts_audio_id，即取回这段播报音频的关联标识。；文本返回与语音合成分别推进；不能混淆成一个完成状态。</title><rect x="180" y="106" width="340" height="148" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">AIDV 准备待播报文字与关联标识</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">回答文本需要配对应的 tts_audio_id，即取回这段</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central">播报音频的关联标识。</text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="215" text-anchor="start" dominant-baseline="central">文本返回与语音合成分别推进；不能混淆成一个完成</text><text class="ts" x="198" y="234" text-anchor="start" dominant-baseline="central">状态。</text></g><text class="anno" x="540" y="130" text-anchor="start" dominant-baseline="central">同一回答分成两</text><text class="anno" x="540" y="149" text-anchor="start" dominant-baseline="central">路</text><text class="anno" x="540" y="180" text-anchor="start" dominant-baseline="central">E3 · 并行提交 </text><text class="anno" x="540" y="199" text-anchor="start" dominant-baseline="central">TTS；不等待文字</text><text class="anno" x="540" y="218" text-anchor="start" dominant-baseline="central">显示完成</text><g class="c-teal" role="link" tabindex="0" data-page="O" data-flow="O-endcloud-speech" data-step="OC2" aria-label="文字及关联标识经豆包下行"><title>AIDV → 豆包 → 客户端。；客户端通过 SSE 接收文字回复及关联信息；SSE 在这里是文字结果的持续下行通道。</title><rect x="180" y="334" width="340" height="129" rx="6"/><text class="th" x="198" y="358" text-anchor="start" dominant-baseline="central">文字及关联标识经豆包下行</text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central">AIDV → 豆包 → 客户端。</text><text class="ts" x="198" y="405" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="424" text-anchor="start" dominant-baseline="central">客户端通过 SSE 接收文字回复及关联信息；SSE 在</text><text class="ts" x="198" y="443" text-anchor="start" dominant-baseline="central">这里是文字结果的持续下行通道。</text></g><g class="c-teal" role="link" tabindex="0" data-page="O" data-flow="O-endcloud-speech" data-step="OC3" aria-label="车端拿到文字和取音频所需信息"><title>拿到回答字，不表示音频已经到达或已经播放。；后面凭关联标识请求对应音频，不重新把这段字送回 Planner 生成一遍。</title><rect x="180" y="543" width="340" height="129" rx="6"/><text class="th" x="198" y="567" text-anchor="start" dominant-baseline="central">车端拿到文字和取音频所需信息</text><text class="ts" x="198" y="595" text-anchor="start" dominant-baseline="central">拿到回答字，不表示音频已经到达或已经播放。</text><text class="ts" x="198" y="614" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="633" text-anchor="start" dominant-baseline="central">后面凭关联标识请求对应音频，不重新把这段字送回 </text><text class="ts" x="198" y="652" text-anchor="start" dominant-baseline="central">Planner 生成一遍。</text></g><text class="anno" x="540" y="567" text-anchor="start" dominant-baseline="central">E5 · 拿到关联标</text><text class="anno" x="540" y="586" text-anchor="start" dominant-baseline="central">识后发起取流；</text><text class="anno" x="540" y="605" text-anchor="start" dominant-baseline="central">不是等整段音频</text><text class="anno" x="540" y="624" text-anchor="start" dominant-baseline="central">完成</text><g class="c-teal" role="link" tabindex="0" data-page="O" data-flow="O-endcloud-speech" data-step="OC4" aria-label="Speech 将待播报文字合成为音频"><title>AIDV 向 Speech 提交文字，获得 TTS 音频分片。；TTS 是文字转语音，不负责判断用户目标是否真正完成。</title><rect x="180" y="752" width="340" height="129" rx="6"/><text class="th" x="198" y="776" text-anchor="start" dominant-baseline="central">Speech 将待播报文字合成为音频</text><text class="ts" x="198" y="804" text-anchor="start" dominant-baseline="central">AIDV 向 Speech 提交文字，获得 TTS 音频分片。</text><text class="ts" x="198" y="823" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="842" text-anchor="start" dominant-baseline="central">TTS 是文字转语音，不负责判断用户目标是否真正完</text><text class="ts" x="198" y="861" text-anchor="start" dominant-baseline="central">成。</text></g><text class="anno" x="540" y="776" text-anchor="start" dominant-baseline="central">与文字下行并行</text><text class="anno" x="540" y="795" text-anchor="start" dominant-baseline="central">的语音链</text><g class="c-teal" role="link" tabindex="0" data-page="O" data-flow="O-endcloud-speech" data-step="OC5" aria-label="AIDV 缓存可流式消费的音频"><title>语音分片进入缓存，供车端读取。；缓存不是“必须先生成完整文件”，可边生成边被消费。</title><rect x="180" y="961" width="340" height="129" rx="6"/><text class="th" x="198" y="985" text-anchor="start" dominant-baseline="central">AIDV 缓存可流式消费的音频</text><text class="ts" x="198" y="1013" text-anchor="start" dominant-baseline="central">语音分片进入缓存，供车端读取。</text><text class="ts" x="198" y="1032" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1051" text-anchor="start" dominant-baseline="central">缓存不是“必须先生成完整文件”，可边生成边被消</text><text class="ts" x="198" y="1070" text-anchor="start" dominant-baseline="central">费。</text></g><g class="c-teal" role="link" tabindex="0" data-page="O" data-flow="O-endcloud-speech" data-step="OC6" aria-label="车端按标识独立请求音频流"><title>客户端凭关联标识通过独立 WebSocket 通道向 AIDV 取流。；文字链提供对应关系，音频链提供分片；关联错配和没有声音是不同故障。</title><rect x="180" y="1170" width="340" height="148" rx="6"/><text class="th" x="198" y="1194" text-anchor="start" dominant-baseline="central">车端按标识独立请求音频流</text><text class="ts" x="198" y="1222" text-anchor="start" dominant-baseline="central">客户端凭关联标识通过独立 WebSocket 通道向 </text><text class="ts" x="198" y="1241" text-anchor="start" dominant-baseline="central">AIDV 取流。</text><text class="ts" x="198" y="1260" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1279" text-anchor="start" dominant-baseline="central">文字链提供对应关系，音频链提供分片；关联错配和</text><text class="ts" x="198" y="1298" text-anchor="start" dominant-baseline="central">没有声音是不同故障。</text></g><text class="anno" x="540" y="1194" text-anchor="start" dominant-baseline="central">取流、播放与结</text><text class="anno" x="540" y="1213" text-anchor="start" dominant-baseline="central">果核验</text><g class="c-teal" role="link" tabindex="0" data-page="O" data-flow="O-endcloud-speech" data-step="OC7" aria-label="车端接收音频分片与结束标志"><title>接收数据与实际播放是两个状态。；尚未收到结束标志不能臆断整段内容已经取完；超时/重连策略仍需具体接口证据。</title><rect x="180" y="1398" width="340" height="129" rx="6"/><text class="th" x="198" y="1422" text-anchor="start" dominant-baseline="central">车端接收音频分片与结束标志</text><text class="ts" x="198" y="1450" text-anchor="start" dominant-baseline="central">接收数据与实际播放是两个状态。</text><text class="ts" x="198" y="1469" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1488" text-anchor="start" dominant-baseline="central">尚未收到结束标志不能臆断整段内容已经取完；超时/</text><text class="ts" x="198" y="1507" text-anchor="start" dominant-baseline="central">重连策略仍需具体接口证据。</text></g><g class="c-gray" role="link" tabindex="0" data-page="O" data-flow="O-endcloud-speech" data-step="OC8" aria-label="用户实际听到这段回答"><title>车端边收边播；还需考虑被打断、被取消、音量与音频焦点。；若这句话声称动作已完成，还要回到工具反馈和事后车辆/服务状态核验。</title><rect x="180" y="1607" width="340" height="148" rx="6"/><text class="th" x="198" y="1631" text-anchor="start" dominant-baseline="central">用户实际听到这段回答</text><text class="ts" x="198" y="1659" text-anchor="start" dominant-baseline="central">车端边收边播；还需考虑被打断、被取消、音量与音</text><text class="ts" x="198" y="1678" text-anchor="start" dominant-baseline="central">频焦点。</text><text class="ts" x="198" y="1697" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1716" text-anchor="start" dominant-baseline="central">若这句话声称动作已完成，还要回到工具反馈和事后</text><text class="ts" x="198" y="1735" text-anchor="start" dominant-baseline="central">车辆/服务状态核验。</text></g><text class="th" x="40" y="1839" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1869" text-anchor="start" dominant-baseline="central">E1 AIDV 准备待播报文字与关联标识 → 文字及关联标识经豆包下行：文字返回分支</text><text class="ts" x="40" y="1902" text-anchor="start" dominant-baseline="central">E2 文字及关联标识经豆包下行 → 车端拿到文字和取音频所需信息：文字与关联信息到端</text><text class="ts" x="40" y="1935" text-anchor="start" dominant-baseline="central">E3 AIDV 准备待播报文字与关联标识 → Speech 将待播报文字合成为音频：并行提交 TTS；不等待文</text><text class="ts" x="40" y="1954" text-anchor="start" dominant-baseline="central">字显示完成</text><text class="ts" x="40" y="1987" text-anchor="start" dominant-baseline="central">E4 Speech 将待播报文字合成为音频 → AIDV 缓存可流式消费的音频：返回合成音频分片</text><text class="ts" x="40" y="2020" text-anchor="start" dominant-baseline="central">E5 车端拿到文字和取音频所需信息 → 车端按标识独立请求音频流：拿到关联标识后发起取流；不是等</text><text class="ts" x="40" y="2039" text-anchor="start" dominant-baseline="central">整段音频完成</text><text class="ts" x="40" y="2072" text-anchor="start" dominant-baseline="central">E6 AIDV 缓存可流式消费的音频 → 车端按标识独立请求音频流：取流请求消费对应的流式缓存</text><text class="ts" x="40" y="2105" text-anchor="start" dominant-baseline="central">E7 车端按标识独立请求音频流 → 车端接收音频分片与结束标志：返回音频分片及结束信息</text><text class="ts" x="40" y="2138" text-anchor="start" dominant-baseline="central">E8 车端接收音频分片与结束标志 → 用户实际听到这段回答：符合当时播放/打断策略后边收边播</text></svg>