ral">连接条件与分支</text><text class="ts" x="40" y="2086" text-anchor="start" dominant-baseline="central">E1 三类生产方 → 入口字段与范围信息：按合同上报</text><text class="ts" x="40" y="2119" text-anchor="start" dominant-baseline="central">E2 入口字段与范围信息 → 结构与中文一致：资源格式校验通过</text><text class="ts" x="40" y="2152" text-anchor="start" dominant-baseline="central">E3 入口字段与范围信息 → 校验/保存失败：校验失败</text><text class="ts" x="40" y="2185" text-anchor="start" dominant-baseline="central">E4 结构与中文一致 → 保存事件记录：忠实事实</text><text class="ts" x="40" y="2218" text-anchor="start" dominant-baseline="central">E5 保存事件记录 → 查询/订阅分发：可查询或通知</text><text class="ts" x="40" y="2251" text-anchor="start" dominant-baseline="central">E6 保存事件记录 → 校验/保存失败：写入失败</text><text class="ts" x="40" y="2284" text-anchor="start" dominant-baseline="central">E7 查询/订阅分发 → Context / UP 使用：对应白名单</text><text class="ts" x="40" y="2317" text-anchor="start" dominant-baseline="central">E8 查询/订阅分发 → Memory 提取任务：允许进入记忆</text><text class="ts" x="40" y="2350" text-anchor="start" dominant-baseline="central">E9 查询/订阅分发 → 指定业务处理：已注册订阅</text><text class="ts" x="40" y="2383" text-anchor="start" dominant-baseline="central">E10 Context / UP 使用 → 用户结果与诊断：本轮实际采用后</text><text class="ts" x="40" y="2416" text-anchor="start" dominant-baseline="central">E11 Memory 提取任务 → 用户结果与诊断：后续查询采用，不是即时</text><text class="ts" x="40" y="2449" text-anchor="start" dominant-baseline="central">E12 指定业务处理 → 用户结果与诊断：业务实际处理结果</text></svg>