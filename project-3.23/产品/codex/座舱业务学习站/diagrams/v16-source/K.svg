#435c70" font-weight="400"><tspan x="476" dy="0">历史摘要</tspan></text><path d="M685,3082 L685,3318" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="558" y="3178" width="130" height="44" rx="3" fill="#fff"/><text x="563" y="3202" font-size="15" fill="#435c70" font-weight="400"><tspan x="563" dy="0">信息足够支撑业务</tspan></text><path d="M912,1264 L912,1302 L235,1302 L235,1500" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="108" y="1360" width="130" height="44" rx="3" fill="#fff"/><text x="113" y="1384" font-size="15" fill="#435c70" font-weight="400"><tspan x="113" dy="0">家/公司设置语义</tspan></text><a href="#module/K/step/K01"><g data-step="K01"><rect x="1151" y="246" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1151" y="246" width="5" height="182" rx="2" fill="#326785"/><text x="1171" y="275" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1171" dy="0">K01</tspan></text><text x="1171" y="307" font-size="20" fill="#203b50" font-weight="600"><tspan x="1171" dy="0">确定本次记忆属于谁</tspan></text><text x="1171" y="349" font-size="16" fill="#375b71" font-weight="400"><tspan x="1171" dy="0">业务方 / 账号与在场人信息</tspan></text><text x="1171" y="388" font-size="16" fill="#566975" font-weight="400"><tspan x="1171" dy="0">身份范围及信息归属</tspan></text></g></a><a href="#module/K/step/K02"><g data-step="K02"><rect x="1151" y="664" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1151" y="664" width="5" height="182" rx="2" fill="#326785"/><text x="1171" y="693" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1171" dy="0">K02</tspan></text><text x="1171" y="725" font-size="20" fill="#203b50" font-weight="600"><tspan x="1171" dy="0">判断是否记录与召回</tspan></text><text x="1171" y="767" font-size="16" fill="#375b71" font-weight="400"><tspan x="1171" dy="0">记忆开关</tspan></text><text x="1171" y="806" font-size="16" fill="#566975" font-weight="400"><tspan x="1171" dy="0">允许进入记忆或停止该路径</tspan></text></g></a><a href="#module/K/step/K03"><g data-step="K03"><rect x="834" y="1082" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="834" y="1082" width="5" height="182" rx="2" fill="#326785"/><text x="854" y="1111" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="854" dy="0">K03</tspan></text><text x="854" y="1143" font-size="20" fill="#203b50" font-weight="600"><tspan x="854" dy="0">提交发生过的对话或行为</tspan></text><text x="854" y="1185" font-size="16" fill="#375b71" font-weight="400"><tspan x="854" dy="0">业务方 → 记忆服务</tspan></text><text x="854" y="1224" font-size="16" fill="#566975" font-weight="400"><tspan x="854" dy="0">可提取的原始文本</tspan></text></g></a><a href="#module/K/step/K04"><g data-step="K04"><rect x="951" y="1500" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="951" y="1500" width="5" height="182" rx="2" fill="#326785"/><text x="971" y="1529" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="971" dy="0">K04</tspan></text><text x="971" y="1561" font-size="20" fill="#203b50" font-weight="600"><tspan x="971" dy="0">把事件按时间汇成情景记忆</tspan></text><text x="971" y="1603" font-size="16" fill="#375b71" font-weight="400"><tspan x="971" dy="0">记忆服务</tspan></text><text x="971" y="1642" font-size="16" fill="#566975" font-weight="400"><tspan x="971" dy="0">带时间线的经历</tspan></text></g></a><a href="#module/K/step/K05"><g data-step="K05"><rect x="491" y="1500" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="491" y="1500" width="5" height="182" rx="2" fill="#326785"/><text x="511" y="1529" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="511" dy="0">K05</tspan></text><text x="511" y="1561" font-size="20" fill="#203b50" font-weight="600"><tspan x="511" dy="0">提取语义偏好并生成标签、画像</tspan></text><text x="511" y="1603" font-size="16" fill="#375b71" font-weight="400"><tspan x="511" dy="0">记忆服务</tspan></text><text x="511" y="1642" font-size="16" fill="#566975" font-weight="400"><tspan x="511" dy="0">语义记忆、标签、分数与画像</tspan></text></g></a><a href="#module/K/step/K06"><g data-step="K06"><rect x="265" y="1782" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="265" y="1782" width="5" height="182" rx="2" fill="#326785"/><text x="285" y="1811" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="285" dy="0">K06</tspan></text><text x="285" y="1843" font-size="20" fill="#203b50" font-weight="600"><tspan x="285" dy="0">压缩近期对话供连续理解</tspan></text><text x="285" y="1885" font-size="16" fill="#375b71" font-weight="400"><tspan x="285" dy="0">对话摘要模块</tspan></text><text x="285" y="1924" font-size="16" fill="#566975" font-weight="400"><tspan x="285" dy="0">近期对话摘要</tspan></text></g></a><a href="#module/K/step/K07"><g data-step="K07"><rect x="886" y="2064" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="886" y="2064" width="5" height="182" rx="2" fill="#326785"/><text x="906" y="2093" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="906" dy="0">K07</tspan></text><text x="906" y="2125" font-size="20" fill="#203b50" font-weight="600"><tspan x="906" dy="0">保存可供查询的记忆产物</tspan></text><text x="906" y="2167" font-size="16" fill="#375b71" font-weight="400"><tspan x="906" dy="0">记忆服务</tspan></text><text x="906" y="2206" font-size="16" fill="#566975" font-weight="400"><tspan x="906" dy="0">可检索的记忆</tspan></text></g></a><a href="#module/K/step/K08"><g data-step="K08"><rect x="951" y="2482" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="951" y="2482" width="5" height="182" rx="2" fill="#326785"/><text x="971" y="2511" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="971" dy="0">K08</tspan></text><text x="971" y="2543" font-size="20" fill="#203b50" font-weight="600"><tspan x="971" dy="0">围绕这次问题检索</tspan></text><text x="971" y="2585" font-size="16" fill="#375b71" font-weight="400"><tspan x="971" dy="0">Planner / 业务方 → 记忆服务</tspan></text><text x="971" y="2624" font-size="16" fill="#56697