  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">流程三：关闭记忆与删除记忆分别怎么走</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,220 350,286" marker-end="url(#arrow-K-control-flow)"><title>kc1 → kc2：用户选择关闭</title></polyline><polyline class="arr" fill="none" points="176,340 40,340 40,1544 170,1544" marker-end="url(#arrow-K-control-flow)"><title>kc2 → kc8：告知冻结边界</title></polyline><polyline class="arr" fill="none" points="176,364 50,364 50,1734 170,1734" marker-end="url(#arrow-K-control-flow)"><title>kc2 → kc9：后来明确重新开启</title></polyline><polyline class="arr" fill="none" points="176,150 60,150 60,592 170,592" marker-end="url(#arrow-K-control-flow)"><title>kc1 → kc3：删除/除痕</title></polyline><polyline class="arr-alt" fill="none" points="350,640 350,706" marker-end="url(#arrow-K-control-flow)"><title>kc3 → kc4：批量语音删除</title></polyline><polyline class="arr-alt" fill="none" points="350,830 350,896" marker-end="url(#arrow-K-control-flow)"><title>kc4 → kc5：确认同一范围后</title></polyline><polyline class="arr" fill="none" points="176,532 90,532 90,974 170,974" marker-end="url(#arrow-K-control-flow)"><title>kc3 → kc5：受支持且已授权的其他删除入口</title></polyline><polyline class="arr" fill="none" points="350,1022 350,1088" marker-end="url(#arrow-K-control-flow)"><title>kc5 → kc6：包含语义记忆</title></polyline><polyline class="arr" fill="none" points="176,950 110,950 110,1354 170,1354" marker-end="url(#arrow-K-control-flow)"><title>kc5 → kc7：其他清理结果</title></polyline><polyline class="arr" fill="none" points="350,1212 350,1278" marker-end="url(#arrow-K-control-flow)"><title>kc6 → kc7：关联产物已处理</title></polyline><polyline class="arr" fill="none" points="350,1402 350,1468" marker-end="url(#arrow-K-control-flow)"><title>kc7 → kc8：按实际结果答复</title></polyline><text class="ts" x="365" y="256" text-anchor="start" dominant-baseline="central">E1 · 用户选择关闭</text><text class="ts" x="168" y="332" text-anchor="end" dominant-baseline="central">E2</text><text class="ts" x="168" y="1556" text-anchor="end" dominant-baseline="central">E2</text><text class="ts" x="168" y="356" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="168" y="1746" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="168" y="142" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="168" y="604" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="365" y="676" text-anchor="start" dominant-baseline="central">E5 · 批量语音删除</text><text class="ts" x="365" y="866" text-anchor="start" dominant-baseline="central">E6 · 确认同一范围后</text><text class="ts" x="168" y="524" text-anchor="end" dominant-baseline="central">E7</text><text class="ts" x="168" y="986" text-anchor="end" dominant-baseline="central">E7</text><text class="ts" x="365" y="1058" text-anchor="start" dominant-baseline="central">E8 · 包含语义记忆</text><text class="ts" x="168" y="942" text-anchor="end" dominant-baseline="central">E9</text><text class="ts" x="168" y="1366" text-anchor="end" dominant-baseline="central">E9</text><text class="ts" x="365" y="1248" text-anchor="start" dominant-baseline="central">E10 · 关联产物已处理</text><text class="ts" x="365" y="1438" text-anchor="start" dominant-baseline="central">E11 · 按实际结果答复</text><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-control-flow" data-step="kc1" aria-label="用户要改变记忆状态"><title>先区分关闭、删除、一键除痕；范围不清先问清楚</title><rect x="180" y="106" width="340" height="110" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">用户要改变记忆状态</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">先区分关闭、删除、一键除痕</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central">范围不清先问清楚</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-control-flow" data-step="kc2" aria-label="关闭生产与召回"><title>保存车/账号对应开关；已有记忆冻结但保留</title><rect x="180" y="296" width="340" height="112" rx="6"/><text class="th" x="198" y="320" text-anchor="start" dominant-baseline="central">关闭生产与召回</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">保存车/账号对应开关</text><text class="ts" x="198" y="367" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central">已有记忆冻结但保留</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-control-flow" data-step="kc3" aria-label="删除权限与范围"><title>按具体入口核权限和目标数据范围；此语音删除入口限定车主，其他入口分别校验权限。；生产开关不是删除授权的替代</title><rect x="180" y="488" width="340" height="148" rx="6"/><text class="th" x="198" y="512" text-anchor="start" dominant-baseline="central">删除权限与范围</text><text class="ts" x="198" y="540" text-anchor="start" dominant-baseline="central">按具体入口核权限和目标数据范围</text><text class="ts" x="198" y="559" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="578" text-anchor="start" dominant-baseline="central">此语音删除入口限定车主，其他入口分别校验权限。</text><text class="ts" x="198" y="597" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="616" text-anchor="start" dominant-baseline="central">生产开关不是删除授权的替代</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-control-flow" data-step="kc4" aria-label="批量二次确认"><title>明确哪些人、日期和记忆类型；未确认不得继续删除</title><rect x="180" y="716" width="340" height="110" rx="6"/><text class="th" x="198" y="740" text-anchor="start" dominant-baseline="central">批量二次确认</text><text class="ts" x="198" y="768" text-anchor="start" dominant-baseline="central">明确哪些人、日期和记忆类型</text><text class="ts" x="198" y="787" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="806" text-anchor="start" dominant-baseline="central">未确认不得继续删除</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-control-flow" data-step="kc5" aria-label="分别调用清理能力"><title>语义、情景、历史、摘要不是同一库；新 chat_id 只逻辑清空历史/摘要</title><rect x="180" y="906" width="340" height="112" rx="6"/><text class="th" x="198" y="930" text-anchor="start" dominant-baseline="central">分别调用清理能力</text><text class="ts" x="198" y="958" text-anchor="start" dominant-baseline="central">语义、情景、历史、摘要不是同一库</text><text class="ts" x="198" y="977" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="996" text-anchor="start" dominant-baseline="central">新 chat_id 只逻辑清空历史/摘要</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-control-flow" data-step="kc6" aria-label="联动更新画像"><title>语义删除后重算或更新画像；避免换个表述又说出已删事实</title><rect x="180" y="1098" width="340" height="110" rx="6"/><text class="th" x="198" y="1122" text-anchor="start" dominant-baseline="central">联动更新画像</text><text class="ts" x="198" y="1150" text-anchor="start" dominant-baseline="central">语义删除后重算或更新画像</text><text class="ts" x="198" y="1169" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1188" text-anchor="start" dominant-baseline="central">避免换个表述又说出已删事实</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-control-flow" data-step="kc7" aria-label="核对各项结果"><title>成功、部分失败、待清理分别记录；重新查询与新会话复测</title><rect x="180" y="1288" width="340" height="110" rx="6"/><text class="th" x="198" y="1312" text-anchor="start" dominant-baseline="central">核对各项结果</text><text class="ts" x="198" y="1340" text-anchor="start" dominant-baseline="central">成功、部分失败、待清理分别记录</text><text class="ts" x="198" y="1359" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1378" text-anchor="start" dominant-baseline="central">重新查询与新会话复测</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-control-flow" data-step="kc8" aria-label="向用户准确反馈"><title>只承诺已完成的范围；失败项说明后续处理，不说全清了</title><rect x="180" y="1478" width="340" height="110" rx="6"/><text class="th" x="198" y="1502" text-anchor="start" dominant-baseline="central">向用户准确反馈</text><text class="ts" x="198" y="1530" text-anchor="start" dominant-baseline="central">只承诺已完成的范围</text><text class="ts" x="198" y="1549" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1568" text-anchor="start" dominant-baseline="central">失败项说明后续处理，不说全清了</text></g><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-control-flow" data-step="kc9" aria-label="恢复开关"><title>再次取得相应授权后恢复使用；不等于重新创建已删除记录</title><rect x="180" y="1668" width="340" height="110" rx="6"/><text class="th" x="198" y="1692" text-anchor="start" dominant-baseline="central">恢复开关</text><text class="ts" x="198" y="1720" text-anchor="start" dominant-baseline="central">再次取得相应授权后恢复使用</text><text class="ts" x="198" y="1739" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1758" text-anchor="start" dominant-baseline="central">不等于重新创建已删除记录</text></g><text class="th" x="40" y="1862" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1892" text-anchor="start" dominant-baseline="central">E1 用户要改变记忆状态 → 关闭生产与召回：用户选择关闭</text><text class="ts" x="40" y="1925" text-anchor="start" dominant-baseline="central">E2 关闭生产与召回 → 向用户准确反馈：告知冻结边界</text><text class="ts" x="40" y="1958" text-anchor="start" dominant-baseline="central">E3 关闭生产与召回 → 恢复开关：后来明确重新开启</text><text class="ts" x="40" y="1991" text-anchor="start" dominant-baseline="central">E4 用户要改变记忆状态 → 删除权限与范围：删除/除痕</text><text class="ts" x="40" y="2024" text-anchor="start" dominant-baseline="central">E5 删除权限与范围 → 批量二次确认：批量语音删除〔规划/待核〕</text><text class="ts" x="40" y="2057" text-anchor="start" dominant-baseline="central">E6 批量二次确认 → 分别调用清理能力：确认同一范围后〔规划/待核〕</text><text class="ts" x="40" y="2090" text-anchor="start" dominant-baseline="central">E7 删除权限与范围 → 分别调用清理能力：受支持且已授权的其他删除入口</text><text class="ts" x="40" y="2