B7" stroke-width="1.5"/><text x="630" y="355" font-size="26" font-weight="600" fill="#0D4FA8">已有 Workflow 详情</text><text x="630" y="390" font-size="22" font-weight="400" fill="#0D4FA8">判断流程只读，当前不支持原地编辑</text><rect x="1200" y="320" width="430" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1220" y="355" font-size="26" font-weight="600" fill="#0D4FA8">复制重建</text><text x="1220" y="390" font-size="22" font-weight="400" fill="#0D4FA8">复制原定义，独立修改</text><text x="1220" y="422" font-size="22" font-weight="400" fill="#0D4FA8">不改变原场景</text><rect x="70" y="565" width="430" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="600" font-size="26" font-weight="600" fill="#0D4FA8">基础信息与适用范围</text><text x="90" y="635" font-size="22" font-weight="400" fill="#0D4FA8">名称、分类、关联任务</text><text x="90" y="667" font-size="22" font-weight="400" fill="#0D4FA8">渠道、车型、版本、车辆</text><text x="90" y="699" font-size="22" font-weight="400" fill="#0D4FA8">显示实际部署环境</text><rect x="590" y="565" width="450" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="610" y="600" font-size="26" font-weight="600" fill="#0D4FA8">简单模式</text><text x="610" y="635" font-size="22" font-weight="400" fill="#0D4FA8">复用现有条件 / 推理配置</text><text x="610" y="667" font-size="22" font-weight="400" fill="#0D4FA8">不生成 workflow_id</text><rect x="1130" y="565" width="500" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1150" y="600" font-size="26" font-weight="600" fill="#0D4FA8">Workflow 画板</text><text x="1150" y="635" font-size="22" font-weight="400" fill="#0D4FA8">仅添加条件或推理节点</text><text x="1150" y="667" font-size="22" font-weight="400" fill="#0D4FA8">连接依赖，单一终点</text><text x="1150" y="699" font-size="22" font-weight="400" fill="#0D4FA8">真实目标节点选 AND / OR</text><rect x="70" y="780" width="600" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="815" font-size="26" font-weight="600" fill="#0D4FA8">每一项判断具体填什么</text><text x="90" y="850" font-size="22" font-weight="400" fill="#0D4FA8">条件：信号＋对象位置＋运算符＋值</text><text x="90" y="882" font-size="22" font-weight="400" fill="#0D4FA8">推理：VLM 输入＋目标＋原始描述</text><text x="90" y="914" font-size="22" font-weight="400" fill="#0D4FA8">无空白 Join、工具或车控节点</text><rect x="790" y="780" width="840" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="810" y="815" font-size="26" font-weight="600" fill="#0D4FA8">页面显示实际启动信号</text><text x="810" y="850" font-size="22" font-weight="400" fill="#0D4FA8">有动态条件：其信号更新启动；无动态：全部条件信号</text><text x="810" y="882" font-size="22" font-weight="400" fill="#0D4FA8">推理入口：配置的 VLM ID；启动后仍完整判断</text><text x="810" y="914" font-size="22" font-weight="400" fill="#0D4FA8">混合入口汇总、迟到输入与重复启动策略需收口</text><rect x="70" y="1060" width="470" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="1095" font-size="26" font-weight="600" fill="#0D4FA8">选已有下游动作</text><text x="90" y="1130" font-size="22" font-weight="400" fill="#0D4FA8">主动推荐带交互卡或已有出口</text><text x="90" y="1162" font-size="22" font-weight="400" fill="#0D4FA8">未接入的动作不能作为可用项</text><rect x="590" y="1060" width="500" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="610" y="1095" font-size="26" font-weight="600" fill="#0D4FA8">填写与预览下游参数</text><text x="610" y="1130" font-size="22" font-weight="400" fill="#0D4FA8">建议 Query、带卡与协议按钮</text><text x="610" y="1162" font-size="22" font-weight="400" fill="#0D4FA8">不伪称 DT 生成正文是自由编辑</text><text x="610" y="1194" font-size="22" font-weight="400" fill="#0D4FA8">预览输入不等于最终卡片效果</text><rect x="1210" y="1060" width="420" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1230" y="1095" font-size="26" font-weight="600" fill="#0D4FA8">填写已有执行策略</text><text x="1230" y="1130" font-size="22" font-weight="400" fill="#0D4FA8">次数、周期、间隔与单位</text><text x="1230" y="1162" font-size="22" font-weight="400" fill="#0D4FA8">明确统计对象和起点</text><text x="1230" y="1194" font-size="22" font-weight="400" fill="#0D4FA8">未确认策略不写默认承诺</text><rect x="70" y="1420" width="470" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="90" y="1455" font-size="26" font-weight="600" fill="#0D4FA8">完整校验</text><text x="90" y="1490" font-size="22" font-weight="400" fill="#0D4FA8">字段合法、边有效、无环</text><text x="90" y="1522" font-size="22" font-weight="400" fill="#0D4FA8">全部节点可到达且可到终点</text><text x="90" y="1554" font-size="22" font-weight="400" fill="#0D4FA8">唯一终点与下游参数合法</text><rect x="610" y="1420" width="480" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="630" y="1455" font-size="26" font-weight="600" fill="#0D4FA8">保存有效定义</text><text x="630" y="1490" font-size="22" font-weight="400" fill="#0D4FA8">Workflow 通过后才生成 ID</text><text x="630" y="1522" font-size="22" font-weight="400" fill="#0D4FA8">非法返回全部 issues，不写库</text><text x="630" y="1554" font-size="22" font-weight="400" fill="#0D4FA8">系统异常与配置问题分开</text><rect x="1170" y="1420" width="460" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1190" y="1455" font-size="26" font-weight="600" fill="#0D4FA8">真实测试环境联调</text><text x="1190" y="1490" font-size="22" font-weight="400" fill="#0D4FA8">输入、节点、策略、下游分别验证</text><text x="1190" y="1522" font-size="22" font-weight="400" fill="#0D4FA8">带卡动作不能只看模拟器</text><text x="1190" y="1554" font-size="22" font-weight="400" fill="#0D4FA8">缺能力或验证失败：先修正</text><rect x="70" y="1820" width="450" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="1855" font-size="26" font-weight="600" fill="#0D4FA8">新任务发布</text><text x="90" y="1890" font-size="22" font-weight="400" fill="#0D4FA8">确认环境、适用范围与真实能力</text><text x="90" y="1922" font-size="22" font-weight="400" fill="#0D4FA8">发布状态 ≠ 本车任务状态</text><rect x="610" y="1820" width="480" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="630" y="1855" font-size="26" font-weight="600" fill="#0D4FA8">替换已有任务：先确认方案</text><text x="630" y="1890" font-size="22" font-weight="400" fill="#0D4FA8">旧新场景如何关联到同一任务</text><text x="630" y="1922" font-size="22" font-weight="400" fill="#0D4FA8">用户开关如何保持</text><text x="630" y="1954" font-size="22" font-weight="400" fill="#0D4FA8">避免同时生效并可失败回退</text><rect x="1180" y="1820" width="450" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1200" y="1855" font-size="26" font-weight="600" fill="#0D4FA8">发布后核对</text><text x="1200" y="1890" font-size="22" font-weight="400" fill="#0D4FA8">核对实际范围及任务中心状态</text><text x="1200" y="1922" font-size="22" font-weight="400" fill="#0D4FA8">首条运行与下游反馈可追溯</text><text x="1200" y="1954" font-size="22" font-weight="400" fill="#0D4FA8">历史查询使用当次定义</text><rect x="70" y="2045" width="1560" height="139" rx="12" fill="#F2F7F5" stroke="#73978A" stroke-width="1.5"/><text x="90" y="2080" font-size="26" font-weight="600" fill="#0D4FA8">当前限制与待确认</text><text x="90" y="2115" font-size="22" font-weight="400" fill="#0D4FA8">已有 Workflow 不支持原地编辑；混合判定暂不开放定时；不承诺跨模式无损转换。</text><text x="90" y="2147" font-size="22" font-weight="400" fill="#0D4FA8">复制、选择保持、切换与回退是拟补产品方案；研发确认前不直接替换或默认覆盖。</text><text x="55" y="60" font-size="36" font-weight="600" fill="#0D4FA8">配置人员怎样新建、验证、发布与替换场景</text><text x="65" y="136" font-size="28" font-weight="600" fill="#0D4FA8">一、进入与选择｜先分清新建和已有 Workflow 修改</text><text x="420" y="292" font-size="21" font-weight="400" fill="#0D4FA8">新建</text><text x="870" y="307" font-size="21" font-weight="400" fill="#0D4FA8">调整已有规则</text><text x="65" y="531" font-size="28" font-weight="600" fill="#0D4FA8">二、定义判断｜字段、节点与依赖都要能解释清楚</text><text x="505" y="636.5" font-size="21" font-weight="400" fill="#0D4FA8">简单</text><text x="920" y="526" font-size="21" font-weight="400" fill="#0D4FA8">Workflow</text><text x="65" y="1026" font-size="28" font-weight="600" fill="#0D4FA8">三、配置出口｜判断、建议与执行限制分开填写</text><text x="65" y="1386" font-size="28" font-weight="600" fill="#0D4FA8">四、完整校验与验证｜能保存不等于真实业务能跑通</text><text x="535" y="1491.5" font-size="21" font-weight="400" fill="#0D4FA8">通过</text><text x="80" y="1653" font-size="22" font-weight="600" fill="#0D4FA8">不通过：定位全部问题后返回对应字段或节点；新规则准备失败时保留原有效规则。</text><text x="65" y="1781" font-size="28" font-weight="600" fill="#0D4FA8">五、发布与替换｜规则发布不能覆盖用户选择</text><text x="610" y="1710" font-size="21" font-weight="400" fill="#0D4FA8">新任务</text><text x="1020" y="1687" font-size="21" font-weight="400" fill="#0D4FA8">替换旧规则</text><text x="640" y="2017" font-size="21" font-weight="400" fill="#0D4FA8">新任务发布后核对</text><text x="1095" y="1891.5" font-size="21" font-weight="400" fill="#0D4FA8">切换后</text></svg>