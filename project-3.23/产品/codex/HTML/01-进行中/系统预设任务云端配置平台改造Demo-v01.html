  <script>
  (function(){

    function renderHistory(){document.getElementById("historyView").innerHTML='<div class="page-head"><div><h1>触发记录</h1><p>同时查看“Trigger 是否成功发出事件”和“原业务是否完成最终闭环”。</p></div></div><div class="notice"><strong>新增的产品口径：</strong>Trigger 成功只说明事件已经发给原业务；卡片展示、用户选择、执行前复核、车控和真实状态回读必须分开记录。</div><div class="panel" style="margin-top:14px"><div class="panel-body"><div class="filters">'+selectStatic("渠道","AIDV主线",["AIDV主线"])+inputStatic("车辆 ID","请输入车辆 ID")+inputStatic("场景 ID","请输入场景 ID")+inputStatic("时间范围","2026-09-10")+'<button class="btn" data-action="refresh">刷新</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>场景 ID / 名称</th><th>触发时间 / 车辆</th><th>触发条件</th><th>Trigger 结果</th><th data-feature="added">任务实例 / 本次事件</th><th data-feature="added">原业务 / 处理方式</th><th data-feature="added">DT / 卡片 / 用户选择</th><th data-feature="added">执行 / 真实车况</th><th>Log ID</th><th>操作</th></tr></thead><tbody>'+records.map(function(r){return '<tr><td>'+esc(r.id)+'<br><span class="strong">'+esc(r.name)+'</span></td><td>'+esc(r.time)+'<br><span class="muted">'+esc(r.vehicle)+'</span></td><td>'+esc(r.condition)+'</td><td><span class="tag good">'+esc(r.trigger)+'</span></td><td data-feature="added"><b>'+esc(r.task)+'</b><br><span class="muted">任务实例：'+esc(r.taskInstance)+'<br>事件：'+esc(r.runEvent)+'<br>卡片：'+esc(r.cardId)+'</span></td><td data-feature="added">'+esc(r.business)+'<br><span class="muted">'+esc(r.handling)+'</span></td><td data-feature="added">DT：'+esc(r.dt)+'<br>卡片：'+esc(r.card)+'<br>选择：'+esc(r.choice)+'</td><td data-feature="added">'+esc(r.execute)+'<br><span class="tag '+resultClass(r)+'">'+esc(r.vehicleResult)+'</span></td><td>'+esc(r.log)+'</td><td><button class="link" data-record="'+esc(r.log)+'">查看时间线</button></td></tr>'}).join("")+'</tbody></table></div></div>'}

    function showDrawer(){lastFocus=document.activeElement;document.getElementById("drawerMask").classList.add("open");setTimeout(function(){document.getElementById("closeDrawer").focus()},0)}
    function openChecks(){var cs=checks(),s=score();document.getElementById("drawerTitle").textContent="配置遗漏检查";document.getElementById("drawerSub").textContent=s.ok+" 项已配置，"+s.tbd+" 项待确认，"+s.missing+" 项缺失";document.getElementById("drawerBody").innerHTML='<div class="notice"><strong>使用方法：</strong>先处理红色缺失项，黄色项带到专项评审逐项确认。点击“去查看”会跳到实际配置位置。</div><div class="check-list" style="margin-top:12px">'+cs.map(function(c){var icon=c[1]==="ok"?'✓':c[1]==="tbd"?'?':'!';var label=c[1]==="ok"?'已配置':c[1]==="tbd"?'待确认':'配置缺失';return '<div class="check-item '+c[1]+'"><span class="check-icon">'+icon+'</span><div><b>'+esc(c[0])+' <span class="tag '+(c[1]==="ok"?'good':c[1])+'">'+label+'</span></b><p>'+esc(c[2])+'</p></div><button class="btn small" data-jump="'+esc(c[3])+'">去查看</button></div>'}).join("")+'</div>';showDrawer()}
    function timelineFor(r){var common=[
      [r.time.slice(11)+".000","Cloud Trigger 条件命中","保存本次条件快照，只把事件交给原业务",r.runEvent],
      [r.time.slice(11)+".041",r.business+"收到事件","从这一刻开始，后续判断、交互与执行由原业务承接","accepted"]
    ];
      if(r.outcome==="notify")return common.concat([["09:41:22.160","原业务注册系统通知卡","配置文案、TTS、展示结果回调与有效期",r.cardId],["09:41:23.004","VUI 真正展示通知卡","本场景只告知，不形成车辆执行授权","displayed"],["09:41:26.200","用户关闭卡片","生命周期结果回到原业务，本次提醒结束","closed"]]);
      if(r.outcome==="dt_unknown")return common.concat([["14:02:31.286","DT / VQA 返回 UNKNOWN","无法确定附近是否有可用充电设备","UNKNOWN","warn"],["14:02:31.301","原业务结束本次处理","不创建卡片，不下发开盖，不拿旧结果继续","NO_ACTION","fail"]]);
      var after=common.concat([[r.time.slice(11)+".312","DT / VQA 返回 FOUND","检测到充电设备，结果在 30 秒内有效","FOUND"],[r.time.slice(11)+".421","原业务注册即时交互卡","文案、按钮、TTS、点击路线、语音上下文和事件 ID 一并注册",r.cardId],[r.time.slice(11)+".902","VUI 真正展示卡片","从真正展示时开始计算回答有效期","displayed"]]);
      if(r.outcome==="timeout")return after.concat([["12:48:30.902","等待用户回答超时","没有形成用户授权，卡片失效","TIMEOUT","warn"],["12:48:30.930","原业务结束本次处理","不执行开盖；迟到的“确认”也不能使用","NO_ACTION","fail"]]);
      after.push([r.time.slice(11)+".917","用户确认打开","按钮结果带同一本次事件 ID 直接回充电业务","CONFIRM_OPEN_CHARGE_PORT"]);
      if(r.outcome==="recheck_fail")return after.concat([["11:21:49.020","端侧执行前复核未通过","车辆已经离开 P 挡，当前车况不再允许开盖","RECHECK_BLOCKED","fail"],["11:21:49.071","原业务更新卡片并结束","向用户说明条件已变化，不执行车辆动作","FAILED","fail"]]);
      after.push([r.time.slice(11)+".990","端侧执行前复核通过","任务仍开启；P 挡；口盖关闭；结果与授权均有效","PASS"]);after.push([r.time.slice(11)+".120","赛力斯车控受理开盖请求","RPC 返回只代表请求已受理，不代表口盖已打开","RPC_ACCEPTED"]);
      if(r.outcome==="no_change")return after.concat([["10:07:23.120","真实状态在 5 秒内没有变化","口盖仍为关闭，不能把 RPC 受理记成成功","STATE_UNCHANGED","fail"],["10:07:23.180","原业务更新卡片","展示失败或结果暂不能确认，并记录异常","FAILED","fail"]]);
      return after.concat([["14:26:14.086","真实状态回读：口盖已打开","达到目标状态，业务最终成功","SUCCESS"],["14:26:14.120","原业务更新卡片并结束","展示“已打开”，本次停车进入去重状态","CLOSED"]]);
    }
    function openRecord(key){var r=records.find(function(x){return x.log===key})||records[0],events=timelineFor(r);document.getElementById("drawerTitle").textContent="单次触发详情";document.getElementById("drawerSub").textContent=r.name+" · "+r.vehicle;document.getElementById("drawerBody").innerHTML='<div class="notice"><strong>先看两个结果：</strong>Trigger 为“'+esc(r.trigger)+'”；业务最终为“'+esc(r.vehicleResult)+'”。两者不是同一个成功。</div><div class="contract-grid" style="margin-top:12px">'+contractItem("任务实例",r.taskInstance)+contractItem("本次事件",r.runEvent)+contractItem("卡片 ID",r.cardId)+contractItem("原业务",r.business)+contractItem("处理方式",r.handling)+contractItem("Log ID",r.log)+'</div><div class="timeline" style="margin-top:18px">'+events.map(function(e){return '<div class="time-event '+(e[4]||"")+'"><time>'+esc(e[0])+'</time><h4>'+esc(e[1])+'</h4><p>'+esc(e[2])+'</p><code>'+esc(e[3])+'</code></div>'}).join("")+'</div>';showDrawer()}
    function closeDrawer(){var mask=document.getElementById("drawerMask");if(!mask.classList.contains("open"))return;mask.classList.remove("open");if(lastFocus&&lastFocus.focus)lastFocus.focus();lastFocus=null}

    function bindDynamic(){
      document.querySelectorAll("[data-field]").forEach(function(el){el.addEventListener("change",fieldChange);if(el.tagName!=="SELECT")el.addEventListener("input",fieldInput)});
      document.querySelectorAll("[data-check]").forEach(function(el){el.addEventListener("change",function(){set(el.dataset.check,el.checked);render()})});
      document.querySelectorAll(".condition-input").forEach(function(el){el.addEventListener("change",conditionChange);el.addEventListener("input",conditionInput)});
      document.querySelectorAll(".group-logic").forEach(function(el){el.addEventListener("change",function(){state.form.groups[Number(el.dataset.group)].logic=el.value;render()})});
    }
    function fieldChange(e){var path=e.target.dataset.field;if(!path)return;var v=e.target.type==="number"?Number(e.target.value):e.target.value;set(path,v);if(path==="purpose")render();else updateLive()}
    function fieldInput(e){var path=e.target.dataset.field;if(!path)return;set(path,e.target.type==="number"?Number(e.target.value):e.target.value);updateLive()}
    function conditionChange(e){var row=e.target.closest(".condition-row");if(!row)return;var group=state.form.groups[Number(row.dataset.group)];if(!group)return;group.conditions[Number(row.dataset.index)][e.target.dataset.key]=e.target.value;updateLive()}
    function conditionInput(e){var row=e.target.closest(".condition-row");if(!row)return;var group=state.form.groups[Number(row.dataset.group)];if(!group)return;group.conditions[Number(row.dataset.index)][e.target.dataset.key]=e.target.value;updateLive()}
    function updateLive(){var rule=document.getElementById("ruleSentence");if(rule)rule.textContent=ruleSentence();var title=document.getElementById("previewTitle");if(title)title.textContent=state.form.cardTitle||"卡片标题";var body=document.getElementById("previewBody");if(body)body.textContent=state.form.cardBody||"卡片正文";var tts=document.getElementById("previewTts");if(tts)tts.textContent=state.form.tts||"TTS 文案";var yes=document.querySelector('[data-preview-choice="confirm"]');if(yes)yes.textContent=state.form.yes||"确认";var no=document.querySelector('[data-preview-choice="reject"]');if(no)no.textContent=state.form.no||"取消";var flow=document.getElementById("flowList");if(flow)flow.innerHTML=flowSteps().map(function(x,i){return '<div class="flow-item '+(x[0].indexOf("Planner")>=0?'tbd':'')+'" data-no="'+(i+1)+'"><b>'+esc(x[0])+'：'+esc(x[1])+'</b><span>交付结果：'+esc(x[2])+'</span></div>'}).join("");var s=score(),ok=document.getElementById("scoreOk"),tbd=document.getElementById("scoreTbd"),missing=document.getElementById("scoreMissing");if(ok)ok.textContent=s.ok;if(tbd)tbd.textContent=s.tbd;if(missing)missing.textContent=s.missing}
    function newCondition(){return {type:"车状态信号",signal:"",field:"",op:"等于",value:"",meaning:"",source:"待选择",unit:"待确认",cloud:"待确认",support:"待确认",missing:"不触发并记录",stable:"待配置",dedupe:"待配置"}}

    document.addEventListener("click",function(e){
      var nav=e.target.closest("[data-nav]");if(nav){state.view=nav.dataset.nav;render();return}
      if(e.target.id==="annotationSwitch"){state.annotations=!state.annotations;render();return}
      if(e.target.id==="blankMode"){state.form=clone(blank);state.view="editor";render();toast("已载入空白模板，请从场景用途开始填写");return}
      if(e.target.id==="exampleMode"){state.form=clone(example);state.view="editor";render();toast("已载入充电口盖完整示例");return}
      var a=e.target.closest("[data-action]");if(a){var act=a.dataset.action;if(act==="new"){state.form=clone(blank);state.view="editor";render()}else if(act==="edit"){state.form=a.dataset.scene==="5291"?fatigueConfig():clone(example);state.view="editor";render()}else if(act==="history"){state.view="history";render()}else if(act==="back"){state.view="list";render()}else if(act==="refresh"){toast("演示数据已刷新，不会请求真实平台") }else if(act==="add-group"){state.form.groups.push({kind:a.dataset.kind||"动态条件",logic:"AND",conditions:[newCondition()]});render();setTimeout(function(){document.getElementById("conditions").scrollIntoView({behavior:"smooth",block:"start"})},0)}else if(act==="delete-group"){state.form.groups.splice(Number(a.dataset.group),1);render()}else if(act==="add-condition"){var g=state.form.groups[Number(a.dataset.group)];if(g)g.conditions.push(newCondition());render();setTimeout(function(){document.getElementById("conditions").scrollIntoView({behavior:"smooth",block:"start"})},0)}else if(act==="delete-condition"){var dg=state.form.groups[Number(a.dataset.group)];if(dg)dg.conditions.splice(Number(a.dataset.index),1);render()}else if(act==="check"){openChecks()}else if(act==="save"){toast("草稿已保存在当前 Demo 页面中，不会写入真实平台") }else if(act==="publish"){var s=score();openChecks();toast(s.missing?"还有配置缺失，Demo 已为你定位":"演示发布检查完成；没有向真实平台提交",s.missing>0)}return}
      var handling=e.target.closest("[data-handling]");if(handling){state.form.handling=handling.dataset.handling;if(state.form.handling==="recommend"&&state.form.legacyAction==="自定义回调")state.form.legacyAction="主动推荐";render();return}
      var interaction=e.target.closest("[data-interaction]");if(interaction){state.form.interactionMode=interaction.dataset.interaction;if(state.form.interactionMode==="notify"&&state.form.cardTemplate==="系统主动服务二次确认卡")state.form.cardTemplate="系统通知卡";if(state.form.interactionMode==="confirm"&&state.form.cardTemplate==="系统通知卡")state.form.cardTemplate="系统主动服务二次确认卡";render();return}
      var execution=e.target.closest("[data-execution]");if(execution){state.form.executionMode=execution.dataset.execution;render();return}
      var preview=e.target.closest("[data-preview-choice]");if(preview){var choice=preview.dataset.previewChoice,feedback=document.getElementById("previewFeedback");var message=choice==="confirm"?"演示：CONFIRM 已携带本次事件 ID 返回原业务；下一步仍要端侧复核。":choice==="reject"?"演示：REJECT 已返回原业务，本次结束，不执行车辆动作。":"演示：卡片关闭结果已返回原业务，本次告知结束。";if(feedback)feedback.textContent=message;toast(message);return}
      var record=e.target.closest("[data-record]");if(record){openRecord(record.dataset.record);return}
      var jump=e.target.closest("[data-jump]");if(jump){var target=jump.dataset.jump;closeDrawer();state.view="editor";render();setTimeout(function(){var el=document.getElementById(target);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})},30);return}
      if(e.target.id==="closeDrawer"||e.target.id==="drawerMask"){closeDrawer()}
    });
    document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrawer();if(e.key==="Tab"&&document.getElementById("drawerMask").classList.contains("open")){var nodes=[].slice.call(document.querySelectorAll("#drawerMask button,#drawerMask [href],#drawerMask input,#drawerMask select,#drawerMask textarea")).filter(function(x){return !x.disabled});if(!nodes.length)return;var first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

    if(document.modelContext&&document.modelContext.registerTool){try{
      document.modelContext.registerTool({name:"load_configuration_demo",title:"载入配置示例",description:"在页面中载入空白系统预设任务模板或充电口盖完整示例。",inputSchema:{type:"object",properties:{template:{type:"string",enum:["blank","charging_port"]}},required:["template"],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:function(input){if(!input||["blank","charging_port"].indexOf(input.template)<0)throw new Error("template 必须是 blank 或 charging_port");state.form=clone(input.template==="blank"?blank:example);state.view="editor";render();return {template:input.template,view:"editor",missing:score().missing,tbd:score().tbd}}});
      document.modelContext.registerTool({name:"inspect_configuration_gaps",title:"检查配置遗漏",description:"读取当前 Demo 配置的已配置、缺失和待确认项，不修改页面数据。",inputSchema:{type:"object",properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:function(){var s=score();return {configured:s.ok,missing:s.missing,to_confirm:s.tbd,items:checks().map(function(x){return {name:x[0],status:x[1],detail:x[2]}})}}});
    }catch(ignore){}}
    render();
  })();
  </script>
</body>
