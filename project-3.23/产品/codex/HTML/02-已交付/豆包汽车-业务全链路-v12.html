<text x="9000" y="7942" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">3. 动态 watch：按 task_id 单独观察</text>
<text x="9000" y="7998" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜动态感知协议由 Task Service 下发 task_id 与纯观察问题，采</text>
<text x="9000" y="8040" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">用全量列表替换，最多 3 项同时观察。动态结果走独立任务通道，不进入通用 </text>
<text x="9000" y="8082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Context；AlwaysOn 关闭时拒收新项并清空旧项。</text>
<text x="9000" y="8146" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜“帮我盯着某个对象”是观察任务，不应把“看到后给我打电话”</text>
<text x="9000" y="8188" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">整段执行指令塞给视觉模型。动作由任务/业务层负责。</text>
<text x="9000" y="8252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜全量替换漏带旧项会使旧观察被移除；取消后结果迟到必须按 task_id</text>
<text x="9000" y="8294" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start"> 处理。3 项是并发观察限制，不是全部业务规则上限。</text>
<text x="9000" y="8358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜列表是谁维护的？关闭、取消、替换、超容量分别返回什么状态？</text>
<rect x="8964" y="8720" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="VL4"/>
<text x="9000" y="8772" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">4. 云端求值、抑制、回调原任务</text>
<text x="9000" y="8828" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜结构条件读相应事实求值；动态视觉结果还需要按协议进行云端语义 </text>
<text x="9000" y="8870" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Y/N 判断，再形成条件事件。命中后要处理冷却、去重、范围和有效期，最后回调任</text>
<text x="9000" y="8912" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">务或 Advisor，不能直接宣称动作成功。</text>
<text x="9000" y="8976" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜看到目标对象只是观察结果；业务认定条件满足后，才能唤醒未取</text>
<text x="9000" y="9018" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">消的任务，再进入实际执行。</text>
<text x="9000" y="9082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜规则误判、视觉误判、端侧资源不足和时序问题必须分开。6–7 秒等文</text>
<text x="9000" y="9124" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">档时延目标不是已经达成的实测，更不能统一写成固定 3/5 秒。</text>
<text x="9000" y="9188" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜误触发、漏触发、重复触发和命中到动作时延，各自的真值与测量点在</text>
<text x="9000" y="9230" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">哪里？</text>
<rect x="10600" y="5770" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-advisor"/>
<text x="10632" y="5822" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">主动服务：没有 Query 也能进入</text>
<text x="10632" y="5880" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Advisor 提建议，Planner 判断；不是模型自行获得执行授权</text>
<rect x="10664" y="6230" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="AD1"/>
<text x="10700" y="6282" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">1. 由新场景事实产生候选建议</text>
<text x="10700" y="6338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜静态 Advisor 围绕舒适、出行、情感、内容等方向，读取人、车、</text>
<text x="10700" y="6380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">环境和记忆等信息形成建议。它与监控未来目标的旧动态 Advisor 不是同一职责。</text>
<text x="10700" y="6444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜检测到上车后车内较热，可以产生降温建议；这与用户主动说“我</text>
<text x="10700" y="6486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">热”是两种入口，但都需要可靠事实和后续执行。</text>
<text x="10700" y="6550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜感知错、事实旧、没有适用车型能力时，建议可能不成立。建议质量不</text>
<text x="10700" y="6592" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能只看话术是否自然。</text>
<text x="10700" y="6656" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜是哪条新事实触发本次建议？为什么现在提出，而不是十分钟前或下车</text>
<text x="10700" y="6698" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">后？</text>
<rect x="10664" y="7060" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="AD2"/>
<text x="10700" y="7112" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">2. 先判断是否值得打扰</text>
<text x="10700" y="7168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜主动服务需要考虑总开关、场景时机、频率、重复、驾驶任务和用户</text>
<text x="10700" y="7210" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">当前对话；展示、播报和自动执行的边界不同，不能一次建议默认获得三种行为权限。</text>
<text x="10700" y="7274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜用户正在选路线时，降温建议是否延后、静默或不展示，要按交互</text>
<text x="10700" y="7316" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">策略处理；不能两个模块同时抢话。</text>
<text x="10700" y="7380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜框架要保留被抑制的原因，才能区分建议不准与没送达。用户拒绝后的</text>
<text x="10700" y="7422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">降频也应明确。</text>
<text x="10700" y="7486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜可见建议的分母是生成数还是实际送达数？负向打扰如何标注与回归？</text>
<rect x="10664" y="7890" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="AD3"/>
<text x="10700" y="7942" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">3. 进入同一决策链，再记录真实结果</text>
<text x="10700" y="7998" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜有效 Advisor input 进入 03，与 Context 一起交 04 判断。用</text>
<text x="10700" y="8040" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">户采纳后通过相应工具执行，结果仍回 07；旧 Goal 监控建议也不能绕过真实执行</text>
<text x="10700" y="8082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">与结果闭环。</text>
<text x="10700" y="8146" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜用户接受降温建议后，要能确认实际控制成功；只点了“接受”但</text>
<text x="10700" y="8188" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">空调没变，不能计为完整行为成功。</text>
<text x="10700" y="8252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜建议生成、送达、点击、执行开始、最终完成是不同漏斗。拒绝与关闭</text>
<text x="10700" y="8294" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">也要反馈，避免重复打扰。</text>
<text x="10700" y="8358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜是否能从一条建议追到对应工具调用与真实结果？不能只有点击率而无</text>
<text x="10700" y="8400" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">兑现率。</text>
<rect x="12300" y="5770" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-visible-ui"/>
<text x="12332" y="5822" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">可见即可说与任务中心回流</text>
<text x="12332" y="5880" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">页面可见 → 词表匹配 → 原按钮回调 → 业务确认</text>
<rect x="12364" y="6230" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="UI1"/>
<text x="12400" y="6282" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">1. 只注册最顶层可操作页面</text>
<text x="12400" y="6338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜OEM 或业务方解析当前最顶层页面的可交互元素，建立文字指令与元</text>
<text x="12400" y="6380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">素 ID 映射，页面变化时更新。隐藏页面、已过期卡片不能继续作为可点击对象。</text>
<text x="12400" y="6444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜路线卡片展示三条路线时，“第三条”必须关联当前卡片的第三项，</text>
<text x="12400" y="6486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">而不是旧卡片里同位置的元素。</text>
<text x="12400" y="6550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜框架有单页词表容量与动态更新约定，具体版本需核对；它不直接证明</text>
<text x="12400" y="6592" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">所有业务页面均已接入。</text>
<text x="12400" y="6656" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜谁注册、谁更新、谁清理旧词表？页面切换后多久旧 ID 失效？</text>
<rect x="12364" y="7060" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="UI2"/>
<text x="12400" y="7112" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">2. ASR 与匹配决定候选，不替业务决定</text>
<text x="12400" y="7168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜框架区分免唤醒离线识别与唤醒后的在线/离线策略，并有精确、模糊</text>
<text x="12400" y="7210" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">和局部匹配。识别到多个候选元素时，由注册方消歧；不能让 ASR 擅自选择业务目</text>
<text x="12400" y="7252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">标。</text>
<text x="12400" y="7316" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜同页多个“确认”按钮，需要位置或业务上下文消歧；只识别出“</text>
<text x="12400" y="7358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">确认”这两个字，不能证明已经选对了路线确认。</text>
<text x="12400" y="7422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜词表、匹配规则与优先级按真实版本检查。框架文档里的能力阈值不是</text>
<text x="12400" y="7464" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">每种车型都已实测达标。</text>
<text x="12400" y="7528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜误识别、匹配错、元素过期、消歧错，能否分别找到日志与责任边界？</text>
<rect x="12364" y="7890" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="UI3"/>
<text x="12400" y="7942" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">3. 模拟点击回到原业务，不直接控车</text>
<text x="12400" y="7998" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜匹配到元素后，OEM 或业务方触发模拟 UI 点击，走原按钮回调。手</text>
<text x="12400" y="8040" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">点与语音点击应能回到同一业务处理；历史需要标为模拟点击事件，避免又作为普通 </text>
<text x="12400" y="8082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Query 重做一次。</text>
<text x="12400" y="8146" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜选中第三条路线，先回路线业务；若业务据此自动导航，再记录真</text>
<text x="12400" y="8188" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">实导航状态。不能画成“说第三条→直接调用车控”。</text>
<text x="12400" y="8252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜UI 点击成功不等于原业务收到，更不等于车辆生效。执行前条件改变时</text>
<text x="12400" y="8294" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">是否复核，是业务契约必须确认的边界。</text>
<text x="12400" y="8358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜能否证明元素命中、回调收到、选择生效、业务执行四步都完成？</text>
<rect x="12364" y="8720" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="UI4"/>
<text x="12400" y="8772" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">4. 任务中心展示状态，不创造状态</text>
<text x="12400" y="8828" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜任务中心应消费任务/运行状态与消息，而不是自己凭卡片展示就宣布</text>
<text x="12400" y="8870" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">完成。新 Task 设计通过持久化 Binding 与 recommend_id 恢复关联；客户端交</text>
<text x="12400" y="8912" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">互回正确 Task/Run 后再继续。</text>
<text x="12400" y="8976" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜用户确认提醒卡片后，要恢复原任务；如果此时任务已取消或条件</text>
<text x="12400" y="9018" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">已失效，不能仅因为按钮还可点就重新执行。</text>
<text x="12400" y="9082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜发送消息、卡片展示、用户确认、动作生效和任务关闭必须分别核对。</text>
<text x="12400" y="9124" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">当前车型具体支持修改还是仅删除，需按实际接入范围确认。</text>
<text x="12400" y="9188" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜界面“已完成”与后端 Run、工具结果是否一致？取消后旧卡片还能否</text>
<text x="12400" y="9230" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">触发动作？</text>
<text x="400" y="10180" font-size="40px" font-weight="750" fill="#0D4FA8" text-anchor="start">06 的工具能力展开 · 27 项定义，不是 27 个必经步骤</text>
<text x="400" y="10244" font-size="28px" font-weight="400" fill="#466174" text-anchor="start">实际调用只选择当前需要的工具；定义数、车型注入数、后端可用数和真实成功覆盖必须分开。</text>
<rect x="400" y="10410" width="2020" height="300" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="H-family-0"/>
<text x="436" y="10462" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">车控、系统与驾驶</text>
<text x="436" y="10518" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能力类别｜关键问：一条自然语言车控，在哪里变成原子动作？谁校验车型/座位/车态？</text>
<rect x="450" y="10850" width="1920" height="1020" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="T1"/>
<text x="486" y="10902" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">01  车辆基础控制</text>

<text x="7882.5" y="9979" font-size="25px" font-weight="650" fill="#667F8C" text-anchor="middle">A1  静态 Advisor 建议回 03；与用户 Query 共用同一决策入口</text></svg><div class="hint">点连线看起点终点 · 拖拽移动 · 滚轮缩放 · 双击框放大</div><div class="map" id="map" aria-label="全图定位"></div><div class="zoom"><button id="minus" aria-label="缩小">−</button><span id="zoomValue"></span><button id="plus" aria-label="放大">＋</button><button id="fitCurrent">适配当前框</button></div></div></section><aside class="inspector"><div class="ins-head"><div class="tabs" id="tabs"><button data-tab="explain" class="active">逐段解释</button><button data-tab="connections">上下游连线</button><button data-tab="learn">自测与指标</button><button id="closePanel" aria-label="收起说明">×</button></div></div><div class="ins-content" id="insContent"></div></aside></main><div class="toast" id="toast" role="status" hidden></div><script type="application/json" id="data">{"version":12,"width":13920,"height":22502,"groups":[{"id":"voice","num":"01","title":"把声音变成一轮请求","owner":"车端 · 语音与输入接入","out":"最终文本＋说话人＋位置","intro":"这里还没有开始规划。先保证系统收到的，确实是用户刚才表达的完整意思。","steps":[{"id":"V1","title":"接收说话，而不是接收一句现成文字","paras":[["这一步怎么做","用户说话后，语音链路处理麦克风输入、唤醒或免唤醒条件、回声与噪声。音区定位帮助判断声音来自哪一排、哪一个座位；这些是输入可靠性的前提，具体开关与算法部署须按车端版本核对。"],["放进同一个例子","主驾说：“我有点热，带我去昨天的游泳馆。”系统此时拿到的是声音；车内播报、后排交谈不能自动变成主驾指令。"],["异常与交接","没有录音权限、语音未开启、声音未被有效接收时，应在入口解释或停止，不能把空输入交给模型后要求它猜。"],["产品要问清","原始音频能否与这一次请求对应？音区与注册身份发生冲突时，哪个信息可靠？"]]},{"id":"V2","title":"ASR：把声音识别为文字","paras":[["这一步怎么做","语音识别（ASR）可能先产生增量文字，再形成最终文字。产品验收要看完整语义：人名、地点、数字、“不要”等否定，以及“十分钟后”等时间条件，不能只看平均字错率。"],["放进同一个例子","应保留“有点热”和“昨天的游泳馆”两个诉求。如果“昨天”丢失，后续就会把历史地点理解成附近搜索。"],["异常与交接","ASR 结果不确定、被截断或多人重叠，需要相应的重说、确认或排队策略。Planner 能处理歧义，但不能可靠补回从未收到的语音证据。"],["产品要问清","原音频、识别文字、最终传入 Query 的文字，是否在同一条日志中可对齐？"]]},{"id":"V3","title":"判停、续说与请求归属","paras":[["这一步怎么做","输入接入要确定本轮说话什么时候结束，补充的半句话是续说还是新请求，并携带说话人、位置和时间。注册身份与座位不是同一个概念：位置影响车控对象，身份影响可读取谁的记忆。"],["放进同一个例子","“我”指当前说话人；降温要考虑其位置，查“昨天去过哪里”则需要关联其身份。不能拿后排乘员的经历替主驾作答。"],["异常与交接","用户边说边补“别开窗”，如果前半句已触发执行，就会出现时序问题。判停策略、已下发动作和取消能力要一起验收。"],["产品要问清","两人同时说话是合并、排序还是打断？每一轮在下游还能否保持原始归属？"]]},{"id":"V4","title":"封装 Query，交给选路模块","paras":[["这一步怎么做","把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的明确请求。"],["放进同一个例子","交接内容可以理解为：主驾在此刻提出“降温＋去昨天的游泳馆”。具体字段名与运行版本对齐，不用示意字段冒充真实接口。"],["异常与交接","用户说“算了”或再次发声，可能是取消、改目标或仅打断播报。输入层记录新事实，业务层再决定影响哪些动作和等待任务。"],["产品要问清","能否还原原话、当前轮输入、历史记录三者？本轮关联是否在后续调用与反馈中保留？"]]}],"learn":["voice"],"x":400,"y":920,"w":1220,"h":4110,"kind":"main"},{"id":"route","num":"02","title":"决定走快路还是规划","owner":"端侧候选＋云端拒识/仲裁","out":"唯一被选中的处理路径","intro":"端侧小模型和云端推理是协作关系。生成了两个候选，不代表可以执行两遍。","steps":[{"id":"R1","title":"端侧 FC 先形成动作候选","paras":[["这一步怎么做","端侧函数调用模型（FC）把高频简单指令理解为本地能力可承接的动作。Director PRD 的基线是：命中白名单时优先端侧快速执行。白名单、车型能力和合法参数须一起满足。"],["放进同一个例子","“把主驾车窗关上”可能走快路；“十分钟后关车窗”包含未来条件，不能截掉时间后立即关窗。本例含历史地点依赖，应避免被整句当成简单车控。"],["异常与交接","端侧输出首先是候选。没命中白名单时，不能仅因本地先返回，就抢先执行云端还在判断的请求。"],["产品要问清","哪一份车型配置定义白名单？复杂请求误走快路后，是否已造成真实动作？"]]},{"id":"R2","title":"云端先判断是不是对助手说","paras":[["这一步怎么做","云端拒识模块判断输入是否应作为对助手的请求。PRD 区分“明确拒识”和“拒识超时”：拒识内容进 Context 事件日志，供背景感知；拒识超时按该 PRD 进入 Director。"],["放进同一个例子","乘员聊天说“昨天那个游泳馆太冷了”，不自动等于要求导航。被拒识的内容可以是背景信息，但不能直接按指令执行。"],["异常与交接","拒识错误可能导致漏响应或乱执行。拒识超时也不等于整个云请求超时，两种异常的后续路由不同。"],["产品要问清","某条 badcase 是被拒识了、意图判错了，还是已经进 Planner 后才理解错了？"]]},{"id":"R3","title":"简单意图给 FC，复杂依赖给 Planner","paras":[["这一步怎么做","PRD 的云端基线为：未拒识、仲裁为车控且属于约定意图时交 FC；其余有效请求交 Planner。不要把历史“句法 RAG→情景 RAG→Planner”概括直接当成所有版本的固定串行拓扑。"],["放进同一个例子","本例要先知道昨天去的是哪家，再规划路线；降温还需要车况和乘员约束。这些依赖必须由复杂链保留，不是按关键词分成两个互不相干的命令。"],["异常与交接","简单与复杂的边界、六类意图清单、云端 FC 所在位置，要以目标车型的当前配置和 Trace 核验。"],["产品要问清","条件、记忆、跨工具依赖、情景约束，各有哪些容易被简单模型过召的反例？"]]},{"id":"R4","title":"端云仲裁与超时只选一次执行","paras":[["这一步怎么做","按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，需要运行日志证明。"],["放进同一个例子","本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。"],["异常与交接","端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能声称所有需要记忆或联网的能力仍能离线完成。"],["产品要问清","同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎样证明只执行一次？"]]}],"learn":["fast","route"],"x":2100,"y":920,"w":1220,"h":4110,"kind":"main"},{"id":"context","num":"03","title":"准备本轮真实上下文","owner":"云端 · 入口与 Context","out":"本轮输入＋事实＋历史＋工具","intro":"Context 是模型这一次真正看得到的信息。事后知道的事实，不等于模型当时收到过。","steps":[{"id":"C1","title":"区分这一次是谁来叫醒 Planner","paras":[["这一步怎么做","入口接收用户 Query、Advisor 建议、工具反馈，部分新版输入还包含事件。三者含义不同：用户在提目标，Advisor 在建议，工具在汇报执行或查询结果，不能都当成用户重新下令。"],["放进同一个例子","第一轮收到主驾 Query；查完记忆后再进来的，是“这位用户昨天去了某游泳馆”的工具结果，不是用户又说了一遍需求。"],["异常与交接","同名工具并发、重试和迟到反馈必须能够回到正确动作与目标。当前 SP 的简化反馈字段不足以证明完整的工程关联协议。"],["产品要问清","能否查到本轮 input 类型，以及它属于哪位用户、哪个未完成目标、哪次调用？"]]},{"id":"C2","title":"带上当前车况、身份和相关记忆","paras":[["这一步怎么做","入口把相关端状态、默认情景感知、用户记忆及当前目标等信息整理给模型。状态要区分来源、时间和未知值；当前车况、昨天的行程、说明书知识，不能混成一种事实。"],["放进同一个例子","如果空调已经开着、用户不喜欢风直吹，降温方案就不能机械地“开空调＋最大风”。如果没带入昨天的地点，就需要调用记忆查询工具。"],["异常与交接","“没有这个字段”不等于数值为零，也不等于设备关闭。旧车况和新手动操作冲突时，必须按有效来源与时间判断。"],["产品要问清","哪些事实是本场景做对所必需的？是哪一步没采到、没传到、被过滤或被旧历史覆盖？"]]},{"id":"C3","title":"组织对话历史与本轮示例","paras":[["这一步怎么做","历史帮助理解“那家”“再低一点”等省略表达；本轮动态示例只为当前 Query 提供参考，不等于真实执行结果。先澄清或改写省略信息再检索示例，与把全历史直接作为示例，是两回事。"],["放进同一个例子","用户后来只说“换另一条”，需要知道上一轮选的是哪条路线。历史里必须保留影响本目标的选择和未完成事项，而不是只剩助手说过“好的”。"],["异常与交接","压缩远区历史可以省输入，但不能删除未完成动作、失败反馈或用户否定。重复明确车控是新请求，不能用历史成功代替本轮执行。"],["产品要问清","有无示例对照实验是否改善保留测试集？是否把错误示例、其他车企能力或过时工具名带进来了？"]]},{"id":"C4","title":"组装 SP/UP，进入同一个 Planner","paras":[["这一步怎么做","系统规则（SP）说明角色、可用工具和输出要求；本轮与历史输入（UP）提供事实和事件。车型、环境、工具版本、场景 knowhow 与动态变量共同决定模型可做什么。"],["放进同一个例子","模型现在应清楚：用户要降温和去某个历史地点；已知车况有哪些；哪些信息还缺；本轮能调用哪些工具。之后才进入 04 规划。"],["异常与交接","本地 SP 的 27 个工具只是定义快照；不能据此说每台车线上都开放 27 个。缺事实应查或问，不能用漂亮的提示词替代真实数据。"],["产品要问清","你能否拿到这一次模型实际看到的完整输入？如果换一份正确上下文，错误是否随之消失？"]]}],"learn":["context"],"x":3800,"y":920,"w":1220,"h":4110,"kind":"main"},{"id":"planner","num":"04","title":"理解目标并决定下一步","owner":"云端 · Planner＝Director","out":"话术决策＋action_list","intro":"Planner 与 Director 是同一决策模块的两种叫法，不是串行的两颗“大脑”。","steps":[{"id":"P1","title":"先拆完整目标，再检查约束","paras":[["这一步怎么做","Planner 理解用户真正想达成什么，并保留对象、位置、时间、偏好和禁止事项。它不是直接操作车辆，而是在当前事实与能力边界下，决定本轮应该行动、查信息、询问还是等待。"],["放进同一个例子","本例有两个子目标：让当前乘员更凉快；导航去他昨天去过的游泳馆。完成其中一个，不等于整句话已经办妥。"],["异常与交接","不应擅自增加高影响动作，也不能为追求“多工具能力”额外开窗、改路线或改账号设置。无依据动作要单独计入失败。"],["产品要问清","这条 Query 的完整成功标准是什么？哪些动作是必要的，哪些只是模型自己发挥？"]]},{"id":"P2","title":"缺事实就查询，缺选择就询问","paras":[["这一步怎么做","查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。"],["放进同一个例子","如果昨天地点未在 Context 中，先调用 user_memory_search。若返回两个可能地点，就问用户选哪一个；不能自行挑一家立即导航。"],["异常与交接","查无记忆、无注册身份、存在多候选、工具不可用，是不同的恢复分支。用户提供新信息后，要继续原目标而不是忘记降温这一半。"],["产品要问清","为什么这一步要查工具，不直接问用户？又为什么多候选时不能继续替用户决定？"]]},{"id":"P3","title":"按依赖安排动作，改写给下游","paras":[["这一步怎么做","独立动作可以分别推进；有依赖的动作必须等前一步结果。工具指令要把代词、对象和约束改写得下游能理解。SP 还明确要求 POI、路线规划、导航控制串行互斥。"],["放进同一个例子","降温相关行动与查询历史地点可以在条件允许时独立推进；路线规划必须等具体地点。不能在查“昨天那家”的同时，凭空给路线工具一个地址。"],["异常与交接","是否并发由能力、依赖和实际调度契约共同决定，不是“模型一次输出多个 action 就一定并行”。串行安全要求也不能仅凭提示词就认为已保证。"],["产品要问清","哪个结果是下一步必需的输入？哪一条日志能证明工具实际按正确顺序执行？"]]},{"id":"P4","title":"生成本轮决定，而不是宣布一切完成","paras":[["这一步怎么做","输出包含是否说话、说什么、表情与 action_list。需要工具时进入 05；不需要工具或需要澄清时可直接走 T1 到 08。未来条件或持续目标进入下方 Task/旧 Goal 支路，不应立即执行目标动作。"],["放进同一个例子","第一轮可以查历史地点、执行合法的降温动作；收到记忆结果后再规划路线。最终结果要等真实回报，不是第一轮就说“已经导航好了”。"],["异常与交接","talk_content 与 action_list 要一致。用户取消后，应区分停止播报、取消当前动作和撤销未来任务，不能用一句“好的”代替状态处理。"],["产品要问清","模型选错时，证据指向输入缺失、工具描述、示例干扰，还是信息齐全后的推理失误？"]]}],"learn":["planner"],"x":5500,"y":920,"w":1220,"h":4110,"kind":"main"},{"id":"dispatch","num":"05","title":"把计划交给可用工具","owner":"云端/端侧 · 工具调用与业务门禁","out":"通过前置条件的实际调用","intro":"action_list 是计划。校验、调度与真实执行，是随后发生的事情；统一门禁实现仍须按版本核验。","steps":[{"id":"D1","title":"查到真实注册的工具与参数契约","paras":[["这一步怎么做","调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 Task 接口不混算成第 28 个线上工具。"],["放进同一个例子","查记忆使用 user_memory_search；历史地址确定后使用 route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工具。"],["异常与交接","SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型不支持，应有可解释失败，而不是静默丢弃。"],["产品要问清","能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表逐项对齐？"]]},{"id":"D2","title":"校验身份、车态与外部副作用","paras":[["这一步怎么做","动作下发前，需要按各领域契约检查对象、取值、车态、用户权限和必要确认。这里是产品必须明确的边界，不代表已验证公司存在一个万能的统一校验服务。"],["放进同一个例子","主驾说“给副驾降温”，控制对象要明确；查记忆不能串到副驾身份。通讯、预订、记忆写入等会产生额外副作用，更不能把理解正确等同于获准提交。"],["异常与交接","非法参数、不支持功能、前置条件变化时，应拦截或请用户确认。是否由 Planner、调度层、Agent 或车端执行检查，要逐个工具说清。"],["产品要问清","谁拦非法动作？谁对接被拦后的可用替代方案？权限测试是否只测成功路径？"]]},{"id":"D3","title":"按顺序派发，并保留调用关联","paras":[["这一步怎么做","把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返回的结果。"],["放进同一个例子","查完记忆拿到地址，再把地址交给路线规划；降温动作的反馈与路线反馈分别记录，不能先回来的一个成功覆盖整个目标。"],["异常与交接","取消、重试、超时后迟到结果必须有明确处理。当前 SP 的反馈示意只有 tool_name 与文本，无法据此推断 action_id 回绑已完善。"],["产品要问清","反馈怎么找到那一次调用？两个同名调用反序返回、旧结果迟到，系统会不会串结果？"]]},{"id":"D4","title":"决定重试时先确认有没有做过","paras":[["这一步怎么做","查询失败和写操作超时不能使用同一重试策略。查询可按预算重试；订座、拨号或记忆写入超时，应先确认已有操作状态，再决定是否补做，避免重复副作用。"],["放进同一个例子","如果路线工具返回失败，遵守 SP 约定的最多两次重试；如果订座提交超时，则不能照搬这条策略连订几次。"],["异常与交接","重试次数、超时预算、幂等键、取消能力和失败原因，需要工具契约支持。文档没提供的字段不能当成已上线机制。"],["产品要问清","这个工具超时意味着没执行，还是执行了但没回报？有什么查询或回执能证明？"]]}],"learn":["orchestration"],"x":7200,"y":920,"w":1220,"h":4110,"kind":"main"},{"id":"execute","num":"06","title":"领域理解到真实业务生效","owner":"领域 Agent / 服务 / 车型适配 / 车端","out":"查询事实、候选或实际业务结果","intro":"一项工具可能包含多步理解、检索和执行。模型输出成功、接口受理、业务生效必须分开看。","steps":[{"id":"E1","title":"领域工具再理解具体请求","paras":[["这一步怎么做","有的工具接自然语言 query，再由领域能力理解；有的接结构化参数或调用服务。进入工具并不意味着直接碰到车辆。具体是否再调 SFT、规则或其他模型，需看该工具实现，不能全体套同一种架构。"],["放进同一个例子","vehicle_basic_control 要把降温诉求落到具体功能、位置和数值；user_memory_search 则检索对应用户的经历，二者内部机制不同。"],["异常与交接","领域工具也可能漏掉否定或位置约束。如果 Planner 发出的指令正确、工具解释错了，责任不能继续算到 Planner。"],["产品要问清","能否看到工具收到的原始输入、内部解析结果和实际调用的下级能力？哪里第一次变错？"]]},{"id":"E2","title":"检索/候选/选择，不等于执行完成","paras":[["这一步怎么做","信息类工具返回事实，搜索类工具可能返回候选，部分工具同时执行。SP 约定 music_search 通常自动播放首条；route_planning 在选定路线后会自动导航，不能再机械地补一次开始。"],["放进同一个例子","历史地点唯一且明确时交路线规划；若还要用户选择路线，先展示候选并等待。候选列表出现不等于导航已进入正确状态。"],["异常与交接","无候选、结果过期、选项已失效、用户点错或改变主意都要回到业务处理。不能把“找到内容”当成“已经播放/已经导航”。"],["产品要问清","这个工具究竟只查询，还是查询后自动行动？用户选择会在哪个事件里返回？"]]},{"id":"E3","title":"调用底层服务或车型能力","paras":[["这一步怎么做","真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里才可能产生真实副作用。"],["放进同一个例子","车控接口让空调或风量发生变化；路线工具让正确目的地进入导航状态。这两条链各自成功，才有可能完成本例。"],["异常与交接","SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前车态改变、资源受限、服务不可用，都可能让先前合法计划失败。"],["产品要问清","回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功口径如何保守定义？"]]},{"id":"E4","title":"收集结果，并给出可核验依据","paras":[["这一步怎么做","工具把事实、候选、处理中、成功或失败等业务含义交回。对于车控，应把指令回执与真实车况分开；对于导航或订单，要核对业务状态，而不是只看 HTTP 或模型文本。"],["放进同一个例子","降温要核对空调/风量等目标变化；导航要核对目的地和导航状态。仅“调用成功”不足以支撑“两个目标都完成”。"],["异常与交接","下游无法提供真实状态时，要保留“不确定/已受理”等语义，并明确待补的回读契约，不能包装成已完成。"],["产品要问清","每种结果对应哪条日志或状态证据？用户说“根本没变”时，系统能定位到哪一跳？"]]}],"learn":["orchestration","output"],"x":8900,"y":920,"w":1220,"h":4110,"kind":"main"},{"id":"feedback","num":"07","title":"观察结果，更新剩余目标","owner":"反馈接入 → Context → 同一 Planner","out":"继续行动 / 询问 / 等待 / 结束","intro":"一轮推理并不等于一次完整任务。查信息、拿候选、用户选择，都可能使同一个目标再次进入推理。","steps":[{"id":"F1","title":"工具结果回到正确请求","paras":[["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"]]},{"id":"F2","title":"把结果当新事实，不覆盖未完事项","paras":[["这一步怎么做","Context 需要反映新结果、用户选择和实际车况。已经完成的子目标保留证据，尚未完成的继续存在。历史成功也不能覆盖用户刚刚手动改变的状态。"],["放进同一个例子","查到昨天去的游泳馆后，新增的是一个可用地点；导航还没执行。空调成功后如果用户手动关掉，也必须记录新车态。"],["异常与交接","“工具调用过”与“目标完成”不同；“上一轮做过”与“本轮不必再做”也不同。远区压缩尤其不能抹掉尚未完成的依赖。"],["产品要问清","你能在新一轮实际输入中看到上一步结果吗？模型是否仍在用过时的车况？"]]},{"id":"F3","title":"未完成就回 03，再由 04 决策","paras":[["这一步怎么做","如果仍缺信息、需要调用下一工具或修正失败，沿 R1 回到 03 组装本轮输入，再由同一个 Planner 判断。不是把结果交给另一个名叫 Director 的模型重新开始。"],["放进同一个例子","第二轮拿到地址后调用路线规划；如果返回多个路线，再等待用户选择；导航状态确认后才关闭导航子目标。"],["异常与交接","失败可选择重试、换方案、澄清或明确终止，但必须受能力与副作用约束。不能无限重试，也不能在用户取消后重新激活旧目标。"],["产品要问清","每一轮新增了什么有效信息？为什么有必要再推理一次，而不是重复调用同一个工具？"]]},{"id":"F4","title":"能证明什么，就汇报到什么程度","paras":[["这一步怎么做","根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。"],["放进同一个例子","如果降温成功但地点没找到，就说清已处理降温、地点仍需确认；不能说“都安排好了”。如果两者都生效，才给完成反馈。"],["异常与交接","业务结果与用户满意度还需分开：导航已正确开始不等于用户对路线满意；空调参数变化也不等于用户已经感到舒适。"],["产品要问清","系统每一次“已完成”是否都有证据？假完成率的分母必须是宣称完成的请求。"]]}],"learn":["planner","output"],"x":10600,"y":920,"w":1220,"h":4110,"kind":"main"},{"id":"output","num":"08","title":"让用户听到、看到并继续","owner":"云端话术＋车端 TTS / 卡片 / 交互","out":"用户可见结果＋下一次输入事件","intro":"说、显、做是相互约束的输出，不是“TTS→虚拟形象→车控”的一条串行链。","steps":[{"id":"O1","title":"决定说不说、说到哪一步","paras":[["这一步怎么做","Planner 的 talk_content 用于生成对话输出；查询、简单控制等场景不一定需要无意义的“我帮你查一下”。部分领域 Agent 也会自己播报，需要避免重复或抢话。"],["放进同一个例子","若地点仍在确认，可以先说明必要的下一步；若空调成功而导航失败，应明确部分结果。不能在动作尚未发生时用完成时态承诺。"],["异常与交接","话术要与本轮实际动作、失败和等待一致；安全或重要结果不能被普通过渡语覆盖。具体播报优先级按运行策略核验。"],["产品要问清","谁负责首响应，谁负责领域结果，谁负责总结？有没有重复播报和抢话测试？"]]},{"id":"O2","title":"TTS、卡片与形象各走交互通道","paras":[["这一步怎么做","文字转语音（TTS）让用户听见；卡片展示候选、进度或业务结果；虚拟形象可以配合情绪表达。车控执行是 06 的独立业务链，不需要等形象播完才必然发生。"],["放进同一个例子","可以一边完成降温，一边展示路线候选；用户看见卡片与真实导航启动是不同的两个事件。avatar 或动画不能充当“车控成功”的证明。"],["异常与交接","卡片请求被受理不等于已经显示：可能排队、被覆盖、过期或不在前台。首播、首卡片、首动作、最终完成要分开记时。"],["产品要问清","显示成功在哪个回执里？UI 动效、工具成功和真实车况是否被错误地共用一个成功字段？"]]},{"id":"O3","title":"用户手点或说“第三个”，回原业务","paras":[["这一步怎么做","手动选择与可见即可说需要找到当前可操作元素，再触发原业务按钮回调。关键选择结果应回到 Context；未完成的任务继续判断，不能让一次点击丢失前面的目标。"],["放进同一个例子","用户选第三条路线后，由路线业务完成其既定选择/导航流程，再把结果回给系统；不应把“第三个”单独当成没有上下文的新地点。"],["异常与交接","页面已切换、候选过期、同名按钮、任务已取消时，不能照旧点击。可见即可说的详细匹配链在本列下方展开。"],["产品要问清","原业务收到的是哪个选项 ID？实际选择有没有进入下一轮模型输入？"]]},{"id":"O4","title":"打断、改目标与取消分别处理","paras":[["这一步怎么做","新语音从 01 进入；与当前业务相关的点击事件可沿 U1 回 03。打断播报不自动取消已下发车控；取消一次执行也不自动删除长期任务，这些必须用业务状态区分。"],["放进同一个例子","用户说“先别去了”应影响导航目标，但是否保留已完成降温要按原意处理；用户仅把音量调低，不应让历史任务重新执行。"],["异常与交接","完整闭环最后还要记录失败与用户反馈，进入评测和改进。产品经理需要能追这一条链，而不是必须实现每个底层模型后才有资格判断好坏。"],["产品要问清","同一案例能否讲清成功标准、最早出错点、责任边界、改法和回归结果？"]]}],"learn":["output","visible-ui"],"x":12300,"y":920,"w":1220,"h":4110,"kind":"main"},{"id":"input-detail","parent":"voice","title":"输入侧还要分清的三件事","intro":"补充机制 · 不改变主线的入口归属","steps":[{"id":"IV1","title":"声音结束与系统开始响应之间","paras":[["这一步怎么做","尾延迟从用户实际结束说话到最终 Query 就绪计量。唤醒等待、判停等待、网络传输和模型首响应是不同段；只报一个总平均值，无法确定真正的慢点。"],["放进同一个例子","本例若“游泳馆”末尾被截掉，再快的 Planner 首 token 也没有意义。"],["异常与交接","质量与时延应在同一测试集上对照，避免用过早判停换取更快响应。"],["产品要问清","是否单独保留关键否定、地点、数值的识别准确性，以及 P50/P95 尾延迟？"]]},{"id":"IV2","title":"声纹、音区与人脸注册身份","paras":[["这一步怎么做","座位说明声音来自哪里，注册身份说明能使用谁的数据。不同信息源可能缺失或冲突；产品需要定义未知身份如何交互，不应默认音区定位正确就能读取历史记忆。"],["放进同一个例子","主驾换人后，不能继续拿上一位驾驶员的“昨天游泳馆”。"],["异常与交接","无身份时可以问用户地点，或按允许的匿名能力处理；不能假装记忆已命中。"],["产品要问清","身份切换、多人同时说话、人脸未识别与临时换座，各自会影响什么字段？"]]},{"id":"IV3","title":"同一条语音也可能命中页面操作","paras":[["这一步怎么做","可见即可说可以把语音转成当前页面按钮动作；普通自然语言则进入主请求链。两者的优先级不能只用“有端侧小模型”概括，需核对当前车型的页面注册和路由策略。"],["放进同一个例子","用户面对路线卡片说“第三个”，需要页内元素匹配；没有有效页面时不能随意猜按钮。"],["异常与交接","框架 PRD 存在页面语音的优先级要求，但它不能证明每种卡片已经完成接入。"],["产品要问清","命中页面操作后，是否还会作为普通 Query 再执行一次？"]]}],"learn":["voice","visible-ui"],"x":400,"y":5770,"w":1220,"h":3870,"kind":"supplement"},{"id":"local-trigger","parent":"route","title":"端侧触发器与本地闭环","intro":"条件事件入口 · 不必等用户再次开口","steps":[{"id":"LT1","title":"先有可执行规则，才有本地等待","paras":[["这一步怎么做","配置侧需定义适用范围、信号、条件和动作，再下发端侧。端侧必须确认规则能被感知和执行；云端发布成功不能代替车端已获取、校验并生效。"],["放进同一个例子","系统预设“某车况满足后建议处理”时，先明确车型、信号单位、枚举与动作范围。"],["异常与交接","非法配置、能力缺失、版本未生效，应反馈具体失败，而非永远显示“等待中”。"],["产品要问清","规则版本在哪能读到？由谁负责场景方案、谁配置、谁提供实车验收？"]]},{"id":"LT2","title":"变化事件唤醒，快照提供判断事实","paras":[["这一步怎么做","变化上报用于唤醒相关规则；定时轮询用于提供快照。条件求值需要明确读哪个时刻的状态，并处理多个条件组合、持续时间和抖动，不能只看一个变化事件就认定全部满足。"],["放进同一个例子","车门打开事件可以唤醒规则，但是否主驾在座、车辆是否驻车，还要读对应事实。"],["异常与交接","未达成不是能力未覆盖。暂时不满足应继续等待；根本观测不到才是能力或配置问题。"],["产品要问清","事件发生、采集、缓存更新与求值的时间先后能否完整还原？"]]},{"id":"LT3","title":"命中还要经过抑制，再执行与回读","paras":[["这一步怎么做","满足条件后还要核对冷却、去重、范围、取消和冲突策略，再进入执行域。端云可能同时对同一场景有判断，谁持有执行权需要真实契约，不应假定天然不会重复。"],["放进同一个例子","一个持续为真的条件不应每次快照都再做同一动作；用户刚取消的任务也不应被迟到事件唤醒。"],["异常与交接","端侧资源不足、队列拥塞、规则更新、重启或断网恢复可能导致漏触发或旧事件补触发，必须作为独立测试维度。"],["产品要问清","错误来自规则、端侧资源、模型语义还是软硬件时序？哪条证据能排除另外三类？"]]}],"learn":["config","end-trigger","cloud-trigger"],"x":2100,"y":5770,"w":1220,"h":3870,"kind":"supplement"},{"id":"state-data","parent":"context","title":"状态、感知与记忆怎样进来","intro":"数据供给面 · 不把所有数据画成串行前置","steps":[{"id":"SC1","title":"端状态中心与云端缓存各有职责","paras":[["这一步怎么做","车辆信号、应用状态、用户操作、默认感知等在端侧形成状态与事件，再按协议上报云端并被 Context 使用。缓存表示已保存的已知事实，不是保证仍然最新的事实。"],["放进同一个例子","用户手动关了空调，应产生相应状态或事件；否则模型可能继续使用刚才“空调打开成功”的历史。"],["异常与交接","全量、增量、轮询和变化上报的使用范围需逐个信号确认。丢包、时钟差、乱序必须反映在新鲜度判断里。"],["产品要问清","每个关键字段来自哪里、多久更新、缺失怎么表达？云端如何知道值已经过期？"]]},{"id":"SC2","title":"默认感知与记忆不是一回事","paras":[["这一步怎么做","默认视觉可提供此刻舱内外观察；用户记忆提供归属于某人的经历与偏好；事件日志记录交互和变化。不同资料对“现在”“过去”“长期偏好”的含义不同。"],["放进同一个例子","宝宝正在后排睡觉是当前观察；用户不喜欢直吹是偏好；昨天去某游泳馆是历史经历。三者可能共同影响这一次规划。"],["异常与交接","观察不可见、记忆查无结果、历史无记录，都不应被解释为“没有发生”或“用户没有这个偏好”。"],["产品要问清","模型的某句判断究竟用了哪类证据？是否把历史状态误当当前事实？"]]},{"id":"SC3","title":"动态示例与 knowhow 只是参考","paras":[["这一步怎么做","场景 knowhow 说明处理范式；动态示例按本轮输入检索后临时注入。它们帮助模型选路和用工具，但不是实际车况，更不是某次动作已经发生的证据。"],["放进同一个例子","示例展示“先查昨天地点再规划”，不能让模型复制示例里的城市、车牌或用户身份。"],["异常与交接","检索错例、未注册工具、企业/环境隔离错误会诱发稳定的系统性 badcase；只调温度或换模型可能无法修好。"],["产品要问清","有无示例的保留集对照、错误检索案例、上下文长度和额外耗时是否一起看？"]]}],"learn":["context","signals"],"x":3800,"y":5770,"w":1220,"h":3870,"kind":"supplement"},{"id":"task","parent":"planner","title":"未来目标：旧 Goal 与新 Task","intro":"旧链与新设计分开 · 不表示两套同时执行","future":true,"steps":[{"id":"TK1","title":"先判断是以后做，不是现在做","paras":[["这一步怎么做","“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。"],["放进同一个例子","本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。"],["异常与交接","方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。"],["产品要问清","当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"]]},{"id":"TK2","title":"Task Agent 转发，服务内理解任务","paras":[["这一步怎么做","新设计中 Planner 把任务类型和文本交 Task Agent，后者是代理入口；Ingress 做关联恢复、幂等与语义/事件/查询分流。Spec Builder 再识别创建、修改或取消，生成命令和任务定义。"],["放进同一个例子","创建“到达后提醒”时，Planner 不必直接生成完整 TaskSpec；Task 服务负责把目标、条件与动作变成可管理定义。"],["异常与交接","任务操作识别、目标定位和参数补齐可能失败。不能把“请求已转发”当成“任务已可靠创建”。"],["产品要问清","谁判断用户是在新增、改旧任务还是取消？多条同类任务时如何找对目标？"]]},{"id":"TK3","title":"Manager 管状态，Trigger Adapter 接条件","paras":[["这一步怎么做","Manager 管理数量、生命周期和策略；Repository 保存 Task、Run、Event、Binding 等关联；Trigger Adapter 把可执行条件转换并注册到触发系统。等待成立以后才可对用户承诺已建立任务。"],["放进同一个例子","“到达游泳馆”要有可观测的条件和明确执行内容。只存了一段自然语言，却没注册可用条件，任务并不能真正等到未来。"],["异常与交接","新设计区分任务 waiting/running/closed 与单次 Run 的成功、失败、跳过、取消；等待用户或外部结果仍可能是一次运行中的阶段。"],["产品要问清","创建成功的证据是口头回复、Spec 生成，还是已持久化且条件订阅可用？"]]},{"id":"TK4","title":"条件到来后，恢复运行并可靠回写","paras":[["这一步怎么做","触发事件关联原任务后创建/恢复本次 Run，再由 Runtime 分发。通用执行可走 Planner/Agent/Tool；GUI 或生态 Provider 可管理内部步骤，不是所有任务都必须再次进 Planner。Result Hook 负责可靠回写与补偿。"],["放进同一个例子","到达事件出现后再次确认任务未取消、条件仍适用，再发送提醒。一次提醒完成后是关闭还是回到等待，取决于一次性或周期性定义。"],["异常与交接","Task Query 提供只读状态；Message Dispatcher 负责消息通道，不负责生命周期。推荐消息的 Binding 应先持久化，再用 recommend_id 恢复交互关联。"],["产品要问清","重复回调、客户端迟到、取消后的旧结果和服务重启，能否仍找到同一个 Task/Run？"]]}],"learn":["task"],"x":5500,"y":5770,"w":1220,"h":3870,"kind":"supplement"},{"id":"tools-contract","parent":"dispatch","title":"工具内部机制：逐跳拆开问","intro":"模型理解 / 业务校验 / 执行 / 回报，不合成一句“调用工具”","steps":[{"id":"TC1","title":"先数清口径，再研究重点工具","paras":[["这一步怎么做","本地 SP 可见 27 个唯一工具定义；当前车型运行时可能注入更少，后端支持集合也可能不同。工具名只是入口，不代表一个模型、一个服务或一个原子接口。"],["放进同一个例子","一个 vehicle_basic_control 可能覆盖许多车控动作；因此“有 27 个工具”不能推导出只有 27 个能力，也不能衡量 AI 强弱。"],["异常与交接","没有拿到运行注册表、Schema 和下游实现时，只能说清定义与待核项，不能编造具体模型规模、SDK 路径或权限层。"],["产品要问清","定义数、注入数、可调用数、实际成功能力覆盖，是否分别统计？"]]},{"id":"TC2","title":"每个工具必须能回答一张契约表","paras":[["这一步怎么做","至少问清输入、内部理解、下游能力、前置条件、状态机、超时重试、反馈关联和成功证据。参数是自然语言还是结构化，决定错误可能发生在哪一层。"],["放进同一个例子","路线工具从具体目的地到候选路线，再到选择后自动导航；这一串不能简写成“输入地址→输出路线”。"],["异常与交接","缺失取消接口、没有结构化状态、超时无法查询上一操作，都属于实质边界，需要在产品方案中体现。"],["产品要问清","让负责人拿一个成功 Trace 和一个失败 Trace，能否逐跳对照输入、输出与实际副作用？"]]},{"id":"TC3","title":"不要平均钻研全部工具实现","paras":[["这一步怎么做","优先深入负责场景真正使用的工具：Planner/触发器主责要能定位和验收，车控、记忆、导航要懂内部业务状态；ASR、VLM、SDK 的底层训练或代码按实际问题再深入。"],["放进同一个例子","“昨天游泳馆”至少要看记忆如何查、路线如何选、导航怎样确认；只背 27 个英文名无法发现“查到地点但没有开始导航”。"],["异常与交接","不必等所有底层实现都学完才考虑职业机会；但没有完整 Trace、可复现 badcase 和改进结果，也不能仅凭了解 prompt 证明可迁移能力。"],["产品要问清","你能独立解释最早出错点、提出改法、定义对照指标，并证明修复未损伤其他场景吗？"]]}],"learn":["orchestration","planner"],"x":7200,"y":5770,"w":1220,"h":3870,"kind":"supplement"},{"id":"vision-trigger","parent":"execute","title":"VLM 与云端条件判定","intro":"视觉观察≠业务条件命中≠执行成功","steps":[{"id":"VL1","title":"按需看一眼：visual_qa","paras":[["这一步怎么做","用户提出视觉问题时，按请求方向采集对应画面，再由视觉能力回答可见内容。这是一次工具调用，结果回 07；不能把摄像头当互联网，也不能用它直接读取车机屏幕。"],["放进同一个例子","“外面那栋建筑是什么”需要正确方向与当前画面；若还要门票价格，应再查外部资料，不能从图像直接得出现价。"],["异常与交接","遮挡、错误视角、旧帧或画面不可见要明确表达。图像判断准确也不保证后续工具选择正确。"],["产品要问清","模型看的是哪一帧？用户所指对象真在视野里吗？时延里采图和推理分别占多少？"]]},{"id":"VL2","title":"默认 AlwaysOn：持续提供场景观察","paras":[["这一步怎么做","默认感知按已覆盖能力产生舱内外观察，经端数据中心等路径供 Context 使用。某次结果未达成，只说明当时没看到条件成立，不等于系统缺少这项观察能力。"],["放进同一个例子","默认能力已经能看某类舱内状态时，任务未命中应继续等默认观察；只有目标未覆盖时，才讨论额外专属观察。"],["异常与交接","开关、隐私、资源预算与结果新鲜度都影响能否使用。不能用一个“AlwaysOn 开了”代替具体能力覆盖表。"],["产品要问清","这是能力未覆盖，还是覆盖但当前未达成？证据来自哪份能力表和哪次观察？"]]},{"id":"VL3","title":"动态 watch：按 task_id 单独观察","paras":[["这一步怎么做","动态感知协议由 Task Service 下发 task_id 与纯观察问题，采用全量列表替换，最多 3 项同时观察。动态结果走独立任务通道，不进入通用 Context；AlwaysOn 关闭时拒收新项并清空旧项。"],["放进同一个例子","“帮我盯着某个对象”是观察任务，不应把“看到后给我打电话”整段执行指令塞给视觉模型。动作由任务/业务层负责。"],["异常与交接","全量替换漏带旧项会使旧观察被移除；取消后结果迟到必须按 task_id 处理。3 项是并发观察限制，不是全部业务规则上限。"],["产品要问清","列表是谁维护的？关闭、取消、替换、超容量分别返回什么状态？"]]},{"id":"VL4","title":"云端求值、抑制、回调原任务","paras":[["这一步怎么做","结构条件读相应事实求值；动态视觉结果还需要按协议进行云端语义 Y/N 判断，再形成条件事件。命中后要处理冷却、去重、范围和有效期，最后回调任务或 Advisor，不能直接宣称动作成功。"],["放进同一个例子","看到目标对象只是观察结果；业务认定条件满足后，才能唤醒未取消的任务，再进入实际执行。"],["异常与交接","规则误判、视觉误判、端侧资源不足和时序问题必须分开。6–7 秒等文档时延目标不是已经达成的实测，更不能统一写成固定 3/5 秒。"],["产品要问清","误触发、漏触发、重复触发和命中到动作时延，各自的真值与测量点在哪里？"]]}],"learn":["signals","cloud-trigger"],"x":8900,"y":5770,"w":1220,"h":3870,"kind":"supplement"},{"id":"advisor","parent":"feedback","title":"主动服务：没有 Query 也能进入","intro":"Advisor 提建议，Planner 判断；不是模型自行获得执行授权","steps":[{"id":"AD1","title":"由新场景事实产生候选建议","paras":[["这一步怎么做","静态 Advisor 围绕舒适、出行、情感、内容等方向，读取人、车、环境和记忆等信息形成建议。它与监控未来目标的旧动态 Advisor 不是同一职责。"],["放进同一个例子","检测到上车后车内较热，可以产生降温建议；这与用户主动说“我热”是两种入口，但都需要可靠事实和后续执行。"],["异常与交接","感知错、事实旧、没有适用车型能力时，建议可能不成立。建议质量不能只看话术是否自然。"],["产品要问清","是哪条新事实触发本次建议？为什么现在提出，而不是十分钟前或下车后？"]]},{"id":"AD2","title":"先判断是否值得打扰","paras":[["这一步怎么做","主动服务需要考虑总开关、场景时机、频率、重复、驾驶任务和用户当前对话；展示、播报和自动执行的边界不同，不能一次建议默认获得三种行为权限。"],["放进同一个例子","用户正在选路线时，降温建议是否延后、静默或不展示，要按交互策略处理；不能两个模块同时抢话。"],["异常与交接","框架要保留被抑制的原因，才能区分建议不准与没送达。用户拒绝后的降频也应明确。"],["产品要问清","可见建议的分母是生成数还是实际送达数？负向打扰如何标注与回归？"]]},{"id":"AD3","title":"进入同一决策链，再记录真实结果","paras":[["这一步怎么做","有效 Advisor input 进入 03，与 Context 一起交 04 判断。用户采纳后通过相应工具执行，结果仍回 07；旧 Goal 监控建议也不能绕过真实执行与结果闭环。"],["放进同一个例子","用户接受降温建议后，要能确认实际控制成功；只点了“接受”但空调没变，不能计为完整行为成功。"],["异常与交接","建议生成、送达、点击、执行开始、最终完成是不同漏斗。拒绝与关闭也要反馈，避免重复打扰。"],["产品要问清","是否能从一条建议追到对应工具调用与真实结果？不能只有点击率而无兑现率。"]]}],"learn":["advisor","task"],"x":10600,"y":5770,"w":1220,"h":3870,"kind":"supplement"},{"id":"visible-ui","parent":"output","title":"可见即可说与任务中心回流","intro":"页面可见 → 词表匹配 → 原按钮回调 → 业务确认","steps":[{"id":"UI1","title":"只注册最顶层可操作页面","paras":[["这一步怎么做","OEM 或业务方解析当前最顶层页面的可交互元素，建立文字指令与元素 ID 映射，页面变化时更新。隐藏页面、已过期卡片不能继续作为可点击对象。"],["放进同一个例子","路线卡片展示三条路线时，“第三条”必须关联当前卡片的第三项，而不是旧卡片里同位置的元素。"],["异常与交接","框架有单页词表容量与动态更新约定，具体版本需核对；它不直接证明所有业务页面均已接入。"],["产品要问清","谁注册、谁更新、谁清理旧词表？页面切换后多久旧 ID 失效？"]]},{"id":"UI2","title":"ASR 与匹配决定候选，不替业务决定","paras":[["这一步怎么做","框架区分免唤醒离线识别与唤醒后的在线/离线策略，并有精确、模糊和局部匹配。识别到多个候选元素时，由注册方消歧；不能让 ASR 擅自选择业务目标。"],["放进同一个例子","同页多个“确认”按钮，需要位置或业务上下文消歧；只识别出“确认”这两个字，不能证明已经选对了路线确认。"],["异常与交接","词表、匹配规则与优先级按真实版本检查。框架文档里的能力阈值不是每种车型都已实测达标。"],["产品要问清","误识别、匹配错、元素过期、消歧错，能否分别找到日志与责任边界？"]]},{"id":"UI3","title":"模拟点击回到原业务，不直接控车","paras":[["这一步怎么做","匹配到元素后，OEM 或业务方触发模拟 UI 点击，走原按钮回调。手点与语音点击应能回到同一业务处理；历史需要标为模拟点击事件，避免又作为普通 Query 重做一次。"],["放进同一个例子","选中第三条路线，先回路线业务；若业务据此自动导航，再记录真实导航状态。不能画成“说第三条→直接调用车控”。"],["异常与交接","UI 点击成功不等于原业务收到，更不等于车辆生效。执行前条件改变时是否复核，是业务契约必须确认的边界。"],["产品要问清","能否证明元素命中、回调收到、选择生效、业务执行四步都完成？"]]},{"id":"UI4","title":"任务中心展示状态，不创造状态","paras":[["这一步怎么做","任务中心应消费任务/运行状态与消息，而不是自己凭卡片展示就宣布完成。新 Task 设计通过持久化 Binding 与 recommend_id 恢复关联；客户端交互回正确 Task/Run 后再继续。"],["放进同一个例子","用户确认提醒卡片后，要恢复原任务；如果此时任务已取消或条件已失效，不能仅因为按钮还可点就重新执行。"],["异常与交接","发送消息、卡片展示、用户确认、动作生效和任务关闭必须分别核对。当前车型具体支持修改还是仅删除，需按实际接入范围确认。"],["产品要问清","界面“已完成”与后端 Run、工具结果是否一致？取消后旧卡片还能否触发动作？"]]}],"learn":["visible-ui","task","output"],"x":12300,"y":5770,"w":1220,"h":3870,"kind":"supplement"},{"id":"family-0","title":"车控、系统与驾驶","x":400,"y":10410,"w":2020,"h":7460,"kind":"family","learn":["orchestration"]},{"id":"family-1","title":"天气、出行与预订","x":2670,"y":10410,"w":2020,"h":6290,"kind":"family","learn":["orchestration"]},{"id":"family-2","title":"媒体与内容生成","x":4940,"y":10410,"w":2020,"h":7460,"kind":"family","learn":["orchestration"]},{"id":"family-3","title":"身份与用户记忆","x":7210,"y":10410,"w":2020,"h":3950,"kind":"family","learn":["orchestration"]},{"id":"family-4","title":"知识、搜索与车务","x":9480,"y":10410,"w":2020,"h":5120,"kind":"family","learn":["orchestration"]},{"id":"family-5","title":"目标、录音与视觉","x":11750,"y":10410,"w":2020,"h":3950,"kind":"family","learn":["orchestration"]},{"id":"learn-voice","title":"01 把声音变成一轮请求 · 自测","x":400,"y":18420,"w":1220,"h":1554,"kind":"learning","learn":["voice"]},{"id":"learn-route","title":"02 决定走快路还是规划 · 自测","x":2100,"y":18420,"w":1220,"h":2716,"kind":"learning","learn":["fast","route"]},{"id":"learn-context","title":"03 准备本轮真实上下文 · 自测","x":3800,"y":18420,"w":1220,"h":1910,"kind":"learning","learn":["context"]},{"id":"learn-planner","title":"04 理解目标并决定下一步 · 自测","x":5500,"y":18420,"w":1220,"h":2716,"kind":"learning","learn":["planner"]},{"id":"learn-dispatch","title":"05 把计划交给可用工具 · 自测","x":7200,"y":18420,"w":1220,"h":2046,"kind":"learning","learn":["orchestration"]},{"id":"learn-execute","title":"06 领域理解到真实业务生效 · 自测","x":8900,"y":18420,"w":1220,"h":3234,"kind":"learning","learn":["orchestration","output"]},{"id":"learn-feedback","title":"07 观察结果，更新剩余目标 · 自测","x":10600,"y":18420,"w":1220,"h":3862,"kind":"learning","learn":["planner","output"]},{"id":"learn-output","title":"08 让用户听到、看到并继续 · 自测","x":12300,"y":18420,"w":1220,"h":3234,"kind":"learning","learn":["output","visible-ui"]}],"nodes":[{"id":"H-voice","title":"把声音变成一轮请求","group":"voice","x":400,"y":920,"w":1220,"h":270,"kind":"module","body":["这里还没有开始规划。先保证系统收到的，确实是用户刚才表达的完整意思。"],"paras":[["模块职责","这里还没有开始规划。先保证系统收到的，确实是用户刚才表达的完整意思。"]],"learn":["voice"],"future":false},{"id":"V1","title":"01.1  接收说话，而不是接收一句现成文字","paras":[["这一步怎么做","用户说话后，语音链路处理麦克风输入、唤醒或免唤醒条件、回声与噪声。音区定位帮助判断声音来自哪一排、哪一个座位；这些是输入可靠性的前提，具体开关与算法部署须按车端版本核对。"],["放进同一个例子","主驾说：“我有点热，带我去昨天的游泳馆。”系统此时拿到的是声音；车内播报、后排交谈不能自动变成主驾指令。"],["异常与交接","没有录音权限、语音未开启、声音未被有效接收时，应在入口解释或停止，不能把空输入交给模型后要求它猜。"],["产品要问清","原始音频能否与这一次请求对应？音区与注册身份发生冲突时，哪个信息可靠？"]],"group":"voice","x":464,"y":1380,"w":1092,"h":660,"learn":["voice"],"future":false,"kind":"step","body":["这一步怎么做：用户说话后，语音链路处理麦克风输入、唤醒或免唤醒条件、回声与噪声。音区定位帮助判断声音来自哪一排、哪一个座位；这些是输入可靠性的前提，具体开关与算法部署须按车端版本核对。","放进同一个例子：主驾说：“我有点热，带我去昨天的游泳馆。”系统此时拿到的是声音；车内播报、后排交谈不能自动变成主驾指令。","异常与交接：没有录音权限、语音未开启、声音未被有效接收时，应在入口解释或停止，不能把空输入交给模型后要求它猜。","产品要问清：原始音频能否与这一次请求对应？音区与注册身份发生冲突时，哪个信息可靠？"],"textBottom":1932},{"id":"V2","title":"01.2  ASR：把声音识别为文字","paras":[["这一步怎么做","语音识别（ASR）可能先产生增量文字，再形成最终文字。产品验收要看完整语义：人名、地点、数字、“不要”等否定，以及“十分钟后”等时间条件，不能只看平均字错率。"],["放进同一个例子","应保留“有点热”和“昨天的游泳馆”两个诉求。如果“昨天”丢失，后续就会把历史地点理解成附近搜索。"],["异常与交接","ASR 结果不确定、被截断或多人重叠，需要相应的重说、确认或排队策略。Planner 能处理歧义，但不能可靠补回从未收到的语音证据。"],["产品要问清","原音频、识别文字、最终传入 Query 的文字，是否在同一条日志中可对齐？"]],"group":"voice","x":464,"y":2210,"w":1092,"h":660,"learn":["voice"],"future":false,"kind":"step","body":["这一步怎么做：语音识别（ASR）可能先产生增量文字，再形成最终文字。产品验收要看完整语义：人名、地点、数字、“不要”等否定，以及“十分钟后”等时间条件，不能只看平均字错率。","放进同一个例子：应保留“有点热”和“昨天的游泳馆”两个诉求。如果“昨天”丢失，后续就会把历史地点理解成附近搜索。","异常与交接：ASR 结果不确定、被截断或多人重叠，需要相应的重说、确认或排队策略。Planner 能处理歧义，但不能可靠补回从未收到的语音证据。","产品要问清：原音频、识别文字、最终传入 Query 的文字，是否在同一条日志中可对齐？"],"textBottom":2762},{"id":"V3","title":"01.3  判停、续说与请求归属","paras":[["这一步怎么做","输入接入要确定本轮说话什么时候结束，补充的半句话是续说还是新请求，并携带说话人、位置和时间。注册身份与座位不是同一个概念：位置影响车控对象，身份影响可读取谁的记忆。"],["放进同一个例子","“我”指当前说话人；降温要考虑其位置，查“昨天去过哪里”则需要关联其身份。不能拿后排乘员的经历替主驾作答。"],["异常与交接","用户边说边补“别开窗”，如果前半句已触发执行，就会出现时序问题。判停策略、已下发动作和取消能力要一起验收。"],["产品要问清","两人同时说话是合并、排序还是打断？每一轮在下游还能否保持原始归属？"]],"group":"voice","x":464,"y":3040,"w":1092,"h":660,"learn":["voice"],"future":false,"kind":"step","body":["这一步怎么做：输入接入要确定本轮说话什么时候结束，补充的半句话是续说还是新请求，并携带说话人、位置和时间。注册身份与座位不是同一个概念：位置影响车控对象，身份影响可读取谁的记忆。","放进同一个例子：“我”指当前说话人；降温要考虑其位置，查“昨天去过哪里”则需要关联其身份。不能拿后排乘员的经历替主驾作答。","异常与交接：用户边说边补“别开窗”，如果前半句已触发执行，就会出现时序问题。判停策略、已下发动作和取消能力要一起验收。","产品要问清：两人同时说话是合并、排序还是打断？每一轮在下游还能否保持原始归属？"],"textBottom":3592},{"id":"V4","title":"01.4  封装 Query，交给选路模块","paras":[["这一步怎么做","把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的明确请求。"],["放进同一个例子","交接内容可以理解为：主驾在此刻提出“降温＋去昨天的游泳馆”。具体字段名与运行版本对齐，不用示意字段冒充真实接口。"],["异常与交接","用户说“算了”或再次发声，可能是取消、改目标或仅打断播报。输入层记录新事实，业务层再决定影响哪些动作和等待任务。"],["产品要问清","能否还原原话、当前轮输入、历史记录三者？本轮关联是否在后续调用与反馈中保留？"]],"group":"voice","x":464,"y":3870,"w":1092,"h":660,"learn":["voice"],"future":false,"kind":"step","body":["这一步怎么做：把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的明确请求。","放进同一个例子：交接内容可以理解为：主驾在此刻提出“降温＋去昨天的游泳馆”。具体字段名与运行版本对齐，不用示意字段冒充真实接口。","异常与交接：用户说“算了”或再次发声，可能是取消、改目标或仅打断播报。输入层记录新事实，业务层再决定影响哪些动作和等待任务。","产品要问清：能否还原原话、当前轮输入、历史记录三者？本轮关联是否在后续调用与反馈中保留？"],"textBottom":4422},{"id":"H-route","title":"决定走快路还是规划","group":"route","x":2100,"y":920,"w":1220,"h":270,"kind":"module","body":["端侧小模型和云端推理是协作关系。生成了两个候选，不代表可以执行两遍。"],"paras":[["模块职责","端侧小模型和云端推理是协作关系。生成了两个候选，不代表可以执行两遍。"]],"learn":["fast","route"],"future":false},{"id":"R1","title":"02.1  端侧 FC 先形成动作候选","paras":[["这一步怎么做","端侧函数调用模型（FC）把高频简单指令理解为本地能力可承接的动作。Director PRD 的基线是：命中白名单时优先端侧快速执行。白名单、车型能力和合法参数须一起满足。"],["放进同一个例子","“把主驾车窗关上”可能走快路；“十分钟后关车窗”包含未来条件，不能截掉时间后立即关窗。本例含历史地点依赖，应避免被整句当成简单车控。"],["异常与交接","端侧输出首先是候选。没命中白名单时，不能仅因本地先返回，就抢先执行云端还在判断的请求。"],["产品要问清","哪一份车型配置定义白名单？复杂请求误走快路后，是否已造成真实动作？"]],"group":"route","x":2164,"y":1380,"w":1092,"h":660,"learn":["fast","route"],"future":false,"kind":"step","body":["这一步怎么做：端侧函数调用模型（FC）把高频简单指令理解为本地能力可承接的动作。Director PRD 的基线是：命中白名单时优先端侧快速执行。白名单、车型能力和合法参数须一起满足。","放进同一个例子：“把主驾车窗关上”可能走快路；“十分钟后关车窗”包含未来条件，不能截掉时间后立即关窗。本例含历史地点依赖，应避免被整句当成简单车控。","异常与交接：端侧输出首先是候选。没命中白名单时，不能仅因本地先返回，就抢先执行云端还在判断的请求。","产品要问清：哪一份车型配置定义白名单？复杂请求误走快路后，是否已造成真实动作？"],"textBottom":1932},{"id":"R2","title":"02.2  云端先判断是不是对助手说","paras":[["这一步怎么做","云端拒识模块判断输入是否应作为对助手的请求。PRD 区分“明确拒识”和“拒识超时”：拒识内容进 Context 事件日志，供背景感知；拒识超时按该 PRD 进入 Director。"],["放进同一个例子","乘员聊天说“昨天那个游泳馆太冷了”，不自动等于要求导航。被拒识的内容可以是背景信息，但不能直接按指令执行。"],["异常与交接","拒识错误可能导致漏响应或乱执行。拒识超时也不等于整个云请求超时，两种异常的后续路由不同。"],["产品要问清","某条 badcase 是被拒识了、意图判错了，还是已经进 Planner 后才理解错了？"]],"group":"route","x":2164,"y":2210,"w":1092,"h":660,"learn":["fast","route"],"future":false,"kind":"step","body":["这一步怎么做：云端拒识模块判断输入是否应作为对助手的请求。PRD 区分“明确拒识”和“拒识超时”：拒识内容进 Context 事件日志，供背景感知；拒识超时按该 PRD 进入 Director。","放进同一个例子：乘员聊天说“昨天那个游泳馆太冷了”，不自动等于要求导航。被拒识的内容可以是背景信息，但不能直接按指令执行。","异常与交接：拒识错误可能导致漏响应或乱执行。拒识超时也不等于整个云请求超时，两种异常的后续路由不同。","产品要问清：某条 badcase 是被拒识了、意图判错了，还是已经进 Planner 后才理解错了？"],"textBottom":2762},{"id":"R3","title":"02.3  简单意图给 FC，复杂依赖给 Planner","paras":[["这一步怎么做","PRD 的云端基线为：未拒识、仲裁为车控且属于约定意图时交 FC；其余有效请求交 Planner。不要把历史“句法 RAG→情景 RAG→Planner”概括直接当成所有版本的固定串行拓扑。"],["放进同一个例子","本例要先知道昨天去的是哪家，再规划路线；降温还需要车况和乘员约束。这些依赖必须由复杂链保留，不是按关键词分成两个互不相干的命令。"],["异常与交接","简单与复杂的边界、六类意图清单、云端 FC 所在位置，要以目标车型的当前配置和 Trace 核验。"],["产品要问清","条件、记忆、跨工具依赖、情景约束，各有哪些容易被简单模型过召的反例？"]],"group":"route","x":2164,"y":3040,"w":1092,"h":660,"learn":["fast","route"],"future":false,"kind":"step","body":["这一步怎么做：PRD 的云端基线为：未拒识、仲裁为车控且属于约定意图时交 FC；其余有效请求交 Planner。不要把历史“句法 RAG→情景 RAG→Planner”概括直接当成所有版本的固定串行拓扑。","放进同一个例子：本例要先知道昨天去的是哪家，再规划路线；降温还需要车况和乘员约束。这些依赖必须由复杂链保留，不是按关键词分成两个互不相干的命令。","异常与交接：简单与复杂的边界、六类意图清单、云端 FC 所在位置，要以目标车型的当前配置和 Trace 核验。","产品要问清：条件、记忆、跨工具依赖、情景约束，各有哪些容易被简单模型过召的反例？"],"textBottom":3592},{"id":"R4","title":"02.4  端云仲裁与超时只选一次执行","paras":[["这一步怎么做","按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，需要运行日志证明。"],["放进同一个例子","本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。"],["异常与交接","端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能声称所有需要记忆或联网的能力仍能离线完成。"],["产品要问清","同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎样证明只执行一次？"]],"group":"route","x":2164,"y":3870,"w":1092,"h":660,"learn":["fast","route"],"future":false,"kind":"step","body":["这一步怎么做：按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，需要运行日志证明。","放进同一个例子：本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。","异常与交接：端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能声称所有需要记忆或联网的能力仍能离线完成。","产品要问清：同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎样证明只执行一次？"],"textBottom":4422},{"id":"H-context","title":"准备本轮真实上下文","group":"context","x":3800,"y":920,"w":1220,"h":270,"kind":"module","body":["Context 是模型这一次真正看得到的信息。事后知道的事实，不等于模型当时收到过。"],"paras":[["模块职责","Context 是模型这一次真正看得到的信息。事后知道的事实，不等于模型当时收到过。"]],"learn":["context"],"future":false},{"id":"C1","title":"03.1  区分这一次是谁来叫醒 Planner","paras":[["这一步怎么做","入口接收用户 Query、Advisor 建议、工具反馈，部分新版输入还包含事件。三者含义不同：用户在提目标，Advisor 在建议，工具在汇报执行或查询结果，不能都当成用户重新下令。"],["放进同一个例子","第一轮收到主驾 Query；查完记忆后再进来的，是“这位用户昨天去了某游泳馆”的工具结果，不是用户又说了一遍需求。"],["异常与交接","同名工具并发、重试和迟到反馈必须能够回到正确动作与目标。当前 SP 的简化反馈字段不足以证明完整的工程关联协议。"],["产品要问清","能否查到本轮 input 类型，以及它属于哪位用户、哪个未完成目标、哪次调用？"]],"group":"context","x":3864,"y":1380,"w":1092,"h":660,"learn":["context"],"future":false,"kind":"step","body":["这一步怎么做：入口接收用户 Query、Advisor 建议、工具反馈，部分新版输入还包含事件。三者含义不同：用户在提目标，Advisor 在建议，工具在汇报执行或查询结果，不能都当成用户重新下令。","放进同一个例子：第一轮收到主驾 Query；查完记忆后再进来的，是“这位用户昨天去了某游泳馆”的工具结果，不是用户又说了一遍需求。","异常与交接：同名工具并发、重试和迟到反馈必须能够回到正确动作与目标。当前 SP 的简化反馈字段不足以证明完整的工程关联协议。","产品要问清：能否查到本轮 input 类型，以及它属于哪位用户、哪个未完成目标、哪次调用？"],"textBottom":1932},{"id":"C2","title":"03.2  带上当前车况、身份和相关记忆","paras":[["这一步怎么做","入口把相关端状态、默认情景感知、用户记忆及当前目标等信息整理给模型。状态要区分来源、时间和未知值；当前车况、昨天的行程、说明书知识，不能混成一种事实。"],["放进同一个例子","如果空调已经开着、用户不喜欢风直吹，降温方案就不能机械地“开空调＋最大风”。如果没带入昨天的地点，就需要调用记忆查询工具。"],["异常与交接","“没有这个字段”不等于数值为零，也不等于设备关闭。旧车况和新手动操作冲突时，必须按有效来源与时间判断。"],["产品要问清","哪些事实是本场景做对所必需的？是哪一步没采到、没传到、被过滤或被旧历史覆盖？"]],"group":"context","x":3864,"y":2210,"w":1092,"h":660,"learn":["context"],"future":false,"kind":"step","body":["这一步怎么做：入口把相关端状态、默认情景感知、用户记忆及当前目标等信息整理给模型。状态要区分来源、时间和未知值；当前车况、昨天的行程、说明书知识，不能混成一种事实。","放进同一个例子：如果空调已经开着、用户不喜欢风直吹，降温方案就不能机械地“开空调＋最大风”。如果没带入昨天的地点，就需要调用记忆查询工具。","异常与交接：“没有这个字段”不等于数值为零，也不等于设备关闭。旧车况和新手动操作冲突时，必须按有效来源与时间判断。","产品要问清：哪些事实是本场景做对所必需的？是哪一步没采到、没传到、被过滤或被旧历史覆盖？"],"textBottom":2762},{"id":"C3","title":"03.3  组织对话历史与本轮示例","paras":[["这一步怎么做","历史帮助理解“那家”“再低一点”等省略表达；本轮动态示例只为当前 Query 提供参考，不等于真实执行结果。先澄清或改写省略信息再检索示例，与把全历史直接作为示例，是两回事。"],["放进同一个例子","用户后来只说“换另一条”，需要知道上一轮选的是哪条路线。历史里必须保留影响本目标的选择和未完成事项，而不是只剩助手说过“好的”。"],["异常与交接","压缩远区历史可以省输入，但不能删除未完成动作、失败反馈或用户否定。重复明确车控是新请求，不能用历史成功代替本轮执行。"],["产品要问清","有无示例对照实验是否改善保留测试集？是否把错误示例、其他车企能力或过时工具名带进来了？"]],"group":"context","x":3864,"y":3040,"w":1092,"h":660,"learn":["context"],"future":false,"kind":"step","body":["这一步怎么做：历史帮助理解“那家”“再低一点”等省略表达；本轮动态示例只为当前 Query 提供参考，不等于真实执行结果。先澄清或改写省略信息再检索示例，与把全历史直接作为示例，是两回事。","放进同一个例子：用户后来只说“换另一条”，需要知道上一轮选的是哪条路线。历史里必须保留影响本目标的选择和未完成事项，而不是只剩助手说过“好的”。","异常与交接：压缩远区历史可以省输入，但不能删除未完成动作、失败反馈或用户否定。重复明确车控是新请求，不能用历史成功代替本轮执行。","产品要问清：有无示例对照实验是否改善保留测试集？是否把错误示例、其他车企能力或过时工具名带进来了？"],"textBottom":3592},{"id":"C4","title":"03.4  组装 SP/UP，进入同一个 Planner","paras":[["这一步怎么做","系统规则（SP）说明角色、可用工具和输出要求；本轮与历史输入（UP）提供事实和事件。车型、环境、工具版本、场景 knowhow 与动态变量共同决定模型可做什么。"],["放进同一个例子","模型现在应清楚：用户要降温和去某个历史地点；已知车况有哪些；哪些信息还缺；本轮能调用哪些工具。之后才进入 04 规划。"],["异常与交接","本地 SP 的 27 个工具只是定义快照；不能据此说每台车线上都开放 27 个。缺事实应查或问，不能用漂亮的提示词替代真实数据。"],["产品要问清","你能否拿到这一次模型实际看到的完整输入？如果换一份正确上下文，错误是否随之消失？"]],"group":"context","x":3864,"y":3870,"w":1092,"h":660,"learn":["context"],"future":false,"kind":"step","body":["这一步怎么做：系统规则（SP）说明角色、可用工具和输出要求；本轮与历史输入（UP）提供事实和事件。车型、环境、工具版本、场景 knowhow 与动态变量共同决定模型可做什么。","放进同一个例子：模型现在应清楚：用户要降温和去某个历史地点；已知车况有哪些；哪些信息还缺；本轮能调用哪些工具。之后才进入 04 规划。","异常与交接：本地 SP 的 27 个工具只是定义快照；不能据此说每台车线上都开放 27 个。缺事实应查或问，不能用漂亮的提示词替代真实数据。","产品要问清：你能否拿到这一次模型实际看到的完整输入？如果换一份正确上下文，错误是否随之消失？"],"textBottom":4422},{"id":"H-planner","title":"理解目标并决定下一步","group":"planner","x":5500,"y":920,"w":1220,"h":270,"kind":"module","body":["Planner 与 Director 是同一决策模块的两种叫法，不是串行的两颗“大脑”。"],"paras":[["模块职责","Planner 与 Director 是同一决策模块的两种叫法，不是串行的两颗“大脑”。"]],"learn":["planner"],"future":false},{"id":"P1","title":"04.1  先拆完整目标，再检查约束","paras":[["这一步怎么做","Planner 理解用户真正想达成什么，并保留对象、位置、时间、偏好和禁止事项。它不是直接操作车辆，而是在当前事实与能力边界下，决定本轮应该行动、查信息、询问还是等待。"],["放进同一个例子","本例有两个子目标：让当前乘员更凉快；导航去他昨天去过的游泳馆。完成其中一个，不等于整句话已经办妥。"],["异常与交接","不应擅自增加高影响动作，也不能为追求“多工具能力”额外开窗、改路线或改账号设置。无依据动作要单独计入失败。"],["产品要问清","这条 Query 的完整成功标准是什么？哪些动作是必要的，哪些只是模型自己发挥？"]],"group":"planner","x":5564,"y":1380,"w":1092,"h":660,"learn":["planner"],"future":false,"kind":"step","body":["这一步怎么做：Planner 理解用户真正想达成什么，并保留对象、位置、时间、偏好和禁止事项。它不是直接操作车辆，而是在当前事实与能力边界下，决定本轮应该行动、查信息、询问还是等待。","放进同一个例子：本例有两个子目标：让当前乘员更凉快；导航去他昨天去过的游泳馆。完成其中一个，不等于整句话已经办妥。","异常与交接：不应擅自增加高影响动作，也不能为追求“多工具能力”额外开窗、改路线或改账号设置。无依据动作要单独计入失败。","产品要问清：这条 Query 的完整成功标准是什么？哪些动作是必要的，哪些只是模型自己发挥？"],"textBottom":1932},{"id":"P2","title":"04.2  缺事实就查询，缺选择就询问","paras":[["这一步怎么做","查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。"],["放进同一个例子","如果昨天地点未在 Context 中，先调用 user_memory_search。若返回两个可能地点，就问用户选哪一个；不能自行挑一家立即导航。"],["异常与交接","查无记忆、无注册身份、存在多候选、工具不可用，是不同的恢复分支。用户提供新信息后，要继续原目标而不是忘记降温这一半。"],["产品要问清","为什么这一步要查工具，不直接问用户？又为什么多候选时不能继续替用户决定？"]],"group":"planner","x":5564,"y":2210,"w":1092,"h":660,"learn":["planner"],"future":false,"kind":"step","body":["这一步怎么做：查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。","放进同一个例子：如果昨天地点未在 Context 中，先调用 user_memory_search。若返回两个可能地点，就问用户选哪一个；不能自行挑一家立即导航。","异常与交接：查无记忆、无注册身份、存在多候选、工具不可用，是不同的恢复分支。用户提供新信息后，要继续原目标而不是忘记降温这一半。","产品要问清：为什么这一步要查工具，不直接问用户？又为什么多候选时不能继续替用户决定？"],"textBottom":2720},{"id":"P3","title":"04.3  按依赖安排动作，改写给下游","paras":[["这一步怎么做","独立动作可以分别推进；有依赖的动作必须等前一步结果。工具指令要把代词、对象和约束改写得下游能理解。SP 还明确要求 POI、路线规划、导航控制串行互斥。"],["放进同一个例子","降温相关行动与查询历史地点可以在条件允许时独立推进；路线规划必须等具体地点。不能在查“昨天那家”的同时，凭空给路线工具一个地址。"],["异常与交接","是否并发由能力、依赖和实际调度契约共同决定，不是“模型一次输出多个 action 就一定并行”。串行安全要求也不能仅凭提示词就认为已保证。"],["产品要问清","哪个结果是下一步必需的输入？哪一条日志能证明工具实际按正确顺序执行？"]],"group":"planner","x":5564,"y":3040,"w":1092,"h":660,"learn":["planner"],"future":false,"kind":"step","body":["这一步怎么做：独立动作可以分别推进；有依赖的动作必须等前一步结果。工具指令要把代词、对象和约束改写得下游能理解。SP 还明确要求 POI、路线规划、导航控制串行互斥。","放进同一个例子：降温相关行动与查询历史地点可以在条件允许时独立推进；路线规划必须等具体地点。不能在查“昨天那家”的同时，凭空给路线工具一个地址。","异常与交接：是否并发由能力、依赖和实际调度契约共同决定，不是“模型一次输出多个 action 就一定并行”。串行安全要求也不能仅凭提示词就认为已保证。","产品要问清：哪个结果是下一步必需的输入？哪一条日志能证明工具实际按正确顺序执行？"],"textBottom":3592},{"id":"P4","title":"04.4  生成本轮决定，而不是宣布一切完成","paras":[["这一步怎么做","输出包含是否说话、说什么、表情与 action_list。需要工具时进入 05；不需要工具或需要澄清时可直接走 T1 到 08。未来条件或持续目标进入下方 Task/旧 Goal 支路，不应立即执行目标动作。"],["放进同一个例子","第一轮可以查历史地点、执行合法的降温动作；收到记忆结果后再规划路线。最终结果要等真实回报，不是第一轮就说“已经导航好了”。"],["异常与交接","talk_content 与 action_list 要一致。用户取消后，应区分停止播报、取消当前动作和撤销未来任务，不能用一句“好的”代替状态处理。"],["产品要问清","模型选错时，证据指向输入缺失、工具描述、示例干扰，还是信息齐全后的推理失误？"]],"group":"planner","x":5564,"y":3870,"w":1092,"h":660,"learn":["planner"],"future":false,"kind":"step","body":["这一步怎么做：输出包含是否说话、说什么、表情与 action_list。需要工具时进入 05；不需要工具或需要澄清时可直接走 T1 到 08。未来条件或持续目标进入下方 Task/旧 Goal 支路，不应立即执行目标动作。","放进同一个例子：第一轮可以查历史地点、执行合法的降温动作；收到记忆结果后再规划路线。最终结果要等真实回报，不是第一轮就说“已经导航好了”。","异常与交接：talk_content 与 action_list 要一致。用户取消后，应区分停止播报、取消当前动作和撤销未来任务，不能用一句“好的”代替状态处理。","产品要问清：模型选错时，证据指向输入缺失、工具描述、示例干扰，还是信息齐全后的推理失误？"],"textBottom":4422},{"id":"H-dispatch","title":"把计划交给可用工具","group":"dispatch","x":7200,"y":920,"w":1220,"h":270,"kind":"module","body":["action_list 是计划。校验、调度与真实执行，是随后发生的事情；统一门禁实现仍须按版本核验。"],"paras":[["模块职责","action_list 是计划。校验、调度与真实执行，是随后发生的事情；统一门禁实现仍须按版本核验。"]],"learn":["orchestration"],"future":false},{"id":"D1","title":"05.1  查到真实注册的工具与参数契约","paras":[["这一步怎么做","调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 Task 接口不混算成第 28 个线上工具。"],["放进同一个例子","查记忆使用 user_memory_search；历史地址确定后使用 route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工具。"],["异常与交接","SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型不支持，应有可解释失败，而不是静默丢弃。"],["产品要问清","能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表逐项对齐？"]],"group":"dispatch","x":7264,"y":1380,"w":1092,"h":660,"learn":["orchestration"],"future":false,"kind":"step","body":["这一步怎么做：调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 Task 接口不混算成第 28 个线上工具。","放进同一个例子：查记忆使用 user_memory_search；历史地址确定后使用 route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工具。","异常与交接：SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型不支持，应有可解释失败，而不是静默丢弃。","产品要问清：能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表逐项对齐？"],"textBottom":1974},{"id":"D2","title":"05.2  校验身份、车态与外部副作用","paras":[["这一步怎么做","动作下发前，需要按各领域契约检查对象、取值、车态、用户权限和必要确认。这里是产品必须明确的边界，不代表已验证公司存在一个万能的统一校验服务。"],["放进同一个例子","主驾说“给副驾降温”，控制对象要明确；查记忆不能串到副驾身份。通讯、预订、记忆写入等会产生额外副作用，更不能把理解正确等同于获准提交。"],["异常与交接","非法参数、不支持功能、前置条件变化时，应拦截或请用户确认。是否由 Planner、调度层、Agent 或车端执行检查，要逐个工具说清。"],["产品要问清","谁拦非法动作？谁对接被拦后的可用替代方案？权限测试是否只测成功路径？"]],"group":"dispatch","x":7264,"y":2210,"w":1092,"h":660,"learn":["orchestration"],"future":false,"kind":"step","body":["这一步怎么做：动作下发前，需要按各领域契约检查对象、取值、车态、用户权限和必要确认。这里是产品必须明确的边界，不代表已验证公司存在一个万能的统一校验服务。","放进同一个例子：主驾说“给副驾降温”，控制对象要明确；查记忆不能串到副驾身份。通讯、预订、记忆写入等会产生额外副作用，更不能把理解正确等同于获准提交。","异常与交接：非法参数、不支持功能、前置条件变化时，应拦截或请用户确认。是否由 Planner、调度层、Agent 或车端执行检查，要逐个工具说清。","产品要问清：谁拦非法动作？谁对接被拦后的可用替代方案？权限测试是否只测成功路径？"],"textBottom":2762},{"id":"D3","title":"05.3  按顺序派发，并保留调用关联","paras":[["这一步怎么做","把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返回的结果。"],["放进同一个例子","查完记忆拿到地址，再把地址交给路线规划；降温动作的反馈与路线反馈分别记录，不能先回来的一个成功覆盖整个目标。"],["异常与交接","取消、重试、超时后迟到结果必须有明确处理。当前 SP 的反馈示意只有 tool_name 与文本，无法据此推断 action_id 回绑已完善。"],["产品要问清","反馈怎么找到那一次调用？两个同名调用反序返回、旧结果迟到，系统会不会串结果？"]],"group":"dispatch","x":7264,"y":3040,"w":1092,"h":660,"learn":["orchestration"],"future":false,"kind":"step","body":["这一步怎么做：把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返回的结果。","放进同一个例子：查完记忆拿到地址，再把地址交给路线规划；降温动作的反馈与路线反馈分别记录，不能先回来的一个成功覆盖整个目标。","异常与交接：取消、重试、超时后迟到结果必须有明确处理。当前 SP 的反馈示意只有 tool_name 与文本，无法据此推断 action_id 回绑已完善。","产品要问清：反馈怎么找到那一次调用？两个同名调用反序返回、旧结果迟到，系统会不会串结果？"],"textBottom":3592},{"id":"D4","title":"05.4  决定重试时先确认有没有做过","paras":[["这一步怎么做","查询失败和写操作超时不能使用同一重试策略。查询可按预算重试；订座、拨号或记忆写入超时，应先确认已有操作状态，再决定是否补做，避免重复副作用。"],["放进同一个例子","如果路线工具返回失败，遵守 SP 约定的最多两次重试；如果订座提交超时，则不能照搬这条策略连订几次。"],["异常与交接","重试次数、超时预算、幂等键、取消能力和失败原因，需要工具契约支持。文档没提供的字段不能当成已上线机制。"],["产品要问清","这个工具超时意味着没执行，还是执行了但没回报？有什么查询或回执能证明？"]],"group":"dispatch","x":7264,"y":3870,"w":1092,"h":660,"learn":["orchestration"],"future":false,"kind":"step","body":["这一步怎么做：查询失败和写操作超时不能使用同一重试策略。查询可按预算重试；订座、拨号或记忆写入超时，应先确认已有操作状态，再决定是否补做，避免重复副作用。","放进同一个例子：如果路线工具返回失败，遵守 SP 约定的最多两次重试；如果订座提交超时，则不能照搬这条策略连订几次。","异常与交接：重试次数、超时预算、幂等键、取消能力和失败原因，需要工具契约支持。文档没提供的字段不能当成已上线机制。","产品要问清：这个工具超时意味着没执行，还是执行了但没回报？有什么查询或回执能证明？"],"textBottom":4422},{"id":"H-execute","title":"领域理解到真实业务生效","group":"execute","x":8900,"y":920,"w":1220,"h":270,"kind":"module","body":["一项工具可能包含多步理解、检索和执行。模型输出成功、接口受理、业务生效必须分开看。"],"paras":[["模块职责","一项工具可能包含多步理解、检索和执行。模型输出成功、接口受理、业务生效必须分开看。"]],"learn":["orchestration","output"],"future":false},{"id":"E1","title":"06.1  领域工具再理解具体请求","paras":[["这一步怎么做","有的工具接自然语言 query，再由领域能力理解；有的接结构化参数或调用服务。进入工具并不意味着直接碰到车辆。具体是否再调 SFT、规则或其他模型，需看该工具实现，不能全体套同一种架构。"],["放进同一个例子","vehicle_basic_control 要把降温诉求落到具体功能、位置和数值；user_memory_search 则检索对应用户的经历，二者内部机制不同。"],["异常与交接","领域工具也可能漏掉否定或位置约束。如果 Planner 发出的指令正确、工具解释错了，责任不能继续算到 Planner。"],["产品要问清","能否看到工具收到的原始输入、内部解析结果和实际调用的下级能力？哪里第一次变错？"]],"group":"execute","x":8964,"y":1380,"w":1092,"h":660,"learn":["orchestration","output"],"future":false,"kind":"step","body":["这一步怎么做：有的工具接自然语言 query，再由领域能力理解；有的接结构化参数或调用服务。进入工具并不意味着直接碰到车辆。具体是否再调 SFT、规则或其他模型，需看该工具实现，不能全体套同一种架构。","放进同一个例子：vehicle_basic_control 要把降温诉求落到具体功能、位置和数值；user_memory_search 则检索对应用户的经历，二者内部机制不同。","异常与交接：领域工具也可能漏掉否定或位置约束。如果 Planner 发出的指令正确、工具解释错了，责任不能继续算到 Planner。","产品要问清：能否看到工具收到的原始输入、内部解析结果和实际调用的下级能力？哪里第一次变错？"],"textBottom":1932},{"id":"E2","title":"06.2  检索/候选/选择，不等于执行完成","paras":[["这一步怎么做","信息类工具返回事实，搜索类工具可能返回候选，部分工具同时执行。SP 约定 music_search 通常自动播放首条；route_planning 在选定路线后会自动导航，不能再机械地补一次开始。"],["放进同一个例子","历史地点唯一且明确时交路线规划；若还要用户选择路线，先展示候选并等待。候选列表出现不等于导航已进入正确状态。"],["异常与交接","无候选、结果过期、选项已失效、用户点错或改变主意都要回到业务处理。不能把“找到内容”当成“已经播放/已经导航”。"],["产品要问清","这个工具究竟只查询，还是查询后自动行动？用户选择会在哪个事件里返回？"]],"group":"execute","x":8964,"y":2210,"w":1092,"h":660,"learn":["orchestration","output"],"future":false,"kind":"step","body":["这一步怎么做：信息类工具返回事实，搜索类工具可能返回候选，部分工具同时执行。SP 约定 music_search 通常自动播放首条；route_planning 在选定路线后会自动导航，不能再机械地补一次开始。","放进同一个例子：历史地点唯一且明确时交路线规划；若还要用户选择路线，先展示候选并等待。候选列表出现不等于导航已进入正确状态。","异常与交接：无候选、结果过期、选项已失效、用户点错或改变主意都要回到业务处理。不能把“找到内容”当成“已经播放/已经导航”。","产品要问清：这个工具究竟只查询，还是查询后自动行动？用户选择会在哪个事件里返回？"],"textBottom":2762},{"id":"E3","title":"06.3  调用底层服务或车型能力","paras":[["这一步怎么做","真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里才可能产生真实副作用。"],["放进同一个例子","车控接口让空调或风量发生变化；路线工具让正确目的地进入导航状态。这两条链各自成功，才有可能完成本例。"],["异常与交接","SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前车态改变、资源受限、服务不可用，都可能让先前合法计划失败。"],["产品要问清","回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功口径如何保守定义？"]],"group":"execute","x":8964,"y":3040,"w":1092,"h":660,"learn":["orchestration","output"],"future":false,"kind":"step","body":["这一步怎么做：真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里才可能产生真实副作用。","放进同一个例子：车控接口让空调或风量发生变化；路线工具让正确目的地进入导航状态。这两条链各自成功，才有可能完成本例。","异常与交接：SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前车态改变、资源受限、服务不可用，都可能让先前合法计划失败。","产品要问清：回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功口径如何保守定义？"],"textBottom":3592},{"id":"E4","title":"06.4  收集结果，并给出可核验依据","paras":[["这一步怎么做","工具把事实、候选、处理中、成功或失败等业务含义交回。对于车控，应把指令回执与真实车况分开；对于导航或订单，要核对业务状态，而不是只看 HTTP 或模型文本。"],["放进同一个例子","降温要核对空调/风量等目标变化；导航要核对目的地和导航状态。仅“调用成功”不足以支撑“两个目标都完成”。"],["异常与交接","下游无法提供真实状态时，要保留“不确定/已受理”等语义，并明确待补的回读契约，不能包装成已完成。"],["产品要问清","每种结果对应哪条日志或状态证据？用户说“根本没变”时，系统能定位到哪一跳？"]],"group":"execute","x":8964,"y":3870,"w":1092,"h":660,"learn":["orchestration","output"],"future":false,"kind":"step","body":["这一步怎么做：工具把事实、候选、处理中、成功或失败等业务含义交回。对于车控，应把指令回执与真实车况分开；对于导航或订单，要核对业务状态，而不是只看 HTTP 或模型文本。","放进同一个例子：降温要核对空调/风量等目标变化；导航要核对目的地和导航状态。仅“调用成功”不足以支撑“两个目标都完成”。","异常与交接：下游无法提供真实状态时，要保留“不确定/已受理”等语义，并明确待补的回读契约，不能包装成已完成。","产品要问清：每种结果对应哪条日志或状态证据？用户说“根本没变”时，系统能定位到哪一跳？"],"textBottom":4422},{"id":"H-feedback","title":"观察结果，更新剩余目标","group":"feedback","x":10600,"y":920,"w":1220,"h":270,"kind":"module","body":["一轮推理并不等于一次完整任务。查信息、拿候选、用户选择，都可能使同一个目标再次进入推理。"],"paras":[["模块职责","一轮推理并不等于一次完整任务。查信息、拿候选、用户选择，都可能使同一个目标再次进入推理。"]],"learn":["planner","output"],"future":false},{"id":"F1","title":"07.1  工具结果回到正确请求","paras":[["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"]],"group":"feedback","x":10664,"y":1380,"w":1092,"h":660,"learn":["planner","output"],"future":false,"kind":"step","body":["这一步怎么做：tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。","放进同一个例子：先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。","异常与交接：当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。","产品要问清：这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"],"textBottom":1890},{"id":"F2","title":"07.2  把结果当新事实，不覆盖未完事项","paras":[["这一步怎么做","Context 需要反映新结果、用户选择和实际车况。已经完成的子目标保留证据，尚未完成的继续存在。历史成功也不能覆盖用户刚刚手动改变的状态。"],["放进同一个例子","查到昨天去的游泳馆后，新增的是一个可用地点；导航还没执行。空调成功后如果用户手动关掉，也必须记录新车态。"],["异常与交接","“工具调用过”与“目标完成”不同；“上一轮做过”与“本轮不必再做”也不同。远区压缩尤其不能抹掉尚未完成的依赖。"],["产品要问清","你能在新一轮实际输入中看到上一步结果吗？模型是否仍在用过时的车况？"]],"group":"feedback","x":10664,"y":2210,"w":1092,"h":660,"learn":["planner","output"],"future":false,"kind":"step","body":["这一步怎么做：Context 需要反映新结果、用户选择和实际车况。已经完成的子目标保留证据，尚未完成的继续存在。历史成功也不能覆盖用户刚刚手动改变的状态。","放进同一个例子：查到昨天去的游泳馆后，新增的是一个可用地点；导航还没执行。空调成功后如果用户手动关掉，也必须记录新车态。","异常与交接：“工具调用过”与“目标完成”不同；“上一轮做过”与“本轮不必再做”也不同。远区压缩尤其不能抹掉尚未完成的依赖。","产品要问清：你能在新一轮实际输入中看到上一步结果吗？模型是否仍在用过时的车况？"],"textBottom":2720},{"id":"F3","title":"07.3  未完成就回 03，再由 04 决策","paras":[["这一步怎么做","如果仍缺信息、需要调用下一工具或修正失败，沿 R1 回到 03 组装本轮输入，再由同一个 Planner 判断。不是把结果交给另一个名叫 Director 的模型重新开始。"],["放进同一个例子","第二轮拿到地址后调用路线规划；如果返回多个路线，再等待用户选择；导航状态确认后才关闭导航子目标。"],["异常与交接","失败可选择重试、换方案、澄清或明确终止，但必须受能力与副作用约束。不能无限重试，也不能在用户取消后重新激活旧目标。"],["产品要问清","每一轮新增了什么有效信息？为什么有必要再推理一次，而不是重复调用同一个工具？"]],"group":"feedback","x":10664,"y":3040,"w":1092,"h":660,"learn":["planner","output"],"future":false,"kind":"step","body":["这一步怎么做：如果仍缺信息、需要调用下一工具或修正失败，沿 R1 回到 03 组装本轮输入，再由同一个 Planner 判断。不是把结果交给另一个名叫 Director 的模型重新开始。","放进同一个例子：第二轮拿到地址后调用路线规划；如果返回多个路线，再等待用户选择；导航状态确认后才关闭导航子目标。","异常与交接：失败可选择重试、换方案、澄清或明确终止，但必须受能力与副作用约束。不能无限重试，也不能在用户取消后重新激活旧目标。","产品要问清：每一轮新增了什么有效信息？为什么有必要再推理一次，而不是重复调用同一个工具？"],"textBottom":3592},{"id":"F4","title":"07.4  能证明什么，就汇报到什么程度","paras":[["这一步怎么做","根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。"],["放进同一个例子","如果降温成功但地点没找到，就说清已处理降温、地点仍需确认；不能说“都安排好了”。如果两者都生效，才给完成反馈。"],["异常与交接","业务结果与用户满意度还需分开：导航已正确开始不等于用户对路线满意；空调参数变化也不等于用户已经感到舒适。"],["产品要问清","系统每一次“已完成”是否都有证据？假完成率的分母必须是宣称完成的请求。"]],"group":"feedback","x":10664,"y":3870,"w":1092,"h":660,"learn":["planner","output"],"future":false,"kind":"step","body":["这一步怎么做：根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。","放进同一个例子：如果降温成功但地点没找到，就说清已处理降温、地点仍需确认；不能说“都安排好了”。如果两者都生效，才给完成反馈。","异常与交接：业务结果与用户满意度还需分开：导航已正确开始不等于用户对路线满意；空调参数变化也不等于用户已经感到舒适。","产品要问清：系统每一次“已完成”是否都有证据？假完成率的分母必须是宣称完成的请求。"],"textBottom":4422},{"id":"H-output","title":"让用户听到、看到并继续","group":"output","x":12300,"y":920,"w":1220,"h":270,"kind":"module","body":["说、显、做是相互约束的输出，不是“TTS→虚拟形象→车控”的一条串行链。"],"paras":[["模块职责","说、显、做是相互约束的输出，不是“TTS→虚拟形象→车控”的一条串行链。"]],"learn":["output","visible-ui"],"future":false},{"id":"O1","title":"08.1  决定说不说、说到哪一步","paras":[["这一步怎么做","Planner 的 talk_content 用于生成对话输出；查询、简单控制等场景不一定需要无意义的“我帮你查一下”。部分领域 Agent 也会自己播报，需要避免重复或抢话。"],["放进同一个例子","若地点仍在确认，可以先说明必要的下一步；若空调成功而导航失败，应明确部分结果。不能在动作尚未发生时用完成时态承诺。"],["异常与交接","话术要与本轮实际动作、失败和等待一致；安全或重要结果不能被普通过渡语覆盖。具体播报优先级按运行策略核验。"],["产品要问清","谁负责首响应，谁负责领域结果，谁负责总结？有没有重复播报和抢话测试？"]],"group":"output","x":12364,"y":1380,"w":1092,"h":660,"learn":["output","visible-ui"],"future":false,"kind":"step","body":["这一步怎么做：Planner 的 talk_content 用于生成对话输出；查询、简单控制等场景不一定需要无意义的“我帮你查一下”。部分领域 Agent 也会自己播报，需要避免重复或抢话。","放进同一个例子：若地点仍在确认，可以先说明必要的下一步；若空调成功而导航失败，应明确部分结果。不能在动作尚未发生时用完成时态承诺。","异常与交接：话术要与本轮实际动作、失败和等待一致；安全或重要结果不能被普通过渡语覆盖。具体播报优先级按运行策略核验。","产品要问清：谁负责首响应，谁负责领域结果，谁负责总结？有没有重复播报和抢话测试？"],"textBottom":1932},{"id":"O2","title":"08.2  TTS、卡片与形象各走交互通道","paras":[["这一步怎么做","文字转语音（TTS）让用户听见；卡片展示候选、进度或业务结果；虚拟形象可以配合情绪表达。车控执行是 06 的独立业务链，不需要等形象播完才必然发生。"],["放进同一个例子","可以一边完成降温，一边展示路线候选；用户看见卡片与真实导航启动是不同的两个事件。avatar 或动画不能充当“车控成功”的证明。"],["异常与交接","卡片请求被受理不等于已经显示：可能排队、被覆盖、过期或不在前台。首播、首卡片、首动作、最终完成要分开记时。"],["产品要问清","显示成功在哪个回执里？UI 动效、工具成功和真实车况是否被错误地共用一个成功字段？"]],"group":"output","x":12364,"y":2210,"w":1092,"h":660,"learn":["output","visible-ui"],"future":false,"kind":"step","body":["这一步怎么做：文字转语音（TTS）让用户听见；卡片展示候选、进度或业务结果；虚拟形象可以配合情绪表达。车控执行是 06 的独立业务链，不需要等形象播完才必然发生。","放进同一个例子：可以一边完成降温，一边展示路线候选；用户看见卡片与真实导航启动是不同的两个事件。avatar 或动画不能充当“车控成功”的证明。","异常与交接：卡片请求被受理不等于已经显示：可能排队、被覆盖、过期或不在前台。首播、首卡片、首动作、最终完成要分开记时。","产品要问清：显示成功在哪个回执里？UI 动效、工具成功和真实车况是否被错误地共用一个成功字段？"],"textBottom":2762},{"id":"O3","title":"08.3  用户手点或说“第三个”，回原业务","paras":[["这一步怎么做","手动选择与可见即可说需要找到当前可操作元素，再触发原业务按钮回调。关键选择结果应回到 Context；未完成的任务继续判断，不能让一次点击丢失前面的目标。"],["放进同一个例子","用户选第三条路线后，由路线业务完成其既定选择/导航流程，再把结果回给系统；不应把“第三个”单独当成没有上下文的新地点。"],["异常与交接","页面已切换、候选过期、同名按钮、任务已取消时，不能照旧点击。可见即可说的详细匹配链在本列下方展开。"],["产品要问清","原业务收到的是哪个选项 ID？实际选择有没有进入下一轮模型输入？"]],"group":"output","x":12364,"y":3040,"w":1092,"h":660,"learn":["output","visible-ui"],"future":false,"kind":"step","body":["这一步怎么做：手动选择与可见即可说需要找到当前可操作元素，再触发原业务按钮回调。关键选择结果应回到 Context；未完成的任务继续判断，不能让一次点击丢失前面的目标。","放进同一个例子：用户选第三条路线后，由路线业务完成其既定选择/导航流程，再把结果回给系统；不应把“第三个”单独当成没有上下文的新地点。","异常与交接：页面已切换、候选过期、同名按钮、任务已取消时，不能照旧点击。可见即可说的详细匹配链在本列下方展开。","产品要问清：原业务收到的是哪个选项 ID？实际选择有没有进入下一轮模型输入？"],"textBottom":3550},{"id":"O4","title":"08.4  打断、改目标与取消分别处理","paras":[["这一步怎么做","新语音从 01 进入；与当前业务相关的点击事件可沿 U1 回 03。打断播报不自动取消已下发车控；取消一次执行也不自动删除长期任务，这些必须用业务状态区分。"],["放进同一个例子","用户说“先别去了”应影响导航目标，但是否保留已完成降温要按原意处理；用户仅把音量调低，不应让历史任务重新执行。"],["异常与交接","完整闭环最后还要记录失败与用户反馈，进入评测和改进。产品经理需要能追这一条链，而不是必须实现每个底层模型后才有资格判断好坏。"],["产品要问清","同一案例能否讲清成功标准、最早出错点、责任边界、改法和回归结果？"]],"group":"output","x":12364,"y":3870,"w":1092,"h":660,"learn":["output","visible-ui"],"future":false,"kind":"step","body":["这一步怎么做：新语音从 01 进入；与当前业务相关的点击事件可沿 U1 回 03。打断播报不自动取消已下发车控；取消一次执行也不自动删除长期任务，这些必须用业务状态区分。","放进同一个例子：用户说“先别去了”应影响导航目标，但是否保留已完成降温要按原意处理；用户仅把音量调低，不应让历史任务重新执行。","异常与交接：完整闭环最后还要记录失败与用户反馈，进入评测和改进。产品经理需要能追这一条链，而不是必须实现每个底层模型后才有资格判断好坏。","产品要问清：同一案例能否讲清成功标准、最早出错点、责任边界、改法和回归结果？"],"textBottom":4380},{"id":"H-input-detail","title":"输入侧还要分清的三件事","group":"input-detail","x":400,"y":5770,"w":1220,"h":270,"kind":"module","body":["补充机制 · 不改变主线的入口归属"],"paras":[["模块职责","补充机制 · 不改变主线的入口归属"]],"learn":["voice","visible-ui"],"future":false},{"id":"IV1","title":"1. 声音结束与系统开始响应之间","paras":[["这一步怎么做","尾延迟从用户实际结束说话到最终 Query 就绪计量。唤醒等待、判停等待、网络传输和模型首响应是不同段；只报一个总平均值，无法确定真正的慢点。"],["放进同一个例子","本例若“游泳馆”末尾被截掉，再快的 Planner 首 token 也没有意义。"],["异常与交接","质量与时延应在同一测试集上对照，避免用过早判停换取更快响应。"],["产品要问清","是否单独保留关键否定、地点、数值的识别准确性，以及 P50/P95 尾延迟？"]],"group":"input-detail","x":464,"y":6230,"w":1092,"h":660,"learn":["voice","visible-ui"],"future":false,"kind":"step","body":["这一步怎么做：尾延迟从用户实际结束说话到最终 Query 就绪计量。唤醒等待、判停等待、网络传输和模型首响应是不同段；只报一个总平均值，无法确定真正的慢点。","放进同一个例子：本例若“游泳馆”末尾被截掉，再快的 Planner 首 token 也没有意义。","异常与交接：质量与时延应在同一测试集上对照，避免用过早判停换取更快响应。","产品要问清：是否单独保留关键否定、地点、数值的识别准确性，以及 P50/P95 尾延迟？"],"textBottom":6698},{"id":"IV2","title":"2. 声纹、音区与人脸注册身份","paras":[["这一步怎么做","座位说明声音来自哪里，注册身份说明能使用谁的数据。不同信息源可能缺失或冲突；产品需要定义未知身份如何交互，不应默认音区定位正确就能读取历史记忆。"],["放进同一个例子","主驾换人后，不能继续拿上一位驾驶员的“昨天游泳馆”。"],["异常与交接","无身份时可以问用户地点，或按允许的匿名能力处理；不能假装记忆已命中。"],["产品要问清","身份切换、多人同时说话、人脸未识别与临时换座，各自会影响什么字段？"]],"group":"input-detail","x":464,"y":7060,"w":1092,"h":660,"learn":["voice","visible-ui"],"future":false,"kind":"step","body":["这一步怎么做：座位说明声音来自哪里，注册身份说明能使用谁的数据。不同信息源可能缺失或冲突；产品需要定义未知身份如何交互，不应默认音区定位正确就能读取历史记忆。","放进同一个例子：主驾换人后，不能继续拿上一位驾驶员的“昨天游泳馆”。","异常与交接：无身份时可以问用户地点，或按允许的匿名能力处理；不能假装记忆已命中。","产品要问清：身份切换、多人同时说话、人脸未识别与临时换座，各自会影响什么字段？"],"textBottom":7570},{"id":"IV3","title":"3. 同一条语音也可能命中页面操作","paras":[["这一步怎么做","可见即可说可以把语音转成当前页面按钮动作；普通自然语言则进入主请求链。两者的优先级不能只用“有端侧小模型”概括，需核对当前车型的页面注册和路由策略。"],["放进同一个例子","用户面对路线卡片说“第三个”，需要页内元素匹配；没有有效页面时不能随意猜按钮。"],["异常与交接","框架 PRD 存在页面语音的优先级要求，但它不能证明每种卡片已经完成接入。"],["产品要问清","命中页面操作后，是否还会作为普通 Query 再执行一次？"]],"group":"input-detail","x":464,"y":7890,"w":1092,"h":660,"learn":["voice","visible-ui"],"future":false,"kind":"step","body":["这一步怎么做：可见即可说可以把语音转成当前页面按钮动作；普通自然语言则进入主请求链。两者的优先级不能只用“有端侧小模型”概括，需核对当前车型的页面注册和路由策略。","放进同一个例子：用户面对路线卡片说“第三个”，需要页内元素匹配；没有有效页面时不能随意猜按钮。","异常与交接：框架 PRD 存在页面语音的优先级要求，但它不能证明每种卡片已经完成接入。","产品要问清：命中页面操作后，是否还会作为普通 Query 再执行一次？"],"textBottom":8400},{"id":"H-local-trigger","title":"端侧触发器与本地闭环","group":"local-trigger","x":2100,"y":5770,"w":1220,"h":270,"kind":"module","body":["条件事件入口 · 不必等用户再次开口"],"paras":[["模块职责","条件事件入口 · 不必等用户再次开口"]],"learn":["config","end-trigger","cloud-trigger"],"future":false},{"id":"LT1","title":"1. 先有可执行规则，才有本地等待","paras":[["这一步怎么做","配置侧需定义适用范围、信号、条件和动作，再下发端侧。端侧必须确认规则能被感知和执行；云端发布成功不能代替车端已获取、校验并生效。"],["放进同一个例子","系统预设“某车况满足后建议处理”时，先明确车型、信号单位、枚举与动作范围。"],["异常与交接","非法配置、能力缺失、版本未生效，应反馈具体失败，而非永远显示“等待中”。"],["产品要问清","规则版本在哪能读到？由谁负责场景方案、谁配置、谁提供实车验收？"]],"group":"local-trigger","x":2164,"y":6230,"w":1092,"h":660,"learn":["config","end-trigger","cloud-trigger"],"future":false,"kind":"step","body":["这一步怎么做：配置侧需定义适用范围、信号、条件和动作，再下发端侧。端侧必须确认规则能被感知和执行；云端发布成功不能代替车端已获取、校验并生效。","放进同一个例子：系统预设“某车况满足后建议处理”时，先明确车型、信号单位、枚举与动作范围。","异常与交接：非法配置、能力缺失、版本未生效，应反馈具体失败，而非永远显示“等待中”。","产品要问清：规则版本在哪能读到？由谁负责场景方案、谁配置、谁提供实车验收？"],"textBottom":6698},{"id":"LT2","title":"2. 变化事件唤醒，快照提供判断事实","paras":[["这一步怎么做","变化上报用于唤醒相关规则；定时轮询用于提供快照。条件求值需要明确读哪个时刻的状态，并处理多个条件组合、持续时间和抖动，不能只看一个变化事件就认定全部满足。"],["放进同一个例子","车门打开事件可以唤醒规则，但是否主驾在座、车辆是否驻车，还要读对应事实。"],["异常与交接","未达成不是能力未覆盖。暂时不满足应继续等待；根本观测不到才是能力或配置问题。"],["产品要问清","事件发生、采集、缓存更新与求值的时间先后能否完整还原？"]],"group":"local-trigger","x":2164,"y":7060,"w":1092,"h":660,"learn":["config","end-trigger","cloud-trigger"],"future":false,"kind":"step","body":["这一步怎么做：变化上报用于唤醒相关规则；定时轮询用于提供快照。条件求值需要明确读哪个时刻的状态，并处理多个条件组合、持续时间和抖动，不能只看一个变化事件就认定全部满足。","放进同一个例子：车门打开事件可以唤醒规则，但是否主驾在座、车辆是否驻车，还要读对应事实。","异常与交接：未达成不是能力未覆盖。暂时不满足应继续等待；根本观测不到才是能力或配置问题。","产品要问清：事件发生、采集、缓存更新与求值的时间先后能否完整还原？"],"textBottom":7570},{"id":"LT3","title":"3. 命中还要经过抑制，再执行与回读","paras":[["这一步怎么做","满足条件后还要核对冷却、去重、范围、取消和冲突策略，再进入执行域。端云可能同时对同一场景有判断，谁持有执行权需要真实契约，不应假定天然不会重复。"],["放进同一个例子","一个持续为真的条件不应每次快照都再做同一动作；用户刚取消的任务也不应被迟到事件唤醒。"],["异常与交接","端侧资源不足、队列拥塞、规则更新、重启或断网恢复可能导致漏触发或旧事件补触发，必须作为独立测试维度。"],["产品要问清","错误来自规则、端侧资源、模型语义还是软硬件时序？哪条证据能排除另外三类？"]],"group":"local-trigger","x":2164,"y":7890,"w":1092,"h":660,"learn":["config","end-trigger","cloud-trigger"],"future":false,"kind":"step","body":["这一步怎么做：满足条件后还要核对冷却、去重、范围、取消和冲突策略，再进入执行域。端云可能同时对同一场景有判断，谁持有执行权需要真实契约，不应假定天然不会重复。","放进同一个例子：一个持续为真的条件不应每次快照都再做同一动作；用户刚取消的任务也不应被迟到事件唤醒。","异常与交接：端侧资源不足、队列拥塞、规则更新、重启或断网恢复可能导致漏触发或旧事件补触发，必须作为独立测试维度。","产品要问清：错误来自规则、端侧资源、模型语义还是软硬件时序？哪条证据能排除另外三类？"],"textBottom":8442},{"id":"H-state-data","title":"状态、感知与记忆怎样进来","group":"state-data","x":3800,"y":5770,"w":1220,"h":270,"kind":"module","body":["数据供给面 · 不把所有数据画成串行前置"],"paras":[["模块职责","数据供给面 · 不把所有数据画成串行前置"]],"learn":["context","signals"],"future":false},{"id":"SC1","title":"1. 端状态中心与云端缓存各有职责","paras":[["这一步怎么做","车辆信号、应用状态、用户操作、默认感知等在端侧形成状态与事件，再按协议上报云端并被 Context 使用。缓存表示已保存的已知事实，不是保证仍然最新的事实。"],["放进同一个例子","用户手动关了空调，应产生相应状态或事件；否则模型可能继续使用刚才“空调打开成功”的历史。"],["异常与交接","全量、增量、轮询和变化上报的使用范围需逐个信号确认。丢包、时钟差、乱序必须反映在新鲜度判断里。"],["产品要问清","每个关键字段来自哪里、多久更新、缺失怎么表达？云端如何知道值已经过期？"]],"group":"state-data","x":3864,"y":6230,"w":1092,"h":660,"learn":["context","signals"],"future":false,"kind":"step","body":["这一步怎么做：车辆信号、应用状态、用户操作、默认感知等在端侧形成状态与事件，再按协议上报云端并被 Context 使用。缓存表示已保存的已知事实，不是保证仍然最新的事实。","放进同一个例子：用户手动关了空调，应产生相应状态或事件；否则模型可能继续使用刚才“空调打开成功”的历史。","异常与交接：全量、增量、轮询和变化上报的使用范围需逐个信号确认。丢包、时钟差、乱序必须反映在新鲜度判断里。","产品要问清：每个关键字段来自哪里、多久更新、缺失怎么表达？云端如何知道值已经过期？"],"textBottom":6782},{"id":"SC2","title":"2. 默认感知与记忆不是一回事","paras":[["这一步怎么做","默认视觉可提供此刻舱内外观察；用户记忆提供归属于某人的经历与偏好；事件日志记录交互和变化。不同资料对“现在”“过去”“长期偏好”的含义不同。"],["放进同一个例子","宝宝正在后排睡觉是当前观察；用户不喜欢直吹是偏好；昨天去某游泳馆是历史经历。三者可能共同影响这一次规划。"],["异常与交接","观察不可见、记忆查无结果、历史无记录，都不应被解释为“没有发生”或“用户没有这个偏好”。"],["产品要问清","模型的某句判断究竟用了哪类证据？是否把历史状态误当当前事实？"]],"group":"state-data","x":3864,"y":7060,"w":1092,"h":660,"learn":["context","signals"],"future":false,"kind":"step","body":["这一步怎么做：默认视觉可提供此刻舱内外观察；用户记忆提供归属于某人的经历与偏好；事件日志记录交互和变化。不同资料对“现在”“过去”“长期偏好”的含义不同。","放进同一个例子：宝宝正在后排睡觉是当前观察；用户不喜欢直吹是偏好；昨天去某游泳馆是历史经历。三者可能共同影响这一次规划。","异常与交接：观察不可见、记忆查无结果、历史无记录，都不应被解释为“没有发生”或“用户没有这个偏好”。","产品要问清：模型的某句判断究竟用了哪类证据？是否把历史状态误当当前事实？"],"textBottom":7570},{"id":"SC3","title":"3. 动态示例与 knowhow 只是参考","paras":[["这一步怎么做","场景 knowhow 说明处理范式；动态示例按本轮输入检索后临时注入。它们帮助模型选路和用工具，但不是实际车况，更不是某次动作已经发生的证据。"],["放进同一个例子","示例展示“先查昨天地点再规划”，不能让模型复制示例里的城市、车牌或用户身份。"],["异常与交接","检索错例、未注册工具、企业/环境隔离错误会诱发稳定的系统性 badcase；只调温度或换模型可能无法修好。"],["产品要问清","有无示例的保留集对照、错误检索案例、上下文长度和额外耗时是否一起看？"]],"group":"state-data","x":3864,"y":7890,"w":1092,"h":660,"learn":["context","signals"],"future":false,"kind":"step","body":["这一步怎么做：场景 knowhow 说明处理范式；动态示例按本轮输入检索后临时注入。它们帮助模型选路和用工具，但不是实际车况，更不是某次动作已经发生的证据。","放进同一个例子：示例展示“先查昨天地点再规划”，不能让模型复制示例里的城市、车牌或用户身份。","异常与交接：检索错例、未注册工具、企业/环境隔离错误会诱发稳定的系统性 badcase；只调温度或换模型可能无法修好。","产品要问清：有无示例的保留集对照、错误检索案例、上下文长度和额外耗时是否一起看？"],"textBottom":8400},{"id":"H-task","title":"未来目标：旧 Goal 与新 Task","group":"task","x":5500,"y":5770,"w":1220,"h":270,"kind":"module","body":["旧链与新设计分开 · 不表示两套同时执行"],"paras":[["模块职责","旧链与新设计分开 · 不表示两套同时执行"]],"learn":["task"],"future":true},{"id":"TK1","title":"1. 先判断是以后做，不是现在做","paras":[["这一步怎么做","“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。"],["放进同一个例子","本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。"],["异常与交接","方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。"],["产品要问清","当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"]],"group":"task","x":5564,"y":6230,"w":1092,"h":660,"learn":["task"],"future":true,"kind":"step","body":["这一步怎么做：“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。","放进同一个例子：本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。","异常与交接：方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。","产品要问清：当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"],"textBottom":6740},{"id":"TK2","title":"2. Task Agent 转发，服务内理解任务","paras":[["这一步怎么做","新设计中 Planner 把任务类型和文本交 Task Agent，后者是代理入口；Ingress 做关联恢复、幂等与语义/事件/查询分流。Spec Builder 再识别创建、修改或取消，生成命令和任务定义。"],["放进同一个例子","创建“到达后提醒”时，Planner 不必直接生成完整 TaskSpec；Task 服务负责把目标、条件与动作变成可管理定义。"],["异常与交接","任务操作识别、目标定位和参数补齐可能失败。不能把“请求已转发”当成“任务已可靠创建”。"],["产品要问清","谁判断用户是在新增、改旧任务还是取消？多条同类任务时如何找对目标？"]],"group":"task","x":5564,"y":7060,"w":1092,"h":660,"learn":["task"],"future":true,"kind":"step","body":["这一步怎么做：新设计中 Planner 把任务类型和文本交 Task Agent，后者是代理入口；Ingress 做关联恢复、幂等与语义/事件/查询分流。Spec Builder 再识别创建、修改或取消，生成命令和任务定义。","放进同一个例子：创建“到达后提醒”时，Planner 不必直接生成完整 TaskSpec；Task 服务负责把目标、条件与动作变成可管理定义。","异常与交接：任务操作识别、目标定位和参数补齐可能失败。不能把“请求已转发”当成“任务已可靠创建”。","产品要问清：谁判断用户是在新增、改旧任务还是取消？多条同类任务时如何找对目标？"],"textBottom":7612},{"id":"TK3","title":"3. Manager 管状态，Trigger Adapter 接条件","paras":[["这一步怎么做","Manager 管理数量、生命周期和策略；Repository 保存 Task、Run、Event、Binding 等关联；Trigger Adapter 把可执行条件转换并注册到触发系统。等待成立以后才可对用户承诺已建立任务。"],["放进同一个例子","“到达游泳馆”要有可观测的条件和明确执行内容。只存了一段自然语言，却没注册可用条件，任务并不能真正等到未来。"],["异常与交接","新设计区分任务 waiting/running/closed 与单次 Run 的成功、失败、跳过、取消；等待用户或外部结果仍可能是一次运行中的阶段。"],["产品要问清","创建成功的证据是口头回复、Spec 生成，还是已持久化且条件订阅可用？"]],"group":"task","x":5564,"y":7890,"w":1092,"h":660,"learn":["task"],"future":true,"kind":"step","body":["这一步怎么做：Manager 管理数量、生命周期和策略；Repository 保存 Task、Run、Event、Binding 等关联；Trigger Adapter 把可执行条件转换并注册到触发系统。等待成立以后才可对用户承诺已建立任务。","放进同一个例子：“到达游泳馆”要有可观测的条件和明确执行内容。只存了一段自然语言，却没注册可用条件，任务并不能真正等到未来。","异常与交接：新设计区分任务 waiting/running/closed 与单次 Run 的成功、失败、跳过、取消；等待用户或外部结果仍可能是一次运行中的阶段。","产品要问清：创建成功的证据是口头回复、Spec 生成，还是已持久化且条件订阅可用？"],"textBottom":8442},{"id":"TK4","title":"4. 条件到来后，恢复运行并可靠回写","paras":[["这一步怎么做","触发事件关联原任务后创建/恢复本次 Run，再由 Runtime 分发。通用执行可走 Planner/Agent/Tool；GUI 或生态 Provider 可管理内部步骤，不是所有任务都必须再次进 Planner。Result Hook 负责可靠回写与补偿。"],["放进同一个例子","到达事件出现后再次确认任务未取消、条件仍适用，再发送提醒。一次提醒完成后是关闭还是回到等待，取决于一次性或周期性定义。"],["异常与交接","Task Query 提供只读状态；Message Dispatcher 负责消息通道，不负责生命周期。推荐消息的 Binding 应先持久化，再用 recommend_id 恢复交互关联。"],["产品要问清","重复回调、客户端迟到、取消后的旧结果和服务重启，能否仍找到同一个 Task/Run？"]],"group":"task","x":5564,"y":8720,"w":1092,"h":660,"learn":["task"],"future":true,"kind":"step","body":["这一步怎么做：触发事件关联原任务后创建/恢复本次 Run，再由 Runtime 分发。通用执行可走 Planner/Agent/Tool；GUI 或生态 Provider 可管理内部步骤，不是所有任务都必须再次进 Planner。Result Hook 负责可靠回写与补偿。","放进同一个例子：到达事件出现后再次确认任务未取消、条件仍适用，再发送提醒。一次提醒完成后是关闭还是回到等待，取决于一次性或周期性定义。","异常与交接：Task Query 提供只读状态；Message Dispatcher 负责消息通道，不负责生命周期。推荐消息的 Binding 应先持久化，再用 recommend_id 恢复交互关联。","产品要问清：重复回调、客户端迟到、取消后的旧结果和服务重启，能否仍找到同一个 Task/Run？"],"textBottom":9314},{"id":"H-tools-contract","title":"工具内部机制：逐跳拆开问","group":"tools-contract","x":7200,"y":5770,"w":1220,"h":270,"kind":"module","body":["模型理解 / 业务校验 / 执行 / 回报，不合成一句“调用工具”"],"paras":[["模块职责","模型理解 / 业务校验 / 执行 / 回报，不合成一句“调用工具”"]],"learn":["orchestration","planner"],"future":false},{"id":"TC1","title":"1. 先数清口径，再研究重点工具","paras":[["这一步怎么做","本地 SP 可见 27 个唯一工具定义；当前车型运行时可能注入更少，后端支持集合也可能不同。工具名只是入口，不代表一个模型、一个服务或一个原子接口。"],["放进同一个例子","一个 vehicle_basic_control 可能覆盖许多车控动作；因此“有 27 个工具”不能推导出只有 27 个能力，也不能衡量 AI 强弱。"],["异常与交接","没有拿到运行注册表、Schema 和下游实现时，只能说清定义与待核项，不能编造具体模型规模、SDK 路径或权限层。"],["产品要问清","定义数、注入数、可调用数、实际成功能力覆盖，是否分别统计？"]],"group":"tools-contract","x":7264,"y":6230,"w":1092,"h":660,"learn":["orchestration","planner"],"future":false,"kind":"step","body":["这一步怎么做：本地 SP 可见 27 个唯一工具定义；当前车型运行时可能注入更少，后端支持集合也可能不同。工具名只是入口，不代表一个模型、一个服务或一个原子接口。","放进同一个例子：一个 vehicle_basic_control 可能覆盖许多车控动作；因此“有 27 个工具”不能推导出只有 27 个能力，也不能衡量 AI 强弱。","异常与交接：没有拿到运行注册表、Schema 和下游实现时，只能说清定义与待核项，不能编造具体模型规模、SDK 路径或权限层。","产品要问清：定义数、注入数、可调用数、实际成功能力覆盖，是否分别统计？"],"textBottom":6740},{"id":"TC2","title":"2. 每个工具必须能回答一张契约表","paras":[["这一步怎么做","至少问清输入、内部理解、下游能力、前置条件、状态机、超时重试、反馈关联和成功证据。参数是自然语言还是结构化，决定错误可能发生在哪一层。"],["放进同一个例子","路线工具从具体目的地到候选路线，再到选择后自动导航；这一串不能简写成“输入地址→输出路线”。"],["异常与交接","缺失取消接口、没有结构化状态、超时无法查询上一操作，都属于实质边界，需要在产品方案中体现。"],["产品要问清","让负责人拿一个成功 Trace 和一个失败 Trace，能否逐跳对照输入、输出与实际副作用？"]],"group":"tools-contract","x":7264,"y":7060,"w":1092,"h":660,"learn":["orchestration","planner"],"future":false,"kind":"step","body":["这一步怎么做：至少问清输入、内部理解、下游能力、前置条件、状态机、超时重试、反馈关联和成功证据。参数是自然语言还是结构化，决定错误可能发生在哪一层。","放进同一个例子：路线工具从具体目的地到候选路线，再到选择后自动导航；这一串不能简写成“输入地址→输出路线”。","异常与交接：缺失取消接口、没有结构化状态、超时无法查询上一操作，都属于实质边界，需要在产品方案中体现。","产品要问清：让负责人拿一个成功 Trace 和一个失败 Trace，能否逐跳对照输入、输出与实际副作用？"],"textBottom":7570},{"id":"TC3","title":"3. 不要平均钻研全部工具实现","paras":[["这一步怎么做","优先深入负责场景真正使用的工具：Planner/触发器主责要能定位和验收，车控、记忆、导航要懂内部业务状态；ASR、VLM、SDK 的底层训练或代码按实际问题再深入。"],["放进同一个例子","“昨天游泳馆”至少要看记忆如何查、路线如何选、导航怎样确认；只背 27 个英文名无法发现“查到地点但没有开始导航”。"],["异常与交接","不必等所有底层实现都学完才考虑职业机会；但没有完整 Trace、可复现 badcase 和改进结果，也不能仅凭了解 prompt 证明可迁移能力。"],["产品要问清","你能独立解释最早出错点、提出改法、定义对照指标，并证明修复未损伤其他场景吗？"]],"group":"tools-contract","x":7264,"y":7890,"w":1092,"h":660,"learn":["orchestration","planner"],"future":false,"kind":"step","body":["这一步怎么做：优先深入负责场景真正使用的工具：Planner/触发器主责要能定位和验收，车控、记忆、导航要懂内部业务状态；ASR、VLM、SDK 的底层训练或代码按实际问题再深入。","放进同一个例子：“昨天游泳馆”至少要看记忆如何查、路线如何选、导航怎样确认；只背 27 个英文名无法发现“查到地点但没有开始导航”。","异常与交接：不必等所有底层实现都学完才考虑职业机会；但没有完整 Trace、可复现 badcase 和改进结果，也不能仅凭了解 prompt 证明可迁移能力。","产品要问清：你能独立解释最早出错点、提出改法、定义对照指标，并证明修复未损伤其他场景吗？"],"textBottom":8442},{"id":"H-vision-trigger","title":"VLM 与云端条件判定","group":"vision-trigger","x":8900,"y":5770,"w":1220,"h":270,"kind":"module","body":["视觉观察≠业务条件命中≠执行成功"],"paras":[["模块职责","视觉观察≠业务条件命中≠执行成功"]],"learn":["signals","cloud-trigger"],"future":false},{"id":"VL1","title":"1. 按需看一眼：visual_qa","paras":[["这一步怎么做","用户提出视觉问题时，按请求方向采集对应画面，再由视觉能力回答可见内容。这是一次工具调用，结果回 07；不能把摄像头当互联网，也不能用它直接读取车机屏幕。"],["放进同一个例子","“外面那栋建筑是什么”需要正确方向与当前画面；若还要门票价格，应再查外部资料，不能从图像直接得出现价。"],["异常与交接","遮挡、错误视角、旧帧或画面不可见要明确表达。图像判断准确也不保证后续工具选择正确。"],["产品要问清","模型看的是哪一帧？用户所指对象真在视野里吗？时延里采图和推理分别占多少？"]],"group":"vision-trigger","x":8964,"y":6230,"w":1092,"h":660,"learn":["signals","cloud-trigger"],"future":false,"kind":"step","body":["这一步怎么做：用户提出视觉问题时，按请求方向采集对应画面，再由视觉能力回答可见内容。这是一次工具调用，结果回 07；不能把摄像头当互联网，也不能用它直接读取车机屏幕。","放进同一个例子：“外面那栋建筑是什么”需要正确方向与当前画面；若还要门票价格，应再查外部资料，不能从图像直接得出现价。","异常与交接：遮挡、错误视角、旧帧或画面不可见要明确表达。图像判断准确也不保证后续工具选择正确。","产品要问清：模型看的是哪一帧？用户所指对象真在视野里吗？时延里采图和推理分别占多少？"],"textBottom":6782},{"id":"VL2","title":"2. 默认 AlwaysOn：持续提供场景观察","paras":[["这一步怎么做","默认感知按已覆盖能力产生舱内外观察，经端数据中心等路径供 Context 使用。某次结果未达成，只说明当时没看到条件成立，不等于系统缺少这项观察能力。"],["放进同一个例子","默认能力已经能看某类舱内状态时，任务未命中应继续等默认观察；只有目标未覆盖时，才讨论额外专属观察。"],["异常与交接","开关、隐私、资源预算与结果新鲜度都影响能否使用。不能用一个“AlwaysOn 开了”代替具体能力覆盖表。"],["产品要问清","这是能力未覆盖，还是覆盖但当前未达成？证据来自哪份能力表和哪次观察？"]],"group":"vision-trigger","x":8964,"y":7060,"w":1092,"h":660,"learn":["signals","cloud-trigger"],"future":false,"kind":"step","body":["这一步怎么做：默认感知按已覆盖能力产生舱内外观察，经端数据中心等路径供 Context 使用。某次结果未达成，只说明当时没看到条件成立，不等于系统缺少这项观察能力。","放进同一个例子：默认能力已经能看某类舱内状态时，任务未命中应继续等默认观察；只有目标未覆盖时，才讨论额外专属观察。","异常与交接：开关、隐私、资源预算与结果新鲜度都影响能否使用。不能用一个“Al
