    </marker>
  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">流程一：状态变化怎样成为业务事件</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,220 350,286" marker-end="url(#arrow-EV-production)"><title>ep1 → ep2：信号变化</title></polyline><polyline class="arr" fill="none" points="350,410 350,476" marker-end="url(#arrow-EV-production)"><title>ep2 → ep3：合法数据</title></polyline><polyline class="arr" fill="none" points="350,600 350,666" marker-end="url(#arrow-EV-production)"><title>ep3 → ep4：规则满足</title></polyline><polyline class="arr" fill="none" points="176,530 60,530 60,1708 170,1708" marker-end="url(#arrow-EV-production)"><title>ep3 → ep9：未满足/不支持</title></polyline><polyline class="arr" fill="none" points="350,790 350,856" marker-end="url(#arrow-EV-production)"><title>ep4 → ep5：定义已配置</title></polyline><polyline class="arr" fill="none" points="350,980 350,1046" marker-end="url(#arrow-EV-production)"><title>ep5 → ep6：模板所需数据齐备</title></polyline><polyline class="arr" fill="none" points="350,1170 350,1236" marker-end="url(#arrow-EV-production)"><title>ep6 → ep7：上报事实</title></polyline><polyline class="arr" fill="none" points="350,1398 350,1464" marker-end="url(#arrow-EV-production)"><title>ep7 → ep8：保存/消费条件满足</title></polyline><polyline class="arr" fill="none" points="176,1290 110,1290 110,1732 170,1732" marker-end="url(#arrow-EV-production)"><title>ep7 → ep9：校验/保存失败</title></polyline><text class="ts" x="365" y="256" text-anchor="start" dominant-baseline="central">E1 · 信号变化</text><text class="ts" x="365" y="446" text-anchor="start" dominant-baseline="central">E2 · 合法数据</text><text class="ts" x="365" y="636" text-anchor="start" dominant-baseline="central">E3 · 规则满足</text><text class="ts" x="168" y="522" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="168" y="1720" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="365" y="826" text-anchor="start" dominant-baseline="central">E5 · 定义已配置</text><text class="ts" x="365" y="1016" text-anchor="start" dominant-baseline="central">E6 · 模板所需数据齐备</text><text class="ts" x="365" y="1206" text-anchor="start" dominant-baseline="central">E7 · 上报事实</text><text class="ts" x="365" y="1434" text-anchor="start" dominant-baseline="central">E8 · 保存/消费条件满足</text><text class="ts" x="168" y="1282" text-anchor="end" dominant-baseline="central">E9</text><text class="ts" x="168" y="1744" text-anchor="end" dominant-baseline="central">E9</text><g class="c-gray" role="link" tabindex="0" data-page="EV" data-flow="EV-production" data-step="ep1" aria-label="车端产生状态变化"><title>例如主驾车窗 10% → 50%；保留原始时间和对象</title><rect x="180" y="106" width="340" height="110" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">车端产生状态变化</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">例如主驾车窗 10% → 50%</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central">保留原始时间和对象</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-production" data-step="ep2" aria-label="按渠道协议上报"><title>字段、单位、枚举必须匹配；当前状态服务维护可信快照</title><rect x="180" y="296" width="340" height="110" rx="6"/><text class="th" x="198" y="320" text-anchor="start" dominant-baseline="central">按渠道协议上报</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">字段、单位、枚举必须匹配</text><text class="ts" x="198" y="367" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central">当前状态服务维护可信快照</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-production" data-step="ep3" aria-label="Trigger 匹配规则"><title>预置规则使用“有变更”等条件；不是任意信号都唤醒模型</title><rect x="180" y="486" width="340" height="110" rx="6"/><text class="th" x="198" y="510" text-anchor="start" dominant-baseline="central">Trigger 匹配规则</text><text class="ts" x="198" y="538" text-anchor="start" dominant-baseline="central">预置规则使用“有变更”等条件</text><text class="ts" x="198" y="557" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="576" text-anchor="start" dominant-baseline="central">不是任意信号都唤醒模型</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-production" data-step="ep4" aria-label="读取事件定义"><title>选定资源定义 ID、模板和范围；生产方与渠道必须一致</title><rect x="180" y="676" width="340" height="110" rx="6"/><text class="th" x="198" y="700" text-anchor="start" dominant-baseline="central">读取事件定义</text><text class="ts" x="198" y="728" text-anchor="start" dominant-baseline="central">选定资源定义 ID、模板和范围</text><text class="ts" x="198" y="747" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="766" text-anchor="start" dominant-baseline="central">生产方与渠道必须一致</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-production" data-step="ep5" aria-label="组装结构化变化"><title>带位置、旧值、新值等；触发时间为匹配成功时刻</title><rect x="180" y="866" width="340" height="110" rx="6"/><text class="th" x="198" y="890" text-anchor="start" dominant-baseline="central">组装结构化变化</text><text class="ts" x="198" y="918" text-anchor="start" dominant-baseline="central">带位置、旧值、新值等</text><text class="ts" x="198" y="937" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="956" text-anchor="start" dominant-baseline="central">触发时间为匹配成功时刻</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-production" data-step="ep6" aria-label="生成事实描述"><title>按模板表达发生的变化；不推测意图或执行成功</title><rect x="180" y="1056" width="340" height="110" rx="6"/><text class="th" x="198" y="1080" text-anchor="start" dominant-baseline="central">生成事实描述</text><text class="ts" x="198" y="1108" text-anchor="start" dominant-baseline="central">按模板表达发生的变化</text><text class="ts" x="198" y="1127" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1146" text-anchor="start" dominant-baseline="central">不推测意图或执行成功</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-production" data-step="ep7" aria-label="事件服务校验保存"><title>方案明确校验资源字段格式；记录事件时间和在场人来源；身份授权校验执行方及现状待核</title><rect x="180" y="1246" width="340" height="148" rx="6"/><text class="th" x="198" y="1270" text-anchor="start" dominant-baseline="central">事件服务校验保存</text><text class="ts" x="198" y="1298" text-anchor="start" dominant-baseline="central">方案明确校验资源字段格式</text><text class="ts" x="198" y="1317" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1336" text-anchor="start" dominant-baseline="central">记录事件时间和在场人来源</text><text class="ts" x="198" y="1355" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1374" text-anchor="start" dominant-baseline="central">身份授权校验执行方及现状待核</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-production" data-step="ep8" aria-label="进入已配置消费者"><title>按查询/白名单/订阅分发；各消费者再判断是否使用</title><rect x="180" y="1474" width="340" height="110" rx="6"/><text class="th" x="198" y="1498" text-anchor="start" dominant-baseline="central">进入已配置消费者</text><text class="ts" x="198" y="1526" text-anchor="start" dominant-baseline="central">按查询/白名单/订阅分发</text><text class="ts" x="198" y="1545" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1564" text-anchor="start" dominant-baseline="central">各消费者再判断是否使用</text></g><g class="c-gray" role="link" tabindex="0" data-page="EV" data-flow="EV-production" data-step="ep9" aria-label="不生成或记录失败原因"><title>未满足、定义不支持或字段错误；保留诊断，不伪造业务事实</title><rect x="180" y="1664" width="340" height="112" rx="6"/><text class="th" x="198" y="1688" text-anchor="start" dominant-baseline="central">不生成或记录失败原因</text><text class="ts" x="198" y="1716" text-anchor="start" dominant-baseline="central">未满足、定义不支持或字段错误</text><text class="ts" x="198" y="1735" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1754" text-anchor="start" dominant-baseline="central">保留诊断，不伪造业务事实</text></g><text class="th" x="40" y="1860" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1890" text-anchor="start" dominant-baseline="central">E1 车端产生状态变化 → 按渠道协议上报：信号变化</text><text class="ts" x="40" y="1923" text-anchor="start" dominant-baseline="central">E2 按渠道协议上报 → Trigger 匹配规则：合法数据</text><text class="ts" x="40" y="1956" text-anchor="start" dominant-baseline="central">E3 Trigger 匹配规则 → 读取事件定义：规则满足</text><text class="ts" x="40" y="1989" text-anchor="start" dominant-baseline="central">E4 Trigger 匹配规则 → 不生成或记录失败原因：未满足/不支持</text><text class="ts" x="40" y="2022" text-anchor="start" dominant-baseline="central">E5 读取事件定义 → 组装结构化变化：定义已配置</text><text class="ts" x="40" y="2055" text-anchor="start" dominant-baseline="central">E6 组装结构化变化 → 生成事实描述：模板所需数据齐备</text><text class="ts" x="40" y="2088" text-anchor="start" dominant-baseline="central">E7 生成事实描述 → 事件服务校验保存：上报事实</text><text class="ts" x="40" y="2121" text-anchor="start" dominant-baseline="central">E8 事件服务校验保存 → 进入已配置消费者：保存/消费条件满足</text><text class="ts" x="40" y="2154" text-anchor="start" dominant-baseline="central">E9 事件服务校验保存 → 不生成或记录失败原因：校验/保存失败</text></svg>