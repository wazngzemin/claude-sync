<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="845" viewBox="0 0 1200 845" role="img" aria-label="车控问题从上往下查：七个关口"><title>车控问题从上往下查：七个关口</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="845" fill="#ffffff" data-decoration="background"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">车控问题从上往下查：七个关口</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">车控排查的顺序；从第 1 关往下，不从车上的报错倒推</text><text x="40" y="104" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">关口</text><text x="410" y="104" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">看什么证据</text><text x="870" y="104" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">有问题找谁</text><rect x="30" y="120" width="340" height="60" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><circle cx="50" cy="142" r="12" fill="#4a9670"/><text x="50" y="147" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="70" y="147" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">拒识、打断</text><rect x="400" y="120" width="440" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true"/><text x="414" y="147" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">这句被判为不该接？被后来的话抢占？</text><rect x="870" y="120" width="300" height="60" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true"/><text x="884" y="147" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">拒识同学；被抢占一般符合预期</text><path d="M370,150 L400,150" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M840,150 L870,150" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M200,180 L200,200" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="200" width="340" height="60" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><circle cx="50" cy="222" r="12" fill="#4a9670"/><text x="50" y="227" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="70" y="227" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">这句话的意思</text><rect x="400" y="200" width="440" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true"/><text x="414" y="227" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">识别出来的文字对不对</text><rect x="870" y="200" width="300" height="60" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true"/><text x="884" y="227" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">语音研发；Planner 负责人</text><path d="M370,230 L400,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M840,230 L870,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M200,260 L200,280" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="280" width="340" height="60" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><circle cx="50" cy="302" r="12" fill="#4a9670"/><text x="50" y="307" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="70" y="307" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">Planner</text><rect x="400" y="280" width="440" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true"/><text x="414" y="307" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">有没有调工具，写的那句指令对不对</text><rect x="870" y="280" width="300" height="60" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true"/><text x="884" y="307" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">Planner 算法同学</text><path d="M370,310 L400,310" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M840,310 L870,310" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M200,340 L200,360" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="360" width="340" height="60" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><circle cx="50" cy="382" r="12" fill="#4a9670"/><text x="50" y="387" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="70" y="387" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">翻成函数</text><rect x="400" y="360" width="440" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true"/><text x="414" y="387" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">函数和参数是否与指令对得上</text><rect x="870" y="360" width="300" height="60" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true"/><text x="884" y="387" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">车控算法（负责翻成函数）</text><path d="M370,390 L400,390" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M840,390 L870,390" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M200,420 L200,440" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="440" width="340" height="60" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><circle cx="50" cy="462" r="12" fill="#4a9670"/><text x="50" y="467" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="70" y="467" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">云端下发</text><rect x="400" y="440" width="440" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true"/><text x="414" y="467" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">是否推给了这辆车，结果码是什么</text><rect x="870" y="440" width="300" height="60" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true"/><text x="884" y="467" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">服务端研发</text><path d="M370,470 L400,470" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M840,470 L870,470" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M200,500 L200,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="520" width="340" height="60" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><circle cx="50" cy="542" r="12" fill="#4f7ea9"/><text x="50" y="547" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="70" y="547" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上回话</text><rect x="400" y="520" width="440" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true"/><text x="414" y="547" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">10 秒内有没有收到车上回执</text><rect x="870" y="520" width="300" height="60" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true"/><text x="884" y="547" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">车端研发</text><path d="M370,550 L400,550" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M840,550 L870,550" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M200,580 L200,600" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="600" width="340" height="60" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><circle cx="50" cy="622" r="12" fill="#4f7ea9"/><text x="50" y="627" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="70" y="627" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上执行</text><rect x="400" y="600" width="440" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true"/><text x="414" y="627" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">回执成功，但车没动</text><rect x="870" y="600" width="300" height="60" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true"/><text x="884" y="627" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">车端研发、车辆服务、硬件</text><path d="M370,630 L400,630" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M840,630 L870,630" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="700" width="1140" height="76" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true"/><text x="44" y="727" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">常见误判</text><text x="44" y="752" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">看到“已推送”不等于车收到并执行；最终看推给这辆车的结果码和车上回执</text></g><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" data-legend="true"><rect x="32" y="810.0" width="16" height="16" rx="4" fill="#eaf6ef" stroke="#4a9670" data-decoration="legend"/><text x="57" y="823.0" fill="#5d7183" font-size="14">绿：云端关口</text><rect x="307" y="810.0" width="16" height="16" rx="4" fill="#eaf2fb" stroke="#4f7ea9" data-decoration="legend"/><text x="332" y="823.0" fill="#5d7183" font-size="14">蓝：车上关口</text><rect x="582" y="810.0" width="16" height="16" rx="4" fill="#fffbe8" stroke="#cdb35a" data-decoration="legend"/><text x="607" y="823.0" fill="#5d7183" font-size="14">黄：处理负责人</text><rect x="857" y="810.0" width="16" height="16" rx="4" fill="#fdeeee" stroke="#c45c5c" data-decoration="legend"/><text x="882" y="823.0" fill="#5d7183" font-size="14">红：常见误判</text></g></svg>