<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1604" viewBox="0 0 1660 1604">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1604" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">记忆同步完成后问候</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">明确事件直接进入规则；DT 查询真实记忆并组织问候</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户选择记忆授权并同步</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">未授权时不启动这项记忆问候</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">开箱 FaceID 注册可以跳过</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">是否收到真实的同步完成事件？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">激活、授权或开始同步不能替代完成</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">事件需关联账号与本次同步</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">未完成／失败</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不提前个性化问候</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">等待准确结果</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">完成</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器核对事件与组合条件</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">当前账号、本次有效同步、次数及交互时机</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">无需经过语义匹配模型</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">重复／过期／未知</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">退出本次问候</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不影响新账号</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">成立</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器向 DT 下发配置好的建议</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">请检索可用记忆，选一到两个点问候</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不要求触发器承载记忆正文</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="997" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 开始对应推理并回传</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">触发器关联本条建议计次</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">DT 继续调用既有记忆检索工具</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1200" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">工具是否返回可用真实记忆？</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">DT 根据真实反馈选择内容</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">同步完成不保证本次检索一定有结果</text><line x1="1020" y1="1268.0" x2="1186" y2="1268.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1255.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="1200" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1240" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">空结果／失败</text><text x="1218" y="1278" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不编造记忆内容</text><text x="1218" y="1309" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">按既有开箱流程继续</text><line x1="560.0" y1="1338" x2="560.0" y2="1399" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1376.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">有结果</text><rect x="100" y="1403" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1443" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 组织简短问候，端侧播放</text><text x="128" y="1481" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">仅选一到两个适合提及的真实信息</text><text x="128" y="1512" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">另记检索与播放结果，不重复计次</text>
</svg>