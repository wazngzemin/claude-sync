<svg xmlns="http://www.w3.org/2000/svg" width="1505" height="2360" viewBox="0 0 1505 2360" role="img" aria-label="端侧触发与本地闭环"><title>端侧触发与本地闭环</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M630,226 L630,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="533" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="538" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="538" dy="0">允许运行</tspan></text><path d="M630,644 L630,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="533" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="538" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="538" dy="0">下发指令</tspan></text><path d="M630,1062 L630,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="533" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="538" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="538" dy="0">指令接收成功</tspan></text><path d="M695,1480 L695,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="598" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="603" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="603" dy="0">控制通道</tspan></text><path d="M565,1480 L565,1518 L235,1518 L235,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">数据通道</tspan></text><path d="M630,1898 L630,1936 L395,1936 L395,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="u