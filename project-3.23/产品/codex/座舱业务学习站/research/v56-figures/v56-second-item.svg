<svg xmlns="http://www.w3.org/2000/svg" id="v56-second-item" class="flow-figure v56-diagram" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="v56-second-item-title v56-second-item-desc">
<title id="v56-second-item-title">插进一次座椅控制，“第二个”仍要接回原列表</title>
<desc id="v56-second-item-desc">沿时间线看四次交接；最后依据用户原来看到的顺序取第二家。</desc>
<style>
.v56-diagram{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff);color:var(--body,#33495b)}
.v56-diagram text{font-size:14px;font-weight:400;fill:var(--body,#33495b)}
.v56-diagram .figure-header .title{font-size:24px;font-weight:650;fill:var(--ink,#16344a)}
.v56-diagram .figure-header .subtitle,.v56-diagram .figure-caption text,.v56-diagram .note{fill:var(--muted,#5d7183)}
.v56-diagram .node-title{font-size:16px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .section-label{font-size:15px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .box{stroke-width:1.6}
.v56-diagram .neutral .box{fill:var(--v56-bg,#fff);stroke:var(--quiet,#9fb2c2)}
.v56-diagram .info .box,.v56-diagram .info .swatch{fill:var(--blue-soft,#eaf2fb);stroke:var(--blue,#4f7ea9)}
.v56-diagram .action .box,.v56-diagram .action .swatch{fill:var(--teal-soft,#eaf6ef);stroke:var(--teal,#4a9670)}
.v56-diagram .warning .box,.v56-diagram .warning .swatch{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-diagram .error .box,.v56-diagram .error .swatch{fill:var(--red-soft,#fdeeee);stroke:var(--red,#c45c5c)}
.v56-diagram .info .node-title{fill:var(--blue,#1f4565)}
.v56-diagram .action .node-title{fill:var(--teal,#1d4b35)}
.v56-diagram .warning .node-title{fill:var(--amber,#865b1a)}
.v56-diagram .error .node-title{fill:var(--red,#6e2222)}
.v56-diagram .pending .box{stroke-dasharray:6 5}
.v56-diagram .arr{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.v56-diagram .arr-error{stroke:var(--red,#c45c5c)}
.v56-diagram .arrow-head{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8}
.v56-diagram .arrow-head-error{stroke:var(--red,#c45c5c)}
.v56-diagram .rule{stroke:var(--line,#dce4eb);stroke-width:1;fill:none}
@media(prefers-color-scheme:dark){svg.v56-diagram{--v56-bg:#17212d;--ink:#e4edf6;--body:#d0dde9;--muted:#b4c4d3;--quiet:#8a9ead;--line:#3b5062;--blue:#a4caff;--blue-soft:#213c59;--teal:#99dbc5;--teal-soft:#203f3b;--amber:#f1cf91;--amber-soft:#443822;--red:#f2b0b7;--red-soft:#4b2e36}}
</style>
<defs><marker id="v56-second-item-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head" d="M1 1L9 5L1 9"/></marker><marker id="v56-second-item-arr-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head arrow-head-error" d="M1 1L9 5L1 9"/></marker></defs>
<g class="figure-header"><text class="title" x="32" y="44">插进一次座椅控制，“第二个”仍要接回原列表</text><text class="subtitle" x="32" y="72">沿时间线看四次交接；最后依据用户原来看到的顺序取第二家。</text></g>
<path class="arr" d="M370,230 L370,274" fill="none" marker-end="url(#v56-second-item-arr)"/>
<path class="arr" d="M370,380 L370,424" fill="none" marker-end="url(#v56-second-item-arr)"/>
<path class="arr" d="M370,510 L370,574" fill="none" marker-end="url(#v56-second-item-arr)"/>
<path class="arr arr-error" d="M670,470 L814,470" fill="none" marker-end="url(#v56-second-item-arr-error)"/>
<g class="info" data-node="list"><rect class="box" x="70" y="130" width="600" height="100" rx="8"/><text class="node-title" x="84" y="157" text-anchor="start">豆包展示餐厅列表</text><text class="node-subtitle" x="84" y="182" text-anchor="start">餐厅 1、2、3</text><text class="node-subtitle" x="84" y="205" text-anchor="start">号码表示展示顺序</text></g>
<g class="action" data-node="seat"><rect class="box" x="70" y="280" width="600" height="100" rx="8"/><text class="node-title" x="84" y="307" text-anchor="start">主驾插话</text><text class="node-subtitle" x="84" y="332" text-anchor="start">帮我把副驾座椅加热打开</text><text class="node-subtitle" x="84" y="355" text-anchor="start">车上执行，结果回写</text></g>
<g class="info" data-node="second"><rect class="box" x="70" y="430" width="600" height="80" rx="8"/><text class="node-title" x="84" y="457" text-anchor="start">主驾说“第二个”</text><text class="node-subtitle" x="84" y="482" text-anchor="start">接回先前餐厅候选</text></g>
<g class="action" data-node="retrieve"><rect class="box" x="70" y="580" width="600" height="90" rx="8"/><text class="node-title" x="84" y="607" text-anchor="start">从历史取回原列表</text><text class="node-subtitle" x="84" y="632" text-anchor="start">取原第 2 家，交给导航</text></g>
<g class="error" data-node="wrong"><rect class="box" x="820" y="430" width="348" height="100" rx="8"/><text class="node-title" x="834" y="457" text-anchor="start">只留下最近一轮</text><text class="node-subtitle" x="834" y="482" text-anchor="start">误解成“加热第二档”</text></g>
<text class="note" x="32" y="711" text-anchor="start">不重新搜索替换原列表；若不能确定承接哪组候选，就先问清对象。</text>
<g class="figure-caption"><path class="rule" d="M32,736 L1168,736"/>
<g class="info"><circle class="swatch" cx="39" cy="757" r="7"/></g>
<text class="node-subtitle" x="62" y="762" text-anchor="start">原话与原候选</text>
<g class="action"><circle class="swatch" cx="214" cy="757" r="7"/></g>
<text class="node-subtitle" x="237" y="762" text-anchor="start">执行与后续交办</text>
<g class="error"><circle class="swatch" cx="389" cy="757" r="7"/></g>
<text class="node-subtitle" x="412" y="762" text-anchor="start">错误指代</text>
</g>
</svg>
