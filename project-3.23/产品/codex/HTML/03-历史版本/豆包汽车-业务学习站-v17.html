1510px;width:100%;margin:auto}header{max-width:1000px;margin-bottom:36px}.eyebrow{color:#708695;font-size:13px;letter-spacing:.05em}.scope{font-size:14px;color:#6a7a86;border-left:3px solid #c9d9e3;padding-left:16px;line-height:1.8}.in-page{display:flex;gap:24px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;margin-bottom:32px}section{margin:0 0 64px;scroll-margin-top:94px}.step{max-width:1000px;margin:0 0 38px;padding:30px 0 10px;border-top:1px solid var(--line);scroll-margin-top:94px}.step-heading{display:flex;gap:18px;align-items:baseline}.step-heading>span{font:13px ui-monospace,monospace;color:#7e95a3;min-width:42px}.actor{color:#326785;font-size:14px;margin:0 0 22px}.output{font-size:16px;padding-left:16px;border-left:3px solid #a9c6d5;margin:24px 0 18px}.handoffs{font-size:14px;color:#607887}.handoffs p{margin-bottom:7px}.next{font-size:14px;color:#607887}.branch{padding:24px 0;border-top:1px solid var(--line);max-width:1000px}.connections{padding-top:24px;border-top:1px solid var(--line)}.connections p{font-size:15px}.sources{font-size:14px;border-top:1px solid var(--line);padding:24px 0;max-width:1000px}.sources summary{cursor:pointer;color:#607887}.sources li{margin:12px 0;line-height:1.7}figure{border:1px solid var(--line);border-radius:8px;margin:0 0 32px;overflow:hidden}figcaption{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;font-size:16px}figcaption div{display:flex;gap:6px;flex-wrap:wrap}figcaption button{font-size:12px}.canvas{overflow-x:auto;padding:20px;background:#fff}.canvas svg{display:block;max-width:none;height:auto}.home-step{border-top:1px solid var(--line);padding:28px 0;max-width:1000px}.directory{padding:24px 0;border-top:1px solid var(--line)}.directory span{color:#728491;font-size:14px}.tool{padding:24px 0;border-top:1px solid var(--line)}.tool p{font-size:14px;color:#6a7c88;margin-top:12px}.tool h3{font-size:19px}.search-result{padding:26px 0;border-top:1px solid var(--line)}.search-result h2{font-size:21px}.search-result p{font-size:16px}dialog{padding:0;max-width:96vw;width:96vw;height:94dvh;border:1px solid var(--line);border-radius:10px}dialog::backdrop{background:#17304799}.dialog-tools{display:flex;gap:8px;padding:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}dialog .canvas{height:calc(100% - 70px);overflow:auto}#close{margin-left:auto}#menu{display:none}@media(max-width:900px){.layout{grid-template-columns:215px minmax(0,1fr)}main{padding:30px 24px}aside{padding:14px 10px}aside a{font-size:13px}h1{font-size:28px}}@media(max-width:680px){#menu{display:block}.top{gap:12px;padding:10px 14px}.brand{font-size:14px}.top input{width:32vw;font-size:13px}.top form button{display:none}.layout{display:block}aside{display:none;position:fixed;left:0;width:260px;background:white;z-index:4;box-shadow:10px 0 30px #1d3b5020}aside.open{display:block}main{padding:26px 20px;font-size:16px}h2{font-size:22px}h3{font-size:19px}.step-heading{gap:10px}.canvas{padding:10px}.in-page{gap:18px}.scope{font-size:13px}}@media print{.top,aside,.in-page,figcaption button{display:none}.layout{display:block}main{padding:0}.canvas{overflow:visible}.canvas svg{width:100%!important}.step{break-inside:avoid}}
</style></head><body><div class="top"><button id="menu" aria-label="打开目录">☰</button><a class="brand" href="#home">豆包汽车 · 业务链路</a><form id="search"><input id="query" aria-label="搜索步骤和工具" placeholder="搜索步骤或工具"><button>搜索</button></form></div><div class="layout"><aside id="sidebar"><nav id="nav"></nav></aside><main id="content"></main></div><dialog id="dialog"><div class="dialog-tools"><button data-zoom="out">−</button><button data-zoom="in">＋</button><button data-zoom="fit">适合宽度</button><button data-zoom="actual">原始尺寸</button><button id="close">关闭</button></div><div class="canvas"></div></dialog><script>const DATA={"version":"v17","pages":[{"id":"V","scope":"车内语音 PRD 的基础输入链路；预请求分支按多级 VAD 产品与服务端方案说明。不同车型的收音、判停参数和接入版本不作统一。","intro":"用户说“去昨天那家游泳馆”时，系统先要得到一份可用的、属于这次说话的文字。这里连续发生三件事：把人声收清楚、把字认出来、确认这句话何时提交。识别到“去昨天”还不足以让导航开始，提前计算也只允许到指定的前置处理。","sourceIds":["VOICE-VOICEPRD","VOICE-VAD","VOICE-PREQUERY"],"steps":[{"id":"V01","actor":"车端语音入口","title":"检查语音是否可用","detail":"每次语音初始化先检查麦克风权限。权限未授予时，交互区提示“未获取麦克风权限”，提供前往系统设置的入口；车型定义的通话、CarPlay 等禁止交互场景另按项目策略拦截。此时还没有可供推理的用户请求。","output":"可收音，或明确的不可用提示","next":"允许收音时进入音频处理；不允许则结束本次入口","sourceIds":["VOICE-VOICEPRD","VOICE-VAD","VOICE-PREQUERY"]},{"id":"V02","actor":"车端声学模块","title":"把人声从车内声音中分离","detail":"麦克风采集包含人声、路噪和扬声器声音。降噪降低环境干扰，回声消除利用扬声器参考音频抵消音乐、导航和豆包自身播报。音区定位同时标出说话位置，使后续知道是谁从哪一座说话。","output":"处理后的音频与说话音区","next":"交给唤醒/交互入口和语音识别","sourceIds":["VOICE-VOICEPRD","VOICE-VAD","VOICE-PREQUERY"]},{"id":"V03","actor":"车端交互入口","title":"接受唤醒或项目允许的免唤醒输入","detail":"普通唤醒模式响应“豆包豆包”；免唤醒是否开放、何时拒识，由当前车型的交互配置决定。音区关闭时不把该音区声音当作正常请求。说话音区用于归属输入，用户在话里指定的目标座位仍由后面的语义理解确定。","output":"属于当前交互的一段音频","next":"送入离线/在线 ASR","sourceIds":["VOICE-VOICEPRD","VOICE-VAD","VOICE-PREQUERY"]},{"id":"V04","actor":"ASR 语音识别","title":"边听边返回过程文字","detail":"ASR 把音频转成文字。过程文字会随更多音频到来而修正，例如先得到“去昨天”，再补成“去昨天那家游泳馆”。离线业务使用离线识别，在线业务使用在线识别；上屏可以先显示离线过程文字，再用在线最终结果刷新。","output":"过程文字及随后产生的最终识别结果","next":"过程文字交判停分支；最终采用的文字进入正式请求","sourceIds":["VOICE-VOICEPRD","VOICE-VAD","VOICE-PREQUERY"]},{"id":"V05","actor":"端侧判停","title":"短暂停顿后尝试预请求","detail":"Soft VAD 是较短停顿后的初步判停。语义完整时，可把当前文字作为预请求；预请求带相同 request_id 和递增 round_id，用来关联这次说话的多次候选。它不直接调用车控，也不直接让 Planner 执行动作。","output":"预请求 Query","next":"交云端无状态前置计算；同时继续等待最终确认","sourceIds":["VOICE-VOICEPRD","VOICE-VAD","VOICE-PREQUERY"]},{"id":"V06","actor":"AIDV 预请求接口","title":"提前计算拒识、意图与简单复杂判断","detail":"推荐的文本链路方案让端侧通过独立 HTTP 接口提交预请求，不经过正式豆包文本对话。云端缓存拒识、意图和简单复杂判断结果。缓存只为正式请求节省等待，不能作为“用户已经说完”的证明，也不写入正式对话历史。","output":"可复用的前置结果","next":"等待正式请求核对","sourceIds":["VOICE-VOICEPRD","VOICE-VAD","VOICE-PREQUERY"]},{"id":"V07","actor":"端侧判停与 ASR","title":"确认句尾，取得正式文字","detail":"Hard VAD 对短停顿作进一步确认；语义仍不完整时，按语义判停策略继续收音。最后提交正式文字。初版 PRD 的时间值为暂定值，后续还有预请求文本匹配改版，因此此图表达判断关系，不给所有车型规定同一毫秒数。","output":"正式 Query、request_id、round_id、音区","next":"交正式请求入口与预请求结果核对","sourceIds":["VOICE-VOICEPRD","VOICE-VAD","VOICE-PREQUERY"]},{"id":"V08","actor":"云端入口","title":"核对预请求结果能否复用","detail":"正式文字与预请求候选满足当前版本的匹配规则时，复用前置计算；不匹配则按正式文字重新判断。请求身份把这些结果限制在同一次说话内，避免把前一句的判断用到后一句。","output":"正式输入及已完成的前置判断","next":"进入 R 端云采信与路由","sourceIds":["VOICE-VOICEPRD","VOICE-VAD","VOICE-PREQUERY"]}],"edges":[{"to":"V02","label":"权限及场景允许","from":"V01"},{"to":"V03","label":"处理后的音频与音区","from":"V02"},{"to":"V04","label":"进入交互","from":"V03"},{"to":"V05","label":"短停顿候选","from":"V04"},{"to":"V06","label":"语义完整：预请求","from":"V05"},{"to":"V07","label":"继续识别并等待正式判停","from":"V04"},{"to":"V07","label":"语义未完整：继续收音","from":"V05"},{"to":"V08","label":"缓存前置结果","from":"V06"},{"to":"V08","label":"正式文字到达","from":"V07"}],"branches":[{"condition":"麦克风未授权或当前场景禁用","result":"在入口提示不可用，不生成正常 Query。"},{"condition":"正式文字与预请求候选不匹配","result":"以正式文字重算前置判断；预请求结果不取得执行权。"}],"title":"语音输入与判停","category":"用户请求与执行闭环"},{"id":"R","scope":"端云采信按离在线仲裁 PRD 和 Director PRD 中的规则解释；白名单内容、超时与强制 Planner 开关均随车型和版本配置。","intro":"同一句话可以同时在端侧和云端处理，但最后只能按采信规则采用结果。此处先回答“由哪条链路负责这句话”，再把需要复杂推理的输入交给 Planner。离线 ASR 先上屏不等于离线动作已经获准执行。","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"],"steps":[{"id":"R01","actor":"请求入口","title":"读取正式文字与网络状态","detail":"入口接收语音模块确认的正式文字，同时携带请求身份、音区等信息。无网时直接使用离线链路；有网时允许端云并行理解。网络状态决定可用通道，白名单和云端拒识再决定是否采用具体结果。","output":"正式文字及可用通道","next":"无网走离线兜底；有网进入并行处理","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]},{"id":"R02","actor":"端侧 FC 模型","title":"解析本地可处理的指令","detail":"端侧功能调用模型把文字转成意图和参数，例如媒体暂停、退出语音或已接入的基础控制。解析有结果只是候选，随后还要检查是否命中本车型的端侧白名单。","output":"端侧候选意图与参数","next":"交端侧白名单判断","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]},{"id":"R03","actor":"云端前置链路","title":"判断是否应响应及是否走快路径","detail":"云端对正式输入作拒识、意图与简单复杂处理。拒识是判断这句话是否应该交给豆包处理；规则和简单意图命中时可从快路径完成，无需每句话都经过完整 Planner。OEM 强制走 Planner 的配置另有放行入口。","output":"云端拒识/快路径/Planner 路由结果","next":"拒识结束响应；快路径执行；复杂需求进入 Planner","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]},{"id":"R04","actor":"端侧仲裁","title":"白名单命中时优先采用本地结果","detail":"命中端侧白名单的明确指令优先快速执行。本地模型对“我有点冷”这类感受输出 feel 意图时，需要等待云端结合车况处理。同一句感受在不同车温下可能需要不同动作，因此这条分支不直接套用固定车控指令。","output":"本地执行权，或继续等待云端","next":"获准执行交车端；否则等云端结果","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]},{"id":"R05","actor":"端云协调","title":"非白名单优先等待云端","detail":"未命中白名单时，云端为优先结果。云端正常返回就采用云端；链路异常或业务超时时才进入离线兜底。不同意图和 Agent 可有不同超时，不能把某一心跳阈值当作全部工具统一超时。","output":"采纳云端，或触发本地兜底","next":"云端放行交 M；本地兜底交 R06","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]},{"id":"R06","actor":"端侧兜底","title":"采用可用离线结果或说明能力限制","detail":"无网，或云端未能在规则内给出结果时，端侧有可用结果则处理支持的本地能力；端侧也无法理解时给出离线/超时提示。此分支结束的是本次请求的云端等待，不代表云端任何晚到内容仍可继续执行。","output":"离线执行结果或无法完成说明","next":"进入端侧结果反馈与用户输出","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]},{"id":"R07","actor":"Flow 与 Planner","title":"只放行本轮需要的推理","detail":"Planner 可在编排中预启动，但会等待继续信号。快路径已处理或拒识命中时取消预启动；确认需要 Planner 时才放行。预启动描述的是准备时机，并不是它已下发动作。","output":"本轮有效输入进入 Planner 管道","next":"交 M 输入管理，再汇合 C 上下文","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]},{"id":"R08","actor":"端侧执行与反馈","title":"完成获准采用的本地指令","detail":"端侧白名单命中的结果取得本地执行权后，交给已接入的车端能力执行并反馈。本分支到本地结果结束，不再为了凑齐总图而经过云端 Planner；具体动作是否成功仍看执行反馈。","output":"本地执行结果与用户反馈","next":"O 输出；本次快路径结束","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]},{"id":"R09","actor":"云端快路径 / 对应执行方","title":"完成获准采用的云端快路径","detail":"云端规则或简单意图已处理、且该结果获得采信时，由对应执行链完成并反馈。此时取消本轮预启动的 Planner，不重复发出同一动作。","output":"快路径执行结果","next":"O 输出；本次快路径结束","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]},{"id":"R10","actor":"拒识与交互入口","title":"结束本次无效输入","detail":"云端认定本次输入不应交给豆包处理时，不放行 Planner，也不将这段文字变成工具调用。若它此前打断了播报，客户端按 I 模块的 AIVA 交互策略收尾。","output":"拒识结果与交互状态","next":"I 收尾或继续聆听","sourceIds":["VOICE-ARBITRATION","DT-PRD","PLANNER-ONEPAGE"]}],"edges":[{"to":"R02","label":"有网：端侧处理","from":"R01"},{"to":"R03","label":"有网：云端并行处理","from":"R01"},{"to":"R06","label":"无网","from":"R01"},{"to":"R04","label":"端侧候选结果","from":"R02"},{"to":"R05","label":"未命中白名单 / feel","from":"R04"},{"to":"R05","label":"非拒识云端结果进入采信","from":"R03"},{"to":"R06","label":"云端异常或超时","from":"R05"},{"to":"R07","label":"云端判定需要 Planner","from":"R05"},{"from":"R04","to":"R08","label":"命中白名单并采用本地结果"},{"from":"R05","to":"R09","label":"采用云端规则 / 简单意图结果"},{"from":"R03","to":"R10","label":"云端拒识"}],"branches":[{"condition":"端侧命中白名单","result":"直接进入本地执行与反馈，不再画成仍要串行经过 Planner。"},{"condition":"云端拒识","result":"不把这段声音继续当作有效业务指令。"},{"condition":"云端规则快路径命中","result":"由对应快路径完成；Planner 预启动被取消。"}],"title":"入口与端云采信","category":"用户请求与执行闭环"},{"id":"M","scope":"输入调度按输入管理 PRD v0.5（2026-10-13）组织；本图的打断后交互统一采用 I 模块 AIVA 口径。原方案中的拒识 event 恢复属于另一份恢复合同，不作为全车型默认。","intro":"用户的新话、工具刚返回的结果、Advisor 的建议，都可能在豆包正在回答时到来。输入管理先决定现在处理谁，哪些内容合在一轮，哪些等播报结束。它不替 Planner 理解需求，而是防止两轮推理与两段播报互相抢占。","sourceIds":["INPUT-PRD","DT-PRD","VOICE-AIVA"],"steps":[{"id":"M01","actor":"各输入来源","title":"提交有效输入","detail":"用户输入携带 query、说话人、音区与时间；Advisor 提交建议；工具提交自己的执行反馈；事件提交已发生的事实。输入管理接收这些有效消息，不能把所有消息都冒充用户刚说的一句话。","output":"带来源的输入","next":"读取当前推理和播报状态","sourceIds":["INPUT-PRD","DT-PRD"]},{"id":"M02","actor":"输入管理","title":"检查推理、完整输出和起播状态","detail":"三个检查一起决定处理方式：Director 是否正在推理、输出是否已经完整、TTS 是否已经开始。完整输出可能意味着工具已经下发，而只出现首字并不等于动作已经下发。","output":"本轮所处阶段","next":"分别进入空闲、可合并、播报中分支","sourceIds":["INPUT-PRD","DT-PRD"]},{"id":"M03","actor":"输入管理","title":"空闲时直接开始下一轮","detail":"Director 没在推理且没有播报时，不必为新输入额外等待。把这一批有效内容送入下一轮，随后与 Context 提供的背景一起交给 Director。","output":"可处理的输入批次","next":"交 M08","sourceIds":["INPUT-PRD","DT-PRD"]},{"id":"M04","actor":"输入管理","title":"尚未完整输出且未起播：合并重算","detail":"新输入到来时，如果上一轮未输出完整且没有起播，打断尚在进行的推理，将新旧输入合并处理。此时旧轮还没有调用工具，可以重新考虑整个需求，而不需要假装前一个计划已经完成。","output":"新旧输入合并后的内容","next":"交 M08","sourceIds":["INPUT-PRD","DT-PRD"]},{"id":"M05","actor":"输入管理","title":"用户新话到来：打断并保留已发生事实","detail":"当播报已开始，或模型已完整输出时，用户新话具有打断优先级。把被打断的内容和当前排队内容一起整理；如果动作已经下发，明确告诉下一轮这件事已经发生，不能因为停止说话就把执行记录抹掉。","output":"用户新话、被打断信息、已下发状态","next":"交 M08","sourceIds":["INPUT-PRD","DT-PRD"]},{"id":"M06","actor":"输入管理","title":"其他输入在当前轮后排队","detail":"当前轮已起播或已完成输出时，普通建议和工具反馈等其他输入等待本轮推理及播报结束。下一次处理窗口到来，再把可以合并的排队输入一起送入。这样工具完成消息不会随意截断正在面向用户说的话。","output":"等待中的有效消息","next":"当前轮结束后交 M08","sourceIds":["INPUT-PRD","DT-PRD"]},{"id":"M07","actor":"前序打断处理","title":"把有效插话与已播信息一起交回","detail":"新说话最终有效时，被打断内容可通过 last_talk_content 随新 query 传入，让下一轮知道刚才哪些内容已说、哪些没说。若新说话最终拒识，本图按 AIVA 策略结束插话、清空 ASR 并进入延时聆听，不默认再生成恢复 event。","output":"有效新 Query 与被打断信息","next":"作为 M01 的新有效输入","sourceIds":["INPUT-PRD","DT-PRD","VOICE-AIVA"]},{"id":"M08","actor":"输入管理 → Director","title":"提交这一轮完整输入批次","detail":"同一批输入可用数组同时保留用户 query 与 Advisor 建议，分别保留各自来源。当前轮由 Director 统一判断先响应什么、做什么；下一批仍由输入管理按当时状态安排。","output":"当前轮输入批次","next":"交 C 背景汇合与 D 推理","sourceIds":["INPUT-PRD","DT-PRD"]}],"edges":[{"to":"M02","label":"新有效输入","from":"M01"},{"to":"M03","label":"无推理、无播报","from":"M02"},{"to":"M04","label":"未完整输出、未起播","from":"M02"},{"to":"M05","label":"已起播或输出完整，且是用户新话","from":"M02"},{"to":"M06","label":"已起播或输出完整，且是其他输入","from":"M02"},{"to":"M08","label":"直接处理","from":"M03"},{"to":"M08","label":"新旧内容合并","from":"M04"},{"to":"M08","label":"新话 + 已发生事实","from":"M05"},{"to":"M08","label":"本轮推理与播报结束","from":"M06"},{"to":"M01","label":"仅最终有效的新 Query 携被打断信息回流","from":"M07"}],"branches":[{"condition":"新输入只是被拒识的声音","result":"本图按 AIVA 交互规则不恢复 NLG，进入延时聆听。仅另外启用事件恢复合同的项目才可能向 Director 提交恢复 event，不连接到本页默认运行链。"},{"condition":"工具已经下发后用户插话","result":"播报停止不等于工具撤销；必须将已下发事实带入后续判断。"},{"condition":"高优任务 advice","result":"PRD 写“当前无”，不在图中画成已部署的固定输入类型。"}],"title":"输入管理","category":"用户请求与执行闭环"},{"id":"C","scope":"Context OnePage 的 V2 方案：常用信息预注入，缺失信息由 Planner 动态检索。V1 的统一粗筛/精筛链不与 V2 串联。","intro":"当用户说“去昨天那家游泳馆”，这一轮文字只告诉 Planner 想去哪类地方，没有给出地址。Context 先送入常用背景；Planner 看过以后，仍然缺的“昨天去哪家”再通过工具查。背景从哪里来、何时查、查到后交给谁，是这一模块的主线。","sourceIds":["CONTEXT-ONEPAGE","PLANNER-ONEPAGE"],"steps":[{"id":"C01","actor":"车端与业务服务","title":"持续产生上下文来源","detail":"车辆端状态说明此刻的车况；舱内外感知描述当前环境；事件日志记录发生过的事情；对话历史与记忆保留先前信息。它们由不同来源产生，不是每次用户说话后才临时凭空生成。","output":"端状态、感知、事件、历史与记忆","next":"写入/维护各上下文来源","sourceIds":["CONTEXT-ONEPAGE","PLANNER-ONEPAGE"]},{"id":"C02","actor":"Context 及各数据源","title":"维护各自负责的信息","detail":"公共 Context 服务统一提供存储、维护与查询入口，各数据源负责本源内容和筛选质量。当前车况与历史行为的意义不同：昨天空调是 24 度，不能直接作为此刻温度；昨天下过指令也不等于已经形成长期偏好。","output":"可被查询的上下文内容","next":"准备常用预注入；接受按需检索","sourceIds":["CONTEXT-ONEPAGE","PLANNER-ONEPAGE"]},{"id":"C03","actor":"Context","title":"把常用背景先交给 Planner","detail":"V2 在进入 Planner 前只提供大多数请求经常用到的数据，避免每次都广泛召回所有资料。各源独立筛选；这里不再增加一个统一模型将所有候选再精筛一次。","output":"本轮提示词所需的常用背景变量","next":"交 Planner 组装本轮上下文","sourceIds":["CONTEXT-ONEPAGE","PLANNER-ONEPAGE"]},{"id":"C04","actor":"Planner","title":"检查现有信息够不够","detail":"Planner 将用户目的与已有背景对照。能直接回答或操作的就继续；像“昨天那家游泳馆”这样缺少具体地点的，需要补查。不能因为用户用了“昨天那家”，就自己编一个地点。","output":"直接处理决定，或具体检索需求","next":"信息足够交 D；缺失交 C05","sourceIds":["CONTEXT-ONEPAGE","PLANNER-ONEPAGE"]},{"id":"C05","actor":"Planner → 检索工具","title":"按缺失内容调用对应查询","detail":"缺记忆就查用户记忆，缺当前车辆状态就查状态，缺外部地点/知识就调用对应检索工具。调用描述需要指明要补什么信息，而不是把全部历史再无差别塞回模型。","output":"带具体查询目的的工具调用","next":"由对应数据源查询","sourceIds":["CONTEXT-ONEPAGE","PLANNER-ONEPAGE"]},{"id":"C06","actor":"数据源与工具","title":"返回查询结果或明确空结果","detail":"结果通过工具反馈进入后续推理。找到的是候选、某次历史记录或当前状态，要保持它原本的含义；没有找到时返回未找到，不能把查询过程当作答案。","output":"本次查询的结果","next":"交输入管理/Planner 下一轮","sourceIds":["CONTEXT-ONEPAGE","PLANNER-ONEPAGE"]},{"id":"C07","actor":"Planner","title":"用新事实继续判断","detail":"收到反馈后，Planner 重新判断用户目标是否已经可执行。唯一地点明确就继续导航；多个候选需要澄清；仍有必要信息缺口时再查或向用户询问。这一轮得到的新事实也进入后续对话上下文。","output":"有依据的下一步动作或问题","next":"回 D 决策闭环","sourceIds":["CONTEXT-ONEPAGE","PLANNER-ONEPAGE"]}],"edges":[{"to":"C02","label":"来源更新","from":"C01"},{"to":"C03","label":"常用数据预注入","from":"C02"},{"to":"C04","label":"背景已就绪","from":"C03"},{"to":"C05","label":"仍有信息缺口","from":"C04"},{"to":"C06","label":"对应工具检索","from":"C05"},{"to":"C07","label":"tool_feedback","from":"C06"},{"to":"C05","label":"还需另一项信息","from":"C07"}],"branches":[{"condition":"预注入已经足够","result":"直接进入 Planner 的回答/执行，不为所有请求强制加一次检索。"},{"condition":"动态检索为空或多候选","result":"继续查询或向用户澄清；不把“不知道”画成已经获得目标。"}],"title":"Context 上下文","category":"用户请求与执行闭环"},{"id":"D","scope":"Director PRD v1.7 与 Planner OnePage 的共同业务闭环。Planner / Director 是同一决策职能的名称；工具集合、提示词与模型以具体项目配置为准。","intro":"现在，用户输入和背景已经到齐。Director 要把“用户想达成什么”变成下一步可执行的动作，再看工具回来的事实决定继续、询问还是结束。它可以一边说话一边产生决定，但首轮答应帮忙不意味着目标已经达成。","sourceIds":["DT-PRD","PLANNER-ONEPAGE"],"steps":[{"id":"D01","actor":"输入管理 + Context","title":"汇合本轮输入与背景","detail":"这一轮可能是用户的新需求，也可能是上次工具反馈、Advisor 建议或 event。Planner 同时取得相关历史、当前环境与可用工具定义，才能知道“刚才做了什么、现在还差什么、能够调用什么”。","output":"本轮输入、历史、背景与可用工具","next":"进入模型推理","sourceIds":["DT-PRD","PLANNER-ONEPAGE"]},{"id":"D02","actor":"Director 模型","title":"确定当前目标和下一步","detail":"模型理解用户目标，把已知信息和缺口分开。信息不足可先查工具或问用户；足够时生成动作。对于“去昨天那家游泳馆”，先确定地点才有导航对象，不能把查记忆和去某个未知地址的导航当成无依赖并行任务。","output":"本轮行动与表达决定","next":"分别形成话术和动作清单","sourceIds":["DT-PRD","PLANNER-ONEPAGE"]},{"id":"D03","actor":"流式输出处理","title":"提取话术、语气和表情","detail":"talk_content 是要说的文字，语气标签决定怎样说，emoji_id 驱动表情。内容逐段产生后可交 TTS；是否有话术与是否有工具动作是两件事，查询状态等场景可以先执行，再根据结果说。","output":"话术、语气、表情","next":"交 O 播报展示；本轮动作继续独立处理","sourceIds":["DT-PRD","PLANNER-ONEPAGE"]},{"id":"D04","actor":"工具分支","title":"读取 action_list","detail":"action_list 列出本轮要调用的工具及参数。动作需要符合当前可用工具的输入要求；输入可独立完成时可以有多个动作，存在前后信息依赖时等待前一步反馈再规划下一步。","output":"具体工具任务","next":"交 E 工具执行","sourceIds":["DT-PRD","PLANNER-ONEPAGE"]},{"id":"D05","actor":"工具执行器","title":"执行动作并返回事实","detail":"下游完成查询、车辆操作或服务请求，把结果作为 tool_feedback 与工具名称返回。成功、失败、未找到、需要用户补充等都属于事实输入，不由 Director 预先宣布。","output":"本次工具调用结果","next":"按回流规则进入下一轮","sourceIds":["DT-PRD","PLANNER-ONEPAGE"]},{"id":"D06","actor":"Director","title":"结合反馈作下一轮决定","detail":"普通工具的结果回到模型后，再决定继续调用、向用户澄清、报告结果或结束。上一轮“正在查”只是过程；下一轮拿到唯一目标、实际执行回报后，才有依据说明这件事的进展。","output":"后续动作或结果说明","next":"需要动作回 D04；需要说明交 D03；完成则收口","sourceIds":["DT-PRD","PLANNER-ONEPAGE"]},{"id":"D07","actor":"编排器","title":"识别结束或直返分支","detail":"没有继续动作时本轮规划收口；配置为直返的工具可以直接结束，不再强制经过模型总结。技术实现还有步数和错误保护，但不能把“图结束”直接解释为用户目标成功。","output":"链路结束及已有结果","next":"交用户输出/历史记录","sourceIds":["DT-PRD","PLANNER-ONEPAGE"]},{"id":"D08","actor":"输入管理","title":"在中途新话到来时协调下一轮","detail":"用户插话、工具晚到、Advisor 新建议仍进入输入管理，由当时的推理和播报状态决定合并、打断或排队。Director 继续工作时必须看到已经下发的动作和被打断的信息，才能避免重复做或重复说。","output":"新的有效输入批次","next":"回 D01","sourceIds":["DT-PRD","PLANNER-ONEPAGE"]}],"edges":[{"to":"D02","label":"输入齐备","from":"D01"},{"to":"D03","label":"有话术/表情","from":"D02"},{"to":"D04","label":"有动作清单","from":"D02"},{"to":"D05","label":"发出工具调用","from":"D04"},{"to":"D06","label":"普通工具反馈","from":"D05"},{"to":"D04","label":"还需下一步工具","from":"D06"},{"to":"D03","label":"给用户结果或澄清","from":"D06"},{"to":"D07","label":"无动作，结束本轮","from":"D02"},{"to":"D07","label":"命中直返工具","from":"D05"},{"to":"D01","label":"后续输入","from":"D08"}],"branches":[{"condition":"只有回答、没有动作","result":"进入播报展示即可，不虚构工具调用。"},{"condition":"工具未完成或失败","result":"继续根据实际反馈判断，不把首轮答应当作执行成功。"},{"condition":"直返工具","result":"按配置直接收口，不能把所有工具硬画成同一个 ReAct 回环。"}],"title":"Planner / Director","category":"用户请求与执行闭环"},{"id":"E","scope":"Agent Server OnePage 与三方 Agent 协议定义的通用调用；车控、导航、GUI 等业务的真实完成条件仍由各自工具定义。","intro":"Director 交出的 action_list 只是待办内容。工具层要找到真正的执行方，补齐该执行方需要的信息，把动作送出去，再区分展示文字、播报文字和给模型的执行反馈。Agent Server 负责单个 Agent 的调用适配，跨步骤规划仍由 Director 或垂域 Agent 完成。","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"],"steps":[{"id":"E01","actor":"Planner 工具节点","title":"把动作清单转成具体调用","detail":"工具节点读取工具名及参数，记录这次工具任务，并发出调用。工具名不是车型底层接口本身；后面还要通过已注册的 Agent 配置找到具体实现。","output":"一次具体工具调用","next":"交 Agent Server","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"]},{"id":"E02","actor":"Agent Server","title":"按 Agent ID 找到配置","detail":"服务查出请求端点、来源类型和调用所需元信息。模型能够说出一个工具名，并不意味着这个车型已注册、已开放或能够执行这项能力；实际可调用集合由配置给出。","output":"匹配的 Agent 配置","next":"进入上下文准备","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"]},{"id":"E03","actor":"Agent Server","title":"准备该工具需要的上下文","detail":"按 Agent 的依赖补充历史、端状态等输入。导航、音乐、车辆控制需要的信息不相同。这里是为某个具体执行方备料，不是再做一次全局任务规划。","output":"工具请求与必要背景","next":"交对应 Executor","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"]},{"id":"E04","actor":"对应 Executor","title":"适配并调用真实执行方","detail":"内置能力、DPFM、豆包能力、生态服务等由各自执行器调用。Agent Server 屏蔽它们的协议差异；涉及车辆操作的请求还要到车端/OEM 接口，涉及查询的请求返回数据，不能用同一个“执行”节点掩盖不同结果含义。","output":"下游收到的请求","next":"等待下游返回内容和状态","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"]},{"id":"E05","actor":"下游 Agent / 服务","title":"返回过程数据、最终结果或错误","detail":"Agent 可流式返回内容，并用 is_finish 标记此次数据返回结束。content 用于展示，tts_content 用于播报，model_content 供 Planner 总结。接口返回结束只证明这次通信结束，是否真正播放、导航、控车成功要看业务结果。","output":"分用途的响应字段","next":"交后处理与输出通道","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"]},{"id":"E06","actor":"Agent Server 后处理","title":"转换格式并保存此次调用结果","detail":"把不同执行器的响应转成座舱统一协议；需要时把音乐等结构化结果转换成模型能理解的文本。收到 is_finish 为 true 的回包后保存该次调用结果，结束单 Agent 调用。","output":"统一响应及模型可用结果","next":"分发至展示和模型回流","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"]},{"id":"E07","actor":"工具回流","title":"把执行结果交回 Director","detail":"普通工具将结果合成带 tool_name 的 tool_feedback，让 Director 知道是哪项动作的结果。回流后可以继续下一步、追问或收口；直返配置则直接结束。工具返回的失败与超时也必须保留，不能删掉后只展示“正在处理”。","output":"成功/失败/待补充等事实","next":"回 M/D 决策，或直返完成","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"]},{"id":"E08","actor":"端侧展示通道","title":"将卡片或透传结果交给对应端侧能力","detail":"卡片内容包含 widget_id 与双方约定的数据；透传内容按 agent_id 交端侧相应模块。它与给 Planner 的 model_content 是不同去向，显示一张卡片也不表示卡片对应的真实动作已经完成。","output":"卡片或端侧协议内容","next":"交 O 展示以及具体应用执行","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"]},{"id":"E09","actor":"取消与降级通道","title":"处理当前调用无法继续的情况","detail":"接入方可返回 fallback，让座舱重新决定处理方式；用户操作打断调用时，调用方发送 cancel，再结束连接，Agent Server 通知下游结束请求并保留已生成内容。取消通信不能被无条件等同于撤销车辆已经接受的动作。","output":"取消/降级信息与已生成结果","next":"返回调度方决定后续","sourceIds":["AGENT-ONEPAGE","AGENT-PROTOCOL","PLANNER-ONEPAGE"]}],"edges":[{"to":"E02","label":"工具调用","from":"E01"},{"to":"E03","label":"找到配置","from":"E02"},{"to":"E04","label":"准备请求","from":"E03"},{"to":"E05","label":"下游执行","from":"E04"},{"to":"E06","label":"流式/最终回包","from":"E05"},{"to":"E07","label":"模型所需结果","from":"E06"},{"to":"E08","label":"展示或透传内容","from":"E06"},{"to":"E09","label":"取消或下游主动降级","from":"E04"}],"branches":[{"condition":"工具返回 is_finish=true","result":"单次响应结束；仍需按业务结果区分接受、执行中和已完成。"},{"condition":"工具返回内容为空/失败","result":"按实际结果回流，不能补写一份成功结果。"},{"condition":"需要 UI 的任务","result":"展示内容与模型反馈分别处理，不把所有卡片强制画成模型总结后的同一分支。"}],"title":"工具执行与回流","category":"用户请求与执行闭环"},{"id":"O","scope":"Director 的话术/表情输出、Agent 协议及车载 TTS PRD v1.4；打断后交互与 I 模块统一采用 AIVA 口径。具体车型音频优先级由 OEM 音频管理定义。","intro":"最后的输出不是一条统一的“完成”箭头：用户可以听到话、看到卡片或表情，也可能看到车辆实际动作。话术来自 Director，卡片可能来自工具，车辆动作则有自己的执行结果。这几条线要在同一请求下对得上，而不是把“说了”当成“做成了”。","sourceIds":["DT-PRD","AGENT-PROTOCOL","VOICE-TTS","PLANNER-ONEPAGE","VOICE-AIVA"],"steps":[{"id":"O01","actor":"Director 输出处理","title":"接收本轮要表达的内容","detail":"流式解析 talk_content 和语气标签，得到要合成的文字；emoji_id 交表情通道。工具结果还没回来时，话术只能描述当前正在做什么，不能提前宣称空调已经调到某个温度或导航已经成功。","output":"文字、语气、表情","next":"话术交 TTS；表情交机器人","sourceIds":["DT-PRD","AGENT-PROTOCOL","VOICE-TTS","PLANNER-ONEPAGE"]},{"id":"O02","actor":"TTS 调度","title":"选择在线、离线或缓存音频","detail":"正常网络优先在线；无网、弱网、指定异常或未登录等条件按 TTS PRD 选择离线。系统警告强制离线，特殊播报风格另有在线约束。缓存精确匹配已有文本时可直接播放已有音频，未命中才走相应合成。","output":"本次可播放的音频来源","next":"交合成或缓存读取","sourceIds":["DT-PRD","AGENT-PROTOCOL","VOICE-TTS","PLANNER-ONEPAGE"]},{"id":"O03","actor":"语音合成与播放器","title":"把文字变成音频并真正播出","detail":"在线合成或离线合成得到音频，播放器在音频管理允许后播出。云端生成完成和车内实际播完不同；缓冲、音频抢占或用户打断都可能使用户只听到一部分。","output":"播放中的音频与播放进度","next":"交播放结束/打断处理","sourceIds":["DT-PRD","AGENT-PROTOCOL","VOICE-TTS","PLANNER-ONEPAGE"]},{"id":"O04","actor":"机器人与交互界面","title":"同步展示表情与交互状态","detail":"表情根据 Director 的 emoji 输出驱动，豆包内部交互的 TTS 联动相应动效。导航等其他业务调用同一 TTS 服务时，不要求同步展示豆包内部对话动效；声音播放与机器人状态按各自业务来源处理。","output":"用户可见的表情与状态","next":"与当前播报保持对应","sourceIds":["DT-PRD","AGENT-PROTOCOL","VOICE-TTS","PLANNER-ONEPAGE"]},{"id":"O05","actor":"工具卡片通道","title":"展示属于本次工具结果的内容","detail":"Agent 响应中 content 可为卡片 JSON，widget_id 与数据交端侧渲染；它与 model_content 给模型的文字用途不同。地点候选卡让用户继续选择，结果卡展示工具返回内容；一张卡出现不等于业务目标完成。","output":"候选卡、结果卡或透传内容","next":"用户选择可产生下一轮输入","sourceIds":["DT-PRD","AGENT-PROTOCOL","VOICE-TTS","PLANNER-ONEPAGE"]},{"id":"O06","actor":"车辆/OEM/业务应用","title":"完成具体动作并给出结果","detail":"空调是否调节、音乐是否播放、导航是否建立，由真实执行方反馈。Director 用这一事实形成结果说明。若返回的只是已接受或处理中，就保留该阶段，不能升级成“完成”。","output":"真实业务状态","next":"交工具反馈，再回 Director","sourceIds":["DT-PRD","AGENT-PROTOCOL","VOICE-TTS","PLANNER-ONEPAGE"]},{"id":"O07","actor":"播放与输入管理","title":"处理播完或中途打断","detail":"正常播完进入后续聆听状态。用户插话使播报中断时，保留已播与未播内容；最终有效的新 Query 可携带 last_talk_content 进入下一轮。最终拒识时，本图按 AIVA 策略不恢复 NLG，不额外触发默认续讲。","output":"正常播完状态，或有效插话及被打断信息","next":"交 M 输入管理 / D 下一轮判断","sourceIds":["DT-PRD","AGENT-PROTOCOL","VOICE-TTS","PLANNER-ONEPAGE","VOICE-AIVA"]},{"id":"O08","actor":"Director → 用户","title":"按结果完成这一次交流","detail":"用户最后听到的说明应与工具事实一致：已完成就说明结果，需要选择就提出具体选项，失败就说明失败和能够继续的步骤。当前一轮交流结束后，后续操作、用户新话和异步结果继续走同一输入管理链。","output":"可理解且对应实际状态的交互结果","next":"新输入回到 M；需继续动作回 E","sourceIds":["DT-PRD","AGENT-PROTOCOL","VOICE-TTS","PLANNER-ONEPAGE"]}],"edges":[{"to":"O02","label":"话术和语气","from":"O01"},{"to":"O04","label":"emoji 与交互信息","from":"O01"},{"to":"O03","label":"合成或缓存音频","from":"O02"},{"to":"O07","label":"播完或被打断","from":"O03"},{"to":"O08","label":"卡片内容供用户理解/选择","from":"O05"},{"to":"O08","label":"工具回流后形成结果说明","from":"O06"},{"to":"O08","label":"正常结束或有效新输入进入下一轮","from":"O07"},{"to":"O01","label":"下一轮生成新的表达","from":"O08"}],"branches":[{"condition":"在线合成中途断流","result":"本 TTS PRD 明确不包含在线转离线的断点续播；不能画成已有自动能力。"},{"condition":"导航或系统警告调用 TTS","result":"使用自己的业务与优先级约定，不等同于一轮 Director 对话。"},{"condition":"音频播完但工具仍处理中","result":"交流可进入后续状态，但业务不能据此标为成功。"},{"condition":"插话最终拒识","result":"按本图统一的 AIVA 策略不恢复 NLG，回到延时聆听；不走默认 event 恢复链。"}],"title":"播报、展示与真实结果","category":"用户请求与执行闭环"},{"id":"DR","scope":"采用“司机 Agent_SLS 导航&泊车 D2D 相关场景”中目的地泊车主链路；这是赛力斯场景约定，不能推广成所有车型的统一链路。","intro":"“开智驾去漕河泾中心 D 栋，车停到负二层充电车位”同时包含导航终点和到达后的泊车要求。Director 负责和用户说清需求，司机 Agent 负责协调导航与泊车；地图匹配和实际驾驶仍由系统导航泊车应用与智驾域完成。","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"],"steps":[{"id":"DR01","actor":"Director","title":"把完整出行要求交给司机 Agent","detail":"Director 保留目的地、激活智驾、到达后停到负二层充电车位这几部分要求，将其一起交给司机 Agent。只保留“导航去 D 栋”会丢掉用户最在意的最终停车目标。","output":"包含导航与泊车条件的请求","next":"交司机 Agent 拆解","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]},{"id":"DR02","actor":"司机 Agent","title":"分开导航目标和泊车约束","detail":"司机 Agent 把导航目的地与楼层、区域、车位类型等泊车要求分开处理。这里的拆解是为了让不同工具各自得到可理解的输入，并在最终下发时重新组合成同一个任务。","output":"导航 Query 与泊车约束","next":"先提取泊车字段，再交导航","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]},{"id":"DR03","actor":"智驾工具/车控模型","title":"把泊车描述提取成字段","detail":"工具从“负二层充电车位”提取楼层和车位类型，返回司机 Agent。提取成功只说明自然语言被解析成了结构，不代表地图里真的存在这个车位。","output":"floor、position 等泊车信息","next":"回司机 Agent 并传给 AI Navi","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]},{"id":"DR04","actor":"AI Navi","title":"缓存泊车条件并搜索目的地","detail":"导航工具带着泊车任务信息搜索 POI。若返回多个 D 栋候选，结果经过司机 Agent 回 Director，由用户选择；此时还没有可靠的导航终点，不能先开始到某个猜测地点的驾驶。","output":"POI 候选与保留的泊车约束","next":"有唯一/已选目的地后算路","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]},{"id":"DR05","actor":"用户 + Director + AI Navi","title":"完成地点与路线选择","detail":"用户选择 POI 后，导航返回可用路线，再由用户语音或界面选择。选择结果继续针对同一次导航泊车任务，不能在多轮确认中漏掉原先的楼层和充电车位要求。","output":"已选目的地、路线、泊车条件","next":"交系统导航泊车 App","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]},{"id":"DR06","actor":"系统导航泊车 App","title":"组装任务并匹配目标车位","detail":"应用收到导航、停泊车及激活智驾任务，使用目的地园区 POI、楼层、区域和车位类型匹配泊车地图。匹配是否成功，由该应用的地图和车位数据决定，不能由 Director 仅凭文字判定。","output":"匹配成功，或无图/有图无目标车位","next":"按不同结果交智驾或用户确认","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]},{"id":"DR07","actor":"智驾域 ADC","title":"接收可执行任务并返回实际状态","detail":"成功匹配的任务交智驾域执行车位到车位能力，并反馈执行状态。智驾负责是否能执行和实际驾驶；座舱理解完成、接口接收和车辆已经泊入是不同阶段。","output":"智驾执行与结果反馈","next":"反馈至应用、工具及 Director","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]},{"id":"DR08","actor":"Director + 用户","title":"无图时确认替代目标","detail":"无法直达车位时，泊车应用将原因经导航工具、司机 Agent 回 Director。Director 询问是否仍激活智驾前往目的地；用户同意再下发替代任务，不同意则取消。这条替代路径到终点后可能靠边停或提示接管，并不承诺自动泊入原先指定的车位。","output":"用户对替代任务的明确选择","next":"同意交执行；不同意结束","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]},{"id":"DR09","actor":"泊车地图界面 + 用户","title":"有图却无目标车位时重新选位","detail":"有地图但楼层、区域或目标车位不匹配时，引导用户在泊车地图界面选择其他车位。一期约定仅支持该界面完成操作；用户选好后，由系统导航泊车应用发给智驾，并回传选择后的 context。","output":"用户新选车位及更新后的背景","next":"交智驾执行并回传状态","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]},{"id":"DR10","actor":"工具反馈 → Director","title":"把进展交回对话","detail":"返回结果说明的是已设置任务、匹配失败、需要选择，还是实际执行进展。Director 依据这份结果回应；用户中途改目的地或改停法，作为新的请求重新协调，不能悄悄保留与新目标冲突的旧泊车任务。","output":"与当前任务一致的结果说明","next":"回 O 用户输出；变更需求回 DR01","sourceIds":["CORE-DRIVER-D2D","CORE-DRIVER-PRD"]}],"edges":[{"to":"DR02","label":"完整请求","from":"DR01"},{"to":"DR03","label":"泊车描述","from":"DR02"},{"to":"DR04","label":"提槽结果 + 导航 Query","from":"DR03"},{"to":"DR05","label":"目的地候选","from":"DR04"},{"to":"DR06","label":"地点与路线已确定","from":"DR05"},{"to":"DR07","label":"成功匹配","from":"DR06"},{"to":"DR08","label":"无图，不能直达车位","from":"DR06"},{"to":"DR09","label":"有图，目标车位不匹配","from":"DR06"},{"to":"DR07","label":"用户同意替代任务","from":"DR08"},{"to":"DR07","label":"用户在界面选定车位","from":"DR09"},{"to":"DR10","label":"实际执行反馈","from":"DR07"},{"to":"DR01","label":"用户改变任务","from":"DR10"}],"branches":[{"condition":"只要导航加激活智驾","result":"原文场景 4 可由 Director 先调用导航，成功后调用 auto_drive；不必经过本页的完整 D2D 泊车编排。"},{"condition":"已有导航却要求停在途经点园区","result":"SLS SOP 单泊车场景只支持导航终点；不把划掉的后续方案写成现有支持。"},{"condition":"从泊入车位改成靠边停","result":"先取消旧泊车任务并取得取消成功，再设置新的临停目标。"}],"title":"司机 Agent","category":"专项执行"},{"id":"B","scope":"Context OnePage 的 V2 预注入/动态检索机制，以及 AIVA V1.2 视觉上云合同。车辆信号与视觉信号是不同来源，不强行拼成串行链。","intro":"Planner 说“现在车里有点热”之前，得先拿到当前事实。车辆本身产生车况，视觉模型产生画面描述，云端端状态保存可用的最新信息，Context 再把本轮常用数据送到 Planner。若仍缺少某项信息，Planner 才通过查询工具补取。","steps":[{"id":"B01","actor":"车端信号源","title":"产生当前车辆状态","detail":"车辆状态由端侧实时信息提供，例如温度、车门、车窗等已接入字段。它描述车辆此刻的状态，不等于用户希望执行什么；没有接入的字段不能靠语言模型补造。","output":"已接入的车辆状态","next":"B05","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]},{"id":"B02","actor":"AI-Box / AlwaysOn 设置","title":"决定哪些视觉任务运行","detail":"AIVA V1.2 将舱外 AlwaysOn 与舱内任务分开：舱外随 AI-Box 启停，舱内还要求设置中的 AlwaysOn 开关开启。开关控制的是感知任务是否运行，不能一概写成“所有相机一直开”。","output":"启用的视觉任务","next":"B03","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]},{"id":"B03","actor":"VLM → AI Service","title":"产生并接收视觉原始输出","detail":"舱外 AlwaysOn、舱内动态和静态任务各自产生原始结果。AI Service 订阅相关 Topic 接收结果，数据上云过程不调整模型原始内容。任务专属结果如何进入 Trigger，另走 A 模块的任务编号链。","output":"完整视觉输出包","next":"B04","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]},{"id":"B04","actor":"AI Service → 云端端状态","title":"透传视觉输出","detail":"AI Service 将输出整包传给云端端状态，后级业务再组织内容。端侧上传成功表示云端收到一包数据，不表示 Advisor 已给出建议，更不表示 Planner 已决定动作。","output":"云端收到的视觉状态","next":"B05","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]},{"id":"B05","actor":"云端端状态","title":"维护当前可用信息","detail":"Context 把端状态作为一个独立上下文源。视觉上云合同还规定信号有效期：有效期内可使用，超过有效期作废。缺失或过期不能伪装成“没有儿童”“温度正常”等正常结论。","output":"仍有效的当前状态","next":"B06、B08","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]},{"id":"B06","actor":"各上下文源 → Context","title":"预注入本轮常用信息","detail":"Context V2 取消统一精筛，由各数据源负责筛选；进入 Planner 前先给常用信息。端状态只是其中一源，记忆、用户画像、事件等各自提供信息后汇合，彼此不需要串行等对方处理完。","output":"本轮预注入上下文","next":"B07","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]},{"id":"B07","actor":"Planner","title":"判断已有信息是否足够","detail":"Planner 根据用户请求和预注入内容作判断。信息足够时进入回答或工具执行；缺少特定事实时才发起相应查询。不能把预注入画成“全量信息已经齐备”。","output":"直接执行决定或补查请求","next":"补查 B08；足够交 D 模块","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]},{"id":"B08","actor":"查询工具 → 对应数据源","title":"按需取回缺失信息","detail":"Planner 的查询请求指向所需数据源，返回内容再进入下一轮判断。例如当前温度不在已给上下文中，需由已接入的状态查询能力返回，不能用旧对话中的温度代替。","output":"补充事实或查询失败结果","next":"B07","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]},{"id":"B09","actor":"AI Service","title":"处理网络异常","detail":"视觉上云 PRD 区分时效：周期任务丢弃积压包，只上报最新状态；One-shot 漏传有一次自动补传，断网暂存后恢复传输。这是该项目合同，不能推广成所有车端信号共有的策略。","output":"最新周期状态或补传结果","next":"B04","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]},{"id":"B10","actor":"消费方","title":"决定缺失信息时如何继续","detail":"视觉上云合同没有统一云端兜底，明确由后续消费业务处理。某一帧没到云端时，当前数据就是缺失；需补问、等待还是停止某项业务，应遵循对应业务规则。","output":"本业务的缺失处理","next":"返回对应消费模块","sourceIds":["CONTEXT-ONEPAGE","ASY-A46"]}],"edges":[{"from":"B01","to":"B05","label":"车辆状态来源"},{"from":"B02","to":"B03","label":"任务已开启"},{"from":"B03","to":"B04","label":"完整视觉包"},{"from":"B04","to":"B05","label":"接收并维护状态"},{"from":"B05","to":"B06","label":"有效状态"},{"from":"B06","to":"B07","label":"常用上下文"},{"from":"B07","to":"B08","label":"仍缺信息"},{"from":"B08","to":"B07","label":"查询结果"},{"from":"B04","to":"B09","label":"上传异常"},{"from":"B09","to":"B04","label":"按类型恢复上报"},{"from":"B05","to":"B10","label":"缺失或超期"}],"branches":[{"condition":"视觉结果用于已注册的持续任务","result":"任务结果通过 AI Service → TaskService → Trigger 的路径判断，不是所有视觉输出都先经过 Planner。","from":"B03"}],"sourceIds":["CONTEXT-ONEPAGE","ASY-A46"],"title":"信号与当前状态","category":"信息从哪里来"},{"id":"A","scope":"AIVA 舱内动态视觉任务；依据 TaskService 技术方案与动态感知 PRD 的定义。这里讲设计合同，不宣称所有车型已经部署。 同页另列 Seres VQA 的按次问图路径，二者入口独立。","intro":"用户说“二排右侧的宝宝哭了告诉我”，系统要保存的是一个持续等待的目标。摄像头负责提供当时看见的事实，云端触发器负责比较事实与目标，TaskService 负责这项任务何时继续、何时结束。三者分工不同，因此“视觉模型看见宝宝”还不能直接变成一条提醒。 如果用户问的是“后排现在有几个人”，则走一次视觉问答，不需要创建持续任务；这一支从 A16 开始，回答交回当前调用。","steps":[{"id":"A01","actor":"Task Agent → TaskService","title":"保存观察目标","detail":"Task Agent 产生舱内长时感知任务，TaskService 接收 cabin_vision 类型并分配 task_id。感知目标需要把对象和位置说清，例如“二排右侧的宝宝哭了吗”。同一用户同时关注多个目标时，各目标以各自的任务编号区分。","output":"任务编号、感知目标","next":"A02","sourceIds":["ASY-A06"]},{"id":"A02","actor":"TaskService","title":"检查是否允许持续观察","detail":"TaskService 查询舱内 AlwaysOn 开关。开关关闭就拒绝创建；开启后还要检查任务容量，同一时间最多下发 3 项动态视觉任务，编号不得重复。超过容量也拒绝，不能先回复已开始再静默丢掉任务。","output":"允许创建或明确拒绝","next":"A03、A04；拒绝进入 A15","sourceIds":["ASY-A06","ASY-A60"]},{"id":"A03","actor":"TaskService → 云端 Trigger","title":"注册目标判断规则","detail":"TaskService 向 Trigger 注册 vlm_inference 场景，把感知目标放进 inference_params.goal。此处建立的是“收到哪个任务的观察后，应判断哪个目标”的对应关系；没有这层对应，宝宝与其他乘客的观察结果会失去业务归属。","output":"带目标的触发场景","next":"等待 A08 的观察结果","sourceIds":["ASY-A06"]},{"id":"A04","actor":"TaskService → 端侧 AI Service","title":"下发完整的有效任务列表","detail":"TaskService 通过 Frontier 推送 dynamic_watch_tasks，每项包含 task_id、task_version、target。VLM 收到新列表会全量替换旧列表，因此新增、修改、删除都要重新下发当前完整列表，不能只把变化的那一项追加过去。","output":"完整任务列表","next":"A05","sourceIds":["ASY-A06","ASY-A60"]},{"id":"A05","actor":"AI Service → 端侧 VLM","title":"把用户目标加入舱内高频观察","detail":"动态视觉任务搭载在舱内高频 AlwaysOn 推理上。VLM 在一次推理中输出默认感知结果及各任务的识别结果。这里输出的是眼前事实，例如“副驾后方婴儿闭眼安睡”，并不直接宣布任务完成。 观察按 VLM 自身周期持续进行，与云端一次提醒是否已经讲完无关。","output":"按任务编号组织的观察结果","next":"A06","sourceIds":["ASY-A60","ASY-A14"]},{"id":"A06","actor":"AI Service → TaskService","title":"上报每个任务的观察","detail":"AI Service 调用视觉结果上报接口，提交 occurred_at 和动态任务数组，每项带 task_id、result，可带 task_version。结果必须关联原来的任务，TaskService 才能知道这段描述是为哪个目标产生的。","output":"任务编号、观察文字、发生时间","next":"A07","sourceIds":["ASY-A06"]},{"id":"A07","actor":"TaskService","title":"排除已关闭或过期的观察","detail":"TaskService 检查任务是否存在、是否关闭及结果时效。已关闭任务的结果只记录，不继续转发，并重新下发有效列表；上报时间与服务端相差超过 20 秒时也只记录。通过这些检查的结果，才进入下一步转发。","output":"可转发结果或跳过记录","next":"有效结果进入 A08；已关闭则刷新 A04；不存在或过期进入 A26","sourceIds":["ASY-A06"]},{"id":"A08","actor":"TaskService → Trigger","title":"逐条把观察交给对应场景","detail":"TriggerRun 一次只接收一项推理任务。TaskService 把场景编号、观察文字和上报时间逐条发送；一条转发失败不影响其它任务。接口统计收到、转发、跳过和失败条数，因此接口返回成功并不代表所有任务都送达。","output":"对应场景的一次观察输入","next":"A09","sourceIds":["ASY-A06"]},{"id":"A09","actor":"云端 Trigger 的语义判断模型","title":"比较当前观察与感知目标","detail":"模型只读文字，先对齐对象和位置，再判断当前状态。对“宝宝哭了吗”，明确啼哭可以判达成；揉眼睛等间接迹象判未达成；“宝宝是否发烧”这类超出视觉能力的目标判无法判断。模型不负责决定提醒用户、关闭任务或跨帧状态变化。","output":"达成 / 未达成 / 无法判断及依据","next":"达成进入 A10；未达成本轮不触发，AlwaysOn 按自己的周期继续观察","sourceIds":["ASY-A14"]},{"id":"A10","actor":"Trigger → TaskService","title":"条件命中后回调任务","detail":"Trigger 经 TriggerCallback 通知 TaskService。持续看护在条件命中、需要介入时反馈；目标达成即结束的任务还要关闭。周期汇报是另一条由用户约定时间驱动的入口，见 A24–A25，不要求先判目标达成。","output":"本次触发及任务状态处理","next":"A11；需关闭时同时进入 A13","sourceIds":["ASY-A06"]},{"id":"A11","actor":"TaskService → 主动推荐链路 → Planner","title":"把观察结果带回主对话","detail":"TaskService 经 Frontier 主动推荐链路把本次触发交给 Planner。Planner 接收到的是与用户目标关联的新事实，随后结合当前上下文决定如何提醒、是否调用工具。触发器本身不代替 Planner 写完全部用户回答。","output":"Planner 的回答或执行决定","next":"A12","sourceIds":["ASY-A06","ASY-A03"]},{"id":"A12","actor":"下游工具 / 客户端","title":"交付这一次提醒或动作","detail":"如果 Planner 产生工具动作，后续仍走正常工具执行与反馈；如果只需要提醒，则进入客户端输出。用户最后听见什么、车辆是否做了动作，应由输出和执行链各自的结果确认。观察成立只说明条件到了。 这次反馈结束不控制下一帧采集；只要观察任务仍有效，端侧调度独立继续。","output":"本次业务结果","next":"本次用户输出完成；持续观察由 A23 独立调度，关闭由 A13 处理","sourceIds":["ASY-A03","ASY-A06"]},{"id":"A13","actor":"TaskService → Trigger、AI Service","title":"关闭任务并重新下发列表","detail":"用户主动结束时关闭任务并注销 Trigger；目标已达成且要求结束、关注对象离车等情况也会关闭相应任务。TaskService 把剩余有效任务重新下发给 AI Service，让 VLM 下一次替换掉已经结束的目标。","output":"关闭结果、剩余任务列表","next":"A04 或结束","sourceIds":["ASY-A06"]},{"id":"A14","actor":"AlwaysOn 设置 → TaskService","title":"开关关闭时清空全部动态任务","detail":"AlwaysOn 从开变关时，TaskService 下发空列表，以全量替换清除全部动态任务；存在进行中的用户需求时告知任务终止。重新打开开关恢复的是下发权限，已终止任务是否重建需要另外处理。","output":"空任务列表、终止告知","next":"A04 后停止","sourceIds":["ASY-A60"]},{"id":"A15","actor":"主对话","title":"告知本次没有创建成功","detail":"AlwaysOn 未开启时，说明舱内感知未开启并引导设置；达到容量上限时，保持创建失败结果。用户不能因为听到了笼统的“好的”而误以为系统已经在持续看护。","output":"明确的未创建结果","next":"结束","sourceIds":["ASY-A06","ASY-A60"]},{"id":"A16","actor":"Planner → VQA 工具","title":"接收当前这一次视觉问题","detail":"用户询问眼前画面时，VQA 工具承接本轮问题，进行场景理解、位置和对象提取。它处理的是当前调用，例如“车内现在有几个人”，不是登记一个未来条件。","output":"视觉场景、位置与问题","next":"A17、A18","sourceIds":["ASY-A49","ASY-A44"]},{"id":"A17","actor":"云端 VQA → Seres 端侧 VQA / AI-Box","title":"舱内问题在端侧识别","detail":"Seres 舱内路径由云端下发提示词和当前 Query，端侧取图并用端侧 VLM 处理；返回描述性结果，不上传原始舱内图片，云端仅返回文字。这条问答只处理本次问题，与持续观察任务的注册、判断和回调分开。","output":"当前问题的舱内观察文字","next":"A21","sourceIds":["ASY-A49","ASY-A44"]},{"id":"A18","actor":"云端 VQA → 客户端","title":"其它场景先取图并上传","detail":"舱外、LBS、观影搭子和通用场景沿用主线：云端发取图指令，客户端采图、上传，经 Frontier 回传图片 URI。拿到 URI 只是获得图像资源，识别还在后续业务中完成。","output":"本次图片 URI","next":"A19、A20","sourceIds":["ASY-A49","ASY-A44"]},{"id":"A19","actor":"内容定制联网智能体","title":"理解通用、地点或观影内容","detail":"云端收到图片 URI 后，将非车辆识别场景交给内容定制联网智能体。识别内容仍围绕本次用户问题组织，不能把一次回答自动转换成持续观察规则。","output":"识别和问答结果","next":"A21","sourceIds":["ASY-A49","ASY-A44"]},{"id":"A20","actor":"ToB 车辆识别接口","title":"识别画面中的车辆","detail":"车辆识别走专门的 ToB 车辆识别接口，与其它通用图像问答分开。这是 VQA 工具内部的业务分流，不是 Planner 依次调用两条路径。","output":"车辆识别结果","next":"A21","sourceIds":["ASY-A49","ASY-A44"]},{"id":"A21","actor":"云端 VQA → Planner","title":"把结果送回本次调用","detail":"舱内端侧结果或其它识别结果返回云端，再交给 Planner 总结并组织本轮输出。这条链的终点是回答当前用户问题；没有 TaskService 的持续目标，就没有后续自动监控承诺。","output":"本轮回答依据","next":"A22","sourceIds":["ASY-A49","ASY-A44"]},{"id":"A22","actor":"Planner → 客户端","title":"输出本次视觉回答","detail":"Planner 结合结果组织回复。Seres 舱内按专属合同只返回文本，不展示原始图片；其它场景的图片或卡片呈现沿用各自交互方案。此处连接正常语音、卡片输出链。","output":"用户看见或听见的本次回答","next":"O 模块","sourceIds":["ASY-A49","ASY-A44"]},{"id":"A23","actor":"端侧 AlwaysOn 调度","title":"按自己的周期持续观察","detail":"VLM 以舱内高频 AlwaysOn 任务承载动态观察。任务列表有效、感知开关开启时，调度按 VLM 自身周期重复发起推理；用户要求每分钟汇报并不把摄像头推理周期改成每分钟，也不用等待一次提醒播放完成。","output":"一轮新的观察调用","next":"A05；下一轮由本调度独立发起","sourceIds":["ASY-A60"]},{"id":"A24","actor":"TaskService 定时器","title":"按用户要求设置汇报周期","detail":"“每分钟告诉我宝宝在干什么”要求按时间汇报。TaskService 自己设定定时器，因为底层 VLM 返回周期不定。这个入口与“宝宝哭了再提醒”的条件判断不同，不能以观察目标达成为定时汇报的前提。","output":"每分钟的汇报时机","next":"A25","sourceIds":["ASY-A60"]},{"id":"A25","actor":"TaskService","title":"到点结合已有观察生成本次反馈","detail":"定时器到点后，TaskService 结合 VLM 返回的观察结果，走用户反馈链路。观察提供内容，定时器提供汇报时机，两者共同形成这次汇报。如果此刻没有有效观察，就没有足够事实描述宝宝的当前状态；这类异常的具体处理仍未定义。","output":"周期汇报输入","next":"A11","sourceIds":["ASY-A60","ASY-A06"]},{"id":"A26","actor":"TaskService","title":"本条结果跳过后续触发","detail":"找不到任务或上报时间与服务端相差超过 20 秒时，本条结果不再送入 Trigger，保留对应状态记录。找不到任务没有可关闭对象，不能再指向关闭与注销动作。","output":"跳过本条结果","next":"本条处理结束，其它任务独立处理","sourceIds":["ASY-A06"]}],"edges":[{"from":"A01","to":"A02","label":"创建请求"},{"from":"A02","to":"A03","label":"条件任务：注册感知目标"},{"from":"A02","to":"A04","label":"允许创建：下发任务"},{"from":"A02","to":"A15","label":"开关关闭或超容量"},{"from":"A04","to":"A23","label":"替换为当前有效任务"},{"from":"A05","to":"A06","label":"本轮观察结果"},{"from":"A06","to":"A07","label":"编号与时间"},{"from":"A07","to":"A08","label":"任务有效且结果未过期"},{"from":"A03","to":"A09","label":"已注册感知目标"},{"from":"A08","to":"A09","label":"本轮观察"},{"from":"A09","to":"A10","label":"目标达成，触发回调"},{"from":"A10","to":"A11","label":"需要本次反馈"},{"from":"A11","to":"A12","label":"回答或调用工具"},{"from":"A10","to":"A13","label":"目标达成即结束"},{"from":"A13","to":"A04","label":"下发剩余有效任务"},{"from":"A14","to":"A04","label":"下发空列表"},{"from":"A16","to":"A17","label":"Seres 舱内场景"},{"from":"A16","to":"A18","label":"舱外/LBS/搭子/通用场景"},{"from":"A18","to":"A19","label":"非车辆识别"},{"from":"A18","to":"A20","label":"车辆识别"},{"from":"A17","to":"A21","label":"端侧观察文字"},{"from":"A19","to":"A21","label":"内容结果"},{"from":"A20","to":"A21","label":"车辆结果"},{"from":"A21","to":"A22","label":"本轮回复"},{"from":"A23","to":"A05","label":"按 VLM 自身周期重复发起"},{"from":"A02","to":"A24","label":"周期汇报：设置约定周期"},{"from":"A24","to":"A25","label":"每次到点"},{"from":"A07","to":"A25","label":"有效观察作为汇报内容，不是定时触发"},{"from":"A25","to":"A11","label":"周期汇报到点"},{"from":"A07","to":"A04","label":"发现已关闭任务：刷新有效列表"},{"from":"A07","to":"A26","label":"任务不存在或结果过期"}],"branches":[{"condition":"语义判断返回“无法判断”","result":"这表示目标超出视觉判断范围。语义判断文档只定义模型输出；本次核读正文未明确该结果如何映射关闭、改问或告知，不能自行补一条自动结束线。","from":"A09"},{"from":"A07","to":"A26","condition":"任务不存在或结果过期","result":"跳过本条结果，不关闭不存在的任务。"},{"from":"A07","to":"A04","condition":"结果属于已关闭任务","result":"不再转给 Trigger，重新下发当前有效列表；不重复执行关闭动作。"},{"from":"A25","condition":"汇报到点但没有有效观察","result":"原文没有明确该分支的答话或重试细则，不能把上一帧无条件当成当前状态。"}],"sourceIds":["ASY-A06","ASY-A60","ASY-A14","ASY-A49","ASY-A44"],"title":"视觉感知与问图","category":"信息从哪里来"},{"id":"K","scope":"记忆服务 OnePage 的已接入能力与记忆 PRD；生成、召回、画像和隐私改造的状态分别保留，不把规划中的隐私实现说成已全部完成。","intro":"用户说“去昨天那家游泳馆”时，Planner 需要的不是“这位用户喜欢游泳”这一偏好，而是昨天究竟去了哪里。记忆服务保存和检索过去的事实，Planner 再判断这些事实能否指向当前要找的地点。记忆返回地址之后，导航还要由导航工具另行完成。","steps":[{"id":"K01","actor":"业务方 / 账号与在场人信息","title":"确定本次记忆属于谁","detail":"记忆开关随车辆及豆包账号绑定。业务方提交或查询内容时，需要落在对应身份范围；“谁说了这句话”和“这句话说的是谁”也应保留，不能把“左晨说晓伟的电话”写成左晨自己的电话。","output":"身份范围及信息归属","next":"K02","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K02","actor":"记忆开关","title":"判断是否记录与召回","detail":"开关开启时按业务授权处理；关闭时停止记录车内外事件和生成记忆，已生成内容保留但冻结召回。用户此时说“记一下”需要重新获得授权；仍可依据当前对话回答刚说过的内容，但不能冒称已经存入长期记忆。","output":"允许进入记忆或停止该路径","next":"生成 K03；查询 K08","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K03","actor":"业务方 → 记忆服务","title":"提交发生过的对话或行为","detail":"业务方把允许使用的信息交给记忆服务，记忆服务负责提取而不是直接执行用户动作。长期语义记忆从用户明确说过的话提取，保留原话实际表达的含义。","output":"可提取的原始文本","next":"K04、K05、K06","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K04","actor":"记忆服务","title":"把事件按时间汇成情景记忆","detail":"短期情景记忆把一段时间内的行为合并，长期情景记忆再按天合并。OnePage 写出的周期是短期 20 分钟或 20 个文本、长期按天；因此一条新事实进入原料后不保证马上成为可检索的长期记忆。","output":"带时间线的经历","next":"K07","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K05","actor":"记忆服务","title":"提取语义偏好并生成标签、画像","detail":"语义记忆保留用户明确表达的偏好，后续对已提取内容打标、打分，并从长期语义内容生成画像。因此原始表达、标签和画像是不同产物：前者提供具体事实，后者便于在后续请求中使用。","output":"语义记忆、标签、分数与画像","next":"K07；画像可进入 K09","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K06","actor":"对话摘要模块","title":"压缩近期对话供连续理解","detail":"摘要处理超过保留轮次的历史，作用是让当前对话继续衔接。它和按天累积的长期记忆并行存在；当前问题能从历史对话回答，并不证明长期记忆的生成和召回都已经成功。","output":"近期对话摘要","next":"K09","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K07","actor":"记忆服务","title":"保存可供查询的记忆产物","detail":"不同记忆类型按各自周期和有效期维护。记忆保存完成后，业务方可以按 query 做语义检索，或按标签获取信息。长期默认无过期策略是服务能力口径，实际业务可另行配置。","output":"可检索的记忆","next":"等待 K08","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K08","actor":"Planner / 业务方 → 记忆服务","title":"围绕这次问题检索","detail":"收到“昨天那家游泳馆”时，把要找的事实作为查询，而不是把整个人全部记忆无差别拿来。记忆服务提供语义检索与标签相关能力；OnePage 也明确可能过召，返回项不自动等于正确答案。","output":"相关候选经历或无结果","next":"K09","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K09","actor":"Context / 工具反馈 → Planner","title":"把候选事实放回当前问题","detail":"常用画像、对话摘要可随上下文提供；按需检索的结果通过调用链返回。Planner 需要区分昨天的具体地点、长期喜好和当前事实。若候选无法唯一确定地点，信息仍不足，不能自行选一家替用户导航。","output":"本轮可用事实与仍缺的信息","next":"K10","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K10","actor":"Planner → 导航等业务工具","title":"用记忆支持下一步业务","detail":"确定具体地点后，Planner 才把地点交给路线或导航能力。记忆命中只解决“去哪里”的信息缺口，路线是否成功、导航是否启动是后续工具结果；不能把记忆召回成功画成用户已到目的地。","output":"业务请求及后续结果","next":"回到 D / E 主链","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K11","actor":"用户 → 记忆管理","title":"分别处理关闭与删除","detail":"关闭记忆会保留内容，但停止生成与召回；删除会移除指定内容，语义记忆删除后还需更新画像。批量语音删除的需求包含二次确认，是否开放这个入口随项目版本而定。","output":"冻结或删除结果","next":"结束或继续对话","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]},{"id":"K12","actor":"记忆工具 → 提槽与工程校验","title":"家和公司地址另走地图同步","detail":"短期 POI 同步方案只覆盖记忆向地图的家/公司设置：记忆工具先分流，提槽模块提取地点，工程校验后设置地图地址。规划中的统一 Profile 双向同步覆盖更多字段，不能插进当前这条短期路径。","output":"家/公司地图设置请求","next":"交地图业务结果","sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"]}],"edges":[{"from":"K01","to":"K02","label":"身份范围与开关"},{"from":"K02","to":"K03","label":"允许记录"},{"from":"K03","to":"K04","label":"经历与行为文本"},{"from":"K03","to":"K05","label":"用户明确表达"},{"from":"K03","to":"K06","label":"近期对话"},{"from":"K04","to":"K07","label":"情景记忆"},{"from":"K05","to":"K07","label":"长期语义产物"},{"from":"K02","to":"K08","label":"允许召回：本轮查询"},{"from":"K07","to":"K08","label":"已保存候选"},{"from":"K08","to":"K09","label":"查询结果"},{"from":"K05","to":"K09","label":"常用画像"},{"from":"K06","to":"K09","label":"历史摘要"},{"from":"K09","to":"K10","label":"信息足够支撑业务"},{"from":"K03","to":"K12","label":"家/公司设置语义"}],"branches":[{"condition":"开关关闭","result":"停止记忆生成与召回；当前对话历史仍可回答刚刚说过的内容。","from":"K02"},{"condition":"用户请求关闭或删除","result":"进入独立管理分支，不要求先完成一次检索或一次业务执行。","to":"K11"},{"condition":"候选不足、相互矛盾或多地点无法唯一确定","result":"保留缺口交给主对话补充确认，不把猜测记成事实。","from":"K09"},{"condition":"新的已注册乘客上车或未注册乘客人数增加","result":"PRD 要求清除摘要敏感信息；OnePage 隐私改造仍有施工中/规划中项，因此这里只列产品规则，不能声明所有项目已实现。","from":"K06"}],"sourceIds":["ME-MEM-ONE","ME-MEM-PRD","ME-POI"],"title":"身份与记忆","category":"信息从哪里来"},{"id":"EV","scope":"按事件生产与使用迭代技术方案；三种生产入口并列。触发器 event 恢复播报只是历史临时方案，不能推广为所有事件都会触发一次 Query。","intro":"事件回答“刚才发生了什么”。同一个空调温度既有当前值，也可以在变化时生成一条事件；事件记录变化的时间、对象和内容。它只有经过定义与生产，才会成为可以交给下游消费的业务事实。","sourceIds":["ME-EVENT-TECH"],"steps":[{"id":"EV-1","actor":"产品 / 事件定义维护","title":"事先定义事件合同","detail":"定义资源 ID、名称、结构化字段、生产来源与自然语言拼接规则。端状态变化和业务操作不能仅凭一个名字就自动变成统一事件。","output":"事件定义","next":"各生产方按定义生产","sourceIds":["ME-EVENT-TECH"]},{"id":"EV-2","actor":"触发器","title":"匹配端状态规则后生产事件","detail":"触发器先取得事件定义列表，规则命中后组装结构化数据和自然语言描述，再把事件传给事件服务。它不是直接从原始数值猜一个用户意图。","output":"触发器生成的事件","next":"事件服务校验","sourceIds":["ME-EVENT-TECH"]},{"id":"EV-3","actor":"客户端","title":"上报用户实际发生的操作","detail":"例如用户在页面同意某项隐私授权。客户端按已定义的事件信号上报，云端依据拼接规则生成自然语言描述。","output":"客户端事件","next":"事件服务校验","sourceIds":["ME-EVENT-TECH"]},{"id":"EV-4","actor":"云端业务","title":"记录云端掌握的业务事实","detail":"人车对话、记忆开关变化等由相应云端业务按定义生产。记录内容是已经发生的事实，不能把模型打算执行的计划写成动作成功。","output":"云端事件","next":"事件服务校验","sourceIds":["ME-EVENT-TECH"]},{"id":"EV-5","actor":"事件服务","title":"按定义校验结构化内容","detail":"根据 resource_id 校验 resource_info，并使用事件发生时间关联车内人员等信息；未登录时并不保证具有账号和人员数据。","output":"符合定义的事件记录","next":"入库及消费","sourceIds":["ME-EVENT-TECH"]},{"id":"EV-6","actor":"事件日志 / 消费方","title":"进入存储、订阅或查询路径","detail":"事件可以保存供以后查询，也可以通知已订阅的业务。它进入 Context 还是进入 UP，都要看对应白名单和消费合同。","output":"可查询或可通知的业务事实","next":"EL 事件日志及各消费模块","sourceIds":["ME-EVENT-TECH"]}],"edges":[{"from":"EV-1","to":"EV-2","label":"端状态来源"},{"from":"EV-1","to":"EV-3","label":"客户端来源"},{"from":"EV-1","to":"EV-4","label":"云端业务来源"},{"from":"EV-2","to":"EV-5","label":"上报事件"},{"from":"EV-3","to":"EV-5","label":"上报事件"},{"from":"EV-4","to":"EV-5","label":"上报事件"},{"from":"EV-5","to":"EV-6","label":"校验后记录 / 分发"}],"branches":[{"condition":"已有事件但没有消费订阅","result":"可以保存下来，不应自动为用户发起新的对话。"},{"condition":"只有工具计划，没有实际结果","result":"只能记录计划或交互事实，不能把尚未确认的车辆变化写成成功事件。"}],"title":"事件","category":"信息从哪里来"},{"id":"EL","scope":"以事件生产与使用迭代技术方案为主。Context 事件时间窗和条数在文中仍为暂定；早期 PRD 的任务关联字段不在其当期范围。","intro":"事件日志保存原始业务事实，后面由不同模块按各自目的读取。记忆要从事实中提炼长期信息，Context 要补足这一次推理的背景，订阅者则要对特定变化作响应；这三条路可以并行，不是一条必须层层经过的流水线。","sourceIds":["ME-EVENT-TECH","ME-EVENT-PRD"],"steps":[{"id":"EL-1","actor":"事件服务","title":"保存发生时间、对象和原始内容","detail":"保存渠道、车辆、账号、事件时间、结构化信息和自然语言描述。发生时间与入库创建时间分别保留，避免把延迟上传误解成事件刚刚发生。","output":"原始事件日志","next":"按请求查询或按订阅通知","sourceIds":["ME-EVENT-TECH"]},{"id":"EL-2","actor":"查询接口","title":"按车辆、时间和事件类型取事实","detail":"消费方按渠道车辆、起止时间、事件类型与条数查询。查询返回的是事件数据，不在日志层统一总结成用户偏好。","output":"符合范围的日志列表","next":"记忆 / Context / Advisor","sourceIds":["ME-EVENT-TECH"]},{"id":"EL-3","actor":"记忆模块","title":"将日志作为记忆生产素材","detail":"记忆模块读取事件后自行加工和总结；日志出现“主驾把空调调低”只说明发生了一次操作，长期偏好是否形成由记忆模块决定。","output":"记忆生产输入","next":"K 记忆模块","sourceIds":["ME-EVENT-TECH","ME-EVENT-PRD"]},{"id":"EL-4","actor":"Context","title":"筛选关注事件补入当前背景","detail":"只取 Context 事件白名单中的事实，按配置的时间窗和条数限制注入 Director。这份方案暂定使用十分钟内最多三十条，具体运行值需要与接入版本对应。","output":"本轮可见的事件背景","next":"C → D","sourceIds":["ME-EVENT-TECH"]},{"id":"EL-5","actor":"UP 组织","title":"将关注事件穿插进对话历史","detail":"UP 有独立事件白名单，可以在 user 输入之间加入带时间的 event。外层角色虽然也是 user，内容表达的是系统观察到的事实，并不自动成为用户指令。","output":"带时间的 event 输入","next":"M / D 对话输入","sourceIds":["ME-EVENT-TECH"]},{"id":"EL-6","actor":"订阅通知","title":"只通知注册过的消费者","detail":"业务方按事件类型注册监听器，发生相应事件时收到回调。退登、授权变化等可通知关注它们的业务，不把每一条事件广播为一次语音请求。","output":"订阅事件回调","next":"对应业务自行处理","sourceIds":["ME-EVENT-TECH"]},{"id":"EL-7","actor":"静态 Advisor","title":"通过 Context 读取相关事件","detail":"静态 Advisor 按 Context 查询接口获得关注的事件，结合环境和状态决定是否产出建议。这是主动服务的资料来源，不代表日志一入库就自动播报。","output":"Advisor 的事实输入","next":"S 主动服务","sourceIds":["ME-EVENT-TECH"]}],"edges":[{"from":"EL-1","to":"EL-2","label":"消费方发起查询"},{"from":"EL-2","to":"EL-3","label":"记忆生产取数"},{"from":"EL-2","to":"EL-4","label":"Context 白名单"},{"from":"EL-2","to":"EL-5","label":"UP 事件白名单"},{"from":"EL-1","to":"EL-6","label":"命中已注册订阅"},{"from":"EL-2","to":"EL-7","label":"Advisor 经 Context 查询"}],"branches":[{"condition":"日志已保存但本轮未注入","result":"不能认定 Director 已经知道这条事实。"},{"condition":"事件时间与到达时间不同","result":"还原业务顺序以事件时间为准，保留上传延迟的事实。"}],"title":"事件日志","category":"信息从哪里来"},{"id":"T","scope":"Seres Task Service OnePager 中明确的现有时间、条件、周期任务链；Script / Step 编排属于二期方案，不进入本页运行链。","intro":"“十分钟后提醒我喝水”和“现在打开车窗”的区别，在于前者必须在这轮对话结束后仍被记住。TaskService 保存目标，Trigger 等待时间或条件，真正到点后再把任务带回 Planner 执行。任务保存成功、到点触发、本轮执行完成是三个不同阶段。","steps":[{"id":"T01","actor":"Planner → 任务入口","title":"转交需要等待的用户目标","detail":"Planner 识别这不是当前轮直接做完的动作，把任务请求交给任务入口。服务按渠道、车辆和登录用户定位任务，避免把另一辆车或另一账号的任务续接到当前对话。","output":"用户目标及身份范围","next":"T02","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T02","actor":"TaskService","title":"理解创建、修改或取消","detail":"任务服务结合用户请求与已有任务定位操作。新建时明确时间或条件、执行内容和结束方式；修改或取消时先找到要管理的任务。Planner 的职责是路由请求，不是在主推理中自行构造全部 TaskSpec。","output":"任务定义或已有任务操作","next":"新建 T03；管理 T11","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T03","actor":"TaskService","title":"校验并保存任务","detail":"校验通过后保存 Task。Task 表示用户持续管理的目标，Run 表示这个目标的一次运行，例如每小时按摩会有多次 Run。此时只是有了一项等待中的目标，还没有真正提醒或控制车辆。","output":"等待中的 Task","next":"T04","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T04","actor":"TaskService → Trigger","title":"注册时间或条件规则","detail":"TaskService 将任务的时间、条件或周期规则交给 Trigger。Trigger 负责等到命中时回调，动作仍由下游主链执行。任务创建结果返回主对话并通知车端显示等待状态。","output":"有效规则与创建结果","next":"T05","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T05","actor":"Trigger → TaskService","title":"到点或条件命中","detail":"时间到达、已接入的状态条件成立时，Trigger 回调 TaskService。不是任何信号变化都会唤起任务，只有关联规则的有效命中才能继续推进。","output":"关联任务的触发回调","next":"T06","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T06","actor":"TaskService","title":"检查本轮能否执行","detail":"TaskService 检查回调有效性与执行前提，符合条件才激活本轮 Run；前提不满足时记录跳过。周期任务每次有效触发各产生一轮运行，不能把重复回调误当成多次用户授权。","output":"运行中的 Run 或跳过结果","next":"可执行 T07；跳过 T10","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T07","actor":"Recommend / Frontier → 车端 → 主链路","title":"让任务重新进入主对话","detail":"服务通过推荐链路通知车端，车端携推荐标识回流，主链路恢复 Task / Run 关联。这样 Planner 知道这次输入来自此前的提醒，而不是用户刚刚又说了一遍。","output":"带任务关联的新一轮输入","next":"T08","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T08","actor":"Planner → Agent / Tool","title":"结合当前上下文执行本轮","detail":"Planner 重新取得当前上下文，再决定提醒内容或工具动作。例如空调任务需要执行车控，喝水提醒主要交付内容；创建时的车况不能被当成十分钟后的实时车况。","output":"执行决定及工具请求","next":"T09","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T09","actor":"主链路 → TaskService","title":"把本轮实际结果写回","detail":"主链路收集工具或内容结果后回写 Run。车控依据结构化执行状态，内容任务依据有效内容结果；Run 完成并不等于客户端语音已经播完，播放状态仍由输出链处理。","output":"本轮成功、失败等结果","next":"T10","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T10","actor":"TaskService","title":"决定继续等待还是结束","detail":"TaskService 保存本轮结果，再按次数、期限和结束策略决定保留任务或关闭并清理规则。一次性任务完成一轮后结束；周期任务一轮失败不必然结束，仍要按任务策略判断。","output":"等待或关闭状态","next":"继续 T05；关闭结束","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T11","actor":"TaskService → Trigger","title":"更新或取消已有目标","detail":"修改会更新任务定义与触发规则；取消会关闭目标、清理规则并停止后续触发。这条普通取消链路不覆盖直接创建的 GUI 任务，GUI 任务需要按其自身的执行与取消合同处理。","output":"更新结果或关闭结果","next":"修改后 T05；取消结束","sourceIds":["ASY-A03","ASY-A02"]},{"id":"T12","actor":"TaskService → 车端","title":"通知并查询当前任务状态","detail":"任务状态变化向车端发送通知，通知失败不会回滚服务端已经保存的状态。车端展示要结合查询刷新，因此“页面还显示等待”和“服务端任务确实没执行”不能直接画成等号。","output":"用户可见的任务状态","next":"本模块出口","sourceIds":["ASY-A03","ASY-A02"]}],"edges":[{"from":"T01","to":"T02","label":"任务请求"},{"from":"T02","to":"T03","label":"新建"},{"from":"T02","to":"T11","label":"修改或取消"},{"from":"T03","to":"T04","label":"定义校验成功"},{"from":"T04","to":"T05","label":"等待命中"},{"from":"T05","to":"T06","label":"触发回调"},{"from":"T06","to":"T07","label":"满足执行前提"},{"from":"T06","to":"T10","label":"跳过本轮"},{"from":"T07","to":"T08","label":"任务关联与上下文"},{"from":"T08","to":"T09","label":"工具/内容结果"},{"from":"T09","to":"T10","label":"结果回写"},{"from":"T10","to":"T05","label":"周期目标继续"},{"from":"T04","to":"T12","label":"创建通知"},{"from":"T10","to":"T12","label":"运行/关闭通知"},{"from":"T11","to":"T12","label":"修改/取消通知"},{"from":"T11","to":"T05","label":"更新后的规则"}],"branches":[{"condition":"用户要求在当前轮打开车窗","result":"走普通 Planner / 工具执行，不必为每个车控动作创建跨会话 Task。","from":"T01"},{"condition":"请求依赖视觉条件","result":"触发之前还要接上 A 模块的持续观察与语义判断，不能只登记一句中文条件就认为可执行。","from":"T04"},{"condition":"Script、等待事件后修订计划、比赛持续播报","result":"OnePager 明确列为二期尚未实施；从当前运行图移出。"}],"sourceIds":["ASY-A03","ASY-A02"],"title":"长期任务与目标管理","category":"持续任务与主动服务"},{"id":"G","scope":"主图画 OnePage 明确的信号/时间触发与动作调用。推理触发在其规划表仍标 DOING；混合触发明确尚不支持。新 Workflow 需求单独见 P。","intro":"云端触发器接收的不是一整句开放式任务，而是一条已经定义好条件、动作、频率与适用范围的规则。信号或时刻让规则开始检查，命中后调用预设出口；后续是否播报、展示或执行由出口链路完成。","sourceIds":["ASY-A11"],"steps":[{"id":"G-1","actor":"场景注册方","title":"提交场景规则","detail":"规则包含条件或时间、命中后动作、执行次数和间隔，以及渠道、车型、车辆等范围。动作可指向静态 Advisor、主动推荐或第三方回调。","output":"已注册场景","next":"等待对应信号或调度时间","sourceIds":["ASY-A11"]},{"id":"G-2","actor":"端状态上报","title":"车辆或感知信号更新","detail":"端状态把新的信号值交给触发器。规则可能关注当前值，也可能只关心某个值刚刚发生变化；两者不能混为一次“满足”。","output":"新旧状态或当前快照","next":"信号条件匹配","sourceIds":["ASY-A11"]},{"id":"G-3","actor":"时间调度","title":"单次时刻或周期到达","detail":"时间场景由单次时间或 Cron 周期驱动。这是与信号更新并列的入口，不需要先收到车辆状态变化才能启动。","output":"到期的时间场景","next":"检查适用范围与执行策略","sourceIds":["ASY-A11"]},{"id":"G-4","actor":"条件判断","title":"判断当前值或“变更为”","detail":"“变更为”要求旧值不同且新值等于目标；静态条件直接比较当前值。条件组按已配置的且/或关系组合，未满足则继续等待。","output":"本次场景命中或未命中","next":"命中后检查策略","sourceIds":["ASY-A11"]},{"id":"G-5","actor":"触发器","title":"限制适用范围与重复执行","detail":"按场景范围处理对应车辆，并执行总次数、单日次数、单次上电次数和间隔限制。即使条件成立，也可能因频率策略不再调用出口。","output":"本次是否允许发起动作","next":"调用预设出口","sourceIds":["ASY-A11"]},{"id":"G-6","actor":"动作出口","title":"向 Advisor、推荐服务或业务回调交接","detail":"触发器将本次命中交给配置的出口。这里完成的是触发与触达，提醒内容、交互卡、工具执行等由后续模块继续处理。","output":"下游接收结果","next":"S 主动服务 / 指定业务","sourceIds":["ASY-A11"]},{"id":"G-7","actor":"下游业务","title":"继续完成展示或业务动作","detail":"Advisor 建议需要进入其推荐链路；第三方回调由对应业务处理。触发成功记录不能替代车机展示记录或车辆动作结果。","output":"下游业务结果","next":"对应输出与事件记录","sourceIds":["ASY-A11"]}],"edges":[{"from":"G-1","to":"G-2","label":"信号场景订阅输入"},{"from":"G-1","to":"G-3","label":"时间场景注册调度"},{"from":"G-2","to":"G-4","label":"相关信号更新"},{"from":"G-4","to":"G-5","label":"条件命中"},{"from":"G-3","to":"G-5","label":"时间到达"},{"from":"G-5","to":"G-6","label":"策略允许"},{"from":"G-6","to":"G-7","label":"出口已接收"}],"branches":[{"condition":"条件未满足","result":"不执行动作，等待后续相关输入。"},{"condition":"次数或间隔已限制","result":"条件可以成立，但本轮不下发动作。"},{"condition":"需要混合时间、条件、推理","result":"不能套用 OnePage 现有能力，须回到具体项目或后续需求确认。"}],"title":"云端触发器","category":"持续任务与主动服务"},{"id":"L","scope":"端侧触发器 PRD v1.1 的生命周期与回调合同。文档中天气本地自闭环、定时器、规则持久化等另列优先级，不能都画成已落地能力。","intro":"端侧触发器管理本地感知任务什么时候运行、什么时候结束，以及运行失败后如何释放资源。它既接收开关与注册条件，也要接收 VLM 的状态回调；真正的视觉内容通过另一个数据通道送往数据中心。","sourceIds":["ASY-A13"],"steps":[{"id":"L-1","actor":"电源 / 用户开关","title":"改变本地感知运行条件","detail":"车辆上电、下电及持续感知开关决定 AlwaysOn 任务是否应启停。不同任务使用各自条件，不能把一个开关当成所有视觉功能的总执行结果。","output":"运行条件变化","next":"端侧调度","sourceIds":["ASY-A13"]},{"id":"L-2","actor":"端侧触发器","title":"根据注册条件组织任务","detail":"根据相应任务的条件组装运行指令，交给 VLM SDK。这里是调度感知，不是根据尚未取得的画面结果直接控制车辆。","output":"VLM 启停或推理指令","next":"同步接收结果","sourceIds":["ASY-A13"]},{"id":"L-3","actor":"VLM SDK","title":"立即返回指令是否送达","detail":"同步返回只能说明调用成功或失败。AI Box 尚未启动等情况仍可能使任务无法真正运行，因此此时不能把状态改成“识别完成”。","output":"同步接收状态","next":"实际推理与异步回调","sourceIds":["ASY-A13"]},{"id":"L-4","actor":"VLM SDK","title":"取得画面并运行模型","detail":"SDK 执行对应摄像头和任务的推理，得到原始结果。结果内容和任务运行状态各有自己的接收方。","output":"原始视觉结果与运行状态","next":"两条并行回传通道","sourceIds":["ASY-A13"]},{"id":"L-5","actor":"控制通道 → 端侧触发器","title":"回传任务实际工作状态","detail":"异步回传已启动、成功、空结果、超时、失败或停止等状态。PRD 对部分枚举仍标待确定；这里说明状态职责，不把枚举名当已冻结接口。","output":"更新任务状态表","next":"续接、释放或失败处理","sourceIds":["ASY-A13"]},{"id":"L-6","actor":"数据通道 → 数据中心","title":"发布完整视觉输出","detail":"VLM SDK 按 topic 发布原始 JSON，数据中心订阅后附加任务类型和时间信息，按端状态格式上传云端。此通道传内容，不用控制回调替代。","output":"带任务与时间的视觉数据","next":"B 端状态 → C / S","sourceIds":["ASY-A13"]},{"id":"L-7","actor":"端侧触发器","title":"按任务类型续接或结束","detail":"周期任务完成后等待下一周期；单次任务结束或超时后释放占用。PRD 的单次失败策略为重试一次，再失败则停止并告警，避免资源一直被失败任务占据。","output":"任务继续、停止或异常状态","next":"后续调度","sourceIds":["ASY-A13"]},{"id":"L-8","actor":"端侧触发器 / SDK","title":"停止条件出现后确认停机","detail":"下电或相关开关关闭时下发停止，等待已停止回调再确认任务终止。发出 stop 指令与任务实际停止是两个状态。","output":"已停止状态","next":"退出该任务循环","sourceIds":["ASY-A13"]}],"edges":[{"from":"L-1","to":"L-2","label":"允许运行"},{"from":"L-2","to":"L-3","label":"下发指令"},{"from":"L-3","to":"L-4","label":"指令接收成功"},{"from":"L-4","to":"L-5","label":"控制通道"},{"from":"L-4","to":"L-6","label":"数据通道"},{"from":"L-5","to":"L-7","label":"实际运行结果"},{"from":"L-7","to":"L-2","label":"周期任务到下一轮"},{"from":"L-1","to":"L-8","label":"关闭或下电"},{"from":"L-5","to":"L-8","label":"收到已停止回调"}],"branches":[{"condition":"周期上传遇到网络异常","result":"丢弃积压包，只上报最新状态。"},{"condition":"单次任务漏传","result":"PRD 定义一次补传；断网暂存，恢复后补传。"}],"title":"端侧触发与本地闭环","category":"持续任务与主动服务"},{"id":"S","scope":"主图采用《主动服务即时卡技术方案》的推荐缓存—回流—Director—卡片链路。赛力斯 AI bar 的 ui_control/need_confirm 是另一份接入合同，不与即时卡拼成一次串行调用。","intro":"主动建议先进入推荐服务，客户端再携推荐标识回流，让 Director 在本次上下文中组织回答。建议本身、展示建议的卡片和用户点击后执行动作，是不同阶段。","sourceIds":["ASY-A30","ASY-A32"],"steps":[{"id":"S-1","actor":"Advisor","title":"向推荐入口交出建议","detail":"Advisor 提供建议内容，并可附带 real_time_card 的出卡开关及按钮名称。按钮由建议方给定，不由 Director 自行生成。","output":"建议、出卡配置、按钮列表","next":"推荐服务","sourceIds":["ASY-A30"]},{"id":"S-2","actor":"推荐服务","title":"保存建议上下文并通知客户端","detail":"推荐服务缓存上下文，向客户端下发 recommend_id。这个 ID 用来把后续回流请求对应回原来的建议。","output":"推荐标识","next":"客户端回流","sourceIds":["ASY-A30"]},{"id":"S-3","actor":"客户端 / 服务端入口","title":"携推荐标识恢复本次建议","detail":"客户端沿推荐回流链路发起请求，服务端按 recommend_id 取回缓存。出卡开关和按钮列表在缓存删除前恢复到本次请求中。","output":"恢复好的建议输入与卡片配置","next":"Director 判断","sourceIds":["ASY-A30"]},{"id":"S-4","actor":"Director","title":"决定说什么和是否调用工具","detail":"Director 使用本次建议与上下文产生完整输出。主链路保存记录、判断工具分支和卡片下发使用同一份解析结果。","output":"talk_content 与 action_list","next":"文本卡片分支 / 工具分支","sourceIds":["ASY-A30"]},{"id":"S-5","actor":"卡片服务","title":"只用首轮非空话术构建即时卡","detail":"enabled=true 且首轮输出有效时，清理情感标记和空白，以 TalkContent 作正文；按钮保持 Advisor 提供的原文顺序。没有有效正文就不发卡。","output":"带推荐 ID 的即时卡","next":"客户端渲染","sourceIds":["ASY-A30"]},{"id":"S-6","actor":"客户端","title":"显示卡片但不自动重复回流","detail":"按主动推荐通道和 real_time_card 标识渲染。卡片展示本身不触发又一次推荐回流，避免形成循环。","output":"用户看到建议与可选按钮","next":"等待用户操作","sourceIds":["ASY-A30"]},{"id":"S-7","actor":"用户 / 输入链路","title":"点击按钮形成新输入","detail":"用户点击哪个按钮，就将按钮名称原文作为 Query 交给对话链路。Director 再根据这个输入决定后续动作，展示卡片并不等于用户已同意。","output":"带用户选择的新 Query","next":"M → D → E","sourceIds":["ASY-A30"]},{"id":"S-8","actor":"工具执行链路","title":"按 action_list 执行并回传","detail":"Director 如输出工具调用，正常进入工具执行与反馈链路。最终是否执行成功，要从工具和车辆结果判断，不从推荐发送成功判断。","output":"tool_feedback / 实际业务结果","next":"D 总结及 O 输出","sourceIds":["ASY-A30"]}],"edges":[{"from":"S-1","to":"S-2","label":"接收建议"},{"from":"S-2","to":"S-3","label":"通知与回流"},{"from":"S-3","to":"S-4","label":"恢复建议输入"},{"from":"S-4","to":"S-5","label":"首轮有有效话术且允许出卡"},{"from":"S-5","to":"S-6","label":"下发即时卡"},{"from":"S-6","to":"S-7","label":"用户点击按钮"},{"from":"S-7","to":"S-4","label":"新 Query 再判断"},{"from":"S-4","to":"S-8","label":"action_list 非空"}],"branches":[{"condition":"enabled=false、缺省或正文为空","result":"不出即时卡，不能据此判断主流程失败。"},{"condition":"赛力斯 AI bar 接入","result":"need_confirm=true 等 UI 事件确认；false 随渲染同时上行 query。它有独立的 ui_control 合同，不能用即时卡按钮字段替代。"}],"title":"Advisor 主动服务","category":"持续任务与主动服务"},{"id":"I","scope":"主图采用 AIVA VUI 主交互需求中的“打断后拒识不恢复 NLG”策略。早期实验版的缓存续播和 event 恢复属于其他版本，不能接在同一分支后。","intro":"豆包正在播报时，乘客又开口，系统先处理声音和界面，再决定这句话是否进入新一轮推理。停止旧声音不代表停止了正在执行的车辆动作；识别出几个字也不等于已接受新指令。","sourceIds":["VOICE-AIVA"],"steps":[{"id":"I-1","actor":"用户 / 语音输入","title":"播报中出现新的说话声","detail":"同音区继续说话、其他音区插话，以及重新唤醒，都可能发生在旧播报尚未结束时。语音模块持续取得输入，界面需要让说话人知道自己的声音被听见。","output":"新一轮语音与所属音区","next":"流式识别与打断判断","sourceIds":["VOICE-AIVA"]},{"id":"I-2","actor":"流式拒识模块","title":"判断是否应立即停止旧播报","detail":"按已接入的流式打断策略判断。VUI 需求列出连续 ASR 字数或流式模型判断有效两种信号；它们负责尽早让出说话机会，不替代最终有效性判断。","output":"打断事件","next":"停止声音并更新交互状态","sourceIds":["VOICE-AIVA"]},{"id":"I-3","actor":"客户端","title":"停播并展示新一轮 ASR","detail":"收到打断事件后停止当前 TTS，ASR 区域、交互屏和交互灯作出相应反馈。跨音区有效打断时，新音区立即开始流式上屏。","output":"旧声音停止，新输入可见","next":"等待这句话最终有效或拒识","sourceIds":["VOICE-AIVA"]},{"id":"I-4","actor":"拒识 / 入口链路","title":"决定新一句是否成为有效 Query","detail":"最终结果决定新输入是否交给对话系统处理。这里仍然需要与端云采信衔接，不能用刚才用于打断的临时文字替代正式输入。","output":"有效 Query 或拒识结果","next":"有效进入输入调度；拒识进入界面收尾","sourceIds":["VOICE-AIVA"]},{"id":"I-5","actor":"输入调度 / Director","title":"按上一轮所处阶段接收新指令","detail":"上一轮尚未输出首 token 时，多音区有效输入可以合并；已输出后出现新的有效输入，按当前主交互的覆盖规则处理。主图只表达这个阶段分界，不把所有后台任务都画成被统一取消。","output":"新一轮推理输入","next":"M 输入调度 → D Director","sourceIds":["VOICE-AIVA"]},{"id":"I-6","actor":"客户端","title":"最终拒识：结束本次插话","detail":"此版 VUI 明确规定，打断后最终拒识时 NLG 不恢复，ASR 区域清空，对话进入延时聆听。不要接上早期实验方案的 PCM 缓存续播箭头。","output":"延时聆听状态","next":"继续等待下一句","sourceIds":["VOICE-AIVA"]},{"id":"I-7","actor":"输出链路","title":"有效输入：播出本轮结果","detail":"本轮结果沿正常的 Director、工具及输出链路返回，客户端将文本和声音关联到对应输入。前一轮已经完成的动作不会因为旧声音停止就被撤销。","output":"新一轮用户可见结果","next":"O 输出模块","sourceIds":["VOICE-AIVA"]}],"edges":[{"from":"I-1","to":"I-2","label":"获得流式输入"},{"from":"I-2","to":"I-3","label":"判定需要打断"},{"from":"I-3","to":"I-4","label":"继续取得最终输入"},{"from":"I-4","to":"I-5","label":"最终有效"},{"from":"I-4","to":"I-6","label":"最终拒识"},{"from":"I-5","to":"I-7","label":"新一轮处理完成"}],"branches":[{"condition":"重新唤醒","result":"唤醒词或硬按键也可以打断播报，属于明确激活入口。"},{"condition":"早期 2.6 / 二月底实验方案","result":"简单车控不打断、拒识缓存续播属于该版本说明，不与本页 AIVA 分支合并。"}],"title":"插话、打断与恢复","category":"用户交互与展示"},{"id":"W","scope":"按《可见即可说框架需求文档》描述的注册、匹配和执行合同；文档中的优先级与 ASR 选择是该框架需求口径。","intro":"当屏幕上有“确认”按钮，用户说“点一下确认”，这一链路要找到当前页面上对应的按钮，并交还给页面所属业务执行。它依靠动态注册的文字和元素 ID，不是让视觉模型随意理解屏幕再点击。","sourceIds":["VOICE-VISIBLE"],"steps":[{"id":"W-1","actor":"车企 / 页面所属业务","title":"扫描最顶层页面","detail":"页面出现或变化时，提取当前最顶层页面的按钮、列表项、菜单等可交互元素。被弹窗挡住的旧页面不能继续当作当前操作对象。","output":"可见元素的文本、位置及 ID","next":"生成语音指令映射","sourceIds":["VOICE-VISIBLE"]},{"id":"W-2","actor":"车企 / 页面所属业务","title":"把屏幕文字注册成指令","detail":"以显示文字为核心词，过滤符号和标点，补充允许的泛化说法；同名元素加位置或上下文信息。页面切换后同步更新映射。","output":"语音指令—元素 ID 映射","next":"提供给识别和匹配两个环节","sourceIds":["VOICE-VISIBLE"]},{"id":"W-3","actor":"语音识别模块","title":"用页面热词帮助识别","detail":"注册词作为动态热词进入在线或离线 ASR。该框架写明免唤醒走离线，唤醒后离在线并行；这是一份框架内的选择策略，不能直接覆盖所有车型的端云规则。","output":"用户识别文本","next":"指令匹配","sourceIds":["VOICE-VISIBLE"]},{"id":"W-4","actor":"指令匹配模块","title":"将说法对应到注册 ID","detail":"先按核心指令精确匹配，同时处理允许的点击类前缀和语气词。匹配对象始终是已注册指令库；页面没有注册的按钮，不会因为一句相似的话就成为可执行对象。","output":"一个或多个匹配 ID","next":"交还注册方选择和执行","sourceIds":["VOICE-VISIBLE"]},{"id":"W-5","actor":"注册方","title":"处理重名并执行页面操作","detail":"只有一个合适匹配时执行对应点击、输入或滚动；出现多个匹配时，语音模块将候选返回注册方，由注册方选择。不能把第一个候选默认画成已经点击成功。","output":"页面实际执行结果","next":"反馈用户与补入历史","sourceIds":["VOICE-VISIBLE"]},{"id":"W-6","actor":"页面所属业务 / 豆包","title":"展示并播报执行结果","detail":"执行方把成功或失败及需要播报的内容传给豆包，由豆包统一播报；页面呈现点击动效或失败提示。接口匹配到按钮和页面真正完成操作是两个阶段。","output":"成功或失败的用户反馈","next":"本次操作结束","sourceIds":["VOICE-VISIBLE"]},{"id":"W-7","actor":"对话历史","title":"保留模拟点击来源","detail":"这次交互进入历史时标记来自模拟点击事件。下一轮如果用户追问，模型需要知道刚才发生的是界面操作，而不是误认为自己已执行另一个业务工具。","output":"带来源的操作历史","next":"C Context / 后续对话","sourceIds":["VOICE-VISIBLE"]}],"edges":[{"from":"W-1","to":"W-2","label":"可见页面更新"},{"from":"W-2","to":"W-3","label":"注册动态热词"},{"from":"W-2","to":"W-4","label":"注册匹配库"},{"from":"W-3","to":"W-4","label":"ASR 文本"},{"from":"W-4","to":"W-5","label":"匹配结果及 ID"},{"from":"W-5","to":"W-6","label":"操作结果"},{"from":"W-5","to":"W-7","label":"记录模拟点击来源"}],"branches":[{"condition":"出现多个同名候选","result":"交还注册方消歧，不由语音模块擅自选择。"},{"condition":"页面改变","result":"更新当前指令库；旧页面注册内容不能继续指向过期元素。"}],"title":"可见即可说","category":"用户交互与展示"},{"id":"H","scope":"静默通知一期为固定文案的需求链路；动态生成文案属于排期待定的第二期。PHUD 图案的本地/云端路径在原文仍待确认，不与通知卡强连为已完成双输出。","intro":"当条件命中后只需给用户看一条提示，系统可以通过静默通知出口显示文字。这条支路没有按钮和确认回调，不需要先让 Director 组织一段语音，也不能把卡片出现当成车辆已经执行动作。","sourceIds":["ASY-A27","ASY-A19"],"steps":[{"id":"H-1","actor":"运营 / 配置平台","title":"绑定条件与固定文案","detail":"一期逐条配置命中哪些事件或信号，以及展示的固定内容。动态文案生成尚属第二期，不在此处插入模型生成节点。","output":"条件—固定文案规则","next":"等待信号","sourceIds":["ASY-A27","ASY-A19"]},{"id":"H-2","actor":"事件或端信号","title":"产生本次判断输入","detail":"例如乘客状态变化进入已配置的触发条件。若需要从 caption 判断睡着等语义，应由对应触发判断环节完成，不由卡片自己理解画面。","output":"本次信号与条件结果","next":"触发器决定是否出卡","sourceIds":["ASY-A27","ASY-A19"]},{"id":"H-3","actor":"触发器","title":"命中后调用静默文字出口","detail":"选择静默出口表示只展示信息。它与主动建议交互卡的出口分开；本期改造说明该出口不进入 DT。","output":"通知请求","next":"Frontier 下发","sourceIds":["ASY-A27","ASY-A19"]},{"id":"H-4","actor":"服务端消息通道","title":"按通知卡协议发给客户端","detail":"复用现有 Frontier 通知卡字段发送固定文字。发送成功说明消息交出，并不能证明屏幕已经渲染。","output":"通知消息","next":"客户端展示","sourceIds":["ASY-A27","ASY-A19"]},{"id":"H-5","actor":"客户端","title":"显示无按钮的文字提示","detail":"客户端按通知卡形态显示内容，不播报、不生成确认按钮，也没有业务点击回调。展示时长和消失方式在一期 PRD 尚待客户端确认。","output":"用户看见提示","next":"按客户端规则消失","sourceIds":["ASY-A27","ASY-A19"]}],"edges":[{"from":"H-1","to":"H-2","label":"规则等待输入"},{"from":"H-2","to":"H-3","label":"条件命中"},{"from":"H-3","to":"H-4","label":"静默通知动作"},{"from":"H-4","to":"H-5","label":"客户端收到通知"}],"branches":[{"condition":"希望根据画面生成不同文案","result":"属于第二期动态推理显示，不能写成一期自动支持。"},{"condition":"同时出现 PHUD 图案","result":"这是另一条展示能力，原文路径与配置化边界尚待确认，当前图不补造接口和箭头。"}],"title":"静默展示与 PHUD","category":"用户交互与展示"},{"id":"U","scope":"按任务中心 PRD v0.4 解释展示和管理。我的任务、AI 服务、场景预设来自不同系统；任务岛只是入口之一，不是任务执行引擎。","intro":"任务中心让用户查看和管理已经存在的任务。任务后台决定任务是否运行，任务中心接收状态再显示；用户删除或暂停时，又把操作交回对应后台，而不是仅从页面抹掉一张卡。","sourceIds":["ASY-A01"],"steps":[{"id":"U-1","actor":"任务管理 / 静态 Advisor / 预设场景","title":"分别提供三类任务","detail":"我的任务来自 task_agent，包含定时、条件和通用长时任务；AI 服务来自主动服务子目标；场景预设来自系统预设规则。三类内容不能因同屏展示就当成一个任务状态机。","output":"三类任务与状态","next":"任务中心数据更新","sourceIds":["ASY-A01"]},{"id":"U-2","actor":"客户端","title":"上电或登录时主动拉取","detail":"车辆上电或账号登录后，客户端拉取一次任务数据。此入口负责重建当前可见列表，不代表重新创建或重新执行所有任务。","output":"当前账号 / 车辆任务列表","next":"筛选展示","sourceIds":["ASY-A01"]},{"id":"U-3","actor":"云端","title":"任务变化时主动推送","detail":"有任务更新时云端推送一次，让页面跟随后台变化。这是与上电拉取并列的增量更新路径。","output":"最新任务变化","next":"更新对应任务单元","sourceIds":["ASY-A01"]},{"id":"U-4","actor":"任务中心","title":"按类型与状态呈现任务","detail":"我的任务仅展示 running 和 paused，不展示 waiting 与 closed；AI 服务和场景预设按各自范围展示。每项包含图标、标题、介绍、循环属性和可用操作。","output":"用户可浏览的任务单元","next":"进入任务或操作","sourceIds":["ASY-A01"]},{"id":"U-5","actor":"用户 / 任务中心","title":"删除任务前二次确认","detail":"一期对我的任务及 AI 服务提供删除，删除需二次确认；场景预设提供暂停。循环任务的暂停列为第二期，不能提前给所有任务都画同一套控制按钮。","output":"经确认的管理操作","next":"对应任务后台","sourceIds":["ASY-A01"]},{"id":"U-6","actor":"对应任务后台","title":"更新任务状态并同步界面","detail":"后台处理用户操作后，后续列表按最新状态更新。删除、暂停与完成是不同含义；一个任务从“我的任务”消失，也可能因为进入 closed 而被展示规则过滤。","output":"最新任务状态","next":"任务中心刷新","sourceIds":["ASY-A01"]},{"id":"U-7","actor":"用户 / 长时任务界面","title":"进入通用长时任务的生成式界面","detail":"点击通用长时任务可进入其 HMI；普通定时、条件或预设任务的非按钮区域只做动效，不产生实际业务动作。","output":"进入任务详情或保持当前页","next":"对应长时任务交互","sourceIds":["ASY-A01"]},{"id":"U-8","actor":"账号 / 客户端","title":"退登后清理对应任务显示","detail":"退出账号时清空任务中心中的长时跟进和条件触发任务展示。这里处理的是界面数据；后台规则是否注销、历史数据是否删除，需要各自的服务结果确认。","output":"账号切换后的任务视图","next":"下次登录重新拉取","sourceIds":["ASY-A01"]}],"edges":[{"from":"U-1","to":"U-2","label":"首次拉取数据源"},{"from":"U-1","to":"U-3","label":"后台状态发生变化"},{"from":"U-2","to":"U-4","label":"取得列表"},{"from":"U-3","to":"U-4","label":"推送更新"},{"from":"U-4","to":"U-5","label":"点击删除或暂停"},{"from":"U-5","to":"U-6","label":"用户确认且操作受理"},{"from":"U-6","to":"U-3","label":"后台发生更新"},{"from":"U-4","to":"U-7","label":"进入通用长时任务"},{"from":"U-4","to":"U-8","label":"账号退登"}],"branches":[{"condition":"AI bar 持续任务较多","result":"通过更多任务入口进入任务中心；控制中心和 Applist 还有独立入口。"},{"condition":"任务显示 running","result":"表示任务仍进行中，不表示其未来触发动作已经完成。"}],"title":"任务中心、任务岛与卡片","category":"用户交互与展示"},{"id":"F","scope":"本页包含两条不同时间尺度：上线前的能力接入，以及请求中的协议调用。管理平台存在的定义数量不等于某个车型本轮可调用数量。","intro":"Director 能否选到一个工具，取决于该渠道实际接入了哪个实现、是否启用并发布、是否参加推理，以及传给模型的能力描述。工具被选中后，还要按协议把参数交给执行方、收齐结束帧，再把结果交回 Director。","sourceIds":["AGENT-SOP","AGENT-PROTOCOL"],"steps":[{"id":"F-1","actor":"能力维护方","title":"定义工具做什么","detail":"维护唯一英文名称、中文名称、UI 展示名称和能力描述。一个定义可以有多个实现，因此“车控工具”这个名字本身还不能确定请求发往哪套执行能力。","output":"Agent 定义","next":"创建指定租户的实现","sourceIds":["AGENT-SOP"]},{"id":"F-2","actor":"接入方","title":"绑定渠道并配置实现","detail":"以 channel 和 channel_app_id 区分租户，配置车端或云端集成方式、接入点、参数说明、限制和提示，同时选择是否参与 Director 推理。","output":"渠道实现及调用合同","next":"测试与发布","sourceIds":["AGENT-SOP"]},{"id":"F-3","actor":"接入方 / 测试","title":"调通后发布并启用","detail":"快速测试可以直接指定 Agent，也可以经过 Planner 选工具；前者跳过 Director。正式接入还需测试环境验证，涉及代码的按正常流程发布，之后将实现从草稿改成已发布。","output":"对应渠道启用且已发布的实现","next":"运行时动态装入工具信息","sourceIds":["AGENT-SOP"]},{"id":"F-4","actor":"工具配置加载 / Director","title":"只按本轮可用能力作决定","detail":"Director 的工具模块由动态加载填入；描述、限制、参数及 tips 会影响模型怎么选、怎么传参。模型据此输出工具名和参数，交给执行链路。","output":"本轮工具调用","next":"协议请求","sourceIds":["AGENT-SOP"]},{"id":"F-5","actor":"座舱服务","title":"携带请求和上下文调用 Agent","detail":"请求包含本次 Query、触发来源、轮次及渠道车辆信息，并可包含历史、记忆、车辆和用户状态。执行方依据这些信息处理请求。","output":"Agent 收到请求","next":"返回流式响应","sourceIds":["AGENT-PROTOCOL"]},{"id":"F-6","actor":"Agent","title":"分别返回展示内容与模型结果","detail":"处理中可以返回上屏文本；完成时的 model_content 用于 Planner 总结。卡片数据按约定结构下发，透传内容由端上按 agent_id 路由，不将所有字段都当作给模型看的答案。","output":"展示帧、卡片或模型结果","next":"结束帧收尾","sourceIds":["AGENT-PROTOCOL"]},{"id":"F-7","actor":"Agent / 座舱服务","title":"以结束帧结束本次调用","detail":"Agent 完成后必须发送 is_finish=true，座舱据此做最终处理。正常播报由 Planner 总结，tts_content 仅在合同需要时单独提供。","output":"完整工具结果","next":"E 工具反馈 → D 下一轮判断","sourceIds":["AGENT-PROTOCOL"]},{"id":"F-8","actor":"Agent / 座舱服务","title":"无法处理时返回降级命令","detail":"协议允许 Agent 主动请求 fallback，由座舱侧决定下一种处理方式。协议没有授权执行方任意调用别的工具或假报成功。","output":"明确的无法处理信号","next":"座舱重新决定处理方式","sourceIds":["AGENT-PROTOCOL"]}],"edges":[{"from":"F-1","to":"F-2","label":"定义关联实现"},{"from":"F-2","to":"F-3","label":"完成接入配置"},{"from":"F-3","to":"F-4","label":"已发布实现参与运行"},{"from":"F-4","to":"F-5","label":"选中工具并生成参数"},{"from":"F-5","to":"F-6","label":"能够处理"},{"from":"F-6","to":"F-7","label":"is_finish=true"},{"from":"F-5","to":"F-8","label":"不能处理"}],"branches":[{"condition":"仅通过指定 Agent 的快速测试","result":"只能证明该测试路径，不证明 Director 能正确选择它，也不证明车辆执行可用。"},{"condition":"草稿、禁用或其他渠道的实现","result":"不能据此计入当前渠道的运行能力。"}],"title":"能力准入与 Agent 协议","category":"配置与能力建设"},{"id":"P","scope":"这是配置平台改造 PRD 所定义的工作流程，不是所有车型现网运行事实，也不是每条用户 Query 的必经阶段。Workflow、静默通知等有不同交付节奏。","intro":"配置平台负责把“哪些车、什么条件、做什么动作”写成可执行场景。它的输出是规则配置，运行时由触发器消费。把后台保存过程插进每次语音主链路，会让人误以为用户说一句话就要重新发布规则。","sourceIds":["ASY-A19"],"steps":[{"id":"P-1","actor":"配置人员","title":"选择简单模式或 Workflow","detail":"简单模式适合平铺条件；Workflow 表达先后判断和分支汇合。模式保存后不可转换，已有 Workflow 的判断图需要复制成新版本再改。","output":"场景模式","next":"填写范围与基本信息","sourceIds":["ASY-A19"]},{"id":"P-2","actor":"配置人员","title":"确定场景属于谁、在哪些车生效","detail":"填写名称、优先级、normal/preset 分类及渠道、车辆、车型、软件版本范围。preset 会透出任务中心；注册来源与场景分类是两个不同维度。","output":"范围和场景属性","next":"配置条件","sourceIds":["ASY-A19"]},{"id":"P-3","actor":"配置人员 / 平台","title":"配置变化、状态和视觉判断","detail":"动态条件表达“刚刚变成”，静态条件表达“当前是什么”；视觉推理条件针对已有 caption 判断是或否。平台按信号类型限制运算符，禁止把视觉描述当普通字符串乱匹配。","output":"条件及其所需信号","next":"简单条件或 Workflow 图","sourceIds":["ASY-A19"]},{"id":"P-4","actor":"Workflow 画布","title":"定义判断顺序与分支汇合","detail":"条件节点内按 AND 判断；多上游节点用 AND 或 OR 汇合。全图只有一个终点，以终点有效结果为整图结果。模型推理节点只判断给定描述，不取新画面，也不生成通知文案。","output":"判断图","next":"选择动作和运行策略","sourceIds":["ASY-A19"]},{"id":"P-5","actor":"配置人员","title":"选择交互卡或静默通知等出口","detail":"系统预设建议可以走主动推荐交互卡，等待确认后再车控；闪念固定文字可走 Frontier 普通通知，不进 DT。动作决定用户后面看到什么、要不要确认。","output":"出口与频控配置","next":"保存校验","sourceIds":["ASY-A19"]},{"id":"P-6","actor":"平台校验","title":"拦截不完整或非法配置","detail":"检查图有无环、是否唯一终点、OR 是否至少两路、条件或推理目标是否为空、信号是否已接入，以及渠道是否支持视觉。含待接入信号的模板可查看编辑，但不能发布。","output":"校验通过配置或明确错误","next":"发布接入 / 返回修改","sourceIds":["ASY-A19"]},{"id":"P-7","actor":"运行触发器","title":"按订阅信号唤醒并完整判断","detail":"配置中的动态信号用于唤醒；有推理节点时订阅相应视觉信号。被唤醒后仍判断完整条件，不能把“这个信号来了”当作目标成立。具体发布权限及上线结果需以项目接入为准。","output":"PASS、REJECT 或 UNKNOWN","next":"策略控制与动作出口","sourceIds":["ASY-A19"]},{"id":"P-8","actor":"触发记录","title":"分别记录判断、动作、展示和执行","detail":"记录终点判断、动作接收、车机展示和车辆执行，节点详情保留跳过来源。输入缺失、模型失败或超时是 UNKNOWN，不与明确不满足合并。","output":"可回看的一次运行记录","next":"定位对应业务阶段","sourceIds":["ASY-A19"]}],"edges":[{"from":"P-1","to":"P-2","label":"选定模式"},{"from":"P-2","to":"P-3","label":"范围完整"},{"from":"P-3","to":"P-4","label":"Workflow 模式"},{"from":"P-3","to":"P-5","label":"简单模式"},{"from":"P-4","to":"P-5","label":"判断图完成"},{"from":"P-5","to":"P-6","label":"保存配置"},{"from":"P-6","to":"P-7","label":"完成项目发布与接入后"},{"from":"P-7","to":"P-8","label":"留下本次运行结果"}],"branches":[{"condition":"OR 一路 PASS、另一路 UNKNOWN","result":"可继续后续判断，但其他分支仍需结束，记录保留未知原因。"},{"condition":"最小间隔内再次命中","result":"判定可为 PASS，动作仍被策略拦截。"},{"condition":"仅保存成功","result":"不能据此表示发布、单车开关开启或车辆已执行。"}],"title":"场景配置与发布","category":"配置与能力建设"},{"id":"SE","scope":"本页只画有明确资料的动态示例维护与运行检索。Reflector MVP 的历史发布声明不构成完整自动学习合同，个人纠偏自动训练并发布的箭头撤下。","intro":"一条 badcase 被修复，不一定表示模型重新训练了。动态示例这条路，是把某类低频问题的正确处理写成“Query—决策分析”，在相似问题到来时检索出来给 Director 参考。它是运行前的知识维护和运行中的检索辅助。","sourceIds":["DYNAMIC-EXAMPLE","SE-DYNAMICPRD"],"steps":[{"id":"SE-1","actor":"产品 / 问题处理方","title":"判断问题是否适合动态示例","detail":"指南将简单、明确且难以抽象归类的单点问题交给动态示例；能抽取通用规律的一组问题应考虑静态示例，而不是向动态库反复堆相似条目。","output":"具体问题及修复方式","next":"编写示例","sourceIds":["DYNAMIC-EXAMPLE"]},{"id":"SE-2","actor":"示例维护方","title":"写出 Query 与决策分析","detail":"写清用户怎么问以及该选择什么工具、依赖什么信息。示例不要求复制完整输入输出，更不能写入车型没有的能力。","output":"一条候选动态示例","next":"后台维护","sourceIds":["DYNAMIC-EXAMPLE"]},{"id":"SE-3","actor":"配置后台","title":"按环境维护和管理示例","detail":"一期 PRD 提供查找、新增、修改、删除等管理功能，维护记录面向指定环境。二期审核、隔离和回退等需求不得在图里直接当作现有自动发布链。","output":"该环境的示例记录","next":"相似 Query 到来时检索","sourceIds":["SE-DYNAMICPRD"]},{"id":"SE-4","actor":"运行检索","title":"按用户 Query 找相关示例","detail":"新的 Query 到来后按相似度检索，命中的示例注入 SP 的 scenario_sample 槽位。它只补充参考内容，不绕过 Director 直接调用工具。","output":"相关示例文本","next":"Director 推理","sourceIds":["SE-DYNAMICPRD"]},{"id":"SE-5","actor":"Director","title":"结合本轮信息重新做决定","detail":"Director 同时看到当前需求、上下文、实际工具能力及命中示例，再输出自己的话术和工具计划。召回一条示例不等于模型必然采用，也不等于下游一定执行成功。","output":"本轮 action_list / talk_content","next":"D → E → O","sourceIds":["DYNAMIC-EXAMPLE","SE-DYNAMICPRD"]},{"id":"SE-6","actor":"工具及反馈链路","title":"用真实结果结束本次请求","detail":"工具执行后返回结果，Director 再决定继续处理或回复。后续若仍有问题，需要回到本次输入、召回与执行证据定位，不能把“例子已加入”当成业务已修复。","output":"本次业务结果","next":"正常输出闭环","sourceIds":["SE-DYNAMICPRD"]}],"edges":[{"from":"SE-1","to":"SE-2","label":"适合单点动态示例"},{"from":"SE-2","to":"SE-3","label":"提交维护"},{"from":"SE-3","to":"SE-4","label":"对应环境运行时检索"},{"from":"SE-4","to":"SE-5","label":"注入相关示例"},{"from":"SE-5","to":"SE-6","label":"产生正常工具调用"}],"branches":[{"condition":"Reflector / 个人成长自动闭环","result":"当前已读材料不足以确认完整输入、触发、存储、审核、生效合同，不在运行图中补造这些节点。"},{"condition":"模型训练与动态示例","result":"是不同优化路径；本页动态检索不意味着修改了模型权重。"}],"title":"自进化","category":"配置与能力建设"}],"sources":[{"id":"VOICE-ONEPAGE","title":"AI汽车语音基础体验链路OnePager","url":"https://bytedance.larkoffice.com/wiki/GBcCw5c6xiWvGukPMQgcMiuKnEc"},{"id":
