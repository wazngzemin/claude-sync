<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 2700" font-family="Noto Sans SC">
  <!-- 本次补充区：位于原图下方 -->
  <rect x="50" y="2200" width="1620" height="470" rx="10" fill="#fff8e1" stroke="#f9ab00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="70" y="2230" font-size="16" font-weight="700" fill="#7a5c00">本次补充：R19–R24（按 2026-10 PRD 与会议口径补的产品规则）</text>

  <!-- R19 预请求提前判断与作废 -->
  <rect x="70" y="2250" width="370" height="130" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="85" y="2272" font-size="13" font-weight="700" fill="#1a1a1a">R19 预请求提前判断与作废</text>
  <text x="85" y="2292" font-size="11" fill="#3c4043">要点：停顿 300ms 先做拒识和上下文准备</text>
  <text x="85" y="2310" font-size="11" fill="#3c4043">① 正式请求来了直接用，体感快约 200 毫秒</text>
  <text x="85" y="2328" font-size="11" fill="#3c4043">② 用户中途改口或文字变了，提前结果作废</text>
  <text x="85" y="2346" font-size="11" fill="#3c4043">③ 这时只是"提前备着"，还没代表要执行</text>

  <!-- R20 离线白名单范围 -->
  <rect x="460" y="2250" width="370" height="130" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="475" y="2272" font-size="13" font-weight="700" fill="#1a1a1a">R20 离线白名单范围</text>
  <text x="475" y="2292" font-size="11" fill="#3c4043">要点：只有本车已交付的离线车控可执行</text>
  <text x="475" y="2310" font-size="11" fill="#3c4043">① 断网或云端 3 秒超时后才启用</text>
  <text x="475" y="2328" font-size="11" fill="#3c4043">② 联网搜索、复杂规划始终走云端</text>
  <text x="475" y="2346" font-size="11" fill="#b3261e">③ 网络恢复与重同步规则【待核】</text>

  <!-- R21 拒识三级架构 -->
  <rect x="850" y="2250" width="370" height="130" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="865" y="2272" font-size="13" font-weight="700" fill="#1a1a1a">R21 拒识三级架构</text>
  <text x="865" y="2292" font-size="11" fill="#3c4043">离线高精准匹配 → 云端阶段一高召回</text>
  <text x="865" y="2310" font-size="11" fill="#3c4043">→ Director 兜底 → Advisor 回捞</text>
  <text x="865" y="2328" font-size="11" fill="#b3261e">① 分级与各层阈值【讨论中】</text>

  <!-- R22 同一句话端云两份结果 -->
  <rect x="1240" y="2250" width="420" height="130" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="1255" y="2272" font-size="13" font-weight="700" fill="#1a1a1a">R22 同一句话端云两份结果</text>
  <text x="1255" y="2292" font-size="11" fill="#3c4043">要点：靠同一请求编号对上</text>
  <text x="1255" y="2310" font-size="11" fill="#3c4043">① 端侧先回但不执行，等云端最终判定</text>
  <text x="1255" y="2328" font-size="11" fill="#3c4043">② 旧结果或不同编号不能串单</text>

  <!-- R23 高风险二次确认 -->
  <rect x="70" y="2410" width="370" height="130" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="85" y="2432" font-size="13" font-weight="700" fill="#7f1d1d">R23 高风险二次确认</text>
  <text x="85" y="2452" font-size="11" fill="#3c4043">要点：关 ESP、解儿童锁、支付停车费</text>
  <text x="85" y="2470" font-size="11" fill="#3c4043">① 仅主驾可下，或必须二次确认</text>
  <text x="85" y="2488" font-size="11" fill="#3c4043">② 副驾说"解儿童锁"→只跟主驾确认</text>

  <!-- R24 拒识话题继承 -->
  <rect x="460" y="2410" width="370" height="130" rx="6" fill="#e6f4ea" stroke="#34A853" stroke-width="1.5"/>
  <text x="475" y="2432" font-size="13" font-weight="700" fill="#1e7e34">R24 拒识话题继承</text>
  <text x="475" y="2452" font-size="11" fill="#3c4043">要点：被拒识聊天每 5 轮总结一次话题</text>
  <text x="475" y="2470" font-size="11" fill="#3c4043">① 真召回时把前 5 个话题当上文</text>
  <text x="475" y="2488" font-size="11" fill="#3c4043">② 8 类：日常/兴趣/科技/工作/时事/情感/健康/旅行</text>

  <!-- R25 上线状态角标 -->
  <rect x="850" y="2410" width="370" height="130" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="865" y="2432" font-size="13" font-weight="700" fill="#3c4043">状态角标</text>
  <text x="865" y="2452" font-size="11" fill="#3c4043">已落地：R1–R18 主链与端云编号对齐</text>
  <text x="865" y="2470" font-size="11" fill="#3c4043">2.6 目标：R19 预请求体感优化</text>
  <text x="865" y="2488" font-size="11" fill="#3c4043">讨论中：R21 拒识三级阈值</text>
  <text x="865" y="2506" font-size="11" fill="#3c4043">待核：R20 网络恢复重同步规则</text>
</svg>
