  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">专家知识支线：从当前情景到 Director 的实际输入</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><text class="anno" x="340" y="103" text-anchor="middle" dominant-baseline="central">动态知识检索需求定义的处理链；不等于全部车型已部署</text><polyline class="arr" fill="none" points="350,237 350,303" marker-end="url(#arrow-SE-knowledge-load-detail)"><title>KL1 → KL2：交付本轮事实与已有知识清单</title></polyline><polyline class="arr" fill="none" points="350,405 350,471" marker-end="url(#arrow-SE-knowledge-load-detail)"><title>KL2 → KL3：场景信息不足</title></polyline><polyline class="arr" fill="none" points="176,357 50,357 50,686 170,686" marker-end="url(#arrow-SE-knowledge-load-detail)"><title>KL2 → KL4：能够判定相关知识</title></polyline><polyline class="arr" fill="none" points="350,563 350,629" marker-end="url(#arrow-SE-knowledge-load-detail)"><title>KL3 → KL4：新增为空，并带回缺少信息的说明</title></polyline><polyline class="arr" fill="none" points="350,734 350,800" marker-end="url(#arrow-SE-knowledge-load-detail)"><title>KL4 → KL5：知识编号与增删动作</title></polyline><polyline class="arr" fill="none" points="350,892 350,958" marker-end="url(#arrow-SE-knowledge-load-detail)"><title>KL5 → KL6：选中的实际知识正文</title></polyline><polyline class="arr" fill="none" points="350,1050 350,1116" marker-end="url(#arrow-SE-knowledge-load-detail)"><title>KL6 → KL7：本轮 SP 中的 knowledge</title></polyline><polyline class="arr" fill="none" points="350,1218 350,1284" marker-end="url(#arrow-SE-knowledge-load-detail)"><title>KL7 → KL8：需要动作时下发 action_list</title></polyline><polyline class="arr" fill="none" points="176,1338 110,1338 110,1170 170,1170" marker-end="url(#arrow-SE-knowledge-load-detail)"><title>KL8 → KL7：tool_feedback 支撑下一步判断</title></polyline><text class="ts" x="365" y="273" text-anchor="start" dominant-baseline="central">E1 · 交付本轮事实与已有知识清单</text><text class="ts" x="365" y="441" text-anchor="start" dominant-baseline="central">E2 · 场景信息不足</text><text class="ts" x="168" y="349" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="168" y="698" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="365" y="599" text-anchor="start" dominant-baseline="central">E4 · 新增为空，并带回缺少信息的说明</text><text class="ts" x="365" y="770" text-anchor="start" dominant-baseline="central">E5 · 知识编号与增删动作</text><text class="ts" x="365" y="928" text-anchor="start" dominant-baseline="central">E6 · 选中的实际知识正文</text><text class="ts" x="365" y="1086" text-anchor="start" dominant-baseline="central">E7 · 本轮 SP 中的 knowledge</text><text class="ts" x="365" y="1254" text-anchor="start" dominant-baseline="central">E8 · 需要动作时下发 action_list</text><text class="ts" x="168" y="1330" text-anchor="end" dominant-baseline="central">E9</text><text class="ts" x="168" y="1182" text-anchor="end" dominant-baseline="central">E9</text><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="SE-knowledge-load-detail" data-step="KL1" aria-label="准备当前请求与背景"><title>Query、近期说话历史、目标队列、最新车况、已加载知识编号。</title><rect x="180" y="142" width="340" height="91" rx="6"/><text class="th" x="198" y="166" text-anchor="start" dominant-baseline="central">准备当前请求与背景</text><text class="ts" x="198" y="194" text-anchor="start" dominant-baseline="central">Query、近期说话历史、目标队列、最新车况、已加</text><text class="ts" x="198" y="213" text-anchor="start" dominant-baseline="central">载知识编号。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-knowledge-load-detail" data-step="KL2" aria-label="判断当前场景及持续目标"><title>对比哪些知识仍需要，哪些需要补充或移除。</title><rect x="180" y="313" width="340" height="88" rx="6"/><text class="th" x="198" y="337" text-anchor="start" dominant-baseline="central">判断当前场景及持续目标</text><text class="ts" x="198" y="365" text-anchor="start" dominant-baseline="central">对比哪些知识仍需要，哪些需要补充或移除。</text></g><text class="anno" x="540" y="337" text-anchor="start" dominant-baseline="central">E3 · 能够判定相</text><text class="anno" x="540" y="356" text-anchor="start" dominant-baseline="central">关知识</text><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-knowledge-load-detail" data-step="KL3" aria-label="场景不足时保持空新增"><title>说明需下游进一步确认；不凭空补成某类任务。</title><rect x="180" y="481" width="340" height="78" rx="6"/><text class="th" x="198" y="505" text-anchor="start" dominant-baseline="central">场景不足时保持空新增</text><text class="ts" x="198" y="533" text-anchor="start" dominant-baseline="central">说明需下游进一步确认；不凭空补成某类任务。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-knowledge-load-detail" data-step="KL4" aria-label="返回知识编号增删结果"><title>add_knowledge_ids、remove_knowledge_ids 及各自原因。</title><rect x="180" y="639" width="340" height="91" rx="6"/><text class="th" x="198" y="663" text-anchor="start" dominant-baseline="central">返回知识编号增删结果</text><text class="ts" x="198" y="691" text-anchor="start" dominant-baseline="central">add_knowledge_ids、remove_knowledge_ids 及各</text><text class="ts" x="198" y="710" text-anchor="start" dominant-baseline="central">自原因。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-knowledge-load-detail" data-step="KL5" aria-label="按编号取得并拼接知识正文"><title>保留仍支撑目标的知识，移除已不适用内容。</title><rect x="180" y="810" width="340" height="78" rx="6"/><text class="th" x="198" y="834" text-anchor="start" dominant-baseline="central">按编号取得并拼接知识正文</text><text class="ts" x="198" y="862" text-anchor="start" dominant-baseline="central">保留仍支撑目标的知识，移除已不适用内容。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-knowledge-load-detail" data-step="KL6" aria-label="把正文装入 knowledge"><title>与本轮请求和其它背景一起成为 Director 输入。</title><rect x="180" y="968" width="340" height="78" rx="6"/><text class="th" x="198" y="992" text-anchor="start" dominant-baseline="central">把正文装入 knowledge</text><text class="ts" x="198" y="1020" text-anchor="start" dominant-baseline="central">与本轮请求和其它背景一起成为 Director 输入。</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="SE-knowledge-load-detail" data-step="KL7" aria-label="Director 决定当前动作或澄清"><title>结合本次事实、用户意图和真实工具能力使用知识。</title><rect x="180" y="1126" width="340" height="88" rx="6"/><text class="th" x="198" y="1150" text-anchor="start" dominant-baseline="central">Director 决定当前动作或澄清</text><text class="ts" x="198" y="1178" text-anchor="start" dominant-baseline="central">结合本次事实、用户意图和真实工具能力使用知识。</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="SE-knowledge-load-detail" data-step="KL8" aria-label="执行工具并返回实际结果"><title>结果回到当前推理；知识命中本身不是任务成功。</title><rect x="180" y="1294" width="340" height="93" rx="6"/><text class="th" x="198" y="1318" text-anchor="start" dominant-baseline="central">执行工具并返回实际结果</text><text class="ts" x="198" y="1346" text-anchor="start" dominant-baseline="central">结果回到当前推理；知识命中本身不是任务成功。</text></g><text class="anno" x="540" y="1318" text-anchor="start" dominant-baseline="central">E9 ·</text><text class="anno" x="540" y="1337" text-anchor="start" dominant-baseline="central">tool_feedback</text><text class="anno" x="540" y="1356" text-anchor="start" dominant-baseline="central">支撑下一步判断</text><text class="th" x="40" y="1471" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1501" text-anchor="start" dominant-baseline="central">E1 准备当前请求与背景 → 判断当前场景及持续目标：交付本轮事实与已有知识清单</text><text class="ts" x="40" y="1534" text-anchor="start" dominant-baseline="central">E2 判断当前场景及持续目标 → 场景不足时保持空新增：场景信息不足</text><text class="ts" x="40" y="1567" text-anchor="start" dominant-baseline="central">E3 判断当前场景及持续目标 → 返回知识编号增删结果：能够判定相关知识</text><text class="ts" x="40" y="1600" text-anchor="start" dominant-baseline="central">E4 场景不足时保持空新增 → 返回知识编号增删结果：新增为空，并带回缺少信息的说明</text><text class="ts" x="40" y="1633" text-anchor="start" dominant-baseline="central">E5 返回知识编号增删结果 → 按编号取得并拼接知识正文：知识编号与增删动作</text><text class="ts" x="40" y="1666" text-anchor="start" dominant-baseline="central">E6 按编号取得并拼接知识正文 → 把正文装入 knowledge：选中的实际知识正文</text><text class="ts" x="40" y="1699" text-anchor="start" dominant-baseline="central">E7 把正文装入 knowledge → Director 决定当前动作或澄清：本轮 SP 中的 knowledge</text><text class="ts" x="40" y="1732" text-anchor="start" dominant-baseline="central">E8 Director 决定当前动作或澄清 → 执行工具并返回实际结果：需要动作时下发 action_list</text><text class="ts" x="40" y="1765" text-anchor="start" dominant-baseline="central">E9 执行工具并返回实际结果 → Director 决定当前动作或澄清：tool_feedback 支撑下一步判断</text></svg>