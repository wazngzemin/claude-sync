<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1290" viewBox="0 0 1200 1290" role="img" aria-label="一个动作从 DT 下发到结果回到 DT：8 个步骤"><title>一个动作从 DT 下发到结果回到 DT：8 个步骤</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="1290" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">一个动作从 DT 下发到结果回到 DT：8 个步骤</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左列云端，右列车上；以 9 月 14 日路测“副驾空调调到 4 度”为例</text><rect x="30" y="92" width="560" height="1070" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端（DT、调工具的服务、车控模型、输入管理）</text><rect x="610" y="92" width="560" height="1070" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="624" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上（车控应用、车辆服务、播报）</text><rect x="50" y="130" width="520" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="70" cy="152" r="12" fill="#4a9670"/><text x="70" y="157" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="90" y="157" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 交出动作清单</text><text x="64" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">每个动作 = 工具名 + 一句话指令</text><text x="64" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同轮同时发；有依赖就分两轮</text><rect x="50" y="258" width="520" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="70" cy="280" r="12" fill="#4a9670"/><text x="70" y="285" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="90" y="285" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">找到本项目的工具实现</text><text x="64" y="310" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按项目渠道查“定义”和“实现”</text><text x="64" y="331" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">自研、采买（如弋途）或车端</text><rect x="50" y="386" width="520" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="70" cy="408" r="12" fill="#4a9670"/><text x="70" y="413" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="90" y="413" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">车控类：一句话翻成函数</text><text x="64" y="438" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“调到4度”→ 空调温度调节（函数）</text><text x="64" y="459" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">赛力斯：车控模型优先，越界用候选</text><rect x="50" y="514" width="520" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="70" cy="536" r="12" fill="#4a9670"/><text x="70" y="541" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="90" y="541" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">经长连接下发到车</text><text x="64" y="566" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">看推给这辆车的结果码</text><text x="64" y="587" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">排查口径：10 秒没结果转车端</text><rect x="630" y="642" width="520" height="92" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="650" cy="664" r="12" fill="#4f7ea9"/><text x="650" y="669" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="670" y="669" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上执行，回一个结果</text><text x="644" y="694" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车控应用调车辆服务</text><text x="644" y="715" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">受车上控制器版本影响</text><rect x="50" y="770" width="520" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="70" cy="792" r="12" fill="#4a9670"/><text x="70" y="797" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="90" y="797" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">回执改写成一句话</text><text x="64" y="822" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">成功写函数名；失败带原因；超时勿重复</text><text x="64" y="843" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">赛力斯：成功但没写说明，补成“执行成功”</text><rect x="50" y="898" width="520" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="70" cy="920" r="12" fill="#4a9670"/><text x="70" y="925" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="90" y="925" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">整批经输入管理回 DT</text><text x="64" y="950" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这一轮的结果全部回来再交</text><text x="64" y="971" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">订座等长程任务的结果单独排队</text><rect x="50" y="1026" width="520" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="70" cy="1048" r="12" fill="#4a9670"/><text x="70" y="1053" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">8</text><text x="90" y="1053" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 再推理、统一播报</text><text x="64" y="1078" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说一次“都调好了”；失败要说清</text><text x="64" y="1099" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">简单车控走车上模板（PRD，待确认）</text><path d="M310,222 L310,258" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="358.55" y="229" width="182.9" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="450" y="245" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">放行（新版输入管理，开发中）</text><path d="M310,350 L310,386" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,478 L310,514" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,606 L310,624 L890,624 L890,642" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="582.65" y="614" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600.0" y="630" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">函数</text><path d="M890,734 L890,752 L310,752 L310,770" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="570.3" y="742" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600.0" y="758" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">执行回执</text><path d="M310,862 L310,898" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,990 L310,1026" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M570,1072 L630,1072" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="630" y="1040" width="520" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="644" y="1067" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上播出“都调好了”</text><path d="M50,1100 L40,1100 L40,176 L50,176" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="46" y="640" font-size="13" fill="#3c5a73" font-weight="600" text-anchor="start">下一轮</text><rect x="30" y="1185" width="1140" height="82" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="44" y="1212" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">旁路（不经过 DT）：云端车控干预</text><text x="44" y="1237" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说法命中云端干预规则，直接把车控指令发给车，用车上的播报；方案计划 7/24 上线，各项目是否开启待确认</text></g></svg>