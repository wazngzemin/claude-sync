<svg xmlns="http://www.w3.org/2000/svg" width="2265" height="1942" viewBox="0 0 2265 1942" role="img" aria-label="播报、展示与真实结果"><title>播报、展示与真实结果</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M695,226 L695,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="693" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="698" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="698" dy="0">话术和语气</tspan></text><path d="M565,226 L565,264 L235,264 L235,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="63" y="322" width="175" height="44" rx="3" fill="#fff"/><text x="68" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="68" dy="0">emoji 与交互信息</tspan></text><path d="M695,644 L695,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="583" y="740" width="115" height="44" rx="3" fill="#fff"/><text x="588" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="588" dy="0">合成或缓存音频</tspan></text><path d="M695,1062 L695,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="598" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="603" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="603" dy="0">播完或被打断</tspan></text><path d="M1615,1480 L1615,1664 L890,1664 L890,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1428" y="1576" width="190" height="44" rx="3" fill="#fff"/><text x="1433" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="1433" dy="0">卡片内容供用户理解/选择</tspan></text><path d="M1155,1480 L1155,1654 L792,1654 L792,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="983" y="1576" width="175" height="44" rx="3" fill="#fff"/><text x="988" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="988" dy="0">工具回流后形成结果说明</tspan></text><path d="M695,1480 L695,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="463" y="1576" width="235" height="44" rx="3" fill="#fff"/><text x="468" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="468" dy="0">正常结束或有效新输入进入下一轮</tspan></text><path d="M987,1870 L1885,1870 L1885,69 L825,69" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1892" y="1848" width="145" height="44" rx="3" fill="#fff"/><text x="1897" y="1872" font-size="15" fill="#435c70" font-weight="400"><tspan x="1897" dy="0">下一轮生成新的表达</tspan></text><a href="#module/O/step/O01"><g data-step="O01"><rect x="435" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">O01</tspan></text><text x="455" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">接收本轮要表达的内容</tspan></text><text x="455" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">Director 输出处理</tspan></text><text x="455" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">文字、语气、表情</tspan></text></g></a><a href="#module/O/step/O02"><g data-step="O02"><rect x="500" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">O02</tspan></text><text x="520" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">选择在线、离线或缓存音频</tspan></text><text x="520" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">TTS 调度</tspan></text><text x="520" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">本次可播放的音频来源</tspan></text></g></a><a href="#module/O/step/O03"><g data-step="O03"><rect x="500" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">O03</tspan></text><text x="520" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">把文字变成音频并真正播出</tspan></text><text x="520" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">语音合成与播放器</tspan></text><text x="520" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">播放中的音频与播放进度</tspan></text></g></a><a href="#module/O/step/O04"><g data-step="O04"><rect x="40" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">O04</tspan></text><text x="60" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">同步展示表情与交互状态</tspan></text><text x="60" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">机器人与交互界面</tspan></text><text x="60" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">用户可见的表情与状态</tspan></text></g></a><a href="#module/O/step/O05"><g data-step="O05"><rect x="1420" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1420" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="1440" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1440" dy="0">O05</tspan></text><text x="1440" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="1440" dy="0">展示属于本次工具结果的内容</tspan></text><text x="1440" y="1401" font-size="16" fi