<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 2028" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <style>
    .t  { font-size: 14px; font-weight: 400; fill: #2C2C2A; }
    .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .title   { font-size: 20px; font-weight: 600; fill: #2C2C2A; }
    .eyebrow { font-size: 10px; font-weight: 500; fill: #888780; letter-spacing: 1.2px; text-transform: uppercase; }
    .caption { font-size: 12px; font-weight: 400; fill: #888780; font-style: italic; }
    .anno    { font-size: 12px; font-weight: 400; fill: #888780; }
    .box   { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.5; }
    .row-alt { fill: #FFFFFF; stroke: #D3D1C7; stroke-width: 0.5; }
    .arr   { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .arr-alt { fill: none; stroke: #5F5E5A; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .leader{ fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 3 3; }
    .lifeline { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }

    .arr-gray   { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .arr-blue   { fill: none; stroke: #185FA5; stroke-width: 1.5; }
    .arr-teal   { fill: none; stroke: #0F6E56; stroke-width: 1.5; }
    .arr-purple { fill: none; stroke: #534AB7; stroke-width: 1.5; }
    .arr-coral  { fill: none; stroke: #993C1D; stroke-width: 1.5; }
    .arr-pink   { fill: none; stroke: #993556; stroke-width: 1.5; }
    .arr-amber  { fill: none; stroke: #854F0B; stroke-width: 1.5; }
    .arr-green  { fill: none; stroke: #3B6D11; stroke-width: 1.5; }
    .arr-red    { fill: none; stroke: #A32D2D; stroke-width: 1.5; }

    .c-gray   > rect, .c-gray   > circle, .c-gray   > ellipse, rect.c-gray, circle.c-gray, ellipse.c-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .c-gray   .th, .c-gray   .t  { fill: #444441; }
    .c-gray   .ts                { fill: #5F5E5A; }

    .c-blue   > rect, .c-blue   > circle, .c-blue   > ellipse, rect.c-blue, circle.c-blue, ellipse.c-blue { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
    .c-blue   .th, .c-blue   .t  { fill: #0C447C; }
    .c-blue   .ts                { fill: #185FA5; }

    .c-teal   > rect, .c-teal   > circle, .c-teal   > ellipse, rect.c-teal, circle.c-teal, ellipse.c-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .c-teal   .th, .c-teal   .t  { fill: #085041; }
    .c-teal   .ts                { fill: #0F6E56; }

    .c-purple > rect, .c-purple > circle, .c-purple > ellipse, rect.c-purple, circle.c-purple, ellipse.c-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .c-purple .th, .c-purple .t  { fill: #3C3489; }
    .c-purple .ts                { fill: #534AB7; }

    .c-coral  > rect, .c-coral  > circle, .c-coral  > ellipse, rect.c-coral, circle.c-coral, ellipse.c-coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
    .c-coral  .th, .c-coral  .t  { fill: #712B13; }
    .c-coral  .ts                { fill: #993C1D; }

    .c-pink   > rect, .c-pink   > circle, .c-pink   > ellipse, rect.c-pink, circle.c-pink, ellipse.c-pink { fill: #FBEAF0; stroke: #993556; stroke-width: 0.5; }
    .c-pink   .th, .c-pink   .t  { fill: #72243E; }
    .c-pink   .ts                { fill: #993556; }

    .c-amber  > rect, .c-amber  > circle, .c-amber  > ellipse, rect.c-amber, circle.c-amber, ellipse.c-amber { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
    .c-amber  .th, .c-amber  .t  { fill: #633806; }
    .c-amber  .ts                { fill: #854F0B; }

    .c-green  > rect, .c-green  > circle, .c-green  > ellipse, rect.c-green, circle.c-green, ellipse.c-green { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
    .c-green  .th, .c-green  .t  { fill: #27500A; }
    .c-green  .ts                { fill: #3B6D11; }

    .c-red    > rect, .c-red    > circle, .c-red    > ellipse, rect.c-red, circle.c-red, ellipse.c-red { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 0.5; }
    .c-red    .th, .c-red    .t  { fill: #791F1F; }
    .c-red    .ts                { fill: #A32D2D; }

    @media (prefers-color-scheme: dark) {
      .t, .th { fill: #F1EFE8; }
      .ts     { fill: #B4B2A9; }
      .title   { fill: #F1EFE8; }
      .eyebrow { fill: #888780; }
      .caption { fill: #888780; }
      .anno    { fill: #888780; }
      .box    { fill: #2C2C2A; stroke: #888780; }
      .row-alt { fill: #444441; stroke: #5F5E5A; }
      .arr    { stroke: #B4B2A9; }
      .arr-alt { stroke: #B4B2A9; }
      .leader { stroke: #888780; }
      .lifeline { stroke: #5F5E5A; }

      .arr-gray   { stroke: #B4B2A9; }
      .arr-blue   { stroke: #85B7EB; }
      .arr-teal   { stroke: #5DCAA5; }
      .arr-purple { stroke: #AFA9EC; }
      .arr-coral  { stroke: #F0997B; }
      .arr-pink   { stroke: #ED93B1; }
      .arr-amber  { stroke: #EF9F27; }
      .arr-green  { stroke: #97C459; }
      .arr-red    { stroke: #F09595; }

      .c-gray   > rect, .c-gray   > circle, .c-gray   > ellipse, rect.c-gray, circle.c-gray, ellipse.c-gray { fill: #444441; stroke: #B4B2A9; }
      .c-gray   .th, .c-gray   .t  { fill: #F1EFE8; }
      .c-gray   .ts                { fill: #D3D1C7; }

      .c-blue   > rect, .c-blue   > circle, .c-blue   > ellipse, rect.c-blue, circle.c-blue, ellipse.c-blue { fill: #0C447C; stroke: #85B7EB; }
      .c-blue   .th, .c-blue   .t  { fill: #B5D4F4; }
      .c-blue   .ts                { fill: #85B7EB; }

      .c-teal   > rect, .c-teal   > circle, .c-teal   > ellipse, rect.c-teal, circle.c-teal, ellipse.c-teal { fill: #085041; stroke: #5DCAA5; }
      .c-teal   .th, .c-teal   .t  { fill: #9FE1CB; }
      .c-teal   .ts                { fill: #5DCAA5; }

      .c-purple > rect, .c-purple > circle, .c-purple > ellipse, rect.c-purple, circle.c-purple, ellipse.c-purple { fill: #3C3489; stroke: #AFA9EC; }
      .c-purple .th, .c-purple .t  { fill: #CECBF6; }
      .c-purple .ts                { fill: #AFA9EC; }

      .c-coral  > rect, .c-coral  > circle, .c-coral  > ellipse, rect.c-coral, circle.c-coral, ellipse.c-coral { fill: #712B13; stroke: #F0997B; }
      .c-coral  .th, .c-coral  .t  { fill: #F5C4B3; }
      .c-coral  .ts                { fill: #F0997B; }

      .c-pink   > rect, .c-pink   > circle, .c-pink   > ellipse, rect.c-pink, circle.c-pink, ellipse.c-pink { fill: #72243E; stroke: #ED93B1; }
      .c-pink   .th, .c-pink   .t  { fill: #F4C0D1; }
      .c-pink   .ts                { fill: #ED93B1; }

      .c-amber  > rect, .c-amber  > circle, .c-amber  > ellipse, rect.c-amber, circle.c-amber, ellipse.c-amber { fill: #633806; stroke: #EF9F27; }
      .c-amber  .th, .c-amber  .t  { fill: #FAC775; }
      .c-amber  .ts                { fill: #EF9F27; }

      .c-green  > rect, .c-green  > circle, .c-green  > ellipse, rect.c-green, circle.c-green, ellipse.c-green { fill: #27500A; stroke: #97C459; }
      .c-green  .th, .c-green  .t  { fill: #C0DD97; }
      .c-green  .ts                { fill: #97C459; }

      .c-red    > rect, .c-red    > circle, .c-red    > ellipse, rect.c-red, circle.c-red, ellipse.c-red { fill: #791F1F; stroke: #F09595; }
      .c-red    .th, .c-red    .t  { fill: #F7C1C1; }
      .c-red    .ts                { fill: #F09595; }
    }
  </style>
  <defs>
    <marker id="arrow-A-visual-consumption-options" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">视觉消费两种方案的业务差异</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr-alt" fill="none" points="350,253 350,319" marker-end="url(#arrow-A-visual-consumption-options)"><title>AO1 → AO2：备选方案一：需开放画面描述；不是自动分流条件</title></polyline><polyline class="arr" fill="none" points="350,462 350,528" marker-end="url(#arrow-A-visual-consumption-options)"><title>AO2 → AO3：整包上传后由云端模型解释</title></polyline><polyline class="arr-alt" fill="none" points="176,150 50,150 50,832 170,832" marker-end="url(#arrow-A-visual-consumption-options)"><title>AO1 → AO4：备选方案二：先定义有限内容；不是默认降级</title></polyline><polyline class="arr" fill="none" points="350,880 350,946" marker-end="url(#arrow-A-visual-consumption-options)"><title>AO4 → AO5：返回约定字段后进行规则判断</title></polyline><polyline class="arr-alt" fill="none" points="176,582 70,582 70,1288 170,1288" marker-end="url(#arrow-A-visual-consumption-options)"><title>AO3 → AO6：验证开放路线的实际效果与代价</title></polyline><polyline class="arr-alt" fill="none" points="350,1108 350,1174" marker-end="url(#arrow-A-visual-consumption-options)"><title>AO5 → AO6：验证结构化路线的范围与责任</title></polyline><polyline class="arr-alt" fill="none" points="350,1336 350,1402" marker-end="url(#arrow-A-visual-consumption-options)"><title>AO6 → AO7：选型、字段合同和接入验收通过后</title></polyline><text class="ts" x="365" y="280" text-anchor="start" dominant-baseline="central">E1 · 备选方案一：需开放画面描述；不是自动</text><text class="ts" x="365" y="299" text-anchor="start" dominant-baseline="central">分流条件</text><text class="ts" x="365" y="498" text-anchor="start" dominant-baseline="central">E2 · 整包上传后由云端模型解释</text><text class="ts" x="168" y="142" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="168" y="844" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="365" y="916" text-anchor="start" dominant-baseline="central">E4 · 返回约定字段后进行规则判断</text><text class="ts" x="168" y="574" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="168" y="1300" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="365" y="1144" text-anchor="start" dominant-baseline="central">E6 · 验证结构化路线的范围与责任</text><text class="ts" x="365" y="1372" text-anchor="start" dominant-baseline="central">E7 · 选型、字段合同和接入验收通过后</text><g class="c-gray" role="link" tabindex="0" data-page="A" data-flow="A-visual-consumption-options" data-step="AO1" aria-label="先明确要服务的场景与判断条件"><title>例如要判断某个确定状态，还是理解开放画面含义。；先写清需要的结果，不能只因为有 VLM 就认定任务可触发。</title><rect x="180" y="106" width="340" height="143" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">先明确要服务的场景与判断条件</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">例如要判断某个确定状态，还是理解开放画面含义。</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central">先写清需要的结果，不能只因为有 VLM 就认定任务</text><text class="ts" x="198" y="215" text-anchor="start" dominant-baseline="central">可触发。</text></g><text class="anno" x="540" y="130" text-anchor="start" dominant-baseline="central">方案选择前</text><text class="anno" x="540" y="161" text-anchor="start" dominant-baseline="central">E3 · 备选方案二</text><text class="anno" x="540" y="180" text-anchor="start" dominant-baseline="central">：先定义有限内</text><text class="anno" x="540" y="199" text-anchor="start" dominant-baseline="central">容；不是默认降</text><text class="anno" x="540" y="218" text-anchor="start" dominant-baseline="central">级</text><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-visual-consumption-options" data-step="AO2" aria-label="方案一：视觉输出开放描述"><title>视觉结果用自然语言描述，原方案将其整包上传。；文字描述仍只是观察结果，不是用户命令或已触发通知。</title><rect x="180" y="329" width="340" height="129" rx="6"/><text class="th" x="198" y="353" text-anchor="start" dominant-baseline="central">方案一：视觉输出开放描述</text><text class="ts" x="198" y="381" text-anchor="start" dominant-baseline="central">视觉结果用自然语言描述，原方案将其整包上传。</text><text class="ts" x="198" y="400" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="419" text-anchor="start" dominant-baseline="central">文字描述仍只是观察结果，不是用户命令或已触发通</text><text class="ts" x="198" y="438" text-anchor="start" dominant-baseline="central">知。</text></g><text class="anno" x="540" y="353" text-anchor="start" dominant-baseline="central">Caption 路线</text><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-visual-consumption-options" data-step="AO3" aria-label="云端模型理解描述并判断静态任务"><title>模型需要将画面描述与目标条件关联。；原文提出长期成本、并发和全链路时延风险；没有给出已验证数值。</title><rect x="180" y="538" width="340" height="129" rx="6"/><text class="th" x="198" y="562" text-anchor="start" dominant-baseline="central">云端模型理解描述并判断静态任务</text><text class="ts" x="198" y="590" text-anchor="start" dominant-baseline="central">模型需要将画面描述与目标条件关联。</text><text class="ts" x="198" y="609" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="628" text-anchor="start" dominant-baseline="central">原文提出长期成本、并发和全链路时延风险；没有给</text><text class="ts" x="198" y="647" text-anchor="start" dominant-baseline="central">出已验证数值。</text></g><text class="anno" x="540" y="562" text-anchor="start" dominant-baseline="central">E5 · 验证开放路</text><text class="anno" x="540" y="581" text-anchor="start" dominant-baseline="central">线的实际效果与</text><text class="anno" x="540" y="600" text-anchor="start" dominant-baseline="central">代价</text><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-visual-consumption-options" data-step="AO4" aria-label="方案二：预定义有限识别内容"><title>先约定内容和格式，结果放进 Always-on 整包 JSON。；没有定义的观察能力不能靠规则临时变出来。</title><rect x="180" y="747" width="340" height="129" rx="6"/><text class="th" x="198" y="771" text-anchor="start" dominant-baseline="central">方案二：预定义有限识别内容</text><text class="ts" x="198" y="799" text-anchor="start" dominant-baseline="central">先约定内容和格式，结果放进 Always-on 整包 </text><text class="ts" x="198" y="818" text-anchor="start" dominant-baseline="central">JSON。</text><text class="ts" x="198" y="837" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="856" text-anchor="start" dominant-baseline="central">没有定义的观察能力不能靠规则临时变出来。</text></g><text class="anno" x="540" y="771" text-anchor="start" dominant-baseline="central">结构化路线</text><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-visual-consumption-options" data-step="AO5" aria-label="云端取字段，再用规则判断"><title>按约定字段判定是否符合条件，不每次理解自由文本。；取字段由谁负责原文未定；缺值和无效值的处理需补合同。</title><rect x="180" y="956" width="340" height="148" rx="6"/><text class="th" x="198" y="980" text-anchor="start" dominant-baseline="central">云端取字段，再用规则判断</text><text class="ts" x="198" y="1008" text-anchor="start" dominant-baseline="central">按约定字段判定是否符合条件，不每次理解自由文本</text><text class="ts" x="198" y="1027" text-anchor="start" dominant-baseline="central">。</text><text class="ts" x="198" y="1046" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1065" text-anchor="start" dominant-baseline="central">取字段由谁负责原文未定；缺值和无效值的处理需补</text><text class="ts" x="198" y="1084" text-anchor="start" dominant-baseline="central">合同。</text></g><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-visual-consumption-options" data-step="AO6" aria-label="分别验证覆盖、误判、时延与资源成本"><title>用同一场景集合对比，包括未定义对象、遮挡和状态缺失。；指标是待定义的产品验收建议；不能用单次成功代替稳定可用。</title><rect x="180" y="1184" width="340" height="148" rx="6"/><text class="th" x="198" y="1208" text-anchor="start" dominant-baseline="central">分别验证覆盖、误判、时延与资源成本</text><text class="ts" x="198" y="1236" text-anchor="start" dominant-baseline="central">用同一场景集合对比，包括未定义对象、遮挡和状态</text><text class="ts" x="198" y="1255" text-anchor="start" dominant-baseline="central">缺失。</text><text class="ts" x="198" y="1274" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1293" text-anchor="start" dominant-baseline="central">指标是待定义的产品验收建议；不能用单次成功代替</text><text class="ts" x="198" y="1312" text-anchor="start" dominant-baseline="central">稳定可用。</text></g><text class="anno" x="540" y="1208" text-anchor="start" dominant-baseline="central">不是默认都已可</text><text class="anno" x="540" y="1227" text-anchor="start" dominant-baseline="central">用</text><g class="c-gray" role="link" tabindex="0" data-page="A" data-flow="A-visual-consumption-options" data-step="AO7" aria-label="选定并获准接入后，才进入触发链"><title>条件判断结果还需绑定有效任务，通知下游，再核对用户结果。；本文没有给最终方案选择与全车型上线证明；未定项继续保留。</title><rect x="180" y="1412" width="340" height="148" rx="6"/><text class="th" x="198" y="1436" text-anchor="start" dominant-baseline="central">选定并获准接入后，才进入触发链</text><text class="ts" x="198" y="1464" text-anchor="start" dominant-baseline="central">条件判断结果还需绑定有效任务，通知下游，再核对</text><text class="ts" x="198" y="1483" text-anchor="start" dominant-baseline="central">用户结果。</text><text class="ts" x="198" y="1502" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1521" text-anchor="start" dominant-baseline="central">本文没有给最终方案选择与全车型上线证明；未定项</text><text class="ts" x="198" y="1540" text-anchor="start" dominant-baseline="central">继续保留。</text></g><text class="th" x="40" y="1644" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1674" text-anchor="start" dominant-baseline="central">E1 先明确要服务的场景与判断条件 → 方案一：视觉输出开放描述：备选方案一：需开放画面描述；不</text><text class="ts" x="40" y="1693" text-anchor="start" dominant-baseline="central">是自动分流条件〔规划/待核〕</text><text class="ts" x="40" y="1726" text-anchor="start" dominant-baseline="central">E2 方案一：视觉输出开放描述 → 云端模型理解描述并判断静态任务：整包上传后由云端模型解释</text><text class="ts" x="40" y="1759" text-anchor="start" dominant-baseline="central">E3 先明确要服务的场景与判断条件 → 方案二：预定义有限识别内容：备选方案二：先定义有限内容；</text><text class="ts" x="40" y="1778" text-anchor="start" dominant-baseline="central">不是默认降级〔规划/待核〕</text><text class="ts" x="40" y="1811" text-anchor="start" dominant-baseline="central">E4 方案二：预定义有限识别内容 → 云端取字段，再用规则判断：返回约定字段后进行规则判断</text><text class="ts" x="40" y="1844" text-anchor="start" dominant-baseline="central">E5 云端模型理解描述并判断静态任务 → 分别验证覆盖、误判、时延与资源成本：验证开放路线的实际</text><text class="ts" x="40" y="1863" text-anchor="start" dominant-baseline="central">效果与代价〔规划/待核〕</text><text class="ts" x="40" y="1896" text-anchor="start" dominant-baseline="central">E6 云端取字段，再用规则判断 → 分别验证覆盖、误判、时延与资源成本：验证结构化路线的范围与责</text><text class="ts" x="40" y="1915" text-anchor="start" dominant-baseline="central">任〔规划/待核〕</text><text class="ts" x="40" y="1948" text-anchor="start" dominant-baseline="central">E7 分别验证覆盖、误判、时延与资源成本 → 选定并获准接入后，才进入触发链：选型、字段合同和接</text><text class="ts" x="40" y="1967" text-anchor="start" dominant-baseline="central">入验收通过后〔规划/待核〕</text></svg>