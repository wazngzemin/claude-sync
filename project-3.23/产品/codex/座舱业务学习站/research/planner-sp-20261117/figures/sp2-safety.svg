<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="sp2-safety" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="sp2-safety-title sp2-safety-desc">
<title id="sp2-safety-title">用户说了，也不能直接照做的条件</title><desc id="sp2-safety-desc">先看说话人、车速、挡位和其他条件；不执行时说明原因，不能假报已经办成。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="sp2-safety-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">用户说了，也不能直接照做的条件</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先看说话人、车速、挡位和其他条件；不执行时说明原因，不能假报已经办成。</text>
<g data-node="true" id="sp2-safety-speaker"><rect class="v56-reject" x="32" y="142" width="548" height="258" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="170" text-anchor="start">谁在说 · 权限先过关</text>
<text class="v56-node-sub" x="46" y="198" text-anchor="start">驾驶类、底盘动力转向、通讯：仅主驾</text>
<text class="v56-node-sub" x="46" y="222" text-anchor="start">非主驾不能控制主驾车门</text>
<text class="v56-node-sub" x="46" y="246" text-anchor="start">行车中：任何人都不能移动主驾座椅</text>
<text class="v56-node-sub" x="46" y="270" text-anchor="start">“前排后挪”：跳过主驾，只动副驾并说明</text>
</g>
<g data-node="true" id="sp2-safety-speed"><rect class="v56-reject" x="620" y="142" width="548" height="258" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="634" y="170" text-anchor="start">车在动吗 · 阈值都是“超过”</text>
<text class="v56-node-sub" x="634" y="198" text-anchor="start">&gt; 3 公里/小时：吸顶屏只能左右调</text>
<text class="v56-node-sub" x="634" y="222" text-anchor="start">&gt; 30 公里/小时：不能语音关驾驶员监测</text>
<text class="v56-node-sub" x="634" y="246" text-anchor="start">也不能语音关大灯</text>
<text class="v56-node-sub" x="634" y="270" text-anchor="start">&gt; 80 公里/小时：车窗不全开，改通风</text>
</g>
<g data-node="true" id="sp2-safety-gear"><rect class="v56-reject" x="32" y="450" width="548" height="258" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="478" text-anchor="start">挡位与驻车 · 不能只看可逆</text>
<text class="v56-node-sub" x="46" y="506" text-anchor="start">R 挡：不能调多媒体、来电铃声、K 歌人声音量</text>
<text class="v56-node-sub" x="46" y="530" text-anchor="start">前后备箱、充电口盖：主驾且驻车才可控</text>
<text class="v56-node-sub" x="46" y="554" text-anchor="start">P 挡：才允许折叠后视镜</text>
</g>
<g data-node="true" id="sp2-safety-other"><rect class="v56-reject" x="620" y="450" width="548" height="258" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="634" y="478" text-anchor="start">其他条件 · 组合条件都要满足</text>
<text class="v56-node-sub" x="634" y="506" text-anchor="start">儿童锁开：非主驾不能控制后门</text>
<text class="v56-node-sub" x="634" y="530" text-anchor="start">夜间行车：不能语音关车外灯</text>
<text class="v56-node-sub" x="634" y="554" text-anchor="start">前排影院：后排无人且驻车</text>
</g>
<text class="v56-label" x="32" y="764" text-anchor="start">这些限制先于“可逆、低风险就直接做”的原则。</text>
<path class="v56-rule" d="M 32 812 L 1168 812"/>
<text class="v56-node-title" x="32" y="848" text-anchor="start">先做后确认，不能绕过这些规则。</text>
<rect data-decoration="true" class="v56-reject" x="32.0" y="876" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="890" text-anchor="start">红框：明确的用车限制</text>
</svg>
