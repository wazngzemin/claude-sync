逐用途检查</text><text class="ts" x="365" y="501" text-anchor="start" dominant-baseline="central">E2 · 允许进入记忆</text><text class="ts" x="168" y="313" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="168" y="779" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="168" y="337" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="168" y="971" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="168" y="361" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="168" y="1142" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="168" y="385" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="168" y="1310" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="168" y="409" text-anchor="end" dominant-baseline="central">E7</text><text class="ts" x="168" y="1844" text-anchor="end" dominant-baseline="central">E7</text><text class="ts" x="168" y="735" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="168" y="1478" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="168" y="927" text-anchor="end" dominant-baseline="central">E9</text><text class="ts" x="168" y="1502" text-anchor="end" dominant-baseline="central">E9</text><text class="ts" x="365" y="1382" text-anchor="start" dominant-baseline="central">E10 · 统一入口为 PRD 策略</text><text class="ts" x="365" y="1574" text-anchor="start" dominant-baseline="central">E11 · 确需响应时</text><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec1" aria-label="可信事件记录"><title>时间、对象、类型和事实明确；不是无解释的任意埋点</title><rect x="180" y="106" width="340" height="91" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">可信事件记录</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">时间、对象、类型和事实明确；不是无解释的任意埋</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central">点</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec2" aria-label="按用途与权限筛选"><title>分别核白名单/订阅/记忆授权；不把一个开关当全部授权</title><rect x="180" y="277" width="340" height="184" rx="6"/><text class="th" x="198" y="301" text-anchor="start" dominant-baseline="central">按用途与权限筛选</text><text class="ts" x="198" y="329" text-anchor="start" dominant-baseline="central">分别核白名单/订阅/记忆授权；不把一个开关当全部</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">授权</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec3" aria-label="记忆素材"><title>按时间与类型查询；后续提取与生成异步完成</title><rect x="180" y="541" width="340" height="78" rx="6"/><text class="th" x="198" y="565" text-anchor="start" dominant-baseline="central">记忆素材</text><text class="ts" x="198" y="593" text-anchor="start" dominant-baseline="central">按时间与类型查询；后续提取与生成异步完成</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec4" aria-label="Context 事件流"><title>按窗口和数量组织近期事实；具体 10 分钟/30 条为文档暂定</title><rect x="180" y="699" width="340" height="112" rx="6"/><text class="th" x="198" y="723" text-anchor="start" dominant-baseline="central">Context 事件流</text><text class="ts" x="198" y="751" text-anchor="start" dominant-baseline="central">按窗口和数量组织近期事实；具体 10 分钟/30 条为</text><text class="ts" x="198" y="770" text-anchor="start" dominant-baseline="central">文档暂定</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec5" aria-label="UP 中的历史事件"><title>按时间穿插在相关对话之间；有独立白名单及长度约束</title><rect x="180" y="891" width="340" height="112" rx="6"/><text class="th" x="198" y="915" text-anchor="start" dominant-baseline="central">UP 中的历史事件</text><text class="ts" x="198" y="943" text-anchor="start" dominant-baseline="central">按时间穿插在相关对话之间；有独立白名单及长度约</text><text class="ts" x="198" y="962" text-anchor="start" dominant-baseline="central">束</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec6" aria-label="指定业务订阅"><title>只通知关注该定义的消费者；送达不等于业务动作成功</title><rect x="180" y="1083" width="340" height="91" rx="6"/><text class="th" x="198" y="1107" text-anchor="start" dominant-baseline="central">指定业务订阅</text><text class="ts" x="198" y="1135" text-anchor="start" dominant-baseline="central">只通知关注该定义的消费者；送达不等于业务动作成</text><text class="ts" x="198" y="1154" text-anchor="start" dominant-baseline="central">功</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec7" aria-label="需要新一轮的 event"><title>仅限明确的响应场景；不是所有日志都自动唤醒</title><rect x="180" y="1254" width="340" height="88" rx="6"/><text class="th" x="198" y="1278" text-anchor="start" dominant-baseline="central">需要新一轮的 event</text><text class="ts" x="198" y="1306" text-anchor="start" dominant-baseline="central">仅限明确的响应场景；不是所有日志都自动唤醒</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec8" aria-label="输入管理与 Director"><title>按输入类型、推理和播报状态组织；判断说话、动作或保持沉默</title><rect x="180" y="1422" width="340" height="112" rx="6"/><text class="th" x="198" y="1446" text-anchor="start" dominant-baseline="central">输入管理与 Director</text><text class="ts" x="198" y="1474" text-anchor="start" dominant-baseline="central">按输入类型、推理和播报状态组织；判断说话、动作</text><text class="ts" x="198" y="1493" text-anchor="start" dominant-baseline="central">或保持沉默</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec9" aria-label="真实用户结果"><title>必要时工具执行并回流；卡片、播报和实际动作分别验收</title><rect x="180" y="1614" width="340" height="91" rx="6"/><text class="th" x="198" y="1638" text-anchor="start" dominant-baseline="central">真实用户结果</text><text class="ts" x="198" y="1666" text-anchor="start" dominant-baseline="central">必要时工具执行并回流；卡片、播报和实际动作分别</text><text class="ts" x="198" y="1685" text-anchor="start" dominant-baseline="central">验收</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-consumption" data-step="ec10" aria-label="仅保留/不使用"><title>无订阅、不相关或不被允许；不得因“已有数据”越权使用</title><rect x="180" y="1785" width="340" height="91" rx="6"/><text class="th" x="198" y="1809" text-anchor="start" dominant-baseline="central">仅保留/不使用</text><text class="ts" x="198" y="1837" text-anchor="start" dominant-baseline="central">无订阅、不相关或不被允许；不得因“已有数据”越</text><text class="ts" x="198" y="1856" text-anchor="start" dominant-baseline="central">权使用</text></g><text class="th" x="40" y="1960" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1990" text-anchor="start" dominant-baseline="central">E1 可信事件记录 → 按用途与权限筛选：逐用途检查</text><text class="ts" x="40" y="2023" text-anchor="start" dominant-baseline="central">E2 按用途与权限筛选 → 记忆素材：允许进入记忆</text><text class="ts" x="40" y="2056" text-anchor="start" dominant-baseline="central">E3 按用途与权限筛选 → Context 事件流：Context 白名单</text><text class="ts" x="40" y="2089" text-anchor="start" dominant-baseline="central">E4 按用途与权限筛选 → UP 中的历史事件：UP 白名单</text><text class="ts" x="40" y="2122" text-anchor="start" dominant-baseline="central">E5 按用途与权限筛选 → 指定业务订阅：已注册订阅</text><text class="ts" x="40" y="2155" text-anchor="start" dominant-baseline="central">E6 按用途与权限筛选 → 需要新一轮的 event：明确需要新轮响应</text><text class="ts" x="40" y="2188" text-anchor="start" dominant-baseline="central">E7 按用途与权限筛选 → 仅保留/不使用：无合法消费路径</text><text class="ts" x="40" y="2221" text-anchor="start" dominant-baseline="central">E8 Context 事件流 → 输入管理与 Director：随本轮输入供参考</text><text class="ts" x="40" y="2254" text-anchor="start" dominant-baseline="central">E9 UP 中的历史事件 → 输入管理与 Director：保留事件语义</text><text class="ts" x="40" y="2287" text-anchor="start" dominant-baseline="central">E10 需要新一轮的 event → 输入管理与 Director：统一入口为 PRD 策略〔规划/待核〕</text><text class="ts" x="40" y="2320" text-anchor="start" dominant-baseline="central">E11 输入管理与 Director → 真实用户结果：确需响应时</text></svg>