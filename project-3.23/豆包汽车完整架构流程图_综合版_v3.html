                {"from": "F117", "to": "F119", "label": "API"},
                {"from": "F120", "to": "F121", "label": "流式"},
                {"from": "F120", "to": "F122", "label": "最终"},
                {"from": "F23", "to": "F123", "label": "UI"},
                {"from": "F23", "to": "F124", "label": "NLG"},
                {"from": "F23", "to": "F125", "label": "一致性"}
            ]
        };

        const svg = document.getElementById('architecture-canvas');
        const tooltip = document.getElementById('tooltip');

        // 定义颜色映射
        const statusColors = {
            "基础能力": { fill: "#e3f2fd", stroke: "#1976d2" },
            "高阶能力-830": { fill: "#fff3e0", stroke: "#f57c00" },
            "demo预研": { fill: "#f3e5f5", stroke: "#7b1fa2" },
            "待优化": { fill: "#fff9c4", stroke: "#fbc02d" },
            "规划中": { fill: "#ffebee", stroke: "#c62828" },
            "Fail": { fill: "#e0e0e0", stroke: "#616161" }
        };

        // 定义箭头标记
        const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
        const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
        marker.setAttribute("id", "arrowhead");
        marker.setAttribute("markerWidth", "10");
        marker.setAttribute("markerHeight", "10");
        marker.setAttribute("refX", "9");
        marker.setAttribute("refY", "3");
        marker.setAttribute("orient", "auto");
        const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        polygon.setAttribute("points", "0 0, 10 3, 0 6");
        polygon.setAttribute("fill", "#90a4ae");
        marker.appendChild(polygon);
        defs.appendChild(marker);
        svg.appendChild(defs);

        // 绘制边
        architectureData.edges.forEach(edge => {
            const fromNode = architectureData.nodes.find(n => n.id === edge.from);
            const toNode = architectureData.nodes.find(n => n.id === edge.to);

            if (fromNode && toNode) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("class", "edge");
                line.setAttribute("x1", fromNode.x + fromNode.width / 2);
                line.setAttribute("y1", fromNode.y + fromNode.height / 2);
                line.setAttribute("x2", toNode.x + toNode.width / 2);
                line.setAttribute("y2", toNode.y + toNode.height / 2);
                svg.appendChild(line);

                // 边标签
                if (edge.label) {
                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("class", "edge-label");
                    text.setAttribute("x", (fromNode.x + toNode.x) / 2 + fromNode.width / 2);
                    text.setAttribute("y", (fromNode.y + toNode.y) / 2 + fromNode.height / 2 - 5);
                    text.setAttribute("text-anchor", "middle");
                    text.textContent = edge.label;
                    svg.appendChild(text);
                }
            }
        });

        // 绘制节点
        architectureData.nodes.forEach(node => {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "node");
            g.setAttribute("data-id", node.id);

            const colors = statusColors[node.status] || statusColors["基础能力"];

            if (node.type === "diamond") {
                const points = `${node.x + node.width/2},${node.y} ${node.x + node.width},${node.y + node.height/2} ${node.x + node.width/2},${node.y + node.height} ${node.x},${node.y + node.height/2}`;
                const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                polygon.setAttribute("points", points);
                polygon.setAttribute("fill", colors.fill);
                polygon.setAttribute("stroke", colors.stroke);
                polygon.setAttribute("stroke-width", "2");
                g.appendChild(polygon);
            } else if (node.type === "ellipse") {
                const ellipse = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
                ellipse.setAttribute("cx", node.x + node.width / 2);
                ellipse.setAttribute("cy", node.y + node.height / 2);
                ellipse.setAttribute("rx", node.width / 2);
                ellipse.setAttribute("ry", node.height / 2);
                ellipse.setAttribute("fill", colors.fill);
                ellipse.setAttribute("stroke", colors.stroke);
                ellipse.setAttribute("stroke-width", "2");
                g.appendChild(ellipse);
            } else {
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", node.x);
                rect.setAttribute("y", node.y);
                rect.setAttribute("width", node.width);
                rect.setAttribute("height", node.height);
                rect.setAttribute("rx", "6");
                rect.setAttribute("fill", colors.fill);
                rect.setAttribute("stroke", colors.stroke);
                rect.setAttribute("stroke-width", "2");
                g.appendChild(rect);
            }

            // 黄色高亮
            if (node.highlight === "yellow") {
                const highlight = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                highlight.setAttribute("x", node.x);
                highlight.setAttribute("y", node.y);
                highlight.setAttribute("width", node.width);
                highlight.setAttribute("height", node.height);
                highlight.setAttribute("rx", "6");
                highlight.setAttribute("fill", "none");
                highlight.setAttribute("stroke", "#ffc107");
                highlight.setAttribute("stroke-width", "4");
                g.appendChild(highlight);
            }

            // 标签
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("class", "node-label");
            text.setAttribute("x", node.x + node.width / 2);
            text.setAttribute("y", node.y + node.height / 2 - 10);
            text.setAttribute("text-anchor", "middle");
            text.textContent = node.label;
            g.appendChild(text);

            // 责任人
            if (node.responsible) {
                const resp = document.createElementNS("http://www.w3.org/2000/svg", "text");
                resp.setAttribute("class", "node-details");
                resp.setAttribute("x", node.x + node.width / 2);
                resp.setAttribute("y", node.y + node.height / 2 + 5);
                resp.setAttribute("text-anchor", "middle");
                resp.textContent = node.responsible;
                g.appendChild(resp);
            }

            // 指标
            if (node.metrics) {
                const metrics = document.createElementNS("http://www.w3.org/2000/svg", "text");
                metrics.setAttribute("class", "node-details");
                metrics.setAttribute("x", node.x + node.width / 2);
                metrics.setAttribute("y", node.y + node.height / 2 + 18);
                metrics.setAttribute("text-anchor", "middle");
                metrics.textContent = node.metrics;
                g.appendChild(metrics);
            }

            // Tooltip
            g.addEventListener('mouseenter', (e) => {
                let tooltipContent = `<strong>${node.label}</strong><br>`;
                if (node.responsible) tooltipContent += `负责人: ${node.responsible}<br>`;
                if (node.status) tooltipContent += `状态: ${node.status}<br>`;
                if (node.metrics) tooltipContent += `指标: ${node.metrics}<br>`;
                if (node.meego) tooltipContent += `Meego: ${node.meego}`;

                tooltip.innerHTML = tooltipContent;
                tooltip.style.display = 'block';
            });

            g.addEventListener('mousemove', (e) => {
                tooltip.style.left = e.pageX + 15 + 'px';
                tooltip.style.top = e.pageY + 15 + 'px';
            });

            g.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });

            svg.appendChild(g);
        });
    </script>
