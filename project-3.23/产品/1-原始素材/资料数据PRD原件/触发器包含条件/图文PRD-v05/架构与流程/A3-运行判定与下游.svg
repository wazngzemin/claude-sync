410,1040" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1420,934 1420,987 1260,987 1260,1040" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="410,1211 410,1255.5 850,1255.5 850,1300" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1260,1211 1260,1255.5 850,1255.5 850,1300" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="850,1439 850,1490 20,1490 20,1895 70,1895" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="710,1909.5 850,1925.5" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1630,1925 1680,1925 1680,2335 1090,2335" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="610,2350 280,2350 280,2460" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="850,2414 850,2437 850,2437 850,2460" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1090,2545.5 1210,2529.5" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="280,584 20,584 20,2440 850,2440 850,2460" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1420,2599 1420,2634.5 385,2634.5 385,2670" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="700,2739.5 850,2755.5" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="385,2809 385,2910 20,2910 20,3058 70,3058" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="530,3074.5 630,3074.5" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1040,3074.5 1150,3090.5" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="300,3005 300,2990 1390,2990 1390,3005" fill="none" stroke="#185DB7" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="70" y="175" width="420" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="210" font-size="26" font-weight="600" fill="#0D4FA8">端状态或 VLM 更新</text><text x="90" y="245" font-size="22" font-weight="400" fill="#0D4FA8">更新已配置输入信号</text><text x="90" y="277" font-size="22" font-weight="400" fill="#0D4FA8">不是每条更新都执行车辆动作</text><rect x="610" y="175" width="480" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="630" y="210" font-size="26" font-weight="600" fill="#0D4FA8">确定实际启动信号</text><text x="630" y="245" font-size="22" font-weight="400" fill="#0D4FA8">动态：动态条件涉及的 ID</text><text x="630" y="277" font-size="22" font-weight="400" fill="#0D4FA8">无动态：全部条件信号 ID</text><text x="630" y="309" font-size="22" font-weight="400" fill="#0D4FA8">推理：配置的 VLM ID</text><rect x="1210" y="175" width="420" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1230" y="210" font-size="26" font-weight="600" fill="#0D4FA8">获取候选场景</text><text x="1230" y="245" font-size="22" font-weight="400" fill="#0D4FA8">按既有 Signal / VLM 入口</text><text x="1230" y="277" font-size="22" font-weight="400" fill="#0D4FA8">采用范围与本车实际状态</text><rect x="610" y="410" width="480" height="139" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="630" y="445" font-size="26" font-weight="600" fill="#0D4FA8">按 workflow_id 唯一路由</text><text x="630" y="480" font-size="22" font-weight="400" fill="#0D4FA8">空：继续旧判断；非空：新判断</text><text x="630" y="512" font-size="22" font-weight="400" fill="#0D4FA8">新 Workflow 不进 runStatic / runDynamic</text><rect x="70" y="410" width="420" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="445" font-size="26" font-weight="600" fill="#0D4FA8">简单模式：旧链路保持</text><text x="90" y="480" font-size="22" font-weight="400" fill="#0D4FA8">条件：现有静态 / 动态判断</text><text x="90" y="512" font-size="22" font-weight="400" fill="#0D4FA8">推理：现有 InferenceTrigger</text><text x="90" y="544" font-size="22" font-weight="400" fill="#0D4FA8">只有既有判断命中才进下游</text><rect x="1210" y="410" width="420" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1230" y="445" font-size="26" font-weight="600" fill="#0D4FA8">Workflow：建立本次上下文</text><text x="1230" y="480" font-size="22" font-weight="400" fill="#0D4FA8">场景、车辆、启动方式</text><text x="1230" y="512" font-size="22" font-weight="400" fill="#0D4FA8">输入、动作、执行策略快照</text><text x="1230" y="544" font-size="22" font-weight="400" fill="#0D4FA8">创建 Run 与 NodeRun</text><rect x="70" y="795" width="420" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="830" font-size="26" font-weight="600" fill="#0D4FA8">选择待处理节点</text><text x="90" y="865" font-size="22" font-weight="400" fill="#0D4FA8">无前驱的来源节点可直接就绪</text><text x="90" y="897" font-size="22" font-weight="400" fill="#0D4FA8">有前驱的节点按汇合规则等待</text><rect x="610" y="795" width="480" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="630" y="830" font-size="26" font-weight="600" fill="#0D4FA8">实际目标节点的前驱汇合</text><text x="630" y="865" font-size="22" font-weight="400" fill="#0D4FA8">AND / OR 配在这个节点上</text><text x="630" y="897" font-size="22" font-weight="400" fill="#0D4FA8">只有前驱允许才进入 READY</text><text x="630" y="929" font-size="22" font-weight="400" fill="#0D4FA8">不是新增一个空白汇合节点</text><rect x="1210" y="795" width="420" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1230" y="830" font-size="26" font-weight="600" fill="#0D4FA8">READY：执行自身判断</text><text x="1230" y="865" font-size="22" font-weight="400" fill="#0D4FA8">汇合通过不等于自身 PASS</text><text x="1230" y="897" font-size="22" font-weight="400" fill="#0D4FA8">根据节点类型选择判断器</text><rect x="70" y="1040" width="680" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="1075" font-size="26" font-weight="600" fill="#0D4FA8">条件节点：读取并完整判断</text><text x="90" y="1110" font-size="22" font-weight="400" fill="#0D4FA8">规整信号、补齐 Context、查询旧值</text><text x="90" y="1142" font-size="22" font-weight="400" fill="#0D4FA8">检查本节点全部静态与动态条件</text><text x="90" y="1174" font-size="22" font-weight="400" fill="#0D4FA8">命中 PASS；未命中 REJECT；缺失或异常 UNKNOWN</text><rect x="890" y="1040" width="740" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="910" y="1075" font-size="26" font-weight="600" fill="#0D4FA8">推理节点：理解已有 VLM 描述</text><text x="910" y="1110" font-size="22" font-weight="400" fill="#0D4FA8">目标 goal ＋ 原始描述 original_query ＋ 本次输入</text><text x="910" y="1142" font-size="22" font-weight="400" fill="#0D4FA8">复用已有模型推理；不调用 DT / VQA 获取新信息</text><text x="910" y="1174" font-size="22" font-weight="400" fill="#0D4FA8">明确达成 PASS；未达成 REJECT；异常或不明 UNKNOWN</text><rect x="70" y="1300" width="1560" height="139" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="90" y="1335" font-size="26" font-weight="600" fill="#0D4FA8">节点阶段与业务结果必须分开记录</text><text x="90" y="1370" font-size="22" font-weight="400" fill="#0D4FA8">FINISHED：执行正常返回，仍可为 PASS / REJECT / UNKNOWN；FAILED：执行异常，结果 UNKNOWN。</text><text x="90" y="1402" font-size="22" font-weight="400" fill="#0D4FA8">SKIPPED：根本没有执行该节点，保存由 REJECT 或 UNKNOWN 阻断的原因；终态不可倒退。</text><rect x="70" y="1580" width="730" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="90" y="1615" font-size="26" font-weight="600" fill="#0D4FA8">AND：全部满足后才能运行目标节点</text><text x="90" y="1650" font-size="22" font-weight="400" fill="#0D4FA8">全部前驱 PASS → 目标 READY</text><text x="90" y="1682" font-size="22" font-weight="400" fill="#0D4FA8">任一前驱 REJECT → 立即跳过目标，阻断为 REJECT</text><text x="90" y="1714" font-size="22" font-weight="400" fill="#0D4FA8">全部前驱终态，无 REJECT 但有 UNKNOWN → 未知跳过</text><rect x="900" y="1580" width="730" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="920" y="1615" font-size="26" font-weight="600" fill="#0D4FA8">OR：任一满足即可运行目标节点</text><text x="920" y="1650" font-size="22" font-weight="400" fill="#0D4FA8">任一前驱 PASS → 目标立即 READY</text><text x="920" y="1682" font-size="22" font-weight="400" fill="#0D4FA8">全前驱终态且无 PASS：有 UNKNOWN 则未知跳过</text><text x="920" y="1714" font-size="22" font-weight="400" fill="#0D4FA8">全前驱 REJECT 才按不满足跳过；其他分支不取消</text><rect x="70" y="1840" width="640" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="1875" font-size="26" font-weight="600" fill="#0D4FA8">持续调度并记录所有节点</text><text x="90" y="1910" font-size="22" font-weight="400" fill="#0D4FA8">尚有节点未终态：继续依赖判断与执行</text><text x="90" y="1942" font-size="22" font-weight="400" fill="#0D4FA8">全部节点终态后才收敛本次 Workflow</text><rect x="850" y="1840" width="780" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="870" y="1875" font-size="26" font-weight="600" fill="#0D4FA8">最终结果只取唯一终点</text><text x="870" y="1910" font-size="22" font-weight="400" fill="#0D4FA8">终点 FINISHED：用自己的业务结果</text><text x="870" y="1942" font-size="22" font-weight="400" fill="#0D4FA8">终点 FAILED：UNKNOWN；SKIPPED：用阻断结果</text><text x="870" y="1974" font-size="22" font-weight="400" fill="#0D4FA8">不按全图多数投票，也不把任意前驱 PASS 当整体通过</text><rect x="610" y="2275" width="480" height="139" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="630" y="2310" font-size="26" font-weight="600" fill="#0D4FA8">Workflow 唯一终点结果</text><text x="630" y="2345" font-size="22" font-weight="400" fill="#0D4FA8">PASS：进入共用动作分发</text><text x="630" y="2377" font-size="22" font-weight="400" fill="#0D4FA8">REJECT / UNKNOWN：只记录结束</text><rect x="70" y="2460" width="420" height="139" rx="12" fill="#F2F7F5" stroke="#73978A" stroke-width="1.5"/><text x="90" y="2495" font-size="26" font-weight="600" fill="#0D4FA8">不满足或无法判断</text><text x="90" y="2530" font-size="22" font-weight="400" fill="#0D4FA8">保存 Run / NodeRun 与原因</text><text x="90" y="2562" font-size="22" font-weight="400" fill="#0D4FA8">不提交下游、不预创建 Action History</text><rect x="610" y="2460" width="480" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="630" y="2495" font-size="26" font-weight="600" fill="#0D4FA8">检查执行策略 → 取得场景锁</text><text x="630" y="2530" font-size="22" font-weight="400" fill="#0D4FA8">两关都允许后才向下游提交</text><text x="630" y="2562" font-size="22" font-weight="400" fill="#0D4FA8">策略 / 锁失败：记录对应拦截</text><text x="630" y="2594" font-size="22" font-weight="400" fill="#0D4FA8">run_id 不是去重或车辆成功凭据</text><rect x="1210" y="2460" width="420" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1230" y="2495" font-size="26" font-weight="600" fill="#0D4FA8">允许后预创建 History</text><text x="1230" y="2530" font-size="22" font-weight="400" fill="#0D4FA8">关联本次场景与运行</text><text x="1230" y="2562" font-size="22" font-weight="400" fill="#0D4FA8">按配置并发执行已有 Action</text><rect x="70" y="2670" width="630" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="2705" font-size="26" font-weight="600" fill="#0D4FA8">Advisor / Recommend / Callback</text><text x="90" y="2740" font-size="22" font-weight="400" fill="#0D4FA8">不在判断图中新增执行车辆的工具节点</text><text x="90" y="2772" font-size="22" font-weight="400" fill="#0D4FA8">策略或锁拦截不写成模型 REJECT</text><rect x="850" y="2670" width="780" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="870" y="2705" font-size="26" font-weight="600" fill="#0D4FA8">Action 全部结束后统一汇总</text><text x="870" y="2740" font-size="22" font-weight="400" fill="#0D4FA8">一次更新 History.execute_result</text><text x="870" y="2772" font-size="22" font-weight="400" fill="#0D4FA8">查询 Run 时关联本次 Action 结果</text><text x="870" y="2804" font-size="22" font-weight="400" fill="#0D4FA8">下游调用返回成功不等于卡片展示或车辆成功</text><rect x="70" y="3005" width="460" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="3040" font-size="26" font-weight="600" fill="#0D4FA8">三项云端任务经主动推荐 → DT</text><text x="90" y="3075" font-size="22" font-weight="400" fill="#0D4FA8">儿童锁、后视镜不需额外设备识别</text><text x="90" y="3107" font-size="22" font-weight="400" fill="#0D4FA8">三项询问任务不是静默执行</text><rect x="630" y="3005" width="410" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="650" y="3040" font-size="26" font-weight="600" fill="#0D4FA8">充电口盖：DT 调 VQA</text><text x="650" y="3075" font-size="22" font-weight="400" fill="#0D4FA8">先判断是否明确发现充电设备</text><text x="650" y="3107" font-size="22" font-weight="400" fill="#0D4FA8">无设备或未知：不发开盖询问</text><rect x="1150" y="3005" width="480" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1170" y="3040" font-size="26" font-weight="600" fill="#0D4FA8">接入业务按既有卡片协议处理</text><text x="1170" y="3075" font-size="22" font-weight="400" fill="#0D4FA8">注册、下发、询问与用户回应</text><text x="1170" y="3107" font-size="22" font-weight="400" fill="#0D4FA8">用户确认后沿既有业务执行车控</text><text x="1170" y="3139" font-size="22" font-weight="400" fill="#0D4FA8">Trigger 不拉卡，不调车控工具</text><text x="55" y="60" font-size="36" font-weight="600" fill="#0D4FA8">一次场景更新如何完成判断、拦截与下游提交</text><text x="65" y="136" font-size="28" font-weight="600" fill="#0D4FA8">一、启动与分流｜信号更新决定开始，不代表条件已经满足</text><text x="525" y="477" font-size="21" font-weight="400" fill="#0D4FA8">空</text><text x="1110" y="465.5" font-size="21" font-weight="400" fill="#0D4FA8">非空</text><text x="80" y="641" font-size="22" font-weight="600" fill="#0D4FA8">本期混合定时不开放；混合信号汇总与迟到输入处理待收口，不默认每条静态更新都会启动。</text><text x="65" y="756" font-size="28" font-weight="600" fill="#0D4FA8">二、调度与单节点判断｜只支持条件节点和推理节点</text><text x="510" y="850.5" font-size="21" font-weight="400" fill="#0D4FA8">有前驱</text><text x="1110" y="866.5" font-size="21" font-weight="400" fill="#0D4FA8">允许</text><text x="720" y="692" font-size="21" font-weight="400" fill="#0D4FA8">开始新路</text><text x="635" y="758" font-size="21" font-weight="400" fill="#0D4FA8">无前驱</text><text x="1435" y="977" font-size="21" font-weight="400" fill="#0D4FA8">条件</text><text x="1435" y="977" font-size="21" font-weight="400" fill="#0D4FA8">推理</text><text x="65" y="1546" font-size="28" font-weight="600" fill="#0D4FA8">三、汇合与整图收敛｜OR 提前就绪，其他分支继续执行</text><text x="740" y="1895.5" font-size="21" font-weight="400" fill="#0D4FA8">全节点终态</text><text x="80" y="2110" font-size="22" font-weight="600" fill="#0D4FA8">例：儿童识别 PASS、宠物识别 UNKNOWN，目标儿童锁条件节点按 OR 可运行；它仍要自行判断。</text><text x="65" y="2241" font-size="28" font-weight="600" fill="#0D4FA8">四、通过后的动作出口｜PASS 之后仍可能被策略或场景锁拦截</text><text x="1360" y="2320" font-size="21" font-weight="400" fill="#0D4FA8">唯一终点结果</text><text x="90" y="2338" font-size="21" font-weight="400" fill="#0D4FA8">REJECT / UNKNOWN</text><text x="865" y="2427" font-size="21" font-weight="400" fill="#0D4FA8">PASS</text><text x="1110" y="2531.5" font-size="21" font-weight="400" fill="#0D4FA8">允许</text><text x="50" y="2430" font-size="21" font-weight="400" fill="#0D4FA8">旧链路仅命中后进入</text><text x="735" y="2725.5" font-size="21" font-weight="400" fill="#0D4FA8">各项返回</text><text x="65" y="2971" font-size="28" font-weight="600" fill="#0D4FA8">五、任务业务闭环｜这里只解释下游边界，不重新实现卡片与车控</text><text x="540" y="3060.5" font-size="21" font-weight="400" fill="#0D4FA8">充电</text><text x="1055" y="3060.5" font-size="21" font-weight="400" fill="#0D4FA8">明确发现</text><text x="1260" y="2981" font-size="21" font-weight="400" fill="#0D4FA8">儿童锁 / 后视镜</text><text x="80" y="3342" font-size="23" font-weight="600" fill="#0D4FA8">对外解释：判断通过、策略允许、下游提交、卡片显示、用户确认、车辆成功，是不同的业务阶段。</text></svg>