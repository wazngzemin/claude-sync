<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Noto Sans SC, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfd"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="40" y="45" font-size="26" font-weight="700" fill="#1a1a1a">N1｜手势、动作与操作事件：非语音入口怎样变成命令和事实</text>
  <text x="40" y="72" font-size="14" fill="#5f6368">从 OMS/DMS 摄像头和屏幕/物理/跨端操作汇入；分出 query→语音主路、状态→B06、触发机会→G03、同镜头观察→A04</text>

  <!-- 客户端框 -->
  <rect x="30" y="100" width="640" height="500" rx="12" fill="#e8f0fe" stroke="#4285F4" stroke-width="2"/>
  <text x="50" y="125" font-size="16" font-weight="700" fill="#1a56c9">客户端（车端）</text>
  <text x="50" y="145" font-size="12" fill="#5f6368">舱内感知与操作入口，事件在车端先被识别和记录</text>

  <!-- N1-01 摄像头 -->
  <rect x="60" y="170" width="180" height="100" rx="8" fill="#ffffff" stroke="#4285F4" stroke-width="2"/>
  <text x="75" y="195" font-size="13" font-weight="700" fill="#1a1a1a">N1-01 OMS/DMS 摄像头</text>
  <text x="75" y="215" font-size="11" fill="#3c4043">输入：舱内视频流</text>
  <text x="75" y="232" font-size="11" fill="#3c4043">要点：与 A04 共用同镜头</text>
  <text x="75" y="249" font-size="11" fill="#3c4043">① 取"这一下是不是手势"</text>
  <text x="75" y="264" font-size="11" fill="#3c4043">② 连续画面归 A 图</text>

  <!-- N1-02 手势识别 -->
  <rect x="280" y="170" width="200" height="120" rx="8" fill="#ffffff" stroke="#4285F4" stroke-width="2"/>
  <text x="295" y="195" font-size="13" font-weight="700" fill="#1a1a1a">N1-02 手势动作识别</text>
  <text x="295" y="215" font-size="11" fill="#3c4043">要点：动作即命令（目标态）</text>
  <text x="295" y="232" font-size="11" fill="#3c4043">① 竖大拇指=确认主动服务</text>
  <text x="295" y="249" font-size="11" fill="#3c4043">② 摆手=拒绝/取消</text>
  <text x="295" y="266" font-size="11" fill="#3c4043">③ OK/点赞=绑自定义快捷指令 P1</text>
  <text x="295" y="283" font-size="11" fill="#b3261e">④ "指着说" 这一代 SOP 不做（延后）</text>

  <!-- N1-03 机器人摄像 (long-term) -->
  <rect x="510" y="170" width="140" height="80" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="4,3" stroke-width="2"/>
  <text x="525" y="195" font-size="12" font-weight="700" fill="#3c4043">N1-03 豆包机器人摄像</text>
  <text x="525" y="215" font-size="11" fill="#5f6368">要点：长期/低优</text>
  <text x="525" y="232" font-size="11" fill="#5f6368">① 辅助手势识别</text>
  <text x="525" y="247" font-size="11" fill="#5f6368">② 2.6 不做</text>

  <!-- 操作三路 -->
  <rect x="60" y="330" width="180" height="100" rx="8" fill="#ffffff" stroke="#4285F4" stroke-width="2"/>
  <text x="75" y="355" font-size="13" font-weight="700" fill="#1a1a1a">N1-04 屏幕操作</text>
  <text x="75" y="375" font-size="11" fill="#3c4043">要点：真点屏幕的事件</text>
  <text x="75" y="392" font-size="11" fill="#3c4043">① 副驾点暂停音乐</text>
  <text x="75" y="409" font-size="11" fill="#3c4043">② 与 W 图"说按钮名"区分</text>
  <text x="75" y="424" font-size="11" fill="#3c4043">③ 2.6 已落地</text>

  <rect x="280" y="330" width="180" height="100" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="4,3" stroke-width="2"/>
  <text x="295" y="355" font-size="13" font-weight="700" fill="#3c4043">N1-05 物理操作</text>
  <text x="295" y="375" font-size="11" fill="#5f6368">要点：按键/旋钮</text>
  <text x="295" y="392" font-size="11" fill="#5f6368">① 长期/低优</text>
  <text x="295" y="409" font-size="11" fill="#5f6368">② 后期才转 query</text>

  <rect x="510" y="330" width="140" height="100" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="4,3" stroke-width="2"/>
  <text x="525" y="355" font-size="12" font-weight="700" fill="#3c4043">N1-06 跨端操作</text>
  <text x="525" y="375" font-size="11" fill="#5f6368">要点：手机/App 触发</text>
  <text x="525" y="392" font-size="11" fill="#5f6368">① 长期/低优</text>

  <!-- N1-07 埋点 -->
  <rect x="60" y="480" width="200" height="90" rx="8" fill="#ffffff" stroke="#4285F4" stroke-width="2"/>
  <text x="75" y="505" font-size="13" font-weight="700" fill="#1a1a1a">N1-07 埋点采集</text>
  <text x="75" y="525" font-size="11" fill="#3c4043">要点：JSON 程序化字段</text>
  <text x="75" y="542" font-size="11" fill="#3c4043">① 屏幕/物理/跨端操作上报</text>
  <text x="75" y="559" font-size="11" fill="#3c4043">② 与事件日志分工明确</text>

  <!-- N1-08 状态变更 -->
  <rect x="300" y="480" width="160" height="90" rx="8" fill="#ffffff" stroke="#4285F4" stroke-width="2"/>
  <text x="315" y="505" font-size="13" font-weight="700" fill="#1a1a1a">N1-08 状态变更</text>
  <text x="315" y="525" font-size="11" fill="#3c4043">要点：操作后状态更新</text>
  <text x="315" y="542" font-size="11" fill="#3c4043">① 校验后落库</text>
  <text x="315" y="559" font-size="11" fill="#3c4043">② 触发器的数据源</text>

  <!-- N1-09 事件日志 -->
  <rect x="490" y="480" width="160" height="90" rx="8" fill="#ffffff" stroke="#4285F4" stroke-width="2"/>
  <text x="505" y="505" font-size="13" font-weight="700" fill="#1a1a1a">N1-09 事件日志</text>
  <text x="505" y="525" font-size="11" fill="#3c4043">要点：人可读自然语言</text>
  <text x="505" y="542" font-size="11" fill="#3c4043">① 下游即拿即用</text>

  <!-- 云端框 -->
  <rect x="700" y="100" width="670" height="500" rx="12" fill="#e6f4ea" stroke="#34A853" stroke-width="2"/>
  <text x="720" y="125" font-size="16" font-weight="700" fill="#1e7e34">云端加工与分发</text>
  <text x="720" y="145" font-size="12" fill="#5f6368">把事件/手势分流到下游模块</text>

  <!-- N1-10 三分判断 -->
  <polygon points="1030,200 1130,260 1030,320 930,260" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="965" y="255" font-size="13" font-weight="700" fill="#1a1a1a">N1-10 三分</text>
  <text x="955" y="273" font-size="11" fill="#3c4043">状态/事件/query</text>
  <text x="955" y="288" font-size="11" fill="#3c4043">判断关卡</text>

  <!-- 下游出口 -->
  <rect x="740" y="380" width="180" height="90" rx="8" fill="#ffffff" stroke="#34A853" stroke-width="2"/>
  <text x="755" y="405" font-size="13" font-weight="700" fill="#1e7e34">→ 语音主路（query）</text>
  <text x="755" y="425" font-size="11" fill="#3c4043">手势被识别为命令</text>
  <text x="755" y="442" font-size="11" fill="#3c4043">① 进 Director 规划</text>
  <text x="755" y="459" font-size="11" fill="#3c4043">② 与语音同入口</text>

  <rect x="950" y="380" width="180" height="90" rx="8" fill="#ffffff" stroke="#34A853" stroke-width="2"/>
  <text x="965" y="405" font-size="13" font-weight="700" fill="#1e7e34">→ B06 对话背景</text>
  <text x="965" y="425" font-size="11" fill="#3c4043">状态事实（空调开了）</text>
  <text x="965" y="442" font-size="11" fill="#3c4043">① 进 Context 准备</text>

  <rect x="1160" y="380" width="180" height="90" rx="8" fill="#ffffff" stroke="#34A853" stroke-width="2"/>
  <text x="1175" y="405" font-size="13" font-weight="700" fill="#1e7e34">→ G03 触发器</text>
  <text x="1175" y="425" font-size="11" fill="#3c4043">事件触发机会</text>
  <text x="1175" y="442" font-size="11" fill="#3c4043">① 副驾点暂停=触发</text>

  <rect x="950" y="510" width="180" height="80" rx="8" fill="#ffffff" stroke="#34A853" stroke-width="2"/>
  <text x="965" y="535" font-size="13" font-weight="700" fill="#1e7e34">→ A04 视觉结构化</text>
  <text x="965" y="555" font-size="11" fill="#3c4043">同镜头连续画面观察</text>

  <!-- 连线 -->
  <!-- N1-01 -> N1-02 -->
  <line x1="240" y1="220" x2="280" y2="220" stroke="#4285F4" stroke-width="2.5"/>
  <!-- N1-02 -> query -->
  <line x1="480" y1="230" x2="740" y2="400" stroke="#34A853" stroke-width="2.5"/>
  <text x="560" y="300" font-size="11" fill="#1e7e34">手势→命令</text>
  <!-- N1-04 -> N1-07 -->
  <line x1="150" y1="430" x2="160" y2="480" stroke="#4285F4" stroke-width="2.5"/>
  <!-- N1-07 -> N1-08 -> N1-09 -->
  <line x1="260" y1="525" x2="300" y2="525" stroke="#4285F4" stroke-width="2.5"/>
  <line x1="460" y1="525" x2="490" y2="525" stroke="#4285F4" stroke-width="2.5"/>
  <!-- N1-09 -> N1-10 -->
  <line x1="650" y1="525" x2="930" y2="280" stroke="#4285F4" stroke-width="2.5"/>
  <!-- N1-10 -> 三个出口 -->
  <line x1="980" y1="290" x2="830" y2="380" stroke="#34A853" stroke-width="2.5"/>
  <line x1="1030" y1="320" x2="1030" y2="380" stroke="#34A853" stroke-width="2.5"/>
  <line x1="1080" y1="290" x2="1250" y2="380" stroke="#34A853" stroke-width="2.5"/>
  <!-- N1-01 -> A04 (灰虚线) -->
  <line x1="150" y1="170" x2="1040" y2="510" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="150" font-size="11" fill="#5f6368">同镜头持续观察 → A04</text>

  <!-- 图例 -->
  <rect x="30" y="630" width="1340" height="240" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="50" y="660" font-size="15" font-weight="700" fill="#1a1a1a">图例</text>

  <rect x="50" y="680" width="24" height="16" fill="#ffffff" stroke="#4285F4" stroke-width="2"/>
  <text x="82" y="693" font-size="12" fill="#3c4043">蓝框=客户端主路（2.6 目标/已落地）</text>

  <rect x="320" y="680" width="24" height="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="352" y="693" font-size="12" fill="#3c4043">金菱形=判断关卡（N1-10 三分）</text>

  <rect x="600" y="680" width="24" height="16" fill="#ffffff" stroke="#34A853" stroke-width="2"/>
  <text x="632" y="693" font-size="12" fill="#3c4043">绿框=云端分发出口（交下游图）</text>

  <rect x="870" y="680" width="24" height="16" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="3,2" stroke-width="2"/>
  <text x="902" y="693" font-size="12" fill="#3c4043">灰虚线框=长期/低优（2.6 不做）</text>

  <line x1="50" y1="730" x2="100" y2="730" stroke="#4285F4" stroke-width="2.5"/>
  <text x="110" y="734" font-size="12" fill="#3c4043">蓝粗线=请求与动作主链</text>

  <line x1="320" y1="730" x2="370" y2="730" stroke="#34A853" stroke-width="2.5"/>
  <text x="380" y="734" font-size="12" fill="#3c4043">绿线=结果/分发到下游</text>

  <line x1="600" y1="730" x2="650" y2="730" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="660" y="734" font-size="12" fill="#3c4043">灰虚线=职责引用（同镜头共用）</text>

  <text x="50" y="780" font-size="13" font-weight="700" fill="#1a1a1a">状态角标：</text>
  <text x="130" y="780" font-size="12" fill="#3c4043">已落地=N1-04 屏幕操作；2.6 目标=N1-01/02 手势；长期/低优=N1-03/05/06；待核=路特斯车型手势识别合入状态</text>

  <text x="50" y="810" font-size="13" font-weight="700" fill="#1a1a1a">最容易看错：</text>
  <text x="130" y="810" font-size="12" fill="#3c4043">① N1-01 与 A04 不是两张图各装一个摄像头，是同一个 OMS/DMS 镜头被两种用法共用；</text>
  <text x="130" y="830" font-size="12" fill="#3c4043">② "屏幕被点了"（N1 埋点）≠ "用嘴说出按钮名点下去"（W 图）；</text>
  <text x="130" y="850" font-size="12" fill="#3c4043">③ "指着说"这一代 SOP 不做，但 Yes/No 手势仍要做（主动服务弹卡时）。</text>
</svg>
