<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" role="img" aria-label="“我们有多少个工具”：五个数字，五种范围"><title>“我们有多少个工具”：五个数字，五种范围</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="710" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">“我们有多少个工具”：五个数字，五种范围</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">这些数字统计的对象不同；先看时间、项目和范围，再理解各自含义</text><rect x="40" y="100" width="200" height="80" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="54" y="127" font-size="22" fill="#4b5560" font-weight="650" text-anchor="start">23 个</text><rect x="260" y="100" width="940" height="80" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="274" y="127" font-size="17" fill="#4b5560" font-weight="650" text-anchor="start">更早的一种说法</text><text x="274" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">更早一版说明书；工具名是旧名（如 search_poi_qa），现已换成标准化名</text><rect x="40" y="200" width="200" height="80" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="227" font-size="22" fill="#1d4b35" font-weight="650" text-anchor="start">27 个</text><rect x="260" y="200" width="940" height="80" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="274" y="227" font-size="17" fill="#1d4b35" font-weight="650" text-anchor="start">上汽一份提示词里 Planner 能选的（7 月底）</text><text x="274" y="252" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一个项目、一个时间点，Planner 真正能选的；编号写到 28，中间缺 7 号；美团订座在第 28 号</text><rect x="40" y="300" width="200" height="80" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="54" y="327" font-size="22" fill="#5c4c12" font-weight="650" text-anchor="start">33 行</text><rect x="260" y="300" width="940" height="80" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="274" y="327" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start">标准化工具表：允许接什么（10 月）</text><text x="274" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">14 行必选、16 行可选、3 个上汽定制；“允许接”不等于“已经接”</text><rect x="40" y="400" width="200" height="80" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="54" y="427" font-size="22" fill="#5c4c12" font-weight="650" text-anchor="start">40 行</text><rect x="260" y="400" width="940" height="80" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="274" y="427" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start">工具输入输出约定表</text><text x="274" y="452" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">产品维护的定义和回包写法</text><rect x="40" y="500" width="200" height="80" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="54" y="527" font-size="22" fill="#6a4314" font-weight="650" text-anchor="start">约 50 个编号</text><rect x="260" y="500" width="940" height="80" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="274" y="527" font-size="17" fill="#6a4314" font-weight="650" text-anchor="start">一份配置快照（11 月初）</text><text x="274" y="552" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">225 条配置、约 50 个编号；含内部工具、车上离线工具和停用配置</text><rect x="40" y="610" width="1160" height="80" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="54" y="637" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">为什么对不上</text><text x="54" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">时间不同（7 月底与 11 月初）；对象不同（单个项目与全部渠道）；范围不同（允许接 / 配了 / Planner 看得见）。</text></g></svg>