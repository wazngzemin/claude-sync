<svg xmlns="http://www.w3.org/2000/svg" width="2297" height="1726" viewBox="0 0 2297 1726" role="img" aria-label="输入管理"><title>输入管理</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M766,428 L766,664" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="669" y="524" width="100" height="44" rx="3" fill="#fff"/><text x="674" y="548" font-size="15" fill="#435c70" font-weight="400"><tspan x="674" dy="0">新有效输入</tspan></text><path d="M727,846 L727,1082" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="615" y="942" width="115" height="44" rx="3" fill="#fff"/><text x="620" y="966" font-size="15" fill="#435c70" font-weight="400"><tspan x="620" dy="0">无推理、无播报</tspan></text><path d="M805,846 L805,894 L1187,894 L1187,1082" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1045" y="942" width="145" height="44" rx="3" fill="#fff"/><text x="1050" y="966" font-size="15" fill="#435c70" font-weight="400"><tspan x="1050" dy="0">未完整输出、未起播</tspan></text><path d="M883,846 L883,884 L1647,884 L1647,1082" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1415" y="942" width="235" height="44" rx="3" fill="#fff"/><text x="1420" y="966" font-size="15" fill="#435c70" font-weight="400"><tspan x="1420" dy="0">已起播或输出完整，且是用户新话</tspan></text><path d="M649,846 L649,884 L267,884 L267,1082" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="942" width="235" height="44" rx="3" fill="#fff"/><text x="40" y="966" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">已起播或输出完整，且是其他输入</tspan></text><path d="M727,1264 L727,1500" fill="none" stroke="#52728b" 