font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">L-2</tspan></text><text x="455" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">根据注册条件组织任务</tspan></text><text x="455" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">端侧触发器</tspan></text><text x="455" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">VLM 启停或推理指令</tspan></text></g></a><a href="#module/L/step/L-3"><g data-step="L-3"><rect x="435" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">L-3</tspan></text><text x="455" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">立即返回指令是否送达</tspan></text><text x="455" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">VLM SDK</tspan></text><text x="455" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">同步接收状态</tspan></text></g></a><a href="#module/L/step/L-4"><g data-step="L-4"><rect x="435" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">L-4</tspan></text><text x="455" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">取得画面并运行模型</tspan></text><text x="455" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">VLM SDK</tspan></text><text x="455" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">原始视觉结果与运行状态</tspan></text></g></a><a href="#module/L/step/L-5"><g data-step="L-5"><rect x="500" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">L-5</tspan></text><text x="520" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">回传任务实际工作状态</tspan></text><text x="520" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">控制通道 → 端侧触发器</tspan></text><text x="520" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">更新任务状态表</tspan></text></g></a><a href="#module/L/step/L-6"><g data-step="L-6"><rect x="40" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">L-6</tspan></text><text x="60" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">发布完整视觉输出</tspan></text><text x="60" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">数据通道 → 数据中心</tspan></text><text x="60" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">带任务与时间的视觉数据</tspan></text></g></a><a href="#module/L/step/L-7"><g data-step="L-7"><rect x="200" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="200" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="220" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="220" dy="0">L-7</tspan></text><text x="220" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="220" dy="0">按任务类型续接或结束</tspan></text><text x="220" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="220" dy="0">端侧触发器</tspan></text><text x="220" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="220" dy="0">任务继续、停止或异常状态</tspan></text></g></a><a href="#module/L/step/L-8"><g data-step="L-8"><rect x="660" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="660" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="680" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="680" dy="0">L-8</tspan></text><text x="680" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="680" dy="0">停止条件出现后确认停机</tspan></text><text x="680" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="680" dy="0">端侧触发器 / SDK</tspan></text><text x="680" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="680" dy="0">已停止状态</tspan></text></g></a></g></svg>