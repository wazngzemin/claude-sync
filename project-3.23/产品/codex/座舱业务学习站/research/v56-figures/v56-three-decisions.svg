<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="v56-three-decisions" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="v56-three-decisions-title v56-three-decisions-desc">
<title id="v56-three-decisions-title">一句话的三次决定</title><desc id="v56-three-decisions-desc">先停播，再判断接不接，最后选择结果；前一次通过，不等于后一次也通过。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="v56-three-decisions-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44">一句话的三次决定</text><text class="v56-subtitle" x="32" y="72">先停播，再判断接不接，最后选择结果；前一次通过，不等于后一次也通过。</text>
<text class="v56-label" x="32" y="120" text-anchor="start">例子：“帮我把副驾座椅加热打开”</text>
<text class="v56-node-title" x="32" y="164" text-anchor="start">用户还在说</text>
<text class="v56-node-title" x="430" y="164" text-anchor="start">用户说完</text>
<text class="v56-node-title" x="828" y="164" text-anchor="start">交办</text>
<path class="v56-arrow" d="M 372 318 L 430 318" fill="none" marker-end="url(#v56-three-decisions-arr)"/>
<path class="v56-arrow" d="M 770 318 L 828 318" fill="none" marker-end="url(#v56-three-decisions-arr)"/>
<g data-node="true">
<rect class="v56-decision" x="32" y="190" width="340" height="260" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="217" text-anchor="start">流式拒识</text>
<text class="v56-node-sub" x="46" y="242" text-anchor="start">读到：过程文字</text>
<text class="v56-node-sub" x="46" y="263" text-anchor="start">输出：停不停播报</text>
<text class="v56-node-sub" x="46" y="284" text-anchor="start">能否执行：不能</text>
</g>
<g data-node="true">
<rect class="v56-decision" x="430" y="190" width="340" height="260" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="217" text-anchor="start">云端最终拒识</text>
<text class="v56-node-sub" x="444" y="242" text-anchor="start">读到：定稿文字＋历史</text>
<text class="v56-node-sub" x="444" y="263" text-anchor="start">输出：接或不接</text>
<text class="v56-node-sub" x="444" y="284" text-anchor="start">能否执行：不能</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="828" y="190" width="340" height="260" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="217" text-anchor="start">端云采纳</text>
<text class="v56-node-sub" x="842" y="242" text-anchor="start">读到：两边结果</text>
<text class="v56-node-sub" x="842" y="263" text-anchor="start">车上和云端各自出结果</text>
<text class="v56-node-sub" x="842" y="284" text-anchor="start">输出：采用哪份结果</text>
<text class="v56-node-sub" x="842" y="305" text-anchor="start">能否执行：采用后才执行</text>
</g>
<text class="v56-subtitle" x="32" y="501" text-anchor="start">箭头表示三次决定的先后；车上和云端的处理可以同时准备。</text>
<rect class="v56-decision" x="32" y="551" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="565" text-anchor="start">黄：停播或接话判断</text>
<rect class="v56-cloud" x="222" y="551" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="250" y="565" text-anchor="start">绿：结果采纳</text>
</svg>
