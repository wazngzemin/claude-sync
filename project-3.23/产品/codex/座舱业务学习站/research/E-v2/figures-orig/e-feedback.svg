<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="805" viewBox="0 0 1260 805" role="img" aria-label="车上回执怎样变成 Planner 读到的那句话"><title>车上回执怎样变成 Planner 读到的那句话</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1260" height="805" fill="#ffffff" data-decoration="background"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">车上回执怎样变成 Planner 读到的那句话</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">车控工具为例；右列是 Planner 实际读到的文字</text><text x="40" y="104" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上回来的</text><text x="380" y="104" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端怎么改写</text><text x="720" y="104" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">Planner 读到的那句话</text><rect x="30" y="120" width="300" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><text x="44" y="147" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">成功，写了说明</text><text x="44" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：遮阳帘开关，成功</text><rect x="370" y="120" width="300" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="384" y="147" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">原样拼成一句</text><text x="384" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">Planner 的指令 + 函数名 + 状态</text><rect x="710" y="120" width="520" height="96" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6" data-node="true"/><text x="724" y="147" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">执行指令：打开后排遮阳帘，执行结果：</text><text x="724" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">遮阳帘开关，执行成功，可简洁回复做好了｜完成。</text><path d="M330,168 L370,168" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M670,168 L710,168" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="238" width="300" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><text x="44" y="265" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">成功，说明为空</text><text x="44" y="290" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只有“成功”，没写做了什么</text><rect x="370" y="238" width="300" height="96" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true"/><text x="384" y="265" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">默认补一句</text><text x="384" y="290" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">赛力斯的做法</text><rect x="710" y="238" width="520" height="96" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true"/><text x="724" y="265" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">执行成功，可简洁回复做好了｜完成</text><text x="724" y="290" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（这句是云端补的，不是车上写的）</text><path d="M330,286 L370,286" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M670,286 L710,286" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="356" width="300" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><text x="44" y="383" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">失败，带原因</text><text x="44" y="408" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：靠背已到语音调节极限</text><rect x="370" y="356" width="300" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="384" y="383" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">拼上失败原因</text><text x="384" y="408" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">原因要有对应话术（DM 逻辑）</text><rect x="710" y="356" width="520" height="96" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6" data-node="true"/><text x="724" y="383" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">……座椅靠背角度调节，执行失败，为了安全，</text><text x="724" y="408" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已调节到语音的极限值，再调节需要用户手动操作。</text><path d="M330,404 L370,404" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M670,404 L710,404" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="474" width="300" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><text x="44" y="501" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车没回结果（超时）</text><text x="44" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">各工具自己定超时时间</text><rect x="370" y="474" width="300" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="384" y="501" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">按超时处理</text><text x="384" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">统一一句，不自动重试</text><text x="384" y="547" font-size="14" fill="#33495b" font-weight="400" text-anchor="start"></text><rect x="710" y="474" width="520" height="96" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6" data-node="true"/><text x="724" y="501" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">执行失败，请勿重复调用，需要告知用户</text><path d="M330,522 L370,522" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M670,522 L710,522" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="610" width="1200" height="120" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true"/><text x="44" y="637" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">回执只说“执行了哪个函数”，不说“车现在是什么状态”</text><text x="44" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">主例：Planner 下发“副驾空调温度调到4度”，回来的是“空调温度调节，执行成功，可简洁回复做好了｜完成”。</text><text x="44" y="683" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">回执里看不出车上实际调到了多少度</text></g><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" data-legend="true"><rect x="32" y="770.0" width="16" height="16" rx="4" fill="#eaf2fb" stroke="#4f7ea9" data-decoration="legend"/><text x="57" y="783.0" fill="#5d7183" font-size="14">蓝：车上回执</text><rect x="322" y="770.0" width="16" height="16" rx="4" fill="#eaf6ef" stroke="#4a9670" data-decoration="legend"/><text x="347" y="783.0" fill="#5d7183" font-size="14">绿：云端改写</text><rect x="612" y="770.0" width="16" height="16" rx="4" fill="#fdf2e6" stroke="#c8873a" data-decoration="legend"/><text x="637" y="783.0" fill="#5d7183" font-size="14">黄：反馈正文</text><rect x="902" y="770.0" width="16" height="16" rx="4" fill="#fdeeee" stroke="#c45c5c" data-decoration="legend"/><text x="927" y="783.0" fill="#5d7183" font-size="14">红：补写成功与局限</text></g></svg>