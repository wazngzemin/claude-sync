<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1280" viewBox="0 0 1660 1280">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1280" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">新手引导触发链路</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">语义模型识别场景，触发器核对条件与计次，DT 承接对话和执行</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="70" y="185" width="1520" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="98" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">场景配置平台</text><text x="98" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">语义描述与示例、组合条件、引导建议、次数及启停</text><text x="98" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">配置变更同步到模型候选与触发器规则</text><line x1="310" y1="325" x2="310" y2="390" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="328" y="365.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">候选配置生效</text><rect x="70" y="400" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="98" y="440" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">对话入口 → 语义匹配模型</text><text x="98" y="478" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">用户表达与已配置场景匹配</text><text x="98" y="509" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">只输出相关场景或无匹配</text><rect x="590" y="400" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="618" y="440" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">明确业务事件</text><text x="618" y="478" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">记忆同步完成等真实事件</text><text x="618" y="509" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">直接作为条件输入</text><rect x="1110" y="400" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1138" y="440" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">账号及功能模块</text><text x="1138" y="478" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">注册、授权、使用等状态</text><text x="1138" y="509" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">提供实际可取得的事实</text><line x1="310" y1="540" x2="310" y2="610" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><line x1="830" y1="540" x2="830" y2="610" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><line x1="1350" y1="540" x2="1350" y2="610" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="620" width="1520" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="98" y="660" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器：组合条件判断</text><text x="98" y="698" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">结合相关性或事件，检查状态、次数与适用范围；条件未知或不满足则退出</text><text x="98" y="729" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">条件满足并去重后，向 DT 提供当前场景的预设引导建议</text><line x1="830" y1="760" x2="830" y2="835" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="848" y="805.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">建议关联本轮请求</text><rect x="70" y="845" width="1520" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="98" y="885" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT／Planner：结合原请求处理建议</text><text x="98" y="923" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">在当前轮有效窗口内接收建议，组织回复、生成动作并调用既有工具</text><text x="98" y="954" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">工具反馈返回 DT 后继续判断；明确记忆同步事件由 DT 检索真实记忆</text><line x1="400" y1="985" x2="400" y2="1065" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="418" y="1033.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">对应推理已开始</text><line x1="1210" y1="985" x2="1210" y2="1065" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1228" y="1033.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">回复或工具动作</text><rect x="70" y="1075" width="700" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="98" y="1115" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器：成功计次与结束</text><text x="98" y="1153" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">关联本条建议，仅计一次</text><text x="98" y="1184" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">达到配置上限后停止主动引导</text><rect x="890" y="1075" width="700" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="918" y="1115" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">既有工具与端侧交互</text><text x="918" y="1153" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">真实执行，返回工具与播放结果</text><text x="918" y="1184" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">处理成功、用户触达、功能成功分开记录</text>
</svg>