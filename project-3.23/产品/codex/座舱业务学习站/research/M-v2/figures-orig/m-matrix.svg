<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" role="img" aria-label="准入一张表：新输入来了，看对话现在在干什么"><title>准入一张表：新输入来了，看对话现在在干什么</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8" /></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="810" fill="#ffffff" data-background="true" /><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start" id="m-matrix-text-1">准入一张表：新输入来了，看对话现在在干什么</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start" id="m-matrix-text-2">行是对话状态，列是新来的输入；格子里是处理方式</text><path d="M250.0 160.0H554.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="264" y="137" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-matrix-text-3">用户说话（P0）</text><path d="M570.0 160.0H874.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="584" y="137" font-size="15" fill="#22384a" font-weight="650" text-anchor="start" id="m-matrix-text-4">主动建议、事件（P1，可合并）</text><path d="M890.0 160.0H1194.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="904" y="137" font-size="15" fill="#22384a" font-weight="650" text-anchor="start" id="m-matrix-text-5">工具结果（P1，单独）</text><path d="M30.0 308.0H234.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="44" y="201" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start" id="m-matrix-text-6">空闲</text><text x="44" y="226" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-7">没在想，也没在说</text><path d="M30.0 458.0H234.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="44" y="351" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start" id="m-matrix-text-8">处理中</text><text x="44" y="376" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-9">Planner 在想，还没出字</text><path d="M30.0 608.0H234.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="44" y="501" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start" id="m-matrix-text-10">输出中</text><text x="44" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-11">已出字，或车上还在播</text><rect x="250" y="174" width="304" height="134" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="264" y="201" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-matrix-text-12">立即交给 Planner</text><text x="264" y="226" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-13">马上开始这一轮推理</text><rect x="570" y="174" width="304" height="134" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="584" y="201" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-matrix-text-14">立即交给 Planner</text><text x="584" y="226" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-15">多条可合并的一起交</text><rect x="890" y="174" width="304" height="134" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" /><text x="904" y="201" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-matrix-text-16">立即交给 Planner</text><text x="904" y="226" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-17">单独一轮</text><rect x="570" y="324" width="304" height="134" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="584" y="351" font-size="15" fill="#22384a" font-weight="650" text-anchor="start" id="m-matrix-text-18">排队</text><text x="584" y="376" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-19">不打断当前这一轮</text><text x="584" y="397" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-20">轮到时和同类合并</text><rect x="890" y="324" width="304" height="134" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="904" y="351" font-size="15" fill="#22384a" font-weight="650" text-anchor="start" id="m-matrix-text-21">排队</text><text x="904" y="376" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-22">轮到时单独处理</text><rect x="250" y="474" width="304" height="134" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6" data-node="true" /><text x="264" y="501" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start" id="m-matrix-text-23">车上先停播，再打断</text><text x="264" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-24">只处理新话</text><text x="264" y="547" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-25">已播 / 没播的内容和原输入</text><text x="264" y="568" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-26">作中断上下文交给 Planner</text><rect x="570" y="474" width="304" height="134" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="584" y="501" font-size="15" fill="#22384a" font-weight="650" text-anchor="start" id="m-matrix-text-27">排队</text><text x="584" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-28">等车上报“播完”</text><rect x="890" y="474" width="304" height="134" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="904" y="501" font-size="15" fill="#22384a" font-weight="650" text-anchor="start" id="m-matrix-text-29">排队</text><text x="904" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-30">等车上报“播完”，单独处理</text><rect x="250" y="324" width="304" height="134" rx="8" fill="#fff" stroke="#c45c5c" stroke-width="1.6" data-node="true" /><text x="264" y="348" font-size="14" fill="#6e2222" font-weight="650" text-anchor="start" id="m-matrix-text-31">先看：这一轮工具发出去没有？</text><text x="264" y="378" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-32">没发 → 打断，旧话 + 新话合并重推</text><text x="264" y="406" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-33">已发 → 打断，只处理新话，</text><text x="264" y="428" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-34">旧话和已发工具当背景</text><path d="M30.0 750.0H1210.0" fill="none" stroke="#c9d6e1" stroke-width="1.2" /><text x="44" y="667" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start" id="m-matrix-text-35">准入的两条底线</text><text x="44" y="692" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-36">① P1 在处理中、输出中都排队；有用户的话触发重推时，排队中可合并的跟着进去。</text><text x="44" y="713" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-37">② 语音已起播，只办新话，旧话作中断上下文。</text><text x="44" y="734" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-matrix-text-38">要抢占须定义成 P0；高优先级建议预留，本期不启用。</text><circle cx="39" cy="781.0" r="7" fill="#eaf6ef" stroke="#4a9670" /><text x="53" y="786.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-matrix-text-39">绿：立即处理</text><circle cx="209" cy="781.0" r="7" fill="#fff" stroke="#9fb2c2" /><text x="223" y="786.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-matrix-text-40">白：排队或按边界决定</text><circle cx="392" cy="781.0" r="7" fill="#fdeeee" stroke="#c45c5c" /><text x="406" y="786.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-matrix-text-41">红：停播后只办新话</text></g></svg>
