oke="white" stroke-width="7"/><polyline points="260,706 260,836" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="460,932 590,932" fill="none" stroke="white" stroke-width="7"/><polyline points="460,932 590,932" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,932 1120,932" fill="none" stroke="white" stroke-width="7"/><polyline points="990,932 1120,932" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,836 1320,820.1739130434783 479.1578947368421,820.1739130434783 479.1578947368421,249 460,249" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,836 1320,820.1739130434783 479.1578947368421,820.1739130434783 479.1578947368421,249 460,249" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,249 1009.1578947368421,249 1009.1578947368421,1142.1739130434783 1320,1142.1739130434783 1320,1158" fill="none" stroke="white" stroke-width="7"/><polyline points="990,249 1009.1578947368421,249 1009.1578947368421,1142.1739130434783 1320,1142.1739130434783 1320,1158" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1520,1282 1535.5555555555557,1282 1535.5555555555557,249 1520,249" fill="none" stroke="white" stroke-width="7"/><polyline points="1520,1282 1535.5555555555557,1282 1535.5555555555557,249 1520,249" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,1406 1320,1414.9025641025642 260,1414.9025641025642 260,1406" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,1406 1320,1414.9025641025642 260,1414.9025641025642 260,1406" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,597 570.8421052631579,597 570.8421052631579,1282 590,1282" fill="none" stroke="white" stroke-width="7"/><polyline points="590,597 570.8421052631579,597 570.8421052631579,1282 590,1282" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,1158 790,1142.1739130434783 501.0526315789474,1142.1739130434783 501.0526315789474,721.8260869565217 260,721.8260869565217 260,706" fill="none" stroke="white" stroke-width="7"/><polyline points="790,1158 790,1142.1739130434783 501.0526315789474,1142.1739130434783 501.0526315789474,721.8260869565217 260,721.8260869565217 260,706" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,1028 1320,1043.8260869565217 260,1043.8260869565217 260,1158" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,1028 1320,1043.8260869565217 260,1043.8260869565217 260,1158" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><rect x="60" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P01</text><text x="80" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">选场景模式与业务归属</text><text x="80" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">简单条件或 Workflow 判断流程</text><text x="80" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">普通场景或系统预设任务</text><text x="80" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">模板只预填，仍须逐项核对</text><rect x="590" y="140" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="610" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P02</text><text x="610" y="202" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">选谁可用，在哪个环境用</text><text x="610" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">渠道、车辆、车型、软件版本</text><text x="610" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">平台开关与本车开关分别管理</text><text x="610" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不支持的视觉渠道拦截配置</text><rect x="1120" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P03</text><text x="1140" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">选条件与叫醒检查的信号</text><text x="1140" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">动态变化/静态当前值/视觉目标</text><text x="1140" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">核对信号对象、类型、单位</text><text x="1140" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">位置主键避免主驾与后排串线</text><text x="1140" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">查看哪些信号真正唤醒判断</text><rect x="1120" y="488" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P04</text><text x="1140" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">把复杂判断按步骤连起来</text><text x="1140" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">DAG无环、唯一Sink</text><text x="1140" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">条件节点多输入AND</text><text x="1140" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">OR至少两支，一支通过可继续</text><text x="1140" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">缺信号/超时=UNKNOWN非REJECT</text><rect x="590" y="488" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P05</text><text x="610" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">选择命中后要做什么</text><text x="610" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">明确是建议、任务回调还是展示</text><text x="610" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">动作有各自字段与下游责任</text><text x="610" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">触发器不直接替用户作确认</text><text x="610" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">10/21统一Action Dispatcher设计</text><rect x="60" y="488" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P06</text><text x="80" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">填写运行与结束规则</text><text x="80" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">间隔/次数/优先级按场景确认</text><text x="80" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">条件达成和允许发出分开</text><text x="80" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">5分钟闪念间隔仍是待定示例</text><text x="80" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不复用PHUD15分钟去重当频控</text><rect x="60" y="836" width="400" height="192" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="80" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P07</text><text x="80" y="898" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">保存校验与发布检查</text><text x="80" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">检查能力、参数、对象和判断图</text><text x="80" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">缺失信号不能带病发布</text><text x="80" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">保存成功还要核对服务端注册</text><rect x="590" y="836" width="400" height="192" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="610" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P08</text><text x="610" y="898" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">让目标车辆拿到有效规则</text><text x="610" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">云端按发布版本加载场景</text><text x="610" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">任务中心同步预设场景与用户开关</text><text x="610" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">端侧统一配置下发属于后续建设</text><rect x="1120" y="836" width="400" height="192" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="1140" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P09</text><text x="1140" y="898" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">用真实场景验收并追溯</text><text x="1140" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">查唤醒、逐步判断与策略拦截</text><text x="1140" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">再查出口、展示和车辆实际结果</text><text x="1140" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">修改后验证旧规则不会继续误触发</text><rect x="1120" y="1158" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="1140" y="1186" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P10</text><text x="1140" y="1220" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">全渠道权限：可创</text><text x="1140" y="1250" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">建不等于全车可用</text><text x="1140" y="1289" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">指定管理员才有全渠道权限</text><text x="1140" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">普通管理员/运营不自动拥有</text><text x="1140" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">测试与生产都前后端校验</text><text x="1140" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">权限需求不等于通用发布审批</text><rect x="590" y="1158" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="1186" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P11</text><text x="610" y="1220" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">模板场景先核能力，</text><text x="610" y="1250" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">再核确认路径</text><text x="610" y="1289" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">充电：前置→VQA→询问→开盖</text><text x="610" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">儿童/宠物→锁状态→用户确认</text><text x="610" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">后视镜/洗车退出仍有待接项</text><text x="610" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">湿度/温差在10/9版已删除</text><rect x="60" y="1158" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="1186" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">P12</text><text x="80" y="1220" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">发布验收要覆盖失败与撤销</text><text x="80" y="1259" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">保存/注册/目标范围/真实触发</text><text x="80" y="1285" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">再看下游接收、显示或车控</text><text x="80" y="1311" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">更新停用后验证旧规则失效</text><text x="80" y="1337" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Mock链路不能代替真实视觉验收</text><rect x="472.3157894736842" y="252.35384615384615" width="105.36842105263162" height="60" rx="3" fill="#FFFFFF"/><text x="478.3157894736842" y="276.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">确定配置</text><text x="478.3157894736842" y="300.3538461538461" font-size="20" font-weight="500"