<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <text x="40" y="30" font-size="20" font-weight="bold" fill="#222">N9｜记忆分层后台生产：事件 → 瞬时 → 短期 → 长期情景 → 用户画像</text>

  <!-- Legend -->
  <rect x="1060" y="44" width="310" height="110" fill="#FFFFFF" stroke="#999999" stroke-width="1" rx="6"/>
  <text x="1072" y="62" font-size="12" font-weight="bold" fill="#333">图例</text>
  <rect x="1072" y="70" width="14" height="10" fill="#E3EEFB" stroke="#4A90D9"/><text x="1092" y="79" font-size="11" fill="#333">蓝=普通加工</text>
  <rect x="1190" y="70" width="14" height="10" fill="#FBF0D0" stroke="#D9A93A"/><text x="1210" y="79" font-size="11" fill="#333">金=判断关卡</text>
  <rect x="1072" y="88" width="14" height="10" fill="#E2F2E4" stroke="#4CAF50"/><text x="1092" y="97" font-size="11" fill="#333">绿=交出/回流</text>
  <rect x="1190" y="88" width="14" height="10" fill="#F0F0F0" stroke="#999999"/><text x="1210" y="97" font-size="11" fill="#333">灰=待优化/边界</text>
  <line x1="1072" y1="112" x2="1086" y2="112" stroke="#4A90D9" stroke-width="2.5"/><text x="1092" y="116" font-size="11" fill="#333">蓝粗=生产主链</text>
  <line x1="1190" y1="112" x2="1204" y2="112" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3"/><text x="1210" y="116" font-size="11" fill="#333">灰虚线=交 K 图</text>
  <text x="1072" y="138" font-size="10" fill="#666">角标：绿=已落地 金=2.6目标</text>

  <!-- 进料 module -->
  <rect x="30" y="70" width="150" height="130" fill="#FAFAFA" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
  <text x="42" y="90" font-size="12" font-weight="bold" fill="#444">进料</text>
  <text x="42" y="108" font-size="10.5" fill="#333">云测：埋点 / Watcher</text>
  <text x="42" y="124" font-size="10.5" fill="#333">CV / 对话模块</text>
  <text x="42" y="146" font-size="10.5" fill="#333">端测：CV / 端端节点</text>
  <text x="42" y="162" font-size="10.5" fill="#333">对话 / APP 信息</text>
  <text x="42" y="178" font-size="10.5" fill="#333">相关事件 / 人人对话</text>

  <line x1="180" y1="135" x2="208" y2="135" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="208,131 218,135 208,139" fill="#4A90D9"/>

  <!-- N9-01 -->
  <rect x="220" y="70" width="165" height="130" fill="#E3EEFB" stroke="#4A90D9" stroke-width="2" rx="8"/>
  <text x="232" y="90" font-size="12.5" font-weight="bold" fill="#222">N9-01 事件日志</text>
  <rect x="316" y="78" width="60" height="16" fill="#4CAF50" rx="3"/><text x="324" y="90" font-size="10" fill="#fff">已落地</text>
  <text x="232" y="112" font-size="10.5" fill="#333">固定格式【主体】+【做了</text>
  <text x="232" y="127" font-size="10.5" fill="#333">什么】+【客体】</text>
  <text x="232" y="146" font-size="10.5" fill="#333">毫秒时间戳 / Face ID</text>
  <text x="232" y="161" font-size="10.5" fill="#333">可多人 / 触发任务ID</text>
  <text x="232" y="176" font-size="10.5" fill="#333">一对多</text>

  <line x1="385" y1="135" x2="408" y2="135" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="408,131 418,135 408,139" fill="#4A90D9"/>

  <!-- N9-02 校验 -->
  <rect x="420" y="85" width="130" height="100" fill="#FBF0D0" stroke="#D9A93A" stroke-width="2" rx="8"/>
  <text x="432" y="106" font-size="12.5" font-weight="bold" fill="#222">N9-02 校验</text>
  <text x="432" y="128" font-size="10.5" fill="#333">过 → 进瞬时</text>
  <text x="432" y="146" font-size="10.5" fill="#333">不过 → 丢弃</text>
  <text x="432" y="168" font-size="10" fill="#666">眨眼/微气流不记</text>

  <line x1="550" y1="135" x2="578" y2="135" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="578,131 588,135 578,139" fill="#4A90D9"/>

  <!-- N9-05 瞬时 -->
  <rect x="590" y="70" width="170" height="130" fill="#E3EEFB" stroke="#4A90D9" stroke-width="2" rx="8"/>
  <text x="602" y="90" font-size="12.5" font-weight="bold" fill="#222">N9-05 瞬时记忆</text>
  <rect x="686" y="78" width="60" height="16" fill="#4CAF50" rx="3"/><text x="694" y="90" font-size="10" fill="#fff">已落地</text>
  <text x="602" y="112" font-size="10.5" fill="#333">最新事件，细节最多</text>
  <text x="602" y="130" font-size="10.5" fill="#333">20 条事件或 20 分钟</text>
  <text x="602" y="148" font-size="10.5" fill="#333">聚合一次</text>
  <text x="602" y="170" font-size="10" fill="#666">转换点按艾宾浩斯：</text>
  <text x="602" y="184" font-size="10" fill="#666">20 分钟忘约 60%</text>

  <line x1="760" y1="135" x2="778" y2="135" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="778,131 788,135 778,139" fill="#4A90D9"/>

  <!-- N9-06 短期 -->
  <rect x="790" y="70" width="180" height="130" fill="#E3EEFB" stroke="#4A90D9" stroke-width="2" rx="8"/>
  <text x="802" y="90" font-size="12.5" font-weight="bold" fill="#222">N9-06 短期记忆</text>
  <rect x="886" y="78" width="60" height="16" fill="#4CAF50" rx="3"/><text x="894" y="90" font-size="10" fill="#fff">已落地</text>
  <text x="802" y="112" font-size="10.5" fill="#333">5W1H 五字段：类型/小类/</text>
  <text x="802" y="127" font-size="10.5" fill="#333">主体/起止时间/具体内容</text>
  <text x="802" y="146" font-size="10.5" fill="#333">与已有短期做增量总结</text>
  <text x="802" y="168" font-size="10" fill="#666">P0/P1/P2 共 13 类聚类</text>

  <line x1="970" y1="135" x2="988" y2="135" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="988,131 998,135 988,139" fill="#4A90D9"/>

  <!-- N9-07 长期情景 -->
  <rect x="1000" y="70" width="170" height="130" fill="#E3EEFB" stroke="#4A90D9" stroke-width="2" rx="8"/>
  <text x="1012" y="90" font-size="12.5" font-weight="bold" fill="#222">N9-07 长期情景</text>
  <rect x="1086" y="78" width="60" height="16" fill="#D9A93A" rx="3"/><text x="1094" y="90" font-size="10" fill="#fff">2.6目标</text>
  <text x="1012" y="112" font-size="10.5" fill="#333">每日重要信息，数据量最小</text>
  <text x="1012" y="130" font-size="10.5" fill="#333">分客观发生 / 推理两类</text>
  <text x="1012" y="148" font-size="10.5" fill="#333">推理类须标原因</text>
  <text x="1012" y="170" font-size="10" fill="#666">夜间固定更新；另有 20 分钟</text>
  <text x="1012" y="184" font-size="10" fill="#666">先摸底版（扩展方向）</text>

  <line x1="1170" y1="135" x2="1198" y2="135" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="1198,131 1208,135 1198,139" fill="#4A90D9"/>

  <!-- N9-08 长期语义 -->
  <rect x="1210" y="70" width="160" height="130" fill="#E3EEFB" stroke="#4A90D9" stroke-width="2" rx="8"/>
  <text x="1222" y="90" font-size="12.5" font-weight="bold" fill="#222">N9-08 长期语义</text>
  <rect x="1296" y="78" width="60" height="16" fill="#4CAF50" rx="3"/><text x="1304" y="90" font-size="10" fill="#fff">已落地</text>
  <text x="1222" y="112" font-size="10.5" fill="#333">用户画像：</text>
  <text x="1222" y="128" font-size="10.5" fill="#333">偏好 / 习惯 / 关注点</text>
  <text x="1222" y="150" font-size="10" fill="#666">原则：由具象到印象</text>
  <text x="1222" y="166" font-size="10" fill="#666">数据量逐层变小</text>
  <text x="1222" y="182" font-size="10" fill="#666">看到森林不只是树木</text>

  <!-- Row2: detail cards -->
  <rect x="30" y="240" width="500" height="200" fill="#E3EEFB" stroke="#4A90D9" stroke-width="1.5" rx="8"/>
  <text x="44" y="262" font-size="13" font-weight="bold" fill="#222">画像更新四机制（N9-08 的节拍）</text>
  <text x="44" y="286" font-size="11" fill="#333">① 每天夜间定时抽取：只抽取不推理</text>
  <text x="60" y="304" font-size="10" fill="#666">一周听 1000 遍《千里之外》也不总结"喜欢"</text>
  <text x="44" y="326" font-size="11" fill="#333">② 用户明说"记住 X"立即更新：Planner 先改写 query</text>
  <text x="60" y="344" font-size="10" fill="#666">"你记一下目的地是我家"→"芮婷的家是 XX 小区"</text>
  <text x="44" y="366" font-size="11" fill="#333">③ 每周五夜间分析推理：拿近 3 月情景</text>
  <text x="60" y="384" font-size="10" fill="#666">午餐 10 次日料 → 画像里写"喜欢日料"</text>
  <text x="44" y="406" font-size="11" fill="#333">④ 每周五夜间回顾遗忘：备婚办完 → 关注点清掉</text>

  <rect x="550" y="240" width="380" height="200" fill="#E3EEFB" stroke="#4A90D9" stroke-width="1.5" rx="8"/>
  <text x="564" y="262" font-size="13" font-weight="bold" fill="#222">短期聚类 13 类（P0/P1/P2）</text>
  <text x="564" y="286" font-size="11" font-weight="bold" fill="#B26A00">P0（优先）</text>
  <text x="564" y="304" font-size="10.5" fill="#333">导航（每段上电到下电聚一段）</text>
  <text x="564" y="320" font-size="10.5" fill="#333">车控（不同动因分别记：打喷嚏→升温）</text>
  <text x="564" y="336" font-size="10.5" fill="#333">多媒体（中断后再播放记两段）</text>
  <text x="564" y="352" font-size="10.5" fill="#333">闲聊主题（超两轮压缩：哈欠失眠）</text>
  <text x="564" y="374" font-size="11" font-weight="bold" fill="#B26A00">P1：环境变化 / 路况 / 车况　P2：其他APP / 系统设置 / 车身硬件 / 驾驶操作 / 多端互传 / 安全</text>

  <rect x="950" y="240" width="420" height="200" fill="#E3EEFB" stroke="#4A90D9" stroke-width="1.5" rx="8"/>
  <text x="964" y="262" font-size="13" font-weight="bold" fill="#222">长期情景记什么、不记什么</text>
  <text x="964" y="286" font-size="10.5" fill="#333">行程：每段上电到下电的起点/目的地/途经/目的/乘客</text>
  <text x="964" y="306" font-size="10.5" fill="#333">车控：只记生理心理相关 + 对车正负反馈</text>
  <text x="980" y="322" font-size="10" fill="#666">不记参数档位（20→23 度不进长期）</text>
  <text x="964" y="344" font-size="10.5" fill="#333">多媒体：只记情绪相关，不记具体歌单</text>
  <text x="964" y="364" font-size="10.5" fill="#333">闲聊：生理心理 / 故障维修洗车 / 烦心事爱好</text>
  <text x="980" y="380" font-size="10" fill="#666">/ 对车正负反馈 / 最近关注点（减肥、年终考核）</text>

  <!-- Row3 -->
  <rect x="30" y="470" width="360" height="110" fill="#FBF0D0" stroke="#D9A93A" stroke-width="2" rx="8"/>
  <text x="44" y="492" font-size="12.5" font-weight="bold" fill="#222">N9-09 身份：faceID/声纹 → 账号</text>
  <text x="44" y="514" font-size="10.5" fill="#333">识别失败 → 匿名会话，不挂账号</text>
  <text x="44" y="532" font-size="10.5" fill="#333">未注册乘客 → 不调用其记忆</text>
  <text x="44" y="554" font-size="10" fill="#666">真实生物特征留在端上，云端只拿关联标识</text>

  <rect x="420" y="470" width="380" height="110" fill="#E2F2E4" stroke="#4CAF50" stroke-width="2" rx="8"/>
  <text x="434" y="492" font-size="12.5" font-weight="bold" fill="#222">交 K 图（前台取用）</text>
  <text x="434" y="514" font-size="10.5" fill="#333">K04 收事件 / K05 短期 / K06 长期</text>
  <text x="434" y="532" font-size="10.5" fill="#333">删除 → K14 联动清画像与历史</text>
  <text x="434" y="550" font-size="10.5" fill="#333">记忆冲突 → 以最新 / 用户确认为准</text>
  <text x="434" y="568" font-size="10" fill="#666">from N9 → to K：这是唯一跨模块出口</text>

  <rect x="830" y="470" width="540" height="110" fill="#F0F0F0" stroke="#999999" stroke-width="1.5" rx="8"/>
  <text x="844" y="492" font-size="12.5" font-weight="bold" fill="#222">待优化方向（尚未做）【讨论中】</text>
  <text x="844" y="514" font-size="10.5" fill="#333">用户画像个性化 / 人物小传 / 场景化记忆 / 反思与进步（lesson&amp;learn）</text>
  <text x="844" y="534" font-size="10.5" fill="#333">时序与空间记忆 / 记忆巩固淡忘 / 视觉记忆 / 豆包行为准则</text>
  <text x="844" y="556" font-size="10" fill="#666">讲解：这些是"记忆系统更像人"的远期方向，不要写进本轮验收</text>

  <!-- 灰虚线 交K -->
  <path d="M 905 200 L 905 225 L 610 225 L 610 470" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="30" y="620" font-size="11" fill="#444">读法：左进右出一条主链——每一层数据量比上一层小、比上一层更抽象；越往右越像"印象"而不是"流水账"。</text>
  <text x="30" y="642" font-size="11" fill="#444">易错点：夜里只抽取不推理——没让模型"想"，只是把素材搬进长期库；真推理只在每周五夜里，拿三个月情景做。</text>
</svg>
