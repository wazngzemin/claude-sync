<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="r2-reject-rules" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="r2-reject-rules-title r2-reject-rules-desc">
<title id="r2-reject-rules-title">一句话该不该接</title><desc id="r2-reject-rules-desc">先看当前对话状态下的硬规则；直接召回表示接话，不能直接执行动作。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="r2-reject-rules-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一句话该不该接</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先看当前对话状态下的硬规则；直接召回表示接话，不能直接执行动作。</text>
<g data-node="true">
<rect class="v56-neutral" x="32" y="126" width="738" height="64" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="153" text-anchor="start" data-fit="true">豆包在听到一句话</text>
</g>
<path class="v56-arrow" d="M 401 190 L 401 240" fill="none" marker-end="url(#r2-reject-rules-arr)"/>
<g data-node="true">
<rect class="v56-decision" x="32" y="240" width="738" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="267" text-anchor="start" data-fit="true">强聆听：是不是唤醒后 5 秒内开口的首句？</text>
<text class="v56-node-sub" x="46" y="292" text-anchor="start" data-fit="true">看开口时间，不要求在 5 秒内说完</text>
</g>
<path class="v56-arrow" d="M 770 290 L 900 290" fill="none" marker-end="url(#r2-reject-rules-arr)"/>
<text class="v56-label" x="818" y="275" text-anchor="start">是</text>
<path class="v56-arrow" d="M 401 340 L 401 400" fill="none" marker-end="url(#r2-reject-rules-arr)"/>
<text class="v56-label" x="418" y="374" text-anchor="start">否</text>
<g data-node="true">
<rect class="v56-decision" x="32" y="400" width="738" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="427" text-anchor="start" data-fit="true">车上是不是只有一个人？</text>
<text class="v56-node-sub" x="46" y="452" text-anchor="start" data-fit="true">单人不拒识</text>
</g>
<path class="v56-arrow" d="M 770 443 L 900 443" fill="none" marker-end="url(#r2-reject-rules-arr)"/>
<text class="v56-label" x="818" y="428" text-anchor="start">是</text>
<path class="v56-arrow" d="M 401 486 L 401 550" fill="none" marker-end="url(#r2-reject-rules-arr)"/>
<text class="v56-label" x="418" y="524" text-anchor="start">否</text>
<g data-node="true">
<rect class="v56-decision" x="32" y="550" width="738" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="577" text-anchor="start" data-fit="true">多人：超过 2 个字，且句首没叫“豆包”？</text>
<text class="v56-node-sub" x="46" y="602" text-anchor="start" data-fit="true">两个条件同时满足，才交给模型判断</text>
</g>
<path class="v56-arrow" d="M 770 600 L 900 600" fill="none" marker-end="url(#r2-reject-rules-arr)"/>
<text class="v56-label" x="818" y="585" text-anchor="start">否</text>
<g data-node="true">
<rect class="v56-decision" x="900" y="240" width="268" height="410" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="914" y="267" text-anchor="start" data-fit="true">直接召回</text>
<text class="v56-node-sub" x="914" y="292" text-anchor="start" data-fit="true">这句话按接话处理</text>
<text class="v56-node-sub" x="914" y="313" text-anchor="start" data-fit="true">后续仍需能力判断</text>
<text class="v56-node-sub" x="914" y="334" text-anchor="start" data-fit="true">以及端云仲裁</text>
</g>
<path class="v56-arrow" d="M 401 650 L 401 740" fill="none" marker-end="url(#r2-reject-rules-arr)"/>
<text class="v56-label" x="418" y="701" text-anchor="start">是：交给模型</text>
<g data-node="true">
<rect class="v56-cloud" x="32" y="740" width="738" height="150" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="767" text-anchor="start" data-fit="true">交给模型判断</text>
<text class="v56-node-sub" x="46" y="792" text-anchor="start" data-fit="true">流式拒识：没说完，判断要不要停播；IGNORE 则继续等字</text>
<text class="v56-node-sub" x="46" y="813" text-anchor="start" data-fit="true">云端最终拒识：说完后，判断整句接或不接</text>
<text class="v56-node-sub" x="46" y="834" text-anchor="start" data-fit="true">流式判断可以被最终判断推翻；网络正常时以云端最终拒识为准</text>
</g>
<text class="v56-label" x="828" y="718" text-anchor="start">车上同时给出拒识候选</text>
<g data-node="true">
<rect class="v56-reject v56-pending" x="828" y="740" width="340" height="150" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="767" text-anchor="start" data-fit="true">车上的 1.7B 模型 · reject</text>
<text class="v56-node-sub" x="842" y="792" text-anchor="start" data-fit="true">只拒明确的情况</text>
<text class="v56-node-sub" x="842" y="813" text-anchor="start" data-fit="true">模糊的交给云端</text>
<text class="v56-node-sub" x="842" y="834" text-anchor="start" data-fit="true">网络正常时，本地 reject 不采用</text>
</g>
<rect class="v56-neutral" x="32" y="956" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="970" text-anchor="start">灰：话语入口</text>
<rect class="v56-decision" x="232" y="956" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="260" y="970" text-anchor="start">黄：规则与召回</text>
<rect class="v56-cloud" x="472" y="956" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="500" y="970" text-anchor="start">绿：模型判断</text>
<rect class="v56-reject v56-pending" x="692" y="956" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="720" y="970" text-anchor="start">红色虚线：车上保守拒识</text>
</svg>
