<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="s2-strategy" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="s2-strategy-title s2-strategy-desc">
<title id="s2-strategy-title">同样是车里热，五种服务策略怎么打扰主驾</title><desc id="s2-strategy-desc">用高温上车对照播报、出卡、等待和执行。具体车控策略要按场景会签。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="s2-strategy-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">同样是车里热，五种服务策略怎么打扰主驾</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">用高温上车对照播报、出卡、等待和执行。具体车控策略要按场景会签。</text>
<text class="v56-label" x="40" y="184" text-anchor="start">是否播报</text>
<text class="v56-label" x="40" y="241" text-anchor="start">是否出即时卡片</text>
<text class="v56-label" x="40" y="298" text-anchor="start">是否等用户</text>
<text class="v56-label" x="40" y="355" text-anchor="start">谁执行</text>
<text class="v56-label" x="40" y="412" text-anchor="start">AI Bar 显示什么</text>
<g data-node="true" id="s2-strategy-silent">
<rect class="v56-local" x="164" y="112" width="188" height="336" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="178" y="141" text-anchor="start">静默执行</text>
<path class="v56-rule" d="M 178 160 L 338 160"/>
<text class="v56-node-sub" x="178" y="184" text-anchor="start">不播报</text>
<path class="v56-rule" d="M 178 217 L 338 217"/>
<text class="v56-node-sub" x="178" y="241" text-anchor="start">不出即时卡片</text>
<path class="v56-rule" d="M 178 274 L 338 274"/>
<text class="v56-node-sub" x="178" y="298" text-anchor="start">不等</text>
<path class="v56-rule" d="M 178 331 L 338 331"/>
<text class="v56-node-sub" x="178" y="355" text-anchor="start">Planner 调车控</text>
<path class="v56-rule" d="M 178 388 L 338 388"/>
<text class="v56-node-sub" x="178" y="412" text-anchor="start">执行成功后显示</text>
<text class="v56-node-sub" x="178" y="432" text-anchor="start">“极速制冷中”</text>
</g>
<g data-node="true" id="s2-strategy-inform">
<rect class="v56-local" x="368" y="112" width="188" height="336" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="382" y="141" text-anchor="start">告知执行</text>
<path class="v56-rule" d="M 382 160 L 542 160"/>
<text class="v56-node-sub" x="382" y="184" text-anchor="start">告知开了极速制冷</text>
<path class="v56-rule" d="M 382 217 L 542 217"/>
<text class="v56-node-sub" x="382" y="241" text-anchor="start">出告知卡片</text>
<path class="v56-rule" d="M 382 274 L 542 274"/>
<text class="v56-node-sub" x="382" y="298" text-anchor="start">不等</text>
<path class="v56-rule" d="M 382 331 L 542 331"/>
<text class="v56-node-sub" x="382" y="355" text-anchor="start">Planner 调车控</text>
<path class="v56-rule" d="M 382 388 L 542 388"/>
<text class="v56-node-sub" x="382" y="412" text-anchor="start">执行成功后显示</text>
<text class="v56-node-sub" x="382" y="432" text-anchor="start">“极速制冷中”</text>
</g>
<g data-node="true" id="s2-strategy-voice">
<rect class="v56-decision" x="572" y="112" width="188" height="336" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="586" y="141" text-anchor="start">语音确认</text>
<path class="v56-rule" d="M 586 160 L 746 160"/>
<text class="v56-node-sub" x="586" y="184" text-anchor="start">问要不要开极速制冷</text>
<path class="v56-rule" d="M 586 217 L 746 217"/>
<text class="v56-node-sub" x="586" y="241" text-anchor="start">出卡，带确认</text>
<text class="v56-node-sub" x="586" y="261" text-anchor="start">和取消按钮</text>
<path class="v56-rule" d="M 586 274 L 746 274"/>
<text class="v56-node-sub" x="586" y="298" text-anchor="start">等用户同意</text>
<path class="v56-rule" d="M 586 331 L 746 331"/>
<text class="v56-node-sub" x="586" y="355" text-anchor="start">同意后由 Planner</text>
<text class="v56-node-sub" x="586" y="375" text-anchor="start">调车控</text>
<path class="v56-rule" d="M 586 388 L 746 388"/>
<text class="v56-node-sub" x="586" y="412" text-anchor="start">执行成功后显示</text>
<text class="v56-node-sub" x="586" y="432" text-anchor="start">“极速制冷中”</text>
</g>
<g data-node="true" id="s2-strategy-screen">
<rect class="v56-decision" x="776" y="112" width="188" height="336" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="790" y="141" text-anchor="start">界面确认</text>
<path class="v56-rule" d="M 790 160 L 950 160"/>
<text class="v56-node-sub" x="790" y="184" text-anchor="start">不播报</text>
<path class="v56-rule" d="M 790 217 L 950 217"/>
<text class="v56-node-sub" x="790" y="241" text-anchor="start">不出即时卡片</text>
<text class="v56-node-sub" x="790" y="261" text-anchor="start">AI Bar 出按钮</text>
<path class="v56-rule" d="M 790 274 L 950 274"/>
<text class="v56-node-sub" x="790" y="298" text-anchor="start">等用户点按钮</text>
<path class="v56-rule" d="M 790 331 L 950 331"/>
<text class="v56-node-sub" x="790" y="355" text-anchor="start">点击后由 Planner</text>
<text class="v56-node-sub" x="790" y="375" text-anchor="start">调车控</text>
<path class="v56-rule" d="M 790 388 L 950 388"/>
<text class="v56-node-sub" x="790" y="412" text-anchor="start">先显示建议按钮</text>
<text class="v56-node-sub" x="790" y="432" text-anchor="start">执行后更新状态</text>
</g>
<g data-node="true" id="s2-strategy-show">
<rect class="v56-neutral" x="980" y="112" width="188" height="336" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="994" y="141" text-anchor="start">仅展示</text>
<path class="v56-rule" d="M 994 160 L 1154 160"/>
<text class="v56-node-sub" x="994" y="184" text-anchor="start">不播报</text>
<path class="v56-rule" d="M 994 217 L 1154 217"/>
<text class="v56-node-sub" x="994" y="241" text-anchor="start">本例只用 AI Bar</text>
<path class="v56-rule" d="M 994 274 L 1154 274"/>
<text class="v56-node-sub" x="994" y="298" text-anchor="start">无需回应</text>
<path class="v56-rule" d="M 994 331 L 1154 331"/>
<text class="v56-node-sub" x="994" y="355" text-anchor="start">界面展示，车不动作</text>
<path class="v56-rule" d="M 994 388 L 1154 388"/>
<text class="v56-node-sub" x="994" y="412" text-anchor="start">显示“车内 38 度”</text>
</g>
<path class="v56-rule" d="M 32 468 L 1168 468"/>
<rect data-decoration="true" class="v56-local" x="32" y="488" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="502" text-anchor="start">蓝 · 直接执行，是否播报由策略决定</text>
<rect data-decoration="true" class="v56-decision" x="411" y="488" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="439" y="502" text-anchor="start">黄 · 用户确认后执行</text>
<rect data-decoration="true" class="v56-neutral" x="789" y="488" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817" y="502" text-anchor="start">灰 · 界面只展示信息</text>
</svg>
