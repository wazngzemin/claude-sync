<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 771" width="980" height="771" role="img" aria-label="“昨天那家”从哪里来：先找事实，再让模型判断" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="771" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-context" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">“昨天那家”从哪里来：先找事实，再让模型判断</text><text x="30" y="58" font-size="13" fill="#5f7169">Context是本轮所需背景；查不到不能编</text><g transform="translate(0,78)"><path class="flow-edge" data-from="request" data-to="known" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-context)"/><path class="flow-edge" data-from="known" data-to="enough" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-context)"/><path class="flow-edge" data-from="enough" data-to="memory" d="M820,130 L820,172 L490,172 L490,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-context)"/><path class="flow-edge" data-from="memory" data-to="found" d="M610,260.0 L700,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-context)"/><path class="flow-edge" data-from="found" data-to="ask" d="M820.0,306 L820.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-context)"/><path class="flow-edge" data-from="sync" data-to="cloud" d="M160.0,306 L160.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-context)"/><path class="flow-edge" data-from="cloud" data-to="known" d="M280,436.0 L300,436.0 L300,150 L350,150 L350,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-context)"/><path class="flow-edge" data-from="enough" data-to="ready" d="M940,84 L958,84 L958,612 L610,612" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-context)"/><path class="flow-edge" data-from="found" data-to="ready" d="M760,306 L760,336 L650,336 L650,612 L610,612" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-context)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">理解当前缺口</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">检查已有依据</text><text x="655.0" y="163.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">信息不足</text><text x="655.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">真实查询结果</text><text x="829.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">没有或不唯一</text><text x="169.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">上报实际经历</text><text x="309.0" y="297.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">作为后续背景</text><text x="935" y="560" text-anchor="end" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">已有唯一地点</text><text x="637" y="530" text-anchor="end" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">查询后已明确</text><g class="flow-point" data-point="request" role="button" tabindex="0" aria-label="用户只给了相对说法"><rect x="40" y="38" width="240" height="92" rx="13" fill="#eaf1ff" stroke="#627fae" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#627fae">用户</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">用户只给了相对说法</text><text x="54" y="110" font-size="12" fill="#587266">昨天那家游泳馆</text></g><g class="flow-point" data-point="known" role="button" tabindex="0" aria-label="汇集当前已知信息"><rect x="370" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#86ada7">处理</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">汇集当前已知信息</text><text x="384" y="110" font-size="12" fill="#587266">历史、车况、位置、情景</text></g><g class="flow-point" data-point="enough" role="button" tabindex="0" aria-label="是否已有唯一可靠地点"><rect x="700" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#bb8932">判断</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">是否已有唯一可靠地点</text><text x="714" y="110" font-size="12" fill="#587266">能定位不等于凭印象猜</text></g><g class="flow-point" data-point="memory" role="button" tabindex="0" aria-label="按缺口查询用户记忆"><rect x="370" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#86ada7">处理</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">按缺口查询用户记忆</text><text x="384" y="286" font-size="12" fill="#587266">只查本次需要的事实</text></g><g class="flow-point" data-point="found" role="button" tabindex="0" aria-label="得到唯一或多个候选"><rect x="700" y="214" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#bb8932">判断</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">得到唯一或多个候选</text><text x="714" y="286" font-size="12" fill="#587266">仍需判断是否明确</text></g><g class="flow-point" data-point="ask" role="button" tabindex="0" aria-label="没有／不唯一就澄清"><rect x="700" y="390" width="240" height="92" rx="13" fill="#eaf1ff" stroke="#627fae" stroke-width="1.5"/><text x="714" y="411" font-size="11" fill="#627fae">用户</text><text x="714" y="437" font-weight="700" font-size="16" fill="#203f35">没有／不唯一就澄清</text><text x="714" y="462" font-size="12" fill="#587266">用户补充后回到上方判断</text></g><g class="flow-point" data-point="sync" role="button" tabindex="0" aria-label="本地已发生的经历"><rect x="40" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#86ada7">处理</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">本地已发生的经历</text><text x="54" y="286" font-size="12" fill="#587266">问题、回复、执行结果</text></g><g class="flow-point" data-point="cloud" role="button" tabindex="0" aria-label="同步给云端后续使用"><rect x="40" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="411" font-size="11" fill="#86ada7">处理</text><text x="54" y="437" font-weight="700" font-size="16" fill="#203f35">同步给云端后续使用</text><text x="54" y="462" font-size="12" fill="#587266">同步失败不代表已知</text></g><g class="flow-point" data-point="ready" role="button" tabindex="0" aria-label="明确地点交给下一步规划"><rect x="370" y="566" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="384" y="587" font-size="11" fill="#36835f">结果</text><text x="384" y="613" font-weight="700" font-size="16" fill="#203f35">明确地点交给下一步规划</text><text x="384" y="638" font-size="12" fill="#587266">已有唯一事实就不重复查询</text></g></g></svg>