<svg xmlns="http://www.w3.org/2000/svg" width="930" height="2360" viewBox="0 0 930 2360" role="img" aria-label="插话、打断与恢复"><title>插话、打断与恢复</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M630,226 L630,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="533" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="538" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="538" dy="0">获得流式输入</tspan></text><path d="M630,644 L630,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="533" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="538" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="538" dy="0">判定需要打断</tspan></text><path d="M630,1062 L630,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="503" y="1158" width="130" height="44" rx="3" fill="#fff"/><text x="508" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="508" dy="0">继续取得最终输入</tspan></text><path d="M695,1480 L695,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="693" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="698" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="698" dy="0">最终有效</tspan></text><path d="M565,1480 L565,1518 L235,1518 L235,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">最终拒识</tspan></text><path d="M695,1898 L695,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="583" y="1994" width="115" height="44" rx="3" fill="#fff"/><text x="588" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="588" dy="0">新一轮处理完成</tspan></text><a href="#module/I/step/I-1"><g data-step="I-1"><rect x="435" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">I-1</tspan></text><text x="455" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">播报中出现新的说话声</tspan></text><text x="455" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">用户 / 语音输入</tspan></text><text x="455" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">新一轮语音与所属音区</tspan></text></g></a><a href="#module/I/step/I-2"><g data-step="I-2"><rect x="435" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">I-2</tspan></text><text x="455" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">判断是否应立即停止旧播报</tspan></text><text x="455" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">流式拒识模块</tspan></text><text x="455" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">打断事件</tspan></text></g></a><a href="#module/I/step/I-3"><g data-step="I-3"><rect x="435" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">I-3</tspan></text><text x="455" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">停播并展示新一轮 ASR</tspan></text><text x="455" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">客户端</tspan></text><text x="455" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">旧声音停止，新输入可见</tspan></text></g></a><a href="#module/I/step/I-4"><g data-step="I-4"><rect x="435" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">I-4</tspan></text><text x="455" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">决定新一句是否成为有效 Query</tspan></text><text x="455" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">拒识 / 入口链路</tspan></text><text x="455" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">有效 Query 或拒识结果</tspan></text></g></a><a href="#module/I/step/I-5"><g data-step="I-5"><rect x="500" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">I-5</tspan></text><text x="520" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">按上一轮所处阶段接收新指令</tspan></text><text x="520" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">输入调度 / Director</tspan></text><text x="520" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">新一轮推理输入</tspan></text></g></a><a href="#module/I/step/I-6"><g data-step="I-6"><rect x="40" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">I-6</tspan></text><text x="60" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">最终拒识：结束本次插话</tspan></text><text x="60" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">客户端</tspan></text><text x="60" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">延时聆听状态</tspan></text></g></a><a href="#module/I/step/I-7"><g data-step="I-7"><rect x="500" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">I-7</tspan></text><text x="520" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">有效输入：播出本轮结果</tspan></text><text x="520" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">输出链路</tspan></text><text x="520" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">新一轮用户可见结果</tspan></text></g></a></g></svg>