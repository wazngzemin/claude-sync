<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1807" viewBox="0 0 1660 1807">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1807" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">执行结果如何回到新手引导业务</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">记录走到哪一步，再按唯一口径计次；各阶段不能互相代填</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 发出本次引导建议</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">关联账号、场景版本与原请求</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">此时仅证明建议已交接</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 是否采用并进入对应推理？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">回传必须能关联到这次引导</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">这一步只证明系统开始处理</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">Agent 记录未采用／未知</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不写已触达</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">未知时不立即重发</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">采用</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">端侧是否开始播报？</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">需要真实可用的播报开始信号</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不能用 DT 已推理补填</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">Agent 记录未触达／未知</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">记录未触达或未知</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">按选定阶段判断计次</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">开口</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">记录播报完成或中断</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">只记录实际观察到的结局</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不推断用户已经理解或使用</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="997" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">如有功能操作，记录真实业务结果</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">注册、记忆读写等分别接收工具反馈</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">拒绝、失败与成功保持区别</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1200" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 按唯一计次阶段更新记录</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">重复或乱序回传不重复扣次数</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">只更新属于该账号的实例</text><line x1="560.0" y1="1338" x2="560.0" y2="1399" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1403" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1443" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">是否达到结束条件？</text><text x="128" y="1481" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">次数、明确停止、停用或有效期结束</text><text x="128" y="1512" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">具体口径由场景配置确定</text><line x1="1020" y1="1471.0" x2="1186" y2="1471.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1458.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否</text><rect x="1190" y="1403" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1443" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">等待新的有效机会</text><text x="1218" y="1481" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">保留未完成状态</text><text x="1218" y="1512" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不自动无限重试</text><line x1="560.0" y1="1541" x2="560.0" y2="1602" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1579.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">达到</text><rect x="100" y="1606" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1646" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">结束当前引导实例</text><text x="128" y="1684" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">清理相关监听与待执行建议</text><text x="128" y="1715" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">后续用户主动请求仍正常执行</text>
</svg>