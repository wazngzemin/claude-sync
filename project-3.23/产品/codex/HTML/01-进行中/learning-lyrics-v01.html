<div id="lyrics-learning-v01">
  <style>
    #lyrics-learning-v01 { display: grid; gap: calc(var(--font-size-base) * 1); color: var(--foreground); }
    #lyrics-learning-v01 .ll-title { display: grid; gap: calc(var(--font-size-base) * .25); }
    #lyrics-learning-v01 .ll-controls { display: flex; flex-wrap: wrap; gap: calc(var(--font-size-base) * 1); }
    #lyrics-learning-v01 .ll-flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .85fr) minmax(0, 1fr); align-items: start; gap: calc(var(--font-size-base) * 1); }
    #lyrics-learning-v01 figure, #lyrics-learning-v01 .ll-method { margin: 0; display: grid; gap: calc(var(--font-size-base) * .5); min-width: 0; }
    #lyrics-learning-v01 .ll-method { align-content: start; }
    #lyrics-learning-v01 .ll-screen { display: block; width: 100%; height: auto; }
    #lyrics-learning-v01 .ll-screen text { fill: var(--foreground); font-family: inherit; font-size: var(--font-size-base); }
    #lyrics-learning-v01 .ll-screen .ll-frame { fill: none; stroke: var(--border); stroke-width: 1; }
    #lyrics-learning-v01 .ll-screen .ll-divider { stroke: var(--border); stroke-width: 1; }
    #lyrics-learning-v01 .ll-screen .ll-area { fill: var(--muted); }
    #lyrics-learning-v01 [hidden] { display: none; }
    #lyrics-learning-v01 #ll-method-value { overflow-wrap: anywhere; }
    @media (max-width: 580px) {
      #lyrics-learning-v01 .ll-flow { grid-template-columns: minmax(0, 1fr); }
      #lyrics-learning-v01 .ll-screen { max-width: 330px; }
    }
  </style>
  <div class="ll-title">
    <h3>今天改对了，明天还会错吗？</h3>
    <p class="text-small">会议歌词案例的业务演示 · 非上线界面</p>
  </div>
  <p>用户目标：歌词和导航同时看得见</p>
  <div class="ll-controls">
    <label class="form-check">
      <input id="ll-saved" class="form-check-input" type="checkbox">
      <span class="form-check-label">保存正确做法</span>
    </label>
    <label class="form-check">
      <input id="ll-found" class="form-check-input" type="checkbox">
      <span class="form-check-label">明天回答前取出做法</span>
    </label>
  </div>
  <div class="ll-flow">
    <figure>
      <figcaption>今天：用户现场教过</figcaption>
      <svg class="ll-screen" viewBox="0 0 240 130" role="img" aria-label="今天被用户纠正后，歌词和导航已经同时显示">
        <rect class="ll-frame" x="4" y="4" width="232" height="122" rx="8"></rect>
        <rect class="ll-area" x="10" y="10" width="104" height="110" rx="4"></rect>
        <line class="ll-divider" x1="120" y1="4" x2="120" y2="126"></line>
        <text x="62" y="70" text-anchor="middle">歌词</text>
        <text x="178" y="70" text-anchor="middle">导航</text>
      </svg>
    </figure>
    <div class="ll-method">
      <p>留下的做法</p>
      <p id="ll-method-value">没有保存</p>
    </div>
    <figure>
      <figcaption>明天：再说“打开歌词”</figcaption>
      <svg id="ll-tomorrow" class="ll-screen" viewBox="0 0 240 130" role="img" aria-label="明天仍打开全屏歌词，导航被遮住">
        <rect class="ll-frame" x="4" y="4" width="232" height="122" rx="8"></rect>
        <g id="ll-fullscreen">
          <rect class="ll-area" x="10" y="10" width="220" height="110" rx="4"></rect>
          <text x="120" y="57" text-anchor="middle">全屏歌词</text>
          <text x="120" y="88" text-anchor="middle">导航被遮住</text>
        </g>
        <g id="ll-split" hidden>
          <rect class="ll-area" x="10" y="10" width="104" height="110" rx="4"></rect>
          <line class="ll-divider" x1="120" y1="4" x2="120" y2="126"></line>
          <text x="62" y="70" text-anchor="middle">歌词</text>
          <text x="178" y="70" text-anchor="middle">导航</text>
        </g>
      </svg>
    </figure>
  </div>
  <p id="ll-result" aria-live="polite">今天改对过，明天仍会重犯：没有留下可复用做法。</p>
  <script>
    (function () {
      var root = document.getElementById('lyrics-learning-v01');
      var saved = root.querySelector('#ll-saved');
      var found = root.querySelector('#ll-found');
      var method = root.querySelector('#ll-method-value');
      var full = root.querySelector('#ll-fullscreen');
      var split = root.querySelector('#ll-split');
      var tomorrow = root.querySelector('#ll-tomorrow');
      var result = root.querySelector('#ll-result');
      function draw() {
        var learned = saved.checked && found.checked;
        method.textContent = saved.checked
          ? '本车型、QQ 音乐：打开歌词 → 返回桌面 → 分屏；每步核对结果。'
          : '没有保存';
        full.toggleAttribute('hidden', learned);
        split.toggleAttribute('hidden', !learned);
        tomorrow.setAttribute('aria-label', learned
          ? '明天取出正确做法并执行后，歌词和导航同时显示'
          : '明天仍打开全屏歌词，导航被遮住');
        result.textContent = learned
          ? '保存、取出并照着执行后：明天无需重教。'
          : saved.checked
            ? '做法已保存，明天没取出：仍按原来的路径。'
            : found.checked
              ? '明天想找旧做法，但之前没有保存。'
              : '今天改对过，明天仍会重犯：没有留下可复用做法。';
      }
      function restore(state) {
        var content = state && (state.modelContent || state.privateContent);
        if (!content || content.caseId !== 'lyrics-learning-v01') return;
        saved.checked = content.saved === true;
        found.checked = content.found === true;
      }
      function change() {
        draw();
        if (window.openai && typeof window.openai.setWidgetState === 'function') {
          window.openai.setWidgetState({
            modelContent: {
              caseId: 'lyrics-learning-v01',
              saved: saved.checked,
              found: found.checked,
              outcome: saved.checked && found.checked ? '下次无需重教' : '下次仍需重教'
            },
            privateContent: null
          }).catch(function () {});
        }
      }
      restore(window.openai && window.openai.widgetState);
      saved.addEventListener('change', change);
      found.addEventListener('change', change);
      window.addEventListener('openai:set_globals', function (event) {
        var state = event.detail && event.detail.globals && event.detail.globals.widgetState;
        if (state) { restore(state); draw(); }
      });
      draw();
    })();
  </script>
</div>
