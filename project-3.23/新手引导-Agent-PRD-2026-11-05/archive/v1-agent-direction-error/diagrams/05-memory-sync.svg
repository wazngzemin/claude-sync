<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2010" viewBox="0 0 1660 2010">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="2010" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">Case 3  记忆同步完成后问候</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">准确触发点是同步完成；FaceID 可以跳过；记忆由 DT 检索</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户在开箱流程选择记忆授权与同步</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">按授权范围建立本次同步和问候关联</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不授权则不创建这项问候实例</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">是否收到真实的同步完成事件？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">激活完成不代表记忆同步完成</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">事件协议及接入可用性需确认</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">同步中／失败／未知</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">等待准确结果</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不提前个性化问候</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">完成</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">事件是否属于当前账号与本次同步？</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">核对账号、批次、重复与有效范围</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不额外要求完成 FaceID 注册</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">旧事件／无法归属</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不影响当前账号</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">重复事件不再处理</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">属于</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 核对次数与当前交互条件</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">必要时由触发器返回条件达成</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">尚未实际执行时不提前记为已告知</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="997" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 建议 DT 基于真实记忆问候</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">事件说明记忆可检索</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不要求触发器承载记忆正文</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1200" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 检索并取得可用记忆了吗？</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">由真实 tool_feedback 确定</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">已同步不代表本次一定检索到</text><line x1="1020" y1="1268.0" x2="1186" y2="1268.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1255.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="1200" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1240" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">无结果／检索失败</text><text x="1218" y="1278" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不编造个性化事实</text><text x="1218" y="1309" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">普通问候另按规则</text><line x1="560.0" y1="1338" x2="560.0" y2="1399" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1376.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">取得</text><rect x="100" y="1403" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1443" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 选取一到两个合适的记忆点</text><text x="128" y="1481" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">基于授权内容与当前乘员场合组织问候</text><text x="128" y="1512" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不编造天数、餐厅或偏好</text><line x1="560.0" y1="1541" x2="560.0" y2="1602" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1606" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1646" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">沿既有主链路播报</text><text x="128" y="1684" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">实际采用、开口、完成与中断分别回传</text><text x="128" y="1715" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">时机已过则不在后续无关会话补播</text><line x1="560.0" y1="1744" x2="560.0" y2="1805" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1809" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1849" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 更新本次结果并按规则收尾</text><text x="128" y="1887" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">同一执行阶段只计一次</text><text x="128" y="1918" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">账号切换或失效后停止旧实例</text>
</svg>