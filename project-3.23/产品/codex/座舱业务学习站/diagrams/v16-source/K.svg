" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">冻结或删除结果</tspan></text></g></a><a href="#module/K/step/K12"><g data-step="K12"><rect x="40" y="1500" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="1500" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="1529" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">K12</tspan></text><text x="60" y="1561" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">家和公司地址另走地图同步</tspan></text><text x="60" y="1603" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">记忆工具 → 提槽与工程校验</tspan></text><text x="60" y="1642" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">家/公司地图设置请求</tspan></text></g></a></g></svg>