<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="d2-fast-slow" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="d2-fast-slow-title d2-fast-slow-desc">
<title id="d2-fast-slow-title">从意图分类到快慢思考：一句话的处理方式怎样变了</title><desc id="d2-fast-slow-desc">从左向右看架构演进；右侧两条并排通道表示现在的快路与慢路。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="d2-fast-slow-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">从意图分类到快慢思考：一句话的处理方式怎样变了</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">从左向右看架构演进；右侧两条并排通道表示现在的快路与慢路。</text>
<text class="v56-node-title" x="32" y="124" text-anchor="start">第一代：意图分类加规则分发</text>
<text class="v56-subtitle" x="32" y="151" text-anchor="start">先把一句话分进一个领域</text>
<text class="v56-node-title" x="414" y="124" text-anchor="start">感知、思考、执行</text>
<text class="v56-subtitle" x="414" y="151" text-anchor="start">把话放回场景里想的设计思路</text>
<text class="v56-node-title" x="796" y="124" text-anchor="start">现在：快慢各在合适的位置</text>
<text class="v56-subtitle" x="796" y="151" text-anchor="start">明确指令直接办；复杂交办先想清楚</text>
<g data-node="true" id="d2-fast-slow-utterance"><rect class="v56-neutral" x="32" y="180" width="340" height="92" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="208" text-anchor="start">一句话</text>
<text class="v56-node-sub" x="46" y="236" text-anchor="start">拒识后，交出这一句的文字</text>
</g>
<g data-node="true" id="d2-fast-slow-intent"><rect class="v56-neutral" x="32" y="332" width="340" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="360" text-anchor="start">意图分类</text>
<text class="v56-node-sub" x="46" y="388" text-anchor="start">只看文字，分到粗领域</text>
<text class="v56-node-sub" x="46" y="412" text-anchor="start">车控、导航、媒体、天气、车书</text>
</g>
<g data-node="true" id="d2-fast-slow-rules"><rect class="v56-local" x="32" y="498" width="340" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="526" text-anchor="start">各领域规则执行和固定话术</text>
<text class="v56-node-sub" x="46" y="554" text-anchor="start">各自办理，各自回复</text>
<text class="v56-node-sub" x="46" y="578" text-anchor="start">不支持时，固定回答“我还不会”</text>
</g>
<path class="v56-arrow" d="M 202 272 L 202 332" marker-end="url(#d2-fast-slow-arr)"/>
<path class="v56-arrow" d="M 202 438 L 202 498" marker-end="url(#d2-fast-slow-arr)"/>
<text class="v56-label" x="218" y="306" text-anchor="start">交给分类模型</text>
<text class="v56-label" x="218" y="472" text-anchor="start">交给单一领域</text>
<text class="v56-risk" x="32" y="628" text-anchor="start">只看文字、例子造不完、压力后移</text>
<g data-node="true" id="d2-fast-slow-perceive"><rect class="v56-cloud" x="414" y="180" width="300" height="92" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="428" y="208" text-anchor="start">感知</text>
<text class="v56-node-sub" x="428" y="236" text-anchor="start">状态、场景、记忆、可用功能</text>
</g>
<g data-node="true" id="d2-fast-slow-think"><rect class="v56-decision" x="414" y="332" width="300" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="428" y="360" text-anchor="start">思考</text>
<text class="v56-node-sub" x="428" y="388" text-anchor="start">结合背景和处理要求</text>
<text class="v56-node-sub" x="428" y="412" text-anchor="start">推理出执行方案</text>
</g>
<g data-node="true" id="d2-fast-slow-execute"><rect class="v56-local" x="414" y="498" width="300" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="428" y="526" text-anchor="start">执行</text>
<text class="v56-node-sub" x="428" y="554" text-anchor="start">按方案调用下游能力</text>
<text class="v56-node-sub" x="428" y="578" text-anchor="start">异常时回到思考</text>
</g>
<path class="v56-arrow" d="M 564 272 L 564 332" marker-end="url(#d2-fast-slow-arr)"/>
<path class="v56-arrow" d="M 564 438 L 564 498" marker-end="url(#d2-fast-slow-arr)"/>
<path class="v56-arrow" d="M 714 548 L 754 548 L 754 385 L 714 385" marker-end="url(#d2-fast-slow-arr)"/>
<text class="v56-label" x="580" y="306" text-anchor="start">提供相关背景</text>
<text class="v56-label" x="580" y="472" text-anchor="start">交出执行方案</text>
<text class="v56-label" x="720" y="465" text-anchor="start">异常</text>
<text class="v56-subtitle" x="414" y="628" text-anchor="start">先看场景，再决定怎么办</text>
<g data-node="true" id="d2-fast-slow-fast"><rect class="v56-local" x="796" y="180" width="176" height="418" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="810" y="208" text-anchor="start">快路</text>
<text class="v56-node-sub" x="810" y="236" text-anchor="start">明确指令直接办</text>
<text class="v56-node-title" x="810" y="282" text-anchor="start">车上固定规则</text>
<text class="v56-node-sub" x="810" y="308" text-anchor="start">命中就抢跑</text>
<text class="v56-node-title" x="810" y="354" text-anchor="start">车上 1.7B 模型</text>
<text class="v56-node-sub" x="810" y="380" text-anchor="start">仅断网或超时兜底</text>
<text class="v56-node-title" x="810" y="426" text-anchor="start">离线简单指令</text>
<text class="v56-node-sub" x="810" y="452" text-anchor="start">限车上能办的</text>
<text class="v56-node-title" x="810" y="498" text-anchor="start">云端车控干预</text>
<text class="v56-node-sub" x="810" y="524" text-anchor="start">规则命中直接办</text>
</g>
<g data-node="true" id="d2-fast-slow-slow"><rect class="v56-decision" x="992" y="180" width="176" height="418" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="1006" y="208" text-anchor="start">慢路</text>
<text class="v56-node-sub" x="1006" y="236" text-anchor="start">先想清楚再办</text>
<text class="v56-node-title" x="1006" y="282" text-anchor="start">Planner 统一想</text>
<text class="v56-node-sub" x="1006" y="308" text-anchor="start">结合背景和目标</text>
<text class="v56-node-sub" x="1006" y="334" text-anchor="start">保留整句里的事</text>
<text class="v56-node-title" x="1006" y="390" text-anchor="start">交给工具执行</text>
<text class="v56-node-sub" x="1006" y="416" text-anchor="start">结果回来再判断</text>
<text class="v56-node-sub" x="1006" y="498" text-anchor="start">做事和说话统一</text>
</g>
<text class="v56-subtitle" x="796" y="628" text-anchor="start">云端不再单独做简单复杂仲裁</text>
<path class="v56-rule" d="M 32 656 L 1168 656"/>
<text class="v56-node-title" x="32" y="688" text-anchor="start">Planner 管想清楚，快路管明确指令。</text>
<rect data-decoration="true" class="v56-neutral" x="32" y="714" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="728" text-anchor="start">灰：按文字分领域</text>
<rect data-decoration="true" class="v56-cloud" x="280" y="714" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="308" y="728" text-anchor="start">绿：收集相关背景</text>
<rect data-decoration="true" class="v56-decision" x="528" y="714" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="556" y="728" text-anchor="start">黄：结合背景推理</text>
<rect data-decoration="true" class="v56-local" x="776" y="714" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="804" y="728" text-anchor="start">蓝：明确办理与执行</text>
<text class="v56-risk" x="1024" y="728" text-anchor="start">红字：旧路局限</text>
</svg>
