<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="i2-stop-layers" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="i2-stop-layers-title i2-stop-layers-desc">
<title id="i2-stop-layers-title">插话以后，四层分别停什么</title><desc id="i2-stop-layers-desc">停播、旧推理失效、停止下发各管一层；已经执行的动作不会自动撤销。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="i2-stop-layers-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">插话以后，四层分别停什么</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">停播、旧推理失效、停止下发各管一层；已经执行的动作不会自动撤销。</text>
<text class="v56-label" x="32" y="120" text-anchor="start">例子：豆包讲餐厅时，主驾说“帮我把副驾座椅加热打开”；此前空调已经打开。</text>
<g data-node="true" data-key="voice">
<rect class="v56-local" x="32" y="156" width="722" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="183" text-anchor="start">1 · 停声</text>
<text class="v56-node-sub" x="46" y="208" text-anchor="start">谁来做：车机暂停旧播报；需要中止时停止播报</text>
<text class="v56-node-sub" x="46" y="229" text-anchor="start">用户感受：餐厅讲解先安静下来，新话被拒识时仍可从断点续播</text>
</g>
<g data-node="true" data-key="reason">
<rect class="v56-local" x="170" y="282" width="722" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="184" y="309" text-anchor="start">2 · 停推理</text>
<text class="v56-node-sub" x="184" y="334" text-anchor="start">谁来做：输入管理让旧推理失效</text>
<text class="v56-node-sub" x="184" y="355" text-anchor="start">用户感受：旧餐厅推理不再作为有效结果继续使用</text>
</g>
<g data-node="true" data-key="dispatch">
<rect class="v56-local" x="308" y="408" width="722" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="322" y="435" text-anchor="start">3 · 不再下发</text>
<text class="v56-node-sub" x="322" y="460" text-anchor="start">谁来做：输入管理让旧执行失效，尚未下发的动作不再下发</text>
<text class="v56-node-sub" x="322" y="481" text-anchor="start">用户感受：若旧轮还有开导航等动作未下发，这次不会继续执行</text>
</g>
<g data-node="true" data-key="done">
<rect class="v56-cloud" x="446" y="534" width="722" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="460" y="561" text-anchor="start">4 · 已执行不撤销</text>
<text class="v56-node-sub" x="460" y="586" text-anchor="start">谁来做：执行方保留已经完成的动作，历史记账保留真实结果</text>
<text class="v56-node-sub" x="460" y="607" text-anchor="start">用户感受：此前已打开的空调仍开着，不会因这次插话自动关闭</text>
</g>
<path class="v56-arrow" d="M 77 258 L 77 333 L 170 333" fill="none" marker-end="url(#i2-stop-layers-arr)"/>
<path class="v56-arrow" d="M 215 384 L 215 459 L 308 459" fill="none" marker-end="url(#i2-stop-layers-arr)"/>
<path class="v56-arrow" d="M 353 510 L 353 585 L 446 585" fill="none" marker-end="url(#i2-stop-layers-arr)"/>
<text class="v56-subtitle" x="32" y="685" text-anchor="start">四层按影响范围逐层加深；箭头不表示必须等上一层完成。</text>
<rect class="v56-local" x="32" y="732" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="746" text-anchor="start">蓝：中止旧输出或旧执行</text>
<rect class="v56-cloud" x="392" y="732" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="420" y="746" text-anchor="start">绿：保留已经发生的结果</text>
</svg>
