<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="600" viewBox="0 0 1260 600" role="img" aria-label="回写与恢复：车上办完怎么告诉云端，网络断了又怎么补"><title>回写与恢复：车上办完怎么告诉云端，网络断了又怎么补</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1260" height="600" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">回写与恢复：车上办完怎么告诉云端，网络断了又怎么补</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">赛力斯本地对话链路需求 + 网络专项讨论（10/20 提出，讨论中）</text><rect x="30" y="230" width="220" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="257" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上执行完成</text><text x="44" y="282" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">本轮采用了车上结果</text><rect x="290" y="110" width="310" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="304" y="137" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">网络正常：立刻同步</text><text x="304" y="162" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">编号、音区、两路识别文字、</text><text x="304" y="183" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">结果类型、函数参数、回复、时间</text><rect x="650" y="110" width="300" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="664" y="137" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端写进历史</text><text x="664" y="162" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">被拒的话进情景背景，</text><text x="664" y="183" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不进 DT 对话历史</text><rect x="1000" y="110" width="230" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="1014" y="137" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">下一句能接上</text><text x="1014" y="162" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“再高一档”：</text><text x="1014" y="183" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">接着调副驾座椅</text><rect x="290" y="330" width="310" height="96" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="304" y="357" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">同步失败（如仍在弱网）</text><text x="304" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">现状：只同步一次，</text><text x="304" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">失败不再重试</text><rect x="650" y="330" width="300" height="96" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="664" y="357" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">网络恢复后重新同步</text><text x="664" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按时间轮询 + 每次说话时检测</text><text x="664" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（讨论中，未上线）</text><rect x="1000" y="330" width="230" height="96" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="1014" y="357" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">下一句接不上</text><text x="1014" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">可能反问“要调哪里”，</text><text x="1014" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">或者办错</text><path d="M250,262 L270,262 L270,158 L290,158" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M250,294 L270,294 L270,378 L290,378" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M600,158 L650,158" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M950,158 L1000,158" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M600,378 L650,378" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M800,330 L800,206" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="782.65" y="259" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="800" y="275" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">补上</text><path d="M445,426 L445,458 L1115,458 L1115,426" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="762.65" y="437" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="780" y="453" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">现状</text><rect x="30" y="500" width="1200" height="70" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="527" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">同步口径改过：9 月 30 日前，每轮不管车上给出什么都同步；现在只同步被采用的车上结果</text></g></svg>