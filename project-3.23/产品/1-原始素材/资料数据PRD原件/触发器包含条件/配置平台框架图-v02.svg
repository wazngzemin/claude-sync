<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1950" viewBox="0 0 1700 1950"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect x="0" y="0" width="1700" height="1950" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="48" y="64" font-size="40" font-weight="700" fill="#173458" text-anchor="start"><tspan x="48" dy="0">系统预设任务 · 配置平台业务框架</tspan></text>
<text x="48" y="110" font-size="25" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="48" dy="0">把已接入能力组合成完整任务：条件满足后做什么，用户回应后怎么办，何时结束。</tspan></text>
<text x="48" y="178" font-size="29" font-weight="700" fill="#173458" text-anchor="start"><tspan x="48" dy="0">一  能力库：平台让配置人员选什么</tspan></text>
<text x="48" y="214" font-size="21" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="48" dy="0">能力团队接入；平台按渠道、车型、版本和端云位置筛选可用能力。</tspan></text>
<rect x="48" y="238" width="518" height="130" rx="12" fill="#F4F6F8" stroke="none" stroke-width="2"/>
<text x="72" y="278" font-size="26" font-weight="700" fill="#173458" text-anchor="start"><tspan x="72" dy="0">状态与识别</tspan></text>
<text x="72" y="315" font-size="22" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="72" dy="0">任务开关、档位、车速、车辆开关</tspan><tspan x="72" dy="31">天气／路面／儿童／充电设备识别</tspan></text>
<rect x="591" y="238" width="518" height="130" rx="12" fill="#F4F6F8" stroke="none" stroke-width="2"/>
<text x="615" y="278" font-size="26" font-weight="700" fill="#173458" text-anchor="start"><tspan x="615" dy="0">交互与用户反馈</tspan></text>
<text x="615" y="315" font-size="22" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="615" dy="0">即时交互卡、按钮、语音播报</tspan><tspan x="615" dy="31">确认、取消、关闭、超时</tspan></text>
<rect x="1134" y="238" width="518" height="130" rx="12" fill="#F4F6F8" stroke="none" stroke-width="2"/>
<text x="1158" y="278" font-size="26" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1158" dy="0">动作与执行结果</tspan></text>
<text x="1158" y="315" font-size="22" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="1158" dy="0">车辆动作、主动推荐、识别调用</tspan><tspan x="1158" dy="31">实际车辆状态、失败、无法确认</tspan></text>
<text x="48" y="431" font-size="29" font-weight="700" fill="#173458" text-anchor="start"><tspan x="48" dy="0">二  配置主线：配置人员依次完成五步</tspan></text>
<text x="48" y="467" font-size="21" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="48" dy="0">平台根据所选处理方式展示配置项，不需要交互的任务不必填写卡片和播报。</tspan></text>
<rect x="48" y="496" width="300" height="262" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="2"/>
<rect x="48" y="496" width="300" height="56" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="68" y="533" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="68" dy="0">1  选任务与范围</tspan></text>
<text x="68" y="594" font-size="22" font-weight="400" fill="#173458" text-anchor="start"><tspan x="68" dy="0">关联哪项预设任务</tspan><tspan x="68" dy="36">用于哪些车型、版本</tspan><tspan x="68" dy="36">由端侧还是云端运行</tspan></text>
<text x="68" y="730" font-size="20" font-weight="500" fill="#185DB7" text-anchor="start"><tspan x="68" dy="0">决定：谁能使用这项任务</tspan></text>
<polyline points="348,524 374,524" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="374" y="496" width="300" height="262" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="2"/>
<rect x="374" y="496" width="300" height="56" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="394" y="533" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="394" dy="0">2  配触发规则</tspan></text>
<text x="394" y="594" font-size="22" font-weight="400" fill="#173458" text-anchor="start"><tspan x="394" dy="0">何种变化启动检查</tspan><tspan x="394" dy="36">当前还须满足哪些条件</tspan><tspan x="394" dy="36">全部满足／任一满足</tspan></text>
<text x="394" y="730" font-size="20" font-weight="500" fill="#185DB7" text-anchor="start"><tspan x="394" dy="0">决定：什么时候才触发</tspan></text>
<polyline points="674,524 700,524" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="700" y="496" width="300" height="262" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="2"/>
<rect x="700" y="496" width="300" height="56" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="720" y="533" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="720" dy="0">3  选处理方式</tspan></text>
<text x="720" y="594" font-size="22" font-weight="400" fill="#173458" text-anchor="start"><tspan x="720" dy="0">直接执行 ｜ 仅告知</tspan><tspan x="720" dy="36">先询问 ｜ 发起主动推荐</tspan><tspan x="720" dy="36">选择对应动作或承接业务</tspan></text>
<text x="720" y="730" font-size="20" font-weight="500" fill="#185DB7" text-anchor="start"><tspan x="720" dy="0">决定：命中后走哪条路</tspan></text>
<polyline points="1000,524 1026,524" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="1026" y="496" width="300" height="262" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="2"/>
<rect x="1026" y="496" width="300" height="56" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="1046" y="533" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1046" dy="0">4  配交互与后续</tspan></text>
<text x="1046" y="594" font-size="22" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1046" dy="0">卡片、按钮、播报内容</tspan><tspan x="1046" dy="36">确认后动作与执行顺序</tspan><tspan x="1046" dy="36">取消、超时和结果分支</tspan></text>
<text x="1046" y="730" font-size="20" font-weight="500" fill="#185DB7" text-anchor="start"><tspan x="1046" dy="0">决定：每种回应怎么办</tspan></text>
<polyline points="1326,524 1352,524" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="1352" y="496" width="300" height="262" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="2"/>
<rect x="1352" y="496" width="300" height="56" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="1372" y="533" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1372" dy="0">5  设运行策略</tspan></text>
<text x="1372" y="594" font-size="22" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1372" dy="0">持续时间、次数、间隔</tspan><tspan x="1372" dy="36">等待时长、失效条件</tspan><tspan x="1372" dy="36">退出条件与退出动作</tspan></text>
<text x="1372" y="730" font-size="20" font-weight="500" fill="#185DB7" text-anchor="start"><tspan x="1372" dy="0">决定：何时停、何时再来</tspan></text>
<text x="48" y="828" font-size="29" font-weight="700" fill="#173458" text-anchor="start"><tspan x="48" dy="0">三  配置结果长什么样：用“雨天切换湿滑模式”走一遍</tspan></text>
<text x="48" y="864" font-size="21" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="48" dy="0">本例选择“先询问”。平台必须能表达以下顺序和分支，运行时由对应业务执行。</tspan></text>
<rect x="48" y="900" width="206" height="160" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="66" y="938" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="66" dy="0">收到检查事件</tspan></text>
<text x="66" y="978" font-size="21" font-weight="400" fill="#173458" text-anchor="start"><tspan x="66" dy="0">天气变为下雨</tspan><tspan x="66" dy="29">或路面变为湿滑</tspan></text>
<polyline points="254,975 280,975" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="280" y="900" width="300" height="160" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="298" y="938" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="298" dy="0">判断当前条件</tspan></text>
<text x="298" y="978" font-size="21" font-weight="400" fill="#173458" text-anchor="start"><tspan x="298" dy="0">任务开启；车速＞30 km/h</tspan><tspan x="298" dy="29">下雨或路面湿滑</tspan><tspan x="298" dy="29">当前不是湿滑模式</tspan></text>
<polyline points="580,975 606,975" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="606" y="900" width="320" height="160" rx="12" fill="#FFF6E8" stroke="none" stroke-width="2"/>
<text x="624" y="938" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="624" dy="0">展示询问卡与播报</tspan></text>
<text x="624" y="978" font-size="21" font-weight="400" fill="#173458" text-anchor="start"><tspan x="624" dy="0">“要切换湿滑模式吗？”</tspan><tspan x="624" dy="29">按钮：确认／取消</tspan><tspan x="624" dy="29">本地语音匹配同一按钮</tspan></text>
<polyline points="926,975 952,975" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="952" y="900" width="300" height="160" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="970" y="938" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="970" dy="0">确认后再次检查</tspan></text>
<text x="970" y="978" font-size="21" font-weight="400" fill="#173458" text-anchor="start"><tspan x="970" dy="0">询问未失效、未处理</tspan><tspan x="970" dy="29">任务与最新车况仍允许</tspan></text>
<polyline points="1252,975 1278,975" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="1278" y="900" width="374" height="160" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="1296" y="938" font-size="24" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1296" dy="0">执行并确认实际结果</tspan></text>
<text x="1296" y="978" font-size="21" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1296" dy="0">切换湿滑模式</tspan><tspan x="1296" dy="29">读取实际驾驶模式</tspan><tspan x="1296" dy="29">达到目标才反馈成功</tspan></text>
<text x="934" y="959" font-size="18" font-weight="600" fill="#185DB7" text-anchor="middle"><tspan x="934" dy="0">确认</tspan></text>
<rect x="280" y="1125" width="972" height="62" rx="12" fill="#F4F6F8" stroke="none" stroke-width="2"/>
<text x="766" y="1166" font-size="23" font-weight="500" fill="#173458" text-anchor="middle"><tspan x="766" dy="0">结束本次，不执行车辆动作；长期任务保持开启时继续等待</tspan></text>
<polyline points="430,1060 430,1125" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="442" y="1100" font-size="19" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="442" dy="0">不满足</tspan></text>
<polyline points="766,1060 766,1125" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="778" y="1100" font-size="19" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="778" dy="0">取消／关闭／超时</tspan></text>
<polyline points="1102,1060 1102,1125" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="1114" y="1100" font-size="19" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="1114" dy="0">复核不通过</tspan></text>
<rect x="1278" y="1125" width="374" height="62" rx="12" fill="#EBF5F0" stroke="none" stroke-width="2"/>
<text x="1465" y="1165" font-size="22" font-weight="500" fill="#173458" text-anchor="middle"><tspan x="1465" dy="0">更新成功／失败／无法确认</tspan></text>
<polyline points="1465,1060 1465,1125" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="48" y="1252" font-size="29" font-weight="700" fill="#173458" text-anchor="start"><tspan x="48" dy="0">四  产品策略：配置值由场景定，处理规则由公共框架支持</tspan></text>
<rect x="48" y="1283" width="380" height="134" rx="12" fill="#F4F6F8" stroke="none" stroke-width="2"/>
<text x="66" y="1321" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="66" dy="0">触发前</tspan></text>
<text x="66" y="1360" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="66" dy="0">任务关闭、数据过期 → 不触发</tspan><tspan x="66" dy="31">持续判断 + 次数／间隔限制重复</tspan></text>
<rect x="456" y="1283" width="380" height="134" rx="12" fill="#F4F6F8" stroke="none" stroke-width="2"/>
<text x="474" y="1321" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="474" dy="0">询问中</tspan></text>
<text x="474" y="1360" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="474" dy="0">真正展示后再等答复、播报</tspan><tspan x="474" dy="31">语音禁用保留点击；失效则撤销</tspan></text>
<rect x="864" y="1283" width="380" height="134" rx="12" fill="#F4F6F8" stroke="none" stroke-width="2"/>
<text x="882" y="1321" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="882" dy="0">执行时</tspan></text>
<text x="882" y="1360" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="882" dy="0">同一次确认只能执行一次</tspan><tspan x="882" dy="31">先检查最新车况，再调用车控</tspan></text>
<rect x="1272" y="1283" width="380" height="134" rx="12" fill="#F4F6F8" stroke="none" stroke-width="2"/>
<text x="1290" y="1321" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1290" dy="0">结束后</tspan></text>
<text x="1290" y="1360" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1290" dy="0">失败或未知不默认重试车控</tspan><tspan x="1290" dy="31">退出不等于自动反向操作车辆</tspan></text>
<text x="48" y="1451" font-size="21" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="48" dy="0">需在场景规则中确认：频控计数口径、拒绝后再次提醒、优先级与卡片展示的配合、等待和退出参数。</tspan></text>
<text x="48" y="1523" font-size="29" font-weight="700" fill="#173458" text-anchor="start"><tspan x="48" dy="0">五  校验与生效：平台校验配置，运行模块执行任务</tspan></text>
<rect x="48" y="1553" width="345" height="135" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="69" y="1592" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="69" dy="0">平台校验</tspan></text>
<text x="69" y="1630" font-size="21" font-weight="400" fill="#173458" text-anchor="start"><tspan x="69" dy="0">能力是否适配、必填项是否齐全</tspan><tspan x="69" dy="30">先后顺序与结果分支是否完整</tspan></text>
<rect x="467" y="1553" width="315" height="135" rx="12" fill="#EDF4FF" stroke="none" stroke-width="2"/>
<text x="488" y="1592" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="488" dy="0">通过：发布到指定范围</tspan></text>
<text x="488" y="1630" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="488" dy="0">云端：扩展现有配置链路</tspan><tspan x="488" dy="30">端侧：当前仍按需求开发发版</tspan></text>
<polyline points="393,1602 467,1602" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="856" y="1553" width="796" height="135" rx="12" fill="#EBF5F0" stroke="none" stroke-width="2"/>
<text x="877" y="1592" font-size="25" font-weight="700" fill="#173458" text-anchor="start"><tspan x="877" dy="0">运行职责不变</tspan></text>
<text x="877" y="1630" font-size="22" font-weight="400" fill="#173458" text-anchor="start"><tspan x="877" dy="0">任务中心／接入业务提供真实启停状态；触发器判断条件</tspan><tspan x="877" dy="32">交互模块展示并返回选择；执行业务调用车控、确认结果</tspan></text>
<polyline points="782,1602 856,1602" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="48" y="1722" width="734" height="62" rx="12" fill="#FFF6E8" stroke="none" stroke-width="2"/>
<text x="69" y="1763" font-size="24" font-weight="500" fill="#173458" text-anchor="start"><tspan x="69" dy="0">不通过：定位缺失配置或能力 → 补齐后重新校验</tspan></text>
<polyline points="220,1688 220,1722" fill="none" stroke="#8AA3C1" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="48" y="1836" font-size="24" font-weight="500" fill="#185DB7" text-anchor="start"><tspan x="48" dy="0">端云统一配置、下发与同步属于后续建设；运行位置不因断网自动切换。</tspan></text>
<text x="48" y="1894" font-size="23" font-weight="500" fill="#173458" text-anchor="start"><tspan x="48" dy="0">复用目标：能力和组合方式支持后，修改条件、文案和目标动作即可复用，不再每个场景单独开发。</tspan></text>
</svg>