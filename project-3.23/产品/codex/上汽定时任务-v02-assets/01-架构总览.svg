<rect width="1800" height="1860" fill="#FFFFFF"/>
<text x="70" y="65" font-size="38" fill="#1B3144" text-anchor="start" font-weight="700"><tspan x="70" dy="0">上汽未来任务：三条路径与职责边界</tspan></text>
<text x="70" y="113" font-size="24" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">计时、条件命中、动作完成分别属于不同环节；到点 / 命中不能直接写成执行成功。</tspan></text>
<rect x="55" y="153" width="530" height="1520" rx="16" fill="#F3F7FB"/>
<text x="320" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">用户纯定时任务</tspan></text>
<rect x="635" y="153" width="530" height="1520" rx="16" fill="#F1F7F4"/>
<text x="900" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="900" dy="0">用户条件任务</tspan></text>
<rect x="1215" y="153" width="530" height="1520" rx="16" fill="#FBF6EC"/>
<text x="1480" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="1480" dy="0">后台预置主动服务</tspan></text>
<rect x="100.0" y="245.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="308" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">用户：十分钟后关座椅加热</tspan></text>
<rect x="680.0" y="245.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="308" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">用户：副驾上车时提醒</tspan></text>
<rect x="1260.0" y="245.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="308" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">产品人员：配置上汽预置场景</tspan></text>
<rect x="100.0" y="450.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="496" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">Planner 理解目标</tspan><tspan x="320" dy="34.8">动态 Advisor 解析时间 / 内容</tspan></text>
<rect x="680.0" y="450.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="496" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">Planner 理解目标</tspan><tspan x="900" dy="34.8">动态 Advisor 拆解车态条件</tspan></text>
<rect x="1260.0" y="450.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="496" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">后台：条件 + 范围 + 下游动作</tspan><tspan x="1480" dy="34.8">保存并配置场景生效状态</tspan></text>
<rect x="100.0" y="665.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="711" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">弋途定时能力</tspan><tspan x="320" dy="34.8">登记时间；等待到点</tspan></text>
<rect x="680.0" y="665.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="711" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">豆包条件触发器</tspan><tspan x="900" dy="34.8">接收动态 Advisor 场景注册</tspan></text>
<rect x="1260.0" y="665.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="711" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">豆包条件触发器</tspan><tspan x="1480" dy="34.8">等待预置场景条件满足</tspan></text>
<rect x="100.0" y="875.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="921" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">弋途 → 动态 Advisor</tspan><tspan x="320" dy="34.8">发送本轮到点事件</tspan></text>
<rect x="680.0" y="875.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="921" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">车辆信号 → 触发器判断</tspan><tspan x="900" dy="34.8">满足后 callback 动态 Advisor</tspan></text>
<rect x="1260.0" y="875.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="921" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">触发器 → 已配置下游</tspan><tspan x="1480" dy="34.8">按场景动作通知 / 执行</tspan></text>
<rect x="100.0" y="1090.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="1136" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">动态 Advisor → Planner</tspan><tspan x="320" dy="34.8">advice：本轮执行建议</tspan></text>
<rect x="680.0" y="1090.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="1136" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">动态 Advisor → Planner</tspan><tspan x="900" dy="34.8">advice：本轮执行建议</tspan></text>
<rect x="1260.0" y="1090.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="1136" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">下游按各自业务处理</tspan><tspan x="1480" dy="34.8">不统一经过动态 Advisor</tspan></text>
<rect x="100.0" y="1305.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="1351" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">Planner → 工具 / 客户端</tspan><tspan x="320" dy="34.8">结合当前车况执行并接收结果</tspan></text>
<rect x="680.0" y="1305.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="1351" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">Planner → 工具 / 客户端</tspan><tspan x="900" dy="34.8">结合当前车况执行并接收结果</tspan></text>
<rect x="1260.0" y="1305.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="1351" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">场景记录与下游业务结果</tspan><tspan x="1480" dy="34.8">按各自协议留痕 / 展示</tspan></text>
<rect x="100.0" y="1495.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="320" y="1541" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">建议：任务中心回写结果</tspan><tspan x="320" dy="34.8">一次性收尾 / 循环下一轮</tspan></text>
<rect x="680.0" y="1495.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="900" y="1541" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">建议：任务中心回写结果</tspan><tspan x="900" dy="34.8">一次性清理 / 持续任务继续</tspan></text>
