<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="m2-permits" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="m2-permits-title m2-permits-desc">
<title id="m2-permits-title">下一轮可以先算，等上一轮播完再发</title><desc id="m2-permits-desc">找充电站时，E2 还在播，工具结果触发 E3 先算；E3 拿到输出许可后才发出去。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="m2-permits-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<rect data-background="true" x="0" y="0" width="1200" height="750" style="fill:var(--v56-bg,#fff)"/>
<text class="v56-title" x="32" y="44" text-anchor="start">下一轮可以先算，等上一轮播完再发</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">找充电站时，E2 还在播，工具结果触发 E3 先算；E3 拿到输出许可后才发出去。</text>
<text class="v56-node-title" x="32" y="155" text-anchor="start">计算（候选）</text>
<text class="v56-node-title" x="32" y="400" text-anchor="start">输出（正式）</text>
<path class="v56-rule" d="M 32 345 L 880 345" fill="none"  />
<g data-node="true" data-name="e3-candidate"><rect class="v56-local" x="450" y="190" width="410" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="464" y="217" text-anchor="start">E3 先算 · 计算许可</text>
<text class="v56-node-sub" x="464" y="242" text-anchor="start">工具结果回来，先准备下一轮</text>
<text class="v56-node-sub" x="464" y="265" text-anchor="start">预跑时不能调用新的业务工具</text>
</g>
<g data-node="true" data-name="e2-output"><rect class="v56-cloud" x="170" y="420" width="260" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="184" y="447" text-anchor="start">E2 在播 · 输出许可</text>
<text class="v56-node-sub" x="184" y="472" text-anchor="start">“我帮你找找”</text>
<text class="v56-node-sub" x="184" y="495" text-anchor="start">合法播放继续</text>
</g>
<g data-node="true" data-name="e3-output"><rect class="v56-cloud" x="600" y="420" width="260" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="614" y="447" text-anchor="start">E3 正式发出</text>
<text class="v56-node-sub" x="614" y="472" text-anchor="start">拿到输出许可</text>
<text class="v56-node-sub" x="614" y="495" text-anchor="start">才发文字、语音、工具调用</text>
</g>
<path class="v56-arrow" d="M 430 475 L 600 475" fill="none" marker-end="url(#m2-permits-arr)" />
<text class="v56-label" x="515" y="450" text-anchor="middle">车上报 E2 播完</text>
<path class="v56-arrow" d="M 730 310 L 730 420" fill="none" marker-end="url(#m2-permits-arr)" />
<text class="v56-label" x="746" y="382" text-anchor="start">输出许可</text>
<g data-node="true" data-name="exit-check"><rect class="v56-decision" x="925" y="190" width="243" height="365" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="939" y="217" text-anchor="start">出口核对</text>
<text class="v56-node-sub" x="939" y="242" text-anchor="start">发出前比对执行身份</text>
<text class="v56-node-sub" x="939" y="265" text-anchor="start">失效执行一律拦下：</text>
<text class="v56-node-sub" x="939" y="288" text-anchor="start">文字、语音、工具调用、</text>
<text class="v56-node-sub" x="939" y="311" text-anchor="start">历史写入</text>
<text class="v56-node-sub" x="939" y="334" text-anchor="start"></text>
<text class="v56-node-sub" x="939" y="357" text-anchor="start">真实工具结果不丢</text>
<text class="v56-node-sub" x="939" y="380" text-anchor="start">放行回历史</text>
<text class="v56-node-sub" x="939" y="403" text-anchor="start">已发生的动作不撤销</text>
</g>
<text class="v56-node-sub" x="32" y="600" text-anchor="start">同一对话：最多一个有效候选 + 一个未撤销的正式输出。</text>
<text class="v56-subtitle" x="32" y="626" text-anchor="start">E2、E3 是不同执行身份的示意名；身份只比是否相同，不比大小。</text>
<rect data-legend="true" class="v56-local" x="32" y="696" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="710" text-anchor="start">蓝：先算的候选</text>
<rect data-legend="true" class="v56-cloud" x="350" y="696" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="378" y="710" text-anchor="start">绿：允许正式输出</text>
<rect data-legend="true" class="v56-decision" x="700" y="696" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="728" y="710" text-anchor="start">黄：出口身份核对</text>
</svg>
