<rect x="70" y="185" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="98" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">对话与上下文</text><text x="98" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">当前请求、近期语境</text><text x="98" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">账号与当前交互对象</text><rect x="590" y="185" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="618" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">状态与业务事件</text><text x="618" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">注册、使用、同步完成</text><text x="618" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">实际可取得的事实</text><rect x="1110" y="185" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1138" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">工具与执行反馈</text><text x="1138" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">前置条件不足、读写结果</text><text x="1138" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">DT 处理与端侧结果</text><line x1="310" y1="325" x2="310" y2="402" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><line x1="830" y1="325" x2="830" y2="402" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><line x1="1350" y1="325" x2="1350" y2="402" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="410" width="1520" height="244" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="104" y="458" fill="#0055A4" font-size="34" font-weight="700" text-anchor="start">新手引导 Agent</text><text x="104" y="520" fill="#0055A4" font-size="28" font-weight="650" text-anchor="start">场景选择</text><text x="104" y="565" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">识别相关场景</text><text x="104" y="598" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">与资格信息</text><text x="480" y="520" fill="#0055A4" font-size="28" font-weight="650" text-anchor="start">账号功能档案</text><text x="480" y="565" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">检查告知、拒绝</text><text x="480" y="598" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">与使用事实</text><text x="856" y="520" fill="#0055A4" font-size="28" font-weight="650" text-anchor="start">能力编排</text><text x="856" y="565" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">按需复用</text><text x="856" y="598" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">已有能力</text><text x="1232" y="520" fill="#0055A4" font-size="28" font-weight="650" text-anchor="start">结果追踪</text><text x="1232" y="565" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">记录阶段结果</text><text x="1232" y="598" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">按规则结束</text><line x1="310" y1="658" x2="310" y2="730" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="328" y="702.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">按需调用</text><line x1="830" y1="658" x2="830" y2="730" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="848" y="702.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">按需调用</text><line x1="1350" y1="658" x2="1350" y2="730" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1368" y="702.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">按需调用</text><rect x="70" y="740" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="98" y="780" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器</text><text x="98" y="818" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">注册与持续监测条件</text><text x="98" y="849" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">复用频次与事件判断</text><rect x="590" y="740" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="618" y="780" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">上下文／身份／记忆</text><text x="618" y="818" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">提供所需信息与真实结果</text><text x="618" y="849" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">输入来源及接线需确认</text><rect x="1110" y="740" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1138" y="780" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">任务等已有能力</text><text x="1138" y="818" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">仅在场景确有需要时复用</text><text x="1138" y="849" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不把所有预设任务迁入</text><text x="70" y="940" fill="#0055A4" font-size="30" font-weight="700" text-anchor="start">执行主链路</text><rect x="70" y="980" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="98" y="1020" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 发出引导建议</text><text x="98" y="1058" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">说明目的、依据、关联请求</text><text x="98" y="1089" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">用户原任务继续保留</text><rect x="590" y="980" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="618" y="1020" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 决策与工具执行</text><text x="618" y="1058" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">生成回复或 action_list</text><text x="618" y="1089" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">消费 tool_feedback 后再判断</text><rect x="1110" y="980" width="480" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1138" y="1020" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">端侧交互</text><text x="1138" y="1058" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">沿用既有播报／卡片链路</text><text x="1138" y="1089" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">注册等动作需用户同意</text><line x1="554" y1="1048" x2="584" y2="1048" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><line x1="1074" y1="1048" x2="1104" y2="1048" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="1180" width="1520" height="128" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="100" y="1224" fill="#0055A4" font-size="29" font-weight="650" text-anchor="start">结果返回 Agent</text><text x="100" y="1267" fill="#0055A4" font-size="27" font-weight="400" text-anchor="start">DT 采用、播报开始／结束、用户拒绝、工具业务成功分别记录，不能用一个“完成”代替。</text><line x1="830" y1="1120" x2="830" y2="1174" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/>
</svg>