<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1350" viewBox="0 0 1000 1350" role="img" aria-label="“记住我家”与“导航回家”，是两次不同的业务"><title>“记住我家”与“导航回家”，是两次不同的业务</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="48" font-size="26" fill="#18364c" font-weight="650" text-anchor="start">“记住我家”与“导航回家”，是两次不同的业务</text><text x="40" y="82" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">11 月 4 日评审目标路径，选点交互待收口；11 月 5 日会议未取得权限。</text><text x="50" y="135" font-size="22" fill="#203c51" font-weight="600" text-anchor="start">第一次请求：保存一个以后能用的具体地点</text><rect x="50" y="185" width="260" height="150" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="68" y="217" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">用户要求保存</text><text x="68" y="248" font-size="17" fill="#244358" font-weight="400" text-anchor="start">“把我家记成麦当劳”</text><text x="68" y="275" font-size="17" fill="#244358" font-weight="400" text-anchor="start">还不确定是哪家门店</text><text x="68" y="302" font-size="17" fill="#244358" font-weight="400" text-anchor="start">本次目标是写入家的地点</text><rect x="370" y="185" width="260" height="150" rx="8" fill="#fff8eb" stroke="#d8bf8d"/><text x="388" y="217" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">DT 检查核心信息</text><text x="388" y="248" font-size="17" fill="#244358" font-weight="400" text-anchor="start">看完整 POI 名称和城市</text><text x="388" y="275" font-size="17" fill="#244358" font-weight="400" text-anchor="start">信息明确：进入写入</text><text x="388" y="302" font-size="17" fill="#244358" font-weight="400" text-anchor="start">仍含糊：先搜索地点</text><rect x="690" y="185" width="260" height="150" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="708" y="217" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">POI 搜索工具</text><text x="708" y="248" font-size="17" fill="#244358" font-weight="400" text-anchor="start">根据已知条件找具体地点</text><text x="708" y="275" font-size="17" fill="#244358" font-weight="400" text-anchor="start">返回候选门店及地点信息</text><text x="708" y="302" font-size="17" fill="#244358" font-weight="400" text-anchor="start">没有候选则澄清或调整</text><path d="M310 260 L370 260" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M630 260 L690 260" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="638" y="246" font-size="14" fill="#476c8d" font-weight="400" text-anchor="start">缺信息</text><rect x="690" y="435" width="260" height="150" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="708" y="467" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">确认具体地点</text><text x="708" y="498" font-size="17" fill="#244358" font-weight="400" text-anchor="start">需要选点时让用户确认</text><text x="708" y="525" font-size="17" fill="#244358" font-weight="400" text-anchor="start">选的是未来要保存的家</text><text x="708" y="552" font-size="17" fill="#244358" font-weight="400" text-anchor="start">此刻不应顺带启动导航</text><rect x="370" y="435" width="260" height="150" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="388" y="467" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">调用记忆写入</text><text x="388" y="498" font-size="17" fill="#244358" font-weight="400" text-anchor="start">保存人物、“家”与 POI</text><text x="388" y="525" font-size="17" fill="#244358" font-weight="400" text-anchor="start">先满足记忆权限条件</text><text x="388" y="552" font-size="17" fill="#244358" font-weight="400" text-anchor="start">读取写入成功或失败结果</text><rect x="50" y="435" width="260" height="150" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="68" y="467" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">告诉用户保存结果</text><text x="68" y="498" font-size="17" fill="#244358" font-weight="400" text-anchor="start">成功才说明已经记住</text><text x="68" y="525" font-size="17" fill="#244358" font-weight="400" text-anchor="start">失败则说明尚未保存</text><text x="68" y="552" font-size="17" fill="#244358" font-weight="400" text-anchor="start">保留之后继续处理的条件</text><path d="M820 335 L820 435" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="835" y="391" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">候选供选择</text><path d="M690 510 L630 510" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M370 510 L310 510" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500 335 L500 435" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="385" y="391" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">核心信息齐全</text><path d="M40 645H960" stroke="#ccd7df"/><text x="50" y="705" font-size="22" fill="#203c51" font-weight="600" text-anchor="start">以后的一次新请求：用保存的地点开始导航</text><rect x="50" y="755" width="260" height="150" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="68" y="787" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">用户：“导航回家”</text><text x="68" y="818" font-size="17" fill="#244358" font-weight="400" text-anchor="start">这次要求真正开始导航</text><text x="68" y="845" font-size="17" fill="#244358" font-weight="400" text-anchor="start">“家”是个人地点含义</text><text x="68" y="872" font-size="17" fill="#244358" font-weight="400" text-anchor="start">还要取得它对应的 POI</text><rect x="370" y="755" width="260" height="150" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="388" y="787" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">查询允许使用的记忆</text><text x="388" y="818" font-size="17" fill="#244358" font-weight="400" text-anchor="start">取得这个人的家及地点</text><text x="388" y="845" font-size="17" fill="#244358" font-weight="400" text-anchor="start">没有明确地点：继续询问</text><text x="388" y="872" font-size="17" fill="#244358" font-weight="400" text-anchor="start">有明确地点：交回 DT</text><rect x="690" y="755" width="260" height="150" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="708" y="787" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">DT 组织导航请求</text><text x="708" y="818" font-size="17" fill="#244358" font-weight="400" text-anchor="start">带上城市和完整 POI 名称</text><text x="708" y="845" font-size="17" fill="#244358" font-weight="400" text-anchor="start">按该方案要求直接导航</text><text x="708" y="872" font-size="17" fill="#244358" font-weight="400" text-anchor="start">目标来自刚取回的地点</text><path d="M310 830 L370 830" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M630 830 L690 830" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="690" y="1005" width="260" height="150" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="708" y="1037" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">导航能力实际办理</text><text x="708" y="1068" font-size="17" fill="#244358" font-weight="400" text-anchor="start">接收明确目的地</text><text x="708" y="1095" font-size="17" fill="#244358" font-weight="400" text-anchor="start">按车辆条件规划并启动</text><text x="708" y="1122" font-size="17" fill="#244358" font-weight="400" text-anchor="start">返回真实处理结果</text><rect x="370" y="1005" width="260" height="150" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="388" y="1037" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">DT 读取工具反馈</text><text x="388" y="1068" font-size="17" fill="#244358" font-weight="400" text-anchor="start">确认是否已开始导航</text><text x="388" y="1095" font-size="17" fill="#244358" font-weight="400" text-anchor="start">失败时保留失败原因</text><text x="388" y="1122" font-size="17" fill="#244358" font-weight="400" text-anchor="start">决定要向用户说明什么</text><rect x="50" y="1005" width="260" height="150" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="68" y="1037" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">屏幕与声音反馈</text><text x="68" y="1068" font-size="17" fill="#244358" font-weight="400" text-anchor="start">显示真实目的地与状态</text><text x="68" y="1095" font-size="17" fill="#244358" font-weight="400" text-anchor="start">播报与实际结果一致</text><text x="68" y="1122" font-size="17" fill="#244358" font-weight="400" text-anchor="start">记忆命中不等于导航成功</text><path d="M820 905 L820 1005" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="676" y="960" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">明确地点与导航要求</text><path d="M690 1080 L630 1080" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M370 1080 L310 1080" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="50" y="1220" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">原文的三种补全方案，是“由谁发现并补齐地点”的备选分工，不是一次请求连走三步。</text><text x="50" y="1247" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">本图采用 DT 先查地点再写记忆的方案；写入与导航各自读取真实返回结果。</text></g></svg>