<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="c2-now-vs-history" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="c2-now-vs-history-title c2-now-vs-history-desc">
<title id="c2-now-vs-history-title">刚才做过什么，不等于现在是什么样</title><desc id="c2-now-vs-history-desc">历史里开过空调，最新车况却显示已被手动关掉；Planner 按当前车况判断。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="c2-now-vs-history-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">刚才做过什么，不等于现在是什么样</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">历史里开过空调，最新车况却显示已被手动关掉；Planner 按当前车况判断。</text>
<text class="v56-label" x="32" y="145" text-anchor="start">现在：设备此刻的状态</text>
<text class="v56-label" x="32" y="375" text-anchor="start">刚才：历史里发生过的动作</text>
<path class="v56-arrow" d="M 592 236 L 660 236 L 660 325 L 760 325" fill="none" marker-end="url(#c2-now-vs-history-arr)"/>
<path class="v56-arrow" d="M 592 460 L 660 460 L 660 380 L 760 380" fill="none" marker-end="url(#c2-now-vs-history-arr)"/>
<g data-node="true" id="c2-now-vs-history-n1"><rect class="v56-cloud" x="32" y="180" width="560" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="207" text-anchor="start">最新车况：空调已被手动关掉</text>
<text class="v56-node-sub" x="46" y="232" text-anchor="start">这是最新的，优先于历史</text>
<text class="v56-node-sub" x="46" y="255" text-anchor="start">回答的是“现在是什么样”</text>
</g>
<g data-node="true" id="c2-now-vs-history-n2"><rect class="v56-neutral" x="32" y="410" width="560" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="437" text-anchor="start">历史里的动作：刚才打开过空调</text>
<text class="v56-node-sub" x="46" y="462" text-anchor="start">记录已经发生的动作</text>
<text class="v56-node-sub" x="46" y="485" text-anchor="start">回答的是“刚才做过什么”</text>
</g>
<g data-node="true" id="c2-now-vs-history-n3"><rect class="v56-decision" x="760" y="290" width="408" height="122" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="774" y="317" text-anchor="start">Planner 按“现在是关的”判断</text>
<text class="v56-node-sub" x="774" y="342" text-anchor="start">最新车况与历史冲突时</text>
<text class="v56-node-sub" x="774" y="365" text-anchor="start">以当前车况为准</text>
</g>
<g data-node="true" id="c2-now-vs-history-n4"><rect class="v56-decision" x="760" y="480" width="408" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="774" y="507" text-anchor="start">时序校验：只接受更新的车况</text>
<text class="v56-node-sub" x="774" y="532" text-anchor="start">晚到的旧数据丢掉</text>
<text class="v56-node-sub" x="774" y="555" text-anchor="start">不能覆盖已经收到的新值</text>
</g>
<text class="v56-label" x="32" y="638" text-anchor="start">先保证车况本身够新，再用最新车况纠正历史带来的误解。</text>
<rect class="v56-cloud" x="32" y="694" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="708" text-anchor="start">绿：最新车况</text>
<rect class="v56-neutral" x="176" y="694" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="204" y="708" text-anchor="start">灰：已经发生的动作</text>
<rect class="v56-decision" x="362" y="694" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="390" y="708" text-anchor="start">黄：冲突与时序判断</text>
</svg>
