<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1340" viewBox="0 0 1000 1340" role="img" aria-label="同一段声音，识别与判停同时工作"><title>同一段声音，识别与判停同时工作</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="48" font-size="26" fill="#18364c" font-weight="650" text-anchor="start">同一段声音，识别与判停同时工作</text><text x="40" y="82" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">本例采用在线语音与 300 / 600 毫秒配置；框内标明实际交接的信息。</text><rect x="330" y="115" width="340" height="110" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="348" y="147" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">允许交互，持续收音</text><text x="348" y="178" font-size="17" fill="#244358" font-weight="400" text-anchor="start">权限与交互条件满足</text><text x="348" y="205" font-size="17" fill="#244358" font-weight="400" text-anchor="start">保留本次输入、说话音区</text><rect x="330" y="280" width="340" height="110" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="348" y="312" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">声学处理</text><text x="348" y="343" font-size="17" fill="#244358" font-weight="400" text-anchor="start">降低噪声与车载播放回声</text><text x="348" y="370" font-size="17" fill="#244358" font-weight="400" text-anchor="start">处理后的音频同时用于两条线</text><path d="M500 225 L500 280" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="515" y="260" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">音频</text><rect x="35" y="280" width="240" height="110" rx="8" fill="#fff8eb" stroke="#d8bf8d"/><text x="53" y="312" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">适用热词</text><text x="53" y="343" font-size="17" fill="#244358" font-weight="400" text-anchor="start">联系人、地点、页面词等</text><text x="53" y="370" font-size="17" fill="#244358" font-weight="400" text-anchor="start">AIDV 读取并交给 ASR</text><rect x="50" y="470" width="400" height="135" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="68" y="502" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">ASR · 持续把声音写成文字</text><text x="68" y="533" font-size="17" fill="#244358" font-weight="400" text-anchor="start">一遍结果逐步返回车端</text><text x="68" y="560" font-size="17" fill="#244358" font-weight="400" text-anchor="start">“带我去” → “……游泳馆”</text><text x="68" y="587" font-size="17" fill="#244358" font-weight="400" text-anchor="start">过程文字可以继续修订</text><rect x="550" y="470" width="400" height="135" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="568" y="502" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">VAD · 观察发声与停顿</text><text x="568" y="533" font-size="17" fill="#244358" font-weight="400" text-anchor="start">随同一段音频持续检测</text><text x="568" y="560" font-size="17" fill="#244358" font-weight="400" text-anchor="start">停顿开始后计时</text><text x="568" y="587" font-size="17" fill="#244358" font-weight="400" text-anchor="start">用户继续说话，结束此次停顿</text><path d="M415 390 L415 425 L300 425 L300 470" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="310" y="447" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">音频</text><path d="M585 390 L585 425 L750 425 L750 470" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760" y="447" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">同一音频</text><path d="M155 390 L155 470" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="65" y="435" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">候选名称</text><rect x="50" y="670" width="400" height="110" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="68" y="702" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">车端保留最新过程文字</text><text x="68" y="733" font-size="17" fill="#244358" font-weight="400" text-anchor="start">当前整句＋本次输入关联</text><text x="68" y="760" font-size="17" fill="#244358" font-weight="400" text-anchor="start">“游泳馆”后仍在等待补充</text><path d="M250 605 L250 670" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="265" y="646" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">文字返回</text><rect x="550" y="670" width="180" height="110" rx="8" fill="#fff8eb" stroke="#d8bf8d"/><text x="568" y="702" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">软判停</text><text x="568" y="733" font-size="17" fill="#244358" font-weight="400" text-anchor="start">停顿到 300 毫秒</text><text x="568" y="760" font-size="17" fill="#244358" font-weight="400" text-anchor="start">触发前置准备</text><rect x="770" y="670" width="180" height="110" rx="8" fill="#fff8eb" stroke="#d8bf8d"/><text x="788" y="702" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">硬判停</text><text x="788" y="733" font-size="17" fill="#244358" font-weight="400" text-anchor="start">停顿到 600 毫秒</text><text x="788" y="760" font-size="17" fill="#244358" font-weight="400" text-anchor="start">本段收尾条件</text><path d="M680 605 L680 640 L640 640 L640 670" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M820 605 L820 640 L860 640 L860 670" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="80" y="900" width="360" height="145" rx="8" fill="#fff8eb" stroke="#d8bf8d"/><text x="98" y="932" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">车端发预请求 → AIDV</text><text x="98" y="963" font-size="17" fill="#244358" font-weight="400" text-anchor="start">提交当时的整句与输入编号</text><text x="98" y="990" font-size="17" fill="#244358" font-weight="400" text-anchor="start">拒识判断、准备相关背景</text><text x="98" y="1017" font-size="17" fill="#244358" font-weight="400" text-anchor="start">继续收音；不下发导航动作</text><rect x="560" y="900" width="360" height="145" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="578" y="932" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">二遍 ASR → 车端</text><text x="578" y="963" font-size="17" fill="#244358" font-weight="400" text-anchor="start">使用已经采集的完整音频</text><text x="578" y="990" font-size="17" fill="#244358" font-weight="400" text-anchor="start">返回 final 最终识别文字</text><text x="578" y="1017" font-size="17" fill="#244358" font-weight="400" text-anchor="start">仍需识别计算与返回时间</text><path d="M200 780 L200 900" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="100" y="840" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">当前整句</text><path d="M640 780 L640 835 L360 835 L360 900" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="824" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">允许准备的时机</text><path d="M860 780 L860 850 L760 850 L760 900" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="775" y="872" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">收尾后重识别</text><rect x="180" y="1160" width="640" height="140" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="198" y="1192" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">正式文字经豆包入口交给 AIDV</text><text x="198" y="1223" font-size="17" fill="#244358" font-weight="400" text-anchor="start">同一请求、前一轮文字一致且结果可用：复用对应准备</text><text x="198" y="1250" font-size="17" fill="#244358" font-weight="400" text-anchor="start">文字改变或没有可用准备：按最终文字重新处理</text><text x="198" y="1277" font-size="17" fill="#244358" font-weight="400" text-anchor="start">有效完整请求继续交业务入口；无有效 final 走语音异常出口</text><path d="M260 1045 L260 1100 L350 1100 L350 1160" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="90" y="1085" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">已保存的准备结果</text><path d="M740 1045 L740 1100 L650 1100 L650 1160" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="610" y="1085" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">final、音区、输入关联</text></g></svg>