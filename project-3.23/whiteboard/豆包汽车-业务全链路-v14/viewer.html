<style>
:root{--ink:#15324f;--muted:#60738a;--blue:#2363c5;--line:#d4dfed;--paper:#f6f8fc}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);overflow:hidden}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:6px 12px;color:var(--ink);background:white}button:hover,button:focus-visible{border-color:var(--blue);background:#edf3ff}button.active{background:var(--blue);color:white;border-color:var(--blue)}header{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px 10px}.head{display:flex;gap:16px;align-items:center;justify-content:space-between}h1{font-size:21px;line-height:1.4;margin:0;font-weight:650;letter-spacing:.02em}.edition{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;align-items:center}.actions input{width:210px;padding:7px 10px;border:1px solid var(--line);border-radius:7px}.rail{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:auto;margin-top:11px;padding-bottom:1px}.rail button{font-size:13px;padding:6px 11px}.rail .arrow{color:#96a9bf}.toolbar{display:flex;align-items:center;gap:8px;padding:9px 22px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}.toolbar select{border:1px solid var(--line);padding:6px 10px;border-radius:6px;background:white;max-width:255px}.hint{color:var(--muted);font-size:12px;margin-left:auto}.work{position:relative;height:calc(100vh - 187px);min-height:300px}.canvas{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:#f8fafd}.canvas.dragging{cursor:grabbing}.canvas>svg{display:block;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}.node,.tool-node{cursor:pointer}.node:hover>rect,.tool-node:hover>rect{stroke:#2363c5;stroke-width:4}.node.selected>rect{stroke:#2363c5;stroke-width:6;fill:#e5efff}.edge{pointer-events:stroke;cursor:pointer}.edge-label{cursor:pointer}.canvas.inspect .edge:not(.chosen),.canvas.inspect .edge-label:not(.chosen){opacity:.17}.canvas.inspect .node:not(.related){opacity:.38}.edge.chosen polyline:last-child{stroke:#e0642d;stroke-width:7}.node.related>rect{stroke:#2363c5;stroke-width:5}.canvas.hide-cross .edge:not(.internal),.canvas.hide-cross .edge-label[data-cross="true"]{display:none}.panel{position:absolute;top:12px;right:12px;bottom:12px;width:432px;max-width:calc(100vw - 24px);background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 40px #17385e1f;display:flex;flex-direction:column;z-index:5}.panel[hidden]{display:none}.panel-top{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-top strong{font-size:16px}.panel-body{overflow:auto;padding:18px 22px;scrollbar-gutter:stable}.panel-body h2{font-size:21px;line-height:1.45;margin:0 0 12px}.panel-body h3{font-size:16px;margin:23px 0 8px}.panel-body p{margin:9px 0;line-height:1.9}.panel-body a{color:var(--blue);overflow-wrap:anywhere}.tag{display:inline-block;background:#eef3fb;color:#3b5c82;padding:2px 7px;font-size:12px;border-radius:4px;margin:0 4px 6px 0}.explain{background:#f5f8fd;border-left:3px solid #8bb0e4;padding:12px 14px;margin:12px 0}.row{display:block;border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin:9px 0;background:#fff}.row p{font-size:14px;margin:5px 0;color:var(--muted)}.row button{font-size:13px;margin-top:5px}.metric{border-bottom:1px solid #e7edf5;padding:10px 0}.metric strong{display:block}.metric small{color:#80643b}.small{font-size:13px;color:var(--muted)}.warning{background:#fff8e8;border:1px solid #e4d1a8;border-radius:7px;padding:12px}.legend{display:flex;gap:15px;font-size:12px;color:var(--muted);flex-wrap:wrap}.dot{display:inline-block;width:8px;height:8px;border-radius:100%;margin-right:5px}.foot{height:37px;padding:7px 22px;display:flex;align-items:center;gap:20px;border-top:1px solid var(--line);background:white;font-size:12px;color:var(--muted)}#status{margin-left:auto}.map{position:absolute;left:14px;bottom:14px;background:#ffffffed;border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 2px 12px #17385e10}.map svg{display:block;width:196px;height:152px;cursor:pointer}.map .caption{font-size:11px;color:var(--muted);text-align:center}.map.hide{display:none}.toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#173859;color:white;padding:8px 16px;border-radius:8px;font-size:13px;pointer-events:none;z-index:8}.toast[hidden]{display:none}details{margin:12px 0}summary{cursor:pointer;font-weight:600}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}code{font-size:13px;overflow-wrap:anywhere;background:#f0f4fa;padding:2px 4px}ul,ol{padding-left:22px}.bread{position:absolute;left:14px;top:14px;max-width:calc(100% - 28px);padding:8px 13px;background:#ffffffef;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);z-index:2;pointer-events:none}.bread strong{color:var(--ink);font-size:14px}.case-steps button{display:block;width:100%;text-align:left;margin:8px 0}.wide{width:650px}.panel-body .sources-list{font-size:13px}.source{padding:12px 0;border-bottom:1px solid var(--line)}.path-note{color:#9b6531}.return-link{font-size:12px;background:#f8fafc}.empty{padding:30px 0;color:var(--muted)}@media(max-width:850px){.head{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.actions input{width:140px}.actions button:nth-last-child(-n+2){display:none}.hint{display:none}header{padding:10px 12px}.toolbar{padding:7px 12px}.work{height:calc(100vh - 202px)}.map{display:none}.panel{width:94vw}.foot{padding:7px 12px}.foot .legend{display:none}}

<body>
<header><div class="head"><div><h1>豆包汽车 · 语音请求到真实结果</h1><div class="edition">一张相连的业务流程图 · v14 · 按 2026-10-22 资料核对，非全车型上线声明</div></div><div class="actions"><input id="search" placeholder="搜模块或工具，按回车…" aria-label="搜索模块或工具"><button id="toolBtn">33 项工具</button><button id="learnBtn">我该掌握到哪</button><button id="sourcesBtn">资料与边界</button></div></div><nav class="rail" id="rail" aria-label="业务主链路"></nav></header>
<div class="toolbar"><button id="overview">全图</button><select id="moduleSelect" aria-label="定位模块"></select><button id="minus" aria-label="缩小">－</button><span id="zoom">100%</span><button id="plus" aria-label="放大">＋</button><button id="fitWidth">按宽度读</button><button id="fitModule">看完整模块</button><button id="moduleDetail">本模块详解</button><button id="caseBtn">真实案例</button><button id="legacyBtn">原图模块对照</button><button id="clear">清除高亮</button><span class="hint">拖动平移 · 滚轮上下看 · Ctrl/⌘＋滚轮缩放</span></div>
<main class="work"><div id="canvas" class="canvas" aria-label="可缩放的完整业务流程图"><!--SVG--></div><div class="bread" id="bread"></div><div class="map" id="minimap"><svg id="mapSvg" viewBox="0 0 1000 760"></svg><div class="caption">同一张总图 · 点击定位模块</div></div><aside class="panel" id="panel" hidden><div class="panel-top"><strong id="panelTitle"></strong><button id="closePanel" aria-label="关闭详情">关闭</button></div><div class="panel-body" id="panelBody"></div></aside><div class="toast" id="toast" hidden></div></main>
<footer class="foot"><div class="legend"><span><i class="dot" style="background:#2463c5"></i>请求／动作</span><span><i class="dot" style="background:#248171"></i>结果回流</span><span><i class="dot" style="background:#b07622"></i>任务／触发</span><span><i class="dot" style="background:#b85a59"></i>打断</span><span>虚线：规划项或职责引用</span></div><button id="download" style="font-size:12px;padding:1px 7px">下载可编辑 SVG</button><span id="status"></span></footer>
<script>
/*DATA*/
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], html=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svg=$('#canvas>svg'),canvas=$('#canvas'),mods=new Map(DATA.modules.map(m=>[m.id,m])),allNodes=DATA.modules.flatMap(m=>m.nodes),nodes=new Map(allNodes.map(n=>[n.id,n])),tools=new Map(DATA.tools.map(t=>[t.id,t])),edges=new Map(DATA.edges.map(e=>[e.id,e]));
let box={x:0,y:0,w:DATA.width,h:DATA.height},current='V',drag=null,suppress=false,selected=null,toastTimer;
let study={notes:{},checks:{}};try{study=JSON.parse(localStorage.getItem('doubao-flow-v14-study'))||study;}catch{}
function saveStudy(){try{localStorage.setItem('doubao-flow-v14-study',JSON.stringify(study));}catch{$('#status').textContent='浏览器不允许保存本地笔记，请在关闭前导出。';}}
const qid=q=>[...q].reduce((v,c)=>(Math.imul(v,31)+c.charCodeAt(0))|0,7).toString(36);
function exportNotes(){const lines=['# 豆包汽车全链路学习笔记','',...Object.entries(study.notes).map(([id,t])=>`## ${id} ${nodes.get(id)?.title||''}\n\n${t}\n`),'## 已自测掌握的问题','',...DATA.modules.flatMap(m=>(m.questions||[]).filter(q=>study.checks[qid(q.q)]).map(q=>'- '+m.id+' · '+q.q))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'}));a.download='豆包汽车-我的链路学习笔记.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function dimensions(){return canvas.getBoundingClientRect()}
function render(){svg.setAttribute('viewBox',`${box.x} ${box.y} ${box.w} ${box.h}`);$('#zoom').textContent=Math.round(dimensions().width/box.w*100)+'%';const selectedM=mods.get(current);$('#bread').innerHTML=`<strong>${html(selectedM?.title||'完整流程')}</strong>　${selectedM?'点击节点看解释；跨模块箭头点击后可直达上下游。':'全图看结构，选择模块放大读细节。'}`;$('#status').textContent=`${DATA.modules.length} 个模块 · ${allNodes.length} 个流程节点 · ${DATA.edges.length} 条连接`;mapRender();}
function focusRect(r,{full=false,pad=40}={}){let d=dimensions();box.x=r.x-pad;box.y=r.y-pad;box.w=r.w+pad*2;box.h=box.w*d.height/d.width;if(full&&box.h<r.h+pad*2){box.h=r.h+pad*2;box.w=box.h*d.width/d.height;box.x=r.x+(r.w-box.w)/2;}render();}
function focusModule(id,full=false){current=id;$('#moduleSelect').value=id;$$('#rail button').forEach(b=>b.classList.toggle('active',b.dataset.module===id));focusRect(mods.get(id),{full,pad:40});location.hash='module-'+id;}
function overview(){current=null;$('#moduleSelect').value='';focusRect({x:0,y:0,w:DATA.width,h:DATA.modules.reduce((v,m)=>Math.max(v,m.y+m.h),0)+100},{full:true,pad:0});location.hash='overview';}
function zoom(f,px,py){let d=dimensions(),cx=px??d.width/2,cy=py??d.height/2,x=box.x+cx/d.width*box.w,y=box.y+cy/d.height*box.h;let nw=Math.min(DATA.width*1.2,Math.max(480,box.w*f)),nh=nw*d.height/d.width;box={x:x-cx/d.width*nw,y:y-cy/d.height*nh,w:nw,h:nh};render();}
canvas.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){let r=dimensions();zoom(Math.exp(e.deltaY*.003),e.clientX-r.x,e.clientY-r.y);}else{box.y+=e.deltaY*box.h/dimensions().height;box.x+=e.deltaX*box.w/dimensions().width;render();}},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.button)return;drag={x:e.clientX,y:e.clientY,bx:box.x,by:box.y,moved:false};});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');}if(drag.moved){box.x=drag.bx-dx*box.w/dimensions().width;box.y=drag.by-dy*box.h/dimensions().height;render();}});
canvas.addEventListener('pointerup',()=>{suppress=!!drag?.moved;drag=null;canvas.classList.remove('dragging');if(suppress)setTimeout(()=>suppress=false,0);});
function showPanel(title,content,wide=false){$('#panelTitle').textContent=title;$('#panelBody').innerHTML=content;$('#panel').hidden=false;$('#panel').classList.toggle('wide',wide);$('#panelBody').scrollTop=0;}
function sourceHTML(ids){return (ids||[]).map(id=>{let s=DATA.sources.find(s=>s.id===id);return s?`<div class="source"><a href="${html(s.url)}" target="_blank" rel="noopener">${html(s.title)}</a><div class="small">${html(s.note)}</div></div>`:''}).join('');}
function clearFocus(){canvas.classList.remove('inspect');$$('.node,.edge,.edge-label').forEach(n=>n.classList.remove('selected','related','chosen'));selected=null;}
function highlightNode(id){clearFocus();selected=id;canvas.classList.add('inspect');let set=new Set([id]);DATA.edges.filter(e=>e.from===id||e.to===id).forEach(e=>{set.add(e.from);set.add(e.to);$$(`[data-edge="${e.id}"]`).forEach(n=>n.classList.add('chosen'));});for(const n of set)$(`[data-node="${n}"]`)?.classList.add('related');$(`[data-node="${id}"]`)?.classList.add('selected');}
function jumpNode(id){let n=nodes.get(id);if(!n)return;current=n.moduleId;$('#moduleSelect').value=current;focusRect({x:n.x-110,y:n.y-90,w:n.w+700,h:n.h+400},{full:true,pad:0});nodeDetail(id);}
function connectionRows(id){return DATA.edges.filter(e=>e.from===id||e.to===id).map(e=>{let forward=e.from===id,tgt=nodes.get(forward?e.to:e.from);return `<div class="row"><span class="tag">${forward?'交给':'来自'} ${html(tgt.moduleId)} · ${html(e.id)}</span><strong>${html(tgt.title)}</strong><p>${html(e.label)}</p><button data-jump="${tgt.id}">定位 ${html(tgt.id)}</button> <button data-connection="${e.id}">看这条连接</button></div>`}).join('');}
function nodeDetail(id){let n=nodes.get(id),m=mods.get(n.moduleId);highlightNode(id);showPanel(n.id+' · 小模块解释',`<span class="tag">${html(m.title)}</span><h2>${html(n.title)}</h2><div class="explain">${n.lines.map(html).join('<br>')}</div><p>${html(n.detail)}</p><h3>从哪里来，交给谁</h3>${connectionRows(id)||'<p>此框为版本说明，不是独立运行步骤。</p>'}<h3>这一模块，产品经理要问什么</h3>${questionHTML(m.questions)}<h3>我的理解／还要问负责人的问题</h3><textarea data-note="${id}" aria-label="${id} 的学习笔记" style="width:100%;min-height:130px;padding:12px;border:1px solid #ccd8e7;border-radius:7px;font:14px/1.8 inherit">${html(study.notes[id]||'')}</textarea><p class="small">仅保存在当前浏览器本地，不会上传。换浏览器或清理数据前，请导出。</p><button data-export-notes="true">导出全部笔记</button><details><summary>依据资料与状态边界</summary>${sourceHTML(m.sourceIds)}</details>`);}
function questionHTML(qs){return(qs||[]).map(q=>`<div class="row"><strong>${html(q.q)}</strong><p>为什么：${html(q.why)}</p><p><b>过关表现：</b>${html(q.pass)}</p><label class="small"><input type="checkbox" data-check="${qid(q.q)}" ${study.checks[qid(q.q)]?'checked':''}> 我能用实际案例和证据回答</label></div>`).join('');}
function metricHTML(ms){return(ms||[]).map(m=>`<div class="metric"><strong>${html(m.name)}</strong><p>${html(m.definition)}</p><small>${html(m.status)}</small></div>`).join('');}
function moduleDetail(id){let m=mods.get(id);showPanel(m.id+' · 模块详解',`<h2>${html(m.title)}</h2><p>${html(m.subtitle)}</p><h3>内部步骤</h3>${m.nodes.map(n=>`<details><summary>${n.id} · ${html(n.title)}</summary><p>${html(n.detail)}</p><button data-jump="${n.id}">在总图里定位</button></details>`).join('')}<h3>关键问题与掌握程度</h3>${questionHTML(m.questions)}<h3>验收指标</h3><p class="small">除标明原文目标者，其余为本次建议的评测口径，不是团队已达成绩或统一 KPI。</p>${metricHTML(m.metrics)}<details><summary>资料依据</summary>${sourceHTML(m.sourceIds)}</details>`);}
function edgeDetail(id){let e=edges.get(id),a=nodes.get(e.from),b=nodes.get(e.to);clearFocus();canvas.classList.add('inspect');$$(`[data-edge="${id}"]`).forEach(el=>el.classList.add('chosen'));[a,b].forEach(n=>$(`[data-node="${n.id}"]`).classList.add('related'));showPanel(id+' · 连接解释',`<h2>${html(e.label)}</h2><div class="row"><span class="tag">起点 ${a.id}</span><strong>${html(a.title)}</strong><p>${html(a.detail)}</p><button data-jump="${a.id}">回到起点</button></div><p style="text-align:center;font-size:25px;color:var(--blue)">↓</p><div class="row"><span class="tag">终点 ${b.id}</span><strong>${html(b.title)}</strong><p>${html(b.detail)}</p><button data-jump="${b.id}">到达终点</button></div><p class="small">这是同一张图上的真实连接。金色表示任务或触发交接；虚线不代表当前已经上线。</p>`);}
function toolDetail(id){let t=tools.get(id);showPanel('工具能力 · '+t.label,`<h2>${html(t.label)}</h2><code>${html(t.name)}</code><p class="small">${html(t.status)}</p>${[['接收什么',t.input],['内部做什么／不做什么',t.mechanism],['返回什么',t.output],['失败与边界',t.exception]].map(([h,b])=>`<h3>${h}</h3><p>${html(b)}</p>`).join('')}<div class="explain">调用链：Director 写出动作 → E2 匹配本项目能力 → E4 工具处理 → E6 返回真实事实 → M 输入管理 → 下一轮 Director。</div><button data-jump="E2">定位工具入口 E2</button> <button data-jump="E6">定位反馈 E6</button><details><summary>依据</summary>${sourceHTML([t.sourceId])}</details>`);}
function toolList(){showPanel('工具清单与机制',`<h2>33 个业务条目，不是 33 个处处可用的按钮</h2><p>${html(DATA.toolCountExplanation)}</p><p class="warning">${html(DATA.coverage)}</p>${[...new Set(DATA.tools.map(t=>t.category))].map(c=>`<h3>${html(c)}</h3>${DATA.tools.filter(t=>t.category===c).map(t=>`<div class="row"><strong>${html(t.label)}</strong><div><code>${html(t.name)}</code></div><p>${html(t.status)}</p><button data-tool-open="${t.id}">看输入、机制、输出与异常</button></div>`).join('')}`).join('')}<h3>清单之外的历史／额外条目</h3><pre style="white-space:pre-wrap;font:13px/1.7 inherit">${html(typeof DATA.additionalInventoryFindings==='string'?DATA.additionalInventoryFindings:JSON.stringify(DATA.additionalInventoryFindings,null,2))}</pre>`);}
function sourcesPanel(){showPanel('资料与边界',`<h2>先分清“文档规定”，再核验“实际上线”</h2><p>这张图以 10 月 22 日 Director 产品宣讲逐字稿、最新输入管理规则、任务中心及端云触发资料为主线。旧图保留作模块映射，不能把旧漏斗、动态 Advisor 与新 Task 同时当成并列必经步骤。</p><div class="warning">已读正文与已经看过的图，分别在下方注明。权限不足、返回截断、待宣讲或建设中的内容不补写成已实现。清单覆盖所检索到的相关材料，不代表已读完公司所有文档。</div><h3>这次修正的关键连线</h3><ol><li>ASR 与 VAD 同时处理声音，不能画成“ASR 完成才开始 VAD”。</li><li>软断句与硬断句从同一段停顿起算，预请求只提前计算，不执行副作用。</li><li>输入管理在模型之外；上下文来源是按需汇入，不是固定串行调用链。</li><li>同轮独立工具并行，有结果依赖的动作必须等待下一轮。</li><li>工具反馈回输入管理，再由同一个 Director 判断和统一播报。</li><li>任务触发只说明条件满足，仍要回任务与 Director；不等于动作已完成。</li><li>VLM 的观察、VQA 的问答、Trigger 的规则、Advisor 的建议不能画成一个模块。</li><li>任务登记、卡片展示、播报完成和车辆执行各有证据，不能合并成“成功”。</li></ol><div class="sources-list">${sourceHTML(DATA.sources.map(s=>s.id))}</div>`,true);}
function learn(){showPanel('产品经理 · 该掌握到哪一步',`<h2>不用把所有研发实现都学完，才考虑下一步。</h2><p>你最需要补齐的是：拿一条真实请求，从用户的话追到实际结果，能指出每一步缺什么信息、谁负责、失败在哪里，以及如何验证改进。</p><div class="explain">AI 能力很重要，但在座舱里，它要落成“正确理解 → 合理决策 → 正确调用 → 真实完成”。模型答得好、工具做不到，或车端没有执行，都不能算好产品。</div><h3>分三层掌握</h3><table><tr><th>深度</th><th>需要做到</th></tr><tr><td>全链路必懂</td><td>全部模块的输入、输出、责任人、关键状态和失败分支；能讲清一个真实案例。</td></tr><tr><td>本职必须做深</td><td>Planner/Director、输入管理、Context、工具和任务的边界；能独立定义规则、拆 badcase、写验收集。</td></tr><tr><td>按问题深入</td><td>ASR/VAD 阈值、缓存、模型训练、音频缓冲、车端协议。理解它们影响什么指标，不要求先掌握全部实现。</td></tr></table><h3>你可以怎样考自己</h3><ol><li>不看文档，画出“去昨天那个游泳馆”的完整多轮链路，包括查不到与多个候选。</li><li>找一条真实失败请求，拿证据区分规则、数据、模型、工具、车端时序；不是只说模型不聪明。</li><li>给一个场景写出成功、部分失败、无回包、打断、重复、断网、权限不足的验收案例。</li><li>提出改动后，知道改善哪项指标、可能伤害什么，能用对照评测确认。</li><li>能向跨团队负责人问清输入契约、最终结果、失败返回、取消与幂等，而不是只问接口是否通了。</li></ol><p>以上是学习与工作自测建议，不是公司晋升标准。离开或换岗的判断也不必以“所有模块全懂”为前提，更应看你能否独立交付一段闭环、用事实说明贡献，以及下一份工作能提供什么成长。</p><h3>全模块关键问题与指标</h3>${DATA.modules.sort((a,b)=>a.order-b.order).map(m=>`<details><summary>${html(m.title)}</summary>${questionHTML(m.questions)}${metricHTML(m.metrics)}</details>`).join('')}`,true);}

function casePanel(i){if(i===undefined){showPanel('沿案例走完整闭环',`<h2>选一条真实请求，按顺序定位同一张总图</h2>${cases.map((c,i)=>`<div class="row"><strong>${html(c.title)}</strong><p>${html(c.text)}</p><button data-case="${i}">开始沿线看</button></div>`).join('')}`);return;}let c=cases[i];showPanel('案例 · '+c.title,`<h2>${html(c.title)}</h2><p>${html(c.text)}</p><div class="case-steps">${c.steps.map(([m,t],i)=>`<button data-case-module="${m}">${i+1}．${html(t)} → ${m}</button>`).join('')}</div><h3>不要漏掉的反例</h3><p>关键信息为空、多个候选、工具超时、用户改口或取消、身份／座位变化、结果到达但尚未播报。这些情况仍要沿同一回路走，不能把失败请求直接丢掉。</p>`);}
function search(q){q=q.trim().toLowerCase();if(!q)return;let ns=allNodes.filter(n=>[n.id,n.title,n.detail,...n.lines].join(' ').toLowerCase().includes(q)),ts=DATA.tools.filter(t=>JSON.stringify(t).toLowerCase().includes(q));showPanel('搜索 · '+q,`<p class="small">流程节点 ${ns.length} 项，工具 ${ts.length} 项。搜索基于本图全部说明文字。</p>${ns.map(n=>`<div class="row"><strong>${n.id} · ${html(n.title)}</strong><p>${html(n.detail.slice(0,85))}…</p><button data-jump="${n.id}">定位并看完整解释</button></div>`).join('')}${ts.map(t=>`<div class="row"><strong>${html(t.label)}</strong><p><code>${html(t.name)}</code></p><button data-tool-open="${t.id}">查看工具机制</button></div>`).join('')}${!ns.length&&!ts.length?'<div class="empty">没有命中。可以试试：打断、回包、记忆、超时、任务。</div>':''}`);}
function mapRender(){let xscale=1000/DATA.width,yscale=760/(DATA.modules.reduce((v,m)=>Math.max(v,m.y+m.h),0)+80);$('#mapSvg').innerHTML=DATA.modules.map(m=>`<g data-map="${m.id}"><rect x="${m.x*xscale}" y="${m.y*yscale}" width="${m.w*xscale}" height="${m.h*yscale}" fill="${current===m.id?'#d1e3ff':'#f5f8fd'}" stroke="#9eb7d8" stroke-width="4"/><text x="${(m.x+m.w/2)*xscale}" y="${(m.y+m.h/2)*yscale}" fill="#295380" font-size="65" text-anchor="middle">${m.id}</text></g>`).join('')+`<rect x="${box.x*xscale}" y="${box.y*yscale}" width="${box.w*xscale}" height="${box.h*yscale}" fill="none" stroke="#2463c5" stroke-width="7" pointer-events="none"/>`;}
