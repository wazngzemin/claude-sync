<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 2800" font-family="Noto Sans SC">
  <!-- fill gap and move supplement up -->
  <rect x="40" y="1600" width="1700" height="700" fill="#ffffff"/>
  <!-- purple dashed frame at y=1680 -->
  <rect x="50" y="1680" width="1660" height="380" rx="8" fill="#ede7f6" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="70" y="1705" font-size="14" font-weight="700" fill="#5b21b6">本次补充：Context 读取侧产品口径（2026-10）</text>

  <rect x="80" y="1730" width="300" height="260" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="95" y="1755" font-size="13" font-weight="700" fill="#5b21b6">C13 公用 context 三级</text>
  <text x="95" y="1780" font-size="12" fill="#3c4043">最高优先级必读：</text>
  <text x="95" y="1800" font-size="12" fill="#3c4043">对话历史、车况、身份</text>
  <text x="95" y="1820" font-size="12" fill="#3c4043">次高优先级选读：</text>
  <text x="95" y="1840" font-size="12" fill="#3c4043">视觉、记忆、任务</text>
  <text x="95" y="1860" font-size="12" fill="#3c4043">偶发：长期画像</text>

  <rect x="410" y="1730" width="300" height="260" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="425" y="1755" font-size="13" font-weight="700" fill="#5b21b6">C14 三维过滤</text>
  <text x="425" y="1780" font-size="12" fill="#3c4043">按场景、按人物、按任务</text>
  <text x="425" y="1800" font-size="12" fill="#3c4043">三维过滤后再注入</text>
  <text x="425" y="1820" font-size="12" fill="#3c4043">不全量塞进提示词</text>

  <rect x="740" y="1730" width="300" height="260" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="755" y="1755" font-size="13" font-weight="700" fill="#5b21b6">C15 任务队列五字段</text>
  <text x="755" y="1780" font-size="12" fill="#3c4043">任务编号、排序、任务内容、</text>
  <text x="755" y="1800" font-size="12" fill="#3c4043">触发条件、播报话术</text>
  <text x="755" y="1820" font-size="12" fill="#3c4043">创建不等于触发</text>

  <rect x="1070" y="1730" width="300" height="260" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1085" y="1755" font-size="13" font-weight="700" fill="#5b21b6">C16 视觉信号三类</text>
  <text x="1085" y="1780" font-size="12" fill="#3c4043">舱内低频、舱内高频、舱外</text>
  <text x="1085" y="1800" font-size="12" fill="#3c4043">三类视觉信号分别取数</text>
  <text x="1085" y="1820" font-size="12" fill="#3c4043">按音区与座椅传感器触发</text>

  <rect x="1400" y="1730" width="300" height="260" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="1415" y="1755" font-size="13" font-weight="700" fill="#7f1d1d">C17 端状态上传三机制</text>
  <text x="1415" y="1780" font-size="12" fill="#3c4043">全量、增量、定时</text>
  <text x="1415" y="1800" font-size="12" fill="#3c4043">三种上报机制并用</text>
  <text x="1415" y="1820" font-size="12" fill="#3c4043">缺失值不当成零值</text>
</svg>
