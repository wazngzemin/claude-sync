<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-label="Planner 的说明书（系统提示词）由哪几块组成：上汽的一份快照" data-node-count="7">
  <title>Planner 的说明书（系统提示词）由哪几块组成：上汽的一份快照</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
    <path fill="#ffffff" d="M0,0 H1240 V900 H0 Z" data-decoration="true" />
    <text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">Planner 的说明书（系统提示词）由哪几块组成：上汽的一份快照</text>
    <text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左边按真实顺序从上往下；右边条形是各块占全文字数的比例（全文约 6.4 万字符）</text>
    <rect x="30" y="100" width="620" height="64" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" data-node="true" />
    <circle cx="50" cy="122" r="12" fill="#98a3ad" />
    <text x="50" y="127" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text>
    <text x="70" y="127" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">角色 + 你得到的输入</text>
    <text x="44" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一句话角色；四类输入怎么对待</text>
    <rect x="690" y="118" width="6" height="26" rx="4" fill="#98a3ad" data-decoration="true" />
    <text x="706" y="137" font-size="14" fill="#22384a" font-weight="600" text-anchor="start">1%</text>
    <rect x="30" y="186" width="620" height="64" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" data-node="true" />
    <circle cx="50" cy="208" r="12" fill="#98a3ad" />
    <text x="50" y="213" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text>
    <text x="70" y="213" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">可用工具（随车型和版本变化）</text>
    <text x="44" y="238" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">名称、描述、怎么传参数、注意事项、使用技巧</text>
    <rect x="690" y="204" width="76" height="26" rx="4" fill="#98a3ad" data-decoration="true" />
    <text x="775.5137486455503" y="223" font-size="14" fill="#22384a" font-weight="600" text-anchor="start">16%</text>
    <rect x="30" y="272" width="620" height="64" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" data-node="true" />
    <circle cx="50" cy="294" r="12" fill="#98a3ad" />
    <text x="50" y="299" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text>
    <text x="70" y="299" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">输出格式 + 注意事项（6 条）</text>
    <text x="44" y="324" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只输出固定格式；工具失败不必道歉；车况比历史更准</text>
    <rect x="690" y="290" width="6" height="26" rx="4" fill="#98a3ad" data-decoration="true" />
    <text x="706" y="309" font-size="14" fill="#22384a" font-weight="600" text-anchor="start">1%</text>
    <rect x="30" y="358" width="620" height="64" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" data-node="true" />
    <circle cx="50" cy="380" r="12" fill="#98a3ad" />
    <text x="50" y="385" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text>
    <text x="70" y="385" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">参考示例（25 个完整多轮案例）</text>
    <text x="44" y="410" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">情人节导航、人脸注册、打断接续、少问多做……</text>
    <rect x="690" y="376" width="300" height="26" rx="4" fill="#98a3ad" data-decoration="true" />
    <text x="1000.2383831404388" y="395" font-size="14" fill="#22384a" font-weight="600" text-anchor="start">63%</text>
    <rect x="30" y="444" width="620" height="64" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" data-node="true" />
    <circle cx="50" cy="466" r="12" fill="#98a3ad" />
    <text x="50" y="471" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text>
    <text x="70" y="471" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">表情、能力边界、其他知识、聊天风格</text>
    <text x="44" y="496" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这款车做不到什么；导航和找餐厅技巧；温柔高知的说话风格</text>
    <rect x="690" y="462" width="73" height="26" rx="4" fill="#98a3ad" data-decoration="true" />
    <text x="773.033810204306" y="481" font-size="14" fill="#22384a" font-weight="600" text-anchor="start">15%</text>
    <rect x="30" y="530" width="620" height="86" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <circle cx="50" cy="552" r="12" fill="#4a9670" />
    <text x="50" y="557" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text>
    <text x="70" y="557" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">按这句话现填的部分</text>
    <text x="44" y="582" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">相关示例、场景知识、日期天气、谁坐哪、</text>
    <text x="44" y="603" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户记忆（含本次摘要）、进行中的任务、车况</text>
    <rect x="690" y="548" width="23" height="26" rx="4" fill="#4a9670" data-decoration="true" />
    <text x="722.6284960505033" y="567" font-size="14" fill="#22384a" font-weight="600" text-anchor="start">5%</text>
    <rect x="30" y="644" width="1180" height="104" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true" />
    <text x="44" y="671" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">怎么读</text>
    <text x="44" y="696" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">灰色：每次都一样的固定部分。绿色：按这句话、这辆车、这一刻现填的部分，材料由 C 章准备。</text>
    <text x="44" y="717" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">25 个完整示例约占六成，仍写死在说明书里；另有 1000 多条短示例改为按这句话检索最像的 3 条，填在绿色部分。</text>
    <text x="44" y="738" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这是上汽一个时间点的快照，赛力斯有自己的一份，线上内容会随版本变化。</text>
    <text x="32" y="804" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start">灰：固定部分　　绿：按本轮填写的部分　　黄：读图说明　　条形长度：各块字数占比</text>
  </g>
</svg>
