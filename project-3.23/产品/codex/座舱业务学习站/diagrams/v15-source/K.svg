" fill="#566975" font-weight="400"><tspan x="921" dy="0">语义记忆、标签、分数与画像</tspan></text></g></a><a href="#module/K/step/K06"><g data-step="K06"><rect x="675" y="1580" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="675" y="1580" width="5" height="182" rx="2" fill="#326785"/><text x="695" y="1609" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="695" dy="0">K06</tspan></text><text x="695" y="1641" font-size="20" fill="#203b50" font-weight="600"><tspan x="695" dy="0">压缩近期对话供连续理解</tspan></text><text x="695" y="1683" font-size="16" fill="#375b71" font-weight="400"><tspan x="695" dy="0">对话摘要模块</tspan></text><text x="695" y="1722" font-size="16" fill="#566975" font-weight="400"><tspan x="695" dy="0">近期对话摘要</tspan></text></g></a><a href="#module/K/step/K07"><g data-step="K07"><rect x="1296" y="1862" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1296" y="1862" width="5" height="182" rx="2" fill="#326785"/><text x="1316" y="1891" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1316" dy="0">K07</tspan></text><text x="1316" y="1923" font-size="20" fill="#203b50" font-weight="600"><tspan x="1316" dy="0">保存可供查询的记忆产物</tspan></text><text x="1316" y="1965" font-size="16" fill="#375b71" font-weight="400"><tspan x="1316" dy="0">记忆服务</tspan></text><text x="1316" y="2004" font-size="16" fill="#566975" font-weight="400"><tspan x="1316" dy="0">可检索的记忆</tspan></text></g></a><a href="#module/K/step/K08"><g data-step="K08"><rect x="1361" y="2280" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1361" y="2280" width="5" height="182" rx="2" fill="#326785"/><text x="1381" y="2309" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1381" dy="0">K08</tspan></text><text x="1381" y="2341" font-size="20" fill="#203b50" font-weight="600"><tspan x="1381" dy="0">围绕这次问题检索</tspan></text><text x="1381" y="2383" font-size="16" fill="#375b71" font-weight="400"><tspan x="1381" dy="0">Planner / 业务方 → 记忆服务</tspan></text><text x="1381" y="2422" font-size="16" fill="#566975" font-weight="400"><tspan x="1381" dy="0">相关候选经历或无结果</tspan></text></g></a><a href="#module/K/step/K09"><g data-step="K09"><rect x="900" y="2698" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="900" y="2698" width="5" height="182" rx="2" fill="#326785"/><text x="920" y="2727" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="920" dy="0">K09</tspan></text><text x="920" y="2759" font-size="20" fill="#203b50" font-weight="600"><tspan x="920" dy="0">把候选事实放回当前问题</tspan></text><text x="920" y="2801" font-size="16" fill="#375b71" font-weight="400"><tspan x="920" dy="0">Context / 工具反馈 → Planner</tspan></text><text x="920" y="2840" font-size="16" fill="#566975" font-weight="400"><tspan x="920" dy="0">本轮可用事实与仍缺的信息</tspan></text></g></a><a href="#module/K/step/K10"><g data-step="K10"><rect x="900" y="3116" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="900" y="3116" width="5" height="182" rx="2" fill="#326785"/><text x="920" y="3145" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="920" dy="0">K10</tspan></text><text x="920" y="3177" font-size="20" fill="#203b50" font-weight="600"><tspan x="920" dy="0">用记忆支持下一步业务</tspan></text><text x="920" y="3219" font-size="16" fill="#375b71" font-weight="400"><tspan x="920" dy="0">Planner → 导航等业务工具</tspan></text><text x="920" y="3258" font-size="16" fill="#566975" font-weight="400"><tspan x="920" dy="0">业务请求及后续结果</tspan></text></g></a><a href="#module/K/step/K11"><g data-step="K11"><rect x="40" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">K11</tspan></text><text x="60" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">分别处理关闭与删除</tspan></text><text x="60" y="147" font-size="16" fill="#375b71" font-weight