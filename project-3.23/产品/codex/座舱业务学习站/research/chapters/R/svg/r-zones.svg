<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="四个座位、两个文字胶囊：音区怎么记、屏幕怎么显示"><title>四个座位、两个文字胶囊：音区怎么记、屏幕怎么显示</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="720" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">四个座位、两个文字胶囊：音区怎么记、屏幕怎么显示</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">一唤醒就拉起全车四个音区；屏幕按左右两侧显示识别文字</text><rect x="440" y="110" width="320" height="420" rx="60" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6"/><text x="600" y="136" font-size="14" fill="#4b5560" font-weight="600" text-anchor="middle">车头</text><rect x="465" y="170" width="120" height="110" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="479" y="197" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">主驾</text><text x="479" y="222" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">麦克风区域</text><rect x="615" y="170" width="120" height="110" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="629" y="197" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">副驾</text><text x="629" y="222" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">麦克风区域</text><rect x="465" y="340" width="120" height="110" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="479" y="367" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">左后</text><text x="479" y="392" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">麦克风区域</text><rect x="615" y="340" width="120" height="110" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="629" y="367" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">右后</text><text x="629" y="392" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">麦克风区域</text><rect x="40" y="170" width="330" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="197" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">左侧文字胶囊</text><text x="54" y="222" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">主驾 + 左后 共用</text><rect x="830" y="170" width="330" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="844" y="197" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">右侧文字胶囊</text><text x="844" y="222" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">副驾 + 右后 共用</text><path d="M465,225 L370,218" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M465,395 L420,395 L420,250 L370,250" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M735,225 L830,218" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M735,395 L780,395 L780,250 L830,250" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="40" y="320" width="330" height="110" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="54" y="347" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">按 AI 按键唤醒</text><text x="54" y="372" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">方向盘 AI 键短按</text><text x="54" y="393" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">算主驾在说</text><rect x="830" y="320" width="330" height="110" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="844" y="347" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">没人的座位不开</text><text x="844" y="372" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">全时免唤醒时，座椅传感器 +</text><text x="844" y="393" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人脸识别判断座位上有没有人</text><rect x="30" y="570" width="560" height="120" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="44" y="597" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">屏幕规则：后开口的座位要先判有效</text><text x="44" y="622" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">屏幕上已经有一句有效的话时，</text><text x="44" y="643" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">别的座位要先被判为有效才显示，</text><text x="44" y="664" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">防止别人聊天把屏幕刷得乱跳</text><rect x="610" y="570" width="560" height="120" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="624" y="597" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">已知问题</text><text x="624" y="622" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">副驾的话被记成主驾（端侧音区识别，9/28）</text><text x="624" y="643" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">四座都有人时前排小概率丢句（10/21）</text><text x="624" y="664" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">开窗行驶几乎唤醒不了，失败率 95%（11/6）</text></g></svg>