<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="v57-rhythm" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="v57-rhythm-title v57-rhythm-desc">
<title id="v57-rhythm-title">对话节奏管理，把这些时机放回一起看</title><desc id="v57-rhythm-desc">七项能力一起管理车内对话的节奏。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<text class="v56-title" x="32" y="44">对话节奏管理，把这些时机放回一起看</text>
<text class="v56-subtitle" x="32" y="72">七项能力一起管理车内对话的节奏。</text>
<path class="v56-arrow" d="M 470 350 L 372 252" data-from="center" data-to="vad"/>
<path class="v56-arrow" d="M 600 350 L 600 252" data-from="center" data-to="quick"/>
<path class="v56-arrow" d="M 730 350 L 828 252" data-from="center" data-to="interrupt"/>
<path class="v56-arrow" d="M 430 400 L 372 389" data-from="center" data-to="queue"/>
<path class="v56-arrow" d="M 430 490 L 372 569" data-from="center" data-to="fallback"/>
<path class="v56-arrow" d="M 770 400 L 828 389" data-from="center" data-to="merge"/>
<path class="v56-arrow" d="M 770 490 L 828 579" data-from="center" data-to="stream"/>
<g data-node="true" data-id="vad"><rect class="v56-local" x="32" y="126" width="340" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="154" text-anchor="start">VAD 判停</text>
<text class="v56-node-sub" x="46" y="179" text-anchor="start">根据发声与停顿，判断这段话何时收尾。</text>
<text class="v56-label" x="46" y="204" text-anchor="start">VAD → 第四段</text>
</g>
<g data-node="true" data-id="quick"><rect class="v56-local" x="430" y="126" width="340" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="154" text-anchor="start">快速接话</text>
<text class="v56-node-sub" x="444" y="179" text-anchor="start">用预请求提前准备，减少接话等待。</text>
<text class="v56-label" x="444" y="204" text-anchor="start">预请求 → 第四段</text>
</g>
<g data-node="true" data-id="interrupt"><rect class="v56-local" x="828" y="126" width="340" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="154" text-anchor="start">语音打断</text>
<text class="v56-node-sub" x="842" y="179" text-anchor="start">用户插话时让出话头，并衔接恢复。</text>
<text class="v56-label" x="842" y="204" text-anchor="start">停播 → 第五段；恢复 → 第十三段</text>
</g>
<g data-node="true" data-id="queue"><rect class="v56-neutral" x="32" y="326" width="340" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="354" text-anchor="start">多人插队</text>
<text class="v56-node-sub" x="46" y="379" text-anchor="start">管理多人插入对话时的交互节奏。</text>
</g>
<g data-node="true" data-id="fallback"><rect class="v56-neutral" x="32" y="506" width="340" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="534" text-anchor="start">异常兜底</text>
<text class="v56-node-sub" x="46" y="559" text-anchor="start">管理对话节奏出现异常时的兜底。</text>
</g>
<g data-node="true" data-id="merge"><rect class="v56-neutral" x="828" y="326" width="340" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="354" text-anchor="start">多任务反馈合并</text>
<text class="v56-node-sub" x="842" y="379" text-anchor="start">管理多个任务的反馈怎样合并。</text>
</g>
<g data-node="true" data-id="stream"><rect class="v56-neutral" x="828" y="506" width="340" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="534" text-anchor="start">流式回复节奏</text>
<text class="v56-node-sub" x="842" y="559" text-anchor="start">管理回复陆续输出时的节奏。</text>
<text class="v56-node-sub" x="842" y="584" text-anchor="start">第十三段仅讲流式播放</text>
</g>
<g data-node="true" data-id="center"><rect class="v56-decision" x="430" y="350" width="340" height="192" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="378" text-anchor="start">对话节奏管理</text>
<text class="v56-node-title" x="444" y="403" text-anchor="start">（全双工流式判断）</text>
<text class="v56-node-sub" x="444" y="428" text-anchor="start">让车内对话像自然交流。</text>
<text class="v56-node-sub" x="444" y="453" text-anchor="start">统领判停、接话与后续回复时机。</text>
</g>
<text class="v56-subtitle" x="32" y="708">连线表示能力归属，不表示执行先后；章节定位用于回看。</text>
</svg>
