<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1150" viewBox="0 0 1240 1150" role="img" aria-label="一个新能力从“想接”到“Planner 能用、结果能回来”：9 个步骤"><title>一个新能力从“想接”到“Planner 能用、结果能回来”：9 个步骤</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="1150" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">一个新能力从“想接”到“Planner 能用、结果能回来”：9 个步骤</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">以上汽接入美团订座为例；左列一次性做完（准入），右列每次用户说话都会走（运行）</text><rect x="30" y="92" width="580" height="900" rx="10" fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">接进来：一次性，产品和研发在平台上做</text><rect x="630" y="92" width="580" height="900" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="644" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">用起来：每次用户说话，在云端</text><rect x="50" y="132" width="540" height="100" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><circle cx="70" cy="154" r="12" fill="#cdb35a"/><text x="70" y="159" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="90" y="159" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">定性：算标准工具还是项目定制</text><text x="64" y="184" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">查标准化工具表：必选 / 可选 / 定制</text><text x="64" y="205" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">标准工具不许改定义，只许下游适配</text><path d="M320,232 L320,272" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="50" y="272" width="540" height="100" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><circle cx="70" cy="294" r="12" fill="#cdb35a"/><text x="70" y="299" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="90" y="299" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">写定义：给 Planner 看的说明</text><text x="64" y="324" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">名字、能办什么、怎么传参数、注意事项</text><text x="64" y="345" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">输入输出约定：正常 / 异常各回什么</text><path d="M320,372 L320,412" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="50" y="412" width="540" height="100" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><circle cx="70" cy="434" r="12" fill="#cdb35a"/><text x="70" y="439" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="90" y="439" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">建实现：这个项目由谁来办</text><text x="64" y="464" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按渠道（上汽、赛力斯、主线）各建一份</text><text x="64" y="485" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">提供方：自研 / 内部平台 / 豆包 / 三方</text><path d="M320,512 L320,552" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="50" y="552" width="540" height="100" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><circle cx="70" cy="574" r="12" fill="#cdb35a"/><text x="70" y="579" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="90" y="579" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">接协议：三方按座舱 Agent 协议对接</text><text x="64" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">座舱云发什么、对方怎么一帧帧回</text><text x="64" y="625" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">纯车上自己办完的，建议走函数调用协议</text><path d="M320,652 L320,692" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="50" y="692" width="540" height="100" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><circle cx="70" cy="714" r="12" fill="#cdb35a"/><text x="70" y="719" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="90" y="719" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">测：快速测试、测试环境、评测、路测</text><text x="64" y="744" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">美团订座：联调、批量测试、对齐调用预期</text><text x="64" y="765" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">6 月下旬开发 → 8 月 3 日一期完成</text><path d="M320,792 L320,832" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="50" y="832" width="540" height="100" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><circle cx="70" cy="854" r="12" fill="#c45c5c"/><text x="70" y="859" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="90" y="859" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">发布；不行就禁用或临时摘掉</text><text x="64" y="884" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">草稿只在指定环境生效，发布后主链路才用</text><text x="64" y="905" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">行程规划还不完整，路测时先摘掉</text><rect x="650" y="132" width="540" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="670" cy="154" r="12" fill="#4a9670"/><text x="670" y="159" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="690" y="159" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">这一轮，Planner 面前有哪些工具</text><text x="664" y="184" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">读本渠道已发布、参与推理的实现</text><text x="664" y="205" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">动态工具：条件满足才出现</text><rect x="650" y="412" width="540" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="670" cy="434" r="12" fill="#4a9670"/><text x="670" y="439" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">8</text><text x="690" y="439" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">调用：按渠道找到实现，按协议请求</text><text x="664" y="464" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">带上问题、历史、记忆、车况、渠道</text><text x="664" y="485" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户打断时发取消</text><rect x="650" y="692" width="540" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="670" cy="714" r="12" fill="#4a9670"/><text x="670" y="719" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">9</text><text x="690" y="719" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">回包：一帧帧回来，最后一帧收尾</text><text x="664" y="744" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">上屏的、播报的、给 Planner 的分开写</text><text x="664" y="765" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">给 Planner 的那段变成工具反馈</text><path d="M920,232 L920,412" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="840.9" y="307" width="158.2" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="920" y="323" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">“订附近那家本帮菜馆”</text><path d="M920,512 L920,692" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="865.6" y="587" width="108.8" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="920" y="603" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">美团订座的接入点</text><path d="M590,882 L615,882 L615,182 L650,182" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="470" y="975" font-size="13" fill="#4b5560" font-weight="600" text-anchor="start">发布以后，右边第 7 步才看得到它</text><rect x="650" y="832" width="540" height="100" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="664" y="859" font-size="16" fill="#22384a" font-weight="650" text-anchor="start">交给 E 章：执行、回执、统一播报</text><text x="664" y="884" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">给 Planner 的那段经输入管理回到 Planner（M 章）</text><text x="664" y="905" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“说的和做的对不对得上”由 O 章核对</text><path d="M920,792 L920,832" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="1010" width="1180" height="120" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="44" y="1037" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">这一章不管什么</text><text x="44" y="1062" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">Planner 怎么选工具、怎么写参数：D 章。车控一句话怎么翻成函数、下发到车、回执怎么写：E 章。</text><text x="44" y="1083" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上固定说法和车上 1.7B 模型能办什么：R 章。司机 Agent 内部怎么调高德和智驾：DR 章。</text><text x="44" y="1104" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">状态：平台定义与实现已上线；正式提示词按项目加载工具说明，微调版改造在排期中；动态工具服务端已上线。</text></g></svg>