<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-label="从“各管各的”到统一输入管理：2026 年的几次转折"><title>从“各管各的”到统一输入管理：2026 年的几次转折</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="720" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">从“各管各的”到统一输入管理：2026 年的几次转折</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">上面是事件（日期在轴上），中间是阶段，下面是同期其他口径；虚线框是还没发生的计划</text><line x1="40" y1="300" x2="1200" y2="300" stroke="#9fb2c2" stroke-width="2"/><circle cx="70" cy="300" r="7" fill="#4f7ea9"/><text x="70" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle">1/13</text><rect x="10" y="100" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="24" y="127" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">多人合并</text><text x="24" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">发版合入</text><line x1="70" y1="171" x2="70" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4"/><circle cx="202" cy="300" r="7" fill="#4f7ea9"/><text x="202" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle">7/11</text><rect x="142" y="180" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="156" y="207" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">PRD v0.1</text><text x="156" y="232" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">7/14 评审</text><line x1="202" y1="251" x2="202" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4"/><circle cx="334" cy="300" r="7" fill="#4f7ea9"/><text x="334" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle">7/20</text><rect x="274" y="100" width="120" height="92" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="288" y="127" font-size="14" fill="#6e2222" font-weight="650" text-anchor="start">排期会</text><text x="288" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人力不够</text><text x="288" y="173" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">标高风险</text><line x1="334" y1="192" x2="334" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4"/><circle cx="466" cy="300" r="7" fill="#4f7ea9"/><text x="466" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle">8 月</text><rect x="406" y="180" width="120" height="92" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="420" y="207" font-size="14" fill="#6e2222" font-weight="650" text-anchor="start">先不推进</text><text x="420" y="232" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DDL 8/18</text><text x="420" y="253" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">后转 HOLD</text><line x1="466" y1="272" x2="466" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4"/><circle cx="598" cy="300" r="7" fill="#4f7ea9"/><text x="598" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle">9/18</text><rect x="538" y="100" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="552" y="127" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">需求重启</text><text x="552" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">9/22 有人力</text><line x1="598" y1="171" x2="598" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4"/><circle cx="730" cy="300" r="7" fill="#4f7ea9"/><text x="730" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle">10/13</text><rect x="670" y="180" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="684" y="207" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">需求评审</text><text x="684" y="232" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">PRD v0.5</text><line x1="730" y1="251" x2="730" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4"/><circle cx="862" cy="300" r="7" fill="#4f7ea9"/><text x="862" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle">10/23</text><rect x="802" y="100" width="120" height="71" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="816" y="127" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">技术评审</text><text x="816" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">方案定稿</text><line x1="862" y1="171" x2="862" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4"/><circle cx="994" cy="300" r="7" fill="#4f7ea9"/><text x="994" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle">11/13</text><rect x="934" y="180" width="120" height="71" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="948" y="207" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">计划开发完</text><text x="948" y="232" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">11/6 时 55%</text><line x1="994" y1="251" x2="994" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4"/><circle cx="1126" cy="300" r="7" fill="#4f7ea9"/><text x="1126" y="328" font-size="14" fill="#1f4565" font-weight="650" text-anchor="middle">11/27</text><rect x="1066" y="100" width="120" height="92" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1080" y="127" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">计划验收</text><text x="1080" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">11/16–18</text><text x="1080" y="173" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">实车提测</text><line x1="1126" y1="192" x2="1126" y2="293" stroke="#c9d6e1" stroke-width="1" stroke-dasharray="4 4"/><rect x="20" y="360" width="150" height="100" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="34" y="387" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">分散处理</text><text x="34" y="412" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">多音区缓存</text><text x="34" y="433" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">打断恢复各做</text><rect x="180" y="360" width="370" height="100" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="194" y="387" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">写了需求、排不上</text><text x="194" y="412" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工程人力给了任务管理</text><text x="194" y="433" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">路测出现补播、串播</text><rect x="568" y="360" width="652" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="582" y="387" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">重启并落成方案</text><text x="582" y="412" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">三种状态、两档优先级、工具重放边界</text><text x="582" y="433" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">统一执行编号、车上播放回执</text><rect x="20" y="490" width="1200" height="210" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="34" y="517" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start">同一时期其他文档里的口径（帮助理解为什么要统一）</text><text x="34" y="542" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">宣讲 1（10/19）：第二句来时第一句还没出首个字就合并重推；已出字就“直接打断第一个指令，丢弃”；</text><text x="34" y="563" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">　　　　　　　　主动服务排队，等用户 query 处理完。</text><text x="34" y="584" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">多人同时语音 PRD（8/24）：按“文本任务 / 控制任务”决定打断、提示音还是排队，排队要在界面上让用户看到。</text><text x="34" y="605" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">输入管理新方案：不再按任务类型分，而按“Chat 状态 × 输入优先级 × 工具发没发”；被打断的旧回答当背景交给 DT。</text><text x="34" y="626" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">路测（8/11、9/14）：新问题之后补播上一轮内容、串入别的推荐；8/13 会上徐洋说根解要调整输入管理的策略和架构。</text><text x="34" y="647" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">日期出处：发版记录 1/13；PRD 变更记录；7/20 排期会逐字稿；服务端周报（20261102～20261113 期）。</text></g></svg>