<svg xmlns="http://www.w3.org/2000/svg" width="3460" height="845" viewBox="0 0 3460 845" role="img" aria-label="请求与反馈主链"><title>请求与反馈主链</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M1895,147 L1933,147 L1933,187 L2275,187" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1990" y="186" width="190" height="44" rx="3" fill="#fff"/><text x="1995" y="210" font-size="15" fill="#435c70" font-weight="400"><tspan x="1995" dy="0">正式文字、请求身份、音区</tspan></text><path d="M2665,187 L2968,187 L2968,279 L3030,279" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="2775" y="186" width="145" height="44" rx="3" fill="#fff"/><text x="2780" y="210" font-size="15" fill="#435c70" font-weight="400"><tspan x="2780" dy="0">云端放行的有效请求</tspan></text><path d="M3030,362 L2968,362 L2968,388 L1933,388 L1933,499 L1895,499" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="2412.5" y="387" width="115" height="44" rx="3" fill="#fff"/><text x="2417.5" y="411" font-size="15" fill="#435c70" font-weight="400"><tspan x="2417.5" dy="0">当前轮输入批次</tspan></text><path d="M1125,628 L1163,628 L1163,585 L1505,585" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1235" y="584" width="160" height="44" rx="3" fill="#fff"/><text x="1240" y="608" font-size="15" fill="#435c70" font-weight="400"><tspan x="1240" dy="0">常用背景与相关上下文</tspan></text><path d="M1505,482 L1453,482 L1453,390 L430,390" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="842.5" y="347" width="175" height="44" rx="3" fill="#fff"/><text x="847.5" y="371" font-size="15" fill="#435c70" font-weight="400"><tspan x="847.5" dy="0">工具名、参数与本轮动作</tspan></text><path d="M430,360 L468,360 L468,320 L3030,320" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1582.5" y="319" width="235" height="44" rx="3" fill="#fff"/><text x="1587.5" y="343" font-size="15" fill="#435c70" font-weight="400"><tspan x="1587.5" dy="0">异步回流等需重新准入的工具反馈</tspan></text><path d="M430,419 L468,419 L468,415 L1443,415 L1443,533 L1505,533" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="827.5" y="414" width="205" height="44" rx="3" fill="#fff"/><text x="832.5" y="438" font-size="15" fill="#435c70" font-weight="400"><tspan x="832.5" dy="0">普通 ReAct 工具结果</tspan></text><path d="M1895,567 L2275,567" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="2020" y="566" width="130" height="44" rx="3" fill="#fff"/><text x="2025" y="590" font-size="15" fill="#435c70" font-weight="400"><tspan x="2025" dy="0">话术、语气与表情</tspan></text><path d="M430,508 L468,508 L468,761 L2213,761 L2213,635 L2275,635" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1220" y="760" width="190" height="44" rx="3" fill="#fff"/><text x="1225" y="784" font-size="15" fill="#435c70" font-weight="400"><tspan x="1225" dy="0">卡片、端侧内容和执行结果</tspan></text><path d="M2665,601 L2968,601 L2968,403 L3030,403" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="2760" y="600" width="175" height="44" rx="3" fill="#fff"/><text x="2765" y="624" font-size="15" fill="#435c70" font-weight="400"><tspan x="2765" dy="0">打断信息或后续用户输入</tspan></text><path d="M430,449 L488,449 L488,594 L735,594" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="525" y="551" width="115" height="44" rx="3" fill="#fff"/><text x="530" y="575" font-size="15" fill="#435c70" font-weight="400"><tspan x="530" dy="0">检索上下文来源</tspan></text><path d="M735,662 L478,662 L478,478 L430,478" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="532.5" y="661" width="100" height="44" rx="3" fill="#fff"/><text x="537.5" y="685" font-size="15" fill="#435c70" font-weight="400"><tspan x="537.5" dy="0">按需检索结果</tspan></text><a href="#module/V"><g data-step="V"><rect x="1505" y="44" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1505" y="44" width="5" height="206" rx="2" fill="#326785"/><text x="1525" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1525" dy="0">V</tspan></text><text x="1525" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="1525" dy="0">语音输入与判停</tspan></text><text x="1525" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="1525" dy="0">用户请求与执行闭环</tspan></text><text x="1525" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="1525" dy="0">检查语音是否可用 / 把人声从车内声音中分离 / 接受唤</tspan><tspan x="1525" dy="24">醒或项目允许的免唤醒输入</tspan></text></g></a><a href="#module/R"><g data-step="R"><rect x="2275" y="84" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="2275" y="84" width="5" height="206" rx="2" fill="#326785"/><text x="2295" y="113" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="2295" dy="0">R</tspan></text><text x="2295" y="145" font-size="20" fill="#203b50" font-weight="600"><tspan x="2295" dy="0">入口与端云采信</tspan></text><text x="2295" y="187" font-size="16" fill="#375b71" font-weight="400"><tspan x="2295" dy="0">用户请求与执行闭环</tspan></text><text x="2295" y="226" font-size="16" fill="#566975" font-weight="400"><tspan x="2295" dy="0">读取正式文字与网络状态 / 解析本地可处理的指令 / 判</tspan><tspan x="2295" dy="24">断是否应响应及是否走快路径</tspan></text></g></a><a href="#module/M"><g data-step="M"><rect x="3030" y="238" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="3030" y="238" width="5" height="206" rx="2" fill="#326785"/><text x="3050" y="267" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="3050" dy="0">M</tspan></text><text x="3050" y="299" font-size="20" fill="#203b50" font-weight="600"><tspan x="3050" dy="0">输入管理</tspan></text><text x="3050" y="341" font-size="16" fill="#375b71" font-weight="400"><tspan x="3050" dy="0">用户请求与执行闭环</tspan></text><text x="3050" y="380" font-size="16" fill="#566975" font-weight="400"><tspan x="3050" dy="0">提交有效输入 / 检查推理、完整输出和起播状态 / 空闲</tspan><tspan x="3050" dy="24">时直接开始下一轮</tspan></text></g></a><a href="#module/C"><g data-step="C"><rect x="735" y="525" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="735" y="525" width="5" height="206" rx="2" fill="#326785"/><text x="755" y="554" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="755" dy="0">C</tspan></text><text x="755" y="586" font-size="20" fill="#203b50" font-weight="600"><tspan x="755" dy="0">Context 上下文</tspan></text><text x="755" y="628" font-size="16" fill="#375b71" font-weight="400"><tspan x="755" dy="0">用户请求与执行闭环</tspan></text><text x="755" y="667" font-size="16" fill="#566975" font-weight="400"><tspan x="755" dy="0">持续产生上下文来源 / 维护各自负责的信息 / 把常用背</tspan><tspan x="755" dy="24">景先交给 Planner</tspan></text></g></a><a href="#module/D"><g data-step="D"><rect x="1505" y="430" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1505" y="430" width="5" height="206" rx="2" fill="#326785"/><text x="1525" y="459" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1525" dy="0">D</tspan></text><text x="1525" y="491" font-size="20" fill="#203b50" font-weight="600"><tspan x="1525" dy="0">Planner / Director</tspan></text><text x="1525" y="533" font-size="16" fill="#375b71" font-weight="400"><tspan x="1525" dy="0">用户请求与执行闭环</tspan></text><text x="1525" y="572" font-size="16" fill="#566975" font-weight="400"><tspan x="1525" dy="0">汇合本轮输入与背景 / 确定当前目标和下一步 / 提取话</tspan><tspan x="1525" dy="24">术、语气和表情</tspan></text></g></a><a href="#module/E"><g data-step="E"><rect x="40" y="331" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="331" width="5" height="206" rx="2" fill="#326785"/><text x="60" y="360" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">E</tspan></text><text x="60" y="392" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">工具执行与回流</tspan></text><text x="60" y="434" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">用户请求与执行闭环</tspan></text><text x="60" y="473" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">把动作清单转成具体调用 / 按 Agent ID 找到配置 / 准</tspan><tspan x="60" dy="24">备该工具需要的上下文</tspan></text></g></a><a href="#module/O"><g data-step="O"><rect x="2275" y="498" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="2275" y="498" width="5" height="206" rx="2" fill="#326785"/><text x="2295" y="527" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="2295" dy="0">O</tspan></text><text x="2295" y="559" font-size="20" fill="#203b50" font-weight="600"><tspan x="2295" dy="0">播报、展示与真实结果</tspan></text><text x="2295" y="601" font-size="16" fill="#375b71" font-weight="400"><tspan x="2295" dy="0">用户请求与执行闭环</tspan></text><text x="2295" y="640" font-size="16" fill="#566975" font-weight="400"><tspan x="2295" dy="0">接收本轮要表达的内容 / 选择在线、离线或缓存音频 / </tspan><tspan x="2295" dy="24">把文字变成音频并真正播出</tspan></text></g></a></g></svg>