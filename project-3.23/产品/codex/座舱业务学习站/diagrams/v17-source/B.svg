<svg xmlns="http://www.w3.org/2000/svg" width="1785" height="2778" viewBox="0 0 1785 2778" role="img" aria-label="信号与当前状态"><title>信号与当前状态</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M565,1062 L565,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="468" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="473" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="473" dy="0">车辆状态来源</tspan></text><path d="M1025,226 L1025,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="928" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="933" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="933" dy="0">任务已开启</tspan></text><path d="M1025,644 L1025,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="928" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="933" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="933" dy="0">完整视觉包</tspan></text><path d="M960,1062 L960,1236 L695,1236 L695,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="848" y="1158" width="115" height="44" rx="3" fill="#fff"/><text x="853" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="853" dy="0">接收并维护状态</tspan></text><path d="M695,1480 L695,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="693" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="698" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="698" dy="0">有效状态</tspan></text><path d="M695,1898 L695,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><r