<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1160" viewBox="0 0 1240 1160" role="img" aria-label="输入管理：一条输入从到达到交给 DT，再到“这一轮真正结束”"><title>输入管理：一条输入从到达到交给 DT，再到“这一轮真正结束”</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="1160" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">输入管理：一条输入从到达到交给 DT，再到“这一轮真正结束”</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左列是车上，中间是云端输入管理（在座舱云服务里），右列是 DT；按圆圈编号 1–6 读</text><rect x="20" y="92" width="300" height="1050" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="34" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上（车机客户端）</text><rect x="340" y="92" width="560" height="1050" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="354" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端：输入管理</text><rect x="920" y="92" width="300" height="1050" rx="10" fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="934" y="116" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">云端：DT</text><rect x="36" y="130" width="268" height="60" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="50" y="157" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">用户说话（每个座位一条）</text><text x="50" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已过拒识和端云采信</text><path d="M304,160 L360,160" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="36" y="204" width="268" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="50" y="231" font-size="14" fill="#22384a" font-weight="650" text-anchor="start">主动建议 / 任务到点</text><text x="50" y="256" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">主动服务、任务系统</text><path d="M304,234 L360,234" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="36" y="278" width="268" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="50" y="305" font-size="14" fill="#22384a" font-weight="650" text-anchor="start">工具结果</text><text x="50" y="330" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同一轮工具全部返回后</text><path d="M304,308 L360,308" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="36" y="352" width="268" height="60" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="50" y="379" font-size="14" fill="#22384a" font-weight="650" text-anchor="start">事件</text><text x="50" y="404" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">如：播报被闲聊打断</text><path d="M304,382 L360,382" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="360" y="128" width="520" height="296" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="380" cy="150" r="12" fill="#4a9670"/><text x="380" y="155" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="400" y="155" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start"></text><text x="400" y="155" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">报上名来：统一成“标准输入”</text><text x="378" y="190" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">记下：从哪来、哪一次（同一次说话不重复收）</text><text x="378" y="220" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">贴上优先级：用户说话最高（P0），其他普通（P1）</text><text x="378" y="250" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">贴上能否合并：建议、事件可合并；工具结果单独处理</text><text x="378" y="280" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只整理格式，不调模型、不猜用户意思</text><text x="378" y="330" font-size="14" fill="#1d4b35" font-weight="600" text-anchor="start">例：主驾“找附近的充电站”、副驾“要快充”</text><text x="378" y="356" font-size="14" fill="#1d4b35" font-weight="600" text-anchor="start">各成一条输入，各自带座位和时间</text><text x="378" y="400" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start">交给下一步：一条带身份的输入</text><path d="M620,424 L620,450" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="360" y="450" width="520" height="120" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="380" cy="472" r="12" fill="#4a9670"/><text x="380" y="477" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="400" y="477" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">看现在忙不忙（Chat 状态）</text><text x="374" y="502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">空闲 / 处理中（DT 在想，还没出字）/ 输出中（在说）</text><text x="374" y="523" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">另记一笔：这一轮的工具发出去了没有</text><path d="M620,570 L620,596" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="360" y="596" width="520" height="150" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="380" cy="618" r="12" fill="#4a9670"/><text x="380" y="623" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="400" y="623" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">决定谁先进 DT（准入）</text><text x="374" y="648" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">立即处理 ／ 打断后合并重推</text><text x="374" y="669" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">打断、只处理新话（旧的当背景）</text><text x="374" y="690" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">排队等这一轮说完</text><text x="374" y="711" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">详见“准入一张表”</text><path d="M620,746 L620,772" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="360" y="772" width="520" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="380" cy="794" r="12" fill="#4a9670"/><text x="380" y="799" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="400" y="799" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">组装这一轮要交的输入</text><text x="374" y="824" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">多条输入放进同一个数组，各带来源</text><text x="374" y="845" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">被打断时附上“说到哪了”</text><path d="M880,827 L940,827" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="882.2" y="798" width="55.599999999999994" height="20" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="910" y="813" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle">本轮输入</text><rect x="940" y="772" width="264" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="954" y="799" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">DT 推理</text><text x="954" y="824" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">决定说什么、调什么工具</text><text x="954" y="845" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">每次推理有唯一编号</text><path d="M1072,882 L1072,920 L880,920" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="919.425" y="893" width="121.14999999999999" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="980" y="909" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">文字 / 工具调用</text><rect x="360" y="900" width="520" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="380" cy="922" r="12" fill="#4a9670"/><text x="380" y="927" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="400" y="927" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">放行前核身份</text><text x="374" y="952" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">过期那次推理的话和工具一律拦下</text><text x="374" y="973" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具一放行，旧输入就不能再整体重推</text><path d="M360,948 L304,948" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="36" y="900" width="268" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="56" cy="922" r="12" fill="#4f7ea9"/><text x="56" y="927" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="76" y="927" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上播报、执行</text><text x="50" y="952" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">报：开始播、进度、</text><text x="50" y="973" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">播完、被永久停止</text><path d="M250,996 L250,1016 L340,1016 L340,1060 L360,1060" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="262.2" y="996" width="55.599999999999994" height="20" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="290" y="1011" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle">播放回执</text><rect x="360" y="1030" width="520" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="374" y="1057" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">播完才算这一轮结束 → 叫下一位</text><text x="374" y="1082" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">收到“播完”或超时兜底，再从队列取下一批</text><text x="374" y="1103" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没有排队的，回到空闲</text><path d="M880,1078 L900,1078 L900,700 L880,700" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="36" y="1040" width="268" height="86" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="50" y="1067" font-size="14" fill="#6e2222" font-weight="650" text-anchor="start">旁路：车上自己办完了</text><text x="50" y="1092" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">带原编号告诉云端，</text><text x="50" y="1113" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">云端结束这条、不再回复</text><path d="M304,1100 L360,1100" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/></g></svg>