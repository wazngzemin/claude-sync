<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="910" viewBox="0 0 1300 910" role="img" aria-label="主例：找充电站这一段对话里，输入管理每一刻在做什么"><title>主例：找充电站这一段对话里，输入管理每一刻在做什么</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8" /></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1300" height="910" fill="#ffffff" data-background="true" /><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start" id="m-timeline-text-1">主例：找充电站这一段对话里，输入管理每一刻在做什么</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start" id="m-timeline-text-2">横轴是先后顺序（示意，不按比例）；每列记录一个时刻；豆包的话术为示意</text><line x1="210" y1="100" x2="210" y2="720" stroke="#edf2f6" stroke-width="1" /><text x="210" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle" id="m-timeline-text-3">t1</text><line x1="390" y1="100" x2="390" y2="720" stroke="#edf2f6" stroke-width="1" /><text x="390" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle" id="m-timeline-text-4">t2</text><line x1="570" y1="100" x2="570" y2="720" stroke="#edf2f6" stroke-width="1" /><text x="570" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle" id="m-timeline-text-5">t3</text><line x1="750" y1="100" x2="750" y2="720" stroke="#edf2f6" stroke-width="1" /><text x="750" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle" id="m-timeline-text-6">t4</text><line x1="930" y1="100" x2="930" y2="720" stroke="#edf2f6" stroke-width="1" /><text x="930" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle" id="m-timeline-text-7">t5</text><line x1="1110" y1="100" x2="1110" y2="720" stroke="#edf2f6" stroke-width="1" /><text x="1110" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle" id="m-timeline-text-8">t6</text><text x="16" y="162" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-9">外部事件</text><text x="16" y="338" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-10">对话状态</text><text x="16" y="445" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-11">输入管理</text><text x="16" y="600" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-12">交给 Planner</text><line x1="108" y1="100" x2="108" y2="720" stroke="#c9d6e1" stroke-width="1" /><rect x="124" y="120" width="172" height="550" rx="8" fill="#fff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="138" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-13">主驾说“找充电站”</text><text x="138" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-14">同一刻：续航提醒</text><rect x="304" y="120" width="172" height="550" rx="8" fill="#fff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="318" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-15">副驾说“要快充”</text><text x="318" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-16">E1 还没发工具</text><rect x="484" y="120" width="172" height="550" rx="8" fill="#fff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="498" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-17">豆包：“我帮你找找”</text><text x="498" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-18">查站工具已发出</text><rect x="664" y="120" width="172" height="550" rx="8" fill="#fff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="678" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-19">工具结果回来</text><text x="678" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-20">此时还在播 t3 的话</text><rect x="844" y="120" width="172" height="550" rx="8" fill="#fff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="858" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-21">t3 的话播完</text><text x="858" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-22">车上报“播完”</text><rect x="1024" y="120" width="172" height="550" rx="8" fill="#fff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" /><text x="1038" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start" id="m-timeline-text-23">E3 还没出字时</text><text x="1038" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-24">主驾补“选便宜的”</text><text x="138" y="411" font-size="13" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-timeline-text-25">空闲：立即处理</text><text x="138" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-26">两条一起</text><text x="138" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-27">→ 推理 E1</text><text x="318" y="411" font-size="13" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-timeline-text-28">打断 E1，合并重推</text><text x="318" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-29">工具还没发</text><text x="318" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-30">→ 推理 E2</text><text x="498" y="411" font-size="13" fill="#5c4c12" font-weight="650" text-anchor="start" id="m-timeline-text-31">放行工具</text><text x="498" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-32">这批输入此后</text><text x="498" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-33">不能再整体重推</text><text x="678" y="411" font-size="13" fill="#22384a" font-weight="650" text-anchor="start" id="m-timeline-text-34">工具结果排队</text><text x="678" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-35">单独处理</text><text x="678" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-36">不打断正在播的话</text><text x="858" y="411" font-size="13" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-timeline-text-37">叫下一位</text><text x="858" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-38">取出工具结果</text><text x="858" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-39">→ 推理 E3</text><text x="1038" y="411" font-size="13" fill="#1d4b35" font-weight="650" text-anchor="start" id="m-timeline-text-40">打断 E3，合并重推</text><text x="1038" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-41">E3 还没发新工具</text><text x="1038" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-42">→ 推理 E4</text><text x="138" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start" id="m-timeline-text-43" /><text x="138" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-44">主驾：找充电站</text><text x="138" y="625" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-45">续航提醒</text><text x="318" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start" id="m-timeline-text-46" /><text x="318" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-47">主驾：找充电站</text><text x="318" y="625" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-48">续航提醒</text><text x="318" y="646" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-49">副驾：要快充</text><text x="498" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start" id="m-timeline-text-50" /><text x="498" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-51">（Planner 在等工具）</text><text x="678" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start" id="m-timeline-text-52" /><text x="678" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-53">（还在队里）</text><text x="858" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start" id="m-timeline-text-54" /><text x="858" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-55">工具：两处快充站</text><text x="1038" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start" id="m-timeline-text-56" /><text x="1038" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-57">工具：两处快充站</text><text x="1038" y="625" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-58">主驾：选便宜一点的</text><path d="M210,194 L210,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" /><path d="M210,496 L210,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><path d="M390,194 L390,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" /><path d="M390,496 L390,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><path d="M570,194 L570,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" /><path d="M570,496 L570,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><path d="M750,194 L750,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" /><path d="M750,496 L750,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><path d="M930,194 L930,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" /><path d="M930,496 L930,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><path d="M1110,194 L1110,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" /><path d="M1110,496 L1110,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" /><rect x="30" y="740" width="1240" height="104" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true" /><text x="44" y="767" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start" id="m-timeline-text-59">注</text><text x="44" y="792" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-60">E1–E4 代表不同的执行身份：全局唯一，不是递增序号；失效执行再出的字、再发的工具都会被拦下。</text><text x="44" y="813" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-61">t4–t5 是未开预跑时的走法；开了预跑，t4 就可以先算 E3，但要等 t3 的话播完才放出来。</text><text x="44" y="834" font-size="14" fill="#33495b" font-weight="400" text-anchor="start" id="m-timeline-text-62">t6：被打断的这一轮里有工具结果，它和新话一起重推。</text><text x="210" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle" id="m-timeline-text-63">空闲→处理中</text><text x="390" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle" id="m-timeline-text-64">处理中</text><text x="570" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle" id="m-timeline-text-65">输出中</text><text x="750" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle" id="m-timeline-text-66">输出中</text><text x="930" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle" id="m-timeline-text-67">处理中</text><text x="1110" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle" id="m-timeline-text-68">处理中</text><line x1="134" y1="208" x2="286" y2="208" stroke="#4f7ea9" stroke-width="2" /><line x1="134" y1="364" x2="286" y2="364" stroke="#cdb35a" stroke-width="2" /><line x1="134" y1="514" x2="286" y2="514" stroke="#4a9670" stroke-width="2" /><line x1="314" y1="208" x2="466" y2="208" stroke="#4f7ea9" stroke-width="2" /><line x1="314" y1="364" x2="466" y2="364" stroke="#cdb35a" stroke-width="2" /><line x1="314" y1="514" x2="466" y2="514" stroke="#4a9670" stroke-width="2" /><line x1="494" y1="208" x2="646" y2="208" stroke="#4f7ea9" stroke-width="2" /><line x1="494" y1="364" x2="646" y2="364" stroke="#cdb35a" stroke-width="2" /><line x1="494" y1="514" x2="646" y2="514" stroke="#4a9670" stroke-width="2" /><line x1="674" y1="208" x2="826" y2="208" stroke="#4f7ea9" stroke-width="2" /><line x1="674" y1="364" x2="826" y2="364" stroke="#cdb35a" stroke-width="2" /><line x1="674" y1="514" x2="826" y2="514" stroke="#4a9670" stroke-width="2" /><line x1="854" y1="208" x2="1006" y2="208" stroke="#4f7ea9" stroke-width="2" /><line x1="854" y1="364" x2="1006" y2="364" stroke="#cdb35a" stroke-width="2" /><line x1="854" y1="514" x2="1006" y2="514" stroke="#4a9670" stroke-width="2" /><line x1="1034" y1="208" x2="1186" y2="208" stroke="#4f7ea9" stroke-width="2" /><line x1="1034" y1="364" x2="1186" y2="364" stroke="#cdb35a" stroke-width="2" /><line x1="1034" y1="514" x2="1186" y2="514" stroke="#4a9670" stroke-width="2" /><circle cx="39" cy="881.0" r="7" fill="#eaf2fb" stroke="#4f7ea9" /><text x="53" y="886.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-timeline-text-69">蓝线：外部事件</text><circle cx="209" cy="881.0" r="7" fill="#fffbe8" stroke="#cdb35a" /><text x="223" y="886.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-timeline-text-70">黄线：对话状态与边界</text><circle cx="392" cy="881.0" r="7" fill="#eaf6ef" stroke="#4a9670" /><text x="406" y="886.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-timeline-text-71">绿线：输入管理动作</text><circle cx="562" cy="881.0" r="7" fill="#f6f7f8" stroke="#98a3ad" /><text x="576" y="886.0" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start" id="m-timeline-text-72">灰框：一个时刻</text></g></svg>
