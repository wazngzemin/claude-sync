<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="k2-debug" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="k2-debug-title k2-debug-desc">
<title id="k2-debug-title">“你又忘了”，沿着哪六层查</title><desc id="k2-debug-desc">每往下一层，都要有上一层的证据；身份上报、记忆生成、当轮使用和车上执行分别核对。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="k2-debug-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">“你又忘了”，沿着哪六层查</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">每往下一层，都要有上一层的证据；身份上报、记忆生成、当轮使用和车上执行分别核对。</text>
<text class="v56-label" x="140" y="122" text-anchor="start">从身份一路查到用户看到的结果</text>
<text class="v56-label" x="770" y="122" text-anchor="start">找谁：按职责协作的建议</text>
<g data-node="true" id="k2-debug-person"><rect class="v56-local" x="140" y="150" width="560" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="154" y="178" text-anchor="start">01 · 人认对了吗</text>
<text class="v56-node-sub" x="154" y="206" text-anchor="start">人脸 → 自然人；核对本轮乘员</text>
</g>
<text class="v56-node-title" x="770" y="179" text-anchor="start">找谁：车企人脸与身份团队</text>
<text class="v56-subtitle" x="770" y="208" text-anchor="start">先查识别和绑定是否一致</text>
<path class="v56-arrow" fill="none" d="M 420 238 L 420 276" marker-end="url(#k2-debug-arr)"/>
<g data-node="true" id="k2-debug-scope"><rect class="v56-cloud" x="140" y="276" width="560" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="154" y="304" text-anchor="start">02 · 范围对吗</text>
<text class="v56-node-sub" x="154" y="332" text-anchor="start">统一账号 → 记忆单位（车辆 × 豆包账号）</text>
</g>
<text class="v56-node-title" x="770" y="305" text-anchor="start">找谁：账号对接团队</text>
<text class="v56-subtitle" x="770" y="334" text-anchor="start">核对本轮登录与所属记忆</text>
<path class="v56-arrow" fill="none" d="M 420 364 L 420 402" marker-end="url(#k2-debug-arr)"/>
<g data-node="true" id="k2-debug-generated"><rect class="v56-cloud" x="140" y="402" width="560" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="154" y="430" text-anchor="start">03 · 生成了吗</text>
<text class="v56-node-sub" x="154" y="458" text-anchor="start">生成记录：成功 / 等待；再核对落库状态</text>
</g>
<text class="v56-node-title" x="770" y="431" text-anchor="start">找谁：记忆生成团队</text>
<text class="v56-subtitle" x="770" y="460" text-anchor="start">区分请求受理与实际写入</text>
<path class="v56-arrow" fill="none" d="M 420 490 L 420 528" marker-end="url(#k2-debug-arr)"/>
<g data-node="true" id="k2-debug-retrieved"><rect class="v56-cloud" x="140" y="528" width="560" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="154" y="556" text-anchor="start">04 · 召回到了吗</text>
<text class="v56-node-sub" x="154" y="584" text-anchor="start">核对身份权限、检索请求和实际返回</text>
</g>
<text class="v56-node-title" x="770" y="557" text-anchor="start">找谁：记忆检索团队</text>
<text class="v56-subtitle" x="770" y="586" text-anchor="start">没查到与没权限分开看</text>
<path class="v56-arrow" fill="none" d="M 420 616 L 420 654" marker-end="url(#k2-debug-arr)"/>
<g data-node="true" id="k2-debug-used"><rect class="v56-decision" x="140" y="654" width="560" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="154" y="682" text-anchor="start">05 · 这轮用上了吗</text>
<text class="v56-node-sub" x="154" y="710" text-anchor="start">本轮输入里有 ≠ Planner 决策用了</text>
</g>
<text class="v56-node-title" x="770" y="683" text-anchor="start">找谁：Planner 团队</text>
<text class="v56-subtitle" x="770" y="712" text-anchor="start">看决策是否采用正确记忆</text>
<path class="v56-arrow" fill="none" d="M 420 742 L 420 780" marker-end="url(#k2-debug-arr)"/>
<g data-node="true" id="k2-debug-executed"><rect class="v56-local" x="140" y="780" width="560" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="154" y="808" text-anchor="start">06 · 车上执行了吗</text>
<text class="v56-node-sub" x="154" y="836" text-anchor="start">工具回执与导航、座椅等实际结果是否一致</text>
</g>
<text class="v56-node-title" x="770" y="809" text-anchor="start">找谁：车企执行团队</text>
<text class="v56-subtitle" x="770" y="838" text-anchor="start">核对下发、执行和结果</text>
<path class="v56-rule" d="M 32 910 L 1168 910"/>
<text class="v56-node-title" x="140" y="946" text-anchor="start">工具返回成功 ≠ 已经落库。</text>
<rect data-decoration="true" class="v56-local" x="140" y="970" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="168" y="984" text-anchor="start">蓝：车上身份与执行</text>
<rect data-decoration="true" class="v56-cloud" x="440" y="970" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="468" y="984" text-anchor="start">绿：记忆范围、生成和召回</text>
<rect data-decoration="true" class="v56-decision" x="834" y="970" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="862" y="984" text-anchor="start">黄：本轮决策使用</text>
</svg>
