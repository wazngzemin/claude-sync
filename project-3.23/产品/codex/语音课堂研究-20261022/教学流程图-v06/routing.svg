<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 771" width="980" height="771" role="img" aria-label="先分清采用端还是云，再看云内需不需要复杂规划" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="771" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-routing" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">先分清采用端还是云，再看云内需不需要复杂规划</text><text x="30" y="58" font-size="13" fill="#5f7169">业务判断关系图 · 不代表端云串行等待；候选可以并行准备</text><g transform="translate(0,78)"><path class="flow-edge" data-from="query" data-to="valid" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><path class="flow-edge" data-from="valid" data-to="silent" d="M490.0,130 L490.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><path class="flow-edge" data-from="valid" data-to="route" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><path class="flow-edge" data-from="route" data-to="local" d="M820,130 L820,172 L642,172 L642,348 L160,348 L160,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><path class="flow-edge" data-from="route" data-to="cloud" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><path class="flow-edge" data-from="cloud" data-to="fast" d="M700,260.0 L680,260.0 L680,370 L630,370 L630,436.0 L610,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><path class="flow-edge" data-from="cloud" data-to="planner" d="M820.0,306 L820.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><path class="flow-edge" data-from="local" data-to="result" d="M280,436.0 L300,436.0 L300,546 L350,546 L350,612.0 L370,612.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><path class="flow-edge" data-from="fast" data-to="result" d="M490.0,482 L490.0,566" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><path class="flow-edge" data-from="planner" data-to="result" d="M700,436.0 L680,436.0 L680,546 L630,546 L630,612.0 L610,612.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-routing)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">结合场景</text><text x="499.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">非请求</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">有效请求</text><text x="401.0" y="339.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">按项目采用本地</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">按项目采用云端</text><text x="689.0" y="319.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">符合规则快路</text><text x="829.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">需要复杂规划</text><text x="309.0" y="495.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">本地执行反馈</text><text x="499.0" y="528.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">快路执行反馈</text><text x="689.0" y="495.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">规划与工具反馈</text><g class="flow-point" data-point="query" role="button" tabindex="0" aria-label="最终文字与交互状态"><rect x="40" y="38" width="240" height="92" rx="13" fill="#eaf1ff" stroke="#627fae" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#627fae">用户</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">最终文字与交互状态</text><text x="54" y="110" font-size="12" fill="#587266">说了什么、是否对豆包说</text></g><g class="flow-point" data-point="valid" role="button" tabindex="0" aria-label="是否是有效人机请求"><rect x="370" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#bb8932">判断</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">是否是有效人机请求</text><text x="384" y="110" font-size="12" fill="#587266">拒识结合状态判断有效性</text></g><g class="flow-point" data-point="route" role="button" tabindex="0" aria-label="按项目决定端云采信"><rect x="700" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#bb8932">判断</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">按项目决定端云采信</text><text x="714" y="110" font-size="12" fill="#587266">白名单、云端结果与兜底规则</text></g><g class="flow-point" data-point="silent" role="button" tabindex="0" aria-label="不发起新的业务动作"><rect x="370" y="214" width="240" height="92" rx="13" fill="#fcece6" stroke="#bb7560" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#bb7560">分支</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">不发起新的业务动作</text><text x="384" y="286" font-size="12" fill="#587266">与人聊天不应抢答</text></g><g class="flow-point" data-point="cloud" role="button" tabindex="0" aria-label="采用云端路径时再分流"><rect x="700" y="214" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#bb8932">判断</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">采用云端路径时再分流</text><text x="714" y="286" font-size="12" fill="#587266">云端也有规则快路</text></g><g class="flow-point" data-point="local" role="button" tabindex="0" aria-label="采用本地结果办理"><rect x="40" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="411" font-size="11" fill="#86ada7">处理</text><text x="54" y="437" font-weight="700" font-size="16" fill="#203f35">采用本地结果办理</text><text x="54" y="462" font-size="12" fill="#587266">本地命中且允许采信</text></g><g class="flow-point" data-point="fast" role="button" tabindex="0" aria-label="云端快路处理明确请求"><rect x="370" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="411" font-size="11" fill="#86ada7">处理</text><text x="384" y="437" font-weight="700" font-size="16" fill="#203f35">云端快路处理明确请求</text><text x="384" y="462" font-size="12" fill="#587266">不必每句都进Planner</text></g><g class="flow-point" data-point="planner" role="button" tabindex="0" aria-label="复杂需求进入Planner"><rect x="700" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="411" font-size="11" fill="#86ada7">处理</text><text x="714" y="437" font-weight="700" font-size="16" fill="#203f35">复杂需求进入Planner</text><text x="714" y="462" font-size="12" fill="#587266">缺背景、多步或需跟进</text></g><g class="flow-point" data-point="result" role="button" tabindex="0" aria-label="完成动作后回传实际结果"><rect x="370" y="566" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="384" y="587" font-size="11" fill="#36835f">结果</text><text x="384" y="613" font-weight="700" font-size="16" fill="#203f35">完成动作后回传实际结果</text><text x="384" y="638" font-size="12" fill="#587266">同一请求不重复执行</text></g></g></svg>