件记录</text><text class="ts" x="198" y="766" text-anchor="start" dominant-baseline="central">记录主键、发生时间、写库时间</text><text class="ts" x="198" y="785" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="804" text-anchor="start" dominant-baseline="central">在场人按事件时刻关联</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls5" aria-label="查询/订阅分发"><title>按用途的范围和授权；不是每个消费者全量接收</title><rect x="180" y="904" width="340" height="112" rx="6"/><text class="th" x="198" y="928" text-anchor="start" dominant-baseline="central">查询/订阅分发</text><text class="ts" x="198" y="956" text-anchor="start" dominant-baseline="central">按用途的范围和授权</text><text class="ts" x="198" y="975" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="994" text-anchor="start" dominant-baseline="central">不是每个消费者全量接收</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls6" aria-label="Context / UP 使用"><title>近期事实进入实际模型输入；保留本轮使用证据</title><rect x="180" y="1096" width="340" height="110" rx="6"/><text class="th" x="198" y="1120" text-anchor="start" dominant-baseline="central">Context / UP 使用</text><text class="ts" x="198" y="1148" text-anchor="start" dominant-baseline="central">近期事实进入实际模型输入</text><text class="ts" x="198" y="1167" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1186" text-anchor="start" dominant-baseline="central">保留本轮使用证据</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls7" aria-label="Memory 提取任务"><title>从合规原料异步生成记忆；后续再验证召回与采用</title><rect x="180" y="1286" width="340" height="112" rx="6"/><text class="th" x="198" y="1310" text-anchor="start" dominant-baseline="central">Memory 提取任务</text><text class="ts" x="198" y="1338" text-anchor="start" dominant-baseline="central">从合规原料异步生成记忆</text><text class="ts" x="198" y="1357" text-anchor="start" dominant-baseline=