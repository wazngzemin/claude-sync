<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3110" viewBox="0 0 1800 3110">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" fill="#42617D"/></marker></defs>
<rect width="1800" height="3110" fill="#FFFFFF"/>
<text x="70" y="65" font-size="38" fill="#1B3144" text-anchor="start" font-weight="700"><tspan x="70" dy="0">条件执行：规则命中后回调动态 Advisor，再交 Planner</tspan></text>
<text x="70" y="113" font-size="24" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">“当前有人”与“本次刚上车”是不同条件；使用经过确认的上汽信号与事件。</tspan></text>
<rect x="55" y="153" width="530" height="2770" rx="16" fill="#F3F7FB"/>
<text x="320" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">车辆 / 豆包条件触发器</tspan></text>
<rect x="635" y="153" width="530" height="2770" rx="16" fill="#F1F7F4"/>
<text x="900" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="900" dy="0">动态 Advisor / Planner</tspan></text>
<rect x="1215" y="153" width="530" height="2770" rx="16" fill="#FBF6EC"/>
<text x="1480" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="1480" dy="0">任务中心 / 执行结果</tspan></text>
<rect x="100.0" y="245.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="291" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">已登记条件场景</tspan><tspan x="320" dy="34.8">上汽范围 / 条件 / callback 动作</tspan></text>
<rect x="100.0" y="465.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="511" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">车辆提供相关状态 / 变化</tspan><tspan x="320" dy="34.8">触发器接收可用信号</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCECF6" stroke="#678198" stroke-width="2" transform="translate(320,800) scale(1.45,0.75) rotate(45)"/>
<text x="320" y="808" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">条件及生效约束满足？</tspan></text>
<rect x="680.0" y="745.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="791" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">不满足：继续监听</tspan><tspan x="900" dy="34.8">不唤醒用户任务</tspan></text>
<rect x="680.0" y="1055.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="1101" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">触发器 callback 动态 Advisor</tspan><tspan x="900" dy="34.8">告知该场景的条件已命中</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#FFF1CD" stroke="#678198" stroke-width="2" transform="translate(900,1380) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="1388" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">任务 / 版本仍有效？</tspan></text>
<rect x="1260.0" y="1325.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="1480" y="1371" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">建议：拦截取消 / 旧条件回调</tspan><tspan x="1480" dy="34.8">避免修改后仍按旧规则执行</tspan></text>
<rect x="680.0" y="1595.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="1641" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">动态 Advisor 生成 advice</tspan><tspan x="900" dy="34.8">Planner 结合当前信息判断执行</tspan></text>
<rect x="1260.0" y="1815.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="1861" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">Planner → 工具 / 客户端</tspan><tspan x="1480" dy="34.8">确认、播报或车控；返回结果</tspan></text>
<rect x="680.0" y="2045.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="900" y="2091" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">建议：汇总实际执行结果</tspan><tspan x="900" dy="34.8">失败 / 超时不能记作成功</tspan></text>
<rect x="1260.0" y="2245.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="1480" y="2291" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">建议：任务中心回写本轮</tspan><tspan x="1480" dy="34.8">成功、失败与跳过区分</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCEEE3" stroke="#678198" stroke-width="2" transform="translate(900,2520) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="2528" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">一次性还是持续任务？</tspan></text>
<rect x="100.0" y="2465.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="320" y="2511" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">建议：一次性收尾</tspan><tspan x="320" dy="34.8">失效 / 删除关联条件场景</tspan></text>
<rect x="1260.0" y="2465.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="2511" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">持续任务：按规则继续监听</tspan><tspan x="1480" dy="34.8">频控 / 最大次数 / 有效期待确认</tspan></text>
<rect x="100.0" y="2765.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="2811" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">后台预置：命中后通知配置下游</tspan><tspan x="320" dy="34.8">不固定回调动态 Advisor</tspan></text>
<polyline points="320,355.0 320,465.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="320,575.0 320,692.5" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="525.0,800 680.0,800" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="578.0" y="750" width="64" height="34" rx="5" fill="#FFFFFF"/>
<text x="610" y="775" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="610" dy="0">否</tspan></text>
<polyline points="320,907.5 320,981.25 900,981.25 900,1055.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="578.0" y="944.25" width="64" height="34" rx="5" fill="#FFFFFF"/>
<text x="610.0" y="969.25" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="610.0" dy="0">是</tspan></text>
<polyline points="900,1165.0 900,1272.5" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1105.0,1380 1260.0,1380" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1158.0" y="1330" width="64" height="34" rx="5" fill="#FFFFFF"/>
<text x="1190" y="1355" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="1190" dy="0">否</tspan></text>
<polyline points="900,1487.5 900,1595.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="918.0" y="1525" width="64" height="34" rx="5" fill="#FFFFFF"/>
<text x="950" y="1550" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="950" dy="0">是</tspan></text>
<polyline points="900,1705.0 900,1760.0 1480,1760.0 1480,1815.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1480,1925.0 1480,1985.0 900,1985.0 900,2045.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="900,2155.0 900,2200.0 1480,2200.0 1480,2245.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="900,2155.0 900,2395 900,2412.5" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="695.0,2520 540.0,2520" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="561.0" y="2470" width="98.0" height="34" rx="5" fill="#FFFFFF"/>
<text x="610" y="2495" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="610" dy="0">一次性</tspan></text>
<polyline points="1105.0,2520 1260.0,2520" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1153.0" y="2470" width="74.0" height="34" rx="5" fill="#FFFFFF"/>
<text x="1190" y="2495" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="1190" dy="0">持续</tspan></text>
<text x="70" y="2985" font-size="23" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">状态变化 + 当前状态组合、频控与有效期应按实际接入契约核对；频控间隔不是循环定时。</tspan><tspan x="70" dy="33.35">黄色节点为建议 / 待确认；模糊日期转上车条件时，日期窗口与首次记录归属仍需确认。</tspan></text>
</svg>