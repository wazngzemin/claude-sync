<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3150" viewBox="0 0 1800 3150">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" fill="#42617D"/></marker></defs>
<rect width="1800" height="3150" fill="#FFFFFF"/>
<text x="70" y="65" font-size="38" fill="#1B3144" text-anchor="start" font-weight="700"><tspan x="70" dy="0">纯定时执行：到点事件只唤醒任务，真实结果决定本轮状态</tspan></text>
<text x="70" y="113" font-size="24" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">弋途负责计时；动态 Advisor 提交建议；Planner 安排动作。黄色为建议闭环。</tspan></text>
<rect x="55" y="153" width="530" height="2810" rx="16" fill="#F3F7FB"/>
<text x="320" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">弋途定时能力 / 任务中心</tspan></text>
<rect x="635" y="153" width="530" height="2810" rx="16" fill="#F1F7F4"/>
<text x="900" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="900" dy="0">动态 Advisor / Planner</tspan></text>
<rect x="1215" y="153" width="530" height="2810" rx="16" fill="#FBF6EC"/>
<text x="1480" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="1480" dy="0">工具 / 客户端 / 异常</tspan></text>
<rect x="100.0" y="245.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="291" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">弋途等待已登记时间</tspan><tspan x="320" dy="34.8">一次性 / 固定间隔 / 每日固定时刻</tspan></text>
<rect x="680.0" y="435.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="481" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">弋途 → 动态 Advisor</tspan><tspan x="900" dy="34.8">本轮到点事件</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#FFF1CD" stroke="#678198" stroke-width="2" transform="translate(900,760) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="768" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">任务和本轮仍有效？</tspan></text>
<rect x="1260.0" y="705.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="1480" y="751" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">建议：拦截旧版 / 取消事件</tspan><tspan x="1480" dy="34.8">不生成新的播报或控车</tspan></text>
<rect x="680.0" y="965.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="1011" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">动态 Advisor 形成 advice</tspan><tspan x="900" dy="34.8">携带执行内容和对象</tspan></text>
<rect x="680.0" y="1155.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="1201" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">Planner 读取当前车况</tspan><tspan x="900" dy="34.8">判断目标是否已满足 / 能否执行</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCEEE3" stroke="#678198" stroke-width="2" transform="translate(900,1470) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="1478" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">目标已满足？</tspan></text>
<rect x="1260.0" y="1415.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="1480" y="1461" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">建议：已无需执行</tspan><tspan x="1480" dy="34.8">例如座椅加热已关闭</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCEEE3" stroke="#678198" stroke-width="2" transform="translate(900,1780) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="1788" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">当前可执行？</tspan></text>
<rect x="100.0" y="1725.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="320" y="1771" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">无法触达 / 功能不可用</tspan><tspan x="320" dy="34.8">失败、等待或错过策略待确认</tspan></text>
<rect x="1260.0" y="1960.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="2006" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">Planner 调用工具 / 客户端</tspan><tspan x="1480" dy="34.8">车控或提醒；需确认先确认</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#FFF1CD" stroke="#678198" stroke-width="2" transform="translate(900,2240) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="2248" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">收到真实执行结果？</tspan></text>
<rect x="100.0" y="2185.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="320" y="2231" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">建议：超时不能报成功</tspan><tspan x="320" dy="34.8">查询 / 重试 / 未知策略待确认</tspan></text>
<rect x="680.0" y="2455.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="900" y="2501" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">建议：按实际结果回写本轮</tspan><tspan x="900" dy="34.8">成功 / 失败 / 跳过 / 错过</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCEEE3" stroke="#678198" stroke-width="2" transform="translate(900,2740) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="2748" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">一次性还是循环？</tspan></text>
<rect x="100.0" y="2685.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="2731" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">一次性：本任务结束</tspan><tspan x="320" dy="34.8">进入任务记录</tspan></text>
<rect x="1260.0" y="2685.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="2731" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">循环：保存本轮并安排下一轮</tspan><tspan x="1480" dy="34.8">继续方式、锚点与保留策略待确认</tspan></text>
