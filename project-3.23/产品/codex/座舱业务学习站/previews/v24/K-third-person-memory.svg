  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">别人说了我的偏好：先保存来源，再判断能否形成我的语义记</text><text class="title" x="340" y="57" text-anchor="middle" dominant-baseline="central">忆</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,188 350,254" marker-end="url(#arrow-K-third-person-memory)"><title>kt1 → kt2：先记录真实表达</title></polyline><polyline class="arr" fill="none" points="350,378 350,444" marker-end="url(#arrow-K-third-person-memory)"><title>kt2 → kt3：检查是否具备个人语义归属依据</title></polyline><polyline class="arr" fill="none" points="350,568 350,634" marker-end="url(#arrow-K-third-person-memory)"><title>kt3 → kt4：本人在场并明确肯定</title></polyline><polyline class="arr" fill="none" points="176,498 60,498 60,900 170,900" marker-end="url(#arrow-K-third-person-memory)"><title>kt3 → kt5：没有明确认可</title></polyline><polyline class="arr" fill="none" points="176,688 70,688 70,1090 170,1090" marker-end="url(#arrow-K-third-person-memory)"><title>kt4 → kt6：允许使用且与当前问题有关</title></polyline><polyline class="arr" fill="none" points="350,948 350,1014" marker-end="url(#arrow-K-third-person-memory)"><title>kt5 → kt6：仅按原始对话事实理解</title></polyline><text class="ts" x="365" y="224" text-anchor="start" dominant-baseline="central">E1 · 先记录真实表达</text><text class="ts" x="365" y="414" text-anchor="start" dominant-baseline="central">E2 · 检查是否具备个人语义归属依据</text><text class="ts" x="365" y="604" text-anchor="start" dominant-baseline="central">E3 · 本人在场并明确肯定</text><text class="ts" x="168" y="490" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="168" y="912" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="168" y="680" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="168" y="1102" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="365" y="984" text-anchor="start" dominant-baseline="central">E6 · 仅按原始对话事实理解</text><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-third-person-memory" data-step="kt1" aria-label="小林说“小周喜欢苹果”"><title>原始素材包含说话人和被谈论者</title><rect x="180" y="106" width="340" height="78" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">小林说“小周喜欢苹果”</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">原始素材包含说话人和被谈论者</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-third-person-memory" data-step="kt2" aria-label="保留这次对话的事实"><title>小林曾这样表达；保留账号、在场人及场景来源</title><rect x="180" y="264" width="340" height="110" rx="6"/><text class="th" x="198" y="288" text-anchor="start" dominant-baseline="central">保留这次对话的事实</text><text class="ts" x="198" y="316" text-anchor="start" dominant-baseline="central">小林曾这样表达</text><text class="ts" x="198" y="335" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="354" text-anchor="start" dominant-baseline="central">保留账号、在场人及场景来源</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-third-person-memory" data-step="kt3" aria-label="小周是否在场且明确认可"><title>在场只是必要条件；沉默、拒绝或不在场都不等于肯定</title><rect x="180" y="454" width="340" height="110" rx="6"/><text class="th" x="198" y="478" text-anchor="start" dominant-baseline="central">小周是否在场且明确认可</text><text class="ts" x="198" y="506" text-anchor="start" dominant-baseline="central">在场只是必要条件</text><text class="ts" x="198" y="525" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="544" text-anchor="start" dominant-baseline="central">沉默、拒绝或不在场都不等于肯定</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-third-person-memory" data-step="kt4" aria-label="可以形成对应语义候选"><title>提取小周已确认的偏好；继续按账号、主体和场景规则处理</title><rect x="180" y="644" width="340" height="110" rx="6"/><text class="th" x="198" y="668" text-anchor="start" dominant-baseline="central">可以形成对应语义候选</text><text class="ts" x="198" y="696" text-anchor="start" dominant-baseline="central">提取小周已确认的偏好</text><text class="ts" x="198" y="715" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="734" text-anchor="start" dominant-baseline="central">继续按账号、主体和场景规则处理</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-third-person-memory" data-step="kt5" aria-label="不写成小周已确认的偏好"><title>仍可保留“小林曾这样说”的情景事实；不能只因之后注册同名人物就自动关联</title><rect x="180" y="834" width="340" height="110" rx="6"/><text class="th" x="198" y="858" text-anchor="start" dominant-baseline="central">不写成小周已确认的偏好</text><text class="ts" x="198" y="886" text-anchor="start" dominant-baseline="central">仍可保留“小林曾这样说”的情景事实</text><text class="ts" x="198" y="905" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="924" text-anchor="start" dominant-baseline="central">不能只因之后注册同名人物就自动关联</text></g><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-third-person-memory" data-step="kt6" aria-label="后续查询按来源解释"><title>问经历：可回答当时说过什么；问本人偏好：不能把转述当本人确认</title><rect x="180" y="1024" width="340" height="110" rx="6"/><text class="th" x="198" y="1048" text-anchor="start" dominant-baseline="central">后续查询按来源解释</text><text class="ts" x="198" y="1076" text-anchor="start" dominant-baseline="central">问经历：可回答当时说过什么</text><text class="ts" x="198" y="1095" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1114" text-anchor="start" dominant-baseline="central">问本人偏好：不能把转述当本人确认</text></g><text class="th" x="40" y="1218" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1248" text-anchor="start" dominant-baseline="central">E1 小林说“小周喜欢苹果” → 保留这次对话的事实：先记录真实表达</text><text class="ts" x="40" y="1281" text-anchor="start" dominant-baseline="central">E2 保留这次对话的事实 → 小周是否在场且明确认可：检查是否具备个人语义归属依据</text><text class="ts" x="40" y="1314" text-anchor="start" dominant-baseline="central">E3 小周是否在场且明确认可 → 可以形成对应语义候选：本人在场并明确肯定</text><text class="ts" x="40" y="1347" text-anchor="start" dominant-baseline="central">E4 小周是否在场且明确认可 → 不写成小周已确认的偏好：没有明确认可</text><text class="ts" x="40" y="1380" text-anchor="start" dominant-baseline="central">E5 可以形成对应语义候选 → 后续查询按来源解释：允许使用且与当前问题有关</text><text class="ts" x="40" y="1413" text-anchor="start" dominant-baseline="central">E6 不写成小周已确认的偏好 → 后续查询按来源解释：仅按原始对话事实理解</text></svg>