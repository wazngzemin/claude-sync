<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 -20 1800 2100" font-family="Noto Sans SC, sans-serif">
  <!-- 补充区分区框（下移到 y=1750，避免盖住 S13/S14/S15） -->
  <rect x="40" y="1750" width="1760" height="240" rx="8" fill="#FAFBFC" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="1778" font-size="18" font-weight="bold" fill="#37474F">本次补充：主动服务产品口径（S16 到 S19），分别接回 S01、S05、S04、S08</text>
  <text x="60" y="1800" font-size="13" fill="#78909C">以下节点为 2.6 目标口径，不替代原图 S01 到 S15 的主判断流程；状态写在卡片要点里</text>

  <!-- 四个卡片一行 y=1820 -->
  <!-- S16 四类顾问分工（蓝底，接 S01） -->
  <rect x="60" y="1820" width="410" height="140" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="78" y="1845" font-size="16" font-weight="bold" fill="#1565C0">S16　四类顾问分工</text>
  <text x="78" y="1868" font-size="13" fill="#37474F">舒适顾问管车控类建议</text>
  <text x="78" y="1888" font-size="13" fill="#37474F">出行顾问管导航类建议</text>
  <text x="78" y="1908" font-size="13" fill="#37474F">情感顾问管陪伴类建议</text>
  <text x="78" y="1928" font-size="13" fill="#37474F">内容顾问管娱乐类建议</text>
  <text x="78" y="1948" font-size="13" fill="#E65100">【已落地】</text>

  <!-- S17 advice 五字段（蓝底，接 S05） -->
  <rect x="490" y="1820" width="410" height="140" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="508" y="1845" font-size="16" font-weight="bold" fill="#1565C0">S17　建议带哪五个字段</text>
  <text x="508" y="1868" font-size="13" fill="#37474F">目标：建议要达成什么</text>
  <text x="508" y="1888" font-size="13" fill="#37474F">对象：对谁、对什么场景</text>
  <text x="508" y="1908" font-size="13" fill="#37474F">理由：为什么现在说</text>
  <text x="508" y="1928" font-size="13" fill="#37474F">策略：静默/告知/确认</text>
  <text x="508" y="1948" font-size="13" fill="#37474F">渠道：语音/卡片/界面</text>
  <text x="508" y="1968" font-size="13" fill="#E65100">【已落地】</text>

  <!-- S18 打扰频率上限（金底，接 S04） -->
  <rect x="920" y="1820" width="410" height="140" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.5"/>
  <text x="938" y="1845" font-size="16" font-weight="bold" fill="#E65100">S18　打扰频率上限</text>
  <text x="938" y="1868" font-size="13" fill="#37474F">初定最多打断 2 次</text>
  <text x="938" y="1888" font-size="13" fill="#37474F">多事件可合并成一次说</text>
  <text x="938" y="1908" font-size="13" fill="#37474F">睡觉/通话/驾驶负荷时降频</text>
  <text x="938" y="1928" font-size="13" fill="#37474F">不值得服务就不产出</text>
  <text x="938" y="1968" font-size="13" fill="#C62828">【2.6 目标 / 2 次上限讨论中】</text>

  <!-- S19 子目标 review 周期（蓝底，接 S08） -->
  <rect x="1350" y="1820" width="410" height="140" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="1368" y="1845" font-size="16" font-weight="bold" fill="#1565C0">S19　子目标复盘周期</text>
  <text x="1368" y="1868" font-size="13" fill="#37474F">有子目标每 10 分钟复盘一次</text>
  <text x="1368" y="1888" font-size="13" fill="#37474F">新事件推理会重置计时</text>
  <text x="1368" y="1908" font-size="13" fill="#37474F">完成/用户删除/下电结束跟进</text>
  <text x="1368" y="1928" font-size="13" fill="#37474F">模型可创建，不要求每次都建</text>
  <text x="1368" y="1968" font-size="13" fill="#E65100">【已落地】</text>
</svg>
