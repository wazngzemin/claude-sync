<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1401" viewBox="0 0 1660 1401">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1401" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">身份感知补引导</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">相关对话触发介绍；注册操作沿用既有流程</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户聊到称呼、偏好或希望被记住</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">例如：以后叫我小王，我喜欢吃川菜</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">语义模型返回身份场景相关</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器能否确认身份场景资格？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">提车时跳过注册，当前仍未注册</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">账号与当前对象关联明确</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">条件不成立／未知</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不触发原表补引导</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">正常功能处理继续</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">能确认</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器检查次数与场景可用性</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">补引导次数尚未耗尽，注册能力可用</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">通过后下发身份引导建议</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">不满足</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不再主动补引导</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">主动注册仍可使用</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">满足</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 处理建议并回传，触发器计次</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">DT 结合原诉求说明注册价值</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">询问是否愿意注册，呈现适用指引</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="997" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户是否明确同意注册？</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">引导计次与注册授权分别判断</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不因语义命中自动执行注册</text><line x1="1020" y1="1065.0" x2="1186" y2="1065.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1052.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否</text><rect x="1190" y="997" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1037" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">拒绝／稍后</text><text x="1218" y="1075" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">停止当轮注册</text><text x="1218" y="1106" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不伪造成功结果</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1173.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">同意</text><rect x="100" y="1200" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 调用身份注册工具并读取反馈</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">成功才告知注册完成，失败则如实说明</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">注册结果单独记录，不重复扣引导次数</text>
</svg>