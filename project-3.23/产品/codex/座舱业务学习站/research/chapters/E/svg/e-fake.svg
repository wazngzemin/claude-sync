<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640" role="img" aria-label="“成功”可能在哪一环是假的：四个检查点"><title>“成功”可能在哪一环是假的：四个检查点</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1260" height="640" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">“成功”可能在哪一环是假的：四个检查点</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">上排是一个动作的四个阶段；中间红框是两个阶段之间会断的地方（真实例子）</text><rect x="30" y="100" width="270" height="80" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="44" y="127" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">① 已推送</text><text x="44" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">云端日志：已推给这辆车</text><rect x="340" y="100" width="270" height="80" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="354" y="127" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">② 车已回话</text><text x="354" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上回了一个结果</text><rect x="650" y="100" width="270" height="80" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="664" y="127" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">③ 车已执行</text><text x="664" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车辆服务执行了某个函数</text><rect x="960" y="100" width="270" height="80" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="974" y="127" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">④ 目标状态到位</text><text x="974" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">和用户要的结果一致</text><path d="M300,140 L340,140" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M610,140 L650,140" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M920,140 L960,140" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="175" y="230" width="290" height="140" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="189" y="257" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">①→② 会断</text><text x="189" y="282" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">推送了，车没回结果</text><text x="189" y="303" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">→ 回“执行失败，请勿重复调用”</text><text x="189" y="324" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（超时秒数、是否重试待确认）</text><path d="M320,140 L320,230" fill="none" stroke="#c45c5c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="485" y="230" width="290" height="140" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="499" y="257" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">②→③ 看不清</text><text x="499" y="282" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">回执成功但没写说明，</text><text x="499" y="303" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">云端补成“执行成功”</text><text x="499" y="324" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车到底做没做，DT 不知道</text><path d="M630,140 L630,230" fill="none" stroke="#c45c5c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="795" y="230" width="290" height="140" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="809" y="257" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">③→④ 会错</text><text x="809" y="282" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">执行了不对的函数或参数：</text><text x="809" y="303" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">要“舒缓”按摩，开了别的模式；</text><text x="809" y="324" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">要切自动，执行的是“空调开关”</text><path d="M940,140 L940,230" fill="none" stroke="#c45c5c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="30" y="410" width="1200" height="80" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="44" y="437" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">DT 现在能看到的：只有回执那一句话</text><text x="44" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">上面三处断点 DT 都看不见；回执写着“执行成功”，DT 就说“做好了”。虚假成功分析整理了 23 个这样的 case，多数来自 8 月 11 日路测。</text><rect x="30" y="515" width="1200" height="100" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="44" y="542" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">8 月提出的改进（方案，上线情况待确认）</text><text x="44" y="567" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">回执写清实际执行结果（对谁、做成了什么）；每个回执后拼一句“检查执行结果是否满足下发的指令”；</text><text x="44" y="588" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">把工具能力边界、页面状态注入给 DT；对可能听错的话先向用户确认</text></g></svg>