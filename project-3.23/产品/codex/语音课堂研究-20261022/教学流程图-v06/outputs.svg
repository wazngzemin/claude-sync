<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="同一轮结果分成三路：给人看、给人听、给系统继续判断" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-outputs" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">同一轮结果分成三路：给人看、给人听、给系统继续判断</text><text x="30" y="58" font-size="13" fill="#5f7169">展示内容、播报内容、模型反馈的职责不同</text><g transform="translate(0,78)"><path class="flow-edge" data-from="tool" data-to="screen" d="M280,260.0 L300,260.0 L300,150 L350,150 L350,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outputs)"/><path class="flow-edge" data-from="tool" data-to="speak" d="M280,260.0 L370,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outputs)"/><path class="flow-edge" data-from="tool" data-to="model" d="M280,260.0 L300,260.0 L300,370 L350,370 L350,436.0 L370,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outputs)"/><path class="flow-edge" data-from="screen" data-to="see" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outputs)"/><path class="flow-edge" data-from="speak" data-to="hear" d="M610,260.0 L700,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outputs)"/><path class="flow-edge" data-from="model" data-to="next" d="M610,436.0 L700,436.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outputs)"/><text x="309.0" y="209.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">展示分支</text><text x="325.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">播报分支</text><text x="309.0" y="319.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">判断分支</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">渲染界面</text><text x="655.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">组织回复</text><text x="655.0" y="427.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">结果驱动</text><g class="flow-point" data-point="tool" role="button" tabindex="0" aria-label="下游返回实际结果"><rect x="40" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#86ada7">处理</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">下游返回实际结果</text><text x="54" y="286" font-size="12" fill="#587266">例如两个游泳馆候选</text></g><g class="flow-point" data-point="screen" role="button" tabindex="0" aria-label="给界面展示的内容"><rect x="370" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#86ada7">处理</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">给界面展示的内容</text><text x="384" y="110" font-size="12" fill="#587266">地点卡片、状态、可操作项</text></g><g class="flow-point" data-point="speak" role="button" tabindex="0" aria-label="给语音表达的内容"><rect x="370" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#86ada7">处理</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">给语音表达的内容</text><text x="384" y="286" font-size="12" fill="#587266">组织成用户听得懂的话</text></g><g class="flow-point" data-point="model" role="button" tabindex="0" aria-label="给Planner继续判断的信息"><rect x="370" y="390" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="411" font-size="11" fill="#86ada7">处理</text><text x="384" y="437" font-weight="700" font-size="16" fill="#203f35">给Planner继续判断的信息</text><text x="384" y="462" font-size="12" fill="#587266">候选数据、状态、错误原因</text></g><g class="flow-point" data-point="see" role="button" tabindex="0" aria-label="用户看见并能选择"><rect x="700" y="38" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#36835f">结果</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">用户看见并能选择</text><text x="714" y="110" font-size="12" fill="#587266">卡片出现不等于导航启动</text></g><g class="flow-point" data-point="hear" role="button" tabindex="0" aria-label="后续经语音生成与播放"><rect x="700" y="214" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#36835f">结果</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">后续经语音生成与播放</text><text x="714" y="286" font-size="12" fill="#587266">有文字不等于已听见</text></g><g class="flow-point" data-point="next" role="button" tabindex="0" aria-label="下一轮规划或按规则收口"><rect x="700" y="390" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="714" y="411" font-size="11" fill="#36835f">结果</text><text x="714" y="437" font-weight="700" font-size="16" fill="#203f35">下一轮规划或按规则收口</text><text x="714" y="462" font-size="12" fill="#587266">结果结束不等于动作成功</text></g></g></svg>