<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="全时态下的一句话：车上先判断，三种结局"><title>全时态下的一句话：车上先判断，三种结局</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="680" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">全时态下的一句话：车上先判断，三种结局</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">赛力斯本地对话链路需求（2026-07 起）；上汽没有全时态</text><rect x="30" y="250" width="200" height="90" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="277" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">全时态，有人开口</text><text x="44" y="302" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没喊“豆包”</text><rect x="290" y="120" width="300" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="304" y="147" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上识别边听边出字</text><text x="304" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">送给车上流式拒识模型</text><polygon points="760,120.0 870.0,168 760,216.0 650.0,168" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="760" y="163" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">边听边判：</text><text x="760" y="183" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">值得接？</text><rect x="920" y="120" width="250" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="934" y="147" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">马上把声音送上云</text><text x="934" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">之后以云端拒识为准</text><text x="934" y="193" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上改判不算数</text><rect x="610" y="300" width="300" height="80" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="624" y="327" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">等这句话说完</text><text x="624" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上模型对整句再判一次</text><rect x="30" y="450" width="360" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="44" y="477" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">不该接，且声音没上过云</text><text x="44" y="502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">悄悄丢掉：不唤醒、不上云</text><text x="44" y="523" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">屏幕上什么都不出现</text><rect x="420" y="450" width="360" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="434" y="477" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">能办，或办不了</text><text x="434" y="502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">整段声音送上云，交给云端</text><text x="434" y="523" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">9/30 后车上判能办也要上云</text><rect x="810" y="450" width="360" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="824" y="477" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">已经上过云的</text><text x="824" y="502" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不管车上后来怎么判</text><text x="824" y="523" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一律等云端拒识的结论</text><path d="M230,295 L260,295 L260,168 L290,168" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M590,168 L650,168" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M870,168 L920,168" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="883.825" y="147" width="22.35" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="895" y="163" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">是</text><path d="M760,216 L760,300" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="768.825" y="247" width="22.35" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="780" y="263" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">否</text><path d="M660,380 L660,412 L210,412 L210,450" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="406.475" y="391" width="47.05" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="430" y="407" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">不该接</text><path d="M720,380 L720,450" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="705.6" y="403" width="108.8" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="760" y="419" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">能办 / 办不了</text><path d="M1045,216 L1045,450" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1021.475" y="322" width="47.05" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="1045" y="338" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">已上云</text><rect x="30" y="596" width="1140" height="64" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="623" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">屏幕规则：全时态下不边说边上屏，云端判定有效后才显示整句（用户可能是在和车里的人说话）</text></g></svg>