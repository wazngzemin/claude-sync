" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">匹配的 Agent 配置</tspan></text></g></a><a href="#module/E/step/E03"><g data-step="E03"><rect x="435" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">E03</tspan></text><text x="455" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">准备该工具需要的上下文</tspan></text><text x="455" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">Agent Server</tspan></text><text x="455" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">工具请求与必要背景</tspan></text></g></a><a href="#module/E/step/E04"><g data-step="E04"><rect x="435" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="455" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">E04</tspan></text><text x="455" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">适配并调用真实执行方</tspan></text><text x="455" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">对应 Executor</tspan></text><text x="455" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">下游收到的请求</tspan></text></g></a><a href="#module/E/step/E05"><g data-step="E05"><rect x="500" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">E05</tspan></text><text x="520" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">返回过程数据、最终结果或错误</tspan></text><text x="520" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">下游 