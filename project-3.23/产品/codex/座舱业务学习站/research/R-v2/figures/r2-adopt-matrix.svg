<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="r2-adopt-matrix" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="r2-adopt-matrix-title r2-adopt-matrix-desc">
<title id="r2-adopt-matrix-title">端云仲裁：这一轮采用谁</title><desc id="r2-adopt-matrix-desc">先看固定说法是否命中，再按网络状态决定是否采用车上的 1.7B 模型结果。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="r2-adopt-matrix-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">端云仲裁：这一轮采用谁</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先看固定说法是否命中，再按网络状态决定是否采用车上的 1.7B 模型结果。</text>
<text class="v56-node-title" x="388" y="145" text-anchor="middle">固定说法命中</text>
<text class="v56-node-sub" x="388" y="174" text-anchor="middle">正则规则层</text>
<text class="v56-node-title" x="704" y="145" text-anchor="middle">车上的 1.7B 模型</text>
<text class="v56-node-sub" x="704" y="174" text-anchor="middle">给出车控候选</text>
<text class="v56-node-title" x="1020" y="145" text-anchor="middle">车上的 1.7B 模型</text>
<text class="v56-node-sub" x="1020" y="174" text-anchor="middle">给出 reject 或 unsupported</text>
<text class="v56-label" x="32" y="146" text-anchor="start">网络状态 ↓</text>
<text class="v56-label" x="240" y="112" text-anchor="start">本地结果 →</text>
<text class="v56-node-title" x="32" y="253" text-anchor="start">正常</text>
<g data-node="true">
<rect class="v56-local" x="240" y="208" width="296" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="254" y="235" text-anchor="start" data-fit="true">车上直接执行</text>
<text class="v56-node-sub" x="254" y="260" text-anchor="start" data-fit="true">固定说法命中可抢跑</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="556" y="208" width="296" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="570" y="235" text-anchor="start" data-fit="true">采用云端</text>
<text class="v56-node-sub" x="570" y="260" text-anchor="start" data-fit="true">车上的模型候选只作兜底</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="872" y="208" width="296" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="886" y="235" text-anchor="start" data-fit="true">采用云端</text>
<text class="v56-node-sub" x="886" y="260" text-anchor="start" data-fit="true">reject 不采用</text>
<text class="v56-node-sub" x="886" y="281" text-anchor="start" data-fit="true">unsupported 交给云端</text>
</g>
<text class="v56-node-title" x="32" y="423" text-anchor="start">超时</text>
<text class="v56-node-sub" x="32" y="452" text-anchor="start">正式请求发出后</text>
<text class="v56-node-sub" x="32" y="475" text-anchor="start">3 秒无结果</text>
<g data-node="true">
<rect class="v56-local" x="240" y="378" width="296" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="254" y="405" text-anchor="start" data-fit="true">车上直接执行</text>
<text class="v56-node-sub" x="254" y="430" text-anchor="start" data-fit="true">固定说法命中可抢跑</text>
</g>
<g data-node="true">
<rect class="v56-local" x="556" y="378" width="296" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="570" y="405" text-anchor="start" data-fit="true">车上兜底执行</text>
<text class="v56-node-sub" x="570" y="430" text-anchor="start" data-fit="true">采用车控函数和参数</text>
</g>
<g data-node="true">
<rect class="v56-decision" x="872" y="378" width="296" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="886" y="405" text-anchor="start" data-fit="true">车上兜底结论</text>
<text class="v56-node-sub" x="886" y="430" text-anchor="start" data-fit="true">明确 reject：拒识</text>
<text class="v56-node-sub" x="886" y="451" text-anchor="start" data-fit="true">unsupported：本地办不了</text>
</g>
<text class="v56-node-title" x="32" y="593" text-anchor="start">断网</text>
<text class="v56-node-sub" x="32" y="622" text-anchor="start">连续 2 秒无心跳</text>
<g data-node="true">
<rect class="v56-local" x="240" y="548" width="296" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="254" y="575" text-anchor="start" data-fit="true">车上直接执行</text>
<text class="v56-node-sub" x="254" y="600" text-anchor="start" data-fit="true">固定说法命中可抢跑</text>
</g>
<g data-node="true">
<rect class="v56-local" x="556" y="548" width="296" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="570" y="575" text-anchor="start" data-fit="true">车上兜底执行</text>
<text class="v56-node-sub" x="570" y="600" text-anchor="start" data-fit="true">采用车控函数和参数</text>
</g>
<g data-node="true">
<rect class="v56-decision" x="872" y="548" width="296" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="886" y="575" text-anchor="start" data-fit="true">车上兜底结论</text>
<text class="v56-node-sub" x="886" y="600" text-anchor="start" data-fit="true">明确 reject：拒识</text>
<text class="v56-node-sub" x="886" y="621" text-anchor="start" data-fit="true">unsupported：本地办不了</text>
</g>
<text class="v56-subtitle" x="32" y="751" text-anchor="start">车上已执行后，迟到的云端结果不再执行；3 秒超时与 2 秒无心跳分别判断。</text>
<rect class="v56-local" x="32" y="796" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="810" text-anchor="start">蓝：车上执行</text>
<rect class="v56-cloud" x="292" y="796" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="320" y="810" text-anchor="start">绿：采用云端</text>
<rect class="v56-decision" x="552" y="796" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="580" y="810" text-anchor="start">黄：采用车上结论，不能当成动作执行</text>
</svg>
