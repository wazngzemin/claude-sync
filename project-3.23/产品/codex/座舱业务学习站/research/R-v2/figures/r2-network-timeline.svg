<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="r2-network-timeline" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="r2-network-timeline-title r2-network-timeline-desc">
<title id="r2-network-timeline-title">断网后兜底，恢复后补历史</title><desc id="r2-network-timeline-desc">连续 2 秒无心跳触发断网；恢复后补传的是历史记录，不能作为新指令再执行。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="r2-network-timeline-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">断网后兜底，恢复后补历史</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">连续 2 秒无心跳触发断网；恢复后补传的是历史记录，不能作为新指令再执行。</text>
<text class="v56-label" x="32" y="133" text-anchor="start">时间向右；以隧道里说“打开空调”为例</text>
<g data-node="true">
<rect class="v56-cloud" x="32" y="210" width="166" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="237" text-anchor="start" data-fit="true">正常</text>
<text class="v56-node-sub" x="46" y="262" text-anchor="start" data-fit="true">云端为主</text>
<text class="v56-node-sub" x="46" y="283" text-anchor="start" data-fit="true">固定说法可抢跑</text>
</g>
<path class="v56-arrow" d="M 198 300 L 226 300" fill="none" marker-end="url(#r2-network-timeline-arr)"/>
<g data-node="true">
<rect class="v56-decision" x="226" y="210" width="166" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="240" y="237" text-anchor="start" data-fit="true">心跳中断</text>
<text class="v56-node-sub" x="240" y="262" text-anchor="start" data-fit="true">连续 2 秒</text>
<text class="v56-node-sub" x="240" y="283" text-anchor="start" data-fit="true">没有收到心跳</text>
</g>
<path class="v56-arrow" d="M 392 300 L 420 300" fill="none" marker-end="url(#r2-network-timeline-arr)"/>
<g data-node="true">
<rect class="v56-local" x="420" y="210" width="166" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="434" y="237" text-anchor="start" data-fit="true">判为断网</text>
<text class="v56-node-sub" x="434" y="262" text-anchor="start" data-fit="true">车上结果兜底</text>
<text class="v56-node-sub" x="434" y="283" text-anchor="start" data-fit="true">打开空调</text>
</g>
<path class="v56-arrow" d="M 586 300 L 614 300" fill="none" marker-end="url(#r2-network-timeline-arr)"/>
<g data-node="true">
<rect class="v56-neutral" x="614" y="210" width="166" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="628" y="237" text-anchor="start" data-fit="true">网络恢复</text>
<text class="v56-node-sub" x="628" y="262" text-anchor="start" data-fit="true">网络状态判断</text>
<text class="v56-node-sub" x="628" y="283" text-anchor="start" data-fit="true">触发补同步</text>
</g>
<path class="v56-arrow" d="M 780 300 L 808 300" fill="none" marker-end="url(#r2-network-timeline-arr)"/>
<g data-node="true">
<rect class="v56-neutral" x="808" y="210" width="166" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="822" y="237" text-anchor="start" data-fit="true">补同步</text>
<text class="v56-node-sub" x="822" y="262" text-anchor="start" data-fit="true">按发生时间补传</text>
<text class="v56-node-sub" x="822" y="283" text-anchor="start" data-fit="true">标为历史</text>
<text class="v56-node-sub" x="822" y="304" text-anchor="start" data-fit="true">不重新执行</text>
</g>
<path class="v56-arrow" d="M 974 300 L 1002 300" fill="none" marker-end="url(#r2-network-timeline-arr)"/>
<g data-node="true">
<rect class="v56-cloud" x="1002" y="210" width="166" height="180" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="1016" y="237" text-anchor="start" data-fit="true">云端为主</text>
<text class="v56-node-sub" x="1016" y="262" text-anchor="start" data-fit="true">后续新请求</text>
<text class="v56-node-sub" x="1016" y="283" text-anchor="start" data-fit="true">恢复正常采信</text>
</g>
<text class="v56-node-sub" x="32" y="462" text-anchor="start">另一条独立条件：正式请求发出后 3 秒无结果 → 判为超时，改用车上结果。</text>
<text class="v56-subtitle" x="32" y="495" text-anchor="start">3 秒超时与 2 秒无心跳分别触发，不能把两段时间相加。</text>
<rect class="v56-cloud" x="32" y="564" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="578" text-anchor="start">绿：云端为主</text>
<rect class="v56-decision" x="292" y="564" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="320" y="578" text-anchor="start">黄：断网条件</text>
<rect class="v56-local" x="552" y="564" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="580" y="578" text-anchor="start">蓝：车上兜底</text>
<rect class="v56-neutral" x="812" y="564" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="840" y="578" text-anchor="start">灰：恢复与补同步</text>
</svg>
