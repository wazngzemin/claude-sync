<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640" role="img" aria-label="三种网络情况下，用谁的结果：一条时间线看采信"><title>三种网络情况下，用谁的结果：一条时间线看采信</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1300" height="640" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">三种网络情况下，用谁的结果：一条时间线看采信</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">赛力斯 9 月 30 日后的规则；横轴从判停结束算起（3 秒的确切起点待确认）</text><line x1="260" y1="100" x2="260" y2="560" stroke="#edf2f6" stroke-width="1"/><text x="260" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">0 秒</text><line x1="490" y1="100" x2="490" y2="560" stroke="#edf2f6" stroke-width="1"/><text x="490" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">1 秒</text><line x1="720" y1="100" x2="720" y2="560" stroke="#edf2f6" stroke-width="1"/><text x="720" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">2 秒</text><line x1="950" y1="100" x2="950" y2="560" stroke="#edf2f6" stroke-width="1"/><text x="950" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">3 秒</text><line x1="1180" y1="100" x2="1180" y2="560" stroke="#edf2f6" stroke-width="1"/><text x="1180" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">4 秒</text><line x1="950" y1="104" x2="950" y2="560" stroke="#c45c5c" stroke-width="2.5"/><text x="956" y="118" font-size="13" fill="#c45c5c" font-weight="650" text-anchor="start">3 秒：云端超时</text><text x="30" y="176" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">网络正常</text><line x1="240" y1="220" x2="1280" y2="220" stroke="#e3eaf0" stroke-width="1"/><text x="30" y="326" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">云端超时</text><line x1="240" y1="370" x2="1280" y2="370" stroke="#e3eaf0" stroke-width="1"/><text x="30" y="476" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">断网</text><line x1="240" y1="520" x2="1280" y2="520" stroke="#e3eaf0" stroke-width="1"/><rect x="294.5" y="150" width="190" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="308.5" y="177" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">车上：能办（先放着）</text><rect x="559.0" y="150" width="210" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="573.0" y="177" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">云端结果回来 · 采用</text><text x="294.5" y="222" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用云端的结果，车上模型的结果作废；只有固定说法命中时可以抢在云端前面执行</text><rect x="294.5" y="300" width="190" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="308.5" y="327" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">车上：能办（先放着）</text><path d="M484.5,323 L946,323" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="624.075" y="302" width="145.85" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="697.0" y="318" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">等满 3 秒，采用车上</text><rect x="1019.0" y="300" width="190" height="46" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1033.0" y="327" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">云端结果晚到</text><text x="294.5" y="372" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">到 3 秒采用车上的结果；云端结果晚到只记录、不再执行，避免同一个动作做两遍</text><rect x="294.5" y="450" width="190" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="308.5" y="477" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">车上：能办 · 采用</text><text x="559.0" y="478" font-size="14" fill="#8394a3" font-weight="400" text-anchor="start">网络不通，云端没有结果</text><text x="294.5" y="522" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上判“能办”或“不该接”：直接采用；判“办不了”：播“网络异常，请稍后再试”</text><text x="294.5" y="544" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同一次唤醒里，同类网络异常提示只播一次</text><rect x="30" y="580" width="1250" height="46" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="607" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start">上汽不同：按 2025 年 9 月离在线仲裁 PRD，车上结果命中“离线白名单”就立刻执行，2 秒无心跳车上兜底（线上现行待确认）</text></g></svg>