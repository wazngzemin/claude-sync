l="#326785"/><text x="887" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="887" dy="0">R04</tspan></text><text x="887" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="887" dy="0">白名单命中时优先采用本地结果</tspan></text><text x="887" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="887" dy="0">端侧仲裁</tspan></text><text x="887" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="887" dy="0">本地执行权，或继续等待云端</tspan></text></g></a><a href="#module/R/step/R05"><g data-step="R05"><rect x="472" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="472" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="492" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="492" dy="0">R05</tspan></text><text x="492" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="492" dy="0">非白名单优先等待云端</tspan></text><text x="492" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="492" dy="0">端云协调</tspan></text><text x="492" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="492" dy="0">采纳云端，或触发本地兜底</tspan></text></g></a><a href="#module/R/step/R06"><g data-step="R06"><rect x="1092" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1092" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="1112" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1112" dy="0">R06</tspan></text><text x="1112" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="1112" dy="0">采用可用离线结果或说明能力限制</tspan></text><text x="1112" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="1112" dy="0">端侧兜底</tspan></text><text x="1112" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="1112" dy="0">离线执行结果或无法完成说明</tspan></text></g></a><a href="#module/R/step/R07"><g data-step="R07"><rect x="632" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="632" y=