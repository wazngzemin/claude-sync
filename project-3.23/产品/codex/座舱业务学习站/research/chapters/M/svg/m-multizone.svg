<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-label="多人同时说：现在靠“合并缓存”，新方案收进输入管理"><title>多人同时说：现在靠“合并缓存”，新方案收进输入管理</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="680" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">多人同时说：现在靠“合并缓存”，新方案收进输入管理</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左边是线上做法（技术方案“当前多音区逻辑”），右边是开发中的新链路</text><rect x="20" y="92" width="590" height="470" rx="10" fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="34" y="116" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">现在（线上；多人合并 1/13 发版合入）</text><rect x="630" y="92" width="590" height="470" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="644" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">新方案（开发中，计划 11 月底验收）</text><rect x="40" y="130" width="550" height="72" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="54" y="157" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">第一句到达：建一个合并缓存</text><text x="54" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按车 + 对话建，1 分钟后自动失效（兜底）</text><path d="M315,202 L315,220" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="220" width="550" height="72" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="54" y="247" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">后面的话追加进缓存</text><text x="54" y="272" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只留最近 4 条；主动建议只有一个位置，后到覆盖先到</text><path d="M315,292 L315,310" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="310" width="550" height="94" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="54" y="337" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">正在推理的 DT 每 100 毫秒看一眼</text><text x="54" y="362" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 第一个输出之前：新话、新建议都能打断</text><text x="54" y="383" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 第一个输出之后：只有新话能打断</text><path d="M315,404 L315,422" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="422" width="550" height="94" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="54" y="449" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">问题</text><text x="54" y="474" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“第一个输出”不一定是用户看到的字，可能是工具调用</text><text x="54" y="495" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“一组”由 DT 输出时机决定，不是按说话时间</text><rect x="650" y="130" width="550" height="72" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="664" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">每个座位的话先成为一条独立输入</text><text x="664" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用原请求编号去重，保留座位、说话人、原话</text><path d="M925,202 L925,220" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="650" y="220" width="550" height="94" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="664" y="247" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">输入管理决定这一轮处理哪些</text><text x="664" y="272" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">空闲：直接处理</text><text x="664" y="293" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">处理中且工具没发、还没播：打断并一起重推</text><path d="M925,314 L925,332" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="650" y="332" width="550" height="94" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="664" y="359" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">多音区模块只负责“组装”</text><text x="664" y="384" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不再读缓存、不再判断打断</text><text x="664" y="405" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按原格式拼成数组，保留座位</text><path d="M925,426 L925,444" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="650" y="444" width="550" height="94" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="664" y="471" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">边界</text><text x="664" y="496" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">条数上限只能在组装时用，不能删掉已收下的输入</text><text x="664" y="517" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">新旧做法按车灰度互斥，同一辆车只用一套</text><rect x="20" y="584" width="1200" height="74" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="34" y="611" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">产品层规则不变（多人同时语音 PRD）</text><text x="34" y="636" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只合并“不是闲聊”的话；直接交 DT，不走简单复杂分流；座位只标来源，不默认谁优先；两人要求冲突时先问清楚</text></g></svg>