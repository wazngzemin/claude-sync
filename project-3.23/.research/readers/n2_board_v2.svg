<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Noto Sans SC">
  <rect width="1200" height="800" fill="#fafbfd"/>

  <text x="30" y="35" font-size="20" font-weight="700" fill="#1a1a1a">N2｜Always On 与 Watcher：全时观察和情境描述</text>
  <text x="30" y="55" font-size="12" fill="#5f6368">端侧多模持续监听；分出情境→记忆、事件→触发器、连续对话→R13</text>

  <!-- 端侧框 -->
  <rect x="20" y="80" width="560" height="540" rx="8" fill="#e8f0fe" stroke="#4285F4" stroke-width="2"/>
  <text x="35" y="102" font-size="13" font-weight="700" fill="#1a56c9">端侧（Always On）</text>

  <!-- N2-01 -->
  <rect x="40" y="120" width="150" height="70" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="50" y="140" font-size="11" font-weight="700" fill="#1a1a1a">N2-01 端侧输入</text>
  <text x="50" y="156" font-size="10" fill="#3c4043">4音区音频+摄像头+车端信号</text>
  <text x="50" y="172" font-size="10" fill="#3c4043">① 不依赖用户发起</text>

  <!-- N2-02 Watcher -->
  <rect x="220" y="120" width="180" height="80" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="230" y="140" font-size="11" font-weight="700" fill="#1a1a1a">N2-02 Watcher 端侧多模</text>
  <text x="230" y="156" font-size="10" fill="#3c4043">要点：永远不睡觉的观察者</text>
  <text x="230" y="172" font-size="10" fill="#3c4043">① 发现值得叫醒一次的事件</text>
  <text x="230" y="186" font-size="10" fill="#b3261e">② 不是 G 图本身</text>

  <!-- N2-03 四态 -->
  <rect x="430" y="120" width="130" height="80" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="440" y="140" font-size="11" font-weight="700" fill="#7f1d1d">N2-03 四态</text>
  <text x="440" y="156" font-size="10" fill="#3c4043">Reject/Interrupt</text>
  <text x="440" y="172" font-size="10" fill="#3c4043">Response/Listen</text>

  <!-- N2-12 音区开关 -->
  <rect x="40" y="220" width="170" height="70" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="50" y="240" font-size="11" font-weight="700" fill="#1a1a1a">N2-12 音区开关</text>
  <text x="50" y="256" font-size="10" fill="#3c4043">座椅传感器+Face ID 判有人</text>
  <text x="50" y="272" font-size="10" fill="#3c4043">① 无人不开该音区</text>

  <!-- N2-13 强召回 -->
  <rect x="230" y="220" width="160" height="70" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="240" y="240" font-size="11" font-weight="700" fill="#1a1a1a">N2-13 强召回</text>
  <text x="240" y="256" font-size="10" fill="#3c4043">唤醒词"豆包"及泛化说法</text>
  <text x="240" y="272" font-size="10" fill="#3c4043">① 强制判人机对话</text>

  <!-- N2-14 强拒识 -->
  <rect x="410" y="220" width="150" height="70" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="420" y="240" font-size="11" font-weight="700" fill="#7f1d1d">N2-14 强拒识</text>
  <text x="420" y="256" font-size="10" fill="#3c4043">识别手持手机打电话</text>
  <text x="420" y="272" font-size="10" fill="#b3261e">① 该音区不响应不上云</text>

  <!-- N2-15 话题继承 -->
  <rect x="40" y="320" width="170" height="70" rx="6" fill="#e6f4ea" stroke="#34A853" stroke-width="1.5"/>
  <text x="50" y="340" font-size="11" font-weight="700" fill="#1e7e34">N2-15 话题继承</text>
  <text x="50" y="356" font-size="10" fill="#3c4043">每 5 轮总结话题（8 类）</text>
  <text x="50" y="372" font-size="10" fill="#3c4043">① 召回时带上文</text>

  <!-- N2-16 连续对话 -->
  <rect x="230" y="320" width="160" height="70" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="240" y="340" font-size="11" font-weight="700" fill="#1a1a1a">N2-16 连续对话 30s</text>
  <text x="240" y="356" font-size="10" fill="#3c4043">上屏 ASR 最终文本</text>
  <text x="240" y="372" font-size="10" fill="#3c4043">① 30s 无指令退全时态</text>

  <!-- N2-17 高风险 -->
  <rect x="410" y="320" width="150" height="70" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="420" y="340" font-size="11" font-weight="700" fill="#7f1d1d">N2-17 高风险二次确认</text>
  <text x="420" y="356" font-size="10" fill="#3c4043">关 ESP/解儿童锁/支付</text>

  <!-- N2-04 情境描述 -->
  <rect x="40" y="420" width="170" height="70" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="50" y="440" font-size="11" font-weight="700" fill="#1a1a1a">N2-04 情境描述（流式）</text>
  <text x="50" y="456" font-size="10" fill="#3c4043">小区车库/两人靠近/抱纸箱</text>

  <!-- N2-05 事件发现 -->
  <rect x="230" y="420" width="160" height="70" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="240" y="440" font-size="11" font-weight="700" fill="#1a1a1a">N2-05 事件发现</text>
  <text x="240" y="456" font-size="10" fill="#3c4043">云端 Agent 用自然语言注册</text>

  <!-- N2-19 视觉持续任务 -->
  <rect x="40" y="520" width="240" height="70" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="50" y="540" font-size="11" font-weight="700" fill="#1a1a1a">N2-19 视觉持续任务</text>
  <text x="50" y="556" font-size="10" fill="#3c4043">逐图预测 [SILENT]/[SPEAK]</text>
  <text x="50" y="572" font-size="10" fill="#3c4043">① 主驾入睡→降媒体音量</text>

  <!-- N2-20 司机Agent（长期） -->
  <rect x="300" y="520" width="240" height="70" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="3,2" stroke-width="1.5"/>
  <text x="310" y="540" font-size="11" font-weight="700" fill="#3c4043">N2-20 司机 Agent 视觉（长期）</text>
  <text x="310" y="556" font-size="10" fill="#5f6368">舱驾融合：临停/泊车/智驾风格</text>

  <!-- 云端框 -->
  <rect x="610" y="80" width="570" height="540" rx="8" fill="#e6f4ea" stroke="#34A853" stroke-width="2"/>
  <text x="625" y="102" font-size="13" font-weight="700" fill="#1e7e34">云端加工与分发</text>

  <!-- N2-07 短期记忆 -->
  <rect x="630" y="130" width="200" height="80" rx="6" fill="#fff" stroke="#34A853" stroke-width="1.5"/>
  <text x="640" y="150" font-size="11" font-weight="700" fill="#1e7e34">N2-07 短期记忆</text>
  <text x="640" y="166" font-size="10" fill="#3c4043">带 timestamp</text>
  <text x="640" y="182" font-size="10" fill="#3c4043">① ≈v15 A06 供 C4</text>
  <text x="640" y="198" font-size="10" fill="#3c4043">② B06 供 C1</text>

  <!-- N2-18 任务分类 -->
  <rect x="860" y="130" width="200" height="80" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="870" y="150" font-size="11" font-weight="700" fill="#1a1a1a">N2-18 任务四分类</text>
  <text x="870" y="166" font-size="10" fill="#3c4043">单步/条件/多步/持续</text>

  <!-- N2-08 G01 -->
  <rect x="630" y="240" width="200" height="70" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="640" y="260" font-size="11" font-weight="700" fill="#1a1a1a">N2-08 G01 触发器登记</text>
  <text x="640" y="276" font-size="10" fill="#3c4043">一期全部工程触发</text>

  <!-- N2-09 G链路 -->
  <rect x="860" y="240" width="280" height="90" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="870" y="260" font-size="11" font-weight="700" fill="#1a1a1a">N2-09 G 链路</text>
  <text x="870" y="276" font-size="10" fill="#3c4043">G03 叫醒 → G05 条件 → G06 频控</text>
  <text x="870" y="292" font-size="10" fill="#3c4043">→ G08 分发</text>
  <text x="870" y="310" font-size="10" fill="#3c4043">① Watcher 只叫醒一次</text>

  <!-- N2-10 静态Advisor -->
  <rect x="630" y="360" width="220" height="80" rx="6" fill="#fff" stroke="#34A853" stroke-width="1.5"/>
  <text x="640" y="380" font-size="11" font-weight="700" fill="#1e7e34">N2-10 S01 静态 Advisor</text>
  <text x="640" y="396" font-size="10" fill="#3c4043">舒适/出行/情感/内容</text>
  <text x="640" y="412" font-size="10" fill="#3c4043">① 后排哭了→情感递纸巾</text>

  <!-- N2-11 进主链 -->
  <rect x="880" y="360" width="240" height="80" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="890" y="380" font-size="11" font-weight="700" fill="#1a1a1a">N2-11 进主链</text>
  <text x="890" y="396" font-size="10" fill="#3c4043">R13 免唤醒判断</text>
  <text x="890" y="412" font-size="10" fill="#3c4043">① V12 正式 query 进主链</text>

  <!-- 连线 -->
  <line x1="190" y1="155" x2="220" y2="155" stroke="#4285F4" stroke-width="2"/>
  <line x1="400" y1="155" x2="430" y2="155" stroke="#4285F4" stroke-width="2"/>
  <line x1="125" y1="195" x2="125" y2="220" stroke="#4285F4" stroke-width="2"/>
  <line x1="125" y1="290" x2="125" y2="320" stroke="#4285F4" stroke-width="2"/>
  <line x1="125" y1="390" x2="125" y2="420" stroke="#4285F4" stroke-width="2"/>
  <line x1="125" y1="490" x2="730" y2="170" stroke="#34A853" stroke-width="2"/>
  <line x1="310" y1="490" x2="960" y2="170" stroke="#f9ab00" stroke-width="2"/>
  <line x1="960" y1="210" x2="960" y2="240" stroke="#f9ab00" stroke-width="2"/>
  <line x1="960" y1="330" x2="740" y2="360" stroke="#f9ab00" stroke-width="2"/>
  <line x1="55" y1="555" x2="740" y2="275" stroke="#f9ab00" stroke-width="2"/>
  <line x1="310" y1="390" x2="1000" y2="360" stroke="#4285F4" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- 图例 -->
  <rect x="20" y="650" width="1160" height="130" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1"/>
  <text x="35" y="672" font-size="12" font-weight="700" fill="#1a1a1a">图例</text>
  <rect x="35" y="685" width="18" height="12" fill="#fff" stroke="#4285F4"/>
  <text x="60" y="695" font-size="10" fill="#3c4043">蓝=端侧主路</text>
  <rect x="150" y="685" width="18" height="12" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="175" y="695" font-size="10" fill="#3c4043">金=任务/触发器</text>
  <rect x="280" y="685" width="18" height="12" fill="#fce8e6" stroke="#d93025"/>
  <text x="305" y="695" font-size="10" fill="#3c4043">红=拒识/高风险</text>
  <rect x="400" y="685" width="18" height="12" fill="#e6f4ea" stroke="#34A853"/>
  <text x="425" y="695" font-size="10" fill="#3c4043">绿=云端分发/记忆</text>
  <rect x="540" y="685" width="18" height="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="2,1"/>
  <text x="565" y="695" font-size="10" fill="#3c4043">灰虚线=长期愿景</text>
  <text x="35" y="725" font-size="10" font-weight="700" fill="#1a1a1a">易错点：</text>
  <text x="90" y="725" font-size="10" fill="#3c4043">① N2-02 不是 G 图，Watcher 只"叫醒一次"；</text>
  <text x="90" y="743" font-size="10" fill="#3c4043">② N2-14 强拒识≠N2-03 Reject，是"该音区整体闭嘴"，连文字都不上云；</text>
  <text x="90" y="761" font-size="10" fill="#3c4043">③ N2-20 司机 Agent 是长期愿景，2.6 不做。</text>
</svg>
