<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="t2-cancel" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="t2-cancel-title t2-cancel-desc">
<title id="t2-cancel-title">说“算了不用提醒了”，要一起停哪几样</title><desc id="t2-cancel-desc">先定位去接小宝的原任务；取消要同时处理保存的状态、等待条件、正在执行的部分和车端显示。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="t2-cancel-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">说“算了不用提醒了”，要一起停哪几样</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先定位去接小宝的原任务；取消要同时处理保存的状态、等待条件、正在执行的部分和车端显示。</text>
<g data-node="true" id="t2-cancel-cancel"><rect class="v56-decision" x="420" y="370" width="360" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="434" y="398" text-anchor="start">取消：先定位原任务</text>
<text class="v56-node-sub" x="434" y="426" text-anchor="start">“算了不用提醒了”</text>
<text class="v56-node-sub" x="434" y="450" text-anchor="start">定位不到就澄清</text>
</g>
<g data-node="true" id="t2-cancel-state"><rect class="v56-cloud" x="420" y="140" width="360" height="122" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="434" y="168" text-anchor="start">任务状态 → 已关闭（取消）</text>
<text class="v56-node-sub" x="434" y="196" text-anchor="start">保存取消结果</text>
<text class="v56-node-sub" x="434" y="220" text-anchor="start">迟到触发不能重新激活</text>
</g>
<g data-node="true" id="t2-cancel-rule"><rect class="v56-cloud" x="32" y="330" width="300" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="358" text-anchor="start">撤掉等待规则</text>
<text class="v56-node-sub" x="46" y="386" text-anchor="start">从触发器撤掉该任务的规则</text>
<text class="v56-node-sub" x="46" y="410" text-anchor="start">停止后续条件触发</text>
</g>
<g data-node="true" id="t2-cancel-run"><rect class="v56-cloud" x="32" y="560" width="300" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="588" text-anchor="start">结束在途的运行</text>
<text class="v56-node-sub" x="46" y="616" text-anchor="start">关闭当前运行</text>
<text class="v56-node-sub" x="46" y="640" text-anchor="start">结果仍按运行身份归属</text>
</g>
<g data-node="true" id="t2-cancel-vision"><rect class="v56-cloud" x="868" y="330" width="300" height="144" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="882" y="358" text-anchor="start">视觉任务：重发观察列表</text>
<text class="v56-node-sub" x="882" y="386" text-anchor="start">新列表不再包含它</text>
<text class="v56-node-sub" x="882" y="410" text-anchor="start">全量覆盖旧列表</text>
<text class="v56-node-sub" x="882" y="434" text-anchor="start">全部取消就发空列表</text>
</g>
<g data-node="true" id="t2-cancel-message"><rect class="v56-local" x="868" y="584" width="300" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="882" y="612" text-anchor="start">推状态消息到车端</text>
<text class="v56-node-sub" x="882" y="640" text-anchor="start">通知车端更新</text>
<text class="v56-node-sub" x="882" y="664" text-anchor="start">上电时补查有效任务列表</text>
</g>
<path class="v56-arrow" d="M 600 370 L 600 262" marker-end="url(#t2-cancel-arr)"/>
<path class="v56-arrow" d="M 420 406 L 332 406" marker-end="url(#t2-cancel-arr)"/>
<path class="v56-arrow" d="M 420 466 L 380 466 L 380 620 L 332 620" marker-end="url(#t2-cancel-arr)"/>
<path class="v56-arrow" d="M 780 406 L 868 406" marker-end="url(#t2-cancel-arr)"/>
<path class="v56-arrow" d="M 780 466 L 820 466 L 820 644 L 868 644" marker-end="url(#t2-cancel-arr)"/>
<text class="v56-risk" x="32" y="770" text-anchor="start">普通取消目前还没覆盖直接创建的多步界面操作任务。</text>
<path class="v56-rule" d="M 32 846 L 1168 846"/>
<text class="v56-node-title" x="32" y="882" text-anchor="start">少停一样，就可能到点又提醒，或者界面上还挂着。</text>
<rect data-decoration="true" class="v56-cloud" x="32.0" y="910" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="924" text-anchor="start">绿：关闭状态与停止后续执行</text>
<rect data-decoration="true" class="v56-local" x="316.0" y="910" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="924" text-anchor="start">蓝：车端状态同步</text>
<rect data-decoration="true" class="v56-decision" x="600.0" y="910" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="924" text-anchor="start">黄：找到要取消的原任务</text>
<rect data-decoration="true" class="v56-reject" x="884.0" y="910" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="924" text-anchor="start">红字：取消能力边界</text>
</svg>
