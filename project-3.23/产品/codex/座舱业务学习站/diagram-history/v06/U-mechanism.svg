  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">任务中心、任务岛与卡片：先看主机制</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,188 350,254" marker-end="url(#arrow-U-mechanism)"><title>U-stage-1 → U-stage-2：条件具备</title></polyline><polyline class="arr" fill="none" points="350,346 350,412" marker-end="url(#arrow-U-mechanism)"><title>U-stage-2 → U-stage-3：信息就绪</title></polyline><polyline class="arr" fill="none" points="350,504 350,570" marker-end="url(#arrow-U-mechanism)"><title>U-stage-3 → U-stage-4：按规则处理</title></polyline><polyline class="arr" fill="none" points="350,662 350,728" marker-end="url(#arrow-U-mechanism)"><title>U-stage-4 → U-stage-5：按事实交回</title></polyline><text class="ts" x="365" y="224" text-anchor="start" dominant-baseline="central">E1 · 条件具备</text><text class="ts" x="365" y="382" text-anchor="start" dominant-baseline="central">E2 · 信息就绪</text><text class="ts" x="365" y="540" text-anchor="start" dominant-baseline="central">E3 · 按规则处理</text><text class="ts" x="365" y="698" text-anchor="start" dominant-baseline="central">E4 · 按事实交回</text><g class="c-teal" role="link" tabindex="0" data-page="U" data-flow="U-mechanism" data-step="U-stage-1" aria-label="读取真实任务视图"><title>用正确版本映射 UI 状态</title><rect x="180" y="106" width="340" height="78" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">读取真实任务视图</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">用正确版本映射 UI 状态</text></g><g class="c-teal" role="link" tabindex="0" data-page="U" data-flow="U-mechanism" data-step="U-stage-2" aria-label="按类型选择展示"><title>即时卡、任务岛与服务卡不同</title><rect x="180" y="264" width="340" height="78" rx="6"/><text class="th" x="198" y="288" text-anchor="start" dominant-baseline="central">按类型选择展示</text><text class="ts" x="198" y="316" text-anchor="start" dominant-baseline="central">即时卡、任务岛与服务卡不同</text></g><g class="c-teal" role="link" tabindex="0" data-page="U" data-flow="U-mechanism" data-step="U-stage-3" aria-label="仲裁后实际曝光"><title>发送与显示分开</title><rect x="180" y="422" width="340" height="78" rx="6"/><text class="th" x="198" y="446" text-anchor="start" dominant-baseline="central">仲裁后实际曝光</text><text class="ts" x="198" y="474" text-anchor="start" dominant-baseline="central">发送与显示分开</text></g><g class="c-teal" role="link" tabindex="0" data-page="U" data-flow="U-mechanism" data-step="U-stage-4" aria-label="接用户选择"><title>确认、拒绝、无操作有各自后果</title><rect x="180" y="580" width="340" height="78" rx="6"/><text class="th" x="198" y="604" text-anchor="start" dominant-baseline="central">接用户选择</text><text class="ts" x="198" y="632" text-anchor="start" dominant-baseline="central">确认、拒绝、无操作有各自后果</text></g><g class="c-teal" role="link" tabindex="0" data-page="U" data-flow="U-mechanism" data-step="U-stage-5" aria-label="回写并恢复一致性"><title>执行、取消、开机补齐与漏推送恢复</title><rect x="180" y="738" width="340" height="78" rx="6"/><text class="th" x="198" y="762" text-anchor="start" dominant-baseline="central">回写并恢复一致性</text><text class="ts" x="198" y="790" text-anchor="start" dominant-baseline="central">执行、取消、开机补齐与漏推送恢复</text></g><text class="th" x="40" y="900" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="930" text-anchor="start" dominant-baseline="central">E1 读取真实任务视图 → 按类型选择展示：条件具备</text><text class="ts" x="40" y="963" text-anchor="start" dominant-baseline="central">E2 按类型选择展示 → 仲裁后实际曝光：信息就绪</text><text class="ts" x="40" y="996" text-anchor="start" dominant-baseline="central">E3 仲裁后实际曝光 → 接用户选择：按规则处理</text><text class="ts" x="40" y="1029" text-anchor="start" dominant-baseline="central">E4 接用户选择 → 回写并恢复一致性：按事实交回</text></svg>