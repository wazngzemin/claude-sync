width="1.5"/><text x="1050" y="210" font-size="26" font-weight="600" fill="#0D4FA8">校验与发布</text><text x="1050" y="245" font-size="22" font-weight="400" fill="#0D4FA8">节点、依赖、输入合法</text><text x="1050" y="277" font-size="22" font-weight="400" fill="#0D4FA8">检查渠道与能力适用</text><rect x="1350" y="175" width="280" height="139" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="1370" y="210" font-size="26" font-weight="600" fill="#0D4FA8">生效的场景定义</text><text x="1370" y="245" font-size="22" font-weight="400" fill="#0D4FA8">场景 ID 与 Workflow ID</text><text x="1370" y="277" font-size="22" font-weight="400" fill="#0D4FA8">动作、策略与适用范围</text><rect x="70" y="490" width="360" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="525" font-size="26" font-weight="600" fill="#0D4FA8">任务中心</text><text x="90" y="560" font-size="22" font-weight="400" fill="#0D4FA8">查询本车任务与真实开关</text><text x="90" y="592" font-size="22" font-weight="400" fill="#0D4FA8">用户选择开启或关闭</text><rect x="510" y="490" width="620" height="139" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="530" y="525" font-size="26" font-weight="600" fill="#0D4FA8">云端单车场景状态：Trigger 保存</text><text x="530" y="560" font-size="22" font-weight="400" fill="#0D4FA8">trigger_scene_effective_scope_vin</text><text x="530" y="592" font-size="22" font-weight="400" fill="#0D4FA8">按车辆与场景读取；无记录沿现有 ON 规则</text><rect x="1210" y="490" width="420" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1230" y="525" font-size="26" font-weight="600" fill="#0D4FA8">AI 设置与能力开关</text><text x="1230" y="560" font-size="22" font-weight="400" fill="#0D4FA8">独立提供总体与能力许可</text><text x="1230" y="592" font-size="22" font-weight="400" fill="#0D4FA8">按具体任务依赖读取</text><rect x="70" y="790" width="300" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="825" font-size="26" font-weight="600" fill="#0D4FA8">实际输入</text><text x="90" y="860" font-size="22" font-weight="400" fill="#0D4FA8">端状态与 Context</text><text x="90" y="892" font-size="22" font-weight="400" fill="#0D4FA8">VLM、任务及能力开关</text><rect x="420" y="790" width="320" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="440" y="825" font-size="26" font-weight="600" fill="#0D4FA8">Trigger 入口</text><text x="440" y="860" font-size="22" font-weight="400" fill="#0D4FA8">按信号更新找候选场景</text><text x="440" y="892" font-size="22" font-weight="400" fill="#0D4FA8">采用范围与本车状态</text><rect x="790" y="790" width="410" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="810" y="825" font-size="26" font-weight="600" fill="#0D4FA8">按 workflow_id 唯一分流</text><text x="810" y="860" font-size="22" font-weight="400" fill="#0D4FA8">空：现有简单链路</text><text x="810" y="892" font-size="22" font-weight="400" fill="#0D4FA8">非空：Workflow 判断</text><text x="810" y="924" font-size="22" font-weight="400" fill="#0D4FA8">新路不重复执行旧判断</text><rect x="1280" y="790" width="350" height="171" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="1300" y="825" font-size="26" font-weight="600" fill="#0D4FA8">既有动作分发</text><text x="1300" y="860" font-size="22" font-weight="400" fill="#0D4FA8">仅判断满足才进入</text><text x="1300" y="892" font-size="22" font-weight="400" fill="#0D4FA8">策略 → 场景锁 → Action</text><text x="1300" y="924" font-size="22" font-weight="400" fill="#0D4FA8">Advisor/Recommend/Callback</text><rect x="70" y="1170" width="440" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="90" y="1205" font-size="26" font-weight="600" fill="#0D4FA8">主动推荐 → DT</text><text x="90" y="1240" font-size="22" font-weight="400" fill="#0D4FA8">儿童锁、后视镜无需设备识别</text><text x="90" y="1272" font-size="22" font-weight="400" fill="#0D4FA8">充电口盖需先识别充电设备</text><rect x="630" y="1170" width="380" height="139" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="650" y="1205" font-size="26" font-weight="600" fill="#0D4FA8">充电专属：DT 调 VQA</text><text x="650" y="1240" font-size="22" font-weight="400" fill="#0D4FA8">未发现或未知：不问开盖</text><text x="650" y="1272" font-size="22" font-weight="400" fill="#0D4FA8">明确发现设备：再交询问</text><rect x="1130" y="1170" width="500" height="171" rx="12" fill="#FFFFFF" stroke="#185DB7" stroke-width="1.5"/><text x="1150" y="1205" font-size="26" font-weight="600" fill="#0D4FA8">接入业务与主动服务卡</text><text x="1150" y="1240" font-size="22" font-weight="400" fill="#0D4FA8">按现有协议注册、下发卡片</text><text x="1150" y="1272" font-size="22" font-weight="400" fill="#0D4FA8">处理确认/取消与车辆动作</text><text x="1150" y="1304" font-size="22" font-weight="400" fill="#0D4FA8">Planner 不直接注册或拉起卡片</text><rect x="70" y="1480" width="730" height="139" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="90" y="1515" font-size="26" font-weight="600" fill="#0D4FA8">Workflow Run / NodeRun</text><text x="90" y="1550" font-size="22" font-weight="400" fill="#0D4FA8">每次运行与各节点：输入快照、阶段、结果、原因</text><text x="90" y="1582" font-size="22" font-weight="400" fill="#0D4FA8">PASS、REJECT、UNKNOWN 都有判断记录</text><rect x="860" y="1480" width="770" height="139" rx="12" fill="#EAF3FF" stroke="#185DB7" stroke-width="2.3"/><text x="880" y="1515" font-size="26" font-weight="600" fill="#0D4FA8">History 与下游 Action 汇总</text><text x="880" y="1550" font-size="22" font-weight="400" fill="#0D4FA8">策略允许后预创建；全部 Action 结束后统一更新</text><text x="880" y="1582" font-size="22" font-weight="400" fill="#0D4FA8">查看 Run 时关联；卡片和车控结果由下游联合验收</text><text x="55" y="60" font-size="36" font-weight="600" fill="#0D4FA8">触发器后台：配置、判断、下游与记录的完整关系</text><text x="65" y="136" font-size="28" font-weight="600" fill="#0D4FA8">一、配置态｜配置人员把业务需求变成可发布的场景</text><text x="65" y="456" font-size="28" font-weight="600" fill="#0D4FA8">二、用户状态｜每车任务选择与 AI 设置不是同一层级</text><text x="430" y="545.5" font-size="21" font-weight="400" fill="#0D4FA8">设置</text><text x="385" y="645" font-size="21" font-weight="400" fill="#0D4FA8">真实状态及操作结果</text><text x="65" y="751" font-size="28" font-weight="600" fill="#0D4FA8">三、运行态｜更新启动检查，全部判断通过后才交下游</text><text x="1200" y="861.5" font-size="21" font-weight="400" fill="#0D4FA8">PASS</text><text x="840" y="700" font-size="21" font-weight="400" fill="#0D4FA8">本车真实状态</text><text x="1050" y="689" font-size="21" font-weight="400" fill="#0D4FA8">能力许可</text><text x="1390" y="747" font-size="21" font-weight="400" fill="#0D4FA8">读取发布定义</text><text x="80" y="1028" font-size="23" font-weight="600" fill="#0D4FA8">条件节点读真实数据；推理节点理解已有 VLM 内容。Trigger 不调用 DT / VQA 工具。</text><text x="65" y="1136" font-size="28" font-weight="600" fill="#0D4FA8">四、下游业务｜三项云端任务沿主动推荐与 DT 处理询问和执行</text><text x="640" y="1073" font-size="21" font-weight="400" fill="#0D4FA8">按动作配置提交</text><text x="530" y="1225.5" font-size="21" font-weight="400" fill="#0D4FA8">充电</text><text x="1030" y="1225.5" font-size="21" font-weight="400" fill="#0D4FA8">发现设备</text><text x="1200" y="1142" font-size="21" font-weight="400" fill="#0D4FA8">儿童锁 / 后视镜</text><text x="65" y="1451" font-size="28" font-weight="600" fill="#0D4FA8">五、可解释记录｜判断结果与下游结果分开，不把下游返回当成车辆成功</text></svg>