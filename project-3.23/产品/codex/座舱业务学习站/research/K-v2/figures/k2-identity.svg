<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="k2-identity" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="k2-identity-title k2-identity-desc">
<title id="k2-identity-title">车登录的是谁，和座位上是谁是两回事</title><desc id="k2-identity-desc">车辆与豆包账号划定一份记忆；人脸把当前乘员对到这份记忆中的自然人。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="k2-identity-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">车登录的是谁，和座位上是谁是两回事</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">车辆与豆包账号划定一份记忆；人脸把当前乘员对到这份记忆中的自然人。</text>
<text class="v56-label" x="32" y="122" text-anchor="start">车这一侧</text>
<text class="v56-label" x="414" y="122" text-anchor="start">豆包这一侧</text>
<text class="v56-label" x="818" y="122" text-anchor="start">车里的人</text>
<g data-node="true" id="k2-identity-vehicle"><rect class="v56-local" x="32" y="150" width="245" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="178" text-anchor="start">车辆编号</text>
<text class="v56-node-sub" x="46" y="206" text-anchor="start">标记这辆车</text>
</g>
<g data-node="true" id="k2-identity-car-account"><rect class="v56-local" x="32" y="310" width="245" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="338" text-anchor="start">车企账号</text>
<text class="v56-node-sub" x="46" y="366" text-anchor="start">车归谁、谁能用车</text>
<text class="v56-node-sub" x="46" y="390" text-anchor="start">决定车控权限和乘客关系</text>
</g>
<g data-node="true" id="k2-identity-doubao-account"><rect class="v56-cloud" x="414" y="150" width="300" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="428" y="178" text-anchor="start">豆包账号</text>
<text class="v56-node-sub" x="428" y="206" text-anchor="start">豆包的登录身份</text>
</g>
<g data-node="true" id="k2-identity-unified-account"><rect class="v56-cloud" x="414" y="310" width="300" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="428" y="338" text-anchor="start">统一账号</text>
<text class="v56-node-sub" x="428" y="366" text-anchor="start">把两侧账号对到同一业务身份</text>
<text class="v56-node-sub" x="428" y="390" text-anchor="start">两侧账号不强制一一对应</text>
</g>
<g data-node="true" id="k2-identity-person"><rect class="v56-neutral" x="818" y="150" width="350" height="290" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="832" y="178" text-anchor="start">自然人：被认出的一个人</text>
<text class="v56-node-sub" x="832" y="206" text-anchor="start">人脸识别 → 自然人编号</text>
<text class="v56-node-sub" x="832" y="230" text-anchor="start">挂人脸编号、昵称、关系</text>
<text class="v56-node-sub" x="832" y="254" text-anchor="start">人脸是现在认人的主要依据</text>
<text class="v56-node-sub" x="832" y="278" text-anchor="start">编号里不存原始生物特征</text>
</g>
<g data-node="true" id="k2-identity-voice"><rect class="v56-neutral v56-pending" x="818" y="480" width="350" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="832" y="508" text-anchor="start">声纹编号：设计上辅助认人</text>
<text class="v56-node-sub" x="832" y="536" text-anchor="start">舱内声纹身份识别仍在预研</text>
</g>
<g data-node="true" id="k2-identity-unit"><rect class="v56-cloud" x="340" y="584" width="520" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="354" y="612" text-anchor="start">记忆单位 = 这辆车 × 豆包账号</text>
<text class="v56-node-sub" x="354" y="640" text-anchor="start">这一份里分别存车主、老周等人的记忆</text>
<text class="v56-node-sub" x="354" y="664" text-anchor="start">换账号、换车，人物记忆不直接互通</text>
</g>
<path class="v56-arrow" fill="none" d="M 277 375 L 414 375" marker-end="url(#k2-identity-arr)"/>
<path class="v56-arrow" fill="none" d="M 564 250 L 564 310" marker-end="url(#k2-identity-arr)"/>
<text class="v56-label" x="580" y="287" text-anchor="start">关联登录</text>
<path class="v56-arrow" fill="none" d="M 714 375 L 818 375" marker-end="url(#k2-identity-arr)"/>
<text class="v56-label" x="730" y="357" text-anchor="start">关联人</text>
<path class="v56-arrow" fill="none" d="M 993 480 L 993 440" marker-end="url(#k2-identity-arr)"/>
<path class="v56-arrow" fill="none" d="M 277 200 L 312 200 L 312 640 L 340 640" marker-end="url(#k2-identity-arr)"/>
<text class="v56-label" x="78" y="550" text-anchor="start">车辆这一维</text>
<path class="v56-arrow" fill="none" d="M 414 200 L 365 200 L 365 548 L 600 548 L 600 584" marker-end="url(#k2-identity-arr)"/>
<text class="v56-label" x="392" y="534" text-anchor="start">豆包账号这一维</text>
<text class="v56-node-title" x="32" y="742" text-anchor="start">车登录的是谁 ≠ 每个座位上是谁。前台只有一个豆包登录，可存多组登录关系。</text>
<path class="v56-rule" d="M 32 766 L 1168 766"/>
<rect data-decoration="true" class="v56-local" x="32" y="792" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="806" text-anchor="start">蓝：车辆和用车权限</text>
<rect data-decoration="true" class="v56-cloud" x="310" y="792" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="338" y="806" text-anchor="start">绿：登录映射和记忆范围</text>
<rect data-decoration="true" class="v56-neutral" x="660" y="792" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="688" y="806" text-anchor="start">灰：车内自然人</text>
<rect data-decoration="true" class="v56-neutral v56-pending" x="916" y="792" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="944" y="806" text-anchor="start">虚线：预研</text>
</svg>
