  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">流程三：新增事件不是加一个名称，而是完成一份跨团队合同</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,201 350,267" marker-end="url(#arrow-EL-govern)"><title>lg1 → lg2：场景落到事实</title></polyline><polyline class="arr" fill="none" points="350,372 350,438" marker-end="url(#arrow-EL-govern)"><title>lg2 → lg3：确认用途</title></polyline><polyline class="arr" fill="none" points="350,543 350,609" marker-end="url(#arrow-EL-govern)"><title>lg3 → lg4：逐用途授权</title></polyline><polyline class="arr" fill="none" points="350,714 350,780" marker-end="url(#arrow-EL-govern)"><title>lg4 → lg5：补失败边界</title></polyline><polyline class="arr" fill="none" points="350,885 350,951" marker-end="url(#arrow-EL-govern)"><title>lg5 → lg6：合同明确后测试</title></polyline><polyline class="arr" fill="none" points="350,1043 350,1109" marker-end="url(#arrow-EL-govern)"><title>lg6 → lg7：满足准出条件</title></polyline><text class="ts" x="365" y="237" text-anchor="start" dominant-baseline="central">E1 · 场景落到事实</text><text class="ts" x="365" y="408" text-anchor="start" dominant-baseline="central">E2 · 确认用途</text><text class="ts" x="365" y="579" text-anchor="start" dominant-baseline="central">E3 · 逐用途授权</text><text class="ts" x="365" y="750" text-anchor="start" dominant-baseline="central">E4 · 补失败边界</text><text class="ts" x="365" y="921" text-anchor="start" dominant-baseline="central">E5 · 合同明确后测试</text><text class="ts" x="365" y="1079" text-anchor="start" dominant-baseline="central">E6 · 满足准出条件</text><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-govern" data-step="lg1" aria-label="明确用户场景"><title>需要知道什么变化、解决什么问题；定义不该触发的反例</title><rect x="180" y="106" width="340" height="91" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">明确用户场景</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">需要知道什么变化、解决什么问题；定义不该触发的</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central">反例</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-govern" data-step="lg2" aria-label="定义事实与唯一来源"><title>对象、字段、时间、单位、模板；区分操作事实与结果事实</title><rect x="180" y="277" width="340" height="91" rx="6"/><text class="th" x="198" y="301" text-anchor="start" dominant-baseline="central">定义事实与唯一来源</text><text class="ts" x="198" y="329" text-anchor="start" dominant-baseline="central">对象、字段、时间、单位、模板；区分操作事实与结</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">果事实</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-govern" data-step="lg3" aria-label="列出消费者"><title>Context、记忆、订阅或新轮响应；每项说明为什么需要</title><rect x="180" y="448" width="340" height="91" rx="6"/><text class="th" x="198" y="472" text-anchor="start" dominant-baseline="central">列出消费者</text><text class="ts" x="198" y="500" text-anchor="start" dominant-baseline="central">Context、记忆、订阅或新轮响应；每项说明为什么</text><text class="ts" x="198" y="519" text-anchor="start" dominant-baseline="central">需要</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-govern" data-step="lg4" aria-label="确定权限与生命周期"><title>采集、留存、使用、删除分别定义；换账号/乘客变化如何失效</title><rect x="180" y="619" width="340" height="91" rx="6"/><text class="th" x="198" y="643" text-anchor="start" dominant-baseline="central">确定权限与生命周期</text><text class="ts" x="198" y="671" text-anchor="start" dominant-baseline="central">采集、留存、使用、删除分别定义；换账号/乘客变化</text><text class="ts" x="198" y="690" text-anchor="start" dominant-baseline="central">如何失效</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-govern" data-step="lg5" aria-label="确定异常合同"><title>重复、迟到、丢失、版本不兼容；没有规则就形成待办</title><rect x="180" y="790" width="340" height="91" rx="6"/><text class="th" x="198" y="814" text-anchor="start" dominant-baseline="central">确定异常合同</text><text class="ts" x="198" y="842" text-anchor="start" dominant-baseline="central">重复、迟到、丢失、版本不兼容；没有规则就形成待</text><text class="ts" x="198" y="861" text-anchor="start" dominant-baseline="central">办</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-govern" data-step="lg6" aria-label="联调完整证据链"><title>发生→记录→采用→实际结果；只写入成功不能准出</title><rect x="180" y="961" width="340" height="78" rx="6"/><text class="th" x="198" y="985" text-anchor="start" dominant-baseline="central">联调完整证据链</text><text class="ts" x="198" y="1013" text-anchor="start" dominant-baseline="central">发生→记录→采用→实际结果；只写入成功不能准出</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-govern" data-step="lg7" aria-label="发布与持续观测"><title>标明渠道、车型、版本及灰度范围；指标、错误样本与回滚责任</title><rect x="180" y="1119" width="340" height="91" rx="6"/><text class="th" x="198" y="1143" text-anchor="start" dominant-baseline="central">发布与持续观测</text><text class="ts" x="198" y="1171" text-anchor="start" dominant-baseline="central">标明渠道、车型、版本及灰度范围；指标、错误样本</text><text class="ts" x="198" y="1190" text-anchor="start" dominant-baseline="central">与回滚责任</text></g><text class="th" x="40" y="1294" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1324" text-anchor="start" dominant-baseline="central">E1 明确用户场景 → 定义事实与唯一来源：场景落到事实</text><text class="ts" x="40" y="1357" text-anchor="start" dominant-baseline="central">E2 定义事实与唯一来源 → 列出消费者：确认用途</text><text class="ts" x="40" y="1390" text-anchor="start" dominant-baseline="central">E3 列出消费者 → 确定权限与生命周期：逐用途授权</text><text class="ts" x="40" y="1423" text-anchor="start" dominant-baseline="central">E4 确定权限与生命周期 → 确定异常合同：补失败边界</text><text class="ts" x="40" y="1456" text-anchor="start" dominant-baseline="central">E5 确定异常合同 → 联调完整证据链：合同明确后测试</text><text class="ts" x="40" y="1489" text-anchor="start" dominant-baseline="central">E6 联调完整证据链 → 发布与持续观测：满足准出条件</text></svg>