<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 419" width="980" height="419" role="img" aria-label="用户没说话时，主动服务从哪里进入同一个闭环" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="419" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-proactive" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">用户没说话时，主动服务从哪里进入同一个闭环</text><text x="30" y="58" font-size="13" fill="#5f7169">架构关系示意 · 具体触发与建议调度按当前项目</text><g transform="translate(0,78)"><path class="flow-edge" data-from="state" data-to="event" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-proactive)"/><path class="flow-edge" data-from="event" data-to="advice" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-proactive)"/><path class="flow-edge" data-from="advice" data-to="plan" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-proactive)"/><path class="flow-edge" data-from="plan" data-to="do" d="M700,260.0 L610,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-proactive)"/><path class="flow-edge" data-from="do" data-to="back" d="M370,260.0 L280,260.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-proactive)"/><path class="flow-edge" data-from="back" data-to="plan" d="M160,214 L160,172 L820,172 L820,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-proactive)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">实际变化</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">条件成立</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">供判断的输入</text><text x="655.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">选择合适行动</text><text x="325.0" y="251.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">真实执行反馈</text><text x="490.0" y="163.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">需继续判断</text><g class="flow-point" data-point="state" role="button" tabindex="0" aria-label="车辆状态或场景发生变化"><rect x="40" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#86ada7">处理</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">车辆状态或场景发生变化</text><text x="54" y="110" font-size="12" fill="#587266">信号、时间、位置、情景</text></g><g class="flow-point" data-point="event" role="button" tabindex="0" aria-label="条件或事件满足"><rect x="370" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#bb8932">判断</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">条件或事件满足</text><text x="384" y="110" font-size="12" fill="#587266">触发器检查条件</text></g><g class="flow-point" data-point="advice" role="button" tabindex="0" aria-label="带着事件或建议进入规划"><rect x="700" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#86ada7">处理</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">带着事件或建议进入规划</text><text x="714" y="110" font-size="12" fill="#587266">Advisor可提供建议</text></g><g class="flow-point" data-point="plan" role="button" tabindex="0" aria-label="Planner决定是否处理"><rect x="700" y="214" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#bb8932">判断</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">Planner决定是否处理</text><text x="714" y="286" font-size="12" fill="#587266">结合当前对话与实际状态</text></g><g class="flow-point" data-point="do" role="button" tabindex="0" aria-label="安排执行或反馈用户"><rect x="370" y="214" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="235" font-size="11" fill="#86ada7">处理</text><text x="384" y="261" font-weight="700" font-size="16" fill="#203f35">安排执行或反馈用户</text><text x="384" y="286" font-size="12" fill="#587266">按业务需要确认与呈现</text></g><g class="flow-point" data-point="back" role="button" tabindex="0" aria-label="结果回来更新状态"><rect x="40" y="214" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#36835f">结果</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">结果回来更新状态</text><text x="54" y="286" font-size="12" fill="#587266">注册成功不等于提醒已播</text></g></g></svg>