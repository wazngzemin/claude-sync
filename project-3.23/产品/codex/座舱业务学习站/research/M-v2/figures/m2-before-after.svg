<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="m2-before-after" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="m2-before-after-title m2-before-after-desc">
<title id="m2-before-after-title">四路输入，先排成一条交互流</title><desc id="m2-before-after-desc">统一之前各处自己找 Planner；统一之后，输入管理先排顺序，再交给 Planner。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="m2-before-after-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<rect data-background="true" x="0" y="0" width="1200" height="730" style="fill:var(--v56-bg,#fff)"/>
<text class="v56-title" x="32" y="44" text-anchor="start">四路输入，先排成一条交互流</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">统一之前各处自己找 Planner；统一之后，输入管理先排顺序，再交给 Planner。</text>
<text class="v56-node-title" x="32" y="125" text-anchor="start">统一之前</text>
<text class="v56-node-title" x="650" y="125" text-anchor="start">统一之后</text>
<path class="v56-rule" d="M 600 105 L 600 620" fill="none"  />
<g data-node="true" data-name="old-0"><rect class="v56-local" x="32" y="165" width="250" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="192" text-anchor="start">多音区缓存</text>
<text class="v56-node-sub" x="46" y="217" text-anchor="start">合并各个座位的话</text>
</g>
<g data-node="true" data-name="old-1"><rect class="v56-local" x="32" y="275" width="250" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="302" text-anchor="start">打断恢复链路</text>
<text class="v56-node-sub" x="46" y="327" text-anchor="start">处理插话和恢复</text>
</g>
<g data-node="true" data-name="old-2"><rect class="v56-local" x="32" y="385" width="250" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="412" text-anchor="start">主动推荐自己等</text>
<text class="v56-node-sub" x="46" y="437" text-anchor="start">各自判断何时开口</text>
</g>
<g data-node="true" data-name="old-3"><rect class="v56-local" x="32" y="495" width="250" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="522" text-anchor="start">工具自己续轮</text>
<text class="v56-node-sub" x="46" y="547" text-anchor="start">结果回来就接着推理</text>
</g>
<g data-node="true" data-name="old-planner"><rect class="v56-cloud" x="430" y="325" width="140" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="352" text-anchor="start">Planner</text>
<text class="v56-node-sub" x="444" y="377" text-anchor="start">接住多路请求</text>
</g>
<path class="v56-arrow" d="M 282 210 L 430 400" fill="none" marker-end="url(#m2-before-after-arr)" />
<path class="v56-arrow" d="M 282 320 L 430 375" fill="none" marker-end="url(#m2-before-after-arr)" />
<path class="v56-arrow" d="M 282 430 L 430 350" fill="none" marker-end="url(#m2-before-after-arr)" />
<path class="v56-arrow" d="M 282 540 L 430 335" fill="none" marker-end="url(#m2-before-after-arr)" />
<text class="v56-node-title" style="fill:var(--red,#9c4148)" x="340" y="575" text-anchor="start">自己打断自己</text>
<g data-node="true" data-name="four-inputs"><rect class="v56-local" x="650" y="165" width="518" height="175" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="664" y="192" text-anchor="start">四路输入各自保留身份</text>
<text class="v56-node-sub" x="664" y="217" text-anchor="start">用户的话　　主动建议</text>
<text class="v56-node-sub" x="664" y="240" text-anchor="start">同一轮工具的完整结果　　有效事件</text>
<text class="v56-node-sub" x="664" y="263" text-anchor="start">每条保留来源；同一个身份只收一次</text>
</g>
<g data-node="true" data-name="input-management"><rect class="v56-cloud" x="650" y="410" width="230" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="664" y="437" text-anchor="start">输入管理</text>
<text class="v56-node-sub" x="664" y="462" text-anchor="start">决定谁先进、谁等一等</text>
<text class="v56-node-sub" x="664" y="485" text-anchor="start">只排顺序，不理解意图</text>
</g>
<g data-node="true" data-name="new-planner"><rect class="v56-cloud" x="970" y="410" width="198" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="984" y="437" text-anchor="start">Planner</text>
<text class="v56-node-sub" x="984" y="462" text-anchor="start">接收本轮输入</text>
<text class="v56-node-sub" x="984" y="485" text-anchor="start">理解意图、决定动作</text>
</g>
<path class="v56-arrow" d="M 765 340 L 765 410" fill="none" marker-end="url(#m2-before-after-arr)" />
<path class="v56-arrow" d="M 880 465 L 970 465" fill="none" marker-end="url(#m2-before-after-arr)" />
<text class="v56-label" x="650" y="565" text-anchor="start">一条交互流：同一时刻只有一次执行生效</text>
<rect data-legend="true" class="v56-local" x="32" y="676" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="690" text-anchor="start">蓝：输入与分散处理</text>
<rect data-legend="true" class="v56-cloud" x="350" y="676" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="378" y="690" text-anchor="start">绿：排顺序与正式处理</text>
<rect data-legend="true" class="v56-reject" x="700" y="676" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="728" y="690" text-anchor="start">红：交互冲突</text>
</svg>
