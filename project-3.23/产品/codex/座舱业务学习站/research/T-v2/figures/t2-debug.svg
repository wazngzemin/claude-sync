<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="t2-debug" width="1200" height="1330" viewBox="0 0 1200 1330" role="img" aria-labelledby="t2-debug-title t2-debug-desc">
<title id="t2-debug-title">“你怎么没提醒我”，沿一次提醒逐层查</title><desc id="t2-debug-desc">每层核对实际输入和结果；接口返回成功或单个步骤通过，都不能代表用户收到了提醒。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="t2-debug-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">“你怎么没提醒我”，沿一次提醒逐层查</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">每层核对实际输入和结果；接口返回成功或单个步骤通过，都不能代表用户收到了提醒。</text>
<text class="v56-label" x="80" y="122" text-anchor="start">从受理，一直查到车上实际结果</text>
<text class="v56-label" x="800" y="122" text-anchor="start">这一层找谁、核对什么</text>
<g data-node="true" id="t2-debug-n1"><rect class="v56-cloud" x="80" y="150" width="640" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="178" text-anchor="start">01 · 创建受理了吗</text>
<text class="v56-node-sub" x="94" y="206" text-anchor="start">原话变成了正确的提醒任务吗</text>
</g>
<text class="v56-node-title" x="800" y="179" text-anchor="start">找谁：任务服务</text>
<text class="v56-subtitle" x="800" y="208" text-anchor="start">核对任务内容、创建结果</text>
<path class="v56-arrow" d="M 400 238 L 400 276" marker-end="url(#t2-debug-arr)"/>
<g data-node="true" id="t2-debug-n2"><rect class="v56-cloud" x="80" y="276" width="640" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="304" text-anchor="start">02 · 规则登记上了吗</text>
<text class="v56-node-sub" x="94" y="332" text-anchor="start">保存后，等待条件真的登记成功了吗</text>
</g>
<text class="v56-node-title" x="800" y="305" text-anchor="start">找谁：任务服务 + 触发器（G 章）</text>
<text class="v56-subtitle" x="800" y="334" text-anchor="start">分别核对保存与登记回执</text>
<path class="v56-arrow" d="M 400 364 L 400 402" marker-end="url(#t2-debug-arr)"/>
<g data-node="true" id="t2-debug-n3"><rect class="v56-cloud" x="80" y="402" width="640" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="430" text-anchor="start">03 · 条件观察到了吗</text>
<text class="v56-node-sub" x="94" y="458" text-anchor="start">到点或条件变化，有没有被正确观察</text>
</g>
<text class="v56-node-title" x="800" y="431" text-anchor="start">找谁：触发器（G 章）+ 车端</text>
<text class="v56-subtitle" x="800" y="460" text-anchor="start">核对时间、信号与观察结果</text>
<path class="v56-arrow" d="M 400 490 L 400 528" marker-end="url(#t2-debug-arr)"/>
<g data-node="true" id="t2-debug-n4"><rect class="v56-cloud" x="80" y="528" width="640" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="556" text-anchor="start">04 · 回调到了吗</text>
<text class="v56-node-sub" x="94" y="584" text-anchor="start">任务、回调编号是否齐全；是否被拦截</text>
</g>
<text class="v56-node-title" x="800" y="557" text-anchor="start">找谁：任务服务 + 触发器（G 章）</text>
<text class="v56-subtitle" x="800" y="586" text-anchor="start">核对回调到达和有效性检查</text>
<path class="v56-arrow" d="M 400 616 L 400 654" marker-end="url(#t2-debug-arr)"/>
<g data-node="true" id="t2-debug-n5"><rect class="v56-decision" x="80" y="654" width="640" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="682" text-anchor="start">05 · 进 Planner 了吗</text>
<text class="v56-node-sub" x="94" y="710" text-anchor="start">推荐是否上行、还原身份并排队进入</text>
</g>
<text class="v56-node-title" x="800" y="683" text-anchor="start">找谁：车端 + Planner</text>
<text class="v56-subtitle" x="800" y="712" text-anchor="start">对上推荐编号，查排队与去重</text>
<path class="v56-arrow" d="M 400 742 L 400 780" marker-end="url(#t2-debug-arr)"/>
<g data-node="true" id="t2-debug-n6"><rect class="v56-local" x="80" y="780" width="640" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="808" text-anchor="start">06 · 说了、做了吗</text>
<text class="v56-node-sub" x="94" y="836" text-anchor="start">提醒是否含“去接小宝”；车控是否成功</text>
</g>
<text class="v56-node-title" x="800" y="809" text-anchor="start">找谁：Planner + 车端</text>
<text class="v56-subtitle" x="800" y="838" text-anchor="start">核对有效内容与实际执行结果</text>
<path class="v56-arrow" d="M 400 868 L 400 906" marker-end="url(#t2-debug-arr)"/>
<g data-node="true" id="t2-debug-n7"><rect class="v56-cloud" x="80" y="906" width="640" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="934" text-anchor="start">07 · 结果写回了吗</text>
<text class="v56-node-sub" x="94" y="962" text-anchor="start">运行、任务、事件是否按身份写回</text>
</g>
<text class="v56-node-title" x="800" y="935" text-anchor="start">找谁：任务服务</text>
<text class="v56-subtitle" x="800" y="964" text-anchor="start">核对回写结果及失败重试</text>
<path class="v56-arrow" d="M 400 994 L 400 1032" marker-end="url(#t2-debug-arr)"/>
<g data-node="true" id="t2-debug-n8"><rect class="v56-local" x="80" y="1032" width="640" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="1060" text-anchor="start">08 · 车端状态对吗</text>
<text class="v56-node-sub" x="94" y="1088" text-anchor="start">通知是否到达；上电是否主动补查</text>
</g>
<text class="v56-node-title" x="800" y="1061" text-anchor="start">找谁：任务服务 + 车端</text>
<text class="v56-subtitle" x="800" y="1090" text-anchor="start">核对状态消息和有效任务列表</text>
<text class="v56-node-title" x="80" y="1170" text-anchor="start">用任务编号、运行编号、请求编号、推荐编号，把一次提醒串起来。</text>
<path class="v56-rule" d="M 32 1206 L 1168 1206"/>
<text class="v56-node-title" x="32" y="1242" text-anchor="start">先找到断在哪一层，再判断是哪一方的问题。</text>
<rect data-decoration="true" class="v56-cloud" x="32.0" y="1270" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1284" text-anchor="start">绿：创建、触发与回写</text>
<rect data-decoration="true" class="v56-decision" x="410.6666666666667" y="1270" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="1284" text-anchor="start">黄：进入 Planner</text>
<rect data-decoration="true" class="v56-local" x="789.3333333333334" y="1270" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="1284" text-anchor="start">蓝：实际结果与车端状态</text>
</svg>
