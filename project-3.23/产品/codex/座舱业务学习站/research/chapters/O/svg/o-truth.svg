<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="虚假成功出在哪一环：从“说”到“真的变了”的四道关"><title>虚假成功出在哪一环：从“说”到“真的变了”的四道关</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="600" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">虚假成功出在哪一环：从“说”到“真的变了”的四道关</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">8 月 19 日分析，23 个 case，一个 case 可落在多关</text><rect x="30" y="130" width="260" height="150" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="44" y="157" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">指令对不对</text><text x="44" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 对象 / 方向错：3</text><text x="44" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：遮阳帘拉上</text><text x="44" y="224" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">变成了打开</text><rect x="320" y="130" width="260" height="150" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="334" y="157" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">车有没有这个能力</text><text x="334" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">能力 / 配置 / 协议</text><text x="334" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不匹配：9</text><text x="334" y="224" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：车没有“舒缓模式”</text><rect x="610" y="130" width="260" height="150" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="624" y="157" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">回执说清了没有</text><text x="624" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">回执缺陷：12（52.2%）</text><text x="624" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：只写“切换到</text><text x="624" y="224" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">mode模式”</text><rect x="900" y="130" width="260" height="150" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="914" y="157" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">DT 核对了没有</text><text x="914" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">状态感知 / 结果</text><text x="914" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">校验缺失：7</text><text x="914" y="224" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：地图“暂无内容”</text><path d="M290,205 L320,205" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M580,205 L610,205" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M870,205 L900,205" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="330" width="1130" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="44" y="357" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">对策（8/24 方案，上线待确认）</text><text x="44" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说之前：首轮不预设结果；把能力边界告诉 DT</text><text x="44" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">回执：写清具体执行结果；DT：每条回执后拼一句“检查执行结果是否满足指令”</text><rect x="30" y="460" width="1130" height="100" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="44" y="487" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">反方向也会错（赛力斯 11/7 测试周报）</text><text x="44" y="512" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“车控动作执行成功但播报失败”“车窗档位控制执行成功，但播报异常”</text><text x="44" y="533" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车控通过率 69.96%，问题之一是执行与 TTS 播报不一致</text></g></svg>