<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Noto Sans SC, sans-serif">
  <!-- 标题 -->
  <text x="700" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">N5 反思与自我认知：豆包的内心世界</text>
  <text x="700" y="55" text-anchor="middle" font-size="12" fill="#546E7A">输入：主链交互/事件 + 离车闲置　|　输出：打包 context 注入主 Agent，不直接控车、不播报</text>

  <!-- 左列模块框：反思层 -->
  <rect x="20" y="75" width="340" height="490" rx="8" fill="#F5F5F5" stroke="#9E9E9E" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="190" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#616161">反思层（W2 灰底行）</text>
  <text x="190" y="115" text-anchor="middle" font-size="11" fill="#757575">虚线框 = 2.6 尚未承载</text>

  <rect x="40" y="130" width="300" height="120" rx="6" fill="#FAFAFA" stroke="#9E9E9E" stroke-dasharray="4,3" stroke-width="1.2"/>
  <text x="52" y="150" font-size="13" font-weight="bold" fill="#424242">N5-01 实时反思</text>
  <text x="328" y="150" text-anchor="end" font-size="10" fill="#9E9E9E">长期愿景</text>
  <text x="52" y="170" font-size="11" fill="#616161">对话进行中即时总结本轮反馈</text>
  <text x="52" y="188" font-size="11" fill="#616161">与事件，形成短期记忆候选</text>
  <text x="52" y="208" font-size="11" fill="#616161">输入：tool_feedback / 用户 Query</text>
  <text x="52" y="228" font-size="11" fill="#616161">输出：写 N5-06 短期记忆区</text>

  <rect x="40" y="270" width="300" height="120" rx="6" fill="#FAFAFA" stroke="#9E9E9E" stroke-dasharray="4,3" stroke-width="1.2"/>
  <text x="52" y="290" font-size="13" font-weight="bold" fill="#424242">N5-02 离线反思</text>
  <text x="328" y="290" text-anchor="end" font-size="10" fill="#FB8C00">2.6 目标 10-11 月</text>
  <text x="52" y="310" font-size="11" fill="#616161">离车/闲置后异步总结整段对话</text>
  <text x="52" y="328" font-size="11" fill="#616161">"教练真凶"这类主观对话压成</text>
  <text x="52" y="346" font-size="11" fill="#616161">长期记忆候选</text>
  <text x="52" y="368" font-size="11" fill="#616161">输出：写 N5-06 长期记忆</text>

  <rect x="40" y="410" width="300" height="120" rx="6" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1.2"/>
  <text x="52" y="430" font-size="13" font-weight="bold" fill="#424242">N5-03 偏好优化</text>
  <text x="328" y="430" text-anchor="end" font-size="10" fill="#9E9E9E">长期愿景</text>
  <text x="52" y="450" font-size="11" fill="#616161">按用户采纳/拒绝长期调推荐策略</text>
  <text x="52" y="468" font-size="11" fill="#616161">拒绝一次 ≠ 永久偏好</text>
  <text x="52" y="488" font-size="11" fill="#616161">与 S14 学习能力共用证据链</text>
  <text x="52" y="508" font-size="11" fill="#616161">输出：更新 N5-04 / N5-06</text>

  <!-- 中列模块框：4 内心向 Agent -->
  <rect x="380" y="75" width="540" height="490" rx="8" fill="#FAFAFA" stroke="#37474F" stroke-width="1.5"/>
  <text x="650" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">内心向 4 Agent（W1 长期架构）</text>
  <text x="650" y="115" text-anchor="middle" font-size="11" fill="#546E7A">统一职责：为主 Agent 提供 context</text>

  <rect x="400" y="130" width="245" height="160" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2"/>
  <text x="412" y="150" font-size="13" font-weight="bold" fill="#0D47A1">N5-04 人设三观</text>
  <text x="633" y="150" text-anchor="end" font-size="10" fill="#9E9E9E">长期愿景</text>
  <text x="412" y="170" font-size="11" fill="#1565C0">持续更新动机和价值体系</text>
  <text x="412" y="188" font-size="11" fill="#1565C0">触发：定时 / 用户聊深层话题</text>
  <text x="412" y="206" font-size="11" fill="#1565C0">输入：历史对话 + 原有人设</text>
  <text x="412" y="224" font-size="11" fill="#1565C0">输出：更新后三观（sp 注入）</text>
  <text x="412" y="248" font-size="10" fill="#546E7A">决策有逻辑真实感、与用户对齐</text>
  <text x="412" y="266" font-size="10" fill="#546E7A">同时保持新鲜感、有立场</text>

  <rect x="665" y="130" width="245" height="160" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2"/>
  <text x="677" y="150" font-size="13" font-weight="bold" fill="#B71C1C">N5-05 情绪状态</text>
  <text x="898" y="150" text-anchor="end" font-size="10" fill="#9E9E9E">长期愿景 S2S P2</text>
  <text x="677" y="170" font-size="11" fill="#C62828">递归：new=cur×inertia+event×sens</text>
  <text x="677" y="188" font-size="11" fill="#C62828">　　　+memory×recency_noise</text>
  <text x="677" y="206" font-size="11" fill="#C62828">衰减不归零，趋向个性化基线</text>
  <text x="677" y="224" font-size="11" fill="#C62828">挂 faceid/账号（对照 K 图）</text>
  <text x="677" y="248" font-size="10" fill="#B71C1C">指标：S2S 情感演绎≥95%（S8 起）</text>
  <text x="677" y="266" font-size="10" fill="#B71C1C">多轮情绪继承 5 轮内</text>

  <rect x="400" y="310" width="245" height="160" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="412" y="330" font-size="13" font-weight="bold" fill="#1B5E20">N5-06 记忆 Agent</text>
  <text x="633" y="330" text-anchor="end" font-size="10" fill="#2E7D32">2.6 已落地 S5-S6</text>
  <text x="412" y="350" font-size="11" fill="#2E7D32">全面/准确/及时/区分重要性</text>
  <text x="412" y="368" font-size="11" fill="#2E7D32">五种触发：记忘/轮次/定时/</text>
  <text x="412" y="386" font-size="11" fill="#2E7D32">　　离车闲置/值得关注事件</text>
  <text x="412" y="404" font-size="11" fill="#2E7D32">输出：记忆增删改 + 具象化</text>
  <text x="412" y="428" font-size="10" fill="#1B5E20">短期 ACC≥98%/Recall≥95%/≤5s</text>
  <text x="412" y="446" font-size="10" fill="#1B5E20">长期：情景 ACC≥80%/语义偏好≥80%</text>

  <rect x="665" y="310" width="245" height="160" rx="6" fill="#FFF8E1" stroke="#E65100" stroke-width="1.2"/>
  <text x="677" y="330" font-size="13" font-weight="bold" fill="#E65100">N5-07 自我探索</text>
  <text x="898" y="330" text-anchor="end" font-size="10" fill="#9E9E9E">长期愿景</text>
  <text x="677" y="350" font-size="11" fill="#E65100">按动机和兴趣对世界探索</text>
  <text x="677" y="368" font-size="11" fill="#E65100">唯一触发：用户离车闲置时</text>
  <text x="677" y="386" font-size="11" fill="#E65100">输入：自己兴趣/用户兴趣/近期话题</text>
  <text x="677" y="404" font-size="11" fill="#E65100">输出：探索记忆 + 沉淀文件</text>
  <text x="677" y="428" font-size="10" fill="#BF360C">例：昨晚逛 B 站看人脸机器人</text>
  <text x="677" y="446" font-size="10" fill="#BF360C">明天上车主动跟主驾聊起</text>

  <!-- 右列模块框：出口 -->
  <rect x="940" y="75" width="440" height="490" rx="8" fill="#ECEFF1" stroke="#37474F" stroke-width="1.5"/>
  <text x="1160" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">统一出口 → 主 Agent</text>

  <rect x="960" y="130" width="400" height="190" rx="8" fill="#E3F2FD" stroke="#0D47A1" stroke-width="1.5"/>
  <text x="975" y="155" font-size="14" font-weight="bold" fill="#0D47A1">N5-08 打包 context 注入</text>
  <text x="975" y="180" font-size="11" fill="#1565C0">三样东西一起进主 Agent SP/UP：</text>
  <text x="975" y="202" font-size="11" fill="#1565C0">① 人设三观（N5-04）</text>
  <text x="975" y="222" font-size="11" fill="#1565C0">② 当前情绪状态（N5-05）</text>
  <text x="975" y="242" font-size="11" fill="#1565C0">③ 用户记忆 + 近期探索记忆</text>
  <text x="975" y="260" font-size="11" fill="#1565C0">　（N5-06 + N5-07）</text>
  <text x="975" y="290" font-size="11" fill="#C62828">关键：内心向 Agent 没有播报出口</text>
  <text x="975" y="310" font-size="11" fill="#C62828">排障时不要找"情绪 Agent 说了哪句"</text>

  <rect x="960" y="340" width="400" height="180" rx="8" fill="#FFF8E1" stroke="#E65100" stroke-width="1.5"/>
  <text x="975" y="365" font-size="14" font-weight="bold" fill="#E65100">N5-09 主 Agent 组织语言和行为</text>
  <text x="975" y="390" font-size="11" fill="#BF360C">收到 context 后自己决定：</text>
  <text x="975" y="410" font-size="11" fill="#BF360C">本轮怎么开口、用什么语气</text>
  <text x="975" y="430" font-size="11" fill="#BF360C">要不要主动聊昨晚看到的谈资</text>
  <text x="975" y="460" font-size="11" fill="#263238">出声的永远是主 Agent（Planner）</text>
  <text x="975" y="480" font-size="11" fill="#263238">它是唯一"思考主体"</text>

  <!-- 连线 -->
  <polyline points="340,190 370,190 370,210 400,210" fill="none" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polyline points="340,330 375,330 375,390 400,390" fill="none" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polyline points="340,470 380,470 380,390 400,390" fill="none" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polyline points="645,210 800,210 800,220 960,220" fill="none" stroke="#1565C0" stroke-width="1.8"/>
  <polyline points="910,210 945,210 945,240 960,240" fill="none" stroke="#C62828" stroke-width="1.8"/>
  <polyline points="645,390 800,390 800,260 960,260" fill="none" stroke="#2E7D32" stroke-width="1.8"/>
  <polyline points="910,390 945,390 945,280 960,280" fill="none" stroke="#E65100" stroke-width="1.8"/>
  <polyline points="1160,320 1160,340" fill="none" stroke="#0D47A1" stroke-width="2"/>
  <polygon points="1160,340 1155,332 1165,332" fill="#0D47A1"/>
  <polyline points="960,430 920,430 920,600 190,600 190,560" fill="none" stroke="#9E9E9E" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="560" y="595" font-size="10" fill="#757575">异步回写：主 Agent 跑完的交互/事件回流到反思层</text>

  <!-- 图例 -->
  <rect x="20" y="590" width="1360" height="290" rx="8" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1"/>
  <text x="40" y="615" font-size="13" font-weight="bold" fill="#263238">图例</text>

  <rect x="40" y="630" width="20" height="14" fill="#E3F2FD" stroke="#1565C0"/><text x="66" y="641" font-size="11" fill="#37474F">蓝=普通处理/注入主路</text>
  <rect x="260" y="630" width="20" height="14" fill="#FFF8E1" stroke="#E65100"/><text x="286" y="641" font-size="11" fill="#37474F">金=主动触发/主 Agent</text>
  <rect x="480" y="630" width="20" height="14" fill="#E8F5E9" stroke="#2E7D32"/><text x="506" y="641" font-size="11" fill="#37474F">绿=记忆回流</text>
  <rect x="660" y="630" width="20" height="14" fill="#FFEBEE" stroke="#C62828"/><text x="686" y="641" font-size="11" fill="#37474F">红=情绪（主观感受）</text>
  <rect x="850" y="630" width="20" height="14" fill="#FAFAFA" stroke="#9E9E9E" stroke-dasharray="3,2"/><text x="876" y="641" font-size="11" fill="#37474F">灰虚线=长期愿景/2.6未承载</text>

  <line x1="40" y1="670" x2="80" y2="670" stroke="#1565C0" stroke-width="1.8"/><text x="88" y="674" font-size="11" fill="#37474F">蓝=主路注入</text>
  <line x1="200" y1="670" x2="240" y2="670" stroke="#C62828" stroke-width="1.8"/><text x="248" y="674" font-size="11" fill="#37474F">红=情绪供给</text>
  <line x1="360" y1="670" x2="400" y2="670" stroke="#2E7D32" stroke-width="1.8"/><text x="408" y="674" font-size="11" fill="#37474F">绿=记忆供给</text>
  <line x1="520" y1="670" x2="560" y2="670" stroke="#E65100" stroke-width="1.8"/><text x="568" y="674" font-size="11" fill="#37474F">橙=探索记忆</text>
  <line x1="680" y1="670" x2="720" y2="670" stroke="#9E9E9E" stroke-width="1.2" stroke-dasharray="4,3"/><text x="728" y="674" font-size="11" fill="#37474F">灰虚线=异步回流/规划中</text>

  <text x="40" y="710" font-size="12" font-weight="bold" fill="#263238">状态角标</text>
  <text x="40" y="730" font-size="11" fill="#546E7A">长期愿景=W1 画出 2.6未承载 | 2.6目标=W3 路线图 P2 | 2.6已落地=S5-S6 已打通</text>
  <text x="40" y="750" font-size="11" fill="#546E7A">主体（4 内心向 Agent）整体【长期愿景】；离线反思【2.6目标】；记忆 Agent 长期记忆链路【2.6已落地】</text>

  <text x="40" y="785" font-size="12" font-weight="bold" fill="#263238">贯穿案例（游泳馆）</text>
  <text x="40" y="805" font-size="11" fill="#546E7A">1. 导航结束下车，主驾随口"昨天那个教练真凶" → N5-05 更新对"游泳教练"的情绪（未来时）</text>
  <text x="40" y="825" font-size="11" fill="#546E7A">2. 离车后 N5-02 离线反思压缩成长期记忆，N5-07 自我探索上网看 AI 新闻</text>
  <text x="40" y="845" font-size="11" fill="#546E7A">3. 明天上车 N5-08 打包"人设+情绪+记忆+探索"注入主 Agent，N5-09 主动聊起昨晚看到的人脸机器人</text>
</svg>
