  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">“记住我家”与“设置我家”：短期同步中的两条入口</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,188 350,254" marker-end="url(#arrow-K-poi-two-entries)"><title>kpoi1 → kpoi2：用户 Query 与当前身份</title></polyline><polyline class="arr" fill="none" points="350,356 350,422" marker-end="url(#arrow-K-poi-two-entries)"><title>kpoi2 → kpoi3：偏记忆：记一下我家在…</title></polyline><polyline class="arr" fill="none" points="350,546 350,612" marker-end="url(#arrow-K-poi-two-entries)"><title>kpoi3 → kpoi4：家/公司相关语义</title></polyline><polyline class="arr" fill="none" points="350,736 350,802" marker-end="url(#arrow-K-poi-two-entries)"><title>kpoi4 → kpoi5：提取出的主体与地点</title></polyline><polyline class="arr" fill="none" points="350,926 350,992" marker-end="url(#arrow-K-poi-two-entries)"><title>kpoi5 → kpoi6：身份与参数满足该项目设置要求</title></polyline><polyline class="arr" fill="none" points="176,308 80,308 80,1068 170,1068" marker-end="url(#arrow-K-poi-two-entries)"><title>kpoi2 → kpoi6：偏设置：把这里设为家</title></polyline><polyline class="arr" fill="none" points="350,1116 350,1182" marker-end="url(#arrow-K-poi-two-entries)"><title>kpoi6 → kpoi7：提交地图设置并取得结果</title></polyline><polyline class="arr" fill="none" points="350,1306 350,1372" marker-end="url(#arrow-K-poi-two-entries)"><title>kpoi7 → kpoi8：真实设置反馈</title></polyline><text class="ts" x="365" y="224" text-anchor="start" dominant-baseline="central">E1 · 用户 Query 与当前身份</text><text class="ts" x="365" y="392" text-anchor="start" dominant-baseline="central">E2 · 偏记忆：记一下我家在…</text><text class="ts" x="365" y="582" text-anchor="start" dominant-baseline="central">E3 · 家/公司相关语义</text><text class="ts" x="365" y="772" text-anchor="start" dominant-baseline="central">E4 · 提取出的主体与地点</text><text class="ts" x="365" y="962" text-anchor="start" dominant-baseline="central">E5 · 身份与参数满足该项目设置要求</text><text class="ts" x="168" y="300" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="168" y="1080" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="365" y="1152" text-anchor="start" dominant-baseline="central">E7 · 提交地图设置并取得结果</text><text class="ts" x="365" y="1342" text-anchor="start" dominant-baseline="central">E8 · 真实设置反馈</text><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-poi-two-entries" data-step="kpoi1" aria-label="用户表达家或公司地址"><title>先保留说话人、具体地点与操作意图</title><rect x="180" y="106" width="340" height="78" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">用户表达家或公司地址</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">先保留说话人、具体地点与操作意图</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-poi-two-entries" data-step="kpoi2" aria-label="Director 区分语义"><title>偏记忆，或明确要求地图设置</title><rect x="180" y="264" width="340" height="88" rx="6"/><text class="th" x="198" y="288" text-anchor="start" dominant-baseline="central">Director 区分语义</text><text class="ts" x="198" y="316" text-anchor="start" dominant-baseline="central">偏记忆，或明确要求地图设置</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-poi-two-entries" data-step="kpoi3" aria-label="记忆操作工具"><title>接收记忆类表达；家/公司语义分流给提槽模块</title><rect x="180" y="432" width="340" height="110" rx="6"/><text class="th" x="198" y="456" text-anchor="start" dominant-baseline="central">记忆操作工具</text><text class="ts" x="198" y="484" text-anchor="start" dominant-baseline="central">接收记忆类表达</text><text class="ts" x="198" y="503" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="522" text-anchor="start" dominant-baseline="central">家/公司语义分流给提槽模块</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-poi-two-entries" data-step="kpoi4" aria-label="提取同步所需信息"><title>记忆主体、地点类型与目标地点；工程校验输出是否可用于设置</title><rect x="180" y="622" width="340" height="110" rx="6"/><text class="th" x="198" y="646" text-anchor="start" dominant-baseline="central">提取同步所需信息</text><text class="ts" x="198" y="674" text-anchor="start" dominant-baseline="central">记忆主体、地点类型与目标地点</text><text class="ts" x="198" y="693" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="712" text-anchor="start" dominant-baseline="central">工程校验输出是否可用于设置</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-poi-two-entries" data-step="kpoi5" aria-label="核当前身份与地图账号"><title>按目标车型规则确认可操作范围；车主未识别及账号切换逻辑需核实</title><rect x="180" y="812" width="340" height="110" rx="6"/><text class="th" x="198" y="836" text-anchor="start" dominant-baseline="central">核当前身份与地图账号</text><text class="ts" x="198" y="864" text-anchor="start" dominant-baseline="central">按目标车型规则确认可操作范围</text><text class="ts" x="198" y="883" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="902" text-anchor="start" dominant-baseline="central">车主未识别及账号切换逻辑需核实</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-poi-two-entries" data-step="kpoi6" aria-label="导航基础控制入口"><title>接收明确地图设置要求；偏设置的表达直接进入这一路</title><rect x="180" y="1002" width="340" height="110" rx="6"/><text class="th" x="198" y="1026" text-anchor="start" dominant-baseline="central">导航基础控制入口</text><text class="ts" x="198" y="1054" text-anchor="start" dominant-baseline="central">接收明确地图设置要求</text><text class="ts" x="198" y="1073" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1092" text-anchor="start" dominant-baseline="central">偏设置的表达直接进入这一路</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-poi-two-entries" data-step="kpoi7" aria-label="实际地图设置结果"><title>明确成功、失败或缺少信息；设置结果不能用记忆受理代替</title><rect x="180" y="1192" width="340" height="110" rx="6"/><text class="th" x="198" y="1216" text-anchor="start" dominant-baseline="central">实际地图设置结果</text><text class="ts" x="198" y="1244" text-anchor="start" dominant-baseline="central">明确成功、失败或缺少信息</text><text class="ts" x="198" y="1263" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1282" text-anchor="start" dominant-baseline="central">设置结果不能用记忆受理代替</text></g><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-poi-two-entries" data-step="kpoi8" aria-label="Director 依据结果答复"><title>若结果不足，补充信息或解释失败；下一次“回家”再验证实际目的地</title><rect x="180" y="1382" width="340" height="110" rx="6"/><text class="th" x="198" y="1406" text-anchor="start" dominant-baseline="central">Director 依据结果答复</text><text class="ts" x="198" y="1434" text-anchor="start" dominant-baseline="central">若结果不足，补充信息或解释失败</text><text class="ts" x="198" y="1453" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1472" text-anchor="start" dominant-baseline="central">下一次“回家”再验证实际目的地</text></g><text class="th" x="40" y="1576" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1606" text-anchor="start" dominant-baseline="central">E1 用户表达家或公司地址 → Director 区分语义：用户 Query 与当前身份</text><text class="ts" x="40" y="1639" text-anchor="start" dominant-baseline="central">E2 Director 区分语义 → 记忆操作工具：偏记忆：记一下我家在…</text><text class="ts" x="40" y="1672" text-anchor="start" dominant-baseline="central">E3 记忆操作工具 → 提取同步所需信息：家/公司相关语义</text><text class="ts" x="40" y="1705" text-anchor="start" dominant-baseline="central">E4 提取同步所需信息 → 核当前身份与地图账号：提取出的主体与地点</text><text class="ts" x="40" y="1738" text-anchor="start" dominant-baseline="central">E5 核当前身份与地图账号 → 导航基础控制入口：身份与参数满足该项目设置要求</text><text class="ts" x="40" y="1771" text-anchor="start" dominant-baseline="central">E6 Director 区分语义 → 导航基础控制入口：偏设置：把这里设为家</text><text class="ts" x="40" y="1804" text-anchor="start" dominant-baseline="central">E7 导航基础控制入口 → 实际地图设置结果：提交地图设置并取得结果</text><text class="ts" x="40" y="1837" text-anchor="start" dominant-baseline="central">E8 实际地图设置结果 → Director 依据结果答复：真实设置反馈</text></svg>