<g class="action" data-node="wake"><rect class="box" x="32" y="140" width="200" height="100" rx="8"/><text class="node-title" x="46" y="167" text-anchor="start">唤醒</text><text class="node-subtitle" x="46" y="192" text-anchor="start">交出激活状态</text></g>
<g class="info" data-node="acoustic"><rect class="box" x="266" y="140" width="200" height="100" rx="8"/><text class="node-title" x="280" y="167" text-anchor="start">声学前端</text><text class="node-subtitle" x="280" y="192" text-anchor="start">交出音频与音区</text></g>
<g class="info" data-node="asr"><rect class="box" x="500" y="140" width="200" height="100" rx="8"/><text class="node-title" x="514" y="167" text-anchor="start">ASR</text><text class="node-subtitle" x="514" y="192" text-anchor="start">交出识别文字</text></g>
<g class="action" data-node="vad"><rect class="box" x="734" y="140" width="200" height="100" rx="8"/><text class="node-title" x="748" y="167" text-anchor="start">VAD 判停</text><text class="node-subtitle" x="748" y="192" text-anchor="start">交出结束信号</text></g>
<g class="action" data-node="recognition"><rect class="box" x="968" y="140" width="200" height="100" rx="8"/><text class="node-title" x="982" y="167" text-anchor="start">拒识</text><text class="node-subtitle" x="982" y="192" text-anchor="start">交出是否接话</text></g>
<g class="action" data-node="routing"><rect class="box" x="32" y="460" width="200" height="100" rx="8"/><text class="node-title" x="46" y="487" text-anchor="start">端云分工</text><text class="node-subtitle" x="46" y="512" text-anchor="start">交出采用的结果</text></g>
<g class="action" data-node="planner"><rect class="box" x="266" y="460" width="200" height="100" rx="8"/><text class="node-title" x="280" y="487" text-anchor="start">Planner</text><text class="node-subtitle" x="280" y="512" text-anchor="start">交出动作清单与回答</text></g>
<g class="info" data-node="tools"><rect class="box" x="500" y="460" width="200" height="100" rx="8"/><text class="node-title" x="514" y="487" text-anchor="start">工具与记忆</text><text class="node-subtitle" x="514" y="512" text-anchor="start">交回地点与真实候选</text></g>
<g class="info" data-node="writeback"><rect class="box" x="734" y="460" width="200" height="100" rx="8"/><text class="node-title" x="748" y="487" text-anchor="start">回写</text><text class="node-subtitle" x="748" y="512" text-anchor="start">交出请求回答与执行观察</text></g>
<g class="action" data-node="tts"><rect class="box" x="968" y="460" width="200" height="100" rx="8"/><text class="node-title" x="982" y="487" text-anchor="start">TTS</text><text class="node-subtitle" x="982" y="512" text-anchor="start">交出音频供车端播放</text></g>
<text class="note" x="32" y="278" text-anchor="start">“豆包豆包”</text>
<text class="note" x="266" y="278" text-anchor="start">声音来自主驾</text>
<text class="note" x="500" y="278" text-anchor="start">“昨天那家游泳馆”</text>
<text class="note" x="734" y="278" text-anchor="start">补上“附近的餐厅”</text>
<text class="note" x="968" y="278" text-anchor="start">插话后最终接住</text>
<text class="note" x="32" y="598" text-anchor="start">副驾加热按端云规则办理</text>
<text class="note" x="266" y="598" text-anchor="start">先补齐泳馆地点</text>
<text class="note" x="500" y="598" text-anchor="start">先查泳馆，再搜餐厅</text>
<text class="note" x="734" y="598" text-anchor="start">座椅结果让云端知道</text>
<text class="note" x="968" y="598" text-anchor="start">餐厅介绍实际播到哪</text>
<text class="note" x="450" y="350" text-anchor="start">接着讲端云分工</text>
<text class="note" x="32" y="669" text-anchor="start">最后说“第二个” → Planner 读取原列表 → 取原第二家交给导航，再核对执行结果。</text>
