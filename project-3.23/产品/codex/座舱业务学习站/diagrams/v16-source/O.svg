xt x="617" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="617" dy="0">Director → 用户</tspan></text><text x="617" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="617" dy="0">可理解且对应实际状态的交互结果</tspan></text></g></a></g></svg>