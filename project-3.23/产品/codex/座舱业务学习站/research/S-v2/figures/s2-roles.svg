<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="s2-roles" width="1200" height="507" viewBox="0 0 1200 507" role="img" aria-labelledby="s2-roles-title s2-roles-desc">
<title id="s2-roles-title">一次主动服务，五个角色各接什么、交什么</title><desc id="s2-roles-desc">从主驾上车，到空调开始降温，再到下一次复查。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="s2-roles-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一次主动服务，五个角色各接什么、交什么</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">从主驾上车，到空调开始降温，再到下一次复查。</text>
<g data-node="true" id="s2-roles-trigger">
<rect class="v56-cloud" x="32" y="116" width="216" height="312" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="145" text-anchor="start">触发器</text>
<path class="v56-rule" d="M 46 162 L 234 162"/>
<text class="v56-label" x="46" y="185" text-anchor="start">收到</text>
<text class="v56-node-sub" x="46" y="210" text-anchor="start">车况变化和预设规则</text>
<text class="v56-node-sub" x="46" y="230" text-anchor="start">如主驾座位从空变为有人</text>
<path class="v56-rule" d="M 46 248 L 234 248"/>
<text class="v56-label" x="46" y="271" text-anchor="start">交出</text>
<text class="v56-node-sub" x="46" y="296" text-anchor="start">把“主驾上车”作为</text>
<text class="v56-node-sub" x="46" y="316" text-anchor="start">关注事件交给 Advisor</text>
<path class="v56-rule" d="M 46 334 L 234 334"/>
<text class="v56-label" x="46" y="357" text-anchor="start">不做</text>
<text class="v56-node-sub" x="46" y="382" text-anchor="start">不选动作，也不决定</text>
<text class="v56-node-sub" x="46" y="402" text-anchor="start">这次值不值得服务</text>
</g>
<g data-node="true" id="s2-roles-advisor">
<rect class="v56-decision" x="262" y="116" width="216" height="312" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="276" y="145" text-anchor="start">Advisor</text>
<path class="v56-rule" d="M 276 162 L 464 162"/>
<text class="v56-label" x="276" y="185" text-anchor="start">收到</text>
<text class="v56-node-sub" x="276" y="210" text-anchor="start">关注事件、车况、记忆</text>
<text class="v56-node-sub" x="276" y="230" text-anchor="start">以及用户已有任务列表</text>
<path class="v56-rule" d="M 276 248 L 464 248"/>
<text class="v56-label" x="276" y="271" text-anchor="start">交出</text>
<text class="v56-node-sub" x="276" y="296" text-anchor="start">建议含对象、动作和策略</text>
<text class="v56-node-sub" x="276" y="316" text-anchor="start">也可以没有建议</text>
<path class="v56-rule" d="M 276 334 L 464 334"/>
<text class="v56-label" x="276" y="357" text-anchor="start">不做</text>
<text class="v56-node-sub" x="276" y="382" text-anchor="start">不直接控车或说话</text>
</g>
<g data-node="true" id="s2-roles-planner">
<rect class="v56-local" x="492" y="116" width="216" height="312" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="506" y="145" text-anchor="start">Planner</text>
<path class="v56-rule" d="M 506 162 L 694 162"/>
<text class="v56-label" x="506" y="185" text-anchor="start">收到</text>
<text class="v56-node-sub" x="506" y="210" text-anchor="start">advisor 输入</text>
<text class="v56-node-sub" x="506" y="230" text-anchor="start">以及当前会话</text>
<path class="v56-rule" d="M 506 248 L 694 248"/>
<text class="v56-label" x="506" y="271" text-anchor="start">交出</text>
<text class="v56-node-sub" x="506" y="296" text-anchor="start">结合会话承接表达和执行</text>
<text class="v56-node-sub" x="506" y="316" text-anchor="start">如告知主驾、调用车控</text>
<path class="v56-rule" d="M 506 334 L 694 334"/>
<text class="v56-label" x="506" y="357" text-anchor="start">不做</text>
<text class="v56-node-sub" x="506" y="382" text-anchor="start">不凭建议创建或修改任务</text>
</g>
<g data-node="true" id="s2-roles-interface">
<rect class="v56-local" x="722" y="116" width="216" height="312" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="736" y="145" text-anchor="start">界面</text>
<path class="v56-rule" d="M 736 162 L 924 162"/>
<text class="v56-label" x="736" y="185" text-anchor="start">收到</text>
<text class="v56-node-sub" x="736" y="210" text-anchor="start">建议、按钮和执行结果</text>
<path class="v56-rule" d="M 736 248 L 924 248"/>
<text class="v56-label" x="736" y="271" text-anchor="start">交出</text>
<text class="v56-node-sub" x="736" y="296" text-anchor="start">即时卡片或 AI Bar 状态</text>
<text class="v56-node-sub" x="736" y="316" text-anchor="start">把点击回给 Planner</text>
<path class="v56-rule" d="M 736 334 L 924 334"/>
<text class="v56-label" x="736" y="357" text-anchor="start">不做</text>
<text class="v56-node-sub" x="736" y="382" text-anchor="start">不把建议显示成已完成</text>
</g>
<g data-node="true" id="s2-roles-follow">
<rect class="v56-cloud" x="952" y="116" width="216" height="312" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="966" y="145" text-anchor="start">子目标</text>
<path class="v56-rule" d="M 966 162 L 1154 162"/>
<text class="v56-label" x="966" y="185" text-anchor="start">收到</text>
<text class="v56-node-sub" x="966" y="210" text-anchor="start">Advisor 留下的短期目标</text>
<text class="v56-node-sub" x="966" y="230" text-anchor="start">如降温后转自动空调</text>
<path class="v56-rule" d="M 966 248 L 1154 248"/>
<text class="v56-label" x="966" y="271" text-anchor="start">交出</text>
<text class="v56-node-sub" x="966" y="296" text-anchor="start">复查时把目标和最新车况</text>
<text class="v56-node-sub" x="966" y="316" text-anchor="start">交回 Advisor</text>
<path class="v56-rule" d="M 966 334 L 1154 334"/>
<text class="v56-label" x="966" y="357" text-anchor="start">不做</text>
<text class="v56-node-sub" x="966" y="382" text-anchor="start">不托管用户的长期目标</text>
</g>
<path class="v56-rule" d="M 32 450 L 1168 450"/>
<rect data-decoration="true" class="v56-cloud" x="32" y="470" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="484" text-anchor="start">绿 · 机会交接与持续跟进</text>
<rect data-decoration="true" class="v56-decision" x="411" y="470" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="439" y="484" text-anchor="start">黄 · 决定是否服务和怎么服务</text>
<rect data-decoration="true" class="v56-local" x="789" y="470" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817" y="484" text-anchor="start">蓝 · 承接表达、执行和展示</text>
</svg>
