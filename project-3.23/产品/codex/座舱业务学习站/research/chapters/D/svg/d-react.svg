<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-label="主例走三轮：查记忆 → 搜餐厅 → 等用户选"><title>主例走三轮：查记忆 → 搜餐厅 → 等用户选</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="760" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">主例走三轮：查记忆 → 搜餐厅 → 等用户选</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">按 PRD 和说明书规则推演，不是一条真实日志；每一列是 DT 想的一轮</text><text x="167.5" y="112" font-size="18" fill="#1d4b35" font-weight="700" text-anchor="middle">第一轮</text><rect x="30" y="130" width="275" height="108" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="44" y="157" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">收到：明骏的话 + 背景</text><text x="44" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">记忆里没有昨天的游泳馆</text><rect x="30" y="268" width="275" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="44" y="295" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">说</text><text x="44" y="320" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“我先找找昨天</text><text x="44" y="341" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">那家游泳馆”</text><rect x="30" y="398" width="275" height="100" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="44" y="425" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">做</text><text x="44" y="450" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">查记忆：昨天去过</text><text x="44" y="471" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">的游泳馆</text><rect x="30" y="528" width="275" height="84" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="555" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">为什么</text><text x="44" y="580" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">缺能查到的事实，只做这一步</text><path d="M167.5,238 L167.5,268" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M167.5,368 L167.5,398" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M285,498 L285,515 L316.0,515 L316.0,184 L327,184" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="464.5" y="112" font-size="18" fill="#1d4b35" font-weight="700" text-anchor="middle">第二轮</text><rect x="327" y="130" width="275" height="108" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="341" y="157" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">收到：工具反馈</text><text x="341" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">昨天去的是某游泳馆，</text><text x="341" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">地址某某</text><rect x="327" y="268" width="275" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="341" y="295" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">说</text><text x="341" y="320" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">可以不说，</text><text x="341" y="341" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">或一句短过渡</text><rect x="327" y="398" width="275" height="100" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="341" y="425" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">做</text><text x="341" y="450" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">地点搜索：某游泳馆</text><text x="341" y="471" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">附近的餐厅</text><rect x="327" y="528" width="275" height="84" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="341" y="555" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">为什么</text><text x="341" y="580" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">有了中心点才能搜，保留“附近”</text><path d="M464.5,238 L464.5,268" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M464.5,368 L464.5,398" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M582,498 L582,515 L613.0,515 L613.0,184 L624,184" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="761.5" y="112" font-size="18" fill="#1d4b35" font-weight="700" text-anchor="middle">第三轮</text><rect x="624" y="130" width="275" height="108" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="638" y="157" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">收到：工具反馈</text><text x="638" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">三家餐厅的评分、距离</text><rect x="624" y="268" width="275" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="638" y="295" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">说</text><text x="638" y="320" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“第二家评分最高，</text><text x="638" y="341" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">第三家最近，去哪家？”</text><rect x="624" y="398" width="275" height="100" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="638" y="425" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">做</text><text x="638" y="450" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不做</text><rect x="624" y="528" width="275" height="84" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="638" y="555" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">为什么</text><text x="638" y="580" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">多个候选让用户选</text><path d="M761.5,238 L761.5,268" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M761.5,368 L761.5,398" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><text x="1058.5" y="112" font-size="18" fill="#1d4b35" font-weight="700" text-anchor="middle">新的一轮</text><rect x="921" y="130" width="275" height="108" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="935" y="157" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">收到：明骏说“第二家”</text><text x="935" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“第二家”靠最近几轮</text><text x="935" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">历史理解（C 章）</text><rect x="921" y="268" width="275" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="935" y="295" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">说</text><text x="935" y="320" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“好，出发”</text><rect x="921" y="398" width="275" height="100" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="935" y="425" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">做</text><text x="935" y="450" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">导航去第二家</text><rect x="921" y="528" width="275" height="84" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="935" y="555" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">为什么</text><text x="935" y="580" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户的新话，从步骤 1 开始</text><path d="M1058.5,238 L1058.5,268" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1058.5,368 L1058.5,398" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><text x="316" y="650" font-size="14" fill="#4b5560" font-weight="500" text-anchor="middle">虚线：工具结果作为“工具反馈”回到 DT，再想一轮</text><text x="30" y="690" font-size="14" fill="#22384a" font-weight="500" text-anchor="start">每一轮说了话，下一轮会等车上播完再开始；同一轮的动作同时发出，所以“查游泳馆”和“搜餐厅”不能写在同一轮。</text><text x="30" y="718" font-size="14" fill="#22384a" font-weight="500" text-anchor="start">第三轮动作清单为空：DT 只说话，等用户选。导航在用户说“第二家”之后的新一轮才发。</text></g></svg>