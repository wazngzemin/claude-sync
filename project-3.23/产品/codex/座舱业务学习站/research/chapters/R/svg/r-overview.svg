<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-label="入口与端云采信：从“豆包在什么状态”到“结果回写云端”的 8 步"><title>入口与端云采信：从“豆包在什么状态”到“结果回写云端”的 8 步</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="1180" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">入口与端云采信：从“豆包在什么状态”到“结果回写云端”的 8 步</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左列车上（端侧），右列云端；没唤醒走第 3 步，已唤醒直接到第 4 步</text><rect x="30" y="92" width="560" height="1070" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上（麦克风、本地识别、本地模型、仲裁）</text><rect x="610" y="92" width="560" height="1070" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="624" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端（座舱云服务、识别、拒识、DT）</text><rect x="50" y="130" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="152" r="12" fill="#4f7ea9"/><text x="70" y="157" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="90" y="157" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">对话状态：豆包现在怎么听</text><text x="64" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">静默 / 全时 / 激活 / 延时聆听</text><text x="64" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">决定收不收音、上不上云、显不显示字</text><rect x="50" y="260" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="282" r="12" fill="#4f7ea9"/><text x="70" y="287" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="90" y="287" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">入口：怎么进来、哪个座位在说</text><text x="64" y="312" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">唤醒词、按键、豆包+指令、直接说、主动服务</text><text x="64" y="333" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">四个音区一起收音，记下音区</text><rect x="50" y="400" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="422" r="12" fill="#4f7ea9"/><text x="70" y="427" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="90" y="427" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">没唤醒（赛力斯全时态）：车上先判断</text><text x="64" y="452" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上识别 + 流式拒识边听边判</text><text x="64" y="473" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">值得接才把声音送上云，否则悄悄丢掉</text><rect x="630" y="400" width="520" height="88" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="644" y="427" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">云端开始识别、拒识</text><text x="644" y="452" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">V 章讲过的两遍识别和拒识</text><rect x="50" y="530" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="552" r="12" fill="#4f7ea9"/><text x="70" y="557" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="90" y="557" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上算一份</text><text x="64" y="582" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">先查固定说法，再问本地 1.7B 模型</text><text x="64" y="603" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">结果：能办 / 不该接 / 办不了</text><rect x="630" y="530" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="552" r="12" fill="#4a9670"/><text x="650" y="557" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="670" y="557" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">云端算一份</text><text x="644" y="582" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">识别 → 拒识 → DT</text><text x="644" y="603" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">可能因为网络差迟迟不回</text><rect x="50" y="660" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="682" r="12" fill="#4f7ea9"/><text x="70" y="687" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="90" y="687" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">采信：用谁的结果</text><text x="64" y="712" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">赛力斯：固定说法 &gt; 云端 &gt; 车上模型</text><text x="64" y="733" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上模型只在断网或云端 3 秒没回时用</text><rect x="50" y="790" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="812" r="12" fill="#4f7ea9"/><text x="70" y="817" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="90" y="817" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">执行与提示</text><text x="64" y="842" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">执行被采用的结果；办不了时播网络异常</text><text x="64" y="863" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">超时后云端结果晚到，不再执行</text><rect x="630" y="920" width="520" height="88" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="942" r="12" fill="#4a9670"/><text x="650" y="947" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="670" y="947" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">回写：云端记下这一轮</text><text x="644" y="972" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只记被采用的车上结果</text><text x="644" y="993" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">被拒的话进情景背景，不进对话历史</text><rect x="50" y="1050" width="520" height="88" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="1072" r="12" fill="#4f7ea9"/><text x="70" y="1077" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">8</text><text x="90" y="1077" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">延时聆听 30 秒</text><text x="64" y="1102" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不用再喊名字，可以接着说</text><text x="64" y="1123" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">30 秒没有有效输入，回到第 1 步</text><path d="M310,218 L310,260" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,348 L310,400" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="331.475" y="365" width="47.05" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="355" y="381" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">没唤醒</text><path d="M570,304 L588,304 L588,574 L570,574" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="564.475" y="353" width="47.05" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="588" y="369" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">已唤醒</text><path d="M570,444 L630,444" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="582.65" y="423" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600" y="439" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">声音</text><path d="M310,488 L310,530" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="347.95" y="500" width="84.1" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="390" y="516" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">值得接，激活</text><path d="M310,618 L310,660" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="340.3" y="630" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="370" y="646" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">车上结果</text><path d="M890,618 L890,704 L570,704" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="730.3" y="683" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="760" y="699" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">云端结果</text><path d="M310,748 L310,790" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,878 L310,899 L890,899 L890,920" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="557.95" y="889" width="84.1" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600" y="905" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">同步本轮结果</text><path d="M890,1008 L890,1029 L310,1029 L310,1050" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="557.95" y="1019" width="84.1" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600" y="1035" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">下一句的背景</text><path d="M50,1094 L40,1094 L40,174 L50,174" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/></g></svg>