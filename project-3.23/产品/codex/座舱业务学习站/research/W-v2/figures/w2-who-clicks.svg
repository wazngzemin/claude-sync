<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="w2-who-clicks" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="w2-who-clicks-title w2-who-clicks-desc">
<title id="w2-who-clicks-title">对上按钮以后，谁来真正执行</title><desc id="w2-who-clicks-desc">匹配成功、按钮被选中、执行成功是三个时点；执行方随车型变化。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="w2-who-clicks-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<path class="v56-rule" d="M 32 130 L 1168 130" fill="none"/>
<path class="v56-rule" d="M 32 320 L 1168 320" fill="none"/>
<path class="v56-rule" d="M 32 520 L 1120 520" fill="none"/>
<path class="v56-arrow" d="M 500 216 L 550 216" fill="none" marker-end="url(#w2-who-clicks-arr)"/>
<path class="v56-arrow" d="M 820 216 L 870 216" fill="none" marker-end="url(#w2-who-clicks-arr)"/>
<path class="v56-arrow" d="M 500 416 L 550 416" fill="none" marker-end="url(#w2-who-clicks-arr)"/>
<path class="v56-arrow" d="M 820 416 L 870 416" fill="none" marker-end="url(#w2-who-clicks-arr)"/>
<path class="v56-arrow" d="M 685 272 L 685 304 L 1160 304 L 1160 570" fill="none"/>
<path class="v56-arrow" d="M 685 472 L 685 504 L 1160 504" fill="none"/>
<path class="v56-arrow" d="M 1160 570 L 570 570 L 570 625" fill="none" marker-end="url(#w2-who-clicks-arr)"/>
<path class="v56-arrow" d="M 1160 570 L 930 570 L 930 625" fill="none" marker-end="url(#w2-who-clicks-arr)"/>
<g data-node="true" data-key="saic-match">
<rect class="v56-decision" x="230" y="160" width="270" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="244" y="187" text-anchor="start">① 匹配成功</text>
<text class="v56-node-sub" x="244" y="212" text-anchor="start">上汽由车企负责页面解析</text>
<text class="v56-node-sub" x="244" y="233" text-anchor="start">匹配器交出指令与元素 ID</text>
</g>
<g data-node="true" data-key="saic-select">
<rect class="v56-decision" x="550" y="160" width="270" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="564" y="187" text-anchor="start">② 按钮被选中</text>
<text class="v56-node-sub" x="564" y="212" text-anchor="start">控件目标：无障碍执行</text>
<text class="v56-node-sub" x="564" y="233" text-anchor="start">抖音目标：业务执行链路</text>
</g>
<g data-node="true" data-key="saic-success">
<rect class="v56-local" x="870" y="160" width="258" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="884" y="187" text-anchor="start">③ 执行成功</text>
<text class="v56-node-sub" x="884" y="212" text-anchor="start">车企或业务执行方完成操作</text>
<text class="v56-node-sub" x="884" y="233" text-anchor="start">页面或播放状态实际改变</text>
</g>
<g data-node="true" data-key="chery-match">
<rect class="v56-decision" x="230" y="360" width="270" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="244" y="387" text-anchor="start">① 匹配成功</text>
<text class="v56-node-sub" x="244" y="412" text-anchor="start">奇瑞由独立 SDK 整套承接</text>
<text class="v56-node-sub" x="244" y="433" text-anchor="start">交出指令与元素 ID</text>
</g>
<g data-node="true" data-key="chery-select">
<rect class="v56-decision" x="550" y="360" width="270" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="564" y="387" text-anchor="start">② 按钮被选中</text>
<text class="v56-node-sub" x="564" y="412" text-anchor="start">SDK 选定操作目标</text>
<text class="v56-node-sub" x="564" y="433" text-anchor="start">按目标调用对应执行链路</text>
</g>
<g data-node="true" data-key="chery-success">
<rect class="v56-local" x="870" y="360" width="258" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="884" y="387" text-anchor="start">③ 执行成功</text>
<text class="v56-node-sub" x="884" y="412" text-anchor="start">SDK 承接最终执行</text>
<text class="v56-node-sub" x="884" y="433" text-anchor="start">页面或播放状态实际改变</text>
</g>
<g data-node="true" data-key="voice-fail">
<rect class="v56-reject" x="430" y="625" width="280" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="652" text-anchor="start">语音触发失败</text>
<text class="v56-node-sub" x="444" y="677" text-anchor="start">由豆包统一播报</text>
</g>
<g data-node="true" data-key="ui-fail">
<rect class="v56-reject" x="790" y="625" width="280" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="804" y="652" text-anchor="start">纯界面失败</text>
<text class="v56-node-sub" x="804" y="677" text-anchor="start">用 toast 提示</text>
</g>
<rect data-legend="true" class="v56-decision" x="32" y="795" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-local" x="340" y="795" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-reject" x="680" y="795" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-title" x="32" y="44" text-anchor="start">对上按钮以后，谁来真正执行</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">匹配成功、按钮被选中、执行成功是三个时点；执行方随车型变化。</text>
<text class="v56-node-title" x="32" y="197" text-anchor="start">车企或业务方</text>
<text class="v56-node-sub" x="32" y="225" text-anchor="start">上汽：车企承接</text>
<text class="v56-node-title" x="32" y="397" text-anchor="start">豆包 SDK</text>
<text class="v56-node-sub" x="32" y="425" text-anchor="start">奇瑞：独立 SDK</text>
<text class="v56-label" x="710" y="296" text-anchor="start">执行失败</text>
<text class="v56-label" x="710" y="496" text-anchor="start">执行失败</text>
<text class="v56-label" x="32" y="573" text-anchor="start">按触发方式反馈失败</text>
<text class="v56-subtitle" x="32" y="757" text-anchor="start">执行结果还包括：失败、未登录、不支持、网络异常。</text>
<text class="v56-subtitle" x="60" y="809" text-anchor="start">黄：匹配与选择</text>
<text class="v56-subtitle" x="368" y="809" text-anchor="start">蓝：实际执行成功</text>
<text class="v56-subtitle" x="708" y="809" text-anchor="start">红：失败反馈</text>
</svg>
