<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="l2-overview" width="1200" height="776" viewBox="0 0 1200 776" role="img" aria-labelledby="l2-overview-title l2-overview-desc">
<title id="l2-overview-title">一阵浓雾，怎样走到后雾灯亮起</title><desc id="l2-overview-desc">赛力斯主驾驶入浓雾，沿一次天气路况保护看谁负责每一步。识别次数和车速为可标定设计值。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="l2-overview-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一阵浓雾，怎样走到后雾灯亮起</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">赛力斯主驾驶入浓雾，沿一次天气路况保护看谁负责每一步。识别次数和车速为可标定设计值。</text>
<rect data-decoration="true" class="v56-neutral v56-pending" x="40" y="105" width="1120" height="42" rx="8" stroke-width="1.6"/>
<text class="v56-label" x="54" y="131.0" text-anchor="start">本地闭环 · 全程由车端完成，Planner 和云端在链路之外。</text>
<g data-node="true" id="l2-overview-observe">
<rect class="v56-local" x="40" y="171" width="326" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="199" text-anchor="start">01 · 车外视觉持续看</text>
<text class="v56-node-sub" x="54" y="227" text-anchor="start">舱外常驻观察</text>
<text class="v56-node-sub" x="54" y="251" text-anchor="start">约 3 秒一轮</text>
</g>
<g data-node="true" id="l2-overview-identify">
<rect class="v56-local" x="437" y="171" width="326" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="451" y="199" text-anchor="start">02 · 连续 2 次识别到浓雾</text>
<text class="v56-node-sub" x="451" y="227" text-anchor="start">舱外视觉交出浓雾标签</text>
</g>
<path class="v56-arrow" d="M 366 230 L 437 230" marker-end="url(#l2-overview-arr)"/>
<g data-node="true" id="l2-overview-judge">
<rect class="v56-decision" x="834" y="171" width="326" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="848" y="199" text-anchor="start">03 · 端侧触发器判断</text>
<text class="v56-node-sub" x="848" y="227" text-anchor="start">核对车速高于 30 公里每小时</text>
<text class="v56-node-sub" x="848" y="251" text-anchor="start">任务开启、后雾灯关闭</text>
</g>
<path class="v56-arrow" d="M 763 230 L 834 230" marker-end="url(#l2-overview-arr)"/>
<g data-node="true" id="l2-overview-event">
<rect class="v56-cloud" x="834" y="337" width="326" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="848" y="365" text-anchor="start">04 · 交出本地业务事件</text>
<text class="v56-node-sub" x="848" y="393" text-anchor="start">把本次命中和开灯建议</text>
<text class="v56-node-sub" x="848" y="417" text-anchor="start">交给天气业务</text>
</g>
<path class="v56-arrow" d="M 997 289 L 997 337" marker-end="url(#l2-overview-arr)"/>
<g data-node="true" id="l2-overview-ask">
<rect class="v56-cloud" x="437" y="337" width="326" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="451" y="365" text-anchor="start">05 · 天气业务拉卡、播报</text>
<text class="v56-node-sub" x="451" y="393" text-anchor="start">即时卡片问主驾</text>
<text class="v56-node-sub" x="451" y="417" text-anchor="start">“要不要打开后雾灯？”</text>
</g>
<path class="v56-arrow" d="M 834 396 L 763 396" marker-end="url(#l2-overview-arr)"/>
<g data-node="true" id="l2-overview-confirm">
<rect class="v56-local" x="40" y="337" width="326" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="365" text-anchor="start">06 · 主驾确认</text>
<text class="v56-node-sub" x="54" y="393" text-anchor="start">点“打开”或本地语音说“打开”</text>
<text class="v56-node-sub" x="54" y="417" text-anchor="start">即时卡片把同意回给天气业务</text>
</g>
<path class="v56-arrow" d="M 437 396 L 366 396" marker-end="url(#l2-overview-arr)"/>
<g data-node="true" id="l2-overview-recheck">
<rect class="v56-decision" x="40" y="503" width="326" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="531" text-anchor="start">07 · 天气业务复核车况</text>
<text class="v56-node-sub" x="54" y="559" text-anchor="start">核对当前卡片与同意</text>
<text class="v56-node-sub" x="54" y="583" text-anchor="start">重新读取车况</text>
</g>
<path class="v56-arrow" d="M 203 455 L 203 503" marker-end="url(#l2-overview-arr)"/>
<g data-node="true" id="l2-overview-execute">
<rect class="v56-cloud" x="437" y="503" width="326" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="451" y="531" text-anchor="start">08 · 车控开后雾灯</text>
<text class="v56-node-sub" x="451" y="559" text-anchor="start">天气业务交车控执行</text>
</g>
<path class="v56-arrow" d="M 366 562 L 437 562" marker-end="url(#l2-overview-arr)"/>
<g data-node="true" id="l2-overview-readback">
<rect class="v56-cloud" x="834" y="503" width="326" height="118" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="848" y="531" text-anchor="start">09 · 车控读回结果</text>
<text class="v56-node-sub" x="848" y="559" text-anchor="start">读取后雾灯实际状态</text>
<text class="v56-node-sub" x="848" y="583" text-anchor="start">天气业务把结果交给卡片</text>
</g>
<path class="v56-arrow" d="M 763 562 L 834 562" marker-end="url(#l2-overview-arr)"/>
<path class="v56-rule" d="M 32 664 L 1168 664"/>
<text class="v56-node-title" x="32" y="698" text-anchor="start">车上看、车上判断、车上问、车上做。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="724" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="738" text-anchor="start">蓝：视觉输入与主驾选择</text>
<rect data-decoration="true" class="v56-decision" x="316.0" y="724" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="738" text-anchor="start">黄：规则判断与复核</text>
<rect data-decoration="true" class="v56-cloud" x="600.0" y="724" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="738" text-anchor="start">绿：业务交接与车控</text>
<rect data-decoration="true" class="v56-neutral v56-pending" x="884.0" y="724" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="738" text-anchor="start">灰虚线：本地闭环范围</text>
</svg>
