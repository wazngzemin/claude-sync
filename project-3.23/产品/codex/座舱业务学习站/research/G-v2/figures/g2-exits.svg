<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="g2-exits" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="g2-exits-title g2-exits-desc">
<title id="g2-exits-title">五种出口，五种需要核对的成功结果</title><desc id="g2-exits-desc">条件成立、频控放行，只说明可以交出去；出口接收与用户真正收到，要分层核对。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="g2-exits-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">五种出口，五种需要核对的成功结果</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">条件成立、频控放行，只说明可以交出去；出口接收与用户真正收到，要分层核对。</text>
<g data-node="true" id="g2-exits-trigger"><rect class="v56-cloud" x="40" y="390" width="220" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="418" text-anchor="start">触发器放行</text>
<text class="v56-node-sub" x="54" y="446" text-anchor="start">条件成立 + 频控通过</text>
<text class="v56-node-sub" x="54" y="470" text-anchor="start">按登记关系选择出口</text>
<text class="v56-node-sub" x="54" y="494" text-anchor="start">自己不说话、不控车</text>
</g>
<g data-node="true" id="g2-exits-task"><rect class="v56-cloud" x="350" y="120" width="810" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="364" y="148" text-anchor="start">回调任务服务</text>
<text class="v56-node-sub" x="364" y="176" text-anchor="start">成功＝任务服务接收；带任务编号、回调编号</text>
<text class="v56-node-sub" x="364" y="200" text-anchor="start">后面生成一次运行、回到 Planner，接 T 章</text>
</g>
<g data-node="true" id="g2-exits-advisor"><rect class="v56-decision" x="350" y="270" width="810" height="150" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="364" y="298" text-anchor="start">静态 Advisor</text>
<text class="v56-node-sub" x="364" y="326" text-anchor="start">出口接收后，继续看是否出了建议；没建议可以是正常静默</text>
<text class="v56-node-sub" x="364" y="350" text-anchor="start">建议下发前，再查登录账号一致、对话和播报已经结束</text>
<text class="v56-node-sub" x="364" y="374" text-anchor="start">也可能被新请求替换；“命中”与“最终推送”是两道门</text>
</g>
<g data-node="true" id="g2-exits-event"><rect class="v56-cloud" x="350" y="460" width="810" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="364" y="488" text-anchor="start">事件日志</text>
<text class="v56-node-sub" x="364" y="516" text-anchor="start">成功＝事件服务入库；通知订阅方另算</text>
<text class="v56-node-sub" x="364" y="540" text-anchor="start">只有配置了“生成事件日志”动作，命中后才生成</text>
</g>
<g data-node="true" id="g2-exits-third"><rect class="v56-cloud" x="350" y="610" width="810" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="364" y="638" text-anchor="start">第三方回调</text>
<text class="v56-node-sub" x="364" y="666" text-anchor="start">成功＝对方已经接收</text>
<text class="v56-node-sub" x="364" y="690" text-anchor="start">后面做没做到，继续看对方回执</text>
</g>
<g data-node="true" id="g2-exits-flash"><rect class="v56-local v56-pending" x="350" y="760" width="810" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="364" y="788" text-anchor="start">闪念通知卡</text>
<text class="v56-node-sub" x="364" y="816" text-anchor="start">成功＝车端真实展示；不进 Planner、不播语音</text>
<text class="v56-node-sub" x="364" y="840" text-anchor="start">改造设计，展示结果由车端反馈</text>
</g>
<path class="v56-arrow" d="M 260 460 L 300 460"/>
<path class="v56-arrow" d="M 300 175 L 300 815"/>
<path class="v56-arrow" d="M 300 175 L 350 175" marker-end="url(#g2-exits-arr)"/>
<path class="v56-arrow" d="M 300 345 L 350 345" marker-end="url(#g2-exits-arr)"/>
<path class="v56-arrow" d="M 300 515 L 350 515" marker-end="url(#g2-exits-arr)"/>
<path class="v56-arrow" d="M 300 665 L 350 665" marker-end="url(#g2-exits-arr)"/>
<path class="v56-arrow v56-pending" d="M 300 815 L 350 815" marker-end="url(#g2-exits-arr)"/>
<text class="v56-label" x="40" y="920" text-anchor="start">涉及 Planner 的链路，结果还要继续往后核对；其他出口按各自业务回执判断。</text>
<text class="v56-node-title" x="40" y="967" text-anchor="start">出口接收</text>
<text class="v56-node-title" x="340" y="967" text-anchor="start">Planner 收到</text>
<text class="v56-node-title" x="640" y="967" text-anchor="start">说出来 / 做到</text>
<text class="v56-node-title" x="950" y="967" text-anchor="start">用户感知</text>
<path class="v56-arrow" d="M 180 960 L 280 960" marker-end="url(#g2-exits-arr)"/>
<path class="v56-arrow" d="M 500 960 L 600 960" marker-end="url(#g2-exits-arr)"/>
<path class="v56-arrow" d="M 810 960 L 910 960" marker-end="url(#g2-exits-arr)"/>
<path class="v56-rule" d="M 32 1000 L 1168 1000"/>
<text class="v56-node-title" x="32" y="1034" text-anchor="start">越往后，越需要下游回执；命中也不等于用户已经授权。</text>
<rect data-decoration="true" class="v56-cloud" x="32.0" y="1060" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1074" text-anchor="start">绿：回调与事件记录</text>
<rect data-decoration="true" class="v56-decision" x="410.6666666666667" y="1060" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="1074" text-anchor="start">黄：建议生成与下发检查</text>
<rect data-decoration="true" class="v56-local v56-pending" x="789.3333333333334" y="1060" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="1074" text-anchor="start">蓝虚线：通知卡改造设计</text>
</svg>
