<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="s2-delivery" width="1200" height="644" viewBox="0 0 1200 644" role="img" aria-labelledby="s2-delivery-title s2-delivery-desc">
<title id="s2-delivery-title">建议已经生成，怎样交到用户面前</title><desc id="s2-delivery-desc">沿即时卡片和 AI Bar 这条路径，看建议通过哪些检查，也看它会停在哪里。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="s2-delivery-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">建议已经生成，怎样交到用户面前</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">沿即时卡片和 AI Bar 这条路径，看建议通过哪些检查，也看它会停在哪里。</text>
<path class="v56-arrow" d="M 360 170 L 432 170" marker-end="url(#s2-delivery-arr)"/>
<path class="v56-arrow" d="M 592 222 L 592 280" marker-end="url(#s2-delivery-arr)"/>
<path class="v56-arrow" d="M 432 336 L 360 336" marker-end="url(#s2-delivery-arr)"/>
<path class="v56-arrow" d="M 200 392 L 200 456" marker-end="url(#s2-delivery-arr)"/>
<path class="v56-arrow" d="M 360 512 L 432 512" marker-end="url(#s2-delivery-arr)"/>
<path class="v56-arrow" d="M 752 168 L 795 168"/>
<path class="v56-arrow" d="M 795 158 L 795 364"/>
<path class="v56-arrow" d="M 795 158 L 838 158" marker-end="url(#s2-delivery-arr)"/>
<path class="v56-arrow" d="M 795 261 L 838 261" marker-end="url(#s2-delivery-arr)"/>
<path class="v56-arrow" d="M 795 364 L 838 364" marker-end="url(#s2-delivery-arr)"/>
<g data-node="true" id="s2-delivery-candidate">
<rect class="v56-cloud" x="40" y="118" width="320" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="146" text-anchor="start">01 · Advisor 生成建议</text>
<text class="v56-node-sub" x="54" y="172" text-anchor="start">建议为主驾开极速制冷</text>
<text class="v56-node-sub" x="54" y="194" text-anchor="start">带上服务对象和服务策略</text>
</g>
<g data-node="true" id="s2-delivery-timing">
<rect class="v56-decision" x="432" y="118" width="320" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="446" y="146" text-anchor="start">02 · 下发前时机校验</text>
<text class="v56-node-sub" x="446" y="172" text-anchor="start">核对车辆、账号和当前会话</text>
<text class="v56-node-sub" x="446" y="194" text-anchor="start">检查建议是否被新请求替换</text>
</g>
<g data-node="true" id="s2-delivery-number">
<rect class="v56-cloud" x="432" y="280" width="320" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="446" y="308" text-anchor="start">03 · 关联推荐编号</text>
<text class="v56-node-sub" x="446" y="334" text-anchor="start">让云端建议和车上展示、点击对上</text>
<text class="v56-node-sub" x="446" y="356" text-anchor="start">关联过期，点击也接不回原建议</text>
</g>
<g data-node="true" id="s2-delivery-car">
<rect class="v56-local" x="40" y="280" width="320" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="308" text-anchor="start">04 · 车端接收建议</text>
<text class="v56-node-sub" x="54" y="334" text-anchor="start">带上推荐编号交给 Planner</text>
<text class="v56-node-sub" x="54" y="356" text-anchor="start">用户点击后能接回这次服务</text>
</g>
<g data-node="true" id="s2-delivery-planner">
<rect class="v56-local" x="40" y="456" width="320" height="114" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="484" text-anchor="start">05 · Planner 承接建议</text>
<text class="v56-node-sub" x="54" y="510" text-anchor="start">把 advisor 输入当作建议，可只采纳部分</text>
<text class="v56-node-sub" x="54" y="532" text-anchor="start">结合当前会话表达或执行</text>
<text class="v56-node-sub" x="54" y="554" text-anchor="start">不凭建议创建或修改任务</text>
</g>
<g data-node="true" id="s2-delivery-surface">
<rect class="v56-local" x="432" y="456" width="320" height="114" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="446" y="484" text-anchor="start">06 · 即时卡片和 AI Bar</text>
<text class="v56-node-sub" x="446" y="510" text-anchor="start">即时卡片承接告知或确认</text>
<text class="v56-node-sub" x="446" y="532" text-anchor="start">AI Bar 可显示建议和真实执行结果</text>
</g>
<g data-node="true" id="s2-delivery-replaced">
<rect class="v56-reject" x="838" y="118" width="322" height="80" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="852" y="141" text-anchor="start">被替换</text>
<text class="v56-node-sub" x="852" y="162" text-anchor="start">新请求已经替换这条建议，放弃且不补发</text>
</g>
<g data-node="true" id="s2-delivery-account">
<rect class="v56-reject" x="838" y="221" width="322" height="80" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="852" y="244" text-anchor="start">账号不一致</text>
<text class="v56-node-sub" x="852" y="265" text-anchor="start">账号或车辆对不上，停止下发</text>
</g>
<g data-node="true" id="s2-delivery-session">
<rect class="v56-reject" x="838" y="324" width="322" height="80" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="852" y="347" text-anchor="start">正在对话</text>
<text class="v56-node-sub" x="852" y="368" text-anchor="start">当前有对话或播报，此刻不下发</text>
</g>
<text class="v56-label" x="396" y="159" text-anchor="middle">送车前</text>
<text class="v56-label" x="604" y="255" text-anchor="start">时机合适</text>
<text class="v56-label" x="396" y="325" text-anchor="middle">带编号</text>
<text class="v56-label" x="212" y="427" text-anchor="start">advisor 输入</text>
<text class="v56-label" x="396" y="501" text-anchor="middle">按策略</text>
<text class="v56-risk" x="838" y="104" text-anchor="start">三个下发停点</text>
<path class="v56-rule" d="M 32 588 L 1168 588"/>
<rect data-decoration="true" class="v56-cloud" x="32" y="608" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="622" text-anchor="start">绿 · 建议准备与编号关联</text>
<rect data-decoration="true" class="v56-decision" x="316" y="608" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344" y="622" text-anchor="start">黄 · 检查下发时机</text>
<rect data-decoration="true" class="v56-local" x="600" y="608" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628" y="622" text-anchor="start">蓝 · 车端承接与呈现</text>
<rect data-decoration="true" class="v56-reject" x="884" y="608" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912" y="622" text-anchor="start">红 · 建议停在下发前</text>
</svg>
