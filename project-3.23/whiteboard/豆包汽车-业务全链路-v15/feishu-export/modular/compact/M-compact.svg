990,612" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,612 460,612" fill="none" stroke="white" stroke-width="7"/><polyline points="590,612 460,612" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,736 790,866" fill="none" stroke="white" stroke-width="7"/><polyline points="790,736 790,866" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="460,612 479.1578947368421,612 479.1578947368421,975 460,975" fill="none" stroke="white" stroke-width="7"/><polyline points="460,612 479.1578947368421,612 479.1578947368421,975 460,975" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="260,1084 260,1099.8260869565217 1320,1099.8260869565217 1320,1084" fill="none" stroke="white" stroke-width="7"/><polyline points="260,1084 260,1099.8260869565217 1320,1099.8260869565217 1320,1084" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,975 1120,975" fill="none" stroke="white" stroke-width="7"/><polyline points="990,975 1120,975" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,1214 1320,1084" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,1214 1320,1084" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1120,1323 990,1323" fill="none" stroke="white" stroke-width="7"/><polyline points="1120,1323 990,1323" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,1214 790,1198.1739130434783 1100.842105263158,1198.1739130434783 1100.842105263158,975 1120,975" fill="none" stroke="white" stroke-width="7"/><polyline points="790,1214 790,1198.1739130434783 1100.842105263158,1198.1739130434783 1100.842105263158,975 1120,975" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,249 570.8421052631579,249 570.8421052631579,1198.1739130434783 260,1198.1739130434783 260,1214" fill="none" stroke="white" stroke-width="7"/><polyline points="590,249 570.8421052631579,249 570.8421052631579,1198.1739130434783 260,1198.1739130434783 260,1214" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="260,1214 260,1117.9130434782608 790,1117.9130434782608 790,1084" fill="none" stroke="white" stroke-width="7"/><polyline points="260,1214 260,1117.9130434782608 790,1117.9130434782608 790,1084" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><rect x="60" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M1</text><text x="80" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">接住四类输入，保留来处</text><text x="80" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">用户 query：这次要做什么</text><text x="80" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">advice：主动服务或任务建议</text><text x="80" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">feedback：真实工具返回</text><text x="80" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">event：打断等已发生事件</text><rect x="590" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M2</text><text x="610" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">核对正在算、正在说、已在做</text><text x="610" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">模型仍在生成还是已交结果</text><text x="610" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">声音是否真正从车内播出</text><text x="610" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">工具是否已经发出副作用</text><text x="610" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不要只用“首字到了”判断</text><rect x="1120" y="140" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="1140" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M3</text><text x="1140" y="202" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">前台是否空闲，能否直接接入</text><text x="1140" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">没有候选计算、没有承诺输出</text><text x="1140" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">空闲：按队列取下一条输入</text><text x="1140" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">后台任务继续不等于前台忙</text><text x="1140" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">同车同会话的状态隔离</text><rect x="1120" y="488" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="1140" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M4</text><text x="1140" y="550" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">可重算吗：先看工具是否发出</text><text x="1140" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">未发布动作：可取消旧候选</text><text x="1140" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">已发布动作：旧请求不能重放</text><text x="1140" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">新旧输入合并须按输入类型</text><text x="1140" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">P1 合并边界存在文档冲突</text><rect x="590" y="488" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="610" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M5</text><text x="610" y="550" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">谁插入：用户优先，</text><text x="610" y="580" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">普通消息排队</text><text x="610" y="619" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">用户新话 P0：打断处理</text><text x="610" y="645" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">普通建议、事件 P1：按策略等</text><text x="610" y="671" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">同步整批 feedback 单独接入</text><text x="610" y="697" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">高优 advice 暂无实际类型</text><rect x="60" y="488" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M6</text><text x="80" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">取消推理和声音，</text><text x="80" y="580" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">不抹掉已做的事</text><text x="80" y="619" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">保留已播、未播、已下发事实</text><text x="80" y="645" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">只撤销对应 request 的输入</text><text x="80" y="671" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">已执行车控不会自动回滚</text><text x="80" y="697" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">旧反馈仍需关联原调用接收</text><rect x="60" y="866" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="894" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M7</text><text x="80" y="928" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">组成这一轮输入，生成有效身份</text><text x="80" y="967" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">保留原 request 与输入来历</text><text x="80" y="993" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">新执行生成独立轮次标识</text><text x="80" y="1019" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">旧轮不能写入新轮输出</text><text x="80" y="1045" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">依赖工具结果不可凭空补齐</text><rect x="590" y="866" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="894" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M8</text><text x="610" y="928" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">普通输入等待，避免重复和串单</text><text x="610" y="967" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">建议/事件按合并规则等待</text><text x="610" y="993" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">完整工具批次不随意混入</text><text x="610" y="1019" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">TaskRun、tool_call 去重</text><text x="610" y="1045" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">队列满载和过期规则待核</text><rect x="1120" y="866" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="1140" y="894" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M9</text><text x="1140" y="928" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">发计算许可，再看输出许可</text><text x="1140" y="967" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">可先算下一轮，不等于可说</text><text x="1140" y="993" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">前轮播报中可保留候选结果</text><text x="1140" y="1019" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">允许外显后才播报/发新动作</text><text x="1140" y="1045" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">具体能力受新链路开关控制</text><rect x="1120" y="1214" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="1242" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M10</text><text x="1140" y="1276" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">客户端报告真实播放进度</text><text x="1140" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">STARTED：已实际出声</text><text x="1140" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">PROGRESS：真实播放位置</text><text x="1140" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">FINISHED：轮结束且队列清空</text><text x="1140" y="1393" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">ABORTED：本播放实例已终止</text><rect x="590" y="1214" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="1242" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M11</text><text x="610" y="1276" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">等不到终态：解锁但不伪造成功</text><text x="610" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">软期限：播放完成未确认</text><text x="610" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">硬期限：播放状态超时</text><text x="610" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">释放队列不等于已经播完</text><text x="610" y="1393" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">重报幂等，旧轮不可推进新轮</text><rect x="60" y="1214" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="1242" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">M12</text><text x="80" y="1276" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">故障恢复先防重复副作用</text><text x="80" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">持久化/原子写失败不绕过准入</text><text x="80" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">租约过期先恢复合法持有者</text><text x="80" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">已发工具的旧请求不重跑</text><text x="80" y="1393" font-size="20" font-weight="500" fill="#163352" xml:space="preserve"