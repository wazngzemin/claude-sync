<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2010" viewBox="0 0 1660 2010">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="2010" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">Case 1  身份感知补引导</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">身份资格确认后再邀请注册；告知与成功注册分别记录</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户聊到称呼、偏好或希望被记住</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">例如：以后叫我小王，我喜欢吃川菜</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">先识别当前说话人与账号的关联</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">原场景的身份资格是否可确认？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">有提车时跳过注册记录，当前仍未注册</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不能用未注册代替跳过注册</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">不满足／缺少证据</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不命中原表补引导</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">必要工具处理继续</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">成立</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">该账号是否仍需身份能力引导？</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">检查实际使用、告知次数与明确拒绝</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">按功能档案抑制重复</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">无需引导／未知</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不再自动介绍</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">原用户诉求继续</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">需要</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 给 DT 身份引导指引</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">结合当前诉求介绍注册作用</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">提供适用的轻量卡片内容</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="997" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 回应用户并询问是否愿意注册</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">说明需要看哪里、说什么</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">交互步骤以车型注册能力为准</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1200" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户是否明确同意？</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">同意后再进入身份注册</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">主动请求注册也走正常功能流程</text><line x1="1020" y1="1268.0" x2="1186" y2="1268.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1255.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否</text><rect x="1190" y="1200" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1240" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">拒绝／稍后</text><text x="1218" y="1278" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">停止当轮注册</text><text x="1218" y="1309" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">记录拒绝的范围</text><line x1="560.0" y1="1338" x2="560.0" y2="1399" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1376.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">同意</text><rect x="100" y="1403" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1443" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 调用身份注册能力</text><text x="128" y="1481" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">工具返回真实 tool_feedback</text><text x="128" y="1512" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">成功前不声称已经注册</text><line x1="560.0" y1="1541" x2="560.0" y2="1602" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1606" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1646" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">注册是否成功？</text><text x="128" y="1684" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">依据工具业务结果判断</text><text x="128" y="1715" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">失败不等于已经使用</text><line x1="1020" y1="1674.0" x2="1186" y2="1674.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1661.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="1606" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1646" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">失败／结果未知</text><text x="1218" y="1684" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">如实回应并记录</text><text x="1218" y="1715" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不连续自动重试</text><line x1="560.0" y1="1744" x2="560.0" y2="1805" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1782.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">成功</text><rect x="100" y="1809" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1849" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 分别记录告知与注册结果</text><text x="128" y="1887" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">成功使用后停止重复补注册引导</text><text x="128" y="1918" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">注册成功后继续处理用户原请求</text>
</svg>