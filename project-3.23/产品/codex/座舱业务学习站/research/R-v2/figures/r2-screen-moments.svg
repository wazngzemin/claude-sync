<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="r2-screen-moments" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="r2-screen-moments-title r2-screen-moments-desc">
<title id="r2-screen-moments-title">屏幕跟着实际生效结果走</title><desc id="r2-screen-moments-desc">激活态先显示过程文字；之后按采用的结果、最终拒识或工具执行状态，显示对应内容。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="r2-screen-moments-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">屏幕跟着实际生效结果走</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">激活态先显示过程文字；之后按采用的结果、最终拒识或工具执行状态，显示对应内容。</text>
<text class="v56-node-title" x="32" y="150" text-anchor="start">1 · 边说边出字</text>
<text class="v56-subtitle" x="32" y="180" text-anchor="start">激活态</text>
<g data-node="true">
<rect class="v56-neutral" x="32" y="244" width="248" height="72" rx="8" stroke-width="1.6"/>
<text class="v56-node-sub" x="46" y="286" text-anchor="start" data-fit="true">帮我把副驾…</text>
</g>
<text class="v56-node-sub" x="32" y="365" text-anchor="start">显示过程文字</text>
<text class="v56-node-sub" x="32" y="390" text-anchor="start">只在激活态逐字上屏</text>
<text class="v56-node-title" x="328" y="150" text-anchor="start">2 · 最终文字刷新</text>
<text class="v56-subtitle" x="328" y="180" text-anchor="start">按实际采用的一边</text>
<g data-node="true">
<rect class="v56-cloud" x="328" y="244" width="248" height="72" rx="8" stroke-width="1.6"/>
<text class="v56-node-sub" x="342" y="286" text-anchor="start" data-fit="true">帮我把副驾座椅加热打开</text>
</g>
<text class="v56-node-sub" x="328" y="365" text-anchor="start">示例：采用云端</text>
<text class="v56-node-sub" x="328" y="390" text-anchor="start">显示云端识别的定稿</text>
<text class="v56-node-title" x="624" y="150" text-anchor="start">3 · 被最终拒识</text>
<text class="v56-subtitle" x="624" y="180" text-anchor="start">这句话不接</text>
<g data-node="true">
<rect class="v56-reject" x="624" y="244" width="248" height="72" rx="8" stroke-width="1.6"/>
</g>
<text class="v56-node-sub" x="624" y="365" text-anchor="start">胶囊已清空</text>
<text class="v56-node-sub" x="624" y="390" text-anchor="start">不保留这句话的上屏文字</text>
<text class="v56-node-title" x="920" y="150" text-anchor="start">4 · 工具执行中</text>
<text class="v56-subtitle" x="920" y="180" text-anchor="start">让用户知道正在办理</text>
<g data-node="true">
<rect class="v56-decision" x="920" y="244" width="248" height="72" rx="8" stroke-width="1.6"/>
<text class="v56-node-sub" x="934" y="286" text-anchor="start" data-fit="true">正在打开副驾座椅加热…</text>
</g>
<text class="v56-node-sub" x="920" y="365" text-anchor="start">显示等待文案</text>
<text class="v56-node-sub" x="920" y="390" text-anchor="start">等待工具返回实际结果</text>
<path class="v56-rule" d="M 304 128 L 304 420" fill="none"/>
<path class="v56-rule" d="M 600 128 L 600 420" fill="none"/>
<path class="v56-rule" d="M 896 128 L 896 420" fill="none"/>
<text class="v56-subtitle" x="32" y="467" text-anchor="start">四种显示情形：最终拒识与工具执行属于不同分支，不是拒识后继续执行。</text>
<text class="v56-subtitle" x="32" y="498" text-anchor="start">全时聆听未激活时不逐字上屏，接话后才显示整句；四个音区共用左右两个胶囊。</text>
<rect class="v56-neutral" x="32" y="582" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="596" text-anchor="start">灰：过程文字</text>
<rect class="v56-cloud" x="292" y="582" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="320" y="596" text-anchor="start">绿：采用侧定稿</text>
<rect class="v56-reject" x="552" y="582" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="580" y="596" text-anchor="start">红：拒识清空</text>
<rect class="v56-decision" x="812" y="582" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="840" y="596" text-anchor="start">黄：工具等待</text>
</svg>
