<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <text x="40" y="30" font-size="20" font-weight="bold" fill="#222">N11｜Advisor Creator、动态 Advisor 与 Goals：四类静态 + 一类动态 + 条件任务通道</text>

  <!-- Legend -->
  <rect x="1060" y="44" width="310" height="110" fill="#FFFFFF" stroke="#999999" stroke-width="1" rx="6"/>
  <text x="1072" y="62" font-size="12" font-weight="bold" fill="#333">图例</text>
  <rect x="1072" y="70" width="14" height="10" fill="#E3EEFB" stroke="#4A90D9"/><text x="1092" y="79" font-size="11" fill="#333">蓝=普通处理</text>
  <rect x="1190" y="70" width="14" height="10" fill="#FBF0D0" stroke="#D9A93A"/><text x="1210" y="79" font-size="11" fill="#333">金=判断关卡</text>
  <rect x="1072" y="88" width="14" height="10" fill="#E2F2E4" stroke="#4CAF50"/><text x="1092" y="97" font-size="11" fill="#333">绿=交出结果</text>
  <rect x="1190" y="88" width="14" height="10" fill="#F0F0F0" stroke="#999999"/><text x="1210" y="97" font-size="11" fill="#333">灰=待核/边界</text>
  <line x1="1072" y1="112" x2="1086" y2="112" stroke="#4A90D9" stroke-width="2.5"/><text x="1092" y="116" font-size="11" fill="#333">蓝粗=请求主链</text>
  <line x1="1190" y1="112" x2="1204" y2="112" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3"/><text x="1210" y="116" font-size="11" fill="#333">灰虚线=职责引用</text>
  <text x="1072" y="138" font-size="10" fill="#666">角标：绿=已落地 金=2.6目标 灰=待核</text>

  <!-- Row1: static + dynamic module boxes -->
  <rect x="30" y="70" width="640" height="120" fill="#FAFAFA" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
  <text x="44" y="92" font-size="13" font-weight="bold" fill="#444">① 四类静态 Advisor（注册即生效，【已落地】）</text>
  <g font-size="10.5" fill="#222">
    <rect x="44" y="104" width="140" height="30" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="52" y="123">舒适：空调/座椅/氛围灯</text>
    <rect x="194" y="104" width="140" height="30" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="202" y="123">出行：导航/沿途/路线</text>
    <rect x="344" y="104" width="140" height="30" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="352" y="123">情感：陪伴/情绪回应</text>
    <rect x="494" y="104" width="160" height="30" fill="#E3EEFB" stroke="#4A90D9" rx="4"/><text x="502" y="123">内容：音乐/资讯/广播</text>
    <text x="44" y="156" font-size="10" fill="#666">静态 = 平台预置，规则固定；动态 = 本案例这条主线</text>
  </g>

  <rect x="700" y="70" width="670" height="120" fill="#FAFAFA" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
  <text x="714" y="92" font-size="13" font-weight="bold" fill="#444">② 动态 Advisor（Creator 可视化配置，【2.6目标】）</text>
  <g font-size="10.5" fill="#222">
    <rect x="714" y="104" width="150" height="30" fill="#FBF0D0" stroke="#D9A93A" rx="4"/><text x="722" y="123">"照看宝宝"订阅任务</text>
    <rect x="874" y="104" width="150" height="30" fill="#FBF0D0" stroke="#D9A93A" rx="4"/><text x="882" y="123">"留意小狗"订阅任务</text>
    <text x="714" y="156" font-size="10" fill="#666">动态 Advisor 的订阅任务通过触发器注册场景，是触发器"条件触发"三入口之一</text>
  </g>

  <!-- Row2: main chain -->
  <rect x="40" y="240" width="170" height="110" fill="#E3EEFB" stroke="#4A90D9" stroke-width="2" rx="8"/>
  <text x="52" y="262" font-size="12.5" font-weight="bold" fill="#222">N11-01 用户说一句话</text>
  <text x="52" y="286" font-size="10.5" fill="#333">"我下车时</text>
  <text x="52" y="302" font-size="10.5" fill="#333">提醒我拿手机"</text>
  <text x="52" y="328" font-size="10" fill="#666">贯穿案例改写</text>

  <line x1="210" y1="295" x2="248" y2="295" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="248,291 258,295 248,299" fill="#4A90D9"/>

  <rect x="260" y="240" width="180" height="110" fill="#FBF0D0" stroke="#D9A93A" stroke-width="2" rx="8"/>
  <text x="272" y="262" font-size="12.5" font-weight="bold" fill="#222">N11-02 推理=条件任务</text>
  <rect x="360" y="248" width="60" height="16" fill="#D9A93A" rx="3"/><text x="368" y="260" font-size="10" fill="#fff">2.6目标</text>
  <text x="272" y="286" font-size="10.5" fill="#333">Director 判断：这是</text>
  <text x="272" y="302" font-size="10.5" fill="#333">"等条件到了再做"，</text>
  <text x="272" y="318" font-size="10.5" fill="#333">不是现在做</text>

  <line x1="440" y1="295" x2="468" y2="295" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="468,291 478,295 468,299" fill="#4A90D9"/>

  <rect x="480" y="240" width="190" height="110" fill="#E3EEFB" stroke="#4A90D9" stroke-width="2" rx="8"/>
  <text x="492" y="262" font-size="12.5" font-weight="bold" fill="#222">N11-03 语句规整</text>
  <text x="492" y="286" font-size="10.5" fill="#333">拆成条件 + 执行项两段：</text>
  <text x="492" y="302" font-size="10.5" fill="#333">If 主驾下车 Then 提醒</text>
  <text x="492" y="318" font-size="10.5" fill="#333">拿手机（结构化条件）</text>

  <line x1="670" y1="295" x2="698" y2="295" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="698,291 708,295 698,299" fill="#4A90D9"/>

  <rect x="710" y="240" width="160" height="110" fill="#E3EEFB" stroke="#4A90D9" stroke-width="2" rx="8"/>
  <text x="722" y="262" font-size="12.5" font-weight="bold" fill="#222">N11-04 调触发器</text>
  <text x="722" y="286" font-size="10.5" fill="#333">向触发器注册这个</text>
  <text x="722" y="302" font-size="10.5" fill="#333">条件任务</text>
  <text x="722" y="328" font-size="10" fill="#666">登记进 TaskService</text>

  <line x1="870" y1="295" x2="898" y2="295" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="898,291 908,295 898,299" fill="#4A90D9"/>

  <rect x="910" y="240" width="220" height="110" fill="#FBF0D0" stroke="#D9A93A" stroke-width="2" rx="8"/>
  <text x="922" y="262" font-size="12.5" font-weight="bold" fill="#222">N11-05 解析器拆条件项</text>
  <text x="922" y="286" font-size="10.5" fill="#333">条件项可 AND/OR 组合；</text>
  <text x="922" y="302" font-size="10.5" fill="#333">执行项写死："通知 Planner</text>
  <text x="922" y="318" font-size="10.5" fill="#333">任务触发"——触发器不开口</text>

  <line x1="1130" y1="295" x2="1158" y2="295" stroke="#4A90D9" stroke-width="2.5"/>
  <polygon points="1158,291 1168,295 1158,299" fill="#4A90D9"/>

  <rect x="1170" y="240" width="200" height="110" fill="#E3EEFB" stroke="#4A90D9" stroke-width="2" rx="8"/>
  <text x="1182" y="262" font-size="12.5" font-weight="bold" fill="#222">N11-06 扫描命中</text>
  <text x="1182" y="286" font-size="10.5" fill="#333">触发器全天候站岗：</text>
  <text x="1182" y="302" font-size="10.5" fill="#333">到点/条件命中 → 回调</text>
  <text x="1182" y="318" font-size="10.5" fill="#333">通知 Planner</text>

  <!-- Row3 -->
  <rect x="40" y="400" width="360" height="110" fill="#E2F2E4" stroke="#4CAF50" stroke-width="2" rx="8"/>
  <text x="52" y="422" font-size="12.5" font-weight="bold" fill="#222">N11-07 Planner 下一步动作</text>
  <text x="52" y="446" font-size="10.5" fill="#333">拿到回调重新开一轮推理：</text>
  <text x="52" y="464" font-size="10.5" fill="#333">播报"该拿泳镜了" / 车控 / 对话</text>
  <text x="52" y="486" font-size="10" fill="#666">大脑只有 Director，触发器只是眼睛</text>

  <rect x="430" y="400" width="430" height="110" fill="#E3EEFB" stroke="#4A90D9" stroke-width="1.5" rx="8"/>
  <text x="444" y="422" font-size="12.5" font-weight="bold" fill="#222">Goals 目标列表（共享看板，【2.6目标】）</text>
  <text x="444" y="446" font-size="10.5" fill="#333">动态 Advisor 与 Planner 共用一块看板；</text>
  <text x="444" y="464" font-size="10.5" fill="#333">每条目标记：要做什么 / 条件 / 谁来执行；</text>
  <text x="444" y="486" font-size="10" fill="#666">决策取舍在这块看板上发生，不在模型脑内</text>

  <rect x="890" y="400" width="480" height="110" fill="#F0F0F0" stroke="#999999" stroke-width="1.5" rx="8"/>
  <text x="904" y="422" font-size="12.5" font-weight="bold" fill="#222">条件任务四个真实示例【已落地】</text>
  <text x="904" y="446" font-size="10.5" fill="#333">"八点播上海音乐广播" = time==2025-12-06 08:00</text>
  <text x="904" y="466" font-size="10.5" fill="#333">"副驾上车唱小星星" = 副驾占座有人 AND 安全带插入</text>
  <text x="904" y="486" font-size="10.5" fill="#333">"我累了放首歌" = VLM 人物列表：主驾打哈欠</text>

  <!-- Row4 -->
  <rect x="30" y="550" width="640" height="90" fill="#F0F0F0" stroke="#999999" stroke-width="1.5" rx="8"/>
  <text x="44" y="572" font-size="12.5" font-weight="bold" fill="#222">Advisor Creator 配置流程【待核】</text>
  <text x="44" y="594" font-size="10.5" fill="#333">配置平台改造 PRD 提了 Workflow 画布式可视化配置；与本图"动态 Advisor 注册场景"</text>
  <text x="44" y="612" font-size="10.5" fill="#333">如何对齐（谁画、画完落到哪张触发器）需补一节，本轮先标注待核</text>

  <rect x="700" y="550" width="670" height="90" fill="#E3EEFB" stroke="#4A90D9" stroke-width="1.5" rx="8"/>
  <text x="714" y="572" font-size="12.5" font-weight="bold" fill="#222">跨模块边界：from N11-04 → to 13 G（云端触发器）</text>
  <text x="714" y="594" font-size="10.5" fill="#333">注册动作一旦发出，条件就由 G 图的触发器全天候判断；N11 这边只等回调，</text>
  <text x="714" y="612" font-size="10.5" fill="#333">不自己盯时间、不自己看屏幕——这是和"工具无自主播报"同一条原则</text>

  <text x="30" y="680" font-size="11" fill="#444">读法：上排是两类 Advisor 的出身，中排是"一句话变成一个条件任务"的七步主链，下排是 Goals 看板、真实例子与边界。</text>
  <text x="30" y="702" font-size="11" fill="#444">易错点：触发器不是另一个大脑——它只判断、不开口；真正说话做事永远等回调到 Director 再决定。</text>
</svg>
