<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="人人对话怎样被记下来：两种状态，两条上报路线"><title>人人对话怎样被记下来：两种状态，两条上报路线</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="740" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">人人对话怎样被记下来：两种状态，两条上报路线</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">目的：让豆包听懂“刚才你们在聊什么”，但不因为闲聊而插话</text><rect x="30" y="92" width="1140" height="180" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">已唤醒：正在和豆包对话，声音本来就在云端</text><rect x="50" y="140" width="240" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="64" y="167" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">车内有人说话</text><text x="64" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“你饿不饿？想吃火锅”</text><rect x="330" y="140" width="290" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="344" y="167" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端识别并判断</text><text x="344" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">判为：不是对豆包说的</text><rect x="660" y="140" width="250" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="674" y="167" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">不回答、不执行</text><text x="674" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">豆包保持安静</text><rect x="950" y="140" width="205" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="964" y="167" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端记为人人对话</text><text x="964" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">记成一条“人人对话”</text><path d="M290,185 L330,185" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M620,185 L660,185" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M910,185 L950,185" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="300" width="1140" height="270" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="324" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">未唤醒或离线：音频没有上云，靠车上先判断</text><rect x="50" y="350" width="240" height="90" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="377" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车内有人说话</text><text x="64" y="402" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“咱们待会吃什么”</text><rect x="330" y="350" width="290" height="90" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="344" y="377" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上识别并判断</text><text x="344" y="402" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">判为人人对话</text><rect x="660" y="350" width="200" height="90" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="674" y="377" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">先存在车上</text><text x="674" y="402" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按时间排好</text><path d="M290,395 L330,395" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M620,395 L660,395" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M860,395 L900,395" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="900" y="330" width="255" height="220" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="914" y="357" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">什么时候上报</text><text x="914" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">① 攒满 10 句</text><text x="914" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">② 不足 10 句，但沉默 30 秒</text><text x="914" y="424" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">③ 下一句有效指令时顺带补报</text><text x="914" y="445" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">④ 断网时攒着，网络恢复补报</text><rect x="560" y="610" width="595" height="104" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="574" y="637" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端按时间戳排好，写进事件流</text><text x="574" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">→ 进入 历史输入、摘要记忆、短期记忆</text><text x="574" y="683" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">目标：下一句时 DT 能知道在说火锅（怎么交给 DT 还在讨论）</text><path d="M1030,550 L1030,610" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1155,185 L1185,185 L1185,660 L1155,660" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="610" width="500" height="104" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="44" y="637" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">不记录的声音（记下的内容是否脱敏待定）</text><text x="44" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">手机导航、手机助手等其他设备的声音</text><text x="44" y="683" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">无意义、乱码的识别结果</text><text x="44" y="704" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户关闭相关权限后的对话</text></g></svg>