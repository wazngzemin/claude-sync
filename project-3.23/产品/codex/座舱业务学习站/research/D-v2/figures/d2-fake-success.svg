<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="d2-fake-success" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="d2-fake-success-title d2-fake-success-desc">
<title id="d2-fake-success-title">工具说成功，还要对照用户的目标</title><desc id="d2-fake-success-desc">先读真实结果，再确认办成的是不是用户要的那件事；失败或部分成功也要如实说。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="d2-fake-success-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">工具说成功，还要对照用户的目标</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先读真实结果，再确认办成的是不是用户要的那件事；失败或部分成功也要如实说。</text>
<g data-node="true" id="d2-fake-success-success"><rect class="v56-local" x="32" y="150" width="252" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="177" text-anchor="start">工具回执：成功</text>
<text class="v56-node-sub" x="46" y="202" text-anchor="start">成功状态不是最终答案</text>
</g>
<g data-node="true" id="d2-fake-success-check"><rect class="v56-decision" x="384" y="150" width="384" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="398" y="177" text-anchor="start">办成的是不是用户要的那件事？</text>
<text class="v56-node-sub" x="398" y="202" text-anchor="start">拿用户目标对照真实结果</text>
</g>
<g data-node="true" id="d2-fake-success-confirm"><rect class="v56-cloud" x="904" y="150" width="264" height="98" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="918" y="177" text-anchor="start">如实确认</text>
<text class="v56-node-sub" x="918" y="202" text-anchor="start">只确认真实办成的部分</text>
</g>
<path class="v56-arrow" d="M 284 199 L 384 199" marker-end="url(#d2-fake-success-arr)"/>
<text class="v56-label" x="304" y="182" text-anchor="start">读结果</text>
<path class="v56-arrow" d="M 768 199 L 904 199" marker-end="url(#d2-fake-success-arr)"/>
<text class="v56-label" x="816" y="182" text-anchor="start">是</text>
<g data-node="true" id="d2-fake-success-correct"><rect class="v56-cloud" x="430" y="316" width="338" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="343" text-anchor="start">纠正或换办法</text>
<text class="v56-node-sub" x="444" y="368" text-anchor="start">目标没达成，就不能说办好了</text>
</g>
<path class="v56-arrow" d="M 576 248 L 576 316" marker-end="url(#d2-fake-success-arr)"/>
<text class="v56-label" x="592" y="286" text-anchor="start">否</text>
<g data-node="true" id="d2-fake-success-failure"><rect class="v56-local" x="32" y="446" width="338" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="473" text-anchor="start">工具回执：失败或部分成功</text>
<text class="v56-node-sub" x="46" y="498" text-anchor="start">不能把失败改写成成功</text>
</g>
<g data-node="true" id="d2-fake-success-honest"><rect class="v56-cloud" x="430" y="446" width="738" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="473" text-anchor="start">如实说，能换办法就换</text>
<text class="v56-node-sub" x="444" y="498" text-anchor="start">说明哪些办成、哪些没办成；不无限道歉、不无限重试。</text>
</g>
<path class="v56-arrow" d="M 370 489 L 430 489" marker-end="url(#d2-fake-success-arr)"/>
<text class="v56-label" x="32" y="583" text-anchor="start">真实例子：下面三种话都属于假成功</text>
<g data-node="true" id="d2-fake-success-music"><rect class="v56-reject" x="32" y="604" width="352" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="631" text-anchor="start">音乐没暂停</text>
<text class="v56-node-sub" x="46" y="656" text-anchor="start">却说“搞定”</text>
</g>
<g data-node="true" id="d2-fake-success-playlist"><rect class="v56-reject" x="424" y="604" width="352" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="438" y="631" text-anchor="start">歌单没建</text>
<text class="v56-node-sub" x="438" y="656" text-anchor="start">却编了一个歌单名字</text>
</g>
<g data-node="true" id="d2-fake-success-ac"><rect class="v56-reject" x="816" y="604" width="352" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="830" y="631" text-anchor="start">空调避人吹没生效</text>
<text class="v56-node-sub" x="830" y="656" text-anchor="start">却说“调好了”</text>
</g>
<rect data-decoration="true" class="v56-local" x="32" y="728" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="742" text-anchor="start">蓝：真实回执</text>
<rect data-decoration="true" class="v56-decision" x="280" y="728" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="308" y="742" text-anchor="start">黄：目标核对</text>
<rect data-decoration="true" class="v56-cloud" x="538" y="728" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="566" y="742" text-anchor="start">绿：按结果答复</text>
<rect data-decoration="true" class="v56-reject" x="832" y="728" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="860" y="742" text-anchor="start">红：假成功</text>
</svg>
