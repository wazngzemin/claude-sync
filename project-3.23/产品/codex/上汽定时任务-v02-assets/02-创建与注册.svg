<text x="320" y="726" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">Planner 澄清缺失信息</tspan><tspan x="320" dy="34.8">不支持则解释原因并结束</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCEEE3" stroke="#678198" stroke-width="2" transform="translate(900,1060) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="1068" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">等待时间还是车态？</tspan></text>
