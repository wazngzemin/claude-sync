<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1840" viewBox="0 0 1900 1840">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#8AA3C1"/></marker></defs>
<rect width="1900" height="1840" fill="#FFFFFF"/>
<text x="56" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="700" fill="#173458" text-anchor="start"><tspan x="56" dy="0">系统预设任务配置平台：五步业务框架与运行闭环</tspan></text>
<text x="56" y="112" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="56" dy="0">评审只需沿着五步讲：平台配置“这类任务怎么做”，运行时由 Trigger、原业务和交互/执行模块按配置完成一次闭环。</tspan></text>
<rect x="56" y="148" width="1788" height="72" rx="12" fill="#FFF0F0" stroke="#DB5C5C" stroke-width="1.8"/>
<text x="950" y="192" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#8C3434" text-anchor="middle"><tspan x="950" dy="0">已确认：Planner 不直接拉卡。无论端侧还是云端，卡片都由这项任务的原业务注册并发起。</tspan></text>
<rect x="56" y="268" width="336" height="390" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<rect x="56" y="268" width="336" height="54" rx="14" fill="#EDF4FF" stroke="none" stroke-width="0"/>
<text x="76" y="303" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="700" fill="#173458" text-anchor="start"><tspan x="76" dy="0">1  选任务与范围</tspan></text>
<rect x="74" y="334" width="300" height="40" rx="9" fill="#FFFFFF" stroke="#1E63B6" stroke-width="1.2"/>
<text x="224" y="361" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="224" dy="0">页面位置：基础信息 / 发布范围</tspan></text>
<text x="76" y="408" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="76" dy="0">• 关联哪项预设任务</tspan><tspan x="76" dy="27">• 真实启用状态从哪里读取</tspan><tspan x="76" dy="27">• 端侧运行或云端运行</tspan><tspan x="76" dy="27">• 渠道、车型、软件版本</tspan><tspan x="76" dy="27">• 原业务及产品/研发 Owner</tspan><tspan x="76" dy="27"></tspan><tspan x="76" dy="27">决定：谁能使用、谁来承接</tspan></text>
<rect x="419" y="268" width="336" height="390" rx="14" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<rect x="419" y="268" width="336" height="54" rx="14" fill="#EDF4FF" stroke="none" stroke-width="0"/>
<text x="439" y="303" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="700" fill="#173458" text-anchor="start"><tspan x="439" dy="0">2  配触发规则</tspan></text>
<rect x="437" y="334" width="300" height="40" rx="9" fill="#FFFFFF" stroke="#1E63B6" stroke-width="1.2"/>
<text x="587" y="361" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="587" dy="0">页面位置：触发条件</tspan></text>
<text x="439" y="408" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="439" dy="0">• 哪个变化事件启动检查</tspan><tspan x="439" dy="27">• 当前仍需满足哪些条件</tspan><tspan x="439" dy="27">• AND / OR、阈值、持续时长</tspan><tspan x="439" dy="27">• 数据时效、UNKNOWN 处理</tspan><tspan x="439" dy="27">• 防抖和同一事件去重</tspan><tspan x="439" dy="27"></tspan><tspan x="439" dy="27">决定：什么时候产生业务事件</tspan></text>
<rect x="782" y="268" width="336" height="390" rx="14" fill="#FFF4E4" stroke="#D88932" stroke-width="2"/>
<rect x="782" y="268" width="336" height="54" rx="14" fill="#FFF4E4" stroke="none" stroke-width="0"/>
<text x="802" y="303" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="700" fill="#173458" text-anchor="start"><tspan x="802" dy="0">3  选处理方式</tspan></text>
<rect x="800" y="334" width="300" height="40" rx="9" fill="#FFFFFF" stroke="#D88932" stroke-width="1.2"/>
<text x="950" y="361" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="950" dy="0">页面位置：触发条件之后新增</tspan></text>
<text x="802" y="408" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="802" dy="0">• 直接执行 / 仅告知</tspan><tspan x="802" dy="27">• 先询问 / 发起主动推荐</tspan><tspan x="802" dy="27">• 业务事件名称与场景信息</tspan><tspan x="802" dy="27">• 原业务标识和下游输入</tspan><tspan x="802" dy="27">• 建议目标动作与结果分支</tspan><tspan x="802" dy="27"></tspan><tspan x="802" dy="27">决定：命中后把事件交给谁</tspan></text>
<rect x="1145" y="268" width="336" height="390" rx="14" fill="#FFF4E4" stroke="#D88932" stroke-width="2"/>
<rect x="1145" y="268" width="336" height="54" rx="14" fill="#FFF4E4" stroke="none" stroke-width="0"/>
<text x="1165" y="303" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1165" dy="0">4  配交互与后续</tspan></text>
<rect x="1163" y="334" width="300" height="40" rx="9" fill="#FFFFFF" stroke="#D88932" stroke-width="1.2"/>
<text x="1313" y="361" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="1313" dy="0">页面位置：选择“先询问”后展开</tspan></text>
<text x="1165" y="408" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1165" dy="0">• 卡片模板与注册业务</tspan><tspan x="1165" dy="27">• 正文、按钮、TTS</tspan><tspan x="1165" dy="27">• 点击回调与语音路线</tspan><tspan x="1165" dy="27">• 确认后的复核和动作顺序</tspan><tspan x="1165" dy="27">• 取消、关闭、超时、结果更新</tspan><tspan x="1165" dy="27"></tspan><tspan x="1165" dy="27">决定：每种用户结果怎么办</tspan></text>
<rect x="1508" y="268" width="336" height="390" rx="14" fill="#EAF5EF" stroke="#579473" stroke-width="2"/>
<rect x="1508" y="268" width="336" height="54" rx="14" fill="#EAF5EF" stroke="none" stroke-width="0"/>
<text x="1528" y="303" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1528" dy="0">5  设运行策略</tspan></text>
<rect x="1526" y="334" width="300" height="40" rx="9" fill="#FFFFFF" stroke="#579473" stroke-width="1.2"/>
<text x="1676" y="361" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="600" fill="#52657B" text-anchor="middle"><tspan x="1676" dy="0">页面位置：页面末尾 / 频控扩展</tspan></text>
<text x="1528" y="408" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1528" dy="0">• 稳定时长、等待时长</tspan><tspan x="1528" dy="27">• 卡片和授权有效期</tspan><tspan x="1528" dy="27">• 总次数 / 上电 / 每日次数</tspan><tspan x="1528" dy="27">• 最小间隔、冷却、重新提醒</tspan><tspan x="1528" dy="27">• 任务关闭和条件失效的退出</tspan><tspan x="1528" dy="27"></tspan><tspan x="1528" dy="27">决定：何时停、何时能再来</tspan></text>
<line x1="392" y1="463" x2="419" y2="463" stroke="#8AA3C1" stroke-width="2.4"  marker-end="url(#arrow)"/>
<line x1="755" y1="463" x2="782" y2="463" stroke="#8AA3C1" stroke-width="2.4"  marker-end="url(#arrow)"/>
<line x1="1118" y1="463" x2="1145" y2="463" stroke="#8AA3C1" stroke-width="2.4"  marker-end="url(#arrow)"/>
<line x1="1481" y1="463" x2="1508" y2="463" stroke="#8AA3C1" stroke-width="2.4"  marker-end="url(#arrow)"/>
<rect x="56" y="706" width="1788" height="208" rx="14" fill="#F3EEFF" stroke="#8B70C9" stroke-width="2"/>
<text x="78" y="748" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="700" fill="#173458" text-anchor="start"><tspan x="78" dy="0">横向支撑：原子能力目录（场景页只能引用已接入能力）</tspan></text>
<text x="78" y="792" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="78" dy="0">输入/状态：任务开关、档位、车速、驾驶模式   ｜   感知：天气、路面、儿童/宠物、充电设备</tspan><tspan x="78" dy="31">交互：即时交互卡、TTS、可见即可说、云端泛化语音   ｜   动作/回读：车控动作、真实车辆状态</tspan><tspan x="78" dy="31">每项登记：字段/枚举/单位、数据来源、端云位置、车型/版本、Owner、异常结果、接入状态。</tspan></text>
<rect x="1435" y="742" width="374" height="132" rx="11" fill="#FFFFFF" stroke="#8B70C9" stroke-width="1.5"/>
<text x="1622" y="779" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#8B70C9" text-anchor="middle"><tspan x="1622" dy="0">发布门禁</tspan></text>
<text x="1622" y="814" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#173458" text-anchor="middle"><tspan x="1622" dy="0">缺能力、缺责任人、缺分支</tspan><tspan x="1622" dy="28">或缺真实结果判定 → 不发布</tspan></text>
<text x="56" y="984" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="29" font-weight="700" fill="#173458" text-anchor="start"><tspan x="56" dy="0">配置发布后，一次真实业务怎样跑</tspan></text>
<rect x="56" y="1030" width="248" height="150" rx="13" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<text x="74" y="1069" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="74" dy="0">① 平台发布</tspan></text>
<text x="74" y="1110" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="74" dy="0">保存完整任务规格</tspan><tspan x="74" dy="28">不直接拉卡</tspan></text>
<line x1="304" y1="1105" x2="344" y2="1105" stroke="#8AA3C1" stroke-width="2.4"  marker-end="url(#arrow)"/>
<rect x="344" y="1030" width="248" height="150" rx="13" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<text x="362" y="1069" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="362" dy="0">② Trigger</tspan></text>
<text x="362" y="1110" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="362" dy="0">读任务状态与数据</tspan><tspan x="362" dy="28">命中后发业务事件</tspan></text>
<line x1="592" y1="1105" x2="632" y2="1105" stroke="#8AA3C1" stroke-width="2.4"  marker-end="url(#arrow)"/>
<rect x="632" y="1030" width="280" height="150" rx="13" fill="#FFF4E4" stroke="#D88932" stroke-width="2"/>
<text x="650" y="1069" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="650" dy="0">③ 任务原业务</tspan></text>
<text x="650" y="1110" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="650" dy="0">读取处理/卡片配置</tspan><tspan x="650" dy="28">注册并发起卡片</tspan></text>
<line x1="912" y1="1105" x2="952" y2="1105" stroke="#8AA3C1" stroke-width="2.4"  marker-end="url(#arrow)"/>
<rect x="952" y="1030" width="248" height="150" rx="13" fill="#EDF4FF" stroke="#1E63B6" stroke-width="2"/>
<text x="970" y="1069" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="970" dy="0">④ 即时交互卡</tspan></text>
<text x="970" y="1110" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="970" dy="0">排队、真正展示</tspan><tspan x="970" dy="28">返回点击/关闭/超时</tspan></text>
<line x1="1200" y1="1105" x2="1240" y2="1105" stroke="#8AA3C1" stroke-width="2.4"  marker-end="url(#arrow)"/>
<rect x="1240" y="1030" width="276" height="150" rx="13" fill="#EAF5EF" stroke="#579473" stroke-width="2"/>
<text x="1258" y="1069" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1258" dy="0">⑤ 原业务执行</tspan></text>
<text x="1258" y="1110" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1258" dy="0">消费确认并重检</tspan><tspan x="1258" dy="28">车控与真实状态回读</tspan></text>
<line x1="1516" y1="1105" x2="1556" y2="1105" stroke="#8AA3C1" stroke-width="2.4"  marker-end="url(#arrow)"/>
<rect x="1556" y="1030" width="288" height="150" rx="13" fill="#EAF5EF" stroke="#579473" stroke-width="2"/>
<text x="1574" y="1069" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#173458" text-anchor="start"><tspan x="1574" dy="0">⑥ 结果收口</tspan></text>
<text x="1574" y="1110" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#173458" text-anchor="start"><tspan x="1574" dy="0">更新/关闭卡片</tspan><tspan x="1574" dy="28">冷却后等待下一次</tspan></text>
<rect x="56" y="1235" width="870" height="424" rx="14" fill="#FBFCFE" stroke="#1E63B6" stroke-width="2"/>
<text x="80" y="1278" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="700" fill="#173458" text-anchor="start"><tspan x="80" dy="0">端侧询问：天气/路况保护</tspan></text>
<text x="80" y="1323" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="80" dy="0">1. Trigger 读任务开关、本地车况和 VLM 结果并判断。</tspan><tspan x="80" dy="36">2. 命中后把“路面湿滑建议”事件交给天气保护原业务。</tspan><tspan x="80" dy="36">3. 原业务引用配置，注册卡片、按钮、TTS、回调和可见即可说。</tspan><tspan x="80" dy="36">4. 点击与本地语音都回到同一个原业务确认分支，不经过 Planner。</tspan><tspan x="80" dy="36">5. 原业务重检车况、调用车控、读真实状态并更新卡片。</tspan><tspan x="80" dy="36"></tspan><tspan x="80" dy="36">平台配置：任务、规则、处理方式、卡片规格、动作和运行策略。</tspan><tspan x="80" dy="36">业务研发：运行时注册卡片、消费结果、执行并收口。</tspan></text>
<rect x="974" y="1235" width="870" height="424" rx="14" fill="#FCFAFF" stroke="#8B70C9" stroke-width="2"/>
<text x="998" y="1278" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="700" fill="#173458" text-anchor="start"><tspan x="998" dy="0">云端询问：主动推荐 / DT 后询问</tspan></text>
<text x="998" y="1323" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#173458" text-anchor="start"><tspan x="998" dy="0">1. Cloud Trigger 判断任务状态和云端可用硬条件。</tspan><tspan x="998" dy="36">2. Advisor / DT / VQA 按需补充判断，把明确建议交给原业务。</tspan><tspan x="998" dy="36">3. 原业务读取配置，注册并发起卡片；Planner 不拉卡。</tspan><tspan x="998" dy="36">4. 卡片真正展示且选择“云端泛化语音”后，才注册上下文给 Planner。</tspan><tspan x="998" dy="36">5. Planner 只返回确认/拒绝等语义；原业务决定是否继续。</tspan><tspan x="998" dy="36">6. 端侧最终重检、执行和回读，原业务更新卡片并注销上下文。</tspan><tspan x="998" dy="36"></tspan><tspan x="998" dy="36">点击默认回原业务；旧链路必须模拟 Query 时需显式标注为兼容路线。</tspan></text>
<rect x="56" y="1705" width="1788" height="84" rx="12" fill="#FFF0F0" stroke="#DB5C5C" stroke-width="1.8"/>
<text x="950" y="1741" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="650" fill="#8C3434" text-anchor="middle"><tspan x="950" dy="0">一句话讲图：平台决定“这类任务怎么做”；Trigger 决定“现在是否命中”；原业务负责“拉卡、消费结果和执行”；</tspan></text>
<text x="950" y="1772" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="650" fill="#8C3434" text-anchor="middle"><tspan x="950" dy="0">即时交互卡负责“展示与回传”；Planner 只在云端语音路线里理解“用户是什么意思”。</tspan></text>
</svg>