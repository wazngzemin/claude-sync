<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="一句话交给 DT 之前，系统要依次回答 6 个问题"><title>一句话交给 DT 之前，系统要依次回答 6 个问题</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="690" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">一句话交给 DT 之前，系统要依次回答 6 个问题</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左边是问题，中间是靠什么回答，右边是答错时用户的感受</text><text x="40" y="108" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">要回答的问题</text><text x="500" y="108" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">靠什么回答</text><text x="870" y="108" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">答错时用户的感受</text><rect x="30" y="125" width="420" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="152" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">① 他说了什么？</text><rect x="490" y="125" width="330" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="504" y="152" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">第一遍、第二遍识别 + 热词</text><rect x="860" y="125" width="310" height="46" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="874" y="152" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">名字写错、地点找错</text><path d="M450,148 L490,148" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M820,148 L860,148" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M240,171 L240,211" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="211" width="420" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="238" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">② 他说完了吗？</text><rect x="490" y="211" width="330" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="504" y="238" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">判停（300 / 600 毫秒）</text><rect x="860" y="211" width="310" height="46" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="874" y="238" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">话被截断，或者等很久才有反应</text><path d="M450,234 L490,234" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M820,234 L860,234" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M240,257 L240,297" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="297" width="420" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="324" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">③ 能不能先准备？</text><rect x="490" y="297" width="330" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="504" y="324" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">停顿时提前准备</text><rect x="860" y="297" width="310" height="46" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="874" y="324" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">说完以后干等</text><path d="M450,320 L490,320" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M820,320 L860,320" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M240,343 L240,383" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="383" width="420" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="410" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">④ 是在跟豆包说吗？</text><rect x="490" y="383" width="330" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="504" y="410" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">拒识</text><rect x="860" y="383" width="310" height="46" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="874" y="410" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">闲聊被打断，或者叫了不理</text><path d="M450,406 L490,406" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M820,406 L860,406" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M240,429 L240,469" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="469" width="420" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="496" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">⑤ 车上办，还是云端办？</text><rect x="490" y="469" width="330" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="504" y="496" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">车上小模型 + 端云仲裁</text><rect x="860" y="469" width="310" height="46" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="874" y="496" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">断网就不能用，或者动作做两遍</text><path d="M450,492 L490,492" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M820,492 L860,492" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M240,515 L240,555" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="555" width="420" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="44" y="582" font-size="17" fill="#1f4565" font-weight="650" text-anchor="start">⑥ 他指的是什么？以前发生过什么？</text><rect x="490" y="555" width="330" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="504" y="582" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">历史输入、摘要记忆、长短期记忆、人人对话</text><rect x="860" y="555" width="310" height="46" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="874" y="582" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">“第二个”“昨天那家”接不上</text><path d="M450,578 L490,578" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M820,578 L860,578" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="30" y="630" width="1140" height="44" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="657" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">六个问题都答完，这句话和它的背景才交给 DT；DT 办完的事再上报回去，变成下一句的背景</text></g></svg>