<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="840" viewBox="0 0 1260 840" role="img" aria-label="历史输入怎么挑：同一段经历，两种取法"><title>历史输入怎么挑：同一段经历，两种取法</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1260" height="840" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">历史输入怎么挑：同一段经历，两种取法</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">最上面一行是过去 30 分钟里按时间发生的事；下面两行是两种方案各挑了哪几条</text><text x="40" y="118" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">过去 30 分钟（越往右越近）</text><rect x="40" y="130" width="104" height="64" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">①</text><text x="54" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人机</text><rect x="154" y="130" width="104" height="64" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="168" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">②</text><text x="168" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人机</text><rect x="268" y="130" width="104" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="282" y="157" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">③</text><text x="282" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人人对话</text><rect x="382" y="130" width="104" height="64" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="396" y="157" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">④</text><text x="396" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">手动调空调</text><rect x="496" y="130" width="104" height="64" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="510" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">⑤</text><text x="510" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人机</text><rect x="610" y="130" width="104" height="64" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="624" y="157" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">⑥</text><text x="624" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">被拒识的话</text><rect x="724" y="130" width="104" height="64" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="738" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">⑦</text><text x="738" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人机</text><rect x="838" y="130" width="104" height="64" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="852" y="157" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">⑧</text><text x="852" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">触发风控</text><rect x="952" y="130" width="104" height="64" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="966" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">⑨</text><text x="966" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人机</text><rect x="1066" y="130" width="104" height="64" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="1080" y="157" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">⑩</text><text x="1080" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">乘客上车</text><rect x="1180" y="130" width="60" height="64" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="1194" y="157" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">这句</text><rect x="20" y="250" width="1220" height="140" rx="10" fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="34" y="274" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">现在（9 月代码口径）</text><text x="40" y="298" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">最近 5 轮有效人机对话 + 近 10 分钟最多 3 条白名单事件（假设④⑩都符合）</text><rect x="40" y="314" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="341" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">① 带上</text><rect x="154" y="314" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="168" y="341" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">② 带上</text><rect x="268" y="314" width="104" height="54" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="282" y="341" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">③ 不带</text><rect x="382" y="314" width="104" height="54" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="396" y="341" font-size="14" fill="#6a4314" font-weight="650" text-anchor="start">④ 带上</text><rect x="496" y="314" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="510" y="341" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">⑤ 带上</text><rect x="610" y="314" width="104" height="54" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="624" y="341" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">⑥ 不带</text><rect x="724" y="314" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="738" y="341" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">⑦ 带上</text><rect x="838" y="314" width="104" height="54" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="852" y="341" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">⑧ 不带</text><rect x="952" y="314" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="966" y="341" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">⑨ 带上</text><rect x="1066" y="314" width="104" height="54" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="1080" y="341" font-size="14" fill="#6a4314" font-weight="650" text-anchor="start">⑩ 带上</text><rect x="20" y="420" width="1220" height="140" rx="10" fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="34" y="444" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">11/4 讨论方案（未上线）</text><text x="40" y="468" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">5 轮人机对话 + 最近 5 条记录里的人人对话和事件；不再单独带事件流</text><rect x="40" y="484" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="511" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">① 带上</text><rect x="154" y="484" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="168" y="511" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">② 带上</text><rect x="268" y="484" width="104" height="54" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="282" y="511" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">③ 不带</text><rect x="382" y="484" width="104" height="54" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="396" y="511" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">④ 不带</text><rect x="496" y="484" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="510" y="511" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">⑤ 带上</text><rect x="610" y="484" width="104" height="54" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="624" y="511" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">⑥ 带上</text><rect x="724" y="484" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="738" y="511" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">⑦ 带上</text><rect x="838" y="484" width="104" height="54" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="852" y="511" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">⑧ 不带</text><rect x="952" y="484" width="104" height="54" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="966" y="511" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start">⑨ 带上</text><rect x="1066" y="484" width="104" height="54" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="1080" y="511" font-size="14" fill="#6a4314" font-weight="650" text-anchor="start">⑩ 带上</text><rect x="20" y="590" width="600" height="120" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="34" y="617" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">为什么 ⑧ 两种方案都不带</text><text x="34" y="642" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">触发风控的轮次标记后下一轮过滤；</text><text x="34" y="663" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">否则敏感输入会被模型反复看到（9/6 出过“复活”）</text><rect x="640" y="590" width="600" height="120" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="654" y="617" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">为什么 ③⑥ 现在不带</text><text x="654" y="642" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人人对话是被拒识的话，现在不进人机历史；</text><text x="654" y="663" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">11/4 讨论只放最近 5 条里的，⑥在其中所以带上，③不在</text><rect x="20" y="730" width="1220" height="84" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="34" y="757" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">对话摘要：从第 3 轮起，把这次用车更早的对话压成一段（最长 500 token）</text><text x="34" y="782" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">放在记忆的最前面，补上“5 轮之外、短期记忆还没生成”的空档；摘要上限 PRD 写 28 轮，11/4 会上口头说 22 轮，待确认</text></g></svg>