<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="g2-overview" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="g2-overview-title g2-overview-desc">
<title id="g2-overview-title">一条规则怎样等到条件成立，再交回 Planner</title><desc id="g2-overview-desc">主驾说“续航低于 100 公里的时候提醒我充电”；从任务服务登记规则这一刻开始看。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="g2-overview-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一条规则怎样等到条件成立，再交回 Planner</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">主驾说“续航低于 100 公里的时候提醒我充电”；从任务服务登记规则这一刻开始看。</text>
<g data-node="true" id="g2-overview-register"><rect class="v56-cloud" x="40" y="150" width="330" height="132" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="178" text-anchor="start">01 · 任务服务登记</text>
<text class="v56-node-sub" x="54" y="206" text-anchor="start">等待“续航 &lt; 100 公里”</text>
<text class="v56-node-sub" x="54" y="230" text-anchor="start">条件任务来自 T 章</text>
</g>
<g data-node="true" id="g2-overview-save"><rect class="v56-cloud" x="435" y="150" width="330" height="132" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="178" text-anchor="start">02 · 触发器保存规则</text>
<text class="v56-node-sub" x="449" y="206" text-anchor="start">属于这个账号 × 这辆车</text>
<text class="v56-node-sub" x="449" y="230" text-anchor="start">订阅剩余续航信号</text>
</g>
<path class="v56-arrow" d="M 370 216 L 435 216" marker-end="url(#g2-overview-arr)"/>
<g data-node="true" id="g2-overview-report"><rect class="v56-local" x="830" y="150" width="330" height="132" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="178" text-anchor="start">03 · 车端上报续航</text>
<text class="v56-node-sub" x="844" y="206" text-anchor="start">101 公里 → 99 公里</text>
<text class="v56-node-sub" x="844" y="230" text-anchor="start">每次上报带来一次检查机会</text>
</g>
<path class="v56-arrow" d="M 765 216 L 830 216" marker-end="url(#g2-overview-arr)"/>
<g data-node="true" id="g2-overview-wake"><rect class="v56-cloud" x="830" y="350" width="330" height="132" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="378" text-anchor="start">04 · 叫醒这条规则</text>
<text class="v56-node-sub" x="844" y="406" text-anchor="start">按渠道和信号挑出相关场景</text>
<text class="v56-node-sub" x="844" y="430" text-anchor="start">叫醒不代表已经命中</text>
</g>
<path class="v56-arrow" d="M 995 282 L 995 350" marker-end="url(#g2-overview-arr)"/>
<g data-node="true" id="g2-overview-judge"><rect class="v56-decision" x="435" y="350" width="330" height="132" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="378" text-anchor="start">05 · 判断全部条件</text>
<text class="v56-node-sub" x="449" y="406" text-anchor="start">当前值条件 / 变化条件</text>
<text class="v56-node-sub" x="449" y="430" text-anchor="start">成立、不成立、未知分开记</text>
</g>
<path class="v56-arrow" d="M 830 416 L 765 416" marker-end="url(#g2-overview-arr)"/>
<g data-node="true" id="g2-overview-limit"><rect class="v56-decision" x="40" y="350" width="330" height="132" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="378" text-anchor="start">06 · 频控放行吗</text>
<text class="v56-node-sub" x="54" y="406" text-anchor="start">检查次数与最小执行间隔</text>
<text class="v56-node-sub" x="54" y="430" text-anchor="start">这次还能不能发出去</text>
</g>
<path class="v56-arrow" d="M 435 416 L 370 416" marker-end="url(#g2-overview-arr)"/>
<g data-node="true" id="g2-overview-callback"><rect class="v56-cloud" x="40" y="550" width="330" height="132" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="578" text-anchor="start">07 · 回调任务服务</text>
<text class="v56-node-sub" x="54" y="606" text-anchor="start">带任务编号、回调编号</text>
<text class="v56-node-sub" x="54" y="630" text-anchor="start">按登记的出口交出去</text>
</g>
<path class="v56-arrow" d="M 205 482 L 205 550" marker-end="url(#g2-overview-arr)"/>
<g data-node="true" id="g2-overview-run"><rect class="v56-cloud" x="435" y="550" width="330" height="132" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="449" y="578" text-anchor="start">08 · 任务服务生成一次运行</text>
<text class="v56-node-sub" x="449" y="606" text-anchor="start">经车端送回 Planner</text>
<text class="v56-node-sub" x="449" y="630" text-anchor="start">后续执行接回 T 章</text>
</g>
<path class="v56-arrow" d="M 370 616 L 435 616" marker-end="url(#g2-overview-arr)"/>
<g data-node="true" id="g2-overview-planner"><rect class="v56-local" x="830" y="550" width="330" height="132" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="844" y="578" text-anchor="start">09 · Planner 决定怎么提醒</text>
<text class="v56-node-sub" x="844" y="606" text-anchor="start">“续航不到 100 公里了……”</text>
<text class="v56-node-sub" x="844" y="630" text-anchor="start">结合当时情况说话、执行</text>
</g>
<path class="v56-arrow" d="M 765 616 L 830 616" marker-end="url(#g2-overview-arr)"/>
<path class="v56-rule" d="M 40 727 L 1160 727"/>
<text class="v56-label" x="40" y="755" text-anchor="start">每一步都记账：命中、拦下、未知、出口接收；下游结果继续回写。</text>
<path class="v56-rule" d="M 32 792 L 1168 792"/>
<text class="v56-node-title" x="32" y="826" text-anchor="start">触发器等条件、按登记交出去；说什么、做什么归 Planner。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="852" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="866" text-anchor="start">蓝：车端输入与最终表达</text>
<rect data-decoration="true" class="v56-cloud" x="410.6666666666667" y="852" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="866" text-anchor="start">绿：规则保存、交接与记录</text>
<rect data-decoration="true" class="v56-decision" x="789.3333333333334" y="852" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="866" text-anchor="start">黄：判断与放行</text>
</svg>
