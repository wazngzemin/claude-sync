<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="文字一路、声音一路：同一句话怎样分两条路回到车上"><title>文字一路、声音一路：同一句话怎样分两条路回到车上</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="700" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">文字一路、声音一路：同一句话怎样分两条路回到车上</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">2026 年 7 月起的现行方案（端云链路 OnePager）；两路靠“声音编号”对号</text><rect x="40" y="120" width="260" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="147" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 写出话术</text><text x="54" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一边写一边往外吐字</text><rect x="400" y="120" width="300" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="414" y="147" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">座舱云服务（AIDV）</text><text x="414" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">抽出话术、带上声音编号</text><rect x="800" y="120" width="340" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="814" y="147" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">豆包对话服务</text><text x="814" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">把文字回复转回车上</text><rect x="400" y="320" width="300" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="414" y="347" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">语音服务合成并缓存</text><text x="414" y="372" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按语气切段、边合成边可取</text><rect x="800" y="320" width="340" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="814" y="347" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上：屏幕先显示文字</text><text x="814" y="372" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">拿到文字和声音编号</text><rect x="800" y="470" width="340" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="814" y="497" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上：按编号取声音</text><text x="814" y="522" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">单独的长连接，边收边播</text><path d="M300,168 L400,168" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M700,158 L800,158" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="720.3" y="135" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="750" y="151" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">文字一路</text><path d="M970,216 L970,320" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="981.775" y="255" width="96.45" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="1030" y="271" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">文字 + 编号</text><path d="M550,216 L550,320" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="575.3" y="255" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="605" y="271" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">声音一路</text><path d="M970,416 L970,470" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1004.125" y="431" width="71.75" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="1040" y="447" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">拿编号去取</text><path d="M700,400 L750,400 L750,518 L800,518" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="715.3" y="451" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="745" y="467" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">声音分片</text><rect x="40" y="610" width="350" height="70" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="54" y="637" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">文字到了，声音没取到</text><text x="54" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">先查编号有没有下发、车上有没有取</text><rect x="420" y="610" width="350" height="70" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="434" y="637" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">取到了，顺序乱或串了请求</text><text x="434" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同一请求多段声音要按序</text><rect x="800" y="610" width="360" height="70" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="814" y="637" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">取到了，轮不到播</text><text x="814" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">被更高优先级合法让路（第三段）</text></g></svg>