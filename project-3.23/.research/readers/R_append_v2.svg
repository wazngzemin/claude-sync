<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 2800" font-family="Noto Sans SC">
  <!-- 白色覆盖旧补充区 -->
  <rect x="40" y="2190" width="1700" height="400" fill="#fafbfd"/>
  <!-- 新补充区框 -->
  <rect x="50" y="2260" width="1660" height="460" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="70" y="2285" font-size="14" font-weight="700" fill="#7a5c00">本次补充：六个新节点（2026-10 口径）</text>

  <!-- R19 -->
  <rect x="80" y="2310" width="360" height="150" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="95" y="2335" font-size="13" font-weight="700" fill="#1a1a1a">R19 预请求提前判断与作废</text>
  <text x="95" y="2358" font-size="12" fill="#3c4043">停顿 300ms 先做拒识与上下文准备</text>
  <text x="95" y="2378" font-size="12" fill="#3c4043">正式请求来了直接用，体感快约 200ms</text>
  <text x="95" y="2398" font-size="12" fill="#3c4043">用户改口或文字变了，提前结果作废</text>
  <text x="95" y="2418" font-size="12" fill="#b3261e">【2.6 目标】</text>

  <!-- R20 -->
  <rect x="470" y="2310" width="360" height="150" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="485" y="2335" font-size="13" font-weight="700" fill="#1a1a1a">R20 离线白名单范围</text>
  <text x="485" y="2358" font-size="12" fill="#3c4043">只有本车已交付离线车控可执行</text>
  <text x="485" y="2378" font-size="12" fill="#3c4043">断网或云端 3 秒超时后才启用</text>
  <text x="485" y="2398" font-size="12" fill="#3c4043">联网搜索/复杂规划始终走云端</text>
  <text x="485" y="2418" font-size="12" fill="#b3261e">【待核】网络恢复重同步</text>

  <!-- R21 -->
  <rect x="860" y="2310" width="360" height="150" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="875" y="2335" font-size="13" font-weight="700" fill="#1a1a1a">R21 拒识三级架构</text>
  <text x="875" y="2358" font-size="12" fill="#3c4043">离线高精准匹配→云端阶段一高召回</text>
  <text x="875" y="2378" font-size="12" fill="#3c4043">→Director 兜底→Advisor 回捞</text>
  <text x="875" y="2398" font-size="12" fill="#b3261e">分级与各层阈值【讨论中】</text>

  <!-- R22 -->
  <rect x="1250" y="2310" width="360" height="150" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="1265" y="2335" font-size="13" font-weight="700" fill="#1a1a1a">R22 端云两份结果对齐</text>
  <text x="1265" y="2358" font-size="12" fill="#3c4043">靠同一请求编号对上</text>
  <text x="1265" y="2378" font-size="12" fill="#3c4043">端侧先回但不执行，等云端最终判定</text>
  <text x="1265" y="2398" font-size="12" fill="#3c4043">旧结果或不同编号不能串单</text>
  <text x="1265" y="2418" font-size="12" fill="#b3261e">【已落地】</text>

  <!-- R23 -->
  <rect x="80" y="2480" width="360" height="150" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="95" y="2505" font-size="13" font-weight="700" fill="#7f1d1d">R23 高风险二次确认</text>
  <text x="95" y="2528" font-size="12" fill="#3c4043">关 ESP、解儿童锁、支付停车费</text>
  <text x="95" y="2548" font-size="12" fill="#3c4043">仅主驾可下，或必须二次确认</text>
  <text x="95" y="2568" font-size="12" fill="#3c4043">副驾说解儿童锁→只跟主驾确认</text>
  <text x="95" y="2588" font-size="12" fill="#b3261e">【已落地】</text>

  <!-- R24 -->
  <rect x="470" y="2480" width="360" height="150" rx="6" fill="#e6f4ea" stroke="#34A853" stroke-width="1.5"/>
  <text x="485" y="2505" font-size="13" font-weight="700" fill="#1e7e34">R24 拒识话题继承</text>
  <text x="485" y="2528" font-size="12" fill="#3c4043">被拒识聊天每 5 轮总结话题</text>
  <text x="485" y="2548" font-size="12" fill="#3c4043">8 类：日常/兴趣/科技/工作/时事</text>
  <text x="485" y="2568" font-size="12" fill="#3c4043">/情感/健康/旅行</text>
  <text x="485" y="2588" font-size="12" fill="#3c4043">真召回时带上文</text>
</svg>
