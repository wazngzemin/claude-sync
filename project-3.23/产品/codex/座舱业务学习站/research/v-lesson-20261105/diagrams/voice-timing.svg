<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" role="img" aria-label="一次补话，为什么会出现两份准备"><title>一次补话，为什么会出现两份准备</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="48" font-size="26" fill="#18364c" font-weight="650" text-anchor="start">一次补话，为什么会出现两份准备</text><text x="40" y="82" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">400 毫秒是案例假设；300 / 600 毫秒来自本章采用的语音 OnePager。</text><text x="50" y="140" font-size="21" fill="#203c51" font-weight="600" text-anchor="start">第一段停顿：说完“游泳馆”，约 400 毫秒后补话</text><path d="M100 215 L580 215" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M580 215 L900 215" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M100 203V227" stroke="#476c8d"/><text x="100" y="195" font-size="17" fill="#244358" font-weight="400" text-anchor="middle">0</text><path d="M460 203V227" stroke="#476c8d"/><text x="460" y="195" font-size="17" fill="#244358" font-weight="400" text-anchor="middle">300 ms</text><path d="M580 203V227" stroke="#476c8d"/><text x="580" y="195" font-size="17" fill="#244358" font-weight="400" text-anchor="middle">400 ms</text><path d="M820 203V227" stroke="#476c8d"/><text x="820" y="195" font-size="17" fill="#244358" font-weight="400" text-anchor="middle">600 ms（未到达）</text><rect x="50" y="265" width="270" height="145" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="68" y="297" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">开始停顿</text><text x="68" y="328" font-size="17" fill="#244358" font-weight="400" text-anchor="start">当前文字到“游泳馆”</text><text x="68" y="355" font-size="17" fill="#244358" font-weight="400" text-anchor="start">同一次输入继续保留</text><text x="68" y="382" font-size="17" fill="#244358" font-weight="400" text-anchor="start">ASR 与 VAD 仍在运行</text><rect x="365" y="265" width="270" height="145" rx="8" fill="#fff8eb" stroke="#d8bf8d"/><text x="383" y="297" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">软判停触发准备 1</text><text x="383" y="328" font-size="17" fill="#244358" font-weight="400" text-anchor="start">按“去游泳馆”做准备</text><text x="383" y="355" font-size="17" fill="#244358" font-weight="400" text-anchor="start">这时尚未收到后半句</text><text x="383" y="382" font-size="17" fill="#244358" font-weight="400" text-anchor="start">车端仍在收音</text><rect x="680" y="265" width="270" height="145" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="698" y="297" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">400 ms：用户继续补话</text><text x="698" y="328" font-size="17" fill="#244358" font-weight="400" text-anchor="start">补上“附近的餐厅”</text><text x="698" y="355" font-size="17" fill="#244358" font-weight="400" text-anchor="start">文字继续增长并可能修正</text><text x="698" y="382" font-size="17" fill="#244358" font-weight="400" text-anchor="start">原停顿未达到硬门槛</text><path d="M100 227 L100 265" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M460 227 L460 265" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M580 227 L580 244 L815 244 L815 265" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="50" y="455" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">图上 600 ms 只是原停顿的门槛位置；此例在 400 ms 已恢复讲话，所以不会走到该次硬判停。</text><text x="50" y="525" font-size="21" fill="#203c51" font-weight="600" text-anchor="start">第二段停顿：说完“餐厅”，从新起点计时</text><path d="M100 600 L900 600" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M100 588V612" stroke="#476c8d"/><text x="100" y="580" font-size="17" fill="#244358" font-weight="400" text-anchor="middle">新的 0</text><path d="M460 588V612" stroke="#476c8d"/><text x="460" y="580" font-size="17" fill="#244358" font-weight="400" text-anchor="middle">300 ms</text><path d="M820 588V612" stroke="#476c8d"/><text x="820" y="580" font-size="17" fill="#244358" font-weight="400" text-anchor="middle">600 ms</text><rect x="50" y="650" width="270" height="145" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="68" y="682" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">当前整句已改变</text><text x="68" y="713" font-size="17" fill="#244358" font-weight="400" text-anchor="start">“……游泳馆附近的餐厅”</text><text x="68" y="740" font-size="17" fill="#244358" font-weight="400" text-anchor="start">前后两段沉默分别计时</text><text x="68" y="767" font-size="17" fill="#244358" font-weight="400" text-anchor="start">不能将其相加成一次停顿</text><rect x="365" y="650" width="270" height="145" rx="8" fill="#fff8eb" stroke="#d8bf8d"/><text x="383" y="682" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">软判停触发准备 2</text><text x="383" y="713" font-size="17" fill="#244358" font-weight="400" text-anchor="start">按包含餐厅的整句准备</text><text x="383" y="740" font-size="17" fill="#244358" font-weight="400" text-anchor="start">沿用同一 request_id</text><text x="383" y="767" font-size="17" fill="#244358" font-weight="400" text-anchor="start">round_id 标记新版本</text><rect x="680" y="650" width="270" height="145" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="698" y="682" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">硬判停后，二遍定稿</text><text x="698" y="713" font-size="17" fill="#244358" font-weight="400" text-anchor="start">本段音频收尾后重新识别</text><text x="698" y="740" font-size="17" fill="#244358" font-weight="400" text-anchor="start">final 还需计算及传输</text><text x="698" y="767" font-size="17" fill="#244358" font-weight="400" text-anchor="start">不保证恰在 600 ms 返回</text><path d="M100 612 L100 650" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M460 612 L460 650" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M820 612 L820 650" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M815 795 L815 865 L500 865 L500 925" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="540" y="852" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">正式请求带最终文字</text><rect x="170" y="925" width="660" height="150" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="188" y="957" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">核对最终文字与上一份准备</text><text x="188" y="988" font-size="17" fill="#244358" font-weight="400" text-anchor="start">最终文字仍是“……游泳馆附近的餐厅”：有可用准备才复用</text><text x="188" y="1015" font-size="17" fill="#244358" font-weight="400" text-anchor="start">最后准备仍是去泳馆，或二遍修正了文字：重算受影响的准备</text><text x="188" y="1042" font-size="17" fill="#244358" font-weight="400" text-anchor="start">同一 request_id 关联一次输入；round_id 区分其中各版本</text><text x="50" y="1120" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">若已经硬判停收尾后才补话，需按后续输入与打断接续规则处理。</text><text x="50" y="1147" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">它不再是仍留在原音频段中的补充；旧请求是否已办理也会影响处理。</text></g></svg>