l="none" stroke="white" stroke-width="7"/><polyline points="1120,597 1100.842105263158,597 1100.842105263158,1118.4347826086957 260,1118.4347826086957 260,1158" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,932 570.8421052631579,932 570.8421052631579,1282 460,1282" fill="none" stroke="white" stroke-width="7"/><polyline points="590,932 570.8421052631579,932 570.8421052631579,1282 460,1282" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="260,1158 260,1142.1739130434783 501.0526315789474,1142.1739130434783 501.0526315789474,1061.9130434782608 1099.4736842105262,1061.9130434782608 1099.4736842105262,932 1120,932" fill="none" stroke="white" stroke-width="7"/><polyline points="260,1158 260,1142.1739130434783 501.0526315789474,1142.1739130434783 501.0526315789474,1061.9130434782608 1099.4736842105262,1061.9130434782608 1099.4736842105262,932 1120,932" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><rect x="60" y="140" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="80" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L01</text><text x="80" y="202" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">车辆与任务具备运行条件</text><text x="80" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">先验电源、任务开关和资源</text><text x="80" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">持续观察/语音/AI总开关分开</text><text x="80" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">系统预设可保留无声卡片</text><text x="80" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不把本地能力等同全离线能力</text><rect x="590" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L02</text><text x="610" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">装入当前端侧任务规则</text><text x="610" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">先装入本车型已实现规则</text><text x="610" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">当前按端侧任务需求开发</text><text x="610" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">云平台保存不自动下发端能力</text><text x="610" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">端云统一配置属于后续建设</text><rect x="1120" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L03</text><text x="1140" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">订阅车况与本地视觉结果</text><text x="1140" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">接收挡位、车速、车灯等信号</text><text x="1140" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">接收需要的 VLM 感知结果</text><text x="1140" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">区分接收成功与结果真正到达</text><rect x="1120" y="488" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="1140" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L04</text><text x="1140" y="550" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">条件成立并且仍有效吗</text><text x="1140" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">判进入条件与当前对象</text><text x="1140" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">退出/抖动/重复独立处理</text><text x="1140" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">变化过程不能等同当前值</text><text x="1140" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">阈值/样本数只用已确认规则</text><rect x="590" y="488" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L05</text><text x="610" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">把命中事件交给原任务业务</text><text x="610" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">带上任务、场景与本次关联</text><text x="610" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">原业务决定固定动作或需要确认</text><text x="610" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Trigger 不直接承担卡片生命周期</text><rect x="60" y="488" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L06</text><text x="80" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">原业务发起即时交互卡</text><text x="80" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">业务注册正文/按钮/语音/时效</text><text x="80" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">卡片系统负责展示与避让</text><text x="80" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">点按/本地可见即可说回原业务</text><text x="80" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不是云端 Director 即时卡同一协议</text><rect x="60" y="836" width="400" height="192" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="80" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L07</text><text x="80" y="898" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">确认真的对应当前这张卡吗</text><text x="80" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">点击或本地可见即可说回到同一业务</text><text x="80" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">确认前再查任务状态与车况</text><text x="80" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">取消、超时、旧确认均不执行</text><rect x="590" y="836" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L08</text><text x="610" y="898" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">执行车控并读取真实状态</text><text x="610" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">原业务调用已支持的明确动作</text><text x="610" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">核对模式、车灯等实际状态</text><text x="610" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">失败或无回执时保留真实结果</text><rect x="1120" y="836" width="400" height="192" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="1140" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L09</text><text x="1140" y="898" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">更新结果并等待下一次</text><text x="1140" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">回写卡片、业务状态与运行记录</text><text x="1140" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">本次取消或条件失效就收尾</text><text x="1140" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">长期任务按规则继续等待</text><rect x="1120" y="1158" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="1140" y="1186" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L10</text><text x="1140" y="1220" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">本地卡片终止，不等于关闭服务</text><text x="1140" y="1259" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">关卡/超时：结束本次交互</text><text x="1140" y="1285" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">关任务：停止后续场景触发</text><text x="1140" y="1311" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">关持续观察：影响相应感知</text><text x="1140" y="1337" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">已完成车控另行决定是否恢复</text><rect x="590" y="1158" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="610" y="1186" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L11</text><text x="610" y="1220" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">本地与云端不得</text><text x="610" y="1250" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">重复执行同一动作</text><text x="610" y="1289" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">端侧执行结果需可回传追踪</text><text x="610" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">云侧是否取消按渠道仲裁</text><text x="610" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不能凭无网直接推定全本地</text><text x="610" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">同一场景需验重复/迟到结果</text><rect x="60" y="1158" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="1186" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">L12</text><text x="80" y="1220" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">本地失败按断点回报</text><text x="80" y="1259" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">信号缺失≠规则未命中</text><text x="80" y="1285" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">相机/模型失败≠没看见事件</text><text x="80" y="1311" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">卡片没展示≠用户拒绝</text><text x="80" y="1337" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">车控受理≠实际状态已改变</text><rect x="472.3157894736842" y="252.35384615384615" width="105.36842105263162" height="36" rx="3" fill="#FFFFFF"/><text x="478.3157894736842" y="276.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">允许运行</text><rect x="1002.3157894736842" y="252.35384