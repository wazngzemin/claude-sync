<text x="70" y="1735" font-size="23" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">云端 / 端侧的当前部署和断网能力待确认；泳道按任务来源区分，不表示部署位置。</tspan><tspan x="70" dy="33.35">黄色建议节点：闭环要求需评审确认。后台预置的执行结果由具体下游定义。</tspan></text>
