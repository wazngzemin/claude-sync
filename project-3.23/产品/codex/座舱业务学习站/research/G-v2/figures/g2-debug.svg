<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="g2-debug" width="1200" height="1390" viewBox="0 0 1200 1390" role="img" aria-labelledby="g2-debug-title g2-debug-desc">
<title id="g2-debug-title">该提醒没提醒、不该提醒却提醒了，从哪层查</title><desc id="g2-debug-desc">先锁定同一次触发，再从上往下找停在哪层；每层成功只代表这一层。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="g2-debug-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">该提醒没提醒、不该提醒却提醒了，从哪层查</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先锁定同一次触发，再从上往下找停在哪层；每层成功只代表这一层。</text>
<text class="v56-label" x="80" y="121" text-anchor="start">按同一次触发逐层核对</text>
<text class="v56-label" x="790" y="121" text-anchor="start">找谁：按职责协作</text>
<g data-node="true" id="g2-debug-1"><rect class="v56-neutral" x="80" y="150" width="650" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="178" text-anchor="start">01 · 生效范围和开关</text>
<text class="v56-node-sub" x="94" y="206" text-anchor="start">渠道、车辆、车型、客户端版本；账号开关是否允许</text>
</g>
<text class="v56-node-title" x="790" y="179" text-anchor="start">触发器 / 配置负责人</text>
<text class="v56-subtitle" x="790" y="210" text-anchor="start">范围不符、开关不符分开记</text>
<path class="v56-arrow" d="M 405 240 L 405 280" marker-end="url(#g2-debug-arr)"/>
<g data-node="true" id="g2-debug-2"><rect class="v56-cloud" x="80" y="280" width="650" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="308" text-anchor="start">02 · 规则登记、有效状态</text>
<text class="v56-node-sub" x="94" y="336" text-anchor="start">登记成功了吗；规则是有效、失效，还是已删除</text>
</g>
<text class="v56-node-title" x="790" y="309" text-anchor="start">触发器 / 任务服务 T 章</text>
<text class="v56-subtitle" x="790" y="340" text-anchor="start">用户任务核对原任务与登记回执</text>
<path class="v56-arrow" d="M 405 370 L 405 410" marker-end="url(#g2-debug-arr)"/>
<g data-node="true" id="g2-debug-3"><rect class="v56-local" x="80" y="410" width="650" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="438" text-anchor="start">03 · 信号到没到</text>
<text class="v56-node-sub" x="94" y="466" text-anchor="start">车端是否真的上报；信号版本、单位、时间是否正确</text>
</g>
<text class="v56-node-title" x="790" y="439" text-anchor="start">车端 / 信号负责人 B 章</text>
<text class="v56-subtitle" x="790" y="470" text-anchor="start">端云值与单位要能对应</text>
<path class="v56-arrow" d="M 405 500 L 405 540" marker-end="url(#g2-debug-arr)"/>
<g data-node="true" id="g2-debug-4"><rect class="v56-cloud" x="80" y="540" width="650" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="568" text-anchor="start">04 · 有没有叫醒</text>
<text class="v56-node-sub" x="94" y="596" text-anchor="start">上报的这个信号，会不会叫醒这条规则</text>
</g>
<text class="v56-node-title" x="790" y="569" text-anchor="start">触发器</text>
<text class="v56-subtitle" x="790" y="600" text-anchor="start">两个信号的先后顺序都要测</text>
<path class="v56-arrow" d="M 405 630 L 405 670" marker-end="url(#g2-debug-arr)"/>
<g data-node="true" id="g2-debug-5"><rect class="v56-decision" x="80" y="670" width="650" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="698" text-anchor="start">05 · 判断结果是什么</text>
<text class="v56-node-sub" x="94" y="726" text-anchor="start">明确不满足 / 未知 / 无法判断，要分开记</text>
</g>
<text class="v56-node-title" x="790" y="699" text-anchor="start">触发器 / 视觉判断负责人</text>
<text class="v56-subtitle" x="790" y="730" text-anchor="start">补输入、改条件、改目标分别处理</text>
<path class="v56-arrow" d="M 405 760 L 405 800" marker-end="url(#g2-debug-arr)"/>
<g data-node="true" id="g2-debug-6"><rect class="v56-decision" x="80" y="800" width="650" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="828" text-anchor="start">06 · 有没有被频控拦下</text>
<text class="v56-node-sub" x="94" y="856" text-anchor="start">总次数、单日、单次上电周期、最小执行间隔</text>
</g>
<text class="v56-node-title" x="790" y="829" text-anchor="start">触发器</text>
<text class="v56-subtitle" x="790" y="860" text-anchor="start">条件成立但拦下，也要留下记录</text>
<path class="v56-arrow" d="M 405 890 L 405 930" marker-end="url(#g2-debug-arr)"/>
<g data-node="true" id="g2-debug-7"><rect class="v56-cloud" x="80" y="930" width="650" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="958" text-anchor="start">07 · 出口有没有接收</text>
<text class="v56-node-sub" x="94" y="986" text-anchor="start">任务回调、建议、事件、第三方、通知卡逐个核对</text>
</g>
<text class="v56-node-title" x="790" y="959" text-anchor="start">任务服务 T 章 / Advisor S 章</text>
<text class="v56-subtitle" x="790" y="990" text-anchor="start">触发器与对应出口一起查回执</text>
<path class="v56-arrow" d="M 405 1020 L 405 1060" marker-end="url(#g2-debug-arr)"/>
<g data-node="true" id="g2-debug-8"><rect class="v56-local" x="80" y="1060" width="650" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="1088" text-anchor="start">08 · 下游有没有真正完成</text>
<text class="v56-node-sub" x="94" y="1116" text-anchor="start">真实展示、真实执行、播完，各看自己的回执</text>
</g>
<text class="v56-node-title" x="790" y="1089" text-anchor="start">Planner / 车端 / 业务出口</text>
<text class="v56-subtitle" x="790" y="1120" text-anchor="start">已接收不代表用户已经收到</text>
<text class="v56-label" x="80" y="1224" text-anchor="start">用场景编号、任务编号、车辆、时间、日志编号，把一次触发串起来。</text>
<path class="v56-rule" d="M 32 1262 L 1168 1262"/>
<text class="v56-node-title" x="32" y="1296" text-anchor="start">触发看规则匹配；触达看下游接收；用户感知还要继续核对。</text>
<rect data-decoration="true" class="v56-neutral" x="32.0" y="1322" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1336" text-anchor="start">灰：范围与前提</text>
<rect data-decoration="true" class="v56-cloud" x="316.0" y="1322" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="1336" text-anchor="start">绿：登记与交接</text>
<rect data-decoration="true" class="v56-local" x="600.0" y="1322" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="1336" text-anchor="start">蓝：车端与实际结果</text>
<rect data-decoration="true" class="v56-decision" x="884.0" y="1322" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="1336" text-anchor="start">黄：判断与频控</text>
</svg>
