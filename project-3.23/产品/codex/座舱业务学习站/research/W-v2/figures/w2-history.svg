<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="w2-history" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="w2-history-title w2-history-desc">
<title id="w2-history-title">点完以后，下一轮还要接得上</title><desc id="w2-history-desc">本地执行只是第一步；云端拿到真实的点击历史，才能理解后续选择。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="w2-history-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<path class="v56-arrow" d="M 274 280 L 330 280" fill="none" marker-end="url(#w2-history-arr)"/>
<path class="v56-arrow" d="M 572 280 L 628 280" fill="none" marker-end="url(#w2-history-arr)"/>
<path class="v56-arrow" d="M 870 280 L 926 280" fill="none" marker-end="url(#w2-history-arr)"/>
<path class="v56-arrow" d="M 600 470 L 600 300" fill="none" style="stroke:var(--red,#9c4148)"/>
<path class="v56-rule" d="M 592 272 L 608 288 M 608 272 L 592 288" fill="none" style="stroke:var(--red,#9c4148);stroke-width:2.4" data-risk-mark="true"/>
<g data-node="true" data-key="local">
<rect class="v56-local" x="32" y="210" width="242" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="237" text-anchor="start">本地拦截执行</text>
<text class="v56-node-sub" x="46" y="262" text-anchor="start">页面匹配命中后直接点</text>
<text class="v56-node-sub" x="46" y="283" text-anchor="start">实际目标与执行结果已产生</text>
</g>
<g data-node="true" data-key="sync">
<rect class="v56-neutral" x="330" y="210" width="242" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="344" y="237" text-anchor="start">上报模拟点击历史</text>
<text class="v56-node-sub" x="344" y="262" text-anchor="start">同步本次选择与执行结果</text>
<text class="v56-node-sub" x="344" y="283" text-anchor="start">写入 Planner 工具调用记录</text>
</g>
<g data-node="true" data-key="read">
<rect class="v56-cloud" x="628" y="210" width="242" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="642" y="237" text-anchor="start">Planner 下一轮读历史</text>
<text class="v56-node-sub" x="642" y="262" text-anchor="start">读到“刚才点了什么”</text>
<text class="v56-node-sub" x="642" y="283" text-anchor="start">沿用这次操作的真实结果</text>
</g>
<g data-node="true" data-key="continue">
<rect class="v56-cloud" x="926" y="210" width="242" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="940" y="237" text-anchor="start">接住下一句</text>
<text class="v56-node-sub" x="940" y="262" text-anchor="start">用户说“再往下一个”</text>
<text class="v56-node-sub" x="940" y="283" text-anchor="start">沿用刚才的选择继续处理</text>
</g>
<g data-node="true" data-key="risk">
<rect class="v56-reject" x="330" y="470" width="540" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="344" y="497" text-anchor="start">断点风险：上报失败／车机版本过旧</text>
<text class="v56-node-sub" x="344" y="522" text-anchor="start">本地已经执行，云端却缺少这次记录</text>
<text class="v56-node-sub" x="344" y="543" text-anchor="start">下一轮可能接不上“再往下一个”</text>
</g>
<rect data-legend="true" class="v56-local" x="32" y="685" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-neutral" x="275" y="685" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-cloud" x="520" y="685" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-reject" x="765" y="685" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-title" x="32" y="44" text-anchor="start">点完以后，下一轮还要接得上</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">本地执行只是第一步；云端拿到真实的点击历史，才能理解后续选择。</text>
<text class="v56-label" x="32" y="146" text-anchor="start">这一轮：车上执行并回写</text>
<text class="v56-label" x="628" y="146" text-anchor="start">下一轮：Planner 读历史继续处理</text>
<text class="v56-label" x="618" y="416" text-anchor="start">历史可能在这里断开</text>
<text class="v56-subtitle" x="32" y="650" text-anchor="start">补传历史只补记录，不重新下发点击。</text>
<text class="v56-subtitle" x="60" y="699" text-anchor="start">蓝：本地执行</text>
<text class="v56-subtitle" x="303" y="699" text-anchor="start">灰：历史记录</text>
<text class="v56-subtitle" x="548" y="699" text-anchor="start">绿：云端衔接</text>
<text class="v56-subtitle" x="793" y="699" text-anchor="start">红：回写断点</text>
</svg>
