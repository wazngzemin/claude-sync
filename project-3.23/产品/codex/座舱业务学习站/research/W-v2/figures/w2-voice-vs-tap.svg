<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="w2-voice-vs-tap" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="w2-voice-vs-tap-title w2-voice-vs-tap-desc">
<title id="w2-voice-vs-tap-title">同一个选项，语音和手点走两条路</title><desc id="w2-voice-vs-tap-desc">语音先判断接不接；手点直接生成事件。有效选择与执行结果都要进入历史。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="w2-voice-vs-tap-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<path class="v56-rule" d="M 600 108 L 600 625" fill="none"/>
<path class="v56-arrow" d="M 300 260 L 300 325" fill="none" marker-end="url(#w2-voice-vs-tap-arr)"/>
<path class="v56-arrow" d="M 300 437 L 300 502" fill="none" marker-end="url(#w2-voice-vs-tap-arr)"/>
<path class="v56-arrow" d="M 900 260 L 900 325" fill="none" marker-end="url(#w2-voice-vs-tap-arr)"/>
<path class="v56-arrow" d="M 900 437 L 900 502" fill="none" marker-end="url(#w2-voice-vs-tap-arr)"/>
<path class="v56-arrow" d="M 300 602 L 300 650 L 600 650 L 600 700" fill="none" marker-end="url(#w2-voice-vs-tap-arr)"/>
<path class="v56-arrow" d="M 900 602 L 900 650 L 600 650" fill="none" marker-end="url(#w2-voice-vs-tap-arr)"/>
<g data-node="true" data-key="reject">
<rect class="v56-decision" x="80" y="160" width="440" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="187" text-anchor="start">拒识：这句话接不接</text>
<text class="v56-node-sub" x="94" y="212" text-anchor="start">不接 → 结束，不进入 Planner 对话历史</text>
</g>
<g data-node="true" data-key="planner">
<rect class="v56-cloud" x="80" y="325" width="440" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="352" text-anchor="start">Planner 理解选择</text>
<text class="v56-node-sub" x="94" y="377" text-anchor="start">读对话历史，或调用动态工具</text>
<text class="v56-node-sub" x="94" y="398" text-anchor="start">找出用户要选的目标</text>
</g>
<g data-node="true" data-key="voice-execute">
<rect class="v56-local" x="80" y="502" width="440" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="529" text-anchor="start">车机执行</text>
<text class="v56-node-sub" x="94" y="554" text-anchor="start">把被接纳的选择交给执行方</text>
<text class="v56-node-sub" x="94" y="575" text-anchor="start">取得执行结果与实际变化</text>
</g>
<g data-node="true" data-key="event">
<rect class="v56-neutral" x="680" y="160" width="440" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="694" y="187" text-anchor="start">手点产生 event</text>
<text class="v56-node-sub" x="694" y="212" text-anchor="start">事件，不是模拟 query；不走拒识</text>
</g>
<g data-node="true" data-key="tap-execute">
<rect class="v56-local" x="680" y="325" width="440" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="694" y="352" text-anchor="start">业务直接执行</text>
<text class="v56-node-sub" x="694" y="377" text-anchor="start">按点击目标调用执行方</text>
<text class="v56-node-sub" x="694" y="398" text-anchor="start">取得执行结果与实际变化</text>
</g>
<g data-node="true" data-key="tap-report">
<rect class="v56-neutral" x="680" y="502" width="440" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="694" y="529" text-anchor="start">上报手点事件与结果</text>
<text class="v56-node-sub" x="694" y="554" text-anchor="start">把实际操作告诉云端</text>
<text class="v56-node-sub" x="694" y="575" text-anchor="start">供后续对话读取</text>
</g>
<g data-node="true" data-key="history">
<rect class="v56-neutral" x="400" y="700" width="400" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="414" y="727" text-anchor="start">两条有效操作都进入历史</text>
<text class="v56-node-sub" x="414" y="752" text-anchor="start">记录选了什么、执行结果与实际变化</text>
</g>
<rect data-legend="true" class="v56-decision" x="32" y="835" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-cloud" x="270" y="835" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-local" x="515" y="835" width="18" height="18" rx="8" stroke-width="1.6"/>
<rect data-legend="true" class="v56-neutral" x="760" y="835" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-title" x="32" y="44" text-anchor="start">同一个选项，语音和手点走两条路</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">语音先判断接不接；手点直接生成事件。有效选择与执行结果都要进入历史。</text>
<text class="v56-node-title" x="80" y="125" text-anchor="start">语音选择：说“第二个”</text>
<text class="v56-node-title" x="680" y="125" text-anchor="start">手点：点击第二个选项</text>
<text class="v56-label" x="315" y="295" text-anchor="start">接</text>
<text class="v56-subtitle" x="60" y="849" text-anchor="start">黄：接话判断</text>
<text class="v56-subtitle" x="298" y="849" text-anchor="start">绿：云端理解</text>
<text class="v56-subtitle" x="543" y="849" text-anchor="start">蓝：车上执行</text>
<text class="v56-subtitle" x="788" y="849" text-anchor="start">灰：事件与历史记录</text>
</svg>
