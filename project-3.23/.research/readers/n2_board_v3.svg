<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" font-family="Noto Sans SC">
  <rect width="1300" height="900" fill="#fafbfd"/>

  <text x="30" y="32" font-size="20" font-weight="700" fill="#1a1a1a">N2｜Always On 与 Watcher：全时观察和情境描述</text>
  <text x="30" y="52" font-size="12" fill="#5f6368">左：端侧多模持续监听；右：云端分发。情景→记忆、事件→触发器、连续对话→R13。</text>

  <!-- 端侧框 -->
  <rect x="20" y="75" width="540" height="660" rx="8" fill="#e8f0fe" stroke="#4285F4" stroke-width="2"/>
  <text x="35" y="97" font-size="13" font-weight="700" fill="#1a56c9">端侧（Always On，不下云）</text>

  <!-- N2-01 -->
  <rect x="40" y="115" width="160" height="60" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="50" y="135" font-size="11" font-weight="700" fill="#1a1a1a">N2-01 端侧输入</text>
  <text x="50" y="151" font-size="10" fill="#3c4043">4音区音频+摄像头+车端信号</text>
  <text x="50" y="167" font-size="10" fill="#3c4043">① 不依赖用户发起</text>

  <!-- N2-02 Watcher -->
  <rect x="230" y="115" width="310" height="70" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="245" y="135" font-size="11" font-weight="700" fill="#1a1a1a">N2-02 Watcher 端侧多模</text>
  <text x="245" y="151" font-size="10" fill="#3c4043">要点：永远不睡觉的观察者</text>
  <text x="245" y="167" font-size="10" fill="#3c4043">① 发现值得叫醒一次的事件　② 不是 G 图本身</text>

  <!-- N2-03 四态 -->
  <rect x="230" y="205" width="180" height="60" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="245" y="225" font-size="11" font-weight="700" fill="#7f1d1d">N2-03 四态</text>
  <text x="245" y="241" font-size="10" fill="#3c4043">Reject / Interrupt</text>
  <text x="245" y="257" font-size="10" fill="#3c4043">Response / Listen</text>

  <!-- N2-12 音区开关 -->
  <rect x="40" y="205" width="170" height="60" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="50" y="225" font-size="11" font-weight="700" fill="#1a1a1a">N2-12 音区开关</text>
  <text x="50" y="241" font-size="10" fill="#3c4043">座椅传感器+Face ID 判有人</text>
  <text x="50" y="257" font-size="10" fill="#3c4043">① 无人不开该音区</text>

  <!-- N2-13 强召回 -->
  <rect x="40" y="290" width="170" height="60" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="50" y="310" font-size="11" font-weight="700" fill="#1a1a1a">N2-13 强召回</text>
  <text x="50" y="326" font-size="10" fill="#3c4043">唤醒词"豆包"及泛化说法</text>
  <text x="50" y="342" font-size="10" fill="#3c4043">① 强制判人机对话</text>

  <!-- N2-14 强拒识 -->
  <rect x="230" y="290" width="180" height="60" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="245" y="310" font-size="11" font-weight="700" fill="#7f1d1d">N2-14 强拒识</text>
  <text x="245" y="326" font-size="10" fill="#3c4043">识别手持手机打电话</text>
  <text x="245" y="342" font-size="10" fill="#b3261e">① 该音区不响应不上云</text>

  <!-- N2-15 话题继承 -->
  <rect x="40" y="375" width="170" height="60" rx="6" fill="#e6f4ea" stroke="#34A853" stroke-width="1.5"/>
  <text x="50" y="395" font-size="11" font-weight="700" fill="#1e7e34">N2-15 话题继承</text>
  <text x="50" y="411" font-size="10" fill="#3c4043">每 5 轮总结话题（8 类）</text>
  <text x="50" y="427" font-size="10" fill="#3c4043">① 召回时带上文</text>

  <!-- N2-16 连续对话 -->
  <rect x="230" y="375" width="180" height="60" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="245" y="395" font-size="11" font-weight="700" fill="#1a1a1a">N2-16 连续对话 30s</text>
  <text x="245" y="411" font-size="10" fill="#3c4043">上屏 ASR 最终文本</text>
  <text x="245" y="427" font-size="10" fill="#3c4043">① 30s 无指令退全时态</text>

  <!-- N2-17 高风险 -->
  <rect x="40" y="460" width="370" height="50" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="50" y="480" font-size="11" font-weight="700" fill="#7f1d1d">N2-17 高风险二次确认</text>
  <text x="50" y="496" font-size="10" fill="#3c4043">关 ESP / 解儿童锁 / 支付 → 仅主驾或二次确认</text>

  <!-- N2-04 情境描述 -->
  <rect x="40" y="535" width="170" height="60" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="50" y="555" font-size="11" font-weight="700" fill="#1a1a1a">N2-04 情境描述</text>
  <text x="50" y="571" font-size="10" fill="#3c4043">流式：车库/两人靠近/抱纸箱</text>

  <!-- N2-05 事件发现 -->
  <rect x="230" y="535" width="180" height="60" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="245" y="555" font-size="11" font-weight="700" fill="#1a1a1a">N2-05 事件发现</text>
  <text x="245" y="571" font-size="10" fill="#3c4043">云端 Agent 自然语言注册</text>

  <!-- N2-19 视觉持续任务（加宽独占一行） -->
  <rect x="40" y="615" width="240" height="65" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="55" y="638" font-size="11" font-weight="700" fill="#1a1a1a">N2-19 视觉持续任务</text>
  <text x="55" y="654" font-size="10" fill="#3c4043">逐图预测 [SILENT] / [SPEAK]</text>
  <text x="55" y="670" font-size="10" fill="#3c4043">① 主驾入睡→[SPEAK] 降媒体音量</text>

  <!-- N2-20 司机Agent（长期，独占一行右侧） -->
  <rect x="300" y="615" width="240" height="65" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="3,2" stroke-width="1.5"/>
  <text x="315" y="638" font-size="11" font-weight="700" fill="#3c4043">N2-20 司机 Agent 视觉（长期愿景）</text>
  <text x="315" y="654" font-size="10" fill="#5f6368">舱驾融合：临停 / 泊车 / 智驾风格</text>
  <text x="315" y="670" font-size="10" fill="#5f6368">② 2.6 不做</text>

  <!-- 云端框 -->
  <rect x="590" y="75" width="690" height="660" rx="8" fill="#e6f4ea" stroke="#34A853" stroke-width="2"/>
  <text x="605" y="97" font-size="13" font-weight="700" fill="#1e7e34">云端加工与分发（自上而下主链）</text>

  <!-- 竖向主链（蓝色虚线骨架） -->
  <line x1="700" y1="130" x2="700" y2="640" stroke="#4285F4" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- N2-07 短期记忆 -->
  <rect x="730" y="120" width="280" height="60" rx="6" fill="#fff" stroke="#34A853" stroke-width="1.5"/>
  <text x="745" y="140" font-size="11" font-weight="700" fill="#1e7e34">N2-07 短期记忆</text>
  <text x="745" y="156" font-size="10" fill="#3c4043">带 timestamp；≈v15 A06 供 C4、B06 供 C1</text>

  <!-- N2-18 任务四分类 -->
  <rect x="730" y="205" width="280" height="60" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="745" y="225" font-size="11" font-weight="700" fill="#1a1a1a">N2-18 任务四分类</text>
  <text x="745" y="241" font-size="10" fill="#3c4043">单步 / 条件 / 多步 / 持续</text>

  <!-- N2-08 G01 -->
  <rect x="730" y="290" width="280" height="60" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="745" y="310" font-size="11" font-weight="700" fill="#1a1a1a">N2-08 G01 云端触发器登记</text>
  <text x="745" y="326" font-size="10" fill="#3c4043">一期：全部工程触发入口</text>

  <!-- N2-09 G链路 -->
  <rect x="730" y="375" width="280" height="65" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="745" y="395" font-size="11" font-weight="700" fill="#1a1a1a">N2-09 G 链路</text>
  <text x="745" y="411" font-size="10" fill="#3c4043">G03 叫醒 → G05 条件 → G06 频控 → G08 分发</text>
  <text x="745" y="427" font-size="10" fill="#3c4043">① Watcher 只"叫醒一次"，条件成立是 G 的事</text>

  <!-- N2-10 静态Advisor -->
  <rect x="730" y="465" width="280" height="65" rx="6" fill="#fff" stroke="#34A853" stroke-width="1.5"/>
  <text x="745" y="485" font-size="11" font-weight="700" fill="#1e7e34">N2-10 S01 静态 Advisor</text>
  <text x="745" y="501" font-size="10" fill="#3c4043">舒适 / 出行 / 情感 / 内容</text>
  <text x="745" y="517" font-size="10" fill="#3c4043">① 后排哭了→情感 Advisor 递纸巾</text>

  <!-- N2-11 进主链 -->
  <rect x="730" y="555" width="280" height="60" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="745" y="575" font-size="11" font-weight="700" fill="#1a1a1a">N2-11 进主链</text>
  <text x="745" y="591" font-size="10" fill="#3c4043">R13 免唤醒判断 → V12 正式 query 进主链</text>

  <!-- 主链节点到蓝线的短连接 -->
  <line x1="730" y1="150" x2="700" y2="150" stroke="#4285F4" stroke-width="2"/>
  <line x1="730" y1="235" x2="700" y2="235" stroke="#f9ab00" stroke-width="2"/>
  <line x1="730" y1="320" x2="700" y2="320" stroke="#f9ab00" stroke-width="2"/>
  <line x1="730" y1="407" x2="700" y2="407" stroke="#f9ab00" stroke-width="2"/>
  <line x1="730" y1="497" x2="700" y2="497" stroke="#34A853" stroke-width="2"/>
  <line x1="730" y1="585" x2="700" y2="585" stroke="#4285F4" stroke-width="2"/>

  <!-- 端到云绕行连线（沿分区边框走，不斜穿） -->
  <!-- N2-04 → N2-07 短期记忆（绿色：情境→记忆） -->
  <polyline points="210,565 210,90 650,90 650,150 730,150" fill="none" stroke="#34A853" stroke-width="2"/>
  <!-- N2-05 → N2-18 任务分类（金色：事件→分类） -->
  <polyline points="410,565 570,565 570,235 730,235" fill="none" stroke="#f9ab00" stroke-width="2"/>
  <!-- N2-19 → N2-08 G01（金色：视觉任务→触发器登记） -->
  <polyline points="280,647 560,647 560,320 730,320" fill="none" stroke="#f9ab00" stroke-width="2"/>
  <!-- N2-16 → N2-11 进主链（蓝色虚线：连续对话→R13） -->
  <polyline points="410,405 580,405 580,585 730,585" fill="none" stroke="#4285F4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- N2-02 → N2-03 四态 -->
  <line x1="385" y1="185" x2="385" y2="205" stroke="#4285F4" stroke-width="2"/>
  <!-- N2-03 → N2-12 音区开关 -->
  <line x1="320" y1="265" x2="125" y2="265" stroke="#4285F4" stroke-width="2"/>

  <!-- 图例 -->
  <rect x="20" y="760" width="1260" height="120" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1"/>
  <text x="35" y="782" font-size="12" font-weight="700" fill="#1a1a1a">图例</text>
  <rect x="35" y="795" width="18" height="12" fill="#fff" stroke="#4285F4"/>
  <text x="60" y="805" font-size="10" fill="#3c4043">蓝=端侧主路</text>
  <rect x="150" y="795" width="18" height="12" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="175" y="805" font-size="10" fill="#3c4043">金=任务/触发器（G 链）</text>
  <rect x="310" y="795" width="18" height="12" fill="#fce8e6" stroke="#d93025"/>
  <text x="335" y="805" font-size="10" fill="#3c4043">红=拒识/高风险</text>
  <rect x="440" y="795" width="18" height="12" fill="#e6f4ea" stroke="#34A853"/>
  <text x="465" y="805" font-size="10" fill="#3c4043">绿=云端分发/记忆回流</text>
  <rect x="590" y="795" width="18" height="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="2,1"/>
  <text x="615" y="805" font-size="10" fill="#3c4043">灰虚线=长期愿景（2.6 后）</text>
  <line x1="780" y1="801" x2="810" y2="801" stroke="#4285F4" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="818" y="805" font-size="10" fill="#3c4043">蓝虚线=主链骨架</text>
  <polyline points="930,801 950,801 950,815 970,815" fill="none" stroke="#f9ab00" stroke-width="2"/>
  <text x="978" y="808" font-size="10" fill="#3c4043">绕行=端到云</text>

  <text x="35" y="838" font-size="10" font-weight="700" fill="#1a1a1a">易错点：</text>
  <text x="90" y="838" font-size="10" fill="#3c4043">① N2-02 不是 G 图——Watcher 只"叫醒一次"，条件成不成立是 G03/G05/G06 的事；</text>
  <text x="90" y="856" font-size="10" fill="#3c4043">② N2-14 强拒识≠N2-03 Reject——是"该音区整体闭嘴"，连文字都不上云，排障查不到 ASR 日志属正常；</text>
  <text x="90" y="874" font-size="10" fill="#3c4043">③ N2-15 话题总结喂给召回上文，不是长期记忆；N2-20 司机 Agent 是长期愿景，2.6 不做。</text>
</svg>
