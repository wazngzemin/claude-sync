  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">流程三：播报被打断以后，什么才交给 Director</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,188 350,254" marker-end="url(#arrow-EV-tts)"><title>et1 → et2：先确立播放事实</title></polyline><polyline class="arr" fill="none" points="350,359 350,425" marker-end="url(#arrow-EV-tts)"><title>et2 → et3：结合当前声音判断</title></polyline><polyline class="arr" fill="none" points="350,527 350,593" marker-end="url(#arrow-EV-tts)"><title>et3 → et4：新 query 有效</title></polyline><polyline class="arr" fill="none" points="176,479 60,479 60,821 170,821" marker-end="url(#arrow-EV-tts)"><title>et3 → et5：新 query 被拒识</title></polyline><polyline class="arr" fill="none" points="176,647 70,647 70,1013 170,1013" marker-end="url(#arrow-EV-tts)"><title>et4 → et6：输入管理后处理</title></polyline><polyline class="arr" fill="none" points="350,869 350,935" marker-end="url(#arrow-EV-tts)"><title>et5 → et6：按 event 语义处理</title></polyline><polyline class="arr" fill="none" points="350,1061 350,1127" marker-end="url(#arrow-EV-tts)"><title>et6 → et7：有价值且适合继续</title></polyline><polyline class="arr" fill="none" points="176,989 100,989 100,1339 170,1339" marker-end="url(#arrow-EV-tts)"><title>et6 → et8：不需/不应续接</title></polyline><text class="ts" x="365" y="224" text-anchor="start" dominant-baseline="central">E1 · 先确立播放事实</text><text class="ts" x="365" y="395" text-anchor="start" dominant-baseline="central">E2 · 结合当前声音判断</text><text class="ts" x="365" y="563" text-anchor="start" dominant-baseline="central">E3 · 新 query 有效</text><text class="ts" x="168" y="471" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="168" y="833" text-anchor="end" dominant-baseline="central">E4</text><text class="ts" x="168" y="639" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="168" y="1025" text-anchor="end" dominant-baseline="central">E5</text><text class="ts" x="365" y="905" text-anchor="start" dominant-baseline="central">E6 · 按 event 语义处理</text><text class="ts" x="365" y="1097" text-anchor="start" dominant-baseline="central">E7 · 有价值且适合继续</text><text class="ts" x="168" y="981" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="168" y="1351" text-anchor="end" dominant-baseline="central">E8</text><g class="c-gray" role="link" tabindex="0" data-page="EV" data-flow="EV-tts" data-step="et1" aria-label="播放被新声音打断"><title>端侧先发生音频停止；记录真实已播/未播片段</title><rect x="180" y="106" width="340" height="78" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">播放被新声音打断</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">端侧先发生音频停止；记录真实已播/未播片段</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-tts" data-step="et2" aria-label="关联原播报轮次"><title>对齐 request_id 等关联信息；避免拿上一条无关播报恢复</title><rect x="180" y="264" width="340" height="91" rx="6"/><text class="th" x="198" y="288" text-anchor="start" dominant-baseline="central">关联原播报轮次</text><text class="ts" x="198" y="316" text-anchor="start" dominant-baseline="central">对齐 request_id 等关联信息；避免拿上一条无关播</text><text class="ts" x="198" y="335" text-anchor="start" dominant-baseline="central">报恢复</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-tts" data-step="et3" aria-label="判断新 query 是否有效"><title>拒识与打断不是同一个判断；保留实际识别结果</title><rect x="180" y="435" width="340" height="88" rx="6"/><text class="th" x="198" y="459" text-anchor="start" dominant-baseline="central">判断新 query 是否有效</text><text class="ts" x="198" y="487" text-anchor="start" dominant-baseline="central">拒识与打断不是同一个判断；保留实际识别结果</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-tts" data-step="et4" aria-label="有效新诉求"><title>新 query + last_talk_content；告知旧动作是否已下发</title><rect x="180" y="603" width="340" height="91" rx="6"/><text class="th" x="198" y="627" text-anchor="start" dominant-baseline="central">有效新诉求</text><text class="ts" x="198" y="655" text-anchor="start" dominant-baseline="central">新 query + last_talk_content；告知旧动作是否</text><text class="ts" x="198" y="674" text-anchor="start" dominant-baseline="central">已下发</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-tts" data-step="et5" aria-label="独立 event 事实"><title>新声音被拒识但确实打断旧播报；事实是发生打断，不是必须续播</title><rect x="180" y="774" width="340" height="91" rx="6"/><text class="th" x="198" y="798" text-anchor="start" dominant-baseline="central">独立 event 事实</text><text class="ts" x="198" y="826" text-anchor="start" dominant-baseline="central">新声音被拒识但确实打断旧播报；事实是发生打断，</text><text class="ts" x="198" y="845" text-anchor="start" dominant-baseline="central">不是必须续播</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-tts" data-step="et6" aria-label="Director 评估内容价值"><title>相关问题合并，长内容提炼；用户不想听或无实质剩余可跳过</title><rect x="180" y="945" width="340" height="112" rx="6"/><text class="th" x="198" y="969" text-anchor="start" dominant-baseline="central">Director 评估内容价值</text><text class="ts" x="198" y="997" text-anchor="start" dominant-baseline="central">相关问题合并，长内容提炼；用户不想听或无实质剩</text><text class="ts" x="198" y="1016" text-anchor="start" dominant-baseline="central">余可跳过</text></g><g class="c-teal" role="link" tabindex="0" data-page="EV" data-flow="EV-tts" data-step="et7" aria-label="续接或回应新问题"><title>不重放已播片段；不重复已下发动作</title><rect x="180" y="1137" width="340" height="78" rx="6"/><text class="th" x="198" y="1161" text-anchor="start" dominant-baseline="central">续接或回应新问题</text><text class="ts" x="198" y="1189" text-anchor="start" dominant-baseline="central">不重放已播片段；不重复已下发动作</text></g><g class="c-gray" role="link" tabindex="0" data-page="EV" data-flow="EV-tts" data-step="et8" aria-label="不再补说"><title>保持沉默也可能是正确结果；保留选择依据用于复盘</title><rect x="180" y="1295" width="340" height="88" rx="6"/><text class="th" x="198" y="1319" text-anchor="start" dominant-baseline="central">不再补说</text><text class="ts" x="198" y="1347" text-anchor="start" dominant-baseline="central">保持沉默也可能是正确结果；保留选择依据用于复盘</text></g><text class="th" x="40" y="1467" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1497" text-anchor="start" dominant-baseline="central">E1 播放被新声音打断 → 关联原播报轮次：先确立播放事实</text><text class="ts" x="40" y="1530" text-anchor="start" dominant-baseline="central">E2 关联原播报轮次 → 判断新 query 是否有效：结合当前声音判断</text><text class="ts" x="40" y="1563" text-anchor="start" dominant-baseline="central">E3 判断新 query 是否有效 → 有效新诉求：新 query 有效</text><text class="ts" x="40" y="1596" text-anchor="start" dominant-baseline="central">E4 判断新 query 是否有效 → 独立 event 事实：新 query 被拒识</text><text class="ts" x="40" y="1629" text-anchor="start" dominant-baseline="central">E5 有效新诉求 → Director 评估内容价值：输入管理后处理</text><text class="ts" x="40" y="1662" text-anchor="start" dominant-baseline="central">E6 独立 event 事实 → Director 评估内容价值：按 event 语义处理</text><text class="ts" x="40" y="1695" text-anchor="start" dominant-baseline="central">E7 Director 评估内容价值 → 续接或回应新问题：有价值且适合继续</text><text class="ts" x="40" y="1728" text-anchor="start" dominant-baseline="central">E8 Director 评估内容价值 → 不再补说：不需/不应续接</text></svg>