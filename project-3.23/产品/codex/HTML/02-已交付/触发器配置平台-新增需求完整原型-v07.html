<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>触发器配置平台 · 新增需求完整原型 v07</title>
<style>
:root{--blue:#165dff;--blue2:#4080ff;--ink:#1d2129;--sub:#4e5969;--muted:#86909c;--line:#e5e6eb;--bg:#f7f8fa;--nav:#00152d;--orange:#ff7d00;--red:#f53f3f;--green:#00b42a;--purple:#722ed1;--cyan:#0fc6c2}
*{box-sizing:border-box}
body{margin:0;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:2px;padding:5px 12px;line-height:20px;cursor:pointer}
button:hover{border-color:var(--blue);color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:var(--blue2);color:#fff}
button.link{border:0;color:var(--blue);padding:2px 6px}
button.danger{color:var(--red);border:0;background:none}
button:disabled{color:var(--muted);background:#f7f8fa;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:2px;padding:5px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.app{display:flex;min-height:100vh}
.side{width:208px;background:var(--nav);flex:none;color:#c9cdd4;min-height:100vh;position:sticky;top:0}
.side .logo{height:56px;display:flex;align-items:center;padding:0 20px;color:#fff;font-weight:700;font-size:15px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .group{color:#86909c;font-size:12px;padding:12px 20px 6px}
.side .item{padding:9px 20px 9px 44px;cursor:pointer}
.side .item.parent{padding-left:20px;color:#fff}
.side .item.active{background:rgba(22,93,255,.18);color:#fff;box-shadow:inset:2px 0 0 var(--blue)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px}
.topbar .crumb{color:var(--sub)}
.topbar .me{margin-left:auto;font-size:12px;color:var(--muted)}
.content{padding:16px 20px;flex:1;padding-bottom:80px}
.card{background:#fff;border:1px solid var(--line);border-radius:2px;margin-bottom:12px}
.card .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-weight:600}
.card .hd .grow{flex:1}
.card .bd{padding:16px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;white-space:nowrap}
th{background:#f7f8fa;color:var(--sub);font-weight:600;font-size:12px}
td .sub,.sub{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:1px 7px;border-radius:2px;font-size:12px;border:1px solid var(--line);background:#fff;color:#4e5969}
.badge.blue{color:var(--blue);border-color:#bedaff;background:#e8f3ff}
.badge.green{color:var(--green);border-color:#b7ebc8;background:#e8ffea}
.badge.gray{color:#86909c}
.badge.orange{color:var(--orange);border-color:#ffd8a8;background:#fff7e8}
.badge.purple{color:var(--purple);border-color:#d9c7f5;background:#f5edff}
.badge.red{color:var(--red);border-color:#fdc4c4;background:#ffece8}
.badge.cyan{color:#0a8c89;border-color:#a0e8e6;background:#e8fffe}
.tag-new{background:var(--orange);border-color:var(--orange);color:#fff;font-size:11px;padding:0 5px;margin-left:6px;border-radius:2px}
.tag-dev{background:#fff7e8;border:1px solid #ffd8a8;color:#9e5c00;font-size:11px;padding:0 6px;border-radius:2px}
.sec{border:1px solid var(--line);margin-bottom:12px}
.sec>.sh{background:#f7f8fa;padding:9px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.sec>.sb{padding:16px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;max-width:900px}
.fgrid .full{grid-column:1/-1}
.fld{display:flex;align-items:flex-start;gap:10px}
.fld>label{width:104px;flex:none;color:var(--sub);text-align:right;padding-top:6px}
.fld .ctl{flex:1}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0 114px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 14px}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
/* DAG 画布 */
.canvas-wrap{display:flex;gap:14px}
.canvas{flex:1;border:1px solid var(--line);border-radius:2px;background:#fbfcfe;position:relative;height:430px;overflow:auto;background-image:radial-gradient(#e8eaee 1px,transparent 1px);background-size:18px 18px}
.node{position:absolute;width:172px;border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:9px 11px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.node .nt{font-size:11px;color:var(--muted)}
.node .nn{font-weight:600;margin:2px 0}
.node .nd{font-size:11px;color:var(--sub);line-height:1.45}
.node.condition{border-color:#7aa7ff}
.node.inference{border-color:#b69af0}
.node.sink{border-color:#63d48a;background:#f4ffF7}
.node.selected{box-shadow:0 0 0 3px rgba(22,93,255,.18)}
.node.pass .dot,.node.reject .dot,.node.unknown .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.node.pass .dot{background:var(--green)}.node.reject .dot{background:var(--red)}.node.unknown .dot{background:var(--orange)}
.props{width:300px;flex:none;border:1px solid var(--line);border-radius:2px;padding:14px;background:#fff}
.props h4{margin:0 0 10px;font-size:14px}
.edge-svg{position:absolute;left:0;top:0;pointer-events:none}
.cond-chip{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--sub);margin-top:5px;display:inline-block}
.join-switch{position:absolute;background:#fff;border:1px solid #c2d6ff;color:var(--blue);font-size:11px;border-radius:10px;padding:0 8px}
.legend{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.action-card{border:1px solid var(--line);border-radius:2px;padding:13px;margin-bottom:10px}
.action-card.flash{border:1.5px dashed var(--orange);background:#fffaf3}
.action-card.cardact{border:1.5px dashed var(--orange);background:#fffaf3}
.rowline{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.foot{position:fixed;bottom:0;right:0;left:208px;background:#fff;border-top:1px solid var(--line);padding:11px 20px;display:flex;gap:10px;justify-content:flex-end;z-index:20}
.strategy-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:900px}
.strategy-grid .si{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.strategy-grid input{width:66px}
.modal-mask{position:fixed;inset:0;background:rgba(29,33,41,.45);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{background:#fff;border-radius:4px;width:700px;max-width:94vw;max-height:88vh;overflow:auto}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.radio-card{border:1px solid var(--line);padding:13px 15px;margin-bottom:10px;border-radius:2px;cursor:pointer}
.radio-card:hover{border-color:var(--blue);background:#f2f7ff}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1d2129;color:#fff;padding:9px 18px;border-radius:4px;z-index:99}
.kv td:first-child{width:180px;color:var(--sub);background:#f7f8fa;white-space:nowrap}
.runline{display:flex;align-items:center;gap:0;margin:18px 0}
.runstep{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 14px;text-align:center;font-size:12px;min-width:120px}
.runstep b{display:block;font-size:13px}
.runarrow{flex:1;height:2px;background:#c9d4e8;position:relative}
.runarrow:after{content:"";position:absolute;right:0;top:-4px;border-left:8px solid #c9d4e8;border-top:5px solid transparent;border-bottom:5px solid transparent}
.pill{padding:3px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:12px;background:#fff}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.result3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.result3 .r{border:1px solid var(--line);border-radius:2px;padding:12px}
.result3 .r b{display:block;margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">AI 汽车管理平台</div>
    <div>
      <div class="group">模拟器</div><div class="item parent">模拟器管理</div>
      <div class="group">触发器</div>
      <div class="item active" id="navScene">场景管理</div>
      <div class="item" id="navRecord">触发记录</div>
      <div class="group">Agent 管理</div><div class="item parent">定义列表</div><div class="item parent">实现列表</div>
      <div class="group">Planner 管理</div><div class="item parent">动态示例管理</div>
      <div class="group">其他</div><div class="item parent">记忆管理</div><div class="item parent">日志查询</div><div class="item parent">快捷工具</div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar"><span class="crumb" id="crumb">触发器 / 场景管理</span><span class="me">wangzemin.cxzm / DoubaoIncar · 原型仅本地演示，不提交真实配置</span></div>
    <div class="content" id="app"></div>
  </div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
'use strict';
/* 触发器配置平台新增需求完整原型 v07
 * 依据：【触发器支持系统预设场景】技术方案（2026-10-09 评审通过）+ 豆包闪念需求（2026-10-14）
 * 白色=后台已有；橙色虚线=本次新增/改造；Workflow 整套（定义/节点/记录）为技术方案新增。 */
const ACTIONS=[
 {v:'comfort_advisor',n:'舒适 Advisor',params:['事件/注意力信息'],dev:false},
 {v:'emotion_advisor',n:'情感 Advisor',params:['事件/注意力信息'],dev:false},
 {v:'navigation_advisor',n:'出行 Advisor',params:['事件/注意力信息'],dev:false},
 {v:'content_advisor',n:'内容 Advisor',params:['事件/注意力信息'],dev:false},
 {v:'recommend',n:'主动推荐',params:['建议信息'],dev:false},
 {v:'recommend_with_card',n:'主动推荐带交互卡',params:['建议信息','交互卡内容'],dev:true},
 {v:'delay',n:'延时执行',params:['延时时长(秒)'],dev:false},
 {v:'custom_callback',n:'自定义回调',params:['回调HTTP地址','回调任务系统','回调事件系统'],dev:false},
 {v:'flash_text',n:'静默文字通知（豆包闪念）',params:['闪念固定文案'],dev:true,flash:true}
];
const VLM=[
 {code:'vlm_inside_001',n:'舱内视觉输出（低频）',judge:'位置/性别/年龄=条件判定；造型、物品动物、整体描述=仅推理'},

 {code:'vlm_outside',n:'舱外视觉输出',judge:'天气(下雨/下雪/浓雾)、路面(湿滑/结冰)=枚举条件；其他场景仅推理'}
];
const SCENES=[
 {id:4901,name:'【测试】-【lzq】-【testlzq】',mode:'简单',cat:'normal',stype:'vehicle_resource',src:'aidv_backend',tag:'test',on:true},
 {id:4623,name:'【测试】-【lvpo】-【删除测试】',mode:'简单',cat:'normal',stype:'vehicle_resource',src:'aidv_backend',tag:'test',on:true},
 {id:5324,name:'儿童锁保护（预设）',mode:'Workflow',cat:'preset',stype:'mix',src:'aidv_backend',tag:'formal',on:true,wf:'child'},
 {id:5325,name:'识别充电设备后打开充电口盖（预设）',mode:'Workflow',cat:'preset',stype:'mix',src:'aidv_backend',tag:'formal',on:false,wf:'charge'},
 {id:5326,name:'后视镜自动加热（预设）',mode:'Workflow',cat:'preset',stype:'mix',src:'aidv_backend',tag:'test',on:false,wf:'mirror'},
 {id:9101,name:'【闪念】后排乘客睡着',mode:'简单（vlm_inference 直注册，一期过渡）',cat:'normal',stype:'vlm_inference',src:'aidv_backend',tag:'test',on:false,flash:true},
 {id:9102,name:'【闪念】后排乘客睡着（二期 Workflow 形态）',mode:'Workflow',cat:'normal',stype:'vlm_inference',src:'aidv_backend',tag:'test',on:false,flash:true,wf:'flash'}
];
const WF={
 child:{label:'儿童锁保护',wake:'档位切换到 D（动态条件唤醒）',nodes:[
   {id:'n1',type:'condition',name:'档位变更为 D',desc:'端状态 · 车辆行进状态 → 变更为 D',x:24,y:40},
   {id:'n2',type:'condition',name:'后排存在儿童',desc:'vlm_inside_001 · 位置∈{左后,右后,二排中} 且 年龄∈{婴儿,儿童}；同对象',x:260,y:18},
   {id:'n3',type:'inference',name:'后排存在宠物',desc:'推理 Objects[].Desc 是否存在宠物',x:260,y:150},
   {id:'n4',type:'sink',name:'儿童锁未开启',desc:'唯一终点 · 自身仍需判断；前驱 OR',join:'OR',x:520,y:90}],
   edges:[['n1','n2'],['n1','n3'],['n2','n4'],['n3','n4']]},
 charge:{label:'识别充电设备后打开充电口盖',wake:'端状态上报唤醒（动态条件前置）',nodes:[
   {id:'n1',type:'condition',name:'AI 主动服务开关开启',desc:'账号配置 use_static_advisor=true',x:20,y:200},
   {id:'n2',type:'condition',name:'档位变更为 P',desc:'端状态',x:250,y:200},
   {id:'n3',type:'condition',name:'充电口盖关闭',desc:'端状态 vehicle_control',x:480,y:200},
   {id:'n4',type:'sink',name:'SOC ≤ 20%',desc:'唯一终点；阈值 20% 待业务最终确认',join:'AND',x:710,y:200}],
   edges:[['n1','n2'],['n2','n3'],['n3','n4']]},
 mirror:{label:'后视镜自动加热',wake:'档位/车速/VLM 信号唤醒',nodes:[
   {id:'n1',type:'condition',name:'档位=P',desc:'端状态',x:20,y:60},
   {id:'n2',type:'condition',name:'车速 < 70km/h',desc:'端状态；P 与车速业务含义待确认',x:240,y:60},
   {id:'n3',type:'inference',name:'下雨',desc:'推理 vlm_outside · WeatherDesc 是否含下雨',x:470,y:60},
   {id:'n4',type:'sink',name:'后视镜加热未开启',desc:'唯一终点 · OR；加热端状态信号待赛力斯提供',join:'OR',x:700,y:60},
   {id:'x1',type:'condition',name:'退出传送带洗车',desc:'信号缺失：不画入正式图，待赛力斯提供后复制新定义',x:470,y:200,missing:true}],
   edges:[['n1','n2'],['n2','n3'],['n3','n4']]},
 flash:{label:'豆包闪念 · 乘客睡着（二期 Workflow 形态）',wake:'推理触发：vlm_inside_002 信号 ID 唤醒',nodes:[
   {id:'n1',type:'condition',name:'alwaysOn 开关开启',desc:'账号配置前置条件：关闭时直接跳过，节省模型调用',x:24,y:70},
   {id:'n2',type:'inference',name:'乘客在后排睡着',desc:'推理 vlm_inside_002 · PassengerActions[].Action 是否达成目标',x:280,y:70},
   {id:'n3',type:'sink',name:'条件达成 → 静默文字通知',desc:'唯一终点；PASS 后执行 flash_text 动作',join:'AND',x:560,y:70}],
   edges:[['n1','n2'],['n2','n3']]}
};
let view='list',mode='简单',wfKey='child',selNode=null,readonly=false,tab='base',outcome='PASS';
let draft={name:'',channel:'赛力斯',vlmSig:'vlm_inside_002',vlmGoal:'',flashText:'',query:'',intervalSec:300};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){toastRoot.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>toastRoot.innerHTML='',2800)}

/* ============ P1 场景列表 ============ */
function viewList(){
 app.innerHTML=`
 <div class="card"><div class="hd">场景管理<span class="grow"></span><button class="primary" onclick="newSceneModal()">＋ 新建场景</button></div>
 <div class="bd">
  <div class="toolbar">
   <span>渠道</span><select style="width:120px"><option>AIDV主线 master</option></select>
   <span>环境 tag</span><select style="width:100px"><option>全部</option><option>formal</option><option>test</option></select>
   <span>分类</span><select style="width:120px"><option>全部</option><option>preset 预设</option><option>normal 普通</option></select>
   <span>场景类型</span><select style="width:130px"><option>全部</option><option>vehicle_resource</option><option>vlm_inference</option><option>timer</option><option>mix</option></select>
   <span>注册来源</span><select style="width:150px"><option>全部</option><option>aidv_backend 管理后台</option><option>aidv_task_service 任务系统</option><option>extour_dynamic_advisor 动态</option></select>
   <input placeholder="场景名称" style="width:150px"><input placeholder="场景ID" style="width:110px">
   <button>查询</button><button>重置</button>
  </div>
  <div class="sub" style="margin-bottom:8px">技术方案新增字段：<b>scene_category</b>（normal/preset，透出任务中心）、<b>scene_type</b> 增加 <b>mix</b>、<b>tag</b> 由服务端按部署环境附加；存量场景默认 normal。</div>
  <table><thead><tr><th>ID</th><th>场景名称</th><th>模式</th><th>分类</th><th>场景类型</th><th>注册来源</th><th>tag</th><th>状态</th><th>操作</th></tr></thead><tbody>
  ${SCENES.map(s=>`<tr>
   <td>${s.id}</td><td>${esc(s.name)}${s.flash?'<span class="tag-new">闪念</span>':''}</td>
   <td><span class="badge ${s.mode.includes('Workflow')?'purple':'blue'}">${s.mode}</span></td>
   <td><span class="badge ${s.cat==='preset'?'green':'gray'}">${s.cat}</span></td>
   <td>${s.stype}</td><td class="sub">${s.src}</td>
   <td><span class="badge ${s.tag==='formal'?'blue':'orange'}">${s.tag}</span></td>
   <td><span class="badge ${s.on?'green':'gray'}">${s.on?'开启':'失效'}</span></td>
   <td>${s.wf?`<button class="link" onclick="openWf('${s.wf}',true)">查看 Workflow</button>`:''}<button class="link" onclick="openConfig('${s.mode.includes('Workflow')?'workflow':'simple'}')">${s.mode.includes('Workflow')?'场景配置':'编辑'}</button><button class="link" onclick="openRecords()">记录</button></td>
  </tr>`).join('')}
  </tbody></table>
  <div class="sub" style="margin-top:10px">既有 Workflow 判断定义只读；修改走“复制为新 Workflow”，生成新 workflow_id，原定义与运行互不影响。</div>
 </div></div>`;
 crumb.textContent='触发器 / 场景管理';
}
function newSceneModal(){
 modalRoot.innerHTML=`<div class="modal-mask" onclick="if(event.target===this)modalRoot.innerHTML=''"><div class="modal">
  <div class="mh">新建场景 · 选择模式<span onclick="modalRoot.innerHTML=''" style="cursor:pointer">×</span></div>
  <div class="mb">
   <div class="radio-card" onclick="modalRoot.innerHTML='';openConfig('simple')"><b>简单模式</b><div class="sub">沿用现有条件配置，无 workflow_id；走 runStatic / runDynamic 原链路。闪念一期由后端按 vlm_inference 直注册也属此类。</div></div>

 if(n.type==='inference')body=`<div class="sub" style="margin-bottom:8px">复用 InferenceParams：goal + original_query；与本次 VLM 内容组装提示词调 doubao.Stream。响应含“达成”=PASS，明确未达成=REJECT；输入缺失 / 调用失败 / 无法解析 / 超时=UNKNOWN。</div>`;
 return `<h4>${n.name}</h4>

}
