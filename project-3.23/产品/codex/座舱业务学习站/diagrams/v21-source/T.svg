 marker-end="url(#arrow)"/><rect x="341" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="346" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="346" dy="0">触发回调</tspan></text><path d="M373,2316 L373,2552" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="276" y="2412" width="100" height="44" rx="3" fill="#fff"/><text x="281" y="2436" font-size="15" fill="#435c70" font-weight="400"><tspan x="281" dy="0">满足执行前提</tspan></text><path d="M503,2316 L503,2354 L730,2354 L730,3744 L503,3744 L503,3806" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="633" y="3039" width="100" height="44" rx="3" fill="#fff"/><text x="638" y="3063" font-size="15" fill="#435c70" font-weight="400"><tspan x="638" dy="0">跳过本轮</tspan></text><path d="M373,2734 L373,2970" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="246" y="2830" width="130" height="44" rx="3" fill="#fff"/><text x="251" y="2854" font-size="15" fill="#435c70" font-weight="400"><tspan x="251" dy="0">任务关联与上下文</tspan></text><path d="M373,3152 L373,3388" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="261" y="3248" width="115" height="44" rx="3" fill="#fff"/><text x="266" y="3272" font-size="15" fill="#435c70" font-weight="400"><tspan x="266" dy="0">工具/内容结果</tspan></text><path d="M373,3570 L373,3806" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="276" y="3666" width="100" height="44" rx="3" fill="#fff"/><text x="281" y="3690" font-size="15" fill="#435c70" font-weight="400"><tspan x="281" dy="0">结果回写</tspan></text><path d="M833,1480 L833,1518 L853,1518 L853,4162 L536,4162 L536,4224" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="756" y="2830" width="100" height="44" rx="3" fill="#fff"/><text x="761" y="2854" font-size="15" fill="#435c70" font-weight="400"><tspan x="761" dy="0">创建通知</tspan></text><path d="M438,3988 L438,4224" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="326" y="4084" width="115" height="44" rx="3" fill="#fff"/><text x="331" y="4108" font-size="15" fill="#435c70" font-weight="400"><tspan x="331" dy="0">运行/关闭通知</tspan></text><path d="M243,1480 L243,1518 L147,1518 L147,4162 L341,4162 L341,4224" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="2830" width="115" height="44" rx="3" fill="#fff"/><text x="40" y="2854" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">修改/取消通知</tspan></text><path d="M373,1480 L373,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="276" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="281" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="281" dy="0">更新后的规则</tspan></text><path d="M438,3988 L438,4020 L1038,4020 L1038,1692 L438,1692 L438,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1045" y="4024" width="100" height="44" rx="3" fill="#fff"/><text x="1050" y="4048" font-size="15" fill="#435c70" font-weight="400"><tspan x="1050" dy="0">周期目标继续</tspan></text><a href="#module/T/step/T01"><g data-step="T01"><rect x="508" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="508" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="528" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="528" dy="0">T01</tspan></text><text x="528" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="528" dy="0">转交需要等待的用户目标</tspan></text><text x="528" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="528" dy="0">Planner → 任务入口</tspan></text><text x="528" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="528" dy="0">用户目标及身份范围</tspan></text></g></a><a href="#module/T/step/T02"><g data-step="T02"><rect x="508" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="508" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="528" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="528" dy="0">T02</tspan></text><text x="528" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="528" dy="0">理解创建、修改或取消</tspan></text><text x="528" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="528" dy="0">TaskService</tspan></text><text x="528" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="528" dy="0">任务定义或已有任务操作</tspan></text></g></a><a href="#module/T/step/T03"><g data-step="T03"><rect x="573" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="573" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="593" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="593" dy="0">T03</tspan></text><text x="593" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="593" dy="0">校验并保存任务</tspan></text><text x="593" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="593" dy="0">TaskService</tspan></text><text x="593" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="593" dy="0">等待中的 Task</tspan></text></g></a><a href="#module/T/step/T04"><g data-step="T04"><rect x="573" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="573" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="593" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="593" dy="0">T04</tspan></text><text x="593" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="593" dy="0">注册时间或条件规则</tspan></text><text x="593" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="593" dy="0">TaskService → Trigger</tspan></text><text x="593" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="593" dy="0">有效规则与创建结果</tspan></text></g></a><a href="#module/T/step/T05"><g data-step="T05"><rect x="243" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="243" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="263" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="263" dy="0">T05</tspan></text><text x="263" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="263" dy="0">到点或条件命中</tspan></text><text x="263" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="263" dy="0">Trigger → TaskService</tspan></text><text x="263" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="263" dy="0">关联任务的触发回调</tspan></text></g></a><a href="#module/T/step/T06"><g data-step="T06"><rect x="243" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="243" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="263" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="263" dy="0">T06</tspan></text><text x="263" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="263" dy="0">检查本轮能否执行</tspan></text><text x="263" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="263" dy="0">TaskService</tspan></text><text x="263" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="263" dy="0">运行中的 Run 或跳过结果</tspan></text></g></a><a href="#module/T/step/T07"><g data-step="T07"><rect x="178" y="2552" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="178" y="2552" width="5" height="182" rx="2" fill="#326785"/><text x="198" y="2581" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="198" dy="0">T07</tspan></text><text x="198" y="2613" font-size="20" fill="#203b50" font-weight="600"><tspan x="198" dy="0">让任务重新进入主对话</tspan></text><text x="198" y="2655" font-size="16" fill="#375b71" font-weight="400"><tspan x="198" dy="0">Recommend / Frontier → 车端 → 主链路</tspan></text><text x="198" y="2694" font-size="16" fill="#566975" font-weight="400"><tspan x="198" dy="0">带任务关联的新一轮输入</tspan></text></g></a><a href="#module/T/step/T08"><g data-step="T08"><rect x="178" y="2970" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="178" y="2970" width="5" height="182" rx="2" fill="#326785"/><text x="198" y="2999" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="198" dy="0">T08</tspan></text><text x="198" y="3031" font-size="20" fill="#203b50" font-weight="600"><tspan x="198" dy="0">结合当前上下文执行本轮</tspan></text><text x="198" y="3073" font-size="16" fill="#375b71" font-weight="400"><tspan x="198" dy="0">Planner → Agent / Tool</tspan></text><text x="198" y="3112" font-size="16" fill="#566975" font-weight="400"><tspan x="198" dy="0">执行决定及工具请求</tspan></text></g></a><a href="#module/T/step/T09"><g data-step="T09"><rect x="178" y="3388" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="178" y="3388" width="5" height="182" rx="2" fill="#326785"/><text x="198" y="3417" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="198" dy="0">T09</tspan></text><text x="198" y="3449" font-size="20" fill="#203b50" font-weight="600"><tspan x="198" dy="0">把本轮实际结果写回</tspan></text><text x="198" y="3491" font-size="16" fill="#375b71" font-weight="400"><tspan x="198" dy="0">主链路 → TaskService</tspan></text><text x="198" y="3530" font-size="16" fill="#566975" font-weight="400"><tspan x="198" dy="0">本轮成功、失败等结果</tspan></text></g></a><a href="#module/T/step/T10"><g data-step="T10"><rect x="243" y="3806" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="243" y="3806" width="5" height="182" rx="2" fill="#326785"/><text x="263" y="3835" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="263" dy="0">T10</tspan></text><text x="263" y="3867" font-size="20" fill="#203b50" font-weight="600"><tspan x="263" dy="0">决定继续等待还是结束</tspan></text><text x="263" y="3909" font-size="16" fill="#375b71" font-weight="400"><tspan x="263" dy="0">TaskService</tspan></text><text x="263" y="3948" font-size="16" fill="#566975" font-weight="400"><tspan x="263" dy="0">等待或关闭状态</tspan></text></g></a><a href="#module/T/step/T11"><g data-step="T11"><rect x="113" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="113" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="133" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="133" dy="0">T11</tspan></text><text x="133" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="133" dy="0">更新或取消已有目标</tspan></text><text x="133" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="133" dy="0">TaskService → Trigger</tspan></text><text x="133" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="133" dy="0">更新结果或关闭结果</tspan></text></g></a><a href="#module/T/step/T12"><g data-step="T12"><rect x="243" y="4224" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="243" y="4224" width="5" height="182" rx="2" fill="#326785"/><text x="263" y="4253" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="263" dy="0">T12</tspan></text><text x="263" y="4285" font-size="20" fill="#203b50" font-weight="600"><tspan x="263" dy="0">通知并查询当前任务状态</tspan></text><text x="263" y="4327" font-size="16" fill="#375b71" font-weight="400"><tspan x="263" dy="0">TaskService → 车端</tspan></text><text x="263" y="4366" font-size="16" fill="#566975" font-weight="400"><tspan x="263" dy="0">用户可见的任务状态</tspan></text></g></a></g></svg>