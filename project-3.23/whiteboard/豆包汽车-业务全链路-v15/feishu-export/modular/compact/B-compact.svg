<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1368" viewBox="0 0 1760 1368" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arrow-627E9F" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#627E9F"/></marker></defs><rect width="1760" height="1368" fill="#F8FAFD"/><text x="44" y="48" font-size="30" font-weight="650" fill="#163352" xml:space="preserve">B · 信号与状态｜让系统看到当前事实</text><text x="44" y="84" font-size="20" font-weight="400" fill="#62758A" xml:space="preserve">这是持续供给，不是用户每说一句才启动。原始信号、感知推断和用户诉求各有来源。</text><polyline points="260,332 260,347.82608695652175 1320,347.82608695652175 1320,462" fill="none" stroke="white" stroke-width="7"/><polyline points="260,332 260,347.82608695652175 1320,347.82608695652175 1320,462" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,332 790,446.17391304347825 1320,446.17391304347825 1320,462" fill="none" stroke="white" stroke-width="7"/><polyline points="790,332 790,446.17391304347825 1320,446.17391304347825 1320,462" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1520,236 1535.5555555555557,236 1535.5555555555557,558 1520,558" fill="none" stroke="white" stroke-width="7"/><polyline points="1520,236 1535.5555555555557,236 1535.5555555555557,558 1520,558" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1120,558 990,558" fill="none" stroke="white" stroke-width="7"/><polyline points="1120,558 990,558" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,558 460,558" fill="none" stroke="white" stroke-width="7"/><polyline points="590,558 460,558" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,654 790,669.8260869565217 260,669.8260869565217 260,784" fill="none" stroke="white" stroke-width="7"/><polyline points="790,654 790,669.8260869565217 260,669.8260869565217 260,784" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,654 790,784" fill="none" stroke="white" stroke-width="7"/><polyline points="790,654 790,784" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,784 1320,654" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,784 1320,654" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1520,558 1535.5555555555557,558 1535.5555555555557,1202 1520,1202" fill="none" stroke="white" stroke-width="7"/><polyline points="1520,558 1535.5555555555557,558 1535.5555555555557,1202 1520,1202" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1120,1202 990,1202" fill="none" stroke="white" stroke-width="7"/><polyline points="1120,1202 990,1202" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,1106 790,1090.1739130434783 479.1578947368421,1090.1739130434783 479.1578947368421,558 460,558" fill="none" stroke="white" stroke-width="7"/><polyline points="790,1106 790,1090.1739130434783 479.1578947368421,1090.1739130434783 479.1578947368421,558 460,558" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,1202 460,1202" fill="none" stroke="white" stroke-width="7"/><polyline points="590,1202 460,1202" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><rect x="60" y="140" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B01</text><text x="80" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">车辆与设备状态持续变化</text><text x="80" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">车门、空调、座椅等状态</text><text x="80" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">行驶、充电、导航等状态</text><text x="80" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">车型支持范围与单位要一致</text><rect x="590" y="140" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B02</text><text x="610" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">乘员与手机／应用等信息</text><text x="610" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">座位、已识别身份与权限</text><text x="610" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">应用当前使用和播放信息</text><text x="610" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">按授权与实际接入范围读取</text><rect x="1120" y="140" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B03</text><text x="1140" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">视觉观察是推断，不是设备值</text><text x="1140" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">摄像头画面进入感知模型</text><text x="1140" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">记录位置、可见性和观察时间</text><text x="1140" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">看不见不等于事情没发生</text><rect x="1120" y="462" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="490" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B04</text><text x="1140" y="524" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">把各种输入对齐成可用状态</text><text x="1140" y="563" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">字段、位置、时间统一表达</text><text x="1140" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">区分当前值与变化事件</text><text x="1140" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">保留数据来源和失败状态</text><rect x="590" y="462" width="400" height="192" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="610" y="490" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B05</text><text x="610" y="524" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">判断这份信息还可不可信</text><text x="610" y="563" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">有效、缺失、过期分别处理</text><text x="610" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">权限撤回与设备断连可区分</text><text x="610" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不拿旧状态补成当前事实</text><rect x="60" y="462" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="490" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B06</text><text x="80" y="524" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">供给 Context 作为本轮背景</text><text x="80" y="563" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">按本次请求选相关事实</text><text x="80" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">例如空调已开、外面下雨</text><text x="80" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Director 据此决定还要做什么</text><rect x="60" y="784" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="812" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B07</text><text x="80" y="846" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">供给端云 Trigger 判断条件</text><text x="80" y="885" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">只唤醒相关规则与任务</text><text x="80" y="911" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">同一来源可被多种场景消费</text><text x="80" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">唤醒不等于条件成立</text><rect x="590" y="784" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="812" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B08</text><text x="610" y="846" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">供给静态 Advisor 做建议</text><text x="610" y="885" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">按预设服务领域理解情景</text><text x="610" y="911" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">判断是否值得提出服务建议</text><text x="610" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">建议还要回 Director 仲裁</text><rect x="1120" y="784" width="400" height="192" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="1140" y="812" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B09</text><text x="1140" y="846" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">执行后的真实状态再回流</text><text x="1140" y="885" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">动作回包之外继续看状态</text><text x="1140" y="911" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">设备变化写回可用背景</text><text x="1140" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">支持后续判断与问题追溯</text><rect x="1120" y="1106" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="1134" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B10</text><text x="1140" y="1168" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">先分清状态、事件和意图</text><text x="1140" y="1207" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">状态：当前温度/开关值</text><text x="1140" y="1233" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">事件：某时发生开门/点击/停播</text><text x="1140" y="1259" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">query：用户希望系统做什么</text><rect x="590" y="1106" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="1134" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B11</text><text x="610" y="1168" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">记录请求、轮次和结果关联</text><text x="610" y="1207" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">request_id：关联端云采信请求</text><text x="610" y="1233" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">round_id：端云协议中的轮次</text><text x="610" y="1259" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">工具调用/任务运行/音频另有标识</text><rect x="60" y="1106" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="1134" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">B12</text><text x="80" y="1168" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">通知通道送到不等于显示</text><text x="80" y="1207" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Frontier 推送事件/动作/任务状态</text><text x="80" y="1233" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">车端按消息类型分发所属业务</text><text x="80" y="1259" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">受理、展示和真实执行分层回执</text><rect x="695.5555555555555" y="354.60869565217394" width="188.8888888888889" height="36" rx="3" fill="#FFFFFF"/><text x="701.5555555555555" y="378.60869565217394" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">车辆事实</text><rect x="948.3333333333333" y="414.52173913043475" width="213.33333333333348" height="36" rx="3" fill="#FFFFFF"/><text x="954.3333333333333" y="438.52173913043475" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">乘员与应用事实</text><rect x="1530.2222222222222" y="384.5652173913044" width="166.66666666666674" height="36" rx="3" fill="#FFFFFF"/><text x="1536.2222222222222" y="408.5652173913044" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">视觉观察</text><rect x="1002.3157894736842" y="560.9538461538461" width="105.36842105263167" height="60" rx="3" fill="#FFFFFF"/><text x="1008.3157894736842" y="584.9538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">统一并检</text><text x="1008.3157894736842" y="608.9538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">查</text><rect x="472.3157894736842" y="560.9538461538461" width="105.36842105263162" height="60" rx="3" fill="#FFFFFF"/><text x="478.3157894736842" y="584.9538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">当前有效</text><text x="478.3157894736842" y="608.9538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">事实</text><rect x="418.3333333333333" y="676.6086956521739" width="213.33333333333331" height="36" rx="3" fill="#FFFFFF"/><text x="424.3333333333333" y="700.6086956521739" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">相关事件与状态</text><rect x="784.6666666666666" y="706.5652173913044" width="166.66666666666663" height="36" rx="3" fill="#FFFFFF"/><text x="790.6666666666666" y="730.5652173913044" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">情景变化</text><rect x="1314.6666666666667" y="706.5652173913044" width="166.66666666666652" height="36" rx="3" fill="#FFFFFF"/><text x="1320.6666666666667" y="730.5652173913044" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">状态再次更新</text><rect x="1530.2222222222222" y="874.5846153846154" width="166.66666666666674" height="36" rx="3" fill="#FFFFFF"/><text x="1536.2222222222222" y="898.5846153846154" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">明确数据语义</text><rect x="1002.3157894736842" y="1204.9538461538461" width="105.36842105263167" height="60" rx="3" fill="#FFFFFF"/><text x="1008.3157894736842" y="1228.9538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">保留来源</text><text x="1008.3157894736842" y="1252.9538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">和关联</text><rect x="487.36842105263156" y="999.1913043478256" width="185.9649122807018" height="36" rx="3" fill="#FFFFFF"/><text x="493.36842105263156" y="1023.1913043478256" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">供给后续判断</text><rect x="472.3157894736842" y="1192.9538461538461" width="105.36842105263162" height="84" rx="3" fill="#FFFFFF"/><text x="478.3157894736842" y="1216.9538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">需要下发</text><text x="478.3157894736842" y="1240.9538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">时带正确</text><text x="478.3157894736842" y="1264.9538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">关联</text></svg>