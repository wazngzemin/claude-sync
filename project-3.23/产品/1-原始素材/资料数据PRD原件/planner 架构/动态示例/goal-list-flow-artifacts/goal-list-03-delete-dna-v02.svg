<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2660" viewBox="0 0 1660 2660">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker>
  </defs>

  <rect x="30" y="28" width="1600" height="132" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="4"/>
  <circle cx="100" cy="94" r="42" fill="#F4F2EE" stroke="#F4F2EE" stroke-width="2"/>
  <text x="77" y="105" fill="#0D4FA8" font-size="35" font-weight="700">03</text>
  <text x="174" y="86" fill="#F4F2EE" font-size="40" font-weight="700">DNA-4222：手动删除为什么没有释放名额</text>
  <text x="177" y="128" fill="#F4F2EE" font-size="22">不是“7 条任务的规则错了”，而是“删除后的新状态没有进入模型的 goal_list”</text>

  <rect x="30" y="190" width="1600" height="126" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="58" y="233" fill="#0D4FA8" font-size="23" font-weight="700">现场初始快照</text>
  <text x="270" y="233" fill="#0D4FA8" font-size="22">g-29 条件任务 1 条 + g-30～g-35 定时提醒 6 条</text>
  <text x="58" y="271" fill="#0D4FA8" font-size="19">因此：总数 7，但真正满的是“定时任务 6 / 6”；条件任务不是第 7 条定时任务。</text>
  <text x="58" y="301" fill="#8E9179" font-size="18">用户删掉一条定时提醒后，应变成：1 条条件 + 5 条定时；再建 19:20 后，才回到 1 + 6。</text>

  <!-- Expected section -->
  <rect x="30" y="365" width="1600" height="62" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="55" y="406" fill="#F4F2EE" font-size="27" font-weight="700">A　正确链路：一次屏幕删除，必须完成五次状态同步</text>

  <!-- lane labels -->
  <rect x="30" y="460" width="260" height="54" rx="4" fill="#8E9179" stroke="#0D4FA8" stroke-width="3"/>
  <text x="54" y="496" fill="#F4F2EE" font-size="20" font-weight="700">用户 / 任务中心</text>
  <rect x="325" y="460" width="280" height="54" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="349" y="496" fill="#F4F2EE" font-size="20" font-weight="700">真实活动任务</text>
  <rect x="640" y="460" width="280" height="54" rx="4" fill="#8E9179" stroke="#0D4FA8" stroke-width="3"/>
  <text x="664" y="496" fill="#F4F2EE" font-size="20" font-weight="700">触发源 / 名额</text>
  <rect x="955" y="460" width="310" height="54" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="979" y="496" fill="#F4F2EE" font-size="20" font-weight="700">goal_list / 上下文</text>
  <rect x="1300" y="460" width="330" height="54" rx="4" fill="#8E9179" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1324" y="496" fill="#F4F2EE" font-size="20" font-weight="700">豆包下一轮判断</text>

  <line x1="160" y1="514" x2="160" y2="1340" stroke="#8E9179" stroke-width="2"/>
  <line x1="465" y1="514" x2="465" y2="1340" stroke="#8E9179" stroke-width="2"/>
  <line x1="780" y1="514" x2="780" y2="1340" stroke="#8E9179" stroke-width="2"/>
  <line x1="1110" y1="514" x2="1110" y2="1340" stroke="#8E9179" stroke-width="2"/>
  <line x1="1465" y1="514" x2="1465" y2="1340" stroke="#8E9179" stroke-width="2"/>

  <!-- five sync steps -->
  <circle cx="18" cy="579" r="12" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/><text x="14" y="583" fill="#F4F2EE" font-size="12" font-weight="700">1</text>
  <rect x="34" y="548" width="252" height="120" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="52" y="587" fill="#0D4FA8" font-size="20" font-weight="700">用户点击删除 g-33</text>
  <text x="52" y="620" fill="#0D4FA8" font-size="17">例如删除 18:55 喂奶提醒</text>
  <text x="52" y="650" fill="#8E9179" font-size="17">用户期待：名额立即释放</text>
  <line x1="286" y1="608" x2="325" y2="608" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="314" cy="754" r="12" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/><text x="310" y="758" fill="#F4F2EE" font-size="12" font-weight="700">2</text>
  <rect x="330" y="723" width="270" height="120" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="348" y="762" fill="#0D4FA8" font-size="20" font-weight="700">关闭真实任务 g-33</text>
  <text x="348" y="795" fill="#0D4FA8" font-size="17">从“活动”变成“用户取消”</text>
  <text x="348" y="825" fill="#8E9179" font-size="17">不是只把卡片隐藏</text>
  <line x1="600" y1="783" x2="640" y2="783" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="629" cy="930" r="12" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/><text x="625" y="934" fill="#F4F2EE" font-size="12" font-weight="700">3</text>
  <rect x="645" y="899" width="270" height="120" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="663" y="938" fill="#F4F2EE" font-size="20" font-weight="700">回收执行与名额</text>
  <text x="663" y="971" fill="#F4F2EE" font-size="17">注销 g-33 定时器</text>
  <text x="663" y="1001" fill="#F4F2EE" font-size="17">定时任务：6 → 5</text>
  <line x1="915" y1="959" x2="955" y2="959" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="944" cy="1106" r="12" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/><text x="940" y="1110" fill="#F4F2EE" font-size="12" font-weight="700">4</text>
  <rect x="960" y="1075" width="300" height="120" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="978" y="1114" fill="#0D4FA8" font-size="17" font-weight="700">刷新 goal_list（版本 n+1）</text>
  <text x="978" y="1147" fill="#0D4FA8" font-size="17">数组中不再含 g-33</text>
  <text x="978" y="1177" fill="#8E9179" font-size="17">模型下一轮只看到 5 条定时</text>
  <line x1="1260" y1="1135" x2="1300" y2="1135" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="1289" cy="1282" r="12" fill="#185DB7" stroke="#0D4FA8" stroke-width="2"/><text x="1285" y="1286" fill="#F4F2EE" font-size="12" font-weight="700">5</text>
  <rect x="1305" y="1251" width="320" height="120" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1323" y="1290" fill="#F4F2EE" font-size="20" font-weight="700">用户再建 19:20 提醒</text>
  <text x="1323" y="1323" fill="#F4F2EE" font-size="17">模型读到：定时 5 / 6</text>
  <text x="1323" y="1353" fill="#F4F2EE" font-size="17">创建第 6 条定时任务，成功</text>

  <polyline points="160,668 160,1390 1470,1390 1470,1371" fill="none" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="1425" fill="#8E9179" font-size="18">删除完成后的下一次“创建”必须基于版本 n+1 的新列表，而不是删除前旧列表。</text>

  <!-- Actual failure -->
  <rect x="30" y="1485" width="1600" height="62" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="55" y="1526" fill="#F4F2EE" font-size="27" font-weight="700">B　实际错误链路：第 4 步没有发生，模型继续读删除前旧快照</text>

  <rect x="35" y="1585" width="350" height="285" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="58" y="1627" fill="#0D4FA8" font-size="22" font-weight="700">任务中心侧</text>
  <text x="58" y="1662" fill="#0D4FA8" font-size="18">用户删掉一条定时提醒</text>
  <text x="58" y="1694" fill="#0D4FA8" font-size="18">卡片从列表中消失</text>
  <text x="58" y="1726" fill="#0D4FA8" font-size="18">真实定时任务可能已是 5 条</text>
  <line x1="58" y1="1753" x2="360" y2="1753" stroke="#185DB7" stroke-width="2"/>
  <text x="58" y="1791" fill="#8E9179" font-size="18">用户自然认为“可以再建一条”</text>

  <rect x="470" y="1585" width="350" height="285" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="493" y="1627" fill="#F4F2EE" font-size="22" font-weight="700">断点：缺少状态通知</text>
  <text x="493" y="1662" fill="#F4F2EE" font-size="18">没有把“g-33 已取消”</text>
  <text x="493" y="1694" fill="#F4F2EE" font-size="18">写入模型的任务上下文</text>
  <text x="493" y="1726" fill="#F4F2EE" font-size="18">没有重新生成版本 n+1</text>
  <line x1="493" y1="1753" x2="793" y2="1753" stroke="#F4F2EE" stroke-width="2"/>
  <text x="493" y="1791" fill="#F4F2EE" font-size="18" font-weight="700">这不是 UI 问题，是状态传播断了</text>

  <rect x="905" y="1585" width="350" height="285" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="928" y="1627" fill="#0D4FA8" font-size="22" font-weight="700">模型仍读旧 goal_list</text>
  <text x="928" y="1662" fill="#0D4FA8" font-size="18">旧数组仍有 g-30～g-35</text>
  <text x="928" y="1694" fill="#0D4FA8" font-size="18">模型仍算出：定时任务 = 6</text>
  <text x="928" y="1726" fill="#0D4FA8" font-size="18">即使屏幕实际只有 5 条</text>
  <line x1="928" y1="1753" x2="1228" y2="1753" stroke="#185DB7" stroke-width="2"/>
  <text x="928" y="1791" fill="#8E9179" font-size="18">它是在基于错误事实做“正确推理”</text>

  <rect x="1340" y="1585" width="285" height="285" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1363" y="1627" fill="#0D4FA8" font-size="22" font-weight="700">错误结果</text>
  <text x="1363" y="1662" fill="#0D4FA8" font-size="18">拒绝创建</text>
  <text x="1363" y="1694" fill="#0D4FA8" font-size="18">或下发后被判满额</text>
  <text x="1363" y="1726" fill="#0D4FA8" font-size="18">甚至说“记在心里”</text>
  <line x1="1363" y1="1753" x2="1599" y2="1753" stroke="#185DB7" stroke-width="2"/>
  <text x="1363" y="1791" fill="#8E9179" font-size="18">用户看到两个真相</text>

  <line x1="385" y1="1726" x2="470" y2="1726" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="820" y1="1726" x2="905" y2="1726" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1255" y1="1726" x2="1340" y2="1726" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- recovery contract -->
  <rect x="30" y="1930" width="1600" height="62" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="55" y="1971" fill="#F4F2EE" font-size="27" font-weight="700">C　产品修复不是“加强一句动态示例”，而是给删除定义正式的状态回写合同</text>

  <rect x="35" y="2030" width="370" height="305" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="58" y="2072" fill="#0D4FA8" font-size="22" font-weight="700">删除事件至少要表达</text>
  <text x="58" y="2107" fill="#0D4FA8" font-size="18">• 哪个 task / goal 被删除</text>
  <text x="58" y="2139" fill="#0D4FA8" font-size="18">• 谁删的：用户、车辆、渠道</text>
  <text x="58" y="2171" fill="#0D4FA8" font-size="18">• 何时删、为何删：用户取消</text>
  <text x="58" y="2203" fill="#0D4FA8" font-size="18">• 任务状态版本变成多少</text>
  <text x="58" y="2241" fill="#8E9179" font-size="18">让下游能判断“新状态已到”</text>
  <text x="58" y="2272" fill="#8E9179" font-size="18">而非仅收到一段自然语言</text>

  <rect x="450" y="2030" width="370" height="305" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="473" y="2072" fill="#F4F2EE" font-size="22" font-weight="700">状态回写必须带来</text>
  <text x="473" y="2107" fill="#F4F2EE" font-size="18">• 真实任务变为关闭</text>
  <text x="473" y="2139" fill="#F4F2EE" font-size="18">• 触发器 / 定时器注销</text>
  <text x="473" y="2171" fill="#F4F2EE" font-size="18">• 同类任务名额释放</text>
  <text x="473" y="2203" fill="#F4F2EE" font-size="18">• 任务中心卡片刷新</text>
  <text x="473" y="2241" fill="#F4F2EE" font-size="18">• 新 goal_list 重新注入</text>
  <text x="473" y="2272" fill="#F4F2EE" font-size="18">• 已删任务不得再触发</text>

  <rect x="865" y="2030" width="370" height="305" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="888" y="2072" fill="#0D4FA8" font-size="22" font-weight="700">动态示例能解决什么</text>
  <text x="888" y="2107" fill="#0D4FA8" font-size="18">• 失败时不虚假承诺</text>
  <text x="888" y="2139" fill="#0D4FA8" font-size="18">• 不说“我先记在心里”</text>
  <text x="888" y="2171" fill="#0D4FA8" font-size="18">• 提示用户删除同类任务</text>
  <line x1="888" y1="2200" x2="1208" y2="2200" stroke="#185DB7" stroke-width="2"/>
  <text x="888" y="2238" fill="#8E9179" font-size="18">但它不能生成缺失的状态事实，</text>
  <text x="888" y="2269" fill="#8E9179" font-size="18">也不能让旧 goal_list 变成最新。</text>

  <rect x="1280" y="2030" width="345" height="305" rx="4" fill="#F4F2EE" stroke="#0D4FA8" stroke-width="3"/>
  <text x="1303" y="2072" fill="#0D4FA8" font-size="22" font-weight="700">验收必须同时看</text>
  <text x="1303" y="2107" fill="#0D4FA8" font-size="18">1. 卡片少一条</text>
  <text x="1303" y="2139" fill="#0D4FA8" font-size="18">2. 新 goal_list 少一条</text>
  <text x="1303" y="2171" fill="#0D4FA8" font-size="18">3. 定时名额已释放</text>
  <text x="1303" y="2203" fill="#0D4FA8" font-size="18">4. 新任务创建成功</text>
  <text x="1303" y="2235" fill="#0D4FA8" font-size="18">5. 已删任务不再触发</text>
  <text x="1303" y="2272" fill="#8E9179" font-size="18">五项必须一起成立</text>

  <line x1="405" y1="2182" x2="450" y2="2182" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="820" y1="2182" x2="865" y2="2182" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1235" y1="2182" x2="1280" y2="2182" stroke="#0D4FA8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="30" y="2410" width="1600" height="155" rx="4" fill="#185DB7" stroke="#0D4FA8" stroke-width="3"/>
  <text x="57" y="2456" fill="#F4F2EE" font-size="25" font-weight="700">最终产品判断</text>
  <text x="57" y="2495" fill="#F4F2EE" font-size="21">用户从任务中心删掉任务的那一刻，系统不是“少显示一张卡”，而是“撤销一项未来承诺”。</text>
  <text x="57" y="2532" fill="#F4F2EE" font-size="21">只要 goal_list 没一起变，豆包就仍会基于删除前的世界做判断；这就是 DNA-4222 的本质。</text>
</svg>
