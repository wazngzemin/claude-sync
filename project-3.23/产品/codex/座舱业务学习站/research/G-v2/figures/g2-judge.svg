<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="g2-judge" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="g2-judge-title g2-judge-desc">
<title id="g2-judge-title">三种判断各回答一个问题，失败原因分开记</title><desc id="g2-judge-desc">规则比较看结构值；判断图组织依赖；视觉语义判断读这一次观察文字。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="g2-judge-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">三种判断各回答一个问题，失败原因分开记</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">规则比较看结构值；判断图组织依赖；视觉语义判断读这一次观察文字。</text>
<g data-node="true" id="g2-judge-rule"><rect class="v56-cloud" x="40" y="145" width="350" height="350" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="173" text-anchor="start">规则比较：现在满足吗</text>
<text class="v56-node-sub" x="54" y="201" text-anchor="start">输入：结构化的当前值或变化</text>
<text class="v56-node-sub" x="54" y="225" text-anchor="start">例如：续航 99 公里 &lt; 100 公里</text>
<text class="v56-node-sub" x="54" y="249" text-anchor="start">输出：是 / 否</text>
<text class="v56-node-sub" x="54" y="273" text-anchor="start">规则引擎做确定的比较</text>
<text class="v56-node-sub" x="54" y="297" text-anchor="start"></text>
<text class="v56-node-sub" x="54" y="321" text-anchor="start">条件组之间可用且、或</text>
<text class="v56-node-sub" x="54" y="345" text-anchor="start">不支持任意趋势或地理围栏</text>
</g>
<g data-node="true" id="g2-judge-graph"><rect class="v56-decision v56-pending" x="425" y="145" width="350" height="350" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="439" y="173" text-anchor="start">判断图：最后能通过吗</text>
<text class="v56-node-sub" x="439" y="201" text-anchor="start">输入：多个条件与视觉判断节点</text>
<text class="v56-node-sub" x="439" y="225" text-anchor="start">节点内条件是且；上游可且或</text>
<text class="v56-node-sub" x="439" y="249" text-anchor="start">每张图只看一个终点</text>
<text class="v56-node-sub" x="439" y="273" text-anchor="start">终点：通过 / 不通过 / 未知</text>
<text class="v56-node-sub" x="439" y="297" text-anchor="start"></text>
<text class="v56-node-sub" x="439" y="321" text-anchor="start">或放行后，其他分支不取消</text>
<text class="v56-node-sub" x="439" y="345" text-anchor="start">改造设计，尚未验收</text>
</g>
<g data-node="true" id="g2-judge-visual"><rect class="v56-local" x="810" y="145" width="350" height="350" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="824" y="173" text-anchor="start">视觉语义：这个目标达成吗</text>
<text class="v56-node-sub" x="824" y="201" text-anchor="start">输入：一份观察文字 + 一个目标</text>
<text class="v56-node-sub" x="824" y="225" text-anchor="start">输出：达成 / 未达成 / 无法判断</text>
<text class="v56-node-sub" x="824" y="249" text-anchor="start">附不超过 15 个字的依据</text>
<text class="v56-node-sub" x="824" y="273" text-anchor="start">不看图，不跨帧，不输出置信度</text>
<text class="v56-node-sub" x="824" y="297" text-anchor="start"></text>
<text class="v56-node-sub" x="824" y="321" text-anchor="start">未达成：也包括证据不足</text>
<text class="v56-node-sub" x="824" y="345" text-anchor="start">不决定回调、提醒或删除</text>
</g>
<text class="v56-node-title" x="40" y="548" text-anchor="start">三种“没成立”要分开记，不能全部写成“未命中”</text>
<g data-node="true" id="g2-judge-no"><rect class="v56-reject" x="40" y="580" width="350" height="170" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="608" text-anchor="start">明确不满足</text>
<text class="v56-node-sub" x="54" y="636" text-anchor="start">值拿到了，但条件为否</text>
<text class="v56-node-sub" x="54" y="660" text-anchor="start">例如：续航 120 公里</text>
<text class="v56-node-sub" x="54" y="684" text-anchor="start">视觉证据不足也属于未达成</text>
</g>
<g data-node="true" id="g2-judge-unknown"><rect class="v56-neutral" x="425" y="580" width="350" height="170" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="439" y="608" text-anchor="start">未知</text>
<text class="v56-node-sub" x="439" y="636" text-anchor="start">缺输入、查询失败</text>
<text class="v56-node-sub" x="439" y="660" text-anchor="start">模型失败、超时</text>
<text class="v56-node-sub" x="439" y="684" text-anchor="start">不能拿通过节点数代替终点结果</text>
</g>
<g data-node="true" id="g2-judge-outside"><rect class="v56-decision" x="810" y="580" width="350" height="170" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="824" y="608" text-anchor="start">无法判断</text>
<text class="v56-node-sub" x="824" y="636" text-anchor="start">目标超出视觉可判断的范围</text>
<text class="v56-node-sub" x="824" y="660" text-anchor="start">例如：仅凭面色判断是否发烧</text>
<text class="v56-node-sub" x="824" y="684" text-anchor="start">这不是“目标已经明确不成立”</text>
</g>
<text class="v56-label" x="40" y="799" text-anchor="start">视觉并发：首个达成后封住场景，后面不再启动推理和动作，等任务服务删除。</text>
<path class="v56-rule" d="M 32 845 L 1168 845"/>
<text class="v56-node-title" x="32" y="879" text-anchor="start">先区分是哪一层的结果，再决定补输入、改条件，还是调整目标。</text>
<rect data-decoration="true" class="v56-cloud" x="32.0" y="905" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="919" text-anchor="start">绿：确定比较</text>
<rect data-decoration="true" class="v56-local" x="259.2" y="905" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="287.2" y="919" text-anchor="start">蓝：观察文字判断</text>
<rect data-decoration="true" class="v56-decision" x="486.4" y="905" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="514.4" y="919" text-anchor="start">黄：汇合与能力边界</text>
<rect data-decoration="true" class="v56-reject" x="713.6" y="905" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="741.6" y="919" text-anchor="start">红：明确不满足</text>
<rect data-decoration="true" class="v56-neutral" x="940.8" y="905" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="968.8" y="919" text-anchor="start">灰：缺输入或失败</text>
</svg>
