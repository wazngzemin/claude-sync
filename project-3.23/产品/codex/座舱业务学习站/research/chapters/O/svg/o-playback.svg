<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="“播完了”要由播放器证明：四种播放事件（新方案，开发中）"><title>“播完了”要由播放器证明：四种播放事件（新方案，开发中）</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="560" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">“播完了”要由播放器证明：四种播放事件（新方案，开发中）</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">输入管理技术方案第 8 章（10/23）；现状是临时标记 + 进度两条线</text><rect x="30" y="130" width="250" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="44" y="157" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">取声音、收到、排队、解码</text><text x="44" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">都还不算开始</text><rect x="320" y="130" width="220" height="110" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="334" y="157" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">开始</text><text x="334" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">第一个有声音的样本</text><text x="334" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">进入播放器</text><rect x="580" y="130" width="200" height="110" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="594" y="157" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">进度</text><text x="594" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">固定间隔上报</text><rect x="830" y="100" width="330" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="844" y="127" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">播完</text><text x="844" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">收到结束标记 + 全部播出去</text><rect x="830" y="220" width="330" height="100" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="844" y="247" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">永久停止</text><text x="844" y="272" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">必须写原因：用户打断、焦点被抢、</text><text x="844" y="293" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">解码出错；停了不能复活</text><path d="M280,185 L320,185" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M540,185 L580,185" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M780,165 L830,145" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M780,205 L830,265" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="360" width="1130" height="90" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="44" y="387" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">不能当作“播完”的信号</text><text x="44" y="412" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">服务端这一轮声音发完；连接断开；收到最后一个网络包；按文字长度估算时间到了</text><text x="44" y="433" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">播完事件丢了：等车上重连重报，仍不行就告警，由运维确认</text><rect x="30" y="470" width="1130" height="60" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="497" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">没有声音的轮次（静默办完、只调工具、失败、有字没声）也要能结束，不等一个不会来的“播完”</text></g></svg>