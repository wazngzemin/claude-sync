<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="DT 怎样决定补不补：五条规则"><title>DT 怎样决定补不补：五条规则</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="720" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">DT 怎样决定补不补：五条规则</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">从左边“没说完的内容”出发，依次问三个问题；右边是每个答案对应的做法</text><rect x="30" y="300" width="200" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="44" y="327" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">没说完的内容</text><text x="44" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">+ 新话（如果有）</text><text x="44" y="373" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">+ 对话历史</text><polygon points="430,100.0 570.0,150 430,200.0 290.0,150" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="430" y="145" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">没说完的有</text><text x="430" y="165" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">实质信息吗？</text><polygon points="430,305.0 570.0,355 430,405.0 290.0,355" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="430" y="350" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">新话和旧话题</text><text x="430" y="370" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">相关吗？</text><polygon points="430,510.0 570.0,560 430,610.0 290.0,560" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="430" y="555" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">没说完的</text><text x="430" y="575" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">有三句以上吗？</text><path d="M230,355 L290,355" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M430,200 L430,305" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="440.825" y="243" width="22.35" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="452" y="259" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">有</text><path d="M430,405 L430,510" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="450.475" y="447" width="47.05" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="474" y="463" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">不相关</text><rect x="700" y="96" width="470" height="108" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="714" y="123" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">不补</text><text x="714" y="148" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只剩 1–3 个无关紧要的字、语气词</text><text x="714" y="169" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户表现出不想听</text><text x="714" y="190" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">剩下的只是执行结果确认（“空调打开了”）</text><rect x="700" y="300" width="470" height="108" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="714" y="327" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">合成一个回答</text><text x="714" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不说“刚才被打断了我接着说”</text><text x="714" y="373" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：正讲火锅店，被问“第一家叫啥”</text><rect x="700" y="470" width="470" height="84" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="714" y="497" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">只提炼核心</text><text x="714" y="522" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">评分、距离、结论，其余概括带过</text><rect x="700" y="584" width="470" height="84" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="714" y="611" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">把关键信息说完</text><text x="714" y="636" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">知识、新闻、天气、操作说明</text><text x="714" y="657" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">补上称呼：“明骏你刚才让我讲的……”</text><path d="M570,150 L700,150" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="617.65" y="127" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="635" y="143" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">没有</text><path d="M570,355 L700,355" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="617.65" y="332" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="635" y="348" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">相关</text><path d="M570,545 L640,545 L640,512 L700,512" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="613.825" y="490" width="22.35" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="625" y="506" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">是</text><path d="M570,575 L640,575 L640,626 L700,626" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="613.825" y="603" width="22.35" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="625" y="619" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">否</text><rect x="30" y="630" width="240" height="70" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="657" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start">这是写给 DT 的规则</text><text x="44" y="682" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不是单独的模型或程序</text></g></svg>