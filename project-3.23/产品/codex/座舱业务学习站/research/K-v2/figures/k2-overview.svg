<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="k2-overview" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="k2-overview-title k2-overview-desc">
<title id="k2-overview-title">同一句“回家”，先认人，再用对记忆</title><desc id="k2-overview-desc">老周坐在副驾说“先送我回家”：认对身份和范围，才取得到他的地址。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="k2-overview-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">同一句“回家”，先认人，再用对记忆</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">老周坐在副驾说“先送我回家”：认对身份和范围，才取得到他的地址。</text>
<text class="v56-label" x="32" y="128" text-anchor="start">从这一句话，到导航去老周家</text>
<g data-node="true" id="k2-overview-speech"><rect class="v56-local" x="32" y="166" width="148" height="204" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="194" text-anchor="start">说话</text>
<text class="v56-node-sub" x="46" y="222" text-anchor="start">音区：副驾</text>
<text class="v56-node-sub" x="46" y="246" text-anchor="start">“先送我回家”</text>
</g>
<g data-node="true" id="k2-overview-person"><rect class="v56-local" x="204" y="166" width="148" height="204" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="218" y="194" text-anchor="start">认人</text>
<text class="v56-node-sub" x="218" y="222" text-anchor="start">人脸 → 老周</text>
<text class="v56-node-sub" x="218" y="246" text-anchor="start">已注册的乘客</text>
</g>
<g data-node="true" id="k2-overview-scope"><rect class="v56-cloud" x="376" y="166" width="250" height="204" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="390" y="194" text-anchor="start">定范围</text>
<text class="v56-node-sub" x="390" y="222" text-anchor="start">这辆车 × 车主豆包账号</text>
<text class="v56-node-sub" x="390" y="246" text-anchor="start">这一份记忆</text>
<text class="v56-node-sub" x="390" y="270" text-anchor="start">再筛出属于老周的部分</text>
</g>
<g data-node="true" id="k2-overview-read"><rect class="v56-cloud" x="650" y="166" width="160" height="204" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="664" y="194" text-anchor="start">取记忆</text>
<text class="v56-node-sub" x="664" y="222" text-anchor="start">上下文服务</text>
<text class="v56-node-sub" x="664" y="246" text-anchor="start">预先带上背景</text>
<text class="v56-node-sub" x="664" y="270" text-anchor="start">Planner 不够再查</text>
</g>
<g data-node="true" id="k2-overview-decide"><rect class="v56-decision" x="834" y="166" width="160" height="204" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="848" y="194" text-anchor="start">Planner 决定</text>
<text class="v56-node-sub" x="848" y="222" text-anchor="start">用老周的家地址</text>
<text class="v56-node-sub" x="848" y="246" text-anchor="start">决定怎样导航</text>
</g>
<g data-node="true" id="k2-overview-execute"><rect class="v56-local" x="1018" y="166" width="150" height="204" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="1032" y="194" text-anchor="start">落到车上</text>
<text class="v56-node-sub" x="1032" y="222" text-anchor="start">导航去老周家</text>
<text class="v56-node-sub" x="1032" y="246" text-anchor="start">核对执行结果</text>
</g>
<path class="v56-arrow" fill="none" d="M 180 268 L 204 268" marker-end="url(#k2-overview-arr)"/>
<path class="v56-arrow" fill="none" d="M 352 268 L 376 268" marker-end="url(#k2-overview-arr)"/>
<path class="v56-arrow" fill="none" d="M 626 268 L 650 268" marker-end="url(#k2-overview-arr)"/>
<path class="v56-arrow" fill="none" d="M 810 268 L 834 268" marker-end="url(#k2-overview-arr)"/>
<path class="v56-arrow" fill="none" d="M 994 268 L 1018 268" marker-end="url(#k2-overview-arr)"/>
<g data-node="true" id="k2-overview-write"><rect class="v56-cloud" x="376" y="458" width="434" height="124" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="390" y="486" text-anchor="start">写记忆：写回同一份记忆</text>
<text class="v56-node-sub" x="390" y="514" text-anchor="start">“记一下” → 补齐指代和地点后即时写</text>
<text class="v56-node-sub" x="390" y="538" text-anchor="start">每天从对话和事件抽取明确的事实、偏好</text>
</g>
<path class="v56-arrow" fill="none" d="M 500 458 L 500 370" marker-end="url(#k2-overview-arr)"/>
<text class="v56-label" x="518" y="418" text-anchor="start">写回对应范围</text>
<text class="v56-risk" x="32" y="620" text-anchor="start">未认出是谁 → 不用个人记忆，先问地址。</text>
<path class="v56-rule" d="M 32 650 L 1168 650"/>
<text class="v56-node-title" x="32" y="684" text-anchor="start">认对人、取对范围，记忆才帮得上忙。</text>
<rect data-decoration="true" class="v56-local" x="32" y="712" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="726" text-anchor="start">蓝：车上输入与执行</text>
<rect data-decoration="true" class="v56-cloud" x="302" y="712" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="330" y="726" text-anchor="start">绿：记忆范围与读写</text>
<rect data-decoration="true" class="v56-decision" x="572" y="712" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="600" y="726" text-anchor="start">黄：结合记忆做决定</text>
<rect data-decoration="true" class="v56-reject" x="872" y="712" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="900" y="726" text-anchor="start">红字：使用边界</text>
</svg>
