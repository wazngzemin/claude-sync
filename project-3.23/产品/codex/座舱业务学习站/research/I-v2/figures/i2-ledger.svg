<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="i2-ledger" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="i2-ledger-title i2-ledger-desc">
<title id="i2-ledger-title">四栏对账，历史只记真实发生的事</title><desc id="i2-ledger-desc">生成、听到、显示、执行分开核对；没播出的文字不能记成说过，工具真实结果必须保留。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="i2-ledger-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">四栏对账，历史只记真实发生的事</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">生成、听到、显示、执行分开核对；没播出的文字不能记成说过，工具真实结果必须保留。</text>
<text class="v56-label" x="32" y="120" text-anchor="start">例子：餐厅介绍说到一半，用户插话开副驾座椅加热；车控工具随后返回成功。</text>
<g data-node="true" data-key="generated">
<rect class="v56-decision" x="32" y="166" width="266" height="226" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="193" text-anchor="start">模型生成了什么</text>
<text class="v56-node-sub" x="46" y="218" text-anchor="start">已生成：“甲餐厅离你两公里，</text>
<text class="v56-node-sub" x="46" y="239" text-anchor="start">还可以顺路去乙餐厅。”</text>
<text class="v56-node-sub" x="46" y="260" text-anchor="start">后半句尚未播出。</text>
</g>
<g data-node="true" data-key="generated-history">
<rect class="v56-decision" x="32" y="472" width="266" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="499" text-anchor="start">生成 ≠ 已说过</text>
<text class="v56-node-sub" x="46" y="524" text-anchor="start">未播部分不能记成已经说过。</text>
</g>
<path class="v56-arrow" d="M 165 392 L 165 472" fill="none" marker-end="url(#i2-ledger-arr)"/>
<g data-node="true" data-key="heard">
<rect class="v56-cloud" x="322" y="166" width="266" height="226" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="336" y="193" text-anchor="start">用户真正听到了什么</text>
<text class="v56-node-sub" x="336" y="218" text-anchor="start">只听到：“甲餐厅离你两公里。”</text>
<text class="v56-node-sub" x="336" y="239" text-anchor="start">车机上报实际播放进度，</text>
<text class="v56-node-sub" x="336" y="260" text-anchor="start">在真实断点切开已说与未说。</text>
</g>
<g data-node="true" data-key="heard-history">
<rect class="v56-cloud" x="322" y="472" width="266" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="336" y="499" text-anchor="start">已播部分进入历史</text>
<text class="v56-node-sub" x="336" y="524" text-anchor="start">保留真实已播内容；</text>
<text class="v56-node-sub" x="336" y="545" text-anchor="start">未知进度不按 0 记。</text>
</g>
<path class="v56-arrow" d="M 455 392 L 455 472" fill="none" marker-end="url(#i2-ledger-arr)"/>
<g data-node="true" data-key="screen">
<rect class="v56-neutral" x="612" y="166" width="266" height="226" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="626" y="193" text-anchor="start">屏幕显示了什么</text>
<text class="v56-node-sub" x="626" y="218" text-anchor="start">甲餐厅即时卡片已经显示；</text>
<text class="v56-node-sub" x="626" y="239" text-anchor="start">出卡依据工具结果返回时机。</text>
<text class="v56-node-sub" x="626" y="260" text-anchor="start">显示过卡片不等于语音说过。</text>
</g>
<g data-node="true" data-key="screen-history">
<rect class="v56-neutral" x="612" y="472" width="266" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="626" y="499" text-anchor="start">屏幕事实单独对账</text>
<text class="v56-node-sub" x="626" y="524" text-anchor="start">核对实际显示状态；</text>
<text class="v56-node-sub" x="626" y="545" text-anchor="start">不能推成语音已经播完。</text>
</g>
<path class="v56-arrow" d="M 745 392 L 745 472" fill="none" marker-end="url(#i2-ledger-arr)"/>
<g data-node="true" data-key="tool">
<rect class="v56-cloud" x="902" y="166" width="266" height="226" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="916" y="193" text-anchor="start">工具真实结果是什么</text>
<text class="v56-node-sub" x="916" y="218" text-anchor="start">副驾座椅加热工具返回成功，</text>
<text class="v56-node-sub" x="916" y="239" text-anchor="start">实际已打开座椅加热。</text>
<text class="v56-node-sub" x="916" y="260" text-anchor="start">旧执行失效也不吞掉真实结果。</text>
</g>
<g data-node="true" data-key="tool-history">
<rect class="v56-cloud" x="902" y="472" width="266" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="916" y="499" text-anchor="start">真实结果必须保留</text>
<text class="v56-node-sub" x="916" y="524" text-anchor="start">保留成功结果，供下一轮使用；</text>
<text class="v56-node-sub" x="916" y="545" text-anchor="start">不因插话自动撤销已执行动作。</text>
</g>
<path class="v56-arrow" d="M 1035 392 L 1035 472" fill="none" marker-end="url(#i2-ledger-arr)"/>
<text class="v56-subtitle" x="32" y="639" text-anchor="start">历史记账：Planner 每轮按时间重建输入；核对上屏与执行事实，不代替实际播放进度。</text>
<rect class="v56-decision" x="32" y="689" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="703" text-anchor="start">黄：生成内容需按播放进度筛选</text>
<rect class="v56-cloud" x="452" y="689" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="480" y="703" text-anchor="start">绿：保留已播与真实执行</text>
<rect class="v56-neutral" x="852" y="689" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="880" y="703" text-anchor="start">灰：屏幕事实独立核对</text>
</svg>
