<svg xmlns="http://www.w3.org/2000/svg" width="470" height="1942" viewBox="0 0 470 1942" role="img" aria-label="静默展示与 PHUD"><title>静默展示与 PHUD</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M235,226 L235,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">规则等待输入</tspan></text><path d="M235,644 L235,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">条件命中</tspan></text><path d="M235,1062 L235,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">静默通知动作</tspan></text><path d="M235,1480 L235,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="123" y="1576" width="115" height="44" rx="3" fill="#fff"/><text x="128" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="128" dy="0">客户端收到通知</tspan></text><a href="#module/H/step/H-1"><g data-step="H-1"><rect x="40" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">H-1</tspan></text><text x="60" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">绑定条件与固定文案</tspan></text><text x="60" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">运营 / 配置平台</tspan></text><text x="60" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">条件—固定文案规则</tspan></text></g></a><a href="#module/H/step/H-2"><g data-step="H-2"><rect x="40" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">H-2</tspan></text><text x="60" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">产生本次判断输入</tspan></text><text x="60" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">事件或端信号</tspan></text><text x="60" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">本次信号与条件结果</tspan></text></g></a><a href="#module/H/step/H-3"><g data-step="H-3"><rect x="40" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">H-3</tspan></text><text x="60" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">命中后调用静默文字出口</tspan></text><text x="60" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">触发器</tspan></text><text x="60" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">通知请求</tspan></text></g></a><a href="#module/H/step/H-4"><g data-step="H-4"><rect x="40" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">H-4</tspan></text><text x="60" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">按通知卡协议发给客户端</tspan></text><text x="60" y="14