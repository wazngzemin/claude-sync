<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-label="车上自己办，还是交给云端：本地链路与端云仲裁"><title>车上自己办，还是交给云端：本地链路与端云仲裁</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="930" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">车上自己办，还是交给云端：本地链路与端云仲裁</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">赛力斯项目现行规则（9 月定为兜底，10 月 8 日公布）：有网听云端，车上小模型只在断网或云端太慢时兜底</text><rect x="400" y="92" width="400" height="62" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="414" y="119" font-size="16" fill="#22384a" font-weight="650" text-anchor="start">判停后两条链路同时启动</text><text x="414" y="144" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上自己听、自己算；同时把声音送上云</text><path d="M520,154 L520,170 L300,170 L300,200" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M680,154 L680,170 L900,170 L900,200" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="200" width="540" height="450" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="224" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上</text><rect x="630" y="200" width="540" height="450" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="644" y="224" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端</text><rect x="50" y="240" width="500" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="267" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">① 固定说法（研发叫正则缓存）</text><text x="64" y="292" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">命中 → 直接执行，不进下一步</text><text x="64" y="313" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">有网时也可以抢在云端前面</text><rect x="50" y="356" width="500" height="116" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="383" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">② 车上的 1.7B 小模型</text><text x="64" y="408" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">判断该不该接；把简单车控翻成执行指令</text><text x="64" y="429" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例：副驾座椅加热开 2 档</text><rect x="50" y="492" width="500" height="136" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="519" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上的结果先放着，等仲裁</text><text x="64" y="544" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">能办：已翻成执行指令</text><text x="64" y="565" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不该接：这句不是对豆包说的</text><text x="64" y="586" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">办不了：要交给云端</text><path d="M300,336 L300,356" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M300,472 L300,492" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="650" y="240" width="500" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="664" y="267" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">③ 再确认是在找豆包</text><text x="664" y="292" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">再确认一次这句话是在找豆包</text><rect x="650" y="350" width="500" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="664" y="377" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">④ 带上背景</text><text x="664" y="402" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">刚才聊过的、以前记得的、车况</text><rect x="650" y="460" width="500" height="110" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="664" y="487" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">⑤ DT 推理（云端大模型）</text><text x="664" y="512" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">决定说什么</text><text x="664" y="533" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">决定调哪些工具</text><path d="M900,330 L900,350" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M900,440 L900,460" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><polygon points="600,660.0 760.0,715 600,770.0 440.0,715" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="600" y="710" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">端云仲裁</text><text x="600" y="730" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">网络通不通？云端 3 秒内回了吗？</text><path d="M300,628 L300,715 L440,715" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M900,570 L900,715 L760,715" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="810" width="360" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="44" y="837" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">在线且云端 3 秒内返回</text><text x="44" y="862" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用云端的结果</text><text x="44" y="883" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上小模型的结果不用</text><rect x="420" y="810" width="360" height="100" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="434" y="837" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">断网，或云端超过 3 秒</text><text x="434" y="862" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用车上的结果</text><text x="434" y="883" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">云端迟到的结果不再执行</text><rect x="810" y="810" width="360" height="100" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="824" y="837" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">车上也办不了</text><text x="824" y="862" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">播“网络异常，请稍后再试”</text><text x="824" y="883" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一次唤醒内同类提示只播一次</text><path d="M520,760 L520,785 L210,785 L210,810" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M600,770 L600,810" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M680,760 L680,785 L990,785 L990,810" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/></g></svg>