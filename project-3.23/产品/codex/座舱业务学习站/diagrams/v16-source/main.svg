<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="2504" viewBox="0 0 1480 2504" role="img" aria-label="请求与反馈主链"><title>请求与反馈主链</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M695,250 L695,486" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="508" y="346" width="190" height="44" rx="3" fill="#fff"/><text x="513" y="370" font-size="15" fill="#435c70" font-weight="400"><tspan x="513" dy="0">正式文字、请求身份、音区</tspan></text><path d="M695,692 L695,928" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="553" y="788" width="145" height="44" rx="3" fill="#fff"/><text x="558" y="812" font-size="15" fill="#435c70" font-weight="400"><tspan x="558" dy="0">云端放行的有效请求</tspan></text><path d="M695,1134 L695,1370" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="583" y="1230" width="115" height="44" rx="3" fill="#fff"/><text x="588" y="1254" font-size="15" fill="#435c70" font-weight="400"><tspan x="588" dy="0">当前轮输入批次</tspan></text><path d="M300,1134 L300,1172 L563,1172 L563,1308 L565,1308 L565,1370" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="406" y="1230" width="160" height="44" rx="3" fill="#fff"/><text x="411" y="1254" font-size="15" fill="#435c70" font-weight="400"><tspan x="411" dy="0">常用背景与相关上下文</tspan></text><path d="M565,1576 L565,1750 L495,1750 L495,1812" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="393" y="1672" width="175" height="44" rx="3" fill="#fff"/><text x="398" y="1696" font-size="15" fill="#435c70" font-weight="400"><tspan x="398" dy="0">工具名、参数与本轮动作</tspan></text><path d="M695,1576 L695,2254" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="693" y="1893" width="130" height="44" rx="3" fill="#fff"/><text x="698" y="1917" font-size="15" fill="#435c70" font-weight="400"><tspan x="698" dy="0">话术、语气与表情</tspan></text><path d="M430,2018 L430,2192 L565,2192 L565,2254" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="243" y="2114" width="190" height="44" rx="3" fill="#fff"/><text x="248" y="2138" font-size="15" fill="#435c70" font-weight="400"><tspan x="248" dy="0">卡片、端侧内容和执行结果</tspan></text><path d="M170,1134 L170,1182 L364,1182 L364,1750 L365,1750 L365,1812" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="267" y="1451" width="100" height="44" rx="3" fill="#fff"/><text x="272" y="1475" font-size="15" fill="#435c70" font-weight="400"><tspan x="272" dy="0">按需检索结果</tspan></text><path d="M625,1990 L965,1990 L965,953 L890,953" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="972" y="1968" width="235" height="44" rx="3" fill="#fff"/><text x="977" y="1992" font-size="15" fill="#435c70" font-weight="400"><tspan x="977" dy="0">异步回流等需重新准入的工具反馈</tspan></text><path d="M625,1990 L1010,1990 L1010,1395 L825,1395" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1017" y="1968" width="205" height="44" rx="3" fill="#fff"/><text x="1022" y="1992" font-size="15" fill="#435c70" font-weight="400"><tspan x="1022" dy="0">普通 ReAct 工具结果</tspan></text><path d="M825,2432 L1055,2432 L1055,953 L890,953" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1062" y="2410" width="175" height="44" rx="3" fill="#fff"/><text x="1067" y="2434" font-size="15" fill="#435c70" font-weight="400"><tspan x="1067" dy="0">打断信息或后续用户输入</tspan></text><path d="M625,1990 L1100,1990 L1100,953 L430,953" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1107" y="1968" width="115" height="44" rx="3" fill="#fff"/><text x="1112" y="1992" font-size="15" fill="#435c70" font-weight="400"><tspan x="1112" dy="0">检索上下文来源</tspan></text><a href="#module/V"><g data-step="V"><rect x="500" y="44" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="44" width="5" height="206" rx="2" fill="#326785"/><text x="520" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">V</tspan></text><text x="520" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">语音输入与判停</tspan></text><text x="520" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">用户请求与执行闭环</tspan></text><text x="520" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">检查语音是否可用 / 把人声从车内声音中分离 / 接受唤</tspan><tspan x="520" dy="24">醒或项目允许的免唤醒输入</tspan></text></g></a><a href="#module/R"><g data-step="R"><rect x="500" y="486" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="486" width="5" height="206" rx="2" fill="#326785"/><text x="520" y="515" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">R</tspan></text><text x="520" y="547" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">入口与端云采信</tspan></text><text x="520" y="589" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">用户请求与执行闭环</tspan></text><text x="520" y="628" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">读取正式文字与网络状态 / 解析本地可处理的指令 / 判</tspan><tspan x="520" dy="24">断是否应响应及是否走快路径</tspan></text></g></a><a href="#module/M"><g data-step="M"><rect x="500" y="928" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="928" width="5" height="206" rx="2" fill="#326785"/><text x="520" y="957" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">M</tspan></text><text x="520" y="989" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">输入管理</tspan></text><text x="520" y="1031" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">用户请求与执行闭环</tspan></text><text x="520" y="1070" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">提交有效输入 / 检查推理、完整输出和起播状态 / 空闲</tspan><tspan x="520" dy="24">时直接开始下一轮</tspan></text></g></a><a href="#module/C"><g data-step="C"><rect x="40" y="928" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="928" width="5" height="206" rx="2" fill="#326785"/><text x="60" y="957" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">C</tspan></text><text x="60" y="989" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">Context 上下文</tspan></text><text x="60" y="1031" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">用户请求与执行闭环</tspan></text><text x="60" y="1070" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">持续产生上下文来源 / 维护各自负责的信息 / 把常用背</tspan><tspan x="60" dy="24">景先交给 Planner</tspan></text></g></a><a href="#module/D"><g data-step="D"><rect x="435" y="1370" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="1370" width="5" height="206" rx="2" fill="#326785"/><text x="455" y="1399" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">D</tspan></text><text x="455" y="1431" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">Planner / Director</tspan></text><text x="455" y="1473" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">用户请求与执行闭环</tspan></text><text x="455" y="1512" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">汇合本轮输入与背景 / 确定当前目标和下一步 / 提取话</tspan><tspan x="455" dy="24">术、语气和表情</tspan></text></g></a><a href="#module/E"><g data-step="E"><rect x="235" y="1812" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="235" y="1812" width="5" height="206" rx="2" fill="#326785"/><text x="255" y="1841" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="255" dy="0">E</tspan></text><text x="255" y="1873" font-size="20" fill="#203b50" font-weight="600"><tspan x="255" dy="0">工具执行与回流</tspan></text><text x="255" y="1915" font-size="16" fill="#375b71" font-weight="400"><tspan x="255" dy="0">用户请求与执行闭环</tspan></text><text x="255" y="1954" font-size="16" fill="#566975" font-weight="400"><tspan x="255" dy="0">把动作清单转成具体调用 / 按 Agent ID 找到配置 / 准</tspan><tspan x="255" dy="24">备该工具需要的上下文</tspan></text></g></a><a href="#module/O"><g data-step="O"><rect x="435" y="2254" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="435" y="2254" width="5" height="206" rx="2" fill="#326785"/><text x="455" y="2283" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="455" dy="0">O</tspan></text><text x="455" y="2315" font-size="20" fill="#203b50" font-weight="600"><tspan x="455" dy="0">播报、展示与真实结果</tspan></text><text x="455" y="2357" font-size="16" fill="#375b71" font-weight="400"><tspan x="455" dy="0">用户请求与执行闭环</tspan></text><text x="455" y="2396" font-size="16" fill="#566975" font-weight="400"><tspan x="455" dy="0">接收本轮要表达的内容 / 选择在线、离线或缓存音频 / </tspan><tspan x="455" dy="24">把文字变成音频并真正播出</tspan></text></g></a></g></svg>