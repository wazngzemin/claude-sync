<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="同一句插话，落在旧那一轮的四个时刻（线上现状）"><title>同一句插话，落在旧那一轮的四个时刻（线上现状）</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="760" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">同一句插话，落在旧那一轮的四个时刻（线上现状）</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">教学示例：主驾先问“附近有什么好吃的”，随后副驾补一句“要清淡一点的”</text><text x="40" y="118" font-size="15" fill="#16344a" font-weight="650" text-anchor="start">旧的那一轮（主驾的问题）从左往右推进：</text><rect x="40" y="140" width="250" height="84" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="167" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">① DT 还在想</text><text x="54" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">第一个字还没出</text><rect x="330" y="140" width="250" height="84" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="344" y="167" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">② 已出字，工具在查</text><text x="344" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说了“我帮你找找”</text><rect x="620" y="140" width="250" height="84" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="634" y="167" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">③ 结果回来，等总结</text><text x="634" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 这时是空闲的</text><rect x="910" y="140" width="250" height="84" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="924" y="167" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">④ 豆包正在念结果</text><text x="924" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">查询早已完成</text><path d="M290,182 L330,182" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M580,182 L620,182" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M870,182 L910,182" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><text x="40" y="280" font-size="15" fill="#16344a" font-weight="650" text-anchor="start">副驾这句话如果落在这个时刻，线上怎么处理：</text><rect x="40" y="300" width="250" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="327" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">合并重想</text><text x="54" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">取消主驾那次推理</text><text x="54" y="373" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">两句话一起交给 DT</text><text x="54" y="394" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户只听到一个回答</text><path d="M165,224 L165,300" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="300" width="250" height="130" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="344" y="327" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">第二句打断第一句</text><text x="344" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">主驾那次推理作废</text><text x="344" y="373" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已发出的查询不撤回</text><text x="344" y="394" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">结果回来仍会交给 DT</text><path d="M455,224 L455,300" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="620" y="300" width="250" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="634" y="327" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 直接接新话</text><text x="634" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">新话马上开始推理</text><text x="634" y="373" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">旧结果回来后</text><text x="634" y="394" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">合并给 DT 再总结</text><path d="M745,224 L745,300" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="910" y="300" width="250" height="130" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="924" y="327" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">走打断恢复</text><text x="924" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">先停播（V 章）</text><text x="924" y="373" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没说完的话交回 DT</text><text x="924" y="394" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">由 DT 决定补不补</text><path d="M1035,224 L1035,300" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="470" width="1120" height="110" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="54" y="497" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">分界线是“DT 有没有输出第一个字”</text><text x="54" y="522" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">线上程序实际看的是“DT 的第一个输出”，它不一定是用户能看到的字，也可能是一次工具调用</text><text x="54" y="543" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">③ 里“统一回复的节奏”当时在优化中</text><rect x="40" y="610" width="1120" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="54" y="637" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">新输入管理（开发中）把分界线换成两条</text><text x="54" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具有没有发出去：没发，可以新旧合并重想；发了，旧话只当背景，不再重想（避免重复执行）</text><text x="54" y="683" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上有没有开始播：开始播了，车上先停播，旧话的已说 / 没说完部分当背景交给 DT（细节见 M 章）</text></g></svg>