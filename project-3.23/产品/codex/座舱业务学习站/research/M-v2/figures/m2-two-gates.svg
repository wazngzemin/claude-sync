<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="m2-two-gates" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="m2-two-gates-title m2-two-gates-desc">
<title id="m2-two-gates-title">旧话能否重放，要过两道门</title><desc id="m2-two-gates-desc">用户的新话来了：工具还没放行、语音还没起播，才把旧话和新话合并重推。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="m2-two-gates-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<rect data-background="true" x="0" y="0" width="1200" height="690" style="fill:var(--v56-bg,#fff)"/>
<text class="v56-title" x="32" y="44" text-anchor="start">旧话能否重放，要过两道门</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">用户的新话来了：工具还没放行、语音还没起播，才把旧话和新话合并重推。</text>
<text class="v56-label" x="32" y="122" text-anchor="start">一轮执行的示例时间轴</text>
<g data-node="true" data-name="start"><rect class="v56-neutral" x="32" y="220" width="210" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="247" text-anchor="start">开始推理</text>
<text class="v56-node-sub" x="46" y="272" text-anchor="start">旧输入进入 Planner</text>
</g>
<g data-node="true" data-name="tool"><rect class="v56-neutral" x="335" y="220" width="210" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="349" y="247" text-anchor="start">工具放行</text>
<text class="v56-node-sub" x="349" y="272" text-anchor="start">登记为不能重放</text>
</g>
<g data-node="true" data-name="text"><rect class="v56-neutral" x="640" y="220" width="210" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="654" y="247" text-anchor="start">首段文字</text>
<text class="v56-node-sub" x="654" y="272" text-anchor="start">开始向用户展示</text>
</g>
<g data-node="true" data-name="speech"><rect class="v56-neutral" x="940" y="220" width="210" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="954" y="247" text-anchor="start">语音起播</text>
<text class="v56-node-sub" x="954" y="272" text-anchor="start">车上真正开始播放</text>
</g>
<path class="v56-arrow" d="M 242 270 L 335 270" fill="none" marker-end="url(#m2-two-gates-arr)" />
<path class="v56-arrow" d="M 545 270 L 640 270" fill="none" marker-end="url(#m2-two-gates-arr)" />
<path class="v56-arrow" d="M 850 270 L 940 270" fill="none" marker-end="url(#m2-two-gates-arr)" />
<path class="v56-arrow" d="M 310 160 L 310 370" fill="none"  style="stroke:var(--amber,#865b1a);stroke-width:2.4"/>
<text class="v56-node-title" x="310" y="145" text-anchor="middle">工具门</text>
<path class="v56-arrow" d="M 915 160 L 915 370" fill="none"  style="stroke:var(--amber,#865b1a);stroke-width:2.4"/>
<text class="v56-node-title" x="915" y="145" text-anchor="middle">起播门</text>
<g data-node="true" data-name="merge"><rect class="v56-cloud" x="32" y="425" width="400" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="452" text-anchor="start">两道门都没过 → 合并重推</text>
<text class="v56-node-sub" x="46" y="477" text-anchor="start">旧话与新话一起交给 Planner</text>
<text class="v56-node-sub" x="46" y="500" text-anchor="start">旧推理失效，换新的执行身份</text>
</g>
<g data-node="true" data-name="new-only"><rect class="v56-reject" x="475" y="425" width="693" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="489" y="452" text-anchor="start">过了任一道门 → 只办新话</text>
<text class="v56-node-sub" x="489" y="477" text-anchor="start">旧话和已发工具当背景；语音起播后还要带上已播、未播内容</text>
<text class="v56-node-sub" x="489" y="500" text-anchor="start">已经执行的动作不撤销</text>
</g>
<text class="v56-node-sub" x="32" y="582" text-anchor="start">原因：重推可能再发一次同样的工具，造成重复车控、重复下单。</text>
<rect data-legend="true" class="v56-decision" x="32" y="636" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="650" text-anchor="start">黄：两道边界</text>
<rect data-legend="true" class="v56-cloud" x="320" y="636" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="348" y="650" text-anchor="start">绿：可以合并重推</text>
<rect data-legend="true" class="v56-reject" x="680" y="636" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="708" y="650" text-anchor="start">红：旧话不能重办</text>
</svg>
