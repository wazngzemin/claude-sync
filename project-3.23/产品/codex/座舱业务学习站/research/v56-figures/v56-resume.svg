<svg xmlns="http://www.w3.org/2000/svg" id="v56-resume" class="flow-figure v56-diagram" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="v56-resume-title v56-resume-desc">
<title id="v56-resume-title">播报被打断以后：恢复原播报，或重新组织回答</title>
<desc id="v56-resume-desc">先停播让用户说完，再看最终判断；Reject 恢复有前提，Recall 这里画交给云端 Planner 的路线。</desc>
<style>
.v56-diagram{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff);color:var(--body,#33495b)}
.v56-diagram text{font-size:14px;font-weight:400;fill:var(--body,#33495b)}
.v56-diagram .figure-header .title{font-size:24px;font-weight:650;fill:var(--ink,#16344a)}
.v56-diagram .figure-header .subtitle,.v56-diagram .figure-caption text,.v56-diagram .note{fill:var(--muted,#5d7183)}
.v56-diagram .node-title{font-size:16px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .section-label{font-size:15px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .box{stroke-width:1.6}
.v56-diagram .neutral .box,.v56-diagram .neutral .swatch{fill:var(--v56-bg,#fff);stroke:var(--quiet,#9fb2c2)}
.v56-diagram .info .box,.v56-diagram .info .swatch{fill:var(--blue-soft,#eaf2fb);stroke:var(--blue,#4f7ea9)}
.v56-diagram .action .box,.v56-diagram .action .swatch{fill:var(--teal-soft,#eaf6ef);stroke:var(--teal,#4a9670)}
.v56-diagram .warning .box,.v56-diagram .warning .swatch{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-diagram .error .box,.v56-diagram .error .swatch{fill:var(--red-soft,#fdeeee);stroke:var(--red,#c45c5c)}
.v56-diagram .info .node-title{fill:var(--blue,#1f4565)}
.v56-diagram .action .node-title{fill:var(--teal,#1d4b35)}
.v56-diagram .warning .node-title{fill:var(--amber,#865b1a)}
.v56-diagram .error .node-title{fill:var(--red,#6e2222)}
.v56-diagram .pending .box{stroke-dasharray:6 5}
.v56-diagram .arr{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.v56-diagram .arr-error{stroke:var(--red,#c45c5c)}
.v56-diagram .arrow-head{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8}
.v56-diagram .arrow-head-error{stroke:var(--red,#c45c5c)}
.v56-diagram .rule{stroke:var(--line,#dce4eb);stroke-width:1;fill:none}
@media(prefers-color-scheme:dark){svg.v56-diagram{--v56-bg:#17212d;--ink:#e4edf6;--body:#d0dde9;--muted:#b4c4d3;--quiet:#8a9ead;--line:#3b5062;--blue:#a4caff;--blue-soft:#213c59;--teal:#99dbc5;--teal-soft:#203f3b;--amber:#f1cf91;--amber-soft:#443822;--red:#f2b0b7;--red-soft:#4b2e36}}
</style>
<defs><marker id="v56-resume-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head" d="M1 1L9 5L1 9"/></marker><marker id="v56-resume-arr-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head arrow-head-error" d="M1 1L9 5L1 9"/></marker></defs>
<g class="figure-header"><text class="title" x="32" y="44">播报被打断以后：恢复原播报，或重新组织回答</text><text class="subtitle" x="32" y="72">先停播让用户说完，再看最终判断；Reject 恢复有前提，Recall 这里画交给云端 Planner 的路线。</text></g>
<path class="arr" d="M600,192 L600,232" fill="none" marker-end="url(#v56-resume-arr)"/>
<path class="arr" d="M600,310 L600,350" fill="none" marker-end="url(#v56-resume-arr)"/>
<path class="arr" d="M500,436 L500,472 L305,472 L305,504" fill="none" marker-end="url(#v56-resume-arr)"/>
<path class="arr" d="M700,436 L700,472 L914,472 L914,504" fill="none" marker-end="url(#v56-resume-arr)"/>
<path class="arr" d="M305,610 L305,654" fill="none" marker-end="url(#v56-resume-arr)"/>
<path class="arr" d="M305,760 L305,804" fill="none" marker-end="url(#v56-resume-arr)"/>
<path class="arr" d="M914,610 L914,654" fill="none" marker-end="url(#v56-resume-arr)"/>
<path class="arr" d="M914,760 L914,804" fill="none" marker-end="url(#v56-resume-arr)"/>
<g class="neutral" data-node="talk"><rect class="box" x="400" y="120" width="400" height="72" rx="8"/><text class="node-title" x="414" y="147" text-anchor="start">播报中，用户插话</text><text class="node-subtitle" x="414" y="172" text-anchor="start">豆包正在介绍餐厅</text></g>
<g class="action" data-node="stop"><rect class="box" x="400" y="238" width="400" height="72" rx="8"/><text class="node-title" x="414" y="265" text-anchor="start">先停播</text><text class="node-subtitle" x="414" y="290" text-anchor="start">让用户把话说完</text></g>
<g class="warning pending" data-node="judge"><rect class="box" x="400" y="356" width="400" height="80" rx="8"/><text class="node-title" x="414" y="383" text-anchor="start">等待最终判断</text><text class="node-subtitle" x="414" y="408" text-anchor="start">完整文字与背景到齐</text></g>
<g class="info" data-node="reject"><rect class="box" x="70" y="510" width="470" height="100" rx="8"/><text class="node-title" x="84" y="537" text-anchor="start">最终拒识</text><text class="node-subtitle" x="84" y="562" text-anchor="start">Reject</text><text class="node-subtitle" x="84" y="585" text-anchor="start">条件：停播原因允许恢复</text></g>
<g class="info" data-node="recall"><rect class="box" x="660" y="510" width="508" height="100" rx="8"/><text class="node-title" x="674" y="537" text-anchor="start">最终召回</text><text class="node-subtitle" x="674" y="562" text-anchor="start">Recall</text><text class="node-subtitle" x="674" y="585" text-anchor="start">交云端 Planner 处理</text></g>
<g class="action" data-node="event"><rect class="box" x="70" y="660" width="470" height="100" rx="8"/><text class="node-title" x="84" y="687" text-anchor="start">发起一次新请求</text><text class="node-subtitle" x="84" y="712" text-anchor="start">Event 触发 Query</text><text class="node-subtitle" x="84" y="735" text-anchor="start">带入已播和未播内容</text></g>
<g class="action" data-node="fusion"><rect class="box" x="660" y="660" width="508" height="100" rx="8"/><text class="node-title" x="674" y="687" text-anchor="start">重新组织回答</text><text class="node-subtitle" x="674" y="712" text-anchor="start">新要求＋没播完的内容</text><text class="node-subtitle" x="674" y="735" text-anchor="start">依据实际办理结果组织</text></g>
<g class="action" data-node="restore"><rect class="box" x="70" y="810" width="470" height="80" rx="8"/><text class="node-title" x="84" y="837" text-anchor="start">恢复原来播报</text><text class="node-subtitle" x="84" y="862" text-anchor="start">接着未播完的部分说</text></g>
<g class="action" data-node="fresh"><rect class="box" x="660" y="810" width="508" height="80" rx="8"/><text class="node-title" x="674" y="837" text-anchor="start">不重复的新回答</text><text class="node-subtitle" x="674" y="862" text-anchor="start">不把已听内容重讲一遍</text></g>
<text class="note" x="70" y="934" text-anchor="start">用户听到：接着听没说完的餐厅介绍。</text>
<text class="note" x="660" y="934" text-anchor="start">用户听到：根据新要求重新组织的回答。</text>
<text class="note" x="32" y="978" text-anchor="start">Recall 不承诺把旧内容全部补完；新话改变原任务时，旧内容可能已不适合继续。</text>
<g class="figure-caption"><path class="rule" d="M32,1016 L1168,1016"/>
<g class="info"><circle class="swatch" cx="39" cy="1037" r="7"/></g>
<text class="node-subtitle" x="62" y="1042" text-anchor="start">最终判断结果</text>
<g class="action"><circle class="swatch" cx="214" cy="1037" r="7"/></g>
<text class="node-subtitle" x="237" y="1042" text-anchor="start">后续处理与播报</text>
<g class="warning"><circle class="swatch" cx="389" cy="1037" r="7"/></g>
<text class="node-subtitle" x="412" y="1042" text-anchor="start">评估阶段</text>
<path class="arr" d="M557,1037 L581,1037" stroke-dasharray="6 5"/>
<text class="node-subtitle" x="587" y="1042" text-anchor="start">评估中</text>
</g>
</svg>
