<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="k2-layers" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="k2-layers-title k2-layers-desc">
<title id="k2-layers-title">从刚才聊过的话，到长期留下的记忆</title><desc id="k2-layers-desc">沿时间从近到远看各层；连线只表示即时写入和画像推断，各层并非逐级加工。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="k2-layers-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">从刚才聊过的话，到长期留下的记忆</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">沿时间从近到远看各层；连线只表示即时写入和画像推断，各层并非逐级加工。</text>
<path class="v56-rule" d="M 32 127 L 1168 127"/>
<text class="v56-label" x="32" y="113" text-anchor="start">本轮附近</text>
<text class="v56-label" x="260" y="113" text-anchor="start">本次用车</text>
<text class="v56-label" x="508" y="113" text-anchor="start">一段经历</text>
<text class="v56-label" x="780" y="113" text-anchor="start">长期积累</text>
<g data-node="true" id="k2-layers-recent"><rect class="v56-neutral" x="32" y="164" width="200" height="192" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="192" text-anchor="start">最近历史</text>
<text class="v56-node-sub" x="46" y="220" text-anchor="start">最近 5 轮</text>
<text class="v56-node-sub" x="46" y="244" text-anchor="start">有效人机对话</text>
<text class="v56-node-sub" x="46" y="268" text-anchor="start">另加最近几次</text>
<text class="v56-node-sub" x="46" y="292" text-anchor="start">人人对话和事件</text>
</g>
<g data-node="true" id="k2-layers-summary"><rect class="v56-neutral" x="260" y="164" width="220" height="192" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="274" y="192" text-anchor="start">摘要记忆</text>
<text class="v56-node-sub" x="274" y="220" text-anchor="start">从第 3 轮开始压缩</text>
<text class="v56-node-sub" x="274" y="244" text-anchor="start">最多压缩 28 轮</text>
<text class="v56-node-sub" x="274" y="268" text-anchor="start">最长 500 个 token</text>
<text class="v56-node-sub" x="274" y="292" text-anchor="start">放在记忆最前面</text>
</g>
<g data-node="true" id="k2-layers-short"><rect class="v56-cloud" x="508" y="164" width="240" height="192" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="522" y="192" text-anchor="start">短期情景记忆</text>
<text class="v56-node-sub" x="522" y="220" text-anchor="start">约 20 分钟或约 20 条事件</text>
<text class="v56-node-sub" x="522" y="244" text-anchor="start">合并总结一段经历</text>
<text class="v56-node-sub" x="522" y="268" text-anchor="start">保留约 1 天</text>
</g>
<g data-node="true" id="k2-layers-long-episode"><rect class="v56-cloud" x="780" y="164" width="184" height="192" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="794" y="192" text-anchor="start">长期情景记忆</text>
<text class="v56-node-sub" x="794" y="220" text-anchor="start">按天合并经历</text>
<text class="v56-node-sub" x="794" y="244" text-anchor="start">默认不设到期</text>
<text class="v56-node-sub" x="794" y="268" text-anchor="start">可按业务配置</text>
</g>
<g data-node="true" id="k2-layers-long-semantic"><rect class="v56-cloud" x="780" y="418" width="184" height="166" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="794" y="446" text-anchor="start">长期语义记忆</text>
<text class="v56-node-sub" x="794" y="474" text-anchor="start">事实和偏好原话</text>
<text class="v56-node-sub" x="794" y="498" text-anchor="start">每天生成</text>
<text class="v56-node-sub" x="794" y="522" text-anchor="start">也可明确要求即时写</text>
</g>
<g data-node="true" id="k2-layers-profile"><rect class="v56-decision" x="992" y="418" width="176" height="166" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="1006" y="446" text-anchor="start">画像</text>
<text class="v56-node-sub" x="1006" y="474" text-anchor="start">从语义记忆推断</text>
<text class="v56-node-sub" x="1006" y="498" text-anchor="start">结构化偏好标签</text>
<text class="v56-node-sub" x="1006" y="522" text-anchor="start">推断 ≠ 用户原话</text>
</g>
<g data-node="true" id="k2-layers-instant"><rect class="v56-local" x="508" y="418" width="240" height="166" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="522" y="446" text-anchor="start">“记一下”即时写入</text>
<text class="v56-node-sub" x="522" y="474" text-anchor="start">Planner 补齐指代和地点</text>
<text class="v56-node-sub" x="522" y="498" text-anchor="start">调用记忆操作工具</text>
<text class="v56-node-sub" x="522" y="522" text-anchor="start">写入长期语义记忆</text>
</g>
<path class="v56-arrow" fill="none" d="M 748 501 L 780 501" marker-end="url(#k2-layers-arr)"/>
<path class="v56-arrow" fill="none" d="M 964 501 L 992 501" marker-end="url(#k2-layers-arr)"/>
<text class="v56-label" x="32" y="438" text-anchor="start">三种状态要分开看</text>
<text class="v56-node-sub" x="32" y="472" text-anchor="start">生成了 → 召回了 → 本轮用上了</text>
<text class="v56-subtitle" x="32" y="506" text-anchor="start">日志里有，只说明事情发生过。</text>
<g data-node="true" id="k2-layers-events"><rect class="v56-neutral" x="32" y="646" width="1136" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="674" text-anchor="start">事件日志：按时间记录发生了什么</text>
<text class="v56-node-sub" x="46" y="702" text-anchor="start">对话、指令、车况变化、操作等原料；描述按规则拼接，本身不总结。</text>
</g>
<text class="v56-node-title" x="32" y="788" text-anchor="start">近处保留原话和摘要，远处积累经历、事实与偏好；画像另做推断。</text>
<rect data-decoration="true" class="v56-neutral" x="32" y="822" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="836" text-anchor="start">灰：近期上下文与原料</text>
<rect data-decoration="true" class="v56-cloud" x="332" y="822" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="360" y="836" text-anchor="start">绿：经历、事实和偏好</text>
<rect data-decoration="true" class="v56-local" x="642" y="822" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="670" y="836" text-anchor="start">蓝：明确要求即时写入</text>
<rect data-decoration="true" class="v56-decision" x="948" y="822" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="976" y="836" text-anchor="start">黄：推断标签</text>
</svg>
