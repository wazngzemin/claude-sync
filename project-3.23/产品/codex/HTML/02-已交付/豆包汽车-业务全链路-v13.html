调。","最多 3 个动态观察任务；采用全量列表替换。","AlwaysOn 关闭时拒收新动态任务并清空旧任务，不能悄悄一直观察。","旧 goal_list_update 与新 task_manage 属于不同版本口径，不合并成 28 个已上线工具。"],"role":"annotation","tone":"gray","titleSize":22,"size":20,"kind":"step","paras":[["这个小模块做什么","按需 VQA：用户问“那是什么” → visual_qa → 采图 → 看图 → 工具反馈。；默认 AlwaysOn：持续产生默认场景观察，经端数据中心进入 Context。；动态 watch：云 Task 下发 task_id + 纯观察问题 → 单任务结果单独上报。；动态观察结果不进通用 Context；云端语义 Y/N 后才形成条件回调。；最多 3 个动态观察任务；采用全量列表替换。；AlwaysOn 关闭时拒收新动态任务并清空旧任务，不能悄悄一直观察。；旧 goal_list_update 与新 task_manage 属于不同版本口径，不合并成 28 个已上线工具。"],["原有职责细节","按需 VQA：用户问“那是什么” → visual_qa → 采图 → 看图 → 工具反馈。；默认 AlwaysOn：持续产生默认场景观察，经端数据中心进入 Context。；动态 watch：云 Task 下发 task_id + 纯观察问题 → 单任务结果单独上报。；动态观察结果不进通用 Context；云端语义 Y/N 后才形成条件回调。；最多 3 个动态观察任务；采用全量列表替换。；AlwaysOn 关闭时拒收新动态任务并清空旧任务，不能悄悄一直观察。；旧 goal_list_update 与新 task_manage 属于不同版本口径，不合并成 28 个已上线工具。"],["真实工具名","visual_qa"],["接到什么","方向/对象/视觉问题。"],["内部机制","按请求采集对应画面 → 视觉模型识别画面内容 → 需外部知识时再交网页搜索。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","不能直接读取车机屏幕内容；不能靠摄像头知道商品现价；画面范围/新鲜度影响回答。"],["用一个例子追","“看一下右边那是什么”。先确认右侧采图方向和当前帧，再识别可见内容；看不到就说明，不从互联网知识猜画面。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],["这一步怎么做","用户提出视觉问题时，按请求方向采集对应画面，再由视觉能力回答可见内容。这是一次工具调用，结果回 07；不能把摄像头当互联网，也不能用它直接读取车机屏幕。"],["放进同一个例子","“外面那栋建筑是什么”需要正确方向与当前画面；若还要门票价格，应再查外部资料，不能从图像直接得出现价。"],["异常与交接","遮挡、错误视角、旧帧或画面不可见要明确表达。图像判断准确也不保证后续工具选择正确。"],["产品要问清","模型看的是哪一帧？用户所指对象真在视野里吗？时延里采图和推理分别占多少？"],["这一步怎么做","默认感知按已覆盖能力产生舱内外观察，经端数据中心等路径供 Context 使用。某次结果未达成，只说明当时没看到条件成立，不等于系统缺少这项观察能力。"],["放进同一个例子","默认能力已经能看某类舱内状态时，任务未命中应继续等默认观察；只有目标未覆盖时，才讨论额外专属观察。"],["异常与交接","开关、隐私、资源预算与结果新鲜度都影响能否使用。不能用一个“AlwaysOn 开了”代替具体能力覆盖表。"],["产品要问清","这是能力未覆盖，还是覆盖但当前未达成？证据来自哪份能力表和哪次观察？"],["这一步怎么做","动态感知协议由 Task Service 下发 task_id 与纯观察问题，采用全量列表替换，最多 3 项同时观察。动态结果走独立任务通道，不进入通用 Context；AlwaysOn 关闭时拒收新项并清空旧项。"],["放进同一个例子","“帮我盯着某个对象”是观察任务，不应把“看到后给我打电话”整段执行指令塞给视觉模型。动作由任务/业务层负责。"],["异常与交接","全量替换漏带旧项会使旧观察被移除；取消后结果迟到必须按 task_id 处理。3 项是并发观察限制，不是全部业务规则上限。"],["产品要问清","列表是谁维护的？关闭、取消、替换、超容量分别返回什么状态？"]],"learn":["family-5"],"refs":"本地 SP 快照,S05,S08","future":false,"detail":"","oldId":"M5","layout":{"title":["本轮视觉、默认感知、动态观察：三条不同路径"],"body":["按需 VQA：用户问“那是什么” → visual_qa → 采图 → 看图 → 工具反馈。","默认 AlwaysOn：持续产生默认场景观察，经端数据中心进入 Context。","动态 watch：云 Task 下发 task_id + 纯观察问题 → 单任务结果单独上报。","动态观察结果不进通用 Context；云端语义 Y/N 后才形成条件回调。","最多 3 个动态观察任务；采用全量列表替换。","AlwaysOn 关闭时拒收新动态任务并清空旧任务，不能悄悄一直观察。","旧 goal_list_update 与新 task_manage 属于不同版本口径，不合并成 28 个已上线工具。"],"detail":[],"height":401}},{"id":"OUT5","group":"family-5","x":13700,"y":16236,"w":2230,"h":220,"title":"返回统一反馈入口","body":["成功 / 失败 / 候选待选 / 处理中；保留调用关系"],"role":"step","tone":"green","titleSize":21,"size":18,"kind":"step","paras":[["这个小模块做什么","成功 / 失败 / 候选待选 / 处理中；保留调用关系"],["原有职责细节","成功 / 失败 / 候选待选 / 处理中；保留调用关系"],["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"]],"learn":["family-5"],"refs":"本地 SP 快照,S05,S08","future":false,"detail":"","oldId":"OUT5","layout":{"title":["返回统一反馈入口"],"body":["成功 / 失败 / 候选待选 / 处理中；保留调用关系"],"detail":[],"height":185}},{"id":"Z1","group":"case","x":250,"y":18820,"w":3775,"h":390,"title":"① 输入/路由","body":["“我”=主驾；“昨天”=历史事实","需记忆与推理 → 云端 Planner"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","“我”=主驾；“昨天”=历史事实；需记忆与推理 → 云端 Planner"],["原有职责细节","“我”=主驾；“昨天”=历史事实；需记忆与推理 → 云端 Planner"],["这一步怎么做","把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的明确请求。"],["放进同一个例子","交接内容可以理解为：主驾在此刻提出“降温＋去昨天的游泳馆”。具体字段名与运行版本对齐，不用示意字段冒充真实接口。"],["异常与交接","用户说“算了”或再次发声，可能是取消、改目标或仅打断播报。输入层记录新事实，业务层再决定影响哪些动作和等待任务。"],["产品要问清","能否还原原话、当前轮输入、历史记录三者？本轮关联是否在后续调用与反馈中保留？"],["这一步怎么做","按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，需要运行日志证明。"],["放进同一个例子","本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。"],["异常与交接","端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能声称所有需要记忆或联网的能力仍能离线完成。"],["产品要问清","同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎样证明只执行一次？"]],"learn":["case"],"refs":"本地 v11/v12 内容对照","detail":"把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的明确请求。","oldId":"Z1","layout":{"title":["① 输入/路由"],"body":["“我”=主驾；“昨天”=历史事实","需记忆与推理 → 云端 Planner"],"detail":["把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的明确请求。"],"height":283}},{"id":"Z2","group":"case","x":4105,"y":18820,"w":3775,"h":390,"title":"② 并行补齐","body":["车控/查车况 + 查询历史地点","先有依据才能调温和选目的地"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","车控/查车况 + 查询历史地点；先有依据才能调温和选目的地"],["原有职责细节","车控/查车况 + 查询历史地点；先有依据才能调温和选目的地"],["这一步怎么做","查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。"],["放进同一个例子","如果昨天地点未在 Context 中，先调用 user_memory_search。若返回两个可能地点，就问用户选哪一个；不能自行挑一家立即导航。"],["异常与交接","查无记忆、无注册身份、存在多候选、工具不可用，是不同的恢复分支。用户提供新信息后，要继续原目标而不是忘记降温这一半。"],["产品要问清","为什么这一步要查工具，不直接问用户？又为什么多候选时不能继续替用户决定？"],["这一步怎么做","独立动作可以分别推进；有依赖的动作必须等前一步结果。工具指令要把代词、对象和约束改写得下游能理解。SP 还明确要求 POI、路线规划、导航控制串行互斥。"],["放进同一个例子","降温相关行动与查询历史地点可以在条件允许时独立推进；路线规划必须等具体地点。不能在查“昨天那家”的同时，凭空给路线工具一个地址。"],["异常与交接","是否并发由能力、依赖和实际调度契约共同决定，不是“模型一次输出多个 action 就一定并行”。串行安全要求也不能仅凭提示词就认为已保证。"],["产品要问清","哪个结果是下一步必需的输入？哪一条日志能证明工具实际按正确顺序执行？"],["真实工具名","user_memory_search"],["接到什么","已注册用户+记忆问题。"],["内部机制","按身份检索事实/偏好/经历 → 返回相关记录与可用线索 → 未找到就回报缺失。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","不把其他乘员记忆套给主驾；查无结果时不补造经历；供 Planner 再判断/澄清。"],["用一个例子追","“昨天去的是哪家游泳馆”。按当前注册身份检索经历；命中唯一地点、返回多个地点和查无结果，分别对应继续、澄清和补信息。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],["真实工具名","vehicle_basic_control"],["接到什么","明确功能、位置、目标值。"],["内部机制","理解自然语言车控诉求 → 补全音区所指的座位/车窗 → 映射原子动作，交车型适配。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","回执 + 真实状态需分别核验；不能用它开关车门本体；门锁与车门不是同一能力。"],["用一个例子追","“给副驾降温”。先确定对象和功能，再核对原子动作与车况回读；解析正确却副驾没有变化，继续查车型适配和执行。"]],"learn":["case"],"refs":"本地 v11/v12 内容对照","detail":"查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。","oldId":"Z2","layout":{"title":["② 并行补齐"],"body":["车控/查车况 + 查询历史地点","先有依据才能调温和选目的地"],"detail":["查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。"],"height":283}},{"id":"Z3","group":"case","x":4105,"y":19348,"w":3775,"h":390,"title":"③ 等依赖/问用户","body":["记忆返回两个游泳馆 → 请选","没有结果 → 问名称，不编地址"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","记忆返回两个游泳馆 → 请选；没有结果 → 问名称，不编地址"],["原有职责细节","记忆返回两个游泳馆 → 请选；没有结果 → 问名称，不编地址"],["这一步怎么做","查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。"],["放进同一个例子","如果昨天地点未在 Context 中，先调用 user_memory_search。若返回两个可能地点，就问用户选哪一个；不能自行挑一家立即导航。"],["异常与交接","查无记忆、无注册身份、存在多候选、工具不可用，是不同的恢复分支。用户提供新信息后，要继续原目标而不是忘记降温这一半。"],["产品要问清","为什么这一步要查工具，不直接问用户？又为什么多候选时不能继续替用户决定？"],["真实工具名","route_planning"],["接到什么","确定地点/途经点/路线偏好。"],["内部机制","给具体地点规划候选路线 → 选择路线后工具会自动导航 → 失败最多重试 2 次（SP约定）。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","不要再多调一次开始导航；依赖 POI/用户选择的结果；不能把路线展示当已出发。"],["用一个例子追","“去昨天那个游泳馆”。先把历史指代补成确定地点，再规划候选路线；选路后的导航由该工具既定流程完成，避免额外重复开始。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"],["这一步怎么做","手动选择与可见即可说需要找到当前可操作元素，再触发原业务按钮回调。关键选择结果应回到 Context；未完成的任务继续判断，不能让一次点击丢失前面的目标。"],["放进同一个例子","用户选第三条路线后，由路线业务完成其既定选择/导航流程，再把结果回给系统；不应把“第三个”单独当成没有上下文的新地点。"],["异常与交接","页面已切换、候选过期、同名按钮、任务已取消时，不能照旧点击。可见即可说的详细匹配链在本列下方展开。"],["产品要问清","原业务收到的是哪个选项 ID？实际选择有没有进入下一轮模型输入？"]],"learn":["case"],"refs":"本地 v11/v12 内容对照","detail":"查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。","oldId":"Z3","layout":{"title":["③ 等依赖/问用户"],"body":["记忆返回两个游泳馆 → 请选","没有结果 → 问名称，不编地址"],"detail":["查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。"],"height":283}},{"id":"Z4","group":"case","x":250,"y":19348,"w":3775,"h":390,"title":"④ 串行执行","body":["具体 POI → route_planning","选路线后按工具契约自动导航"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","具体 POI → route_planning；选路线后按工具契约自动导航"],["原有职责细节","具体 POI → route_planning；选路线后按工具契约自动导航"],["这一步怎么做","把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返回的结果。"],["放进同一个例子","查完记忆拿到地址，再把地址交给路线规划；降温动作的反馈与路线反馈分别记录，不能先回来的一个成功覆盖整个目标。"],["异常与交接","取消、重试、超时后迟到结果必须有明确处理。当前 SP 的反馈示意只有 tool_name 与文本，无法据此推断 action_id 回绑已完善。"],["产品要问清","反馈怎么找到那一次调用？两个同名调用反序返回、旧结果迟到，系统会不会串结果？"],["这一步怎么做","真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里才可能产生真实副作用。"],["放进同一个例子","车控接口让空调或风量发生变化；路线工具让正确目的地进入导航状态。这两条链各自成功，才有可能完成本例。"],["异常与交接","SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前车态改变、资源受限、服务不可用，都可能让先前合法计划失败。"],["产品要问清","回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功口径如何保守定义？"]],"learn":["case"],"refs":"本地 v11/v12 内容对照","detail":"把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返回的结果。","oldId":"Z4","layout":{"title":["④ 串行执行"],"body":["具体 POI → route_planning","选路线后按工具契约自动导航"],"detail":["把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返回的结果。"],"height":283}},{"id":"Z5","group":"case","x":250,"y":19876,"w":3775,"h":390,"title":"⑤ 分目标确认","body":["降温是否生效？导航是否开始？","只完成一项时，不能说都完成"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","降温是否生效？导航是否开始？；只完成一项时，不能说都完成"],["原有职责细节","降温是否生效？导航是否开始？；只完成一项时，不能说都完成"],["这一步怎么做","根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。"],["放进同一个例子","如果降温成功但地点没找到，就说清已处理降温、地点仍需确认；不能说“都安排好了”。如果两者都生效，才给完成反馈。"],["异常与交接","业务结果与用户满意度还需分开：导航已正确开始不等于用户对路线满意；空调参数变化也不等于用户已经感到舒适。"],["产品要问清","系统每一次“已完成”是否都有证据？假完成率的分母必须是宣称完成的请求。"],["这一步怎么做","Planner 的 talk_content 用于生成对话输出；查询、简单控制等场景不一定需要无意义的“我帮你查一下”。部分领域 Agent 也会自己播报，需要避免重复或抢话。"],["放进同一个例子","若地点仍在确认，可以先说明必要的下一步；若空调成功而导航失败，应明确部分结果。不能在动作尚未发生时用完成时态承诺。"],["异常与交接","话术要与本轮实际动作、失败和等待一致；安全或重要结果不能被普通过渡语覆盖。具体播报优先级按运行策略核验。"],["产品要问清","谁负责首响应，谁负责领域结果，谁负责总结？有没有重复播报和抢话测试？"]],"learn":["case"],"refs":"本地 v11/v12 内容对照","detail":"根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。","oldId":"Z5","layout":{"title":["⑤ 分目标确认"],"body":["降温是否生效？导航是否开始？","只完成一项时，不能说都完成"],"detail":["根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。"],"height":283}},{"id":"L1","group":"learning","x":8360,"y":18820,"w":3905,"h":390,"title":"主责模块：定位与验收","body":["Planner / Trigger：能解释决策","看真实 Trace 分清根因","提出改法、指标、回归集并验收"],"role":"annotation","tone":"green","titleSize":24,"size":21,"kind":"step","paras":[["这个小模块做什么","Planner / Trigger：能解释决策；看真实 Trace 分清根因；提出改法、指标、回归集并验收"],["原有职责细节","Planner / Trigger：能解释决策；看真实 Trace 分清根因；提出改法、指标、回归集并验收"]],"learn":["learning"],"refs":"本地 v11/v12 内容对照","future":false,"detail":"","oldId":"L1","layout":{"title":["主责模块：定位与验收"],"body":["Planner / Trigger：能解释决策","看真实 Trace 分清根因","提出改法、指标、回归集并验收"],"detail":[],"height":257}},{"id":"L2","group":"learning","x":12345,"y":18820,"w":3905,"h":390,"title":"相邻模块：契约与边界","body":["ASR / VLM / Tool / HMI：","说清输入输出、错误表现与责任","不要求自己写全部模型或 SDK"],"role":"annotation","tone":"blue","titleSize":24,"size":21,"kind":"step","paras":[["这个小模块做什么","ASR / VLM / Tool / HMI：；说清输入输出、错误表现与责任；不要求自己写全部模型或 SDK"],["原有职责细节","ASR / VLM / Tool / HMI：；说清输入输出、错误表现与责任；不要求自己写全部模型或 SDK"]],"learn":["learning"],"refs":"本地 v11/v12 内容对照","future":false,"detail":"","oldId":"L2","layout":{"title":["相邻模块：契约与边界"],"body":["ASR / VLM / Tool / HMI：","说清输入输出、错误表现与责任","不要求自己写全部模型或 SDK"],"detail":[],"height":257}},{"id":"L3","group":"learning","x":12345,"y":19348,"w":3905,"h":390,"title":"AI 能力：能让真实目标做成","body":["模型理解规划 + 可靠 Context","工具能执行 + 反馈能纠错","用质量、时延、成本证明改进"],"role":"annotation","tone":"amber","titleSize":24,"size":21,"kind":"step","paras":[["这个小模块做什么","模型理解规划 + 可靠 Context；工具能执行 + 反馈能纠错；用质量、时延、成本证明改进"],["原有职责细节","模型理解规划 + 可靠 Context；工具能执行 + 反馈能纠错；用质量、时延、成本证明改进"]],"learn":["learning"],"refs":"本地 v11/v12 内容对照","future":false,"detail":"","oldId":"L3","layout":{"title":["AI 能力：能让真实目标做成"],"body":["模型理解规划 + 可靠 Context","工具能执行 + 反馈能纠错","用质量、时延、成本证明改进"],"detail":[],"height":257}},{"id":"H1","group":"legacy","x":6370,"y":735,"w":760,"h":390,"title":"17.0 目标管理工具被调用","body":["输入：延迟/条件/持续诉求","来自 Planner 的 goal_list_update"],"role":"step","tone":"amber","future":true,"kind":"step","paras":[["这个小模块做什么","旧工具接收未来时间、条件或持续目标。它创建的是等待目标，不应顺手将目标里的动作立即执行。"],["原有职责细节","输入：延迟/条件/持续诉求；来自 Planner 的 goal_list_update"],["这一步怎么做","“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。"],["放进同一个例子","本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。"],["异常与交接","方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。"],["产品要问清","当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"],["真实工具名","goal_list_update"],["接到什么","延迟/条件/持续目标。"],["内部机制","创建/更新 Goal List 目标 → 动态 Advisor 观察目标进展 → 条件满足后给 Planner 建议。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","注册成功只代表进入等待；不可感知条件不能乱创建；新 Task 迁移不混为已上线。"],["用一个例子追","“十分钟后关座椅加热”。创建未来目标并等待条件，不立即关加热；旧 Goal 链的注册成功与十分钟后的执行成功是两次验收。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"learn":["legacy"],"refs":"A,B,S11；新 Task 本轮未重读","detail":"旧工具接收未来时间、条件或持续目标。它创建的是等待目标，不应顺手将目标里的动作立即执行。","oldId":"H1","layout":{"title":["17.0 目标管理工具被调用"],"body":["输入：延迟/条件/持续诉求","来自 Planner 的 goal_list_update"],"detail":["旧工具接收未来时间、条件或持续目标。它创建的是等待目标，","不应顺手将目标里的动作立即执行。"],"height":319}},{"id":"H2","group":"legacy","x":7210,"y":735,"w":760,"h":390,"title":"18.0 Goal List 建立/更新","body":["合理性/数量/归属与目标内容","注册完成只代表进入等待"],"role":"step","tone":"amber","future":true,"kind":"step","paras":[["这个小模块做什么","建立目标归属与内容，并校验合理性及数量。保存成功只表示目标已登记，不等于观察已命中或业务已完成。"],["原有职责细节","合理性/数量/归属与目标内容；注册完成只代表进入等待"],["这一步怎么做","“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。"],["放进同一个例子","本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。"],["异常与交接","方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。"],["产品要问清","当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"]],"learn":["legacy"],"refs":"A,B,S11；新 Task 本轮未重读","detail":"建立目标归属与内容，并校验合理性及数量。保存成功只表示目标已登记，不等于观察已命中或业务已完成。","oldId":"H2","layout":{"title":["18.0 Goal List 建立/更新"],"body":["合理性/数量/归属与目标内容","注册完成只代表进入等待"],"detail":["建立目标归属与内容，并校验合理性及数量。保存成功只表示目","标已登记，不等于观察已命中或业务已完成。"],"height":319}},{"id":"H3","group":"legacy","x":7210,"y":1263,"w":760,"h":390,"title":"17.1 动态 Advisor 跟进","body":["围绕一个目标持续评估","监控目标进展，不直接改车态"],"role":"step","tone":"amber","future":true,"kind":"step","paras":[["这个小模块做什么","围绕已登记目标持续评估进展，与静态场景建议职责不同。读取目标和最新事实后，决定是否需要继续观察或提出建议。"],["原有职责细节","围绕一个目标持续评估；监控目标进展，不直接改车态"],["这一步怎么做","“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。"],["放进同一个例子","本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。"],["异常与交接","方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。"],["产品要问清","当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"]],"learn":["legacy"],"refs":"A,B,S11；新 Task 本轮未重读","detail":"围绕已登记目标持续评估进展，与静态场景建议职责不同。读取目标和最新事实后，决定是否需要继续观察或提出建议。","oldId":"H3","layout":{"title":["17.1 动态 Advisor 跟进"],"body":["围绕一个目标持续评估","监控目标进展，不直接改车态"],"detail":["围绕已登记目标持续评估进展，与静态场景建议职责不同。读取","目标和最新事实后，决定是否需要继续观察或提出建议。"],"height":319}},{"id":"H4","group":"legacy","x":6370,"y":1263,"w":760,"h":390,"title":"17.2 订阅触发条件","body":["定时/周期/状态/视觉条件","注册到云端 Trigger 后等待"],"role":"step","tone":"amber","future":true,"kind":"step","paras":[["这个小模块做什么","将定时、周期、结构状态或视觉条件交云端触发器订阅。必须明确可观察性与回调关联，取消目标时同步清理。"],["原有职责细节","定时/周期/状态/视觉条件；注册到云端 Trigger 后等待"],["这一步怎么做","“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。"],["放进同一个例子","本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。"],["异常与交接","方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。"],["产品要问清","当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"],["这一步怎么做","Manager 管理数量、生命周期和策略；Repository 保存 Task、Run、Event、Binding 等关联；Trigger Adapter 把可执行条件转换并注册到触发系统。等待成立以后才可对用户承诺已建立任务。"],["放进同一个例子","“到达游泳馆”要有可观测的条件和明确执行内容。只存了一段自然语言，却没注册可用条件，任务并不能真正等到未来。"],["异常与交接","新设计区分任务 waiting/running/closed 与单次 Run 的成功、失败、跳过、取消；等待用户或外部结果仍可能是一次运行中的阶段。"],["产品要问清","创建成功的证据是口头回复、Spec 生成，还是已持久化且条件订阅可用？"]],"learn":["legacy"],"refs":"A,B,S11；新 Task 本轮未重读","detail":"将定时、周期、结构状态或视觉条件交云端触发器订阅。必须明确可观察性与回调关联，取消目标时同步清理。","oldId":"H4","layout":{"title":["17.2 订阅触发条件"],"body":["定时/周期/状态/视觉条件","注册到云端 Trigger 后等待"],"detail":["将定时、周期、结构状态或视觉条件交云端触发器订阅。必须明","确可观察性与回调关联，取消目标时同步清理。"],"height":319}},{"id":"H5","group":"legacy","x":6370,"y":1791,"w":760,"h":390,"title":"17.3 命中后重新判断","body":["条件回调 + 当前 Context","是否仍需执行/目标是否已完成"],"role":"step","tone":"amber","future":true,"kind":"step","paras":[["这个小模块做什么","命中回调后重新检查目标是否仍有效、条件是否还适用及动作是否已完成。旧回调不能让取消目标复活。"],["原有职责细节","条件回调 + 当前 Context；是否仍需执行/目标是否已完成"],["这一步怎么做","“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。"],["放进同一个例子","本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。"],["异常与交接","方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。"],["产品要问清","当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"],["这一步怎么做","结构条件读相应事实求值；动态视觉结果还需要按协议进行云端语义 Y/N 判断，再形成条件事件。命中后要处理冷却、去重、范围和有效期，最后回调任务或 Advisor，不能直接宣称动作成功。"],["放进同一个例子","看到目标对象只是观察结果；业务认定条件满足后，才能唤醒未取消的任务，再进入实际执行。"],["异常与交接","规则误判、视觉误判、端侧资源不足和时序问题必须分开。6–7 秒等文档时延目标不是已经达成的实测，更不能统一写成固定 3/5 秒。"],["产品要问清","误触发、漏触发、重复触发和命中到动作时延，各自的真值与测量点在哪里？"]],"learn":["legacy"],"refs":"A,B,S11；新 Task 本轮未重读","detail":"命中回调后重新检查目标是否仍有效、条件是否还适用及动作是否已完成。旧回调不能让取消目标复活。","oldId":"H5","layout":{"title":["17.3 命中后重新判断"],"body":["条件回调 + 当前 Context","是否仍需执行/目标是否已完成"],"detail":["命中回调后重新检查目标是否仍有效、条件是否还适用及动作是","否已完成。旧回调不能让取消目标复活。"],"height":319}},{"id":"H6","group":"legacy","x":7210,"y":1791,"w":760,"h":390,"title":"17.4 形成 Advisor 建议","body":["建议回到同一个 Planner","决定动作、等待或更新目标状态"],"role":"step","tone":"amber","future":true,"kind":"step","paras":[["这个小模块做什么","形成带目标上下文的建议，回同一个 Planner 决定行动、等待或更新目标。动态 Advisor 本身不直接改变车态。"],["原有职责细节","建议回到同一个 Planner；决定动作、等待或更新目标状态"],["这一步怎么做","“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。"],["放进同一个例子","本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。"],["异常与交接","方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。"],["产品要问清","当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"],["这一步怎么做","有效 Advisor input 进入 03，与 Context 一起交 04 判断。用户采纳后通过相应工具执行，结果仍回 07；旧 Goal 监控建议也不能绕过真实执行与结果闭环。"],["放进同一个例子","用户接受降温建议后，要能确认实际控制成功；只点了“接受”但空调没变，不能计为完整行为成功。"],["异常与交接","建议生成、送达、点击、执行开始、最终完成是不同漏斗。拒绝与关闭也要反馈，避免重复打扰。"],["产品要问清","是否能从一条建议追到对应工具调用与真实结果？不能只有点击率而无兑现率。"]],"learn":["legacy"],"refs":"A,B,S11；新 Task 本轮未重读","detail":"形成带目标上下文的建议，回同一个 Planner 决定行动、等待或更新目标。动态 Advisor 本身不直接改变车态。","oldId":"H6","layout":{"title":["17.4 形成 Advisor 建议"],"body":["建议回到同一个 Planner","决定动作、等待或更新目标状态"],"detail":["形成带目标上下文的建议，回同一个 Planner 决定行动、等待","或更新目标。动态 Advisor 本身不直接改变车态。"],"height":319}},{"id":"U1","group":"visible-ui","x":12490,"y":9435,"w":760,"h":390,"title":"① 卡片展示请求","body":["进入 VUI 准入/队列","排队/拒绝/超时不等于已展示"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","卡片进入交互准入与队列；被受理不代表已经占用前台。超时、拒绝或被覆盖的请求不能参与页面语音匹配。"],["原有职责细节","进入 VUI 准入/队列；排队/拒绝/超时不等于已展示"],["这一步怎么做","文字转语音（TTS）让用户听见；卡片展示候选、进度或业务结果；虚拟形象可以配合情绪表达。车控执行是 06 的独立业务链，不需要等形象播完才必然发生。"],["放进同一个例子","可以一边完成降温，一边展示路线候选；用户看见卡片与真实导航启动是不同的两个事件。avatar 或动画不能充当“车控成功”的证明。"],["异常与交接","卡片请求被受理不等于已经显示：可能排队、被覆盖、过期或不在前台。首播、首卡片、首动作、最终完成要分开记时。"],["产品要问清","显示成功在哪个回执里？UI 动效、工具成功和真实车况是否被错误地共用一个成功字段？"]],"learn":["visible-ui"],"refs":"B,S05,S08","detail":"卡片进入交互准入与队列；被受理不代表已经占用前台。超时、拒绝或被覆盖的请求不能参与页面语音匹配。","oldId":"U1","layout":{"title":["① 卡片展示请求"],"body":["进入 VUI 准入/队列","排队/拒绝/超时不等于已展示"],"detail":["卡片进入交互准入与队列；被受理不代表已经占用前台。超时、","拒绝或被覆盖的请求不能参与页面语音匹配。"],"height":319}},{"id":"U2","group":"visible-ui","x":13330,"y":9435,"w":760,"h":390,"title":"② 卡片真实可见","body":["实际显示/隐藏/关闭/过期","只处理当前最顶层页面"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","仅以当前真实可见且可操作的顶层页面作为对象。显示、隐藏、切换与过期必须驱动注册状态变化。"],["原有职责细节","实际显示/隐藏/关闭/过期；只处理当前最顶层页面"],["这一步怎么做","OEM 或业务方解析当前最顶层页面的可交互元素，建立文字指令与元素 ID 映射，页面变化时更新。隐藏页面、已过期卡片不能继续作为可点击对象。"],["放进同一个例子","路线卡片展示三条路线时，“第三条”必须关联当前卡片的第三项，而不是旧卡片里同位置的元素。"],["异常与交接","框架有单页词表容量与动态更新约定，具体版本需核对；它不直接证明所有业务页面均已接入。"],["产品要问清","谁注册、谁更新、谁清理旧词表？页面切换后多久旧 ID 失效？"]],"learn":["visible-ui"],"refs":"B,S05,S08","detail":"仅以当前真实可见且可操作的顶层页面作为对象。显示、隐藏、切换与过期必须驱动注册状态变化。","oldId":"U2","layout":{"title":["② 卡片真实可见"],"body":["实际显示/隐藏/关闭/过期","只处理当前最顶层页面"],"detail":["仅以当前真实可见且可操作的顶层页面作为对象。显示、隐藏、","切换与过期必须驱动注册状态变化。"],"height":319}},{"id":"U3","group":"visible-ui","x":13330,"y":9963,"w":760,"h":390,"title":"③ 界面元素解析","body":["车企/业务方解析可操作元素","提取显示文本、位置和对象"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","页面所属业务解析可操作控件，提供文本、位置与对象信息；不是让摄像头 VQA 识别屏幕来代替 UI 契约。"],["原有职责细节","车企/业务方解析可操作元素；提取显示文本、位置和对象"],["这一步怎么做","OEM 或业务方解析当前最顶层页面的可交互元素，建立文字指令与元素 ID 映射，页面变化时更新。隐藏页面、已过期卡片不能继续作为可点击对象。"],["放进同一个例子","路线卡片展示三条路线时，“第三条”必须关联当前卡片的第三项，而不是旧卡片里同位置的元素。"],["异常与交接","框架有单页词表容量与动态更新约定，具体版本需核对；它不直接证明所有业务页面均已接入。"],["产品要问清","谁注册、谁更新、谁清理旧词表？页面切换后多久旧 ID 失效？"]],"learn":["visible-ui"],"refs":"B,S05,S08","detail":"页面所属业务解析可操作控件，提供文本、位置与对象信息；不是让摄像头 VQA 识别屏幕来代替 UI 契约。","oldId":"U3","layout":{"title":["③ 界面元素解析"],"body":["车企/业务方解析可操作元素","提取显示文本、位置和对象"],"detail":["页面所属业务解析可操作控件，提供文本、位置与对象信息；不","是让摄像头 VQA 识别屏幕来代替 UI 契约。"],"height":319}},{"id":"U4","group":"visible-ui","x":12490,"y":9963,"w":760,"h":390,"title":"④ 指令与元素 ID","body":["页面方维护文本—控件映射","页面变化立即更新，旧 ID 失效"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","维护文本/语音指令到元素 ID 的映射，页面更新及时失效旧对象。词表容量与更新策略按具体版本验收。"],["原有职责细节","页面方维护文本—控件映射；页面变化立即更新，旧 ID 失效"],["这一步怎么做","OEM 或业务方解析当前最顶层页面的可交互元素，建立文字指令与元素 ID 映射，页面变化时更新。隐藏页面、已过期卡片不能继续作为可点击对象。"],["放进同一个例子","路线卡片展示三条路线时，“第三条”必须关联当前卡片的第三项，而不是旧卡片里同位置的元素。"],["异常与交接","框架有单页词表容量与动态更新约定，具体版本需核对；它不直接证明所有业务页面均已接入。"],["产品要问清","谁注册、谁更新、谁清理旧词表？页面切换后多久旧 ID 失效？"]],"learn":["visible-ui"],"refs":"B,S05,S08","detail":"维护文本/语音指令到元素 ID 的映射，页面更新及时失效旧对象。词表容量与更新策略按具体版本验收。","oldId":"U4","layout":{"title":["④ 指令与元素 ID"],"body":["页面方维护文本—控件映射","页面变化立即更新，旧 ID 失效"],"detail":["维护文本/语音指令到元素 ID 的映射，页面更新及时失效旧对","象。词表容量与更新策略按具体版本验收。"],"height":319}},{"id":"U5","group":"visible-ui","x":12490,"y":10491,"w":760,"h":390,"title":"⑤ 本轮语音识别","body":["免唤醒纯离线；唤醒端云并行","动态词表增强，非再做一次 ASR"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","使用当前轮 ASR 与相应唤醒策略做页面识别，不需要用户再说一遍。是否由本地链消费本轮输入必须有记录。"],["原有职责细节","免唤醒纯离线；唤醒端云并行；动态词表增强，非再做一次 ASR"],["这一步怎么做","框架区分免唤醒离线识别与唤醒后的在线/离线策略，并有精确、模糊和局部匹配。识别到多个候选元素时，由注册方消歧；不能让 ASR 擅自选择业务目标。"],["放进同一个例子","同页多个“确认”按钮，需要位置或业务上下文消歧；只识别出“确认”这两个字，不能证明已经选对了路线确认。"],["异常与交接","词表、匹配规则与优先级按真实版本检查。框架文档里的能力阈值不是每种车型都已实测达标。"],["产品要问清","误识别、匹配错、元素过期、消歧错，能否分别找到日志与责任边界？"]],"learn":["visible-ui"],"refs":"B,S05,S08","detail":"使用当前轮 ASR 与相应唤醒策略做页面识别，不需要用户再说一遍。是否由本地链消费本轮输入必须有记录。","oldId":"U5","layout":{"title":["⑤ 本轮语音识别"],"body":["免唤醒纯离线；唤醒端云并行","动态词表增强，非再做一次 ASR"],"detail":["使用当前轮 ASR 与相应唤醒策略做页面识别，不需要用户再说","一遍。是否由本地链消费本轮输入必须有记录。"],"height":319}},{"id":"U6","group":"visible-ui","x":13330,"y":10491,"w":760,"h":390,"title":"⑥ 指令匹配","body":["字节语音：精确/模糊/局部","返回匹配指令及元素 ID"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","按框架能力做精确、模糊或局部匹配。未命中则继续普通请求；命中还要确认对应控件仍有效。"],["原有职责细节","字节语音：精确/模糊/局部；返回匹配指令及元素 ID"],["这一步怎么做","框架区分免唤醒离线识别与唤醒后的在线/离线策略，并有精确、模糊和局部匹配。识别到多个候选元素时，由注册方消歧；不能让 ASR 擅自选择业务目标。"],["放进同一个例子","同页多个“确认”按钮，需要位置或业务上下文消歧；只识别出“确认”这两个字，不能证明已经选对了路线确认。"],["异常与交接","词表、匹配规则与优先级按真实版本检查。框架文档里的能力阈值不是每种车型都已实测达标。"],["产品要问清","误识别、匹配错、元素过期、消歧错，能否分别找到日志与责任边界？"]],"learn":["visible-ui"],"refs":"B,S05,S08","detail":"按框架能力做精确、模糊或局部匹配。未命中则继续普通请求；命中还要确认对应控件仍有效。","oldId":"U6","layout":{"title":["⑥ 指令匹配"],"body":["字节语音：精确/模糊/局部","返回匹配指令及元素 ID"],"detail":["按框架能力做精确、模糊或局部匹配。未命中则继续普通请求；","命中还要确认对应控件仍有效。"],"height":319}},{"id":"U7","group":"visible-ui","x":13330,"y":11019,"w":760,"h":390,"title":"⑦ 注册方消歧","body":["同名按钮用位置/上下文区分","无法唯一确定时不盲点"],"role":"decision","tone":"green","future":false,"kind":"decision","paras":[["这个小模块做什么","同名、多候选或对象歧义交注册方消歧。不能唯一确定时询问或不执行，不任意点击。"],["原有职责细节","同名按钮用位置/上下文区分；无法唯一确定时不盲点"],["这一步怎么做","框架区分免唤醒离线识别与唤醒后的在线/离线策略，并有精确、模糊和局部匹配。识别到多个候选元素时，由注册方消歧；不能让 ASR 擅自选择业务目标。"],["放进同一个例子","同页多个“确认”按钮，需要位置或业务上下文消歧；只识别出“确认”这两个字，不能证明已经选对了路线确认。"],["异常与交接","词表、匹配规则与优先级按真实版本检查。框架文档里的能力阈值不是每种车型都已实测达标。"],["产品要问清","误识别、匹配错、元素过期、消歧错，能否分别找到日志与责任边界？"]],"learn":["visible-ui"]," const D=JSON.parse(document.querySelector('#data').textContent),stage=document.querySelector('#stage'),svg=stage.querySelector(':scope > svg'),ins=document.querySelector('#insContent');
const N=new Map(D.nodes.map(n=>[n.id,n])),G=new Map(D.groups.map(g=>[g.id,g]));const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view={x:0,y:0,w:D.width,h:D.height},selected='V1',mode='explain',caseId='full',stepIndex=0,notes={},hits=[],hitIndex=0;const storeKey='doubao-business-v13-notes';try{notes=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(notes))}catch{toast('浏览器未能保存，请及时导出总结。')}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2800)}
function size(){return {w:Math.max(stage.clientWidth,400),h:Math.max(stage.clientHeight,400)}}
function setView(v){view={...v};svg.setAttribute('viewBox',[view.x,view.y,view.w,view.h].join(' '));$('#zoomValue').textContent=Math.round(size().w/view.w*100)+'%';const r=$('#mapView');if(r){r.setAttribute('x',view.x);r.setAttribute('y',view.y);r.setAttribute('width',view.w);r.setAttribute('height',view.h)}}
function fit(r,pad=35){const s=size(),a=s.w/s.h,cx=r.x+r.w/2,cy=r.y+r.h/2;let w=r.w+pad*2,h=r.h+pad*2;if(w/h>a)h=w/a;else w=h*a;setView({x:cx-w/2,y:cy-h/2,w,h})}
function zoom(f,x=.5,y=.5){let w=view.w*f,h=view.h*f;if(size().w/w<.018||size().w/w>2.5)return;setView({x:view.x+(view.w-w)*x,y:view.y+(view.h-h)*y,w,h})}
function pathsFor(id){const n=N.get(id),gid=n?.group;const relevant=D.edges.filter(e=>e.from===id||e.to===id);if(n?.kind!=='module')relevant.push(...D.edges.filter(e=>(e.from==='H-'+gid||e.to==='H-'+gid)&&e.kind!=='inside'));return [...new Map(relevant.map(e=>[e.id,e])).values()]}
function highlight(id){svg.querySelectorAll('.picked').forEach(e=>e.classList.remove('picked'));svg.querySelector('[data-node-id="'+id+'"]')?.classList.add('picked');const rel=new Set(pathsFor(id).map(e=>e.id));svg.querySelectorAll('[data-edge-id]').forEach(e=>{e.classList.toggle('connected',rel.has(e.dataset.edgeId));e.classList.toggle('muted',!rel.has(e.dataset.edgeId))})}
function caseNodes(){return D.cases.find(c=>c.id===caseId).nodes}
function bar(){const ids=caseNodes(),n=N.get(selected),idx=ids.indexOf(selected);if(idx>=0)stepIndex=idx;$('#counter').textContent=idx>=0?'第 '+(stepIndex+1)+' / '+ids.length+' 框 · 阅读顺序，不是线上执行日志':'当前定位 · 可返回主线继续';$('#currentTitle').textContent=n?.title||'';$('#previous').disabled=stepIndex<=0;$('#next').disabled=stepIndex>=ids.length-1;$('.stage-nav').querySelectorAll('[data-module]').forEach(b=>b.classList.toggle('active',b.dataset.module===n?.group));}
function focusNode(id,move=true){if(!N.has(id))return;selected=id;highlight(id);bar();renderPanel();if(move){const n=N.get(id);if(n.kind==='learning')fit({x:n.x,y:n.y,w:n.w,h:1300});else fit(n,85)}history.replaceState(null,'','#'+encodeURIComponent(id))}
function linkEdges(es){return '<div class="connections">'+es.map(e=>'<button data-edge="'+e.id+'"><small>'+esc(e.id+' · '+(e.kind==='expand'?'展开关系':'连接方向'))+'</small>'+esc(N.get(e.from)?.title)+' → '+esc(N.get(e.to)?.title)+'<small>'+esc(e.description||e.label||'沿箭头进入下一步')+'</small></button>').join('')+'</div>'}
function qHTML(k,qs){return qs.map((q,i)=>{const key=k+'-'+i;return '<div class="question"><label><input type="checkbox" data-note="'+key+'-done" '+(notes[key+'-done']?'checked':'')+'><span>'+esc(q)+'</span></label><textarea data-note="'+key+'" placeholder="写下我的解释、真实 Trace、责任边界或待确认项…">'+esc(notes[key]||'')+'</textarea></div>'}).join('')}
function metricHTML(ms){return ms.map(m=>'<section class="metric"><strong>'+esc(m.name)+'</strong><dl>'+[['分子',m.numerator],['分母',m.denominator],['怎么测',m.measure],['怎样分层',m.slice]].map(([k,v])=>'<dt>'+k+'</dt><dd>'+esc(v)+'</dd>').join('')+'</dl></section>').join('')}
function renderPanel(){const n=N.get(selected),g=G.get(n.group);$('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===mode));let h='<span class="badge">'+esc(g?.title||'业务链路')+'</span><h2>'+esc(n.title)+'</h2>';
 if(mode==='explain'){h+='<p class="muted-text">'+(n.future?'旧 Goal / 新 Task 或长期规划分区：按车型和版本选择，不代表全部同时上线。':'业务解释基于资料；部署、门禁实现与运行指标仍需目标版本验证。')+'</p>';h+=(n.paras.length?n.paras:[['模块说明',n.body.join('。')]]).map(([l,t])=>'<p><span class="label">'+esc(l)+'</span>'+esc(t)+'</p>').join('');h+='<h3>这条线从哪里来、到哪里去</h3>'+linkEdges(pathsFor(selected));h+='<h3>这个框的个人笔记</h3><textarea class="note" data-note="node-'+n.id+'" placeholder="我懂了什么，还缺哪份接口、哪个失败日志？">'+esc(notes['node-'+n.id]||'')+'</textarea><div class="summary-actions"><button id="exportNotes">导出总结</button><button id="sources">来源与边界</button></div>'}
 if(mode==='connections'){h+='<p>点击一条连接，会单独高亮它；再点击起点或终点跳过去。全部在同一张图上。分区内沿箭头阅读；跨区编号在起终点成对出现。交叉但无节点的线，不表示连接。</p>'+linkEdges(pathsFor(selected));h+='<h3>主链和分支</h3>'+linkEdges(D.edges.filter(e=>['main','flow','return'].includes(e.kind)&&!/^\w+-\d+$/.test(e.id)))}
 if(mode==='learn'){let ks=n.learn?.length?n.learn:g?.learn||[];h+='<p class="muted-text">建议自测与指标口径，不是团队已达到的成绩。复盘应区分路由、上下文、工具定义、推理、执行和反馈问题。</p>';for(const k of [...new Set(ks)]){const l=D.learning[k];if(!l)continue;h+='<h3>掌握程度</h3><div class="callout">'+esc(l.depth)+'</div><p>'+esc(l.why)+'</p><h3>用问题检验自己</h3>'+qHTML(k,l.questions)+'<h3>怎样量化验收</h3>'+metricHTML(l.metrics)}h+='<div class="summary-actions"><button id="allLearning">完整自测目录</button><button id="exportNotes">导出总结</button></div>'}
 ins.innerHTML=h;bindPanel();ins.parentElement.scrollTop=0;}
function bindPanel(){ins.querySelectorAll('[data-edge]').forEach(b=>b.onclick=()=>selectEdge(b.dataset.edge));ins.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>focusNode(b.dataset.jump));ins.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{notes[e.dataset.note]=e.type==='checkbox'?e.checked:e.value;save()});$('#exportNotes')?.addEventListener('click',exportNotes);$('#sources')?.addEventListener('click',showSources);$('#allLearning')?.addEventListener('click',showLearning);}
function openPanel(){document.body.classList.remove('no-panel');$('#togglePanel').textContent='收起说明'}
function selectEdge(id){const e=D.edges.find(e=>e.id===id);if(!e)return;svg.querySelectorAll('[data-edge-id]').forEach(el=>{el.classList.toggle('connected',el.dataset.edgeId===id);el.classList.toggle('muted',el.dataset.edgeId!==id)});const xs=e.points.map(p=>p[0]),ys=e.points.map(p=>p[1]);fit({x:Math.min(...xs)-60,y:Math.min(...ys)-100,w:Math.max(...xs)-Math.min(...xs)+120,h:Math.max(...ys)-Math.min(...ys)+200},50);openPanel();ins.innerHTML='<span class="badge">连接 '+esc(id)+'</span><h2>这根线怎么走</h2><p><span class="label">从</span>'+esc(N.get(e.from).title)+'</p><p><span class="label">到</span>'+esc(N.get(e.to).title)+'</p><div class="callout">'+esc(e.description||e.label||'模块内部的下一处理步骤。')+'</div><div class="connections"><button data-jump="'+e.from+'">回起点：'+esc(N.get(e.from).title)+'</button><button data-jump="'+e.to+'">去终点：'+esc(N.get(e.to).title)+'</button></div><p class="muted-text">虚线仅表示机制展开或工具目录，不等于新加了一次运行步骤。</p>';bindPanel()}
function showSources(){openPanel();ins.innerHTML='<h2>这张图依据哪些资料</h2><p>三份主资料的正文及原生画板、补充技术方案和两份已完整读取的会议逐字稿共同用于重画。旧版工具、Task、VLM 和页面语音契约沿用已核对内容；没有运行证据的事项不标成上线事实。</p>'+D.sources.map(s=>'<div class="source"><a href="'+esc(s.url)+'" target="_blank" rel="noreferrer">'+esc(s.title)+'</a><p>'+esc(s.status)+'</p></div>').join('')+'<p>固定工具为本地 SP 中 27 项定义快照。动态工具候选、每轮注入、车型可调用数量及原子能力数，不能混成同一个数。具体模型、SDK、状态码和实测性能仍以目标版本为准。</p><button id="back">返回流程图</button>';$('#back').onclick=renderPanel}
function showTools(){openPanel();ins.innerHTML='<h2>27 项工具：先选，再逐项读机制</h2><p>这是 SP 定义快照。一个工具可能覆盖很多原子能力；工具数不是模型能力成绩。</p>'+D.toolFamilies.map(f=>'<h3>'+esc(f.title)+'</h3><div class="tool-list">'+f.tools.map(t=>'<button data-jump="T'+t.n+'">'+t.n+'. '+esc(t.cn)+'<small>'+esc(t.name)+'</small></button>').join('')+'</div>').join('');bindPanel();fit(G.get('family-0'),80)}
function showLearning(){openPanel();ins.innerHTML='<h2>需要全部深入，才考虑走吗？</h2><p>不需要平均钻研所有底层实现。你应优先证明：能追完真实目标，定位主责模块的错误，设计一次改进并用指标验收。相邻模块要懂契约、状态和故障归属。</p><div class="callout">AI 能力是核心，但产品上的 AI 能力包括：理解与规划、正确上下文、可执行工具、反馈纠错。不能只用“有自己的模型”或“工具很多”替代端到端成绩。</div><h3>可操作的自测，不是离职硬门槛</h3>'+qHTML('readiness',['独立复盘 10 条完整 Trace，覆盖快路、复杂多目标、记忆依赖、条件任务、持续观察、视觉、主动建议、取消、失败恢复和离线。','拿 5 个跨模块 badcase，指出最早出错点，提供证据并排除其他根因。','完成 1 次有基线、保留测试集、对照实验、回归与上线后跟踪的 Planner 或触发器改进。','对自己场景里的重点工具，能解释输入、内部步骤、前置条件、实际副作用、反馈关联和超时恢复。','在评审中能够提出具体场景、风险证据、责任方与验收口径，而不是只问技术术语。'])+'<h3>新增链路验收口径</h3>'+D.newMetrics.map(m=>'<section class="metric"><strong>'+esc(m[0])+'</strong><p>'+esc(m[1])+'</p><p>'+esc(m[2])+'</p></section>').join('')+'<h3>按模块展开完整问题与指标</h3><div class="tool-list">'+Object.entries(D.learning).map(([k,l])=>'<button data-learning="'+k+'">'+esc(k)+'<small>'+esc(l.depth)+'</small></button>').join('')+'</div><button id="exportNotes">导出总结</button>';bindPanel();ins.querySelectorAll('[data-learning]').forEach(b=>b.onclick=()=>{const k=b.dataset.learning,l=D.learning[k];ins.innerHTML='<h2>'+esc(k)+' · 自测与指标</h2><div class="callout">'+esc(l.depth)+'</div><p>'+esc(l.why)+'</p>'+qHTML(k,l.questions)+metricHTML(l.metrics)+'<button id="allLearning">返回目录</button><button id="exportNotes">导出总结</button>';bindPanel()})}
function exportNotes(){const out=['# 豆包汽车业务链路 · 我的总结','',new Date().toLocaleString(),''];for(const [k,l] of Object.entries(D.learning)){out.push('## '+k,'',l.depth,'');l.questions.forEach((q,i)=>{out.push('- ['+(notes[k+'-'+i+'-done']?'x':' ')+'] '+q);if(notes[k+'-'+i])out.push('  '+notes[k+'-'+i])});out.push('')}for(const [k,v] of Object.entries(notes))if(k.startsWith('node-')&&v)out.push('## '+(N.get(k.slice(5))?.title||k),'',String(v),'');out.push('## 笔记原始数据','',JSON.stringify(notes,null,2));const blob=new Blob([out.join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='业务链路学习总结-v13.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),600)}
$('#previous').onclick=()=>{stepIndex=Math.max(0,stepIndex-1);focusNode(caseNodes()[stepIndex])};$('#next').onclick=()=>{stepIndex=Math.min(caseNodes().length-1,stepIndex+1);focusNode(caseNodes()[stepIndex])};
$('#caseSelect').onchange=e=>{caseId=e.target.value;stepIndex=0;focusNode(caseNodes()[0])};
$('.stage-nav').innerHTML=D.main.map((k,i)=>{const g=G.get(k),names=['语音输入','拒识与分流','交互准入','真实上下文','Planner 决策','工具与反馈','真实执行','表达与回流'];g.navTitle=names[i];return(i?'<span class="nav-arrow">→</span>':'')+'<button data-module="'+k+'">'+String(i+1).padStart(2,'0')+' '+esc(g.navTitle||g.title)+'</button>'}).join('');$('.stage-nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=D.nodes.find(n=>n.group===b.dataset.module&&n.kind==='step');focusNode(n.id,false);focusGroup(b.dataset.module)});
$('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{mode=b.dataset.tab;renderPanel()});
$('#start').onclick=()=>{caseId='full';$('#caseSelect').value='full';stepIndex=0;focusNode('V1',false);focusGroup('voice')};$('#overview').onclick=()=>{svg.querySelectorAll('.muted,.connected').forEach(e=>e.classList.remove('muted','connected'));const gs=D.groups.filter(g=>D.main.includes(g.id));fit({x:gs[0].x,y:gs[0].y-60,w:gs.at(-1).x+gs.at(-1).w-gs[0].x,h:Math.max(...gs.map(g=>g.h))+120},20);toast('主链同一行由左到右。选上方模块名可看连续小框。')};$('#all').onclick=()=>{svg.querySelectorAll('.muted,.connected').forEach(e=>e.classList.remove('muted','connected'));fit({x:0,y:0,w:D.width,h:D.height},0)};$('#tools').onclick=showTools;$('#learn').onclick=showLearning;$('#sourceBtn').onclick=showSources;
$('#togglePanel').onclick=()=>{document.body.classList.toggle('no-panel');$('#togglePanel').textContent=document.body.classList.contains('no-panel')?'展开说明':'收起说明';requestAnimationFrame(()=>focusNode(selected))};$('#closePanel').onclick=()=>{$('#togglePanel').click()};
$('#minus').onclick=()=>zoom(1.22);$('#plus').onclick=()=>zoom(.82);$('#fitCurrent').onclick=()=>focusNode(selected);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(Math.exp(e.deltaY*.0012),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,v:{...view},node:e.target.dataset.nodeId,edge:e.target.dataset.edgeId,moved:false};svg.setPointerCapture?.(e.pointerId);svg.classList.add('dragging')});svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;setView({...drag.v,x:drag.v.x-dx*drag.v.w/size().w,y:drag.v.y-dy*drag.v.h/size().h})});svg.addEventListener('pointerup',()=>{if(drag&&!drag.moved){if(drag.edge)selectEdge(drag.edge);else if(drag.node)focusNode(drag.node,false)}drag=null;svg.classList.remove('dragging')});svg.addEventListener('dblclick',e=>{if(e.target.dataset.nodeId)focusNode(e.target.dataset.nodeId)});
$('#map').innerHTML='<svg viewBox="0 0 '+D.width+' '+D.height+'">'+D.groups.map(g=>'<rect x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+'" fill="#e6edf6" stroke="#a2b5c8" stroke-width="14"/>').join('')+'<rect id="mapView" fill="none" stroke="#185db7" stroke-width="45"/></svg>';
$('#map').onclick=e=>{const r=$('#map').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*D.width,y=(e.clientY-r.top)/r.height*D.height;setView({...view,x:x-view.w/2,y:y-view.h/2})};
function search(){const q=$('#search').value.trim().toLowerCase();if(!q)return;if(!hits.length){hits=D.nodes.filter(n=>(n.title+' '+n.body.join(' ')).toLowerCase().includes(q));hitIndex=0}if(!hits.length){toast('没有匹配。试试中文功能名、工具名或“回调”“车况”。');return}focusNode(hits[hitIndex%hits.length].id);hitIndex++;$('#find').textContent=((hitIndex-1)%hits.length+1)+' / '+hits.length}
$('#search').oninput=()=>{hits=[];$('#find').textContent='查找'};$('#search').onkeydown=e=>{if(e.key==='Enter')search()};$('#find').onclick=search;window.addEventListener('resize',()=>{const n=N.get(selected);if(n)fit(n,85)});
if(window.innerWidth<=900){document.body.classList.add('no-panel');$('#togglePanel').textContent='展开说明'}
function focusGroup(id,whole=false){const g=G.get(id);if(!g)return;const ns=D.nodes.filter(n=>n.group===id);const rows=ns.slice(0,Math.min(4,ns.length));fit(whole?g:{x:g.x+35,y:g.y+205,w:g.w-70,h:Math.max(...rows.map(n=>n.y+n.h))-g.y-180},45);$('#groupSelect').value=id;}
$('#groupSelect').innerHTML='<option value="">定位完整业务分区…</option>'+D.groups.map(g=>'<option value="'+g.id+'">'+esc(g.title)+'</option>').join('');$('#groupSelect').onchange=e=>{const n=D.nodes.find(n=>n.group===e.target.value);if(n){focusNode(n.id,false);focusGroup(e.target.value)}};$('#fitGroup').onclick=()=>focusGroup(N.get(selected).group,true);$('#nearby').onclick=()=>focusGroup(N.get(selected).group);
document.body.classList.add('no-panel');$('#togglePanel').textContent='展开详细说明';
requestAnimationFrame(()=>{const id=decodeURIComponent(location.hash.slice(1));if(N.has(id))focusNode(id);else{focusNode('V1',false);focusGroup('voice')}});
window.flowState={data:D,focusNode,focusGroup,selectEdge,showTools,showLearning,showSources,getView:()=>view,getSelected:()=>selected,notes};
</script></body></html>
