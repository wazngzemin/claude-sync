<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1350" viewBox="0 0 1000 1350" role="img" aria-label="人人对话补齐的是背景，当前请求仍单独办理"><title>人人对话补齐的是背景，当前请求仍单独办理</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="48" font-size="26" fill="#18364c" font-weight="650" text-anchor="start">人人对话补齐的是背景，当前请求仍单独办理</text><text x="40" y="82" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">11 月 4 日评审方案：区分信息送达、进入本轮背景，以及后台记忆整理。</text><rect x="50" y="120" width="410" height="140" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="68" y="152" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">主驾对豆包：“附近找个评分高的”</text><text x="68" y="183" font-size="17" fill="#244358" font-weight="400" text-anchor="start">这次希望助手办理的有效请求</text><text x="68" y="210" font-size="17" fill="#244358" font-weight="400" text-anchor="start">文字已经定稿，保留音区与输入归属</text><text x="68" y="237" font-size="17" fill="#244358" font-weight="400" text-anchor="start">实时进入业务处理</text><rect x="540" y="120" width="410" height="140" rx="8" fill="#fff8eb" stroke="#d8bf8d"/><text x="558" y="152" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">副驾先对主驾：“想吃火锅”</text><text x="558" y="183" font-size="17" fill="#244358" font-weight="400" text-anchor="start">这是乘客之间的谈话</text><text x="558" y="210" font-size="17" fill="#244358" font-weight="400" text-anchor="start">先判断交互对象与适用权限</text><text x="558" y="237" font-size="17" fill="#244358" font-weight="400" text-anchor="start">这句话本身不要求豆包搜索</text><rect x="50" y="370" width="410" height="130" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="68" y="402" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">这次需求带到云端</text><text x="68" y="433" font-size="17" fill="#244358" font-weight="400" text-anchor="start">当前已知：想找附近、评分高的</text><text x="68" y="460" font-size="17" fill="#244358" font-weight="400" text-anchor="start">仍缺少：想找哪类东西</text><text x="68" y="487" font-size="17" fill="#244358" font-weight="400" text-anchor="start">需要读取允许使用的相关背景</text><rect x="540" y="370" width="410" height="130" rx="8" fill="#fff8eb" stroke="#d8bf8d"/><text x="558" y="402" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">按状态补齐背景信息</text><text x="558" y="433" font-size="17" fill="#244358" font-weight="400" text-anchor="start">激活态实时；降级态按数量/静默条件</text><text x="558" y="460" font-size="17" fill="#244358" font-weight="400" text-anchor="start">有效 Query 到来时补齐未上传部分</text><text x="558" y="487" font-size="17" fill="#244358" font-weight="400" text-anchor="start">断网后恢复：补报并按发生时间组织</text><path d="M255 260 L255 370" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="270" y="320" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">有效请求</text><path d="M745 260 L745 370" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760" y="320" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">允许使用的谈话</text><rect x="50" y="650" width="410" height="155" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="68" y="682" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">Context · 组织本轮背景</text><text x="68" y="713" font-size="17" fill="#244358" font-weight="400" text-anchor="start">把当前请求与相关近期输入放在一起</text><text x="68" y="740" font-size="17" fill="#244358" font-weight="400" text-anchor="start">“附近”＋“评分高”＋此前“火锅”</text><text x="68" y="767" font-size="17" fill="#244358" font-weight="400" text-anchor="start">身份、时间与归属决定是否适用</text><text x="68" y="794" font-size="17" fill="#244358" font-weight="400" text-anchor="start">仅已送达且本轮能取得的信息可使用</text><rect x="540" y="650" width="410" height="155" rx="8" fill="#f2f7fc" stroke="#a6bfd7"/><text x="558" y="682" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">近期输入与事件记录</text><text x="558" y="713" font-size="17" fill="#244358" font-weight="400" text-anchor="start">记录谈话内容、说话位置与发生时间</text><text x="558" y="740" font-size="17" fill="#244358" font-weight="400" text-anchor="start">车端上云与云端写事件是两个边界</text><text x="558" y="767" font-size="17" fill="#244358" font-weight="400" text-anchor="start">接收成功后，才能继续组织与消费</text><text x="558" y="794" font-size="17" fill="#244358" font-weight="400" text-anchor="start">进入本轮还要看窗口和取用规则</text><path d="M255 500 L255 650" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="60" y="580" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">当前请求与已有背景</text><path d="M745 500 L745 650" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="580" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">文本 → 适用事件记录</text><path d="M540 728 L460 728" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="472" y="714" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">取用</text><rect x="50" y="930" width="410" height="130" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="68" y="962" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">DT · 结合背景决定下一步</text><text x="68" y="993" font-size="17" fill="#244358" font-weight="400" text-anchor="start">本例可进一步查附近的火锅店</text><text x="68" y="1020" font-size="17" fill="#244358" font-weight="400" text-anchor="start">背景有歧义时先问清</text><text x="68" y="1047" font-size="17" fill="#244358" font-weight="400" text-anchor="start">工具结果回来后继续判断</text><rect x="540" y="930" width="410" height="150" rx="8" fill="#f5f6f7" stroke="#b7c1ca"/><text x="558" y="962" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">后台整理，按各自规则运行</text><text x="558" y="993" font-size="17" fill="#244358" font-weight="400" text-anchor="start">摘要：压缩较早输入，延续前文</text><text x="558" y="1020" font-size="17" fill="#244358" font-weight="400" text-anchor="start">情景：当天总结、按天合并经历</text><text x="558" y="1047" font-size="17" fill="#244358" font-weight="400" text-anchor="start">语义：归纳有依据的个人事实与偏好</text><text x="558" y="1074" font-size="17" fill="#244358" font-weight="400" text-anchor="start">当前请求不等待这些环节全部完成</text><path d="M255 805 L255 930" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="60" y="870" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">本轮实际可用的背景</text><path d="M745 805 L745 930" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="580" y="870" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">原始输入用于后续整理</text><rect x="50" y="1160" width="410" height="140" rx="8" fill="#edf8f4" stroke="#95c4b4"/><text x="68" y="1192" font-size="20" fill="#203c51" font-weight="600" text-anchor="start">已经保存且可取得的记忆</text><text x="68" y="1223" font-size="17" fill="#244358" font-weight="400" text-anchor="start">当前背景不足时，DT 按需检索</text><text x="68" y="1250" font-size="17" fill="#244358" font-weight="400" text-anchor="start">查到具体事实后再决定下一步</text><text x="68" y="1277" font-size="17" fill="#244358" font-weight="400" text-anchor="start">未生成、未命中或有歧义，就保留缺口</text><path d="M255 1060 L255 1160" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="6 5"/><text x="275" y="1120" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">查询 / 反馈</text><path d="M745 1080 L745 1230 L460 1230" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="560" y="1215" font-size="16" fill="#476c8d" font-weight="400" text-anchor="start">生成后供后续使用</text><text x="540" y="1280" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">实线：本例的信息交接</text><text x="540" y="1307" font-size="17" fill="#5c7080" font-weight="400" text-anchor="start">虚线：后台整理或按需记忆查询</text></g></svg>