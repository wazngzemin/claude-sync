02,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="495" y="949" width="175" height="44" rx="3" fill="#fff"/><text x="500" y="973" font-size="15" fill="#435c70" font-weight="400"><tspan x="500" dy="0">非拒识云端结果进入采信</tspan></text><path d="M765,1480 L765,1518 L1222,1518 L1222,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1110" y="1576" width="115" height="44" rx="3" fill="#fff"/><text x="1115" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="1115" dy="0">云端异常或超时</tspan></text><path d="M667,1480 L667,1654 L827,1654 L827,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="450" y="1576" width="220" height="44" rx="3" fill="#fff"/><text x="455" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="455" dy="0">云端判定需要 Planner</tspan></text><path d="M1127,1062 L1127,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="940" y="1158" width="190" height="44" rx="3" fill="#fff"/><text x="945" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="945" dy="0">命中白名单并采用本地结果</tspan></text><path d="M570,1480 L570,1518 L367,1518 L367,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="135" y="1576" width="235" height="44" rx="3" fill="#fff"/><text x="140" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="140" dy="0">采用云端规则 / 简单意图结果</tspan></text><path d="M537,644 L537,682 L235,682 L235,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">云端拒识</tspan></text><a href="#module/R/step/R01"><g data-step="R01"><rect x="867" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="867" y="44" width="5" height="182" rx="2" fill="#326785"/><tex