  <script>
  (()=>{
    'use strict';
    const W=16600,H=9300,NS='http://www.w3.org/2000/svg';
    const stageLayer=document.getElementById('stageLayer'),edgeLayer=document.getElementById('edgeLayer'),nodeLayer=document.getElementById('nodeLayer'),labelLayer=document.getElementById('labelLayer'),overlayLayer=document.getElementById('overlayLayer');
    const S=(tag,attrs={},text=null)=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));if(text!==null)e.textContent=text;return e};
    const add=(p,e)=>{p.appendChild(e);return e};
    const text=(p,x,y,s,cls,anchor)=>add(p,S('text',{x,y,class:cls,...(anchor?{'text-anchor':anchor}:{})},s));
    const stages=[],modules=[],nodes=[],edges=[],nodeMap=new Map(),moduleMap=new Map();
    const statusLabel={current:'当前SP',confirmed:'正式资料',trace:'需Trace',history:'历史目标',wip:'WIP',risk:'风险'};
    function stage(o){stages.push(o);const g=add(stageLayer,S('g',{'data-stage-id':o.id}));add(g,S('rect',{x:o.x,y:o.y,width:o.w,height:o.h,rx:22,class:`stage ${o.kind||''}`}));text(g,o.x+28,o.y+42,o.title,'stage-title');if(o.sub)text(g,o.x+28,o.y+70,o.sub,'stage-sub');if(o.note)text(g,o.x+o.w-28,o.y+42,o.note,'stage-note','end')}
    function lane(o){const g=add(stageLayer,S('g',{'data-lane-id':o.id}));add(g,S('rect',{x:o.x,y:o.y,width:o.w,height:o.h,rx:18,class:`lane ${o.kind}`}));add(g,S('rect',{x:o.x+18,y:o.y+18,width:36,height:26,rx:7,fill:'#172033'}));text(g,o.x+36,o.y+37,o.num,'lane-num','middle');text(g,o.x+68,o.y+37,o.title,'lane-title');text(g,o.x+24,o.y+65,o.sub,'lane-sub')}
    function badge(g,x,y,status){const label=statusLabel[status]||status,w=Math.max(62,label.length*13+20);add(g,S('rect',{x:x-w,y,width:w,height:24,rx:12,class:`status status-${status}`}));text(g,x-w/2,y+17,label,`status-text ${status}`,'middle');return w}
    function module(o){modules.push(o);moduleMap.set(o.id,o);const g=add(nodeLayer,S('g',{'data-module-id':o.id,'data-stage':o.stage||'main','data-status':o.status||'confirmed'}));add(g,S('rect',{x:o.x+6,y:o.y+7,width:o.w,height:o.h,rx:14,class:'node-shadow'}));add(g,S('rect',{x:o.x,y:o.y,width:o.w,height:o.h,rx:14,class:`module ${o.type}`}));add(g,S('path',{d:`M${o.x+14} ${o.y}H${o.x+o.w-14}Q${o.x+o.w} ${o.y} ${o.x+o.w} ${o.y+14}V${o.y+86}H${o.x}V${o.y+14}Q${o.x} ${o.y} ${o.x+14} ${o.y}Z`,class:`module-head ${o.type}`}));text(g,o.x+20,o.y+34,o.step,'module-meta');text(g,o.x+20,o.y+65,o.title,'module-title');if(o.meta)text(g,o.x+o.w-20,o.y+35,o.meta,'module-meta','end');badge(g,o.x+o.w-18,o.y+50,o.status||'confirmed');if(o.foot)text(g,o.x+18,o.y+o.h-16,o.foot,'module-foot')}
    function node(o){if(nodeMap.has(o.id))throw new Error(`duplicate node id: ${o.id}`);nodes.push(o);nodeMap.set(o.id,o)}
    function renderNode(o){const g=add(nodeLayer,S('g',{'data-node-id':o.id,'data-stage':o.stage||'','data-kind':o.type||'neutral','data-status':o.status||'confirmed','data-current-tool':o.currentTool?'true':'false'}));add(g,S('rect',{x:o.x+4,y:o.y+5,width:o.w,height:o.h,rx:o.rx||10,class:'node-shadow'}));add(g,S('rect',{x:o.x,y:o.y,width:o.w,height:o.h,rx:o.rx||10,class:`node ${o.type||'neutral'}`}));const sw=Math.max(42,Math.min(70,String(o.step||'').length*8+18));if(o.step){add(g,S('rect',{x:o.x+12,y:o.y+11,width:sw,height:22,rx:6,class:'node-step'}));text(g,o.x+12+sw/2,o.y+27,o.step,'node-step-text','middle')}if(o.status)badge(g,o.x+o.w-12,o.y+10,o.status);text(g,o.x+14,o.y+58,o.title,`node-title${o.code?' code':''}`);let yy=o.y+82;if(o.meta){text(g,o.x+14,yy,o.meta,'node-meta');yy+=24}(o.lines||[]).forEach(v=>{text(g,o.x+14,yy,v,'node-line');yy+=22});if(o.foot)text(g,o.x+14,o.y+o.h-12,o.foot,'node-foot')}
    function mini(o){if(nodeMap.has(o.id))throw new Error(`duplicate node id: ${o.id}`);nodes.push({...o,mini:true});nodeMap.set(o.id,{...o,mini:true});const g=add(nodeLayer,S('g',{'data-node-id':o.id,'data-stage':o.stage||'','data-kind':o.type||'neutral','data-status':o.status||'confirmed'}));add(g,S('rect',{x:o.x,y:o.y,width:o.w,height:o.h,rx:9,class:`mini ${o.type||'neutral'}`}));text(g,o.x+o.w/2,o.y+o.h/2-(o.sub?6:-5),o.title,'mini-title','middle');if(o.sub)text(g,o.x+o.w/2,o.y+o.h/2+15,o.sub,'mini-sub','middle')}
    function box(id){return nodeMap.get(id)||moduleMap.get(id)}
    function port(o,side,offset=0){if(side==='l')return[o.x,o.y+o.h/2+offset];if(side==='r')return[o.x+o.w,o.y+o.h/2+offset];if(side==='t')return[o.x+o.w/2+offset,o.y];return[o.x+o.w/2+offset,o.y+o.h]}
    function orthogonalize(pts){const out=[pts[0]];for(let i=1;i<pts.length;i++){const p=pts[i],a=out[out.length-1];if(a[0]!==p[0]&&a[1]!==p[1])out.push([p[0],a[1]]);const b=out[out.length-1];if(b[0]!==p[0]||b[1]!==p[1])out.push(p)}return out.filter((p,i)=>!i||p[0]!==out[i-1][0]||p[1]!==out[i-1][1])}
    function E(id,from,to,label='',flow='main',cfg={}){const a=box(from),b=box(to);if(!a||!b)throw new Error(`edge ${id} missing endpoint ${from}/${to}`);const A=port(a,cfg.fromSide||'r',cfg.fromOffset||0),B=port(b,cfg.toSide||'l',cfg.toOffset||0);let pts;if(cfg.via)pts=[A,...cfg.via,B];else{const mx=cfg.midX??Math.round((A[0]+B[0])/2);pts=[A,[mx,A[1]],[mx,B[1]],B]}edges.push({id,from,to,label,flow,points:orthogonalize(pts),labelPos:cfg.labelPos,bus:cfg.bus||''})}
    function R(id,from,to,points,label='',flow='main',cfg={}){edges.push({id,from,to,label,flow,points:orthogonalize(points),labelPos:cfg.labelPos,bus:cfg.bus||''})}
    const placedLabels=[];
    function rectOverlap(a,b,p=0){return a.x<b.x+b.w+p&&a.x+a.w>b.x-p&&a.y<b.y+b.h+p&&a.y+a.h>b.y-p}
    function renderEdge(e){
      let d=`M${e.points[0][0]} ${e.points[0][1]}`;
      for(let i=1;i<e.points.length;i++){const a=e.points[i-1],b=e.points[i];if(a[0]!==b[0]&&a[1]!==b[1])throw new Error(`non-orthogonal edge ${e.id}`);if(a[0]===b[0])d+=`V${b[1]}`;else d+=`H${b[0]}`}
      add(edgeLayer,S('path',{d,class:`edge ${e.flow}${e.bus?' busline':''}`,'data-edge-id':e.id,'data-from':e.from,'data-to':e.to,'data-flow':e.flow,'data-route':'orthogonal','data-bus':e.bus}));
      if(e.label){
        const w=Math.max(92,e.label.length*13+24),h=26,candidates=[];
        const seed=e.labelPos||e.points[Math.floor(e.points.length/2)];
        [[0,0],[0,-34],[0,34],[0,-70],[0,70],[-w/2-28,0],[w/2+28,0]].forEach(([dx,dy])=>candidates.push([seed[0]+dx,seed[1]+dy]));
        const segs=[];for(let i=1;i<e.points.length;i++){const a=e.points[i-1],b=e.points[i],len=Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);segs.push({a,b,len})}segs.sort((a,b)=>b.len-a.len);

    let scale=.35;
    function setZoom(next){
      const old=scale,cx=(viewport.scrollLeft+viewport.clientWidth/2)/old,cy=(viewport.scrollTop+viewport.clientHeight/2)/old;
      scale=next;const w=W*scale,h=H*scale;board.style.width=`${w}px`;board.style.height=`${h}px`;svg.style.width=`${w}px`;svg.style.height=`${h}px`;
      requestAnimationFrame(()=>viewport.scrollTo({left:Math.max(0,cx*scale-viewport.clientWidth/2),top:Math.max(0,cy*scale-viewport.clientHeight/2)}));
    }
    document.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',()=>setZoom(Number(b.dataset.zoom))));
    document.querySelector('[data-fit]').addEventListener('click',()=>{setZoom(Math.max(.055,(viewport.clientWidth-28)/W));requestAnimationFrame(()=>viewport.scrollTo({left:0,top:0}))});
    const targets={main:[0,480],context:[3800,2200],tools:[0,4020],async:[0,6150],metrics:[0,7550]};
    function jump(name){const p=targets[name];if(!p)return;viewport.scrollTo({left:p[0]*scale,top:p[1]*scale,behavior:'smooth'});history.replaceState(null,'',`#${name}`)}
    document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>jump(b.dataset.jump)));
    setZoom(.35);if(location.hash&&targets[location.hash.slice(1)])requestAnimationFrame(()=>jump(location.hash.slice(1)));
  

  })();
  </script>
</body>
</html>
