<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <rect x="0" y="0" width="1400" height="900" fill="#f8fafd"/>
  
  <!-- Title area: single line, no overlap -->
  <text x="700" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2329">N19｜自进化：从专家知识到车自己学会你的习惯</text>
  <text x="700" y="75" text-anchor="middle" font-size="15" fill="#646a73">三层知识结构 × 两条知识来源 × 自学习闭环</text>
  
  <!-- Left column: Brand knowledge -->
  <rect x="60" y="110" width="300" height="620" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="210" y="145" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">品牌通用知识</text>
  <text x="210" y="168" text-anchor="middle" font-size="13" fill="#2e7d32">赛力斯写的 know-how</text>
  <text x="210" y="188" text-anchor="middle" font-size="13" fill="#2e7d32">【当时现状】质量低</text>
  
  <!-- N19-4 card inside left column -->
  <rect x="90" y="220" width="240" height="120" rx="8" fill="#ffffff" stroke="#4caf50" stroke-width="1.5"/>
  <text x="210" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">N19-4（品牌通用专家知识）</text>
  <text x="210" y="275" text-anchor="middle" font-size="12" fill="#616161">赛力斯先写一版，按场景分四级</text>
  <text x="210" y="295" text-anchor="middle" font-size="12" fill="#616161">问题：质量低、具体case当知识</text>
  <text x="210" y="315" text-anchor="middle" font-size="11" fill="#9e9e9e">来源：9/9 讨论纪要及逐字稿</text>
  
  <!-- Right column: User self-learning -->
  <rect x="1040" y="110" width="300" height="620" rx="12" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="1190" y="145" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">用户自学习</text>
  <text x="1190" y="168" text-anchor="middle" font-size="13" fill="#1565c0">你说的偏好系统自己记</text>
  <text x="1190" y="188" text-anchor="middle" font-size="13" fill="#1565c0">【讨论中】12月专项是计划</text>
  
  <!-- N19-5 card inside right column -->
  <rect x="1070" y="220" width="240" height="120" rx="8" fill="#ffffff" stroke="#2196f3" stroke-width="1.5"/>
  <text x="1190" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">N19-5（用户自学习个性化规则）</text>
  <text x="1190" y="275" text-anchor="middle" font-size="12" fill="#616161">你说的偏好，系统沉淀下次用上</text>
  <text x="1190" y="295" text-anchor="middle" font-size="12" fill="#616161">例：不喜欢立体停车场→自动避开</text>
  <text x="1190" y="315" text-anchor="middle" font-size="11" fill="#9e9e9e">来源：9/9 讨论纪要及逐字稿</text>
  
  <!-- N19-9 card at bottom of right column -->
  <rect x="1070" y="540" width="240" height="100" rx="8" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="1190" y="570" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">N19-9（12月底专项）</text>
  <text x="1190" y="595" text-anchor="middle" font-size="12" fill="#616161">赛力斯SOP前开自学习专项</text>
  <text x="1190" y="615" text-anchor="middle" font-size="12" fill="#c62828">【计划，非已上线】</text>
  
  <!-- Middle layers: Body / Surface / Point -->
  <!-- Body knowledge (top, dashed) -->
  <rect x="410" y="130" width="580" height="170" rx="12" fill="#fff3e0" stroke="#ff9800" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="700" y="165" text-anchor="middle" font-size="19" font-weight="bold" fill="#e65100">N19-3（体状知识）【讨论中，待核】</text>
  <text x="700" y="195" text-anchor="middle" font-size="13" fill="#e65100">最高层级，会上承认"还没想清楚"</text>
  <text x="700" y="215" text-anchor="middle" font-size="13" fill="#e65100">强依赖动态 Advisor 设计</text>
  <text x="700" y="265" text-anchor="middle" font-size="11" fill="#9e9e9e">来源：9/9 讨论纪要及逐字稿</text>
  
  <!-- Surface knowledge (middle) -->
  <rect x="410" y="330" width="580" height="190" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="700" y="365" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">N19-2（面状知识）【讨论中，待核】</text>
  <text x="700" y="395" text-anchor="middle" font-size="13" fill="#2e7d32">有结构、分步骤、每个环节有评判标准</text>
  <text x="700" y="415" text-anchor="middle" font-size="13" fill="#2e7d32">例：一个自驾场景分几步、每步做到什么程度算好</text>
  <text x="700" y="435" text-anchor="middle" font-size="13" fill="#2e7d32">比点状更稳定，但写出来需要非常资深的人</text>
  <text x="700" y="490" text-anchor="middle" font-size="11" fill="#9e9e9e">来源：9/9 讨论纪要及逐字稿</text>
  
  <!-- Point knowledge (bottom) -->
  <rect x="410" y="550" width="580" height="190" rx="12" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="700" y="585" text-anchor="middle" font-size="19" font-weight="bold" fill="#f57f17">N19-1（点状知识）【讨论中，待核】</text>
  <text x="700" y="615" text-anchor="middle" font-size="13" fill="#f57f17">碎的、单点的经验</text>
  <text x="700" y="635" text-anchor="middle" font-size="13" fill="#f57f17">例："找停车场不要给我找立体停车场"</text>
  <text x="700" y="655" text-anchor="middle" font-size="13" fill="#f57f17">优点：快；缺点：不稳定、不能举一反三</text>
  <text x="700" y="710" text-anchor="middle" font-size="11" fill="#9e9e9e">来源：9/9 讨论纪要及逐字稿</text>
  
  <!-- Arrows: layers stacking -->
  <line x1="700" y1="300" x2="700" y2="330" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="520" x2="700" y2="550" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Closed loop: Observe -> Deposit -> Use next time -->
  <rect x="200" y="780" width="1000" height="60" rx="30" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="700" y="817" text-anchor="middle" font-size="17" font-weight="bold" fill="#7b1fa2">N19-6（自学习闭环）【讨论中】：观察到什么 → 沉淀成什么 → 下次怎么用上</text>
  
  <!-- Arrow from loop to point knowledge -->
  <line x1="700" y1="780" x2="700" y2="740" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- N19-7 Priority (small, bottom left) -->
  <rect x="80" y="780" width="100" height="60" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="1"/>
  <text x="130" y="805" text-anchor="middle" font-size="12" font-weight="bold" fill="#616161">N19-7（优先级）</text>
  <text x="130" y="825" text-anchor="middle" font-size="10" fill="#9e9e9e">【待核】</text>
  
  <!-- N19-8 Cost (small, bottom right) -->
  <rect x="1220" y="780" width="100" height="60" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="1"/>
  <text x="1270" y="805" text-anchor="middle" font-size="11" font-weight="bold" fill="#616161">N19-8（成本）</text>
  <text x="1270" y="825" text-anchor="middle" font-size="10" fill="#9e9e9e">【待核】</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9e9e9e"/>
    </marker>
  </defs>
</svg>
