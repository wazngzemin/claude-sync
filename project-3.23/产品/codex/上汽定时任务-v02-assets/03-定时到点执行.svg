<text x="70" y="3025" font-size="23" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">定时登记与到点事件有依据；本轮去重、结果超时处理及状态回写细节需评审固化。</tspan><tspan x="70" dy="33.35">循环错过一轮后如何继续、跨下电和断网处理待确认；箭头不表示已支持离线控车。</tspan></text>
