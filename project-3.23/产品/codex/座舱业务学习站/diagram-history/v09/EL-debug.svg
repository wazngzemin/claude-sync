t" dominant-baseline="central"></text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central">按发生时间而非仅写库时间</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-debug" data-step="ld3" aria-label="查对应请求链路"><title>用 request_id/log_id 等定位；研发 params 不自动成为模型上下文</title><rect x="180" y="486" width="340" height="110" rx="6"/><text class="th" x="198" y="510" text-anchor="start" dominant-baseline="central">查对应请求链路</text><text class="ts" x="198" y="538" text-anchor="start" dominant-baseline="central">用 request_id/log_id 等定位</text><text class="ts" x="198" y="557" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="576" text-anchor="start" dominant-baseline="central">研发 params 不自动成为模型上下文</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-debug" data-step="ld4" aria-label="确认事件是否产生"><title>无记录先查生产/权限/定义；不能推断用户未操作</title><rect x="180" y="676" width="340" height="112" rx="6"/><text class="th" x="198" y="700" text-anchor="start" dominant-baseline="central">确认事件是否产生</text><text class="ts" x="198" y="728" text-anchor="start" dominant-baseline="central">无记录先查生产/权限/定义</text><text class="ts" x="198" y="747" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="766" text-anchor="start" dominant-baseline="central">不能推断用户未操作</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-debug" data-step="ld5" aria-label="确认本轮是否拿到"><title>核白名单、窗口与实际 Context；库里存在不等于本轮已注入</title><rect x="180" y="868" width="340" height="110" rx="6"/><text class="th" x="198" y="892" text-anchor="start" dominant-baseline="central">确认本轮是否拿到</text><text class="ts" x="198" y="920" text-anchor="start" dominant-baseline="central">核白名单、窗口与实际 Context</text><text class="ts" x="198" y="939" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="958" text-anchor="start" dominant-baseline="central">库里存在不等于本轮已注入</text></g><g class="c-te