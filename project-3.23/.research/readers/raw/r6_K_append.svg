<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2020 1400 800">
  <rect x="20" y="20" width="1360" height="760" rx="12" fill="#F7F8FA" stroke="#BBBFC4" stroke-dasharray="8 6" stroke-width="2"/>
  <text x="45" y="58" font-size="18" font-weight="bold" fill="#1f2329">本次补充：前台取用的新口径（2026-10）</text>

  <!-- K16 蓝 -->
  <rect x="40" y="80" width="310" height="240" rx="8" fill="#E8F0FE" stroke="#7A9FD0" stroke-width="1.5"/>
  <rect x="56" y="96" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#7A9FD0"/>
  <text x="86" y="114" font-size="13" font-weight="bold" fill="#1f2329" text-anchor="middle">K16</text>
  <text x="128" y="114" font-size="15" font-weight="bold" fill="#1f2329">记忆索引：三层身份</text>
  <text x="56" y="148" font-size="13" fill="#1f2329">统一账号：任务与配置的稳定键</text>
  <text x="56" y="174" font-size="13" fill="#1f2329">车主账号：决定哪些乘客记忆可见</text>
  <text x="56" y="200" font-size="13" fill="#1f2329">车内自然人：决定具体哪个人</text>
  <text x="56" y="226" font-size="13" fill="#1f2329">未识别=匿名上下文，不挂账号</text>
  <text x="56" y="270" font-size="12" fill="#8a8f99">【已落地】账号 OnePage</text>

  <!-- K17 金 -->
  <rect x="390" y="80" width="310" height="240" rx="8" fill="#FFF3D6" stroke="#D9A93C" stroke-width="1.5"/>
  <rect x="406" y="96" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#D9A93C"/>
  <text x="436" y="114" font-size="13" font-weight="bold" fill="#1f2329" text-anchor="middle">K17</text>
  <text x="478" y="114" font-size="15" font-weight="bold" fill="#1f2329">跨账号隔离：只查本账号范围</text>
  <text x="406" y="148" font-size="13" fill="#1f2329">成员、访客的记忆不互串</text>
  <text x="406" y="174" font-size="13" fill="#1f2329">同一人脸在不同车主下可不同称呼</text>
  <text x="406" y="200" font-size="13" fill="#1f2329">查不到保留缺口反问，不猜不借读</text>
  <text x="406" y="226" font-size="13" fill="#1f2329">不凭车辆加人脸跨账号命中</text>
  <text x="406" y="270" font-size="12" fill="#8a8f99">【已落地】账号与乘客 OnePage</text>

  <!-- K18 蓝 -->
  <rect x="740" y="80" width="310" height="240" rx="8" fill="#E8F0FE" stroke="#7A9FD0" stroke-width="1.5"/>
  <rect x="756" y="96" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#7A9FD0"/>
  <text x="786" y="114" font-size="13" font-weight="bold" fill="#1f2329" text-anchor="middle">K18</text>
  <text x="828" y="114" font-size="15" font-weight="bold" fill="#1f2329">介绍认识：判意图抽两槽</text>
  <text x="756" y="148" font-size="13" fill="#1f2329">"坐我右边的是 Alex"</text>
  <text x="756" y="174" font-size="13" fill="#1f2329">先判意图：介绍人给豆包认识</text>
  <text x="756" y="200" font-size="13" fill="#1f2329">再抽姓名和座位，两槽都要非空</text>
  <text x="756" y="226" font-size="13" fill="#1f2329">缺一条整条丢弃，不硬认</text>
  <text x="756" y="270" font-size="12" fill="#8a8f99">【已落地】多模态人物记忆</text>

  <!-- K19 蓝 -->
  <rect x="1090" y="80" width="310" height="240" rx="8" fill="#E8F0FE" stroke="#7A9FD0" stroke-width="1.5"/>
  <rect x="1106" y="96" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#7A9FD0"/>
  <text x="1136" y="114" font-size="13" font-weight="bold" fill="#1f2329" text-anchor="middle">K19</text>
  <text x="1178" y="114" font-size="15" font-weight="bold" fill="#1f2329">车门全关：重报座位人物表</text>
  <text x="1106" y="148" font-size="13" fill="#1f2329">每次车门全关，端上重报座位表</text>
  <text x="1106" y="174" font-size="13" fill="#1f2329">谁坐哪一格， query 直接带上</text>
  <text x="1106" y="200" font-size="13" fill="#1f2329">配合 K02 认出现在是谁坐在哪</text>
  <text x="1106" y="226" font-size="13" fill="#1f2329">换人但人数不变是覆盖缺口</text>
  <text x="1106" y="270" font-size="12" fill="#8a8f99">【已落地】多模态人物记忆</text>

  <!-- K20 蓝 -->
  <rect x="40" y="420" width="310" height="240" rx="8" fill="#E8F0FE" stroke="#7A9FD0" stroke-width="1.5"/>
  <rect x="56" y="436" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#7A9FD0"/>
  <text x="86" y="454" font-size="13" font-weight="bold" fill="#1f2329" text-anchor="middle">K20</text>
  <text x="128" y="454" font-size="15" font-weight="bold" fill="#1f2329">记住 X：先改写再入库</text>
  <text x="56" y="488" font-size="13" fill="#1f2329">"你记一下，目的地是我家"</text>
  <text x="56" y="514" font-size="13" fill="#1f2329">先补全主语和对象再调记忆操作</text>
  <text x="56" y="540" font-size="13" fill="#1f2329">不是把原话原样塞给记忆模块</text>
  <text x="56" y="566" font-size="13" fill="#1f2329">对象没说清，不硬编一条记忆</text>
  <text x="56" y="610" font-size="12" fill="#8a8f99">【2.6 目标】AI 汽车记忆方案</text>

  <!-- K21 蓝 -->
  <rect x="390" y="420" width="310" height="240" rx="8" fill="#E8F0FE" stroke="#7A9FD0" stroke-width="1.5"/>
  <rect x="406" y="436" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#7A9FD0"/>
  <text x="436" y="454" font-size="13" font-weight="bold" fill="#1f2329" text-anchor="middle">K21</text>
  <text x="478" y="454" font-size="15" font-weight="bold" fill="#1f2329">夜里只抽取，不推理</text>
  <text x="406" y="488" font-size="13" fill="#1f2329">每天夜间只把素材搬进长期库</text>
  <text x="406" y="514" font-size="13" fill="#1f2329">偏好推理放每周五夜里做</text>
  <text x="406" y="540" font-size="13" fill="#1f2329">听一千遍同一首歌不总结喜欢</text>
  <text x="406" y="566" font-size="13" fill="#1f2329">明说优先，行为推断标原因</text>
  <text x="406" y="610" font-size="12" fill="#8a8f99">【已落地】AI 汽车记忆方案</text>

  <!-- K22 绿 -->
  <rect x="740" y="420" width="310" height="240" rx="8" fill="#E6F4EA" stroke="#5AA469" stroke-width="1.5"/>
  <rect x="756" y="436" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#5AA469"/>
  <text x="786" y="454" font-size="13" font-weight="bold" fill="#1f2329" text-anchor="middle">K22</text>
  <text x="828" y="454" font-size="15" font-weight="bold" fill="#1f2329">记忆中心：用户能看能删</text>
  <text x="756" y="488" font-size="13" fill="#1f2329">逐条看自己被记了什么</text>
  <text x="756" y="514" font-size="13" fill="#1f2329">单条删、一键清空、一键无痕</text>
  <text x="756" y="540" font-size="13" fill="#1f2329">家庭账号按需共享部分记忆</text>
  <text x="756" y="566" font-size="13" fill="#1f2329">删除联动画像与摘要（见 K14）</text>
  <text x="756" y="610" font-size="12" fill="#8a8f99">【已落地/逐步开放】</text>

  <!-- K23 绿 -->
  <rect x="1090" y="420" width="310" height="240" rx="8" fill="#E6F4EA" stroke="#5AA469" stroke-width="1.5"/>
  <rect x="1106" y="436" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#5AA469"/>
  <text x="1136" y="454" font-size="13" font-weight="bold" fill="#1f2329" text-anchor="middle">K23</text>
  <text x="1178" y="454" font-size="15" font-weight="bold" fill="#1f2329">负反馈：要被识别并调整</text>
  <text x="1106" y="488" font-size="13" fill="#1f2329">"别再推荐这类歌了"</text>
  <text x="1106" y="514" font-size="13" fill="#1f2329">识别成负向反馈并真的调整</text>
  <text x="1106" y="540" font-size="13" fill="#1f2329">不是左耳进右耳出</text>
  <text x="1106" y="566" font-size="13" fill="#1f2329">反馈如何入画像，待核</text>
  <text x="1106" y="610" font-size="12" fill="#8a8f99">【P2 排期，待核】</text>

  <!-- 接回原节点 K03 的连线 -->
  <polyline points="1245,320 1245,380 1310,380 1310,2000" fill="none" stroke="#D9A93C" stroke-width="2" stroke-dasharray="6 5"/>
</svg>
