    </marker>
  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">POI 临停：路线点成功后，才能加“到这里要停”的属性</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,188 350,254" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-1 → DR-poi-2：本轮 + 前序任务</title></polyline><polyline class="arr" fill="none" points="350,346 350,412" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-2 → DR-poi-3：改写后专项诉求</title></polyline><polyline class="arr" fill="none" points="350,504 350,570" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-3 → DR-poi-4：先导航</title></polyline><polyline class="arr" fill="none" points="350,662 350,728" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-4 → DR-poi-5：读取添加结果</title></polyline><polyline class="arr" fill="none" points="350,830 350,896" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-5 → DR-poi-6：成功后才设临停</title></polyline><polyline class="arr" fill="none" points="176,782 80,782 80,1643 170,1643" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-5 → DR-poi-10：失败/无成功证据</title></polyline><polyline class="arr" fill="none" points="350,1015 350,1081" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-6 → DR-poi-7：属性设置成功</title></polyline><polyline class="arr" fill="none" points="176,950 100,950 100,1667 170,1667" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-6 → DR-poi-10：属性失败不能说已设好</title></polyline><polyline class="arr" fill="none" points="350,1173 350,1239" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-7 → DR-poi-8：同步路线和停靠意图</title></polyline><polyline class="arr" fill="none" points="350,1331 350,1397" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-8 → DR-poi-9：真实执行状态</title></polyline><polyline class="arr" fill="none" points="176,1619 130,1619 130,1451 170,1451" marker-end="url(#arrow-DR-poi-flow)"><title>DR-poi-10 → DR-poi-9：失败原因</title></polyline><text class="ts" x="365" y="224" text-anchor="start" dominant-baseline="central">E1 · 本轮 + 前序任务</text><text class="ts" x="365" y="382" text-anchor="start" dominant-baseline="central">E2 · 改写后专项诉求</text><text class="ts" x="365" y="540" text-anchor="start" dominant-baseline="central">E3 · 先导航</text><text class="ts" x="365" y="698" text-anchor="start" dominant-baseline="central">E4 · 读取添加结果</text><text class="ts" x="365" y="866" text-anchor="start" dominant-baseline="central">E5 · 成功后才设临停</text><text class="ts" x="168" y="774" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="168" y="1655" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="365" y="1051" text-anchor="start" dominant-baseline="central">E7 · 属性设置成功</text><text class="ts" x="168" y="942" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="168" y="1679" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="365" y="1209" text-anchor="start" dominant-baseline="central">E9 · 同步路线和停靠意图</text><text class="ts" x="365" y="1367" text-anchor="start" dominant-baseline="central">E10 · 真实执行状态</text><text class="ts" x="168" y="1611" text-anchor="end" dominant-baseline="central">E11</text><text class="ts" x="168" y="1463" text-anchor="end" dominant-baseline="central">E11</text><g class="c-gray" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-1" aria-label="用户说明路线和停靠"><title>先去 A、再去 B；A 要靠边停</title><rect x="180" y="106" width="340" height="78" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">用户说明路线和停靠</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">先去 A、再去 B；A 要靠边停</text></g><text class="anno" x="540" y="130" text-anchor="start" dominant-baseline="central">识别完整任务</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-2" aria-label="DT 保留完整目标"><title>不能只留下新地点；交司机 Agent</title><rect x="180" y="264" width="340" height="78" rx="6"/><text class="th" x="198" y="288" text-anchor="start" dominant-baseline="central">DT 保留完整目标</text><text class="ts" x="198" y="316" text-anchor="start" dominant-baseline="central">不能只留下新地点；交司机 Agent</text></g><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-3" aria-label="专项层拆成两任务"><title>导航点/顺序；指定点的临停要求</title><rect x="180" y="422" width="340" height="78" rx="6"/><text class="th" x="198" y="446" text-anchor="start" dominant-baseline="central">专项层拆成两任务</text><text class="ts" x="198" y="474" text-anchor="start" dominant-baseline="central">导航点/顺序；指定点的临停要求</text></g><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-4" aria-label="Navi 算路并加点"><title>调用系统导航；先取得点添加成功反馈</title><rect x="180" y="580" width="340" height="78" rx="6"/><text class="th" x="198" y="604" text-anchor="start" dominant-baseline="central">Navi 算路并加点</text><text class="ts" x="198" y="632" text-anchor="start" dominant-baseline="central">调用系统导航；先取得点添加成功反馈</text></g><text class="anno" x="540" y="604" text-anchor="start" dominant-baseline="central">先完成导航点</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-5" aria-label="该点是否成功存在"><title>核 POI 身份与顺序；没有成功，不进临停设置</title><rect x="180" y="738" width="340" height="88" rx="6"/><text class="th" x="198" y="762" text-anchor="start" dominant-baseline="central">该点是否成功存在</text><text class="ts" x="198" y="790" text-anchor="start" dominant-baseline="central">核 POI 身份与顺序；没有成功，不进临停设置</text></g><text class="anno" x="540" y="762" text-anchor="start" dominant-baseline="central">E6 · 失败/无成</text><text class="anno" x="540" y="781" text-anchor="start" dominant-baseline="central">功证据</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-6" aria-label="Navi 设置临停属性"><title>独立接口：指定 POI + 属性；枚举以导航协议为准</title><rect x="180" y="906" width="340" height="105" rx="6"/><text class="th" x="198" y="930" text-anchor="start" dominant-baseline="central">Navi 设置临停属性</text><text class="ts" x="198" y="958" text-anchor="start" dominant-baseline="central">独立接口：指定 POI + 属性；枚举以导航协议为准</text></g><text class="anno" x="540" y="930" text-anchor="start" dominant-baseline="central">再绑定临停</text><text class="anno" x="540" y="961" text-anchor="start" dominant-baseline="central">E8 · 属性失败不</text><text class="anno" x="540" y="980" text-anchor="start" dominant-baseline="central">能说已设好</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-7" aria-label="App 同步最新路径"><title>路线与临停信息发 ADC；更新端状态/Context</title><rect x="180" y="1091" width="340" height="78" rx="6"/><text class="th" x="198" y="1115" text-anchor="start" dominant-baseline="central">App 同步最新路径</text><text class="ts" x="198" y="1143" text-anchor="start" dominant-baseline="central">路线与临停信息发 ADC；更新端状态/Context</text></g><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-8" aria-label="智驾按条件执行"><title>抵达指定点再靠边；执行状态不由话术决定</title><rect x="180" y="1249" width="340" height="78" rx="6"/><text class="th" x="198" y="1273" text-anchor="start" dominant-baseline="central">智驾按条件执行</text><text class="ts" x="198" y="1301" text-anchor="start" dominant-baseline="central">抵达指定点再靠边；执行状态不由话术决定</text></g><text class="anno" x="540" y="1273" text-anchor="start" dominant-baseline="central">执行与结果</text><g class="c-teal" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-9" aria-label="回流并核最终结果"><title>到达/靠边完成或失败；DT 按事实表达</title><rect x="180" y="1407" width="340" height="88" rx="6"/><text class="th" x="198" y="1431" text-anchor="start" dominant-baseline="central">回流并核最终结果</text><text class="ts" x="198" y="1459" text-anchor="start" dominant-baseline="central">到达/靠边完成或失败；DT 按事实表达</text></g><g class="c-gray" role="link" tabindex="0" data-page="DR" data-flow="DR-poi-flow" data-step="DR-poi-10" aria-label="未成功，保留错误"><title>点添加/临停属性失败分开；解释或后续修正；重试合同待核</title><rect x="180" y="1575" width="340" height="136" rx="6"/><text class="th" x="198" y="1599" text-anchor="start" dominant-baseline="central">未成功，保留错误</text><text class="ts" x="198" y="1627" text-anchor="start" dominant-baseline="central">点添加/临停属性失败分开；解释或后续修正；重试合</text><text class="ts" x="198" y="1646" text-anchor="start" dominant-baseline="central">同待核</text></g><text class="anno" x="540" y="1599" text-anchor="start" dominant-baseline="central">E11 · 失败原因</text><text class="th" x="40" y="1795" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1825" text-anchor="start" dominant-baseline="central">E1 用户说明路线和停靠 → DT 保留完整目标：本轮 + 前序任务</text><text class="ts" x="40" y="1858" text-anchor="start" dominant-baseline="central">E2 DT 保留完整目标 → 专项层拆成两任务：改写后专项诉求</text><text class="ts" x="40" y="1891" text-anchor="start" dominant-baseline="central">E3 专项层拆成两任务 → Navi 算路并加点：先导航</text><text class="ts" x="40" y="1924" text-anchor="start" dominant-baseline="central">E4 Navi 算路并加点 → 该点是否成功存在：读取添加结果</text><text class="ts" x="40" y="1957" text-anchor="start" dominant-baseline="central">E5 该点是否成功存在 → Navi 设置临停属性：成功后才设临停</text><text class="ts" x="40" y="1990" text-anchor="start" dominant-baseline="central">E6 该点是否成功存在 → 未成功，保留错误：失败/无成功证据</text><text class="ts" x="40" y="2023" text-anchor="start" dominant-baseline="central">E7 Navi 设置临停属性 → App 同步最新路径：属性设置成功</text><text class="ts" x="40" y="2056" text-anchor="start" dominant-baseline="central">E8 Navi 设置临停属性 → 未成功，保留错误：属性失败不能说已设好</text><text class="ts" x="40" y="2089" text-anchor="start" dominant-baseline="central">E9 App 同步最新路径 → 智驾按条件执行：同步路线和停靠意图</text><text class="ts" x="40" y="2122" text-anchor="start" dominant-baseline="central">E10 智驾按条件执行 → 回流并核最终结果：真实执行状态</text><text class="ts" x="40" y="2155" text-anchor="start" dominant-baseline="central">E11 未成功，保留错误 → 回流并核最终结果：失败原因</text></svg>