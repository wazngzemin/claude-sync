<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 -20 1800 1516" font-family="Noto Sans SC, sans-serif">
  <!-- 补充区分区框 -->
  <rect x="40" y="1180" width="1760" height="340" rx="8" fill="#FAFBFC" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="1205" font-size="15" font-weight="bold" fill="#37474F">本次补充：10 月 PRD 产品口径（G13–G19，分别接回 G01/G03/G04/G05/G06/G10/G11）</text>
  <text x="60" y="1223" font-size="11" fill="#78909C">以下节点为 2.6 目标口径（10 月 PRD），不替代原图 G01–G12 的主判断流程；状态写在卡片要点里</text>

  <!-- G13 信号来源（蓝底，接 G03） -->
  <rect x="60" y="1240" width="400" height="130" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.2"/>
  <text x="75" y="1262" font-size="13" font-weight="bold" fill="#1565C0">G13　七类信号从哪来</text>
  <text x="75" y="1282" font-size="10" fill="#37474F">端侧 5 类：端状态 / 端 VLM / 端埋点 / 电子围栏 / 日期时间</text>
  <text x="75" y="1298" font-size="10" fill="#37474F">云端 2 类：后端业务事件 / 事件服务</text>
  <text x="75" y="1314" font-size="10" fill="#37474F">每路信号先过 G02 车况校验，再进 G03 叫醒这次检查</text>
  <text x="75" y="1336" font-size="10" fill="#E65100">【2.6 目标 / 10 月 PRD】</text>

  <!-- G14 注册方（蓝底，接 G01） -->
  <rect x="480" y="1240" width="400" height="130" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.2"/>
  <text x="495" y="1262" font-size="13" font-weight="bold" fill="#1565C0">G14　谁能注册一条场景</text>
  <text x="495" y="1282" font-size="10" fill="#37474F">五路：Advisor / Planner / 产品预设 / 运营配置 / 用户自定义</text>
  <text x="495" y="1298" font-size="10" fill="#37474F">每条场景必须带原业务标识，G01 保存时校验</text>
  <text x="495" y="1314" font-size="10" fill="#37474F">Planner 注册默认最高优先级（见 G16）</text>
  <text x="495" y="1336" font-size="10" fill="#E65100">【2.6 目标 / 10 月 PRD】</text>

  <!-- G15 数值抖动过滤（金底判断，接 G04/G05） -->
  <rect x="900" y="1240" width="400" height="130" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.2"/>
  <text x="915" y="1262" font-size="13" font-weight="bold" fill="#E65100">G15　数值抖动怎么过滤</text>
  <text x="915" y="1282" font-size="10" fill="#37474F">第一次触发后，时间窗口内的波动不再重复触发</text>
  <text x="915" y="1298" font-size="10" fill="#37474F">窗口长度 / 抖动阈值按场景单独配（G01 保存）</text>
  <text x="915" y="1314" font-size="10" fill="#37474F">避免车速在 60km/h 上下浮动时反复弹卡</text>
  <text x="915" y="1336" font-size="10" fill="#C62828">【已落地 / 窗口与阈值按场景确认中】</text>

  <!-- G16 场景优先级（金底判断，接 G06） -->
  <rect x="1320" y="1240" width="400" height="130" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.2"/>
  <text x="1335" y="1262" font-size="13" font-weight="bold" fill="#E65100">G16　同一次扫描命中多个怎么办</text>
  <text x="1335" y="1282" font-size="10" fill="#37474F">1–10 档优先级，只执行最高档，其余留记录</text>
  <text x="1335" y="1298" font-size="10" fill="#37474F">Planner 注册默认最高档</text>
  <text x="1335" y="1314" font-size="10" fill="#37474F">G06 策略拦截 / 命中分别留记录，便于复盘</text>
  <text x="1335" y="1336" font-size="10" fill="#C62828">【已落地 / 档位表待运营确认】</text>

  <!-- G17 定时五形态（蓝底，接 G10） -->
  <rect x="60" y="1390" width="400" height="120" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.2"/>
  <text x="75" y="1412" font-size="13" font-weight="bold" fill="#1565C0">G17　定时任务的五种时间形态</text>
  <text x="75" y="1432" font-size="10" fill="#37474F">① 相对延时一次性　② 绝对时间一次性</text>
  <text x="75" y="1448" font-size="10" fill="#37474F">③ 周期　④ 相对延时周期　⑤ 绝对时间周期</text>
  <text x="75" y="1464" font-size="10" fill="#37474F">G10 调度到时只回业务方，不直接控车</text>
  <text x="75" y="1486" font-size="10" fill="#E65100">【2.6 目标 / 10 月 PRD】</text>

  <!-- G18 改任务=删旧增新（蓝底，接 G01） -->
  <rect x="480" y="1390" width="400" height="120" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.2"/>
  <text x="495" y="1412" font-size="13" font-weight="bold" fill="#1565C0">G18　用户改任务不是原地更新</text>
  <text x="495" y="1432" font-size="10" fill="#37474F">改时间 / 改内容 / 改条件类型：旧任务整条注销</text>
  <text x="495" y="1448" font-size="10" fill="#37474F">再按新配置注册一条，任务 ID 会变</text>
  <text x="495" y="1464" font-size="10" fill="#37474F">不支持半更新，避免旧条件残留</text>
  <text x="495" y="1486" font-size="10" fill="#E65100">【2.6 目标 / 10 月 PRD】</text>

  <!-- G19 VLM 三态（金底判断，接 G11） -->
  <rect x="900" y="1390" width="400" height="120" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.2"/>
  <text x="915" y="1412" font-size="13" font-weight="bold" fill="#E65100">G19　VLM 语义判断只回三态</text>
  <text x="915" y="1432" font-size="10" fill="#37474F">达成 / 未达成 / 无法判断，无置信度字段</text>
  <text x="915" y="1448" font-size="10" fill="#37474F">"无法判断" ≠ "没儿童" ≠ "条件不满足"</text>
  <text x="915" y="1464" font-size="10" fill="#37474F">G11 不负责播报结束，只回业务方</text>
  <text x="915" y="1486" font-size="10" fill="#C62828">【2.6 目标 / 无置信度字段为讨论中】</text>
</svg>
