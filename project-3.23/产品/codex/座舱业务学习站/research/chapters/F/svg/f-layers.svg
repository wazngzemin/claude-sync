<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" role="img" aria-label="一个工具定义，几份实现：同一个名字，不同项目背后是谁"><title>一个工具定义，几份实现：同一个名字，不同项目背后是谁</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="920" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">一个工具定义，几份实现：同一个名字，不同项目背后是谁</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">上面一层写给 DT 看（是什么），下面一层写给系统看（怎么跑）；按渠道隔开，互不影响</text><rect x="30" y="92" width="1180" height="200" rx="10" fill="#fffbe8" fill-opacity=".35" stroke="#cdb35a" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">定义：每个工具在系统里只有一份</text><rect x="60" y="140" width="340" height="110" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="74" y="167" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">天气查询工具</text><text x="74" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">能查哪些天气信息</text><text x="74" y="213" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">例句、注意事项</text><rect x="450" y="140" width="340" height="110" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="464" y="167" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">美团订座工具</text><text x="464" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">订座、查询、修改、取消</text><text x="464" y="213" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">8/27 表里加了排队</text><rect x="840" y="140" width="340" height="110" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="854" y="167" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">POI 查询工具</text><text x="854" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">附近、顺路、多点中间搜</text><text x="854" y="213" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">注意事项、使用技巧</text><rect x="30" y="360" width="1180" height="400" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="384" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">实现：按渠道各建一份；有一个发布版，可以有多个草稿</text><rect x="60" y="410" width="340" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="74" y="437" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">上汽渠道</text><text x="74" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">提供方：内部能力平台</text><text x="74" y="483" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（研发叫 DPFM）</text><rect x="60" y="580" width="340" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="74" y="607" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">赛力斯渠道</text><text x="74" y="632" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">提供方：弋途（采买）</text><rect x="450" y="410" width="340" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="464" y="437" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">各已配置渠道一致</text><text x="464" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">提供方：弋途（采买）</text><text x="464" y="483" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">11/4 快照写“全部”</text><rect x="450" y="580" width="340" height="130" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="464" y="607" font-size="16" fill="#6e2222" font-weight="650" text-anchor="start">“全部”不等于每个项目都配了</text><text x="464" y="632" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只表示配了的渠道实现相同</text><rect x="840" y="410" width="340" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="854" y="437" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">上汽：发布版</text><text x="854" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">AI-Navi 版，所有环境生效</text><rect x="840" y="580" width="340" height="130" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="854" y="607" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">上汽：两个草稿</text><text x="854" y="632" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一方版本只在环境 1 生效</text><text x="854" y="653" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">ToB 版本只在环境 2 生效</text><path d="M230,250 L230,410" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M620,250 L620,410" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1010,250 L1010,410" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M130,250 L130,320 L18,320 L18,645 L60,645" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M1100,250 L1100,320 L1224,320 L1224,645 L1180,645" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="30" y="790" width="1180" height="110" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="44" y="817" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">为什么这样分</text><text x="44" y="842" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">改造以前（7 月技术方案写的现状）：有的工具硬编码拼进 DT 的工具列表；项目不要的工具只能改代码删；</text><text x="44" y="863" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同一工具要两种做法只能再建一个相似工具。</text><text x="44" y="884" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">分两层以后：加项目不改代码，换供应商只换实现；代价是要多维护“哪个渠道发布了哪一版”。POI 草稿的例子出自 7 月技术方案的举例。</text></g></svg>