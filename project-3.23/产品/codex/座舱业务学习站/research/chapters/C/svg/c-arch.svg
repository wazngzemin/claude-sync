<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-label="从“一个模型统一筛”到“各源自己筛 + 不够再查”"><title>从“一个模型统一筛”到“各源自己筛 + 不够再查”</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="900" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">从“一个模型统一筛”到“各源自己筛 + 不够再查”</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左边是 V1（已替换），右边是 V2（Context OnePage 现行方案）</text><rect x="20" y="92" width="590" height="780" rx="10" fill="#fdeeee" fill-opacity=".35" stroke="#c45c5c" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="34" y="116" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">V1：写入 → 粗筛 → 统一精筛</text><rect x="630" y="92" width="590" height="780" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="644" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">V2：各源自己筛，预注入 + 动态检索</text><rect x="40" y="140" width="125" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="54" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">记忆</text><rect x="670" y="140" width="120" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="684" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">记忆</text><rect x="180" y="140" width="125" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="194" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">车辆状态</text><rect x="805" y="140" width="120" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="819" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">车辆状态</text><rect x="320" y="140" width="125" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="334" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">情景描述</text><rect x="940" y="140" width="120" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="954" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">情景描述</text><rect x="460" y="140" width="125" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="474" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">世界信息</text><rect x="1075" y="140" width="120" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="1089" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">世界信息</text><rect x="40" y="230" width="545" height="80" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="54" y="257" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">粗筛：各源并行先粗选一遍</text><text x="54" y="282" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">尽量把可能相关的都留下</text><path d="M102,190 L102,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M242,190 L242,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M382,190 L382,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M522,190 L522,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="350" width="545" height="100" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="54" y="377" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">精筛：一个模型统一挑</text><text x="54" y="402" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">为了快，只允许输出 5 条</text><text x="54" y="423" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车辆状态要调两次模型</text><path d="M312,310 L312,350" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="490" width="545" height="70" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="54" y="517" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">交给 DT</text><path d="M312,450 L312,490" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="600" width="545" height="170" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="54" y="627" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">上线后的问题</text><text x="54" y="652" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">排在前面的数据更容易被放行（位置偏好）</text><text x="54" y="673" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">一个源准了，另一个源就变差</text><text x="54" y="694" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">设计目标 P90 800 毫秒，实际 1.2 秒</text><text x="54" y="715" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">五期还发现：精筛只出 5 条，</text><text x="54" y="736" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">相关记忆会被错筛掉</text><rect x="670" y="230" width="525" height="100" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="684" y="257" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">各源自己筛、自己负责质量</text><text x="684" y="282" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">职责尽量不重叠，取消统一精筛</text><text x="684" y="303" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">方案文档写 P90 564 毫秒（不是线上看板数）</text><path d="M730,190 L730,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M865,190 L865,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1000,190 L1000,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1135,190 L1135,230" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="670" y="360" width="525" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="684" y="387" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">预注入：只带大多数时候用得上的</text><text x="684" y="412" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">OnePage 写覆盖 80% 常规请求；记忆技术评审写 90%</text><path d="M932,330 L932,360" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><polygon points="932,470.0 1082.0,520 932,570.0 782.0,520" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="932" y="525" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">DT：材料够吗？</text><path d="M932,450 L932,470" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="670" y="610" width="250" height="90" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="684" y="637" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">够：直接回答</text><text x="684" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这一轮结束</text><rect x="945" y="610" width="250" height="90" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="959" y="637" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">不够：动态检索</text><text x="959" y="662" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 调工具按需查</text><path d="M842,545 L795,545 L795,610" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1022,545 L1070,545 L1070,610" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="670" y="740" width="525" height="100" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="684" y="767" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">代价</text><text x="684" y="792" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">预注入带少了答不出，带多了模型分心</text><text x="684" y="813" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">每个人需要的常用材料不一样，难以对所有人都好</text></g></svg>