<polyline data-edge-id="family-link3" data-from="H-execute" data-to="H-family-3" points="9510,10335 8220,10335 8220,10410" fill="none" stroke="#A5B8C8" stroke-width="2" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
<polyline data-edge-id="family-link4" data-from="H-execute" data-to="H-family-4" points="9510,10335 10490,10335 10490,10410" fill="none" stroke="#A5B8C8" stroke-width="2" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
<polyline data-edge-id="family-link5" data-from="H-execute" data-to="H-family-5" points="9510,10335 12760,10335 12760,10410" fill="none" stroke="#A5B8C8" stroke-width="2" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="400" y="84" font-size="52px" font-weight="750" fill="#0D4FA8" text-anchor="start">豆包汽车 · 一条请求怎样变成真实结果</text>
<text x="400" y="146" font-size="30px" font-weight="500" fill="#19394D" text-anchor="start">贯穿例子：“我有点热，带我去昨天的游泳馆。”</text>
<text x="400" y="204" font-size="26px" font-weight="400" fill="#466174" text-anchor="start">粗蓝线＝跨模块交接；每列向下＝模块内部顺序；灰色回线＝结果/交互返回；虚线＝机制展开，不是额外执行步骤。</text>
<text x="400" y="257" font-size="26px" font-weight="400" fill="#466174" text-anchor="start">主线是业务分工，不等同进程部署；快路、纯问答、未来任务不是每次都经过全部模块。</text>
<rect x="400" y="920" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-voice"/>
<text x="432" y="972" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">01 把声音变成一轮请求</text>
<text x="432" y="1019" font-size="25px" font-weight="500" fill="#466174" text-anchor="start">车端 · 语音与输入接入</text>
<text x="432" y="1068" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这里还没有开始规划。先保证系统收到的，确实是用户刚才表达的完整意思。</text>
<rect x="464" y="1380" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="V1"/>
<text x="500" y="1432" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">01.1  接收说话，而不是接收一句现成文字</text>
<text x="500" y="1488" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜用户说话后，语音链路处理麦克风输入、唤醒或免唤醒条件、回声与</text>
<text x="500" y="1530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">噪声。音区定位帮助判断声音来自哪一排、哪一个座位；这些是输入可靠性的前提，</text>
<text x="500" y="1572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">具体开关与算法部署须按车端版本核对。</text>
<text x="500" y="1636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜主驾说：“我有点热，带我去昨天的游泳馆。”系统此时拿到的是</text>
<text x="500" y="1678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">声音；车内播报、后排交谈不能自动变成主驾指令。</text>
<text x="500" y="1742" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜没有录音权限、语音未开启、声音未被有效接收时，应在入口解释或停</text>
<text x="500" y="1784" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">止，不能把空输入交给模型后要求它猜。</text>
<text x="500" y="1848" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜原始音频能否与这一次请求对应？音区与注册身份发生冲突时，哪个信</text>
<text x="500" y="1890" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">息可靠？</text>
<rect x="464" y="2210" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="V2"/>
<text x="500" y="2262" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">01.2  ASR：把声音识别为文字</text>
<text x="500" y="2318" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜语音识别（ASR）可能先产生增量文字，再形成最终文字。产品验收要</text>
<text x="500" y="2360" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">看完整语义：人名、地点、数字、“不要”等否定，以及“十分钟后”等时间条件，</text>
<text x="500" y="2402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不能只看平均字错率。</text>
<text x="500" y="2466" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜应保留“有点热”和“昨天的游泳馆”两个诉求。如果“昨天”丢</text>
<text x="500" y="2508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">失，后续就会把历史地点理解成附近搜索。</text>
<text x="500" y="2572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜ASR 结果不确定、被截断或多人重叠，需要相应的重说、确认或排队策</text>
<text x="500" y="2614" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">略。Planner 能处理歧义，但不能可靠补回从未收到的语音证据。</text>
<text x="500" y="2678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜原音频、识别文字、最终传入 Query 的文字，是否在同一条日志中可</text>
<text x="500" y="2720" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">对齐？</text>
<rect x="464" y="3040" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="V3"/>
<text x="500" y="3092" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">01.3  判停、续说与请求归属</text>
<text x="500" y="3148" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜输入接入要确定本轮说话什么时候结束，补充的半句话是续说还是新</text>
<text x="500" y="3190" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">请求，并携带说话人、位置和时间。注册身份与座位不是同一个概念：位置影响车控</text>
<text x="500" y="3232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">对象，身份影响可读取谁的记忆。</text>
<text x="500" y="3296" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜“我”指当前说话人；降温要考虑其位置，查“昨天去过哪里”则</text>
<text x="500" y="3338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">需要关联其身份。不能拿后排乘员的经历替主驾作答。</text>
<text x="500" y="3402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜用户边说边补“别开窗”，如果前半句已触发执行，就会出现时序问题。</text>
<text x="500" y="3444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">判停策略、已下发动作和取消能力要一起验收。</text>
<text x="500" y="3508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜两人同时说话是合并、排序还是打断？每一轮在下游还能否保持原始归</text>
<text x="500" y="3550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">属？</text>
<rect x="464" y="3870" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="V4"/>
<text x="500" y="3922" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">01.4  封装 Query，交给选路模块</text>
<text x="500" y="3978" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里</text>
<text x="500" y="4020" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的</text>
<text x="500" y="4062" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">明确请求。</text>
<text x="500" y="4126" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜交接内容可以理解为：主驾在此刻提出“降温＋去昨天的游泳馆”。</text>
<text x="500" y="4168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">具体字段名与运行版本对齐，不用示意字段冒充真实接口。</text>
<text x="500" y="4232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜用户说“算了”或再次发声，可能是取消、改目标或仅打断播报。输入</text>
<text x="500" y="4274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">层记录新事实，业务层再决定影响哪些动作和等待任务。</text>
<text x="500" y="4338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜能否还原原话、当前轮输入、历史记录三者？本轮关联是否在后续调用</text>
<text x="500" y="4380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">与反馈中保留？</text>
<text x="434" y="4640" font-size="28px" font-weight="700" fill="#0D4FA8" text-anchor="start">这一段怎样才算掌握</text>
<text x="434" y="4688" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能看音频与逐字文本定位“听错/截断/认错人”，不要求训练 ASR。</text>
<rect x="2100" y="920" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-route"/>
<text x="2132" y="972" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">02 决定走快路还是规划</text>
<text x="2132" y="1019" font-size="25px" font-weight="500" fill="#466174" text-anchor="start">端侧候选＋云端拒识/仲裁</text>
<text x="2132" y="1068" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">端侧小模型和云端推理是协作关系。生成了两个候选，不代表可以执行两遍。</text>
<rect x="2164" y="1380" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="R1"/>
<text x="2200" y="1432" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">02.1  端侧 FC 先形成动作候选</text>
<text x="2200" y="1488" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜端侧函数调用模型（FC）把高频简单指令理解为本地能力可承接的动</text>
<text x="2200" y="1530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">作。Director PRD 的基线是：命中白名单时优先端侧快速执行。白名单、车型能力</text>
<text x="2200" y="1572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">和合法参数须一起满足。</text>
<text x="2200" y="1636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜“把主驾车窗关上”可能走快路；“十分钟后关车窗”包含未来条</text>
<text x="2200" y="1678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">件，不能截掉时间后立即关窗。本例含历史地点依赖，应避免被整句当成简单车控。</text>
<text x="2200" y="1742" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜端侧输出首先是候选。没命中白名单时，不能仅因本地先返回，就抢先</text>
<text x="2200" y="1784" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">执行云端还在判断的请求。</text>
<text x="2200" y="1848" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜哪一份车型配置定义白名单？复杂请求误走快路后，是否已造成真实动</text>
<text x="2200" y="1890" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">作？</text>
<rect x="2164" y="2210" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="R2"/>
<text x="2200" y="2262" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">02.2  云端先判断是不是对助手说</text>
<text x="2200" y="2318" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜云端拒识模块判断输入是否应作为对助手的请求。PRD 区分“明确拒</text>
<text x="2200" y="2360" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">识”和“拒识超时”：拒识内容进 Context 事件日志，供背景感知；拒识超时按该 </text>
<text x="2200" y="2402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">PRD 进入 Director。</text>
<text x="2200" y="2466" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜乘员聊天说“昨天那个游泳馆太冷了”，不自动等于要求导航。被</text>
<text x="2200" y="2508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">拒识的内容可以是背景信息，但不能直接按指令执行。</text>
<text x="2200" y="2572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜拒识错误可能导致漏响应或乱执行。拒识超时也不等于整个云请求超时，</text>
<text x="2200" y="2614" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">两种异常的后续路由不同。</text>
<text x="2200" y="2678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜某条 badcase 是被拒识了、意图判错了，还是已经进 Planner 后才</text>
<text x="2200" y="2720" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">理解错了？</text>
<rect x="2164" y="3040" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="R3"/>
<text x="2200" y="3092" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">02.3  简单意图给 FC，复杂依赖给 Planner</text>
<text x="2200" y="3148" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜PRD 的云端基线为：未拒识、仲裁为车控且属于约定意图时交 FC；</text>
<text x="2200" y="3190" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">其余有效请求交 Planner。不要把历史“句法 RAG→情景 RAG→Planner”概括直</text>
<text x="2200" y="3232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">接当成所有版本的固定串行拓扑。</text>
<text x="2200" y="3296" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜本例要先知道昨天去的是哪家，再规划路线；降温还需要车况和乘</text>
<text x="2200" y="3338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">员约束。这些依赖必须由复杂链保留，不是按关键词分成两个互不相干的命令。</text>
<text x="2200" y="3402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜简单与复杂的边界、六类意图清单、云端 FC 所在位置，要以目标车型</text>
<text x="2200" y="3444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">的当前配置和 Trace 核验。</text>
<text x="2200" y="3508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜条件、记忆、跨工具依赖、情景约束，各有哪些容易被简单模型过召的</text>
<text x="2200" y="3550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">反例？</text>
<rect x="2164" y="3870" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="R4"/>
<text x="2200" y="3922" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">02.4  端云仲裁与超时只选一次执行</text>
<text x="2200" y="3978" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如</text>
<text x="2200" y="4020" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，</text>
<text x="2200" y="4062" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">需要运行日志证明。</text>
<text x="2200" y="4126" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 </text>
<text x="2200" y="4168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。</text>
<text x="2200" y="4232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能</text>
<text x="2200" y="4274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">声称所有需要记忆或联网的能力仍能离线完成。</text>
<text x="2200" y="4338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎</text>
<text x="2200" y="4380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">样证明只执行一次？</text>
<text x="2134" y="4640" font-size="28px" font-weight="700" fill="#0D4FA8" text-anchor="start">这一段怎样才算掌握</text>
<text x="2134" y="4688" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能解释白名单、端云优先级、超时兜底，并设计迟到与双执行测试。 能做路由真值集、看中间判</text>
<text x="2134" y="4730" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">定，判断是入口走错还是进入 Planner 后推理错。</text>
<rect x="3800" y="920" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-context"/>
<text x="3832" y="972" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">03 准备本轮真实上下文</text>
<text x="3832" y="1019" font-size="25px" font-weight="500" fill="#466174" text-anchor="start">云端 · 入口与 Context</text>
<text x="3832" y="1068" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Context 是模型这一次真正看得到的信息。事后知道的事实，不等于模型当时收到过。</text>
<rect x="3864" y="1380" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="C1"/>
<text x="3900" y="1432" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">03.1  区分这一次是谁来叫醒 Planner</text>
<text x="3900" y="1488" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜入口接收用户 Query、Advisor 建议、工具反馈，部分新版输入还</text>
<text x="3900" y="1530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">包含事件。三者含义不同：用户在提目标，Advisor 在建议，工具在汇报执行或查询</text>
<text x="3900" y="1572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">结果，不能都当成用户重新下令。</text>
<text x="3900" y="1636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜第一轮收到主驾 Query；查完记忆后再进来的，是“这位用户昨天</text>
<text x="3900" y="1678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">去了某游泳馆”的工具结果，不是用户又说了一遍需求。</text>
<text x="3900" y="1742" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜同名工具并发、重试和迟到反馈必须能够回到正确动作与目标。当前 SP</text>
<text x="3900" y="1784" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start"> 的简化反馈字段不足以证明完整的工程关联协议。</text>
<text x="3900" y="1848" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜能否查到本轮 input 类型，以及它属于哪位用户、哪个未完成目标、</text>
<text x="3900" y="1890" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">哪次调用？</text>
<rect x="3864" y="2210" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="C2"/>
<text x="3900" y="2262" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">03.2  带上当前车况、身份和相关记忆</text>
<text x="3900" y="2318" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜入口把相关端状态、默认情景感知、用户记忆及当前目标等信息整理</text>
<text x="3900" y="2360" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">给模型。状态要区分来源、时间和未知值；当前车况、昨天的行程、说明书知识，不</text>
<text x="3900" y="2402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能混成一种事实。</text>
<text x="3900" y="2466" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜如果空调已经开着、用户不喜欢风直吹，降温方案就不能机械地“</text>
<text x="3900" y="2508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">开空调＋最大风”。如果没带入昨天的地点，就需要调用记忆查询工具。</text>
<text x="3900" y="2572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜“没有这个字段”不等于数值为零，也不等于设备关闭。旧车况和新手</text>
<text x="3900" y="2614" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">动操作冲突时，必须按有效来源与时间判断。</text>
<text x="3900" y="2678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜哪些事实是本场景做对所必需的？是哪一步没采到、没传到、被过滤或</text>
<text x="3900" y="2720" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">被旧历史覆盖？</text>
<rect x="3864" y="3040" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="C3"/>
<text x="3900" y="3092" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">03.3  组织对话历史与本轮示例</text>
<text x="3900" y="3148" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜历史帮助理解“那家”“再低一点”等省略表达；本轮动态示例只为</text>
<text x="3900" y="3190" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">当前 Query 提供参考，不等于真实执行结果。先澄清或改写省略信息再检索示例，</text>
<text x="3900" y="3232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">与把全历史直接作为示例，是两回事。</text>
<text x="3900" y="3296" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜用户后来只说“换另一条”，需要知道上一轮选的是哪条路线。历</text>
<text x="3900" y="3338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">史里必须保留影响本目标的选择和未完成事项，而不是只剩助手说过“好的”。</text>
<text x="3900" y="3402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜压缩远区历史可以省输入，但不能删除未完成动作、失败反馈或用户否</text>
<text x="3900" y="3444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">定。重复明确车控是新请求，不能用历史成功代替本轮执行。</text>
<text x="3900" y="3508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜有无示例对照实验是否改善保留测试集？是否把错误示例、其他车企能</text>
<text x="3900" y="3550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">力或过时工具名带进来了？</text>
<rect x="3864" y="3870" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="C4"/>
<text x="3900" y="3922" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">03.4  组装 SP/UP，进入同一个 Planner</text>
<text x="3900" y="3978" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜系统规则（SP）说明角色、可用工具和输出要求；本轮与历史输入（</text>
<text x="3900" y="4020" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">UP）提供事实和事件。车型、环境、工具版本、场景 knowhow 与动态变量共同决定</text>
<text x="3900" y="4062" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">模型可做什么。</text>
<text x="3900" y="4126" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜模型现在应清楚：用户要降温和去某个历史地点；已知车况有哪些；</text>
<text x="3900" y="4168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">哪些信息还缺；本轮能调用哪些工具。之后才进入 04 规划。</text>
<text x="3900" y="4232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜本地 SP 的 27 个工具只是定义快照；不能据此说每台车线上都开放 2</text>
<text x="3900" y="4274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">7 个。缺事实应查或问，不能用漂亮的提示词替代真实数据。</text>
<text x="3900" y="4338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜你能否拿到这一次模型实际看到的完整输入？如果换一份正确上下文，</text>
<text x="3900" y="4380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">错误是否随之消失？</text>
<text x="3834" y="4640" font-size="28px" font-weight="700" fill="#0D4FA8" text-anchor="start">这一段怎样才算掌握</text>
<text x="3834" y="4688" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能重建一次模型的实际输入，并判断缺失、过时、冲突与用户隔离；主责模块应达到能设计改进</text>
<text x="3834" y="4730" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">实验。</text>
<rect x="5500" y="920" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-planner"/>
<text x="5532" y="972" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">04 理解目标并决定下一步</text>
<text x="5532" y="1019" font-size="25px" font-weight="500" fill="#466174" text-anchor="start">云端 · Planner＝Director</text>
<text x="5532" y="1068" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Planner 与 Director 是同一决策模块的两种叫法，不是串行的两颗“大脑”。</text>
<rect x="5564" y="1380" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="P1"/>
<text x="5600" y="1432" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">04.1  先拆完整目标，再检查约束</text>
<text x="5600" y="1488" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜Planner 理解用户真正想达成什么，并保留对象、位置、时间、偏好</text>
<text x="5600" y="1530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">和禁止事项。它不是直接操作车辆，而是在当前事实与能力边界下，决定本轮应该行</text>
<text x="5600" y="1572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">动、查信息、询问还是等待。</text>
<text x="5600" y="1636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜本例有两个子目标：让当前乘员更凉快；导航去他昨天去过的游泳</text>
<text x="5600" y="1678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">馆。完成其中一个，不等于整句话已经办妥。</text>
<text x="5600" y="1742" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜不应擅自增加高影响动作，也不能为追求“多工具能力”额外开窗、改</text>
<text x="5600" y="1784" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">路线或改账号设置。无依据动作要单独计入失败。</text>
<text x="5600" y="1848" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜这条 Query 的完整成功标准是什么？哪些动作是必要的，哪些只是模</text>
<text x="5600" y="1890" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">型自己发挥？</text>
<rect x="5564" y="2210" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="P2"/>
<text x="5600" y="2262" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">04.2  缺事实就查询，缺选择就询问</text>
<text x="5600" y="2318" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候</text>
<text x="5600" y="2360" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。</text>
<text x="5600" y="2424" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜如果昨天地点未在 Context 中，先调用 user_memory_search。</text>
<text x="5600" y="2466" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">若返回两个可能地点，就问用户选哪一个；不能自行挑一家立即导航。</text>
<text x="5600" y="2530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜查无记忆、无注册身份、存在多候选、工具不可用，是不同的恢复分支。</text>
<text x="5600" y="2572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">用户提供新信息后，要继续原目标而不是忘记降温这一半。</text>
<text x="5600" y="2636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜为什么这一步要查工具，不直接问用户？又为什么多候选时不能继续替</text>
<text x="5600" y="2678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">用户决定？</text>
<rect x="5564" y="3040" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="P3"/>
<text x="5600" y="3092" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">04.3  按依赖安排动作，改写给下游</text>
<text x="5600" y="3148" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜独立动作可以分别推进；有依赖的动作必须等前一步结果。工具指令</text>
<text x="5600" y="3190" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">要把代词、对象和约束改写得下游能理解。SP 还明确要求 POI、路线规划、导航控</text>
<text x="5600" y="3232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">制串行互斥。</text>
<text x="5600" y="3296" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜降温相关行动与查询历史地点可以在条件允许时独立推进；路线规</text>
<text x="5600" y="3338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">划必须等具体地点。不能在查“昨天那家”的同时，凭空给路线工具一个地址。</text>
<text x="5600" y="3402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜是否并发由能力、依赖和实际调度契约共同决定，不是“模型一次输出</text>
<text x="5600" y="3444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">多个 action 就一定并行”。串行安全要求也不能仅凭提示词就认为已保证。</text>
<text x="5600" y="3508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜哪个结果是下一步必需的输入？哪一条日志能证明工具实际按正确顺序</text>
<text x="5600" y="3550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">执行？</text>
<rect x="5564" y="3870" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="P4"/>
<text x="5600" y="3922" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">04.4  生成本轮决定，而不是宣布一切完成</text>
<text x="5600" y="3978" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜输出包含是否说话、说什么、表情与 action_list。需要工具时进</text>
<text x="5600" y="4020" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">入 05；不需要工具或需要澄清时可直接走 T1 到 08。未来条件或持续目标进入下方</text>
<text x="5600" y="4062" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start"> Task/旧 Goal 支路，不应立即执行目标动作。</text>
<text x="5600" y="4126" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜第一轮可以查历史地点、执行合法的降温动作；收到记忆结果后再</text>
<text x="5600" y="4168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">规划路线。最终结果要等真实回报，不是第一轮就说“已经导航好了”。</text>
<text x="5600" y="4232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜talk_content 与 action_list 要一致。用户取消后，应区分停止</text>
<text x="5600" y="4274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">播报、取消当前动作和撤销未来任务，不能用一句“好的”代替状态处理。</text>
<text x="5600" y="4338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜模型选错时，证据指向输入缺失、工具描述、示例干扰，还是信息齐全</text>
<text x="5600" y="4380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">后的推理失误？</text>
<text x="5534" y="4640" font-size="28px" font-weight="700" fill="#0D4FA8" text-anchor="start">这一段怎样才算掌握</text>
<text x="5534" y="4688" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这是你应深入到“能定位、设计评测、提出改法并验收”的核心模块；不是只会解释 prompt。</text>
<rect x="7200" y="920" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-dispatch"/>
<text x="7232" y="972" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">05 把计划交给可用工具</text>
<text x="7232" y="1019" font-size="25px" font-weight="500" fill="#466174" text-anchor="start">云端/端侧 · 工具调用与业务门禁</text>
<text x="7232" y="1068" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">action_list 是计划。校验、调度与真实执行，是随后发生的事情；统一门禁实现仍须按版本</text>
<text x="7232" y="1109" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">核验。</text>
<rect x="7264" y="1380" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="D1"/>
<text x="7300" y="1432" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">05.1  查到真实注册的工具与参数契约</text>
<text x="7300" y="1488" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、</text>
<text x="7300" y="1530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 </text>
<text x="7300" y="1572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Task 接口不混算成第 28 个线上工具。</text>
<text x="7300" y="1636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜查记忆使用 user_memory_search；历史地址确定后使用 </text>
<text x="7300" y="1678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工</text>
<text x="7300" y="1720" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">具。</text>
<text x="7300" y="1784" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型</text>
<text x="7300" y="1826" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不支持，应有可解释失败，而不是静默丢弃。</text>
<text x="7300" y="1890" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表</text>
<text x="7300" y="1932" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">逐项对齐？</text>
<rect x="7264" y="2210" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="D2"/>
<text x="7300" y="2262" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">05.2  校验身份、车态与外部副作用</text>
<text x="7300" y="2318" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜动作下发前，需要按各领域契约检查对象、取值、车态、用户权限和</text>
<text x="7300" y="2360" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">必要确认。这里是产品必须明确的边界，不代表已验证公司存在一个万能的统一校验</text>
<text x="7300" y="2402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">服务。</text>
<text x="7300" y="2466" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜主驾说“给副驾降温”，控制对象要明确；查记忆不能串到副驾身</text>
<text x="7300" y="2508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">份。通讯、预订、记忆写入等会产生额外副作用，更不能把理解正确等同于获准提交。</text>
<text x="7300" y="2572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜非法参数、不支持功能、前置条件变化时，应拦截或请用户确认。是否</text>
<text x="7300" y="2614" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">由 Planner、调度层、Agent 或车端执行检查，要逐个工具说清。</text>
<text x="7300" y="2678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜谁拦非法动作？谁对接被拦后的可用替代方案？权限测试是否只测成功</text>
<text x="7300" y="2720" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">路径？</text>
<rect x="7264" y="3040" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="D3"/>
<text x="7300" y="3092" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">05.3  按顺序派发，并保留调用关联</text>
<text x="7300" y="3148" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关</text>
<text x="7300" y="3190" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返</text>
<text x="7300" y="3232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">回的结果。</text>
<text x="7300" y="3296" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜查完记忆拿到地址，再把地址交给路线规划；降温动作的反馈与路</text>
<text x="7300" y="3338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">线反馈分别记录，不能先回来的一个成功覆盖整个目标。</text>
<text x="7300" y="3402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜取消、重试、超时后迟到结果必须有明确处理。当前 SP 的反馈示意只</text>
<text x="7300" y="3444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">有 tool_name 与文本，无法据此推断 action_id 回绑已完善。</text>
<text x="7300" y="3508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜反馈怎么找到那一次调用？两个同名调用反序返回、旧结果迟到，系统</text>
<text x="7300" y="3550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">会不会串结果？</text>
<rect x="7264" y="3870" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="D4"/>
<text x="7300" y="3922" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">05.4  决定重试时先确认有没有做过</text>
<text x="7300" y="3978" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜查询失败和写操作超时不能使用同一重试策略。查询可按预算重试；</text>
<text x="7300" y="4020" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">订座、拨号或记忆写入超时，应先确认已有操作状态，再决定是否补做，避免重复副</text>
<text x="7300" y="4062" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">作用。</text>
<text x="7300" y="4126" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜如果路线工具返回失败，遵守 SP 约定的最多两次重试；如果订座</text>
<text x="7300" y="4168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">提交超时，则不能照搬这条策略连订几次。</text>
<text x="7300" y="4232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜重试次数、超时预算、幂等键、取消能力和失败原因，需要工具契约支</text>
<text x="7300" y="4274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">持。文档没提供的字段不能当成已上线机制。</text>
<text x="7300" y="4338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜这个工具超时意味着没执行，还是执行了但没回报？有什么查询或回执</text>
<text x="7300" y="4380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能证明？</text>
<text x="7234" y="4640" font-size="28px" font-weight="700" fill="#0D4FA8" text-anchor="start">这一段怎样才算掌握</text>
<text x="7234" y="4688" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能读工具契约和调用 Trace，分清模型生成、业务校验、实际执行、反馈回绑四步。</text>
<rect x="8900" y="920" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-execute"/>
<text x="8932" y="972" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">06 领域理解到真实业务生效</text>
<text x="8932" y="1019" font-size="25px" font-weight="500" fill="#466174" text-anchor="start">领域 Agent / 服务 / 车型适配 / 车端</text>
<text x="8932" y="1068" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">一项工具可能包含多步理解、检索和执行。模型输出成功、接口受理、业务生效必须分开看。</text>
<rect x="8964" y="1380" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="E1"/>
<text x="9000" y="1432" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">06.1  领域工具再理解具体请求</text>
<text x="9000" y="1488" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜有的工具接自然语言 query，再由领域能力理解；有的接结构化参数</text>
<text x="9000" y="1530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">或调用服务。进入工具并不意味着直接碰到车辆。具体是否再调 SFT、规则或其他模</text>
<text x="9000" y="1572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">型，需看该工具实现，不能全体套同一种架构。</text>
<text x="9000" y="1636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜vehicle_basic_control 要把降温诉求落到具体功能、位置和数</text>
<text x="9000" y="1678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">值；user_memory_search 则检索对应用户的经历，二者内部机制不同。</text>
<text x="9000" y="1742" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜领域工具也可能漏掉否定或位置约束。如果 Planner 发出的指令正确、</text>
<text x="9000" y="1784" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">工具解释错了，责任不能继续算到 Planner。</text>
<text x="9000" y="1848" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜能否看到工具收到的原始输入、内部解析结果和实际调用的下级能力？</text>
<text x="9000" y="1890" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">哪里第一次变错？</text>
<rect x="8964" y="2210" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="E2"/>
<text x="9000" y="2262" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">06.2  检索/候选/选择，不等于执行完成</text>
<text x="9000" y="2318" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜信息类工具返回事实，搜索类工具可能返回候选，部分工具同时执行。</text>
<text x="9000" y="2360" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">SP 约定 music_search 通常自动播放首条；route_planning 在选定路线后会自</text>
<text x="9000" y="2402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">动导航，不能再机械地补一次开始。</text>
<text x="9000" y="2466" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜历史地点唯一且明确时交路线规划；若还要用户选择路线，先展示</text>
<text x="9000" y="2508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">候选并等待。候选列表出现不等于导航已进入正确状态。</text>
<text x="9000" y="2572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜无候选、结果过期、选项已失效、用户点错或改变主意都要回到业务处</text>
<text x="9000" y="2614" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">理。不能把“找到内容”当成“已经播放/已经导航”。</text>
<text x="9000" y="2678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜这个工具究竟只查询，还是查询后自动行动？用户选择会在哪个事件里</text>
<text x="9000" y="2720" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">返回？</text>
<rect x="8964" y="3040" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="E3"/>
<text x="9000" y="3092" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">06.3  调用底层服务或车型能力</text>
<text x="9000" y="3148" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适</text>
<text x="9000" y="3190" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里</text>
<text x="9000" y="3232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">才可能产生真实副作用。</text>
<text x="9000" y="3296" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜车控接口让空调或风量发生变化；路线工具让正确目的地进入导航</text>
<text x="9000" y="3338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">状态。这两条链各自成功，才有可能完成本例。</text>
<text x="9000" y="3402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前</text>
<text x="9000" y="3444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">车态改变、资源受限、服务不可用，都可能让先前合法计划失败。</text>
<text x="9000" y="3508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功</text>
<text x="9000" y="3550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">口径如何保守定义？</text>
<rect x="8964" y="3870" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="E4"/>
<text x="9000" y="3922" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">06.4  收集结果，并给出可核验依据</text>
<text x="9000" y="3978" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜工具把事实、候选、处理中、成功或失败等业务含义交回。对于车控，</text>
<text x="9000" y="4020" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">应把指令回执与真实车况分开；对于导航或订单，要核对业务状态，而不是只看 </text>
<text x="9000" y="4062" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">HTTP 或模型文本。</text>
<text x="9000" y="4126" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜降温要核对空调/风量等目标变化；导航要核对目的地和导航状态。</text>
<text x="9000" y="4168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">仅“调用成功”不足以支撑“两个目标都完成”。</text>
<text x="9000" y="4232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜下游无法提供真实状态时，要保留“不确定/已受理”等语义，并明确待</text>
<text x="9000" y="4274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">补的回读契约，不能包装成已完成。</text>
<text x="9000" y="4338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜每种结果对应哪条日志或状态证据？用户说“根本没变”时，系统能定</text>
<text x="9000" y="4380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">位到哪一跳？</text>
<text x="8934" y="4640" font-size="28px" font-weight="700" fill="#0D4FA8" text-anchor="start">这一段怎样才算掌握</text>
<text x="8934" y="4688" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能读工具契约和调用 Trace，分清模型生成、业务校验、实际执行、反馈回绑四步。 能证明“</text>
<text x="8934" y="4730" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">说、显、做”一致，能把首响应与真实完成分开验收。</text>
<rect x="10600" y="920" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-feedback"/>
<text x="10632" y="972" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">07 观察结果，更新剩余目标</text>
<text x="10632" y="1019" font-size="25px" font-weight="500" fill="#466174" text-anchor="start">反馈接入 → Context → 同一 Planner</text>
<text x="10632" y="1068" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">一轮推理并不等于一次完整任务。查信息、拿候选、用户选择，都可能使同一个目标再次进入推</text>
<text x="10632" y="1109" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">理。</text>
<rect x="10664" y="1380" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="F1"/>
<text x="10700" y="1432" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">07.1  工具结果回到正确请求</text>
<text x="10700" y="1488" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧</text>
<text x="10700" y="1530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后</text>
<text x="10700" y="1572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">才到达，需要单独处理。</text>
<text x="10700" y="1636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两</text>
<text x="10700" y="1678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。</text>
<text x="10700" y="1742" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可</text>
<text x="10700" y="1784" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">重试标记等是待核契约，不能用示例证明线上完备。</text>
<text x="10700" y="1848" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？</text>
<rect x="10664" y="2210" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="F2"/>
<text x="10700" y="2262" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">07.2  把结果当新事实，不覆盖未完事项</text>
<text x="10700" y="2318" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜Context 需要反映新结果、用户选择和实际车况。已经完成的子目标</text>
<text x="10700" y="2360" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">保留证据，尚未完成的继续存在。历史成功也不能覆盖用户刚刚手动改变的状态。</text>
<text x="10700" y="2424" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜查到昨天去的游泳馆后，新增的是一个可用地点；导航还没执行。</text>
<text x="10700" y="2466" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">空调成功后如果用户手动关掉，也必须记录新车态。</text>
<text x="10700" y="2530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜“工具调用过”与“目标完成”不同；“上一轮做过”与“本轮不必再</text>
<text x="10700" y="2572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">做”也不同。远区压缩尤其不能抹掉尚未完成的依赖。</text>
<text x="10700" y="2636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜你能在新一轮实际输入中看到上一步结果吗？模型是否仍在用过时的车</text>
<text x="10700" y="2678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">况？</text>
<rect x="10664" y="3040" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="F3"/>
<text x="10700" y="3092" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">07.3  未完成就回 03，再由 04 决策</text>
<text x="10700" y="3148" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜如果仍缺信息、需要调用下一工具或修正失败，沿 R1 回到 03 组装</text>
<text x="10700" y="3190" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">本轮输入，再由同一个 Planner 判断。不是把结果交给另一个名叫 Director 的</text>
<text x="10700" y="3232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">模型重新开始。</text>
<text x="10700" y="3296" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜第二轮拿到地址后调用路线规划；如果返回多个路线，再等待用户</text>
<text x="10700" y="3338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">选择；导航状态确认后才关闭导航子目标。</text>
<text x="10700" y="3402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜失败可选择重试、换方案、澄清或明确终止，但必须受能力与副作用约</text>
<text x="10700" y="3444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">束。不能无限重试，也不能在用户取消后重新激活旧目标。</text>
<text x="10700" y="3508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜每一轮新增了什么有效信息？为什么有必要再推理一次，而不是重复调</text>
<text x="10700" y="3550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">用同一个工具？</text>
<rect x="10664" y="3870" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="F4"/>
<text x="10700" y="3922" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">07.4  能证明什么，就汇报到什么程度</text>
<text x="10700" y="3978" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任</text>
<text x="10700" y="4020" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听</text>
<text x="10700" y="4062" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">起来合理。</text>
<text x="10700" y="4126" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜如果降温成功但地点没找到，就说清已处理降温、地点仍需确认；</text>
<text x="10700" y="4168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不能说“都安排好了”。如果两者都生效，才给完成反馈。</text>
<text x="10700" y="4232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜业务结果与用户满意度还需分开：导航已正确开始不等于用户对路线满</text>
<text x="10700" y="4274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">意；空调参数变化也不等于用户已经感到舒适。</text>
<text x="10700" y="4338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜系统每一次“已完成”是否都有证据？假完成率的分母必须是宣称完成</text>
<text x="10700" y="4380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">的请求。</text>
<text x="10634" y="4640" font-size="28px" font-weight="700" fill="#0D4FA8" text-anchor="start">这一段怎样才算掌握</text>
<text x="10634" y="4688" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这是你应深入到“能定位、设计评测、提出改法并验收”的核心模块；不是只会解释 prompt。 </text>
<text x="10634" y="4730" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能证明“说、显、做”一致，能把首响应与真实完成分开验收。</text>
<rect x="12300" y="920" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-output"/>
<text x="12332" y="972" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">08 让用户听到、看到并继续</text>
<text x="12332" y="1019" font-size="25px" font-weight="500" fill="#466174" text-anchor="start">云端话术＋车端 TTS / 卡片 / 交互</text>
<text x="12332" y="1068" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">说、显、做是相互约束的输出，不是“TTS→虚拟形象→车控”的一条串行链。</text>
<rect x="12364" y="1380" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="O1"/>
<text x="12400" y="1432" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">08.1  决定说不说、说到哪一步</text>
<text x="12400" y="1488" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜Planner 的 talk_content 用于生成对话输出；查询、简单控制等</text>
<text x="12400" y="1530" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">场景不一定需要无意义的“我帮你查一下”。部分领域 Agent 也会自己播报，需要</text>
<text x="12400" y="1572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">避免重复或抢话。</text>
<text x="12400" y="1636" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜若地点仍在确认，可以先说明必要的下一步；若空调成功而导航失</text>
<text x="12400" y="1678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">败，应明确部分结果。不能在动作尚未发生时用完成时态承诺。</text>
<text x="12400" y="1742" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜话术要与本轮实际动作、失败和等待一致；安全或重要结果不能被普通</text>
<text x="12400" y="1784" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">过渡语覆盖。具体播报优先级按运行策略核验。</text>
<text x="12400" y="1848" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜谁负责首响应，谁负责领域结果，谁负责总结？有没有重复播报和抢话</text>
<text x="12400" y="1890" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">测试？</text>
<rect x="12364" y="2210" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="O2"/>
<text x="12400" y="2262" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">08.2  TTS、卡片与形象各走交互通道</text>
<text x="12400" y="2318" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜文字转语音（TTS）让用户听见；卡片展示候选、进度或业务结果；虚</text>
<text x="12400" y="2360" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">拟形象可以配合情绪表达。车控执行是 06 的独立业务链，不需要等形象播完才必然</text>
<text x="12400" y="2402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">发生。</text>
<text x="12400" y="2466" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜可以一边完成降温，一边展示路线候选；用户看见卡片与真实导航</text>
<text x="12400" y="2508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">启动是不同的两个事件。avatar 或动画不能充当“车控成功”的证明。</text>
<text x="12400" y="2572" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜卡片请求被受理不等于已经显示：可能排队、被覆盖、过期或不在前台。</text>
<text x="12400" y="2614" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">首播、首卡片、首动作、最终完成要分开记时。</text>
<text x="12400" y="2678" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜显示成功在哪个回执里？UI 动效、工具成功和真实车况是否被错误地共</text>
<text x="12400" y="2720" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">用一个成功字段？</text>
<rect x="12364" y="3040" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="O3"/>
<text x="12400" y="3092" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">08.3  用户手点或说“第三个”，回原业务</text>
<text x="12400" y="3148" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜手动选择与可见即可说需要找到当前可操作元素，再触发原业务按钮</text>
<text x="12400" y="3190" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">回调。关键选择结果应回到 Context；未完成的任务继续判断，不能让一次点击丢失</text>
<text x="12400" y="3232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">前面的目标。</text>
<text x="12400" y="3296" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜用户选第三条路线后，由路线业务完成其既定选择/导航流程，再把</text>
<text x="12400" y="3338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">结果回给系统；不应把“第三个”单独当成没有上下文的新地点。</text>
<text x="12400" y="3402" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜页面已切换、候选过期、同名按钮、任务已取消时，不能照旧点击。可</text>
<text x="12400" y="3444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">见即可说的详细匹配链在本列下方展开。</text>
<text x="12400" y="3508" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜原业务收到的是哪个选项 ID？实际选择有没有进入下一轮模型输入？</text>
<rect x="12364" y="3870" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="O4"/>
<text x="12400" y="3922" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">08.4  打断、改目标与取消分别处理</text>
<text x="12400" y="3978" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜新语音从 01 进入；与当前业务相关的点击事件可沿 U1 回 03。打</text>
<text x="12400" y="4020" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">断播报不自动取消已下发车控；取消一次执行也不自动删除长期任务，这些必须用业</text>
<text x="12400" y="4062" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">务状态区分。</text>
<text x="12400" y="4126" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜用户说“先别去了”应影响导航目标，但是否保留已完成降温要按</text>
<text x="12400" y="4168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">原意处理；用户仅把音量调低，不应让历史任务重新执行。</text>
<text x="12400" y="4232" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜完整闭环最后还要记录失败与用户反馈，进入评测和改进。产品经理需</text>
<text x="12400" y="4274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">要能追这一条链，而不是必须实现每个底层模型后才有资格判断好坏。</text>
<text x="12400" y="4338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜同一案例能否讲清成功标准、最早出错点、责任边界、改法和回归结果？</text>
<text x="12334" y="4640" font-size="28px" font-weight="700" fill="#0D4FA8" text-anchor="start">这一段怎样才算掌握</text>
<text x="12334" y="4688" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">能证明“说、显、做”一致，能把首响应与真实完成分开验收。 能把“页面能看见、语音能匹配、</text>
<text x="12334" y="4730" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">按钮被点中、原业务收到、动作真生效”五件事分别验收。</text>
<rect x="400" y="5770" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-input-detail"/>
<text x="432" y="5822" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">输入侧还要分清的三件事</text>
<text x="432" y="5880" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">补充机制 · 不改变主线的入口归属</text>
<rect x="464" y="6230" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="IV1"/>
<text x="500" y="6282" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">1. 声音结束与系统开始响应之间</text>
<text x="500" y="6338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜尾延迟从用户实际结束说话到最终 Query 就绪计量。唤醒等待、判</text>
<text x="500" y="6380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">停等待、网络传输和模型首响应是不同段；只报一个总平均值，无法确定真正的慢点。</text>
<text x="500" y="6444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜本例若“游泳馆”末尾被截掉，再快的 Planner 首 token 也没</text>
<text x="500" y="6486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">有意义。</text>
<text x="500" y="6550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜质量与时延应在同一测试集上对照，避免用过早判停换取更快响应。</text>
<text x="500" y="6614" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜是否单独保留关键否定、地点、数值的识别准确性，以及 P50/P95 尾</text>
<text x="500" y="6656" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">延迟？</text>
<rect x="464" y="7060" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="IV2"/>
<text x="500" y="7112" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">2. 声纹、音区与人脸注册身份</text>
<text x="500" y="7168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜座位说明声音来自哪里，注册身份说明能使用谁的数据。不同信息源</text>
<text x="500" y="7210" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">可能缺失或冲突；产品需要定义未知身份如何交互，不应默认音区定位正确就能读取</text>
<text x="500" y="7252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">历史记忆。</text>
<text x="500" y="7316" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜主驾换人后，不能继续拿上一位驾驶员的“昨天游泳馆”。</text>
<text x="500" y="7380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜无身份时可以问用户地点，或按允许的匿名能力处理；不能假装记忆已</text>
<text x="500" y="7422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">命中。</text>
<text x="500" y="7486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜身份切换、多人同时说话、人脸未识别与临时换座，各自会影响什么字</text>
<text x="500" y="7528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">段？</text>
<rect x="464" y="7890" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="IV3"/>
<text x="500" y="7942" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">3. 同一条语音也可能命中页面操作</text>
<text x="500" y="7998" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜可见即可说可以把语音转成当前页面按钮动作；普通自然语言则进入</text>
<text x="500" y="8040" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">主请求链。两者的优先级不能只用“有端侧小模型”概括，需核对当前车型的页面注</text>
<text x="500" y="8082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">册和路由策略。</text>
<text x="500" y="8146" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜用户面对路线卡片说“第三个”，需要页内元素匹配；没有有效页</text>
<text x="500" y="8188" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">面时不能随意猜按钮。</text>
<text x="500" y="8252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜框架 PRD 存在页面语音的优先级要求，但它不能证明每种卡片已经完</text>
<text x="500" y="8294" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">成接入。</text>
<text x="500" y="8358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜命中页面操作后，是否还会作为普通 Query 再执行一次？</text>
<rect x="2100" y="5770" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-local-trigger"/>
<text x="2132" y="5822" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">端侧触发器与本地闭环</text>
<text x="2132" y="5880" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">条件事件入口 · 不必等用户再次开口</text>
<rect x="2164" y="6230" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="LT1"/>
<text x="2200" y="6282" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">1. 先有可执行规则，才有本地等待</text>
<text x="2200" y="6338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜配置侧需定义适用范围、信号、条件和动作，再下发端侧。端侧必须</text>
<text x="2200" y="6380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">确认规则能被感知和执行；云端发布成功不能代替车端已获取、校验并生效。</text>
<text x="2200" y="6444" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜系统预设“某车况满足后建议处理”时，先明确车型、信号单位、</text>
<text x="2200" y="6486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">枚举与动作范围。</text>
<text x="2200" y="6550" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜非法配置、能力缺失、版本未生效，应反馈具体失败，而非永远显示“</text>
<text x="2200" y="6592" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">等待中”。</text>
<text x="2200" y="6656" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜规则版本在哪能读到？由谁负责场景方案、谁配置、谁提供实车验收？</text>
<rect x="2164" y="7060" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="LT2"/>
<text x="2200" y="7112" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">2. 变化事件唤醒，快照提供判断事实</text>
<text x="2200" y="7168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜变化上报用于唤醒相关规则；定时轮询用于提供快照。条件求值需要</text>
<text x="2200" y="7210" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">明确读哪个时刻的状态，并处理多个条件组合、持续时间和抖动，不能只看一个变化</text>
<text x="2200" y="7252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">事件就认定全部满足。</text>
<text x="2200" y="7316" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜车门打开事件可以唤醒规则，但是否主驾在座、车辆是否驻车，还</text>
<text x="2200" y="7358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">要读对应事实。</text>
<text x="2200" y="7422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜未达成不是能力未覆盖。暂时不满足应继续等待；根本观测不到才是能</text>
<text x="2200" y="7464" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">力或配置问题。</text>
<text x="2200" y="7528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜事件发生、采集、缓存更新与求值的时间先后能否完整还原？</text>
<rect x="2164" y="7890" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="LT3"/>
<text x="2200" y="7942" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">3. 命中还要经过抑制，再执行与回读</text>
<text x="2200" y="7998" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜满足条件后还要核对冷却、去重、范围、取消和冲突策略，再进入执</text>
<text x="2200" y="8040" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">行域。端云可能同时对同一场景有判断，谁持有执行权需要真实契约，不应假定天然</text>
<text x="2200" y="8082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不会重复。</text>
<text x="2200" y="8146" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜一个持续为真的条件不应每次快照都再做同一动作；用户刚取消的</text>
<text x="2200" y="8188" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">任务也不应被迟到事件唤醒。</text>
<text x="2200" y="8252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜端侧资源不足、队列拥塞、规则更新、重启或断网恢复可能导致漏触发</text>
<text x="2200" y="8294" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">或旧事件补触发，必须作为独立测试维度。</text>
<text x="2200" y="8358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜错误来自规则、端侧资源、模型语义还是软硬件时序？哪条证据能排除</text>
<text x="2200" y="8400" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">另外三类？</text>
<rect x="3800" y="5770" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-state-data"/>
<text x="3832" y="5822" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">状态、感知与记忆怎样进来</text>
<text x="3832" y="5880" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">数据供给面 · 不把所有数据画成串行前置</text>
<rect x="3864" y="6230" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="SC1"/>
<text x="3900" y="6282" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">1. 端状态中心与云端缓存各有职责</text>
<text x="3900" y="6338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜车辆信号、应用状态、用户操作、默认感知等在端侧形成状态与事件，</text>
<text x="3900" y="6380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">再按协议上报云端并被 Context 使用。缓存表示已保存的已知事实，不是保证仍然</text>
<text x="3900" y="6422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">最新的事实。</text>
<text x="3900" y="6486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜用户手动关了空调，应产生相应状态或事件；否则模型可能继续使</text>
<text x="3900" y="6528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">用刚才“空调打开成功”的历史。</text>
<text x="3900" y="6592" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜全量、增量、轮询和变化上报的使用范围需逐个信号确认。丢包、时钟</text>
<text x="3900" y="6634" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">差、乱序必须反映在新鲜度判断里。</text>
<text x="3900" y="6698" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜每个关键字段来自哪里、多久更新、缺失怎么表达？云端如何知道值已</text>
<text x="3900" y="6740" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">经过期？</text>
<rect x="3864" y="7060" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="SC2"/>
<text x="3900" y="7112" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">2. 默认感知与记忆不是一回事</text>
<text x="3900" y="7168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜默认视觉可提供此刻舱内外观察；用户记忆提供归属于某人的经历与</text>
<text x="3900" y="7210" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">偏好；事件日志记录交互和变化。不同资料对“现在”“过去”“长期偏好”的含义</text>
<text x="3900" y="7252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不同。</text>
<text x="3900" y="7316" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜宝宝正在后排睡觉是当前观察；用户不喜欢直吹是偏好；昨天去某</text>
<text x="3900" y="7358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">游泳馆是历史经历。三者可能共同影响这一次规划。</text>
<text x="3900" y="7422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜观察不可见、记忆查无结果、历史无记录，都不应被解释为“没有发生</text>
<text x="3900" y="7464" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">”或“用户没有这个偏好”。</text>
<text x="3900" y="7528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜模型的某句判断究竟用了哪类证据？是否把历史状态误当当前事实？</text>
<rect x="3864" y="7890" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="SC3"/>
<text x="3900" y="7942" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">3. 动态示例与 knowhow 只是参考</text>
<text x="3900" y="7998" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜场景 knowhow 说明处理范式；动态示例按本轮输入检索后临时注入。</text>
<text x="3900" y="8040" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">它们帮助模型选路和用工具，但不是实际车况，更不是某次动作已经发生的证据。</text>
<text x="3900" y="8104" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜示例展示“先查昨天地点再规划”，不能让模型复制示例里的城市、</text>
<text x="3900" y="8146" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">车牌或用户身份。</text>
<text x="3900" y="8210" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜检索错例、未注册工具、企业/环境隔离错误会诱发稳定的系统性 </text>
<text x="3900" y="8252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">badcase；只调温度或换模型可能无法修好。</text>
<text x="3900" y="8316" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜有无示例的保留集对照、错误检索案例、上下文长度和额外耗时是否一</text>
<text x="3900" y="8358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">起看？</text>
<rect x="5500" y="5770" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-task"/>
<text x="5532" y="5822" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">未来目标：旧 Goal 与新 Task</text>
<text x="5532" y="5880" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">旧链与新设计分开 · 不表示两套同时执行</text>
<rect x="5564" y="6230" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="TK1"/>
<text x="5600" y="6282" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">1. 先判断是以后做，不是现在做</text>
<text x="5600" y="6338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 </text>
<text x="5600" y="6380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 </text>
<text x="5600" y="6422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Task Service 接管异步目标。静态 Advisor 不因此消失。</text>
<text x="5600" y="6486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于</text>
<text x="5600" y="6528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不同生命周期。</text>
<text x="5600" y="6592" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 </text>
<text x="5600" y="6634" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Advisor 和新 Task 画成每个请求必经的两个串行模块。</text>
<text x="5600" y="6698" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？</text>
<rect x="5564" y="7060" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="TK2"/>
<text x="5600" y="7112" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">2. Task Agent 转发，服务内理解任务</text>
<text x="5600" y="7168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜新设计中 Planner 把任务类型和文本交 Task Agent，后者是代理</text>
<text x="5600" y="7210" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">入口；Ingress 做关联恢复、幂等与语义/事件/查询分流。Spec Builder 再识别</text>
<text x="5600" y="7252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">创建、修改或取消，生成命令和任务定义。</text>
<text x="5600" y="7316" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜创建“到达后提醒”时，Planner 不必直接生成完整 TaskSpec；</text>
<text x="5600" y="7358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Task 服务负责把目标、条件与动作变成可管理定义。</text>
<text x="5600" y="7422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜任务操作识别、目标定位和参数补齐可能失败。不能把“请求已转发”</text>
<text x="5600" y="7464" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">当成“任务已可靠创建”。</text>
<text x="5600" y="7528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜谁判断用户是在新增、改旧任务还是取消？多条同类任务时如何找对目</text>
<text x="5600" y="7570" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">标？</text>
<rect x="5564" y="7890" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="TK3"/>
<text x="5600" y="7942" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">3. Manager 管状态，Trigger Adapter 接条件</text>
<text x="5600" y="7998" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜Manager 管理数量、生命周期和策略；Repository 保存 Task、</text>
<text x="5600" y="8040" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Run、Event、Binding 等关联；Trigger Adapter 把可执行条件转换并注册到触</text>
<text x="5600" y="8082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">发系统。等待成立以后才可对用户承诺已建立任务。</text>
<text x="5600" y="8146" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜“到达游泳馆”要有可观测的条件和明确执行内容。只存了一段自</text>
<text x="5600" y="8188" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">然语言，却没注册可用条件，任务并不能真正等到未来。</text>
<text x="5600" y="8252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜新设计区分任务 waiting/running/closed 与单次 Run 的成功、失</text>
<text x="5600" y="8294" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">败、跳过、取消；等待用户或外部结果仍可能是一次运行中的阶段。</text>
<text x="5600" y="8358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜创建成功的证据是口头回复、Spec 生成，还是已持久化且条件订阅可</text>
<text x="5600" y="8400" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">用？</text>
<rect x="5564" y="8720" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="TK4"/>
<text x="5600" y="8772" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">4. 条件到来后，恢复运行并可靠回写</text>
<text x="5600" y="8828" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜触发事件关联原任务后创建/恢复本次 Run，再由 Runtime 分发。</text>
<text x="5600" y="8870" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">通用执行可走 Planner/Agent/Tool；GUI 或生态 Provider 可管理内部步骤，</text>
<text x="5600" y="8912" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不是所有任务都必须再次进 Planner。Result Hook 负责可靠回写与补偿。</text>
<text x="5600" y="8976" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜到达事件出现后再次确认任务未取消、条件仍适用，再发送提醒。</text>
<text x="5600" y="9018" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">一次提醒完成后是关闭还是回到等待，取决于一次性或周期性定义。</text>
<text x="5600" y="9082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜Task Query 提供只读状态；Message Dispatcher 负责消息通道，</text>
<text x="5600" y="9124" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不负责生命周期。推荐消息的 Binding 应先持久化，再用 recommend_id 恢复交</text>
<text x="5600" y="9166" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">互关联。</text>
<text x="5600" y="9230" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜重复回调、客户端迟到、取消后的旧结果和服务重启，能否仍找到同一</text>
<text x="5600" y="9272" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">个 Task/Run？</text>
<rect x="7200" y="5770" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-tools-contract"/>
<text x="7232" y="5822" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">工具内部机制：逐跳拆开问</text>
<text x="7232" y="5880" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">模型理解 / 业务校验 / 执行 / 回报，不合成一句“调用工具”</text>
<rect x="7264" y="6230" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="TC1"/>
<text x="7300" y="6282" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">1. 先数清口径，再研究重点工具</text>
<text x="7300" y="6338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜本地 SP 可见 27 个唯一工具定义；当前车型运行时可能注入更少，</text>
<text x="7300" y="6380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">后端支持集合也可能不同。工具名只是入口，不代表一个模型、一个服务或一个原子</text>
<text x="7300" y="6422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">接口。</text>
<text x="7300" y="6486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜一个 vehicle_basic_control 可能覆盖许多车控动作；因此“</text>
<text x="7300" y="6528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">有 27 个工具”不能推导出只有 27 个能力，也不能衡量 AI 强弱。</text>
<text x="7300" y="6592" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜没有拿到运行注册表、Schema 和下游实现时，只能说清定义与待核项，</text>
<text x="7300" y="6634" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不能编造具体模型规模、SDK 路径或权限层。</text>
<text x="7300" y="6698" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜定义数、注入数、可调用数、实际成功能力覆盖，是否分别统计？</text>
<rect x="7264" y="7060" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="TC2"/>
<text x="7300" y="7112" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">2. 每个工具必须能回答一张契约表</text>
<text x="7300" y="7168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜至少问清输入、内部理解、下游能力、前置条件、状态机、超时重试、</text>
<text x="7300" y="7210" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">反馈关联和成功证据。参数是自然语言还是结构化，决定错误可能发生在哪一层。</text>
<text x="7300" y="7274" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜路线工具从具体目的地到候选路线，再到选择后自动导航；这一串</text>
<text x="7300" y="7316" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">不能简写成“输入地址→输出路线”。</text>
<text x="7300" y="7380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜缺失取消接口、没有结构化状态、超时无法查询上一操作，都属于实质</text>
<text x="7300" y="7422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">边界，需要在产品方案中体现。</text>
<text x="7300" y="7486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜让负责人拿一个成功 Trace 和一个失败 Trace，能否逐跳对照输入、</text>
<text x="7300" y="7528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">输出与实际副作用？</text>
<rect x="7264" y="7890" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="TC3"/>
<text x="7300" y="7942" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">3. 不要平均钻研全部工具实现</text>
<text x="7300" y="7998" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜优先深入负责场景真正使用的工具：Planner/触发器主责要能定位和</text>
<text x="7300" y="8040" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">验收，车控、记忆、导航要懂内部业务状态；ASR、VLM、SDK 的底层训练或代码按实</text>
<text x="7300" y="8082" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">际问题再深入。</text>
<text x="7300" y="8146" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜“昨天游泳馆”至少要看记忆如何查、路线如何选、导航怎样确认；</text>
<text x="7300" y="8188" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">只背 27 个英文名无法发现“查到地点但没有开始导航”。</text>
<text x="7300" y="8252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜不必等所有底层实现都学完才考虑职业机会；但没有完整 Trace、可复</text>
<text x="7300" y="8294" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">现 badcase 和改进结果，也不能仅凭了解 prompt 证明可迁移能力。</text>
<text x="7300" y="8358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜你能独立解释最早出错点、提出改法、定义对照指标，并证明修复未损</text>
<text x="7300" y="8400" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">伤其他场景吗？</text>
<rect x="8900" y="5770" width="1220" height="270" rx="8" fill="#F2F6FC" stroke="#185DB7" stroke-width="3" data-node-id="H-vision-trigger"/>
<text x="8932" y="5822" font-size="34px" font-weight="750" fill="#0D4FA8" text-anchor="start">VLM 与云端条件判定</text>
<text x="8932" y="5880" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">视觉观察≠业务条件命中≠执行成功</text>
<rect x="8964" y="6230" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="VL1"/>
<text x="9000" y="6282" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">1. 按需看一眼：visual_qa</text>
<text x="9000" y="6338" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜用户提出视觉问题时，按请求方向采集对应画面，再由视觉能力回答</text>
<text x="9000" y="6380" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">可见内容。这是一次工具调用，结果回 07；不能把摄像头当互联网，也不能用它直接</text>
<text x="9000" y="6422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">读取车机屏幕。</text>
<text x="9000" y="6486" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜“外面那栋建筑是什么”需要正确方向与当前画面；若还要门票价</text>
<text x="9000" y="6528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">格，应再查外部资料，不能从图像直接得出现价。</text>
<text x="9000" y="6592" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜遮挡、错误视角、旧帧或画面不可见要明确表达。图像判断准确也不保</text>
<text x="9000" y="6634" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">证后续工具选择正确。</text>
<text x="9000" y="6698" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜模型看的是哪一帧？用户所指对象真在视野里吗？时延里采图和推理分</text>
<text x="9000" y="6740" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">别占多少？</text>
<rect x="8964" y="7060" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="VL2"/>
<text x="9000" y="7112" font-size="31px" font-weight="700" fill="#0D4FA8" text-anchor="start">2. 默认 AlwaysOn：持续提供场景观察</text>
<text x="9000" y="7168" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">这一步怎么做｜默认感知按已覆盖能力产生舱内外观察，经端数据中心等路径供 </text>
<text x="9000" y="7210" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">Context 使用。某次结果未达成，只说明当时没看到条件成立，不等于系统缺少这项</text>
<text x="9000" y="7252" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">观察能力。</text>
<text x="9000" y="7316" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">放进同一个例子｜默认能力已经能看某类舱内状态时，任务未命中应继续等默认观察；</text>
<text x="9000" y="7358" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">只有目标未覆盖时，才讨论额外专属观察。</text>
<text x="9000" y="7422" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">异常与交接｜开关、隐私、资源预算与结果新鲜度都影响能否使用。不能用一个“</text>
<text x="9000" y="7464" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">AlwaysOn 开了”代替具体能力覆盖表。</text>
<text x="9000" y="7528" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">产品要问清｜这是能力未覆盖，还是覆盖但当前未达成？证据来自哪份能力表和哪次</text>
<text x="9000" y="7570" font-size="27px" font-weight="400" fill="#19394D" text-anchor="start">观察？</text>
<rect x="8964" y="7890" width="1092" height="660" rx="8" fill="#FFFFFF" stroke="#A5B8C8" stroke-width="2" data-node-id="VL3"/>
