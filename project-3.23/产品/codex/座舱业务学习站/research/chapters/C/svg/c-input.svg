<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" role="img" aria-label="DT 一次推理看到什么：两块输入，各自从哪来"><title>DT 一次推理看到什么：两块输入，各自从哪来</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="960" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">DT 一次推理看到什么：两块输入，各自从哪来</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左边是系统提示词（每次都有的说明 + 按这句话填的材料），右边是对话部分</text><rect x="20" y="92" width="600" height="840" rx="10" fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="34" y="116" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">系统提示词：说明 + 按这句话填进去的材料</text><rect x="640" y="92" width="580" height="840" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="654" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">对话部分：过去几轮 + 这一轮</text><rect x="40" y="140" width="560" height="96" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="54" y="167" font-size="16" fill="#22384a" font-weight="650" text-anchor="start">固定说明</text><text x="54" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">人设、工具说明、注意事项、静态示例、车辆知识</text><text x="54" y="213" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">每次都一样，不随这句话变</text><rect x="40" y="272" width="560" height="96" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="54" y="299" font-size="16" fill="#6a4314" font-weight="650" text-anchor="start">用户记忆</text><text x="54" y="324" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">最前面是对话摘要；再是画像和召回的记忆</text><text x="54" y="345" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">来自记忆服务，只取在场人能看的</text><rect x="40" y="404" width="560" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="54" y="431" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车里看到的情况</text><text x="54" y="456" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">乘客列表以人脸结果为准，多出来的人删掉</text><text x="54" y="477" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">赛力斯带描述；上汽只写“主驾坐着谁”</text><rect x="40" y="536" width="560" height="96" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="54" y="563" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">参考示例</text><text x="54" y="588" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按这句话检索最像的 3 条处理案例</text><text x="54" y="609" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">专门修低频、零散的问题</text><rect x="40" y="668" width="560" height="96" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="54" y="695" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">能力说明（评测中）</text><text x="54" y="720" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">判断“这车做不到”时，补上相关能力说明</text><text x="54" y="741" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">目前只做评测，内容暂时写死在代码里</text><rect x="660" y="140" width="540" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="674" y="167" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">过去几轮（历史输入）</text><text x="674" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">30 分钟内最多 5 轮：用户的话、豆包的话、</text><text x="674" y="213" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">调过的工具和结果；穿插少量事件</text><rect x="660" y="300" width="540" height="150" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="674" y="327" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">这一轮的背景</text><text x="674" y="352" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">目标队列：豆包还在跟进的事</text><text x="674" y="373" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车辆状态：标明“最新，优先于历史”</text><text x="674" y="394" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">场景知识：小模型按场景挑的做事步骤</text><rect x="660" y="480" width="540" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="674" y="507" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">这一轮的输入</text><text x="674" y="532" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说的话 / 主动服务建议 / 事件 / 工具结果</text><text x="674" y="553" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">谁说的、坐哪、时间、离上一句多久</text><rect x="660" y="690" width="540" height="150" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="674" y="717" font-size="16" fill="#5c4c12" font-weight="650" text-anchor="start">这一轮变成“过去”以后</text><text x="674" y="742" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这一轮的背景不再保留，只留话和工具结果</text><text x="674" y="763" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车书、联网结果只在最后一轮保留原文</text><text x="674" y="784" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">被拒识、触发风控的轮次不进入下一次</text><path d="M930,640 L930,690" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/></g></svg>