<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1180" viewBox="0 0 1240 1180" role="img" aria-label="Planner 想一次的 7 步：从接住输入到读回结果" data-node-count="9">
  <title>Planner 想一次的 7 步：从接住输入到读回结果</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
    <path fill="#ffffff" d="M0,0 H1240 V1180 H0 Z" data-decoration="true" />
    <text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">Planner 想一次的 7 步：从接住输入到读回结果</text>
    <text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左列是云端 Planner 自己做的事，按编号读；右列是 Planner 交出去或接进来的东西</text>
    <path fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" d="M20,92 H740 V1152 H20 Z" data-decoration="true" />
    <text x="34" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端 Planner（对话推理引擎）</text>
    <rect x="790" y="414" width="400" height="330" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" />
    <path fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" d="M760,92 H1220 V1152 H760 Z" data-decoration="true" />
    <text x="774" y="116" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">Planner 的上下游</text>
    <rect x="40" y="130" width="660" height="104" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <circle cx="60" cy="152" r="12" fill="#4a9670" />
    <text x="60" y="157" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text>
    <text x="80" y="157" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">接住这一轮</text>
    <text x="54" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户的话 / 系统建议 / 工具反馈 / 事件，可拼接</text>
    <text x="54" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">建议不用回应；反馈不是新要求；被打断的话按规则补</text>
    <path d="M370,234 L370,272" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="40" y="272" width="660" height="104" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <circle cx="60" cy="294" r="12" fill="#4a9670" />
    <text x="60" y="299" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text>
    <text x="80" y="299" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">带着说明书想</text>
    <text x="54" y="324" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">固定部分：角色、工具、输出格式、注意事项、示例、</text>
    <text x="54" y="345" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">能力边界、聊天风格；现填部分：车况、记忆、相关示例</text>
    <path d="M370,376 L370,414" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="40" y="414" width="660" height="104" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <circle cx="60" cy="436" r="12" fill="#4a9670" />
    <text x="60" y="441" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text>
    <text x="80" y="441" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">结合背景推理</text>
    <text x="54" y="466" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">下雨不开窗、空调已开不再开、人名改成座位</text>
    <text x="54" y="487" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">缺能查到的事实先查，不猜；这车能不能做</text>
    <path d="M370,518 L370,556" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="40" y="556" width="660" height="104" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <circle cx="60" cy="578" r="12" fill="#4a9670" />
    <text x="60" y="583" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text>
    <text x="80" y="583" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">定任务类型</text>
    <text x="54" y="608" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">即时任务：单步或多步，现在办</text>
    <text x="54" y="629" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">定时、条件、持续：查合理性后交任务系统</text>
    <path d="M370,660 L370,698" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="40" y="698" width="660" height="104" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <circle cx="60" cy="720" r="12" fill="#4a9670" />
    <text x="60" y="725" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text>
    <text x="80" y="725" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">写出决策</text>
    <text x="54" y="750" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说不说、说什么（含语气标签）、表情、动作列表</text>
    <text x="54" y="771" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同一轮动作同时下发；有依赖的分到下一轮</text>
    <path d="M370,802 L370,840" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="40" y="840" width="660" height="104" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <circle cx="60" cy="862" r="12" fill="#4a9670" />
    <text x="60" y="867" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text>
    <text x="80" y="867" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">兜底</text>
    <text x="54" y="892" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">强制格式且固定顺序；风控换安全话术</text>
    <text x="54" y="913" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">防套取说明书；自我否定冲破上限的处理</text>
    <path d="M370,944 L370,982" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <rect x="40" y="982" width="660" height="104" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true" />
    <circle cx="60" cy="1004" r="12" fill="#4a9670" />
    <text x="60" y="1009" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text>
    <text x="80" y="1009" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">读回结果（下一轮的读法）</text>
    <text x="54" y="1034" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具反馈到这里判断：确认 / 换办法 / 继续，再从 1 开始</text>
    <text x="54" y="1055" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同一轮多个工具等齐再统一说；步数超过 20 就不再调工具</text>
    <rect x="790" y="130" width="400" height="104" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6" data-node="true" />
    <text x="804" y="157" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">上游：输入管理（M 章）</text>
    <text x="804" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">决定什么时候送进来、几条合并</text>
    <text x="804" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">背景材料由 Context 备好（C 章）</text>
    <path d="M790,182 L700,182" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M727.65,157 H762.35 V178 H727.65 Z" data-decoration="true" />
    <text x="745" y="173" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">送进</text>
    <text x="804" y="441" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">以后的事：任务系统（T 章）</text>
    <text x="804" y="466" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">登记条件，到点把任务原文作为</text>
    <text x="804" y="487" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">系统建议送回 Planner</text>
    <path d="M700,466 L790,466" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M727.65,441 H762.35 V462 H727.65 Z" data-decoration="true" />
    <text x="745" y="457" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">登记</text>
    <text x="804" y="667" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">播报（O 章）</text>
    <text x="804" y="692" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">话边生成边合成</text>
    <text x="804" y="713" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">统一由 Planner 说</text>
    <text x="1014" y="667" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">工具执行（E 章）</text>
    <text x="1014" y="692" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按动作列表</text>
    <text x="1014" y="713" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同时去办</text>
    <path d="M700,690 L790,690" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M721.475,665 H768.525 V686 H721.475 Z" data-decoration="true" />
    <text x="745" y="681" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">说的话</text>
    <path d="M700,726 L720,726 L720,770 L1095,770 L1095,744" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M870.3,763 H929.7 V784 H870.3 Z" data-decoration="true" />
    <text x="900" y="779" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">动作列表</text>
    <path d="M1190,692 L1205,692 L1205,1000 L700,1000" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" />
    <path fill="#ffffff" fill-opacity=".92" d="M970.3,975 H1029.7 V996 H970.3 Z" data-decoration="true" />
    <text x="1000" y="991" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">工具反馈</text>
    <path d="M1205,470 L1215,470 L1215,150 L1190,150" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" />
    <text x="1210" y="300" font-size="13" fill="#4b5560" font-weight="500" text-anchor="end">到点</text>
    <text x="1210" y="318" font-size="13" fill="#4b5560" font-weight="500" text-anchor="end">回来</text>
    <path d="M40,1000 L28,1000 L28,160 L40,160" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" />
    <text x="380" y="1110" font-size="14" fill="#1d4b35" font-weight="600" text-anchor="middle">虚线：结果回来，从步骤 1 再走一轮（研发叫 ReAct）</text>
    <text x="32" y="1170" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start">绿：Planner 决策步骤　　灰：上下游交接　　实线箭头：交办　　虚线箭头：结果或任务回流</text>
  </g>
</svg>
