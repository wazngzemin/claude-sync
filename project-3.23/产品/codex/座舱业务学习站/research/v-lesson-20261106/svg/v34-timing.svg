<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="690" viewBox="0 0 1300 690" role="img" aria-label="补了一句话：判停计时、提前准备和正式提交怎样对上"><title>补了一句话：判停计时、提前准备和正式提交怎样对上</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1300" height="690" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">补了一句话：判停计时、提前准备和正式提交怎样对上</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">横轴是时间（秒）。例句：“带我去昨天那家游泳馆……附近的餐厅”</text><line x1="210" y1="100" x2="210" y2="650" stroke="#edf2f6" stroke-width="1"/><text x="210" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">0s</text><line x1="450" y1="100" x2="450" y2="650" stroke="#edf2f6" stroke-width="1"/><text x="450" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">1s</text><line x1="690" y1="100" x2="690" y2="650" stroke="#edf2f6" stroke-width="1"/><text x="690" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">2s</text><line x1="930" y1="100" x2="930" y2="650" stroke="#edf2f6" stroke-width="1"/><text x="930" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">3s</text><line x1="1170" y1="100" x2="1170" y2="650" stroke="#edf2f6" stroke-width="1"/><text x="1170" y="96" font-size="12" fill="#8394a3" font-weight="400" text-anchor="middle">4s</text><text x="30" y="146" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">用户的声音</text><line x1="200" y1="170" x2="1280" y2="170" stroke="#e3eaf0" stroke-width="1"/><text x="30" y="231" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">第一遍识别出的字</text><line x1="200" y1="255" x2="1280" y2="255" stroke="#e3eaf0" stroke-width="1"/><text x="30" y="321" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">停顿计时（判停）</text><line x1="200" y1="345" x2="1280" y2="345" stroke="#e3eaf0" stroke-width="1"/><text x="30" y="426" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上发出的请求</text><line x1="200" y1="450" x2="1280" y2="450" stroke="#e3eaf0" stroke-width="1"/><text x="30" y="551" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">云端准备的结果</text><line x1="200" y1="575" x2="1280" y2="575" stroke="#e3eaf0" stroke-width="1"/><rect x="210" y="118" width="432.0" height="44" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="224" y="145" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">带我去昨天那家游泳馆</text><rect x="738.0" y="118" width="240.0" height="44" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="752.0" y="145" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">附近的餐厅</text><text x="690.0" y="145" font-size="12" fill="#a0522d" font-weight="600" text-anchor="middle">停 400ms</text><circle cx="354.0" cy="225" r="5" fill="#4a9670"/><text x="354.0" y="252" font-size="13" fill="#1d4b35" font-weight="500" text-anchor="middle">“带我去”</text><circle cx="642.0" cy="225" r="5" fill="#4a9670"/><text x="642.0" y="252" font-size="13" fill="#1d4b35" font-weight="500" text-anchor="middle">“…游泳馆”</text><circle cx="978.0" cy="225" r="5" fill="#4a9670"/><text x="978.0" y="252" font-size="13" fill="#1d4b35" font-weight="500" text-anchor="middle">“…附近的餐厅”</text><rect x="642.0" y="303" width="96.0" height="22" rx="3" fill="#fde3c4"/><rect x="978.0" y="303" width="144.0" height="22" rx="3" fill="#fde3c4"/><line x1="714.0" y1="296" x2="714.0" y2="333" stroke="#c8873a" stroke-width="2.5"/><text x="714.0" y="350" font-size="12" fill="#c8873a" font-weight="650" text-anchor="middle">300 毫秒</text><line x1="1050.0" y1="296" x2="1050.0" y2="333" stroke="#c8873a" stroke-width="2.5"/><text x="1050.0" y="350" font-size="12" fill="#c8873a" font-weight="650" text-anchor="middle">300 毫秒</text><line x1="1122.0" y1="296" x2="1122.0" y2="333" stroke="#c45c5c" stroke-width="2.5"/><text x="1122.0" y="290" font-size="12" fill="#c45c5c" font-weight="650" text-anchor="middle">600 毫秒</text><text x="742.0" y="290" font-size="12" fill="#a0522d" font-weight="500" text-anchor="start">又开口，计时清零</text><line x1="714.0" y1="333" x2="714.0" y2="400" stroke="#9fb2c2" stroke-width="1" stroke-dasharray="4 4"/><line x1="714.0" y1="400" x2="670" y2="400" stroke="#9fb2c2" stroke-width="1" stroke-dasharray="4 4"/><rect x="560" y="400" width="225" height="72" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="574" y="427" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">第 1 次提前准备</text><text x="574" y="452" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“带我去昨天那家游泳馆”</text><line x1="1050.0" y1="333" x2="1050.0" y2="400" stroke="#9fb2c2" stroke-width="1" stroke-dasharray="4 4"/><line x1="1050.0" y1="400" x2="925" y2="400" stroke="#9fb2c2" stroke-width="1" stroke-dasharray="4 4"/><rect x="815" y="400" width="225" height="72" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="829" y="427" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">第 2 次提前准备</text><text x="829" y="452" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“…游泳馆附近的餐厅”</text><line x1="1158.0" y1="333" x2="1158.0" y2="400" stroke="#9fb2c2" stroke-width="1" stroke-dasharray="4 4"/><line x1="1158.0" y1="400" x2="1175" y2="400" stroke="#9fb2c2" stroke-width="1" stroke-dasharray="4 4"/><rect x="1065" y="400" width="225" height="72" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="1079" y="427" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">正式提交</text><text x="1079" y="452" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">定稿文字出来后发出</text><path d="M672,472 L672,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="560" y="520" width="225" height="76" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="574" y="547" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">准备了“去泳馆”</text><text x="574" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">目标不是最终意思，不会被复用</text><path d="M927,472 L927,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="815" y="520" width="225" height="76" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="829" y="547" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">准备了“泳馆附近的餐厅”</text><text x="829" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">准备结果先存着</text><path d="M1177,472 L1177,520" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1065" y="520" width="225" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="1079" y="547" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">定稿和第 2 次一模一样</text><text x="1079" y="572" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">→ 直接用第 2 次的准备</text><text x="1079" y="593" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不一样就重新算</text></g></svg>