<svg xmlns="http://www.w3.org/2000/svg" width="930" height="2778" viewBox="0 0 930 2778" role="img" aria-label="语音输入与判停"><title>语音输入与判停</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M500,226 L500,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="388" y="322" width="115" height="44" rx="3" fill="#fff"/><text x="393" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="393" dy="0">权限及场景允许</tspan></text><path d="M500,644 L500,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="358" y="740" width="145" height="44" rx="3" fill="#fff"/><text x="363" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="363" dy="0">处理后的音频与音区</tspan></text><path d="M500,1062 L500,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="403" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="408" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="408" dy="0">进入交互</tspan></text><path d="M435,1480 L435,1518 L300,1518 L300,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="203" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="208" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="208" dy="0">短停顿候选</tspan></text><path d="M235,1898 L235,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="108" y="1994" width="130" height="44" rx="3" fill="#fff"/><text x="113" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="113" dy="0">语义完整：预请求</tspan></text><path d="M565,1480 L565,2072 L760,2072 L760,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="563" y="1785" width="175" height="44" rx="3" fill="#fff"/><text x="568" y="1809" font-size="15" fill="#435c70" font-weight="400"><tspan x="568" dy="0">继续识别并等待正式判停</tspan></text><path d="M365,1898 L365,1936 L534,1936 L534,2082 L630,2082 L630,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="377" y="1994" width="160" height="44" rx="3" fill="#fff"/><text x="382" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="382" dy="0">语义未完整：继续收音</tspan></text><path d="M235,2316 L235,2552" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="2412" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="2436" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">缓存前置结果</tspan></text><path d="M695,2316 L695,2354 L365,2354 L365,2552" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="363" y="2412" width="100" height="44" rx="3" fill="#fff"/><text x="368" y="2436" font-size="15" fill="#435c70" font-weight="400"><tspan x="368" dy="0">正式文字到达</tspan></text><a href="#module/V/step/V01"><g data-step="V01"><rect x="305" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="305" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="325" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="325" dy="0">V01</tspan></text><text x="325" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="325" dy="0">检查语音是否可用</tspan></text><text x="325" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="325" dy="0">车端语音入口</tspan></text><text x="325" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="325" dy="0">可收音，或明确的不可用提示</tspan></text></g></a><a href="#module/V/step/V02"><g data-step="V02"><rect x="305" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="305" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="325" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="325" dy="0">V02</tspan></text><text x="325" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="325" dy="0">把人声从车内声音中分离</tspan></text><text x="325" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="325" dy="0">车端声学模块</tspan></text><text x="325" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="325" dy="0">处理后的音频与说话音区</tspan></text></g></a><a href="#module/V/step/V03"><g data-step="V03"><rect x="305" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="305" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="325" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="325" dy="0">V03</tspan></text><text x="325" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="325" dy="0">接受唤醒或项目允许的免唤醒输入</tspan></text><text x="325" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="325" dy="0">车端交互入口</tspan></text><text x="325" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="325" dy="0">属于当前交互的一段音频</tspan></text></g></a><a href="#module/V/step/V04"><g data-step="V04"><rect x="305" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="305" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="325" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="325" dy="0">V04</tspan></text><text x="325" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="325" dy="0">边听边返回过程文字</tspan></text><text x="325" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="325" dy="0">ASR 语音识别</tspan></text><text x="325" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="325" dy="0">过程文字及随后产生的最终识别结果</tspan></text></g></a><a href="#module/V/step/V05"><g data-step="V05"><rect x="105" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">V05</tspan></text><text x="125" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">短暂停顿后尝试预请求</tspan></text><text x="125" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">端侧判停</tspan></text><text x="125" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">预请求 Query</tspan></text></g></a><a href="#module/V/step/V06"><g data-step="V06"><rect x="40" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">V06</tspan></text><text x="60" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">提前计算拒识、意图与简单复杂判断</tspan></text><text x="60" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">AIDV 预请求接口</tspan></text><text x="60" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">可复用的前置结果</tspan></text></g></a><a href="#module/V/step/V07"><g data-step="V07"><rect x="500" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="500" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="520" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="520" dy="0">V07</tspan></text><text x="520" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="520" dy="0">确认句尾，取得正式文字</tspan></text><text x="520" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="520" dy="0">端侧判停与 ASR</tspan></text><text x="520" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="520" dy="0">正式 Query、request_id、round_id、音区</tspan></text></g></a><a href="#module/V/step/V08"><g data-step="V08"><rect x="105" y="2552" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="2552" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="2581" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">V08</tspan></text><text x="125" y="2613" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">核对预请求结果能否复用</tspan></text><text x="125" y="2655" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">云端入口</tspan></text><text x="125" y="2694" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">正式输入及已完成的前置判断</tspan></text></g></a></g></svg>