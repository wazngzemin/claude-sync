<svg xmlns="http://www.w3.org/2000/svg" width="1913" height="1558" viewBox="0 0 1913 1558" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arrow-627E9F" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#627E9F"/></marker></defs><rect width="1913" height="1558" fill="#F8FAFD"/><text x="44" y="48" font-size="30" font-weight="650" fill="#163352" xml:space="preserve">E · 工具执行｜动作落实、状态回流、真实结果核验</text><text x="44" y="84" font-size="20" font-weight="400" fill="#62758A" xml:space="preserve">主回路仅 E→M→D；受理、流结束、业务完成和用户听见分别记录</text><polyline points="613,249 743,249" fill="none" stroke="white" stroke-width="7"/><polyline points="613,249 743,249" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1143,249 1273,249" fill="none" stroke="white" stroke-width="7"/><polyline points="1143,249 1273,249" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="743,249 723.8421052631579,249 723.8421052631579,1198.1739130434783 413,1198.1739130434783 413,1214" fill="none" stroke="white" stroke-width="7"/><polyline points="743,249 723.8421052631579,249 723.8421052631579,1198.1739130434783 413,1198.1739130434783 413,1214" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1473,358 1473,488" fill="none" stroke="white" stroke-width="7"/><polyline points="1473,358 1473,488" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1273,597 1143,597" fill="none" stroke="white" stroke-width="7"/><polyline points="1273,597 1143,597" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="743,597 613,597" fill="none" stroke="white" stroke-width="7"/><polyline points="743,597 613,597" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1473,706 1473,721.8260869565217 632.1578947368421,721.8260869565217 632.1578947368421,1351 613,1351" fill="none" stroke="white" stroke-width="7"/><polyline points="1473,706 1473,721.8260869565217 632.1578947368421,721.8260869565217 632.1578947368421,1351 613,1351" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="413,706 413,836" fill="none" stroke="white" stroke-width="7"/><polyline points="413,706 413,836" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="613,960 743,960" fill="none" stroke="white" stroke-width="7"/><polyline points="613,960 743,960" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1143,960 1273,960" fill="none" stroke="white" stroke-width="7"/><polyline points="1143,960 1273,960" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="213,1351 197.44444444444446,1351 197.44444444444446,597 213,597" fill="none" stroke="white" stroke-width="7"/><polyline points="213,1351 197.44444444444446,1351 197.44444444444446,597 213,597" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1273,1351 1143,1351" fill="none" stroke="white" stroke-width="7"/><polyline points="1273,1351 1143,1351" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="743,1351 613,1351" fill="none" stroke="white" stroke-width="7"/><polyline points="743,1351 613,1351" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><rect x="213" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="233" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E1</text><text x="233" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">接动作列表，核对调用身份</text><text x="233" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">解析 tool_name、action_content</text><text x="233" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">每个动作关联唯一调用标识</text><text x="233" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">保留原用户目标与本轮身份</text><text x="233" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">格式失败不能当执行成功</text><rect x="743" y="140" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="763" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E2</text><text x="763" y="202" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">找本项目已发布可用实现</text><text x="763" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">定义名→渠道/应用/环境实现</text><text x="763" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">检查启用、版本及权限</text><text x="763" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">未接入与临时失败要分清</text><text x="763" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">工具全集展开见下方40行清单</text><rect x="1273" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1293" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E3</text><text x="1293" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">获得发布许可，按同轮规则发出</text><text x="1293" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">先通过 M 的输出/副作用许可</text><text x="1293" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">登记调用后才对外发动作</text><text x="1293" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">独立工具并发，互斥工具串行</text><text x="1293" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">动态加载与准入条件展开见 F</text><rect x="1273" y="488" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1293" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E4</text><text x="1293" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">交单个 Agent 执行内部业务</text><text x="1293" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">取依赖→选执行器→调用服务</text><text x="1293" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">统一响应，再做业务后处理</text><text x="1293" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">UI/模型/语音三路内容分开</text><text x="1293" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">具体流程按工具合同，不一刀切</text><rect x="743" y="488" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="763" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E5</text><text x="763" y="550" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">返回的是受理、处理中还是完成</text><text x="763" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">车控执行、任务注册、订单确认不同</text><text x="763" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">生成中不写成图片/报告已出</text><text x="763" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Agent is_finish 只表流结束</text><text x="763" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">按业务状态字段继续追踪</text><rect x="213" y="488" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="233" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E6</text><text x="233" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">把执行事实返回，保留错误原因</text><text x="233" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">查询：值、候选、时间及范围</text><text x="233" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">执行：对象、动作与当前状态</text><text x="233" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">失败：明确原因/错误码/部分结果</text><text x="233" y="667" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不要把工具文字直接当最终播报</text><rect x="213" y="836" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="233" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E7</text><text x="233" y="898" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">同批反馈汇集，</text><text x="233" y="928" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">迟到和缺失有归属</text><text x="233" y="967" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">新 DT 主链路等同批结果到齐</text><text x="233" y="993" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">明确终止/超时不能假装已完成</text><text x="233" y="1019" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">结果按原调用身份关联</text><text x="233" y="1045" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">独立异步 feedback 一期仍有缺口</text><rect x="743" y="836" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="763" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E8</text><text x="763" y="898" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">反馈只经输入管理回到</text><text x="763" y="928" font-size="24" font-weight="600" fill="#163352" xml:space="preserve"> Director</text><text x="763" y="967" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">完整反馈作为下一轮输入</text><text x="763" y="993" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">由 M 决定排队、预算和外显</text><text x="763" y="1019" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不在 E 内另起推理大脑</text><text x="763" y="1045" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">用户新话优先级仍需处理</text><rect x="1273" y="836" width="400" height="248" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="1293" y="864" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E9</text><text x="1293" y="898" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">结果核对口：交给 D12 判断</text><text x="1293" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">还差哪一步，由 Director 判断</text><text x="1293" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">成功部分、待确认部分各标清</text><text x="1293" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不从这里直接生成新工具动作</text><text x="1293" y="1015" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">跳到 D12 看下一轮决策</text><rect x="1273" y="1214" width="400" height="274" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1293" y="1242" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E10</text><text x="1293" y="1276" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">统一话语权，</text><text x="1293" y="1306" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">按项目保留直返例外</text><text x="1293" y="1345" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">新 DT 主链路由 D 统一播报</text><text x="1293" y="1371" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">旧 direct_return 需配置依据</text><text x="1293" y="1397" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Fallback 回 D；Redirect 指向 </text><text x="1293" y="1423" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Agent</text><text x="1293" y="1449" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">三路输出与例外机制见 F</text><rect x="743" y="1214" width="400" height="274" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="763" y="1242" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E11</text><text x="763" y="1276" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">核对用户真正获得的结果</text><text x="763" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">车端真实状态是否改变</text><text x="763" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">卡片/图片/订单是否实际可见</text><text x="763" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">声音是否真正播到用户</text><text x="763" y="1393" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">结果错位回流评测与问题上报</text><rect x="213" y="1214" width="400" height="274" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="233" y="1242" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">E12</text><text x="233" y="1276" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">失败出口：少承诺，不盲目重试</text><text x="233" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">区分不可用、超时、拒绝和部分成功</text><text x="233" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">有安全替代则交 D 重新规划</text><text x="233" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">部分工具明确请勿重复调用</text><text x="233" y="1393" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">取消不回滚，人工接管需说明</text><rect x="625.3157894736842" y="252.35384615384615" width="105.36842105263167" height="60" rx="3" fill="#FFFFFF"/><text x="631.3157894736842" y="276.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">找对应实</text><text x="631.3157894736842" y="300.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">现</text><rect x="1155.3157894736842" y="252.35384615384615" width="105.36842105263167" height="60" rx="3" fill="#FFFFFF"/><text x="1161.3157894736842" y="276.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">可用且合</text><text x="1161.3157894736842" y="300.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">法</text><rect x="720.0526315789474" y="420.3999999999998" width="168.72514619883043" height="60" rx="3" fill="#FFFFFF"/><text x="726.0526315789474" y="444.3999999999998" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">未接入/禁用/无</text><text x="726.0526315789474" y="468.3999999999998" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">权限</text><rect x="1467.6666666666667" y="410.5652173913044" width="166.66666666666652" height="36" rx="3" fill="#FFFFFF"/><text x="1473.6666666666667" y="434.5652173913044" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">发布合法调用</text><rect x="1155.3157894736842" y="600.3538461538461" width="105.36842105263167" height="60" rx="3" fill="#FFFFFF"/><text x="1161.3157894736842" y="624.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">收到阶段</text><text x="1161.3157894736842" y="648.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">状态</text><rect x="625.3157894736842" y="600.3538461538461" width="105.36842105263167" height="60" rx="3" fill="#FFFFFF"/><text x="631.3157894736842" y="624.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">返回真实</text><text x="631.3157894736842" y="648.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">阶段事实</text><rect x="640.3684210526316" y="787.939130434783" width="185.9649122807018" height="36" rx="3" fill="#FFFFFF"/><text x="646.3684210526316" y="811.939130434783" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">明确执行失败</text><rect x="407.66666666666663" y="758.5652173913044" width="166.66666666666663" height="36" rx="3" fill="#FFFFFF"/><text x="413.66666666666663" y="782.5652173913044" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">汇集本批结果</text><rect x="625.3157894736842" y="951.8153846153846" width="105.36842105263167" height="84" rx="3" fill="#FFFFFF"/><text x="631.3157894736842" y="975.8153846153846" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">整批可进</text><text x="631.3157894736842" y="999.8153846153846" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">入后续判</text><text x="631.3157894736842" y="1023.8153846153846" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">断</text><rect x="1155.3157894736842" y="951.8153846153846" width="105.36842105263167" height="84" rx="3" fill="#FFFFFF"/><text x="1161.3157894736842" y="975.8153846153846" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">交接结果</text><text x="1161.3157894736842" y="999.8153846153846" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">，不直接</text><text x="1161.3157894736842" y="1023.8153846153846" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">执行</text><rect x="36.111111111111114" y="953.0051282051282" width="166.66666666666666" height="36" rx="3" fill="#FFFFFF"/><text x="42.111111111111114" y="977.0051282051282" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">失败也必须回流</text><rect x="1155.3157894736842" y="1343.2153846153847" width="105.36842105263167" height="84" rx="3" fill="#FFFFFF"/><text x="1161.3157894736842" y="1367.2153846153847" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">呈现后核</text><text x="1161.3157894736842" y="1391.2153846153847" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">对实际结</text><text x="1161.3157894736842" y="1415.2153846153847" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">果</text><rect x="625.3157894736842" y="1355.2153846153847" width="105.36842105263167" height="60" rx="3" fill="#FFFFFF"/><text x="631.3157894736842" y="1379.2153846153847" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">实际与回</text><text x="631.3157894736842" y="1403.2153846153847" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">包不一致</text></svg>