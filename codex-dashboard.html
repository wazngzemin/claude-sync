<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex 独立同步管理</title>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--sf:#1c2129;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--accentd:#1f6feb;--green:#3fb950;--greend:#238636;--red:#f85149;--orange:#d29922}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:22px 26px}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .header h1{font-size:22px;font-weight:600;display:flex;align-items:center;gap:11px}.logo{width:34px;height:34px;background:linear-gradient(160deg,#3684f5,#a870ff);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .status{font-size:13px;color:var(--dim)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.dot.ok{background:var(--green)}.dot.off{background:var(--red)}
  .hint{background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.25);border-radius:9px;padding:11px 14px;font-size:13px;color:#c9d7e6;margin-bottom:16px;line-height:1.6}.hint b{color:var(--accent)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.btn{padding:9px 16px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13.5px;cursor:pointer;transition:.13s;display:flex;align-items:center;gap:7px;user-select:none}.btn:hover{background:var(--sf);border-color:var(--dim)}.btn:active{transform:scale(.97)}.btn-push{background:var(--accentd);border-color:var(--accent);font-weight:600}.btn-push:hover{background:var(--accent);color:#fff}.btn-pull{background:var(--greend);border-color:var(--green);font-weight:600}.btn-pull:hover{background:var(--green);color:#fff}.btn-sm{padding:7px 11px;font-size:12.5px}
  .summary{font-size:12.5px;color:var(--dim);margin:0 0 12px;line-height:1.6}.summary pre{white-space:pre-wrap;margin:6px 0;color:#b9c8d8}.search input,.search select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px}.search input{min-width:260px;flex:1}.search{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .layout{display:grid;grid-template-columns:minmax(300px,34%) 1fr;gap:14px;min-height:620px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}.list{max-height:680px;overflow:auto}.project-group{border-bottom:1px solid var(--border)}.project-group summary{padding:10px 13px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;background:rgba(88,166,255,.05);font-size:13px;font-weight:600}.project-group summary::-webkit-details-marker{display:none}.project-group summary:before{content:'▾';color:var(--accent);margin-right:7px}.project-group:not([open]) summary:before{content:'▸'}.group-count{color:var(--dim);font-size:11px;font-weight:400}.item{padding:11px 13px;border-bottom:1px solid rgba(48,54,61,.55);cursor:pointer}.item:hover,.item.active{background:var(--sf)}.item-title{font-size:13.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{font-size:11.5px;color:var(--dim);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}.badge{background:rgba(88,166,255,.13);border:1px solid rgba(88,166,255,.25);border-radius:4px;padding:1px 5px;color:#b9d8ff}.badge.warn{background:rgba(210,153,34,.14);border-color:rgba(210,153,34,.32);color:#e6c56b}
  .project-index{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}.project-chip{border:1px solid var(--border);border-radius:999px;padding:5px 10px;background:var(--surface);color:#c9d7e6;font-size:12px}.project-chip strong{color:var(--accent);font-weight:600}.project-chip.muted{color:var(--dim)}
  .detail{padding:16px;max-height:720px;overflow:auto}.detail h2{font-size:18px;line-height:1.4;margin-bottom:7px}.detail-sub{font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:14px;white-space:pre-wrap}.event{border:1px solid var(--border);border-radius:8px;margin:8px 0;background:rgba(255,255,255,.02);overflow:hidden}.event summary{padding:9px 11px;cursor:pointer;color:#c9d7e6;font-size:12.5px}.event.user{border-color:rgba(88,166,255,.35)}.event.assistant{border-color:rgba(63,185,80,.28)}.event-body{padding:0 11px 11px;color:#d7e1eb;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.event-body pre{margin:0;white-space:pre-wrap;color:#b9c8d8;font-size:11.5px;line-height:1.45}.event-copy{float:right;padding:3px 7px;border:1px solid var(--border);background:transparent;color:var(--dim);border-radius:5px;cursor:pointer}.empty{padding:30px 16px;text-align:center;color:var(--dim);font-size:13px}
  .toasts{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}.toast{padding:13px 18px;border-radius:10px;font-size:13.5px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:pre-line}.toast.ok{background:var(--greend);border:1px solid var(--green)}.toast.fail{background:#5c1a1a;border:1px solid var(--red)}.toast.info{background:var(--surface);border:1px solid var(--border)}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:998;backdrop-filter:blur(4px)}.box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px 40px;text-align:center;min-width:300px}.spin{width:46px;height:46px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 18px}@keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.list{max-height:360px}}
</style>
</head>
<body>
<div class="header"><h1><span class="logo">⌘</span> Codex 独立同步管理</h1><div class="status"><span><span class="dot off" id="dot"></span><span id="stxt">读取中…</span></span></div></div>
<div class="hint">这是独立的 Codex 页面，使用 <b>~/.codex-sync</b> 仓库；Claude Code 页面仍在 <b>http://localhost:9527/</b>。公司电脑点「导出并推送」，家里电脑点「拉取并恢复」。网页镜像不会直接修改正在运行的 Codex 数据库。</div>
<div class="toolbar"><button class="btn btn-push" onclick="codexAction('push')">📤 导出并推送</button><button class="btn btn-pull" onclick="codexAction('pull')">📥 拉取并恢复</button><button class="btn btn-sm" onclick="codexAction('export')">🧾 只导出快照</button><button class="btn btn-sm" onclick="codexNativeImport()">🧩 导入/替换家里 Codex</button><button class="btn btn-sm" onclick="loadCodex()">🔄 刷新</button></div>
<div class="summary" id="codexSummary">正在读取 Codex 快照状态…</div>
<div class="search"><input id="codexQuery" placeholder="搜索标题、用户消息和助手回答" onkeydown="if(event.key==='Enter')loadCodexList()"><select id="codexArchived" onchange="loadCodexList()"><option value="all">全部任务</option><option value="active">未归档</option><option value="archived">已归档</option></select><button class="btn btn-sm" onclick="loadCodexList()">搜索</button></div>
<div class="project-index" id="projectIndex"></div>
<div class="layout"><div class="panel"><div class="list" id="codexList"><div class="empty">还没有 Codex 快照，请先导出。</div></div></div><div class="panel"><div class="detail" id="codexDetail"><div class="empty">选择左侧任务查看完整事件。</div></div></div></div>
<div class="toasts" id="toasts"></div><div class="ov" id="ov" style="display:none"><div class="box"><div class="spin"></div><div id="ovt" style="font-size:16px;font-weight:500">同步中…</div><div id="ovs" style="font-size:13px;color:var(--dim);margin-top:6px"></div></div></div>
<script>
const API=location.origin;let codexActiveId='';let codexCopyBuffer=[];let codexThreadMeta=null;let codexThreadEvents=[];let codexThreadOffset=0;let codexThreadHasMore=false;
function toast(m,t='info'){const c=document.getElementById('toasts');const d=document.createElement('div');d.className='toast '+t;d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),6000)}
function showOv(t,s){document.getElementById('ovt').textContent=t;document.getElementById('ovs').textContent=s;document.getElementById('ov').style.display='flex'}function hideOv(){document.getElementById('ov').style.display='none'}
function formatBytes(n){n=Number(n||0);if(n<1024)return `${n} B`;if(n<1024*1024)return `${(n/1024).toFixed(1)} KB`;if(n<1024*1024*1024)return `${(n/1024/1024).toFixed(1)} MB`;return `${(n/1024/1024/1024).toFixed(2)} GB`}
function formatTime(v){if(!v)return '—';const d=new Date(typeof v==='number'&&v<100000000000?v*1000:v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function text(v){if(typeof v==='string')return v;if(Array.isArray(v))return v.map(text).filter(Boolean).join('\n');if(!v||typeof v!=='object')return '';for(const k of ['text','input_text','output_text','summary'])if(typeof v[k]==='string')return v[k];return v.content?text(v.content):''}
function visible(e){const p=e&&e.payload||e||{};if(e&&e.type==='response_item')return text(p.content);if(e&&e.type==='message')return text(p);return ''}function role(e){return e&&e.type==='response_item'?(e.payload&&e.payload.role||''):''}
async function loadCodex(){try{const st=await fetch(API+'/api/codex/status').then(r=>r.json());renderSummary(st);document.getElementById('dot').className='dot ok';document.getElementById('stxt').textContent='Codex 服务正常';await loadCodexList()}catch(e){document.getElementById('dot').className='dot off';document.getElementById('stxt').textContent='服务异常';document.getElementById('codexSummary').textContent='Codex 服务读取失败：'+e.message}}
function renderSummary(st){const s=st.snapshot||{};if(!st.manifest_exists){document.getElementById('codexSummary').textContent=`同步仓库：${st.repo||'~/.codex-sync'}；尚未生成快照。当前数据库：${st.databases&&st.databases.state?'已发现':'未发现'}`;return}const warn=[];if(s.reconstructed_count)warn.push(`重建 ${s.reconstructed_count}`);if(s.missing_count)warn.push(`缺失 ${s.missing_count}`);if(s.unstable_count)warn.push(`不稳定 ${s.unstable_count}`);if((s.sensitive_paths||[]).length)warn.push(`敏感文件名 ${s.sensitive_paths.length}`);const paths=[...(s.missing_paths||[]),...(s.unstable_paths||[])].slice(0,20);const pathHtml=paths.length?`<details><summary>查看缺失/不稳定路径（最多 20 条）</summary><pre>${paths.map(esc).join('\n')}</pre></details>`:'';document.getElementById('codexSummary').innerHTML=`快照 ${formatTime(s.exported_at)} · ${s.thread_count||0} 条任务 · ${s.project_count||0} 个项目 · 同步文件 ${s.snapshot_file_count||0} · 数据 ${formatBytes(s.snapshot_bytes)} · 原始 ${formatBytes(s.raw_source_bytes)} · 压缩 ${formatBytes(s.raw_archive_bytes)}${warn.length?' · <span style="color:#e6c56b">'+esc(warn.join('，'))+'</span>':''}${pathHtml}`}
function renderCodexItem(item){const badges=[];if(item.is_pinned)badges.push('<span class="badge">置顶</span>');if(item.archived)badges.push('<span class="badge warn">已归档</span>');if(item.coverage==='reconstructed')badges.push('<span class="badge warn">重建</span>');if(item.section_name)badges.push(`<span class="badge">分组：${esc(item.section_name)}</span>`);return `<div class="item ${item.thread_id===codexActiveId?'active':''}" onclick="openThread('${esc(item.thread_id)}')"><div class="item-title">${esc(item.title||'未命名任务')}</div><div class="item-meta">${badges.join('')}<span>${esc(item.cwd||'')}</span><span>${formatTime(item.updated_at_ms||item.updated_at)}</span></div></div>`}
function renderProjectIndex(items,projects){const isPinned=item=>Boolean(item.pinned||item.is_pinned);const counts=new Map();items.forEach(item=>{if(isPinned(item))return;const key=item.project_id&&String(item.project_id)||'__unassigned__';counts.set(key,(counts.get(key)||0)+1)});const chips=[];const pinnedCount=items.filter(isPinned).length;if(pinnedCount)chips.push('<span class="project-chip pinned">置顶 <strong>'+pinnedCount+'</strong></span>');(projects||[]).forEach(p=>chips.push('<span class="project-chip">'+esc(p.name||'未命名项目')+' <strong>'+(counts.get(String(p.project_id))||0)+'</strong></span>'));const unassigned=counts.get('__unassigned__')||0;if(unassigned)chips.push('<span class="project-chip muted">未归类任务 <strong>'+unassigned+'</strong></span>');document.getElementById('projectIndex').innerHTML=chips.join('')}
function renderCodexGroups(items,projects,hasQuery){const isPinned=item=>Boolean(item.pinned||item.is_pinned);const groups=new Map();groups.set('__pinned__',{name:'置顶',position:-1,items:[]});(projects||[]).forEach(p=>groups.set(String(p.project_id),{name:p.name||'未命名项目',position:Number.isFinite(Number(p.position))?Number(p.position):1000000,items:[]}));groups.set('__unassigned__',{name:'未归类任务',position:1000001,items:[]});items.forEach(item=>{if(isPinned(item)){groups.get('__pinned__').items.push(item);return}const key=item.project_id&&groups.has(String(item.project_id))?String(item.project_id):'__unassigned__';groups.get(key).items.push(item)});return [...groups.values()].filter(g=>g.position!==-1||g.items.length).filter(g=>g.items.length||!hasQuery).sort((a,b)=>a.position-b.position||a.name.localeCompare(b.name,'zh-CN')).map(g=>'<details open class="project-group"><summary><span>'+esc(g.name)+'</span><span class="group-count">'+g.items.length+' 条任务</span></summary><div>'+(g.items.length?g.items.map(renderCodexItem).join(''):'<div class="empty">这个项目暂无匹配任务。</div>')+'</div></details>').join('')}
async function loadCodexList(){const query=document.getElementById('codexQuery').value||'';const q=encodeURIComponent(query);const archived=encodeURIComponent(document.getElementById('codexArchived').value||'all');try{const data=await fetch(`${API}/api/codex/sidebar?q=${q}&archived=${archived}&limit=1000`).then(r=>r.json());if(data.error)throw new Error(data.error);const items=data.items||[];renderProjectIndex(items,data.projects||[]);const el=document.getElementById('codexList');if(!items.length){el.innerHTML='<div class="empty">没有匹配的 Codex 任务。</div>';return}el.innerHTML=renderCodexGroups(items,data.projects||[],Boolean(query.trim()))}catch(e){document.getElementById('codexList').innerHTML=`<div class="empty">读取失败：${esc(e.message)}</div>`}}
async function openThread(id){codexActiveId=id;codexThreadMeta=null;codexThreadEvents=[];codexThreadOffset=0;codexThreadHasMore=false;document.getElementById('codexDetail').innerHTML='<div class="empty">正在读取完整会话…</div>';loadCodexList();try{const data=await fetch(API+'/api/codex/thread/'+encodeURIComponent(id)+'?offset=0&limit=200').then(r=>r.json());if(data.error)throw new Error(data.error);renderDetail(data,false)}catch(e){document.getElementById('codexDetail').innerHTML=`<div class="empty">读取失败：${esc(e.message)}</div>`}}
function renderDetail(data,append){const m=data.meta||codexThreadMeta||{};if(!append){codexThreadMeta=m;codexThreadEvents=[]}codexThreadEvents=codexThreadEvents.concat(data.events||[]);codexThreadOffset=Number(data.next_offset||codexThreadEvents.length);codexThreadHasMore=Boolean(data.has_more);codexCopyBuffer=[];const html=codexThreadEvents.map((e,i)=>{const r=role(e),v=visible(e),type=e&&e.type||'event',raw=JSON.stringify(e,null,2),copy=codexCopyBuffer.push(v||raw)-1,button=`<button class="event-copy" onclick="copyEvent(${copy})">复制</button>`,body=v?`${button}<div>${esc(v)}</div>`:`${button}<pre>${esc(raw)}</pre>`;return `<details class="event ${esc(r)}" ${r?'open':''}><summary>${i+1}. ${esc(r?r+' · '+type:type)}</summary><div class="event-body">${body}</div></details>`}).join('');const more=codexThreadHasMore?`<button class="btn btn-sm" onclick="loadMore()">加载更多事件（已加载 ${codexThreadEvents.length}）</button>`:'';document.getElementById('codexDetail').innerHTML=`<h2>${esc(m.title||'未命名任务')}</h2><div class="detail-sub">${esc((m.cwd||'')+'\n'+formatTime(m.created_at_ms||m.created_at)+' → '+formatTime(m.updated_at_ms||m.updated_at)+'\n已加载事件 '+codexThreadEvents.length+' · 覆盖状态 '+(m.coverage||'unknown'))}</div>${html||'<div class="empty">没有可解析的事件。</div>'}<div style="display:flex;gap:8px;margin-top:14px">${more}<a class="btn btn-sm" href="${API}/api/codex/thread/${encodeURIComponent(codexActiveId)}/raw">下载原始 JSONL.gz</a></div>`}
async function loadMore(){if(!codexActiveId||!codexThreadHasMore)return;try{const d=await fetch(API+'/api/codex/thread/'+encodeURIComponent(codexActiveId)+`?offset=${codexThreadOffset}&limit=200`).then(r=>r.json());if(d.error)throw new Error(d.error);renderDetail(d,true)}catch(e){toast('继续读取失败：'+e.message,'fail')}}
async function copyEvent(i){try{await navigator.clipboard.writeText(codexCopyBuffer[i]||'');toast('已复制','ok')}catch(e){toast('复制失败，请手动选择文本','fail')}}
async function codexAction(action,confirmSensitive=false){const labels={push:'导出并推送',pull:'拉取并恢复',export:'导出快照'};showOv(labels[action]||action,'Codex 数据量较大，首次导出可能需要一段时间');try{const data=await fetch(API+'/api/codex/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm_sensitive:confirmSensitive,restore:true,include_history:true})}).then(r=>r.json());hideOv();if(data.snapshot)renderSummary(data);if(data.needs_confirmation){const s=data.snapshot||{};const nameNote=(s.sensitive_paths||[]).length?`另外发现 ${(s.sensitive_paths||[]).length} 个疑似敏感文件名。\n\n`:'';if(confirm(`快照已生成：${s.thread_count||0} 条任务，约 ${formatBytes(s.snapshot_bytes)}。\n\n${nameNote}会话正文可能包含公司或第三方敏感信息。确认数据合规后继续推送吗？`))return codexAction(action,true);toast('已停止推送，快照保留在本机','info');return}if(data.error){toast(data.error,'fail');return}if(data.push&&data.push.status==='fail'){toast(data.push.message,'fail');return}toast(data.message||'Codex 操作完成','ok');loadCodex()}catch(e){hideOv();toast('Codex 操作失败：'+e.message,'fail')}}
async function codexNativeImport(replaceExisting=false){if(!replaceExisting&&!confirm('请确认家里的 Codex 已完全退出。\n\n如果家里已有侧边栏记录，工具会先备份，再询问是否替换；不会直接删除。继续检查吗？'))return;showOv(replaceExisting?'正在备份并替换家里 Codex…':'正在检查家里 Codex…','请不要启动 Codex');try{const data=await fetch(API+'/api/codex/import-native',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm_closed:true,replace_existing:replaceExisting})}).then(r=>r.json());hideOv();if(data.needs_replace_confirmation){const counts=data.state_counts||{};const history=data.history_counts||{};const stateTotal=Object.values(counts).reduce((a,b)=>a+Number(b||0),0);const historyTotal=Object.values(history).reduce((a,b)=>a+Number(b||0),0);if(confirm(`检测到家里已有 Codex 数据：\n\n${stateTotal} 条侧边栏相关记录，${historyTotal} 条历史记录。\n\n点击“确定”后，会先备份到 ~/.codex-sync-backups，再用公司的快照替换家里原生侧边栏。\n\n确定替换吗？`))return codexNativeImport(true);toast('已取消替换，家里原有数据未改动','info');return}if(data.error||data.status==='fail'){toast(data.error||data.message||'原生导入失败','fail');return}toast(data.message||'原生导入完成','ok')}catch(e){hideOv();toast('原生导入失败：'+e.message,'fail')}}
loadCodex();
</script>
</body>
</html>
