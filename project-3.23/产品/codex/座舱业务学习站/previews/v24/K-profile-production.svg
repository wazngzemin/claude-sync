  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">相关记忆如何整理成可预注入的用户画像</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,188 350,254" marker-end="url(#arrow-K-profile-production)"><title>kf1 → kf2：本次要填的标签范围</title></polyline><polyline class="arr" fill="none" points="350,346 350,412" marker-end="url(#arrow-K-profile-production)"><title>kf2 → kf3：候选历史片段及主体</title></polyline><polyline class="arr" fill="none" points="350,536 350,602" marker-end="url(#arrow-K-profile-production)"><title>kf3 → kf4：与本人和标签相关的有效记忆</title></polyline><polyline class="arr" fill="none" points="350,726 350,792" marker-end="url(#arrow-K-profile-production)"><title>kf4 → kf5：去重、合并后的字段内容</title></polyline><polyline class="arr" fill="none" points="350,884 350,950" marker-end="url(#arrow-K-profile-production)"><title>kf5 → kf6：用户画像背景</title></polyline><text class="ts" x="365" y="224" text-anchor="start" dominant-baseline="central">E1 · 本次要填的标签范围</text><text class="ts" x="365" y="382" text-anchor="start" dominant-baseline="central">E2 · 候选历史片段及主体</text><text class="ts" x="365" y="572" text-anchor="start" dominant-baseline="central">E3 · 与本人和标签相关的有效记忆</text><text class="ts" x="365" y="762" text-anchor="start" dominant-baseline="central">E4 · 去重、合并后的字段内容</text><text class="ts" x="365" y="920" text-anchor="start" dominant-baseline="central">E5 · 用户画像背景</text><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-profile-production" data-step="kf1" aria-label="确定当前用户与目标标签"><title>例如用车偏好 → 空调 → 温度</title><rect x="180" y="106" width="340" height="78" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">确定当前用户与目标标签</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">例如用车偏好 → 空调 → 温度</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-profile-production" data-step="kf2" aria-label="取得相关历史记忆片段"><title>只处理与目标标签有关的材料</title><rect x="180" y="264" width="340" height="78" rx="6"/><text class="th" x="198" y="288" text-anchor="start" dominant-baseline="central">取得相关历史记忆片段</text><text class="ts" x="198" y="316" text-anchor="start" dominant-baseline="central">只处理与目标标签有关的材料</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-profile-production" data-step="kf3" aria-label="过滤其他人的偏好和无关内容"><title>女儿喜欢粉色不能成为车主偏好；没有有效证据则输出空列表</title><rect x="180" y="422" width="340" height="110" rx="6"/><text class="th" x="198" y="446" text-anchor="start" dominant-baseline="central">过滤其他人的偏好和无关内容</text><text class="ts" x="198" y="474" text-anchor="start" dominant-baseline="central">女儿喜欢粉色不能成为车主偏好</text><text class="ts" x="198" y="493" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="512" text-anchor="start" dominant-baseline="central">没有有效证据则输出空列表</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-profile-production" data-step="kf4" aria-label="按类别合并与更新"><title>多歌手可并存；档位取最新；出行日与时段分别存放</title><rect x="180" y="612" width="340" height="110" rx="6"/><text class="th" x="198" y="636" text-anchor="start" dominant-baseline="central">按类别合并与更新</text><text class="ts" x="198" y="664" text-anchor="start" dominant-baseline="central">多歌手可并存；档位取最新</text><text class="ts" x="198" y="683" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="702" text-anchor="start" dominant-baseline="central">出行日与时段分别存放</text></g><g class="c-teal" role="link" tabindex="0" data-page="K" data-flow="K-profile-production" data-step="kf5" aria-label="输出结构化画像"><title>按大类、小类、子类输出列表值</title><rect x="180" y="802" width="340" height="78" rx="6"/><text class="th" x="198" y="826" text-anchor="start" dominant-baseline="central">输出结构化画像</text><text class="ts" x="198" y="854" text-anchor="start" dominant-baseline="central">按大类、小类、子类输出列表值</text></g><g class="c-gray" role="link" tabindex="0" data-page="K" data-flow="K-profile-production" data-step="kf6" aria-label="进入允许使用的预注入上下文"><title>Director 将其作为当前决策背景；明确本轮要求仍需单独理解和执行</title><rect x="180" y="960" width="340" height="110" rx="6"/><text class="th" x="198" y="984" text-anchor="start" dominant-baseline="central">进入允许使用的预注入上下文</text><text class="ts" x="198" y="1012" text-anchor="start" dominant-baseline="central">Director 将其作为当前决策背景</text><text class="ts" x="198" y="1031" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1050" text-anchor="start" dominant-baseline="central">明确本轮要求仍需单独理解和执行</text></g><text class="th" x="40" y="1154" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1184" text-anchor="start" dominant-baseline="central">E1 确定当前用户与目标标签 → 取得相关历史记忆片段：本次要填的标签范围</text><text class="ts" x="40" y="1217" text-anchor="start" dominant-baseline="central">E2 取得相关历史记忆片段 → 过滤其他人的偏好和无关内容：候选历史片段及主体</text><text class="ts" x="40" y="1250" text-anchor="start" dominant-baseline="central">E3 过滤其他人的偏好和无关内容 → 按类别合并与更新：与本人和标签相关的有效记忆</text><text class="ts" x="40" y="1283" text-anchor="start" dominant-baseline="central">E4 按类别合并与更新 → 输出结构化画像：去重、合并后的字段内容</text><text class="ts" x="40" y="1316" text-anchor="start" dominant-baseline="central">E5 输出结构化画像 → 进入允许使用的预注入上下文：用户画像背景</text></svg>