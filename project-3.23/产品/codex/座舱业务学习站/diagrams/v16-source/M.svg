/tspan></text><text x="591" y="388" font-size="16" fill="#566975" font-weight="400"><tspan x="591" dy="0">带来源的输入</tspan></text></g></a><a href="#module/M/step/M02"><g data-step="M02"><rect x="571" y="664" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="571" y="664" width="5" height="182" rx="2" fill="#326785"/><text x="591" y="693" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="591" dy="0">M02</tspan></text><text x="591" y="725" font-size="20" fill="#203b50" font-weight="600"><tspan x="591" dy="0">检查推理、完整输出和起播状态</tspan></text><text x="591" y="767" font-size="16" fill="#375b71" font-weight="400"><tspan x="591" dy="0">输入管理</tspan></text><text x="591" y="806" font-size="16" fill="#566975" font-weight="400"><tspan x="591" dy="0">本轮所处阶段</tspan></text></g></a><a href="#module/M/step/M03"><g data-step="M03"><rect x="532" y="1082" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="532" y="1082" width="5" height="182" rx="2" fill="#326785"/><text x="552" y="1111" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="552" dy="0">M03</tspan></text><text x="552" y="1143" font-size="20" fill="#203b50" font-weight="600"><tspan x="552" dy="0">空闲时直接开始下一轮</tspan></text><text x="552" y="1185" font-size="16" fill="#375b71" font-weight="400"><tspan x="552" dy="0">输入管理</tspan></text><text x="552" y="1224" font-size="16" fill="#566975" font-weight="400"><tspan x="552" dy="0">可处理的输入批次</tspan></text></g></a><a href="#module/M/step/M04"><g data-step="M04"><rect x="992" y="1082" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="992" y="1082" width="5" height="182" rx="2" fill="#326785"/><text x="1012" y="1111" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1012" dy="0">M04</tspan></text><text x="1012" y="1143" font-size="20" fill="#203b50" font-weight="600"><tspan x="1012" dy="0">尚未完整输出且未起播：合并重算</tspan></text><text x="1012" y="1185" font-size="16" fill="#375b71" font-weight="400"><tspan x="1012" dy="0">输入管理</tspan></text><text x="1012" y="1224" font-size="16" fill="#566975" font-weight="400"><tspan x="1012" dy="0">新旧输入合并后的内容</tspan></text></g></a><a href="#module/M/step/M05"><g data-step="M05"><rect x="1452" y="1082" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1452" y="1082" width="5" height="182" rx="2" fill="#326785"/><text x="1472" y="1111" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1472" dy="0">M05</tspan></text><text x="1472" y="1143" font-size="20" fill="#203b50" font-weight="600"><tspan x="1472" dy="0">用户新话到来：打断并保留已发生事实</tspan></text><text x="1472" y="1185" font-size="16" fill="#375b71" font-weight="400"><tspan x="1472" dy="0">输入管理</tspan></text><text x="1472" y="1224" font-size="16" fill="#566975" font-weight="400"><tspan x="1472" dy="0">用户新话、被打断信息、已下发状态</tspan></text></g></a><a href="#module/M/step/M06"><g data-step="M06"><rect x="72" y="1082" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="72" y="1082" width="5" height="182" rx="2" fill="#326785"/><text x="92" y="1111" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="92" dy="0">M06</tspan></text><text x="92" y="1143" font-size="20" fill="#203b50" font-weight="600"><tspan x="92" dy="0">其他输入在当前轮后排队</tspan></text><text x="92" y="1185" font-size="16" fill="#375b71" font-weight="400"><tspan x="92" dy="0">输入管理</tspan></text><text x="92" y="1224" font-size="16" fill="#566975" font-weight="400"><tspan x="92" dy="0">等待中的有效消息</tspan></text></g></a><a href="#module/M/step/M07"><g data-step="M07"><rect x="40" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">M07</tspan></text><text x="60" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">把有效插话与已播信息一起交回</tspan></text><text x="60" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">前序打断处理</tspan></text><text x="60" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">有效新 Query 与被打断信息</tspan></text></g></a><a href="#module/M/step/M08"><g data-step="M08"><rect x="571" y="1500" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="571" y="1500" width="5" height="182" rx="2" fill="#326785"/><text x="591" y="1529" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="591" dy="0">M08</tspan></text><text x="591" y="1561" font-size="20" fill="#203b50" font-weight="600"><tspan x="591" dy="0">提交这一轮完整输入批次</tspan></text><text x="591" y="1603" font-size="16" fill="#375b71" font-weight="400"><tspan x="591" dy="0">输入管理 → Director</tspan></text><text x="591" y="1642" font-size="16" fill="#566975" font-weight="400"><tspan x="591" dy="0">当前轮输入批次</tspan></text></g></a></g></svg>