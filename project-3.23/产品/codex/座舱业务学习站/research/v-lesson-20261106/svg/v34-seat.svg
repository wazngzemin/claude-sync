<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="“记住我的驾驶位置”：车机存位置，豆包只记“哪个位置是干什么的”"><title>“记住我的驾驶位置”：车机存位置，豆包只记“哪个位置是干什么的”</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="660" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">“记住我的驾驶位置”：车机存位置，豆包只记“哪个位置是干什么的”</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">《豆包记忆和车机记忆打通方案》需求 2：座椅、方向盘、后视镜</text><rect x="30" y="92" width="540" height="440" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车机本地（赛力斯账号体系）</text><rect x="630" y="92" width="540" height="440" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="644" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">豆包云端</text><rect x="50" y="140" width="500" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="167" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">实际位置数据</text><text x="64" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">存在车机账号下：坐姿 1/2/3</text><text x="64" y="213" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不同步云端，也不开放给豆包</text><rect x="50" y="256" width="500" height="150" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="283" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车机开放的 4 个能力</text><text x="64" y="308" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">保存到指定坐姿</text><text x="64" y="329" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">保存当前位置（返回是坐姿几）</text><text x="64" y="350" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">给坐姿改名</text><text x="64" y="371" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">调整到指定坐姿</text><rect x="650" y="140" width="500" height="72" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="664" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">用户说</text><text x="664" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“保存这个位置，这是我的驾驶位置”</text><rect x="650" y="232" width="500" height="72" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="664" y="259" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">让车机“保存当前位置”</text><text x="664" y="284" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">把当前位置保存下来</text><rect x="650" y="324" width="500" height="92" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="664" y="351" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">记忆写入</text><text x="664" y="376" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">坐姿 1 = 驾驶位</text><rect x="650" y="436" width="500" height="80" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="664" y="463" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">以后说“调到我的驾驶位置”</text><text x="664" y="488" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 查记忆 → 改写成“座椅调整到坐姿 1”</text><path d="M900,212 L900,232" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M650,268 L590,268 L590,300 L550,300" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="602.65" y="247.0" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="620.0" y="263.0" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">调用</text><path d="M550,380 L600,380 L600,370 L650,370" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="545.3" y="359.0" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="575.0" y="375.0" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">坐姿 1</text><path d="M900,416 L900,436" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M650,490 L575,490 L575,395 L550,395" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="570.45" y="469.0" width="84.1" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="612.5" y="485.0" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">调到坐姿 1</text><rect x="30" y="560" width="1140" height="80" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="587" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">边界</text><text x="44" y="612" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只有用户说出用途才写记忆（手动点保存不记，11/4 倾向）；方向盘、后视镜随坐姿 1 一起打包是 11/3 暂定方案；离线不支持</text></g></svg>