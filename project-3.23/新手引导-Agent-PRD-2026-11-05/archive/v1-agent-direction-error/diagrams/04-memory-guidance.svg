<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1807" viewBox="0 0 1660 1807">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1807" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">Case 2  记忆能力引导</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">介绍怎样使用记忆；与检索旧记忆生成开箱问候分别处理</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户说出个人信息、偏好或记忆诉求</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">先区分当前说话人与信息指向</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不把转述他人的偏好写入当前账号</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">是否属于明确的记忆读写请求？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">例如：记住我喜欢吃川菜</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">明确请求优先执行，不反复介绍功能</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">是</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">DT 正常执行读写</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">按真实工具反馈回应</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">成功后更新使用事实</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">否</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">是否属于适合介绍记忆的相关话题？</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">结合当前表达与必要的近期语境</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不先强制检索一条已有记忆</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">无关／语境不足</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不插入能力介绍</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不自动保存信息</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">相关</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">该账号是否仍有引导资格？</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">检查使用、告知、拒绝与次数</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">检索为空不能证明首次使用</text><line x1="1020" y1="862.0" x2="1186" y2="862.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="849.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="794" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="834" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">无需引导／未知</text><text x="1218" y="872" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">正常对话继续</text><text x="1218" y="903" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不计一次告知</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="970.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">有资格</text><rect x="100" y="997" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 建议 DT 介绍记忆能力</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">用当前场景说明能解决什么问题</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">询问是否希望记住这项信息</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1200" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">用户是否同意进行记忆操作？</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">按照记忆模块的身份与授权要求处理</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不把随口表达自动当授权</text><line x1="1020" y1="1268.0" x2="1186" y2="1268.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="1255.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否</text><rect x="1190" y="1200" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="1240" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">拒绝／依赖不足</text><text x="1218" y="1278" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不写入记忆</text><text x="1218" y="1309" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">记录真实处理结果</text><line x1="560.0" y1="1338" x2="560.0" y2="1399" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="1376.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">同意</text><rect x="100" y="1403" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1443" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 调用记忆能力并接收反馈</text><text x="128" y="1481" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">工具成功才说明已经记住</text><text x="128" y="1512" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">超时与无结果分别处理</text><line x1="560.0" y1="1541" x2="560.0" y2="1602" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1606" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1646" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">Agent 分开记录告知与业务成功</text><text x="128" y="1684" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">未实际说出的其他引导不扣次数</text><text x="128" y="1715" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">同轮与身份引导冲突时只保留适当一段</text>
</svg>