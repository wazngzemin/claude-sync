<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1476" viewBox="0 0 1760 1476" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arrow-627E9F" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#627E9F"/></marker></defs><rect width="1760" height="1476" fill="#F8FAFD"/><text x="44" y="48" font-size="30" font-weight="650" fill="#163352" xml:space="preserve">G · 云端触发器｜什么时候值得继续处理</text><text x="44" y="84" font-size="20" font-weight="400" fill="#62758A" xml:space="preserve">任务/Advisor/预设/显示共用触发基础；唤醒、判断、执行策略、动作出口四步分开。10月 Workflow 与 Action 改造为方案状态。</text><polyline points="460,236 590,236" fill="none" stroke="white" stroke-width="7"/><polyline points="460,236 590,236" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,236 1120,236" fill="none" stroke="white" stroke-width="7"/><polyline points="990,236 1120,236" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,332 1320,462" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,332 1320,462" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1120,571 990,571" fill="none" stroke="white" stroke-width="7"/><polyline points="1120,571 990,571" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,571 460,571" fill="none" stroke="white" stroke-width="7"/><polyline points="590,571 460,571" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,680 790,695.8260869565217 1320,695.8260869565217 1320,810" fill="none" stroke="white" stroke-width="7"/><polyline points="790,680 790,695.8260869565217 1320,695.8260869565217 1320,810" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="260,680 260,810" fill="none" stroke="white" stroke-width="7"/><polyline points="260,680 260,810" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="260,680 260,695.8260869565217 790,695.8260869565217 790,810" fill="none" stroke="white" stroke-width="7"/><polyline points="260,680 260,695.8260869565217 790,695.8260869565217 790,810" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="460,571 479.1578947368421,571 479.1578947368421,794.1739130434783 1320,794.1739130434783 1320,810" fill="none" stroke="white" stroke-width="7"/><polyline points="460,571 479.1578947368421,571 479.1578947368421,794.1739130434783 1320,794.1739130434783 1320,810" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1520,919 1535.5555555555557,919 1535.5555555555557,236 1520,236" fill="none" stroke="white" stroke-width="7"/><polyline points="1520,919 1535.5555555555557,919 1535.5555555555557,236 1520,236" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="260,332 260,347.82608695652175 1100.842105263158,347.82608695652175 1100.842105263158,1282 1120,1282" fill="none" stroke="white" stroke-width="7"/><polyline points="260,332 260,347.82608695652175 1100.842105263158,347.82608695652175 1100.842105263158,1282 1120,1282" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,1158 1320,1142.1739130434783 260,1142.1739130434783 260,1028" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,1158 1320,1142.1739130434783 260,1142.1739130434783 260,1028" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,571 1009.1578947368421,571 1009.1578947368421,1282 990,1282" fill="none" stroke="white" stroke-width="7"/><polyline points="990,571 1009.1578947368421,571 1009.1578947368421,1282 990,1282" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,1282 570.8421052631579,1282 570.8421052631579,713.9130434782609 260,713.9130434782609 260,680" fill="none" stroke="white" stroke-width="7"/><polyline points="590,1282 570.8421052631579,1282 570.8421052631579,713.9130434782609 260,713.9130434782609 260,680" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,1158 790,1043.8260869565217 1320,1043.8260869565217 1320,1028" fill="none" stroke="white" stroke-width="7"/><polyline points="790,1158 790,1043.8260869565217 1320,1043.8260869565217 1320,1028" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,1028 790,1043.8260869565217 479.1578947368421,1043.8260869565217 479.1578947368421,1282 460,1282" fill="none" stroke="white" stroke-width="7"/><polyline points="790,1028 790,1043.8260869565217 479.1578947368421,1043.8260869565217 479.1578947368421,1282 460,1282" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><rect x="60" y="140" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G01</text><text x="80" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">接收场景与业务关系</text><text x="80" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">来源：任务系统或配置后台</text><text x="80" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">保存条件、动作与生效范围</text><text x="80" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">场景必须能对应到原业务</text><rect x="590" y="140" width="400" height="192" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="610" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G02</text><text x="610" y="202" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">这辆车能用这个场景吗</text><text x="610" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">核对渠道、车辆、车型和版本</text><text x="610" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">核对平台状态与本车任务开关</text><text x="610" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">能力或范围缺失不默认放行</text><rect x="1120" y="140" width="400" height="192" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G03</text><text x="1140" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">哪个信号叫醒这次检查</text><text x="1140" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">动态条件关注一次状态变化</text><text x="1140" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">静态条件读取当前状态</text><text x="1140" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">视觉条件监听指定描述更新</text><rect x="1120" y="462" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="490" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G04</text><text x="1140" y="524" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">取本轮真正需要的状态</text><text x="1140" y="563" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">按业务对象取本轮信号</text><text x="1140" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">车况/导航/媒体/座舱/车机五域</text><text x="1140" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">位置主键、枚举、数值单位要对齐</text><text x="1140" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">缺失、失败、旧值不可当事实</text><rect x="590" y="462" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="610" y="490" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G05</text><text x="610" y="524" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">逐步判断条件是否达成</text><text x="610" y="563" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">结构化字段走规则比较</text><text x="610" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">caption交目标语义判断</text><text x="610" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Workflow汇合AND / OR分支</text><text x="610" y="641" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">PASS / REJECT / UNKNOWN</text><rect x="60" y="462" width="400" height="218" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="80" y="490" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G06</text><text x="80" y="524" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">本次允许发出去吗</text><text x="80" y="563" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">核对执行次数与最小间隔</text><text x="80" y="589" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">处理场景优先级及出口竞争</text><text x="80" y="615" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">命中、策略拦截分别留记录</text><rect x="60" y="810" width="400" height="218" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="80" y="838" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G07</text><text x="80" y="872" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">用户任务回调任务系统</text><text x="80" y="911" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">通知哪条任务、什么条件已满足</text><text x="80" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">任务系统再生成本次 advice</text><text x="80" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">触发成功不代表已提醒或已控车</text><rect x="590" y="810" width="400" height="218" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="610" y="838" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G08</text><text x="610" y="872" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">统一派发场景配置的 Action</text><text x="610" y="911" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">Advisor / Recommend / 业务事件</text><text x="610" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">闪念 / PHUD 等独立出口</text><text x="610" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">10/21方案：Action Dispatcher</text><text x="610" y="989" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不再固定只回 TaskService</text><rect x="1120" y="810" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="838" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G09</text><text x="1140" y="872" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">不触发也要知道原因</text><text x="1140" y="911" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">明确不满足：记录后继续等待</text><text x="1140" y="937" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">缺数据或推理失败：记录未知</text><text x="1140" y="963" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">下次有效信号到来再检查</text><rect x="1120" y="1158" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="1186" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G10</text><text x="1140" y="1220" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">时间触发：到时</text><text x="1140" y="1250" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">回调，不直接控车</text><text x="1140" y="1289" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">一次/周期时间注册到调度</text><text x="1140" y="1315" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">到时只回业务方继续处理</text><text x="1140" y="1341" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">取消需注销后续计划</text><text x="1140" y="1367" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">跨行程恢复不能凭定时器推定</text><rect x="590" y="1158" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="1186" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G11</text><text x="610" y="1220" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">语义推理只判断目标是否可见</text><text x="610" y="1259" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">目标+当前caption，核对象位置</text><text x="610" y="1285" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">达成/未达成/无法判断</text><text x="610" y="1311" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">无置信度；不负责播报结束</text><text x="610" y="1337" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">8/31版并发推理，不中断旧请求</text><rect x="60" y="1158" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="1186" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">G12</text><text x="80" y="1220" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">把有意义的状态变化写业务事件</text><text x="80" y="1259" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">预置条件用有变更，保留前后值</text><text x="80" y="1285" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">匹配时刻不等于端采样/上报时刻</text><text x="80" y="1311" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">模板拼接事件，不必调用大模型</text><text x="80" y="1337" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">调试client-event不自动进模型</text><rect x="472.3157894736842" y="238.95384615384614" width="105.36842105263162" height="60" rx="3" fill="#FFFFFF"/><text x="478.3157894736842" y="262.95384615384614" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">登记后等</text><text x="478.3157894736842" y="286.95384615384614" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">待运行</text><rect x="1002.3157894736842" y="238.95384615384614" width="105.36842105263167" height="60" rx="3" fill="#FFFFFF"/><text x="1008.3157894736842" y="262.95384615384614" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">范围与开</text><text x="1008.3157894736842" y="286.95384615384614" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">关有效</text><rect x="1314.6666666666667" y="384.5652173913044" width="166.66666666666652" height="36" rx="3" fill="#FFFFFF"/><text x="1320.6666666666667" y="408.5652173913044" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">相关信号到达</text><rect x="1002.3157894736842" y="574.3538461538461" width="105.36842105263167" height="60" rx="3" fill="#FFFFFF"/><text x="1008.3157894736842" y="598.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">交出本轮</text><text x="1008.3157894736842" y="622.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">证据</text><rect x="472.3157894736842" y="574.3538461538461" width="105.36842105263162" height="36" rx="3" fill="#FFFFFF"/><text x="478.3157894736842" y="598.3538461538461" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">终点通过</text><rect x="948.3333333333333" y="702.6086956521739" width="213.33333333333348" height="36" rx="3" fill="#FFFFFF"/><text x="954.3333333333333" y="726.6086956521739" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">不满足或未知</text><rect x="254.66666666666663" y="732.5652173913044" width="166.66666666666669" height="36" rx="3" fill="#FFFFFF"/><text x="260.66666666666663" y="756.5652173913044" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">用户任务出口</text><rect x="418.3333333333333" y="690.6086956521739" width="213.33333333333331" height="36" rx="3" fill="#FFFFFF"/><text x="424.3333333333333" y="714.6086956521739" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">预置场景出口</text><rect x="803.3333333333334" y="762.5217391304348" width="189.40350877192975" height="36" rx="3" fill="#FFFFFF"/><text x="809.3333333333334" y="786.5217391304348" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">策略拦截</text><rect x="1530.2222222222222" y="564.851282051282" width="166.66666666666674" height="36" rx="3" fill="#FFFFFF"/><text x="1536.2222222222222" y="588.851282051282" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">等待后续信号</text><rect x="1097.0526315789473" y="1070.730434782608" width="168.72514619883054" height="36" rx="3" fill="#FFFFFF"/><text x="1103.0526315789473" y="1094.730434782608" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">登记时间条件</text><rect x="695.5555555555555" y="1110.5217391304348" width="188.8888888888889" height="36" rx="3" fill="#FFFFFF"/><text x="701.5555555555555" y="1134.5217391304348" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">到期回调</text><rect x="1005.3684210526316" y="744.5652173913044" width="185.9649122807017" height="36" rx="3" fill="#FFFFFF"/><text x="1011.3684210526316" y="768.5652173913044" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">语义判断</text><rect x="567.0526315789474" y="1045.2282608695652" width="168.72514619883043" height="36" rx="3" fill="#FFFFFF"/><text x="573.0526315789474" y="1069.2282608695652" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">目标达成</text><rect x="821.9444444444445" y="1038.608695652174" width="193.71345029239762" height="60" rx="3" fill="#FFFFFF"/><text x="827.9444444444445" y="1062.608695652174" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">未达成/不可判/失</text><text x="827.9444444444445" y="1086.608695652174" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">败</text><rect x="487.36842105263156" y="1103.0434782608695" width="185.9649122807018" height="36" rx="3" fill="#FFFFFF"/><text x="493.36842105263156" y="1127.0434782608695" font-size="20" font-weight="500" fill="#627E9F" xml:space="preserve">事件类Action</text></svg>