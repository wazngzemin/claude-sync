<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="m2-three-states" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="m2-three-states-title m2-three-states-desc">
<title id="m2-three-states-title">对话三态，决定新输入怎么进</title><desc id="m2-three-states-desc">给调度用的是空闲、处理中、输出中；车机上的聆听、思考、播报给用户看。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="m2-three-states-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<rect data-background="true" x="0" y="0" width="1200" height="730" style="fill:var(--v56-bg,#fff)"/>
<text class="v56-title" x="32" y="44" text-anchor="start">对话三态，决定新输入怎么进</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">给调度用的是空闲、处理中、输出中；车机上的聆听、思考、播报给用户看。</text>
<text class="v56-label" x="32" y="136" text-anchor="start">给调度用 · 云端对话三态</text>
<g data-node="true" data-name="idle"><rect class="v56-neutral" x="32" y="200" width="250" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="227" text-anchor="start">空闲</text>
<text class="v56-node-sub" x="46" y="252" text-anchor="start">没有有效的推理</text>
<text class="v56-node-sub" x="46" y="275" text-anchor="start">也没有待播完的回复</text>
</g>
<g data-node="true" data-name="processing"><rect class="v56-neutral" x="475" y="200" width="250" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="489" y="227" text-anchor="start">处理中</text>
<text class="v56-node-sub" x="489" y="252" text-anchor="start">Planner 已经开始推理</text>
<text class="v56-node-sub" x="489" y="275" text-anchor="start">用户还没看到第一段文字</text>
</g>
<g data-node="true" data-name="output"><rect class="v56-neutral" x="918" y="200" width="250" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="932" y="227" text-anchor="start">输出中</text>
<text class="v56-node-sub" x="932" y="252" text-anchor="start">已经开始输出文字</text>
<text class="v56-node-sub" x="932" y="275" text-anchor="start">或者车上还在播</text>
</g>
<path class="v56-arrow" d="M 282 265 L 475 265" fill="none" marker-end="url(#m2-three-states-arr)" />
<text class="v56-label" x="378" y="243" text-anchor="middle">开始推理</text>
<path class="v56-arrow" d="M 725 265 L 918 265" fill="none" marker-end="url(#m2-three-states-arr)" />
<text class="v56-label" x="821" y="221" text-anchor="middle">出第一段文字</text>
<text class="v56-label" x="821" y="243" text-anchor="middle">或开始播</text>
<g data-node="true" data-name="tool-record"><rect class="v56-decision" x="475" y="355" width="250" height="65" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="489" y="382" text-anchor="start">另记：工具放行了没有</text>
</g>
<path class="v56-rule" d="M 600 330 L 600 355" fill="none"  />
<path class="v56-arrow" d="M 1043 330 L 1043 460 L 157 460 L 157 330" fill="none" marker-end="url(#m2-three-states-arr)" />
<text class="v56-label" x="800" y="442" text-anchor="middle">车上报播完（或播放状态超时）</text>
<g data-node="true" data-name="visible-phases"><rect class="v56-neutral v56-pending" x="32" y="520" width="1136" height="105" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="547" text-anchor="start">给用户看 · R 章车机交互阶段</text>
<text class="v56-node-sub" x="46" y="572" text-anchor="start">聆听　→　思考　→　播报　　两套状态要对得上，但不是一一对应</text>
</g>
<rect data-legend="true" class="v56-neutral" x="32" y="676" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="690" text-anchor="start">灰：调度状态</text>
<rect data-legend="true" class="v56-decision" x="280" y="676" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="308" y="690" text-anchor="start">黄：另记工具放行</text>
<rect data-legend="true" class="v56-neutral v56-pending" x="600" y="676" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628" y="690" text-anchor="start">虚线：另一套交互阶段</text>
</svg>
