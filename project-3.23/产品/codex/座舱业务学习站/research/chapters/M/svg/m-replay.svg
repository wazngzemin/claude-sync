<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-label="为什么“还没出字”也不一定能合并重推：工具是分界线"><title>为什么“还没出字”也不一定能合并重推：工具是分界线</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="640" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">为什么“还没出字”也不一定能合并重推：工具是分界线</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">同一个场景两条路：上面工具还没发，下面工具已经发出去了</text><text x="30" y="104" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">示意场景：主驾说“把车窗打开”，DT 还在推理；副驾紧接着说“开一半就行”</text><rect x="30" y="220" width="280" height="90" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="247" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">DT 推理中</text><text x="44" y="272" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户还没看到任何字</text><path d="M310,265 L360,265 L360,178 L400,178" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,265 L360,265 L360,385 L400,385" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="400" y="130" width="380" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="414" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">路线 A：工具还没发出</text><text x="414" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">旧话仍可重推</text><text x="414" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">再推一次不会多开一次窗</text><rect x="820" y="130" width="390" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="834" y="157" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">打断，两句合并重推</text><text x="834" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 一次看到两句话：</text><text x="834" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">开窗，开一半</text><path d="M780,178 L820,178" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="400" y="330" width="380" height="110" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="414" y="357" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">路线 B：DT 已先发出“开窗”</text><text x="414" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">可能还没出字，但车窗已经在动</text><text x="414" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这时旧话被标成“不能重推”</text><rect x="820" y="330" width="390" height="110" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="834" y="357" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">打断，只处理新话</text><text x="834" y="382" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“已开窗”作为背景交给 DT</text><text x="834" y="403" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 决定要不要调成一半</text><path d="M780,385 L820,385" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="480" width="1180" height="140" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="507" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start">这条线是谁定的、为什么</text><text x="44" y="532" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">PRD 把“首个字之前”统一写成“打断并合并重推”；技术方案补了一条工程约束：工具一旦放行，即使首个字还没出，也不再合并旧输入。</text><text x="44" y="553" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">原因：再推一次，DT 可能再发一次同样的工具，造成重复车控、重复下单。技术方案原话说这条约束“不改变 PRD 的用户体验目标”。</text><text x="44" y="574" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">代价：路线 B 里 DT 只看到新话 + 背景，理解要靠背景写得清楚；已经执行的动作不会自动撤回。</text></g></svg>