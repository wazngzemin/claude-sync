<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3130" viewBox="0 0 1800 3130">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" fill="#42617D"/></marker></defs>
<rect width="1800" height="3130" fill="#FFFFFF"/>
<text x="70" y="65" font-size="38" fill="#1B3144" text-anchor="start" font-weight="700"><tspan x="70" dy="0">修改与取消：阻断旧事件，同步等待能力和任务展示</tspan></text>
<text x="70" y="113" font-size="24" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">触发器支持场景更新；不要求所有修改统一删除重建。以下联动顺序为评审建议。</tspan></text>
<rect x="55" y="153" width="530" height="2790" rx="16" fill="#F3F7FB"/>
<text x="320" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">用户 / 任务中心 / Planner</tspan></text>
<rect x="635" y="153" width="530" height="2790" rx="16" fill="#F1F7F4"/>
<text x="900" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="900" dy="0">动态 Advisor：业务目标</tspan></text>
<rect x="1215" y="153" width="530" height="2790" rx="16" fill="#FBF6EC"/>
<text x="1480" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="1480" dy="0">弋途定时 / 豆包条件场景</tspan></text>
<rect x="100.0" y="245.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="291" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">用户修改或取消任务</tspan><tspan x="320" dy="34.8">通过对话 / 任务中心发起</tspan></text>
<rect x="680.0" y="455.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="501" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">定位目标任务及关联登记</tspan><tspan x="900" dy="34.8">区分整条循环与单次轮次</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCEEE3" stroke="#678198" stroke-width="2" transform="translate(900,790) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="798" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">取消还是修改？</tspan></text>
<rect x="100.0" y="735.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="320" y="781" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">建议：先使目标不可再执行</tspan><tspan x="320" dy="34.8">取消未来轮次；拦截旧回调</tspan></text>
<rect x="1260.0" y="735.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="781" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">校验新内容 / 时间 / 条件</tspan><tspan x="1480" dy="34.8">等待路径是否需要切换</tspan></text>
<rect x="680.0" y="1055.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="900" y="1101" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">建议：使旧规则 / 旧事件失效</tspan><tspan x="900" dy="34.8">保存关联与新旧任务版本</tspan></text>
<rect x="100.0" y="1275.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="1321" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">清理取消任务的关联登记</tspan><tspan x="320" dy="34.8">停定时；失效 / 删除条件场景</tspan></text>
<rect x="1260.0" y="1275.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="1321" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">同路径：更新或按需重建</tspan><tspan x="1480" dy="34.8">换路径：移除旧等待并登记新等待</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCEEE3" stroke="#678198" stroke-width="2" transform="translate(900,1630) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="1638" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">登记变更 / 清理成功？</tspan></text>
<rect x="100.0" y="1575.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="320" y="1621" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">建议：保留操作失败原因</tspan><tspan x="320" dy="34.8">重试 / 回滚 / 补偿策略待确认</tspan></text>
<rect x="680.0" y="1865.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="900" y="1911" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">建议：任务中心同步操作结果</tspan><tspan x="900" dy="34.8">修改展示新规则 / 取消展示已取消</tspan></text>
<rect x="100.0" y="2075.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="2121" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">向用户反馈实际操作结果</tspan><tspan x="320" dy="34.8">请求已发出不等于已完成</tspan></text>
<rect x="1260.0" y="2075.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="2121" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">若此时旧到点 / 回调在途</tspan><tspan x="1480" dy="34.8">进入任务有效性再次检查</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#FFF1CD" stroke="#678198" stroke-width="2" transform="translate(900,2420) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="2428" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">建议：事件仍属有效任务？</tspan></text>
<rect x="100.0" y="2365.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="320" y="2411" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">否：拦截旧事件</tspan><tspan x="320" dy="34.8">不再发起新的播报 / 控车</tspan></text>
<rect x="1260.0" y="2365.0" width="440" height="110" rx="12" fill="#F7E8C9" stroke="#678198" stroke-width="2"/>
<text x="1480" y="2411" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">是：按新的有效规则处理</tspan><tspan x="1480" dy="34.8">进入相应任务执行链路</tspan></text>
<rect x="680.0" y="2715.0" width="440" height="110" rx="12" fill="#FFF1CD" stroke="#678198" stroke-width="2"/>
<text x="900" y="2761" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">已经下发的车辆动作</tspan><tspan x="900" dy="34.8">能否撤回或回滚需单独定义</tspan></text>
<polyline points="320,355.0 320,405.0 900,405.0 900,455.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="900,565.0 900,682.5" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="695.0,790 540.0,790" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="573.0" y="740" width="74.0" height="34" rx="5" fill="#FFFFFF"/>
<text x="610" y="765" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="610" dy="0">取消</tspan></text>
<polyline points="1105.0,790 1260.0,790" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1153.0" y="740" width="74.0" height="34" rx="5" fill="#FFFFFF"/>
<text x="1190" y="765" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="1190" dy="0">修改</tspan></text>
<polyline points="320,845.0 320,950.0 900,950.0 900,1055.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1480,845.0 1480,950.0 900,950.0 900,1055.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="680.0,1110 320,1110 320,1275.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="473.0" y="1055" width="74.0" height="34" rx="5" fill="#FFFFFF"/>
<text x="510" y="1080" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="510" dy="0">取消</tspan></text>
<polyline points="1120.0,1110 1480,1110 1480,1275.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1253.0" y="1055" width="74.0" height="34" rx="5" fill="#FFFFFF"/>
<text x="1290" y="1080" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="1290" dy="0">修改</tspan></text>
<polyline points="320,1385.0 320,1465 900,1465 900,1522.5" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1480,1385.0 1480,1465 900,1465 900,1522.5" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="695.0,1630 540.0,1630" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="578.0" y="1580" width="64" height="34" rx="5" fill="#FFFFFF"/>
<text x="610" y="1605" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="610" dy="0">否</tspan></text>
<polyline points="900,1737.5 900,1865.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="918.0" y="1775" width="64" height="34" rx="5" fill="#FFFFFF"/>
<text x="950" y="1800" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="950" dy="0">是</tspan></text>
<polyline points="900,1975.0 900,2025.0 320,2025.0 320,2075.0" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1480,2185.0 1480,2248.75 900,2248.75 900,2312.5" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="695.0,2420 540.0,2420" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="578.0" y="2370" width="64" height="34" rx="5" fill="#FFFFFF"/>
<text x="610" y="2395" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="610" dy="0">否</tspan></text>
<polyline points="1105.0,2420 1260.0,2420" fill="none" stroke="#42617D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1158.0" y="2370" width="64" height="34" rx="5" fill="#FFFFFF"/>
<text x="1190" y="2395" font-size="22" fill="#1B3144" text-anchor="middle" font-weight="400"><tspan x="1190" dy="0">是</tspan></text>
<text x="70" y="3005" font-size="23" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">停止旧事件与回读清理结果属于建议闭环；取消不代表已下发的车辆动作一定能撤回。</tspan><tspan x="70" dy="33.35">task_id / scene_id / 轮次与版本的关联方式、失败补偿、暂停恢复、更新原子性待确认。</tspan></text>
</svg>