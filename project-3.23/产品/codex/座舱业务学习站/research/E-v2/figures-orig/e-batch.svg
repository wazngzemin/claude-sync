<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="875" viewBox="0 0 1420 875" role="img" aria-label="同一轮并行，还是分好几轮：两个例子"><title>同一轮并行，还是分好几轮：两个例子</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1420" height="875" fill="#ffffff" data-decoration="background"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">同一轮并行，还是分好几轮：两个例子</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">横向是时间；绿框是 Planner 的每一次推理，蓝框是工具在执行，灰框是用户说话</text><rect x="30" y="92" width="1360" height="300" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" data-container="true"/><text x="44" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">同一轮并行（一次路测）：两个车控动作一起发</text><text x="50" y="160" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">Planner</text><text x="50" y="236" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">车辆控制 ①</text><text x="50" y="306" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">车辆控制 ②</text><rect x="190" y="132" width="170" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="204" y="159" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">Planner 推理 1</text><rect x="400" y="210" width="390" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><text x="414" y="237" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">副驾空调调到 4 度、风量降一档</text><rect x="400" y="280" width="250" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><text x="414" y="307" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">打开主驾座椅通风</text><path d="M360,155 L380,155 L380,233 L400,233" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M380,233 L380,303 L400,303" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><line x1="820" y1="120" x2="820" y2="370" stroke="#c45c5c" stroke-width="1.5" stroke-dasharray="4 4"/><text x="830" y="360" font-size="13" fill="#6e2222" font-weight="600" text-anchor="start">两个都回来才交回</text><path d="M790,233 L820,233" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M650,303 L820,303" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="850" y="132" width="170" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="864" y="159" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">Planner 推理 2</text><path d="M820,155 L850,155" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1050" y="132" width="200" height="46" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true"/><text x="1064" y="159" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">说“都调好了”</text><path d="M1020,155 L1050,155" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="420" width="1360" height="380" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" data-container="true"/><text x="44" y="444" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">分好几轮（按规则推演的示意）：导航回家、路上顺道买束花</text><text x="50" y="490" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">Planner</text><text x="50" y="560" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">用户</text><text x="50" y="630" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">路线规划</text><text x="50" y="700" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">POI 查询</text><rect x="150" y="462" width="100" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="164" y="481.0" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start"><tspan x="164" dy="0">Planner</tspan><tspan x="164" dy="17.0">推理 1</tspan></text><rect x="265" y="602" width="130" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><text x="279" y="629" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">发起导航回家</text><rect x="410" y="462" width="100" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="424" y="481.0" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start"><tspan x="424" dy="0">Planner</tspan><tspan x="424" dy="17.0">推理 2</tspan></text><rect x="525" y="532" width="140" height="46" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" data-node="true"/><text x="539" y="559" font-size="14" fill="#4b5560" font-weight="650" text-anchor="start">“就路线1吧”</text><rect x="680" y="462" width="100" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="694" y="481.0" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start"><tspan x="694" dy="0">Planner</tspan><tspan x="694" dy="17.0">推理 3</tspan></text><rect x="795" y="602" width="120" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><text x="809" y="629" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">选择路线1</text><rect x="930" y="462" width="100" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="944" y="481.0" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start"><tspan x="944" dy="0">Planner</tspan><tspan x="944" dy="17.0">推理 4</tspan></text><rect x="1045" y="672" width="130" height="46" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6" data-node="true"/><text x="1059" y="699" font-size="14" fill="#1f4565" font-weight="650" text-anchor="start">沿途搜花店</text><rect x="1190" y="462" width="100" height="46" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6" data-node="true"/><text x="1204" y="481.0" font-size="14" fill="#1d4b35" font-weight="650" text-anchor="start"><tspan x="1204" dy="0">Planner</tspan><tspan x="1204" dy="17.0">推理 5</tspan></text><path d="M250,485 L257,485 L257,625 L265,625" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M395,625 L402,625 L402,485 L410,485" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="372.3" y="545" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92" data-decoration="label-background"/><text x="402" y="561" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">三条路线</text><path d="M510,485 L517,485 L517,555 L525,555" fill="none" stroke="#476c8d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M665,555 L672,555 L672,485 L680,485" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M780,485 L787,485 L787,625 L795,625" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M915,625 L922,625 L922,485 L930,485" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="892.3" y="545" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92" data-decoration="label-background"/><text x="922" y="561" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">导航成功</text><path d="M1030,485 L1037,485 L1037,695 L1045,695" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1175,695 L1182,695 L1182,485 L1190,485" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1146.125" y="585" width="71.75" height="21" rx="4" fill="#ffffff" fill-opacity=".92" data-decoration="label-background"/><text x="1182" y="601" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">3 家花店</text><rect x="1060" y="740" width="320" height="46" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6" data-node="true"/><text x="1074" y="767" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start">推荐最近一家，问要不要加途经点</text><path d="M1240,508 L1240,740" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><text x="150" y="770" font-size="13" fill="#5d7183" font-weight="400" text-anchor="start">沿途搜索要先有路线；中间还有一轮是用户选路线。每多一轮，多一次 Planner 推理和一次工具往返</text></g><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" data-legend="true"><rect x="32" y="840.0" width="16" height="16" rx="4" fill="#eaf6ef" stroke="#4a9670" data-decoration="legend"/><text x="57" y="853.0" fill="#5d7183" font-size="14">绿：Planner 推理</text><rect x="307" y="840.0" width="16" height="16" rx="4" fill="#eaf2fb" stroke="#4f7ea9" data-decoration="legend"/><text x="332" y="853.0" fill="#5d7183" font-size="14">蓝：工具执行</text><rect x="582" y="840.0" width="16" height="16" rx="4" fill="#f6f7f8" stroke="#98a3ad" data-decoration="legend"/><text x="607" y="853.0" fill="#5d7183" font-size="14">灰：用户说话</text><rect x="857" y="840.0" width="16" height="16" rx="4" fill="#fffbe8" stroke="#cdb35a" data-decoration="legend"/><text x="882" y="853.0" fill="#5d7183" font-size="14">黄：结果播报</text></g></svg>