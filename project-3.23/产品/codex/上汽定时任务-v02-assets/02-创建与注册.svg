<text x="320" y="291" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">用户提出未来任务</tspan><tspan x="320" dy="34.8">Planner 识别执行内容和对象</tspan></text>
<rect x="680.0" y="425.0" width="440" height="110" rx="12" fill="#DCEEE3" stroke="#678198" stroke-width="2"/>
<text x="900" y="471" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">动态 Advisor 解析</tspan><tspan x="900" dy="34.8">时间 / 条件 / 对象 / 一次性或循环</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCEEE3" stroke="#678198" stroke-width="2" transform="translate(900,735) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="743" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">信息完整且支持？</tspan></text>
