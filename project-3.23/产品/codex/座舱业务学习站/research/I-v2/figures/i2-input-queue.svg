<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="i2-input-queue" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="i2-input-queue-title i2-input-queue-desc">
<title id="i2-input-queue-title">四类输入，五种处理结果</title><desc id="i2-input-queue-desc">输入管理按优先级、能否合并与当前状态调度；工具反馈始终单独处理。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="i2-input-queue-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">四类输入，五种处理结果</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">输入管理按优先级、能否合并与当前状态调度；工具反馈始终单独处理。</text>
<text class="v56-label" x="32" y="120" text-anchor="start">输入来源：四类输入放入三组</text>
<text class="v56-label" x="426" y="120" text-anchor="start">统一调度</text>
<text class="v56-label" x="858" y="120" text-anchor="start">五种处理结果之一</text>
<g data-node="true" data-key="priority">
<rect class="v56-neutral" x="32" y="158" width="304" height="154" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="185" text-anchor="start">带优先级的输入</text>
<text class="v56-node-sub" x="46" y="210" text-anchor="start">query · P0：用户的有效话</text>
<text class="v56-node-sub" x="46" y="231" text-anchor="start">advice · P1：主动建议</text>
<text class="v56-node-sub" x="46" y="252" text-anchor="start">用户请求处理中，主动建议不抢占</text>
</g>
<g data-node="true" data-key="event">
<rect class="v56-neutral" x="32" y="350" width="304" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="377" text-anchor="start">event · 事件</text>
<text class="v56-node-sub" x="46" y="402" text-anchor="start">按事件类型进入调度</text>
<text class="v56-node-sub" x="46" y="423" text-anchor="start">是否能合并由输入属性决定</text>
</g>
<g data-node="true" data-key="feedback">
<rect class="v56-cloud" x="32" y="490" width="304" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="517" text-anchor="start">feedback · 工具反馈</text>
<text class="v56-node-sub" x="46" y="542" text-anchor="start">isolated：必须单独处理</text>
<text class="v56-node-sub" x="46" y="563" text-anchor="start">不与用户的话合并</text>
</g>
<g data-node="true" data-key="manager">
<rect class="v56-neutral" x="426" y="312" width="338" height="252" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="440" y="339" text-anchor="start">输入管理</text>
<text class="v56-node-sub" x="440" y="364" text-anchor="start">位置：AIDV 进程，Planner 之前</text>
<text class="v56-node-sub" x="440" y="385" text-anchor="start">只做调度，不调用模型</text>
<text class="v56-node-sub" x="440" y="406" text-anchor="start">mergeable：可以合并</text>
<text class="v56-node-sub" x="440" y="427" text-anchor="start">isolated：必须单独处理</text>
<text class="v56-node-sub" x="440" y="448" text-anchor="start">同时查看：是否完整输出、是否起播</text>
</g>
<g data-node="true" data-key="immediate">
<rect class="v56-neutral" x="858" y="158" width="310" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="872" y="185" text-anchor="start">立即执行</text>
<text class="v56-node-sub" x="872" y="210" text-anchor="start">满足处理条件，开始处理</text>
</g>
<g data-node="true" data-key="invalidate">
<rect class="v56-neutral" x="858" y="278" width="310" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="872" y="305" text-anchor="start">让旧执行失效</text>
<text class="v56-node-sub" x="872" y="330" text-anchor="start">旧轮未下发的动作不再下发</text>
</g>
<g data-node="true" data-key="merge">
<rect class="v56-local" x="858" y="398" width="310" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="872" y="425" text-anchor="start">合并后重推</text>
<text class="v56-node-sub" x="872" y="450" text-anchor="start">可合并输入满足合并条件</text>
</g>
<g data-node="true" data-key="wait">
<rect class="v56-decision" x="858" y="518" width="310" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="872" y="545" text-anchor="start">进入等待队列</text>
<text class="v56-node-sub" x="872" y="570" text-anchor="start">用户请求处理中，主动建议排队</text>
</g>
<g data-node="true" data-key="end">
<rect class="v56-neutral" x="858" y="638" width="310" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="872" y="665" text-anchor="start">结束</text>
<text class="v56-node-sub" x="872" y="690" text-anchor="start">当前输入的调度处理结束</text>
</g>
<path class="v56-arrow" d="M 336 235 L 378 235 L 378 356 L 426 356" fill="none" marker-end="url(#i2-input-queue-arr)"/>
<path class="v56-arrow" d="M 336 401 L 426 401" fill="none" marker-end="url(#i2-input-queue-arr)"/>
<path class="v56-arrow" d="M 336 541 L 378 541 L 378 508 L 426 508" fill="none" marker-end="url(#i2-input-queue-arr)"/>
<path class="v56-arrow" d="M 764 438 L 810 438" fill="none"/>
<path class="v56-arrow" d="M 810 202 L 810 682" fill="none"/>
<path class="v56-arrow" d="M 810 202 L 858 202" fill="none" marker-end="url(#i2-input-queue-arr)"/>
<path class="v56-arrow" d="M 810 322 L 858 322" fill="none" marker-end="url(#i2-input-queue-arr)"/>
<path class="v56-arrow" d="M 810 442 L 858 442" fill="none" marker-end="url(#i2-input-queue-arr)"/>
<path class="v56-arrow" d="M 810 562 L 858 562" fill="none" marker-end="url(#i2-input-queue-arr)"/>
<path class="v56-arrow" d="M 810 682 L 858 682" fill="none" marker-end="url(#i2-input-queue-arr)"/>
<text class="v56-subtitle" x="32" y="651" text-anchor="start">用户的话与主动建议共用一个优先级输入框；事件、工具反馈各自进入。</text>
<text class="v56-subtitle" x="32" y="776" text-anchor="start">调度约束：同一对话只有一个等待列表；任意时刻，一个有效候选 ＋ 一个还没撤销的输出。</text>
<text class="v56-subtitle" x="32" y="805" text-anchor="start">发送约束：下一轮可以提前开始算，但要等前一轮播完才能发出去。</text>
<rect class="v56-local" x="32" y="869" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="883" text-anchor="start">蓝：可以合并</text>
<rect class="v56-cloud" x="282" y="869" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="310" y="883" text-anchor="start">绿：单独处理</text>
<rect class="v56-decision" x="532" y="869" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="560" y="883" text-anchor="start">黄：等待处理</text>
<rect class="v56-neutral" x="782" y="869" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="810" y="883" text-anchor="start">灰：来源与调度控制</text>
</svg>
