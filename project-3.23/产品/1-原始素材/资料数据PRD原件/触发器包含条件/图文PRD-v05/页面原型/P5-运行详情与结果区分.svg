<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1130" viewBox="0 0 1700 1130"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#839bb6"/></marker></defs><rect x="0" y="0" width="1700" height="1130" rx="0" fill="#f5f8fc" stroke="#f5f8fc" stroke-width="1.5"/><rect x="0" y="0" width="1700" height="75" rx="0" fill="#193957" stroke="#193957" stroke-width="1.5"/><text x="28" y="48" font-size="26" fill="#fff" font-weight="600">豆包汽车 · 触发器场景配置</text><text x="1210" y="46" font-size="20" fill="#d5e5f5" font-weight="400">方案原型 · 非真实后台截图</text><rect x="0" y="75" width="225" height="1055" rx="0" fill="#fff" stroke="#dce5ef" stroke-width="1.5"/><text x="26" y="125" font-size="22" fill="#20364d" font-weight="500">场景管理</text><rect x="14" y="220" width="196" height="52" rx="6" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="1.5"/><text x="30" y="185" font-size="21" fill="#20364d" font-weight="400">场景列表</text><text x="30" y="250" font-size="21" fill="#2469d6" font-weight="500">触发记录</text><text x="30" y="315" font-size="21" fill="#20364d" font-weight="400">公共能力</text><text x="265" y="121" font-size="30" fill="#173a61" font-weight="600">P5 本次运行详情：区分判断、策略与下游结果</text><text x="265" y="159" font-size="19" fill="#667b91" font-weight="400">① 找到本次运行 → ② 看快慢分支 → ③ 看单终点 → ④ 分开查看策略 / History / 下游</text><rect x="260" y="190" width="1400" height="120" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="280" y="226" font-size="20" fill="#405873" font-weight="400">① scene_id：5324    workflow_id：wf-example-01    run_id：run-example-0921-01</text><text x="280" y="260" font-size="20" fill="#405873" font-weight="400">触发方式：混合判断    启动信号：档位变为 D    本次示例：儿童满足，宠物判断慢且失败</text><text x="280" y="294" font-size="18" fill="#667b91" font-weight="400">本页数字与 ID 为说明示例，不是线上运行记录。</text><rect x="260" y="329" width="188" height="44" rx="6" fill="#2469d6" stroke="#2469d6" stroke-width="1.5"/><text x="278" y="358" font-size="20" fill="#fff" font-weight="500">节点判定（当前）</text><rect x="464" y="329" width="180" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="482" y="358" font-size="20" fill="#2469d6" font-weight="500">输入快照</text><rect x="660" y="329" width="180" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="678" y="358" font-size="20" fill="#2469d6" font-weight="500">动作快照</text><rect x="856" y="329" width="185" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="874" y="358" font-size="20" fill="#2469d6" font-weight="500">执行策略快照</text><rect x="260" y="398" width="1400" height="326" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><rect x="260" y="398" width="1400" height="50" rx="0" fill="#eaf0f7" stroke="#c7d5e4" stroke-width="1.5"/><text x="280" y="431" font-size="20" fill="#405873" font-weight="500">② 节点</text><text x="590" y="431" font-size="20" fill="#405873" font-weight="500">执行阶段</text><text x="835" y="431" font-size="20" fill="#405873" font-weight="500">业务判断结果</text><text x="1080" y="431" font-size="20" fill="#405873" font-weight="500">时间</text><text x="1260" y="431" font-size="20" fill="#405873" font-weight="500">原因 / 说明</text><text x="280" y="490" font-size="19" fill="#20364d" font-weight="400">N1 公共前置条件</text><text x="590" y="490" font-size="19" fill="#20364d" font-weight="400">已完成 FINISHED</text><text x="835" y="490" font-size="19" fill="#2469d6" font-weight="400">满足 PASS</text><text x="1080" y="490" font-size="19" fill="#20364d" font-weight="400">0—20 ms</text><text x="1260" y="490" font-size="18" fill="#20364d" font-weight="400">任务开启，D 挡变化成立</text><line x1="260" y1="515" x2="1660" y2="515" stroke="#a6b7c9" stroke-width="2"/><text x="280" y="556" font-size="19" fill="#20364d" font-weight="400">N2 后排儿童</text><text x="590" y="556" font-size="19" fill="#20364d" font-weight="400">已完成 FINISHED</text><text x="835" y="556" font-size="19" fill="#2469d6" font-weight="400">满足 PASS</text><text x="1080" y="556" font-size="19" fill="#20364d" font-weight="400">20—40 ms</text><text x="1260" y="556" font-size="18" fill="#20364d" font-weight="400">同一后排乘客为儿童</text><line x1="260" y1="581" x2="1660" y2="581" stroke="#a6b7c9" stroke-width="2"/><text x="280" y="622" font-size="19" fill="#a55a31" font-weight="400">N3 后排宠物</text><text x="590" y="622" font-size="19" fill="#a55a31" font-weight="400">失败 FAILED</text><text x="835" y="622" font-size="19" fill="#a55a31" font-weight="400">未知 UNKNOWN</text><text x="1080" y="622" font-size="19" fill="#a55a31" font-weight="400">20—1800 ms</text><text x="1260" y="622" font-size="18" fill="#a55a31" font-weight="400">模型请求失败</text><line x1="260" y1="647" x2="1660" y2="647" stroke="#a6b7c9" stroke-width="2"/><text x="280" y="688" font-size="19" fill="#20364d" font-weight="400">N4 儿童锁未开 · OR</text><text x="590" y="688" font-size="19" fill="#20364d" font-weight="400">已完成 FINISHED</text><text x="835" y="688" font-size="19" fill="#2469d6" font-weight="400">满足 PASS</text><text x="1080" y="688" font-size="19" fill="#20364d" font-weight="400">40—50 ms</text><text x="1260" y="688" font-size="18" fill="#20364d" font-weight="400">N2 先满足即进入；自身满足</text><rect x="260" y="748" width="1400" height="106" rx="6" fill="#eff5ff" stroke="#a8c8f4" stroke-width="1.5"/><text x="276" y="780" font-size="18" fill="#315b8d" font-weight="400">② N2 在 40 ms 满足后，N4 按 OR 立即开始；不用等 N3 返回。</text><text x="276" y="808" font-size="18" fill="#315b8d" font-weight="400">③ N4 在 50 ms 已满足，但整图运行仍等待所有节点终态；1800 ms 后汇总，最终取唯一终点 N4 的 PASS。</text><text x="276" y="836" font-size="18" fill="#315b8d" font-weight="400">N3 的 FAILED 是执行异常，其业务结果为 UNKNOWN；不把异常画成明确“没有宠物”。</text><rect x="260" y="872" width="450" height="180" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><rect x="734" y="872" width="450" height="180" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><rect x="1208" y="872" width="452" height="180" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="280" y="907" font-size="23" fill="#173a61" font-weight="600">④ 执行策略</text><text x="280" y="944" font-size="19" fill="#405873" font-weight="400">整图 PASS 后检查策略与执行锁</text><text x="280" y="974" font-size="19" fill="#405873" font-weight="400">本例：策略允许，下游请求已提交</text><text x="280" y="1004" font-size="19" fill="#405873" font-weight="400">策略拦截需单独记录原因</text><text x="754" y="907" font-size="23" fill="#173a61" font-weight="600">History / Action 结果</text><text x="754" y="944" font-size="19" fill="#405873" font-weight="400">先创建待处理 History</text><text x="754" y="974" font-size="19" fill="#405873" font-weight="400">全部 Action 结束后更新结果</text><text x="754" y="1004" font-size="19" fill="#405873" font-weight="400">关联本次 run_id，不覆盖判断结果</text><text x="1228" y="907" font-size="23" fill="#173a61" font-weight="600">下游业务与车辆反馈</text><text x="1228" y="944" font-size="19" fill="#405873" font-weight="400">建议请求接收 ≠ 卡片已展示</text><text x="1228" y="974" font-size="19" fill="#405873" font-weight="400">卡片确认 ≠ 车辆执行成功</text><text x="1228" y="1004" font-size="19" fill="#405873" font-weight="400">没有真实回传则显示尚未确认</text><text x="260" y="1090" font-size="19" fill="#667b91" font-weight="400">反例：OR 无 PASS 且存在 UNKNOWN → 终点被未知阻断；AND 任一 REJECT → 跳过；详情必须保留阻断原因。</text></svg>
