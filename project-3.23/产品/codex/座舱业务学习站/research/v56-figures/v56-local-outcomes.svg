<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="v56-local-outcomes" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="v56-local-outcomes-title v56-local-outcomes-desc">
<title id="v56-local-outcomes-title">本地结论的三条去向</title><desc id="v56-local-outcomes-desc">reject 是本地拒识候选；unsupported 是本地不支持，两者后续处理不同。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="v56-local-outcomes-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44">本地结论的三条去向</text><text class="v56-subtitle" x="32" y="72">reject 是本地拒识候选；unsupported 是本地不支持，两者后续处理不同。</text>
<text class="v56-label" x="32" y="122" text-anchor="start">固定说法优先命中</text>
<path class="v56-arrow" d="M 380 204 L 460 204" fill="none" marker-end="url(#v56-local-outcomes-arr)"/>
<path class="v56-arrow" d="M 740 204 L 880 204" fill="none" marker-end="url(#v56-local-outcomes-arr)"/>
<text class="v56-label" x="800" y="187" text-anchor="start">是</text>
<path class="v56-arrow" d="M 600 248 L 600 335" fill="none" marker-end="url(#v56-local-outcomes-arr)"/>
<text class="v56-label" x="615" y="296" text-anchor="start">否</text>
<path class="v56-arrow" d="M 600 423 L 600 480 L 202 480 L 202 530" fill="none" marker-end="url(#v56-local-outcomes-arr)"/>
<path class="v56-arrow" d="M 600 480 L 600 530" fill="none" marker-end="url(#v56-local-outcomes-arr)"/>
<path class="v56-arrow" d="M 600 480 L 998 480 L 998 530" fill="none" marker-end="url(#v56-local-outcomes-arr)"/>
<g data-node="true">
<rect class="v56-neutral" x="100" y="160" width="280" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="114" y="187" text-anchor="start">完整文字</text>
<text class="v56-node-sub" x="114" y="212" text-anchor="start">进入车上处理</text>
</g>
<g data-node="true">
<rect class="v56-decision" x="460" y="160" width="280" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="474" y="187" text-anchor="start">是不是固定说法</text>
</g>
<g data-node="true">
<rect class="v56-local" x="880" y="160" width="280" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="894" y="187" text-anchor="start">固定规则优先</text>
<text class="v56-node-sub" x="894" y="212" text-anchor="start">输出配置结果</text>
<text class="v56-node-sub" x="894" y="233" text-anchor="start">优先执行资格</text>
</g>
<g data-node="true">
<rect class="v56-local" x="460" y="335" width="280" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="474" y="362" text-anchor="start">端侧车控模型</text>
<text class="v56-node-sub" x="474" y="387" text-anchor="start">理解后给出本地结果</text>
</g>
<g data-node="true">
<rect class="v56-local" x="32" y="530" width="340" height="190" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="557" text-anchor="start">能办</text>
<text class="v56-node-sub" x="46" y="582" text-anchor="start">functioncall</text>
<text class="v56-node-sub" x="46" y="603" text-anchor="start">输出函数＋参数候选</text>
<text class="v56-node-sub" x="46" y="624" text-anchor="start">去端云仲裁</text>
</g>
<g data-node="true">
<rect class="v56-reject" x="430" y="530" width="340" height="190" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="444" y="557" text-anchor="start">本地拒识</text>
<text class="v56-node-sub" x="444" y="582" text-anchor="start">reject</text>
<text class="v56-node-sub" x="444" y="603" text-anchor="start">本地认为不应作为助手请求</text>
<text class="v56-node-sub" x="444" y="624" text-anchor="start">遵守最终拒识与端云规则</text>
</g>
<g data-node="true">
<rect class="v56-cloud" x="828" y="530" width="340" height="190" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="842" y="557" text-anchor="start">本地不支持</text>
<text class="v56-node-sub" x="842" y="582" text-anchor="start">unsupported</text>
<text class="v56-node-sub" x="842" y="603" text-anchor="start">或 cloud</text>
<text class="v56-node-sub" x="842" y="624" text-anchor="start">超出本地范围或把握不足</text>
<text class="v56-node-sub" x="842" y="645" text-anchor="start">有网时交云端</text>
</g>
<path class="v56-rule" d="M 600 735 L 600 753 L 998 753 L 998 735" fill="none"/>
<text class="v56-node-title" x="799" y="786" text-anchor="middle">不该接 ≠ 办不了</text>
<text class="v56-subtitle" x="32" y="835" text-anchor="start">有的车型让固定说法和模型同时跑，结果同样进入仲裁。</text>
<rect class="v56-local" x="32" y="888" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="902" text-anchor="start">蓝：本地处理与候选</text>
<rect class="v56-decision" x="222" y="888" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="250" y="902" text-anchor="start">黄：规则判断</text>
<rect class="v56-reject" x="412" y="888" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="440" y="902" text-anchor="start">红：拒识候选</text>
<rect class="v56-cloud" x="602" y="888" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="630" y="902" text-anchor="start">绿：交云端继续处理</text>
</svg>
