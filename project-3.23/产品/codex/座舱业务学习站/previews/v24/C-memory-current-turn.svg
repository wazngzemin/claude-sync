  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">把记忆接回当前请求：预注入、补查与执行反馈</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,220 350,286" marker-end="url(#arrow-C-memory-current-turn)"><title>cm1 → cm2：当前请求与身份范围</title></polyline><polyline class="arr" fill="none" points="350,410 350,476" marker-end="url(#arrow-C-memory-current-turn)"><title>cm2 → cm3：常用背景进入当前输入</title></polyline><polyline class="arr" fill="none" points="350,600 350,666" marker-end="url(#arrow-C-memory-current-turn)"><title>cm3 → cm4：缺相关历史地点</title></polyline><polyline class="arr" fill="none" points="350,790 350,856" marker-end="url(#arrow-C-memory-current-turn)"><title>cm4 → cm5：记忆工具返回事实/候选</title></polyline><polyline class="arr" fill="none" points="350,982 350,1048" marker-end="url(#arrow-C-memory-current-turn)"><title>cm5 → cm6：有歧义或缺必要信息</title></polyline><polyline class="arr" fill="none" points="176,1102 80,1102 80,934 170,934" marker-end="url(#arrow-C-memory-current-turn)"><title>cm6 → cm5：新信息回来，再判断</title></polyline><polyline class="arr" fill="none" points="176,530 90,530 90,1292 170,1292" marker-end="url(#arrow-C-memory-current-turn)"><title>cm3 → cm7：目的地已经明确</title></polyline><polyline class="arr" fill="none" points="176,910 100,910 100,1316 170,1316" marker-end="url(#arrow-C-memory-current-turn)"><title>cm5 → cm7：目的地得到确认</title></polyline><polyline class="arr" fill="none" points="350,1364 350,1430" marker-end="url(#arrow-C-memory-current-turn)"><title>cm7 → cm8：实际导航结果返回</title></polyline><text class="ts" x="365" y="256" text-anchor="start" dominant-baseline="central">E1 · 当前请求与身份范围</text><text class="ts" x="365" y="446" text-anchor="start" dominant-baseline="central">E2 · 常用背景进入当前输入</text><text class="ts" x="365" y="636" text-anchor="start" dominant-baseline="central">E3 · 缺相关历史地点</text><text class="ts" x="365" y="826" text-anchor="start" dominant-baseline="central">E4 · 记忆工具返回事实/候选</text><text class="ts" x="365" y="1018" text-anchor="start" dominant-baseline="central">E5 · 有歧义或缺必要信息</text><text class="ts" x="168" y="1094" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="168" y="946" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="168" y="522" text-anchor="end" dominant-baseline="central">E7</text><text class="ts" x="168" y="1304" text-anchor="end" dominant-baseline="central">E7</text><text class="ts" x="168" y="902" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="168" y="1328" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="365" y="1400" text-anchor="start" dominant-baseline="central">E9 · 实际导航结果返回</text><g class="c-gray" role="link" tabindex="0" data-page="C" data-flow="C-memory-current-turn" data-step="cm1" aria-label="接到正式请求"><title>用户：去昨天那家游泳馆；同时保留说话人和当前场景</title><rect x="180" y="106" width="340" height="110" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">接到正式请求</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">用户：去昨天那家游泳馆</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central">同时保留说话人和当前场景</text></g><g class="c-teal" role="link" tabindex="0" data-page="C" data-flow="C-memory-current-turn" data-step="cm2" aria-label="预注入常用背景"><title>当前状态、场景及本轮取得的记忆；不加载此人的全部历史</title><rect x="180" y="296" width="340" height="110" rx="6"/><text class="th" x="198" y="320" text-anchor="start" dominant-baseline="central">预注入常用背景</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">当前状态、场景及本轮取得的记忆</text><text class="ts" x="198" y="367" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central">不加载此人的全部历史</text></g><g class="c-teal" role="link" tabindex="0" data-page="C" data-flow="C-memory-current-turn" data-step="cm3" aria-label="Planner 判断目的地是否明确"><title>已有可用地点：继续任务；缺昨天的地点：调用记忆检索</title><rect x="180" y="486" width="340" height="110" rx="6"/><text class="th" x="198" y="510" text-anchor="start" dominant-baseline="central">Planner 判断目的地是否明确</text><text class="ts" x="198" y="538" text-anchor="start" dominant-baseline="central">已有可用地点：继续任务</text><text class="ts" x="198" y="557" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="576" text-anchor="start" dominant-baseline="central">缺昨天的地点：调用记忆检索</text></g><g class="c-teal" role="link" tabindex="0" data-page="C" data-flow="C-memory-current-turn" data-step="cm4" aria-label="检索对应人的经历"><title>查相关人物、日期与事情；返回事实或候选，保留缺失</title><rect x="180" y="676" width="340" height="110" rx="6"/><text class="th" x="198" y="700" text-anchor="start" dominant-baseline="central">检索对应人的经历</text><text class="ts" x="198" y="728" text-anchor="start" dominant-baseline="central">查相关人物、日期与事情</text><text class="ts" x="198" y="747" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="766" text-anchor="start" dominant-baseline="central">返回事实或候选，保留缺失</text></g><g class="c-teal" role="link" tabindex="0" data-page="C" data-flow="C-memory-current-turn" data-step="cm5" aria-label="Planner 解释检索结果"><title>候选是否对应“昨天那家”；地址和必要信息是否足够</title><rect x="180" y="866" width="340" height="112" rx="6"/><text class="th" x="198" y="890" text-anchor="start" dominant-baseline="central">Planner 解释检索结果</text><text class="ts" x="198" y="918" text-anchor="start" dominant-baseline="central">候选是否对应“昨天那家”</text><text class="ts" x="198" y="937" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="956" text-anchor="start" dominant-baseline="central">地址和必要信息是否足够</text></g><g class="c-teal" role="link" tabindex="0" data-page="C" data-flow="C-memory-current-turn" data-step="cm6" aria-label="补信息或向用户确认"><title>多家候选：确认是哪一家；缺地点：不能编造导航地址</title><rect x="180" y="1058" width="340" height="110" rx="6"/><text class="th" x="198" y="1082" text-anchor="start" dominant-baseline="central">补信息或向用户确认</text><text class="ts" x="198" y="1110" text-anchor="start" dominant-baseline="central">多家候选：确认是哪一家</text><text class="ts" x="198" y="1129" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1148" text-anchor="start" dominant-baseline="central">缺地点：不能编造导航地址</text></g><g class="c-teal" role="link" tabindex="0" data-page="C" data-flow="C-memory-current-turn" data-step="cm7" aria-label="调用导航能力"><title>以明确的目的地继续规划；接收实际执行反馈</title><rect x="180" y="1248" width="340" height="112" rx="6"/><text class="th" x="198" y="1272" text-anchor="start" dominant-baseline="central">调用导航能力</text><text class="ts" x="198" y="1300" text-anchor="start" dominant-baseline="central">以明确的目的地继续规划</text><text class="ts" x="198" y="1319" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1338" text-anchor="start" dominant-baseline="central">接收实际执行反馈</text></g><g class="c-gray" role="link" tabindex="0" data-page="C" data-flow="C-memory-current-turn" data-step="cm8" aria-label="回复用户并更新本轮上下文"><title>按真实导航结果反馈；后续请求接着已发生的事实走</title><rect x="180" y="1440" width="340" height="110" rx="6"/><text class="th" x="198" y="1464" text-anchor="start" dominant-baseline="central">回复用户并更新本轮上下文</text><text class="ts" x="198" y="1492" text-anchor="start" dominant-baseline="central">按真实导航结果反馈</text><text class="ts" x="198" y="1511" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1530" text-anchor="start" dominant-baseline="central">后续请求接着已发生的事实走</text></g><text class="th" x="40" y="1634" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1664" text-anchor="start" dominant-baseline="central">E1 接到正式请求 → 预注入常用背景：当前请求与身份范围</text><text class="ts" x="40" y="1697" text-anchor="start" dominant-baseline="central">E2 预注入常用背景 → Planner 判断目的地是否明确：常用背景进入当前输入</text><text class="ts" x="40" y="1730" text-anchor="start" dominant-baseline="central">E3 Planner 判断目的地是否明确 → 检索对应人的经历：缺相关历史地点</text><text class="ts" x="40" y="1763" text-anchor="start" dominant-baseline="central">E4 检索对应人的经历 → Planner 解释检索结果：记忆工具返回事实/候选</text><text class="ts" x="40" y="1796" text-anchor="start" dominant-baseline="central">E5 Planner 解释检索结果 → 补信息或向用户确认：有歧义或缺必要信息</text><text class="ts" x="40" y="1829" text-anchor="start" dominant-baseline="central">E6 补信息或向用户确认 → Planner 解释检索结果：新信息回来，再判断</text><text class="ts" x="40" y="1862" text-anchor="start" dominant-baseline="central">E7 Planner 判断目的地是否明确 → 调用导航能力：目的地已经明确</text><text class="ts" x="40" y="1895" text-anchor="start" dominant-baseline="central">E8 Planner 解释检索结果 → 调用导航能力：目的地得到确认</text><text class="ts" x="40" y="1928" text-anchor="start" dominant-baseline="central">E9 调用导航能力 → 回复用户并更新本轮上下文：实际导航结果返回</text></svg>