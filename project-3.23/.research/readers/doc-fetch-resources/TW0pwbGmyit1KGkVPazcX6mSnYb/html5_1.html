<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<title>触发器配置平台 · 交互原型 v10</title>
<style>
:root{
  --blue:#165dff;--blue-d:#0e4fd6;--blue-bg:#f2f7ff;--blue-bd:#bedaff;
  --ink:#1d2129;--sub:#4e5969;--muted:#86909c;--line:#e5e6eb;--bg:#f7f8fa;
  --orange:#d46b08;--orange-bg:#fff7e8;--orange-bd:#ffd591;
  --red:#f53f3f;--red-bg:#fff2f0;--red-bd:#ffccc7;
  --green:#00b42a;--green-bg:#e8ffea;--green-bd:#9fd8ad;
  --purple:#722ed1;--purple-bg:#f5edff;--purple-bd:#d3b3f5;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:3px;padding:6px 14px;min-height:32px}
button:hover{border-color:var(--blue);color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:var(--blue-d);color:#fff}
button.link{border:0;color:var(--blue);background:none;padding:3px 6px;min-height:0}
button.small{font-size:12px;min-height:26px;padding:3px 10px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:3px;background:#fff;padding:6px 11px;outline:0;min-height:32px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(22,93,255,.08)}
input::placeholder,textarea::placeholder{color:#a9aeb8}
textarea{min-height:80px;resize:vertical;line-height:1.6}
select{background:#f9fafb}
.hidden{display:none!important}
.req::before{content:"*";color:var(--red);margin-right:4px}

/* 框架 */
.topbar{position:fixed;inset:0 0 auto 0;height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:26px;z-index:30}
.logo{font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
.logo i{width:20px;height:20px;border-radius:5px;background:var(--blue);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.topbar .ti{font-size:13px;color:var(--sub)}
.topbar .tr{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:2px 8px;border-radius:3px;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.pill.gray{background:#f2f3f5;border-color:var(--line);color:var(--sub)}
.pill.orange{background:var(--orange-bg);border-color:var(--orange-bd);color:var(--orange)}
.sidebar{position:fixed;top:48px;bottom:0;left:0;width:204px;background:var(--bg);border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.appname{font-size:14px;font-weight:700;padding:8px 12px 12px}
.navg{font-size:12px;color:var(--muted);padding:12px 12px 4px}
.navi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;color:var(--sub);padding:9px 12px 9px 28px;margin:1px 0;font-size:13px;min-height:0}
.navi.active{color:var(--blue);background:var(--blue-bg)}
.main{margin:48px 0 0 204px;padding:24px 30px 80px;min-width:760px}

.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.pagehead h1{font-size:20px;margin:0;font-weight:650}
.pagehead .aux{margin-left:auto;display:flex;gap:8px;align-items:center}
.crumb2{font-size:12px;color:var(--muted);margin-bottom:18px}
.banner{background:var(--blue-bg);border:1px solid var(--blue-bd);color:#2b4a80;padding:9px 14px;border-radius:4px;font-size:12px;line-height:1.7;margin:14px 0 20px}
.banner.warn{background:var(--orange-bg);border-color:var(--orange-bd);color:var(--orange)}

/* 列表 */
.filters{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border:1px solid var(--line);padding:16px;border-radius:4px;margin-bottom:16px;background:#fff}
.filters label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.filters input,.filters select{width:160px}
.tablewrap{border:1px solid var(--line);border-radius:4px;overflow:auto;background:#fff}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--bg);color:var(--sub);font-weight:600;white-space:nowrap;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .s2{color:var(--muted);font-size:11.5px}
.switch{width:34px;height:19px;border:0;border-radius:10px;background:#c9cdd4;position:relative;padding:0;min-height:0}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--blue)}.switch.on::after{left:17px}

/* 表单 */
.steptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px;flex-wrap:wrap}
.steptabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 16px;font-size:13.5px;color:var(--sub)}
.steptabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.steptabs button:disabled{color:#c0c4cc;cursor:not-allowed}
.section{background:#fff;border:1px solid var(--line);border-radius:4px;margin-bottom:16px}
.section>.sh{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:650;font-size:15px;display:flex;align-items:center;gap:10px}
.section>.sb{padding:20px 22px}
.formrow{display:flex;margin-bottom:18px}
.formrow:last-child{margin-bottom:0}
.flabel{width:132px;flex:none;text-align:right;padding:7px 16px 0 0;color:var(--sub);font-size:13px}
.fctl{flex:1;min-width:0}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;max-width:920px}
.help{font-size:12px;color:var(--muted);line-height:1.7;margin-top:6px}
.help b{color:var(--sub)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 条件组 */
.condgroup{border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:12px;background:#fff}
.condgroup .gh{display:flex;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:11px}
.condgroup .gh .sp{flex:1}
.condline{display:grid;grid-template-columns:150px 1fr 130px 120px 30px;gap:8px;align-items:center;margin-bottom:8px}
.condline.flat{grid-template-columns:150px 1fr 30px}
.statichead{display:flex;align-items:center;margin:22px 0 12px;font-weight:600;font-size:13.5px}
.statichead::after{content:"";flex:1;height:1px;background:var(--line);margin-left:14px}
.addblock{background:var(--orange-bg);border:1px dashed var(--orange-bd);border-radius:4px;padding:15px 17px;margin-top:6px}
.addblock .at{font-weight:600;color:var(--orange);font-size:13px;margin-bottom:10px;display:flex;gap:8px;align-items:center}

/* 动作 */
.actioncard{border:1px solid var(--line);border-radius:4px;padding:15px 17px;margin-bottom:12px;background:#fff;position:relative}
.actioncard.flash{border:1.5px dashed var(--orange-bd);background:#fffcF7}
.actioncard.cardnew{border:1.5px dashed var(--blue-bd);background:var(--blue-bg)}
.actioncard .atop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.actioncard .atop .idx{font-weight:600}
.actioncard .atop .sp{flex:1}
.fieldblock{margin-bottom:12px}
.fieldblock label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
.cardpreview{background:#fff;border:1px solid var(--line);border-radius:6px;max-width:340px;margin-top:8px}
.cardpreview .cp-h{background:#f2f3f5;padding:8px 12px;font-size:12px;color:var(--muted);border-radius:6px 6px 0 0}
.cardpreview .cp-b{padding:12px;font-size:14px}
.phonebar{height:10px;width:60px;background:var(--line);border-radius:6px;margin:0 auto 10px}

/* 策略 */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:960px}
.sgrid .si{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sgrid input{width:74px}

/* Workflow */
.modebar{border:1px solid var(--blue-bd);background:var(--blue-bg);border-radius:4px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.modebar select{width:200px}
.wflayout{display:grid;grid-template-columns:minmax(460px,1fr) 320px;gap:14px}
.wfcanvas{border:1px solid var(--line);border-radius:4px;min-height:380px;overflow:auto;background:#fafbfe;
  background-image:radial-gradient(#dde2ea 1px,transparent 1px);background-size:16px 16px}
.wfcanvas svg{display:block;min-width:760px}
.wf-node{cursor:pointer}
.wf-node rect{fill:#eef4ff;stroke:#8babdc;stroke-width:1.5}
.wf-node.inference rect{fill:#f3edff;stroke:#b397d5}
.wf-node.sink rect{fill:#eafaf0;stroke:#7fcf95}
.wf-node.selected rect{stroke-width:3;stroke:var(--blue)}
.wf-node.invalid rect{stroke:var(--red);stroke-width:2.5}
.wf-node text{fill:#24314a;font-size:11.5px;pointer-events:none}
.wf-edge{stroke:#9dafc9;stroke-width:1.8;fill:none}
.wfprops{border:1px solid var(--line);border-radius:4px;background:#fff;padding:15px 17px;max-height:560px;overflow:auto}
.wfprops h4{margin:0 0 12px;font-size:14.5px}
.wfprops label{display:block;font-size:12px;color:var(--sub);margin:11px 0 5px}
.wfprops .nodecond{border:1px solid var(--line);border-radius:4px;padding:9px;margin-bottom:8px;background:var(--bg)}
.wftools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.wftools select{width:auto}
.wferr{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red);border-radius:4px;padding:10px 13px;margin:11px 0;font-size:12.5px}
.wferr button{display:block;text-align:left;border:0;background:none;color:var(--red);padding:3px 0;min-height:0}
.wflink{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.wflink .sp{flex:1}

/* 运行 */
.runsteps{display:flex;align-items:center;margin:18px 0;flex-wrap:wrap;gap:0}
.runstep{border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-size:12px;text-align:center;background:#fff;min-width:128px}
.runstep b{display:block;font-size:13px;margin-bottom:2px}
.runarrow{flex:1;min-width:24px;height:2px;background:#c6cfdd;position:relative}
.runarrow::after{content:"";position:absolute;right:-1px;top:-4px;border-left:8px solid #c6cfdd;border-top:5px solid transparent;border-bottom:5px solid transparent}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.r3 .r{border:1px solid var(--line);border-radius:4px;padding:13px 15px;background:#fff}
.r3 .r b{display:block;margin-bottom:4px}

/* 弹层/提示 */
.footer{position:fixed;left:204px;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 28px;display:flex;gap:10px;justify-content:flex-end;z-index:20}
.overlay{position:fixed;inset:0;background:rgba(29,33,41,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal{background:#fff;border-radius:8px;width:720px;max-width:95vw;max-height:90vh;overflow:auto;box-shadow:0 18px 60px rgba(0,0,0,.22)}
.modal.wide{width:1080px}
.modal .mh{padding:16px 22px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;font-size:16px}
.modal .mh .sp{flex:1}
.modal .mb{padding:20px 24px}
.modal .mf{padding:13px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.choosecard{border:1px solid var(--line);border-radius:5px;padding:15px 18px;margin-bottom:12px;cursor:pointer}
.choosecard:hover{border-color:var(--blue);background:var(--blue-bg)}
.choosecard b{font-size:14.5px}.choosecard p{margin:6px 0 0;font-size:12.5px;color:var(--sub)}
.toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#1d2129;color:#fff;padding:9px 18px;border-radius:5px;z-index:99;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.formerror{background:var(--red-bg);border:1px solid var(--red-bd);color:#cb272d;border-radius:4px;padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:1.9}
.pillswitch span{padding:4px 12px;border:1px solid var(--line);border-radius:12px;font-size:12px;cursor:pointer;background:#fff}
.pillswitch span.on{background:var(--blue);border-color:var(--blue);color:#fff}
@media(max-width:1180px){.wflayout{grid-template-columns:1fr}.fgrid2{grid-template-columns:1fr}.sgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><i>引</i>火山引擎 · AI 汽车管理平台</div>
  <span class="ti">产品与服务</span><span class="ti">控制台</span>
  <div class="tr"><span class="pill orange">本地原型 v10</span><span>不连接真实后台 · 不控车</span><span id="who">wangzemin.cxzm</span></div>
</header>
<aside class="sidebar">
  <div class="appname">AI 汽车管理平台</div>
  <div class="navg">模拟器</div><button class="navi">模拟器管理</button>
  <div class="navg">触发器</div>
  <button class="navi active" id="navScene">场景管理</button>
  <button class="navi" id="navRecord">触发记录</button>
  <div class="navg">Agent 管理</div><button class="navi">定义列表</button><button class="navi">实现列表</button>
  <div class="navg">Planner 管理</div><button class="navi">动态示例管理</button>
  <div class="navg">其他</div><button class="navi">记忆管理</button><button class="navi">日志查询</button><button class="navi">快捷工具</button>
</aside>
<main class="main" id="app"></main>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
/* 触发器配置平台交互原型 v10
 * 依据：技术方案《触发器支持系统预设场景》（10/9 评审）+ 豆包闪念需求（10/14）
 * 全部数据保存在内存/localStorage，仅本地演示。 */
'use strict';
/* ================= 能力字典（按技术方案 3.2/3.3，区分已接入/待接入） ================= */
const SIGNALS = [
  // 端状态
  {id:'gear', cat:'端状态', group:'车辆状态', name:'档位（动态事件）', type:'event', from:['P','R','N','D'], to:['P','R','N','D'], note:'状态跳变瞬间唤醒；不是“当前等于”'},
  {id:'speed',cat:'端状态', group:'车辆状态', name:'车速', type:'num', ops:['>','>=','<','<=','='], unit:'km/h'},
  {id:'charge_port',cat:'端状态', group:'车辆状态', name:'充电口盖状态', type:'enum', vals:['open','closed']},
  {id:'child_lock',cat:'端状态', group:'车辆状态', name:'儿童锁状态', type:'enum', vals:['on','off']},
  {id:'mirror_heat',cat:'端状态', group:'车辆状态', name:'后视镜加热状态', type:'enum', vals:['on','off'], status:'待确认', note:'技术方案依赖项，待赛力斯提供'},
  {id:'carwash_exit',cat:'端状态', group:'车辆状态', name:'退出传送带洗车', type:'enum', vals:['yes','no'], status:'待接入', note:'会上已确认：端状态暂无此信号，不能配置成可发布分支'},
  {id:'soc',cat:'端状态', group:'电量', name:'电量 SOC', type:'num', ops:['>','>=','<','<=','='], unit:'%'},
  // 账号配置开关
  {id:'use_ai',cat:'账号配置', group:'开关', name:'AI 服务总开关', type:'bool'},
  {id:'use_static_advisor',cat:'账号配置', group:'开关', name:'主动服务开关', type:'bool'},
  {id:'use_always_on',cat:'账号配置', group:'开关', name:'alwaysOn 开关', type:'bool', note:'闪念全天感知建议的前置降耗条件'},
  // VLM 低频（结构化）
  {id:'vlm_inside_001',cat:'VLM 舱内低频', group:'结构化', name:'舱内低频 · 乘客位置', type:'enum', vals:['主驾','副驾','左后','右后','二排中']},
  {id:'vlm_age',cat:'VLM 舱内低频', group:'结构化', name:'舱内低频 · 乘客性别', type:'enum', vals:['男','女','未知']},
  {id:'vlm_gender',cat:'VLM 舱内低频', group:'结构化', name:'舱内低频 · 乘客年龄段', type:'enum', vals:['婴儿','儿童','青中年','老年']},
  {id:'vlm_objects',cat:'VLM 舱内低频', group:'仅推理', name:'舱内低频 · 物品/动物描述', type:'caption', note:'Objects[].Desc 仅能由推理节点判断'},
  // VLM 高频
  {id:'vlm_inside_002',cat:'VLM 舱内高频', group:'仅推理', name:'舱内高频 · 乘客动作描述', type:'caption', note:'含“睡觉/打电话”等动作；仅推理'},
  // VLM 舱外
  {id:'vlm_out_weather',cat:'VLM 舱外', group:'枚举', name:'舱外 · 天气', type:'enum', vals:['下雨','下雪','浓雾']},
  {id:'vlm_out_road',cat:'VLM 舱外', group:'枚举', name:'舱外 · 路面', type:'enum', vals:['湿滑','覆雪结冰']},
  {id:'vlm_outside_caption',cat:'VLM 舱外', group:'仅推理', name:'舱外 · 其他视觉描述', type:'caption', status:'待确认', note:'当前只有天气/路面；“窗外风景”类描述尚无字段'}
];
const sigById = id => SIGNALS.find(s=>s.id===id);

/* ================= 动作字典（技术方案 3.4 + 闪念新增） ================= */
const ACTION_TYPES=[
 {v:'comfort_advisor',n:'舒适 Advisor',dev:false,params:['事件/注意力信息']},
 {v:'emotion_advisor',n:'情感 Advisor',dev:false,params:['事件/注意力信息']},
 {v:'navigation_advisor',n:'出行 Advisor',dev:false,params:['事件/注意力信息']},
 {v:'content_advisor',n:'内容 Advisor',dev:false,params:['事件/注意力信息']},
 {v:'recommend',n:'主动推荐',dev:false,params:['建议信息']},
 {v:'recommend_with_card',n:'主动推荐带交互卡',dev:true, params:['建议信息']},
 {v:'delay',n:'延时执行',dev:false,params:['延时时长(秒)']},
 {v:'custom_callback',n:'自定义回调',dev:false,params:['回调HTTP地址','回调任务系统','回调事件系统']},
 {v:'flash_text',n:'静默文字通知（豆包闪念）',dev:true,flash:true,params:['闪念固定文案']}
];

/* ================= 业务模板（对应技术方案三个案例 + 闪念） ================= */
const cond=(id,name,rows,join='AND')=>({id,kind:'condition',name,join,rows:rows.map(r=>({signal:r[0],op:r[1]??'=',value:r[2]??'',extra:r[3]??''}))});
const infer=(id,name,signal,goal,join='AND')=>({id,kind:'inference',name,join,signal,goal});
const TEMPLATES={
 child:{name:'[测试] 儿童锁保护（系统预设）',cat:'preset',stype:'mix',mode:'Workflow',
   nodes:[cond('g', '任务与档位前置',[['use_static_advisor','=','true'],['gear','变更为','D']]),
          cond('c', '后排存在儿童',[['vlm_inside_001','=','左后'],['vlm_gender','=','儿童']]),
          infer('p','后排存在宠物','vlm_objects','画面中是否存在后排宠物（只回答达成/未达成）'),
          cond('k', '儿童锁未开启（终点）',[['child_lock','=','off']],'OR')],
   edges:[['g','c'],['g','p'],['c','k'],['p','k']],
   action:{type:'recommend_with_card',input:'出行 advisor：本次已识别后排儿童或宠物，且儿童锁未开启。建议询问用户是否开启儿童锁。策略：先询问，确认后执行。'}},
 charge:{name:'[测试] 识别充电设备后打开充电口盖（系统预设）',cat:'preset',stype:'mix',mode:'Workflow',
   nodes:[cond('s','主动服务与停车前置',[['use_static_advisor','=','true'],['gear','变更为','P']]),
          cond('cv','充电口盖关闭',[['charge_port','=','closed']]),
          cond('soc','SOC ≤ 20%（终点，阈值待最终确认）',[['soc','<=','20']])],
   edges:[['s','cv'],['cv','soc']],

/* ================= Workflow DAG ================= */
function addNode(kind){if(readonly)return;const id='z'+Date.now().toString(36);
 wf.nodes.push(kind==='condition'
   ?{id,kind:'condition',name:'新条件节点',join:'AND',rows:[{signal:'',op:'=',value:''}]}
   :{id,kind:'inference',name:'新推理节点',join:'AND',signal:'',goal:''});
 selNode=id;render()}
function delNode(id){wf.nodes=wf.nodes.filter(n=>n.id!==id);wf.edges=wf.edges.filter(e=>!e.includes(id));selNode=wf.nodes[0]?.id||null;render()}
function layout(g){
 g=g||wf;
 // 层级：沿边计算深度
 const depth={};
 const dfs=(id,vis)=>{if(vis.has(id))return;vis.add(id);g.edges.filter(e=>e[1]===id).forEach(e=>dfs(e[0],vis));depth[id]=(depth[id]!==undefined?depth[id]:0)};
 g.nodes.forEach(n=>{const inE=g.edges.filter(e=>e[1]===n.id);depth[n.id]=inE.length?1+Math.max(...inE.map(e=>depth[e[0]]??0)):0});
 let max=Math.max(1,...Object.values(depth));
 const buckets={};
 g.nodes.forEach(n=>(buckets[depth[n.id]]??=[]).push(n));
 const pos={};
 Object.entries(buckets).forEach(([d,arr])=>arr.forEach((n,i)=>{
   pos[n.id]={x:28+Number(d)*(720/max),y:24+i*Math.min(132,300/Math.max(1,arr.length))};
 }));
 return pos;
}
function topo(){
 const d=Object.fromEntries(wf.nodes.map(n=>[n.id,0]));wf.edges.forEach(e=>d[e[1]]=(d[e[1]]||0)+1);
 const q=wf.nodes.filter(n=>d[n.id]===0).map(n=>n.id),out=[];
 while(q.length){const id=q.shift();out.push(id);wf.edges.filter(e=>e[0]===id).forEach(e=>{if(--d[e[1]]===0)q.push(e[1])})}
 return out;
}
function graphIssues(){
 const errs=[],ids=wf.nodes.map(n=>n.id);
 if(!wf.nodes.length)errs.push('请至少添加一个判断节点');
 if(new Set(ids).size!==ids.length)errs.push('节点标识重复');
 const seen=new Set();
 wf.edges.forEach(e=>{if(!ids.includes(e[0])||!ids.includes(e[1]))errs.push('存在引用不存在节点的连线');if(e[0]===e[1])errs.push('节点不能连接自己');if(seen.has(e.join('>')))errs.push('存在重复连线');seen.add(e.join('>'))});
 if(topo().length!==ids.length)errs.push('存在循环：判断图必须是有向无环图');
 const sinks=wf.nodes.filter(n=>!wf.edges.some(e=>e[0]===n.id));
 if(sinks.length!==1)errs.push('必须有且只有一个终点，当前 '+sinks.length+' 个');
 wf.nodes.forEach(n=>{
   if(!n.name.trim())errs.push(n.name+': 节点名称不能为空');
   const preds=wf.edges.filter(e=>e[1]===n.id);
   if(n.join==='OR'&&preds.length<2)errs.push(n.name+': 选了 OR 但直接前驱不足 2 个');
   if(n.kind==='condition'){(n.rows||[]).forEach(r=>{if(!r.signal)errs.push(n.name+': 条件未选择信号');else{const s=sigById(r.signal);if(s?.type!=='bool'&&!r.value&&s?.type!=='event')errs.push(n.name+': 条件值未填写')}})}
   else{if(!n.signal)errs.push(n.name+': 未选择推理输入信号');if(!n.goal.trim())errs.push(n.name+': 未填写判断目标')}
 });
 return [...new Set(errs)];
}

}

 else body+='<div class="help" style="color:var(--orange)">只读：点击右上角“复制为新 Workflow”后可修改。</div>';

function condValForProps(n,r,i){

 if(s.type==='event')return `<select onchange="setRow('${n.id}',${i},'value',this.value)">${s.to.map(v=>`<option ${r.value===v?'selected':''}>${v}</option>`).join('')}</select><span class="help">变更为（从任意状态）</span>`;

 return `<input type="number" value="${esc(r.value)}" placeholder="${s.unit}" oninput="setRow('${n.id}',${i},'value',this.value)">`;
}

/* ================= 校验 ================= */
function validateAll(){
 const errs=[];
 if(!form.name.trim())errs.push('请填写场景名称');
 if(!form.priority||form.priority<1)errs.push('优先级需为不小于 1 的整数');
 const hasStatic=form.static.some(c=>c.signal&&c.value!==undefined);
 const hasDyn=form.dynamic.some(c=>c.signal&&c.value);
 const hasInfer=!!(form.inference.signal&&form.inference.goal.trim());
 if(formMode==='简单'){
   if(!hasStatic&&!hasDyn&&!hasInfer)errs.push('至少配置一个动态 / 静态 / 视觉推理条件');
   if(form.inference.signal&&!form.inference.goal.trim())errs.push('视觉推理条件已选信号，请填写判断目标');
 }
 if(formMode==='Workflow'){
   const g=graphIssues();errs.push(...g);
   if(form.stype==='timer')errs.push('Workflow 本期不支持定时节点');
 }
 form.actions.forEach((a,i)=>{const m=ACTION_TYPES.find(t=>t.v===a.type);if((m.params||[]).length&&!a.input.trim())errs.push('动作实例 '+(i+1)+'：请填写「'+m.params[0]+'」')});
 if(form.actions.some(a=>a.type==='flash_text')&&!(+form.m||+form.s))errs.push('闪念静默通知场景的执行最小间隔不能为 0');
 return errs;
}
function doValidate(save){
 const errs=validateAll();
 const box=$('formErr');
 if(errs.length){box.innerHTML='<div class="formerror">'+errs.map(e=>'• '+esc(e)).join('<br>')+'</div>';if(!save)toast('校验未通过');return}
 box.innerHTML='';if(!save){toast('本地校验通过（不代表真实后台校验或已生效）');return}
 toast('草稿已保存在本原型；未发布、未控车');
}

  <div class="r"><b style="color:var(--green)">车辆/业务结果</b><span class="help" style="margin:0">由下游链路回传，不反向推定；闪念无车控</span></div></div>`;
}
window.runDetail=(key,outcome)=>{
 const t=TEMPLATES[key];
 const g={nodes:JSON.parse(JSON.stringify(t.nodes)),edges:t.edges.map(e=>[...e])};
 const pos=layout(g);
 const fake=g.nodes;
 const st={child:{g:'PASS',c:'PASS',p:'REJECT',k:'PASS'},mirror:{m1:'PASS',r:'UNKNOWN',k:'SKIPPED',w:'SKIPPED'},flash:{ao:'PASS',sl:'PASS',out:'PASS'}}[key];
 modalRoot.innerHTML=`<div class="overlay" onclick="if(event.target===this)modalRoot.innerHTML=''"><div class="modal wide">
  <div class="mh">本次 Workflow 运行 · ${esc(t.name)}<span class="sp"></span><span class="pill ${outcome==='PASS'?'':'orange'}">${outcome}</span><button onclick="modalRoot.innerHTML=''">×</button></div>
  <div class="mb"><div class="wfcanvas"><svg width="1000" height="380" viewBox="0 0 980 380">
   <defs><marker id="ar10d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9dafc9"/></marker></defs>
   ${g.edges.map(e=>{const a=pos[e[0]],b=pos[e[1]];return `<path class="wf-edge" d="M${a.x+196} ${a.y+42} C ${a.x+250} ${a.y+42},${b.x-50} ${b.y+42},${b.x} ${b.y+42}" marker-end="url(#ar10d)"/>`}).join('')}
   ${fake.map(n=>{const p=pos[n.id],r=st[n.id]||'';const col=r==='PASS'?'#00b42a':r==='REJECT'?'#f53f3f':r==='UNKNOWN'?'#ff7d00':'#86909c';
     return `<g><rect x="${p.x}" y="${p.y}" width="196" height="84" rx="6" fill="${n.kind==='inference'?'#f3edff':'#eef4ff'}" stroke="${col}" stroke-width="2"/>
       <text x="${p.x+12}" y="${p.y+24}">${n.kind==='condition'?'条件':'推理'}</text><text x="${p.x+12}" y="${p.y+48}" style="font-weight:600">${esc(n.name).slice(0,14)}</text><text x="${p.x+12}" y="${p.y+70}" fill="${col}" style="font-weight:700">${r}</text></g>`}).join('')}
  </svg></div>
  <table style="margin-top:14px"><thead><tr><th>节点</th><th>结果</th><th>说明</th></tr></thead><tbody>
   ${fake.map(n=>`<tr><td>${esc(n.name)}</td><td>${st[n.id]}</td><td class="s2">${st[n.id]==='PASS'?'执行器返回满足':st[n.id]==='REJECT'?'明确不满足':st[n.id]==='UNKNOWN'?'输入缺失/模型失败/超时（不当作失败）':'前驱未放行，本节点未运行'}</td></tr>`).join('')}
  </tbody></table>
  <p class="help">FINISHED=PASS/REJECT/UNKNOWN；FAILED=基础设施异常固定 UNKNOWN；SKIPPED 用 BlockedBy 记录前驱原因。整图等全部节点终态后取唯一终点结果，不按通过节点数投票。</p>
 </div></div></div>`;
};

 if(view==='list')renderList();
 else if(view==='form')renderForm();
 else if(view==='records')renderRecords();
}
navScene.onclick=()=>{view='list';render()};
navRecord.onclick=openRecords;
render();

</script>
