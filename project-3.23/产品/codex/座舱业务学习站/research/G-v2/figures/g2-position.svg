<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="g2-position" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="g2-position-title g2-position-desc">
<title id="g2-position-title">同一个触发器，在三条链路里等不同的条件</title><desc id="g2-position-desc">用户任务回到任务服务；业务预设按出口派发；语义条件把预配建议并入本轮对话。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="g2-position-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">同一个触发器，在三条链路里等不同的条件</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">用户任务回到任务服务；业务预设按出口派发；语义条件把预配建议并入本轮对话。</text>
<text class="v56-label" x="40" y="115" text-anchor="start">用户任务 · T 章</text>
<g data-node="true" id="g2-position-user"><rect class="v56-local" x="40" y="130" width="190" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="158" text-anchor="start">用户说出以后要办的事</text>
<text class="v56-node-sub" x="54" y="186" text-anchor="start">Planner 理解诉求</text>
<text class="v56-node-sub" x="54" y="210" text-anchor="start">交给任务服务</text>
</g>
<g data-node="true" id="g2-position-task"><rect class="v56-cloud" x="260" y="130" width="190" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="274" y="158" text-anchor="start">任务服务</text>
<text class="v56-node-sub" x="274" y="186" text-anchor="start">保存任务</text>
<text class="v56-node-sub" x="274" y="210" text-anchor="start">登记等待规则</text>
</g>
<path class="v56-arrow" d="M 230 185 L 260 185" marker-end="url(#g2-position-arr)"/>
<path class="v56-arrow" d="M 450 185 L 520 185 L 520 300" marker-end="url(#g2-position-arr)"/>
<text class="v56-label" x="40" y="300" text-anchor="start">业务预设 · 产品预先配置</text>
<g data-node="true" id="g2-position-vehicle"><rect class="v56-local" x="40" y="320" width="360" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="348" text-anchor="start">车况变化</text>
<text class="v56-node-sub" x="54" y="376" text-anchor="start">例如：座位从空变为有人</text>
<text class="v56-node-sub" x="54" y="400" text-anchor="start">叫醒“上车问候”场景</text>
</g>
<path class="v56-arrow" d="M 400 375 L 490 375" marker-end="url(#g2-position-arr)"/>
<g data-node="true" id="g2-position-trigger"><rect class="v56-cloud" x="490" y="300" width="210" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="504" y="328" text-anchor="start">触发器</text>
<text class="v56-node-sub" x="504" y="356" text-anchor="start">等条件、判断、过频控</text>
<text class="v56-node-sub" x="504" y="380" text-anchor="start">按登记的出口交接</text>
<text class="v56-node-sub" x="504" y="404" text-anchor="start">三条链路共用这个服务</text>
</g>
<g data-node="true" id="g2-position-callback"><rect class="v56-cloud" x="740" y="130" width="190" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="754" y="158" text-anchor="start">回调任务服务</text>
<text class="v56-node-sub" x="754" y="186" text-anchor="start">生成一次运行</text>
<text class="v56-node-sub" x="754" y="210" text-anchor="start">再送回 Planner</text>
</g>
<path class="v56-arrow" d="M 650 300 L 650 270 L 835 270 L 835 240" marker-end="url(#g2-position-arr)"/>
<g data-node="true" id="g2-position-advisor"><rect class="v56-decision" x="740" y="320" width="190" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="754" y="348" text-anchor="start">静态 Advisor</text>
<text class="v56-node-sub" x="754" y="376" text-anchor="start">决定是否生成建议</text>
<text class="v56-node-sub" x="754" y="400" text-anchor="start">可以正常静默</text>
</g>
<path class="v56-arrow" d="M 700 350 L 740 350" marker-end="url(#g2-position-arr)"/>
<g data-node="true" id="g2-position-planner"><rect class="v56-decision" x="950" y="300" width="210" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="964" y="328" text-anchor="start">Planner</text>
<text class="v56-node-sub" x="964" y="356" text-anchor="start">结合当时情况</text>
<text class="v56-node-sub" x="964" y="380" text-anchor="start">决定说什么、做什么</text>
</g>
<path class="v56-arrow" d="M 930 185 L 1055 185 L 1055 300" marker-end="url(#g2-position-arr)"/>
<path class="v56-arrow" d="M 930 375 L 950 375" marker-end="url(#g2-position-arr)"/>
<g data-node="true" id="g2-position-flash"><rect class="v56-local v56-pending" x="740" y="520" width="420" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="754" y="548" text-anchor="start">闪念通知卡</text>
<text class="v56-node-sub" x="754" y="576" text-anchor="start">另一出口：普通通知卡，不进 Planner、不播语音</text>
</g>
<path class="v56-arrow v56-pending" d="M 650 440 L 650 570 L 740 570" marker-end="url(#g2-position-arr)"/>
<text class="v56-label" x="40" y="550" text-anchor="start">语义条件 · 新方向，尚未验收</text>
<g data-node="true" id="g2-position-semantic"><rect class="v56-local v56-pending" x="40" y="570" width="360" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="598" text-anchor="start">用户说完话 → 快速场景判断</text>
<text class="v56-node-sub" x="54" y="626" text-anchor="start">从后台预设场景里选出命中项</text>
<text class="v56-node-sub" x="54" y="650" text-anchor="start">触发器取得相应的预配建议</text>
<text class="v56-node-sub" x="54" y="674" text-anchor="start">详细流程见语义条件图</text>
</g>
<path class="v56-arrow v56-pending" d="M 400 635 L 460 635 L 460 420 L 490 420" marker-end="url(#g2-position-arr)"/>
<path class="v56-arrow v56-pending" d="M 550 440 L 550 750 L 1180 750 L 1180 420 L 1160 420" marker-end="url(#g2-position-arr)"/>
<text class="v56-label" x="580" y="732" text-anchor="start">预配建议 + 本轮话 + 上下文，一起交给 Planner</text>
<text class="v56-subtitle" x="40" y="802" text-anchor="start">虚线：语义条件新方向，以及闪念改造设计；两者都不能据此认定已上线。</text>
<path class="v56-rule" d="M 32 835 L 1168 835"/>
<text class="v56-node-title" x="32" y="869" text-anchor="start">触发器的位置相同，交给谁取决于登记的出口。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="895" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="909" text-anchor="start">蓝：车上输入与展示</text>
<rect data-decoration="true" class="v56-cloud" x="410.6666666666667" y="895" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="909" text-anchor="start">绿：任务服务与触发器</text>
<rect data-decoration="true" class="v56-decision" x="789.3333333333334" y="895" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="909" text-anchor="start">黄：建议与当下决策</text>
</svg>
