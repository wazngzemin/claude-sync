<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="c-arch" width="1240" height="970" viewBox="0 0 1240 970" role="img" aria-labelledby="c-arch-title c-arch-desc"><title id="c-arch-title">从“一个模型统一筛”到“各源自己筛 + 不够再查”</title><desc id="c-arch-desc">早期由统一精筛挑内容；现在各类信息分别筛选，Planner 缺什么再调查询工具。</desc><style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style><defs><marker id="c-arch-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs><text class="v56-title" x="32" y="44" text-anchor="start">从“一个模型统一筛”到“各源自己筛 + 不够再查”</text><text class="v56-subtitle" x="32" y="72" text-anchor="start">早期由统一精筛挑内容；现在各类信息分别筛选，Planner 缺什么再调查询工具。</text><text class="v56-label" x="32" y="116" text-anchor="start">早期：统一精筛</text><text class="v56-label" x="650" y="116" text-anchor="start">现在：各源自己筛 + 不够再查</text><g data-node="true"><rect class="v56-neutral" x="32" y="140" width="550" height="80" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="46" y="167" text-anchor="start">多类信息</text><text class="v56-node-sub" x="46" y="192" text-anchor="start">用户记忆、车况、车内情景、外部世界</text></g><g data-node="true"><rect class="v56-neutral" x="32" y="270" width="550" height="160" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="46" y="297" text-anchor="start">粗筛 → 统一精筛 → 交给 Planner</text><text class="v56-node-sub" x="46" y="322" text-anchor="start">各源并行先粗选一遍，尽量留下可能相关的</text><text class="v56-node-sub" x="46" y="343" text-anchor="start">再由一个模型统一挑；为了快，只允许输出 5 条</text><text class="v56-node-sub" x="46" y="364" text-anchor="start">车况要调两次模型</text></g><g data-node="true"><rect class="v56-reject" x="32" y="500" width="550" height="230" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="46" y="527" text-anchor="start">上线后的问题</text><text class="v56-node-sub" x="46" y="552" text-anchor="start">排在前面的数据更容易被放行（位置偏好）</text><text class="v56-node-sub" x="46" y="573" text-anchor="start">一个源准了，另一个源就变差</text><text class="v56-node-sub" x="46" y="594" text-anchor="start">设计目标 P90 800 毫秒，实际 1.2 秒</text><text class="v56-node-sub" x="46" y="615" text-anchor="start">还发现：精筛只出 5 条，相关记忆会被错筛掉</text></g><g data-node="true"><rect class="v56-neutral" x="650" y="140" width="550" height="80" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="664" y="167" text-anchor="start">多类信息</text><text class="v56-node-sub" x="664" y="192" text-anchor="start">用户记忆、车况、车内情景、外部世界</text></g><g data-node="true"><rect class="v56-cloud" x="650" y="270" width="550" height="110" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="664" y="297" text-anchor="start">各源自己筛、自己负责质量</text><text class="v56-node-sub" x="664" y="322" text-anchor="start">职责尽量不重叠，取消统一精筛</text><text class="v56-node-sub" x="664" y="343" text-anchor="start">线上 P90 约 360 毫秒</text></g><g data-node="true"><rect class="v56-cloud" x="650" y="430" width="550" height="95" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="664" y="457" text-anchor="start">预注入：只带大多数时候用得上的</text><text class="v56-node-sub" x="664" y="482" text-anchor="start">目标：大约八成常规请求不用再查</text></g><g data-node="true"><rect class="v56-decision" x="650" y="575" width="550" height="125" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="664" y="602" text-anchor="start">Planner 判断材料够不够</text><text class="v56-node-sub" x="664" y="627" text-anchor="start">够：直接回答或动手</text><text class="v56-node-sub" x="664" y="648" text-anchor="start">不够：动态检索；Planner 调查询工具按需查</text><text class="v56-node-sub" x="664" y="669" text-anchor="start">补查结果作为工具反馈进入下一次推理</text></g><g data-node="true"><rect class="v56-reject" x="650" y="750" width="550" height="105" rx="8" stroke-width="1.6"/><text class="v56-node-title" x="664" y="777" text-anchor="start">代价</text><text class="v56-node-sub" x="664" y="802" text-anchor="start">预注入带少了答不出，带多了模型分心</text><text class="v56-node-sub" x="664" y="823" text-anchor="start">每个人需要的常用背景不同，难以对所有人都好</text></g><path class="v56-arrow" d="M 307 220 L 307 270" marker-end="url(#c-arch-arr)"/><path class="v56-arrow" d="M 307 430 L 307 500" marker-end="url(#c-arch-arr)"/><path class="v56-arrow" d="M 925 220 L 925 270" marker-end="url(#c-arch-arr)"/><path class="v56-arrow" d="M 925 380 L 925 430" marker-end="url(#c-arch-arr)"/><path class="v56-arrow" d="M 925 525 L 925 575" marker-end="url(#c-arch-arr)"/><path class="v56-arrow" d="M 925 700 L 925 750" marker-end="url(#c-arch-arr)"/><rect data-role="legend" class="v56-neutral" x="32" y="910" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="60" y="924" text-anchor="start">灰：信息与旧处理</text><rect data-role="legend" class="v56-cloud" x="209" y="910" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="237" y="924" text-anchor="start">绿：各源筛选与供给</text><rect data-role="legend" class="v56-decision" x="400" y="910" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="428" y="924" text-anchor="start">黄：Planner 判断</text><rect data-role="legend" class="v56-reject" x="633" y="910" width="18" height="18" rx="8" stroke-width="1.6"/><text class="v56-subtitle" x="661" y="924" text-anchor="start">红：问题与代价</text></svg>