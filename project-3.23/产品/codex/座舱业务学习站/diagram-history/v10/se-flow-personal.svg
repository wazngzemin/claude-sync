  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">流程 B｜个人成长：午睡纠偏怎样影响下一次</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,220 350,286" marker-end="url(#arrow-se-flow-personal)"><title>SE-P1 → SE-P2：明确包含今后意图</title></polyline><polyline class="arr" fill="none" points="350,410 350,476" marker-end="url(#arrow-se-flow-personal)"><title>SE-P2 → SE-P3：身份与范围明确</title></polyline><polyline class="arr" fill="none" points="350,600 350,666" marker-end="url(#arrow-se-flow-personal)"><title>SE-P3 → SE-P4：确定 add/update/delete</title></polyline><polyline class="arr" fill="none" points="350,790 350,856" marker-end="url(#arrow-se-flow-personal)"><title>SE-P4 → SE-P5：读取真实保存结果</title></polyline><polyline class="arr-alt" fill="none" points="350,980 350,1046" marker-end="url(#arrow-se-flow-personal)"><title>SE-P5 → SE-P6：成功后，未来相关请求</title></polyline><polyline class="arr-alt" fill="none" points="350,1170 350,1236" marker-end="url(#arrow-se-flow-personal)"><title>SE-P6 → SE-P7：适用规则提供参考</title></polyline><polyline class="arr" fill="none" points="350,1360 350,1426" marker-end="url(#arrow-se-flow-personal)"><title>SE-P7 → SE-P8：本轮 action_list</title></polyline><polyline class="arr" fill="none" points="350,1550 350,1616" marker-end="url(#arrow-se-flow-personal)"><title>SE-P8 → SE-P9：用户感受与新反馈</title></polyline><polyline class="arr" fill="none" points="176,1670 110,1670 110,362 170,362" marker-end="url(#arrow-se-flow-personal)"><title>SE-P9 → SE-P2：确认修改或删除范围</title></polyline><text class="ts" x="365" y="256" text-anchor="start" dominant-baseline="central">E1 · 明确包含今后意图</text><text class="ts" x="365" y="446" text-anchor="start" dominant-baseline="central">E2 · 身份与范围明确</text><text class="ts" x="365" y="636" text-anchor="start" dominant-baseline="central">E3 · 确定 add/update/delete</text><text class="ts" x="365" y="826" text-anchor="start" dominant-baseline="central">E4 · 读取真实保存结果</text><text class="ts" x="365" y="1016" text-anchor="start" dominant-baseline="central">E5 · 成功后，未来相关请求</text><text class="ts" x="365" y="1206" text-anchor="start" dominant-baseline="central">E6 · 适用规则提供参考</text><text class="ts" x="365" y="1396" text-anchor="start" dominant-baseline="central">E7 · 本轮 action_list</text><text class="ts" x="365" y="1586" text-anchor="start" dominant-baseline="central">E8 · 用户感受与新反馈</text><text class="ts" x="168" y="1662" text-anchor="end" dominant-baseline="central">E9</text><text class="ts" x="168" y="374" text-anchor="end" dominant-baseline="central">E9</text><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-personal" data-step="SE-P1" aria-label="用户纠正当前服务"><title>“现在关掉音乐”先处理当下；“以后午睡也别放”才包含长期意图</title><rect x="180" y="106" width="340" height="110" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">用户纠正当前服务</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">“现在关掉音乐”先处理当下</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central">“以后午睡也别放”才包含长期意图</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-personal" data-step="SE-P2" aria-label="确认归属与范围"><title>谁的习惯、何种场景、是否明确；模糊或涉及他人时先澄清</title><rect x="180" y="296" width="340" height="110" rx="6"/><text class="th" x="198" y="320" text-anchor="start" dominant-baseline="central">确认归属与范围</text><text class="ts" x="198" y="348" text-anchor="start" dominant-baseline="central">谁的习惯、何种场景、是否明确</text><text class="ts" x="198" y="367" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central">模糊或涉及他人时先澄清</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-personal" data-step="SE-P3" aria-label="找已有规则"><title>区分新增、修改、删除；避免同一午睡偏好重复且互相冲突</title><rect x="180" y="486" width="340" height="110" rx="6"/><text class="th" x="198" y="510" text-anchor="start" dominant-baseline="central">找已有规则</text><text class="ts" x="198" y="538" text-anchor="start" dominant-baseline="central">区分新增、修改、删除</text><text class="ts" x="198" y="557" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="576" text-anchor="start" dominant-baseline="central">避免同一午睡偏好重复且互相冲突</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="se-flow-personal" data-step="SE-P4" aria-label="记录个人技能"><title>op、名称、条件与行动规则；update/delete 必须有 skill_id</title><rect x="180" y="676" width="340" height="110" rx="6"/><text class="th" x="198" y="700" text-anchor="start" dominant-baseline="central">记录个人技能</text><text class="ts" x="198" y="728" text-anchor="start" dominant-baseline="central">op、名称、条件与行动规则</text><text class="ts" x="198" y="747" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="766" text-anchor="start" dominant-baseline="central">update/delete 必须有 skill_id</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-personal" data-step="SE-P5" aria-label="确认持久化结果"><title>成功才说已保存；失败如实说明；不把生成参数当保存成功</title><rect x="180" y="866" width="340" height="110" rx="6"/><text class="th" x="198" y="890" text-anchor="start" dominant-baseline="central">确认持久化结果</text><text class="ts" x="198" y="918" text-anchor="start" dominant-baseline="central">成功才说已保存；失败如实说明</text><text class="ts" x="198" y="937" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="956" text-anchor="start" dominant-baseline="central">不把生成参数当保存成功</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-personal" data-step="SE-P6" aria-label="下次请求取回适用项"><title>身份与权限匹配后按场景召回；不越到其他乘客或车型范围</title><rect x="180" y="1056" width="340" height="110" rx="6"/><text class="th" x="198" y="1080" text-anchor="start" dominant-baseline="central">下次请求取回适用项</text><text class="ts" x="198" y="1108" text-anchor="start" dominant-baseline="central">身份与权限匹配后按场景召回</text><text class="ts" x="198" y="1127" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1146" text-anchor="start" dominant-baseline="central">不越到其他乘客或车型范围</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-personal" data-step="SE-P7" aria-label="重新规划本轮动作"><title>结合当前车况、用户改口与安全；不机械重放上一次完整动作</title><rect x="180" y="1246" width="340" height="110" rx="6"/><text class="th" x="198" y="1270" text-anchor="start" dominant-baseline="central">重新规划本轮动作</text><text class="ts" x="198" y="1298" text-anchor="start" dominant-baseline="central">结合当前车况、用户改口与安全</text><text class="ts" x="198" y="1317" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1336" text-anchor="start" dominant-baseline="central">不机械重放上一次完整动作</text></g><g class="c-teal" role="link" tabindex="0" data-page="SE" data-flow="se-flow-personal" data-step="SE-P8" aria-label="工具执行并核验"><title>分别看受理、完成、失败；真实音乐/灯光/车辆结果才算落实</title><rect x="180" y="1436" width="340" height="110" rx="6"/><text class="th" x="198" y="1460" text-anchor="start" dominant-baseline="central">工具执行并核验</text><text class="ts" x="198" y="1488" text-anchor="start" dominant-baseline="central">分别看受理、完成、失败</text><text class="ts" x="198" y="1507" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1526" text-anchor="start" dominant-baseline="central">真实音乐/灯光/车辆结果才算落实</text></g><g class="c-gray" role="link" tabindex="0" data-page="SE" data-flow="se-flow-personal" data-step="SE-P9" aria-label="再纠偏或撤销"><title>用户可修改或不再沿用；撤销不等于倒转已经发生的动作</title><rect x="180" y="1626" width="340" height="110" rx="6"/><text class="th" x="198" y="1650" text-anchor="start" dominant-baseline="central">再纠偏或撤销</text><text class="ts" x="198" y="1678" text-anchor="start" dominant-baseline="central">用户可修改或不再沿用</text><text class="ts" x="198" y="1697" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1716" text-anchor="start" dominant-baseline="central">撤销不等于倒转已经发生的动作</text></g><text class="th" x="40" y="1820" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1850" text-anchor="start" dominant-baseline="central">E1 用户纠正当前服务 → 确认归属与范围：明确包含今后意图</text><text class="ts" x="40" y="1883" text-anchor="start" dominant-baseline="central">E2 确认归属与范围 → 找已有规则：身份与范围明确</text><text class="ts" x="40" y="1916" text-anchor="start" dominant-baseline="central">E3 找已有规则 → 记录个人技能：确定 add/update/delete</text><text class="ts" x="40" y="1949" text-anchor="start" dominant-baseline="central">E4 记录个人技能 → 确认持久化结果：读取真实保存结果</text><text class="ts" x="40" y="1982" text-anchor="start" dominant-baseline="central">E5 确认持久化结果 → 下次请求取回适用项：成功后，未来相关请求〔规划/待核〕</text><text class="ts" x="40" y="2015" text-anchor="start" dominant-baseline="central">E6 下次请求取回适用项 → 重新规划本轮动作：适用规则提供参考〔规划/待核〕</text><text class="ts" x="40" y="2048" text-anchor="start" dominant-baseline="central">E7 重新规划本轮动作 → 工具执行并核验：本轮 action_list</text><text class="ts" x="40" y="2081" text-anchor="start" dominant-baseline="central">E8 工具执行并核验 → 再纠偏或撤销：用户感受与新反馈</text><text class="ts" x="40" y="2114" text-anchor="start" dominant-baseline="central">E9 再纠偏或撤销 → 确认归属与范围：确认修改或删除范围</text></svg>