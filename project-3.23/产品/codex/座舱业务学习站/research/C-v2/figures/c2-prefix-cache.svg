<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="c2-prefix-cache" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="c2-prefix-cache-title c2-prefix-cache-desc">
<title id="c2-prefix-cache-title">前面完全相同，才可以复用</title><desc id="c2-prefix-cache-desc">同一请求的续轮可复用原输入；下一个请求通常只有开头的固定说明可能复用。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="c2-prefix-cache-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">前面完全相同，才可以复用</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">同一请求的续轮可复用原输入；下一个请求通常只有开头的固定说明可能复用。</text>
<text class="v56-label" x="32" y="126" text-anchor="start">三条横条表示三次调用的输入；从左往右读取，不表示内容长度占比。</text>
<text class="v56-node-title" x="32" y="217" text-anchor="start">① 首次调用</text>
<text class="v56-node-sub" x="32" y="243" text-anchor="start">先计算整段输入</text>
<g data-node="true" id="c2-prefix-cache-n1"><rect class="v56-neutral" x="220" y="190" width="200" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="234" y="217" text-anchor="start">固定说明</text>
<text class="v56-node-sub" x="234" y="242" text-anchor="start">角色、工具定义等</text>
</g>
<g data-node="true" id="c2-prefix-cache-n2"><rect class="v56-neutral" x="436" y="190" width="200" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="450" y="217" text-anchor="start">动态背景</text>
<text class="v56-node-sub" x="450" y="242" text-anchor="start">按这句话填</text>
</g>
<g data-node="true" id="c2-prefix-cache-n3"><rect class="v56-neutral" x="652" y="190" width="200" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="666" y="217" text-anchor="start">历史</text>
<text class="v56-node-sub" x="666" y="242" text-anchor="start">过去几轮对话</text>
</g>
<g data-node="true" id="c2-prefix-cache-n4"><rect class="v56-neutral" x="868" y="190" width="172" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="882" y="217" text-anchor="start">这一轮</text>
<text class="v56-node-sub" x="882" y="242" text-anchor="start">当前输入</text>
</g>
<text class="v56-node-title" x="32" y="407" text-anchor="start">② 同一请求续轮</text>
<text class="v56-node-sub" x="32" y="433" text-anchor="start">工具结果回来后</text>
<text class="v56-label" x="220" y="345" text-anchor="start">前面完全相同：可复用</text>
<text class="v56-label" x="1056" y="345" text-anchor="start">只算新增</text>
<g data-node="true" id="c2-prefix-cache-n5"><rect class="v56-cloud" x="220" y="380" width="820" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="234" y="407" text-anchor="start">固定说明 + 动态背景 + 历史 + 这一轮</text>
<text class="v56-node-sub" x="234" y="432" text-anchor="start">与上一次完全相同的开头，可复用已算好的结果</text>
</g>
<g data-node="true" id="c2-prefix-cache-n6"><rect class="v56-decision" x="1056" y="380" width="112" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="1070" y="407" text-anchor="start">工具反馈</text>
<text class="v56-node-sub" x="1070" y="432" text-anchor="start">新增部分</text>
</g>
<text class="v56-node-title" x="32" y="597" text-anchor="start">③ 下一个请求</text>
<text class="v56-node-sub" x="32" y="623" text-anchor="start">换了一句话</text>
<text class="v56-label" x="220" y="535" text-anchor="start">相同：可复用</text>
<text class="v56-label" x="436" y="535" text-anchor="start">从动态背景开始变化：后面都要重算</text>
<g data-node="true" id="c2-prefix-cache-n7"><rect class="v56-cloud" x="220" y="570" width="200" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="234" y="597" text-anchor="start">固定说明</text>
<text class="v56-node-sub" x="234" y="622" text-anchor="start">开头一模一样时</text>
<text class="v56-node-sub" x="234" y="645" text-anchor="start">可能命中缓存</text>
</g>
<g data-node="true" id="c2-prefix-cache-n8"><rect class="v56-decision" x="436" y="570" width="732" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="450" y="597" text-anchor="start">动态背景 + 历史 + 这一轮</text>
<text class="v56-node-sub" x="450" y="622" text-anchor="start">从首次变化的位置起，后面都要重新计算</text>
</g>
<text class="v56-label" x="32" y="735" text-anchor="start">设计含义：固定说明放最前面，变化的内容尽量放后面。</text>
<rect class="v56-neutral" x="32" y="791" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="805" text-anchor="start">灰：首次计算</text>
<rect class="v56-cloud" x="176" y="791" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="204" y="805" text-anchor="start">绿：相同前缀可复用</text>
<rect class="v56-decision" x="362" y="791" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="390" y="805" text-anchor="start">黄：新增或变化后重算</text>
</svg>
