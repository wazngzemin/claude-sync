<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="f2-onboard" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="f2-onboard-title f2-onboard-desc">
<title id="f2-onboard-title">从申请到上线，每一步由谁交出什么</title><desc id="f2-onboard-desc">快速测试、整体评测和实车验收分别证明不同的事；通过后再发布正式版本。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="f2-onboard-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">从申请到上线，每一步由谁交出什么</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">快速测试、整体评测和实车验收分别证明不同的事；通过后再发布正式版本。</text>
<text class="v56-label" x="168" y="120" text-anchor="middle">产品</text>
<text class="v56-label" x="456" y="120" text-anchor="middle">接入方</text>
<text class="v56-label" x="744" y="120" text-anchor="middle">研发与平台</text>
<text class="v56-label" x="1032" y="120" text-anchor="middle">项目与车端</text>
<path class="v56-rule" d="M 312 136 L 312 1250"/>
<path class="v56-rule" d="M 600 136 L 600 1250"/>
<path class="v56-rule" d="M 888 136 L 888 1250"/>
<g data-node="true" id="f2-onboard-n1"><rect class="v56-decision" x="32" y="154" width="272" height="128" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="182" text-anchor="start">01 · 评估需求，写定义</text>
<text class="v56-node-sub" x="46" y="209" text-anchor="start">写清能力边界、名称与参数</text>
<text class="v56-node-sub" x="46" y="231" text-anchor="start">交出典型说法与正常异常结果</text>
<text class="v56-node-sub" x="46" y="253" text-anchor="start">自建或非标准接入先申请编号</text>
</g>
<g data-node="true" id="f2-onboard-n2"><rect class="v56-cloud" x="320" y="328" width="272" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="334" y="356" text-anchor="start">02 · 实现协议与服务</text>
<text class="v56-node-sub" x="334" y="383" text-anchor="start">按接入协议实现 HTTPS 服务</text>
<text class="v56-node-sub" x="334" y="405" text-anchor="start">交出端点、鉴权与返回约定</text>
</g>
<g data-node="true" id="f2-onboard-n3"><rect class="v56-neutral" x="608" y="480" width="272" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="622" y="508" text-anchor="start">03 · 建定义和项目实现</text>
<text class="v56-node-sub" x="622" y="535" text-anchor="start">配置项目、环境与参与推理</text>
<text class="v56-node-sub" x="622" y="557" text-anchor="start">测试和正式环境分开</text>
</g>
<g data-node="true" id="f2-onboard-n4"><rect class="v56-neutral" x="608" y="632" width="272" height="150" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="622" y="660" text-anchor="start">04 · 快速测试</text>
<text class="v56-node-sub" x="622" y="687" text-anchor="start">不指定：测 Planner 会选会说</text>
<text class="v56-node-sub" x="622" y="709" text-anchor="start">指定：跳过 Planner，只测通路</text>
<text class="v56-node-sub" x="622" y="731" text-anchor="start">指定模式仅支持部分纯文本</text>
<text class="v56-node-sub" x="622" y="753" text-anchor="start">不代表已经完成实车验收</text>
</g>
<g data-node="true" id="f2-onboard-n5"><rect class="v56-neutral" x="608" y="828" width="272" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="622" y="856" text-anchor="start">05 · 测试环境验证</text>
<text class="v56-node-sub" x="622" y="883" text-anchor="start">核对实际请求与返回</text>
<text class="v56-node-sub" x="622" y="905" text-anchor="start">有代码变更，走评审发版</text>
</g>
<g data-node="true" id="f2-onboard-n6"><rect class="v56-decision" x="32" y="980" width="272" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="1008" text-anchor="start">06 · 整体评测</text>
<text class="v56-node-sub" x="46" y="1035" text-anchor="start">用整体提示词回归</text>
<text class="v56-node-sub" x="46" y="1057" text-anchor="start">分别核对选工具与填参数</text>
</g>
<g data-node="true" id="f2-onboard-n7"><rect class="v56-local" x="896" y="980" width="272" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="910" y="1008" text-anchor="start">07 · 联调与实车验收</text>
<text class="v56-node-sub" x="910" y="1035" text-anchor="start">项目协同车端联调</text>
<text class="v56-node-sub" x="910" y="1057" text-anchor="start">核对车上动作与用户结果</text>
</g>
<g data-node="true" id="f2-onboard-n8"><rect class="v56-neutral" x="608" y="1132" width="272" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="622" y="1160" text-anchor="start">08 · 发布；下线时禁用</text>
<text class="v56-node-sub" x="622" y="1187" text-anchor="start">测试通过，草稿发布为正式版</text>
<text class="v56-node-sub" x="622" y="1209" text-anchor="start">下线只禁用本项目实现</text>
</g>
<g data-node="true" id="f2-onboard-n9"><rect class="v56-neutral v56-pending" x="896" y="1132" width="272" height="106" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="910" y="1160" text-anchor="start">每次接入单独约定</text>
<text class="v56-node-sub" x="910" y="1187" text-anchor="start">灰度比例、持续多久</text>
<text class="v56-node-sub" x="910" y="1209" text-anchor="start">回退条件与具体做法</text>
</g>
<path class="v56-arrow" d="M 168 282 L 168 306 L 456 306 L 456 328" marker-end="url(#f2-onboard-arr)"/>
<path class="v56-arrow" d="M 456 434 L 456 458 L 744 458 L 744 480" marker-end="url(#f2-onboard-arr)"/>
<path class="v56-arrow" d="M 744 586 L 744 632" marker-end="url(#f2-onboard-arr)"/>
<path class="v56-arrow" d="M 744 782 L 744 828" marker-end="url(#f2-onboard-arr)"/>
<path class="v56-arrow" d="M 744 934 L 744 958 L 168 958 L 168 980" marker-end="url(#f2-onboard-arr)"/>
<path class="v56-arrow" d="M 304 1033 L 896 1033" marker-end="url(#f2-onboard-arr)"/>
<path class="v56-arrow" d="M 1032 1086 L 1032 1110 L 744 1110 L 744 1132" marker-end="url(#f2-onboard-arr)"/>
<text class="v56-subtitle" x="600" y="1020" text-anchor="middle">评测结果交给项目，进入联调与实车</text>
<path class="v56-rule" d="M 32 1272 L 1168 1272"/>
<text class="v56-node-title" x="32" y="1308" text-anchor="start">服务端上线 ≠ 全链路交付；修改工具说明后，先测再发布。</text>
<rect data-decoration="true" class="v56-decision" x="32" y="1346" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="1360" text-anchor="start">黄：产品评估与评测</text>
<rect data-decoration="true" class="v56-cloud" x="300" y="1346" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="328" y="1360" text-anchor="start">绿：接入服务</text>
<rect data-decoration="true" class="v56-neutral" x="530" y="1346" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="558" y="1360" text-anchor="start">灰：配置、验证与发布</text>
<rect data-decoration="true" class="v56-local" x="840" y="1346" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="868" y="1360" text-anchor="start">蓝：车上验收</text>
<text class="v56-subtitle" x="896" y="1260" text-anchor="start">虚线：本次接入仍需约定</text>
</svg>
