  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">视觉感知与问图：先看主机制</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,188 350,254" marker-end="url(#arrow-A-mechanism)"><title>A-stage-1 → A-stage-2：条件具备</title></polyline><polyline class="arr" fill="none" points="350,346 350,412" marker-end="url(#arrow-A-mechanism)"><title>A-stage-2 → A-stage-3：信息就绪</title></polyline><polyline class="arr" fill="none" points="350,504 350,570" marker-end="url(#arrow-A-mechanism)"><title>A-stage-3 → A-stage-4：按规则处理</title></polyline><polyline class="arr" fill="none" points="350,662 350,728" marker-end="url(#arrow-A-mechanism)"><title>A-stage-4 → A-stage-5：按事实交回</title></polyline><text class="ts" x="365" y="224" text-anchor="start" dominant-baseline="central">E1 · 条件具备</text><text class="ts" x="365" y="382" text-anchor="start" dominant-baseline="central">E2 · 信息就绪</text><text class="ts" x="365" y="540" text-anchor="start" dominant-baseline="central">E3 · 按规则处理</text><text class="ts" x="365" y="698" text-anchor="start" dominant-baseline="central">E4 · 按事实交回</text><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-mechanism" data-step="A-stage-1" aria-label="核权限和资源"><title>相机、开关、任务与可用模型先确定</title><rect x="180" y="106" width="340" height="78" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">核权限和资源</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">相机、开关、任务与可用模型先确定</text></g><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-mechanism" data-step="A-stage-2" aria-label="选择视觉模式"><title>默认观察、任务观察或一次 VQA</title><rect x="180" y="264" width="340" height="78" rx="6"/><text class="th" x="198" y="288" text-anchor="start" dominant-baseline="central">选择视觉模式</text><text class="ts" x="198" y="316" text-anchor="start" dominant-baseline="central">默认观察、任务观察或一次 VQA</text></g><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-mechanism" data-step="A-stage-3" aria-label="调度并取得结果"><title>区分控制完成通知与实际识别数据</title><rect x="180" y="422" width="340" height="78" rx="6"/><text class="th" x="198" y="446" text-anchor="start" dominant-baseline="central">调度并取得结果</text><text class="ts" x="198" y="474" text-anchor="start" dominant-baseline="central">区分控制完成通知与实际识别数据</text></g><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-mechanism" data-step="A-stage-4" aria-label="按目标解释证据"><title>观察文本交判断方，不提前宣布目标达成</title><rect x="180" y="580" width="340" height="78" rx="6"/><text class="th" x="198" y="604" text-anchor="start" dominant-baseline="central">按目标解释证据</text><text class="ts" x="198" y="632" text-anchor="start" dominant-baseline="central">观察文本交判断方，不提前宣布目标达成</text></g><g class="c-teal" role="link" tabindex="0" data-page="A" data-flow="A-mechanism" data-step="A-stage-5" aria-label="回正确业务出口"><title>问图回原调用，任务结果查有效性后再触达</title><rect x="180" y="738" width="340" height="78" rx="6"/><text class="th" x="198" y="762" text-anchor="start" dominant-baseline="central">回正确业务出口</text><text class="ts" x="198" y="790" text-anchor="start" dominant-baseline="central">问图回原调用，任务结果查有效性后再触达</text></g><text class="th" x="40" y="900" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="930" text-anchor="start" dominant-baseline="central">E1 核权限和资源 → 选择视觉模式：条件具备</text><text class="ts" x="40" y="963" text-anchor="start" dominant-baseline="central">E2 选择视觉模式 → 调度并取得结果：信息就绪</text><text class="ts" x="40" y="996" text-anchor="start" dominant-baseline="central">E3 调度并取得结果 → 按目标解释证据：按规则处理</text><text class="ts" x="40" y="1029" text-anchor="start" dominant-baseline="central">E4 按目标解释证据 → 回正确业务出口：按事实交回</text></svg>