    </marker>
  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">音频变成正式文字请求的交接</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,239 350,305" marker-end="url(#arrow-R-endcloud-input)"><title>RC1 → RC2：上传用户音频</title></polyline><polyline class="arr" fill="none" points="350,448 350,514" marker-end="url(#arrow-R-endcloud-input)"><title>RC2 → RC3：提交 ASR 音频</title></polyline><polyline class="arr" fill="none" points="350,657 350,723" marker-end="url(#arrow-R-endcloud-input)"><title>RC3 → RC4：返回识别文字</title></polyline><polyline class="arr" fill="none" points="350,885 350,951" marker-end="url(#arrow-R-endcloud-input)"><title>RC4 → RC5：正式文本被提交后</title></polyline><polyline class="arr" fill="none" points="350,1113 350,1179" marker-end="url(#arrow-R-endcloud-input)"><title>RC5 → RC6：HTTP 文字上行</title></polyline><polyline class="arr" fill="none" points="350,1341 350,1407" marker-end="url(#arrow-R-endcloud-input)"><title>RC6 → RC7：汽车业务请求与上下文</title></polyline><polyline class="arr" fill="none" points="350,1569 350,1635" marker-end="url(#arrow-R-endcloud-input)"><title>RC7 → RC8：按决定分别进入输出与执行链</title></polyline><text class="ts" x="365" y="275" text-anchor="start" dominant-baseline="central">E1 · 上传用户音频</text><text class="ts" x="365" y="484" text-anchor="start" dominant-baseline="central">E2 · 提交 ASR 音频</text><text class="ts" x="365" y="693" text-anchor="start" dominant-baseline="central">E3 · 返回识别文字</text><text class="ts" x="365" y="921" text-anchor="start" dominant-baseline="central">E4 · 正式文本被提交后</text><text class="ts" x="365" y="1149" text-anchor="start" dominant-baseline="central">E5 · HTTP 文字上行</text><text class="ts" x="365" y="1377" text-anchor="start" dominant-baseline="central">E6 · 汽车业务请求与上下文</text><text class="ts" x="365" y="1605" text-anchor="start" dominant-baseline="central">E7 · 按决定分别进入输出与执行链</text><g class="c-gray" role="link" tabindex="0" data-page="R" data-flow="R-endcloud-input" data-step="RC1" aria-label="车端采集这次用户语音"><title>记录说话内容；唤醒、说话人和判停规则继续看语音模块。；此时拿到的是音频，不是已经理解的业务诉求。</title><rect x="180" y="106" width="340" height="129" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">车端采集这次用户语音</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">记录说话内容；唤醒、说话人和判停规则继续看语音</text><text class="ts" x="198" y="177" text-anchor="start" dominant-baseline="central">模块。</text><text class="ts" x="198" y="196" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="215" text-anchor="start" dominant-baseline="central">此时拿到的是音频，不是已经理解的业务诉求。</text></g><text class="anno" x="540" y="130" text-anchor="start" dominant-baseline="central">收音与转写</text><g class="c-teal" role="link" tabindex="0" data-page="R" data-flow="R-endcloud-input" data-step="RC2" aria-label="AIDV 接收音频并代理识别"><title>车端把用户音频交给 AIDV。；AIDV 是汽车业务接入与处理侧；本步转交 Speech 语音服务。</title><rect x="180" y="315" width="340" height="129" rx="6"/><text class="th" x="198" y="339" text-anchor="start" dominant-baseline="central">AIDV 接收音频并代理识别</text><text class="ts" x="198" y="367" text-anchor="start" dominant-baseline="central">车端把用户音频交给 AIDV。</text><text class="ts" x="198" y="386" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="405" text-anchor="start" dominant-baseline="central">AIDV 是汽车业务接入与处理侧；本步转交 Speech </text><text class="ts" x="198" y="424" text-anchor="start" dominant-baseline="central">语音服务。</text></g><g class="c-teal" role="link" tabindex="0" data-page="R" data-flow="R-endcloud-input" data-step="RC3" aria-label="Speech 把声音转成识别文字"><title>语音识别（ASR）返回文字，仍需区分中间结果与最终可提交文本。；识别到“打开空调”不等于车控已经调用。</title><rect x="180" y="524" width="340" height="129" rx="6"/><text class="th" x="198" y="548" text-anchor="start" dominant-baseline="central">Speech 把声音转成识别文字</text><text class="ts" x="198" y="576" text-anchor="start" dominant-baseline="central">语音识别（ASR）返回文字，仍需区分中间结果与最</text><text class="ts" x="198" y="595" text-anchor="start" dominant-baseline="central">终可提交文本。</text><text class="ts" x="198" y="614" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="633" text-anchor="start" dominant-baseline="central">识别到“打开空调”不等于车控已经调用。</text></g><g class="c-teal" role="link" tabindex="0" data-page="R" data-flow="R-endcloud-input" data-step="RC4" aria-label="识别文字先返回车端"><title>Speech → AIDV → 客户端，先把识别结果还给车端。；不能从架构示意跳过车端，画成 ASR 直接进入 Planner。</title><rect x="180" y="733" width="340" height="148" rx="6"/><text class="th" x="198" y="757" text-anchor="start" dominant-baseline="central">识别文字先返回车端</text><text class="ts" x="198" y="785" text-anchor="start" dominant-baseline="central">Speech → AIDV → 客户端，先把识别结果还给车端</text><text class="ts" x="198" y="804" text-anchor="start" dominant-baseline="central">。</text><text class="ts" x="198" y="823" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="842" text-anchor="start" dominant-baseline="central">不能从架构示意跳过车端，画成 ASR 直接进入 </text><text class="ts" x="198" y="861" text-anchor="start" dominant-baseline="central">Planner。</text></g><text class="anno" x="540" y="757" text-anchor="start" dominant-baseline="central">从音频链转入文</text><text class="anno" x="540" y="776" text-anchor="start" dominant-baseline="central">本链</text><g class="c-teal" role="link" tabindex="0" data-page="R" data-flow="R-endcloud-input" data-step="RC5" aria-label="车端发起正式文字对话请求"><title>车端携带识别文字及请求信息，经 HTTP 上行至豆包。；是否为正式输入、是否被采信，须与入口策略及请求关联一起核对。</title><rect x="180" y="961" width="340" height="148" rx="6"/><text class="th" x="198" y="985" text-anchor="start" dominant-baseline="central">车端发起正式文字对话请求</text><text class="ts" x="198" y="1013" text-anchor="start" dominant-baseline="central">车端携带识别文字及请求信息，经 HTTP 上行至豆包</text><text class="ts" x="198" y="1032" text-anchor="start" dominant-baseline="central">。</text><text class="ts" x="198" y="1051" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1070" text-anchor="start" dominant-baseline="central">是否为正式输入、是否被采信，须与入口策略及请求</text><text class="ts" x="198" y="1089" text-anchor="start" dominant-baseline="central">关联一起核对。</text></g><g class="c-teal" role="link" tabindex="0" data-page="R" data-flow="R-endcloud-input" data-step="RC6" aria-label="豆包将汽车请求交给 AIDV"><title>请求文字与相关上下文交给汽车业务侧，接入层转换协议。；豆包链路还承担回复下行；这不是模型又识别了一遍音频。</title><rect x="180" y="1189" width="340" height="148" rx="6"/><text class="th" x="198" y="1213" text-anchor="start" dominant-baseline="central">豆包将汽车请求交给 AIDV</text><text class="ts" x="198" y="1241" text-anchor="start" dominant-baseline="central">请求文字与相关上下文交给汽车业务侧，接入层转换</text><text class="ts" x="198" y="1260" text-anchor="start" dominant-baseline="central">协议。</text><text class="ts" x="198" y="1279" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1298" text-anchor="start" dominant-baseline="central">豆包链路还承担回复下行；这不是模型又识别了一遍</text><text class="ts" x="198" y="1317" text-anchor="start" dominant-baseline="central">音频。</text></g><g class="c-teal" role="link" tabindex="0" data-page="R" data-flow="R-endcloud-input" data-step="RC7" aria-label="AIDV 进入汽车业务处理"><title>后续由输入管理、Context 与 Planner/Director 处理本轮。；这里只建立系统交接，不声称每次必须检索、调用工具或激活智驾。</title><rect x="180" y="1417" width="340" height="148" rx="6"/><text class="th" x="198" y="1441" text-anchor="start" dominant-baseline="central">AIDV 进入汽车业务处理</text><text class="ts" x="198" y="1469" text-anchor="start" dominant-baseline="central">后续由输入管理、Context 与 Planner/Director </text><text class="ts" x="198" y="1488" text-anchor="start" dominant-baseline="central">处理本轮。</text><text class="ts" x="198" y="1507" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1526" text-anchor="start" dominant-baseline="central">这里只建立系统交接，不声称每次必须检索、调用工</text><text class="ts" x="198" y="1545" text-anchor="start" dominant-baseline="central">具或激活智驾。</text></g><text class="anno" x="540" y="1441" text-anchor="start" dominant-baseline="central">进入本轮业务判</text><text class="anno" x="540" y="1460" text-anchor="start" dominant-baseline="central">断</text><g class="c-gray" role="link" tabindex="0" data-page="R" data-flow="R-endcloud-input" data-step="RC8" aria-label="分别追踪回复与动作的结果"><title>话术走文字和音频返回链；动作走对应工具及真实执行反馈。；没有回复时先找断点：识别未完、文字未上云、未获推理许可还是输出未到端。</title><rect x="180" y="1645" width="340" height="148" rx="6"/><text class="th" x="198" y="1669" text-anchor="start" dominant-baseline="central">分别追踪回复与动作的结果</text><text class="ts" x="198" y="1697" text-anchor="start" dominant-baseline="central">话术走文字和音频返回链；动作走对应工具及真实执</text><text class="ts" x="198" y="1716" text-anchor="start" dominant-baseline="central">行反馈。</text><text class="ts" x="198" y="1735" text-anchor="start" dominant-baseline="central"></text><text class="ts" x="198" y="1754" text-anchor="start" dominant-baseline="central">没有回复时先找断点：识别未完、文字未上云、未获</text><text class="ts" x="198" y="1773" text-anchor="start" dominant-baseline="central">推理许可还是输出未到端。</text></g><text class="th" x="40" y="1877" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1907" text-anchor="start" dominant-baseline="central">E1 车端采集这次用户语音 → AIDV 接收音频并代理识别：上传用户音频</text><text class="ts" x="40" y="1940" text-anchor="start" dominant-baseline="central">E2 AIDV 接收音频并代理识别 → Speech 把声音转成识别文字：提交 ASR 音频</text><text class="ts" x="40" y="1973" text-anchor="start" dominant-baseline="central">E3 Speech 把声音转成识别文字 → 识别文字先返回车端：返回识别文字</text><text class="ts" x="40" y="2006" text-anchor="start" dominant-baseline="central">E4 识别文字先返回车端 → 车端发起正式文字对话请求：正式文本被提交后</text><text class="ts" x="40" y="2039" text-anchor="start" dominant-baseline="central">E5 车端发起正式文字对话请求 → 豆包将汽车请求交给 AIDV：HTTP 文字上行</text><text class="ts" x="40" y="2072" text-anchor="start" dominant-baseline="central">E6 豆包将汽车请求交给 AIDV → AIDV 进入汽车业务处理：汽车业务请求与上下文</text><text class="ts" x="40" y="2105" text-anchor="start" dominant-baseline="central">E7 AIDV 进入汽车业务处理 → 分别追踪回复与动作的结果：按决定分别进入输出与执行链</text></svg>