<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="g2-semantic" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="g2-semantic-title g2-semantic-desc">
<title id="g2-semantic-title">引导机会，按账号在车端播完回调后才计次</title><desc id="g2-semantic-desc">新方向，尚未验收：语义判断与上下文准备并行，交给 Planner 的是后台预配建议。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="g2-semantic-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">引导机会，按账号在车端播完回调后才计次</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">新方向，尚未验收：语义判断与上下文准备并行，交给 Planner 的是后台预配建议。</text>
<g data-node="true" id="g2-semantic-speech"><rect class="v56-local v56-pending" x="40" y="160" width="300" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="188" text-anchor="start">用户说完话，识别文字上报</text>
<text class="v56-node-sub" x="54" y="216" text-anchor="start">“放点适合开车听的”</text>
<text class="v56-node-sub" x="54" y="240" text-anchor="start">准备判断是否引导 AI 电台</text>
</g>
<g data-node="true" id="g2-semantic-model"><rect class="v56-cloud v56-pending" x="440" y="160" width="320" height="170" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="454" y="188" text-anchor="start">快速场景判断模型</text>
<text class="v56-node-sub" x="454" y="216" text-anchor="start">本句话 + 前几轮对话</text>
<text class="v56-node-sub" x="454" y="240" text-anchor="start">只从本账号有资格的候选里选</text>
<text class="v56-node-sub" x="454" y="264" text-anchor="start">输出场景编号，不生成话术</text>
<text class="v56-node-sub" x="454" y="288" text-anchor="start">不命中则不加建议</text>
</g>
<g data-node="true" id="g2-semantic-context"><rect class="v56-cloud v56-pending" x="440" y="390" width="320" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="454" y="418" text-anchor="start">上下文准备</text>
<text class="v56-node-sub" x="454" y="446" text-anchor="start">与快速场景判断并行</text>
</g>
<path class="v56-arrow v56-pending" d="M 340 230 L 440 230" marker-end="url(#g2-semantic-arr)"/>
<path class="v56-arrow v56-pending" d="M 380 230 L 380 440 L 440 440" marker-end="url(#g2-semantic-arr)"/>
<g data-node="true" id="g2-semantic-merge"><rect class="v56-cloud v56-pending" x="840" y="160" width="320" height="190" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="854" y="188" text-anchor="start">触发器命中 → 输入合并</text>
<text class="v56-node-sub" x="854" y="216" text-anchor="start">取出后台预先配好的建议</text>
<text class="v56-node-sub" x="854" y="240" text-anchor="start">与本轮话、上下文一起交入</text>
<text class="v56-node-sub" x="854" y="264" text-anchor="start">复用输入管理，不另做打断</text>
<text class="v56-node-sub" x="854" y="288" text-anchor="start">触发编号一路传到车端</text>
</g>
<path class="v56-arrow v56-pending" d="M 760 245 L 840 245" marker-end="url(#g2-semantic-arr)"/>
<path class="v56-arrow v56-pending" d="M 760 440 L 800 440 L 800 310 L 840 310" marker-end="url(#g2-semantic-arr)"/>
<g data-node="true" id="g2-semantic-planner"><rect class="v56-decision v56-pending" x="840" y="420" width="320" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="854" y="448" text-anchor="start">Planner 接收本轮输入</text>
<text class="v56-node-sub" x="854" y="476" text-anchor="start">结合本轮诉求与引导建议</text>
<text class="v56-node-sub" x="854" y="500" text-anchor="start">组织这次表达</text>
</g>
<path class="v56-arrow v56-pending" d="M 1000 350 L 1000 420" marker-end="url(#g2-semantic-arr)"/>
<g data-node="true" id="g2-semantic-play"><rect class="v56-decision v56-pending" x="840" y="620" width="320" height="140" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="854" y="648" text-anchor="start">车端播完这句话 → 上报</text>
<text class="v56-node-sub" x="854" y="676" text-anchor="start">带本次触发编号</text>
<text class="v56-node-sub" x="854" y="700" text-anchor="start">播完结果上报仍在对齐</text>
<text class="v56-node-sub" x="854" y="724" text-anchor="start">尚未验收</text>
</g>
<path class="v56-arrow v56-pending" d="M 1000 530 L 1000 620" marker-end="url(#g2-semantic-arr)"/>
<g data-node="true" id="g2-semantic-count"><rect class="v56-cloud v56-pending" x="440" y="620" width="320" height="170" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="454" y="648" text-anchor="start">车机服务代理回调触发器</text>
<text class="v56-node-sub" x="454" y="676" text-anchor="start">触发器按豆包账号读写次数</text>
<text class="v56-node-sub" x="454" y="700" text-anchor="start">播完后才用掉一次引导机会</text>
<text class="v56-node-sub" x="454" y="724" text-anchor="start">次数用完，在回调时移出候选</text>
<text class="v56-node-sub" x="454" y="748" text-anchor="start">同车换账号，重新获得引导资格</text>
</g>
<path class="v56-arrow v56-pending" d="M 840 690 L 760 690" marker-end="url(#g2-semantic-arr)"/>
<path class="v56-arrow v56-pending" d="M 600 620 L 600 565 L 790 565 L 790 115 L 600 115 L 600 160" marker-end="url(#g2-semantic-arr)"/>
<text class="v56-label" x="40" y="122" text-anchor="start">移出后，下次只判断剩余候选</text>
<g data-node="true" id="g2-semantic-time"><rect class="v56-neutral v56-pending" x="40" y="400" width="300" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="428" text-anchor="start">生效时间：这次不做</text>
<text class="v56-node-sub" x="54" y="456" text-anchor="start">与语义条件分开处理</text>
</g>
<g data-node="true" id="g2-semantic-history"><rect class="v56-neutral v56-pending" x="40" y="550" width="300" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="578" text-anchor="start">工具使用历史：这次不做</text>
<text class="v56-node-sub" x="54" y="606" text-anchor="start">“最近用没用过”不加入条件</text>
</g>
<text class="v56-label" x="40" y="850" text-anchor="start">现有计次：调了动作就按车辆记一次；本图展示的新方向改为按账号、播完后回调计次。</text>
<text class="v56-subtitle" x="40" y="886" text-anchor="start">虚线：新方向与接入安排尚未验收；约 300 毫秒是目标，候选增多后的耗时仍要实测。</text>
<path class="v56-rule" d="M 32 930 L 1168 930"/>
<text class="v56-node-title" x="32" y="964" text-anchor="start">让用户真正听到一次，才消耗一次引导机会。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="990" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1004" text-anchor="start">蓝：用户话语</text>
<rect data-decoration="true" class="v56-cloud v56-pending" x="316.0" y="990" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="1004" text-anchor="start">绿：已定做法，尚未验收</text>
<rect data-decoration="true" class="v56-decision v56-pending" x="600.0" y="990" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="1004" text-anchor="start">黄：表达与播完结果</text>
<rect data-decoration="true" class="v56-neutral v56-pending" x="884.0" y="990" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="1004" text-anchor="start">灰：这次不做</text>
</svg>
