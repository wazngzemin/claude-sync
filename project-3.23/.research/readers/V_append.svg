<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 2800" font-family="Noto Sans SC">
  <rect x="40" y="2190" width="1700" height="500" fill="#fafbfd"/>
  <rect x="50" y="2260" width="1660" height="460" rx="8" fill="#e8f0fe" stroke="#4285F4" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="70" y="2285" font-size="14" font-weight="700" fill="#1a56c9">本次补充：V19–V24（2026-10 口径）</text>

  <rect x="80" y="2310" width="360" height="150" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="95" y="2335" font-size="13" font-weight="700" fill="#1a1a1a">V19 多级 VAD 三段时长</text>
  <text x="95" y="2358" font-size="12" fill="#3c4043">资料冲突：PRD 写 300/500/1000ms</text>
  <text x="95" y="2378" font-size="12" fill="#3c4043">OnePager/评审图写 0.6s/0.3s</text>
  <text x="95" y="2398" font-size="12" fill="#b3261e">【资料冲突】并列待核</text>

  <rect x="470" y="2310" width="360" height="150" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="485" y="2335" font-size="13" font-weight="700" fill="#1a1a1a">V20 声纹注册约束</text>
  <text x="485" y="2358" font-size="12" fill="#3c4043">主驾音区注册；多人乘车需重新录入</text>
  <text x="485" y="2378" font-size="12" fill="#3c4043">注册失败走普通语音，不阻塞</text>
  <text x="485" y="2398" font-size="12" fill="#b3261e">【2.6 目标】</text>

  <rect x="860" y="2310" width="360" height="150" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="875" y="2335" font-size="13" font-weight="700" fill="#1a1a1a">V21 车外语音独立入口</text>
  <text x="875" y="2358" font-size="12" fill="#3c4043">车外唤醒词独立，不与车内混用</text>
  <text x="875" y="2378" font-size="12" fill="#3c4043">仅支持车控类指令</text>
  <text x="875" y="2398" font-size="12" fill="#b3261e">【2.6 目标】</text>

  <rect x="1250" y="2310" width="360" height="150" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="1265" y="2335" font-size="13" font-weight="700" fill="#1a1a1a">V22 上屏前口癖过滤</text>
  <text x="1265" y="2358" font-size="12" fill="#3c4043">ASR 结果先过滤口癖再上屏</text>
  <text x="1265" y="2378" font-size="12" fill="#3c4043">让识别结果更像人说的话</text>
  <text x="1265" y="2398" font-size="12" fill="#b3261e">【讨论中】</text>

  <rect x="80" y="2480" width="360" height="130" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="95" y="2505" font-size="13" font-weight="700" fill="#1a1a1a">V23 打断策略</text>
  <text x="95" y="2528" font-size="12" fill="#3c4043">TTS 播报中被打断</text>
  <text x="95" y="2548" font-size="12" fill="#3c4043">等语音端点检测结束后进入主对话</text>
  <text x="95" y="2568" font-size="12" fill="#b3261e">【已落地】</text>

  <rect x="470" y="2480" width="360" height="130" rx="6" fill="#fff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="485" y="2505" font-size="13" font-weight="700" fill="#1a1a1a">V24 预请求作废条件</text>
  <text x="485" y="2528" font-size="12" fill="#3c4043">用户改口或最终文字与预请求不同</text>
  <text x="485" y="2548" font-size="12" fill="#3c4043">提前备的结果作废，按最终文字重算</text>
  <text x="485" y="2568" font-size="12" fill="#b3261e">【2.6 目标】</text>
</svg>
