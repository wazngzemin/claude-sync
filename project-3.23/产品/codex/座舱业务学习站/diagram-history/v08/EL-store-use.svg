  </defs><text class="title" x="340" y="38" text-anchor="middle" dominant-baseline="central">流程一：原始业务事实 → 保存 → 各自消费</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">实线：本流程关系　虚线：规划或待核关系</text><polyline class="arr" fill="none" points="350,188 350,254" marker-end="url(#arrow-EL-store-use)"><title>ls1 → ls2：按合同上报</title></polyline><polyline class="arr" fill="none" points="350,359 350,425" marker-end="url(#arrow-EL-store-use)"><title>ls2 → ls3：资源格式校验通过</title></polyline><polyline class="arr" fill="none" points="176,308 50,308 50,1733 170,1733" marker-end="url(#arrow-EL-store-use)"><title>ls2 → ls10：校验失败</title></polyline><polyline class="arr" fill="none" points="350,530 350,596" marker-end="url(#arrow-EL-store-use)"><title>ls3 → ls4：忠实事实</title></polyline><polyline class="arr" fill="none" points="350,701 350,767" marker-end="url(#arrow-EL-store-use)"><title>ls4 → ls5：可查询或通知</title></polyline><polyline class="arr" fill="none" points="176,650 80,650 80,1757 170,1757" marker-end="url(#arrow-EL-store-use)"><title>ls4 → ls10：写入失败</title></polyline><polyline class="arr" fill="none" points="350,893 350,959" marker-end="url(#arrow-EL-store-use)"><title>ls5 → ls6：对应白名单</title></polyline><polyline class="arr" fill="none" points="176,821 100,821 100,1205 170,1205" marker-end="url(#arrow-EL-store-use)"><title>ls5 → ls7：允许进入记忆</title></polyline><polyline class="arr" fill="none" points="176,845 110,845 110,1373 170,1373" marker-end="url(#arrow-EL-store-use)"><title>ls5 → ls8：已注册订阅</title></polyline><polyline class="arr" fill="none" points="176,1013 120,1013 120,1541 170,1541" marker-end="url(#arrow-EL-store-use)"><title>ls6 → ls9：本轮实际采用后</title></polyline><polyline class="arr" fill="none" points="176,1181 130,1181 130,1565 170,1565" marker-end="url(#arrow-EL-store-use)"><title>ls7 → ls9：后续查询采用，不是即时</title></polyline><polyline class="arr" fill="none" points="350,1421 350,1487" marker-end="url(#arrow-EL-store-use)"><title>ls8 → ls9：业务实际处理结果</title></polyline><text class="ts" x="365" y="224" text-anchor="start" dominant-baseline="central">E1 · 按合同上报</text><text class="ts" x="365" y="395" text-anchor="start" dominant-baseline="central">E2 · 资源格式校验通过</text><text class="ts" x="168" y="300" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="168" y="1745" text-anchor="end" dominant-baseline="central">E3</text><text class="ts" x="365" y="566" text-anchor="start" dominant-baseline="central">E4 · 忠实事实</text><text class="ts" x="365" y="737" text-anchor="start" dominant-baseline="central">E5 · 可查询或通知</text><text class="ts" x="168" y="642" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="168" y="1769" text-anchor="end" dominant-baseline="central">E6</text><text class="ts" x="365" y="929" text-anchor="start" dominant-baseline="central">E7 · 对应白名单</text><text class="ts" x="168" y="813" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="168" y="1217" text-anchor="end" dominant-baseline="central">E8</text><text class="ts" x="168" y="837" text-anchor="end" dominant-baseline="central">E9</text><text class="ts" x="168" y="1385" text-anchor="end" dominant-baseline="central">E9</text><text class="ts" x="168" y="1005" text-anchor="end" dominant-baseline="central">E10</text><text class="ts" x="168" y="1553" text-anchor="end" dominant-baseline="central">E10</text><text class="ts" x="168" y="1173" text-anchor="end" dominant-baseline="central">E11</text><text class="ts" x="168" y="1577" text-anchor="end" dominant-baseline="central">E11</text><text class="ts" x="365" y="1457" text-anchor="start" dominant-baseline="central">E12 · 业务实际处理结果</text><g class="c-gray" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls1" aria-label="三类生产方"><title>客户端、Trigger、云业务；各自按事件定义生产</title><rect x="180" y="106" width="340" height="78" rx="6"/><text class="th" x="198" y="130" text-anchor="start" dominant-baseline="central">三类生产方</text><text class="ts" x="198" y="158" text-anchor="start" dominant-baseline="central">客户端、Trigger、云业务；各自按事件定义生产</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls2" aria-label="入口字段与范围信息"><title>校验资源格式，保留渠道/车辆/账号；身份授权校验执行方与现状待核；缺失/非法数据不伪装完整事实</title><rect x="180" y="264" width="340" height="91" rx="6"/><text class="th" x="198" y="288" text-anchor="start" dominant-baseline="central">入口字段与范围信息</text><text class="ts" x="198" y="316" text-anchor="start" dominant-baseline="central">校验资源格式，保留渠道/车辆/账号；身份授权校验</text><text class="ts" x="198" y="335" text-anchor="start" dominant-baseline="central">执行方与现状待核；缺失/非法数据不伪装完整事实</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls3" aria-label="结构与中文一致"><title>位置、时间、旧新值和描述对应；模板拼接不做偏好推断</title><rect x="180" y="435" width="340" height="91" rx="6"/><text class="th" x="198" y="459" text-anchor="start" dominant-baseline="central">结构与中文一致</text><text class="ts" x="198" y="487" text-anchor="start" dominant-baseline="central">位置、时间、旧新值和描述对应；模板拼接不做偏好</text><text class="ts" x="198" y="506" text-anchor="start" dominant-baseline="central">推断</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls4" aria-label="保存事件记录"><title>记录主键、发生时间、写库时间；在场人按事件时刻关联</title><rect x="180" y="606" width="340" height="91" rx="6"/><text class="th" x="198" y="630" text-anchor="start" dominant-baseline="central">保存事件记录</text><text class="ts" x="198" y="658" text-anchor="start" dominant-baseline="central">记录主键、发生时间、写库时间；在场人按事件时刻</text><text class="ts" x="198" y="677" text-anchor="start" dominant-baseline="central">关联</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls5" aria-label="查询/订阅分发"><title>按用途的范围和授权；不是每个消费者全量接收</title><rect x="180" y="777" width="340" height="112" rx="6"/><text class="th" x="198" y="801" text-anchor="start" dominant-baseline="central">查询/订阅分发</text><text class="ts" x="198" y="829" text-anchor="start" dominant-baseline="central">按用途的范围和授权；不是每个消费者全量接收</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls6" aria-label="Context / UP 使用"><title>近期事实进入实际模型输入；保留本轮使用证据</title><rect x="180" y="969" width="340" height="88" rx="6"/><text class="th" x="198" y="993" text-anchor="start" dominant-baseline="central">Context / UP 使用</text><text class="ts" x="198" y="1021" text-anchor="start" dominant-baseline="central">近期事实进入实际模型输入；保留本轮使用证据</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls7" aria-label="Memory 提取任务"><title>从合规原料异步生成记忆；后续再验证召回与采用</title><rect x="180" y="1137" width="340" height="112" rx="6"/><text class="th" x="198" y="1161" text-anchor="start" dominant-baseline="central">Memory 提取任务</text><text class="ts" x="198" y="1189" text-anchor="start" dominant-baseline="central">从合规原料异步生成记忆；后续再验证召回与采用</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls8" aria-label="指定业务处理"><title>只处理订阅的变化；失败、重试和完成另有结果</title><rect x="180" y="1329" width="340" height="88" rx="6"/><text class="th" x="198" y="1353" text-anchor="start" dominant-baseline="central">指定业务处理</text><text class="ts" x="198" y="1381" text-anchor="start" dominant-baseline="central">只处理订阅的变化；失败、重试和完成另有结果</text></g><g class="c-teal" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls9" aria-label="用户结果与诊断"><title>Director、工具、播放各自闭环；用关联证据定位失败</title><rect x="180" y="1497" width="340" height="112" rx="6"/><text class="th" x="198" y="1521" text-anchor="start" dominant-baseline="central">用户结果与诊断</text><text class="ts" x="198" y="1549" text-anchor="start" dominant-baseline="central">Director、工具、播放各自闭环；用关联证据定位失</text><text class="ts" x="198" y="1568" text-anchor="start" dominant-baseline="central">败</text></g><g class="c-gray" role="link" tabindex="0" data-page="EL" data-flow="EL-store-use" data-step="ls10" aria-label="校验/保存失败"><title>记录具体原因供诊断；不当作事件已送达</title><rect x="180" y="1689" width="340" height="112" rx="6"/><text class="th" x="198" y="1713" text-anchor="start" dominant-baseline="central">校验/保存失败</text><text class="ts" x="198" y="1741" text-anchor="start" dominant-baseline="central">记录具体原因供诊断；不当作事件已送达</text></g><text class="th" x="40" y="1885" text-anchor="start" dominant-baseline="central">连接条件与分支</text><text class="ts" x="40" y="1915" text-anchor="start" dominant-baseline="central">E1 三类生产方 → 入口字段与范围信息：按合同上报</text><text class="ts" x="40" y="1948" text-anchor="start" dominant-baseline="central">E2 入口字段与范围信息 → 结构与中文一致：资源格式校验通过</text><text class="ts" x="40" y="1981" text-anchor="start" dominant-baseline="central">E3 入口字段与范围信息 → 校验/保存失败：校验失败</text><text class="ts" x="40" y="2014" text-anchor="start" dominant-baseline="central">E4 结构与中文一致 → 保存事件记录：忠实事实</text><text class="ts" x="40" y="2047" text-anchor="start" dominant-baseline="central">E5 保存事件记录 → 查询/订阅分发：可查询或通知</text><text class="ts" x="40" y="2080" text-anchor="start" dominant-baseline="central">E6 保存事件记录 → 校验/保存失败：写入失败</text><text class="ts" x="40" y="2113" text-anchor="start" dominant-baseline="central">E7 查询/订阅分发 → Context / UP 使用：对应白名单</text><text class="ts" x="40" y="2146" text-anchor="start" dominant-baseline="central">E8 查询/订阅分发 → Memory 提取任务：允许进入记忆</text><text class="ts" x="40" y="2179" text-anchor="start" dominant-baseline="central">E9 查询/订阅分发 → 指定业务处理：已注册订阅</text><text class="ts" x="40" y="2212" text-anchor="start" dominant-baseline="central">E10 Context / UP 使用 → 用户结果与诊断：本轮实际采用后</text><text class="ts" x="40" y="2245" text-anchor="start" dominant-baseline="central">E11 Memory 提取任务 → 用户结果与诊断：后续查询采用，不是即时</text><text class="ts" x="40" y="2278" text-anchor="start" dominant-baseline="central">E12 指定业务处理 → 用户结果与诊断：业务实际处理结果</text></svg>