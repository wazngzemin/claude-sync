<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-label="插话、打断与恢复：豆包停下来以后的 6 步"><title>插话、打断与恢复：豆包停下来以后的 6 步</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="1010" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">插话、打断与恢复：豆包停下来以后的 6 步</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左列车上（端侧），右列云端；从左上“豆包已经停播”开始，沿编号往下走</text><rect x="30" y="92" width="560" height="800" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">车上（播放器、麦克风、屏幕）</text><rect x="610" y="92" width="560" height="800" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="624" y="116" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">云端（拒识、座舱云服务、DT）</text><rect x="50" y="130" width="520" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><circle cx="70" cy="152" r="12" fill="#4f7ea9"/><text x="70" y="157" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="90" y="157" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">停播，记下为什么停、播了多久</text><text x="64" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">十种停播原因，只有三种可以恢复</text><text x="64" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">继续收音，等用户把话说完</text><rect x="630" y="130" width="520" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="152" r="12" fill="#4a9670"/><text x="650" y="157" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="670" y="157" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">这句插话算不算数</text><text x="644" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用说完后的定稿文字做最终拒识</text><text x="644" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">有效插话 / 不是对豆包说的</text><rect x="630" y="270" width="520" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="292" r="12" fill="#4a9670"/><text x="650" y="297" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="670" y="297" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">旧的那一轮走到哪了</text><text x="644" y="322" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">还没出第一个字：新旧合并重想</text><text x="644" y="343" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已经出字或在播：旧的那次作废</text><rect x="630" y="410" width="520" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="432" r="12" fill="#4a9670"/><text x="650" y="437" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="670" y="437" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">把旧话切成“已说的”和“没说完的”</text><text x="644" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按播放时长和每个字的时间点切</text><text x="644" y="483" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没有时间点时只能估算</text><rect x="630" y="550" width="520" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="572" r="12" fill="#4a9670"/><text x="650" y="577" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="670" y="577" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">交给 DT：两种形态</text><text x="644" y="602" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">有效插话：没说完的话跟新话放在同一条</text><text x="644" y="623" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">被拒识：没说完的话单独包成一条事件</text><rect x="630" y="690" width="520" height="96" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><circle cx="650" cy="712" r="12" fill="#4a9670"/><text x="650" y="717" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="670" y="717" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">DT 决定补不补、怎么补</text><text x="644" y="742" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没实质内容、只是执行确认：不补</text><text x="644" y="763" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">话题相关：合成一个回答</text><rect x="50" y="690" width="520" height="96" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="717" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">车上播出新的回答</text><text x="64" y="742" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">是重新生成的一段话</text><text x="64" y="763" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不是把旧声音接着放</text><rect x="50" y="410" width="520" height="96" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="64" y="437" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">已经发出去的动作不受影响</text><text x="64" y="462" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">停的只是声音</text><text x="64" y="483" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">导航、车控、查询照常执行并回结果</text><path d="M570,178 L630,178" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="583.6" y="156" width="32.8" height="20" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600" y="171" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle">定稿</text><path d="M890,226 L890,270" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M890,366 L890,410" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310,226 L310,300 L600,300 L600,458 L630,458" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="425.3" y="279" width="59.4" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="455" y="295" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">播了多久</text><path d="M890,506 L890,550" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M890,646 L890,690" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M630,738 L570,738" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="577.9" y="716" width="44.199999999999996" height="20" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="600" y="731" font-size="12" fill="#3c5a73" font-weight="500" text-anchor="middle">新话术</text><rect x="50" y="800" width="1100" height="72" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="64" y="827" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">上游：V 章第二段（快速拒识判断要不要停播）　　下游：M 章（输入怎么排队、合并）、D 章（DT 推理）、O 章（播报）</text><text x="64" y="852" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">本章从“已经停下来”讲起，到“新的回答播出来”为止</text><rect x="50" y="910" width="1100" height="70" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="64" y="937" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">以上是早期做法；现行输入管理调整了第 1、3、5 步，见本章第三段</text></g></svg>