<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -20 1810 2000" font-family="Noto Sans SC, sans-serif">
  <!-- G12 卡片（左列第三行） -->
  <rect x="110" y="1158" width="400" height="248" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.2"/>
  <text x="125" y="1185" font-size="16" font-weight="bold" fill="#1565C0">G12</text>
  <text x="125" y="1208" font-size="15" fill="#263238">把有意义的状态变化写业务事件</text>
  <text x="125" y="1235" font-size="13" fill="#37474F">预置条件用有变更，保留前后值</text>
  <text x="125" y="1257" font-size="13" fill="#37474F">匹配时刻不等于端采样/上报时刻</text>
  <text x="125" y="1279" font-size="13" fill="#37474F">模板拼接事件，不必调用大模型</text>
  <text x="125" y="1301" font-size="13" fill="#37474F">调试 client-event 不自动进模型</text>

  <!-- G11 卡片（中列第三行） -->
  <rect x="640" y="1158" width="400" height="248" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.2"/>
  <text x="655" y="1185" font-size="16" font-weight="bold" fill="#1565C0">G11</text>
  <text x="655" y="1208" font-size="15" fill="#263238">语义推理只判断目标是否可见</text>
  <text x="655" y="1235" font-size="13" fill="#37474F">目标+当前画面描述，核对象位置</text>
  <text x="655" y="1257" font-size="13" fill="#37474F">达成/未达成/无法判断</text>
  <text x="655" y="1279" font-size="13" fill="#37474F">无置信度；不负责播报结束</text>
  <text x="655" y="1301" font-size="13" fill="#37474F">8/31 版并发推理，不中断旧请求</text>

  <!-- G10 卡片（右列第三行） -->
  <rect x="1170" y="1158" width="400" height="248" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.2"/>
  <text x="1185" y="1185" font-size="16" font-weight="bold" fill="#1565C0">G10</text>
  <text x="1185" y="1208" font-size="15" fill="#263238">时间触发：到时回调，不直接控车</text>
  <text x="1185" y="1235" font-size="13" fill="#37474F">一次/周期时间注册到调度</text>
  <text x="1185" y="1257" font-size="13" fill="#37474F">到时只回业务方继续处理</text>
  <text x="1185" y="1279" font-size="13" fill="#37474F">取消需注销后续计划</text>
  <text x="1185" y="1301" font-size="13" fill="#37474F">跨行程恢复不能凭定时器推定</text>
</svg>
