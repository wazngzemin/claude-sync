<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Noto Sans SC, sans-serif">
  <!-- 标题 -->
  <text x="700" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">N10 架构演进：从 0.8、v15 主链到 1.0 多 Agent 愿景</text>
  <text x="700" y="52" text-anchor="middle" font-size="12" fill="#546E7A">三列是同一套系统的三个版本（不是三条并行链路）；虚线箭头=演进去向，不是运行时调用</text>

  <!-- 三列标题 -->
  <rect x="20" y="70" width="420" height="34" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  <text x="230" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474F">0.8（2.6 首发基线 · 已落地）</text>

  <rect x="490" y="70" width="420" height="34" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="700" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">v15（2.6 落地主链 · 在落地）</text>

  <rect x="960" y="70" width="420" height="34" rx="6" fill="#FFF8E1" stroke="#E65100" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1170" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#E65100">1.0 豆包 Engine（长期愿景）</text>

  <!-- 左列 0.8 节点 -->
  <rect x="40" y="120" width="380" height="50" rx="6" fill="#ECEFF1" stroke="#78909C" stroke-width="1"/>
  <text x="55" y="140" font-size="12" font-weight="bold" fill="#37474F">N10-01 声纹识别 + ASR</text>
  <text x="55" y="158" font-size="10" fill="#546E7A">语音进来先过声纹，ASR 出文本</text>

  <rect x="40" y="180" width="380" height="50" rx="6" fill="#ECEFF1" stroke="#78909C" stroke-width="1"/>
  <text x="55" y="200" font-size="12" font-weight="bold" fill="#37474F">N10-02 dora chat</text>
  <text x="55" y="218" font-size="10" fill="#546E7A">带当前轮 + 历史对话进 chat</text>

  <rect x="40" y="240" width="380" height="90" rx="6" fill="#ECEFF1" stroke="#C62828" stroke-width="1.2"/>
  <text x="55" y="260" font-size="12" font-weight="bold" fill="#B71C1C">N10-03 并行三模型（同时跑）</text>
  <text x="55" y="278" font-size="10" fill="#C62828">① 拒识模型　② 火山意图模型　③ 豆包意图模型</text>
  <text x="55" y="296" font-size="10" fill="#C62828">另有任务管理支路（并行）</text>
  <text x="55" y="316" font-size="10" fill="#78909C">v15 把这三个合并成 R 图一次判断</text>

  <rect x="40" y="340" width="380" height="90" rx="6" fill="#ECEFF1" stroke="#78909C" stroke-width="1"/>
  <text x="55" y="360" font-size="12" font-weight="bold" fill="#37474F">N10-04 结果判断分发</text>
  <text x="55" y="378" font-size="10" fill="#546E7A">意图=车控/导航/媒体 → FC-SFT 快路径</text>
  <text x="55" y="396" font-size="10" fill="#546E7A">意图=车书 → 车书 Agent</text>
  <text x="55" y="414" font-size="10" fill="#546E7A">意图=闲聊联网 → S2S</text>

  <!-- 中列 v15 节点 -->
  <rect x="510" y="120" width="380" height="50" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2"/>
  <text x="525" y="140" font-size="12" font-weight="bold" fill="#0D47A1">V17 语音 → ASR → 声纹</text>
  <text x="525" y="158" font-size="10" fill="#1565C0">与 0.8 同入口，但结果直接进 R</text>

  <rect x="510" y="180" width="380" height="60" rx="6" fill="#FFF8E1" stroke="#E65100" stroke-width="1.5"/>
  <text x="525" y="200" font-size="12" font-weight="bold" fill="#E65100">R 前置意图判断（合并三模型）</text>
  <text x="525" y="218" font-size="10" fill="#BF360C">ACC≥96% / P50≤150ms / P90≤250ms</text>
  <text x="525" y="234" font-size="10" fill="#BF360C">A/B/C/D 分流（W3b）</text>

  <rect x="510" y="250" width="380" height="50" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2"/>
  <text x="525" y="270" font-size="12" font-weight="bold" fill="#0D47A1">M 输入管理</text>
  <text x="525" y="288" font-size="10" fill="#1565C0">与 User Query / Advisor 建议 / 工具反馈排同一队</text>

  <rect x="510" y="310" width="380" height="90" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="525" y="330" font-size="12" font-weight="bold" fill="#0D47A1">四层漏斗（W2 关键补注落地）</text>
  <text x="525" y="348" font-size="10" fill="#1565C0">① 句法 RAG / SimpleIntent 快路径（毫秒级）</text>
  <text x="525" y="366" font-size="10" fill="#1565C0">② 情景 RAG + 仲裁模型（注入记忆/车况）</text>
  <text x="525" y="384" font-size="10" fill="#1565C0">③ Planner 深度推理（复杂需求）</text>
  <text x="525" y="400" font-size="10" fill="#78909C">超时进 Planner（W3b：简单车控过召唱歌）</text>

  <rect x="510" y="410" width="380" height="50" rx="6" fill="#FFF8E1" stroke="#E65100" stroke-width="1.5"/>
  <text x="525" y="430" font-size="12" font-weight="bold" fill="#E65100">D Director（Planner）</text>
  <text x="525" y="448" font-size="10" fill="#BF360C">SP+UP 调用 23 个工具，决定 talk_action_list</text>

  <rect x="510" y="470" width="380" height="50" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="525" y="490" font-size="12" font-weight="bold" fill="#1B5E20">23 工具 → 下游 Agent</text>
  <text x="525" y="508" font-size="10" fill="#2E7D32">车控/导航/音乐/搜索/记忆/视觉/氛围灯/日志…</text>

  <!-- 右列 1.0 节点 -->
  <rect x="980" y="120" width="380" height="60" rx="6" fill="#FFF8E1" stroke="#E65100" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="995" y="140" font-size="12" font-weight="bold" fill="#E65100">Watcher（端侧 Always on）</text>
  <text x="995" y="158" font-size="10" fill="#BF360C">端侧持续观察，主动发现场景</text>
  <text x="995" y="174" font-size="10" fill="#9E9E9E">对应 N2 章（长期愿景/2.6 部分）</text>

  <rect x="980" y="190" width="380" height="60" rx="6" fill="#FFF8E1" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="995" y="210" font-size="12" font-weight="bold" fill="#E65100">主 Agent（唯一思考主体）</text>
  <text x="995" y="228" font-size="10" fill="#BF360C">统一决策与用户交互，相当于 v15 的 D+M 合并</text>
  <text x="995" y="244" font-size="10" fill="#9E9E9E">v15 里 D/M/R 是分开的</text>

  <rect x="980" y="260" width="380" height="100" rx="6" fill="#FFF8E1" stroke="#E65100" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="995" y="280" font-size="12" font-weight="bold" fill="#E65100">12 能力向子 Agent</text>
  <text x="995" y="298" font-size="10" fill="#BF360C">v15 收缩为 4 类静态 Advisor：</text>
  <text x="995" y="314" font-size="10" fill="#1B5E20">　舒适 / 出行 / 情感 / 内容（S 图）</text>
  <text x="995" y="332" font-size="10" fill="#BF360C">其余 8 个能力向 Agent 留到 1.0</text>
  <text x="995" y="350" font-size="10" fill="#9E9E9E">职责还在、数量收敛，不是砍了</text>

  <rect x="980" y="370" width="380" height="70" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="995" y="390" font-size="12" font-weight="bold" fill="#B71C1C">4 内心向子 Agent（N5 图）</text>
  <text x="995" y="408" font-size="10" fill="#C62828">人设三观 / 情绪 / 记忆 / 自我探索</text>
  <text x="995" y="426" font-size="10" fill="#9E9E9E">v15 只落地记忆（S5-S6），其余 P2/长期</text>

  <rect x="980" y="450" width="380" height="60" rx="6" fill="#FFF8E1" stroke="#E65100" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="995" y="470" font-size="12" font-weight="bold" fill="#E65100">三方 A2A / AgentCard</text>
  <text x="995" y="488" font-size="10" fill="#BF360C">三方智能体用自然语言对话接入</text>
  <text x="995" y="504" font-size="10" fill="#9E9E9E">2.6 车书/本地生活/音乐是内置 FC 工具，不是 A2A</text>

  <!-- 列间演进虚线箭头 -->
  <polyline points="420,250 470,250 470,200 510,200" fill="none" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="465" y="230" font-size="10" fill="#757575">三模型合并</text>
  <polygon points="510,200 502,196 502,204" fill="#9E9E9E"/>

  <polyline points="420,380 470,380 470,350 510,350" fill="none" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="440" y="395" font-size="10" fill="#757575">结果判断→四层漏斗</text>

  <polyline points="890,210 940,210 940,190 980,190" fill="none" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="905" y="180" font-size="10" fill="#757575">R+M 合并为主 Agent</text>
  <polygon points="980,190 972,186 972,194" fill="#9E9E9E"/>

  <polyline points="890,440 940,440 940,310 980,310" fill="none" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="905" y="380" font-size="10" fill="#757575">Director 拆成 12 能力向</text>
  <polygon points="980,310 972,306 972,314" fill="#9E9E9E"/>

  <!-- 图例 -->
  <rect x="20" y="560" width="1360" height="320" rx="8" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1"/>
  <text x="40" y="585" font-size="14" font-weight="bold" fill="#263238">图例与读法</text>

  <rect x="40" y="600" width="20" height="14" fill="#ECEFF1" stroke="#546E7A"/><text x="66" y="611" font-size="11" fill="#37474F">灰=0.8 已落地基线</text>
  <rect x="240" y="600" width="20" height="14" fill="#E3F2FD" stroke="#1565C0"/><text x="266" y="611" font-size="11" fill="#37474F">蓝=v15 在落地主链</text>
  <rect x="440" y="600" width="20" height="14" fill="#FFF8E1" stroke="#E65100" stroke-dasharray="3,2"/><text x="466" y="611" font-size="11" fill="#37474F">金虚线=1.0 长期愿景</text>
  <rect x="660" y="600" width="20" height="14" fill="#FFEBEE" stroke="#C62828"/><text x="686" y="611" font-size="11" fill="#37474F">红=拒识/情绪类</text>
  <rect x="840" y="600" width="20" height="14" fill="#E8F5E9" stroke="#2E7D32"/><text x="866" y="611" font-size="11" fill="#37474F">绿=下游工具/回流</text>
  <line x1="1000" y1="607" x2="1040" y2="607" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="6,4"/><text x="1048" y="611" font-size="11" fill="#37474F">灰虚线=演进去向</text>

  <text x="40" y="645" font-size="12" font-weight="bold" fill="#263238">为什么模块看起来变少了（回应用户疑问）</text>
  <text x="40" y="665" font-size="11" fill="#546E7A">① 0.8 里并行的拒识/火山意图/豆包意图三个模型，v15 合并为 R 图一次判断（ACC≥96%）</text>
  <text x="40" y="683" font-size="11" fill="#546E7A">② 0.8 愿景里 12 个能力向 Agent，v15 收缩为 4 类静态 Advisor（舒适/出行/情感/内容），职责还在、数量收敛</text>
  <text x="40" y="701" font-size="11" fill="#546E7A">③ v15 的 D/M/R 三个独立模块，在 1.0 愿景里合并为一个"主 Agent"</text>

  <text x="40" y="735" font-size="12" font-weight="bold" fill="#263238">贯穿案例："带我去昨天那家游泳馆"在三个版本的走法</text>
  <text x="40" y="755" font-size="11" fill="#546E7A">0.8：ASR→dora chat→并行三模型→结果判断→车控/导航 Agent 直接分发</text>
  <text x="40" y="773" font-size="11" fill="#1565C0">v15：V17→R 判断（导航类）→M 输入管理→C 取昨天那家的长期记忆→D Director 规划→E 调路线规划工具→O 播报"已为你导航"</text>
  <text x="40" y="791" font-size="11" fill="#BF360C">1.0：Watcher 发现用户靠近车→主 Agent 统一调度→出行 Advisor 出建议→记忆 Agent 召回昨天那家→主 Agent 决定开口</text>

  <text x="40" y="825" font-size="12" font-weight="bold" fill="#263238">状态角标</text>
  <text x="40" y="845" font-size="11" fill="#546E7A">0.8 架构【已落地/2.6 首发基线】| v15 主链【2.6 目标/在落地】| 豆包 Engine 整体【长期愿景】</text>
  <text x="40" y="863" font-size="11" fill="#546E7A">12 能力向中 4 类 Advisor【2.6 目标】、其余【长期愿景】| 4 内心向【长期愿景，部分 P2】| 三方 A2A【长期愿景】</text>
</svg>
