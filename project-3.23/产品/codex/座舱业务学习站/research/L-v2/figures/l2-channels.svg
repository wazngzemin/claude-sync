<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="l2-channels" width="1200" height="761" viewBox="0 0 1200 761" role="img" aria-labelledby="l2-channels-title l2-channels-desc">
<title id="l2-channels-title">同一次观察，任务状态和原始结果怎样分开回传</title><desc id="l2-channels-desc">以挂 P 挡后看充电桩为例，调用方查任务状态，需要上云的结果走另一条路。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="l2-channels-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">同一次观察，任务状态和原始结果怎样分开回传</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">以挂 P 挡后看充电桩为例，调用方查任务状态，需要上云的结果走另一条路。</text>
<text class="v56-label" x="353" y="120" text-anchor="start">控制通道 · 状态回给调用方</text>
<text class="v56-label" x="353" y="341" text-anchor="start">数据通道 · 整包结果按主题分发</text>
<g data-node="true" id="l2-channels-call">
<rect class="v56-local" x="40" y="215" width="233" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="243" text-anchor="start">调用视觉 SDK</text>
<text class="v56-node-sub" x="54" y="271" text-anchor="start">发起一次单次观察</text>
<text class="v56-node-sub" x="54" y="295" text-anchor="start">带任务标识、目标等</text>
</g>
<g data-node="true" id="l2-channels-delivered">
<rect class="v56-local" x="353" y="138" width="202" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="367" y="166" text-anchor="start">同步回送达</text>
<text class="v56-node-sub" x="367" y="194" text-anchor="start">送达成功 / 失败</text>
</g>
<g data-node="true" id="l2-channels-runtime">
<rect class="v56-local" x="601" y="138" width="276" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="615" y="166" text-anchor="start">异步回运行状态</text>
<text class="v56-node-sub" x="615" y="194" text-anchor="start">已启动、成功、空结果</text>
<text class="v56-node-sub" x="615" y="218" text-anchor="start">超时、失败、已停止</text>
</g>
<g data-node="true" id="l2-channels-topic">
<rect class="v56-cloud" x="353" y="359" width="182" height="124" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="367" y="387" text-anchor="start">模型发布结果</text>
<text class="v56-node-sub" x="367" y="415" text-anchor="start">原始结果发到</text>
<text class="v56-node-sub" x="367" y="439" text-anchor="start">对应的结果主题</text>
</g>
<g data-node="true" id="l2-channels-relay">
<rect class="v56-cloud" x="561" y="359" width="172" height="124" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="575" y="387" text-anchor="start">车上的中继</text>
<text class="v56-node-sub" x="575" y="415" text-anchor="start">订阅结果主题</text>
<text class="v56-node-sub" x="575" y="439" text-anchor="start">整包转发上云</text>
</g>
<g data-node="true" id="l2-channels-cloud-state">
<rect class="v56-cloud" x="759" y="359" width="172" height="124" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="773" y="387" text-anchor="start">云端端状态</text>
<text class="v56-node-sub" x="773" y="415" text-anchor="start">接收并解析</text>
<text class="v56-node-sub" x="773" y="439" text-anchor="start">供上下文读取</text>
</g>
<g data-node="true" id="l2-channels-context">
<rect class="v56-cloud" x="957" y="359" width="203" height="124" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="971" y="387" text-anchor="start">进入上下文</text>
<text class="v56-node-sub" x="971" y="415" text-anchor="start">供 Advisor、Planner</text>
<text class="v56-node-sub" x="971" y="439" text-anchor="start">使用</text>
</g>
<path class="v56-arrow" d="M 273 261 L 312 261 L 312 194 L 353 194" marker-end="url(#l2-channels-arr)"/>
<path class="v56-arrow" d="M 273 297 L 312 297 L 312 421 L 353 421" marker-end="url(#l2-channels-arr)"/>
<path class="v56-arrow" d="M 555 194 L 601 194" marker-end="url(#l2-channels-arr)"/>
<path class="v56-arrow" d="M 535 421 L 561 421" marker-end="url(#l2-channels-arr)"/>
<path class="v56-arrow" d="M 733 421 L 759 421" marker-end="url(#l2-channels-arr)"/>
<path class="v56-arrow" d="M 931 421 L 957 421" marker-end="url(#l2-channels-arr)"/>
<text class="v56-risk" x="353" y="512" text-anchor="start">超时或失败时，只回真实状态，原始结果保持缺失。</text>
<path class="v56-rule" d="M 32 543 L 1168 543"/>
<text class="v56-node-title" x="32" y="572" text-anchor="start">四次分别验收，从送达查到云端</text>
<text class="v56-label" x="40" y="610" text-anchor="start">01 · 送达</text>
<text class="v56-subtitle" x="40" y="636" text-anchor="start">指令抵达视觉 SDK</text>
<text class="v56-label" x="328" y="610" text-anchor="start">02 · 跑完</text>
<text class="v56-subtitle" x="328" y="636" text-anchor="start">检查异步终态，区分空结果和超时</text>
<text class="v56-label" x="616" y="610" text-anchor="start">03 · 有有效结果</text>
<text class="v56-subtitle" x="616" y="636" text-anchor="start">订阅方收到可用的原始结果</text>
<text class="v56-label" x="904" y="610" text-anchor="start">04 · 云端读到</text>
<text class="v56-subtitle" x="904" y="636" text-anchor="start">先查端状态，再查上下文使用</text>
<path class="v56-arrow" d="M 264 605 L 308 605" marker-end="url(#l2-channels-arr)"/>
<path class="v56-arrow" d="M 552 605 L 596 605" marker-end="url(#l2-channels-arr)"/>
<path class="v56-arrow" d="M 840 605 L 884 605" marker-end="url(#l2-channels-arr)"/>
<path class="v56-rule" d="M 32 656 L 1168 656"/>
<text class="v56-node-title" x="32" y="690" text-anchor="start">收到运行状态后，继续核对结果主题、云端端状态与上下文。</text>
<rect data-decoration="true" class="v56-local" x="32.0" y="716" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="730" text-anchor="start">蓝：任务调用与控制状态</text>
<rect data-decoration="true" class="v56-cloud" x="410.6666666666667" y="716" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="438.6666666666667" y="730" text-anchor="start">绿：原始结果与上云</text>
<rect data-decoration="true" class="v56-reject" x="789.3333333333334" y="716" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817.3333333333334" y="730" text-anchor="start">红字：失败时的结果处理</text>
</svg>
