<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1562" viewBox="0 0 1760 1562" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arrow-627E9F" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#627E9F"/></marker></defs><rect width="1760" height="1562" fill="#F8FAFD"/><text x="44" y="48" font-size="30" font-weight="650" fill="#163352" xml:space="preserve">W · 可见即可说：从页面注册到真实点击，再回到对话历史</text><text x="44" y="84" font-size="20" font-weight="400" fill="#62758A" xml:space="preserve">原图分工已浏览器核验：车企/业务解析并执行，字节语音识别与匹配；不是 VLM 读屏。3 月框架优先级仅作当时设计，不代表当前所有车型</text><polyline points="460,249 590,249" fill="none" stroke="white" stroke-width="7"/><polyline points="460,249 590,249" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,249 1120,249" fill="none" stroke="white" stroke-width="7"/><polyline points="990,249 1120,249" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,358 1320,488" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,358 1320,488" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1120,612 990,612" fill="none" stroke="white" stroke-width="7"/><polyline points="1120,612 990,612" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,612 460,612" fill="none" stroke="white" stroke-width="7"/><polyline points="590,612 460,612" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="790,736 790,751.8260869565217 260,751.8260869565217 260,866" fill="none" stroke="white" stroke-width="7"/><polyline points="790,736 790,751.8260869565217 260,751.8260869565217 260,866" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="460,612 479.1578947368421,612 479.1578947368421,990 460,990" fill="none" stroke="white" stroke-width="7"/><polyline points="460,612 479.1578947368421,612 479.1578947368421,990 460,990" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="460,990 590,990" fill="none" stroke="white" stroke-width="7"/><polyline points="460,990 590,990" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="990,990 1120,990" fill="none" stroke="white" stroke-width="7"/><polyline points="990,990 1120,990" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,1114 1320,1244" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,1114 1320,1244" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="1320,1114 1320,1129.8260869565217 790,1129.8260869565217 790,1244" fill="none" stroke="white" stroke-width="7"/><polyline points="1320,1114 1320,1129.8260869565217 790,1129.8260869565217 790,1244" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="590,249 570.8421052631579,249 570.8421052631579,1228.1739130434783 260,1228.1739130434783 260,1244" fill="none" stroke="white" stroke-width="7"/><polyline points="590,249 570.8421052631579,249 570.8421052631579,1228.1739130434783 260,1228.1739130434783 260,1244" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><polyline points="460,1368 569.4736842105264,1368 569.4736842105264,373.82608695652175 790,373.82608695652175 790,358" fill="none" stroke="white" stroke-width="7"/><polyline points="460,1368 569.4736842105264,1368 569.4736842105264,373.82608695652175 790,373.82608695652175 790,358" fill="none" stroke="#627E9F" stroke-width="3" marker-end="url(#arrow-627E9F)"/><rect x="60" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W01</text><text x="80" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">页面业务解析当前可交互控件</text><text x="80" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">车企或业务方读取最上层界面</text><text x="80" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">挑选能执行点击的可见元素</text><text x="80" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">提取显示文字和对应控件对象</text><text x="80" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不是让 VLM 看图猜怎么点</text><rect x="590" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W02</text><text x="610" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">注册可见词、泛化词与控件 ID</text><text x="610" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">把可说名称与控件 ID 绑定</text><text x="610" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">按规范配置可识别的泛化表达</text><text x="610" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">注册范围对应当前页面或卡片</text><text x="610" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">框架要求每页最多 500 个词</text><rect x="1120" y="140" width="400" height="218" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="168" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W03</text><text x="1140" y="202" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">把有效注册词加入识别热词</text><text x="1140" y="241" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">注册内容进入在线和离线热词</text><text x="1140" y="267" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">随有效页面/卡片更新识别词表</text><text x="1140" y="293" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">热词帮助听对按钮名称</text><text x="1140" y="319" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">注入成功不等于最终必然命中</text><rect x="1120" y="488" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="1140" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W04</text><text x="1140" y="550" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">用户 final 到来，</text><text x="1140" y="580" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">带回本次有效界面</text><text x="1140" y="619" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">语音链路给出最终识别文字</text><text x="1140" y="645" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">保留请求编号、音区和页面上下文</text><text x="1140" y="671" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">过程文字不能直接模拟点击</text><text x="1140" y="697" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">动态卡片也可注册当前可选项</text><rect x="590" y="488" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="610" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W05</text><text x="610" y="550" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">全文、局部或模糊</text><text x="610" y="580" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">规则产生匹配候选</text><text x="610" y="619" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">按框架规则比较文字与注册词</text><text x="610" y="645" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">匹配结果可能为零、一个或多个</text><text x="610" y="671" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">无匹配就回正常有效 Query 链</text><text x="610" y="697" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不能把任意语义相似都判为按钮</text><rect x="60" y="488" width="400" height="248" rx="8" fill="#FFF8E8" stroke="#D6B577" stroke-width="1.5"/><text x="80" y="516" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W06</text><text x="80" y="550" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">多个命中：返回</text><text x="80" y="580" font-size="24" font-weight="600" fill="#775319" xml:space="preserve">全部候选给注册方</text><text x="80" y="619" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">字节不擅自挑第一个控件</text><text x="80" y="645" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">把多个候选 ID 交给注册业务</text><text x="80" y="671" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">业务按规则选择或完成消歧</text><text x="80" y="697" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">尚未确定目标时不得假报成功</text><rect x="60" y="866" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="894" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W07</text><text x="80" y="928" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">把确定的控件 ID </text><text x="80" y="958" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">交回业务执行入口</text><text x="80" y="997" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">匹配服务输出确定的目标 ID</text><text x="80" y="1023" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">注册业务接收并对应当前控件</text><text x="80" y="1049" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">检查页面及控件仍然有效</text><text x="80" y="1075" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">尚未点击只是明确了执行对象</text><rect x="590" y="866" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="610" y="894" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W08</text><text x="610" y="928" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">车企或业务方执行模拟点击</text><text x="610" y="967" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">由控件所属业务完成实际操作</text><text x="610" y="993" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">使用本页面既有点击执行能力</text><text x="610" y="1019" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">触发对应界面变化或业务请求</text><text x="610" y="1045" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">字节匹配层不直接代替业务完成</text><rect x="1120" y="866" width="400" height="248" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="1140" y="894" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W09</text><text x="1140" y="928" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">业务返回真实成</text><text x="1140" y="958" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">功、失败与可播内容</text><text x="1140" y="997" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">执行方回传实际点击/业务结果</text><text x="1140" y="1023" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">附上需要统一播报的内容</text><text x="1140" y="1049" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">失败和未完成必须明确区分</text><text x="1140" y="1075" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">匹配成功不能代替执行回执</text><rect x="1120" y="1244" width="400" height="248" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="1140" y="1272" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W10</text><text x="1140" y="1306" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">豆包统一播报，</text><text x="1140" y="1336" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">界面按交互规则反馈</text><text x="1140" y="1375" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">播报内容交豆包统一合成播放</text><text x="1140" y="1401" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">成功可有对应点击/结果反馈</text><text x="1140" y="1427" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">失败由系统显示相应 UI 提示</text><text x="1140" y="1453" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">不把失败 Toast 逐字机械念出</text><rect x="590" y="1244" width="400" height="248" rx="8" fill="#EFF8F4" stroke="#85B6A7" stroke-width="1.5"/><text x="610" y="1272" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W11</text><text x="610" y="1306" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">把模拟点击写入历</text><text x="610" y="1336" font-size="24" font-weight="600" fill="#186757" xml:space="preserve">史，给下一轮使用</text><text x="610" y="1375" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">历史标明本次来自模拟点击</text><text x="610" y="1401" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">同步用户原话、目标和真实结果</text><text x="610" y="1427" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">避免模型误认为普通问答或 FC</text><text x="610" y="1453" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">下一句“返回/再选”才能接上</text><rect x="60" y="1244" width="400" height="248" rx="8" fill="#F4F8FE" stroke="#ABC2E0" stroke-width="1.5"/><text x="80" y="1272" font-size="20" font-weight="600" fill="#62758A" xml:space="preserve">W12</text><text x="80" y="1306" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">卡片退场后注销，</text><text x="80" y="1336" font-size="24" font-weight="600" fill="#163352" xml:space="preserve">页面变化后更新范围</text><text x="80" y="1375" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">动态 selector 随结果卡片注册</text><text x="80" y="1401" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">卡片消失时删除对应选择器</text><text x="80" y="1427" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">新页面重新维护有效注册范围</text><text x="80" y="1453" font-size="20" font-weight="500" fill="#163352" xml:space="preserve">旧控件不能跨界面继续被点中</text><rect x="472.3157894736842" y="240.35384615384615" width="105.36842105263162" height="84" rx="3" fill="#FFFFFF"/><text x="478.3157894736842"