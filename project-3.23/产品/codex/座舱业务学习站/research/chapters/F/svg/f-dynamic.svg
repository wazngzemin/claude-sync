<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" role="img" aria-label="这一轮 DT 面前有哪些工具：常驻的，加上条件满足才出现的"><title>这一轮 DT 面前有哪些工具：常驻的，加上条件满足才出现的</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="790" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">这一轮 DT 面前有哪些工具：常驻的，加上条件满足才出现的</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">以屏幕上弹出一张带按钮的卡片为例；动态工具的技术方案 8 月底评审，10 月中旬测试中</text><rect x="40" y="100" width="360" height="170" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="54" y="127" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">这一轮的请求</text><text x="54" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">用户说的话</text><text x="54" y="173" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上一起报上来的卡片信息：</text><text x="54" y="194" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">标题、正文、按钮名、</text><text x="54" y="215" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">为什么弹出这张卡</text><polygon points="560,110.0 690.0,185 560,260.0 430.0,185" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="560" y="180" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">卡片信息在</text><text x="560" y="200" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">请求里吗？</text><path d="M400,185 L430,185" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="760" y="100" width="440" height="170" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="774" y="127" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">在：加一个“当前页特有操作”工具</text><text x="774" y="152" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说明里写着这张卡片能点什么</text><text x="774" y="173" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 选中它，回一个“点哪个按钮”</text><text x="774" y="194" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上替用户点</text><path d="M690,185 L760,185" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="713.825" y="160" width="22.35" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="725" y="176" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">在</text><rect x="760" y="320" width="440" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="774" y="347" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">不在：这个工具不出现</text><text x="774" y="372" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">平时说话时 DT 看不到它，</text><text x="774" y="393" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不会被它干扰选错工具</text><path d="M560,260 L560,375 L760,375" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="622.65" y="350" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="640" y="366" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">不在</text><rect x="40" y="470" width="1160" height="130" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="54" y="497" font-size="16" fill="#1d4b35" font-weight="650" text-anchor="start">常驻的工具：本渠道已发布、标了“参与 DT 推理”的实现</text><text x="54" y="522" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“是否参与 DT 推理”是每份实现里的一个开关（平台 SOP），配了不等于 DT 看得见。</text><text x="54" y="543" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">说明书版（研发叫 PE 版）的工具段从平台填入；训练版（研发叫 SFT 版）工具段写死，改成填入的需求在 H2 双周报里是暂缓。</text><text x="54" y="564" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">两部分合起来，才是这一轮 DT 面前的工具列表。</text><rect x="40" y="630" width="1160" height="130" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="54" y="657" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">还没做到 / 不归这里管的</text><text x="54" y="682" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">条件现在只能看请求里带的参数；要看车况，计划复用触发器的判断（方案“后续规划”）。</text><text x="54" y="703" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">原方案里“用户开关控制行程规划工具是否出现”的例子，现行文档已划掉。</text><text x="54" y="724" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具在列表里，不代表这辆车有这个功能：车型能力边界另有一套（D 章，前置检查未准出）。</text></g></svg>