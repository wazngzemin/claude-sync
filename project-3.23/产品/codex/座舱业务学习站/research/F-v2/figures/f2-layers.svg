<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="f2-layers" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="f2-layers-title f2-layers-desc">
<title id="f2-layers-title">这一轮看得见哪些工具，要分四层看</title><desc id="f2-layers-desc">前两层决定本轮列表；后两层约束模型判断与执行，不能互相替代。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="f2-layers-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">这一轮看得见哪些工具，要分四层看</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">前两层决定本轮列表；后两层约束模型判断与执行，不能互相替代。</text>
<text class="v56-label" x="80" y="122" text-anchor="start">逐层核对</text>
<text class="v56-label" x="840" y="122" text-anchor="start">这一层没过，会怎样</text>
<g data-node="true" id="f2-layers-n1"><rect class="v56-cloud" x="80" y="154" width="680" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="182" text-anchor="start">01 · 项目里有可用的实现</text>
<text class="v56-node-sub" x="94" y="209" text-anchor="start">本项目、本环境：唯一已发布、已启用</text>
<text class="v56-node-sub" x="94" y="231" text-anchor="start">并勾选“参与 Planner 推理”</text>
</g>
<text class="v56-node-title" x="840" y="191" text-anchor="start">Planner 看不见</text>
<text class="v56-subtitle" x="840" y="224" text-anchor="start">先核对项目与环境</text>
<path class="v56-arrow" d="M 460 264 L 460 304" marker-end="url(#f2-layers-arr)"/>
<g data-node="true" id="f2-layers-n2"><rect class="v56-cloud" x="120" y="304" width="640" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="134" y="332" text-anchor="start">02 · 本轮场景允许暴露</text>
<text class="v56-node-sub" x="134" y="359" text-anchor="start">动态工具条件满足，才加入本轮列表</text>
<text class="v56-node-sub" x="134" y="381" text-anchor="start">条件算出错，按不满足处理</text>
</g>
<text class="v56-node-title" x="840" y="341" text-anchor="start">本轮不出现</text>
<text class="v56-subtitle" x="840" y="374" text-anchor="start">核对本轮输入与动态条件</text>
<path class="v56-arrow" d="M 460 414 L 460 454" marker-end="url(#f2-layers-arr)"/>
<g data-node="true" id="f2-layers-n3"><rect class="v56-decision" x="160" y="454" width="600" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="174" y="482" text-anchor="start">03 · 模型知道这辆车能做什么</text>
<text class="v56-node-sub" x="174" y="509" text-anchor="start">车型能力说明 + 能力知识</text>
<text class="v56-node-sub" x="174" y="531" text-anchor="start">约束 Planner 对这辆车的能力判断</text>
</g>
<text class="v56-node-title" x="840" y="491" text-anchor="start">可能答应做不到的事</text>
<text class="v56-subtitle" x="840" y="524" text-anchor="start">能力说明不能代替执行校验</text>
<path class="v56-arrow" d="M 460 564 L 460 604" marker-end="url(#f2-layers-arr)"/>
<g data-node="true" id="f2-layers-n4"><rect class="v56-local" x="200" y="604" width="560" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="214" y="632" text-anchor="start">04 · 执行时允许</text>
<text class="v56-node-sub" x="214" y="659" text-anchor="start">下游检查权限、档位、登录等条件</text>
<text class="v56-node-sub" x="214" y="681" text-anchor="start">不满足时拒绝，并回具体原因</text>
</g>
<text class="v56-node-title" x="840" y="641" text-anchor="start">下游拒绝并回原因</text>
<text class="v56-subtitle" x="840" y="674" text-anchor="start">未登录不一定让工具消失</text>
<path class="v56-rule" d="M 32 754 L 1168 754"/>
<text class="v56-node-title" x="80" y="788" text-anchor="start">登记了 ≠ 看得见 ≠ 允许执行 ≠ 做成</text>
<rect data-decoration="true" class="v56-cloud" x="80" y="822" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="108" y="836" text-anchor="start">绿：本轮列表</text>
<rect data-decoration="true" class="v56-decision" x="380" y="822" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="408" y="836" text-anchor="start">黄：能力判断</text>
<rect data-decoration="true" class="v56-local" x="700" y="822" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="728" y="836" text-anchor="start">蓝：执行校验</text>
</svg>
