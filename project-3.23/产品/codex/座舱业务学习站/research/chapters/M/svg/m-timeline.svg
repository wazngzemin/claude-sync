<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" role="img" aria-label="主例：找充电站这一段对话里，输入管理每一刻在做什么"><title>主例：找充电站这一段对话里，输入管理每一刻在做什么</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1300" height="860" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">主例：找充电站这一段对话里，输入管理每一刻在做什么</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">横轴是先后顺序（示意，不按比例）；中间色带是 Chat 状态；例句取自技术方案的拼接示例，豆包的话术为示意</text><line x1="210" y1="100" x2="210" y2="720" stroke="#edf2f6" stroke-width="1"/><text x="210" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle">t1</text><line x1="390" y1="100" x2="390" y2="720" stroke="#edf2f6" stroke-width="1"/><text x="390" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle">t2</text><line x1="570" y1="100" x2="570" y2="720" stroke="#edf2f6" stroke-width="1"/><text x="570" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle">t3</text><line x1="750" y1="100" x2="750" y2="720" stroke="#edf2f6" stroke-width="1"/><text x="750" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle">t4</text><line x1="930" y1="100" x2="930" y2="720" stroke="#edf2f6" stroke-width="1"/><text x="930" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle">t5</text><line x1="1110" y1="100" x2="1110" y2="720" stroke="#edf2f6" stroke-width="1"/><text x="1110" y="96" font-size="12" fill="#8394a3" font-weight="500" text-anchor="middle">t6</text><text x="16" y="162" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">外部事件</text><text x="16" y="338" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">Chat 状态</text><text x="16" y="445" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">输入管理</text><text x="16" y="600" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">交给 DT</text><line x1="108" y1="100" x2="108" y2="720" stroke="#c9d6e1" stroke-width="1"/><rect x="124" y="120" width="172" height="74" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="138" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start">主驾说“找充电站”</text><text x="138" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同一刻：续航提醒</text><rect x="304" y="120" width="172" height="74" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="318" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start">副驾说“要快充”</text><text x="318" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">E1 还没发工具</text><rect x="484" y="120" width="172" height="74" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="498" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start">豆包：“我帮你找找”</text><text x="498" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">查站工具已发出</text><rect x="664" y="120" width="172" height="74" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="678" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start">工具结果回来</text><text x="678" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">此时还在播 t3 的话</text><rect x="844" y="120" width="172" height="74" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="858" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start">t3 的话播完</text><text x="858" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上报“播完”</text><rect x="1024" y="120" width="172" height="74" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="1038" y="147" font-size="13" fill="#1f4565" font-weight="650" text-anchor="start">E3 还没出字时</text><text x="1038" y="172" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">主驾补“选便宜的”</text><rect x="120" y="316" width="180" height="36" fill="#eaf6ef" stroke="#c9d6e1"/><text x="210.0" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle">空闲→处理中</text><rect x="300" y="316" width="180" height="36" fill="#fdf2e6" stroke="#c9d6e1"/><text x="390.0" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle">处理中</text><rect x="480" y="316" width="360" height="36" fill="#fdeeee" stroke="#c9d6e1"/><text x="660.0" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle">输出中</text><rect x="840" y="316" width="360" height="36" fill="#fdf2e6" stroke="#c9d6e1"/><text x="1020.0" y="340" font-size="13" fill="#22384a" font-weight="600" text-anchor="middle">处理中</text><rect x="124" y="384" width="172" height="112" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="138" y="411" font-size="13" fill="#1d4b35" font-weight="650" text-anchor="start">空闲：立即处理</text><text x="138" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">两条一起</text><text x="138" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">→ 推理 E1</text><rect x="304" y="384" width="172" height="112" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="318" y="411" font-size="13" fill="#1d4b35" font-weight="650" text-anchor="start">打断 E1，合并重推</text><text x="318" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具还没发</text><text x="318" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">→ 推理 E2</text><rect x="484" y="384" width="172" height="112" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="498" y="411" font-size="13" fill="#5c4c12" font-weight="650" text-anchor="start">放行工具</text><text x="498" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">这批输入此后</text><text x="498" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不能再整体重推</text><rect x="664" y="384" width="172" height="112" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="678" y="411" font-size="13" fill="#22384a" font-weight="650" text-anchor="start">工具结果排队</text><text x="678" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">单独处理</text><text x="678" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不打断正在播的话</text><rect x="844" y="384" width="172" height="112" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="858" y="411" font-size="13" fill="#1d4b35" font-weight="650" text-anchor="start">叫下一位</text><text x="858" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">取出工具结果</text><text x="858" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">→ 推理 E3</text><rect x="1024" y="384" width="172" height="112" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="1038" y="411" font-size="13" fill="#1d4b35" font-weight="650" text-anchor="start">打断 E3，合并重推</text><text x="1038" y="436" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">E3 还没发新工具</text><text x="1038" y="457" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">→ 推理 E4</text><rect x="124" y="552" width="172" height="82" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="138" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start"></text><text x="138" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">主驾：找充电站</text><text x="138" y="625" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">续航提醒</text><rect x="304" y="552" width="172" height="103" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="318" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start"></text><text x="318" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">主驾：找充电站</text><text x="318" y="625" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">续航提醒</text><text x="318" y="646" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">副驾：要快充</text><rect x="484" y="552" width="172" height="61" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="498" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start"></text><text x="498" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（DT 在等工具）</text><rect x="664" y="552" width="172" height="61" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="678" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start"></text><text x="678" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">（还在队里）</text><rect x="844" y="552" width="172" height="61" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="858" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start"></text><text x="858" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具：两处快充站</text><rect x="1024" y="552" width="172" height="82" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1038" y="579" font-size="12" fill="#4b5560" font-weight="650" text-anchor="start"></text><text x="1038" y="604" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">工具：两处快充站</text><text x="1038" y="625" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">主驾：选便宜一点的</text><path d="M210,194 L210,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M210,496 L210,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M390,194 L390,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M390,496 L390,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M570,194 L570,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M570,496 L570,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M750,194 L750,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M750,496 L750,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M930,194 L930,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M930,496 L930,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1110,194 L1110,312" fill="none" stroke="#9fb2c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M1110,496 L1110,548" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="740" width="1240" height="104" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="767" font-size="14" fill="#5c4c12" font-weight="650" text-anchor="start">注</text><text x="44" y="792" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">E1–E4 是每次推理的编号：全局唯一，不是递增序号；被打断那次推理之后再出的字、再发的工具都会被拦下。</text><text x="44" y="813" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">t4–t5 是未开预跑时的走法；开了预跑，t4 就可以先算 E3，但要等 t3 的话播完才放出来。</text><text x="44" y="834" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">t6：被打断的这一轮里有工具结果，它和新话一起重推（技术方案：“本轮 feedback + 新用户 + waiting”）。</text></g></svg>