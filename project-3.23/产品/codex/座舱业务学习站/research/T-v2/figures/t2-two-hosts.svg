<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="t2-two-hosts" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="t2-two-hosts-title t2-two-hosts-desc">
<title id="t2-two-hosts-title">同一个任务，只选一套托管</title><desc id="t2-two-hosts-desc">赛力斯由自研任务服务管理；上汽由目标引擎托管。到点后的建议都交回同一个 Planner。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="t2-two-hosts-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">同一个任务，只选一套托管</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">赛力斯由自研任务服务管理；上汽由目标引擎托管。到点后的建议都交回同一个 Planner。</text>
<text class="v56-label" x="80" y="128" text-anchor="start">赛力斯 · 自研任务服务</text>
<text class="v56-label" x="700" y="128" text-anchor="start">上汽 · 目标引擎</text>
<g data-node="true" id="t2-two-hosts-service"><rect class="v56-cloud" x="80" y="170" width="420" height="126" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="198" text-anchor="start">任务服务保存任务</text>
<text class="v56-node-sub" x="94" y="226" text-anchor="start">管理时间、条件、周期和多步界面任务</text>
<text class="v56-node-sub" x="94" y="250" text-anchor="start">任务入口工具交入原话</text>
</g>
<g data-node="true" id="t2-two-hosts-trigger"><rect class="v56-cloud" x="80" y="346" width="420" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="374" text-anchor="start">向触发器登记等待条件</text>
<text class="v56-node-sub" x="94" y="402" text-anchor="start">触发器负责等待条件命中</text>
</g>
<g data-node="true" id="t2-two-hosts-run"><rect class="v56-cloud" x="80" y="512" width="420" height="146" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="540" text-anchor="start">触发回调 → 任务服务生成运行</text>
<text class="v56-node-sub" x="94" y="568" text-anchor="start">先做有效性与执行前检查</text>
<text class="v56-node-sub" x="94" y="592" text-anchor="start">保存推荐关联，再推给车上</text>
<text class="v56-node-sub" x="94" y="616" text-anchor="start">建议经车上回流</text>
</g>
<g data-node="true" id="t2-two-hosts-tool"><rect class="v56-cloud" x="700" y="170" width="420" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="714" y="198" text-anchor="start">持续目标管理工具</text>
<text class="v56-node-sub" x="714" y="226" text-anchor="start">新增传内容；删除传实际目标编号</text>
</g>
<g data-node="true" id="t2-two-hosts-access"><rect class="v56-cloud" x="700" y="314" width="420" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="714" y="342" text-anchor="start">豆包侧接入</text>
<text class="v56-node-sub" x="714" y="370" text-anchor="start">补齐历史、车辆和身份后请求创建</text>
</g>
<g data-node="true" id="t2-two-hosts-engine"><rect class="v56-cloud" x="700" y="470" width="420" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="714" y="498" text-anchor="start">目标引擎保存目标</text>
<text class="v56-node-sub" x="714" y="526" text-anchor="start">托管目标，并判断条件</text>
</g>
<g data-node="true" id="t2-two-hosts-callback"><rect class="v56-cloud" x="700" y="626" width="420" height="154" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="714" y="654" text-anchor="start">豆包侧处理回调</text>
<text class="v56-node-sub" x="714" y="682" text-anchor="start">创建成功：直接给车上发创建卡片</text>
<text class="v56-node-sub" x="714" y="706" text-anchor="start">创建失败 / 到点触发：变成推荐</text>
<text class="v56-node-sub" x="714" y="730" text-anchor="start">推荐经车上回流</text>
</g>
<g data-node="true" id="t2-two-hosts-card"><rect class="v56-local" x="820" y="818" width="348" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="834" y="846" text-anchor="start">车上显示创建卡片</text>
<text class="v56-node-sub" x="834" y="874" text-anchor="start">创建成功这一支直接到车端</text>
</g>
<g data-node="true" id="t2-two-hosts-planner"><rect class="v56-decision" x="420" y="910" width="360" height="102" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="434" y="938" text-anchor="start">同一个 Planner</text>
<text class="v56-node-sub" x="434" y="966" text-anchor="start">结合当时情况，决定说什么、做什么</text>
</g>
<path class="v56-arrow" d="M 290 296 L 290 346" marker-end="url(#t2-two-hosts-arr)"/>
<path class="v56-arrow" d="M 290 448 L 290 512" marker-end="url(#t2-two-hosts-arr)"/>
<path class="v56-arrow" d="M 910 260 L 910 314" marker-end="url(#t2-two-hosts-arr)"/>
<path class="v56-arrow" d="M 910 416 L 910 470" marker-end="url(#t2-two-hosts-arr)"/>
<path class="v56-arrow" d="M 910 572 L 910 626" marker-end="url(#t2-two-hosts-arr)"/>
<path class="v56-arrow" d="M 80 584 L 48 584 L 48 961 L 420 961" marker-end="url(#t2-two-hosts-arr)"/>
<text class="v56-label" x="80" y="892" text-anchor="start">推荐回流</text>
<path class="v56-arrow" d="M 700 704 L 640 704 L 640 856 L 800 856 L 800 961 L 780 961" marker-end="url(#t2-two-hosts-arr)"/>
<text class="v56-label" x="650" y="838" text-anchor="start">推荐回流</text>
<path class="v56-arrow" d="M 1000 780 L 1000 818" marker-end="url(#t2-two-hosts-arr)"/>
<text class="v56-label" x="1016" y="804" text-anchor="start">创建成功</text>
<text class="v56-risk" x="32" y="1060" text-anchor="start">同一个任务只能有一个托管方，否则可能重复提醒。</text>
<path class="v56-rule" d="M 32 1084 L 1168 1084"/>
<text class="v56-node-title" x="32" y="1120" text-anchor="start">按项目选择托管方，再检查各自的回调结果。</text>
<rect data-decoration="true" class="v56-cloud" x="32.0" y="1148" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1162" text-anchor="start">绿：托管、等待与回调</text>
<rect data-decoration="true" class="v56-local" x="316.0" y="1148" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="1162" text-anchor="start">蓝：车端显示</text>
<rect data-decoration="true" class="v56-decision" x="600.0" y="1148" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="1162" text-anchor="start">黄：当下决策</text>
<rect data-decoration="true" class="v56-reject" x="884.0" y="1148" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="1162" text-anchor="start">红字：唯一托管约束</text>
</svg>
