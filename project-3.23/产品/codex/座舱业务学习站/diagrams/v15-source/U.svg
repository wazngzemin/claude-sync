<svg xmlns="http://www.w3.org/2000/svg" width="1397" height="1524" viewBox="0 0 1397 1524" role="img" aria-label="任务中心、任务岛与卡片"><title>任务中心、任务岛与卡片</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M863,226 L863,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="751" y="322" width="115" height="44" rx="3" fill="#fff"/><text x="756" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="756" dy="0">首次拉取数据源</tspan></text><path d="M733,226 L733,264 L468,264 L468,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="341" y="322" width="130" height="44" rx="3" fill="#fff"/><text x="346" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="346" dy="0">后台状态发生变化</tspan></text><path d="M863,644 L863,818 L767,818 L767,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="766" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="771" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="771" dy="0">取得列表</tspan></text><path d="M403,644 L403,818 L637,818 L637,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="306" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="311" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="311" dy="0">推送更新</tspan></text><path d="M605,1062 L605,1100 L555,1100 L555,1236 L307,1236 L307,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="443" y="1158" width="115" height="44" rx="3" fill="#fff"/><text x="448" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="448" dy="0">点击删除或暂停</tspan></text><path d="M177,1298 L177,226" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="740" width="145" height="44" rx="3" fill="#fff"/><text x="40" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">用户确认且操作受理</tspan></text><path d="M307,226 L307,400 L338,400 L338,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="210" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="215" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="215" dy="0">后台发生更新</tspan></text><path d="M702,1062 L702,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="575" y="1158" width="130" height="44" rx="3" fill="#fff"/><text x="580" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="580" dy="0">进入通用长时任务</tspan></text><path d="M800,1062 L800,1100 L1162,1100 L1162,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1065" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="1070" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="1070" dy="0">账号退登</tspan></text><a href="#module/U/step/U-1"><g data-step="U-1"><rect x="603" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="603" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="623" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="623" dy="0">U-1</tspan></text><text x="623" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="623" dy="0">分别提供三类任务</tspan></text><text x="623" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="623" dy="0">任务管理 / 静态 Advisor / 预设场景</tspan></text><text x="623" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="623" dy="0">三类任务与状态</tspan></text></g></a><a href="#module/U/step/U-2"><g data-step="U-2"><rect x="668" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="668" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="688" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="688" dy="0">U-2</tspan></text><text x="688" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="688" dy="0">上电或登录时主动拉取</tspan></text><text x="688" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="688" dy="0">客户端</tspan></text><text x="688" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="688" dy="0">当前账号 / 车辆任务列表</tspan></text></g></a><a href="#module/U/step/U-3"><g data-step="U-3"><rect x="208" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="208" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="228" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="228" dy="0">U-3</tspan></text><text x="228" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="228" dy="0">任务变化时主动推送</tspan></text><text x="228" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="228" dy="0">云端</tspan></text><text x="228" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="228" dy="0">最新任务变化</tspan></text></g></a><a href="#module/U/step/U-4"><g data-step="U-4"><rect x="507" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="507" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="527" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="527" dy="0">U-4</tspan></text><text x="527" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="527" dy="0">按类型与状态呈现任务</tspan></text><text x="527" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="527" dy="0">任务中心</tspan></text><text x="527" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="527" dy="0">用户可浏览的任务单元</tspan></text></g></a><a href="#module/U/step/U-5"><g data-step="U-5"><rect x="47" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="47" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="67" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="67" dy="0">U-5</tspan></text><text x="67" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="67" dy="0">删除任务前二次确认</tspan></text><text x="67" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="67" dy="0">用户 / 任务中心</tspan></text><text x="67" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="67" dy="0">经确认的管理操作</tspan></text></g></a><a href="#module/U/step/U-6"><g data-step="U-6"><rect x="47" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="47" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="67" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="67" dy="0">U-6</tspan></text><text x="67" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="67" dy="0">更新任务状态并同步界面</tspan></text><text x="67" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="67" dy="0">对应任务后台</tspan></text><text x="67" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="67" dy="0">最新任务状态</tspan></text></g></a><a href="#module/U/step/U-7"><g data-step="U-7"><rect x="507" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="507" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="527" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="527" dy="0">U-7</tspan></text><text x="527" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="527" dy="0">进入通用长时任务的生成式界面</tspan></text><text x="527" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="527" dy="0">用户 / 长时任务界面</tspan></text><text x="527" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="527" dy="0">进入任务详情或保持当前页</tspan></text></g></a><a href="#module/U/step/U-8"><g data-step="U-8"><rect x="967" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="967" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="987" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="987" dy="0">U-8</tspan></text><text x="987" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="987" dy="0">退登后清理对应任务显示</tspan></text><text x="987" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="987" dy="0">账号 / 客户端</tspan></text><text x="987" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="987" dy="0">账号切换后的任务视图</tspan></text></g></a></g></svg>