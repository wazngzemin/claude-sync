<svg xmlns="http://www.w3.org/2000/svg" width="1783" height="2504" viewBox="0 0 1783 2504" role="img" aria-label="请求与反馈主链"><title>请求与反馈主链</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M933,250 L933,486" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="746" y="346" width="190" height="44" rx="3" fill="#fff"/><text x="751" y="370" font-size="15" fill="#435c70" font-weight="400"><tspan x="751" dy="0">正式文字、请求身份、音区</tspan></text><path d="M998,692 L998,928" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="996" y="788" width="145" height="44" rx="3" fill="#fff"/><text x="1001" y="812" font-size="15" fill="#435c70" font-weight="400"><tspan x="1001" dy="0">云端放行的有效请求</tspan></text><path d="M998,1134 L998,1308 L896,1308 L896,1370" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="886" y="1230" width="115" height="44" rx="3" fill="#fff"/><text x="891" y="1254" font-size="15" fill="#435c70" font-weight="400"><tspan x="891" dy="0">当前轮输入批次</tspan></text><path d="M603,1134 L603,1172 L766,1172 L766,1370" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="609" y="1230" width="160" height="44" rx="3" fill="#fff"/><text x="614" y="1254" font-size="15" fill="#435c70" font-weight="400"><tspan x="614" dy="0">常用背景与相关上下文</tspan></text><path d="M766,1576 L766,1750 L603,1750 L603,1812" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="594" y="1672" width="175" height="44" rx="3" fill="#fff"/><text x="599" y="1696" font-size="15" fill="#435c70" font-weight="400"><tspan x="599" dy="0">工具名、参数与本轮动作</tspan></text><path d="M896,1576 L896,1614 L803,1614 L803,2192 L636,2192 L636,2254" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="801" y="1893" width="130" height="44" rx="3" fill="#fff"/><text x="806" y="1917" font-size="15" fill="#435c70" font-weight="400"><tspan x="806" dy="0">话术、语气与表情</tspan></text><path d="M538,2018 L538,2254" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="351" y="2114" width="190" height="44" rx="3" fill="#fff"/><text x="356" y="2138" font-size="15" fill="#435c70" font-weight="400"><tspan x="356" dy="0">卡片、端侧内容和执行结果</tspan></text><path d="M473,1134 L473,1812" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="471" y="1451" width="100" height="44" rx="3" fill="#fff"/><text x="476" y="1475" font-size="15" fill="#435c70" font-weight="400"><tspan x="476" dy="0">按需检索结果</tspan></text><path d="M868,692 L868,730 L312,730 L312,2192 L441,2192 L441,2254" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="1451" width="280" height="44" rx="3" fill="#fff"/><text x="40" y="1475" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">快路径执行结果，不经 Planner</tspan></text><path d="M538,2018 L538,2050 L1268,2050 L1268,904 L998,904 L998,928" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1275" y="2054" width="235" height="44" rx="3" fill="#fff"/><text x="1280" y="2078" font-size="15" fill="#435c70" font-weight="400"><tspan x="1280" dy="0">异步回流等需重新准入的工具反馈</tspan></text><path d="M538,2018 L538,2050 L1313,2050 L1313,1346 L831,1346 L831,1370" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1320" y="2054" width="205" height="44" rx="3" fill="#fff"/><text x="1325" y="2078" font-size="15" fill="#435c70" font-weight="400"><tspan x="1325" dy="0">普通 ReAct 工具结果</tspan></text><path d="M538,2460 L538,2492 L1358,2492 L1358,904 L998,904 L998,928" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1365" y="2496" width="175" height="44" rx="3" fill="#fff"/><text x="1370" y="2520" font-size="15" fill="#435c70" font-weight="400"><tspan x="1370" dy="0">打断信息或后续用户输入</tspan></text><path d="M538,2018 L538,2050 L1403,2050 L1403,904 L538,904 L538,928" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1410" y="2054" width="115" height="44" rx="3" fill="#fff"/><text x="1415" y="2078" font-size="15" fill="#435c70" font-weight="400"><tspan x="1415" dy="0">检索上下文来源</tspan></text><a href="#module/V"><g data-step="V"><rect x="738" y="44" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="738" y="44" width="5" height="206" rx="2" fill="#326785"/><text x="758" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="758" dy="0">V</tspan></text><text x="758" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="758" dy="0">语音输入与判停</tspan></text><text x="758" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="758" dy="0">用户请求与执行闭环</tspan></text><text x="758" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="758" dy="0">检查语音是否可用 / 把人声从车内声音中分离 / 接受唤</tspan><tspan x="758" dy="24">醒或项目允许的免唤醒输入</tspan></text></g></a><a href="#module/R"><g data-step="R"><rect x="738" y="486" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="738" y="486" width="5" height="206" rx="2" fill="#326785"/><text x="758" y="515" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="758" dy="0">R</tspan></text><text x="758" y="547" font-size="20" fill="#203b50" font-weight="600"><tspan x="758" dy="0">入口与端云采信</tspan></text><text x="758" y="589" font-size="16" fill="#375b71" font-weight="400"><tspan x="758" dy="0">用户请求与执行闭环</tspan></text><text x="758" y="628" font-size="16" fill="#566975" font-weight="400"><tspan x="758" dy="0">读取正式文字与网络状态 / 解析本地可处理的指令 / 判</tspan><tspan x="758" dy="24">断是否应响应及是否走快路径</tspan></text></g></a><a href="#module/M"><g data-step="M"><rect x="803" y="928" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="803" y="928" width="5" height="206" rx="2" fill="#326785"/><text x="823" y="957" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="823" dy="0">M</tspan></text><text x="823" y="989" font-size="20" fill="#203b50" font-weight="600"><tspan x="823" dy="0">输入管理</tspan></text><text x="823" y="1031" font-size="16" fill="#375b71" font-weight="400"><tspan x="823" dy="0">用户请求与执行闭环</tspan></text><text x="823" y="1070" font-size="16" fill="#566975" font-weight="400"><tspan x="823" dy="0">提交有效输入 / 检查推理、完整输出和起播状态 / 空闲</tspan><tspan x="823" dy="24">时直接开始下一轮</tspan></text></g></a><a href="#module/C"><g data-step="C"><rect x="343" y="928" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="343" y="928" width="5" height="206" rx="2" fill="#326785"/><text x="363" y="957" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="363" dy="0">C</tspan></text><text x="363" y="989" font-size="20" fill="#203b50" font-weight="600"><tspan x="363" dy="0">Context 上下文</tspan></text><text x="363" y="1031" font-size="16" fill="#375b71" font-weight="400"><tspan x="363" dy="0">用户请求与执行闭环</tspan></text><text x="363" y="1070" font-size="16" fill="#566975" font-weight="400"><tspan x="363" dy="0">持续产生上下文来源 / 维护各自负责的信息 / 把常用背</tspan><tspan x="363" dy="24">景先交给 Planner</tspan></text></g></a><a href="#module/D"><g data-step="D"><rect x="636" y="1370" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="636" y="1370" width="5" height="206" rx="2" fill="#326785"/><text x="656" y="1399" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="656" dy="0">D</tspan></text><text x="656" y="1431" font-size="20" fill="#203b50" font-weight="600"><tspan x="656" dy="0">Planner / Director</tspan></text><text x="656" y="1473" font-size="16" fill="#375b71" font-weight="400"><tspan x="656" dy="0">用户请求与执行闭环</tspan></text><text x="656" y="1512" font-size="16" fill="#566975" font-weight="400"><tspan x="656" dy="0">汇合本轮输入与背景 / 确定当前目标和下一步 / 提取话</tspan><tspan x="656" dy="24">术、语气和表情</tspan></text></g></a><a href="#module/E"><g data-step="E"><rect x="343" y="1812" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="343" y="1812" width="5" height="206" rx="2" fill="#326785"/><text x="363" y="1841" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="363" dy="0">E</tspan></text><text x="363" y="1873" font-size="20" fill="#203b50" font-weight="600"><tspan x="363" dy="0">工具执行与回流</tspan></text><text x="363" y="1915" font-size="16" fill="#375b71" font-weight="400"><tspan x="363" dy="0">用户请求与执行闭环</tspan></text><text x="363" y="1954" font-size="16" fill="#566975" font-weight="400"><tspan x="363" dy="0">把动作清单转成具体调用 / 按 Agent ID 找到配置 / 准</tspan><tspan x="363" dy="24">备该工具需要的上下文</tspan></text></g></a><a href="#module/O"><g data-step="O"><rect x="343" y="2254" width="390" height="206" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="343" y="2254" width="5" height="206" rx="2" fill="#326785"/><text x="363" y="2283" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="363" dy="0">O</tspan></text><text x="363" y="2315" font-size="20" fill="#203b50" font-weight="600"><tspan x="363" dy="0">播报、展示与真实结果</tspan></text><text x="363" y="2357" font-size="16" fill="#375b71" font-weight="400"><tspan x="363" dy="0">用户请求与执行闭环</tspan></text><text x="363" y="2396" font-size="16" fill="#566975" font-weight="400"><tspan x="363" dy="0">接收本轮要表达的内容 / 选择在线、离线或缓存音频 / </tspan><tspan x="363" dy="24">把文字变成音频并真正播出</tspan></text></g></a></g></svg>