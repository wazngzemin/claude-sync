
          <!DOCTYPE html>
<html>

<head>
    <title>Ai Car</title>
    <style>
        /* ====== 基础设置 (保持不变) ====== */
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-light: #666666;
            --accent-color: #3498db;
            --border-color: #eaeaea;
            /* 新增：统一边框色 */
            --max-width: 720px;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            line-height: 1.75;
        }

        /* 容器样式 */
        .container {
            max-width: var(--max-width);
            margin: 60px auto;
            padding: 40px 50px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .container {
                margin: 0;
                width: 100%;
                border-radius: 0;
                padding: 20px;
            }
        }

        /* 标题 & 段落 (保持不变) */
        h1,
        h2,
        h3 {
            margin-top: 1.5em;
            margin-bottom: 0.8em;
            color: #1a202c;
        }

        h1 {
            font-size: 2.2rem;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-top: 0;
        }

        p {
            margin-bottom: 1.5em;
            text-align: justify;
        }

        /* ====== 1. 优化后的表格样式 (Table) ====== */
        table {
            width: 100%;
            /* 宽度占满容器 */
            border-collapse: collapse;
            /* 合并边框，这是实现细边框的关键 */
            margin: 30px 0;
            /* 上下留白 */
            font-size: 0.95rem;
            /* 表格文字通常稍小一点点 */
        }

        th,
        td {
            border: 1px solid var(--border-color);
            /* 浅色边框 */
            padding: 12px 15px;
            /* 充裕的内边距 */
            text-align: left;
            /* 默认左对齐 */
        }

        th {
            background-color: #f8f9fa;
            /* 表头浅灰背景 */
            font-weight: 600;
            color: #1a202c;
        }

        /* 可选：隔行变色，增加可读性 */
        tr:nth-child(even) {
            background-color: #fcfcfc;
        }

        /* ====== 2. 优化后的引用样式 (Blockquote) ====== */

        blockquote {
            /* 基础样式 */
            margin: 30px 0;
            /* 默认上下间距 */
            padding: 16px 24px;
            /* 内部留白 */
            border-left: 5px solid var(--accent-color);
            background-color: #f1f5f9;
            border-radius: 4px;
            /* 整体圆角 */
            color: var(--text-light);
            font-style: italic;

            /* 过渡效果 */
            transition: all 0.2s;
        }
        blockquote+blockquote {
            margin-top: -30px;
            padding-top: 0;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
        blockquote:has(+ blockquote) {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            padding-bottom: 8px;
            /* 稍微减少前一段的底部留白，模拟段落间距 */
        }

        /* 图片样式 */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 30px auto;
            border-radius: 8px;
        }

        /* 代码块 */
        pre,
        code {
            font-family: 'Consolas', 'Monaco', monospace;
            background-color: #282c34;
            color: #abb2bf;
            border-radius: 6px;
        }

        code {
            padding: 2px 6px;
            background-color: #f0f0f0;
            /* 行内代码背景浅色 */
            color: #e74c3c;
            font-size: 0.9em;
        }

        pre {
            padding: 20px;
            overflow-x: auto;
            color: #dcdcdc;
            /* 代码块文字颜色 */
        }

        pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }
    </style>
</head>
