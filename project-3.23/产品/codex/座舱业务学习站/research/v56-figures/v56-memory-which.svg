<svg xmlns="http://www.w3.org/2000/svg" id="v56-memory-which" class="flow-figure v56-diagram" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="v56-memory-which-title v56-memory-which-desc">
<title id="v56-memory-which-title">同一段对话，三种线索各找哪份记忆</title>
<desc id="v56-memory-which-desc">左边读用户线索，右边看所需记录；“昨天”依赖跨天情景，“不要预约”是正文假设。</desc>
<style>
.v56-diagram{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff);color:var(--body,#33495b)}
.v56-diagram text{font-size:14px;font-weight:400;fill:var(--body,#33495b)}
.v56-diagram .figure-header .title{font-size:24px;font-weight:650;fill:var(--ink,#16344a)}
.v56-diagram .figure-header .subtitle,.v56-diagram .figure-caption text,.v56-diagram .note{fill:var(--muted,#5d7183)}
.v56-diagram .node-title{font-size:16px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .section-label{font-size:15px;font-weight:650;fill:var(--ink,#22384a)}
.v56-diagram .box{stroke-width:1.6}
.v56-diagram .neutral .box,.v56-diagram .neutral .swatch{fill:var(--v56-bg,#fff);stroke:var(--quiet,#9fb2c2)}
.v56-diagram .info .box,.v56-diagram .info .swatch{fill:var(--blue-soft,#eaf2fb);stroke:var(--blue,#4f7ea9)}
.v56-diagram .action .box,.v56-diagram .action .swatch{fill:var(--teal-soft,#eaf6ef);stroke:var(--teal,#4a9670)}
.v56-diagram .warning .box,.v56-diagram .warning .swatch{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-diagram .error .box,.v56-diagram .error .swatch{fill:var(--red-soft,#fdeeee);stroke:var(--red,#c45c5c)}
.v56-diagram .info .node-title{fill:var(--blue,#1f4565)}
.v56-diagram .action .node-title{fill:var(--teal,#1d4b35)}
.v56-diagram .warning .node-title{fill:var(--amber,#865b1a)}
.v56-diagram .error .node-title{fill:var(--red,#6e2222)}
.v56-diagram .pending .box{stroke-dasharray:6 5}
.v56-diagram .arr{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.v56-diagram .arr-error{stroke:var(--red,#c45c5c)}
.v56-diagram .arrow-head{fill:none;stroke:var(--muted,#476c8d);stroke-width:1.8}
.v56-diagram .arrow-head-error{stroke:var(--red,#c45c5c)}
.v56-diagram .rule{stroke:var(--line,#dce4eb);stroke-width:1;fill:none}
@media(prefers-color-scheme:dark){svg.v56-diagram{--v56-bg:#17212d;--ink:#e4edf6;--body:#d0dde9;--muted:#b4c4d3;--quiet:#8a9ead;--line:#3b5062;--blue:#a4caff;--blue-soft:#213c59;--teal:#99dbc5;--teal-soft:#203f3b;--amber:#f1cf91;--amber-soft:#443822;--red:#f2b0b7;--red-soft:#4b2e36}}
</style>
<defs><marker id="v56-memory-which-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head" d="M1 1L9 5L1 9"/></marker><marker id="v56-memory-which-arr-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow-head arrow-head-error" d="M1 1L9 5L1 9"/></marker></defs>
<g class="figure-header"><text class="title" x="32" y="44">同一段对话，三种线索各找哪份记忆</text><text class="subtitle" x="32" y="72">左边读用户线索，右边看所需记录；“昨天”依赖跨天情景，“不要预约”是正文假设。</text></g>
<path class="arr" d="M500,185 L694,185" fill="none" marker-end="url(#v56-memory-which-arr)"/>
<path class="arr" d="M500,325 L694,325" fill="none" marker-end="url(#v56-memory-which-arr)"/>
<path class="arr" d="M500,465 L694,465" fill="none" marker-end="url(#v56-memory-which-arr)"/>
<g class="neutral" data-node="second"><rect class="box" x="70" y="140" width="430" height="90" rx="8"/><text class="node-title" x="84" y="167" text-anchor="start">“第二个”</text><text class="node-subtitle" x="84" y="192" text-anchor="start">继续选刚才的餐厅</text></g>
<g class="info" data-node="history"><rect class="box" x="700" y="140" width="468" height="90" rx="8"/><text class="node-title" x="714" y="167" text-anchor="start">历史记录</text><text class="node-subtitle" x="714" y="192" text-anchor="start">刚才的原话和候选</text></g>
<g class="neutral" data-node="yesterday"><rect class="box" x="70" y="280" width="430" height="90" rx="8"/><text class="node-title" x="84" y="307" text-anchor="start">“昨天那家”</text><text class="node-subtitle" x="84" y="332" text-anchor="start">昨天去了哪家游泳馆</text></g>
<g class="info" data-node="episodic"><rect class="box" x="700" y="280" width="468" height="90" rx="8"/><text class="node-title" x="714" y="307" text-anchor="start">长期情景记忆</text><text class="node-subtitle" x="714" y="332" text-anchor="start">跨天保存昨天的经历</text></g>
<g class="neutral" data-node="constraint"><rect class="box" x="70" y="420" width="430" height="90" rx="8"/><text class="node-title" x="84" y="447" text-anchor="start">“不要预约的店”</text><text class="node-subtitle" x="84" y="472" text-anchor="start">较早的条件仍要遵守</text></g>
<g class="info" data-node="summary"><rect class="box" x="700" y="420" width="468" height="90" rx="8"/><text class="node-title" x="714" y="447" text-anchor="start">摘要</text><text class="node-subtitle" x="714" y="472" text-anchor="start">较早对话中仍有效的约束</text></g>
<g class="warning pending" data-node="instant"><rect class="box" x="70" y="565" width="1098" height="130" rx="8"/><text class="node-title" x="84" y="592" text-anchor="start">瞬时记忆</text><text class="node-subtitle" x="84" y="617" text-anchor="start">最近的原始细节</text><text class="node-subtitle" x="84" y="640" text-anchor="start">方案仍在调整</text><text class="node-subtitle" x="84" y="663" text-anchor="start">方案仍在调整</text></g>
<text class="section-label" x="70" y="114" text-anchor="start">用户线索</text>
<text class="section-label" x="700" y="114" text-anchor="start">需要找回的记录</text>
<g class="figure-caption"><path class="rule" d="M32,746 L1168,746"/>
<g class="neutral"><circle class="swatch" cx="39" cy="767" r="7"/></g>
<text class="node-subtitle" x="62" y="772" text-anchor="start">用户线索</text>
<g class="info"><circle class="swatch" cx="214" cy="767" r="7"/></g>
<text class="node-subtitle" x="237" y="772" text-anchor="start">供给理解的记录</text>
<g class="warning"><circle class="swatch" cx="389" cy="767" r="7"/></g>
<text class="node-subtitle" x="412" y="772" text-anchor="start">方案边界</text>
<path class="arr" d="M557,767 L581,767" stroke-dasharray="6 5"/>
<text class="node-subtitle" x="587" y="772" text-anchor="start">方案调整中</text>
</g>
</svg>
