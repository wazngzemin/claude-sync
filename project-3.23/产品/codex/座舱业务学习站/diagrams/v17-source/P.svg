<svg xmlns="http://www.w3.org/2000/svg" width="633" height="3196" viewBox="0 0 633 3196" role="img" aria-label="场景配置与发布"><title>场景配置与发布</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M300,226 L300,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="203" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="208" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="208" dy="0">选定模式</tspan></text><path d="M300,644 L300,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="203" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="208" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="208" dy="0">范围完整</tspan></text><path d="M235,1062 L235,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="63" y="1158" width="175" height="44" rx="3" fill="#fff"/><text x="68" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="68" dy="0">Workflow 模式</tspan></text><path d="M365,1062 L365,1100 L500,1100 L500,1654 L365,1654 L365,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="498" y="1367" width="100" height="44" rx="3" fill="#fff"/><text x="503" y="1391" font-size="15" fill="#435c70" font-weight="400"><tspan x="503" dy="0">简单模式</tspan></text><path d="M235,1480 L235,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="138" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="143" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="143" dy="0">判断图完成</tspan></text><path d="M300,1898 L300,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="203" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="208" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="208" dy="0">保存配置</tspan></text><path d="M300,2316 L300,2552" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="143" y="2412" width="160" height="44" rx="3" fill="#fff"/><text x="148" y="2436" font-size="15" fill="#435c70" font-weight="400"><tspan x="148" dy="0">完成项目发布与接入后</tspan></text><path d="M300,2734 L300,2970" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="173" y="2830" width="130" height="44" rx="3" fill="#fff"/><text x="178" y="2854" font-size="15" fill="#435c70" font-weight="400"><tspan x="178" dy="0">留下本次运行结果</tspan></text><a href="#module/P/step/P-1"><g data-step="P-1"><rect x="105" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">P-1</tspan></text><text x="125" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">选择简单模式或 Workflow</tspan></text><text x="125" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">配置人员</tspan></text><text x="125" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">场景模式</tspan></text></g></a><a href="#module/P/step/P-2"><g data-step="P-2"><rect x="105" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">P-2</tspan></text><text x="125" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">确定场景属于谁、在哪些车生效</tspan></text><text x="125" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">配置人员</tspan></text><text x="125" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">范围和场景属性</tspan></text></g></a><a href="#module/P/step/P-3"><g data-step="P-3"><rect x="105" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">P-3</tspan></text><text x="125" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">配置变化、状态和视觉判断</tspan></text><text x="125" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">配置人员 / 平台</tspan></text><text x="125" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">条件及其所需信号</tspan></text></g></a><a href="#module/P/step/P-4"><g data-step="P-4"><rect x="40" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="40" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="60" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="60" dy="0">P-4</tspan></text><text x="60" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="60" dy="0">定义判断顺序与分支汇合</tspan></text><text x="60" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="60" dy="0">Workflow 画布</tspan></text><text x="60" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="60" dy="0">判断图</tspan></text></g></a><a href="#module/P/step/P-5"><g data-step="P-5"><rect x="105" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">P-5</tspan></text><text x="125" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">选择交互卡或静默通知等出口</tspan></text><text x="125" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">配置人员</tspan></text><text x="125" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">出口与频控配置</tspan></text></g></a><a href="#module/P/step/P-6"><g data-step="P-6"><rect x="105" y="2134" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="2134" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="2163" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">P-6</tspan></text><text x="125" y="2195" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">拦截不完整或非法配置</tspan></text><text x="125" y="2237" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">平台校验</tspan></text><text x="125" y="2276" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">校验通过配置或明确错误</tspan></text></g></a><a href="#module/P/step/P-7"><g data-step="P-7"><rect x="105" y="2552" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="2552" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="2581" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">P-7</tspan></text><text x="125" y="2613" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">按订阅信号唤醒并完整判断</tspan></text><text x="125" y="2655" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">运行触发器</tspan></text><text x="125" y="2694" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">PASS、REJECT 或 UNKNOWN</tspan></text></g></a><a href="#module/P/step/P-8"><g data-step="P-8"><rect x="105" y="2970" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="105" y="2970" width="5" height="182" rx="2" fill="#326785"/><text x="125" y="2999" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="125" dy="0">P-8</tspan></text><text x="125" y="3031" font-size="20" fill="#203b50" font-weight="600"><tspan x="125" dy="0">分别记录判断、动作、展示和执行</tspan></text><text x="125" y="3073" font-size="16" fill="#375b71" font-weight="400"><tspan x="125" dy="0">触发记录</tspan></text><text x="125" y="3112" font-size="16" fill="#566975" font-weight="400"><tspan x="125" dy="0">可回看的一次运行记录</tspan></text></g></a></g></svg>