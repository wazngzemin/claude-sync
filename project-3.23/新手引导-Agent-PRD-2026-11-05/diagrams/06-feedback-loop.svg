<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1401" viewBox="0 0 1660 1401">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect width="1660" height="1401" fill="#FFFFFF"/>
<text x="70" y="67" fill="#0055A4" font-size="38" font-weight="700" text-anchor="start">处理反馈与触发器计次</text>
<text x="70" y="111" fill="#0055A4" font-size="25" font-weight="400" text-anchor="start">本期成功指 DT 开始处理对应建议；实际触达与功能结果另记</text>
<line x1="70" y1="140" x2="1590" y2="140" stroke="#0055A4" stroke-width="2"/>
<rect x="100" y="185" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="225" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器发出引导建议</text><text x="128" y="263" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">关联账号、场景及原请求或业务事件</text><text x="128" y="294" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">此时只证明已下发，不增加成功次数</text><line x1="560.0" y1="323" x2="560.0" y2="384" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="388" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="428" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 是否开始处理这条建议？</text><text x="128" y="466" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">必须关联本条建议的对应推理</text><text x="128" y="497" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">其他用户请求引起的推理不能代替</text><line x1="1020" y1="456.0" x2="1186" y2="456.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="443.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">否／未知</text><rect x="1190" y="388" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="428" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">未处理／未知</text><text x="1218" y="466" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不计成功</text><text x="1218" y="497" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不立即重复下发</text><line x1="560.0" y1="526" x2="560.0" y2="587" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="564.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">对应推理已开始</text><rect x="100" y="591" width="920" height="136" rx="8" fill="#DCF4A2" stroke="#0055A4" stroke-width="2"/><text x="128" y="631" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器核对处理反馈是否重复</text><text x="128" y="669" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">接口重试与回传重试关联同一建议</text><text x="128" y="700" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">乱序到达也不能串到其他账号</text><line x1="1020" y1="659.0" x2="1186" y2="659.0" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="1103.0" y="646.0" fill="#0055A4" font-size="22" font-weight="400" text-anchor="middle">重复</text><rect x="1190" y="591" width="400" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="1218" y="631" fill="#0055A4" font-size="25" font-weight="650" text-anchor="start">已处理过该反馈</text><text x="1218" y="669" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">保持原计数</text><text x="1218" y="700" fill="#0055A4" font-size="23" font-weight="400" text-anchor="start">不重复扣次数</text><line x1="560.0" y1="729" x2="560.0" y2="790" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><text x="578.0" y="767.5" fill="#0055A4" font-size="22" font-weight="400" text-anchor="start">首次有效反馈</text><rect x="100" y="794" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="834" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">触发器增加一次处理成功计数</text><text x="128" y="872" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">达到配置上限则结束本场景主动引导</text><text x="128" y="903" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">未达上限则等待新的有效机会</text><line x1="560.0" y1="932" x2="560.0" y2="993" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="997" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1037" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">DT 继续执行，端侧呈现真实交互</text><text x="128" y="1075" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">播放开始、完成或中断单独记录</text><text x="128" y="1106" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">没有播放证据就不标记已触达</text><line x1="560.0" y1="1135" x2="560.0" y2="1196" stroke="#0055A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="1200" width="920" height="136" rx="8" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/><text x="128" y="1240" fill="#0055A4" font-size="26" font-weight="650" text-anchor="start">功能模块返回注册或记忆结果</text><text x="128" y="1278" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">工具成功、失败或未知分别记录</text><text x="128" y="1309" fill="#0055A4" font-size="24" font-weight="400" text-anchor="start">不将已引导等同已注册、已记住</text>
</svg>