<svg xmlns="http://www.w3.org/2000/svg" width="1882" height="1942" viewBox="0 0 1882 1942" role="img" aria-label="输入管理"><title>输入管理</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M766,644 L766,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="669" y="740" width="100" height="44" rx="3" fill="#fff"/><text x="674" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="674" dy="0">新有效输入</tspan></text><path d="M727,1062 L727,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="615" y="1158" width="115" height="44" rx="3" fill="#fff"/><text x="620" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="620" dy="0">无推理、无播报</tspan></text><path d="M805,1062 L805,1110 L1187,1110 L1187,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1045" y="1158" width="145" height="44" rx="3" fill="#fff"/><text x="1050" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="1050" dy="0">未完整输出、未起播</tspan></text><path d="M883,1062 L883,1100 L1647,1100 L1647,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1415" y="1158" width="235" height="44" rx="3" fill="#fff"/><text x="1420" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="1420" dy="0">已起播或输出完整，且是用户新话</tspan></text><path d="M649,1062 L649,1100 L267,1100 L267,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="1158" width="235" height="44" rx="3" fill="#fff"/><text x="40" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">已起播或输出完整，且是其他输入</tspan></text><path d="M727,1480 L727,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="630" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="635" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="635" dy="0">直接处理</tspan></text><path d="M1187,1480 L1187,1654 L805,1654 L805,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1090" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="1095" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="1095" dy="0">新旧内容合并</tspan></text><path d="M1647,1480 L1647,1664 L883,1664 L883,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1490" y="1576" width="160" height="44" rx="3" fill="#fff"/><text x="1495" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="1495" dy="0">新话 + 已发生事实</tspan></text><path d="M267,1480 L267,1654 L649,1654 L649,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="125" y="1576" width="145" height="44" rx="3" fill="#fff"/><text x="130" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="130" dy="0">本轮推理与播报结束</tspan></text><path d="M766,226 L766,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="669" y="322" width="100" height="44" rx="3" fill="#fff"/><text x="674" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="674" dy="0">打断信息回流</tspan></text><a href="#module/M/step/M01"><g data-step="M01"><rect x="571" y="462" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="571" y="462" width="5" height="182" rx="2" fill="#326785"/><text x="591" y="491" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="591" dy="0">M01</tspan></text><text x="591" y="523" font-size="20" fill="#203b50" font-weight="600"><tspan x="591" dy="0">提交有效输入</tspan></text><text x="591" y="565" font-size="16" fill="#375b71" font-weight="400"><tspan x="591" dy="0">各输入来源</tspan></text><text x="591" y="604" font-size="16" fill="#566975" font-weight="400"><tspan x="591" dy="0">带来源的输入</tspan></text></g></a><a href="#module/M/step/M02"><g data-step="M02"><rect x="571" y="880" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="571" y="880" width="5" height="182" rx="2" fill="#326785"/><text x="591" y="909" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="591" dy="0">M02</tspan></text><text x="591" y="941" font-size="20" fill="#203b50" font-weight="600"><tspan x="591" dy="0">检查推理、完整输出和起播状态</tspan></text><text x="591" y="983" font-size="16" fill="#375b71" font-weight="400"><tspan x="591" dy="0">输入管理</tspan></text><text x="591" y="1022" font-size="16" fill="#566975" font-weight="400"><tspan x="591" dy="0">本轮所处阶段</tspan></text></g></a><a href="#module/M/step/M03"><g data-step="M03"><rect x="532" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="532" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="552" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="552" dy="0">M03</tspan></text><text x="552" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="552" dy="0">空闲时直接开始下一轮</tspan></text><text x="552" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="552" dy="0">输入管理</tspan></text><text x="552" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="552" dy="0">可处理的输入批次</tspan></text></g></a><a href="#module/M/step/M04"><g data-step="M04"><rect x="992" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="992" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="1012" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1012" dy="0">M04</tspan></text><text x="1012" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="1012" dy="0">尚未完整输出且未起播：合并重算</tspan></text><text x="1012" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="1012" dy="0">输入管理</tspan></text><text x="1012" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="1012" dy="0">新旧输入合并后的内容</tspan></text></g></a><a href="#module/M/step/M05"><g data-step="M05"><rect x="1452" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="1452" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="1472" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="1472" dy="0">M05</tspan></text><text x="1472" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="1472" dy="0">用户新话到来：打断并保留已发生事实</tspan></text><text x="1472" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="1472" dy="0">输入管理</tspan></text><text x="1472" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="1472" dy="0">用户新话、被打断信息、已下发状态</tspan></text></g></a><a href="#module/M/step/M06"><g data-step="M06"><rect x="72" y="1298" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="72" y="1298" width="5" height="182" rx="2" fill="#326785"/><text x="92" y="1327" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="92" dy="0">M06</tspan></text><text x="92" y="1359" font-size="20" fill="#203b50" font-weight="600"><tspan x="92" dy="0">其他输入在当前轮后排队</tspan></text><text x="92" y="1401" font-size="16" fill="#375b71" font-weight="400"><tspan x="92" dy="0">输入管理</tspan></text><text x="92" y="1440" font-size="16" fill="#566975" font-weight="400"><tspan x="92" dy="0">等待中的有效消息</tspan></text></g></a><a href="#module/M/step/M07"><g data-step="M07"><rect x="571" y="44" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="571" y="44" width="5" height="182" rx="2" fill="#326785"/><text x="591" y="73" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="591" dy="0">M07</tspan></text><text x="591" y="105" font-size="20" fill="#203b50" font-weight="600"><tspan x="591" dy="0">将打断结果按实际情况交回</tspan></text><text x="591" y="147" font-size="16" fill="#375b71" font-weight="400"><tspan x="591" dy="0">前序打断处理</tspan></text><text x="591" y="186" font-size="16" fill="#566975" font-weight="400"><tspan x="591" dy="0">新 query 附带打断内容，或独立 event</tspan></text></g></a><a href="#module/M/step/M08"><g data-step="M08"><rect x="571" y="1716" width="390" height="182" rx="8" fill="#f5f9fc" stroke="#a9bdcd"/><rect x="571" y="1716" width="5" height="182" rx="2" fill="#326785"/><text x="591" y="1745" font-size="13" fill="#6b7d8b" font-weight="400"><tspan x="591" dy="0">M08</tspan></text><text x="591" y="1777" font-size="20" fill="#203b50" font-weight="600"><tspan x="591" dy="0">提交这一轮完整输入批次</tspan></text><text x="591" y="1819" font-size="16" fill="#375b71" font-weight="400"><tspan x="591" dy="0">输入管理 → Director</tspan></text><text x="591" y="1858" font-size="16" fill="#566975" font-weight="400"><tspan x="591" dy="0">当前轮输入批次</tspan></text></g></a></g></svg>