<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 -20 1800 1900" font-family="Noto Sans SC, sans-serif">
  <!-- 补充区分区框 -->
  <rect x="40" y="1400" width="1760" height="380" rx="8" fill="#FAFBFC" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="1428" font-size="18" font-weight="bold" fill="#37474F">本次补充：端侧任务产品口径（L13 到 L18），分别接回 L01、L02、L03、L04、L11</text>
  <text x="60" y="1450" font-size="13" fill="#78909C">以下节点为 2.6 目标口径，不替代原图 L01 到 L12 的主判断流程；状态写在卡片要点里</text>

  <!-- 第一行 y=1470 -->
  <!-- L13 三开关分开（蓝底，接 L01） -->
  <rect x="60" y="1470" width="410" height="140" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="78" y="1495" font-size="16" font-weight="bold" fill="#1565C0">L13　三个开关分开管</text>
  <text x="78" y="1518" font-size="13" fill="#37474F">持续观察开关 / 语音开关 / AI 总开关，三者独立</text>
  <text x="78" y="1538" font-size="13" fill="#37474F">关语音不等于关持续观察；关 AI 总开关才全停</text>
  <text x="78" y="1558" font-size="13" fill="#37474F">系统预设可保留无声卡片，不依赖语音</text>
  <text x="78" y="1585" font-size="13" fill="#E65100">【已落地】</text>

  <!-- L14 端视觉上传分级（蓝底，接 L03） -->
  <rect x="490" y="1470" width="410" height="140" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="508" y="1495" font-size="16" font-weight="bold" fill="#1565C0">L14　端视觉结果怎么上传</text>
  <text x="508" y="1518" font-size="13" fill="#37474F">默认不上传全量画面描述</text>
  <text x="508" y="1538" font-size="13" fill="#37474F">命中条件才上传本次证据，调试模式全量上传</text>
  <text x="508" y="1558" font-size="13" fill="#37474F">区分"接收成功"和"结果真正到达"</text>
  <text x="508" y="1585" font-size="13" fill="#E65100">【2.6 目标 / 10 月方案】</text>

  <!-- L15 端云下发原则（金底，接 L02） -->
  <rect x="920" y="1470" width="410" height="140" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.5"/>
  <text x="938" y="1495" font-size="16" font-weight="bold" fill="#E65100">L15　端能力由谁开通</text>
  <text x="938" y="1518" font-size="13" fill="#37474F">云平台保存规则不自动下发端能力</text>
  <text x="938" y="1538" font-size="13" fill="#37474F">端能力按车型逐款确认后才开通</text>
  <text x="938" y="1558" font-size="13" fill="#37474F">端云统一配置属于后续建设</text>
  <text x="938" y="1585" font-size="13" fill="#C62828">【2.6 目标 / 端云统一配置待建设】</text>

  <!-- L16 P0-P3 优先级（金底，接 L04） -->
  <rect x="1350" y="1470" width="410" height="140" rx="6" fill="#fff8e8" stroke="#d6b577" stroke-width="1.5"/>
  <text x="1368" y="1495" font-size="16" font-weight="bold" fill="#E65100">L16　端侧任务谁优先</text>
  <text x="1368" y="1518" font-size="13" fill="#37474F">端侧任务按 P0 到 P3 排优先级</text>
  <text x="1368" y="1538" font-size="13" fill="#37474F">P0 安全类打断 P1 到 P3 体验类</text>
  <text x="1368" y="1558" font-size="13" fill="#37474F">同优先级按到达时间排队</text>
  <text x="1368" y="1585" font-size="13" fill="#C62828">【2.6 目标 / 优先级表待运营确认】</text>

  <!-- 第二行 y=1640 -->
  <!-- L17 雾灯案例（蓝底，接 L03） -->
  <rect x="60" y="1640" width="410" height="120" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="78" y="1665" font-size="16" font-weight="bold" fill="#1565C0">L17　雾灯状态变化的具体例子</text>
  <text x="78" y="1688" font-size="13" fill="#37474F">雾灯从关闭到打开，触发一次儿童锁建议检查</text>
  <text x="78" y="1708" font-size="13" fill="#37474F">这是 L03 订阅车况信号的具体业务例子</text>
  <text x="78" y="1728" font-size="13" fill="#37474F">信号变化不等于条件成立，还要过 L04</text>
  <text x="78" y="1750" font-size="13" fill="#E65100">【已落地】</text>

  <!-- L18 端侧离线兜底（蓝底，接 L11） -->
  <rect x="490" y="1640" width="410" height="120" rx="6" fill="#f4f8fe" stroke="#abc2e0" stroke-width="1.5"/>
  <text x="508" y="1665" font-size="16" font-weight="bold" fill="#1565C0">L18　什么时候走端侧兜底</text>
  <text x="508" y="1688" font-size="13" fill="#37474F">云端 3 秒超时或断网，才启用本地候选</text>
  <text x="508" y="1708" font-size="13" fill="#37474F">网络恢复后重新同步，不能凭无网推定全本地</text>
  <text x="508" y="1728" font-size="13" fill="#37474F">同一场景需验重复和迟到结果</text>
  <text x="508" y="1750" font-size="13" fill="#E65100">【已落地 / 3 秒超时按 9 月口径】</text>
</svg>
