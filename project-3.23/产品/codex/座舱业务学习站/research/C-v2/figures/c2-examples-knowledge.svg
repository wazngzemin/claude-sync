<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="c2-examples-knowledge" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="c2-examples-knowledge-title c2-examples-knowledge-desc">
<title id="c2-examples-knowledge-title">示例教选工具，场景知识教做事步骤</title><desc id="c2-examples-knowledge-desc">两条路分别补上“该调哪个工具”和“按什么步骤、守什么边界”。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="c2-examples-knowledge-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">示例教选工具，场景知识教做事步骤</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">两条路分别补上“该调哪个工具”和“按什么步骤、守什么边界”。</text>
<text class="v56-label" x="80" y="125" text-anchor="start">动态示例</text>
<text class="v56-label" x="660" y="125" text-anchor="start">场景知识</text>
<path class="v56-arrow" d="M 310 245 L 310 300" fill="none" marker-end="url(#c2-examples-knowledge-arr)"/>
<path class="v56-arrow" d="M 310 430 L 310 485" fill="none" marker-end="url(#c2-examples-knowledge-arr)"/>
<path class="v56-arrow" d="M 890 245 L 890 300" fill="none" marker-end="url(#c2-examples-knowledge-arr)"/>
<path class="v56-arrow" d="M 890 430 L 890 485" fill="none" marker-end="url(#c2-examples-knowledge-arr)"/>
<g data-node="true" id="c2-examples-knowledge-n1"><rect class="v56-neutral" x="80" y="155" width="460" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="182" text-anchor="start">这一轮的问题</text>
<text class="v56-node-sub" x="94" y="207" text-anchor="start">例子：“打开冰箱电源”</text>
</g>
<g data-node="true" id="c2-examples-knowledge-n2"><rect class="v56-neutral" x="660" y="155" width="460" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="674" y="182" text-anchor="start">最近两轮对话</text>
<text class="v56-node-sub" x="674" y="207" text-anchor="start">例子：用户想在车里看电影</text>
</g>
<g data-node="true" id="c2-examples-knowledge-n3"><rect class="v56-cloud" x="80" y="300" width="460" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="327" text-anchor="start">检索最像的 3 条</text>
<text class="v56-node-sub" x="94" y="352" text-anchor="start">按车型过滤，只带适用的示例</text>
<text class="v56-node-sub" x="94" y="375" text-anchor="start">案例写明“这样说 → 这样处理”</text>
</g>
<g data-node="true" id="c2-examples-knowledge-n4"><rect class="v56-local" x="660" y="300" width="460" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="674" y="327" text-anchor="start">场景路由模型选场景</text>
<text class="v56-node-sub" x="674" y="352" text-anchor="start">识别观影、接机、晕车等场景</text>
<text class="v56-node-sub" x="674" y="375" text-anchor="start">带上该场景的做事步骤和禁止事项</text>
</g>
<g data-node="true" id="c2-examples-knowledge-n5"><rect class="v56-cloud" x="80" y="485" width="460" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="512" text-anchor="start">教 Planner 该调哪个工具</text>
<text class="v56-node-sub" x="94" y="537" text-anchor="start">补低频、零散、容易选错工具的问题</text>
<text class="v56-node-sub" x="94" y="560" text-anchor="start">示例库热更新，不用发版</text>
</g>
<g data-node="true" id="c2-examples-knowledge-n6"><rect class="v56-local" x="660" y="485" width="460" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="674" y="512" text-anchor="start">教 Planner 按步骤、守边界</text>
<text class="v56-node-sub" x="674" y="537" text-anchor="start">例如：行驶中前排不能观影</text>
<text class="v56-node-sub" x="674" y="560" text-anchor="start">场景知识更新要发版</text>
</g>
<text class="v56-label" x="80" y="653" text-anchor="start">共同风险：带错了，会被模型当真；不适用的示例也会把回答带偏。</text>
<rect class="v56-neutral" x="32" y="734" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="748" text-anchor="start">灰：输入</text>
<rect class="v56-cloud" x="148" y="734" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="176" y="748" text-anchor="start">绿：示例与工具选择</text>
<rect class="v56-local" x="334" y="734" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="362" y="748" text-anchor="start">蓝：场景步骤与边界</text>
</svg>
