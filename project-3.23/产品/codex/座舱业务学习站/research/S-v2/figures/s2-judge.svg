<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="s2-judge" width="1200" height="671" viewBox="0 0 1200 671" role="img" aria-labelledby="s2-judge-title s2-judge-desc">
<title id="s2-judge-title">一次机会，怎样变成一条建议</title><desc id="s2-judge-desc">同样是主驾上车，Advisor 要结合当时的人、车和环境，先判断值不值得服务。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="s2-judge-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">一次机会，怎样变成一条建议</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">同样是主驾上车，Advisor 要结合当时的人、车和环境，先判断值不值得服务。</text>
<path class="v56-arrow" d="M 384 176 L 428 176" marker-end="url(#s2-judge-arr)"/>
<path class="v56-arrow" d="M 772 176 L 816 176" marker-end="url(#s2-judge-arr)"/>
<path class="v56-arrow" d="M 600 238 L 600 280 L 212 280 L 212 320" marker-end="url(#s2-judge-arr)"/>
<path class="v56-arrow" d="M 384 375 L 428 375" marker-end="url(#s2-judge-arr)"/>
<path class="v56-arrow" d="M 772 375 L 816 375" marker-end="url(#s2-judge-arr)"/>
<path class="v56-arrow" d="M 988 430 L 988 478" marker-end="url(#s2-judge-arr)"/>
<g data-node="true" id="s2-judge-facts">
<rect class="v56-cloud" x="40" y="118" width="344" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="146" text-anchor="start">01 · 读当前事实</text>
<text class="v56-node-sub" x="54" y="172" text-anchor="start">车内 38 度，空调还没开</text>
<text class="v56-node-sub" x="54" y="194" text-anchor="start">识别到主驾，记忆里常用 24 度</text>
<text class="v56-node-sub" x="54" y="216" text-anchor="start">查用户已有任务列表</text>
</g>
<g data-node="true" id="s2-judge-value">
<rect class="v56-decision" x="428" y="118" width="344" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="442" y="146" text-anchor="start">02 · 判断这次值不值得服务</text>
<text class="v56-node-sub" x="442" y="172" text-anchor="start">现在提醒会不会打扰主驾？</text>
<text class="v56-node-sub" x="442" y="194" text-anchor="start">刚建议过，或同一动作已受理？</text>
</g>
<g data-node="true" id="s2-judge-quiet">
<rect class="v56-neutral" x="816" y="118" width="344" height="120" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="830" y="146" text-anchor="start">没有建议</text>
<text class="v56-node-sub" x="830" y="172" text-anchor="start">这次不服务，评估正常结束</text>
</g>
<g data-node="true" id="s2-judge-target">
<rect class="v56-decision" x="40" y="320" width="344" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="348" text-anchor="start">03 · 选服务对象</text>
<text class="v56-node-sub" x="54" y="374" text-anchor="start">把刚上车的主驾作为服务对象</text>
</g>
<g data-node="true" id="s2-judge-action">
<rect class="v56-decision" x="428" y="320" width="344" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="442" y="348" text-anchor="start">04 · 选行动</text>
<text class="v56-node-sub" x="442" y="374" text-anchor="start">为了尽快降温，建议开极速制冷</text>
</g>
<g data-node="true" id="s2-judge-strategy">
<rect class="v56-decision" x="816" y="320" width="344" height="110" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="830" y="348" text-anchor="start">05 · 选服务策略</text>
<text class="v56-node-sub" x="830" y="374" text-anchor="start">选择告知执行，执行后告诉主驾</text>
</g>
<g data-node="true" id="s2-judge-candidate">
<rect class="v56-cloud" x="40" y="478" width="1120" height="94" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="54" y="506" text-anchor="start">交出一条建议</text>
<text class="v56-node-sub" x="54" y="532" text-anchor="start">车内 38 度 · 为主驾开极速制冷 · 告知执行</text>
<text class="v56-node-sub" x="54" y="554" text-anchor="start">建议同时带上卡片开关和按钮文案</text>
</g>
<text class="v56-label" x="794" y="158" text-anchor="middle">不服务</text>
<text class="v56-label" x="400" y="269" text-anchor="middle">值得服务</text>
<text class="v56-label" x="40" y="599" text-anchor="start">专家知识约定看哪些信号、何时给建议、动作前要不要确认、做完核什么。</text>
<path class="v56-rule" d="M 32 620 L 1168 620"/>
<rect data-decoration="true" class="v56-cloud" x="32" y="640" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="654" text-anchor="start">绿 · 进入评估的事实与交出的建议</text>
<rect data-decoration="true" class="v56-decision" x="411" y="640" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="439" y="654" text-anchor="start">黄 · Advisor 的业务判断</text>
<rect data-decoration="true" class="v56-neutral" x="789" y="640" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="817" y="654" text-anchor="start">灰 · 评估结束，保持安静</text>
</svg>
