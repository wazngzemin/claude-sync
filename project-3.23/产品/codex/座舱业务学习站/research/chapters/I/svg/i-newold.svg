<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="有人开口以后：线上现状和新输入管理的做法对照"><title>有人开口以后：线上现状和新输入管理的做法对照</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="700" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">有人开口以后：线上现状和新输入管理的做法对照</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">左边是线上现状，右边是新方案（开发中，计划 11 月底验收）；同一行是同一件事</text><rect x="30" y="92" width="555" height="480" rx="10" fill="#eaf2fb" fill-opacity=".35" stroke="#4f7ea9" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#1f4565" font-weight="650" text-anchor="start">线上现状</text><rect x="615" y="92" width="555" height="480" rx="10" fill="#f6f7f8" fill-opacity=".35" stroke="#98a3ad" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="629" y="116" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">新输入管理（开发中）</text><rect x="50" y="130" width="515" height="126" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="157" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">怎么停</text><text x="64" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">判断要停就直接停播</text><text x="64" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">被拒识时再另起一轮让 DT 决定补不补</text><rect x="635" y="130" width="515" height="126" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="649" y="157" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">怎么停</text><text x="649" y="182" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">先在车上暂停</text><text x="649" y="203" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">最后被拒识且允许恢复：接着原来那段播</text><text x="649" y="224" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">是有效插话：才永久停止</text><rect x="50" y="274" width="515" height="126" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="301" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">能不能合并重想</text><text x="64" y="326" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">看 DT 有没有输出第一个字</text><text x="64" y="347" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">出了：旧的那次丢弃</text><rect x="635" y="274" width="515" height="126" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="649" y="301" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">能不能合并重想</text><text x="649" y="326" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">看工具有没有发出去、车上有没有开播</text><text x="649" y="347" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">旧话不再丢弃，当背景交给 DT</text><rect x="50" y="418" width="515" height="126" rx="8" fill="#eaf2fb" stroke="#4f7ea9" stroke-width="1.6"/><text x="64" y="445" font-size="16" fill="#1f4565" font-weight="650" text-anchor="start">说到哪了怎么报</text><text x="64" y="470" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">车上报播放时长</text><text x="64" y="491" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">播完用另一个临时标记</text><rect x="635" y="418" width="515" height="126" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="649" y="445" font-size="16" fill="#4b5560" font-weight="650" text-anchor="start">说到哪了怎么报</text><text x="649" y="470" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">四种播放事件：开始、进度、播完、永久停止</text><text x="649" y="491" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">永久停止必须写原因</text><rect x="30" y="596" width="1140" height="76" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="623" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">没有变的：补不补、怎么补，仍由 DT 按规则判断；已经发出去的动作不因停播而撤回</text><text x="44" y="648" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">新方案能把“新旧回答交错”减少多少，要等验收后的路测数据</text></g></svg>