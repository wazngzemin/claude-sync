<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="e2-resolve" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="e2-resolve-title e2-resolve-desc">
<title id="e2-resolve-title">同一个工具名，怎样找到这辆车的实现</title><desc id="e2-resolve-desc">Agent Server 按工具、项目和环境找到生效实现，再交给对应执行器。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="e2-resolve-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">同一个工具名，怎样找到这辆车的实现</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">Agent Server 按工具、项目和环境找到生效实现，再交给对应执行器。</text>
<text class="v56-label" x="32" y="126" text-anchor="start">云端编排把单个工具调用交给 Agent Server</text>
<g data-node="true"><rect class="v56-neutral" x="32" y="166" width="142" height="156" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="193" text-anchor="start">Planner 的动作</text>
<text class="v56-node-sub" x="46" y="218" text-anchor="start">工具名 + 参数</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="193" y="166" width="146" height="156" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="207" y="193" text-anchor="start">Agent Server</text>
<text class="v56-node-sub" x="207" y="218" text-anchor="start">单个工具这次</text>
<text class="v56-node-sub" x="207" y="239" text-anchor="start">怎么调</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="358" y="166" width="130" height="156" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="372" y="193" text-anchor="start">查工具定义</text>
<text class="v56-node-sub" x="372" y="218" text-anchor="start">全系统一份</text>
<text class="v56-node-sub" x="372" y="239" text-anchor="start">描述工具能力</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="507" y="166" width="166" height="156" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="521" y="193" text-anchor="start">按项目查实现</text>
<text class="v56-node-sub" x="521" y="218" text-anchor="start">渠道 + 应用编号</text>
<text class="v56-node-sub" x="521" y="239" text-anchor="start">参数、端点等</text>
</g>
<g data-node="true"><rect class="v56-decision" x="692" y="166" width="148" height="156" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="706" y="193" text-anchor="start">按环境取版本</text>
<text class="v56-node-sub" x="706" y="218" text-anchor="start">唯一生效版本</text>
<text class="v56-node-sub" x="706" y="239" text-anchor="start">发布整体切换</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="859" y="166" width="160" height="156" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="873" y="193" text-anchor="start">执行器</text>
<text class="v56-node-sub" x="873" y="218" text-anchor="start">HTTP / kitex</text>
<text class="v56-node-sub" x="873" y="239" text-anchor="start">MCP / Frontier</text>
</g>
<g data-node="true"><rect class="v56-neutral" x="1038" y="166" width="130" height="156" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="1052" y="193" text-anchor="start">提供方</text>
<text class="v56-node-sub" x="1052" y="218" text-anchor="start">按实现调用</text>
<text class="v56-node-sub" x="1052" y="239" text-anchor="start">对应的服务</text>
</g>
<path class="v56-arrow" d="M 174 244 L 193 244" marker-end="url(#e2-resolve-arr)"/>
<path class="v56-arrow" d="M 339 244 L 358 244" marker-end="url(#e2-resolve-arr)"/>
<path class="v56-arrow" d="M 488 244 L 507 244" marker-end="url(#e2-resolve-arr)"/>
<path class="v56-arrow" d="M 673 244 L 692 244" marker-end="url(#e2-resolve-arr)"/>
<path class="v56-arrow" d="M 840 244 L 859 244" marker-end="url(#e2-resolve-arr)"/>
<path class="v56-arrow" d="M 1019 244 L 1038 244" marker-end="url(#e2-resolve-arr)"/>
<text class="v56-label" x="32" y="380" text-anchor="start">同名工具对照：天气查询</text>
<g data-node="true"><rect class="v56-local" x="32" y="412" width="536" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="439" text-anchor="start">上汽</text>
<text class="v56-node-sub" x="46" y="464" text-anchor="start">项目实现 → 内部能力平台</text>
</g>
<g data-node="true"><rect class="v56-local" x="632" y="412" width="536" height="104" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="646" y="439" text-anchor="start">赛力斯</text>
<text class="v56-node-sub" x="646" y="464" text-anchor="start">项目实现 → 弋途（三方服务商）</text>
</g>
<text class="v56-subtitle" x="32" y="561" text-anchor="start">同一个工具定义，两个项目可以使用不同提供方。</text>
<rect class="v56-neutral" x="32" y="600" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="614" text-anchor="start">灰：动作与提供方</text>
<rect class="v56-cloud" x="282" y="600" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="310" y="614" text-anchor="start">绿：云端调用</text>
<rect class="v56-decision" x="512" y="600" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="540" y="614" text-anchor="start">黄：选择生效版本</text>
<rect class="v56-local" x="782" y="600" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="810" y="614" text-anchor="start">蓝：项目对照</text>
</svg>
