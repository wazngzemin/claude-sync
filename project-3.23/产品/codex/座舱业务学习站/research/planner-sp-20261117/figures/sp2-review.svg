<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="sp2-review" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="sp2-review-title sp2-review-desc">
<title id="sp2-review-title">评审这一版，先看模型会学到什么错</title><desc id="sp2-review-desc">把问题分成五组：一处写错，可能让模型选错工具、填错参数，或重复执行已经成功的动作。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="sp2-review-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">评审这一版，先看模型会学到什么错</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">把问题分成五组：一处写错，可能让模型选错工具、填错参数，或重复执行已经成功的动作。</text>
<g data-node="true" id="sp2-review-conflict"><rect class="v56-decision v56-pending" x="32" y="142" width="548" height="218" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="170" text-anchor="start">01 · 规则互相打架</text>
<text class="v56-node-sub" x="46" y="198" text-anchor="start">任务规则：建议、事件、回执不建改任务</text>
<text class="v56-node-sub" x="46" y="222" text-anchor="start">示例却让建议触发创建任务</text>
<text class="v56-node-sub" x="46" y="246" text-anchor="start">学偏：收到建议就自行建任务</text>
<text class="v56-node-sub" x="46" y="270" text-anchor="start">需统一：哪些输入可以发起任务</text>
</g>
<g data-node="true" id="sp2-review-mapping"><rect class="v56-reject" x="620" y="142" width="548" height="218" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="634" y="170" text-anchor="start">02 · 映射写错</text>
<text class="v56-node-sub" x="634" y="198" text-anchor="start">“入弯灵活度调小”</text>
<text class="v56-node-sub" x="634" y="222" text-anchor="start">动作却写成“动能回收强度调小”</text>
<text class="v56-node-sub" x="634" y="246" text-anchor="start">学偏：把用户的操作对象换成另一项</text>
</g>
<g data-node="true" id="sp2-review-names"><rect class="v56-reject" x="32" y="402" width="548" height="218" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="430" text-anchor="start">03 · 名字对不上</text>
<text class="v56-node-sub" x="46" y="458" text-anchor="start">工具定义：task_agent</text>
<text class="v56-node-sub" x="46" y="482" text-anchor="start">示例调用：task_agent_update</text>
<text class="v56-node-sub" x="46" y="506" text-anchor="start">学偏：照搬不匹配的工具名</text>
</g>
<g data-node="true" id="sp2-review-format"><rect class="v56-reject" x="620" y="402" width="548" height="218" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="634" y="430" text-anchor="start">04 · 格式错误</text>
<text class="v56-node-sub" x="634" y="458" text-anchor="start">121 个输出块中，6 个 JSON 无法解析</text>
<text class="v56-node-sub" x="634" y="482" text-anchor="start">例如缺括号、中文逗号或中文引号</text>
<text class="v56-node-sub" x="634" y="506" text-anchor="start">学偏：生成接收方无法解析的输出</text>
</g>
<g data-node="true" id="sp2-review-behavior"><rect class="v56-reject" x="32" y="662" width="1136" height="190" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="690" text-anchor="start">05 · 示例行为错</text>
<text class="v56-node-sub" x="46" y="718" text-anchor="start">同一轮并行两个导航域工具 → 学偏：忽略串行限制</text>
<text class="v56-node-sub" x="46" y="742" text-anchor="start">添加途经点已经成功，又重复发一次 → 学偏：成功后仍重复执行</text>
<text class="v56-node-sub" x="46" y="766" text-anchor="start">逐轮核对：原调用、工具回执和下一步动作是否衔接</text>
</g>
<path class="v56-rule" d="M 32 902 L 1168 902"/>
<text class="v56-node-title" x="32" y="938" text-anchor="start">示例和规则不一致时，模型往往跟示例走，先修示例。</text>
<rect data-decoration="true" class="v56-decision" x="32.0" y="966" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="980" text-anchor="start">黄 + 虚线：规则需统一</text>
<rect data-decoration="true" class="v56-reject" x="600.0" y="966" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="980" text-anchor="start">红：具体错误及其行为影响</text>
</svg>
