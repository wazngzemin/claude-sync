<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="l2-debug" width="1200" height="1315" viewBox="0 0 1200 1315" role="img" aria-labelledby="l2-debug-title l2-debug-desc">
<title id="l2-debug-title">“没提醒”“提醒了但灯没亮”，从哪一步查</title><desc id="l2-debug-desc">先锁定同一辆车、同一次天气触发，再对上每一步的输入、判断和实际结果。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}

.v56-risk{font-size:14px;font-weight:400;fill:var(--red,#9c4148)}
</style>
<defs><marker id="l2-debug-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">“没提醒”“提醒了但灯没亮”，从哪一步查</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">先锁定同一辆车、同一次天气触发，再对上每一步的输入、判断和实际结果。</text>
<text class="v56-label" x="80" y="122" text-anchor="start">没提醒 · 从任务开关开始查</text>
<text class="v56-label" x="782" y="122" text-anchor="start">找谁 · 核对这层的输入与结果</text>
<g data-node="true" id="l2-debug-switch">
<rect class="v56-neutral" x="80" y="146" width="646" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="174" text-anchor="start">01 · 天气任务开关生效了吗</text>
<text class="v56-node-sub" x="94" y="202" text-anchor="start">核对开关值，以及重启后是否读回</text>
</g>
<text class="v56-node-title" x="782" y="176" text-anchor="start">车控应用 / 车上的中继</text>
<text class="v56-subtitle" x="782" y="205" text-anchor="start">查本地保存和触发器收到的开关值</text>
<path class="v56-arrow" d="M 403 236 L 403 272" marker-end="url(#l2-debug-arr)"/>
<g data-node="true" id="l2-debug-start">
<rect class="v56-local" x="80" y="272" width="646" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="300" text-anchor="start">02 · AI Box 和视觉 SDK 启动了吗</text>
<text class="v56-node-sub" x="94" y="328" text-anchor="start">查 AI Box 是否就绪，SDK 是否回“已启动”</text>
</g>
<text class="v56-node-title" x="782" y="302" text-anchor="start">AI Box / 视觉 SDK</text>
<text class="v56-subtitle" x="782" y="331" text-anchor="start">查异步状态和摄像头占用</text>
<path class="v56-arrow" d="M 403 362 L 403 398" marker-end="url(#l2-debug-arr)"/>
<g data-node="true" id="l2-debug-result">
<rect class="v56-local" x="80" y="398" width="646" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="426" text-anchor="start">03 · 有没有有效的视觉结果</text>
<text class="v56-node-sub" x="94" y="454" text-anchor="start">区分空结果、超时、掉包与识别错误</text>
</g>
<text class="v56-node-title" x="782" y="428" text-anchor="start">视觉 SDK / 车上的中继</text>
<text class="v56-subtitle" x="782" y="457" text-anchor="start">对照结果主题、标签和时间</text>
<path class="v56-arrow" d="M 403 488 L 403 524" marker-end="url(#l2-debug-arr)"/>
<g data-node="true" id="l2-debug-rule">
<rect class="v56-decision" x="80" y="524" width="646" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="552" text-anchor="start">04 · 端侧触发器命中了吗</text>
<text class="v56-node-sub" x="94" y="580" text-anchor="start">核对连续 2 次浓雾、车速高于 30 公里每小时、后雾灯未开</text>
</g>
<text class="v56-node-title" x="782" y="554" text-anchor="start">端侧触发器</text>
<text class="v56-subtitle" x="782" y="583" text-anchor="start">看当时的值、计数和命中记录</text>
<path class="v56-arrow" d="M 403 614 L 403 650" marker-end="url(#l2-debug-arr)"/>
<g data-node="true" id="l2-debug-card">
<rect class="v56-cloud" x="80" y="650" width="646" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="678" text-anchor="start">05 · 即时卡片出了、播了、过期了吗</text>
<text class="v56-node-sub" x="94" y="706" text-anchor="start">查天气业务是否收到本地业务事件，卡片是否展示</text>
</g>
<text class="v56-node-title" x="782" y="680" text-anchor="start">天气业务 / 即时卡片</text>
<text class="v56-subtitle" x="782" y="709" text-anchor="start">查拉卡、排队、展示和有效期</text>
<path class="v56-arrow" d="M 403 740 L 403 804" marker-end="url(#l2-debug-arr)"/>
<g data-node="true" id="l2-debug-confirm">
<rect class="v56-cloud" x="80" y="804" width="646" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="832" text-anchor="start">06 · 主驾确认回到天气业务了吗</text>
<text class="v56-node-sub" x="94" y="860" text-anchor="start">点按钮或本地语音都查同一个按钮回调</text>
</g>
<text class="v56-node-title" x="782" y="834" text-anchor="start">即时卡片 / 天气业务</text>
<text class="v56-subtitle" x="782" y="863" text-anchor="start">查这张卡的操作与回调编号</text>
<path class="v56-arrow" d="M 403 894 L 403 930" marker-end="url(#l2-debug-arr)"/>
<g data-node="true" id="l2-debug-recheck">
<rect class="v56-decision" x="80" y="930" width="646" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="958" text-anchor="start">07 · 复核通过了吗，交给车控了吗</text>
<text class="v56-node-sub" x="94" y="986" text-anchor="start">查是否重读车况、是否实际发出开灯请求</text>
</g>
<text class="v56-node-title" x="782" y="960" text-anchor="start">天气业务 / 车控</text>
<text class="v56-subtitle" x="782" y="989" text-anchor="start">区分条件变了、未下发、车控失败</text>
<path class="v56-arrow" d="M 403 1020 L 403 1056" marker-end="url(#l2-debug-arr)"/>
<g data-node="true" id="l2-debug-readback">
<rect class="v56-cloud" x="80" y="1056" width="646" height="90" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="94" y="1084" text-anchor="start">08 · 读回看到灯亮了吗</text>
<text class="v56-node-sub" x="94" y="1112" text-anchor="start">查看后雾灯实际状态，失败和未知分别记录</text>
</g>
<text class="v56-node-title" x="782" y="1086" text-anchor="start">车控 / 天气业务</text>
<text class="v56-subtitle" x="782" y="1115" text-anchor="start">比对执行回执与灯状态，再核对卡片结果</text>
<text class="v56-label" x="80" y="780" text-anchor="start">提醒了但灯没亮 · 从确认回调开始查</text>
<text class="v56-label" x="80" y="1179" text-anchor="start">用任务编号、命中时间和卡片回调编号，串起同一次触发。</text>
<path class="v56-rule" d="M 32 1206 L 1168 1206"/>
<text class="v56-node-title" x="32" y="1240" text-anchor="start">找到最早缺证据的一步，就从负责这一环的模块查。</text>
<rect data-decoration="true" class="v56-neutral" x="32.0" y="1266" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60.0" y="1280" text-anchor="start">灰：任务开关</text>
<rect data-decoration="true" class="v56-local" x="316.0" y="1266" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="344.0" y="1280" text-anchor="start">蓝：视觉运行与结果</text>
<rect data-decoration="true" class="v56-decision" x="600.0" y="1266" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="628.0" y="1280" text-anchor="start">黄：判断与复核</text>
<rect data-decoration="true" class="v56-cloud" x="884.0" y="1266" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="912.0" y="1280" text-anchor="start">绿：卡片、车控与读回</text>
</svg>
