<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#839bb6"/></marker></defs><rect x="0" y="0" width="1700" height="1120" rx="0" fill="#f5f8fc" stroke="#f5f8fc" stroke-width="1.5"/><rect x="0" y="0" width="1700" height="75" rx="0" fill="#193957" stroke="#193957" stroke-width="1.5"/><text x="28" y="48" font-size="26" fill="#fff" font-weight="600">豆包汽车 · 触发器场景配置</text><text x="1210" y="46" font-size="20" fill="#d5e5f5" font-weight="400">方案原型 · 非真实后台截图</text><rect x="0" y="75" width="225" height="1045" rx="0" fill="#fff" stroke="#dce5ef" stroke-width="1.5"/><text x="26" y="125" font-size="22" fill="#20364d" font-weight="500">场景管理</text><rect x="14" y="153" width="196" height="52" rx="6" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="1.5"/><text x="30" y="185" font-size="21" fill="#2469d6" font-weight="500">场景列表</text><text x="30" y="250" font-size="21" fill="#20364d" font-weight="400">触发记录</text><text x="30" y="315" font-size="21" fill="#20364d" font-weight="400">公共能力</text><text x="265" y="121" font-size="30" fill="#173a61" font-weight="600">P2 简单模式：先讲清何时检查，再讲检查什么</text><text x="265" y="159" font-size="19" fill="#667b91" font-weight="400">① 基础信息 → ② 启动检查 → ③ 判断条件 → ④ 命中处理与策略</text><rect x="260" y="185" width="1400" height="165" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="285" y="220" font-size="20" fill="#20364d" font-weight="500">① 场景名称</text><rect x="285" y="235" width="450" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="300" y="265" font-size="20" fill="#20364d" font-weight="400">识别充电设备后打开充电口盖</text><text x="760" y="220" font-size="20" fill="#20364d" font-weight="500">业务分类</text><rect x="760" y="235" width="290" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="775" y="265" font-size="20" fill="#20364d" font-weight="400">系统预设任务</text><text x="1080" y="220" font-size="20" fill="#20364d" font-weight="500">触发类型</text><rect x="1080" y="235" width="245" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="1095" y="265" font-size="20" fill="#20364d" font-weight="400">条件触发</text><text x="1370" y="264" font-size="20" fill="#2469d6" font-weight="500">简单模式</text><text x="285" y="328" font-size="18" fill="#667b91" font-weight="400">关联任务 / 渠道 / 车型与版本沿公共范围填写；环境由服务端展示。</text><rect x="260" y="375" width="1400" height="208" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="285" y="412" font-size="23" fill="#173a61" font-weight="600">② 启动事件：哪些更新会开始本次检查</text><text x="285" y="455" font-size="20" fill="#20364d" font-weight="500">动态条件信号</text><rect x="285" y="470" width="320" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="300" y="500" font-size="20" fill="#20364d" font-weight="400">档位状态</text><text x="630" y="455" font-size="20" fill="#20364d" font-weight="500">变化目标</text><rect x="630" y="470" width="400" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="645" y="500" font-size="20" fill="#20364d" font-weight="400">变更为 P 挡</text><rect x="1080" y="432" width="550" height="78" rx="6" fill="#eff5ff" stroke="#a8c8f4" stroke-width="1.5"/><text x="1096" y="464" font-size="18" fill="#315b8d" font-weight="400">存在动态条件：仅这些信号更新启动。</text><text x="1096" y="492" font-size="18" fill="#315b8d" font-weight="400">进入本次检查后，仍判断全部条件。</text><text x="285" y="560" font-size="19" fill="#405873" font-weight="400">实际启动信号：档位信号 ID（由条件配置生成；名称与 ID 按接入目录展示）。</text><rect x="260" y="607" width="1400" height="260" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="285" y="645" font-size="23" fill="#173a61" font-weight="600">③ 附加判断：静态条件可选，不代表整条规则可以为空</text><text x="285" y="692" font-size="20" fill="#20364d" font-weight="400">条件组关系</text><rect x="445" y="662" width="160" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="463" y="691" font-size="20" fill="#2469d6" font-weight="500">全部满足</text><rect x="622" y="662" width="160" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="640" y="691" font-size="20" fill="#2469d6" font-weight="500">任一满足</text><rect x="285" y="718" width="1315" height="45" rx="6" fill="#ffffff" stroke="#c7d5e4" stroke-width="1.5"/><text x="305" y="748" font-size="20" fill="#20364d" font-weight="400">本车任务状态 = 已开启    ｜    AI 主动服务 = 已开启    ｜    SOC ≤ 任务 PRD 阈值    ｜    充电口盖 = 关闭</text><rect x="285" y="789" width="155" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="303" y="818" font-size="20" fill="#2469d6" font-weight="500">＋ 添加条件</text><text x="465" y="818" font-size="19" fill="#667b91" font-weight="400">值缺失 / 未知 / 过时不作为满足；不把 SOC 百分比当续航里程。</text><rect x="260" y="892" width="1040" height="78" rx="6" fill="#eff5ff" stroke="#a8c8f4" stroke-width="1.5"/><text x="276" y="924" font-size="18" fill="#315b8d" font-weight="400">④ 命中处理：主动推荐带交互卡；先让 DT 检查充电设备，发现后再询问。</text><text x="276" y="952" font-size="18" fill="#315b8d" font-weight="400">静态条件不填：有合法启动方式仍可保存；启动与判断全部为空时，阻止保存。</text><rect x="1340" y="916" width="138" height="44" rx="6" fill="#2469d6" stroke="#2469d6" stroke-width="1.5"/><text x="1358" y="945" font-size="20" fill="#fff" font-weight="500">保存配置</text><rect x="1492" y="916" width="140" height="44" rx="6" fill="#fff" stroke="#b8c8db" stroke-width="1.5"/><text x="1510" y="945" font-size="20" fill="#2469d6" font-weight="500">返回列表</text><rect x="260" y="1010" width="1400" height="50" rx="6" fill="#fff3f1" stroke="#e6a29a" stroke-width="1.5"/><text x="276" y="1042" font-size="18" fill="#aa3e32" font-weight="400">错误示例：未选择启动方式且判断为空 → 高亮对应区域，说明“请至少配置一项合法启动 / 判断规则”。</text></svg>
