<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-label="准入一张表：新输入来了，看 Chat 现在在干什么"><title>准入一张表：新输入来了，看 Chat 现在在干什么</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1240" height="760" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">准入一张表：新输入来了，看 Chat 现在在干什么</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">行是 Chat 状态，列是新来的输入；格子里是处理方式（10/23 技术方案的准入表）</text><rect x="250" y="110" width="304" height="50" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="264" y="137" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">用户说话（P0）</text><rect x="570" y="110" width="304" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="584" y="137" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">主动建议、事件（P1，可合并）</text><rect x="890" y="110" width="304" height="50" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="904" y="137" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">工具结果（P1，单独）</text><rect x="30" y="174" width="204" height="134" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="201" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start">空闲</text><text x="44" y="226" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没在想，也没在说</text><rect x="30" y="324" width="204" height="134" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="351" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start">处理中</text><text x="44" y="376" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">DT 在想，用户还没看到字</text><rect x="30" y="474" width="204" height="134" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="501" font-size="17" fill="#5c4c12" font-weight="650" text-anchor="start">输出中</text><text x="44" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已出字，或车上还在播</text><rect x="250" y="174" width="304" height="134" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="264" y="201" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">立即交给 DT</text><text x="264" y="226" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">马上开始这一轮推理</text><rect x="570" y="174" width="304" height="134" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="584" y="201" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">立即交给 DT</text><text x="584" y="226" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">多条可合并的一起交</text><rect x="890" y="174" width="304" height="134" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="904" y="201" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">立即交给 DT</text><text x="904" y="226" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">单独一轮</text><rect x="570" y="324" width="304" height="134" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="584" y="351" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">排队</text><text x="584" y="376" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不打断当前这一轮</text><text x="584" y="397" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">轮到时和同类合并</text><rect x="890" y="324" width="304" height="134" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="904" y="351" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">排队</text><text x="904" y="376" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">轮到时单独处理</text><rect x="250" y="474" width="304" height="134" rx="8" fill="#fdeeee" stroke="#c45c5c" stroke-width="1.6"/><text x="264" y="501" font-size="15" fill="#6e2222" font-weight="650" text-anchor="start">车上先停播，再打断</text><text x="264" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只处理新话</text><text x="264" y="547" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已播 / 没播的内容和原输入</text><text x="264" y="568" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">作为背景交给 DT</text><rect x="570" y="474" width="304" height="134" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="584" y="501" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">排队</text><text x="584" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">等车上报“播完”</text><rect x="890" y="474" width="304" height="134" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="904" y="501" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">排队</text><text x="904" y="526" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">等车上报“播完”，单独处理</text><rect x="250" y="324" width="304" height="134" rx="8" fill="#fff" stroke="#c45c5c" stroke-width="1.6"/><text x="264" y="348" font-size="14" fill="#6e2222" font-weight="650" text-anchor="start">先看：这一轮工具发出去没有？</text><text x="264" y="378" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">没发 → 打断，旧话 + 新话合并重推</text><text x="264" y="406" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">已发 → 打断，只处理新话，</text><text x="264" y="428" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">旧话和已发工具当背景</text><rect x="30" y="640" width="1180" height="100" rx="8" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="44" y="667" font-size="15" fill="#5c4c12" font-weight="650" text-anchor="start">两条底线</text><text x="44" y="692" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">① 普通输入（P1）在“处理中”“输出中”都不抢；要抢必须定义成用户级（P0）。高优建议结构已预留，本期不启用。</text><text x="44" y="713" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">② 处理中 + P1 是否改成“合并重推”：PRD v0.5 写合并，技术方案准入表写排队，同一份方案的事件行和预跑章节又写合并——待确认。</text></g></svg>