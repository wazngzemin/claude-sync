<text x="1480" y="1041" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="1480" dy="0">弋途定时能力：登记</tspan><tspan x="1480" dy="34.8">完整时间 / 周期 / 执行内容</tspan></text>
<rect x="100.0" y="1005.0" width="440" height="110" rx="12" fill="#DCECF6" stroke="#678198" stroke-width="2"/>
<text x="320" y="1051" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="320" dy="0">动态 Advisor → 豆包触发器</tspan><tspan x="320" dy="34.8">条件 + 上汽范围 + 回调动作</tspan></text>
<rect x="-100" y="-100" width="200" height="200" fill="#DCEEE3" stroke="#678198" stroke-width="2" transform="translate(900,1410) scale(1.45,0.75) rotate(45)"/>
<text x="900" y="1418" font-size="24" fill="#1B3144" text-anchor="middle" font-weight="500"><tspan x="900" dy="0">必要登记成功？</tspan></text>
