<svg xmlns="http://www.w3.org/2000/svg" width="1246" height="3614" viewBox="0 0 1246 3614" role="img" aria-label="司机 Agent"><title>司机 Agent</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#52728b" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M848,1898 L848,2134" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="846" y="1994" width="100" height="44" rx="3" fill="#fff"/><text x="851" y="2018" font-size="15" fill="#435c70" font-weight="400"><tspan x="851" dy="0">完整请求</tspan></text><path d="M848,2316 L848,2552" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="846" y="2412" width="100" height="44" rx="3" fill="#fff"/><text x="851" y="2436" font-size="15" fill="#435c70" font-weight="400"><tspan x="851" dy="0">泊车描述</tspan></text><path d="M848,2734 L848,2970" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="846" y="2830" width="235" height="44" rx="3" fill="#fff"/><text x="851" y="2854" font-size="15" fill="#435c70" font-weight="400"><tspan x="851" dy="0">提槽结果 + 导航 Query</tspan></text><path d="M848,3152 L848,3388" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="846" y="3248" width="100" height="44" rx="3" fill="#fff"/><text x="851" y="3272" font-size="15" fill="#435c70" font-weight="400"><tspan x="851" dy="0">目的地候选</tspan></text><path d="M718,3388 L718,3326 L162,3326 L162,264 L310,264 L310,226" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="1785" width="130" height="44" rx="3" fill="#fff"/><text x="40" y="1809" font-size="15" fill="#435c70" font-weight="400"><tspan x="40" dy="0">地点与路线已确定</tspan></text><path d="M544,226 L544,264 L1113,264 L1113,818 L946,818 L946,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1111" y="531" width="100" height="44" rx="3" fill="#fff"/><text x="1116" y="555" font-size="15" fill="#435c70" font-weight="400"><tspan x="1116" dy="0">成功匹配</tspan></text><path d="M466,226 L466,274 L848,274 L848,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="706" y="322" width="145" height="44" rx="3" fill="#fff"/><text x="711" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="711" dy="0">无图，不能直达车位</tspan></text><path d="M388,226 L388,462" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="231" y="322" width="160" height="44" rx="3" fill="#fff"/><text x="236" y="346" font-size="15" fill="#435c70" font-weight="400"><tspan x="236" dy="0">有图，目标车位不匹配</tspan></text><path d="M848,644 L848,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="721" y="740" width="130" height="44" rx="3" fill="#fff"/><text x="726" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="726" dy="0">用户同意替代任务</tspan></text><path d="M388,644 L388,818 L751,818 L751,880" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="246" y="740" width="145" height="44" rx="3" fill="#fff"/><text x="251" y="764" font-size="15" fill="#435c70" font-weight="400"><tspan x="251" dy="0">用户在界面选定车位</tspan></text><path d="M848,1062 L848,1298" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="846" y="1158" width="100" height="44" rx="3" fill="#fff"/><text x="851" y="1182" font-size="15" fill="#435c70" font-weight="400"><tspan x="851" dy="0">实际执行反馈</tspan></text><path d="M848,1480 L848,1716" fill="none" stroke="#52728b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="846" y="1576" width="100" height="44" rx="3" fill="#fff"/><text x="851" y="1600" font-size="15" fill="#435c70" font-weight="400"><tspan x="851" dy="0">用户改变任务</tspan></text><a href="#modul