<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="e2-fc-translate" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="e2-fc-translate-title e2-fc-translate-desc">
<title id="e2-fc-translate-title">车控的两步翻译</title><desc id="e2-fc-translate-desc">Planner 写要做什么；云端车控模型把这句话翻成函数和参数。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="e2-fc-translate-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">车控的两步翻译</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">Planner 写要做什么；云端车控模型把这句话翻成函数和参数。</text>
<g data-node="true"><rect class="v56-neutral v56-pending" x="280" y="112" width="535" height="112" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="294" y="139" text-anchor="start">上汽：按这辆车上报的动态参数</text>
<text class="v56-node-sub" x="294" y="164" text-anchor="start">自装应用、座椅位置名、联系人</text>
<text class="v56-node-sub" x="294" y="185" text-anchor="start">服务端已做好；车端上报陆续接入</text>
</g>
<path class="v56-arrow" d="M 390 224 L 390 300" marker-end="url(#e2-fc-translate-arr)"/>
<text class="v56-label" x="407" y="268" text-anchor="start">按车取值</text>
<g data-node="true"><rect class="v56-neutral" x="32" y="300" width="200" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="327" text-anchor="start">Planner 写的话</text>
<text class="v56-node-sub" x="46" y="352" text-anchor="start">打开空调，</text>
<text class="v56-node-sub" x="46" y="373" text-anchor="start">风量调高一档</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="280" y="300" width="220" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="294" y="327" text-anchor="start">云端车控模型</text>
<text class="v56-node-sub" x="294" y="352" text-anchor="start">赛力斯：先用微调模型</text>
<text class="v56-node-sub" x="294" y="373" text-anchor="start">输出函数和参数</text>
</g>
<g data-node="true"><rect class="v56-decision" x="555" y="300" width="260" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="569" y="327" text-anchor="start">函数和参数合规吗？</text>
<text class="v56-node-sub" x="569" y="352" text-anchor="start">函数在白名单里，</text>
<text class="v56-node-sub" x="569" y="373" text-anchor="start">且参数没越界？</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="555" y="475" width="260" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="569" y="502" text-anchor="start">用模型给出的函数</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="555" y="615" width="260" height="88" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="569" y="642" text-anchor="start">用检索出来的候选</text>
</g>
<g data-node="true"><rect class="v56-cloud" x="920" y="300" width="248" height="130" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="934" y="327" text-anchor="start">输出两个函数和参数</text>
<text class="v56-node-sub" x="934" y="352" text-anchor="start">空调开关：打开</text>
<text class="v56-node-sub" x="934" y="373" text-anchor="start">风量调节：调高一档</text>
</g>
<g data-node="true"><rect class="v56-neutral" x="920" y="530" width="248" height="100" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="934" y="557" text-anchor="start">长连接下发</text>
<text class="v56-node-sub" x="934" y="582" text-anchor="start">把函数列表发给这辆车</text>
</g>
<path class="v56-arrow" d="M 232 365 L 280 365" marker-end="url(#e2-fc-translate-arr)"/>
<path class="v56-arrow" d="M 500 365 L 555 365" marker-end="url(#e2-fc-translate-arr)"/>
<path class="v56-arrow" d="M 685 430 L 685 475" marker-end="url(#e2-fc-translate-arr)"/>
<text class="v56-label" x="700" y="461" text-anchor="start">是</text>
<path class="v56-arrow" d="M 555 395 L 525 395 L 525 659 L 555 659" marker-end="url(#e2-fc-translate-arr)"/>
<text class="v56-label" x="496" y="586" text-anchor="start">否</text>
<path class="v56-arrow" d="M 815 519 L 870 519 L 870 365 L 920 365" marker-end="url(#e2-fc-translate-arr)"/>
<path class="v56-arrow" d="M 815 659 L 870 659 L 870 519" marker-end="url(#e2-fc-translate-arr)"/>
<path class="v56-arrow" d="M 1044 430 L 1044 530" marker-end="url(#e2-fc-translate-arr)"/>
<text class="v56-label" x="1059" y="481" text-anchor="start">下一步</text>
<text class="v56-label" x="32" y="756" text-anchor="start">Planner 管理解，车控模型管函数和参数。</text>
<rect class="v56-neutral" x="32" y="793" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="807" text-anchor="start">灰：输入与下发</text>
<rect class="v56-cloud" x="267" y="793" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="295" y="807" text-anchor="start">绿：云端翻译</text>
<rect class="v56-decision" x="502" y="793" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="530" y="807" text-anchor="start">黄：合规判断</text>
<rect class="v56-neutral v56-pending" x="737" y="793" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="765" y="807" text-anchor="start">虚线：车端上报陆续接入</text>
</svg>
