<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="“记住我家”：先把地点查准再记，以后“导航回家”不用再选点"><title>“记住我家”：先把地点查准再记，以后“导航回家”不用再选点</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#476c8d" stroke-width="1.8"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1200" height="800" fill="#ffffff"/><text x="32" y="44" font-size="24" fill="#16344a" font-weight="650" text-anchor="start">“记住我家”：先把地点查准再记，以后“导航回家”不用再选点</text><text x="32" y="72" font-size="14" fill="#5d7183" font-weight="400" text-anchor="start">《豆包记忆和车机记忆打通方案》需求 1：家、公司、常用地址</text><rect x="30" y="92" width="1140" height="330" rx="10" fill="#fdf2e6" fill-opacity=".35" stroke="#c8873a" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="116" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">写入：“记下我家是麦当劳”</text><rect x="50" y="140" width="200" height="76" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="64" y="167" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">用户说</text><text x="64" y="192" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">记下我家是麦当劳</text><path d="M250,178 L280,178" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><polygon points="390,128.0 500.0,178 390,228.0 280.0,178" fill="#fffbe8" stroke="#cdb35a" stroke-width="1.6"/><text x="390" y="173" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">DT 判断：</text><text x="390" y="193" font-size="14" fill="#5c4c12" font-weight="600" text-anchor="middle">地点名称够完整吗？</text><path d="M500,178 L900,178" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="596.2" y="157.0" width="207.6" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="700.0" y="173.0" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">有，例如“上海市麦当劳 AAA”</text><rect x="900" y="128" width="250" height="140" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="914" y="155" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">记忆工具写入</text><text x="914" y="180" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">家 = 麦当劳 AAA</text><text x="914" y="201" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">城市 = 上海市（必填）</text><text x="914" y="222" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">完整地点名称（必填）</text><text x="914" y="243" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">地点编号、经纬度、地址（选填）</text><path d="M390,228 L390,330 L450,330" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="372.65" y="270" width="34.7" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="390" y="286" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">没有</text><rect x="450" y="290" width="230" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="464" y="317" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">先搜一下这个地点</text><text x="464" y="342" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">按“导航去麦当劳”搜</text><text x="464" y="363" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">列出几家候选</text><path d="M680,336 L720,336" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="720" y="290" width="160" height="92" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="734" y="317" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">用户选点</text><text x="734" y="342" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“第二个”</text><path d="M880,336 L1025,336 L1025,268" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="910.45" y="315.0" width="84.1" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/><text x="952.5" y="331.0" font-size="13" fill="#3c5a73" font-weight="500" text-anchor="middle">拿到完整名称</text><rect x="30" y="450" width="1140" height="170" rx="10" fill="#eaf6ef" fill-opacity=".35" stroke="#4a9670" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="44" y="474" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">使用：“导航回家”</text><rect x="50" y="500" width="190" height="80" rx="8" fill="#ffffff" stroke="#9fb2c2" stroke-width="1.6"/><text x="64" y="527" font-size="15" fill="#22384a" font-weight="650" text-anchor="start">用户说</text><text x="64" y="552" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">导航回家</text><rect x="280" y="500" width="230" height="92" rx="8" fill="#fdf2e6" stroke="#c8873a" stroke-width="1.6"/><text x="294" y="527" font-size="15" fill="#6a4314" font-weight="650" text-anchor="start">检索记忆</text><text x="294" y="552" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">家 = 上海市麦当劳 AAA</text><rect x="550" y="500" width="320" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="564" y="527" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">DT 改写指令</text><text x="564" y="552" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">“导航去上海市麦当劳 AAA，</text><text x="564" y="573" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">直接开始导航”</text><rect x="910" y="500" width="240" height="92" rx="8" fill="#eaf6ef" stroke="#4a9670" stroke-width="1.6"/><text x="924" y="527" font-size="15" fill="#1d4b35" font-weight="650" text-anchor="start">导航工具直接发起</text><text x="924" y="552" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">不用二次选点</text><path d="M240,545 L280,545" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M510,545 L550,545" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><path d="M870,545 L910,545" fill="none" stroke="#476c8d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="660" width="370" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="44" y="687" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">导航页里的“家”按钮</text><text x="44" y="712" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">只显示记忆里的地址；点一下</text><text x="44" y="733" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">= 模拟用户说“导航回家”</text><rect x="415" y="660" width="370" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="429" y="687" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">记忆开关关着</text><text x="429" y="712" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">方案文档：提示先打开</text><text x="429" y="733" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">会上有人主张照常记，未定</text><rect x="800" y="660" width="370" height="110" rx="8" fill="#f6f7f8" stroke="#98a3ad" stroke-width="1.6" stroke-dasharray="6 4"/><text x="814" y="687" font-size="15" fill="#4b5560" font-weight="650" text-anchor="start">离线怎么办</text><text x="814" y="712" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">有网时按人脸身份把地址</text><text x="814" y="733" font-size="14" fill="#33495b" font-weight="400" text-anchor="start">同步到车上（11/4 讨论中）</text></g></svg>