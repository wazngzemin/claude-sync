云 FC；需要情景、记忆或多步依赖的进入规划。"],["原有职责细节","未拒识且满足约定意图；命中 → 云端 FC；否则 Planner"],["这一步怎么做","PRD 的云端基线为：未拒识、仲裁为车控且属于约定意图时交 FC；其余有效请求交 Planner。不要把历史“句法 RAG→情景 RAG→Planner”概括直接当成所有版本的固定串行拓扑。"],["放进同一个例子","本例要先知道昨天去的是哪家，再规划路线；降温还需要车况和乘员约束。这些依赖必须由复杂链保留，不是按关键词分成两个互不相干的命令。"],["异常与交接","简单与复杂的边界、六类意图清单、云端 FC 所在位置，要以目标车型的当前配置和 Trace 核验。"],["产品要问清","条件、记忆、跨工具依赖、情景约束，各有哪些容易被简单模型过召的反例？"]],"learn":["route"],"refs":"B,S11","detail":"在未拒识后，按当前版本支持的意图分流。明确且可直接处理的指令可走云 FC；需要情景、记忆或多步依赖的进入规划。","oldId":"R3","layout":{"title":["9.3 车控 + 指定意图？"],"body":["未拒识且满足约定意图","命中 → 云端 FC；否则 Planner"],"detail":["在未拒识后，按当前版本支持的意图分流。明确且可直接处理的","指令可走云 FC；需要情景、记忆或多步依赖的进入规划。"],"height":319}},{"id":"R4","group":"route","x":2290,"y":5513,"w":760,"h":390,"title":"9.4 云端 FC 理解","body":["明确指令 → 原子动作候选","送端云仲裁，不能重复执行"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","云 FC 将指令变成动作候选，仍需端云仲裁、能力检查和执行反馈，不能模型一出参就宣称控车成功。"],["原有职责细节","明确指令 → 原子动作候选；送端云仲裁，不能重复执行"],["这一步怎么做","PRD 的云端基线为：未拒识、仲裁为车控且属于约定意图时交 FC；其余有效请求交 Planner。不要把历史“句法 RAG→情景 RAG→Planner”概括直接当成所有版本的固定串行拓扑。"],["放进同一个例子","本例要先知道昨天去的是哪家，再规划路线；降温还需要车况和乘员约束。这些依赖必须由复杂链保留，不是按关键词分成两个互不相干的命令。"],["异常与交接","简单与复杂的边界、六类意图清单、云端 FC 所在位置，要以目标车型的当前配置和 Trace 核验。"],["产品要问清","条件、记忆、跨工具依赖、情景约束，各有哪些容易被简单模型过召的反例？"]],"learn":["route"],"refs":"B,S11","detail":"云 FC 将指令变成动作候选，仍需端云仲裁、能力检查和执行反馈，不能模型一出参就宣称控车成功。","oldId":"R4","layout":{"title":["9.4 云端 FC 理解"],"body":["明确指令 → 原子动作候选","送端云仲裁，不能重复执行"],"detail":["云 FC 将指令变成动作候选，仍需端云仲裁、能力检查和执行反","馈，不能模型一出参就宣称控车成功。"],"height":319}},{"id":"R5","group":"route","x":2290,"y":6041,"w":760,"h":390,"title":"9.5 拒识内容入日志","body":["作为事件 / 对话背景","不是直接给助手的执行指令"],"role":"step","tone":"gray","future":false,"kind":"step","paras":[["这个小模块做什么","允许留存的拒识内容可成为背景事件，但不是直接命令。是否生产、存多久、是否进入模型，应由事件定义与隐私范围约束。"],["原有职责细节","作为事件 / 对话背景；不是直接给助手的执行指令"],["这一步怎么做","云端拒识模块判断输入是否应作为对助手的请求。PRD 区分“明确拒识”和“拒识超时”：拒识内容进 Context 事件日志，供背景感知；拒识超时按该 PRD 进入 Director。"],["放进同一个例子","乘员聊天说“昨天那个游泳馆太冷了”，不自动等于要求导航。被拒识的内容可以是背景信息，但不能直接按指令执行。"],["异常与交接","拒识错误可能导致漏响应或乱执行。拒识超时也不等于整个云请求超时，两种异常的后续路由不同。"],["产品要问清","某条 badcase 是被拒识了、意图判错了，还是已经进 Planner 后才理解错了？"]],"learn":["route"],"refs":"B,S11","detail":"允许留存的拒识内容可成为背景事件，但不是直接命令。是否生产、存多久、是否进入模型，应由事件定义与隐私范围约束。","oldId":"R5","layout":{"title":["9.5 拒识内容入日志"],"body":["作为事件 / 对话背景","不是直接给助手的执行指令"],"detail":["允许留存的拒识内容可成为背景事件，但不是直接命令。是否生","产、存多久、是否进入模型，应由事件定义与隐私范围约束。"],"height":319}},{"id":"R6","group":"route","x":3130,"y":6041,"w":760,"h":390,"title":"9.6 复杂请求转 Planner","body":["条件 / 持续 / 记忆 / 情景","需要推理、查信息或跨工具"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","把复杂需求交给统一输入入口，保留原始诉求与已有状态。Planner/Director 是同一决策职责，不是两个模型先后接力。"],["原有职责细节","条件 / 持续 / 记忆 / 情景；需要推理、查信息或跨工具"],["这一步怎么做","PRD 的云端基线为：未拒识、仲裁为车控且属于约定意图时交 FC；其余有效请求交 Planner。不要把历史“句法 RAG→情景 RAG→Planner”概括直接当成所有版本的固定串行拓扑。"],["放进同一个例子","本例要先知道昨天去的是哪家，再规划路线；降温还需要车况和乘员约束。这些依赖必须由复杂链保留，不是按关键词分成两个互不相干的命令。"],["异常与交接","简单与复杂的边界、六类意图清单、云端 FC 所在位置，要以目标车型的当前配置和 Trace 核验。"],["产品要问清","条件、记忆、跨工具依赖、情景约束，各有哪些容易被简单模型过召的反例？"]],"learn":["route"],"refs":"B,S11","detail":"把复杂需求交给统一输入入口，保留原始诉求与已有状态。Planner/Director 是同一决策职责，不是两个模型先后接力。","oldId":"R6","layout":{"title":["9.6 复杂请求转 Planner"],"body":["条件 / 持续 / 记忆 / 情景","需要推理、查信息或跨工具"],"detail":["把复杂需求交给统一输入入口，保留原始诉求与已有状态。Plan","ner/Director 是同一决策职责，不是两个模型先后接力。"],"height":319}},{"id":"R7","group":"route","x":3130,"y":6569,"w":760,"h":390,"title":"9.7 云端无结果？","body":["超时且端候选可用 → 端兜底","都无结果 → 明确失败/再问"],"role":"decision","tone":"blue","future":false,"kind":"decision","paras":[["这个小模块做什么","云端超时不应无限等待。仅当端候选仍有效且获准执行才兜底；都无结果时给失败或重说出口，并抑制迟到的重复执行。"],["原有职责细节","超时且端候选可用 → 端兜底；都无结果 → 明确失败/再问"],["这一步怎么做","按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，需要运行日志证明。"],["放进同一个例子","本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。"],["异常与交接","端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能声称所有需要记忆或联网的能力仍能离线完成。"],["产品要问清","同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎样证明只执行一次？"]],"learn":["route"],"refs":"B,S11","detail":"云端超时不应无限等待。仅当端候选仍有效且获准执行才兜底；都无结果时给失败或重说出口，并抑制迟到的重复执行。","oldId":"R7","layout":{"title":["9.7 云端无结果？"],"body":["超时且端候选可用 → 端兜底","都无结果 → 明确失败/再问"],"detail":["云端超时不应无限等待。仅当端候选仍有效且获准执行才兜底；","都无结果时给失败或重说出口，并抑制迟到的重复执行。"],"height":319}},{"id":"R8","group":"route","x":2290,"y":6569,"w":760,"h":390,"title":"9.8 路由结果可追踪","body":["命中路径、候选、等待时长","以实车 Trace 核对车型策略"],"role":"step","tone":"blue","future":false,"kind":"check","paras":[["这个小模块做什么","保留选路原因、端云候选、最终执行方和等待时长。它是可观测记录，不是每一轮都要再做一次模型判断。"],["原有职责细节","命中路径、候选、等待时长；以实车 Trace 核对车型策略"],["这一步怎么做","按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，需要运行日志证明。"],["放进同一个例子","本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。"],["异常与交接","端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能声称所有需要记忆或联网的能力仍能离线完成。"],["产品要问清","同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎样证明只执行一次？"]],"learn":["route"],"refs":"B,S11","detail":"保留选路原因、端云候选、最终执行方和等待时长。它是可观测记录，不是每一轮都要再做一次模型判断。","oldId":"R8","layout":{"title":["9.8 路由结果可追踪"],"body":["命中路径、候选、等待时长","以实车 Trace 核对车型策略"],"detail":["保留选路原因、端云候选、最终执行方和等待时长。它是可观测","记录，不是每一轮都要再做一次模型判断。"],"height":319}},{"id":"X1","group":"context","x":6370,"y":4985,"w":760,"h":390,"title":"19.1 接入本轮事件","body":["user_query / advisor","tool_feedback / event"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","只接收经过输入节奏管理准入的本轮输入，并保留来源类型。工具结果是观察事实，不是另一个用户重新发出的命令。"],["原有职责细节","user_query / advisor；tool_feedback / event"],["这一步怎么做","入口接收用户 Query、Advisor 建议、工具反馈，部分新版输入还包含事件。三者含义不同：用户在提目标，Advisor 在建议，工具在汇报执行或查询结果，不能都当成用户重新下令。"],["放进同一个例子","第一轮收到主驾 Query；查完记忆后再进来的，是“这位用户昨天去了某游泳馆”的工具结果，不是用户又说了一遍需求。"],["异常与交接","同名工具并发、重试和迟到反馈必须能够回到正确动作与目标。当前 SP 的简化反馈字段不足以证明完整的工程关联协议。"],["产品要问清","能否查到本轮 input 类型，以及它属于哪位用户、哪个未完成目标、哪次调用？"]],"learn":["context"],"refs":"B,S09,S10,S12","detail":"只接收经过输入节奏管理准入的本轮输入，并保留来源类型。工具结果是观察事实，不是另一个用户重新发出的命令。","oldId":"X1","layout":{"title":["19.1 接入本轮事件"],"body":["user_query / advisor","tool_feedback / event"],"detail":["只接收经过输入节奏管理准入的本轮输入，并保留来源类型。工","具结果是观察事实，不是另一个用户重新发出的命令。"],"height":319}},{"id":"X2","group":"context","x":7210,"y":4985,"w":760,"h":390,"title":"21.1 车况、感知与事件","body":["端侧全量/增量状态、时间","手动操作、导航、媒体状态"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","按本轮需要取得车辆状态、视觉描述和事件事实。分别记录来源时间，当前状态快照不能替代“刚才发生过什么”的历史事件。"],["原有职责细节","端侧全量/增量状态、时间；手动操作、导航、媒体状态"],["这一步怎么做","入口把相关端状态、默认情景感知、用户记忆及当前目标等信息整理给模型。状态要区分来源、时间和未知值；当前车况、昨天的行程、说明书知识，不能混成一种事实。"],["放进同一个例子","如果空调已经开着、用户不喜欢风直吹，降温方案就不能机械地“开空调＋最大风”。如果没带入昨天的地点，就需要调用记忆查询工具。"],["异常与交接","“没有这个字段”不等于数值为零，也不等于设备关闭。旧车况和新手动操作冲突时，必须按有效来源与时间判断。"],["产品要问清","哪些事实是本场景做对所必需的？是哪一步没采到、没传到、被过滤或被旧历史覆盖？"],["这一步怎么做","车辆信号、应用状态、用户操作、默认感知等在端侧形成状态与事件，再按协议上报云端并被 Context 使用。缓存表示已保存的已知事实，不是保证仍然最新的事实。"],["放进同一个例子","用户手动关了空调，应产生相应状态或事件；否则模型可能继续使用刚才“空调打开成功”的历史。"],["异常与交接","全量、增量、轮询和变化上报的使用范围需逐个信号确认。丢包、时钟差、乱序必须反映在新鲜度判断里。"],["产品要问清","每个关键字段来自哪里、多久更新、缺失怎么表达？云端如何知道值已经过期？"],["这一步怎么做","默认视觉可提供此刻舱内外观察；用户记忆提供归属于某人的经历与偏好；事件日志记录交互和变化。不同资料对“现在”“过去”“长期偏好”的含义不同。"],["放进同一个例子","宝宝正在后排睡觉是当前观察；用户不喜欢直吹是偏好；昨天去某游泳馆是历史经历。三者可能共同影响这一次规划。"],["异常与交接","观察不可见、记忆查无结果、历史无记录，都不应被解释为“没有发生”或“用户没有这个偏好”。"],["产品要问清","模型的某句判断究竟用了哪类证据？是否把历史状态误当当前事实？"]],"learn":["context"],"refs":"B,S09,S10,S12","detail":"按本轮需要取得车辆状态、视觉描述和事件事实。分别记录来源时间，当前状态快照不能替代“刚才发生过什么”的历史事件。","oldId":"X2","layout":{"title":["21.1 车况、感知与事件"],"body":["端侧全量/增量状态、时间","手动操作、导航、媒体状态"],"detail":["按本轮需要取得车辆状态、视觉描述和事件事实。分别记录来源","时间，当前状态快照不能替代“刚才发生过什么”的历史事件。"],"height":319}},{"id":"X3","group":"context","x":7210,"y":5513,"w":760,"h":390,"title":"21.2 记忆与当前目标","body":["用户身份/偏好/历史事实","旧 Goal List / 新 TaskView"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","按正确身份取得适用记忆与未完成目标。旧 Goal 和新 TaskView 由所选架构提供，不应同时创建或任意互换。"],["原有职责细节","用户身份/偏好/历史事实；旧 Goal List / 新 TaskView"],["这一步怎么做","入口把相关端状态、默认情景感知、用户记忆及当前目标等信息整理给模型。状态要区分来源、时间和未知值；当前车况、昨天的行程、说明书知识，不能混成一种事实。"],["放进同一个例子","如果空调已经开着、用户不喜欢风直吹，降温方案就不能机械地“开空调＋最大风”。如果没带入昨天的地点，就需要调用记忆查询工具。"],["异常与交接","“没有这个字段”不等于数值为零，也不等于设备关闭。旧车况和新手动操作冲突时，必须按有效来源与时间判断。"],["产品要问清","哪些事实是本场景做对所必需的？是哪一步没采到、没传到、被过滤或被旧历史覆盖？"],["这一步怎么做","默认视觉可提供此刻舱内外观察；用户记忆提供归属于某人的经历与偏好；事件日志记录交互和变化。不同资料对“现在”“过去”“长期偏好”的含义不同。"],["放进同一个例子","宝宝正在后排睡觉是当前观察；用户不喜欢直吹是偏好；昨天去某游泳馆是历史经历。三者可能共同影响这一次规划。"],["异常与交接","观察不可见、记忆查无结果、历史无记录，都不应被解释为“没有发生”或“用户没有这个偏好”。"],["产品要问清","模型的某句判断究竟用了哪类证据？是否把历史状态误当当前事实？"]],"learn":["context"],"refs":"B,S09,S10,S12","detail":"按正确身份取得适用记忆与未完成目标。旧 Goal 和新 TaskView 由所选架构提供，不应同时创建或任意互换。","oldId":"X3","layout":{"title":["21.2 记忆与当前目标"],"body":["用户身份/偏好/历史事实","旧 Goal List / 新 TaskView"],"detail":["按正确身份取得适用记忆与未完成目标。旧 Goal 和新 TaskVi","ew 由所选架构提供，不应同时创建或任意互换。"],"height":319}},{"id":"X4","group":"context","x":6370,"y":5513,"w":760,"h":390,"title":"21.3 对话历史","body":["近轮保留动作和工具结果","远区压缩方案须保留未完事项"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","保留当前对话目标及必要的动作/结果关联。压缩远轮历史时不能丢掉未完成事项，也不能把旧成功反馈当本轮执行。"],["原有职责细节","近轮保留动作和工具结果；远区压缩方案须保留未完事项"],["这一步怎么做","历史帮助理解“那家”“再低一点”等省略表达；本轮动态示例只为当前 Query 提供参考，不等于真实执行结果。先澄清或改写省略信息再检索示例，与把全历史直接作为示例，是两回事。"],["放进同一个例子","用户后来只说“换另一条”，需要知道上一轮选的是哪条路线。历史里必须保留影响本目标的选择和未完成事项，而不是只剩助手说过“好的”。"],["异常与交接","压缩远区历史可以省输入，但不能删除未完成动作、失败反馈或用户否定。重复明确车控是新请求，不能用历史成功代替本轮执行。"],["产品要问清","有无示例对照实验是否改善保留测试集？是否把错误示例、其他车企能力或过时工具名带进来了？"]],"learn":["context"],"refs":"B,S09,S10,S12","detail":"保留当前对话目标及必要的动作/结果关联。压缩远轮历史时不能丢掉未完成事项，也不能把旧成功反馈当本轮执行。","oldId":"X4","layout":{"title":["21.3 对话历史"],"body":["近轮保留动作和工具结果","远区压缩方案须保留未完事项"],"detail":["保留当前对话目标及必要的动作/结果关联。压缩远轮历史时不","能丢掉未完成事项，也不能把旧成功反馈当本轮执行。"],"height":319}},{"id":"X5","group":"context","x":6370,"y":6041,"w":760,"h":390,"title":"19.2 有效工具与示例","body":["按车型/环境/版本装配能力","动态示例、场景 knowhow"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","取本车型与环境真正可用的工具定义、场景知识及本轮检索示例。参考例子不是真实状态，更不能复制其中的人名、地点或执行结果。"],["原有职责细节","按车型/环境/版本装配能力；动态示例、场景 knowhow"],["这一步怎么做","历史帮助理解“那家”“再低一点”等省略表达；本轮动态示例只为当前 Query 提供参考，不等于真实执行结果。先澄清或改写省略信息再检索示例，与把全历史直接作为示例，是两回事。"],["放进同一个例子","用户后来只说“换另一条”，需要知道上一轮选的是哪条路线。历史里必须保留影响本目标的选择和未完成事项，而不是只剩助手说过“好的”。"],["异常与交接","压缩远区历史可以省输入，但不能删除未完成动作、失败反馈或用户否定。重复明确车控是新请求，不能用历史成功代替本轮执行。"],["产品要问清","有无示例对照实验是否改善保留测试集？是否把错误示例、其他车企能力或过时工具名带进来了？"],["这一步怎么做","系统规则（SP）说明角色、可用工具和输出要求；本轮与历史输入（UP）提供事实和事件。车型、环境、工具版本、场景 knowhow 与动态变量共同决定模型可做什么。"],["放进同一个例子","模型现在应清楚：用户要降温和去某个历史地点；已知车况有哪些；哪些信息还缺；本轮能调用哪些工具。之后才进入 04 规划。"],["异常与交接","本地 SP 的 27 个工具只是定义快照；不能据此说每台车线上都开放 27 个。缺事实应查或问，不能用漂亮的提示词替代真实数据。"],["产品要问清","你能否拿到这一次模型实际看到的完整输入？如果换一份正确上下文，错误是否随之消失？"],["这一步怎么做","调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 Task 接口不混算成第 28 个线上工具。"],["放进同一个例子","查记忆使用 user_memory_search；历史地址确定后使用 route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工具。"],["异常与交接","SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型不支持，应有可解释失败，而不是静默丢弃。"],["产品要问清","能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表逐项对齐？"]],"learn":["context"],"refs":"B,S09,S10,S12","detail":"取本车型与环境真正可用的工具定义、场景知识及本轮检索示例。参考例子不是真实状态，更不能复制其中的人名、地点或执行结果。","oldId":"X5","layout":{"title":["19.2 有效工具与示例"],"body":["按车型/环境/版本装配能力","动态示例、场景 knowhow"],"detail":["取本车型与环境真正可用的工具定义、场景知识及本轮检索示例","。参考例子不是真实状态，更不能复制其中的人名、地点或执行","结果。"],"height":355}},{"id":"X6","group":"context","x":7210,"y":6041,"w":760,"h":390,"title":"21.4 筛选与新鲜度","body":["身份正确？状态过期/冲突？","缺失不补造；按需查工具"],"role":"decision","tone":"blue","future":false,"kind":"decision","paras":[["这个小模块做什么","筛选相关性、身份、时效与冲突，必要时标记未知或再查询。并非把能拿到的数据全塞给模型就更好。"],["原有职责细节","身份正确？状态过期/冲突？；缺失不补造；按需查工具"],["这一步怎么做","入口把相关端状态、默认情景感知、用户记忆及当前目标等信息整理给模型。状态要区分来源、时间和未知值；当前车况、昨天的行程、说明书知识，不能混成一种事实。"],["放进同一个例子","如果空调已经开着、用户不喜欢风直吹，降温方案就不能机械地“开空调＋最大风”。如果没带入昨天的地点，就需要调用记忆查询工具。"],["异常与交接","“没有这个字段”不等于数值为零，也不等于设备关闭。旧车况和新手动操作冲突时，必须按有效来源与时间判断。"],["产品要问清","哪些事实是本场景做对所必需的？是哪一步没采到、没传到、被过滤或被旧历史覆盖？"],["这一步怎么做","历史帮助理解“那家”“再低一点”等省略表达；本轮动态示例只为当前 Query 提供参考，不等于真实执行结果。先澄清或改写省略信息再检索示例，与把全历史直接作为示例，是两回事。"],["放进同一个例子","用户后来只说“换另一条”，需要知道上一轮选的是哪条路线。历史里必须保留影响本目标的选择和未完成事项，而不是只剩助手说过“好的”。"],["异常与交接","压缩远区历史可以省输入，但不能删除未完成动作、失败反馈或用户否定。重复明确车控是新请求，不能用历史成功代替本轮执行。"],["产品要问清","有无示例对照实验是否改善保留测试集？是否把错误示例、其他车企能力或过时工具名带进来了？"]],"learn":["context"],"refs":"B,S09,S10,S12","detail":"筛选相关性、身份、时效与冲突，必要时标记未知或再查询。并非把能拿到的数据全塞给模型就更好。","oldId":"X6","layout":{"title":["21.4 筛选与新鲜度"],"body":["身份正确？状态过期/冲突？","缺失不补造；按需查工具"],"detail":["筛选相关性、身份、时效与冲突，必要时标记未知或再查询。并","非把能拿到的数据全塞给模型就更好。"],"height":319}},{"id":"X7","group":"context","x":7210,"y":6569,"w":760,"h":390,"title":"19.3 组装模型输入","body":["系统规则 SP + 当前输入 UP","带上本轮事实、历史与可用工具"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","组装系统规则与工具定义 SP、当前请求及历史 UP。留存本轮实际输入，才能重放模型为何做出这一决定。"],["原有职责细节","系统规则 SP + 当前输入 UP；带上本轮事实、历史与可用工具"],["这一步怎么做","系统规则（SP）说明角色、可用工具和输出要求；本轮与历史输入（UP）提供事实和事件。车型、环境、工具版本、场景 knowhow 与动态变量共同决定模型可做什么。"],["放进同一个例子","模型现在应清楚：用户要降温和去某个历史地点；已知车况有哪些；哪些信息还缺；本轮能调用哪些工具。之后才进入 04 规划。"],["异常与交接","本地 SP 的 27 个工具只是定义快照；不能据此说每台车线上都开放 27 个。缺事实应查或问，不能用漂亮的提示词替代真实数据。"],["产品要问清","你能否拿到这一次模型实际看到的完整输入？如果换一份正确上下文，错误是否随之消失？"]],"learn":["context"],"refs":"B,S09,S10,S12","detail":"组装系统规则与工具定义 SP、当前请求及历史 UP。留存本轮实际输入，才能重放模型为何做出这一决定。","oldId":"X7","layout":{"title":["19.3 组装模型输入"],"body":["系统规则 SP + 当前输入 UP","带上本轮事实、历史与可用工具"],"detail":["组装系统规则与工具定义 SP、当前请求及历史 UP。留存本轮","实际输入，才能重放模型为何做出这一决定。"],"height":319}},{"id":"X8","group":"context","x":6370,"y":6569,"w":760,"h":390,"title":"21.5 形成下一轮上下文","body":["收工具反馈和手动操作事件","保留部分完成与待选结果"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","把新结果与交互事件写回相应上下文，保留已完成与未完成部分。下一轮仍由同一 Planner 继续判断，不从零重做。"],["原有职责细节","收工具反馈和手动操作事件；保留部分完成与待选结果"],["这一步怎么做","Context 需要反映新结果、用户选择和实际车况。已经完成的子目标保留证据，尚未完成的继续存在。历史成功也不能覆盖用户刚刚手动改变的状态。"],["放进同一个例子","查到昨天去的游泳馆后，新增的是一个可用地点；导航还没执行。空调成功后如果用户手动关掉，也必须记录新车态。"],["异常与交接","“工具调用过”与“目标完成”不同；“上一轮做过”与“本轮不必再做”也不同。远区压缩尤其不能抹掉尚未完成的依赖。"],["产品要问清","你能在新一轮实际输入中看到上一步结果吗？模型是否仍在用过时的车况？"],["这一步怎么做","如果仍缺信息、需要调用下一工具或修正失败，沿 R1 回到 03 组装本轮输入，再由同一个 Planner 判断。不是把结果交给另一个名叫 Director 的模型重新开始。"],["放进同一个例子","第二轮拿到地址后调用路线规划；如果返回多个路线，再等待用户选择；导航状态确认后才关闭导航子目标。"],["异常与交接","失败可选择重试、换方案、澄清或明确终止，但必须受能力与副作用约束。不能无限重试，也不能在用户取消后重新激活旧目标。"],["产品要问清","每一轮新增了什么有效信息？为什么有必要再推理一次，而不是重复调用同一个工具？"]],"learn":["context"],"refs":"B,S09,S10,S12","detail":"把新结果与交互事件写回相应上下文，保留已完成与未完成部分。下一轮仍由同一 Planner 继续判断，不从零重做。","oldId":"X8","layout":{"title":["21.5 形成下一轮上下文"],"body":["收工具反馈和手动操作事件","保留部分完成与待选结果"],"detail":["把新结果与交互事件写回相应上下文，保留已完成与未完成部分","。下一轮仍由同一 Planner 继续判断，不从零重做。"],"height":319}},{"id":"P1","group":"planner","x":8410,"y":4985,"w":760,"h":390,"title":"20.1 理解完整诉求","body":["解析对象、动作、约束和时间","例：降温 + 去昨天的游泳馆"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","先理解用户到底希望什么发生、针对谁、有哪些约束和时间要求。多目标句子需要分别维护完成条件。"],["原有职责细节","解析对象、动作、约束和时间；例：降温 + 去昨天的游泳馆"],["这一步怎么做","Planner 理解用户真正想达成什么，并保留对象、位置、时间、偏好和禁止事项。它不是直接操作车辆，而是在当前事实与能力边界下，决定本轮应该行动、查信息、询问还是等待。"],["放进同一个例子","本例有两个子目标：让当前乘员更凉快；导航去他昨天去过的游泳馆。完成其中一个，不等于整句话已经办妥。"],["异常与交接","不应擅自增加高影响动作，也不能为追求“多工具能力”额外开窗、改路线或改账号设置。无依据动作要单独计入失败。"],["产品要问清","这条 Query 的完整成功标准是什么？哪些动作是必要的，哪些只是模型自己发挥？"]],"learn":["planner"],"refs":"A,B,S11","detail":"先理解用户到底希望什么发生、针对谁、有哪些约束和时间要求。多目标句子需要分别维护完成条件。","oldId":"P1","layout":{"title":["20.1 理解完整诉求"],"body":["解析对象、动作、约束和时间","例：降温 + 去昨天的游泳馆"],"detail":["先理解用户到底希望什么发生、针对谁、有哪些约束和时间要求","。多目标句子需要分别维护完成条件。"],"height":319}},{"id":"P2","group":"planner","x":9250,"y":4985,"w":760,"h":390,"title":"20.2 当前还缺什么？","body":["目的地/身份/车况是否已知","查得到 → 工具；需用户定 → 问"],"role":"decision","tone":"blue","future":false,"kind":"decision","paras":[["这个小模块做什么","区分已知事实、可查询信息与必须由用户决定的选择。缺目的地不能猜；不确定是否有权限也不能擅自执行。"],["原有职责细节","目的地/身份/车况是否已知；查得到 → 工具；需用户定 → 问"],["这一步怎么做","查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。"],["放进同一个例子","如果昨天地点未在 Context 中，先调用 user_memory_search。若返回两个可能地点，就问用户选哪一个；不能自行挑一家立即导航。"],["异常与交接","查无记忆、无注册身份、存在多候选、工具不可用，是不同的恢复分支。用户提供新信息后，要继续原目标而不是忘记降温这一半。"],["产品要问清","为什么这一步要查工具，不直接问用户？又为什么多候选时不能继续替用户决定？"]],"learn":["planner"],"refs":"A,B,S11","detail":"区分已知事实、可查询信息与必须由用户决定的选择。缺目的地不能猜；不确定是否有权限也不能擅自执行。","oldId":"P2","layout":{"title":["20.2 当前还缺什么？"],"body":["目的地/身份/车况是否已知","查得到 → 工具；需用户定 → 问"],"detail":["区分已知事实、可查询信息与必须由用户决定的选择。缺目的地","不能猜；不确定是否有权限也不能擅自执行。"],"height":319}},{"id":"P3","group":"planner","x":9250,"y":5513,"w":760,"h":390,"title":"20.3 拆目标与依赖","body":["降温与查记忆可独立推进","拿到具体地点后才能规划路线"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","建立动作先后依赖。降温和查历史地点可独立推进；必须先拿到具体地点，才能据此规划路线。"],["原有职责细节","降温与查记忆可独立推进；拿到具体地点后才能规划路线"],["这一步怎么做","独立动作可以分别推进；有依赖的动作必须等前一步结果。工具指令要把代词、对象和约束改写得下游能理解。SP 还明确要求 POI、路线规划、导航控制串行互斥。"],["放进同一个例子","降温相关行动与查询历史地点可以在条件允许时独立推进；路线规划必须等具体地点。不能在查“昨天那家”的同时，凭空给路线工具一个地址。"],["异常与交接","是否并发由能力、依赖和实际调度契约共同决定，不是“模型一次输出多个 action 就一定并行”。串行安全要求也不能仅凭提示词就认为已保证。"],["产品要问清","哪个结果是下一步必需的输入？哪一条日志能证明工具实际按正确顺序执行？"]],"learn":["planner"],"refs":"A,B,S11","detail":"建立动作先后依赖。降温和查历史地点可独立推进；必须先拿到具体地点，才能据此规划路线。","oldId":"P3","layout":{"title":["20.3 拆目标与依赖"],"body":["降温与查记忆可独立推进","拿到具体地点后才能规划路线"],"detail":["建立动作先后依赖。降温和查历史地点可独立推进；必须先拿到","具体地点，才能据此规划路线。"],"height":319}},{"id":"P4","group":"planner","x":8410,"y":5513,"w":760,"h":390,"title":"20.4 选择工具并改写","body":["工具名、参数、位置与数值","改写须保留原意，且下游能接"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","从本轮可见工具中选正确入口，把当前诉求改写成下游能理解的参数。不得丢失否定、座位、数值和用户限制。"],["原有职责细节","工具名、参数、位置与数值；改写须保留原意，且下游能接"],["这一步怎么做","独立动作可以分别推进；有依赖的动作必须等前一步结果。工具指令要把代词、对象和约束改写得下游能理解。SP 还明确要求 POI、路线规划、导航控制串行互斥。"],["放进同一个例子","降温相关行动与查询历史地点可以在条件允许时独立推进；路线规划必须等具体地点。不能在查“昨天那家”的同时，凭空给路线工具一个地址。"],["异常与交接","是否并发由能力、依赖和实际调度契约共同决定，不是“模型一次输出多个 action 就一定并行”。串行安全要求也不能仅凭提示词就认为已保证。"],["产品要问清","哪个结果是下一步必需的输入？哪一条日志能证明工具实际按正确顺序执行？"],["这一步怎么做","调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 Task 接口不混算成第 28 个线上工具。"],["放进同一个例子","查记忆使用 user_memory_search；历史地址确定后使用 route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工具。"],["异常与交接","SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型不支持，应有可解释失败，而不是静默丢弃。"],["产品要问清","能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表逐项对齐？"]],"learn":["planner"],"refs":"A,B,S11","detail":"从本轮可见工具中选正确入口，把当前诉求改写成下游能理解的参数。不得丢失否定、座位、数值和用户限制。","oldId":"P4","layout":{"title":["20.4 选择工具并改写"],"body":["工具名、参数、位置与数值","改写须保留原意，且下游能接"],"detail":["从本轮可见工具中选正确入口，把当前诉求改写成下游能理解的","参数。不得丢失否定、座位、数值和用户限制。"],"height":319}},{"id":"P5","group":"planner","x":8410,"y":6041,"w":760,"h":390,"title":"20.5 生成本轮输出","body":["talk_or_not / talk_content","emoji_id + action_list"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","输出是否说话、说什么及动作列表。可以只回答、不动作；也可以先查询再回答；JSON 合法并不代表计划合理。"],["原有职责细节","talk_or_not / talk_content；emoji_id + action_list"],["这一步怎么做","输出包含是否说话、说什么、表情与 action_list。需要工具时进入 05；不需要工具或需要澄清时可直接走 T1 到 08。未来条件或持续目标进入下方 Task/旧 Goal 支路，不应立即执行目标动作。"],["放进同一个例子","第一轮可以查历史地点、执行合法的降温动作；收到记忆结果后再规划路线。最终结果要等真实回报，不是第一轮就说“已经导航好了”。"],["异常与交接","talk_content 与 action_list 要一致。用户取消后，应区分停止播报、取消当前动作和撤销未来任务，不能用一句“好的”代替状态处理。"],["产品要问清","模型选错时，证据指向输入缺失、工具描述、示例干扰，还是信息齐全后的推理失误？"]],"learn":["planner"],"refs":"A,B,S11","detail":"输出是否说话、说什么及动作列表。可以只回答、不动作；也可以先查询再回答；JSON 合法并不代表计划合理。","oldId":"P5","layout":{"title":["20.5 生成本轮输出"],"body":["talk_or_not / talk_content","emoji_id + action_list"],"detail":["输出是否说话、说什么及动作列表。可以只回答、不动作；也可","以先查询再回答；JSON 合法并不代表计划合理。"],"height":319}},{"id":"P6","group":"planner","x":9250,"y":6041,"w":760,"h":390,"title":"20.6 需要等待以后？","body":["条件/周期/长期 → 任务入口","即时工具仍按本轮 action 下发"],"role":"decision","tone":"blue","future":false,"kind":"decision","paras":[["这个小模块做什么","遇到未来时间、条件或持续目标，转所选任务机制建立等待。不能把“十分钟后关加热”误执行成现在关闭。"],["原有职责细节","条件/周期/长期 → 任务入口；即时工具仍按本轮 action 下发"],["这一步怎么做","“十分钟后关加热”要创建等待，而不是立即调用关加热。旧口径由 goal_list_update、Goal List 与动态 Advisor 处理；新 Task 技术设计由 Task Service 接管异步目标。静态 Advisor 不因此消失。"],["放进同一个例子","本例若补一句“到了游泳馆提醒我拿泳镜”，导航与未来提醒属于不同生命周期。"],["异常与交接","方案中的 Task 能力与当前车端开放能力必须区分。不能把旧动态 Advisor 和新 Task 画成每个请求必经的两个串行模块。"],["产品要问清","当前目标车型使用哪一套？迁移时如何防双创建、双观察、双执行？"]],"learn":["planner"],"refs":"A,B,S11","detail":"遇到未来时间、条件或持续目标，转所选任务机制建立等待。不能把“十分钟后关加热”误执行成现在关闭。","oldId":"P6","layout":{"title":["20.6 需要等待以后？"],"body":["条件/周期/长期 → 任务入口","即时工具仍按本轮 action 下发"],"detail":["遇到未来时间、条件或持续目标，转所选任务机制建立等待。不","能把“十分钟后关加热”误执行成现在关闭。"],"height":319}},{"id":"P7","group":"planner","x":9250,"y":6569,"w":760,"h":390,"title":"20.7 观察返回结果","body":["成功、失败、候选或处理中","反馈不是用户的新指令"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","读每项工具的本轮结果，区分已受理、处理中、候选、部分成功、失败和真实完成；不能只搜索一个“成功”关键词。"],["原有职责细节","成功、失败、候选或处理中；反馈不是用户的新指令"],["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"],["这一步怎么做","Context 需要反映新结果、用户选择和实际车况。已经完成的子目标保留证据，尚未完成的继续存在。历史成功也不能覆盖用户刚刚手动改变的状态。"],["放进同一个例子","查到昨天去的游泳馆后，新增的是一个可用地点；导航还没执行。空调成功后如果用户手动关掉，也必须记录新车态。"],["异常与交接","“工具调用过”与“目标完成”不同；“上一轮做过”与“本轮不必再做”也不同。远区压缩尤其不能抹掉尚未完成的依赖。"],["产品要问清","你能在新一轮实际输入中看到上一步结果吗？模型是否仍在用过时的车况？"]],"learn":["planner"],"refs":"A,B,S11","detail":"读每项工具的本轮结果，区分已受理、处理中、候选、部分成功、失败和真实完成；不能只搜索一个“成功”关键词。","oldId":"P7","layout":{"title":["20.7 观察返回结果"],"body":["成功、失败、候选或处理中","反馈不是用户的新指令"],"detail":["读每项工具的本轮结果，区分已受理、处理中、候选、部分成功","、失败和真实完成；不能只搜索一个“成功”关键词。"],"height":319}},{"id":"P8","group":"planner","x":8410,"y":6569,"w":760,"h":390,"title":"20.8 目标是否完成？","body":["逐个核对子目标，不抢报完成","未完：继续 / 换方案 / 问 / 等"],"role":"decision","tone":"green","future":false,"kind":"decision","paras":[["这个小模块做什么","逐个对子目标复核证据。还有缺口就继续查、执行、澄清、等待或停止；只有满足完整诉求才结束目标。"],["原有职责细节","逐个核对子目标，不抢报完成；未完：继续 / 换方案 / 问 / 等"],["这一步怎么做","如果仍缺信息、需要调用下一工具或修正失败，沿 R1 回到 03 组装本轮输入，再由同一个 Planner 判断。不是把结果交给另一个名叫 Director 的模型重新开始。"],["放进同一个例子","第二轮拿到地址后调用路线规划；如果返回多个路线，再等待用户选择；导航状态确认后才关闭导航子目标。"],["异常与交接","失败可选择重试、换方案、澄清或明确终止，但必须受能力与副作用约束。不能无限重试，也不能在用户取消后重新激活旧目标。"],["产品要问清","每一轮新增了什么有效信息？为什么有必要再推理一次，而不是重复调用同一个工具？"],["这一步怎么做","根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。"],["放进同一个例子","如果降温成功但地点没找到，就说清已处理降温、地点仍需确认；不能说“都安排好了”。如果两者都生效，才给完成反馈。"],["异常与交接","业务结果与用户满意度还需分开：导航已正确开始不等于用户对路线满意；空调参数变化也不等于用户已经感到舒适。"],["产品要问清","系统每一次“已完成”是否都有证据？假完成率的分母必须是宣称完成的请求。"]],"learn":["planner"],"refs":"A,B,S11","detail":"逐个对子目标复核证据。还有缺口就继续查、执行、澄清、等待或停止；只有满足完整诉求才结束目标。","oldId":"P8","layout":{"title":["20.8 目标是否完成？"],"body":["逐个核对子目标，不抢报完成","未完：继续 / 换方案 / 问 / 等"],"detail":["逐个对子目标复核证据。还有缺口就继续查、执行、澄清、等待","或停止；只有满足完整诉求才结束目标。"],"height":319}},{"id":"P9","group":"planner","x":8410,"y":7097,"w":760,"h":390,"title":"20.9 输出用户可懂结果","body":["成功部分 + 尚未完成部分","必要时解释失败与下一步"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","准确表达已完成部分、未完成部分与下一步。没有执行证据时只能说受理或等待，不能用“好了”掩盖失败。"],["原有职责细节","成功部分 + 尚未完成部分；必要时解释失败与下一步"],["这一步怎么做","Planner 的 talk_content 用于生成对话输出；查询、简单控制等场景不一定需要无意义的“我帮你查一下”。部分领域 Agent 也会自己播报，需要避免重复或抢话。"],["放进同一个例子","若地点仍在确认，可以先说明必要的下一步；若空调成功而导航失败，应明确部分结果。不能在动作尚未发生时用完成时态承诺。"],["异常与交接","话术要与本轮实际动作、失败和等待一致；安全或重要结果不能被普通过渡语覆盖。具体播报优先级按运行策略核验。"],["产品要问清","谁负责首响应，谁负责领域结果，谁负责总结？有没有重复播报和抢话测试？"]],"learn":["planner"],"refs":"A,B,S11","detail":"准确表达已完成部分、未完成部分与下一步。没有执行证据时只能说受理或等待，不能用“好了”掩盖失败。","oldId":"P9","layout":{"title":["20.9 输出用户可懂结果"],"body":["成功部分 + 尚未完成部分","必要时解释失败与下一步"],"detail":["准确表达已完成部分、未完成部分与下一步。没有执行证据时只","能说受理或等待，不能用“好了”掩盖失败。"],"height":319}},{"id":"P10","group":"planner","x":9250,"y":7097,"w":760,"h":390,"title":"20.10 澄清或让用户选","body":["多个地点/缺身份/不确定约束","等回复后接回原目标"],"role":"step","tone":"amber","future":false,"kind":"step","paras":[["这个小模块做什么","缺用户选择、对象歧义或重要约束时提出具体问题。用户回答后接回原目标，而不是把“第三个”当全新的地点。"],["原有职责细节","多个地点/缺身份/不确定约束；等回复后接回原目标"],["这一步怎么做","查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。"],["放进同一个例子","如果昨天地点未在 Context 中，先调用 user_memory_search。若返回两个可能地点，就问用户选哪一个；不能自行挑一家立即导航。"],["异常与交接","查无记忆、无注册身份、存在多候选、工具不可用，是不同的恢复分支。用户提供新信息后，要继续原目标而不是忘记降温这一半。"],["产品要问清","为什么这一步要查工具，不直接问用户？又为什么多候选时不能继续替用户决定？"],["这一步怎么做","手动选择与可见即可说需要找到当前可操作元素，再触发原业务按钮回调。关键选择结果应回到 Context；未完成的任务继续判断，不能让一次点击丢失前面的目标。"],["放进同一个例子","用户选第三条路线后，由路线业务完成其既定选择/导航流程，再把结果回给系统；不应把“第三个”单独当成没有上下文的新地点。"],["异常与交接","页面已切换、候选过期、同名按钮、任务已取消时，不能照旧点击。可见即可说的详细匹配链在本列下方展开。"],["产品要问清","原业务收到的是哪个选项 ID？实际选择有没有进入下一轮模型输入？"]],"learn":["planner"],"refs":"A,B,S11","detail":"缺用户选择、对象歧义或重要约束时提出具体问题。用户回答后接回原目标，而不是把“第三个”当全新的地点。","oldId":"P10","layout":{"title":["20.10 澄清或让用户选"],"body":["多个地点/缺身份/不确定约束","等回复后接回原目标"],"detail":["缺用户选择、对象歧义或重要约束时提出具体问题。用户回答后","接回原目标，而不是把“第三个”当全新的地点。"],"height":319}},{"id":"P11","group":"planner","x":9250,"y":7625,"w":760,"h":390,"title":"20.11 查询/补信息","body":["只调用缺少的信息类工具","记忆未找到不能自编目的地"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","选择能够补齐当前缺口的查询工具。记忆查不到就问用户；查到多个候选则消歧，不反复盲查或编造。"],["原有职责细节","只调用缺少的信息类工具；记忆未找到不能自编目的地"],["这一步怎么做","查得到的事实可调用工具；只有用户能决定的选择，应澄清或展示候选。Planner 需要知道自己不知道什么，不能把一个猜测的地点作为已确定目的地。"],["放进同一个例子","如果昨天地点未在 Context 中，先调用 user_memory_search。若返回两个可能地点，就问用户选哪一个；不能自行挑一家立即导航。"],["异常与交接","查无记忆、无注册身份、存在多候选、工具不可用，是不同的恢复分支。用户提供新信息后，要继续原目标而不是忘记降温这一半。"],["产品要问清","为什么这一步要查工具，不直接问用户？又为什么多候选时不能继续替用户决定？"]],"learn":["planner"],"refs":"A,B,S11","detail":"选择能够补齐当前缺口的查询工具。记忆查不到就问用户；查到多个候选则消歧，不反复盲查或编造。","oldId":"P11","layout":{"title":["20.11 查询/补信息"],"body":["只调用缺少的信息类工具","记忆未找到不能自编目的地"],"detail":["选择能够补齐当前缺口的查询工具。记忆查不到就问用户；查到","多个候选则消歧，不反复盲查或编造。"],"height":319}},{"id":"P12","group":"planner","x":8410,"y":7625,"w":760,"h":390,"title":"20.12 停止/取消/终止","body":["取消动作、终止当前目标","播报被打断不自动等于任务取消"],"role":"step","tone":"red","future":false,"kind":"step","paras":[["这个小模块做什么","先确定取消的是声音、一次调用、导航目标还是持久任务，再交对应业务处理。已生效动作不因停止生成文本而自动撤销。"],["原有职责细节","取消动作、终止当前目标；播报被打断不自动等于任务取消"],["这一步怎么做","输出包含是否说话、说什么、表情与 action_list。需要工具时进入 05；不需要工具或需要澄清时可直接走 T1 到 08。未来条件或持续目标进入下方 Task/旧 Goal 支路，不应立即执行目标动作。"],["放进同一个例子","第一轮可以查历史地点、执行合法的降温动作；收到记忆结果后再规划路线。最终结果要等真实回报，不是第一轮就说“已经导航好了”。"],["异常与交接","talk_content 与 action_list 要一致。用户取消后，应区分停止播报、取消当前动作和撤销未来任务，不能用一句“好的”代替状态处理。"],["产品要问清","模型选错时，证据指向输入缺失、工具描述、示例干扰，还是信息齐全后的推理失误？"],["这一步怎么做","新语音从 01 进入；与当前业务相关的点击事件可沿 U1 回 03。打断播报不自动取消已下发车控；取消一次执行也不自动删除长期任务，这些必须用业务状态区分。"],["放进同一个例子","用户说“先别去了”应影响导航目标，但是否保留已完成降温要按原意处理；用户仅把音量调低，不应让历史任务重新执行。"],["异常与交接","完整闭环最后还要记录失败与用户反馈，进入评测和改进。产品经理需要能追这一条链，而不是必须实现每个底层模型后才有资格判断好坏。"],["产品要问清","同一案例能否讲清成功标准、最早出错点、责任边界、改法和回归结果？"]],"learn":["planner"],"refs":"A,B,S11","detail":"先确定取消的是声音、一次调用、导航目标还是持久任务，再交对应业务处理。已生效动作不因停止生成文本而自动撤销。","oldId":"P12","layout":{"title":["20.12 停止/取消/终止"],"body":["取消动作、终止当前目标","播报被打断不自动等于任务取消"],"detail":["先确定取消的是声音、一次调用、导航目标还是持久任务，再交","对应业务处理。已生效动作不因停止生成文本而自动撤销。"],"height":319}},{"id":"F1","group":"orchestration","x":10450,"y":4985,"w":760,"h":390,"title":"22.1 接收 action_list","body":["工具名 + 参数 + 调用归属","具体关联字段以运行协议核验"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","把每个动作交给对应领域。模型生成 action_list 仅表示计划下发意图，还没有调用成功，也没有真实副作用。"],["原有职责细节","action_id + tool_name + params；动作候选还没有实际执行"],["这一步怎么做","调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 Task 接口不混算成第 28 个线上工具。"],["放进同一个例子","查记忆使用 user_memory_search；历史地址确定后使用 route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工具。"],["异常与交接","SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型不支持，应有可解释失败，而不是静默丢弃。"],["产品要问清","能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表逐项对齐？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"把每个动作交给对应领域。模型生成 action_list 仅表示计划下发意图，还没有调用成功，也没有真实副作用。","oldId":"F1","layout":{"title":["22.1 接收 action_list"],"body":["工具名 + 参数 + 调用归属","具体关联字段以运行协议核验"],"detail":["把每个动作交给对应领域。模型生成 action_list 仅表示计划","下发意图，还没有调用成功，也没有真实副作用。"],"height":319}},{"id":"F2","group":"orchestration","x":11290,"y":4985,"w":760,"h":390,"title":"22.2 能力/参数校验","body":["工具注册、车型支持、必填范围","统一校验层实现需核对"],"role":"decision","tone":"blue","future":false,"kind":"decision","paras":[["这个小模块做什么","核对工具存在、车型支持、入参完整且范围合法。这是必须验收的契约；不假设所有业务已经有同一套统一门禁。"],["原有职责细节","工具注册、车型支持、必填范围；统一校验层实现需核对"],["这一步怎么做","调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 Task 接口不混算成第 28 个线上工具。"],["放进同一个例子","查记忆使用 user_memory_search；历史地址确定后使用 route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工具。"],["异常与交接","SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型不支持，应有可解释失败，而不是静默丢弃。"],["产品要问清","能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表逐项对齐？"],["这一步怎么做","动作下发前，需要按各领域契约检查对象、取值、车态、用户权限和必要确认。这里是产品必须明确的边界，不代表已验证公司存在一个万能的统一校验服务。"],["放进同一个例子","主驾说“给副驾降温”，控制对象要明确；查记忆不能串到副驾身份。通讯、预订、记忆写入等会产生额外副作用，更不能把理解正确等同于获准提交。"],["异常与交接","非法参数、不支持功能、前置条件变化时，应拦截或请用户确认。是否由 Planner、调度层、Agent 或车端执行检查，要逐个工具说清。"],["产品要问清","谁拦非法动作？谁对接被拦后的可用替代方案？权限测试是否只测成功路径？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"核对工具存在、车型支持、入参完整且范围合法。这是必须验收的契约；不假设所有业务已经有同一套统一门禁。","oldId":"F2","layout":{"title":["22.2 能力/参数校验"],"body":["工具注册、车型支持、必填范围","统一校验层实现需核对"],"detail":["核对工具存在、车型支持、入参完整且范围合法。这是必须验收","的契约；不假设所有业务已经有同一套统一门禁。"],"height":319}},{"id":"F3","group":"orchestration","x":11290,"y":5513,"w":760,"h":390,"title":"22.3 权限与业务前置条件","body":["身份/座位/车态/用户确认","高副作用工具逐项约定"],"role":"decision","tone":"blue","future":false,"kind":"decision","paras":[["这个小模块做什么","执行前检查身份、位置、车态和所需确认。推荐、用户点击与允许自动执行是不同授权边界。"],["原有职责细节","身份/座位/车态/用户确认；高副作用工具逐项约定"],["这一步怎么做","动作下发前，需要按各领域契约检查对象、取值、车态、用户权限和必要确认。这里是产品必须明确的边界，不代表已验证公司存在一个万能的统一校验服务。"],["放进同一个例子","主驾说“给副驾降温”，控制对象要明确；查记忆不能串到副驾身份。通讯、预订、记忆写入等会产生额外副作用，更不能把理解正确等同于获准提交。"],["异常与交接","非法参数、不支持功能、前置条件变化时，应拦截或请用户确认。是否由 Planner、调度层、Agent 或车端执行检查，要逐个工具说清。"],["产品要问清","谁拦非法动作？谁对接被拦后的可用替代方案？权限测试是否只测成功路径？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"执行前检查身份、位置、车态和所需确认。推荐、用户点击与允许自动执行是不同授权边界。","oldId":"F3","layout":{"title":["22.3 权限与业务前置条件"],"body":["身份/座位/车态/用户确认","高副作用工具逐项约定"],"detail":["执行前检查身份、位置、车态和所需确认。推荐、用户点击与允","许自动执行是不同授权边界。"],"height":319}},{"id":"F4","group":"orchestration","x":10450,"y":5513,"w":760,"h":390,"title":"22.4 本轮可执行动作","body":["独立动作可并行；依赖须等待","POI / route / navi 串行互斥"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","只让依赖已满足的动作运行。独立任务可并行；POI、路线与导航工具受其串行互斥约束，不机械并发。"],["原有职责细节","独立动作可并行；依赖须等待；POI / route / navi 串行互斥"],["这一步怎么做","把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返回的结果。"],["放进同一个例子","查完记忆拿到地址，再把地址交给路线规划；降温动作的反馈与路线反馈分别记录，不能先回来的一个成功覆盖整个目标。"],["异常与交接","取消、重试、超时后迟到结果必须有明确处理。当前 SP 的反馈示意只有 tool_name 与文本，无法据此推断 action_id 回绑已完善。"],["产品要问清","反馈怎么找到那一次调用？两个同名调用反序返回、旧结果迟到，系统会不会串结果？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"只让依赖已满足的动作运行。独立任务可并行；POI、路线与导航工具受其串行互斥约束，不机械并发。","oldId":"F4","layout":{"title":["22.4 本轮可执行动作"],"body":["独立动作可并行；依赖须等待","POI / route / navi 串行互斥"],"detail":["只让依赖已满足的动作运行。独立任务可并行；POI、路线与导","航工具受其串行互斥约束，不机械并发。"],"height":319}},{"id":"F5","group":"orchestration","x":10450,"y":6041,"w":760,"h":390,"title":"22.5 Adapter / 领域 Agent","body":["自然语言指令 → 领域理解","工具内可再调 SFT/服务/SDK"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","领域 Agent/Adapter 将任务参数继续解释成业务能力。内部可能再次使用模型，也可能查服务或调用 SDK，具体实现逐工具核验。"],["原有职责细节","自然语言指令 → 领域理解；工具内可再调 SFT/服务/SDK"],["这一步怎么做","有的工具接自然语言 query，再由领域能力理解；有的接结构化参数或调用服务。进入工具并不意味着直接碰到车辆。具体是否再调 SFT、规则或其他模型，需看该工具实现，不能全体套同一种架构。"],["放进同一个例子","vehicle_basic_control 要把降温诉求落到具体功能、位置和数值；user_memory_search 则检索对应用户的经历，二者内部机制不同。"],["异常与交接","领域工具也可能漏掉否定或位置约束。如果 Planner 发出的指令正确、工具解释错了，责任不能继续算到 Planner。"],["产品要问清","能否看到工具收到的原始输入、内部解析结果和实际调用的下级能力？哪里第一次变错？"],["这一步怎么做","真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里才可能产生真实副作用。"],["放进同一个例子","车控接口让空调或风量发生变化；路线工具让正确目的地进入导航状态。这两条链各自成功，才有可能完成本例。"],["异常与交接","SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前车态改变、资源受限、服务不可用，都可能让先前合法计划失败。"],["产品要问清","回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功口径如何保守定义？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"领域 Agent/Adapter 将任务参数继续解释成业务能力。内部可能再次使用模型，也可能查服务或调用 SDK，具体实现逐工具核验。","oldId":"F5","layout":{"title":["22.5 Adapter / 领域 Agent"],"body":["自然语言指令 → 领域理解","工具内可再调 SFT/服务/SDK"],"detail":["领域 Agent/Adapter 将任务参数继续解释成业务能力。内部","可能再次使用模型，也可能查服务或调用 SDK，具体实现逐工具","核验。"],"height":355}},{"id":"F6","group":"orchestration","x":11290,"y":6041,"w":760,"h":390,"title":"22.6 车端或云服务执行","body":["车控 / 导航 / 媒体 / 生态","下方 27 项逐个展开机制"],"role":"step","tone":"blue","future":false,"kind":"step","paras":[["这个小模块做什么","按能力走车端设备、云端服务或生态业务。下方工具区将每个入口展开为输入、内部处理和结果契约。"],["原有职责细节","车控 / 导航 / 媒体 / 生态；下方 27 项逐个展开机制"],["这一步怎么做","真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里才可能产生真实副作用。"],["放进同一个例子","车控接口让空调或风量发生变化；路线工具让正确目的地进入导航状态。这两条链各自成功，才有可能完成本例。"],["异常与交接","SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前车态改变、资源受限、服务不可用，都可能让先前合法计划失败。"],["产品要问清","回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功口径如何保守定义？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"按能力走车端设备、云端服务或生态业务。下方工具区将每个入口展开为输入、内部处理和结果契约。","oldId":"F6","layout":{"title":["22.6 车端或云服务执行"],"body":["车控 / 导航 / 媒体 / 生态","下方 27 项逐个展开机制"],"detail":["按能力走车端设备、云端服务或生态业务。下方工具区将每个入","口展开为输入、内部处理和结果契约。"],"height":319}},{"id":"F7","group":"orchestration","x":11290,"y":6569,"w":760,"h":390,"title":"22.7 原始结果返回","body":["受理/候选/成功/失败/处理中","接口成功不自动代表物理生效"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","收集业务真实返回，区分 ACK、候选、异步进度、执行结果与状态回读。网络请求成功不等于用户目标实现。"],["原有职责细节","受理/候选/成功/失败/处理中；接口成功不自动代表物理生效"],["这一步怎么做","工具把事实、候选、处理中、成功或失败等业务含义交回。对于车控，应把指令回执与真实车况分开；对于导航或订单，要核对业务状态，而不是只看 HTTP 或模型文本。"],["放进同一个例子","降温要核对空调/风量等目标变化；导航要核对目的地和导航状态。仅“调用成功”不足以支撑“两个目标都完成”。"],["异常与交接","下游无法提供真实状态时，要保留“不确定/已受理”等语义，并明确待补的回读契约，不能包装成已完成。"],["产品要问清","每种结果对应哪条日志或状态证据？用户说“根本没变”时，系统能定位到哪一跳？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"收集业务真实返回，区分 ACK、候选、异步进度、执行结果与状态回读。网络请求成功不等于用户目标实现。","oldId":"F7","layout":{"title":["22.7 原始结果返回"],"body":["受理/候选/成功/失败/处理中","接口成功不自动代表物理生效"],"detail":["收集业务真实返回，区分 ACK、候选、异步进度、执行结果与状","态回读。网络请求成功不等于用户目标实现。"],"height":319}},{"id":"F8","group":"orchestration","x":10450,"y":6569,"w":760,"h":390,"title":"22.8 形成 tool_feedback","body":["当前 SP：tool_name + 结果文本","缺 action_id 等关联字段需补"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","把结果整理为本轮工具反馈并关联原调用。当前 SP 的文本结果不能证明运行协议已有完整的状态码、幂等键或 action_id。"],["原有职责细节","当前 SP：tool_name + 结果文本；缺 action_id 等关联字段需补"],["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"把结果整理为本轮工具反馈并关联原调用。当前 SP 的文本结果不能证明运行协议已有完整的状态码、幂等键或 action_id。","oldId":"F8","layout":{"title":["22.8 形成 tool_feedback"],"body":["当前 SP：tool_name + 结果文本","缺 action_id 等关联字段需补"],"detail":["把结果整理为本轮工具反馈并关联原调用。当前 SP 的文本结果","不能证明运行协议已有完整的状态码、幂等键或 action_id。"],"height":319}},{"id":"F9","group":"orchestration","x":10450,"y":7097,"w":760,"h":390,"title":"22.9 下一轮输入队列","body":["保留所属用户/任务/调用关系","迟到、重复、取消后回报需处理"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","携用户、轮次、任务和调用归属回统一输入管理。迟到、重复及已取消目标的结果，不能随意启动新一轮行动。"],["原有职责细节","保留所属用户/任务/调用关系；迟到、重复、取消后回报需处理"],["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"],["这一步怎么做","如果仍缺信息、需要调用下一工具或修正失败，沿 R1 回到 03 组装本轮输入，再由同一个 Planner 判断。不是把结果交给另一个名叫 Director 的模型重新开始。"],["放进同一个例子","第二轮拿到地址后调用路线规划；如果返回多个路线，再等待用户选择；导航状态确认后才关闭导航子目标。"],["异常与交接","失败可选择重试、换方案、澄清或明确终止，但必须受能力与副作用约束。不能无限重试，也不能在用户取消后重新激活旧目标。"],["产品要问清","每一轮新增了什么有效信息？为什么有必要再推理一次，而不是重复调用同一个工具？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"携用户、轮次、任务和调用归属回统一输入管理。迟到、重复及已取消目标的结果，不能随意启动新一轮行动。","oldId":"F9","layout":{"title":["22.9 下一轮输入队列"],"body":["保留所属用户/任务/调用关系","迟到、重复、取消后回报需处理"],"detail":["携用户、轮次、任务和调用归属回统一输入管理。迟到、重复及","已取消目标的结果，不能随意启动新一轮行动。"],"height":319}},{"id":"F10","group":"orchestration","x":11290,"y":7097,"w":760,"h":390,"title":"22.10 可重试还是停止？","body":["查询可重试不代表订座可重试","确认副作用后重试或换方案"],"role":"decision","tone":"red","future":false,"kind":"decision","paras":[["这个小模块做什么","先确认前次调用是否已经产生副作用，再决定查询状态、重试、补偿或停止。订座、呼叫等不能像只读查询一样盲重试。"],["原有职责细节","查询可重试不代表订座可重试；确认副作用后重试或换方案"],["这一步怎么做","查询失败和写操作超时不能使用同一重试策略。查询可按预算重试；订座、拨号或记忆写入超时，应先确认已有操作状态，再决定是否补做，避免重复副作用。"],["放进同一个例子","如果路线工具返回失败，遵守 SP 约定的最多两次重试；如果订座提交超时，则不能照搬这条策略连订几次。"],["异常与交接","重试次数、超时预算、幂等键、取消能力和失败原因，需要工具契约支持。文档没提供的字段不能当成已上线机制。"],["产品要问清","这个工具超时意味着没执行，还是执行了但没回报？有什么查询或回执能证明？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"先确认前次调用是否已经产生副作用，再决定查询状态、重试、补偿或停止。订座、呼叫等不能像只读查询一样盲重试。","oldId":"F10","layout":{"title":["22.10 可重试还是停止？"],"body":["查询可重试不代表订座可重试","确认副作用后重试或换方案"],"detail":["先确认前次调用是否已经产生副作用，再决定查询状态、重试、","补偿或停止。订座、呼叫等不能像只读查询一样盲重试。"],"height":319}},{"id":"F11","group":"orchestration","x":11290,"y":7625,"w":760,"h":390,"title":"22.11 标准状态协议缺口","body":["缺状态码、可重试和任务关联","同名工具并行可能错绑"],"role":"step","tone":"red","future":false,"kind":"check","paras":[["这个小模块做什么","验收关联、状态和错误语义是否足够定位结果。若只有工具名而同名工具并行，必须确认如何防错绑，不能默认已解决。"],["原有职责细节","缺状态码、可重试和任务关联；同名工具并行可能错绑"],["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"],["这一步怎么做","把可执行动作交给对应领域工具，保留本轮、用户、动作和任务的关系。依赖关系决定等待还是并发；同名工具的多次调用必须能区分，才能处理之后返回的结果。"],["放进同一个例子","查完记忆拿到地址，再把地址交给路线规划；降温动作的反馈与路线反馈分别记录，不能先回来的一个成功覆盖整个目标。"],["异常与交接","取消、重试、超时后迟到结果必须有明确处理。当前 SP 的反馈示意只有 tool_name 与文本，无法据此推断 action_id 回绑已完善。"],["产品要问清","反馈怎么找到那一次调用？两个同名调用反序返回、旧结果迟到，系统会不会串结果？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"验收关联、状态和错误语义是否足够定位结果。若只有工具名而同名工具并行，必须确认如何防错绑，不能默认已解决。","oldId":"F11","layout":{"title":["22.11 标准状态协议缺口"],"body":["缺状态码、可重试和任务关联","同名工具并行可能错绑"],"detail":["验收关联、状态和错误语义是否足够定位结果。若只有工具名而","同名工具并行，必须确认如何防错绑，不能默认已解决。"],"height":319}},{"id":"F12","group":"orchestration","x":10450,"y":7625,"w":760,"h":390,"title":"22.12 注册与示例不一致","body":["示例出现未注册工具","goal_list_update 参数冲突"],"role":"step","tone":"red","future":false,"kind":"check","paras":[["这个小模块做什么","逐轮核对注册工具、SP Schema 和示例是否一致。动态示例引用未注册工具或参数冲突，会稳定诱发错误调用。"],["原有职责细节","示例出现未注册工具；goal_list_update 参数冲突"],["这一步怎么做","调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 Task 接口不混算成第 28 个线上工具。"],["放进同一个例子","查记忆使用 user_memory_search；历史地址确定后使用 route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工具。"],["异常与交接","SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型不支持，应有可解释失败，而不是静默丢弃。"],["产品要问清","能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表逐项对齐？"],["这一步怎么做","系统规则（SP）说明角色、可用工具和输出要求；本轮与历史输入（UP）提供事实和事件。车型、环境、工具版本、场景 knowhow 与动态变量共同决定模型可做什么。"],["放进同一个例子","模型现在应清楚：用户要降温和去某个历史地点；已知车况有哪些；哪些信息还缺；本轮能调用哪些工具。之后才进入 04 规划。"],["异常与交接","本地 SP 的 27 个工具只是定义快照；不能据此说每台车线上都开放 27 个。缺事实应查或问，不能用漂亮的提示词替代真实数据。"],["产品要问清","你能否拿到这一次模型实际看到的完整输入？如果换一份正确上下文，错误是否随之消失？"]],"learn":["orchestration"],"refs":"B,S05,S08","detail":"逐轮核对注册工具、SP Schema 和示例是否一致。动态示例引用未注册工具或参数冲突，会稳定诱发错误调用。","oldId":"F12","layout":{"title":["22.12 注册与示例不一致"],"body":["示例出现未注册工具","goal_list_update 参数冲突"],"detail":["逐轮核对注册工具、SP Schema 和示例是否一致。动态示例引","用未注册工具或参数冲突，会稳定诱发错误调用。"],"height":319}},{"id":"V1","group":"voice","x":250,"y":4985,"w":760,"h":390,"title":"1 用户说话","body":["“我有点热，带我去昨天的游泳馆”","输入：声音，不是完整文字"],"role":"step","tone":"green","future":false,"main":true,"kind":"step","paras":[["这个小模块做什么","这时系统收到的是一段声音。“热”和“昨天的游泳馆”包含两个目标，后面的每一层都不能只保留其中一个。"],["原有职责细节","“我有点热，带我去昨天的游泳馆”；输入：声音，不是完整文字"],["这一步怎么做","用户说话后，语音链路处理麦克风输入、唤醒或免唤醒条件、回声与噪声。音区定位帮助判断声音来自哪一排、哪一个座位；这些是输入可靠性的前提，具体开关与算法部署须按车端版本核对。"],["放进同一个例子","主驾说：“我有点热，带我去昨天的游泳馆。”系统此时拿到的是声音；车内播报、后排交谈不能自动变成主驾指令。"],["异常与交接","没有录音权限、语音未开启、声音未被有效接收时，应在入口解释或停止，不能把空输入交给模型后要求它猜。"],["产品要问清","原始音频能否与这一次请求对应？音区与注册身份发生冲突时，哪个信息可靠？"]],"learn":["voice"],"refs":"A,B","detail":"这时系统收到的是一段声音。“热”和“昨天的游泳馆”包含两个目标，后面的每一层都不能只保留其中一个。","oldId":"V1","layout":{"title":["1 用户说话"],"body":["“我有点热，带我去昨天的游泳馆”","输入：声音，不是完整文字"],"detail":["这时系统收到的是一段声音。“热”和“昨天的游泳馆”包含两","个目标，后面的每一层都不能只保留其中一个。"],"height":319}},{"id":"V2","group":"voice","x":1090,"y":4985,"w":760,"h":390,"title":"2.1 麦克风/唤醒门控","body":["权限、语音开关、唤醒/免唤醒","未开启：不能继续当成有效请求"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","先检查语音功能、麦克风权限和当前唤醒方式。没进入有效交互时，不能把背景声音直接当作可执行指令。"],["原有职责细节","权限、语音开关、唤醒/免唤醒；未开启：不能继续当成有效请求"],["这一步怎么做","用户说话后，语音链路处理麦克风输入、唤醒或免唤醒条件、回声与噪声。音区定位帮助判断声音来自哪一排、哪一个座位；这些是输入可靠性的前提，具体开关与算法部署须按车端版本核对。"],["放进同一个例子","主驾说：“我有点热，带我去昨天的游泳馆。”系统此时拿到的是声音；车内播报、后排交谈不能自动变成主驾指令。"],["异常与交接","没有录音权限、语音未开启、声音未被有效接收时，应在入口解释或停止，不能把空输入交给模型后要求它猜。"],["产品要问清","原始音频能否与这一次请求对应？音区与注册身份发生冲突时，哪个信息可靠？"]],"learn":["voice"],"refs":"A,B","detail":"先检查语音功能、麦克风权限和当前唤醒方式。没进入有效交互时，不能把背景声音直接当作可执行指令。","oldId":"V2","layout":{"title":["2.1 麦克风/唤醒门控"],"body":["权限、语音开关、唤醒/免唤醒","未开启：不能继续当成有效请求"],"detail":["先检查语音功能、麦克风权限和当前唤醒方式。没进入有效交互","时，不能把背景声音直接当作可执行指令。"],"height":319}},{"id":"V3","group":"voice","x":1090,"y":5513,"w":760,"h":390,"title":"2.2 音频处理","body":["回声消除、降噪、音区定位","区分播报声与用户说话"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","音频前处理尽量去掉车噪和系统自己的播报声，并定位发声座位。音区错误会把正确动作施加到错误乘员。"],["原有职责细节","回声消除、降噪、音区定位；区分播报声与用户说话"],["这一步怎么做","用户说话后，语音链路处理麦克风输入、唤醒或免唤醒条件、回声与噪声。音区定位帮助判断声音来自哪一排、哪一个座位；这些是输入可靠性的前提，具体开关与算法部署须按车端版本核对。"],["放进同一个例子","主驾说：“我有点热，带我去昨天的游泳馆。”系统此时拿到的是声音；车内播报、后排交谈不能自动变成主驾指令。"],["异常与交接","没有录音权限、语音未开启、声音未被有效接收时，应在入口解释或停止，不能把空输入交给模型后要求它猜。"],["产品要问清","原始音频能否与这一次请求对应？音区与注册身份发生冲突时，哪个信息可靠？"]],"learn":["voice"],"refs":"A,B","detail":"音频前处理尽量去掉车噪和系统自己的播报声，并定位发声座位。音区错误会把正确动作施加到错误乘员。","oldId":"V3","layout":{"title":["2.2 音频处理"],"body":["回声消除、降噪、音区定位","区分播报声与用户说话"],"detail":["音频前处理尽量去掉车噪和系统自己的播报声，并定位发声座位","。音区错误会把正确动作施加到错误乘员。"],"height":319}},{"id":"V4","group":"voice","x":250,"y":5513,"w":760,"h":390,"title":"2.3 ASR 语音识别","body":["音频 → 增量文本/最终文本","保留数字、否定、地点和人名"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","识别可能先产生增量文本，再形成最终文本。重点保护“不”、温度数值、座位、地名；后端不能用流畅话术掩盖识别错误。"],["原有职责细节","音频 → 增量文本/最终文本；保留数字、否定、地点和人名"],["这一步怎么做","语音识别（ASR）可能先产生增量文字，再形成最终文字。产品验收要看完整语义：人名、地点、数字、“不要”等否定，以及“十分钟后”等时间条件，不能只看平均字错率。"],["放进同一个例子","应保留“有点热”和“昨天的游泳馆”两个诉求。如果“昨天”丢失，后续就会把历史地点理解成附近搜索。"],["异常与交接","ASR 结果不确定、被截断或多人重叠，需要相应的重说、确认或排队策略。Planner 能处理歧义，但不能可靠补回从未收到的语音证据。"],["产品要问清","原音频、识别文字、最终传入 Query 的文字，是否在同一条日志中可对齐？"]],"learn":["voice"],"refs":"A,B","detail":"识别可能先产生增量文本，再形成最终文本。重点保护“不”、温度数值、座位、地名；后端不能用流畅话术掩盖识别错误。","oldId":"V4","layout":{"title":["2.3 ASR 语音识别"],"body":["音频 → 增量文本/最终文本","保留数字、否定、地点和人名"],"detail":["识别可能先产生增量文本，再形成最终文本。重点保护“不”、","温度数值、座位、地名；后端不能用流畅话术掩盖识别错误。"],"height":319}},{"id":"V5","group":"voice","x":250,"y":6041,"w":760,"h":390,"title":"2.4 说话人与位置","body":["音区 + face/身份/座位信息","分清“我”是哪位乘员"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","把音区与可用身份信息关联。“来自主驾”不等于“已确认注册账号”，未知身份不能随意读取某人的历史记忆。"],["原有职责细节","音区 + face/身份/座位信息；分清“我”是哪位乘员"],["这一步怎么做","输入接入要确定本轮说话什么时候结束，补充的半句话是续说还是新请求，并携带说话人、位置和时间。注册身份与座位不是同一个概念：位置影响车控对象，身份影响可读取谁的记忆。"],["放进同一个例子","“我”指当前说话人；降温要考虑其位置，查“昨天去过哪里”则需要关联其身份。不能拿后排乘员的经历替主驾作答。"],["异常与交接","用户边说边补“别开窗”，如果前半句已触发执行，就会出现时序问题。判停策略、已下发动作和取消能力要一起验收。"],["产品要问清","两人同时说话是合并、排序还是打断？每一轮在下游还能否保持原始归属？"],["这一步怎么做","座位说明声音来自哪里，注册身份说明能使用谁的数据。不同信息源可能缺失或冲突；产品需要定义未知身份如何交互，不应默认音区定位正确就能读取历史记忆。"],["放进同一个例子","主驾换人后，不能继续拿上一位驾驶员的“昨天游泳馆”。"],["异常与交接","无身份时可以问用户地点，或按允许的匿名能力处理；不能假装记忆已命中。"],["产品要问清","身份切换、多人同时说话、人脸未识别与临时换座，各自会影响什么字段？"]],"learn":["voice"],"refs":"A,B","detail":"把音区与可用身份信息关联。“来自主驾”不等于“已确认注册账号”，未知身份不能随意读取某人的历史记忆。","oldId":"V5","layout":{"title":["2.4 说话人与位置"],"body":["音区 + face/身份/座位信息","分清“我”是哪位乘员"],"detail":["把音区与可用身份信息关联。“来自主驾”不等于“已确认注册","账号”，未知身份不能随意读取某人的历史记忆。"],"height":319}},{"id":"V6","group":"voice","x":1090,"y":6041,"w":760,"h":390,"title":"2.5 判停与多输入处理","body":["VAD、续说、多人请求合并","先后次序与丢字会影响整条链"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","判断一句话是否说完，避免把正常停顿当结束。续说、多人发声与云端推理中的新输入，后续交给交互节奏管理分别处理。"],["原有职责细节","VAD、续说、多人请求合并；先后次序与丢字会影响整条链"],["这一步怎么做","输入接入要确定本轮说话什么时候结束，补充的半句话是续说还是新请求，并携带说话人、位置和时间。注册身份与座位不是同一个概念：位置影响车控对象，身份影响可读取谁的记忆。"],["放进同一个例子","“我”指当前说话人；降温要考虑其位置，查“昨天去过哪里”则需要关联其身份。不能拿后排乘员的经历替主驾作答。"],["异常与交接","用户边说边补“别开窗”，如果前半句已触发执行，就会出现时序问题。判停策略、已下发动作和取消能力要一起验收。"],["产品要问清","两人同时说话是合并、排序还是打断？每一轮在下游还能否保持原始归属？"],["这一步怎么做","尾延迟从用户实际结束说话到最终 Query 就绪计量。唤醒等待、判停等待、网络传输和模型首响应是不同段；只报一个总平均值，无法确定真正的慢点。"],["放进同一个例子","本例若“游泳馆”末尾被截掉，再快的 Planner 首 token 也没有意义。"],["异常与交接","质量与时延应在同一测试集上对照，避免用过早判停换取更快响应。"],["产品要问清","是否单独保留关键否定、地点、数值的识别准确性，以及 P50/P95 尾延迟？"]],"learn":["voice"],"refs":"A,B","detail":"判断一句话是否说完，避免把正常停顿当结束。续说、多人发声与云端推理中的新输入，后续交给交互节奏管理分别处理。","oldId":"V6","layout":{"title":["2.5 判停与多输入处理"],"body":["VAD、续说、多人请求合并","先后次序与丢字会影响整条链"],"detail":["判断一句话是否说完，避免把正常停顿当结束。续说、多人发声","与云端推理中的新输入，后续交给交互节奏管理分别处理。"],"height":319}},{"id":"V7","group":"voice","x":1090,"y":6569,"w":760,"h":390,"title":"2.6 封装本轮输入","body":["query / speaker_name / position","timestamp + 本轮会话关联"],"role":"step","tone":"green","future":false,"main":true,"kind":"step","paras":[["这个小模块做什么","将本轮文本、说话人、位置和时间交给后续入口。页面语音已消费的输入，要防止又作为普通请求重复执行。"],["原有职责细节","query / speaker_name / position；timestamp + 本轮会话关联"],["这一步怎么做","把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的明确请求。"],["放进同一个例子","交接内容可以理解为：主驾在此刻提出“降温＋去昨天的游泳馆”。具体字段名与运行版本对齐，不用示意字段冒充真实接口。"],["异常与交接","用户说“算了”或再次发声，可能是取消、改目标或仅打断播报。输入层记录新事实，业务层再决定影响哪些动作和等待任务。"],["产品要问清","能否还原原话、当前轮输入、历史记录三者？本轮关联是否在后续调用与反馈中保留？"]],"learn":["voice"],"refs":"A,B","detail":"将本轮文本、说话人、位置和时间交给后续入口。页面语音已消费的输入，要防止又作为普通请求重复执行。","oldId":"V7","layout":{"title":["2.6 封装本轮输入"],"body":["query / speaker_name / position","timestamp + 本轮会话关联"],"detail":["将本轮文本、说话人、位置和时间交给后续入口。页面语音已消","费的输入，要防止又作为普通请求重复执行。"],"height":319}},{"id":"V8","group":"voice","x":250,"y":6569,"w":760,"h":390,"title":"2.7 用户再次发声/打断","body":["可能澄清、改目标、撤销动作","判断是否取消任务是另一件事"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","用户再次发声可能只是补充，也可能改目标或要求取消。停止播报、终止一次调用和删除长期任务必须分开判断。"],["原有职责细节","可能澄清、改目标、撤销动作；判断是否取消任务是另一件事"],["这一步怎么做","把最终文本和必要的说话人、位置、时间等信息交给端云选路。这里的 Query 是本轮输入，不是整个历史；“关空调”即使上一轮说过，也仍然是新的明确请求。"],["放进同一个例子","交接内容可以理解为：主驾在此刻提出“降温＋去昨天的游泳馆”。具体字段名与运行版本对齐，不用示意字段冒充真实接口。"],["异常与交接","用户说“算了”或再次发声，可能是取消、改目标或仅打断播报。输入层记录新事实，业务层再决定影响哪些动作和等待任务。"],["产品要问清","能否还原原话、当前轮输入、历史记录三者？本轮关联是否在后续调用与反馈中保留？"],["这一步怎么做","新语音从 01 进入；与当前业务相关的点击事件可沿 U1 回 03。打断播报不自动取消已下发车控；取消一次执行也不自动删除长期任务，这些必须用业务状态区分。"],["放进同一个例子","用户说“先别去了”应影响导航目标，但是否保留已完成降温要按原意处理；用户仅把音量调低，不应让历史任务重新执行。"],["异常与交接","完整闭环最后还要记录失败与用户反馈，进入评测和改进。产品经理需要能追这一条链，而不是必须实现每个底层模型后才有资格判断好坏。"],["产品要问清","同一案例能否讲清成功标准、最早出错点、责任边界、改法和回归结果？"]],"learn":["voice"],"refs":"A,B","detail":"用户再次发声可能只是补充，也可能改目标或要求取消。停止播报、终止一次调用和删除长期任务必须分开判断。","oldId":"V8","layout":{"title":["2.7 用户再次发声/打断"],"body":["可能澄清、改目标、撤销动作","判断是否取消任务是另一件事"],"detail":["用户再次发声可能只是补充，也可能改目标或要求取消。停止播","报、终止一次调用和删除长期任务必须分开判断。"],"height":319}},{"id":"D1","group":"fast","x":250,"y":9435,"w":760,"h":390,"title":"5.1 端侧 FC 模型","body":["文本 → 本地可执行动作候选","补目标功能、位置与参数"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","端侧 FC 先理解简单本地指令并补齐对象、位置、数值。得到的是候选，不是已发生的车辆状态。"],["原有职责细节","文本 → 本地可执行动作候选；补目标功能、位置与参数"],["这一步怎么做","端侧函数调用模型（FC）把高频简单指令理解为本地能力可承接的动作。Director PRD 的基线是：命中白名单时优先端侧快速执行。白名单、车型能力和合法参数须一起满足。"],["放进同一个例子","“把主驾车窗关上”可能走快路；“十分钟后关车窗”包含未来条件，不能截掉时间后立即关窗。本例含历史地点依赖，应避免被整句当成简单车控。"],["异常与交接","端侧输出首先是候选。没命中白名单时，不能仅因本地先返回，就抢先执行云端还在判断的请求。"],["产品要问清","哪一份车型配置定义白名单？复杂请求误走快路后，是否已造成真实动作？"]],"learn":["fast"],"refs":"B","detail":"端侧 FC 先理解简单本地指令并补齐对象、位置、数值。得到的是候选，不是已发生的车辆状态。","oldId":"D1","layout":{"title":["5.1 端侧 FC 模型"],"body":["文本 → 本地可执行动作候选","补目标功能、位置与参数"],"detail":["端侧 FC 先理解简单本地指令并补齐对象、位置、数值。得到的","是候选，不是已发生的车辆状态。"],"height":319}},{"id":"D2","group":"fast","x":1090,"y":9435,"w":760,"h":390,"title":"6 命中快路白名单？","body":["高频简单车控 + 合法动作","命中时优先端侧快速执行"],"role":"decision","tone":"green","future":false,"main":true,"kind":"decision","paras":[["这个小模块做什么","命中当前车型快路白名单且动作合法，才允许快速处理。未命中白名单不等于端模型没有结果，也不等于立刻放弃云端。"],["原有职责细节","高频简单车控 + 合法动作；命中时优先端侧快速执行"],["这一步怎么做","端侧函数调用模型（FC）把高频简单指令理解为本地能力可承接的动作。Director PRD 的基线是：命中白名单时优先端侧快速执行。白名单、车型能力和合法参数须一起满足。"],["放进同一个例子","“把主驾车窗关上”可能走快路；“十分钟后关车窗”包含未来条件，不能截掉时间后立即关窗。本例含历史地点依赖，应避免被整句当成简单车控。"],["异常与交接","端侧输出首先是候选。没命中白名单时，不能仅因本地先返回，就抢先执行云端还在判断的请求。"],["产品要问清","哪一份车型配置定义白名单？复杂请求误走快路后，是否已造成真实动作？"]],"learn":["fast"],"refs":"B","detail":"命中当前车型快路白名单且动作合法，才允许快速处理。未命中白名单不等于端模型没有结果，也不等于立刻放弃云端。","oldId":"D2","layout":{"title":["6 命中快路白名单？"],"body":["高频简单车控 + 合法动作","命中时优先端侧快速执行"],"detail":["命中当前车型快路白名单且动作合法，才允许快速处理。未命中","白名单不等于端模型没有结果，也不等于立刻放弃云端。"],"height":319}},{"id":"D3","group":"fast","x":1090,"y":9963,"w":760,"h":390,"title":"6.1 未命中：等待云结果","body":["有端候选也不立即抢执行","云端拒识/FC/Planner 分流"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","保存端候选并等待云侧分流结果。等待期间仍要处理取消、状态变化与超时，不能让旧候选无限有效。"],["原有职责细节","有端候选也不立即抢执行；云端拒识/FC/Planner 分流"],["这一步怎么做","按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，需要运行日志证明。"],["放进同一个例子","本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。"],["异常与交接","端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能声称所有需要记忆或联网的能力仍能离线完成。"],["产品要问清","同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎样证明只执行一次？"]],"learn":["fast"],"refs":"B","detail":"保存端候选并等待云侧分流结果。等待期间仍要处理取消、状态变化与超时，不能让旧候选无限有效。","oldId":"D3","layout":{"title":["6.1 未命中：等待云结果"],"body":["有端候选也不立即抢执行","云端拒识/FC/Planner 分流"],"detail":["保存端候选并等待云侧分流结果。等待期间仍要处理取消、状态","变化与超时，不能让旧候选无限有效。"],"height":319}},{"id":"D4","group":"fast","x":250,"y":9963,"w":760,"h":390,"title":"6.2 端云最终仲裁","body":["只执行选定结果；抑制迟到重复","精确优先级/超时按车型核验"],"role":"decision","tone":"green","future":false,"kind":"decision","paras":[["这个小模块做什么","同一轮请求只选择一条结果获得执行权。端先完成、云后返回，以及云先执行、端超时回调，都要防双执行。"],["原有职责细节","只执行选定结果；抑制迟到重复；精确优先级/超时按车型核验"],["这一步怎么做","按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，需要运行日志证明。"],["放进同一个例子","本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。"],["异常与交接","端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能声称所有需要记忆或联网的能力仍能离线完成。"],["产品要问清","同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎样证明只执行一次？"]],"learn":["fast"],"refs":"B","detail":"同一轮请求只选择一条结果获得执行权。端先完成、云后返回，以及云先执行、端超时回调，都要防双执行。","oldId":"D4","layout":{"title":["6.2 端云最终仲裁"],"body":["只执行选定结果；抑制迟到重复","精确优先级/超时按车型核验"],"detail":["同一轮请求只选择一条结果获得执行权。端先完成、云后返回，","以及云先执行、端超时回调，都要防双执行。"],"height":319}},{"id":"D5","group":"fast","x":250,"y":10491,"w":760,"h":390,"title":"7.1 端候选能力检查","body":["功能支持、参数范围、车态","失败给明确原因"],"role":"decision","tone":"green","future":false,"kind":"decision","paras":[["这个小模块做什么","下发前核验本车型功能、参数范围和当前车态。车速、座位或设备限制不满足时，应返回具体不执行原因。"],["原有职责细节","功能支持、参数范围、车态；失败给明确原因"],["这一步怎么做","端侧函数调用模型（FC）把高频简单指令理解为本地能力可承接的动作。Director PRD 的基线是：命中白名单时优先端侧快速执行。白名单、车型能力和合法参数须一起满足。"],["放进同一个例子","“把主驾车窗关上”可能走快路；“十分钟后关车窗”包含未来条件，不能截掉时间后立即关窗。本例含历史地点依赖，应避免被整句当成简单车控。"],["异常与交接","端侧输出首先是候选。没命中白名单时，不能仅因本地先返回，就抢先执行云端还在判断的请求。"],["产品要问清","哪一份车型配置定义白名单？复杂请求误走快路后，是否已造成真实动作？"],["这一步怎么做","动作下发前，需要按各领域契约检查对象、取值、车态、用户权限和必要确认。这里是产品必须明确的边界，不代表已验证公司存在一个万能的统一校验服务。"],["放进同一个例子","主驾说“给副驾降温”，控制对象要明确；查记忆不能串到副驾身份。通讯、预订、记忆写入等会产生额外副作用，更不能把理解正确等同于获准提交。"],["异常与交接","非法参数、不支持功能、前置条件变化时，应拦截或请用户确认。是否由 Planner、调度层、Agent 或车端执行检查，要逐个工具说清。"],["产品要问清","谁拦非法动作？谁对接被拦后的可用替代方案？权限测试是否只测成功路径？"]],"learn":["fast"],"refs":"B","detail":"下发前核验本车型功能、参数范围和当前车态。车速、座位或设备限制不满足时，应返回具体不执行原因。","oldId":"D5","layout":{"title":["7.1 端候选能力检查"],"body":["功能支持、参数范围、车态","失败给明确原因"],"detail":["下发前核验本车型功能、参数范围和当前车态。车速、座位或设","备限制不满足时，应返回具体不执行原因。"],"height":319}},{"id":"D6","group":"fast","x":1090,"y":10491,"w":760,"h":390,"title":"7.2 原子动作送车端执行","body":["不需要每次经过云端 Planner","也应同步真实结果和状态"],"role":"step","tone":"green","future":false,"main":true,"kind":"step","paras":[["这个小模块做什么","将已获准的原子动作送入车端适配接口。该本地路径可以绕过云 Planner，但不能绕过实际结果确认。"],["原有职责细节","不需要每次经过云端 Planner；也应同步真实结果和状态"],["这一步怎么做","真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里才可能产生真实副作用。"],["放进同一个例子","车控接口让空调或风量发生变化；路线工具让正确目的地进入导航状态。这两条链各自成功，才有可能完成本例。"],["异常与交接","SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前车态改变、资源受限、服务不可用，都可能让先前合法计划失败。"],["产品要问清","回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功口径如何保守定义？"]],"learn":["fast"],"refs":"B","detail":"将已获准的原子动作送入车端适配接口。该本地路径可以绕过云 Planner，但不能绕过实际结果确认。","oldId":"D6","layout":{"title":["7.2 原子动作送车端执行"],"body":["不需要每次经过云端 Planner","也应同步真实结果和状态"],"detail":["将已获准的原子动作送入车端适配接口。该本地路径可以绕过云"," Planner，但不能绕过实际结果确认。"],"height":319}},{"id":"D7","group":"fast","x":1090,"y":11019,"w":760,"h":390,"title":"6.3 云无结果时端兜底","body":["端侧有有效候选 → 尝试执行","无候选 → 兜底反馈"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","在云侧无可用结果时评估端候选兜底。查询/普通控制与高副作用行为不能共用未经确认的重试策略。"],["原有职责细节","端侧有有效候选 → 尝试执行；无候选 → 兜底反馈"],["这一步怎么做","按 PRD，未命中端侧白名单时优先云结果；云端超时或无结果时，如端候选有效则可兜底，否则进入失败兜底。执行权的唯一性、迟到结果处理与幂等，需要运行日志证明。"],["放进同一个例子","本例选中复杂链后进入 03；快路选中合法动作时沿 F1 进入 06 的执行域，不必经过 Planner。这里画的是业务分流，不表示共用同一进程。"],["异常与交接","端侧已执行后云结果才到，不能再做一次；云端完全不可用时，也不能声称所有需要记忆或联网的能力仍能离线完成。"],["产品要问清","同一轮谁拥有执行权？端云双返回、迟到、断网恢复这三种情况下，怎样证明只执行一次？"]],"learn":["fast"],"refs":"B","detail":"在云侧无可用结果时评估端候选兜底。查询/普通控制与高副作用行为不能共用未经确认的重试策略。","oldId":"D7","layout":{"title":["6.3 云无结果时端兜底"],"body":["端侧有有效候选 → 尝试执行","无候选 → 兜底反馈"],"detail":["在云侧无可用结果时评估端候选兜底。查询/普通控制与高副作","用行为不能共用未经确认的重试策略。"],"height":319}},{"id":"D8","group":"fast","x":250,"y":11019,"w":760,"h":390,"title":"8 本地结果形成闭环","body":["动作生效 + 必要卡片/话术","不得只凭“模型理解了”报成功"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","接收本地执行结果，再生成必要话术、卡片与状态同步。听见“已打开”不是证明车窗真正变化的证据。"],["原有职责细节","动作生效 + 必要卡片/话术；不得只凭“模型理解了”报成功"],["这一步怎么做","工具把事实、候选、处理中、成功或失败等业务含义交回。对于车控，应把指令回执与真实车况分开；对于导航或订单，要核对业务状态，而不是只看 HTTP 或模型文本。"],["放进同一个例子","降温要核对空调/风量等目标变化；导航要核对目的地和导航状态。仅“调用成功”不足以支撑“两个目标都完成”。"],["异常与交接","下游无法提供真实状态时，要保留“不确定/已受理”等语义，并明确待补的回读契约，不能包装成已完成。"],["产品要问清","每种结果对应哪条日志或状态证据？用户说“根本没变”时，系统能定位到哪一跳？"],["这一步怎么做","Planner 的 talk_content 用于生成对话输出；查询、简单控制等场景不一定需要无意义的“我帮你查一下”。部分领域 Agent 也会自己播报，需要避免重复或抢话。"],["放进同一个例子","若地点仍在确认，可以先说明必要的下一步；若空调成功而导航失败，应明确部分结果。不能在动作尚未发生时用完成时态承诺。"],["异常与交接","话术要与本轮实际动作、失败和等待一致；安全或重要结果不能被普通过渡语覆盖。具体播报优先级按运行策略核验。"],["产品要问清","谁负责首响应，谁负责领域结果，谁负责总结？有没有重复播报和抢话测试？"]],"learn":["fast"],"refs":"B","detail":"接收本地执行结果，再生成必要话术、卡片与状态同步。听见“已打开”不是证明车窗真正变化的证据。","oldId":"D8","layout":{"title":["8 本地结果形成闭环"],"body":["动作生效 + 必要卡片/话术","不得只凭“模型理解了”报成功"],"detail":["接收本地执行结果，再生成必要话术、卡片与状态同步。听见“","已打开”不是证明车窗真正变化的证据。"],"height":319}},{"id":"S1","group":"signals","x":2290,"y":9435,"w":760,"h":390,"title":"3 车/人/应用信号","body":["车辆、导航、媒体、手动操作","事件与时间戳"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","采集车辆、应用与乘员相关信号，区分快照、变化与人工操作。真实事件来自产品定义的数据源，不由模型凭空产生。"],["原有职责细节","车辆、导航、媒体、手动操作；事件与时间戳"],["这一步怎么做","车辆信号、应用状态、用户操作、默认感知等在端侧形成状态与事件，再按协议上报云端并被 Context 使用。缓存表示已保存的已知事实，不是保证仍然最新的事实。"],["放进同一个例子","用户手动关了空调，应产生相应状态或事件；否则模型可能继续使用刚才“空调打开成功”的历史。"],["异常与交接","全量、增量、轮询和变化上报的使用范围需逐个信号确认。丢包、时钟差、乱序必须反映在新鲜度判断里。"],["产品要问清","每个关键字段来自哪里、多久更新、缺失怎么表达？云端如何知道值已经过期？"]],"learn":["signals"],"refs":"B,S06","detail":"采集车辆、应用与乘员相关信号，区分快照、变化与人工操作。真实事件来自产品定义的数据源，不由模型凭空产生。","oldId":"S1","layout":{"title":["3 车/人/应用信号"],"body":["车辆、导航、媒体、手动操作","事件与时间戳"],"detail":["采集车辆、应用与乘员相关信号，区分快照、变化与人工操作。","真实事件来自产品定义的数据源，不由模型凭空产生。"],"height":319}},{"id":"S2","group":"signals","x":3130,"y":9435,"w":760,"h":390,"title":"4 端侧信号库","body":["统一当前快照、增量更新","向 Context / 本地 Trigger 供给"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","维护端侧当前值、更新时间与缺失状态。给本地条件供数，也按协议上报云端；这不是历史事件仓库。"],["原有职责细节","统一当前快照、增量更新；向 Context / 本地 Trigger 供给"],["这一步怎么做","车辆信号、应用状态、用户操作、默认感知等在端侧形成状态与事件，再按协议上报云端并被 Context 使用。缓存表示已保存的已知事实，不是保证仍然最新的事实。"],["放进同一个例子","用户手动关了空调，应产生相应状态或事件；否则模型可能继续使用刚才“空调打开成功”的历史。"],["异常与交接","全量、增量、轮询和变化上报的使用范围需逐个信号确认。丢包、时钟差、乱序必须反映在新鲜度判断里。"],["产品要问清","每个关键字段来自哪里、多久更新、缺失怎么表达？云端如何知道值已经过期？"]],"learn":["signals"],"refs":"B,S06","detail":"维护端侧当前值、更新时间与缺失状态。给本地条件供数，也按协议上报云端；这不是历史事件仓库。","oldId":"S2","layout":{"title":["4 端侧信号库"],"body":["统一当前快照、增量更新","向 Context / 本地 Trigger 供给"],"detail":["维护端侧当前值、更新时间与缺失状态。给本地条件供数，也按","协议上报云端；这不是历史事件仓库。"],"height":319}},{"id":"S3","group":"signals","x":3130,"y":9963,"w":760,"h":390,"title":"25A 按需 VQA 采图","body":["用户视觉问题 → 选方向/对象","摄像头 → VLM 看图"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","按用户问题选择有效摄像头与方向，采集本次画面。用户所指对象不在视野中时，应明确限制，不能编造图像内容。"],["原有职责细节","用户视觉问题 → 选方向/对象；摄像头 → VLM 看图"],["这一步怎么做","用户提出视觉问题时，按请求方向采集对应画面，再由视觉能力回答可见内容。这是一次工具调用，结果回 07；不能把摄像头当互联网，也不能用它直接读取车机屏幕。"],["放进同一个例子","“外面那栋建筑是什么”需要正确方向与当前画面；若还要门票价格，应再查外部资料，不能从图像直接得出现价。"],["异常与交接","遮挡、错误视角、旧帧或画面不可见要明确表达。图像判断准确也不保证后续工具选择正确。"],["产品要问清","模型看的是哪一帧？用户所指对象真在视野里吗？时延里采图和推理分别占多少？"],["真实工具名","visual_qa"],["接到什么","方向/对象/视觉问题。"],["内部机制","按请求采集对应画面 → 视觉模型识别画面内容 → 需外部知识时再交网页搜索。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","不能直接读取车机屏幕内容；不能靠摄像头知道商品现价；画面范围/新鲜度影响回答。"],["用一个例子追","“看一下右边那是什么”。先确认右侧采图方向和当前帧，再识别可见内容；看不到就说明，不从互联网知识猜画面。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"learn":["signals"],"refs":"B,S06","detail":"按用户问题选择有效摄像头与方向，采集本次画面。用户所指对象不在视野中时，应明确限制，不能编造图像内容。","oldId":"S3","layout":{"title":["25A 按需 VQA 采图"],"body":["用户视觉问题 → 选方向/对象","摄像头 → VLM 看图"],"detail":["按用户问题选择有效摄像头与方向，采集本次画面。用户所指对","象不在视野中时，应明确限制，不能编造图像内容。"],"height":319}},{"id":"S4","group":"signals","x":2290,"y":9963,"w":760,"h":390,"title":"25A VQA 返回","body":["识别结果 → visual_qa 反馈","再回 Planner 回答用户"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","将图像观察作为本轮 visual_qa 的结果回给规划链。看见建筑不能直接得出实时票价，还需外部查询。"],["原有职责细节","识别结果 → visual_qa 反馈；再回 Planner 回答用户"],["这一步怎么做","用户提出视觉问题时，按请求方向采集对应画面，再由视觉能力回答可见内容。这是一次工具调用，结果回 07；不能把摄像头当互联网，也不能用它直接读取车机屏幕。"],["放进同一个例子","“外面那栋建筑是什么”需要正确方向与当前画面；若还要门票价格，应再查外部资料，不能从图像直接得出现价。"],["异常与交接","遮挡、错误视角、旧帧或画面不可见要明确表达。图像判断准确也不保证后续工具选择正确。"],["产品要问清","模型看的是哪一帧？用户所指对象真在视野里吗？时延里采图和推理分别占多少？"],["真实工具名","visual_qa"],["接到什么","方向/对象/视觉问题。"],["内部机制","按请求采集对应画面 → 视觉模型识别画面内容 → 需外部知识时再交网页搜索。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","不能直接读取车机屏幕内容；不能靠摄像头知道商品现价；画面范围/新鲜度影响回答。"],["用一个例子追","“看一下右边那是什么”。先确认右侧采图方向和当前帧，再识别可见内容；看不到就说明，不从互联网知识猜画面。"],["至少要拿到的证据","原始输入、领域解析、实际下游调用、业务结果与反馈关联；权限、幂等、超时和取消未写明的部分，需要逐项补契约。"]],"learn":["signals"],"refs":"B,S06","detail":"将图像观察作为本轮 visual_qa 的结果回给规划链。看见建筑不能直接得出实时票价，还需外部查询。","oldId":"S4","layout":{"title":["25A VQA 返回"],"body":["识别结果 → visual_qa 反馈","再回 Planner 回答用户"],"detail":["将图像观察作为本轮 visual_qa 的结果回给规划链。看见建筑","不能直接得出实时票价，还需外部查询。"],"height":319}},{"id":"S5","group":"signals","x":2290,"y":10491,"w":760,"h":390,"title":"25B 默认 AlwaysOn","body":["默认视觉观察 + OMS 标签","VLM → 端数据中心 → Context"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","默认 AlwaysOn 将已覆盖场景的观察/标签供状态和 Context。未观察到成立，不代表系统缺少该感知能力。"],["原有职责细节","默认视觉观察 + OMS 标签；VLM → 端数据中心 → Context"],["这一步怎么做","默认感知按已覆盖能力产生舱内外观察，经端数据中心等路径供 Context 使用。某次结果未达成，只说明当时没看到条件成立，不等于系统缺少这项观察能力。"],["放进同一个例子","默认能力已经能看某类舱内状态时，任务未命中应继续等默认观察；只有目标未覆盖时，才讨论额外专属观察。"],["异常与交接","开关、隐私、资源预算与结果新鲜度都影响能否使用。不能用一个“AlwaysOn 开了”代替具体能力覆盖表。"],["产品要问清","这是能力未覆盖，还是覆盖但当前未达成？证据来自哪份能力表和哪次观察？"],["这一步怎么做","默认视觉可提供此刻舱内外观察；用户记忆提供归属于某人的经历与偏好；事件日志记录交互和变化。不同资料对“现在”“过去”“长期偏好”的含义不同。"],["放进同一个例子","宝宝正在后排睡觉是当前观察；用户不喜欢直吹是偏好；昨天去某游泳馆是历史经历。三者可能共同影响这一次规划。"],["异常与交接","观察不可见、记忆查无结果、历史无记录，都不应被解释为“没有发生”或“用户没有这个偏好”。"],["产品要问清","模型的某句判断究竟用了哪类证据？是否把历史状态误当当前事实？"]],"learn":["signals"],"refs":"B,S06","detail":"默认 AlwaysOn 将已覆盖场景的观察/标签供状态和 Context。未观察到成立，不代表系统缺少该感知能力。","oldId":"S5","layout":{"title":["25B 默认 AlwaysOn"],"body":["默认视觉观察 + OMS 标签","VLM → 端数据中心 → Context"],"detail":["默认 AlwaysOn 将已覆盖场景的观察/标签供状态和 Context","。未观察到成立，不代表系统缺少该感知能力。"],"height":319}},{"id":"S6","group":"signals","x":3130,"y":10491,"w":760,"h":390,"title":"25C 动态观察任务","body":["Task 下发带 task_id 的观察","全量替换；最多 3 项"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","任务侧维护完整观察列表并带 task_id 下发；该协议最多三项。仅传观察问题，后续业务动作不塞给视觉模型。"],["原有职责细节","Task 下发带 task_id 的观察；全量替换；最多 3 项"],["这一步怎么做","动态感知协议由 Task Service 下发 task_id 与纯观察问题，采用全量列表替换，最多 3 项同时观察。动态结果走独立任务通道，不进入通用 Context；AlwaysOn 关闭时拒收新项并清空旧项。"],["放进同一个例子","“帮我盯着某个对象”是观察任务，不应把“看到后给我打电话”整段执行指令塞给视觉模型。动作由任务/业务层负责。"],["异常与交接","全量替换漏带旧项会使旧观察被移除；取消后结果迟到必须按 task_id 处理。3 项是并发观察限制，不是全部业务规则上限。"],["产品要问清","列表是谁维护的？关闭、取消、替换、超容量分别返回什么状态？"]],"learn":["signals"],"refs":"B,S06","detail":"任务侧维护完整观察列表并带 task_id 下发；该协议最多三项。仅传观察问题，后续业务动作不塞给视觉模型。","oldId":"S6","layout":{"title":["25C 动态观察任务"],"body":["Task 下发带 task_id 的观察","全量替换；最多 3 项"],"detail":["任务侧维护完整观察列表并带 task_id 下发；该协议最多三项","。仅传观察问题，后续业务动作不塞给视觉模型。"],"height":319}},{"id":"S7","group":"signals","x":3130,"y":11019,"w":760,"h":390,"title":"25C 单任务观察返回","body":["各 task 分开上报 → 云语义判断","不进入通用 Context"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","动态观察结果按 task_id 独立返回并交云端判断，不进入通用 Context；旧任务结果迟到时要核对任务是否仍有效。"],["原有职责细节","各 task 分开上报 → 云语义判断；不进入通用 Context"],["这一步怎么做","动态感知协议由 Task Service 下发 task_id 与纯观察问题，采用全量列表替换，最多 3 项同时观察。动态结果走独立任务通道，不进入通用 Context；AlwaysOn 关闭时拒收新项并清空旧项。"],["放进同一个例子","“帮我盯着某个对象”是观察任务，不应把“看到后给我打电话”整段执行指令塞给视觉模型。动作由任务/业务层负责。"],["异常与交接","全量替换漏带旧项会使旧观察被移除；取消后结果迟到必须按 task_id 处理。3 项是并发观察限制，不是全部业务规则上限。"],["产品要问清","列表是谁维护的？关闭、取消、替换、超容量分别返回什么状态？"],["这一步怎么做","结构条件读相应事实求值；动态视觉结果还需要按协议进行云端语义 Y/N 判断，再形成条件事件。命中后要处理冷却、去重、范围和有效期，最后回调任务或 Advisor，不能直接宣称动作成功。"],["放进同一个例子","看到目标对象只是观察结果；业务认定条件满足后，才能唤醒未取消的任务，再进入实际执行。"],["异常与交接","规则误判、视觉误判、端侧资源不足和时序问题必须分开。6–7 秒等文档时延目标不是已经达成的实测，更不能统一写成固定 3/5 秒。"],["产品要问清","误触发、漏触发、重复触发和命中到动作时延，各自的真值与测量点在哪里？"]],"learn":["signals"],"refs":"B,S06","detail":"动态观察结果按 task_id 独立返回并交云端判断，不进入通用 Context；旧任务结果迟到时要核对任务是否仍有效。","oldId":"S7","layout":{"title":["25C 单任务观察返回"],"body":["各 task 分开上报 → 云语义判断","不进入通用 Context"],"detail":["动态观察结果按 task_id 独立返回并交云端判断，不进入通用"," Context；旧任务结果迟到时要核对任务是否仍有效。"],"height":319}},{"id":"S8","group":"signals","x":2290,"y":11019,"w":760,"h":390,"title":"25C AlwaysOn 关闭","body":["拒绝新观察；下发 [] 清空","反馈任务不可用并停止观察"],"role":"step","tone":"red","future":false,"kind":"step","paras":[["这个小模块做什么","AlwaysOn 关闭时拒收新观察并清理旧列表。任务方需得知能力不可用，不能继续对用户承诺持续观察。"],["原有职责细节","拒绝新观察；下发 [] 清空；反馈任务不可用并停止观察"],["这一步怎么做","动态感知协议由 Task Service 下发 task_id 与纯观察问题，采用全量列表替换，最多 3 项同时观察。动态结果走独立任务通道，不进入通用 Context；AlwaysOn 关闭时拒收新项并清空旧项。"],["放进同一个例子","“帮我盯着某个对象”是观察任务，不应把“看到后给我打电话”整段执行指令塞给视觉模型。动作由任务/业务层负责。"],["异常与交接","全量替换漏带旧项会使旧观察被移除；取消后结果迟到必须按 task_id 处理。3 项是并发观察限制，不是全部业务规则上限。"],["产品要问清","列表是谁维护的？关闭、取消、替换、超容量分别返回什么状态？"]],"learn":["signals"],"refs":"B,S06","detail":"AlwaysOn 关闭时拒收新观察并清理旧列表。任务方需得知能力不可用，不能继续对用户承诺持续观察。","oldId":"S8","layout":{"title":["25C AlwaysOn 关闭"],"body":["拒绝新观察；下发 [] 清空","反馈任务不可用并停止观察"],"detail":["AlwaysOn 关闭时拒收新观察并清理旧列表。任务方需得知能力","不可用，不能继续对用户承诺持续观察。"],"height":319}},{"id":"E1","group":"end-trigger","x":14530,"y":9435,"w":760,"h":390,"title":"24.1 本地配置仓库","body":["云同步规则、版本与适用范围","离线使用已生效配置"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","保存已校验并生效的端侧规则版本，支持范围内离线运行。服务器已发布不等于本车已拿到。"],["原有职责细节","云同步规则、版本与适用范围；离线使用已生效配置"],["这一步怎么做","配置侧需定义适用范围、信号、条件和动作，再下发端侧。端侧必须确认规则能被感知和执行；云端发布成功不能代替车端已获取、校验并生效。"],["放进同一个例子","系统预设“某车况满足后建议处理”时，先明确车型、信号单位、枚举与动作范围。"],["异常与交接","非法配置、能力缺失、版本未生效，应反馈具体失败，而非永远显示“等待中”。"],["产品要问清","规则版本在哪能读到？由谁负责场景方案、谁配置、谁提供实车验收？"]],"learn":["end-trigger"],"refs":"B,S06","detail":"保存已校验并生效的端侧规则版本，支持范围内离线运行。服务器已发布不等于本车已拿到。","oldId":"E1","layout":{"title":["24.1 本地配置仓库"],"body":["云同步规则、版本与适用范围","离线使用已生效配置"],"detail":["保存已校验并生效的端侧规则版本，支持范围内离线运行。服务","器已发布不等于本车已拿到。"],"height":319}},{"id":"E2","group":"end-trigger","x":15370,"y":9435,"w":760,"h":390,"title":"24.2 订阅索引","body":["事件变化 → 找相关规则","信号来源统一接入信号库"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","通过信号变化找到相关规则，减少无关计算。定时采快照与变化上报唤醒的职责必须分开。"],["原有职责细节","事件变化 → 找相关规则；信号来源统一接入信号库"],["这一步怎么做","变化上报用于唤醒相关规则；定时轮询用于提供快照。条件求值需要明确读哪个时刻的状态，并处理多个条件组合、持续时间和抖动，不能只看一个变化事件就认定全部满足。"],["放进同一个例子","车门打开事件可以唤醒规则，但是否主驾在座、车辆是否驻车，还要读对应事实。"],["异常与交接","未达成不是能力未覆盖。暂时不满足应继续等待；根本观测不到才是能力或配置问题。"],["产品要问清","事件发生、采集、缓存更新与求值的时间先后能否完整还原？"]],"learn":["end-trigger"],"refs":"B,S06","detail":"通过信号变化找到相关规则，减少无关计算。定时采快照与变化上报唤醒的职责必须分开。","oldId":"E2","layout":{"title":["24.2 订阅索引"],"body":["事件变化 → 找相关规则","信号来源统一接入信号库"],"detail":["通过信号变化找到相关规则，减少无关计算。定时采快照与变化","上报唤醒的职责必须分开。"],"height":319}},{"id":"E3","group":"end-trigger","x":15370,"y":9963,"w":760,"h":390,"title":"24.3 当前状态聚合","body":["读取本地最新信号快照","避免拼出不同时刻的假条件"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","读取条件涉及的当前状态和时间；多字段必须处理缺失、过期和时序差，避免拼出一个从未真实存在的场景。"],["原有职责细节","读取本地最新信号快照；避免拼出不同时刻的假条件"],["这一步怎么做","变化上报用于唤醒相关规则；定时轮询用于提供快照。条件求值需要明确读哪个时刻的状态，并处理多个条件组合、持续时间和抖动，不能只看一个变化事件就认定全部满足。"],["放进同一个例子","车门打开事件可以唤醒规则，但是否主驾在座、车辆是否驻车，还要读对应事实。"],["异常与交接","未达成不是能力未覆盖。暂时不满足应继续等待；根本观测不到才是能力或配置问题。"],["产品要问清","事件发生、采集、缓存更新与求值的时间先后能否完整还原？"],["这一步怎么做","车辆信号、应用状态、用户操作、默认感知等在端侧形成状态与事件，再按协议上报云端并被 Context 使用。缓存表示已保存的已知事实，不是保证仍然最新的事实。"],["放进同一个例子","用户手动关了空调，应产生相应状态或事件；否则模型可能继续使用刚才“空调打开成功”的历史。"],["异常与交接","全量、增量、轮询和变化上报的使用范围需逐个信号确认。丢包、时钟差、乱序必须反映在新鲜度判断里。"],["产品要问清","每个关键字段来自哪里、多久更新、缺失怎么表达？云端如何知道值已经过期？"]],"learn":["end-trigger"],"refs":"B,S06","detail":"读取条件涉及的当前状态和时间；多字段必须处理缺失、过期和时序差，避免拼出一个从未真实存在的场景。","oldId":"E3","layout":{"title":["24.3 当前状态聚合"],"body":["读取本地最新信号快照","避免拼出不同时刻的假条件"],"detail":["读取条件涉及的当前状态和时间；多字段必须处理缺失、过期和","时序差，避免拼出一个从未真实存在的场景。"],"height":319}},{"id":"E4","group":"end-trigger","x":14530,"y":9963,"w":760,"h":390,"title":"24.4 规则表达式求值","body":["结构化规则 → true / false","具体运行时/资源限制需核验"],"rol 排除另外三类？"],["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"]],"learn":["end-trigger"],"refs":"B,S06","detail":"记录命中、执行、失败和真实状态，再按协议同步上云。只有命中日志而没有执行结果，不能计为任务成功。","oldId":"E8","layout":{"title":["24.8 结果与日志"],"body":["端侧状态反馈、规则执行记录","结果上云链路覆盖需核验"],"detail":["记录命中、执行、失败和真实状态，再按协议同步上云。只有命","中日志而没有执行结果，不能计为任务成功。"],"height":319}},{"id":"O1","group":"execution","x":12490,"y":4985,"w":760,"h":390,"title":"28.1 执行适配入口","body":["FC 或工具下发的业务指令","车型 SDK / 应用 / 系统接口"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","将获准的业务动作转交对应车型、应用或云服务执行。云 Planner、端 FC 和本地触发器可以从不同入口到这里。"],["原有职责细节","FC 或工具下发的业务指令；车型 SDK / 应用 / 系统接口"],["这一步怎么做","真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里才可能产生真实副作用。"],["放进同一个例子","车控接口让空调或风量发生变化；路线工具让正确目的地进入导航状态。这两条链各自成功，才有可能完成本例。"],["异常与交接","SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前车态改变、资源受限、服务不可用，都可能让先前合法计划失败。"],["产品要问清","回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功口径如何保守定义？"]],"learn":["output"],"refs":"B,S12","detail":"将获准的业务动作转交对应车型、应用或云服务执行。云 Planner、端 FC 和本地触发器可以从不同入口到这里。","oldId":"O1","layout":{"title":["28.1 执行适配入口"],"body":["FC 或工具下发的业务指令","车型 SDK / 应用 / 系统接口"],"detail":["将获准的业务动作转交对应车型、应用或云服务执行。云 Plan","ner、端 FC 和本地触发器可以从不同入口到这里。"],"height":319}},{"id":"O2","group":"execution","x":13330,"y":4985,"w":760,"h":390,"title":"28.2 真实业务动作","body":["空调 / 车窗 / 导航 / 媒体","设备/服务实际发生变化"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","实际改变空调、导航、媒体或外部业务状态。这里才产生用户关心的行为效果，与页面动画不是同一事件。"],["原有职责细节","空调 / 车窗 / 导航 / 媒体；设备/服务实际发生变化"],["这一步怎么做","真正改变车辆、导航、媒体、订单或记忆状态的，是对应执行域和适配能力。车控要遵守具体车型支持范围；外部服务执行要遵守账号与业务约束。这里才可能产生真实副作用。"],["放进同一个例子","车控接口让空调或风量发生变化；路线工具让正确目的地进入导航状态。这两条链各自成功，才有可能完成本例。"],["异常与交接","SDK 返回“已接收”只证明收到命令，不证明物理设备已变化。执行前车态改变、资源受限、服务不可用，都可能让先前合法计划失败。"],["产品要问清","回执到物理生效间隔多久？支持回读的状态是什么？没有回读时，成功口径如何保守定义？"]],"learn":["output"],"refs":"B,S12","detail":"实际改变空调、导航、媒体或外部业务状态。这里才产生用户关心的行为效果，与页面动画不是同一事件。","oldId":"O2","layout":{"title":["28.2 真实业务动作"],"body":["空调 / 车窗 / 导航 / 媒体","设备/服务实际发生变化"],"detail":["实际改变空调、导航、媒体或外部业务状态。这里才产生用户关","心的行为效果，与页面动画不是同一事件。"],"height":319}},{"id":"O3","group":"execution","x":13330,"y":5513,"w":760,"h":390,"title":"28.3 回执与状态核对","body":["受理 ACK、执行结果、实际状态","按来源回云工具或本地闭环","回读覆盖与失败判定需核验"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","核对受理回执、业务结果与适用的状态回读。按来源回云工具或本地链；回读覆盖不足的能力要单独标明证据边界。"],["原有职责细节","受理 ACK、执行结果、实际状态；按来源回云工具或本地闭环；回读覆盖与失败判定需核验"],["这一步怎么做","工具把事实、候选、处理中、成功或失败等业务含义交回。对于车控，应把指令回执与真实车况分开；对于导航或订单，要核对业务状态，而不是只看 HTTP 或模型文本。"],["放进同一个例子","降温要核对空调/风量等目标变化；导航要核对目的地和导航状态。仅“调用成功”不足以支撑“两个目标都完成”。"],["异常与交接","下游无法提供真实状态时，要保留“不确定/已受理”等语义，并明确待补的回读契约，不能包装成已完成。"],["产品要问清","每种结果对应哪条日志或状态证据？用户说“根本没变”时，系统能定位到哪一跳？"]],"learn":["output"],"refs":"B,S12","detail":"核对受理回执、业务结果与适用的状态回读。按来源回云工具或本地链；回读覆盖不足的能力要单独标明证据边界。","oldId":"O3","layout":{"title":["28.3 回执与状态核对"],"body":["受理 ACK、执行结果、实际状态","按来源回云工具或本地闭环","回读覆盖与失败判定需核验"],"detail":["核对受理回执、业务结果与适用的状态回读。按来源回云工具或","本地链；回读覆盖不足的能力要单独标明证据边界。"],"height":355}},{"id":"O4","group":"output","x":14530,"y":4985,"w":760,"h":390,"title":"26.1 话术与播报","body":["Planner talk_content → TTS","部分下游自己播报，须去重"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","根据确定状态生成并播放适当话术；区分首字、首播和播放完成。领域工具也可能播报，需要避免两处重复说。"],["原有职责细节","Planner talk_content → TTS；部分下游自己播报，须去重"],["这一步怎么做","Planner 的 talk_content 用于生成对话输出；查询、简单控制等场景不一定需要无意义的“我帮你查一下”。部分领域 Agent 也会自己播报，需要避免重复或抢话。"],["放进同一个例子","若地点仍在确认，可以先说明必要的下一步；若空调成功而导航失败，应明确部分结果。不能在动作尚未发生时用完成时态承诺。"],["异常与交接","话术要与本轮实际动作、失败和等待一致；安全或重要结果不能被普通过渡语覆盖。具体播报优先级按运行策略核验。"],["产品要问清","谁负责首响应，谁负责领域结果，谁负责总结？有没有重复播报和抢话测试？"],["这一步怎么做","文字转语音（TTS）让用户听见；卡片展示候选、进度或业务结果；虚拟形象可以配合情绪表达。车控执行是 06 的独立业务链，不需要等形象播完才必然发生。"],["放进同一个例子","可以一边完成降温，一边展示路线候选；用户看见卡片与真实导航启动是不同的两个事件。avatar 或动画不能充当“车控成功”的证明。"],["异常与交接","卡片请求被受理不等于已经显示：可能排队、被覆盖、过期或不在前台。首播、首卡片、首动作、最终完成要分开记时。"],["产品要问清","显示成功在哪个回执里？UI 动效、工具成功和真实车况是否被错误地共用一个成功字段？"]],"learn":["output"],"refs":"B,S12","detail":"根据确定状态生成并播放适当话术；区分首字、首播和播放完成。领域工具也可能播报，需要避免两处重复说。","oldId":"O4","layout":{"title":["26.1 话术与播报"],"body":["Planner talk_content → TTS","部分下游自己播报，须去重"],"detail":["根据确定状态生成并播放适当话术；区分首字、首播和播放完成","。领域工具也可能播报，需要避免两处重复说。"],"height":319}},{"id":"O5","group":"output","x":15370,"y":4985,"w":760,"h":390,"title":"26.2 卡片/屏幕反馈","body":["候选、进度、实际显示与失败","模板卡片；生成界面按方案 / 车型"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","用模板或生成界面展示候选、进度与结果。页面被请求、排队、实际显示、被覆盖和关闭是不同状态。"],["原有职责细节","动作状态、候选、进度与失败；手点结果必须回流上下文"],["这一步怎么做","文字转语音（TTS）让用户听见；卡片展示候选、进度或业务结果；虚拟形象可以配合情绪表达。车控执行是 06 的独立业务链，不需要等形象播完才必然发生。"],["放进同一个例子","可以一边完成降温，一边展示路线候选；用户看见卡片与真实导航启动是不同的两个事件。avatar 或动画不能充当“车控成功”的证明。"],["异常与交接","卡片请求被受理不等于已经显示：可能排队、被覆盖、过期或不在前台。首播、首卡片、首动作、最终完成要分开记时。"],["产品要问清","显示成功在哪个回执里？UI 动效、工具成功和真实车况是否被错误地共用一个成功字段？"]],"learn":["output"],"refs":"B,S12","detail":"用模板或生成界面展示候选、进度与结果。页面被请求、排队、实际显示、被覆盖和关闭是不同状态。","oldId":"O5","layout":{"title":["26.2 卡片/屏幕反馈"],"body":["候选、进度、实际显示与失败","模板卡片；生成界面按方案 / 车型"],"detail":["用模板或生成界面展示候选、进度与结果。页面被请求、排队、","实际显示、被覆盖和关闭是不同状态。"],"height":319}},{"id":"O6","group":"output","x":15370,"y":5513,"w":760,"h":390,"title":"27 数字人/形象反馈","body":["表情、动作、音区/屏幕协同","数字人不是所有车控必经节点"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","按表达指令协调数字人、机器人或灯效。它们是交互通道，不是所有车控必须先经过的执行器。"],["原有职责细节","表情、动作、音区/屏幕协同；数字人不是所有车控必经节点"],["这一步怎么做","文字转语音（TTS）让用户听见；卡片展示候选、进度或业务结果；虚拟形象可以配合情绪表达。车控执行是 06 的独立业务链，不需要等形象播完才必然发生。"],["放进同一个例子","可以一边完成降温，一边展示路线候选；用户看见卡片与真实导航启动是不同的两个事件。avatar 或动画不能充当“车控成功”的证明。"],["异常与交接","卡片请求被受理不等于已经显示：可能排队、被覆盖、过期或不在前台。首播、首卡片、首动作、最终完成要分开记时。"],["产品要问清","显示成功在哪个回执里？UI 动效、工具成功和真实车况是否被错误地共用一个成功字段？"]],"learn":["output"],"refs":"B,S12","detail":"按表达指令协调数字人、机器人或灯效。它们是交互通道，不是所有车控必须先经过的执行器。","oldId":"O6","layout":{"title":["27 数字人/形象反馈"],"body":["表情、动作、音区/屏幕协同","数字人不是所有车控必经节点"],"detail":["按表达指令协调数字人、机器人或灯效。它们是交互通道，不是","所有车控必须先经过的执行器。"],"height":319}},{"id":"O7","group":"output","x":14530,"y":5513,"w":760,"h":390,"title":"23.1 任务中心视图","body":["待办 / 进行中 / 任务记录","业务方状态驱动 UI，UI 不编排"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","从真实 TaskView 或业务状态构建任务中心。前端展示等待/运行/记录，不能凭卡片点击自行宣布任务关闭。"],["原有职责细节","待办 / 进行中 / 任务记录；业务方状态驱动 UI，UI 不编排"],["这一步怎么做","任务中心应消费任务/运行状态与消息，而不是自己凭卡片展示就宣布完成。新 Task 设计通过持久化 Binding 与 recommend_id 恢复关联；客户端交互回正确 Task/Run 后再继续。"],["放进同一个例子","用户确认提醒卡片后，要恢复原任务；如果此时任务已取消或条件已失效，不能仅因为按钮还可点就重新执行。"],["异常与交接","发送消息、卡片展示、用户确认、动作生效和任务关闭必须分别核对。当前车型具体支持修改还是仅删除，需按实际接入范围确认。"],["产品要问清","界面“已完成”与后端 Run、工具结果是否一致？取消后旧卡片还能否触发动作？"]],"learn":["output"],"refs":"B,S12","detail":"从真实 TaskView 或业务状态构建任务中心。前端展示等待/运行/记录，不能凭卡片点击自行宣布任务关闭。","oldId":"O7","layout":{"title":["23.1 任务中心视图"],"body":["待办 / 进行中 / 任务记录","业务方状态驱动 UI，UI 不编排"],"detail":["从真实 TaskView 或业务状态构建任务中心。前端展示等待/运","行/记录，不能凭卡片点击自行宣布任务关闭。"],"height":319}},{"id":"O8","group":"output","x":14530,"y":6041,"w":760,"h":390,"title":"23.2 任务中心操作","body":["操作事件回业务方或 Task","取消/删除能力按版本；不混状态"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么","把接受、取消、查询等交回正确任务或业务。删除记录、取消当前执行和取消长期任务不是同一个操作。"],["原有职责细节","操作事件回业务方或 Task；取消/删除能力按版本；不混状态"],["这一步怎么做","任务中心应消费任务/运行状态与消息，而不是自己凭卡片展示就宣布完成。新 Task 设计通过持久化 Binding 与 recommend_id 恢复关联；客户端交互回正确 Task/Run 后再继续。"],["放进同一个例子","用户确认提醒卡片后，要恢复原任务；如果此时任务已取消或条件已失效，不能仅因为按钮还可点就重新执行。"],["异常与交接","发送消息、卡片展示、用户确认、动作生效和任务关闭必须分别核对。当前车型具体支持修改还是仅删除，需按实际接入范围确认。"],["产品要问清","界面“已完成”与后端 Run、工具结果是否一致？取消后旧卡片还能否触发动作？"]],"learn":["output"],"refs":"B,S12","detail":"把接受、取消、查询等交回正确任务或业务。删除记录、取消当前执行和取消长期任务不是同一个操作。","oldId":"O8","layout":{"title":["23.2 任务中心操作"],"body":["操作事件回业务方或 Task","取消/删除能力按版本；不混状态"],"detail":["把接受、取消、查询等交回正确任务或业务。删除记录、取消当","前执行和取消长期任务不是同一个操作。"],"height":319}},{"id":"O9","group":"output","x":15370,"y":6041,"w":760,"h":390,"title":"29 用户获得真实结果","body":["听到、看到、实际状态一致","未完成部分清楚告知"],"role":"step","tone":"green","future":false,"main":true,"kind":"step","paras":[["这个小模块做什么","用户听见、看见以及业务实际发生的事情应一致。部分成功要说明剩余目标，等待时要说明在等什么。"],["原有职责细节","听到、看到、实际状态一致；未完成部分清楚告知"],["这一步怎么做","根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。"],["放进同一个例子","如果降温成功但地点没找到，就说清已处理降温、地点仍需确认；不能说“都安排好了”。如果两者都生效，才给完成反馈。"],["异常与交接","业务结果与用户满意度还需分开：导航已正确开始不等于用户对路线满意；空调参数变化也不等于用户已经感到舒适。"],["产品要问清","系统每一次“已完成”是否都有证据？假完成率的分母必须是宣称完成的请求。"],["这一步怎么做","Planner 的 talk_content 用于生成对话输出；查询、简单控制等场景不一定需要无意义的“我帮你查一下”。部分领域 Agent 也会自己播报，需要避免重复或抢话。"],["放进同一个例子","若地点仍在确认，可以先说明必要的下一步；若空调成功而导航失败，应明确部分结果。不能在动作尚未发生时用完成时态承诺。"],["异常与交接","话术要与本轮实际动作、失败和等待一致；安全或重要结果不能被普通过渡语覆盖。具体播报优先级按运行策略核验。"],["产品要问清","谁负责首响应，谁负责领域结果，谁负责总结？有没有重复播报和抢话测试？"]],"learn":["output"],"refs":"B,S12","detail":"用户听见、看见以及业务实际发生的事情应一致。部分成功要说明剩余目标，等待时要说明在等什么。","oldId":"O9","layout":{"title":["29 用户获得真实结果"],"body":["听到、看到、实际状态一致","未完成部分清楚告知"],"detail":["用户听见、看见以及业务实际发生的事情应一致。部分成功要说","明剩余目标，等待时要说明在等什么。"],"height":319}},{"id":"O10","group":"output","x":15370,"y":6569,"w":760,"h":390,"title":"29.1 完成判定","body":["“受理成功”≠“操作已生效”","“一个动作成功”≠“整个目标完成”"],"role":"decision","tone":"green","future":false,"kind":"check","paras":[["这个小模块做什么","分别确认每个动作与完整目标是否完成。“调用成功”不能替代“导航已启动”，“已启动导航”也不能替代“到达目的地”。"],["原有职责细节","“受理成功”≠“操作已生效”；“一个动作成功”≠“整个目标完成”"],["这一步怎么做","根据实际结果判断全部完成、部分完成、等待或失败，再进入 08。任务的评价标准应是完整目标真实达成且没有禁止动作，而非输出 JSON 合法或话术听起来合理。"],["放进同一个例子","如果降温成功但地点没找到，就说清已处理降温、地点仍需确认；不能说“都安排好了”。如果两者都生效，才给完成反馈。"],["异常与交接","业务结果与用户满意度还需分开：导航已正确开始不等于用户对路线满意；空调参数变化也不等于用户已经感到舒适。"],["产品要问清","系统每一次“已完成”是否都有证据？假完成率的分母必须是宣称完成的请求。"]],"learn":["output"],"refs":"B,S12","detail":"分别确认每个动作与完整目标是否完成。“调用成功”不能替代“导航已启动”，“已启动导航”也不能替代“到达目的地”。","oldId":"O10","layout":{"title":["29.1 完成判定"],"body":["“受理成功”≠“操作已生效”","“一个动作成功”≠“整个目标完成”"],"detail":["分别确认每个动作与完整目标是否完成。“调用成功”不能替代","“导航已启动”，“已启动导航”也不能替代“到达目的地”。"],"height":319}},{"id":"O11","group":"output","x":14530,"y":6569,"w":760,"h":390,"title":"29.2 用户追问或改主意","body":["重新入语音/交互入口","带已完成动作与未完目标"],"role":"step","tone":"green","future":false,"kind":"step","paras":[["这个小模块做什么" ],["内部机制","缺姓名/座位需先补齐 → 发起对应位置的注册流程 → 同意与生物信息门禁待核。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","注册状态回报而非口头默认；不把临时称呼当注册完成；失败需明确后续怎么做。"],["用一个例子追","“记住我叫小王”。姓名表达不自动证明人脸已注册；补齐必要姓名与座位，实际完成注册流程后才能回报成功。"],["真实工具名","user_memory_operate"],["接到什么","用户身份+需保存/修正事实。"],["内部机制","明确且归属正确的事实/偏好 → 不确定先澄清 → 用户更正要处理旧错误记录。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","注册前后行为依契约核验；记录成功与检索命中分开验收；写入/修改字段口径须统一。"],["用一个例子追","“记住我不喜欢风直吹”。确定事实归属与写入意图，再保存或修正旧记录；写入成功、下次可检索、不会串人需分别验证。"],["这一步怎么做","默认视觉可提供此刻舱内外观察；用户记忆提供归属于某人的经历与偏好；事件日志记录交互和变化。不同资料对“现在”“过去”“长期偏好”的含义不同。"],["放进同一个例子","宝宝正在后排睡觉是当前观察；用户不喜欢直吹是偏好；昨天去某游泳馆是历史经历。三者可能共同影响这一次规划。"],["异常与交接","观察不可见、记忆查无结果、历史无记录，都不应被解释为“没有发生”或“用户没有这个偏好”。"],["产品要问清","模型的某句判断究竟用了哪类证据？是否把历史状态误当当前事实？"]],"learn":["family-3"],"refs":"A,B,S09,S10,S12","future":false,"detail":"","oldId":"M3","layout":{"title":["记忆不是“放进上下文就都知道了”"],"body":["① 先确定是谁：音区、座位、人脸注册身份不能随意混用。","② 本轮需要什么：只读相关事实，不默认把所有历史带入。","③ 是否有证据：昨天去过的地点与用户喜欢的地点不同。","④ 信息是否有效：用户已更正的旧偏好不得盖过新事实。","⑤ 是否能写：隐式推断与用户明确要求保存要区分。","⑥ 如何验收：写入成功 → 下一次可检索 → 不串用户 → 更正能生效。","这些边界影响体验与数据隔离，但不要求产品经理实现向量数据库。"],"detail":[],"height":401}},{"id":"OUT3","group":"family-3","x":8320,"y":16236,"w":2230,"h":220,"title":"返回统一反馈入口","body":["成功 / 失败 / 候选待选 / 处理中；保留调用关系"],"role":"step","tone":"green","titleSize":21,"size":18,"kind":"step","paras":[["这个小模块做什么","成功 / 失败 / 候选待选 / 处理中；保留调用关系"],["原有职责细节","成功 / 失败 / 候选待选 / 处理中；保留调用关系"],["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"]],"learn":["family-3"],"refs":"A,B,S09,S10,S12","future":false,"detail":"","oldId":"OUT3","layout":{"title":["返回统一反馈入口"],"body":["成功 / 失败 / 候选待选 / 处理中；保留调用关系"],"detail":[],"height":185}},{"id":"IN4","group":"family-4","x":11010,"y":13435,"w":2230,"h":220,"title":"工具选择入口","body":["只有 action_list 选中本项时，才进入该行"],"role": 么","与本车有关的养护问题。"],["内部机制","按车辆/VIN相关信息回答 → 偏长期养护、用车知识 → 不替代实时异常状态诊断。这些是当前定义能支持的业务步骤；具体模型、服务与 SDK 的分工仍需实现证据。"],["结果与边界","车辆归属与资料范围需正确；建议与已完成服务分开；不能用知识回答假装修好了。"],["用一个例子追","“我的车什么时候该保养”。结合本车相关资料与养护知识；建议已给出不等于保养已预约或服务已完成。"]],"learn":["family-4"],"refs":"本地 SP 快照","future":false,"detail":"","oldId":"M4","layout":{"title":["三个看似都在“问车”的工具，事实来源不同"],"body":["vehicle_status_search：现在车怎么样 → 实时信号。","vehicle_manual_qa：这个功能怎么用 → 车型说明知识。","car_log：此前发生过什么 → 行车历史记录。","car_care_qa：本车养护问题 → 车辆相关长期资料。","产品经理要能解释为什么路由到它；不是背四个英文名字。"],"detail":[],"height":329}},{"id":"OUT4","group":"family-4","x":11010,"y":16814,"w":2230,"h":220,"title":"返回统一反馈入口","body":["成功 / 失败 / 候选待选 / 处理中；保留调用关系"],"role":"step","tone":"green","titleSize":21,"size":18,"kind":"step","paras":[["这个小模块做什么","成功 / 失败 / 候选待选 / 处理中；保留调用关系"],["原有职责细节","成功 / 失败 / 候选待选 / 处理中；保留调用关系"],["这一步怎么做","tool_feedback 表示工具返回的结果，不是新的用户命令。接入侧应保留原目标关系，再交 Context 和 Planner。结果反序到达、重复到达或取消后才到达，需要单独处理。"],["放进同一个例子","先回来的可能是空调成功，后回的是游泳馆地址。系统必须知道两个结果属于同一句 Query 的不同子目标，不能因一个成功就关闭全部。"],["异常与交接","当前 SP 展示的反馈只有工具名与文本；完整关联、结构化状态码、可重试标记等是待核契约，不能用示例证明线上完备。"],["产品要问清","这条反馈来自哪次调用？为什么不会与同名旧调用串在一起？"]],"learn":["family-4"],"refs":"本地 SP 快照","future":false,"detail":"","oldId":"OUT4","layout":{"title":["返回统一反馈入口"],"body":["成功 / 失败 / 候选待选 / 处理中；保留调用关系"],"detail":[],"height":185}},{"id":"IN5","group":"family-5","x":13700,"y":13435,"w":2230,"h":220,"title":"工具选择入口","body":["只有 action_list 选中本项时，才进入该行"],"role":"step","tone":"blue","titleSize":21,"size":18,"kind":"step","paras":[["这个小模块做什么","只有 action_list 选中本项时，才进入该行"],["原有职责细节","只有 action_list 选中本项时，才进入该行"],["这一步怎么做","调用侧需要找到工具名、参数格式和对应能力。定义数、实际注入数、后端可用数不是同一个数。当前本地 SP 可去重数出 27 项，下面逐项列出；新 Task 接口不混算成第 28 个线上工具。"],["放进同一个例子","查记忆使用 user_memory_search；历史地址确定后使用 route_planning。不能因为示例出现过某名字，就假设当前注册表一定存在这个工具。"],["异常与交接","SP 中还存在旧工具名和参数口径差异。工具未注册、字段不合规、车型不支持，应有可解释失败，而不是静默丢弃。"],["产品要问清","能否导出指定车型×环境×版本真正注入的工具定义，并与执行端注册表逐项对齐？"]],"learn":["family-5"],"refs":"本地 SP 快照,S05,S08","future":false,"detail":"","oldId":"IN5","lay
