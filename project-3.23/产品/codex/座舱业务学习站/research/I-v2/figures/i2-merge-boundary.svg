<svg xmlns="http://www.w3.org/2000/svg" class="v56-figure" id="i2-merge-boundary" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="i2-merge-boundary-title i2-merge-boundary-desc">
<title id="i2-merge-boundary-title">新话何时合并，何时算打断</title><desc id="i2-merge-boundary-desc">首 token 是早期分界；现行以语音起播为打断分界，合并还需回复未完整输出。</desc>
<style>
svg.v56-figure{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;background:var(--v56-bg,#fff)}
.v56-title{font-size:24px;font-weight:650;fill:var(--ink,#20354a)}
.v56-subtitle{font-size:14px;font-weight:400;fill:var(--muted,#617487)}
.v56-node-title{font-size:16px;font-weight:650;fill:var(--ink,#20354a)}
.v56-node-sub{font-size:14px;font-weight:400;fill:var(--body,#30465a)}
.v56-label{font-size:14px;font-weight:650;fill:var(--muted,#617487)}
.v56-local{fill:var(--blue-soft,#eaf2fc);stroke:var(--blue,#245ca6)}
.v56-cloud{fill:var(--teal-soft,#eef7f4);stroke:var(--teal,#1d756e)}
.v56-decision{fill:var(--amber-soft,#fff7e9);stroke:var(--amber,#865b1a)}
.v56-neutral{fill:var(--soft,#f5f8fa);stroke:var(--quiet,#8291a0)}
.v56-reject{fill:var(--red-soft,#fff3f3);stroke:var(--red,#9c4148)}
.v56-arrow{fill:none;stroke:var(--muted,#617487);stroke-width:1.8;stroke-linejoin:round}
.v56-rule{fill:none;stroke:var(--line,#dce4eb);stroke-width:1.2}
.v56-pending{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){svg.v56-figure{--v56-bg:#17212d;--ink:#e6edf5;--body:#cbd8e6;--muted:#a7b9cc;--quiet:#8195ab;--line:#415367;--soft:#243446;--blue:#8bb8ef;--blue-soft:#203951;--teal:#82c9b4;--teal-soft:#203d39;--amber:#ddbc7b;--amber-soft:#453c29;--red:#eba2a8;--red-soft:#482e38}}
</style>
<defs><marker id="i2-merge-boundary-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="v56-arrow" fill="none"/></marker></defs>
<text class="v56-title" x="32" y="44" text-anchor="start">新话何时合并，何时算打断</text>
<text class="v56-subtitle" x="32" y="72" text-anchor="start">首 token 是早期分界；现行以语音起播为打断分界，合并还需回复未完整输出。</text>
<text class="v56-label" x="32" y="125" text-anchor="start">早期：以首 token 为界</text>
<text class="v56-node-title" x="238" y="180" text-anchor="middle">合并重推</text>
<text class="v56-node-title" x="800" y="180" text-anchor="middle">打断</text>
<path class="v56-arrow v56-local" d="M 48 200 L 445 200" fill="none" style="stroke:var(--blue,#245ca6)" marker-end="url(#i2-merge-boundary-arr)"/>
<path class="v56-arrow v56-decision" d="M 445 200 L 1168 200" fill="none" style="stroke:var(--amber,#865b1a)" marker-end="url(#i2-merge-boundary-arr)"/>
<text class="v56-label" x="445" y="245" text-anchor="middle">早期边界（首 token）</text>
<text class="v56-label" x="1065" y="245" text-anchor="middle">现行边界（起播）</text>
<path class="v56-arrow v56-pending" d="M 445 254 L 445 275" fill="none"/>
<path class="v56-arrow v56-pending" d="M 445 410 L 445 440" fill="none"/>
<path class="v56-arrow v56-pending" d="M 445 484 L 445 513" fill="none"/>
<path class="v56-arrow" d="M 1065 254 L 1065 275" fill="none"/>
<path class="v56-arrow" d="M 1065 410 L 1065 513" fill="none"/>
<g data-node="true" data-key="0">
<rect class="v56-neutral" x="32" y="288" width="206" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="46" y="315" text-anchor="start">开始推理</text>
<text class="v56-node-sub" x="46" y="340" text-anchor="start">Planner 开始算旧请求</text>
</g>
<path class="v56-arrow" d="M 135 374 L 135 396" fill="none"/>
<g data-node="true" data-key="1">
<rect class="v56-neutral" x="342" y="288" width="206" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="356" y="315" text-anchor="start">首 token</text>
<text class="v56-node-sub" x="356" y="340" text-anchor="start">Planner 输出第一个字</text>
</g>
<path class="v56-arrow" d="M 445 374 L 445 396" fill="none"/>
<g data-node="true" data-key="2">
<rect class="v56-neutral" x="652" y="288" width="206" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="666" y="315" text-anchor="start">完整输出</text>
<text class="v56-node-sub" x="666" y="340" text-anchor="start">旧回复文字全部生成</text>
</g>
<path class="v56-arrow" d="M 755 374 L 755 396" fill="none"/>
<g data-node="true" data-key="3">
<rect class="v56-neutral" x="962" y="288" width="206" height="86" rx="8" stroke-width="1.6"/>
<text class="v56-node-title" x="976" y="315" text-anchor="start">语音起播</text>
<text class="v56-node-sub" x="976" y="340" text-anchor="start">用户开始听到旧回复</text>
</g>
<path class="v56-arrow" d="M 1065 374 L 1065 396" fill="none"/>
<path class="v56-arrow" d="M 48 396 L 1168 396" fill="none" marker-end="url(#i2-merge-boundary-arr)"/>
<text class="v56-label" x="32" y="439" text-anchor="start">现行</text>
<text class="v56-node-sub" x="380" y="467" text-anchor="middle">合并重推：回复还没完整输出，语音也没起播</text>
<text class="v56-node-sub" x="912" y="456" text-anchor="middle">已完整输出</text>
<text class="v56-node-sub" x="912" y="477" text-anchor="middle">语音尚未起播</text>
<text class="v56-node-title" x="1120" y="467" text-anchor="middle">打断</text>
<path class="v56-arrow v56-local" d="M 48 495 L 755 495" fill="none" style="stroke:var(--blue,#245ca6)" marker-end="url(#i2-merge-boundary-arr)"/>
<path class="v56-rule" d="M 755 495 L 1065 495" fill="none"/>
<path class="v56-arrow v56-decision" d="M 1065 495 L 1168 495" fill="none" style="stroke:var(--amber,#865b1a)" marker-end="url(#i2-merge-boundary-arr)"/>
<text class="v56-subtitle" x="32" y="555" text-anchor="start">灰色区间只标状态：两项合并条件需同时满足，不能只看“还没起播”。</text>
<text class="v56-subtitle" x="32" y="584" text-anchor="start">边界放宽的收益：晚一点开口也有机会合并；代价：旧推理可能更多次作废，增加计算开销。</text>
<rect class="v56-local" x="32" y="638" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="60" y="652" text-anchor="start">蓝：合并后重新推理</text>
<rect class="v56-decision" x="332" y="638" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="360" y="652" text-anchor="start">黄：新话按打断处理</text>
<rect class="v56-neutral" x="632" y="638" width="18" height="18" rx="8" stroke-width="1.6"/>
<text class="v56-subtitle" x="660" y="652" text-anchor="start">灰：输出与播放状态</text>
<path class="v56-arrow v56-pending" d="M 32 690 L 90 690" fill="none"/>
<text class="v56-subtitle" x="104" y="695" text-anchor="start">虚线：早期边界</text>
<path class="v56-arrow" d="M 332 690 L 390 690" fill="none"/>
<text class="v56-subtitle" x="404" y="695" text-anchor="start">实线：现行边界</text>
</svg>
