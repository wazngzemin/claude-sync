<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2580" viewBox="0 0 1800 2580">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" fill="#42617D"/></marker></defs>
<rect width="1800" height="2580" fill="#FFFFFF"/>
<text x="70" y="65" font-size="38" fill="#1B3144" text-anchor="start" font-weight="700"><tspan x="70" dy="0">任务创建与注册：先确认等待什么，再确认登记成功</tspan></text>
<text x="70" y="113" font-size="24" fill="#1B3144" text-anchor="start" font-weight="400"><tspan x="70" dy="0">纯定时进入弋途；车态条件由动态 Advisor 向豆包触发器注册。</tspan></text>
<rect x="55" y="153" width="530" height="2240" rx="16" fill="#F3F7FB"/>
<text x="320" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">用户 / Planner</tspan></text>
<rect x="635" y="153" width="530" height="2240" rx="16" fill="#F1F7F4"/>
<text x="900" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="900" dy="0">动态 Advisor：解析与协调</tspan></text>
<rect x="1215" y="153" width="530" height="2240" rx="16" fill="#FBF6EC"/>
<text x="1480" y="195" font-size="27" fill="#1B3144" text-anchor="middle" font-weight="700"><tspan x="1480" dy="0">登记能力 / 任务中心</tspan></text>
