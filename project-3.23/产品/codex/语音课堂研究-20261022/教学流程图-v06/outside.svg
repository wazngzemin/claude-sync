<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 595" width="980" height="595" role="img" aria-label="车外入口：先看能否启用，再看身份与指令" class="teaching-svg"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="980" height="595" rx="14" fill="#f5f8f6"/><defs><marker id="f-arrow-outside" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c8d84"/></marker></defs><text x="30" y="32" font-size="22" font-weight="700" fill="#183c36">车外入口：先看能否启用，再看身份与指令</text><text x="30" y="58" font-size="13" fill="#5f7169">施工中历史原图复述 · 尚未补齐正文四项必要条件</text><g transform="translate(0,78)"><path class="flow-edge" data-from="gate" data-to="audio" d="M280,84.0 L370,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outside)"/><path class="flow-edge" data-from="gate" data-to="off" d="M160.0,130 L160.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outside)"/><path class="flow-edge" data-from="audio" data-to="voice" d="M610,84.0 L700,84.0" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outside)"/><path class="flow-edge" data-from="voice" data-to="fail" d="M820.0,130 L820.0,214" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outside)"/><path class="flow-edge" data-from="fail" data-to="lock" d="M820.0,306 L820.0,390" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outside)"/><path class="flow-edge" data-from="voice" data-to="command" d="M760,130 L760,168 L650,168 L650,436 L610,436" fill="none" stroke="#6c958b" stroke-width="2" marker-end="url(#f-arrow-outside)"/><text x="325.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">满足图示条件</text><text x="169.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">不满足</text><text x="655.0" y="75.0" text-anchor="middle" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">开启仅声纹唤醒</text><text x="829.0" y="176.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">失败</text><text x="829.0" y="352.0" text-anchor="start" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">达到旧图阈值</text><text x="638" y="355" text-anchor="end" font-size="12" fill="#526c62" paint-order="stroke" stroke="#f5f8f6" stroke-width="6" stroke-linejoin="round">成功</text><g class="flow-point" data-point="gate" role="button" tabindex="0" aria-label="已解锁 或 数字钥匙近场"><rect x="40" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="54" y="59" font-size="11" fill="#bb8932">判断</text><text x="54" y="85" font-weight="700" font-size="16" fill="#203f35">已解锁 或 数字钥匙近场</text><text x="54" y="110" font-size="12" fill="#587266">旧图数字钥匙3米内</text></g><g class="flow-point" data-point="audio" role="button" tabindex="0" aria-label="开始采音与声学处理"><rect x="370" y="38" width="240" height="92" rx="13" fill="#ffffff" stroke="#86ada7" stroke-width="1.5"/><text x="384" y="59" font-size="11" fill="#86ada7">处理</text><text x="384" y="85" font-weight="700" font-size="16" fill="#203f35">开始采音与声学处理</text><text x="384" y="110" font-size="12" fill="#587266">车外噪声与覆盖另验</text></g><g class="flow-point" data-point="voice" role="button" tabindex="0" aria-label="按开关校验声纹"><rect x="700" y="38" width="240" height="92" rx="13" fill="#fff5dc" stroke="#bb8932" stroke-width="1.5"/><text x="714" y="59" font-size="11" fill="#bb8932">判断</text><text x="714" y="85" font-weight="700" font-size="16" fill="#203f35">按开关校验声纹</text><text x="714" y="110" font-size="12" fill="#587266">开启仅声纹唤醒时</text></g><g class="flow-point" data-point="off" role="button" tabindex="0" aria-label="不启用该入口"><rect x="40" y="214" width="240" height="92" rx="13" fill="#fcece6" stroke="#bb7560" stroke-width="1.5"/><text x="54" y="235" font-size="11" fill="#bb7560">分支</text><text x="54" y="261" font-weight="700" font-size="16" fill="#203f35">不启用该入口</text><text x="54" y="286" font-size="12" fill="#587266">未满足图示门槛</text></g><g class="flow-point" data-point="fail" role="button" tabindex="0" aria-label="校验失败：提示原因"><rect x="700" y="214" width="240" height="92" rx="13" fill="#fcece6" stroke="#bb7560" stroke-width="1.5"/><text x="714" y="235" font-size="11" fill="#bb7560">分支</text><text x="714" y="261" font-weight="700" font-size="16" fill="#203f35">校验失败：提示原因</text><text x="714" y="286" font-size="12" fill="#587266">声纹不匹配，按图提示注册</text></g><g class="flow-point" data-point="lock" role="button" tabindex="0" aria-label="连续失败进入暂锁"><rect x="700" y="390" width="240" height="92" rx="13" fill="#fcece6" stroke="#bb7560" stroke-width="1.5"/><text x="714" y="411" font-size="11" fill="#bb7560">分支</text><text x="714" y="437" font-weight="700" font-size="16" fill="#203f35">连续失败进入暂锁</text><text x="714" y="462" font-size="12" fill="#587266">3分钟10次，锁5分钟并告警</text></g><g class="flow-point" data-point="command" role="button" tabindex="0" aria-label="成功唤醒后接指令"><rect x="370" y="390" width="240" height="92" rx="13" fill="#e4f4eb" stroke="#36835f" stroke-width="1.5"/><text x="384" y="411" font-size="11" fill="#36835f">结果</text><text x="384" y="437" font-weight="700" font-size="16" fill="#203f35">成功唤醒后接指令</text><text x="384" y="462" font-size="12" fill="#587266">车控或查询，再下发反馈</text></g></g></svg>